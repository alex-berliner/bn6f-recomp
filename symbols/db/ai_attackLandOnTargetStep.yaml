name: ai_attackLandOnTargetStep
address: '0x080F695C'
kind: function
status: probable
summary: 'AI attack step: when the step timer expires, moves the attack object onto its target panel and
  flags it as hitting with an element-dependent value.'
interface: (r5 = battle object, r7 = oAIAttackVars state) -> void; sets oAIAttackVars_HitElement to 0xC
  or 0x14
details: Each call decrements oAIAttackVars_StepTimer and returns while it's still positive. On expiry
  it sets the object's current anim to 0, copies oAIAttackVars_TargetPanelX/Y into oBattleObject_PanelX/Y,
  then recomputes pixel coordinates, syncs collision panels/facing, and resets the collider to a grounded
  default. If oAIAttackVars_TimerOrCycles is zero it also calls sub_80F73CA (unknown, likely spawning
  a hit effect/state) and stores 0xC in HitElement, otherwise it stores 0x14. The timer/step counter is
  not reset here, so a later state must restart or clear it.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrh r0,[r7,#oAIAttackVars_StepTimer]; sub r0,#1; bgt locret — gated by a countdown before
    acting; strb target panel X/Y into oBattleObject_PanelX/Y then object_setCoordinatesFromPanels + object_updateCollisionPanels
    — teleports the attack to its target panel; battle_initGroundedCollider — puts the object back into
    the default grounded collision state; tst TimerOrCycles; strh #0xc vs #0x14 into oAIAttackVars_HitElement
    — variant flag picks between two hit values; mov r0,#0; strb r0,[r5,#oBattleObject_CurAnim] — resets
    animation on landing'
  refs:
  - bn6f/asm/asm31.s:134948
  - 0x080F7154 battle_initGroundedCollider
  - 0x0800E29C object_setCoordinatesFromPanels
  - 0x0801A04C object_updateCollisionPanels
  reproduce: python3 tools/asmcat.py 0x080F695C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-235109'
open_questions:
- What sub_80F73CA does (likely effect spawn or next-state switch on the TimerOrCycles==0 path)
- What hit values 0xC and 0x14 mean in oAIAttackVars_HitElement, and which attack(s) use this step — no
  callers are known, so the owning AI routine is unidentified
