name: battle_aiAttackWindupTick_80FE284
address: '0x080FE284'
kind: function
status: confirmed
summary: Ticks an enemy AI's attack wind-up state machine, starting a 30-frame wind-up and then flagging the attack
  to fire.
interface: void battle_aiAttackWindupTick(BattleObject *obj /*r5*/, AIAttackVars *vars /*r7*/); returns r0 and NZCV
  flags per the original's last flag-setting op (garbage value, do not use)
details: 'Operates on two structures: the battle object at r5 (only oBattleObject_CurAnim is touched)

  and the AI attack vars block at r7, using its fields Unk_00 (state/command), Unk_01

  (phase flag) and Unk_10 (frame countdown).

  If Unk_01 is 0 (not yet winding up): sets Unk_01 = 4 to enter the wind-up phase, resets the

  object''s current animation to 0 (idle/default pose), and loads Unk_10 = 0x1E (30 frames).

  If Unk_01 is nonzero (winding up): decrements Unk_10 each call; while the result is still

  positive it does nothing more. When the countdown reaches zero, it stores Unk_00 = 8, the

  value that tells the rest of the AI state machine to actually perform the attack.

  Quirks: on the expiring tick the stored value is the wrapped (remaining-1) result of a

  halfword subtraction, so Unk_10 ends at 0xFFFF; also on that first entry tick the phase

  check uses the stale Unk_01, so the countdown effectively runs 31 frames total. The

  function returns the intermediate decrement value in r0 and leaves NZCV from whatever

  instruction last set flags — callers apparently ignore both.

  '
