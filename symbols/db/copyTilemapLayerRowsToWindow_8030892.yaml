name: copyTilemapLayerRowsToWindow_8030892
address: '0x08030892'
kind: function
status: confirmed
summary: Copy one tilemap layer's 32 rows into the window, filling the rows that fall off the map with tile 0.
interface: 'static void copy_layer_rows(u32 layer_data, u32 layer, u32 map_width, u32 map_height, u32 window_x,
  u32 window_y); adapter: in r0/r1 = layer data / layer, r2/r3 = map width / height, r8/r9 = window origin; out
  Z set (cmp 32, 32), r4-r7 restored; r0-r3 and lr keep the last row call''s leftovers'
details: Only the row's map y is bounds-checked (0 <= map_y < map height); the row's map x enters the tilemap row
  pointer unclamped, as in the original. On-map rows go to sub_80018E0 (32 entries from row_start at window entry
  (window_x & 31, (window_y + row) & 31), r5 = the row counter); off-map rows go to call_sub_3005EBA (r0 = 0, r3
  = tile 0, r5 = 1). r6-r9 (layer, layer data, window origin) are set once before the row loop; the callees preserve
  them.
