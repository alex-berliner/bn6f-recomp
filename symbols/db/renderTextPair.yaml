name: renderTextPair
address: '0x081199E4'
kind: function
status: probable
summary: Renders two text scripts (via the text-gfx toolkit) into RAM tile buffers and publishes them
  to VRAM, storing render state on a caller-provided struct.
interface: (r5 = state struct [byte +4 flag; result slots +0x10/+0x14/+0x18], r6 = context struct [halfword
  +0x1c = glyph index]) -> r0 = renderer result of 2nd call; writes [r5+0x10]=0, [r5+0x14]=result, [r5+0x18]=0
details: Calls renderTextGfx_8045F8C twice. First call uses eTextScript201D280 rendered into buffer byte_201B200
  / VRAM 0x600B800 with glyph index 0xa, or the index in [r6+0x1c] when byte [r5+4] is nonzero. Second
  call uses TextScript873EA50 into byte_201B480 / VRAM 0x600BA80, always with index [r6+0x1c]. Both calls
  pass r4=0xa (probably tile/row count), r5=1 (flag), r6=dword_86A5D60 (font/palette table), r7=0. The
  two buffer pairs (0x201B200/0x201B480, 0x600B800/0x600BA80) are 0x280 apart, i.e. two adjacent 20-tile
  text blocks. r5 and r6 are preserved via push/pop since they are caller state.
