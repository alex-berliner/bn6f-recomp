name: ai_attackDurationTick
address: '0x080F3E0A'
kind: function
status: probable
summary: 'Per-frame AI attack timer: on first call latches element 4 and copies the attack duration into
  the step timer; afterwards counts the timer down and tears the attack state down when it expires.'
interface: (r7 = battle object with oAIAttackVars fields) -> mutates object's oAIAttackVars fields; no
  return value
details: 'Runs on an object whose AI attack vars live at r7. If oAIAttackVars_AttackElement is 0, it is
  treated as uninitialized: the function writes 4 to AttackElement (some default/none element) and copies
  oAIAttackVars_AttackDuration into oAIAttackVars_StepTimer, arming the countdown. Once armed, each call
  decrements StepTimer; when it reaches zero, it calls object_exitAttackState_801171C, which clears the
  AI attack scratch, chip lockout, AI flags, and power-attack state. So this implements a fixed-duration
  attack state driven by AttackDuration.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement] / tst + bne: init-vs-tick branch on element field;
    strb r0,#4 to AttackElement and strh of AttackDuration into StepTimer arm the timer; ldrh StepTimer
    / sub #1 / bgt: plain countdown loop; bl object_exitAttackState_801171C when StepTimer hits 0 tears
    down the attack state'
