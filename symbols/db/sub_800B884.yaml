name: sub_800B884
address: '0x0800B884'
kind: function
status: hypothesis
summary: Resolves an address from an object passed in r0 and writes the caller's byte value at offset +1, likely
  a one-byte field setter for some game entity/object.
interface: u32 sub_800B884(void* object /*r0*/, u8 value /*r1*/); returns r0 = resolved address from sub_800BF5C,
  r1 preserved, flags = whatever sub_800BF5C leaves
details: 'A tiny two-step helper: it saves the caller''s byte argument (r1) on the stack, calls sub_800BF5C with
  r0 passed through unchanged, and then stores the saved byte with strb at [result + 1]. So sub_800BF5C behaves
  as an address resolver (object/pointer -> base address) and this function is a byte-write into field offset 1
  of whatever it resolves. The resolved address is also returned in r0, so callers can chain further accesses off
  the same base. r1 is explicitly preserved across the call, and no other registers are touched. Without knowing
  what kind of object r0 points at (battle entity, NPC, sprite actor, etc.) or what field offset 1 holds, the game-level
  meaning of the byte cannot be pinned down yet; offset 1 in many MMBN object layouts is a state/flag byte, but
  that is speculation here.

  '
