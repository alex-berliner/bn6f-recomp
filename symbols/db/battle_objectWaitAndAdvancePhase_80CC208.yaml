name: battle_objectWaitAndAdvancePhase_80CC208
address: '0x080CC208'
kind: function
status: confirmed
summary: Runs a 120-frame phase timer on a battle object; when it expires (or a Param4==2 skip flag is set) the
  object advances to its next action.
interface: void sub_80CC208(battleobject_t *obj /* r5 */, u32 passthru /* r1, in/out */); out r1 = 4 when the timer
  is freshly armed, otherwise the caller's r1 passes through; NZCV clobbered
details: "Generic battle-object phase timing helper called with the object in r5 (and lr\nused as the return address,\
  \ so it is reached via BL). Behavior on the object\n(oBattleObject_*) fields:\n- If Param4 == 2 (some skip/override\
  \ flag set by other code), the wait is\n  bypassed: Param4 is cleared to 0, CurAction is set to 8, and\n  CurPhaseAndPhaseInitialized\
  \ is reset to 0, i.e. the object immediately\n  transitions to action 8 at phase 0.\n- Otherwise this is the standard\
  \ timed wait. On the first call\n  (PhaseInitialized == 0) it arms the timer: PhaseInitialized = 4, Timer =\n\
  \  0x78 (120 frames), and returns r1 = 4 to the caller (the only path where\n  the outgoing r1 differs from the\
  \ incoming value).\n- Every call then decrements Timer (stored back as a halfword). While it is\n  still > 0 the\
  \ object keeps waiting with no state change. When the count\n  reaches zero (or wraps, since the compare uses\
  \ the full 32-bit register:\n  decrementing 0 gives 0xFFFFFFFF which fails the > 0 test), CurAction = 4\n  and\
  \ CurPhaseAndPhaseInitialized = 0 are written, sending the object to\n  action 4 with a fresh phase.\nQuirk: the\
  \ zero-wrap path means a Timer already at 0 also fires immediately\non the next call; the timer value is only\
  \ meaningful as a 16-bit halfword.\nThe meaning of \"action 4\"/\"action 8\" and the Param4==2 flag is set elsewhere;\n\
  this routine only performs the wait-and-advance bookkeeping.\n"
