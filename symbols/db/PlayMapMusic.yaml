name: PlayMapMusic
address: '0x08036E78'
kind: function
status: confirmed
summary: Starts playback of the music track assigned to the current map/cutscene state.
interface: void PlayMapMusic(void)
details: 'Reads the toolkit''s pointer (r10 = toolkit) to the S2001c04 map/cutscene state struct, loads the byte
  at offset oS2001c04_MapMusic, and calls PlayMusic with that track number. Only r0 is used as scratch besides the
  call; r1-r7 and r10 are preserved. Effectively a thin wrapper so callers can (re)start the map''s background music
  without knowing the current track.

  '
