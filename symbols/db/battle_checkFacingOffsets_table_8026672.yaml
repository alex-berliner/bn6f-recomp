name: battle_checkFacingOffsets_table_8026672
address: '0x08026672'
kind: function
status: confirmed
summary: Thin wrapper that runs battle_checkFacingOffsets on the fixed facing-offset table baked into ROM at byte_802676E.
interface: void sub_8026672(u32 r4 /*context*/, u32 r5, u32 r6, u32 r7); returns r0/r1 from battle_checkFacingOffsets
  (r5 also passes through whatever the callee left in it)
details: 'Two-instruction thunk: it loads the address of byte_802676E (a byte table baked into the

  code stream near the end of this function''s listing region) into r0 and tail-calls

  battle_checkFacingOffsets, popping {pc} so the callee returns directly to this function''s

  caller. The caller''s r4-r7 are passed through untouched; only r0 (the table pointer) is

  set. battle_checkFacingOffsets presumably uses r0 as the offset table plus the r4-r7

  context (likely battle actor/panel data) and reports a facing-related result in r0/r1.

  Because this is a tail call, flags are whatever the callee leaves behind, and r5 is not

  deliberately preserved by this wrapper — it just reflects the callee''s value.

  '
