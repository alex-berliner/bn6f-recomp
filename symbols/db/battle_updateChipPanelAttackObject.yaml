    across the field; tick 0x14: PlaySoundEffect(0x85) (mov #0x86; add #0xff); Timer2 decrement, bge skip;
    negative -> strh #0xc, [r5,#oBattleObject_CurPhaseAndPhaseInitialized]; Timer lsr #3 carry-gated call
