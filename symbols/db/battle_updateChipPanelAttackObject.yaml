name: battle_updateChipPanelAttackObject
address: '0x080D79AC'
kind: function
status: probable
summary: 'Per-frame update for a battle-object chip attack: on Timer2==8 spawns a type-2 collision region
  and calls sub_801BD3C (damage 0x32, flag 0x10, alliance^DirectionFlip); on Timer2==0x14 plays sound
  0x185; highlights panels on 7-of-8 frames via Timer bit-3 skip; sets phase to 0xC when Timer2 goes negative.'
interface: (r5 = battle object ptr, no args) -> void; sets oBattleObject_CurPhaseAndPhaseInitialized to
  0xC when the countdown expires
details: Runs off the object's oBattleObject_Timer2 countdown. On tick 8 it spawns a collision region
  (type 2) on the object's own panel and calls sub_801BD3C with the panel X/Y, damage 0x32 (50), flag
  0x10, and alliance XORed with DirectionFlip — i.e. it strikes panels on the opposite side of the field.
  On tick 0x14 (20) it plays sound effect 0x85. Each tick it decrements Timer2, and once it goes negative
  sets the object's phase field to 0xC (teardown). Additionally, every 8 frames (Timer bit 3) it calls
  highlightPanelIfSomeCondition_8109660 with mode 0x10 to flash the affected panels.
