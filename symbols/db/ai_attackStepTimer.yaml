name: ai_attackStepTimer
address: '0x080F1BF4'
kind: function
status: probable
summary: 'Per-frame step for an AI attack: on first call initializes AttackElement=4, CurAnim=7, StepTimer=20;
  each call decrements StepTimer and when it reaches zero clears CurAnim and calls object_exitAttackState.'
interface: (r0 = ? unused, r7 = AI attack vars block, r5 = battle object) -> r0 = clobbered; no meaningful
  return
details: Reads oAIAttackVars_AttackElement from the r7 AI-attack struct; if it is zero the attack hasn't
  started, so it stores element 4, sets oBattleObject_CurAnim (r5) to 7, and initializes oAIAttackVars_StepTimer
  to 0x14 (20 frames). On subsequent frames it decrements StepTimer each call and returns while it's still
  positive. When the timer hits zero it stores 0 back into AttackElement... wait, it clears oBattleObject_CurAnim
  to 0 and tail-calls object_exitAttackState to leave the attack state. The element-4 value identifies
  which attack this is, but no caller is known so the owning enemy is unidentified.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne branches between arming and countdown paths;
    stores element 4, anim 7 (oBattleObject_CurAnim) and timer 0x14 on first entry; decrements oAIAttackVars_StepTimer
    and loops back while bgt holds; bl object_exitAttackState after resetting CurAnim to 0 confirms it
    is an AI attack-state handler; only field writes touch oAIAttackVars_* (r7) and oBattleObject_CurAnim
    (r5)
