name: sub_801FE5E
address: '0x0801FE5E'
kind: function
status: hypothesis
summary: Trivial getter that returns the first byte (u8) of the global struct at 0x203F7D8, also leaving the struct's
  address in r3.
interface: void -> u8 (r0 = byte at eStruct203F7D8, r3 = address of eStruct203F7D8); clobbers nothing else, uses
  no flags
details: Loads the address of the single global struct eStruct203F7D8 (0x203F7D8) into r3, then reads its first
  byte with ldrb and returns it in r0. r3 is preserved-through-return as a side effect, so callers apparently get
  both the value and a pointer to the struct in one call. No flags are read or written. The struct's meaning (player
  data, battle state, menu state, etc.) is not yet identified, so the game-level purpose of this byte is unknown.
