summary: 'Proposed name: BandedTilemapBufferA. EWRAM destination buffer that decomposeTileBlock fills
  with the de-interleaved tile-ID half, then gfx_fillAllBandedTilemaps writes out as a 32x32 banded BG2
  tilemap. (table of u16)'
details: Lives at 0x0201C500 in EWRAM, 512 bytes (256 halfwords) — exactly one 32x32 = 32*32/2 halfword
  row pair band of BG2 tilemap entries. decomposeTileBlock_8132FD0 indexes it as a u16 array (r2 << 0,
  no scaling), reading pairs then writing them out interleaved into the per-row tilemap, so it stores
  the de-interleaved left/right tile-ID halves prior to blit. gfx_fillAllBandedTilemaps_81330AC lists
  it in off_8133130 as the destination for a banded fill call whose descriptor immediately follows the
  pointer, matching the use as a tilemap staging buffer. The paired nearby EWRAM block unk_201C4F0 (0x30
  bytes earlier) is the analogous buffer used by the previous descriptor in the same table.
