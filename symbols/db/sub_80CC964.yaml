name: sub_80CC964
address: '0x080CC964'
kind: function
status: confirmed
summary: Initializes a battle object's collision (placing it on the grid, allocating the collision buffer, configuring
  geometry/hit effect/damage/optional status, finalizing it) and transitions the object into its CUR_STATE_UPDATE
  phase.
interface: "void sub_80CC964(BattleObject *r5);\n  // uses r8, lr. Sets/uses r5 in/out. Clobbers r0-r3 and nzcv.\
  \ Preserves r4, r5, r6, r7.\n  // Calls BL helpers and ends by setting oBattleObject_CurStateActionPhaseAndPhaseInitialized\n\
  \  // to CUR_STATE_UPDATE.\n"
details: 'Reads from r5 (BattleObject) the fields: oBattleObject_Param1 (damage -> stored at

  collision+1), oBattleObject_Param2 (hit effect), oBattleObject_Param3, oBattleObject_Param4

  (collision geometry), oBattleObject_ExtraVars (R3 -> setupCollisionData), oBattleObject_ExtraVars+4

  (status effect id; if non-zero, object_setCollisionStatusEffect1 is invoked), and

  oBattleObject_ExtraVars+8 (lower half -> oBattleObject_Timer).

  Writes: oBattleObject_Z = 0; oBattleObject_CurStateActionPhaseAndPhaseInitialized =

  CUR_STATE_UPDATE; collisionHandle[1] = Param1; Timer set from ExtraVars+8.

  Sequence: object_setCoordinatesFromPanels -> Z=0, object_createCollisionData; if the

  returned handle is NULL it calls object_freeMemory and returns. Otherwise it runs

  object_setupCollisionData(Param4,Param3,ExtraVars) -> object_setCollisionHitEffect(Param2),

  optionally object_setCollisionStatusEffect1(ExtraVars+4), then

  object_presentCollisionData, then writes the timer and the next phase.

  Note: r10 is in the register contract but unused in this routine (callee-preserved leftover).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
