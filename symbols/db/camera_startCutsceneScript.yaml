name: camera_startCutsceneScript
address: '0x08089CDC'
kind: function
status: probable
summary: Cutscene-object step that launches a fixed camera script and flags the object as camera-active.
interface: (r5 = cutscene/state object, r0 = ignored on entry) -> r0 = 0 from callees; stores camera script
  pointer at [r5+0x3C], sets byte [r5+0x13] = 1
details: Loads the hardcoded pointer at off_8089CF4 (= byte_808948A, a camera script data blob), stores
  it into the object's field at +0x3C, and passes it to SetCutsceneCameraScript, which repoints the cutscene
  camera engine and resets its command timer. It then writes 1 to byte [r5+0x13], evidently marking this
  phase of the cutscene as started/active, and calls two nearby helpers (sub_8089D0E, sub_8089D44) to
  finish the state transition. The script pointer is baked in, so this is one specific step of a scripted
  event, dispatched by the neighboring sub_80896xx/99xx state handlers rather than a generic service.
