  detail: '- `strh r5,[r2]` after reading IME, then later `strh r4,[r2]` to restore, with r2=InterruptMasterEnableRegister:
    shows IME save/disable/restore wrapper. - `and r0,r1` with mask 0xFF3F and r3=InterruptEnableRegister:
    clears bits 6,7 of IE (the SIO IRQ bits). - `mov r2,#0x80 ; lsl r2,#6` = 0x2000 written to SIOControlRegister:
    writes R to clear/disable SIO. - `strh r5,[r0]` with r0=Timer3Control: stops timer 3. - `add r1,#0xda
    ; mov r0,#0xc0 ; strh r0,[r1]`: writes 0xC0 to R+0xDA (a SIO/transfer-mode register offset). - `bl
    SWI_CpuSet` with r1=eTimerEnable200F460, r2=0x5000266 (`0x5...26` lower bits -> 32-bit fill, count
    0x26/8 words): zeroes the link subsystem timers/state in IWRAM. - Second SWI_CpuSet with r1=unk_200F44C,
    r2=0x01000002 (16-bit fill, 1 u16): zeros the link state word at 0x200F44C. - `strb r5,[r4,#0x1]`
    where r4=unk_200F44C and r5=0: clears `byte_200F44D` (the running-state byte the link SM at +8144250
    reads as its current state). - `pop {r0} ; bx r0`: classic Thumb tail-pop (register contract lists
    `lr` in `may_write`/`out` because the saved LR is consumed by `bx r0`, not returned to caller). -
    Captured-entry `r0=0x08144247 r1=0x0200f44c r2=0x01000002 r3=0x00000170` matches r1=r4=unk_200F44C
    and r2=0x01000002 coming from a previous SWI_CpuSet prep; `[r1]` is zeroed in the captured runs, confirming
    the routine just wiped it. - Sibling `sub_8144158` (called immediately before this in `sub_8144240`)
    plus the per-frame dispatch call sites (link_stateMachineRunStep_8144250, start_screen_update_802F710,
    pet_menuScreenTick_8126FF0, battle_*) match a "reset link hardware between ticks" role.'
