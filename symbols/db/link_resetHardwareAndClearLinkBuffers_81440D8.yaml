name: link_resetHardwareAndClearLinkBuffers_81440D8
address: '0x081440D8'
kind: function
previous_names:
- sub_81440D8
status: probable
summary: Resets GBA link-cable/SIO/Timer3 hardware and zeroes the link subsystem's IWRAM state (200F44C
  block, eTimerEnable200F460) then tail-pops the saved LR to caller.
interface: '() -> r0 = saved LR (jump target); side effects: clobbers IME/IE/SIOCNT/TM3CNT/RTC and clears
  0x200F44C..0x200F4xx + eTimerEnable200F460 area; pops original LR into PC (tail-call trampoline).'
details: "Step by step the function does:\n  1. Saves IME (InterruptMasterEnableRegister) to word_2006DFC\
  \ and then writes 0 to IME, masking all IRQs while it touches hardware (`ldrh r4,[r2]` ; `strh r4,[r0]`\
  \ ; `strh r5,[r2]`).\n  2. Reads IE (InterruptEnableRegister), ANDs with mask 0xFF3F (clearing bits\
  \ 6,7 - i.e. SIO/RCNT related interrupts), writes it back; then restores IME from r4 (`ldrh r1,[r3]`\
  \ ; `ldr r0,dword_814413C` ; `and r0,r1` ; `strh r0,[r3]` ; `strh r4,[r2]`).\n  3. Disables SIO: writes\
  \ 0x2000 (R_COMM bit) to SIOControlRegister (`mov r2,#0x80 ; lsl r2,r2,#6` -> 0x2000 ; `strh r0,[r1]`)\
  \ and clears Timer3Control (`strh r5,[r0]`).\n  4. Writes 0xC0 to a register at SIOControlRegister+0xDA\
  \ (looks like RCNT/R transfer-related) and writes 0x00 onto stack as a 4-byte source for a fill (`mov\
  \ r4,#0 ; str r4,[sp]`).\n  5. Calls SWI_CpuSet with src=sp, dst=eTimerEnable200F460, mode=0x5000266\
  \ (CPU 32bit fill, fixed source for 0x13 words i.e. ~0x4C bytes) - this zeroes the eTimerEnable200F460\
  \ block.\n  6. Zeros a halfword at sp+4 then calls SWI_CpuSet with src=sp(0), dst=unk_200F44C, mode=0x01000002\
  \ (CPU 16bit fill, 1 word) - fills a small chunk at 0x200F44C.\n  7. Stores 0 into `[r4+0x1]` which\
  \ is `byte_200F44D` (the link subsystem state byte).\n  8. Restores sp, pops {r4,r5}, pops the saved\
  \ LR into r0 then `bx r0` - i.e. a tail-pop: returns control by jumping to the caller-supplied LR rather\
  \ than `bx lr`. The caller 0x0814424B / 0x08127023 visible in the captured calls matches the LR values\
  \ being passed through.\nNamed callers are the per-frame drivers: link_stateMachineRunStep_8144250 (its\
  \ LR 0x0814424B dominates), battle/PET/overworld subsystem ticks (start_screen_update, load_game, pet_menuScreenTick,\
  \ battle_finishBattle, battle_stepSubstateToState4, and several sub_ routines) all kick this path with\
  \ their own LR, which is then chain-restored by the tail-pop. The sibling hypothesis sub_8144158 + driver\
  \ sub_8144240 fit the \"reset/teardown half\" of a two-phase tick.\nQuirk: r0 returned to callers is\
  \ not a real return value - it is the LR stored in r0 by `pop {r0}` for the `bx r0` tail-return; the\
  \ lifter mistakenly records that as the return. Callers do not consume it.\n"
