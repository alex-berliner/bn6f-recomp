open_questions:
- The exact meaning of the 0xC0 write to SIOControlRegister+0xDA (RCNT vs joy-bus vs multi-player) - need
  the register map for bn6f to confirm.
- Whether the eTimerEnable200F460 CpuSet count of 0x26 bytes covers all link substate or leaves tail bytes
  untouched (mode field 0x5000266 is fill-by-32 of 0x26/4 words? 0x26/2? - that depends on how SWI_CpuSet
  mode word is encoded on this BIOS build).
- Why 14 different caller sites call this rather than once from a top-of-frame dispatcher - possibly matches
  different reset/stop opportunities (entering battle, finishing battle, subsys switch).
