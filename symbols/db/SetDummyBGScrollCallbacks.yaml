name: SetDummyBGScrollCallbacks
address: '0x08001974'
kind: function
status: confirmed
summary: Installs no-op handlers into the BG scroll callback table (both scroll callbacks plus the HBlank callback)
  and hooks the dummy HBlank handler into the HBlank interrupt slot.
interface: void SetDummyBGScrollCallbacks(void)
details: 'Writes the Thumb entry point of nullsub_39 (ORed with 1, Thumb bit) into slots 0 and 8 of the BG scroll
  callback table rooted at 0x200A880 (eBGScrollCallbacks_Callback0 and ...Callback1), and the Thumb entry of nullsub_38
  into the HBlank callback slot at offset 4. Then calls SetInterruptCallback with r0=4 (the HBlank interrupt slot)
  and r1 = the HBlank dummy handler, registering it with the interrupt dispatcher. Effectively disables the BG scroll
  engine''s real per-frame and HBlank updates — used on screens that manage their own background rendering. Touches
  no game state besides the callback table and the interrupt vector table entry. Note r4 is preserved across the
  call; the "outputs r1 r2 r3" in the contract are just leftovers from the SetInterruptCallback call.

  '
