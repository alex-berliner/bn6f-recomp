summary: 'UPDATE handler of the t1_0x54 follower object type: copies position/animation state from its
  related (parent) object and re-anchors itself each frame.'
interface: 'void t1_0x54_updateFromRelatedObject(u32 r5 /* battle object */) : r5 -> [r5 r10]'
details: 'UPDATE (state-4) handler of the t1_0x54 object type''s jumptable. Each frame it reads oBattleObject_RelatedObject1Ptr
  (the parent), copies the parent''s pixel X/Y/Z and panel coordinates onto itself, reapplies the parent''s
  flip and animation-derived fields, updates its own collision panel mapping, and re-presents collision
  data; when the parent is gone the object frees itself. Reached both as the .word jumptable entry and
  via one direct bl from the family''s shared per-frame routine.

  '
