summary: 'Proposed name: eChipPackScreenHeaderTilemap. EWRAM tilemap buffer for the chip pack screen header
  strip rendered by battle_renderChipPackScreenTilemap. (pointer)'
details: The EWRAM block is loaded into r1 only as part of a destination address constructed as 0x0A000000
  | 0x200 = 0x0A000200, the standard BG tilemap VRAM base offset. Together with j=7 and i_size=0xE (the
  same dimensions used for every other 2x14 strip in the function), it is the 2-column by 14-row BG tilemap
  destination for the header section. No store into this address is visible at the labelled sites, so
  the buffer is filled elsewhere (likely during the same render pass); its fixed 56 bytes (7 * 14 / 2,
  packed pairs) match a single 2x14 tilemap strip.
