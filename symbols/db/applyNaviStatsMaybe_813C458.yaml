name: applyNaviStatsMaybe_813C458
address: '0x0813C458'
kind: function
status: confirmed
summary: Rebuilds and re-applies the equipped NaviCust programs and stock PET navi stats, then restores the player's
  selected navi and refreshes its display.
interface: void reapplyNavicustAndPetNaviStats_813C458(void); // r2, r5-r12 passed through untouched, r4 callee-saved
  scratch, flags clobbered
details: "Runs the full \"refresh navi customisation\" pipeline:\n1. sub_813BBD4 and sub_8136C24 rebuild some navi-related\
  \ derived tables.\n2. Reads the currently selected PET navi via GetCurPETNavi (returns u8 navi id in r0).\n3.\
  \ Temporarily selects navi slot 0 (SetCurPETNavi(0)) so the *stock* navi's stats\n   get applied first (sub_813C678).\n\
  4. Clears event flag EVENT_170D via ClearEventFlagFromImmediate (movflag loads\n   r0=0x17, r1=0xD, i.e. flag\
  \ number \"0x170D\" split across r0/r1).\n5. Calls applyNavicustPrograms_813C684 with the saved navi id in r4\
  \ — note this\n   function takes its argument in r4, not r0, so r4 is used as scratch here\n   (hence the push\
  \ {r4,lr} / pop {r4,pc}).\n6. Runs follow-up fixups in sub_813CBCC.\n7. Restores the player's actual navi via\
  \ SetCurPETNavi(naviId) and refreshes the\n   HUD/display via sub_803CE44.\nEverything else the caller had in\
  \ r2 and r5-r12 is simply left alone across the\nwhole sequence; the register contract reflects that pass-through\
  \ rather than a\nreal parameter list. The 2 bytes of padding (.byte 0,0) after the pop align the\nnext function.\n"
