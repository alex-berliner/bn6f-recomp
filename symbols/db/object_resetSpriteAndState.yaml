name: object_resetSpriteAndState
address: '0x080BB938'
kind: function
status: probable
summary: Resets a battle object's panel-derived coordinates, Z, sprite/animation/palette/flip resources,
  and switches its state to the normal update phase.
interface: (r5 = battle object pointer) -> r0 = destroyed; object fields updated, state word set to CUR_STATE_UPDATE
details: Uses the battle object in r5 throughout. Calls object_setCoordinatesFromPanels to sync pixel
  X/Y with the panel grid, stores 0 to oBattleObject_Z, then sprite_load with (0x80, 8, 5) followed by
  sprite_loadAnimationData to attach sprite resources. Enables the shadow via sprite_hasShadow, clears
  oBattleObject_CurAnim and CurAnimCopy to 0 and applies it with sprite_setAnimation, then reloads animation
  data. Sets palette 0, mirrors the object's facing (object_getFlip) into the sprite with sprite_setFlip,
  and ends by writing CUR_STATE_UPDATE to oBattleObject_CurStateActionPhaseAndPhaseInitialized.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: str r0, [r5,#oBattleObject_Z] with r0=0 resets the object's Z height; sprite_load with fixed
    args (0x80, 8, 5) plus sprite_loadAnimationData attaches a specific sprite resource set; strb r0 to
    both oBattleObject_CurAnim and CurAnimCopy then sprite_setAnimation(0) resets animation to frame 0;
    object_getFlip -> sprite_setFlip syncs sprite facing with the object's alliance/direction; final str
    of CUR_STATE_UPDATE to oBattleObject_CurStateActionPhaseAndPhaseInitialized is a typical spawn/reset
    state transition
