name: sub_811BE1C
address: '0x0811BE1C'
kind: function
status: confirmed
summary: Initialize (or restamp) the GUI sprite for a PET-Navi slot, setting up animation, palette, priority, and
  position from per-kind tables; skips work if the slot has no entry.
interface: "void sub_811BE1C(u32 slot_index /* r0 */, u32 sprite_record /* r5 */,\n                 u32 caller_r3_in\
  \ /* r3 */) -> u32 /* r3, from sprite_setCoordinates */\n  // clobbers r0, r1, r2, lr; flags N Z C V; preserves\
  \ r4, r5, r6\n"
details: "Sets sprite_record[0] := 1, then reads a per-slot sprite-type byte from byte_811BF94;\nif it is zero,\
  \ returns the caller's r3 unchanged.\nOtherwise calls initGuiSprite_8002770(type, 1, sprite), sets sprite_record[0]\
  \ := 0x23,\nthen sequences a sprite bring-up:\n  sprite_setAnimation(0) -> sprite_loadAnimationData() -> sprite_noShadow()\n\
  \  -> sprite_setSubEntryPaletteBank_800304A(4).\nPalette selection reads kind = sprite_record[0xC]. For kind ==\
  \ 0x17 (current PET\nNavi) it queries GetCurPETNavi + GetCurPETNaviStatsByte(0x0E); a return of 0xFF\nuses palette\
  \ 0x0C, otherwise loads palette = byte_811BFD8[0x17]. Any other kind\nloads byte_811BFD8[kind] directly via sprite_setPalette.\n\
  Stores halfword 0x120 via slotList_storeHalfwordAndClearField_800306C, sets BG\npriority 2 (sprite_setPriority_8002E14),\
  \ then re-reads sprite_record[0xC] and\nsets sub-record field A from byte_811BFB6[kind] (sprite_setSubRecordFieldA_8003060).\n\
  Final position is read from the s16-packed (x, y) table at byte_811BF0C indexed by\n(kind*4); sprite_setCoordinates\
  \ propagates r3 back to the caller.\nNotable quirk: kind at sprite_record+0xC is re-read three times (between\
  \ helper\ncalls) because the sprite helpers may mutate it in place.\n"
