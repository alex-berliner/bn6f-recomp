name: battle_objectRiseZUntilTimer
address: '0x080D3638'
kind: function
status: probable
summary: Battle object step that moves the object +0xA000 along Z each frame for Timer2 frames, then sets
  CurAction=9 and resets the phase when the timer runs out.
interface: (r5 = battle object pointer) -> updates object Z, Timer2, CurAction, CurPhaseAndPhaseInitialized;
  sets Z flag from Timer2 decrement
details: Reads oBattleObject_Z from the object at r5, adds the constant 0xa000, and stores it back — a
  fixed per-frame Z delta. Decrements the 16-bit oBattleObject_Timer2 and falls through to the epilogue
  while nonzero. When Timer2 hits zero it writes 9 into oBattleObject_CurAction and zeroes oBattleObject_CurPhaseAndPhaseInitialized,
  ending the current action and returning the object to its state machine. Uses r5 as the object pointer
  rather than an argument, so it is an object-update callback rather than a general helper. The 0xa000
  constant comes from literal pool dword_80D3848.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldr r0,[r5,#oBattleObject_Z] / add r0,0xa000 / str — fixed Z-axis displacement each call; ldrh
    r0,[r5,#oBattleObject_Timer2]; sub r0,#1; strh; bne — counts Timer2 frames before finishing; mov r0,#9;
    strb [r5,#oBattleObject_CurAction] plus zeroed CurPhaseAndPhaseInitialized — action-terminating transition
    on timer expiry; no arguments besides r5 object pointer — matches an object state-handler step; no
    known callers/callees — context limited to the object fields touched
