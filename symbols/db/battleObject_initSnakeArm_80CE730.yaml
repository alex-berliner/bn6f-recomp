name: battleObject_initSnakeArm_80CE730
address: '0x080CE730'
kind: function
status: confirmed
summary: 'Initializes the Snake Arm projectile battle object: places it from panel data, loads its sprite/collision,
  then either aborts (spawning a small hit-effect) or sets up directional velocity and transitions to per-frame
  update.'
interface: 'void battle_initSnakeArm_80CE730(void) — reads: r5 (object ptr), r6/r7 (panel coords), r8 (collision
  context), r10, lr; writes back r5, r8; clobbers r0-r3, lr, NZCV; preserves r4, r6, r7'
details: "Snake Arm is the projectile spawned by the Snake Arm Battle Card (a serpentine shot that travels\nhorizontally\
  \ across the panel field). This function is its one-time spawn initializer.\n\n1. Calls object_setCoordinatesFromPanels\
  \ (r5/r6/r7) to snap the projectile onto the grid.\n2. Calls battleObject_initSpriteAndCollision_8011504 with\
  \ tile-ID 0x70402 and a data pointer\n   0x4050300 to allocate and load the sprite + hitbox. Returns status in\
  \ r0.\n3a. Failure path (r0 == 0): reads three u32s at r5+0x34 (x, y, z-of-0x100000 offset), calls\n    spawn_t1_0x0_EffectObject\
  \ with effect type 0x14, then object_freeMemory to release the\n    half-allocated object.\n3b. Success path:\n\
  \    - Sets bit 1 (mask 0x2) in ObjectHeader_Flags (collidable / active marker).\n    - object_setCollisionHitEffect(2,\
  \ r5) — hit-effect ID 2.\n    - sprite_setPalette(0, r5) — default (index 0) palette.\n    - object_presentCollisionData(r1=2,\
  \ r5, r8) — commits the hitbox to the collision grid.\n    - object_getFrontDirection(r5) → r0; reads u32 at r5+oBattleObject_ExtraVars\
  \ (a speed\n      scalar baked into the panel data); writes r0*scalar into r5+oBattleObject_XVelocity,\n     \
  \ giving the horizontal travel direction and magnitude.\n    - Writes CUR_STATE_UPDATE into oBattleObject_CurState\
  \ so the main loop calls the projectile's\n      per-frame state handler next tick.\n\nThe ExtraVars field acts\
  \ as a speed multiplier unique to Snake Arm; the front-direction sign\ndetermines left/right travel on the panel.\n"
