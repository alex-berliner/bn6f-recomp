name: battleObject_initSnakeArm_80CE730
address: '0x080CE730'
kind: function
previous_names:
- sub_80CE730
status: probable
summary: Initializes a battle object's snake-arm attack state, spawning a hit effect on failure or launching
  the arm on success.
interface: '(r5 = battle object) -> void ; side effects: writes object state/flags, collision hit-effect,
  palette, XVelocity, and may spawn a child effect object or free the parent'
details: 'Called when a battle object enters its arm-lunge / reach attack (uses CUR_STATE_INITIALIZE).
  First

  snaps the object from its panel coordinates to pixel coordinates via

  object_setCoordinatesFromPanels, then asks battleObject_initSpriteAndCollision_8011504 to load the

  arm sprite/animation with the constants at 0x70402 / 0x4050300 and a flip corresponding to facing.

  If that init returns non-zero (success), the function sets OBJECT_FLAG_VISIBLE on the object

  header, programs a collision hit-effect of 2, sets the sprite palette index to 0, runs

  object_presentCollisionData to publish collisions for this frame, then sets

  XVelocity = object_getFrontDirection() * oBattleObject_ExtraVars (a sideways/distance scalar kept

  in the per-object extra-vars slot), and finally writes CUR_STATE_UPDATE (0x4) so the next frame

  the object leaves init and enters its update loop — i.e. the arm slides off.

  On failure to init the sprite it pulls oBattleObject_ExtraVars[0x34..0x3c] (params) into r1-r3,

  adds 0x00100000 to the param3 base, and dispatches spawn_t1_0x0_EffectObject with arg4=r5

  (object pointer) so a type-4 / type-1 effect object appears, then frees the parent battle

  object via object_freeMemory and returns.

  The two constants 0x70402 and 0x4050300 look like a packed (sprite/animation spec, collision

  spec) pair passed to battleObject_initSpriteAndCollision_8011504. The use of ExtraVars as a

  precomputed displacement/distance and the `object_getFrontDirection` multiplier is consistent

  with an arm that reaches in the object''s facing direction.

  '
