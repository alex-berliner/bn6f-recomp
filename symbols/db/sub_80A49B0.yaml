name: sub_80A49B0
address: '0x080A49B0'
kind: function
status: confirmed
summary: 'Creates and fully initializes a field/overworld sprite from a configuration block: loads the sprite resource,
  sets animation/palette/priority, optionally applies Z-coordinate layer effects, clears shadow flags, and fires
  a post-init event.'
interface: void sprite_initFromConfig_80A49B0(u32 r5 /*sprite obj*/, u32 r7 /*config block ptr*/, u32 r10); /* returns
  r2 from post-init event, may update r5 from sprite_load */
details: 'Reads a fixed-layout config block at r7: byte[0]=sprite resource ID, byte[1]=sprite sub-ID (both passed
  to sprite_load with category 0x80), byte[2]=initial animation index, byte[3]=Z-modifier flag (0xFF triggers layer
  pass), word[4]=value written to sprite offset 0x2C via sprite_setUnk0x2c, byte[8]=palette index. Loads animation
  data (sprite_loadAnimationData), disables shadow (sprite_noShadow). When byte[3]==0xFF: saves obj+0x14 (Z coord),
  calls checkZCoordModifiers_8031612 on the substruct at obj+0xC, writes the modifier result shifted left 16 into
  Z, calls applyLayerEffectToOWObject_8035694 to update the draw layer, then restores the original Z. Sets priority
  (sprite_setPriority_8002E14) using either the layer-effect return or the raw byte[3]. Hardcodes obj layer byte[8]=4,
  flags byte[6]=0, shadow byte[7]=0. Finally calls event_80A4A08 for any post-initialization hook (e.g., battle-field
  or NPC-specific setup). Quirk: sprite_load may return a different object pointer in r5, which is threaded through
  every subsequent call.'
