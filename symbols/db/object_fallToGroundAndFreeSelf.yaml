name: object_fallToGroundAndFreeSelf
address: '0x080E475C'
kind: function
status: probable
summary: 'Per-frame gravity update for a battle object: adds its velocity triple (+0x40/+0x44/+0x48) to
  its position (+0x34/+0x38/+0x3C) and decreases Z velocity by 0x14000; if the new Z would go negative
  it is clamped to 0, and when Z is exactly 0 the object spawns effect 0 at its position and frees its
  slot.'
interface: (r5 = battle object, r0-r4/r7 clobbered) -> void; object slot freed via callee when it lands
details: 'Treats r5 as a battle object: loads the 3-word velocity triple at +0x40/+0x44/+0x48 and adds
  it to the position triple at +0x34/+0x38/+0x3C, storing the new position back. The Z velocity (r6) is
  decremented by 0x14000 (0xFFFEC000) each call and written to oBattleObject_ZVelocity, i.e. constant
  gravity. If the resulting Z position (r2) went negative it is clamped to 0, so the object never sinks
  below the ground. Finally, if oBattleObject_Z is exactly 0, it calls object_spawnEffect0AndFreeSelf,
  landing with a puff effect and removing itself; otherwise it just returns. This is the classic ''falls
  from the sky and lands'' behavior shared by battle effects/attacks.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldmia r7!,{r3,r4,r6} at r5+0x40 (velocity) then add r0,r0,r3 / add r1,r1,r4 / add r2,r2,r6
    into r5+0x34 position triple: position += velocity; ldr dword_80E478C (=0xFFFEC000); add r6,r6,r0;
    str r6,[r5,#oBattleObject_ZVelocity]: constant downward Z acceleration (gravity); bpl/mov r2,#0 after
    the Z add clamps Z position at 0 (no falling below ground); tst r0,r0 on [r5,#oBattleObject_Z] with
    beq to bl object_spawnEffect0AndFreeSelf: landing at Z==0 triggers the effect-and-free path; callee
    summary ''spawns effect type 0 at the object''s position, then frees the slot'' matches a landing/despawn
    effect'
  refs:
  - bn6f/asm/asm31.s:97544
  - 0x080E46F8 sub_80E46F8
  - 0x080E4790 object_spawnEffect0AndFreeSelf
  reproduce: python3 tools/asmcat.py 0x080E475C
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The proposal matches the code well: velocity (0x40-0x48) added to position (0x34-0x3C), the `bpl`
    over the `mov r2,#0` clamps negative Z to 0, and only when Z==0 is the `object_spawnEffect0AndFreeSelf`
    callee invoked. However the summary/state says Z velocity is overwritten into oBattleObject_ZVelocity
    each call and that it lands ''with a puff effect and removes itself''; actually `tst r0,r0` only fires
    on exact 0, which is a fine but overstated landing condition. The name is fine but a slightly clearer
    one is in order.; run wf investigate investigate-20261019-030611; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
