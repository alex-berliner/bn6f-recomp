name: ai_attackStepDelayedHit
address: '0x081070C8'
kind: function
status: probable
summary: 'AI attack-script step: on first run initialize a countdown from AttackBoost2, then after it
  expires register a hit with element 4'
interface: (r0 unused, r7 = oAIAttackVars context) -> void; updates AttackElement, ScratchVar, StepTimer,
  HitElement
details: 'Runs as a per-frame step of an enemy AI attack, using fields of the oAIAttackVars struct. If
  oAIAttackVars_AttackElement is 0 it initializes: writes element 4 to AttackElement, zeroes oAIAttackVars_ScratchVar,
  and copies AttackBoost2 into the halfword oAIAttackVars_StepTimer. Otherwise it decrements StepTimer
  each call; when the timer reaches 0 it writes 4 to the halfword oAIAttackVars_HitElement, presumably
  signalling the attack''s hit/damage element. The element constant 4 and the exact hit mechanism are
  not visible from this routine alone.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne splits init pass vs countdown pass; init
    writes #4 to AttackElement, 0 to ScratchVar, AttackBoost2 to StepTimer; ldrh StepTimer; sub r0,#1;
    strh; bgt — a frame countdown; on timer expiry: mov r0,#4; strh r0,[r7,#oAIAttackVars_HitElement]'
  refs:
  - bn6f/asm/asm31.s:171768
