summary: Initializes four fields of eLinkState (byte0=0x10, byte1=0x0C, byte8=0, halfword+0xC=0x10) with
  constants; called from battle and from sub_812AC1A.
interface: () -> void; writes eLinkState byte0=0x10, byte1=0x0C, halfword at +0xC=0x10, byte8=0; no return
