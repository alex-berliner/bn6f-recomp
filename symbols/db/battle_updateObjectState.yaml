open_questions:
- Which object/boss this update routine belongs to (identity of the 4 action handlers at 80E00B0/80E0118/80E01EE/80E0226
  would tell)
- Exact meaning of ExtraVars+0x10/+0x14 (looks like a re-entry delay counter, but semantics unconfirmed)
- Why actions 0 and 0xC are exempt from the region logic
