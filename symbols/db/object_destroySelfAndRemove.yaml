name: object_destroySelfAndRemove
address: '0x080CF1DC'
kind: function
status: probable
summary: 'Self-destruct helper for a battle object (r5): clears its collision region, releases its reserved panel,
  conditionally plays SOUND_HIT_BOMB_1 or spawns a type-0 effect object via spawn_t1_0x0_EffectObject (skippable
  via sub_800F8CE), clears bit 2 of oObjectHeader_Flags, dispatches destroy sub-events, removes the object from
  the battle object list, and sets CurStateActionPhaseAndPhaseInitialized to CUR_STATE_DESTROY.'
interface: (r5 = battle object pointer, uses this-call convention) -> void; object set to CUR_STATE_DESTROY and
  cleared from list
details: 'The routine tears down the object at r5: it clears the collision region and releases the panel reserved
  at FuturePanelX/Y. It then reads ObjectFlags2; bit 0x8000 selects a branch that calls sub_800F90E(3) or, if bits
  0x300000 are also set, checks sub_800F8CE which can bail out early (locret) — these look like variant/flag checks
  before the destruction visuals. The default path plays SOUND_HIT_BOMB_1. In all effect paths it loads the object''s
  position triple at offset 0x34 (ldmia {r1-r3}: x, y, z), bumps z by 0x14 or 0x10, and spawns a type-4 effect object
  with effect type 0 (via spawn_t1_0x0_EffectObject, with r4 = 0 or 0xC as an extra spawn parameter). Finally it
  clears bit 2 of oObjectHeader_Flags, dispatches the object''s destroy sub-events (battle_dispatchDestroyEvents_802EF5C),
  removes itself from the battle object list, and stores CUR_STATE_DESTROY into CurStateActionPhaseAndPhaseInitialized.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_clearCollisionRegion + object_removePanelReserve(FuturePanelX/Y) frees the object''s battlefield
    footprint (asm start); bl PlaySoundEffect with #SOUND_HIT_BOMB_1 before spawning the effect (loc_80CF222); ldmia
    from r5+0x34 loads x/y/z and spawn_t1_0x0_EffectObject places effect type 0 at that spot (both effect paths);
    tail sets CUR_STATE_DESTROY and calls clearEntryOfBattleStateBattleObjectList_800F656 (loc_80CF23A); bit tests
    on object_getFlag2 result (0x8000, 0x300000) with early return at loc_80CF24E skip visuals but still allow teardown
    only via the flag-clear path'
  refs:
  - bn6f/asm/asm31.s:50237
  - 0x080005CC PlaySoundEffect
  - 0x0802EF5C battle_dispatchDestroyEvents_802EF5C
  - 0x0801A074 object_clearCollisionRegion
  reproduce: python3 tools/asmcat.py 0x080CF1DC
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise — The proposal''s
    interface says ''r5 = battle object pointer, uses this-call convention -> void'' but r5 is not set up by this
    routine (no `mov r5, r0` anywhere); the caller supplies it, so the convention isn''t established here. Also
    the proposal''s detail ''clears bit 2 of oObjectHeader_Flags'' matches the `bic r0, #2` on oObjectHeader_Flags.
    The summary and core destruction behavior (clear collision, release panel, play sound/spawn explosion via spawn_t1_0x0_EffectObject,
    dispatch destroy events, remove from list, set CUR_STATE_DESTROY) match the assembly. A name with the ''object''
    prefix is correct, but ''destroySelfWithExplosion'' overstates the visual — only the default 0x8000-branching
    path plays the bomb sound/explosion; the 0x300000 branch calls sub_800F90E/sub_800F8CE which can return 0 and
    skip effects (locret_80CF24E). Use a more general object-prefixed name.; run wf investigate investigate-20261018-223614;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
open_questions:
- Meaning of ObjectFlags2 bits 0x8000 and 0x300000 and what sub_800F90E/sub_800F8CE decide (different death variant
  vs. suppress explosion)
- Whether the r4 values 0xC and 0 passed to the effect spawner select explosion size/type variant
- No known caller; a caller would confirm this is the generic 'object destroyed by damage' path rather than a specific
  attack's self-destruct
