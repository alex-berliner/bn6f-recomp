name: submenu_updateScroll
address: '0x08135A44'
kind: function
status: probable
summary: 'Per-frame scroll/refresh of a submenu work struct: bails out if chatbox bits 0x80 or 0x20 are
  set, or if chatbox_GetState_8045F4C is nonzero (returning after copying r5+0x16 into r5+2 and one chatbox_8040818
  call); otherwise clears r5+0xc/0x10, rebuilds the 25 oToolkit_Unk2004190 entries, then clamps the 4-row
  scroll window around the target index from r5+0x1a.'
interface: (r0 = unused; r5 = menu work struct preloaded by caller) -> updates struct fields (2, c, 10,
  20, 24) and calls state-machine helpers; flags set by final cmp used by locret branch only
details: 'First it bails out unless both chatbox flag bits 0x80 and 0x20 of eFlags2009F38 are clear, so
  it only runs when no cutscene/text is active. It copies the byte at [r5+0x16] into [r5+2], then calls
  chatbox_8040818 on every path (once if the chatbox state selector is nonzero, twice otherwise), clearing
  [r5+0xc] to 0x10 and [r5+0x10] to 0 when the chatbox is idle. It then loops i = 0..0x18 over the 8-byte
  entries of oToolkit_Unk2004190_Ptr, feeding entry pointer and index into sub_81366F4 and calling sub_813B9C4(i)
  and sub_813BA48(i) — a rebuild/refresh pass over all 25 entries. Finally sub_8135D9C runs, and sub_813660C/sub_813C1C0
  are called with 1, or with 0 when [r5+0x16] == 4, suggesting a flag toggle depending on list mode. The
  tail reads a halfword at [r5+0x1a], passes it through sub_8135DF8 to get a target index, and clamps
  the scroll window to 4 rows: if the target is <=3 it stores [r5+0x20] = target and [r5+0x24] = 0, otherwise
  it shifts [r5+0x1e]/[r5+0x20] so the cursor stays inside the window and writes the resulting offset
  into [r5+0x24]. The use of r5 without setting it means the caller must supply the work struct (a state-machine
  context), and the [r5+0x16] value selects between two update modes.'
