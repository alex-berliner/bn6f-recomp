name: submenu_updateScroll
address: '0x08135A44'
kind: function
status: confirmed
summary: Rebuilds the chip/item list and refreshes the scroll window in the submenu navigation panel.
interface: void submenu_updateScroll(void)  // r5=submenu_struct*, r6, r7, r10=caller context; r5 may be updated
  internally but r4–r7 are restored on return
details: "Gates on chatbox event flags 0x80 and 0x20 (both must be set) before doing any work.\nMirrors the substate\
  \ byte at +0x16 into scratch byte +0x2.\nIf the chatbox is not idle (chatbox_GetState nonzero), simply calls chatbox_8040818\
  \ and returns.\nOtherwise enters the full rebuild flow:\n  - Writes 0x10 to +0xc (display mode) and 0 to +0x10.\n\
  \  - Loops 25 times (0x19) over toolkit_2004190 entries: fetches each entry pointer,\n    reads its halfword,\
  \ calls sub_81366F4, then sub_813B9C4 and sub_813BA48 to clear\n    and reinitialise the slot.\n  - Rebuilds the\
  \ key-item list via submenu_rebuildKeyItemList.\n  - Draws the NavICustom board tilemap (sub_813660C(1), navicust_drawBoardTilemap(1)).\n\
  Scroll-window handling branches on substate (+0x16):\n  - != 4: redraws tilemap with scroll enabled and returns.\n\
  \  - == 4: disables scroll drawing, reads content height from +0x1a via sub_8135DF8,\n    then clamps the 2D scroll\
  \ offset (+0x20) and top (+0x24) using viewport height (+0x1e).\n    If content fits (<=3 rows) sets offset=rows,\
  \ top=0; otherwise computes overflow\n    and stores the deficit.\nStruct fields touched (submenu object at r5):\n\
  \  +0x02 byte, +0x0c byte, +0x10 byte, +0x16 byte (substate),\n  +0x1a hword (content height), +0x1e hword (viewport\
  \ height),\n  +0x20 hword (scroll offset), +0x24 hword (scroll top/deficit).\n"
