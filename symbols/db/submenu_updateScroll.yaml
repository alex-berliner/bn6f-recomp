    update behind cutscene/chat flags; loop `cmp r4, #0x19` over toolkit_getUnk2004190EntryPtr calls sub_81366F4/sub_813B9C4/sub_813BA48
    per entry — a 25-item list rebuild; tail math on [r5+0x1a]/[r5+0x1e]/[r5+0x20]/[r5+0x24] with `cmp
    r1, #4` / `sub r1, #4` implements a 4-row scrolling window clamp around the cursor; both branches
    call chatbox_8040818 and [r5+0xc]=0x10 / [r5+0x10]=0 are reset when the chatbox is idle, typical menu-frame
    bookkeeping; recorded in the beastsp route, consistent with a Beast Out/spirit-related selection menu
    scroll handler'
