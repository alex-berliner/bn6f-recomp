name: TestEventFlagRange
address: '0x0802F200'
kind: function
previous_names: []
status: confirmed
summary: Test a run of consecutive event flags
interface: (r0 = flag, r2 = count) -> r0 = 1 if every flag in the range is set, else 0; Z from r0 (tst r0, r0);
  C/V from cmp(set count, count); r1 = last mask, r2 = loop counter after `sub r2,#1; bgt` (0 for count >= 1), r3
  = last byte address; r4-r7 preserved
details: 'The event flags are a bit array at [toolkit + oToolkit_EventFlagsPtr] (0x44): flag n is bit 7 - n % 8
  of byte n / 8, so each byte''s first flag is its top bit. FromImmediate variants take the 16-bit flag as two bytes
  (r0 = high, r1 = low; `lsl r0, #8; orr r0, r1`) and fall through into the plain function: 4 bytes of code in the
  caller instead of a literal. All variants compute byte = array + flag / 8 (`add r3, r3, r1`, which sets V) and
  mask = 0x80 >> (flag % 8) (both shifts shift out a 0 bit, so C = 0).'
