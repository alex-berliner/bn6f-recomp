summary: battle-object dispatch stub that branches on the object's beast/sp-out flag (BLeftAbility?) to one of three
  sub-handlers
interface: (r5 = battleObject) -> r0, r2, r3, flags ; side-effect-only (via tail call into sub_811E18C / sub_811E1D4
  / sub_811E1FA)
details: "Tiny tail-call dispatcher. Saves lr, then loads r5+8 (BLeftAbility in the\n  NaviStats/AIData view; in\
  \ this context it's reading a byte off the in-r5\n  battle-object pointer at offset 0x8, which lands on `CurState`\
  \ per\n  `oBattleObject_CurState` — but the callee selection looks more like a beast/sp\n  substate dispatch based\
  \ on the captured-call snapshots which all show r5 ==\n  0x0811e169, lr == 0x0804683c and r2 == 0x087dc5a4 (an\
  \ IWRAM scratch), with r3\n  varying between 0x00000020 and 0x087dc198 (different battle-object pointers).\n \
  \ The three function pointers in `off_811E17C` (`sub_811E18C+1`, `sub_811E1D4+1`,\n  `sub_811E1FA+1`) are switched\
  \ on by `[r5+8]` acting as an index 0..2.\n  Loads `eStruct2001010` into r6 (looks unused inside the stub itself;\
  \ provided\n  for the callees' calling convention). The `pop {pc}` is the tail return — the\n  picked callee runs\
  \ in r5's context and returns to the original caller via the\n  pushed lr. Exit r0 == 0x78c is whatever the chosen\
  \ callee leaves; it isn't\n  meaningful here. No clobbering of memory is done by this stub itself.\n"
