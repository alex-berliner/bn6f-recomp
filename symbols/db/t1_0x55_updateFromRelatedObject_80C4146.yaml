name: t1_0x55_updateFromRelatedObject_80C4146
address: '0x080C4146'
kind: function
status: confirmed
summary: Mirrors visual and render state (sprite data, palette, shader, flip, alpha, Z-depth) from the battle object's
  RelatedObject1 onto itself each frame, then updates the sprite unless the battle is paused or in time-stop.
interface: 'u32 battle_syncSpriteStateFromRelated_80C4146(u32 r5 /* battle object ptr */);

  // r5 in/out (possibly advanced by object_updateSprite); r4, r7 preserved; flags clobbered

  '
details: 'Reads r5->RelatedObject1Ptr as the source object. Copies the 12-byte sprite-data block at struct offset
  0x34 (3 dwords) verbatim. Merges bit-1 (active) of oObjectHeader_Flags from the source while preserving the destination''s
  other flag bits. Then delegates to sprite helper pairs to mirror: palette (sprite_get/setPalette), color shader
  (sprite_get/setColorShader), final palette (sprite_get/setFinalPalette), sprite flag-10 / render-info-high (via
  the local 0x8002F02 helper), DirectionFlip byte, horizontal flip (object_getFlip → sprite_setFlip), and mosaic/scaling
  → alpha (sprite_getMosaicScalingParameters → sprite_setAlpha). If oBattleObject_ExtraVars is zero, derives oBattleObject_Z16
  from the source''s CurAnim (0 if idle, 0xFF otherwise). Finally calls object_updateSprite on r5 only when battle_isTimeStop
  and battle_isPaused both return Z-flag set (not active); otherwise skips the sprite update entirely.

  '
