details: 'Zeroed only by the power-on RAM clear (start.s clears 0x02000000-0x0203FFFF), never saved
  (outside the 0x6710-byte save block), so it survives a soft reset; a lag frame still adds 1. Reached
  through oToolkit_CurFramePtr (filled from the ToolkitPointers table, asm00_1.s:7802) and, once, through
  its own literal: pickBattleSettingsEntry_80AA5F4 loads it directly (off_80AA884, asm29.s:10627). Gameplay
  readers: the encounter formation pick battle_pickRandomRowObjectFields/pickBattleSettingsEntry_80AA5F4
  ((u16)iCurrFrame % eligible), the weighted mystery-data pick pickWeightedIndex_8000E3A and the chatbox
  random branch chatbox_F0_jump ((iCurrFrame&3)+2 draws); everything else is blinking/animation
  (battle_pickObjectAnimState_802BF0C and the like).'
