- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb/tst on oBattleObject_PhaseInitialized with first-run init block storing 4, CurAnim=0, Timer=10
    (asm lines 3-10); Timer decrement loop with 'bgt locret' keeps the object in this phase until 10 frames
    elapse (lines 12-15); On expiry, mov r0,#8; strb to oBattleObject_CurAction and strh 0 to CurPhaseAndPhaseInitialized
    hand control to action 8 (lines 16-19); All accesses are via r5 with oBattleObject_ offsets, matching
    the battle-object state-machine pattern
