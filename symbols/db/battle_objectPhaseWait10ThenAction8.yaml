name: battle_objectPhaseWait10ThenAction8
address: '0x080BAB84'
kind: function
status: probable
summary: Battle-object phase handler that waits 10 frames (resetting the object's animation) and then
  advances the object to CurAction 8.
interface: (r5 = battle object ptr, no args) -> void; no flags used by callers
details: 'Standard BN6 phase-handler shape: on first run it writes 4 to oBattleObject_PhaseInitialized,
  zeroes oBattleObject_CurAnim, and stores 10 into oBattleObject_Timer, returning immediately. On later
  frames it decrements oBattleObject_Timer and, once it reaches 0, writes 8 to oBattleObject_CurAction
  and stores 0 into the combined oBattleObject_CurPhaseAndPhaseInitialized halfword, clearing both the
  current phase and the init flag so the next phase re-initializes. All state lives in the battle object
  at r5; the function has no locals. Which object uses it (and what action 8 means for it) is not visible
  without callers.'
