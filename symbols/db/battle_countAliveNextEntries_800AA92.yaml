name: battle_countAliveNextEntries_800AA92
address: '0x0800AA92'
kind: function
previous_names:
- sub_800AA92
status: probable
summary: Counts how many non-zero entries exist in the "Next" array (at 0x2038170) and returns that as
  the number of alive/active battle actors queued.
interface: (no explicit args read; r0 holds whatever the caller passed in but is overwritten immediately
  to 0) -> r0 = number of non-zero u32 entries (each 0x20 bytes apart) in the entry block at 0x2038170
  + r0*0x20 ; no side effects beyond reading the array and restoring lr
details: "1. Calls getNextEntryAddress_800AAAE which computes a pointer to entry r0 of the \"Next\" array\n\
  \     at 0x2038170, leaving the array base in r1 and the entry pointer in r0.\n  2. Saves the entry\
  \ pointer in r3, then sets r0=0 (count) and r2=0 (byte stride offset).\n  3. Loops r2 over offsets 0,\
  \ 4, 8, ... 0x1C (8 words = 0x20 bytes per entry). For each word\n     it does ldr r1, [r3, r2]; cmp\
  \ r1, #0; beq skip; add r0, #1; skip. So r0 tallies the\n     number of non-zero u32 words inside that\
  \ single 0x20-byte entry.\n  4. Returns r0 via pop {pc} (function is called with bl, so the linker's\
  \ pc is restored as the\n     return address; this is a Thumb-1 \"leave function\" pattern with push\
  \ {lr}/pop {pc}).\n  5. The sole caller battle_object_teardownAndFree_80E06E0 is invoked as the per-object\n\
  \     teardown callback while freeing memory; the returned count (0x03 in all six captured\n     calls)\
  \ represents how many of the 8 words in this Next-entry slot are non-zero, likely\n     \"live\" references\
  \ that still need unlinking before the object is freed.\n"
