open_questions:
- Exactly which u32 fields of a Next-entry the function is intended to count (any non-zero
- vs. only "active object pointer" words) is not determinable from this routine alone; the
- convention is inferred from the teardown/free context in the sole caller.
- Whether the return value is "number of live references to unlink" or a more general
- '"populated-words count" could be settled by reading battle_object_teardownAndFree_80E06E0'
- to see how it uses the returned r0.
