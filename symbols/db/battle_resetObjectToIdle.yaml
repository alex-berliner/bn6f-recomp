open_questions:
- No callers are known, so the trigger context (spawn, post-knockback recovery, or despawn) is unconfirmed
- The meaning of CurAction value 1 (idle/stand?) and battle mode 6 come from other code, not this function
- Whether sub_801DC7C with 0,0 hides the status entry rather than clearing it needs its own analysis
- The alliance condition is inverted in the proposal. The asm does `cmp r0,#6; beq loc_8016594` (clear
  if mode==6) then `eor r0,r1; beq loc_801659C` (skip if alliance==player side). So sub_801DC7C is called
  when mode IS 6 OR the object is on the opposing side, not the player side as stated. The rest of the
  description (clear invulnerable time, release panel reserve at FuturePanelX/Y, set collision region
  to 1, CurAction=1, CurPhaseAndPhaseInitialized=0) matches the code.
