name: battle_resetObjectToIdle
address: '0x0801657E'
kind: function
status: probable
summary: Resets a battle object to its neutral standing state, clearing its battle-status list entry when
  applicable, and post-hit invulnerability, panel reserve, collision region, action, and phase fields.
interface: (r5 = battle object pointer; r10 = toolkit) -> r0 = destroyed; flags from alliance check
details: Reads the battle mode; if it is not mode 6 and the object's alliance matches the player's side
  (oBattleState_PlayerSide), it claims a battle-status list slot at 0x203EB50 via sub_801DC7C with name
  ID 0 and HP 0, effectively blanking the object's status entry. It then clears the object's post-hit
  invulnerability, releases any reserved panel (using FuturePanelX/Y), and sets its collision region to
  region 1. Finally it writes CurAction = 1 and zeroes CurPhaseAndPhaseInitialized, putting the object
  back into action 1 at phase 0.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl GetBattleMode; cmp r0,#6 gates the status-list update on mode and alliance (eor with oBattleState_PlayerSide);
    bl sub_801DC7C called with r0=0, r1=0, i.e. blank name ID and HP for the status UI slot; bl object_clearInvulnerableTime
    and bl object_removePanelReserve undo transient hit/occupancy state on r5''s object; mov r0,#1; bl
    object_setCollisionRegion restores collision region 1; strb #1 to oBattleObject_CurAction and strh
    #0 to oBattleObject_CurPhaseAndPhaseInitialized restart the object''s action state machine at its
    first action'
