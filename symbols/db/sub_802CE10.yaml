open_questions:
- Exact sizes and meanings of the two 0xc-byte records at dword_203CFB0/203CFBC remain guessed; offset 2 may be
  a running sum, offset 0 a stored max, offset 8 the last attacker; no defined struct covers this layout.
- Whether offset 0 is a panel-by-panel stash like `PanelDamage1` (0x82 of CollisionData) or the upper-bound for
  the eS20364C0 Extra record that `object_calculateFinalDamage1` also touches at 0x40/0x44 is not confirmed by assembly
  alone.
- The 40 captured calls are all with r0=0 (just before the add) so the return value isn't exercised; the helper-merging
  is inferred from the surrounding caller summary.
