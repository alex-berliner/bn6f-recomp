name: sub_802CE10
address: '0x0802CE10'
kind: function
status: hypothesis
summary: Updates one side's battle counter for the object's alliance, either adding the tracked object's stored
  increment to the given value or raising the counter's recorded maximum.
interface: u32 battle_updateSideCounter(u32 amount /*r0*/, BattleObject *object /*r5*/); // returns updated amount
  in r0 and the counter block's tracked-object pointer in r2; clobbers r1, r3 and NZCV flags
details: 'Reads the counter block at dword_203CFB0, selecting the base block for the player side or the +0xC block
  when the passed battle object''s oBattleObject_Alliance byte is nonzero (allied/partner side). The block layout
  is: +0 u16 recorded value, +2 u16 increment, +8 pointer to the object currently tracked by the counter. If r5
  is the tracked object, its stored halfword increment at +2 is added to r0 and returned; otherwise r0 is treated
  as a candidate value and overwrites the halfword at +0 only when it is larger (max-raising), then is returned
  unchanged. The tracked object pointer (r2) is passed back to callers in both paths. This looks like a shared per-side
  gameplay gauge (value cap with a per-object contribution), but which in-game meter this serves is not confirmed
  from this function alone.

  '
