name: sub_802CE10
address: '0x0802CE10'
kind: function
previous_names: []
status: hypothesis
summary: Adjusts an attacker's per-panel damage against its own battle object depending on alliance, returning the
  final per-panel damage value when the attacker is the current battle object.
interface: '(r0 = damage value to fold in, r5 = current BattleObject*) -> r0 = damage value (may be summed into
  FinalDamage for self, or stored as PanelDamage1 if r5 differs); side effects: writes FinalDamage for ally or PanelDamage1
  for enemy in eS20364C0 Extra'
details: "- Loads a pointer to a small record in EWRAM at dword_203CFB0 (ldrb r1, [r1+#8] is read at `ldr r2, [r1,#8]`),\
  \ then checks `oBattleObject_Alliance` (offset 0x16) of the current object (r5) at `ldrb r2, [r5,#0x16]`.\n  -\
  \ If r5 is the enemy/allied record (non-zero Alliance), it shifts to a sibling record by adding 0xc (`add r1,\
  \ #0xc`).\n  - Compares r5 to the recorded attacker pointer stored at +8 of that record (`ldr r2, [r1,#8]` / `cmp\
  \ r5, r2`). When it matches the current object, it adds the supplied u16 (r0) to the running u16 at +2 (`ldrh\
  \ r3, [r1,#2]`, `add r0, r0, r3`) and returns it via `mov pc, lr`, letting the caller store the cumulative damage\
  \ to FinalDamage.\n  - When r5 does not match, it checks if the new damage value (r0) exceeds the running max\
  \ at +0 of that record (`ldrh r3, [r1]`); `bls locret_802CE2E` skips the store and otherwise writes the new value\
  \ via `strh r0, [r1]`. The +0 field therefore holds the largest per-panel damage observed for non-self attackers,\
  \ used to keep a PanelDamage1-style stash.\n  - The companion `CalculateFinalDamage1` caller sums five panel damage\
  \ entries and uses this helper to fold them in (per its summary: \"Sum the five panel-damage entries of a battle\
  \ object's CollisionData into FinalDamage, halving each entry (rounding up) if the object stands on a holy panel\"\
  ).\n  - The captured snips show the function being invoked from a final-damage loop where r0 is reset to 0 between\
  \ panels, so the cumulative r0 return is the panel total being merged; the +0 stash is also seen taking higher\
  \ per-panel values.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldr r1, off_802CE50 // =dword_203CFB0` — base record lives in EWRAM. - `ldrb r2, [r5,#oBattleObject_Alliance]`
    reads r5''s alliance byte at the known BattleObject offset 0x16 to choose between two record variants (r1 or
    r1+0xc). - `ldr r2, [r1,#8]` / `cmp r5, r2` — slot 0x8 holds the most-recent attacker BattleObject* for that
    alliance. - `ldrh r3, [r1,#2]` / `add r0, r0, r3` on match — accumulates damage into the running total for the
    current attacker when it matches r5. - `ldrh r3, [r1]` / `cmp r0, r3` / `strh r0, [r1]` — keeps a max non-self
    damage value at offset 0. - Sole confirmed caller `object_calculateFinalDamage1` (0x0800e3de) passes r5 = current
    BattleObject and r0 = a per-panel damage value folded into FinalDamage.'
