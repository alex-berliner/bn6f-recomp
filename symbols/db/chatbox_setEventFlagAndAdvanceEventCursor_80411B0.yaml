name: chatbox_setEventFlagAndAdvanceEventCursor_80411B0
address: '0x080411B0'
kind: function
status: confirmed
summary: Sets the event flag whose id is passed in r0, then steps the r4 event-script cursor forward by one 4-byte
  entry.
interface: chatbox_setEventFlagAndAdvanceEventCursor(u32 flagId /* r0 */, void* eventCursor /* r4 */, void* ctx
  /* r10 */); returns garbage in r0/r1/r3 (whatever SetEventFlag leaves), updated cursor in r4, flags from "add
  r4,#4"
details: "Tiny event-script helper, likely an opcode handler or scripted-flag step in the chatbox/event\ninterpreter.\
  \ It does exactly two things:\n  1. tail-calls SetEventFlag with r0 (the event flag id to mark as done/triggered).\n\
  \  2. adds 4 to r4, which the verified C treats as a cursor into a list of 4-byte event\n     entries — i.e. it\
  \ advances to the next scripted command/entry.\nNothing is pushed except lr; the function is essentially \"SetEventFlag\
  \ + cursor bump\" and\nreturns immediately via pop {pc}.\nCallers are expected to pass r10 as well, so SetEventFlag\
  \ (or the surrounding event context)\nevidently consumes r10; this function itself never touches r10 explicitly.\n\
  r0/r1/r3 on exit are just whatever SetEventFlag happened to leave in them — callers per the\ncontract do read\
  \ them back, but they carry no meaning assigned by this function. NZCV come\nfrom the trailing \"add r4,#4\",\
  \ not from the flag-setting result.\nThe flag id in r0 is the GBA-style event flag bit index used by SetEventFlag.\n"
