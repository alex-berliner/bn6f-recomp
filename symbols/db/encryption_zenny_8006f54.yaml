name: encryption_zenny_8006f54
address: '0x08006F54'
kind: function
status: confirmed
summary: Re-encrypts the player's zenny counter, updating both the encrypted wallet value and its anti-tamper inverted
  mirror in the game state.
interface: void encryption_reencryptZenny_ADDRESS(void); /* reads toolkit from r10, preserves r0-r7, clobbers nz
  */
details: 'No-argument helper that fetches the toolkit pointer from r10, then reads the game state via oToolkit_GameStatePtr.
  Takes the plaintext zenny amount from oGameState_ProtectedZenny. If bit 0 of oGameState_Unk_74 is clear, writes
  the bitwise NOT of the amount (~zenny) into oGameState_Unk_6c — a checksum-style mirror used to detect memory
  tampering with the wallet. Finally XORs the plaintext amount with the global obfuscation key stored at dword_2000060
  (pointer read from that address, then dereferenced) and stores the encrypted result into the u32 pointed to by
  oToolkit_Unk2005028_Ptr. All r0-r7 are pushed/popped so the caller''s registers are untouched; flags nz are clobbered
  by the tst/eor sequence.

  '
