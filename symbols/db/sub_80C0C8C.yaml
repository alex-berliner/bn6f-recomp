name: sub_80C0C8C
address: '0x080C0C8C'
kind: function
status: confirmed
summary: Clears a flag in the caller's battle-object extra vars (byte 4) and then frees the object.
interface: void battleObject_freeAndClear_80C0C8C(u32 /*r5*/ battleObj); returns nothing; clobbers r0-r3, lr, N
  Z C V; preserves r5.
details: 'Takes a battle object pointer in r5. Reads a pointer at offset `oBattleObject_ExtraVars+4`

  from that object, writes a single zero byte (u8) at that address (clearing a per-object

  flag/stage byte), then calls object_freeMemory to release the object''s memory.

  r5 is preserved across the call so the caller can keep using the same object pointer

  afterwards.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
