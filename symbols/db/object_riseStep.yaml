name: object_riseStep
address: '0x080D61FC'
kind: function
status: probable
summary: Increments Param2 and subtracts it from both Z16 and Y16 so the battle object rises with an accelerating
  offset; called repeatedly as the vertical component of other object motion actions.
interface: (r5 = battle object ptr, reads Param2) -> updates oBattleObject_Param2, Y16, Z16; no return
  value
details: Increments the object's Param2 (step counter), then subtracts (Param2+1) from both Z16 and Y16,
  so the object rises with an accelerating offset — the upward half of a hop trajectory. Called repeatedly
  by object_hopSidewaysAction, which hops the object sideways 5 times before destroying it, so this supplies
  the vertical component of each hop. No flags or return value are used.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_Param2]; add r0,#1 then sub from Z16 and Y16 — accelerating upward
    motion per call; caller object_hopSidewaysAction hops object sideways 5 hops then destroys it, matching
    a repeated arc-lift helper; tables byte_80D6210/byte_80D6214 (0,16,5,10,15,20...) near the function
    look like hop timing/offset data used by the same handler
  refs:
  - bn6f/asm/asm31.s:66208
  - 0x080D60BC object_hopSidewaysAction
  - 0x080D5F2C sub_80D5F2C
  reproduce: python3 tools/asmcat.py 0x080D61FC
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code at sub_80D61FC matches: it increments oBattleObject_Param2 (line 3), then subtracts that
    incremented value from both Z16 and Y16 (lines 6, 9), matching the described accelerating rise. The
    summary is accurate, but the name ''object_hopLiftStep'' is slightly misleading since the function
    handles a generic increment-and-rise step used by object_hopSidewaysAction (and possibly sub_80D5F2C),
    not exclusively hops. A name like ''object_riseStep'' better reflects that it only does the vertical
    (Z+Y) lift increment without horizontal motion.; run wf investigate investigate-20261019-030611; proposed
    by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
