name: battleObject_collisionProjectRay_8031048
address: '0x08031048'
kind: function
previous_names:
- sub_8031048
status: probable
summary: A small tail routine for the line/point hit-test helpers that returns the projected (dx, dy)
  along a ray, with both components made positive (the ray is normalized so the longer axis of (r6, r7)
  goes into r7 and the shorter remains in r6).
interface: (r6 = |dy|, r7 = |dx|, r2 = scratch, r3 = sign) -> r6 = shorter-leg remainder, r7 = longer-leg
  steps; pushes/pops {r2, r3, lr} and returns via `pop {pc}`.
details: "- Saves r2/r3/lr on the stack. Clears r2 and r3.\n  - If r7 == 0 it jumps to the final fold.\
  \ Otherwise it forces r6, r7 to be non-negative; for each input that is negative it negates it and flips\
  \ r3 with `mvn r3, r3` (so r3 ends up as 0 if both inputs were already non-negative, 0xFFFFFFFF if both\
  \ were, and the mixed case never arises given the call sites).\n  - Runs a classic Bresenham-style \"\
  subtract the smaller axis\" loop at loc_8031062: while r6 < r7 it does `r6 = r6 - r7; r2 += 1;` (and\
  \ on the next iteration, `r6 = r6 - r7` becomes `r6 = r6 + r7` after the swap) so r2 accumulates how\
  \ many r7-width steps fit into r6. The loop exits when r6 >= r7.\n  - At the bottom it stores the step\
  \ count back into r7 and, if r3's sign-bit is set (mvn result), negates both r7 and r6 so the magnitudes\
  \ are returned in the standard positive form. The result is returned through r6 (shorter leg) and r7\
  \ (longer leg / step count); r0/r1 from the caller are preserved because the function uses its own push/pop\
  \ of r2/r3 around the body.\n  - This is a leaf helper called immediately after the line-vs-point and\
  \ line-vs-wedge intersection tests in sub_8030E14, sub_8030E8C, sub_8030F04, sub_8030F7C, and is responsible\
  \ for converting the raw (rx, ry) returned by those tests into the normalized \"delta along the ray\"\
  \ form that the callers then store at +0x04 / +0x14 in the destination object buffer.\n"
