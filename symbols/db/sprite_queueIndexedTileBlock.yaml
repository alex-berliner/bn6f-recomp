name: sprite_queueIndexedTileBlock
address: '0x080281E4'
kind: function
status: probable
summary: Copies the 128-byte (8-tile) graphics block at index r0 from the ROM array byte_8725894 into
  VRAM slot r1 at 0x0600A4A0 via a queued transfer.
interface: (r0 = source block index into byte_8725894, r1 = destination slot index in 0x0600A4A0 VRAM
  tiles) -> r0 = trashed (callees), no return value
details: 'Both arguments are scaled by 0x80 (128 bytes, i.e. 8 4bpp 8x8 tiles), so the function is an
  indexed loader: r1 selects which 8-tile slot in the VRAM region starting at 0x0600A4A0 to overwrite,
  and r0 selects which 8-tile entry of the fixed ROM table at byte_8725894 (0x08725894) to copy. It then
  calls QueueEightWordAlignedGFXTransfer with (rom_src, vram_dest, size), which queues a DMA-style transfer
  aligned to 32 bytes. It is symmetric in that both indices use the same 0x80 stride, so the ROM table
  is evidently laid out in matching 128-byte entries. The fixed bases suggest this is a small swap-in
  tile region (e.g. an icon/figure set) rather than a general sprite loader.'
