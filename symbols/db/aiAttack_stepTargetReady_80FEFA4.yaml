name: aiAttack_stepTargetReady_80FEFA4
address: '0x080FEFA4'
kind: function
status: confirmed
summary: 'AI attack sub-step handler: initializes the attack on first call, checks whether the target
  (via scratch pointer or ai-attack-param pointer) has its ''ready'' byte set, and otherwise advances
  the sub-step counter while selecting a hit-element value.'
interface: aiAttack_stepTargetReady_80FEFA4(void) -> r1:u32, r5:u32 /* r5=battleObject*, r7=aiAttackVars*,
  reads r1 as passthrough/return */
details: 'The AI attack variables struct (pointed to by r7) carries oAIAttackVars_AttackElement, _ScratchVar,
  _AiAttackParam, _SubStepIndex, _TimerOrCycles, _PanelParamFlags2, and _HitElement. On the very first
  invocation AttackElement is still zero; the handler stamps it with 4, sets the battle object''s oBattleObject_CurAnim
  to 8 (the attack-anim slot), and delegates the rest to aiAttack_runStepTwice_80FF680. On subsequent
  calls it two-phase-checks target readiness: first the pointer stored in oAIAttackVars_ScratchVar (dereferenced,
  byte+6 non-zero means ready), then oAIAttackVars_AiAttackParam (same byte+6 test). If either is ready
  it writes 1 to oAIAttackVars_PanelParamFlags2 and returns, passing r1 through unchanged. If the param
  pointer is null the handler increments oAIAttackVars_SubStepIndex, compares it against oAIAttackVars_TimerOrCycles,
  and picks oAIAttackVars_HitElement: 0xC while still cycling and not yet flagged, 0x14 once the sub-step
  count is exhausted or PanelParamFlags2 is already set. r1 receives TimerOrCycles in that last branch
  (effectively a sub-step-limit return value); in every other path r1 is untouched. r5 is always preserved.'
