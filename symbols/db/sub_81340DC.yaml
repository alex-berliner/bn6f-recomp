name: sub_81340DC
address: '0x081340DC'
kind: function
status: hypothesis
summary: Runs an update routine on some battle data, then snaps the sprite of battle struct slot 3 to screen position
  (0xC0, 3) if that slot is occupied.
interface: void sub_81340DC(void) /* r2,r3 pass through to sprite_setCoordinates; r4-r7 preserved */
details: 'First calls sub_80465A0 with byte_813314C as its argument (some per-frame update/step routine on a data
  blob at 0x0813314C). Then reads battle struct slot 3 via getStructFrom2008450 (r0=3); the returned pointer lands
  in r1 and null means the slot is empty (tested with beq). If the slot is occupied, calls sprite_setCoordinates
  with r0=0xC0, r1=3, the struct in r5, and the caller''s r2/r3 passed through untouched. The fixed coordinate (0xC0,
  3) suggests slot 3 is a battle entity being pinned to a set position each frame (an offscreen/parking spot, or
  a fixed UI/actor slot). r4-r7 are pushed/popped purely to match the original''s callee-save discipline; nothing
  else is read from them.

  '
