summary: Writes the given x/y/z values into the overworld player's coordinate fields in the eStruct200ace0 struct.
interface: void owPlayer_setPlayerCoords_809e1a4(int x /*r0*/, int y /*r1*/, int z /*r2*/); returns r3 = &eStruct200ace0
details: 'Stores r0/r1/r2 into eStruct200ace0''s PlayerX, PlayerY and PlayerZ fields (at +0x8,

  +0xC, +0x10 respectively; PlayerX has no offset macro and uses the raw 0x8).

  Tail-writes the struct pointer into r3 before returning, so callers receive the

  struct address even though the function''s main job is only the three stores.

  Flags are untouched; the routine is a plain three-word store with no validation

  or coordinate clamping.

  '
