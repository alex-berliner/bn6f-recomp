name: battle_setEntryFieldAndAIDataFlag
address: '0x0802E62A'
kind: function
status: probable
summary: Writes a halfword into a 0x1D0-byte battle record, conditionally sets event flag EVENT_2020+value
  with a save re-encryption, and raises flag 0x10000 in the player's AI data word 0x44.
interface: (r0 = record index, r1 = halfword value, r2 = suppress-flag) -> r0 = 1; r1..r3, r4-r7 clobbered
details: Computes record r0 of the 0x1D0-stride array at unk_2036120 and stores r1 (halfword) at record+0x34,
  so it is a 16-bit counter/value field. If both r0 == 0 and r2 == 0, it calls SetEventFlag with EVENT_2020
  + r1 — the record index 0 is a trigger case where the stored value also selects which story/event flag
  gets set — then calls encryption_80070bc to re-encrypt the save after the flag change. Unconditionally
  afterwards it calls battle_findPlayer(0) to get the player's battle object and passes 0x10000 to SetAIData_Unk_44_Flag,
  OR-ing bit 0x10000 into the AI-data word at +0x44 (a battle-scoped effect tied to the record update,
  since a local event flag is only set in the guarded path). Always returns 1.
