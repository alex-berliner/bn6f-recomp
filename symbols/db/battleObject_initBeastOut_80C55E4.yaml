status: probable
summary: Initializes a beast-out battle object's sprite/animation and sets up its collision data so it
  transitions into the update state.
interface: (r5 = battle object) -> r0 = collision setup result ; sets obj.CurAnim=0, CurState=CUR_STATE_UPDATE,
  panels/collision and links to a parent object via RelatedObject1Ptr
details: 'Loaded with sprite_load(r0=0x80, r1=0x10, r2=0x1C) and sprite_noShadow, then ORs in OBJECT_FLAG_VISIBLE
  (0x02) into

  oObjectHeader_Flags (the 0x1C tile size hints at the wide beast-run sprite). Sets CurAnim=CurAnimCopy=0
  via

  sprite_setAnimation, calls sprite_loadAnimationData, sprite_setPalette(0), sprite_setFlip(object_getFlip()).

  Recomputes panel coordinates, allocates a CollisionData slot with object_createCollisionData — and if
  that

  allocation fails (tst r0,r0; bne) the function immediately frees the object via object_freeMemory and
  returns.

  On success, fills collision data with object_setupCollisionData(r1=4, r2=5, r3=3), sets the hit-effect
  to

  0xFF (sentinel) and clears the object''s collision region before calling object_presentCollisionData
  to put

  it into the active collision list. Finally writes CurState = CUR_STATE_UPDATE and stores

  RelatedObject1Ptr->objectHeader+1 (= parent object ptr) into the next-word slot of the parent header,
  then

  jumps into sub_80C5654 (the per-frame update body). Two `pop {pc}` returns exist: the early failure
  path

  skips state setup, the normal path pops after sub_80C5654 returns.

  '
