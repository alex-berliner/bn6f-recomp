name: sub_811A640
address: '0x0811A640'
kind: function
status: confirmed
summary: Dispatches submenu input to the action handler matching the current selection (with a special case for
  d-pad up).
interface: 'void sub_811A640(void);

  // inputs:  r5 (submenu entity), r10, lr (return)

  // outputs: r5, r10, r11; preserved r4-r7

  // clobbers: r0, r1, r2, r3, r8, r9, r12, lr; flags N Z C V

  // dispatches with r0 = handler entry (Thumb) or joyDir for up,

  //         r1 = (u8)(r5+6),

  //         r7 = &sSubmenu

  '
details: "Reads the open submenu struct at sSubmenu:\n  - sSubmenu.jo_01 (offset 1): the pressed d-pad direction.\n\
  \  - sSubmenu.unk_02 (offset 2): the currently highlighted row, used to\n    index the handler table at dword_811A66C.\n\
  If jo_01 == 0x1C (d-pad up) it calls sub_811A704 directly with the\njoypad byte in r0 and the submenu entity id\
  \ byte in r1.\nOtherwise it loads a Thumb function pointer from dword_811A66C[unk_02]\nand, if non-zero, calls\
  \ it via `bx` (the LR trick + pop {pc} tail).\nTable entries 0 is the sentinel \"no action\"; entries 1-4 map\
  \ to\nsub_811A68C/6A0/6B4/6C8; entries 5-7 all reuse sub_811A6DC.\nEach handler receives its own table-entry address\
  \ as r0 (a Thumb\naddress with bit0 set), an entity-related byte at (r5+6) as r1, and\nthe sSubmenu pointer as\
  \ r7.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed;\
  \ tools/abi/retype_queue.tsv)."
