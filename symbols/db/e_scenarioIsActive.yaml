  date: '2026-10-19'
  detail: bl getField0x18OfScenarioEffectState2000780_81421e0 loads the id being searched for; loop reads
    ldrh r0,[r5,#4] and compares to r7, stride 8, 0x14 iterations; entry +4 == 0 is skipped (tst/beq),
    so 0 is a 'no id' sentinel; r6 set to 1 on match and loop breaks early; r0 = r6 returned as bool;
    no callers known, so purpose is inferred only from callee and table shape
