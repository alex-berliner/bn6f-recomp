name: e_scenarioIsActive
address: '0x08142AB0'
kind: function
status: probable
summary: Returns whether the current scenario id (field 0x18 of the scenario effect state) appears in
  the 20-entry table at byte_2006670.
interface: () -> r0 = 1 if found, 0 if not; flags clobbered
details: Calls the getter at 0x81421E0 to read field 0x18 of the scenario effect state struct at 0x2007800,
  giving the 'current' id in r7. It then walks a table at byte_2006670 of 0x14 entries of 8 bytes each,
  comparing each entry's halfword at +4 against that id; entries whose +4 halfword is 0 are skipped. If
  any entry matches, it sets a found flag (r6) and stops scanning early. Returns the flag in r0. The +4
  halfword looks like an id field, so byte_2006670 is likely a list of registered/active scenario effect
  entries.
