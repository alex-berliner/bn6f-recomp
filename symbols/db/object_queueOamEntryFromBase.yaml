name: object_queueOamEntryFromBase
address: '0x0802B270'
kind: function
status: probable
summary: Thin wrapper that queues one OAM entry for the object in r5 using a fixed tile base (0xB370)
  and fixed attribute constants, with the sub-index/position read from the object's fields.
interface: (implicit r5 = object ptr; r2 = [r5+0x1E], r3 = [r5+0x24]) -> queues one OAM entry via object_computeAndQueueOamEntry_811FA98;
  no return value used
details: The function is a 20-instruction stub that loads constants and tail-calls the known OAM helper
  object_computeAndQueueOamEntry_811FA98. It passes r0 = 0x0062000C (0x62 shifted into the upper half,
  OR'd with 0xC — likely packed palette/shape/size attributes), r1 = 0x10002 (attribute flags), r4 = 7,
  r6 = 0xB370 (base tile index) and r7 = 0x48. The only per-object data comes from r5, which is not set
  inside the function, so callers must place the object pointer in r5 before the call; fields +0x1E and
  +0x24 (halfwords, likely frame/sub-index and x/y or flip data) feed the tile computation. Everything
  else is hardcoded, so this draws one specific sprite whose appearance varies only through those two
  object fields.
