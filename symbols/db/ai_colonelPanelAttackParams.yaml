  date: '2026-10-18'
  detail: 'body is only ldr r0,=byte_8101580; bl sub_800FE28; pop {pc} — r0 is the sole input, the table
    is the only payload; byte_8101580 = 1E 18 10 0C: four descending values fitting a 4-tier difficulty
    lookup; only caller is ai_initColonelPanelAttack at 0x081016FE, which sets difficulty-tier state and
    a panel-choose callback before starting attack 0xD; sub_800FE28 is the sole callee and receives the
    table pointer, so the table''s meaning is defined by that routine'
