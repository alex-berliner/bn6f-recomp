name: ai_colonelPanelAttackParams
address: '0x08101570'
kind: function
status: probable
summary: Tail-calls sub_800FE28 with the address of the 4-byte table at byte_8101580 ({0x1E,0x18,0x10,0x0C}),
  as part of Colonel's panel-attack setup following ai_initColonelPanelAttack.
interface: () -> r0 = pointer to byte_8101580 passed to sub_800FE28; no other registers used, flags not
  meaningful
details: 'A tiny thunk: it overwrites r0 with the address of a 4-byte constant table {0x1E,0x18,0x10,0x0C}
  and tail-ish calls sub_800FE28 with it. The table is indexed by nothing here, so sub_800FE28 (or its
  caller chain) presumably selects one of the four values by the difficulty tier that ai_initColonelPanelAttack
  set up. Given the caller context (Colonel AI attack with a panel-choose callback and difficulty-tier
  state), the values most plausibly tune that attack per difficulty — e.g. a timer, panel count, or step
  delay — but the semantics live in sub_800FE28, which is undocumented here.'
