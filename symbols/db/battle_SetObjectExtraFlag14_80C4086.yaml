name: battle_SetObjectExtraFlag14_80C4086
address: '0x080C4086'
kind: function
status: confirmed
summary: Sets a flag word (value 1) at offset +0x14 of a battle object's ExtraVars block; safe no-op on a null object
  pointer.
interface: void battle_SetObjectExtraFlag14(BattleObject* obj /* r0 */)
details: 'Tests r0 and returns immediately if null. Otherwise stores the constant 1 as a 32-bit word at BattleObject
  + oBattleObject_ExtraVars + 0x14, i.e. a boolean-style flag within the object''s extra-vars block. Clobbers r1
  and the NZ flags only; lr is used as the return address (mov pc, lr), so it is a plain tailless helper. Callers
  per the contract pass only the object pointer and read nothing back. What gameplay state this flag gates is not
  evident from the function itself, hence the neutral field-offset name.

  '
