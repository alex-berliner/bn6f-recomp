name: drawCodedChipRow_8047664
address: '0x08047664'
kind: function
status: confirmed
summary: 'draws a coded chip row: the name from the banked chip-name tables, then its code letter'
interface: 'static void draw_coded_chip_row(u32 slot, u32 chip, u32 code, u32 has_code, u32 menu); adapter: in r0
  = slot, r1 = chip id (bank << 8 | index), r2 = code letter, r3 = has-code flag, r5 = screen state, r7 kept; out
  r0/r5/r7 restored, r6 keeps the render''s leftover'
details: 'The name comes from TextScriptChipNames0 or TextScriptChipNames1 (bank = chip >> 8, selected through the
  table at off_80476E4) at index chip & 0xFF, eight tiles into the row''s slice of eDecompBuffer2013A00 / 0x6008400.
  The code column gets one tile of TextScript86EF71C: the code letter, unless the chip has no code (r3 zero), or
  the view word (menu+0x1C double deref) is 2 (library) and neither event flag chip+0x1E20 nor chip+0x2420 is set
  — both cases give the no-code letter 0x1B.

  '
