summary: 'PET/Navi-select start-screen per-frame tick: advances an init timer, then on maturity loads
  GFX anim scripts, spawns eStruct records, and finally queues corner OAM, replays sprite frames, updates
  the cursor pulse, initialises PET comm-save slots, and scrolls/redraws the BG (with the Navi overlay
  redraw only after the init phase finishes).'
interface: (r5 = startScreen state scratch, r10 = toolkit) -> side effects only; clobbers scratch regs
  as listed
details: 'Reads the s16 init counter at r5+0x10, adds 4, and stores it back (`add r0,#4 ; strh r0,[r5,#0x10]`).

  If the new value is still negative (`blt loc_811ED8E`) it skips the init block and jumps to the per-frame
  work.

  In the init block it runs `LoadGFXAnim(byte_811EA68)` then `LoadGFXAnim(byte_811EAB8)` (two GFX anim
  scripts), zeroes the init counter (r5+0x10), clears r5+0x9 and r5+0xe, sets r5+0xd = 2 and r5+0x0 =
  4 (looks like a sprite anim slot reinit), then `battle_spawnEStructRecordsFromTable_80465A0(byte_811EB78)`
  to spawn a 0xFF-terminated (id, slot, param) table.

  Always-on work: `startScreen_queueFourCornerArrows_811F1B8`, `replaySpriteFrames_811F24C`, `battle_updateCursorPulsate_811F0C8`,
  `petCommSaveInit_811F11C`, `CopyBackgroundTiles_PET_811EF70`.

  If the s16 r5+0x10 is >= 0 it also calls `CopyBackgroundTiles_onNaviSelect_811F54C`, so the "Navi overlay
  row swap-in" only happens after the init counter wraps to non-negative (i.e., exactly once after init
  resets the timer to 0, exactly as the callee''s summary says: "when a Navi is selected").

  The callee names (queueFourCornerArrows / replaySpriteFrames / updateCursorPulsate / CopyBackgroundTiles_onNaviSelect
  / CopyBackgroundTiles_PET) and the byte_811EB78 table referenced by the spawn call all fit `eStruct`-driven
  PET screen chaff (corner arrows, cursor, BG redraw), consistent with the start-screen / PET-menu subsystem.
  `eS20047CC` carries an `Unk_56..Unk_60` cluster of small scalars matching the r5 writes seen here (0x0,
  0x2, 0x4 at offsets 0x9, 0xd, 0x0/0xe), reinforcing r5 as start-screen scratch.

  '
