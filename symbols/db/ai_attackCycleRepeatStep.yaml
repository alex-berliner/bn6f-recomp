    with r0=1, r1=5 (attack impact feedback); loc_8106138: decrements StepTimer, calls sub_8106660, decrements
    TimerOrCycles, resets AttackElement=0 to repeat; fallthrough: when TimerOrCycles hits 0, strh 0x14
    into HitElement'
