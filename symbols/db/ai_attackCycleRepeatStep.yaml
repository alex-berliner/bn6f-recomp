name: ai_attackCycleRepeatStep
address: '0x0810610A'
kind: function
status: probable
summary: 'One step of a boss AI attack: telegraphs (anim + camera shake), strikes a target panel repeatedly
  over several cycles, then marks the hit element 0x14.'
interface: (r7 = AIAttackVars struct, r5 = battle object) -> void; sets oAIAttackVars fields, calls camera
  shake and panel helpers
details: On entry with AttackElement==0 it latches state 4, picks one of two animations (0x1B/0x1C) from
  byte_8106160 indexed by bit0 of TimerOrCycles, obtains target panel X/Y via the Falzar panel-state helper
  sub_81065A8 (stored into TargetPanelX/Y), triggers a camera shake (magnitude 1, duration 5), and arms
  StepTimer=5. While AttackElement!=0 it counts StepTimer down; each expiry it calls sub_8106660 (presumably
  the strike effect) and decrements TimerOrCycles, resetting AttackElement to 0 to loop the sequence.
  When the cycle counter reaches 0 it writes HitElement=0x14, ending the attack. The two-entry animation
  table and parity indexing suggest alternating visuals per repetition.
