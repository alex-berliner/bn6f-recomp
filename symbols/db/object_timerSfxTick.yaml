  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#0xc]; sub r0,#1; strb; bne return — a 16-frame repeating countdown gated at 0xC;
    ldr r0,=0x1CD and mov r0,#0xF7 both feed PlaySoundEffect on expiry; mov r0,#0xF; strb r0,[r5,#0xc]
    reloads the tick period after each fire; cmp byte [r5+4],1 / beq bl sub_811D5F8 selects an alternate
    expiry path; bic bit1 of [r5] and add #5 to [r5+5] mutate object flags and an accumulator on the normal
