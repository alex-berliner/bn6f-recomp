name: object_timerSfxTick
address: '0x0811CDF4'
kind: function
status: probable
summary: Every-16-frame countdown tick that plays two sound effects and updates the object's state fields
  when the timer expires.
interface: (r0 unused on entry; r5 = object/state struct) -> void; modifies [r5+0x0] bit1, [r5+0x5], [r5+0x9],
  [r5+0xC]
details: Decrements the byte counter at [r5+0xC]; while it is nonzero it returns immediately, so the body
  runs once every 16 frames. On expiry it resets the counter to 0xF and writes 8 to [r5+0x9], then plays
  sound effect 0x1CD and 0xF7. If the byte at [r5+0x4] equals 1 it instead calls sub_811D5F8 for the expiry
  behavior; otherwise it clears bit 1 of the flags byte at [r5+0x0] and adds 5 to the counter at [r5+0x5].
  The +5 increment suggests a cumulative accumulator (e.g. steps or units gained per tick). Two SFX per
  expiry plus a state reset look like a repeating alarm/period signal driven by an object update.
