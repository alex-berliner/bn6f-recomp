name: get_eLinkDiffState
address: '0x0803F158'
kind: function
status: probable
summary: Returns a 3-way wrapped-difference status (0 if small, 1 if diff >= 6, 2 if equal) between two
  bytes (+3 and +1) of the eLink state block at byte_200AC20, for the link state handler at sub_803EC54.
interface: () -> r0/r1 = status (0, 1, or 2); flags from tst/cmp in callers
details: 'Reads bytes at 0x200AC23 and 0x200AC21 (fields of the byte_200AC20 state block), computes their
  difference, and wraps it modulo 8 by adding 8 when negative. If the difference is zero it returns 2;
  if the (wrapped) difference is >= 6 it returns 1; otherwise 0. The only caller stores this status at
  [r5,#9] and branches: status 0 or 1 leads to a path calling get_eLinkStateUnk24/get_eLinkStateUnk38,
  status 2 takes a separate path. The +8 wrap and threshold of 6 over an 8-wide range look like a ring-buffer/sequence-counter
  lag check between two linked-GBA counters, but the meaning of the two counter bytes themselves is not
  shown here.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_803F158 ldrb r0,[r5,#3] / ldrb r1,[r5,#1] then sub r0,r0,r1 — compares the two counter
    bytes of byte_200AC20; asm adds 8 on negative diff and returns 1 when cmp r0,#6 blt fails, 2 when
    diff is 0, else 0 — a 3-way classification of a mod-8 difference; caller sub_803EC54: bl sub_803F158;
    strb r1,[r5,#9]; tst r1,r1; cmp r1,#2 beq — result is a state byte steering two branches; caller continues
    with get_eLinkStateUnk24/get_eLinkStateUnk38, tying this byte_200AC20 block to the link/eLink state
    code'
