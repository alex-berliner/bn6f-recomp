name: NPCCommand_shift_center
address: '0x0809EE32'
kind: function
status: confirmed
summary: NPC script opcode that sets the NPC's center offset (X/Y/Z) from a 3-byte inline payload, used to shift
  the NPC's anchor/interaction point in the overworld.
interface: void NPCCommand_shift_center(r5 = OverworldNPCObject*, r6 = script data ptr); outputs r0 = center offset
  Z (sign-extended s8), r1 = 3, r6 advanced by 4, flags NZCV set by (old r6 + 4)
details: 'Script-interpreter command handler for overworld NPCs. It treats r6 as the

  pointer into the NPC''s bytecode stream at this command''s opcode byte, loads

  three signed bytes (offsets +1/+2/+3 = X, Y, Z payloads), and stores them

  into the NPC object at oOverworldNPCObject_CenterOffsetX/Y/Z. These fields

  offset the NPC''s "center" point, which the overworld engine uses for

  positioning-dependent behavior (e.g. the point the player interacts with /

  camera or talk anchor is computed from). The handler then advances the

  script pointer by 4 (1 opcode byte + 3 payload bytes) via an add that sets

  flags. Values are read with ldrsb, so offsets are signed (-128..127) and

  sign-extended to bytes when stored. Side effects left for the caller:

  r0 holds the last value read (Z offset), r1 = 3, and NZCV reflect the

  pointer increment; these are incidental, not a designed return value.

  '
