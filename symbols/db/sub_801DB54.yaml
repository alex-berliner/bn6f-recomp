name: sub_801DB54
address: '0x0801DB54'
kind: function
status: hypothesis
summary: One-line wrapper that invokes sub_801BEC2 with argument 1; its game meaning depends entirely on that callee.
interface: 'void sub_801DB54(void); // trampoline: enters with lr only, returns whatever sub_801BEC2 leaves in r0-r2
  and flags'
details: 'Immediately pushes lr, sets r0 = 1 (mov r0,#1), then executes a redundant

  "lsl r0, r0, #0" which only re-flags the value in r0 (N=0, Z=0 for the

  constant 1) before the tail-style call to sub_801BEC2. It performs no work

  of its own, touches no memory or game structures, and simply forwards the

  constant 1 as the callee''s first argument; r0-r2 and the NZ flags returned

  to this function''s callers are whatever sub_801BEC2 leaves behind. The

  "lsl r0, r0, #0" after the constant load is a compiler artifact and has no

  effect beyond setting flags that are then overwritten by the callee''s own

  flag results. Until sub_801BEC2 is identified, the in-game purpose (e.g.

  enabling a mode, advancing a state machine with argument 1, opening a menu

  variant) cannot be determined.

  '
