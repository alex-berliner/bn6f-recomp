name: ai_attackStepDurationSeedExit
address: '0x080F5DAE'
kind: function
status: probable
summary: 'AI attack-state tick: initializes the attack element/duration on entry, counts the step timer
  down, and returns the object to its idle animation and exits attack state when time runs out.'
interface: (r7 = battle object AI attack vars, r5 = battle object) -> no return; updates oAIAttackVars_AttackElement,
  oAIAttackVars_StepTimer, oBattleObject_CurAnim
details: If oAIAttackVars_AttackElement is 0, it is initialized to 4 and oAIAttackVars_StepTimer is seeded
  from oAIAttackVars_AttackDuration, so this is the first call of a multi-frame attack. On subsequent
  calls the StepTimer is decremented each tick until it hits zero. When the timer expires, oBattleObject_CurAnim
  is set to 0 (idle/neutral anim) and object_exitAttackState is called to leave the attack state. Element
  value 4 is presumably a fixed element assigned to this AI attack (possibly wood/none depending on the
  element enum). No callers are known, so the element meaning and which enemy uses this handler are unconfirmed.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst; bne — branches on the element to decide init
    vs. countdown; mov r0,#4; strb [r7,#oAIAttackVars_AttackElement] — assigns fixed element 4 on first
    tick; ldrh/strh StepTimer from AttackDuration, then sub #1/bgt — per-frame countdown of the attack
    duration; mov r0,#0; strb [r5,#oBattleObject_CurAnim] — resets object animation when timer expires;
    bl object_exitAttackState — hands control back out of the AI attack state'
  refs:
  - bn6f/asm/asm31.s:132276
  - 0x08011714 object_exitAttackState
