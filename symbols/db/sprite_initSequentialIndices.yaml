name: sprite_initSequentialIndices
address: '0x0802B4D4'
kind: function
status: probable
summary: Initializes two interleaved halfword sub-arrays of a sprite-related struct with consecutive IDs
  starting from r1 across 5 strided blocks, and zero-fills a 0xC80-byte buffer at r2.
interface: (r0 = struct base, r1 = starting index value, r2 = buffer) -> void; writes halfwords at r0+0x40
  and r0+0x5E in 5 strided blocks, zeroes 0xC80 bytes at r2
details: Computes r7 = r0+0x40 and r4 = r7+0x1E, then for 5 outer iterations writes 10 halfwords at r7
  and 10 halfwords at r4, both taken alternately from one incrementing counter that begins at the r1 argument
  (so the two arrays receive interleaved consecutive values n, n+1, n+2, ...). After each block r7 and
  r4 advance by 0x3C, giving a 60-byte stride (10 halfwords written + gap) per block, 5 blocks total.
  It also calls ZeroFillByEightWords(r2, 0xC80) to clear a 3200-byte buffer passed by the caller. The
  sequential numbering pattern strongly suggests assigning VRAM tile or frame indices to sprite/animation
  entries, but the struct layout and the meaning of the 0xC80 buffer are not visible from this function
  alone.
