name: sub_81206C4
address: '0x081206C4'
kind: function
status: confirmed
summary: Iterates a list of 0x20-byte packed chip entries from newest to oldest and hands each one with a nonzero
  count to GiveChips.
interface: void chip_givePackedEntryList_81206C4(ChipEntry* entries /*r0*/, EntryListHeader* header /*r5, preserved*/);
  /* r10 passed in by callers but unused; count read from header+0x28 */
details: 'Reads a u16 count from header+0x28. If nonzero, walks the entry array in

  reverse order (starts at entries + (count-1)*0x20, stepping back 0x20 bytes),

  so the most recently added entry is processed first. For each entry it takes

  the u32 at entry+0x1C: its upper halfword (bits 23..16 of the word, i.e.

  bits 7..15 of the low halfword shifted up) is the chip amount, and bits

  22..16 of the word (bits 6..0 of the halfword) are the chip code. If the

  amount is nonzero it calls GiveChips(amount, chipCode, entry+0x14_hi) where

  the third argument is the high halfword of the field at entry+0x14 (likely

  some chip id/type data). Entries with amount 0 are skipped without calling

  GiveChips. Preserves r4-r7; only reads the header, never writes it, so the

  list is not consumed or cleared here.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
