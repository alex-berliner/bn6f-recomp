  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The script steps a table with stride 5 indexed by Timer2, terminates on 0xFF setting phase 0x10,
    and calls sub_80BF160 with r5+0x6C+Timer2; however the proposal mislabels the returned pointer handling
    (r4 is the return value, not a packed timer field — the packed register is built before the call as
    r4) and the interface note about r1=0x20 as a ''stats-byte selector'' overstates it: r1=0x20 is passed
    only to GetBattleNaviStatsByte, which returns alliance, not directly the table selector. The behavior
    (per-frame spawn driven by Timer2, branching on terminator, then jumping to sub_80BE7BC) is correct.;
    run wf investigate investigate-20261019-030611; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
