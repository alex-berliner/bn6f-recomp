name: checkCurrentMapEventFlag_80902DC
address: '0x080902DC'
kind: function
status: confirmed
summary: Tests the per-map event flag for the map the player is currently in and returns the result via
  the Z flag.
interface: (r10 toolkit) -> zf (Z clear when the selected event flag is set; nz, r1, r3 also reflect TestEventFlag's
  return); preserves r4-r7
details: 'Reads the toolkit''s GameState pointer and gets the player''s current location (oGameState_MapGroup
  / oGameState_MapNumber). If the map group is 0x85, the map number is ignored and table entry 3 is always
  used; otherwise the table index is the raw map number. Doubles the index and loads a u16 flag id from
  a small lookup table at byte_8090300 whose only defined entries are 0x0BE1, 0x0BE2, 0x0BE3 and 0x0FD2
  - so in practice only map numbers 0-3 (and the special group) are covered, anything larger reads past
  the table. Calls TestEventFlag with that id and returns its condition flags to the caller: the flag
  being set shows as Z clear (N stays clear since TestEventFlag tests a single low bit). r0 is clobbered,
  r1/r3 come back from TestEventFlag. No callee-saved registers are modified despite being pushed, so
  r4-r7 pass through untouched.

  '
