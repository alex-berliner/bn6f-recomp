name: object_syncToRelatedArmPosition
address: '0x080E9B56'
kind: function
status: probable
summary: Repositions a battle object at its related object's arm attachment point, copies the parent's
  sprite render state, and destroys itself once the parent no longer needs it.
interface: (r0 = this battle object (in r5)) -> r0 = destroyed (state CUR_STATE_DESTROY) or kept while
  parent flag 0x10000 set; no meaningful return
details: 'r5 is a battle object whose RelatedObject1Ptr points to a parent object. It asks getBattleArmPositionMaybe
  for the attachment offset of slot 0x21 using the parent''s NameID, Alliance and DirectionFlip, then
  reads the parent''s three world-position words at +0x34, adds the arm offset to X and Z(-ish) fields
  and raises two of them by 0x60000 (6 fixed-point units), and stores the result into its own +0x34. It
  then pulls the parent''s sprite render info (flag-0x10 byte, render-info high byte, mosaic/scaling params)
  and applies alpha, so the child sprite mirrors the parent''s rendering. It recomputes its PanelX/PanelY
  via object_setPanelsFromCoordinates; if the resulting panel is invalid it clears its own oObjectHeader_Flags
  bit 2, and bit 2 is then synced to the parent''s bit 2 (visibility inheritance). Finally, if [ExtraVars]
  points to a nonzero value it reads the parent''s object flag: while bit 0x10000 is set the object survives;
  otherwise [ExtraVars] is zeroed and the object''s state word is set to CUR_STATE_DESTROY.'
