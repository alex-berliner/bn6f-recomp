  reproduce: python3 tools/asmcat.py 0x080F0EC0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The return convention is inverted in the proposal: r0=0 means still moving and r0=1 means arrived,
    but the caller at 0x080F0DDA writes HitElement on the *nonzero* (r0=1) branch, and the code''s loc_80F0F16/loc_80F0F2A
    set r0=1 only when FuturePanel==Panel (settled), while loc_80F0F36 sets velocity and falls through
    to r0=0. The name ''ai_advanceAttackMoveStage'' fits, but the summary misstates ''r0=0 while still
    moving, r0=1 when arrived'' as standard - actually that is correct, but it wrongly claims ''stage
    advanced'' implies r0=0. Better summary clarifies return semantics.; run wf investigate investigate-20261019-052112;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
