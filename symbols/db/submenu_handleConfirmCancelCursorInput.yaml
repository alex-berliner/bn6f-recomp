open_questions:
- Which menu this belongs to (unknown caller; the CANT_JACK_IN buzzer and 8-entry cursor suggest a cross/selection
  screen but the callees sub_8137D20..F5C are unidentified)
- Layout of the r5 state struct beyond offsets 1, 2 and 0x1e, and what state value 8 means in its state
  machine
- What EVENT_1710 represents and why setting it makes A always act as if unselected/invalid
