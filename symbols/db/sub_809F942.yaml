name: sub_809F942
address: '0x0809F942'
kind: function
status: confirmed
summary: Scans the NPC proximity list for the first NPC inside the player's asymmetric collision diamond (same Z-plane,
  diamond bounds on dx−dy and dx+dy) and stores its pointer as the current interaction target; short-circuits when
  event 0x1708 is set.
interface: 'npc_checkProximityDiamond_809F942(toolkit: u32 /* r10 */) -> r3; outputs r4, r6 (preserved); clobbers
  r0-r2, r5, r7, flags; returns 0 when no NPC is in range'
details: 'Resolves the overworld player object via toolkit→gameState→player. Reads a proximity-NPC count from byte_2000210[0]
  and an array of NPC pointers starting at byte_2000210+0x10. For each NPC: (1) reject unless NPC+0x2C (z-plane)
  equals player+0x24; (2) compute dx = NPC+0x24 − player+0x1C and dy = NPC+0x28 − player+0x20 in subpixel 16.16
  units; (3) accept if −0x38 ≤ (dx−dy)>>16 ≤ 0x24 and −0x1C ≤ (dx+dy)>>16 ≤ 0x1C (an axis-aligned diamond, asymmetric
  because the forward reach is wider than the backward). On first hit the NPC pointer is stored at byte_2000210+0x8;
  on exhaustion NULL is stored. In both the hit and miss paths the routine calls clearBattleStateIfEvent1708Pending_809F90C.
  If event flag 0x1708 is already set the function returns without touching the proximity array. The proximity array
  is a linked/sequential list maintained elsewhere; this function only reads it.'
