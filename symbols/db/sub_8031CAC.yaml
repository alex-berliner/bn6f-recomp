name: sub_8031CAC
address: '0x08031CAC'
kind: function
status: confirmed
summary: Computes the target's relative position, then runs a fixed-point half-plane (cross-area) test against a
  hard-coded test point/normal, and finally calls sub_8031B7C.
interface: void sub_8031CAC(void);  // clobbers r2,r3,r4,r6,r7; touches flags N,Z,C,V
details: 'Thin wrapper that drives a single battle collision/query step: (1) battle_calcRelPosToTarget_803172E fills
  in the relative-position pair from the actor in r0 toward the current battle target. (3) It then stages constants
  for math_pointCrossHalfPlaneTest_8031594: r2 = 0 (unused), r4 = 0xE, r3 = 0x10, r5 = 0xE. These four small constants
  act as a hard-coded point/normal pair for the cross product half-plane test (point = 0xE, 0x10; normal = 0xE with
  r2 as the implicit zero of the 2D cross). (4) sub_8031B7C is then invoked to act on the result. Because the test
  inputs are baked in, this routine is a specialized "is the target within this fixed cross/area relative to me"
  probe used by the battle subsystem rather than a general utility.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
