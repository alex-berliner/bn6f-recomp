status: probable
summary: Overworld tick that starts the "L-button message" cutscene (CutsceneScriptLMessage_80991F4) when
  the L shoulder button is held, slip-run is not active, and the L-message story flag is not set.
interface: () -> r0 = 1 if no cutscene was started (early-out), 0 if StartCutscene was invoked
details: "Called from cutscene_8034BB8. Reads r10 (the Toolkit) and grabs the JoypadPtr at oToolkit_JoypadPtr,\
  \ then peeks the Held word at offset 2 and tests bit 0x200 (JOYPAD_L). If L is not held, returns r0=1.\n\
  \  If a slip-run is in progress or a cutscene script is already running (IsNotSlipRunningAndNotInCutscene\
  \ returns false), returns r0=1.\n  Otherwise checks EVENT_L_MESSAGE_ACTIVE via TestEventFlagFromImmediate;\
  \ if already set, returns r0=1.\n  On the success path, calls StartCutscene with the fixed cutscene\
  \ script CutsceneScriptLMessage_80991F4 and r0 cleared to 0 to signal \"started\".\n  The \"L message\"\
  \ wording comes from the GameState comment (\"related to L button messages\") plus the dedicated cutscene\
  \ script constant.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `bl IsNotSlipRunningAndNotInCutscene` at the function head, then `beq loc_8034DA4` (returns
    1) when the world is busy - `ldrh r2, [r2,#2]` on the JoypadPtr is the Held field, and `tst r3, r2`
    with `off_8034DA8 = 0x200` is JOYPAD_L - `movflag EVENT_L_MESSAGE_ACTIVE` followed by `bl TestEventFlagFromImmediate`
    and `bne loc_8034DA4` skips starting the cutscene if the L-message flag is already set - `ldr r0,
    off_8034DAC // =CutsceneScriptLMessage_80991F4` and `bl StartCutscene` install the dedicated L-message
    script - Returns r0=0 on the success path and r0=1 on every bail-out path'
