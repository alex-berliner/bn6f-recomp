name: object_spawnAttackProjectile
address: '0x080DE660'
kind: function
status: probable
summary: Forces battle object type 0xC9 and calls object_spawnType3; on success, fills PanelX/PanelY/Element
  from saved r0-r2, Damage from r6, and copies AllianceAndDirectionFlip from the caller-supplied source
  object in r5.
interface: (r0 = panelX, r1 = panelY, r2 = element, r3 = spawn arg 4 passthrough, r5 = source battle object,
  r6 = damage word, stack arg passthrough) -> r0 = new object pointer or 0 on failure; Z from spawn success
details: Saves the caller's r0-r2, forces the object type to 0xC9 (201) and calls object_spawnType3, forwarding
  r1-r3 and any stack arguments unchanged. If the spawn fails, it returns immediately with r0 = 0. On
  success it writes the caller's original r0/r1/r2 into the new object's PanelX, PanelY and Element fields,
  stores the caller's r6 into the DamageAndStaminaDamageCounterDisabler word, and copies the AllianceAndDirectionFlip
  halfword from the source object pointer the caller kept in r5. It is a pass-through argument marshaller,
  not a state machine of its own.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'mov r0, #0xc9 before bl object_spawnType3 fixes the spawned object type; strb r1/r2/r3 to oBattleObject_PanelX/PanelY/Element
    map popped caller args (orig r0-r2) onto the new object; str r6, [r0,#oBattleObject_DamageAndStaminaDamageCounterDisabler]
    uses the caller''s damage value directly; ldrh r3,[r5,#oBattleObject_AllianceAndDirectionFlip]; strh
    r3,[r0,...] copies team/flip from the caller''s source object; sole caller ai_attackStepShoot fires
    projectile attacks from the object''s damage/element settings, matching the fields set'
