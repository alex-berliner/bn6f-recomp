name: e_spawnElementalCollisionRegion
address: '0x080D532C'
kind: function
status: probable
summary: Spawns a battle collision region for an enemy object, passing along the object's element.
interface: (r0/r1 = set by caller, likely object ptr/params; r5 = battle object) -> calls object_spawnCollisionRegion(r2
  = element, r3 = 0, r4 = 0x605FF01 packed extents, r6 = 0, r7 = 0); returns its result
details: 'Loads oBattleObject_Element from the object kept in r5 and forwards it as an argument to object_spawnCollisionRegion,
  so the spawned hitbox matches the enemy''s element. The remaining arguments are constants: r3 = 0, r4
  = 0x605FF01 (probably packed size/offset fields of the collision region), r6 = 0, r7 = 0. r0/r1 are
  not set here, so the caller must supply them (most likely the object pointer and a region-related value).
  It is a thin argument-filling wrapper, not logic of its own. Used by e_initSidewaysMover and by sub_80D52FA,
  another enemy-style init.'
