name: object_decrementPhaseCountdown
address: '0x08017FE6'
kind: function
status: probable
summary: Counts down a battle object's current phase; once it runs out, clears the phase-countdown flag
  and switches to the object's pending state action.
interface: (r0..r3 unused; operates on the current battle object in r5) -> void; flags set by the decrement
  (bge) decide early return
details: Decrements oBattleObject_CurPhase and returns while it is still >= 0, so this runs every frame
  as a countdown. When the counter goes below zero (phase finished), it clears ObjectFlags1 bit 0x100000
  (1 << 0x14) via object_clearFlag, then copies oBattleObject_PendingStateAction into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  and zeroes oBattleObject_PendingStateAction, starting the queued next state action. The cleared flag
  likely marks 'phase countdown active', and the copied field also encodes the new action's phase/initialized
  bits.
