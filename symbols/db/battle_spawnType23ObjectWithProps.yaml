open_questions:
- What kind of entity object type 0x23 is (attack, obstacle, summon?) — needs the type-0x23 initialiser
  or a known caller
- Exact meaning of oObjectHeader_Flags bit 0x10
- Why the saved r0 doubles as both the spawn params word and PanelX — whether params encode the panel
  coordinate
- What r6 (DamageAndStaminaDamageCounterDisabler value) and the r7 structure represent, and what the two
  callers sub_80BE8AE/sub_80BE97A pass
