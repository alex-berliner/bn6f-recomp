name: battle_clearSelfRefPointer
address: '0x080D3F32'
kind: function
status: probable
summary: Nulls an external pointer slot if it currently references this battle object (self-reference
  cleanup on init/teardown).
interface: (r5 = battle object) -> r0 clobbered; no return value
details: Reads a pointer p from [r5+oBattleObject_ExtraVars+4], dereferences it, and if *p == r5 stores
  0 into *p, severing a link some other structure holds to this object; if the slot holds any other object
  it is left untouched. r5 is the battle engine's 'this' convention, so the caller passes nothing in r0-r4.
  Called both from battle_initRankedEnemy (fresh spawn) and object_processCollisionDamage (after collision/damage
  teardown), suggesting the field is a back-reference such as a damage source, owner, or linked object
  that must not dangle. No flags or return value are used.
