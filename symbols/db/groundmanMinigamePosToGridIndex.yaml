name: groundmanMinigamePosToGridIndex
address: '0x08143D7A'
kind: function
status: probable
summary: 'Converts a world position into a flat grid cell index for the Groundman minigame: adds the map''s
  grid offsets (returned in r0/r1), shifts the saved input right by 5 to convert pixels to 32-px cells,
  recenters by adding 0x80, then returns x_cell + y_cell * 256.'
interface: (r0 = x pos, r1 = y pos) -> r0 = grid cell index (x_tile + y_tile*256); flags clobbered by
  mul/mult-cycle
details: 'It calls GetGroundmanMinigameGridOffsetsForMap, saving r0/r1 (the input position) on the stack
  and popping them into r3/r4 after the call, since the callee returns the map''s grid offsets in r0/r1.
  The 16-bit-packed offset words are unpacked via asr #16, added to the input x/y, then shifted right
  by 5 to convert pixels to 32-pixel grid cells. 0x80 is added to each coordinate so the grid origin sits
  at cell (128,128), i.e. the map spans a centered 256x256-cell index space. Finally it computes the flat
  index r0 = x_cell + y_cell * 256 (r5 = 0x100 via lsl #1). So the grid is 256 cells wide and the map''s
  grid offsets recenter arbitrary positions into that space.'
