    of the returned offset pair; asr r0/r1,#5 converts pixel coordinates to 32-pixel cells, +0x80 recenters
    each axis; r5=0x100; mul r1,r5; add r0,r0,r1 -> index = x_cell + y_cell*256, a 256-wide grid; caller
