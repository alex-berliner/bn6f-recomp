name: battleObject_tryStartChipAttack_8112600
address: '0x08112600'
kind: function
status: confirmed
summary: Attempt to launch the player's selected Custom chip as an attack, returning whether the attack was started.
interface: 'u32 battleObject_tryStartChipAttack_8112600(/* battleObj=r4, chipBankOrObj=r5, r7 */ ); /* out: r0 =
  success(1/0), r1 = gate-value or attacker result; preserves r4 r6 r7 */'
details: "Called when the player object needs to fire a chip. Steps:\n1. battle_getSelectedChipForUse_800ED90(r5,\
  \ r4, 0) — retrieve the chip the player\n   has queued. If r3==0 the slot is empty/invalid → return 0.\n2. Chip\
  \ code = r0 & 0x1FF (mask via lsl/lsr #23).\n3. battle_getStateUnk40_800A704() — read battle state word. If it\
  \ is < 0x12C the\n   battlefield is not yet in the phase that allows chip firing → return 0.\n4. somethingWriteChipParams_80126E4(chipCode,\
  \ r5, r7) — populate the chip's\n   attack-template / projectile parameters into the caller's workspace.\n5. object_setAttack0(r0,\
  \ r5) — write the attack descriptor into the player\n   battle-object's attack-slot-0 (the player's primary attack).\n\
  6. battleObject_decrementChipHeldAndClearChip_800F322(r5) — decrement the held-chip\n   count and clear the \"\
  selected chip\" pointer so the chip cannot be re-fired.\nReturns r0=1 on success, r0=0 on either early-exit. r1\
  \ carries the gate constant\n0x12C on the state-check failure or the value from object_setAttack0 on success.\n\
  r6 is used internally as the success flag; it is restored before return.\n"
