open_questions:
- Exact identity of sub_800F322 / object_setAttack0 / somethingWriteChipParams_80126E4 — only their contracts/roles
  are known; whether sub_800F322 is a counter increment or another write isn't pinned down by this snippet.
- Which AI actor type this is meant for (player vs navi vs virus) — gated by somethingWriteChipParams
  accepting a chip id; the caller chain determines which r5 it is called on.
