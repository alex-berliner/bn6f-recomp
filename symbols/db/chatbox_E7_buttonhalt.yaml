name: chatbox_E7_buttonhalt
address: '0x08040EF4'
kind: function
status: confirmed
summary: 'Implements chatbox script opcode E7 (button wait): pauses the script until the player presses a confirmation
  button, then advances past the two-byte opcode.'
interface: void chatbox_buttonhalt_8040EF4(Chatbox *self@r5, u8 *script@r4) -> r0=0, r2, r4 (always returns 0 in
  r0; r2/r4 are the script-byte/script-pointer results consumed by the chatbox driver)
details: "Per-frame routine dispatched by the chatbox script engine when the current opcode is 0xE7. It is called\
  \ once per frame with r5=self and r4=script pointer (which still points at the opcode byte).\n\nState machine\
  \ on `self->TextScriptState_04`:\n  - 0 (or any non-1/2): first frame of the wait. Seeds `BoxYX` to 5 and arms\
  \ state=1; the script pointer is not advanced yet.\n  - 1: countdown. Each frame decrements `BoxYX` until it reaches\
  \ 0, then transitions to state=2 (waiting for a button). The decrement exists so the button that finished the\
  \ previous line (e.g. pressing A to advance) is not immediately consumed by this wait.\n  - 2: actively polling\
  \ the joypad. The script operand byte (the byte after the E7 opcode, read via `script[oChatbox_TextScriptIdx]`)\
  \ chooses the confirmation set: if it is 0, only A or B confirm; otherwise any button (0x03FF) confirms. A fresh\
  \ press in `JoypadUp` matching the set ends the wait. If B is held and `BoxYX` has been counted back up to 10\
  \ (0xA), that also ends the wait. Otherwise each frame with B held increments `BoxYX` by 1 (signed `bge` comparison\
  \ in the asm).\nOn confirmation: clears FLAGS_3E bits 0x0020|0x0001 via chatbox_clearFlags_3e, resets TextScriptState_04\
  \ to 0 and BoxYX to 0, writes 1 to `self->Unk_74`, and advances the script past both the E7 byte and its operand\
  \ byte (r4 += 2). On every exit path r0 is left at 0; r2 is left holding the script byte the routine last inspected\
  \ (0 on early frames, the operand byte once in state 2, and the operand byte after a confirmed exit).\n\nFlags\
  \ handling: on entry the routine always sets FLAGS_3E_UNK_0400 (left set for the whole command) and FLAGS_3E_UNK_0020|FLAGS_3E_UNK_0001\
  \ (cleared on confirmation). `self->Unk_03` is zeroed at entry.\n\nFields of the Chatbox struct touched:\n  oChatbox_Unk_03\
  \            (u8,  written to 0 each frame)\n  oChatbox_TextScriptState_04 (u8,  state machine 0/1/2)\n  oChatbox_BoxYX\
  \             (u16, countdown counter, range 0..0xA)\n  oChatbox_JoypadUp          (u16, freshly-pressed buttons)\n\
  \  oChatbox_JoypadHeld        (u16, currently-held buttons; only B = 0x0002 is checked)\n  oChatbox_TextScriptIdx\
  \      (offset into the script pointer for r4)\n  oChatbox_Unk_74            (u32, written 1 on confirmation)\n"
