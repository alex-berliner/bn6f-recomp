open_questions:
- What the three 3E flag values (0x0400, 0x0020, 0x0001) actually mean to the chatbox subsystem -- e.g. 0x0400 may
  be the 'script-paused / waiting on input' marker.
- Meaning of self->Unk_74 (only ever written 1 here).
- Meaning of self->Unk_03 (zeroed each frame).
- Why `bge` is used for the counter>=10 test rather than a plain unsigned compare -- could be defensive against
  an overflow path or a signed field elsewhere; the field is u16 in the C view but compared as signed in the asm.
- Whether holding B is intentionally a 'long press to skip' affordance or just an accident of the counter wraparound.
