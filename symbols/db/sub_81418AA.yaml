name: sub_81418AA
address: '0x081418AA'
kind: function
status: confirmed
summary: Writes 1 to the "event struct active" flag byte (0x200101D, eStruct2001010+0xD) and returns 0 with the
  Z flag set.
interface: 'void sub_81418AA(void); // in: lr only; out: r0=0, Z set / N clear; r4-r7 preserved'
details: 'Tiny setter: loads the address of eStruct2001010 (a fixed work area at 0x2001010),

  stores 1 into offset 0xD (the second byte of dword_200101C, i.e. absolute 0x200101D),

  then executes "mov r0,#0" so it returns 0 with Z set and N clear. The push/pop of

  r4-r7 is purely to keep the caller''s registers intact; r5 is used only as the

  scratch pointer for the store. No other fields of the struct are touched, and no

  game state beyond this one flag byte is modified. Since the return value and flags

  are always the same, any caller branching on Z or testing r0 will always take the

  "success/zero" path.

  '
