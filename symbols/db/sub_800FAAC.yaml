name: sub_800FAAC
address: '0x0800FAAC'
kind: function
status: confirmed
summary: Spawns a type-3 battle object on the panel in front of the given battle object and finishes its setup with
  an alliance-dependent stats byte.
interface: (r0, r1, r2, r3 = effect params, r5 = battle object) -> r0-r3 = sub_800FAF6 results; preserves r4-r7,
  clobbers flags
details: 'Wrapper that places a helper object one panel ahead of a battle object. It saves the caller''s r0/r1/r3
  in r4/r6/r7, calls object_getFrontDirection to get the object''s facing offset, and adds it to oBattleObject_PanelX
  (r5 = battle object) to get the spawn X; the spawn Y is oBattleObject_PanelY unchanged. It then calls battle_SpawnAndInitObjectType3_80C4FFE
  with the spawn panel (x, y) and the passed-through r2/r3 parameters to create and initialise a type-3 battle object
  there. Afterwards it reads byte index 2 of the spawner''s alliance''s battle navi stats via GetBattleNaviStatsByte(oBattleObject_Alliance,
  2) and calls sub_800FAF6 with the spawn panel coordinates, that stats byte in r2, and the original r0/r1/r3 parameters
  restored into r4/r6/r7 (r5 still holds the battle object) to complete the new object''s setup. The four registers
  r0-r3 coming back from sub_800FAF6 are returned to the caller, so this function acts as a thin front-panel-spawn
  adapter around sub_800FAF6. Quirk: relies on r5 holding the battle object, which is not part of the normal r0-r3
  calling convention callers must honour.

  '
