name: battle_object_dispatchPhaseHandler_80C6A34
address: '0x080C6A34'
kind: function
status: confirmed
summary: Dispatches a battle object's per-frame logic to its current-phase handler via a small jump table
  (phase 0 -> routine; else -> battle_object_destroy_80C6AAC).
interface: void sub_80C6A34(BattleObject* obj) /* r5 in; r0/r1/nzcv out */
details: 'Reads the 1-byte CurPhase field (oBattleObject_CurPhase) from the BattleObject pointer passed
  in r5, then loads a 32-bit handler address from a 2-entry table at off_80C6A48 (offset = CurPhase *
  4). The table at off_80C6A48 currently holds two entries: sub_80C6A50 (phase 0) and battle_object_destroy_80C6AAC
  (phase >= 1, i.e. destruction/teardown). It then tail-calls that handler with the original BattleObject
  still in r5 by using the `mov lr, pc; bx r1; pop {pc}` trampoline pattern, which preserves the caller''s
  lr-return semantics (the outer pop returns to the caller of sub_80C6A34). The function does no register
  save of its own besides lr; the handler is expected to obey the usual ARM caller convention on r0-r3/r12.
  Because the dispatched routine is selected by data, the function has no single C signature; in practice
  the two known slots are `sub_80C6A50` (active phase work) and `battle_object_destroy_80C6AAC` (cleanup/destroy).'
