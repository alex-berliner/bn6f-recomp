name: ow_groundmanStartCutscene
address: '0x08143A54'
kind: function
status: probable
summary: 'GroundMan minigame cutscene dispatcher: checks the player may auto-advance, progresses event
  flags D34/D35, then selects and starts one of several cutscenes (byte_8092DE8/byte_80933B8/dword_8143B1C
  table/byte_809326C) gated by sub_8143BB0, sub_8143D4C and sub_8143F72, always clearing D34/D35 on exit.'
interface: '() -> void; flags: event flags D34/D35 modified, ZF from check_playerCanAdvanceForward controls
  early exit'
details: 'Runs as an overworld per-tile/per-step event handler: it first checks the player may advance
  forward, and bails (clearing D34/D35) otherwise. It then reads a field at [r10+0x3c]+0x11 to decide
  whether to set flags D34 then D35 (a two-stage progression, e.g. approaching then engaging). Once D35
  is set it calls sub_80357AE / sub_8143DEA / sub_8143EDC / sub_8143EA4 / sub_8143BB0 and picks between
  cutscripts byte_8092DE8 and byte_80933B8 based on one of those tests. Finally sub_8143D4C and sub_8143F72
  gate the minigame start, and GetGroundmanMinigameMapIndex selects one of two scripts from the table
  at dword_8143B1C (or byte_809326C). All exit paths clear both D34 and D35 so the trigger re-arms.'
