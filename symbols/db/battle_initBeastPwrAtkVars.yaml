name: battle_initBeastPwrAtkVars
address: '0x08011DFC'
kind: function
status: probable
summary: Initializes an AI attack-vars record for a Beast Out power attack, computing its damage via the
  scaled-base helper.
interface: (r7 = pointer to AI attack vars struct; no args in r0-r3) -> r0 = 0x50 (the base damage); flags
  unused
details: 'Takes the attack-variables structure in r7 and resets its state: clears the ChargeReadyFlag
  and ChipUseDelay bytes, zeroes the AttackBoost halfword, and sets ExtraDamage to 0x9E. It then calls
  battle_beastPwrAtk_addScaledBase_8012642 with base damage 0x50 and multiplier 0x14, storing the returned
  total into the Damage halfword. Finally it writes 0x10 to the InitFlag and returns the base value 0x50
  in r0. The struct fields (oAIAttackVars_*) are the per-enemy AI attack bookkeeping shared with the beast
  power attack helper.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'clears ChargeReadyFlag/ChipUseDelay/AttackBoost then sets ExtraDamage=0x9E on the r7 oAIAttackVars_
    struct; calls battle_beastPwrAtk_addScaledBase_8012642 (known: adds baseDamage*beastOutMulti, multi
    clamped to 5) with r0=0x50, r1=0x14; result of the helper is stored to oAIAttackVars_Damage, confirming
    this struct is the attack being configured; sets oAIAttackVars_InitFlag=0x10 and returns 0x50, the
    same base passed to the helper, as the final result'
