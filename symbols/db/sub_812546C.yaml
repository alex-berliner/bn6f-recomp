name: sub_812546C
address: '0x0812546C'
kind: function
status: confirmed
summary: Draws a multi-row 32x32 background tile graphic for a battle-scene object, selecting an alternate tile
  set for the bottom rows when a flag is set.
interface: void battle_drawBgTileRows(u32 bgObj /*r5*/) — outputs r3, r4, r6, r7 from the last CopyBackgroundTiles
  call; r5 and r6 preserved.
details: 'Reads the base tile index at bgObj+0x74 and a mode flag at bgObj+0x64. Unconditionally copies three rows
  (0-2) of 2×3 32×32 tiles via CopyBackgroundTiles at row-specific offsets (-0x94, -0x82, -0x70), each using a different
  tile-ID table (byte_812489C, byte_81248C0, byte_81248E4).  If the mode flag at 0x64 is zero it copies one additional
  row at -0x5E (tile table byte_812492C).  If nonzero it copies two rows: row 3 at -0x5E using alternate table byte_8124908,
  then row 4 at -0x4C using byte_812492C.  j_size=9, i_size=2 for every call.  r10 is listed as an input by the
  caller convention but is not referenced in this function body.  r7 is set to r5 at entry and survives the function.

  '
