name: ai_attackFrontColumn
address: '0x080F1E08'
kind: function
status: probable
summary: AI attack step that hits the three vertically adjacent panels in the column directly in front
  of the acting battle object.
interface: (r5 = battle object, r7 = AI attack-vars struct) -> void; calls object_getFrontDirection, object_isValidPanel,
  sub_80DDFB6 per panel
details: Loops r4 from -1 to +1 (three iterations). Each iteration reads the object's facing via object_getFrontDirection,
  forms target panel (PanelX + dir, PanelY + r4), and only proceeds if object_isValidPanel accepts it.
  For each valid panel it calls sub_80DDFB6 passing the panel coords in r0/r1, oAIAttackVars_InitFlag
  in r2, an index ((row+1)*2) in r3, and a halfword fetched from table byte_80F1E48 in r4; oAIAttackVars_Damage
  is loaded into r6 as shared state. The table supplies per-row constants 0x0C01, 0x0000, 0x1801 — plausibly
  packed (flag, value) pairs such as vertical pixel offsets 12/0/24 for top/middle/bottom row. The push/pop
  of r4 around the inner call appears to be stack alignment for the bl.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: loop body at 80F1E0E-80F1E36 runs for r4 = -1,0,1 (add r4,#1; cmp r4,#1; ble), giving rows Y-1..Y+1;
    add r0,r0,r1 after object_getFrontDirection makes X = PanelX + facing, i.e. the front column; ldrb
    r2,[r7,#oAIAttackVars_InitFlag] and ldr r6,[r7,#oAIAttackVars_Damage] feed the attack call; ldrh r4,[r6,r3]
    with off_80F1E44=byte_80F1E48 selects per-row constants 0x0C01/0x0000/0x1801; beq loc_80F1E3A after
    object_isValidPanel skips off-grid panels
