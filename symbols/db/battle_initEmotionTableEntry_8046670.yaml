summary: Initialises one EmotionData slot in the 0x58-byte EWRAM array at 0x02008450 with a type byte,
  a fixed 0x09 tag, and a flags value.
interface: '(r0 = actorType/AIIndex?, r1 = slotIndex, r2 = flags) -> r0 = pointer to the 0x58-byte slot
  at 0x02008450 + slotIndex*0x58 ; side effects: writes slot bytes [0]=9, [1]=r0, [4]=r2, [8]=0'
details: 'ldr r5, off_80466D4 pulls the base of an EWRAM table at 0x02008450 (eStructArr2008450).

  r4=0x58 is the per-slot stride, so r5 = 0x02008450 + r1*0x58 indexes the chosen entry.

  strb r0,[r5,#1] stores the supplied type/AIIndex into the second byte of the slot.

  mov r0,#9; strb r0,[r5] writes the literal 9 (a fixed tag) at offset 0 of the slot.

  str r2,[r5,#4] stores the 32-bit r2 argument at offset 4 of the slot.

  mov r0,#0; str r0,[r5,#8] zeroes offset 8 of the slot.

  Returns r5 in r0 so the caller can keep mutating the same slot; the function is the

  per-slot initialiser used by emotion/setup table loaders (loadEntryPairTable_812B1DC

  and friends), where every pair of (type, flags) input is one slot.

  '
