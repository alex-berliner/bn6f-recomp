name: battle_runCustomScreenFrame
address: '0x0812B874'
kind: function
status: probable
summary: 'Per-frame step of the battle custom-screen state machine: conditionally calls sub_803C604, dispatches
  one of seven state handlers from a thumb tail-call table, ticks battle_runFrameUpdate(0x12), and refreshes
  the chip-cursor OAM/tile.'
interface: '(r0 = unused/jump-offset seed, r5 = screen-state struct: +2 = state id, +3 = substate) ->
  r0 = result of battle_runFrameUpdate(0x12); no meaningful return'
details: Reads the first byte of the EWRAM record at 0x200BC30; if it equals 8 and the struct's state
  (r5+2) is not 0x14 with substate 4, calls sub_803C604. It then dispatches through a 6-entry thumb handler
  table at 0x812B8C0 indexed by r5+2 (mov lr,pc / bx r0 tail-call style). After the handler, it calls
  battle_runFrameUpdate with message id 0x12 unless state==0x14/substate==4. Finally, unless the 0x200BC30
  byte is 0, it calls the chip-cursor OAM/tile uploader with (0xDA, 2). The state==0x14/sub==4 special
  case skips the extra update calls, suggesting that pair marks a finished/idle screen phase.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldr r0, off_812B8BC; ldrb r1,[r5,#2]; mov lr,pc; bx r0 — 6-entry state dispatch table at 812B8C0;
    callee battleObject_setupCustomChipCursorState_803C59C (custom-screen OAM + chip-cursor tile upload)
    called with 0xDA,2 — ties this to the custom screen; bl battle_runFrameUpdate with r0=0x12 runs the
    per-frame battle-scene update after the state handler; state 0x14/substate 4 skips sub_803C604 and
    battle_runFrameUpdate — an idle/terminal phase of the screen; gate on EWRAM 0x200BC30 first byte (==8
    before, !=0 after) mirrors the record-driven dispatch seen in eStruct200BC30_getJumpOffset00
  refs:
