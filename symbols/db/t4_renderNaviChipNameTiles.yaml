name: t4_renderNaviChipNameTiles
address: '0x08137D20'
kind: function
status: probable
summary: Rebuilds the per-frame navi/chip name tile graphic (up to 7 names) into BG tile block 2 at offset
  (2,4), zeroing and refilling the name tile buffer from the navi-chip-name table.
interface: () -> void; reads [r5+0x24] as a row index into unk_201CF00, writes byte_2017A00
details: Zeros the 0xE0-byte (halfword-cleared) chip-name tile buffer at byte_2017A00, then calls t4_drawNaviChipNameTiles
  to render up to 7 navi/chip name rows (indexed by [r5+0x24], pulling strings through unk_201CF00) into
  that buffer, and finally copies the buffer into BG tile block 2 at offset (2,4) via t4_copyNaviChipNameToBg.
  Each caller invokes it as the rebuild step before the chatbox render and sprite glyph draw trio, so
  the function is the frame's chip-name redraw. It is called on round init, on cursor/select changes in
  the chip submenu, and when a chatbox scene-step consumes a script byte that just picked a chip name
  entry.
