name: battle_updateNaviForm
address: '0x080E96C6'
kind: function
status: probable
summary: 'Battle-object phase handler: sets a 60-frame timer, spawns a flash effect at RelatedObject1''s position,
  plays sound 0x43, writes its Param2 into the navi''s NaviStats byte 5 (real or ghost per alliance), chains to
  sub_80E97BE, and on expiry transitions to action 0xC.'
interface: (r0 = battle object, kept in r5) -> void; on phase expiry sets oBattleObject_CurAction = 0xC and clears
  CurPhaseAndPhaseInitialized
details: On phase 0 the object marks itself in-progress (CurPhase=1) with a 0x3C-frame timer, spawns effect object
  type 0 with r4=0x5B at the position of RelatedObject1Ptr's X/Y, plays M4A sound 0x43, and writes oBattleObject_Param2
  to NaviStats byte 5 of the navi matching the object's Alliance — via the wrapper (r0=object, r1=field 5, r2=value)
  and redundantly via GetBattleNaviStatsAddr plus strb. It then calls unknown sub_80E97BE. Phase 1 decrements the
  timer each frame; at expiry it sets CurAction=0xC and clears phase. The stats write selecting a real vs. ghost
  record by alliance suggests this runs for either the player navi or a copy of it.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'phase 0 block: mov r0,#1; strb [r5,#oBattleObject_CurPhase]; mov r0,#0x3C; strh [r5,#oBattleObject_Timer];
    ldr r1,[r0,#oBattleObject_X]; ldr r2,[r0,#oBattleObject_Y]; mov r4,#0x5B; bl spawn_t1_0x0_EffectObject — flash
    effect at the related object; mov r0,#0x44; add r0,#0xFF (=0x43); bl PlaySoundEffect — transformation-style
    sound; ldrb r2,[r5,#oBattleObject_Param2]; mov r1,#5; bl SetBattleNaviStatsByte_AllianceFromBattleObject; bl
    GetBattleNaviStatsAddr; strb r1,[r0,#5] — double-write of Param2 to stats byte 5; timer expiry: mov r0,#0xC;
    strb [r5,#oBattleObject_CurAction]; strh 0 to CurPhaseAndPhaseInitialized'
