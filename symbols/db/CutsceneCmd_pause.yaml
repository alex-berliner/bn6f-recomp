name: CutsceneCmd_pause
address: '0x080376F4'
kind: function
status: confirmed
summary: Cutscene script opcode that pauses the active script for a configurable number of interpreter ticks.
interface: void CutsceneCmd_pause(u8 *cutsceneState /* r5 */, u32 scriptPtr /* r7 */, u32 duration /* r4, in/out
  */)
details: "Implements the \"pause\" command of the cutscene script interpreter (one of the per-script\n3-byte opcodes).\
  \ Behavior:\n  * On the first call after a script starts this command it raises\n    CUTSCENE_FLAG_SCRIPT_1_PAUSED\
  \ for the current script slot\n    (oCutsceneState_WhichCutsceneScript + CUTSCENE_FLAG_SCRIPT_1_PAUSED), then\
  \ reads\n    the length operand through ReadMapScriptByte: with selector 1 it gets a byte that\n    is either\
  \ an index into the cutscene state (used as oCutsceneState_*+index) or\n    0xFF, in which case selector 2 fetches\
  \ the inline immediate following the command.\n    The chosen length is stored as the script's pause timer\n \
  \   (oCutsceneState_WhichCutsceneScript + oCutsceneState_CutsceneScript1PauseTimer).\n  * On every tick (including\
  \ the arming tick) it decrements that timer; while it\n    remains >= 0 the cutscene keeps the script paused and\
  \ the read pointer (r7) is\n    left alone.\n  * When the timer underflows (was 0 before the decrement) it clears\n\
  \    CUTSCENE_FLAG_SCRIPT_1_PAUSED, advances r7 by 3 to skip the pause command, and\n    returns nz=1 so the interpreter\
  \ moves to the next opcode; otherwise it returns\n    nz=0 to keep the script halted.\nOutput registers per the\
  \ contract: r1 = the per-script timer offset, r4 = the duration\nthat was loaded (carried across ticks), r7 =\
  \ the (possibly advanced) script pointer;\nNZ reflects whether the pause expired.\n"
