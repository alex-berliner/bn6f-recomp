  detail: 'phase-0 branch: bl sub_80E1352 then battle_resetCollisionState_80101C4 then sprite_forceWhitePalette
    and Timer = 0x1E sets up a 30-frame white copy; loc_80C4A0E decrements oBattleObject_Timer and only
    proceeds when it goes negative, a standard multi-frame state delay; unpackVerActorTyAndAIIdx_800F29C
    on the related object''s NameID before sub_8011044(r2=1) re-registers the copy as a real actor; bl
    battle_killObjectWithDependents and final mov r0,#CUR_STATE_DESTROY / str [r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]
    end the effect and the state; mov r0,#0x93; bl PlaySoundEffect plays a fixed effect right before switching
    to destroy'
