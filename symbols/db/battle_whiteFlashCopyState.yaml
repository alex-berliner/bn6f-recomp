name: battle_whiteFlashCopyState
address: '0x080C49E4'
kind: function
status: probable
summary: Battle-object state that spawns a white-flashed duplicate of its related object, holds it for
  30 frames, then unpacks enemy info on the copy, kills the copy with its dependents, plays sound 0x93,
  and transitions the host object to CUR_STATE_DESTROY.
interface: (r5 = battle object) -> r0 = CUR_STATE_DESTROY on completion; flags from tst/sub used for branch
  only
details: On the first run (PhaseInitialized == 0) it creates/duplicates an actor via sub_80E1352 (r1 =
  0xF, likely an actor spawn kind), resets the copy's collision state, forces its palette to all-white
  (sprite_forceWhitePalette), sets its Timer to 30 frames, and marks the phase initialized (4). On later
  runs it counts the Timer down; when it expires it clears bit 1 of the object flags, unpacks {version,
  actor type, AI index} from the related object's NameID and calls sub_8011044 with r2 = 1, kills the
  related object with its dependents (battle_killObjectWithDependents), calls sub_80101AE with r0 = 0x1E0
  on the copy, plays sound effect 0x93, zeroes the first ExtraVars byte, and stores CUR_STATE_DESTROY
  into CurStateActionPhaseAndPhaseInitialized.
evidence:
