  reproduce: python3 tools/asmcat.py 0x0813096C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches most of the proposal: it stores 0x20 at [r5+0x10], dispatches via sub_803EAE4 (the
    eStruct200BC30 dispatcher), handles mode 4 via sub_81313C0 and mode 1 as an early return, seeds a
    pending 0xDC entry via sub_81325CC, loops over two 16-byte records comparing them against eLinkState
    fields (+0x1C word and +0xA halfword) requiring id 0xDC, checks no fade, and then calls init_cutsceneSceneState
    setting [r5+2]=4, [r5+0x14]=0, [r5+0x2A]=0xDC, copying old [r5+0x2A] into [r5+0x32]. The summary''s
    wording about ''link drops'' / ''resetting pending entry when the link drops'' is wrong — the 0xDC
    seeding is on the bit-0x10-clear branch which is the normal link-up path, not a drop handler. A cleaner
    summary that doesn''t claim a drop path and a name reflecting RFU link-record sync would fit better.;
    run wf investigate investigate-20261018-230610; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
