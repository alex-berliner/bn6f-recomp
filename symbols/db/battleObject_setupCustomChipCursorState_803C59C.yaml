open_questions:
- Exact role of byte_200BC60/byte_200BC61 (counter + period) is inferred
- from the code; whether byte_200BC61 is read fresh each call or set by
- a different function is not visible here.
- sub_8146BB8's role ("advance" cursor) is unconfirmed; the summary
- says only that it has no inputs and returns r0; the assembly here
- subtracts 1 from its return and stores to byte_200BC61, which suggests
- it returns the new period value rather than a frame index.
