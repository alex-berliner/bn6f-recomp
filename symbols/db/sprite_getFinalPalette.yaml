name: sprite_getFinalPalette
address: '0x08002DC8'
kind: function
status: confirmed
summary: Reads an object's sprite record via its VRAM tile offset and returns the sprite's final palette byte (masked
  to 0xF0).
interface: u8 sprite_getFinalPalette(void* objHeader /* r0 */); returns palette in r1 (value & 0xF0)
details: 'Takes an object header pointer in r0. Reads the TypeAndSpriteOffset byte at offset 2 of the header (oObjectHeader_TypeAndSpriteOffset),
  clears its lower nibble so the upper nibble — the sprite''s VRAM offset in 32-byte tile units — remains, and adds
  it to r0 to reach the object''s selected sprite record. Loads oObjectSprite_Unk_15 from that record (the final
  palette byte), masks it with 0xF0, and returns it in r1. r0 and r3 are clobbered; r1 is the only output. No memory
  flags are meaningful; C/V/Z/N are clobbered but unused by callers.

  '
