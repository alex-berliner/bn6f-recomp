  date: '2026-10-19'
  detail: adds oBattleObject_X/Y/ZVelocity to X/Y/Z then 'bl object_setPanelsFromCoordinates' (movement
    + panel snap); checks 'ldrb r0,[r0,#oBattleObject_CurAction]; cmp r0,#0x58' on RelatedObject1 before
    doing anything; on timer expiry stores 'Param1 | CurAnim<<4' at AIData+0x6C+ChargeShotStepIndex and
    increments the index; 'mov r0,#CUR_STATE_DESTROY; str r0,[r5,#oBattleObject_...]' marks the object
