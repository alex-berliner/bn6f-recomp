open_questions:
- no caller is known, so which entity spawns this object and what CurAction 0x58 exactly is (charge shot?)
  is unconfirmed
- the meaning of the recorded bytes Param1|CurAnim<<4 in the AIData 0x6C step table (hit animation/strength?)
  needs the AI script consumer
