name: battle_chargeStepObjectUpdate
address: '0x080E991C'
kind: function
status: probable
summary: Per-frame update for a battle object that drifts by its velocity and, when its timer expires,
  logs one entry into a related object's AI charge-shot step table before destroying itself.
interface: (r5 = battle object) -> void; destroys the object after recording a step
details: Adds X/Y/ZVelocity to X/Y/Z and refreshes PanelX/PanelY via object_setPanelsFromCoordinates.
  It then inspects RelatedObject1Ptr's oBattleObject_CurAction and only acts when it equals 0x58 (likely
  the charge-shot/charging action). It decrements oBattleObject_Timer; once the timer hits zero it reads
  oAIData_ChargeShotStepIndex from the related object's AIData, and if below 8 writes Param1 | (CurAnim<<4)
  into the AIData array at offset 0x6C + stepIndex, increments the index, and sets its own state to CUR_STATE_DESTROY.
  The routine ends with the standard sprite_update call. The related object is presumably MegaMan, whose
  AI script later consumes the recorded steps.
