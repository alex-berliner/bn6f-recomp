name: object_delayedAppearPhaseStep
address: '0x080BE0CE'
kind: function
status: probable
summary: Battle-object phase step that hides the object on its related object's panel for 3 frames, then
  moves the state machine on to phase 0x18.
interface: (r5 = battle object) -> void; sets oBattleObject_CurPhaseAndPhaseInitialized to 0x18 when the
  timer expires
details: Runs once per frame for some battle object. On the first pass (PhaseInitialized clear) it sets
  CurAnim = 3, copies the PanelXY halfword from oBattleObject_RelatedObject1Ptr into its own PanelXY,
  calls object_setCoordinatesFromPanels to recompute pixel X/Y, loads Timer = 3, and sets PhaseInitialized
  = 4. On subsequent passes it decrements Timer; when it reaches 0 it writes 0x18 into CurPhaseAndPhaseInitialized,
  which both selects the next phase (24) and re-clears the initialized flag for that phase. So this is
  a short timed 'hold in anim 3 at the related object's position' step before a later phase.
