open_questions:
- The exact meaning of the four dispatch constants (0x40A0/0x4090/0x24080/0x4080) inside dispatch_801DA48
  is unknown without more of its body.
- What the u32 at [r5,#0] (state index) and u8 at [r5,#3] (sub-state) represent structurally; r5 looks
  like a small per-battle-controller state struct but is not declared in the included struct headers.
