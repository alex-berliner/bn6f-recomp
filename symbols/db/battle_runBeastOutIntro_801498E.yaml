name: battle_runBeastOutIntro_801498E
address: '0x0801498E'
kind: function
status: confirmed
summary: 'Drives the two-tick Beast-Out battle-intro state machine: starts a screen fade on the first tick, then
  dispatches the appropriate intro variant once the fade completes and advances the battle object to the next phase.'
interface: void battle_runBeastOutIntro_801498E(u32 r5 /* battleObject */); /* r10, lr passed through; r5,r6,r7
  preserved */
details: "Operates on a battle-object structure via r5.\nSub-phase byte at offset 3: 0 = not yet started, 4 = fade\
  \ in progress.\nMain state word at offset 0 is set to 8 when the intro dispatches, advancing the outer state machine\
  \ past this stage.\nTick 1 (step==0): queries GetBattleMode; fade kind 0x6C for mode 1, 0x40 otherwise; calls\
  \ SetScreenFade(kind, 0x10); sets step byte to 4.\nTick 2+ (step==4): polls IsScreenFadeActive; returns immediately\
  \ (stays at state 4) while the fade is running.\nOnce the fade finishes:\n  - battle_IsBattleEnding_800A97A returns\
  \ non-zero → param 0x4080 (ending override, checked last so it wins).\n  - GetBattleMode==1 → param 0x40A0 (mode-1\
  \ specific intro).\n  - TestBattleFlag_0x40 zero (flag not set) → param 0x4090 (no-flag variant).\n  - TestBattleFlag_0x40\
  \ non-zero (flag set) → param 0x24080 (flag-set variant).\nCalls dispatch_801DA48(param) to queue the next battle-intro\
  \ script segment.\nThe literal pool at dword_80149EC (0x20080) is present but unreferenced in this function (likely\
  \ used by a sibling or was a previous code path).\n"
