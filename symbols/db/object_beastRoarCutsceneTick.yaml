name: object_beastRoarCutsceneTick
address: '0x080A5304'
kind: function
status: probable
summary: 'Cutscene object ticker: plays roar sound effects at fixed frames of its looping animation, then
  on the frame flagged 0x80 sets a story event flag and switches the object to state 0x10.'
interface: (r7 = object/env struct with event-flag id at +2 halfword; r5 = object state struct with state
  byte at +8 and timer at +0x24) -> r0 = sprite_update result; no meaningful flags
details: 'Calls sprite_getFrameParameters and tests the returned attribute byte against 0x80. If set,
  it reads the halfword event-flag id from [r7,#2], calls SetEventFlag with it, stores 0x10 into the state
  field [r5,#8], and falls through to sprite_update — the object ends its current phase and moves to a
  new state. Otherwise it increments a frame counter at [r5,#0x24] and fires one-shot sound effects at
  three thresholds: sound 0x14C at tick 50, 0xE6 at 74, and 0x99 at 93. The counter is not reset, so each
  sound plays exactly once per activation. sprite_update runs every call, keeping the object''s animation
  going. The captured route ''beastsp'' places it in the Cybeast-related cutscene, consistent with roar-like
  sound IDs and the terminal event-flag set.'
