- method: assembly-reading
  date: '2026-10-18'
  detail: 'tst r0,#0x80 after sprite_getFrameParameters: attribute-bit frame triggers the completion branch;
    bl SetEventFlag with ldrh r0,[r7,#2] and strb #0x10,[r5,#8]: completion sets event flag and new object
    state; cmp r1,#0x32/#0x4a/#0x5d with three distinct PlaySoundEffect calls (0x14C, 0xE6, 0x99): timed
    one-shot sound cues; counter at [r5,#0x24] incremented and never cleared: each sound fires once per
    activation; tail bl sprite_update every path: standard per-frame object animation update'
