name: ai_spawnRandomPatternAttacks
address: '0x080FAB48'
kind: function
status: probable
summary: Picks one of four random panel-coordinate patterns and spawns attack entities at the first two
  pattern panels, then spawns a third at the caster's own panel.
interface: (r0 = unused, r5 = battle object, r7 = AI attack-vars struct) -> r0 = X coordinate of the third
  spawned point (or its 7-x mirror); no meaningful flags
details: GetPositiveSignedRNG is masked with 3 and multiplied by 6 to index a 4-entry, 6-byte table at
  byte_80FABD4, so one of four coordinate sets is chosen at random. Each set holds three (x,y) panel pairs
  at offsets +2, +4 and +0, which are fed one at a time to spawners sub_80D52C4 (first two) and sub_80D50FC
  (third). For the first two calls r4 = oAIAttackVars_AiDifficultyTier | (oAIAttackVars_AttackBoost2 <<
  8) and r6 = oAIAttackVars_Damage; the spawn slot used is oAIAttackVars_ScratchVar + 0/+4/+8, so three
  entities are queued into an array in the AI attack-vars struct. r2 = 0x10 is passed as a constant to
  both spawners, and r3 = r7+0x34 is a pointer into the same struct. When oBattleObject_Alliance is nonzero
  (enemy-owned attack), each X coordinate is mirrored as 7-x so the pattern lands on the opposite field
  side. The final return value is the third point's X after mirroring, suggesting the caller may use it
  for further setup.
