name: saveInfoTextBlockToSram
address: '0x0803F918'
kind: function
status: probable
summary: Builds a 0x28-byte save block holding the info-text timestamp plus a checksum and writes it to
  SRAM at 0x0E007E00, retrying up to 3 times and setting/clearing event flag EVENT_172E to report success.
interface: () -> r0 = 0 if the SRAM write verified, 1 after 3 failed attempts; sets/clears EVENT_172E
  accordingly
details: 'First it copies 0x14 bytes from EXE6_InfoText_timestamp into byte_2006720, which sits at offset
  0x10 of a 0x28-byte staging block at byte_2006710. It zeroes the u32 at byte_2006714 (offset 4 in the
  block) and then sums all 0x28 bytes of the block (with that field still zero), storing the checksum
  there, so the checksum is computed with itself zeroed before it is written into the block. It then calls
  libSave_CopyToGamePak with src = byte_2006710, dst = 0x0E007E00 (Game Pak SRAM), len = 0x28, and calls
  sub_814D9C4 (presumably a read-back verify) whose result gates retry: up to 3 attempts. On success it
  sets EVENT_172E and returns 0; after all retries fail it clears EVENT_172E and returns 1.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: CopyBytes(EXE6_InfoText_timestamp, byte_2006720, 0x14) fills part of the staging block; loop
    at loc_803F92E sums 0x28 bytes of byte_2006710 into byte_2006714 after zeroing it (checksum field);
    libSave_CopyToGamePak(byte_2006710, 0x0E007E00, 0x28) writes the block to Game Pak SRAM; retry loop
