summary: 'Battle chip-select / custom-screen background draw pass: paints the chip-slot strips, packed-up
  chips and 2x14 chip graphics for the custom-cust screen using BG tile block 2.'
interface: (r5 = battleStatePtr, r10 = toolkitPtr) -> void ; writes tile-block 2 graphics via the bg_
  / pack helpers
details: '1. Saves r4-r7, lr; r7 := r5 (the battle-state pointer that all the battle-scene sub-functions
  take).

  2. Calls sub_81261FC with r0 = ldrh [r7+0x18] (battleState.Unk_18 / chip-row index) and r1 = byte_2017A00
  (some BG tile-id table). This presumably fills or selects one row of chip slot strips.

  3. Reads [r7+0x74] (toolkit.BattleStatePtr? actually [r5+0x74] – within the BattleState struct this
  is AliveOpponentActors[0x14]? No: BattleState at 0x80 is AliveBattleActors and r5+0x74 is likely a related
  battle sub-state pointer; the callees treat it as another state struct). Subtracts 0xA0 and adds 0x0C
  to get the BG tile base for the slot-strip row, then calls sub_812625C with width 4 to draw that 4-wide
  patch.

  4. Calls sub_812626C with the same row index, an unk_201DC20 table and width 0x0A / 0x0B / size 0x70
  to draw the chip-name strip (matches a 10-or-11-tile wide strip at 7 entries × 0x10 size = 0x70).

  5. Calls bg_drawTileStripTileBlock2_8126404 for another row at +0x11 with width 4 – draws the chip code
  row.

  6. Calls sub_8126430 with [r7+0x18] + the unk_201DC20 tile-id list + byte_2017A00 palette/data table
  + the chip-id table at 0x81249A4 + 0x6006C00 (likely OAM/affine or VRAM ptr). Fills in one row of 7
  chip data slots (the "chip-select" row).

  7. Calls bg_drawTileRegion2x14_8126484 at +0x0F to blit the 2x14 chip-preview graphics.

  8. Calls packSelectionSlots_8126494 with [r7+0x18] to pack the 7 chip-selection slots for this row.

  9. Calls bg_copyTilePatchBlock2_81264E4 at +0x19 with width 4 to copy a fixed 3x14 patch of chip-window
  background tiles.

  10. Restores r4-r7 and returns; no caller-visible return value.

  The whole routine is a per-frame (or per-update) redraw of the chip-slot UI panel for the chip-select
  / custom screen; multiple callers invoke it (battle_init, the object tick, the per-frame update, menu/state
  updates), confirming it is the chip-folder draw helper.

  '
