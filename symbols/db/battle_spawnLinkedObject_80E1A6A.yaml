name: battle_spawnLinkedObject_80E1A6A
address: '0x080E1A6A'
kind: function
status: confirmed
summary: Spawns a type-0x11 battle object and cross-links it with a parent object and an optional pointer slot so
  the caller can track the new object.
interface: battle_spawnLinkedObject(/* spawn args in r1-r3?, */ void* ownerObj /*r5*/, void** holderPtr /*r7*/)
  -> Next /* r0 = new object or NULL; Z set from r0, C/V cleared */
details: "Saves the caller's r5 (a battle object pointer) around the call, sets r0 = 0x11 and\ncalls object_spawnType4\
  \ to spawn a type-0x11 battle object (r1-r4/r6 are left as the\ncaller set them, apparently forwarded as spawn\
  \ arguments). If the spawn returned a\nnon-NULL object pointer in r0, the new object is wired both ways:\n  newObject->relatedObject1Ptr\
  \ = ownerObj (r5)\n  *holderPtr (r7) = newObject, skipped when r7 is NULL\n  newObject->extraVars = holderPtr\
  \ (r7)\nso the new object points at its owner and at the holder, and the holder points back\nat the new object.\
  \ The function ends with \"mov r0, r5\" after restoring r5, which is\nreally \"adds r0, r5, #0\": the caller receives\
  \ the new object pointer in r0 with the\nZ flag reflecting whether the spawn succeeded, and C/V cleared, so callers\
  \ can\nbranch on failure. Preserves r4-r7 and lr is returned to via pop {pc}.\n"
