open_questions:
- What object type 0x17 is (which chip/effect spawns it) — no caller found
- Whether the five arguments to object_spawnType1 are exactly r0-r3+stack or include r5, to pin the parameter
  layout
- Semantics of DamageAndStaminaDamageCounterDisabler and the collision byte =1
- The proposed name and summary match the code well (type 0x17 spawn, copying panel coords, element, AllianceAndDirectionFlip,
  RelatedObject1Ptr, damage/stamina, collision, and writing 1 to collision byte). However, calling it
  a 'MirroringObject' is speculative since no caller is known and the object's purpose isn't clarified
  by the callee (object_spawnType1 just spawns a generic type). A more neutral name reflecting the observed
  behavior is preferable.
