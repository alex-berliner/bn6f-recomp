name: battle_setupSpawnedType17Object
address: '0x080BBDE8'
kind: function
status: probable
summary: Spawns a battle object of type 0x17, then copies the source object's PanelX/PanelY/Element/AllianceAndDirectionFlip
  and its RelatedObject1Ptr into the new object, stores the passed damage/stamina-disabler and collision-data
  pointers, and flags the collision data as active (byte=1).
interface: (r0 = panelX, r1 = panelY, r2 = element, r5 = source BattleObject ptr, r6 = damage/staminaDisabler,
  r7 = collisionDataPtr) -> r0 = new BattleObject ptr, or 0/null if spawn failed; flags from null check
details: Calls object_spawnType1 with index 0x17 and the caller's r1/r2 (and further args) intact, receiving
  the new object pointer in r5. It copies the result to r0 before popping, since the pop reloads the caller's
  original r0-r2/r5 into r1-r3/r5. It then stores original r0->PanelX, r1->PanelY, r2->Element, original
  r5->RelatedObject1Ptr, copies AllianceAndDirectionFlip halfword from the source object r5 into the new
  object, and stores original r6 into DamageAndStaminaDamageCounterDisabler and original r7 into CollisionDataPtr.
  Finally it writes 1 to the first byte of the collision-data buffer. The extended-argument passing (values
  in r5-r7 never saved before use) and the field-by-field copy from the source object show this is a helper
  that clones a battle object's identity onto a newly spawned type-0x17 entity, likely a chip/trap effect
  tied to its owner.
