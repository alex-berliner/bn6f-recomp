    r2,[r0,#PanelY] / strb r3,[r0,#Element]: args become panel pos and element; ldrh r1,[r5,#AllianceAndDirectionFlip]
    / strh into r0: alliance+flip copied from source object r5; str r7,[CollisionDataPtr]; mov r1,#1;
    strb r1,[r7]: caller-supplied collision buffer, first byte set to 1'
