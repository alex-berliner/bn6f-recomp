name: battle_spawnAndInitObject0x33_80CA686
address: '0x080CA686'
kind: function
status: confirmed
summary: Spawns a battle object of type 0x33 and initializes it with the caller's arguments.
interface: Next* sub_80CA686(u32 a0, u32 a1, u32 a2, u32 a5)  // a5 in r5; returns object ptr or 0 in r0; r1-r3
  clobbered
details: 'Wrapper around object_spawnType3: pushes the caller''s r0-r2 plus r5 to the stack, calls object_spawnType3
  with r0 = 0x33 (the battle object type to create). The new object pointer is returned by object_spawnType3 in
  r5. If a non-null object was spawned, the original r0-r2 are shifted down into r1-r3 (performed by the push/pop
  register shuffle, since the original r0 now holds the object pointer) and BasicBattleObjectInitialize is called
  on the new object with the caller''s original arguments. r4-r7 and lr are preserved; if no object was spawned
  the initialize call is skipped and only r0 (0) is returned.

  '
