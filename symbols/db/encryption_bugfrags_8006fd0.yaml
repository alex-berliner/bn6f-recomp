name: encryption_bugfrags_8006fd0
address: '0x08006FD0'
kind: function
status: confirmed
summary: Anti-tamper integrity check on the protected BugFrag counter; reports intact vs. tampered via the Z flag.
interface: 'void checkBugFragTamper_8006fd0(void); /* no register args (r10 = toolkit); no register return — result
  is in flags: Z set = counter intact, Z clear = tampered */'
details: 'Loads the game state via toolkit->GameStatePtr (r10 toolkit). Reads the obfuscated

  BugFrag counter at oGameState_ProtectedBugfrags and its one''s-complement shadow copy

  at oGameState_Unk_70; if counter != ~shadow, sets bit 1 (0x2) of the tamper flags

  word at oGameState_Unk_74 (read-modify-write OR). Then XORs the counter with the key

  dword at dword_20018B8 (IWRAM) and compares the result against a stored mirror value

  read through toolkit->oToolkit_Unk2005030_Ptr (double pointer). The final comparison

  result is left in the NZCV flags (CMP), and on mismatch r0 is set to 1 solely to

  clear Z — but since r0-r7 and pc are restored by push/pop, r0 has no observable

  value to callers; the flag result is the only output. Callers are expected to read

  Z (e.g. conditional branch) immediately after the call.

  '
