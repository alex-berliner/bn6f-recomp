name: chatbox_copyTextWindowTiles
address: '0x08137E3C'
kind: function
status: probable
summary: Copies a 7×14 block of tile-ids (the text-window background for a message) into background tile
  block 2 at the given tile coordinates.
interface: (r0 = dest tile j, r1 = dest tile i, r2 = tile_ids *const u16) -> void; no return value
details: 'Wrapper: r0 and r1 are forwarded unchanged as the j/i position arguments to CopyBackgroundTiles,
  r2 is shuffled into r3 as the tile_ids pointer, the tile-block argument is hardcoded to 2, and the block
  size is hardcoded to 7×14 tiles (set in r4/r5 before the call, matching CopyBackgroundTiles'' extended-arg
  convention). The 7×14 dimensions match the chatbox text-window area. Called from chatbox_renderTextEntry
  right after it builds the message''s tile ids, so it draws the textbox frame/background for the current
  message. r4-r7 are saved only because r4/r5 carry the size arguments; the routine has no state of its
  own.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: mov r2,#2 / mov r4,#7 / mov r5,#0xE set hardcoded tile block 2 and 7×14 size before bl CopyBackgroundTiles;
    mov r3,r2 forwards the caller's pointer as CopyBackgroundTiles' tile_ids argument; Sole caller chatbox_renderTextEntry
    draws a message and places it at a fixed screen position, consistent with textbox background blitting
