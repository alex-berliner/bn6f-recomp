name: SpawnCounterPinkRingMaybe_80C4C12
address: '0x080C4C12'
kind: function
status: confirmed
summary: Spawns the pink counter-hit ring (object type 0x5E) over the counterattacked enemy and links it to the
  object that scored the counter.
interface: '(x: u32 r1, y: u32 r2, z: u32 r3, params: u32 r4, owner: *BattleObject r5, outPtr: *BattleObject* r7)
  -> *BattleObject r5 (new ring object, or NULL on failure); r1..r4 are passed straight through to object_spawnType1'
details: "Wrapper around object_spawnType1: sets the object type to 0x5E (the pink ring\nthat hovers over MegaMan's\
  \ target when a counter hit connects) and forwards\nx/y/z (r1-r3) and the spawn params (r4) unchanged. The callee\
  \ returns the new\nobject in r5, which clobbers the owner pointer, so the owner is saved on the\nstack (push/pop\
  \ r5) and restored before use — the caller's r5 value comes back\nreplaced by the ring pointer.\n\nIf the spawn\
  \ succeeded (r5 != 0):\n  - copies the owner's oBattleObject_AllianceAndDirectionFlip halfword into the\n    ring,\
  \ so it inherits the owner's alliance and direction-flip state;\n  - stores the owner pointer in the ring's oBattleObject_RelatedObject1Ptr,\n\
  \    linking ring -> owner;\n  - stores the caller's r7 pointer in the ring's oBattleObject_ExtraVars+4 and\n\
  \    writes the ring's own pointer back through r7 (ring -> caller), i.e. r7 is\n    an out-pointer slot that\
  \ also gets kept inside the ring's extra vars;\n  - sets oBattleObject_Unk_0c to 1;\n  - sets OBJECT_FLAG_PAUSE_UPDATE\
  \ (bit 4 of oObjectHeader_Flags), suspending\n    the ring's normal update until its script/other code clears\
  \ it.\n\nOn spawn failure it just returns with r5 = 0 and touches nothing.\nNote r0 (type argument) is set after\
  \ push {lr} but the owner in r5 is what's\nstacked; r4-r7 are preserved for the caller per the contract.\n"
