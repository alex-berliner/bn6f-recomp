name: sub_80A5514
address: '0x080A5514'
kind: function
status: confirmed
summary: 'Spawns an overworld object: assigns a sprite (special id 0x4E for map group 0x85, else 0x0B), loads graphics
  + animation, applies layer effect/priority, remembers the spawn position, optionally plays entry sound 0x17F,
  sets a 0x12-tick state timeout, then advances the object''s sub-state to 4 and tail-dispatches to sub_80A5588.'
interface: void owObject_spawnSetup_80A5514(u32 r5 /*owObject*/, u32 r6 /*sourceObject*/, u32 r10 /*toolkit*/) ->
  r2 r5 r10 r11; clobbers nz c v r0 r1 r3 lr; preserves r4 r6 r7 r8 r9 r12
details: 'Sets owObject byte 0 to 3 (sub-state "spawning"). Reads oToolkit_GameStatePtr->oGameState_MapGroup;

  if it equals 0x85, sprite id is 0x4E, otherwise 0x0B. Calls sprite_load(0x80, 0x1C, spriteId)

  and uses the returned r5 as the active sprite handle. Copies srcObject[5] as the animation

  index via sprite_setAnimation, then sprite_loadAnimationData and sprite_noShadow. Calls

  applyLayerEffectToOWObject_8035694(spriteHandle + 0xC), which may rewrite r5/r6/r10, then

  sprite_setPriority_8002E14. Saves the current world position (offsets 0x0C/0x10) into the

  "previous position" slots at 0x24/0x28. Zeros animation counters at offsets 5/6, sets a

  timeout of 0x12 at offset 0x2C, and copies srcObject[5] into offset 7 of the sprite handle.

  If the sprite''s flag byte at offset 4 has bit 0 clear, plays sound effect 0x17F; if that

  flag byte is fully zero, also writes 0x0A into srcObject[0xF] (spawn delay/timer).

  Sets owObject sub-state to 4 at offset 8 and tail-calls sub_80A5588. The final pop restores

  r5 (and r4-r7) so the caller''s r5 is preserved as the original owObject.

  '
