name: t4_setCycleFrameIndex
address: '0x0804CCC0'
kind: function
status: confirmed
summary: Drives a two-cell cycling animation for a battle effect, picking the frame index from the global frame
  counter every 16 frames.
interface: void t4_setCycleFrameIndex(Toolkit* r10 /*, lr = return address */)
details: 'Reads the current global frame counter word via toolkit+oToolkit_CurFramePtr (halfword at [curFramePtr]),
  masks it with 0xF, and indexes byte_804CCE0 with the result. The 16-entry table yields 0x8 for the first 8 frames
  of the cycle and 0x9 for the next 8, so the animated state toggles between animation cell indices 8 and 9 every
  8 frames (full cycle of 16). The looked-up index is stored to [state+2] and the constant 0x10 to [state+3] of
  the struct at toolkit+oToolkit_Unk2009740_Ptr (a per-battle-effect state record; byte +2 is the current frame/cell
  index, byte +3 a fixed sub-counter/loop length of 16). lr is only pushed to be popped into pc (leaf-style return);
  r4-r7 are preserved but unused. The t4_ prefix suggests this is step/handler 4 of an effect (animation) state
  machine, setting up its cycling frame pair.

  '
