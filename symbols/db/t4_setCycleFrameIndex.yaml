name: t4_setCycleFrameIndex
address: '0x0804CCC0'
kind: function
status: probable
summary: Every-16-frame ticker that alternates a byte (8 then 9) plus constant 0x10 into a toolkit-referenced
  buffer, likely a frame/animation selector.
interface: () -> r0,r1 clobbered; writes [Unk2009740+2] = table[(frame & 0xF)], [Unk2009740+3] = 0x10;
  no return value, flags not meaningful
details: Reads the current frame counter via oToolkit_CurFramePtr and masks it with 0xF, giving a 16-frame
  cycle. Indexes byte_804CCE0, whose 16 entries are 8 for frames 0-7 and 9 for frames 8-15, so the output
  alternates between 8 and 9 every 8 frames. It stores that byte at offset +2 of the struct pointed to
  by oToolkit_Unk2009740_Ptr and the constant 0x10 at offset +3. r4-r7 are pushed but never used, suggesting
  copied template code. The pair (index, 0x10) written to consecutive bytes looks like a small command/anim
  record consumed elsewhere, but no caller or consumer is known.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldr r0,[r10,#oToolkit_CurFramePtr]; ldrh r0,[r0] — frame counter source; and r0,#0xf then ldrb
    r0,[r1,r0] with byte_804CCE0 — 16-entry table of 8x8 then 8x9 values; strb r0,[r1,#2]; mov r0,#0x10;
    strb r0,[r1,#3] — writes index plus constant into Unk2009740 struct; push {r4-r7} but r4-r7 unused
    — boilerplate, no other side effects; run on beastsp route — context suggests beast-out related overworld/battle
    effect
