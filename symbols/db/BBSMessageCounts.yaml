summary: 'Proposed name: BBSMessageCounts. Per-board circular message-table write counts for BBS messages.
  (table of u32)'
details: Eight consecutive 32-bit counters, one for each BBS board. reqBBS_addBBSMessage_813e5dc selects
  a counter by board number shifted by two, increments it, and uses the old value as the circular-table
  write index. The clear and dead-message handlers clear either one selected counter or the entire eight-counter
  array.
