name: battle_hudQueueGfxLoadAndStartTimer
address: '0x0801EC44'
kind: function
status: probable
summary: Loads two blocks of graphics (to VRAM and an IWRAM buffer) and kicks off a HUD request with a
  60-frame timer in the battle HUD state.
interface: () -> (); queues two GFX transfers, sets request bit 0x00200000 via eStruct2035280_SetRequestBits,
  dispatches it, and writes 0x3C to eStruct2035280+0x1B
details: With no arguments, it queues 0xC0 bytes from ROM dword_86E994C to VRAM 0x06016D00 and 0x20 bytes
  from ROM dword_86E9A0C to the IWRAM buffer byte_30016F0, both via QueueEightWordAlignedGFXTransfer.
  It then ORs request bit 0x200000 into eStruct2035280+0x40 and immediately calls dispatch_801DA48 with
  the same bit, so the queued redraw/transfer request is processed right away. Finally it stores 0x3C
  (60) into byte_203529B, which given the HUD struct layout is most plausibly a frame countdown/animation
  timer for the element whose tiles were just loaded. The 0x200000 request bit and dispatch pattern suggest
  it activates (or restarts) a specific HUD graphic, e.g. a gauge/indicator overlay, rather than a one-time
  upload.
