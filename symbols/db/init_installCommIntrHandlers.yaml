name: init_installCommIntrHandlers
address: '0x03005E2C'
kind: function
status: probable
summary: Startup-time setup that installs the two communication/SIO interrupt callbacks and flags the
  comm system as initialized.
interface: () -> void; preserves IME, sets dword_3001D60 = TRUE
details: Runs from the crt0 entry trampoline, so it is part of early game initialization. It saves the
  InterruptMasterEnableRegister, writes 0 to disable all interrupts, then sets dword_3001D60 (an IWRAM
  flag, likely 'comm lib initialized') to TRUE. It installs libSIO814469C+1 at interrupt-table index 0x18
  and sub_81446AC+1 at index 0x1C via _SetInterruptCallback — both callees live in the SIO library region,
  pointing at serial/multiboat communication interrupts. Finally it restores the saved IME value. The
  brief IME blackout ensures the new handlers can't fire mid-installation.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: pushed IME value is saved, zeroed during setup, and restored (ldr/strh around off_3005E54);
    writes TRUE into dword_3001D60, a flag presumably polled before using comm features; calls _SetInterruptCallback
    twice with indices 0x18 and 0x1C and callbacks libSIO814469C+1 and sub_81446AC+1; sole caller is crt0_entry_trampoline_8000288,
    the ROM entry stub, so this is boot-time init
  refs:
