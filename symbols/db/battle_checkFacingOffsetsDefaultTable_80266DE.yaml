name: battle_checkFacingOffsetsDefaultTable_80266DE
address: '0x080266DE'
kind: function
status: confirmed
summary: Thin battle helper that runs the facing-offset check against one fixed default table instead
  of a caller-supplied one.
interface: battle_checkFacingOffsetsDefaultTable(u32 r4, u32 r5, u32 r6, u32 r7) -> r0, r1, r5 (r4/r6/r7
  preserved; nz/c/v, r2, r3 clobbered)
details: 'Two-instruction wrapper: it loads the fixed table pointer byte_80267AB into r0 and tail-calls

  battle_checkFacingOffsets. The caller''s r4-r7 are forwarded untouched, so those are the real

  inputs (likely the battle entity/actor pointer and facing-related fields that

  battle_checkFacingOffsets inspects). The meaningful outputs are whatever battle_checkFacingOffsets

  leaves in r0/r1 and r5; this wrapper adds nothing of its own and does not touch flags itself

  (it only propagates the callee''s flags by branching through pop {pc} into the tail call).

  Its only distinguishing behavior versus calling battle_checkFacingOffsets directly is the hard-coded

  table at byte_80267AB, so it acts as a "check facing with the default offsets" entry point for

  battle code that does not carry its own offset table.

  '
