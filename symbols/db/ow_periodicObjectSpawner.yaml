name: ow_periodicObjectSpawner
address: '0x0809B0D8'
kind: function
status: confirmed
summary: Per-tick handler for an overworld object that counts down a lifetime timer and, while armed, spawns a map
  object every 8th tick via SpawnOverworldMapObject.
interface: void ow_periodicObjectSpawner(r5=object, r10=toolkit); always returns r0=1 with NZ set from it; r2/r3/r4/r7
  may be clobbered on the spawn path, r4-r7 are preserved by the push/pop
details: "r5 points to an overworld object (event/map object) structure. Each call\ndecrements the signed 16-bit\
  \ lifetime counter at object+0x1A (decrement is\ndone in 32 bits, only the low half is stored back). Whether the\
  \ spawner is\narmed depends on the object's mode bytes:\n  - byte +6 == 2: armed once the lifetime has expired\
  \ (life <= 0),\n  - otherwise: armed while the lifetime is still running (life > 0) AND\n    byte +7 == 2.\nWhen\
  \ not armed the function just returns 1. When armed it increments the\n16-bit tick counter at object+0x18 and\
  \ only acts when the new tick value is\na multiple of 8 (tick & 7 == 0). On the firing tick it reads the map state\n\
  block from toolkit+0x3C, then the spawn parameter block from\nmap_state+0x18, and calls SpawnOverworldMapObject\
  \ with r0=0xB,\nr1=[spawn_data+0x1C], r2=[spawn_data+0x20], r3=[spawn_data+0x24], and\nr4 = 0x48000001 | (object+7\
  \ << 16), where byte +7 selects the object kind\nfolded into the high half of r4. Always returns r0=1; NZ flags\
  \ come from\nthat value. r4-r7 are saved/restored by the function itself even though\nthe callee runs over them,\
  \ so callers see them unchanged.\n"
