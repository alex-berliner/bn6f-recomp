name: refreshChipUseStats_8123A80
address: '0x08123A80'
kind: function
status: confirmed
summary: Refreshes a chip-use battle record by stamping the current navi's slot into the battle field/order
  list and caching the sum of two PET-navi stat bytes (Atk + Next) for that slot into the chip-use struct's
  +0x64 field.
interface: void sub_8123A80(struct ChipUseState* me /* r5 */); // reads r5+0xC (slot), r5+0x14 (navi id);
  clobbers r0-r3, r6, lr; preserves r4-r7, NZCV
details: "Called by NaviAI/battle routines that need to record a chip being used this turn for a given\n\
  PET navi. Operates on the chip-use record addressed by r5:\n  - off_201D220  -> gBattleFieldState (battle\
  \ field context blob)\n  - off_20343E0  -> gBattleOrderList (turn-order list)\nStep 1: sub_811FCB8(slot\
  \ = me->0xC, gBattleFieldState, 1, gBattleOrderList) -- marks/inserts\nthis navi's slot into the active\
  \ battle field and order list with flag 1 (likely \"this turn's\nactor\" / \"first registration\").\n\
  Step 3: stat_index = me->0xC * 2 + 0x56 -- a per-slot pair in the PET navi stats table, with\noffset\
  \ 0x56 baked in (probably a chip-template category header such as \"chip power/element\npairs\"). Two\
  \ adjacent bytes are fetched:\n  - byte 0  = \"Atk\"   stat for the PET navi\n  - byte 1  = \"Next\"\
  \  stat for the PET navi\nTheir sum is stored as a 32-bit word at me->0x64. That cached total is presumably\
  \ the chip's\neffective damage/attack stat used later by the damage formula. The function pops {r4,r6,pc}\n\
  and does not push r5, so r5 is implicitly preserved across the call (as noted in the register\ncontract);\
  \ both helpers called internally also preserve r4-r7.\n"
