summary: Redraws both tilemap layers of the whole map window centered on the camera's current tile position.
interface: (r10 = toolkit) -> void; calls redrawBGTileMapWholeWindow_803086C(eMapTilesState200be70, camX>>3,
  camY>>3)
details: 'Reads the camera struct pointer from the toolkit at oToolkit_CameraPtr, loads the signed halfword
  X at +4 and Y at +6, and converts pixel coordinates to tile coordinates with asr #3 (divide by 8). It
  then invokes the known whole-window redraw callback redrawBGTileMapWholeWindow_803086C with eMapTilesState200be70
  as the map state, redrawn at the camera''s tile. The heavy register save/restore (r8-r12) is boilerplate.
  No other state is touched.'
