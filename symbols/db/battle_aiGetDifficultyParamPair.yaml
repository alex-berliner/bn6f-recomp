name: battle_aiGetDifficultyParamPair
address: '0x08108152'
kind: function
status: probable
summary: Packs two per-difficulty AI parameter values (from two hard-coded 6-entry tables) into one word
  for a given AI difficulty index.
interface: (r0 = AI difficulty index 0-5) -> r0 = (param2 << 16) | param1, where each param is read from
  its table via the battle object's AI version; flags clobbered
details: The argument is multiplied by 8 and used to select one of six 8-byte sub-tables (byte_8108190..81081B8
  for table A, byte_81081D8..8108200 for table B). Each sub-table is then passed to battle_aiGetVersionedTableEntry_800FE12,
  which reads an entry (halfword) using the battle object's own AI version, including a special multiplier-scaled
  entry for AI version 4. Table A's values vary with difficulty (0x14, 0x28, 0x28, 0x14, 3, 0x78 — plausibly
  a frame delay or interval), while table B is a constant 10 (0xA) for every entry. The two results are
  packed as (B << 16) | A and returned. The words at 8108208-8108218 (object_findRandomFreeNearbyPanel,
  battle_checkPanelBehindObject) belong to the neighbouring caller sub_81080A6, hinting this pair feeds
  an AI movement/attack-scheduling routine.
