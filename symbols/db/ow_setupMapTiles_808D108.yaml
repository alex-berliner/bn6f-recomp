name: ow_setupMapTiles_808D108
address: '0x0808D108'
kind: function
status: confirmed
summary: Fetches the current overworld tile template, stamps it onto the map with template index 0, and refreshes
  the derived map/tilemap state.
interface: void sub_808D108(void); // reads r10 (context/map pointer passed through to callees), trashes r0-r3 and
  flags, r4-r9/r12 pass through from the callees and are preserved for callers
details: 'A thin overworld-map setup routine: it first calls sub_8142CB0 to obtain the current tile template description
  (result in r0), then calls ow_stampMapTileTemplate with that template and r1 = 0 (template index 0), and finally
  calls sub_8142D4C (ow_redrawMapTilemapsCb in the assembly) to redraw/refresh the derived map tilemap state. It
  does not touch any structure fields itself; everything is delegated. The r10 input is never read in this function''s
  own code, so it is consumed by one of the callees (most likely the stamp or template routine, which operate on
  the current map context). The listed "outputs" r2/r5/r9/r12 are simply values the callees leave behind that happen
  to survive to callers (r5 from ow_stampMapTileTemplate, r2/r9/r12 from sub_8142D4C), not deliberate return values.
  r4-r6 are saved/restored locally.

  '
