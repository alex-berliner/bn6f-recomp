name: battle_checkCutShortChargeAnimSetGuard_81154B8
address: '0x081154B8'
kind: function
status: confirmed
summary: Per-frame check that cuts a battle object's charge/release animation short at a marked frame, forcing it
  into the follow-up animation and raising the object's guard flag.
interface: void sub_81154B8(battleObject* r5)  /* r1 passes through to the return value; clobbers r0-r3, lr, flags
  */
details: 'Takes the battle object in r5. Reads oBattleObject_CurAnim; if it is not

  animation 2 (the charge-release attack animation) the function does nothing

  and returns, leaving the incoming r1 untouched. Otherwise it calls

  sprite_getFrameParameters for the current animation frame and tests bit

  0x80 of the result, a per-frame "cut short now" marker embedded in the

  animation data. When the bit is set it stores animation 3 into

  oBattleObject_CurAnim (ending the attack animation early, snapping the

  object into its post-attack/idle-like animation) and calls

  object_setFlag1 with flag OBJECT_FLAGS_GUARD on the object, so the rest of

  the battle object logic treats the object as guarding from that point.

  Note r1 is not a real parameter: the thunk-style wrapper preserves it and

  returns whatever the original leaves there (incoming r1 untouched on the

  early path, 0x80 left over from the tst mask on the failed-check path,

  object_setFlag1''s r1 otherwise). Data after the function (allianceDependentPanelFlags_8115330

  pointer, dispatch table off_81154F0, and per-frame byte tables) belongs to

  neighbouring state data, not to this routine.

  '
