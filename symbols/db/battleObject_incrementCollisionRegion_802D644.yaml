open_questions:
- Whether the cap is intended as "max 0xFE" (saturate before storing 0xFF) or "skip only when
- exact 0xFF would be written"; either reading collapses to the same observable behaviour in
- practice. Settled by re-reading the byte right at 0x2000070[r0] before and after the call in a
- controlled scenario. The exact semantic role (active-region refcount vs. teardown counter vs.
- generation token) is also unverified; the name is restricted to the observable behaviour.
