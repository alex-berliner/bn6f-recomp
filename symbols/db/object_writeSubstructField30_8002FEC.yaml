name: object_writeSubstructField30_8002FEC
address: '0x08002FEC'
kind: function
status: confirmed
summary: Writes a 32-bit value into field +0x30 of whichever 0x10-byte-aligned sub-structure of a scene/npc object
  is selected by the high nibble of byte +2.
interface: void object_writeSubstructField30(Object* obj /*r5*/, u32 value /*r0*/); // returns target address in
  r3 and sets flags via the ADDS used for the sub-struct offset
details: 'Takes an object pointer in r5 and a value in r0. The high nibble of the byte at

  obj+2 is masked to a byte offset ((byte >> 4) << 4, i.e. index * 0x10), which

  selects one of the 0x10-byte sub-structures attached to the object. The value is

  stored as a 32-bit word at (substruct + 0x30). The computed sub-struct address is

  returned in r3, and the ADDS that builds it sets N/Z/C/V, which at least one caller

  relies on (hence the unusual "outputs: v r3" contract). Likely a generic accessor

  shared by several callers that each set a different sub-struct kind''s +0x30 field

  (e.g. a pointer or counter inside a sprite/chatbox/battle sub-component); without

  caller context the exact meaning of the field is unknown.

  '
