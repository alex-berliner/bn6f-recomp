    - Transformation == 2 (BeastOut) branch: `cmp r0,#2; bne loc_8014ECE; mov r1,#1; loc_8014ECE: push
    {r1}` then `cmp r0,#0` (after pop) chooses whether to write 0xFF to NaviStats+0x0E via `battle_setPlayerNaviStatsField0E_8015BEC`.
    - 0x30E00 constant is loaded into r4 before `bl sub_80E11E0` (`ldr r4, dword_8014F00`).'
