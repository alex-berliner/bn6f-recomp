    write. - 10-frame timer: `mov r0,#0xa; strh r0,[r7,#oAIAttackVars_Unk_10]`, later `sub r0,#1; strh
    ...; bgt locret_8014EFE`. - Sound id 0x100: `mov r0,#1; add r0,#0xff; bl PlaySoundEffect`. - Class
    byte read/write at NaviStats offset 0x2C: `mov r1,#0x2c; bl GetBattleNaviStatsByte_AllianceFromBattleObject`
    (twice, before and after loading) and `bl SetBattleNaviStatsByte_AllianceFromBattleObject` with `mov
    r2,r0` of the freshly looked-up class. - Chip class lookup: `mov r1,#0x29; bl GetBattleNaviStatsByte_AllianceFromBattleObject;
    bl chip_class_lookup_800FC9E` — byte 0x29 (ClassIdx / Folder) is fed into the chip-class ROM tables.
    - `bl sprite_load(... r0=0x80 ...)` then `bl sprite_loadAnimationData` — standard "load + bind" sequence
