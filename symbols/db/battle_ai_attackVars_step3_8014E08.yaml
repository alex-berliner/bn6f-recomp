open_questions:
- The semantic identity of the AI step ("enter" animation that charges in, then resolves turn open) is
  inferred from the sequence; AIAttackVars_Unk_01 going 0→4 then Unk_00 going to 0xC strongly suggests
  "state 3 of attack-vars lifecycle", but no caller list is provided to confirm which enemy/Navi this
  fires for.
- What `sub_80E11E0(r4=0x30E00, ...)` actually does is unknown; the constant 0x30E00 might be a packed
  argument (chip id + element, or a script pointer).
- The "if Unk_01 != 0 skip init" pattern implies the function is re-entered each frame from a dispatcher;
  the dispatcher's identity is unknown (likely in the AI subsystem, possibly a sibling in this same file).
