status: probable
summary: AI step 3 for a battle object's attack vars — plays the load/charge-in animation, sets a 10-frame
  counter, plays a sound, and on expiry runs the turn-open / sprite-restoration cleanup and sets the next
  state to 0xC.
interface: (r5 = battle object, r7 = AI attack vars, r10 = toolkit, lr = ret) -> void ; no return value
  to callers
details: "Guarded by AIAttackVars_Unk_01: if non-zero, falls through to the counter-expiry branch immediately;\
  \ otherwise it does the \"enter\" path.\n  Enter path (Unk_01 == 0): forces the palette to white, then\
  \ loads a chip class for the object's alliance (`GetBattleNaviStatsByte(0x29)`), loads the sprite (class\
  \ 0x80), attaches animation data, enables shadow, sets animation index 0, mirrors the sprite from `object_getFlip`,\
  \ and `object_setCoordinatesFromPanels`. Stamps `AIAttackVars_Unk_10 = 0x0A` and re-whites the palette.\
  \ Writes the loaded class byte back into NaviStats offset 0x2C via `SetBattleNaviStatsByte_AllianceFromBattleObject`.\
  \ Calls `sub_80E11E0(r4 = 0x30E00, ...)`, then plays sound effect `0x100` (r0 = 1, r0 += 0xFF). Reads\
  \ NaviStats 0x2C again; if 1..0x18 it sets the object's text name id (`battle_setObjectTextId_8015B22`).\
  \ Calls `sub_8011268(0, 0x2c)` (a 24-way mode jump table), zeroes Param3 of `RelatedObject2Ptr` if non-null,\
  \ runs `battleObject_computeAIStepForwardDeltaX_8018856(3)` and `sub_801DC06(-dx, ...)`, then sets `AIAttackVars_Unk_01\
  \ = 4` and falls into the counter.\n  Counter branch: `AIAttackVars_Unk_10--`, while > 0 it returns.\
  \ When it hits 0, it calls `callPossiblyGetBattleEmotion_8015B54(alliance)`; r0 == 2 ⇒ `r1 = 1` else\
  \ `r1 = 0`, that boolean is pushed and used later. Calls `battle_beginTurnOpenProcess_80144C0` then\
  \ `battleObject_markUsedAction_80143A6`. If the saved boolean is 1 it calls `battle_setPlayerNaviStatsField0E_8015BEC(alliance,\
  \ 0xFF)`. Calls `object_clearInvulnerableTime` and, if `RelatedObject2Ptr != NULL`, `sprite_clearFinalPalette`\
  \ on it (saving/restoring r5 around the call). Finally sets `AIAttackVars_Unk_00 = 0x0C` (the next AI\
  \ state) and returns.\n  Notable: only `push {r4,lr}` is used so r4 is callee-saved across the function\
  \ (it's used to carry 0x30E00 into `sub_80E11E0`). The two extra `push {r0}` / `push {r1}` slots are\
  \ short-lived temporaries (class byte and the transformation==2 boolean).\n"
