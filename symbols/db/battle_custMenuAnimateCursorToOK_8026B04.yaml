    sub_801E0A0` show the standard chatbox-init trio for the chip-select slide animation - The slide loop
    uses `bgmap_WriteTileIdAtBlock_800187C` (r0=tileID, r1=blockX, r2=blockY, r3=tileId-from-unk_2035000)
    inside a `mov r7, #0x14`-bounded inner loop and a `sub r6, #1; bne loc_8026B46` outer loop whose count
