status: probable
summary: 'Battle chip-select sub-state: animates the chip cursor sliding right to the OK column and writes
  the per-frame BG tile IDs; commits the selected chips on completion by damaging the player and queueing
  the next menu state.'
interface: '(r5 = *S20364C0 chip-select state, r10 = *Toolkit) -> void ; side effects: BG tile map writes
  at chip-select block, plays sound effect 0x79 (select), updates chatbox/eRenderInfo, damages player
  HP, switches JumpOffset01 to either 0x2C or 0x4'
details: "First-time entry (Unk_02 == 0): plays SOUND_SELECT_79 (`mov r0, #0x4f` then `PlaySoundEffect`),\
  \ sets RenderInfo+0x18 = 0x78 (the chip-select tile width), clears chatbox+0x12 via sub_801E71C(r0=0),\
  \ calls dispatch_801DACC(0x80) and sub_801E0A0(0xf, 0), seeds the slide with Unk_44 = 0xf and Unk_40\
  \ = 0x78, and latches Unk_02 = 1 so the entry sound only fires once.\n  Each frame decrements Unk_44\
  \ and uses it as an index into unk_2035000 to write a 3-tile-wide row of BG tile IDs (`bgmap_WriteTileIdAtBlock_800187C`\
  \ repeated with r2=3). The loop runs twice (r6 = ((Unk_40 - 0xc) & 4) >> 2 + 1) to cover both chip-slot\
  \ rows, sliding leftward (Unk_40 -= 0xc) until the cursor reaches the OK column.\n  After the slide,\
  \ if BattleMode != 1 the camera Y is shifted by -0x18000; the new Unk_40 is mirrored to RenderInfo+0x18\
  \ and to chatbox+0x12 via sub_801E71C(0x78 - Unk_40). When the slide finishes (r0 == 0), the function\
  \ looks at Unk_0c: if 0xff or (0x05 and BattleState+7 < 5) it transitions to JumpOffset01 = 4 (custMenuUpdateWaitSelectionState_8026CCC),\
  \ otherwise JumpOffset01 = 0x2C (sub_802728C), clearing Unk_02 so the entry sound replays next time.\n\
  \  Damage to the player differs by BattleState+7: if == 1 it renders enemy names instead of damaging,\
  \ else it calls battle_damagePlayerLeave1HP_8013FD0 twice with damage 0 and 1 (the chip-cost chip, then\
  \ the 1-HP safety hit). Finally it calls battleObject_chipSelectAnimTick_8029C08.\n"
