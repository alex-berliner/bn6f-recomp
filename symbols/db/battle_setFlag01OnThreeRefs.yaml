name: battle_setFlag01OnThreeRefs
address: '0x080C78DC'
kind: function
status: probable
summary: Walks three pointer fields of the r5 context struct and sets a 1 flag byte on each pointed-to
  object.
interface: (r5 = context struct; r0/r1 scratch) -> writes 1 to byte 0x0B of each non-null pointer at r5+0x64/0x68/0x6C;
  r0 clobbered
details: Loops i=0..2, computing offset 0x64+4*i into the struct at r5 and loading a pointer from it.
  If the pointer is non-null, it stores 1 into that object's byte at offset 0x0B; null pointers are skipped.
  The loop is fixed at three entries and the function touches nothing else, so it is a small flag-setting
  pass over up to three linked objects/records. Given the recorded battlesweep route and the byte-0x0B
  write, this likely marks those objects with an active/hit/kill-style flag rather than returning data.
  The meaning of byte 0x0B and the identity of the r5 struct are not established from this function alone.
