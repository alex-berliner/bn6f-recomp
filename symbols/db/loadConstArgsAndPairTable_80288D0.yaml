name: loadConstArgsAndPairTable_80288D0
address: '0x080288D0'
kind: function
status: confirmed
summary: Pure constant-setup stub that returns fixed arguments (0x5B, 0x6E) and a pointer to a 16-entry byte-pair
  table for the caller's next operation, likely dialog/menu or animation parameters.
interface: void sub_80288D0(void) -> r0=0x5B, r1=0x6E, r6=&byte_80288E4; NZCV set as if by CMP 0x70,2 (N=0 Z=0 C=1
  V=0); no inputs besides lr
details: "Leaf routine called normally (push {lr} / pop {pc}) that does no memory or game-state\naccess; it only\
  \ fabricates values in registers and returns:\n  r0 = 0x58 + 3 = 0x5B\n  r1 = 0x70 - 2 = 0x6E  (the SUB also sets\
  \ NZCV, so flags are a side product, not meaningful)\n  r6 = &byte_80288E4\nbyte_80288E4 is a 32-byte table of\
  \ 16 little <lo, hi> byte pairs:\n  (2,0) (1,0) (2,0) (0x16,0x10) (0x14,0) (0x16,0x30) (0x14,0) (1,0x20)\n  (4,0)\
  \ (3,0) (4,0) (0x14,0x10) (0x12,0) (0x14,0x30) (0x12,0) (3,0x20)\nThe pairs read like <value, modifier> items\
  \ (small indices 1-4 with 0, and\n0x12/0x14/0x16 = 18/20/22 paired with 0x00/0x10/0x20/0x30 modifiers), which\
  \ is a\ncommon shape for icon/animation selections or chatbox choice parameters in this codebase.\nThe pattern\
  \ of a tiny function returning constants plus a data pointer in a callee-saved\nregister (r6) suggests the caller\
  \ immediately consumes r0/r1 as IDs or coordinates and\nwalks the r6 table. This looks like one of several sibling\
  \ stubs that each load a\ndifferent constant set + table, i.e. a hand-written argument-provider rather than a\n\
  state machine.\n"
