name: battle_endSubObjectSlots
address: '0x080E7DA4'
kind: function
status: probable
summary: Marks the four sub-object slots at offsets 0x60/0x64/0x68/0x6C of an object as ended.
interface: (r0 = base object pointer) -> void; calls object_endSubObject on each non-null slot handle
details: The function takes a pointer (r5) and loads four words from offsets 0x60, 0x64, 0x68, and 0x6C,
  passing each to object_endSubObject. object_endSubObject writes 0xFF into byte offset 0x11 of the referenced
  sub-object, marking it finished; passing a null handle short-circuits. The four fixed offsets correspond
  to the standard sub-object slots used by battle objects.
