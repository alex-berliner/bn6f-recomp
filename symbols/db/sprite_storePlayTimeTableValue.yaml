name: sprite_storePlayTimeTableValue
address: '0x080DA9A2'
kind: function
status: probable
summary: Breaks the global play-time counter down via the clock helper and stores a table-selected 32-bit
  value (indexed by one breakdown component) into a sprite struct's field 0x2c.
interface: (no meaningful args; play time read globally) -> table word in r0 passed to sprite_setUnk0x2c;
  r1 whatever breakPlayTimeIntoHMSF left, flags clobbered
details: Calls clock_breakPlayTimeIntoHMSF_8000DE0, which splits the play-time frame counter into h/m/s/frames
  via three BIOS divisions; only its r3 output is used here, shifted left by 2 as a byte offset and used
  to load a word from the nearby table byte_80DA9B8. The table's visible entries (little-endian words)
  are 0x07F8<<16, 0x0BF8<<16, 0x0DF8<<16, 0x0EF8<<16, 0x0F78<<16, 0x0FB8<<16, 0x0FD8<<16, 0x0FE8<<16,
  0x0FF0<<16 — a sequence rising toward 0x0FF8 with halving increments (+0x400, +0x200, +0x100, ...),
  i.e. an asymptotic ramp, suggesting a time-driven intensity/rate rather than a per-frame animation frame.
  The loaded word is then handed to sprite_setUnk0x2c, which stores it into field 0x2c of the sprite struct
  selected via the object header's sprite-ID nibble. No caller is known, so which sprite/entity receives
  this and why it scales with play time is unconfirmed.
