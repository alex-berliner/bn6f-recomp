name: battle_initChipSelect_802BD60
address: '0x0802BD60'
kind: function
previous_names:
- sub_802BD60
status: probable
summary: Initializes the chip-select/custom-screen state at eS20364C0, dispatches by Index_00 to a tile-copy
  routine, then runs a panel scan
interface: '(r0 = unused=4) -> r0 = 1 ; side effects: writes eS20364C0.Unk_05, copies tiles to a BG block,
  calls sub_802C460'
details: "- Sets r5 = eS20364C0 (0x020364C0), the chip-select state struct (S20364C0).\n  - Writes 1 to\
  \ eS20364C0.Unk_05 (`strb r0, [r5,#0x5]`).\n  - Calls battle_getStateTableEntryPtr_802C8EA to get a\
  \ 8-byte entry from the table at 0x02036820 selected by BattleState.Unk_0d, stores the pointer in eS20364C0\
  \ +0x18 (`str r0, [r5,#0x18]`).\n  - Copies Unk_06 to Unk_07 (`strb r0,[r5,#0x6]; strb r0,[r5,#0x7]`).\n\
  \  - Reads eS20364C0.Index_00 (`ldrb r0, [r5]`) and jumps via the table at off_802BDA0 to one of: sub_802BDB4\
  \ (BX +1 trick so it's actually a Thumb+1 dispatch), sub_802BDC0, or sub_802C348. Each of those writes\
  \ a different sized 32x32 tile block by reading signed byte offset +0x6 of eS20364C0, setting j=that\
  \ signed value, i=2, tileBlock32x32=3, tileIds=unk_2034B30, j_size=0x18, i_size=0x12 and calling CopyBackgroundTiles.\n\
  \  - After the dispatched call returns it calls sub_802C460, which scans panel positions and may raise\
  \ a type-3 notification.\n  - Restores the value of eS20364C0.Unk_05 into r0 and returns 1 in r0 (via\
  \ `ldrb r0, [r5,#5]; pop {r5,pc}`).\n  - The captured-call returns show r0=1 always, with r1,r2,r3 typically\
  \ left from the previous sub_802C460 call.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldr r5, off_802BDAC` loads 0x020364C0 (eS20364C0) per the constant table in the asm file.
    - `strb r0, [r5,#0x5]` with `mov r0,#1` sets Unk_05 to 1. - `bl battle_getStateTableEntryPtr_802C8EA`
    followed by `str r0,[r5,#0x18]` saves the entry ptr at +0x18. - Dispatch table `off_802BDA0: .word
    sub_802BDB4+1, sub_802BDC0+1, sub_802C348+1` indexed by `ldrb r0, [r5]` (Index_00). - The three dispatched
    routines all do `ldrsb r0,[r5,r1]` with `mov r1,#6` (Unk_06) and call `CopyBackgroundTiles` with the
    parameters enumerated above, so they draw a 24x18 tile area into BG block 3 from `unk_2034B30`. -
    `bl sub_802C460` is called once after the tile copy regardless of which dispatch ran. - Final `ldrb
    r0,[r5,#5]; pop {r5,pc}` returns Unk_05 (which was set to 1) and exits. - Callers (sub_80094B6/9916/9C06/9F3A)
    match the contract: all four are battle sub-state handlers and the consistent 0x4 in r0 across captured
    calls is the battle substate id argument reused.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x0802BD60

    '
  result: the body read as described above
