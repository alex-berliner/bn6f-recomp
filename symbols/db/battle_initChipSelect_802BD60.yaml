open_questions:
- The actual semantics of Index_00 (three sub-modes) and what the 3 dispatched routines differ on. They
  all use Unk_06 as the j (signed column offset), so they likely draw different tile subsets based on
  sub-mode.
- What type-3 notification sub_802C460 raises here; not derivable from this function alone.
