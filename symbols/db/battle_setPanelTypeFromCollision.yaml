name: battle_setPanelTypeFromCollision
address: '0x080DFDD6'
kind: function
status: probable
summary: Maps the collision-data flag bits of a battle object to a panel/terrain type index (1-5, 0 =
  none) stored in its related object's byte 0x74.
interface: (r5 = battle object) -> void; writes byte 0x74 of [r5+#RelatedObject1Ptr]; no return value
details: Reads oCollisionData_FlagsFromCollision from [r5+#oBattleObject_CollisionDataPtr], then clears
  byte 0x74 of the object pointed to by RelatedObject1Ptr. It walks a 5-entry word table at byte_80DFE08
  (0x2, 0x8, 0x10, 0x20, 0x400) and on the first bit set in the flags stores index+1 into byte 0x74; if
  no bit matches the byte stays 0. The related object is presumably the tile/panel entity under the actor,
  and 0x74 holds its panel-type enum. r4, r6, r7 are pushed but unused.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldr r1, [r1,#oCollisionData_FlagsFromCollision] loads the collision flag word to be tested;
    tst r1, r2 loop over off_80DFE04 table of single-bit masks 0x2/0x8/0x10/0x20/0x400; strb r0, [r1,#0x74]
    with r0 = index+1 stores the matched type into RelatedObject1Ptr+0x74; initial strb r2 (0), [r0,#0x74]
    ensures 0 when no terrain flag matches
