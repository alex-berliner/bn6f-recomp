name: battle_getNaviStatsByte_800A540
address: '0x0800A540'
kind: function
status: confirmed
summary: Reads one byte of the current navi's stats, choosing the active in-battle navi stats block or the PET's
  navi stats depending on a battle-effect flag.
interface: int battle_getNaviStatsByte(int petSel /*r0*/, int statIndex /*r1*/)
details: 'Dispatcher over the two navi-stat sources. Calls GetBattleEffects() and tests bit 0x200000 of the result:
  if set, it tail-calls GetNaviStats203CCE0Byte with r1 = statIndex, but leaves r0 as the GetBattleEffects return
  value (the battle-effects bitmask is passed as the callee''s first argument — either the callee ignores it, or
  this is an intentional/accidental quirk of the original code). If the effect bit is clear, it restores r0 = petSel
  and calls GetCurPETNaviStatsByte(petSel, statIndex) instead. Returns the fetched stat byte in r0. r4 and r6 are
  saved/preserved only to comply with the callee''s ABI (r6 = saved petSel, r4 = saved statIndex); no memory structures
  are touched directly by this function. The literal 0x200000 is stored at dword_800A564; the adjacent words off_800A568/off_800A56C
  point at unk_2039AA0 but are not referenced by this routine (likely adjacent data). Bit 0x200000 of the battle-effects
  word presumably marks a state where the active navi differs from the PET''s registered navi (e.g. navi change
  / soul-unison style effects), so in-battle reads must use the shadow stats block at 0x203CCE0.

  '
