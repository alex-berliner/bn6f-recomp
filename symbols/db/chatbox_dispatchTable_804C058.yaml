  detail: '- `push {r4-r7,lr}` + `pop {r4-r7,pc}` show a tail-call frame used purely to carry {r4-r7}
    across the `bx r0`. - `ldr r0, off_804C068` then `ldrb r1,[r5,#0x10]` then `ldr r0,[r0,r1]` is the
