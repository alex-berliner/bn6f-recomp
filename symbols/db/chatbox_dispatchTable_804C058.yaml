summary: Tail-call dispatcher that jumps to a chatbox-step routine chosen by Toolkit pointer + 0x10
interface: '(r5 = EWRAM pointer; r10 = Toolkit) -> r0 = result from chosen routine ; side effects: jumps
  into one of two chatbox helpers, preserves {r4-r7}'
details: "Saves r4-r7 and lr, loads off_804C06C (the jump table), indexes it by a u8\n  read from r5+0x10\
  \ (some state byte), and tail-calls the selected routine via\n  `mov lr,pc; bx r0`. Table at 0x0804c06c\
  \ has two entries: sub_804C08C+1 and\n  chatbox_stepIfGatesOpen_804C11C+1. This is a 2-way switch over\
  \ a small chatbox\n  subsystem state. Caller passes routine parameters in r0..r3 (r2=0x0200f389 in\n\
  \  every captured snapshot, looks like a fixed EWRAM script/struct pointer). The\n  returned r0 in the\
  \ captured calls (0x08..0x0f) is the routine's return value\n  (likely a small step status / cursor\
  \ result).\n"
