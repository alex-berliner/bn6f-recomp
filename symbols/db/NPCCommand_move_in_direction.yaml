name: NPCCommand_move_in_direction
address: '0x0809EEDA'
kind: function
status: confirmed
summary: Overworld NPC script command handler that starts an NPC moving in a direction at a given speed for a given
  distance.
interface: void npc_scriptCmd_moveInDirection(OverworldNPCObject *npc /*r5*/, const u8 *script /*r6*/); returns
  updated script pointer in r6 (past opcode + 3 param bytes), last parameter byte in r2, ADDS flags (nz c) from
  r6+4
details: 'Interpreter handler for the NPC script "move in direction" opcode. Reads three

  parameter bytes from the script stream (offsets +1..+3) and stores them into the

  NPC object: +1 -> oOverworldNPCObject_MovementDirection, +2 -> MovementSpeed,

  +3 -> MovementDistance. Then sets oOverworldNPCObject_CurAction to 0x04

  (MOVEMENT_FLAG_DEFAULT_MOVING, the default "moving" action id) and zeroes the

  halfword MovementFlag_0a_Unk_0b (movement flags/counter). Calls

  npc_disableScript0x19_809f51e on the NPC, which presumably disables/cancels the

  NPC''s current script interaction (script id 0x19 path) so the movement takes over.

  Finally advances the caller''s script stream pointer by 4 (opcode + 3 params) via

  ADDS, whose flag result is part of the observed contract, and returns via pop {pc}.

  r2 is left holding the distance byte (the last value loaded); callers read r0, r2,

  r6 and the ADDS flags per the register contract.

  '
