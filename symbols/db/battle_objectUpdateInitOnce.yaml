name: battle_objectUpdateInitOnce
address: '0x0810BE74'
kind: function
status: confirmed
summary: Runs an battle object's once-per-spawn initialisation (resetting its attack hit state and freeing aux objects)
  when its CurPhase is still 0, then dispatches the object's phase update.
interface: void battle_objectUpdateInitOnce(r5=battleObject*, r2,r3,r4,r6,r7,r8,r9,r11,r12=dispatch state; returns
  r1,r5,r8,r9,r11,r12 updated, flags clobbered)
details: 'Tail-less wrapper called for every battle object update. Reads the object''s CurPhase byte (oBattleObject_CurPhase
  from r5); when it is 0 (first update of this spawn), it loads the attack-state pointer stored at object+0x64 into
  r0, calls ai_attackHitClearState8 to clear/reset the attack hit state (which returns the possibly updated object
  pointer in r5), then calls ai_attackFreeAuxObjects with r5 to release the object''s auxiliary objects (refreshing
  r4-r7). In all cases it tail-calls the phase dispatcher battle_objectUpdateDispatchPhase_80165C2 with the (possibly
  refreshed) register set. r10 passes through untouched; all flags are clobbered.

  '
