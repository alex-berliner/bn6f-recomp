name: battle_actionPlayAnimThenNext
address: '0x080B95F2'
kind: function
status: probable
summary: Battle-object action handler that plays animation 0x13 for 0x14 frames, then switches the object
  to action 0xC.
interface: (r0 = unused, r5 = battle object) -> r0 = clobbered; updates oBattleObject_CurPhase, CurAnim,
  Timer, CurAction, CurPhaseAndPhaseInitialized
details: 'Per-frame state step for a battle object in r5. On phase 0 it initializes: sets CurPhase=4,
  CurAnim=0x13, and Timer=0x14 (20 frames). On later phases it decrements Timer each frame; when it reaches
  0 it ends the action by writing CurAction=0xC and clearing CurPhaseAndPhaseInitialized (phase 0 + initialized
  flag) so the object''s dispatcher moves on. This is the classic BN6 ''play anim, wait N frames, chain
  to next action'' pattern used by enemy/boss action tables.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'loc init: strb #4,[r5,CurPhase]; mov r0,#0x13 strb [r5,CurAnim]; mov r0,#0x14 strh [r5,Timer];
    loop: ldrh Timer; sub #1; strh; bgt exit — a frame countdown; on timer expiry: strb #0xC,[r5,CurAction];
    strh #0,[r5,CurPhaseAndPhaseInitialized] — hands control back to the action dispatcher; uses standard
    oBattleObject layout fields (CurPhase/CurAnim/Timer/CurAction) shared with other battle object handlers'
