name: rfu_getSlotPlayerCount
address: '0x08146918'
kind: function
status: probable
summary: Returns a u16 per-slot count (likely connected-player count) from the RFU work struct, used by
  the caller to decide whether the wireless connection is complete.
interface: (r0 = slot index (byte)) -> r0 = halfword at eStruct200FE00 + 0x34 + index*2; flags clobbered
  by shift/compare not preserved
details: 'Normalizes r0 to a byte and multiplies by 2 via lsl/lsr, indexing a table of halfwords at eStruct200FE00+0x34.
  The caller reads the current index from byte_200AF84+4, fetches this slot''s count, and compares it
  against the result of the adjacent getter sub_814690C (which takes no arguments); when the count is
  >= that value it calls rfu_setStateEnded and returns 2, otherwise it returns 0 and presumably waits.
  This is connection-setup polling logic: each call checks one slot''s reported participant count against
  the expected total.'
