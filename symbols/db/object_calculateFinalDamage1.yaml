name: object_calculateFinalDamage1
address: '0x0800E3DE'
kind: function
status: confirmed
summary: Sum the five panel-damage entries of a battle object's CollisionData into FinalDamage, halving each entry
  (rounding up) if the object stands on a holy panel, and clamp the result.
interface: void object_calcFinalDamageOnHoly_800E3DE(u32 /*r5*/ object, r4/r6 scratch in, lr); returns r2 as left
  by sub_802CE10, sets C/V via `add r3,
details: 'Reads the object''s panel coords (oBattleObject_PanelX, oBattleObject_PanelY) and calls

  object_getPanelDataOffset to obtain the panel''s type. If the panel type is 5 (holy), each of

  the five oCollisionData_PanelDamage1 entries is right-shifted by 1 after adding

  `(1 << shift) - 1` so the sum rounds up: `(dmg + 1) >> 1`; otherwise the entries pass through

  unchanged. The entries are also written back in place (each becomes a halfword store via

  strh). The five adjusted values are accumulated into r0, then passed to sub_802CE10

  (believed to be the damage clamp / cap helper) and the result is stored at

  oCollisionData_FinalDamage. The disassembly''s `add r3, #oCollisionData_FinalDamage` after

  the strh only feeds the C/V flags, not a real return value, so r2 is the meaningful output

  (sub_802CE10''s return). r4/r6 are used purely as scratch and are restored on return.

  '
