name: battle_objectTimedSelfDestructPhase
address: '0x080BDE58'
kind: function
status: probable
summary: Battle-object phase that waits ~10 frames, then either transitions to action 0xC (if positioned
  on a panel) or kills the object together with its linked object via battle_killObjectWithDependents.
interface: (r0 = unused, r5 = battle object ptr (callee-saved convention)) -> r0 = destroyed? ; sets oBattleObject_CurState
  to CUR_STATE_DESTROY
details: 'On PhaseInitialized==0 it resets CurAnim, calls sub_80B8E58 on ExtraVars+8 and +0xC (likely
  freeing/spawning attached sub-objects), stores Timer=0xA and sets PhaseInitialized=4. Each run decrements
  Timer and returns until it goes negative. On expiry: if FuturePanelX != 0 it sets CurAction=0xC, CurPhase=0
  and returns; else it unpacks NameID via unpackVerActorTyAndAIIdx_800F29C, calls sub_8011044, clears
  bit 1 of oObjectHeader_Flags, stores CUR_STATE_DESTROY into the packed state/phase word, and calls battle_killObjectWithDependents
  on RelatedObject1Ptr so any linked object dies too.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'Timer initialized to 0xA and decremented each tick until negative (strh #0xA / sub r0,#1 /
    bge); loc_80BDEA6 branch on FuturePanelX reroutes to CurAction=0xC, CurPhase=0 instead of dying; unpackVerActorTyAndAIIdx_800F29C
    on oBattleObject_NameID then bl sub_8011044 before teardown; mov r0,#CUR_STATE_DESTROY; str -> oBattleObject_CurStateActionPhaseAndPhaseInitialized;
    ldr RelatedObject1Ptr; bl battle_killObjectWithDependents — kills self plus linked/dependent object'
  refs:
  - bn6f/asm/asm31.s:12728
  - 0x080E13DC battle_killObjectWithDependents
  - 0x0800F29C unpackVerActorTyAndAIIdx_800F29C
  - 0x08011044 sub_8011044
  reproduce: python3 tools/asmcat.py 0x080BDE58
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal''s behavior: PhaseInitialized==0 reset, Timer=0xA, decrement until
    negative, then either CurAction=0xC (fallback) or destroy path via sub_8011044 and battle_killObjectWithDependents
    on RelatedObject1Ptr. However, the proposal''s interface claims r0 is unused and r5 is callee-saved;
    in fact the function uses r5 throughout and ends with pop {r4,pc} (no r5 pop), confirming r5 is the
    standard battle-object callee-saved register. The name ''battle_objectTimedSelfDestructState'' is
    acceptable but ''battle_objectTimedSelfDestructPhase'' fits better since it manipulates PhaseInitialized.;
    run wf investigate investigate-20261019-010606; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
