name: MapScriptCutsceneCmd_add_bbs_message_range
address: '0x080382BA'
kind: function
status: confirmed
summary: Map-script cutscene opcode handler that queues a consecutive run of BBS (bulletin board) messages onto
  the pending-board mailbox and advances the script cursor by 4 bytes.
interface: void mapScriptCutsceneCmd_addBBSMessageRange_80382BA(u32* /* inout r7 */ script_cursor)
details: "Implements one opcode in the map-script/cutscene byte stream. Layout of the command body pointed to by\
  \ the script cursor (r7):\n  +0 : opcode byte (this handler)\n  +1 : u16 first message id (little-endian)\n  +3\
  \ : u8 repeat count\nThe handler reads the u16 first id by calling ReadMapScriptHalfword with r6 = 1, then reads\
  \ the u8 by calling ReadMapScriptByte with r0 = the halfword just read and r6 = 3 (so the helper can index off\
  \ the same command). The count value comes back in r4 and the loop start id in r0; it then loops calling reqBBS_addBBSMessage_813e5dc\
  \ with each id from `start` to `start + count - 1`, incrementing r6 and decrementing r4. The loop uses a do/while\
  \ tested with `sub r4, #1 / bgt`, so a count of 0 still queues exactly one message and leaves r4 = -1 on exit.\
  \ After the loop it bumps r7 by 4 (whole command size), sets r0 = 1 (success / opcode handled, preserving NZ for\
  \ the dispatcher), and returns. r1 and r2 on exit are whatever the final reqBBS_addBBSMessage_813e5dc left in\
  \ them (not explicitly set here). r3 is preserved across the call.\n"
