summary: In the in-battle custom-screen submenu object, handles a newly pressed B button by either reversing
  a previous "yes/no to exit" prompt, running the "can't jack out" rejection when the player tries to
  exit but isn't allowed, or running the standard "confirm exit and fade" submenu teardown.
interface: '() -> r0 = 2 (handled flag) ; side effects: clobbers r5, r10, plays SOUND_EXIT_SUBMENU or
  SOUND_CANT_JACK_IN, runs text script 2 in the chatbox, calls submenu_ConfirmExitAndFade_811FB64, writes
  submenu object''s 0x02/0x03/0x0d/0x17/0x44'
details: '- Caller contract: r5 = submenu object, r10 = Toolkit.

  - On entry: tests IsButtonPressed with JOYPAD_B (0x0002). If B is not newly pressed, returns immediately
  with r0=2 still set by IsButtonPressed.

  - If [r5+0x44] is nonzero, that means a previous frame already set "user wants to exit" - so this frame
  clears [r5+0x44]=0 and plays SOUND_EXIT_SUBMENU, returning r0=2.

  - Else: reads [r5+0x17] (which holds the "can the player jack out right now?" value, compared against
  0x1e). If == 0x1e, the player is allowed to exit: calls submenu_ConfirmExitAndFade_811FB64(r0=8) which
  plays SOUND_EXIT_SUBMENU and starts a fade, then clears submenu object +0x02 (state) to 0.

  - If != 0x1e, the player is not allowed to exit: copies [r5+0x03] into [r5+0x0d], sets [r5+0x02]=8 (a
  "rejected exit" substate), loads [r5+0x1e] into chatbox+0x4c (text-script param / mugshot color), runs
  chatbox text-script index 2 (the "cannot jack out" message), and plays SOUND_CANT_JACK_IN. Returns r0=2
  (=handled).

  - Always returns r0 = 2 (handled). The contract says nothing is returned for callers because both callers
  treat the result as a "handled/return-2" sentinel for the input-dispatch table they sit in.

  - The two callers sit on the B-button branch of their respective per-frame input dispatchers (the in-battle
  custom-screen submenu and the folder-edit object).

  '
