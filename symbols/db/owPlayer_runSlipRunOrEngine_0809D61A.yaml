status: probable
summary: 'Overworld player slip-run substate: gates each frame on the EVENT_1716/EVENT_IN_SLIPRUN_STATE
  flags, dispatches via Unk_0a jumptable between slip-run and engine tick, and otherwise routes the player
  into normal per-frame updates (advance/forward, idle, tile-interaction) before ending the slip-run if
  conditions warrant.'
interface: '(r5 = oOWPlayerObject*, r10 = oToolkit*) -> void ; side effects: writes the overworld player
  jumptable index via owPlayer_setJumptableIndex09AndOthers_809e004, may clear oOWPlayerObject_Unk_0a,
  may end slip-run state, may set EVENT_173F via callees'
details: "1. Saves lr and tests EVENT_1716. If EVENT_1716 is set, it additionally tests EVENT_IN_SLIPRUN_STATE;\
  \ if either test comes back set (the two beq/bne branch out to the slip-run entry at loc_809D646) the\
  \ function enters the slip-run path. Otherwise (neither flag set) it falls through to loc_809D630.\n\
  \  2. At loc_809D630 it calls sub_809D9E0 and, if that returns non-zero, inspects FacingDirection (offset\
  \ 0x10) and Unk_11 on the player object. If they differ it clears oOWPlayerObject_Unk_0a to 0 (which\
  \ dispatches into calledWhenUsingSlipRun_809D6BC next frame).\n  3. At loc_809D646 (the slip-run dispatch)\
  \ it loads the 2-entry table at off_809D6B0 indexed by oOWPlayerObject_Unk_0a and bx's to either calledWhenUsingSlipRun_809D6BC\
  \ or sub_809D730. The two path values are stored with +1 offsets to switch to Thumb mode.\n  4. If the\
  \ slip-run gate isn't engaged (sub_809D9E0 returned zero), it calls sub_809DF28 — the per-frame dispatcher\
  \ that bypasses a real handler when the player's substate is locked at 0x10.\n  5. If sub_809DF28 returns\
  \ non-zero, the function clears the byte at [r7+1] (a counter that was loaded out of r7 before the sub\
  \ call — appears to gate the slip-run entry counter), writes 0x10 to the player's jumptable index (the\
  \ locked state), and ends the slip-run.\n  6. Otherwise it tests ow_gatePendingTileInteraction_809DED4;\
  \ if a pending tile interaction was returned it sets the player's jumptable index to 0x0c and exits.\n\
  \  7. If the \"player advance forward\" event (EVENT_1717_PLAYER_ADVANCE_FORWARD) is set it sets the\
  \ player's jumptable index to 0x14 and finalizes the slip-run.\n  8. Otherwise if the overworld object's\
  \ state halfword at +0x4c has bit 0x10 it routes to the standard 0x04 handler; otherwise sub_809DB02\
  \ is consulted and, on a zero return, the player's jumptable index is set to 0 (idle). All of these\
  \ end by calling oowExitSlipRun_809DDF0 to leave the slip-run gate.\n"
