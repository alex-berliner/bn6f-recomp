name: ow_getAreaMapTilesOffset
address: '0x08142DE6'
kind: function
status: probable
summary: Returns a per-area halfword constant (from a 4-entry table) selected by the current overworld
  map area, with map group 0x85 forced to entry 3.
interface: () -> r0 = halfword from byte_8142E0C[2*areaIndex]; no flags meaningfully used
details: Loads the GameState pointer from the toolkit (r10) and reads oGameState_MapGroup; if it equals
  0x85 the index is hard-coded to 3, otherwise the byte at GameState+5 (current map/area id) is used as
  the index. The index is doubled and a halfword is read from byte_8142E0C, yielding 0x3C50, 0x45D0, 0x4A90
  or 0x49C0. The function is a pure lookup with no writes; the eMapTilesState200be70 / unk_2000B40 words
  in the listing are literal pools of the following functions, not data this routine touches. The extra
  byte_ blobs (byte_8142E24..byte_8142EA0, referenced by off_8142E14/1C) belong to adjacent code and look
  like coordinate/path tables, unrelated to this lookup. The returned values most plausibly select an
  offset/section for the streamed overworld map tile/background data, but the exact consumer is not visible
  here.
