name: ow_getAreaMapTilesOffset
address: '0x08142DE6'
kind: function
status: confirmed
summary: Returns the halfword tile offset (from a 4-entry lookup table) used to draw the current area's overworld
  map, forcing entry 3 for the Sky Area map group.
interface: u32 ow_getAreaMapTilesOffset(u32 toolkit /* r10 */); -> r0 = tile offset halfword
details: 'Reads the toolkit from r10 and dereferences [toolkit + oToolkit_GameStatePtr] to get the

  GameState. Loads the map group byte at GameState + oGameState_MapGroup; if it equals 0x85

  (the Sky Area map group) the area index is forced to 3, otherwise it is taken from the byte

  at GameState + 5 (the current area number, 0-3). The index is doubled (<<1) and used to read

  a halfword from the 8-byte table AREA_MAP_TILE_OFFSETS (byte_8142E0C = 0x3C50, 0x45D0,

  0x4A90, 0x49C0), which is presumably the tile-VRAM/tileset offset at which that area''s map

  image tiles start. The halfword is returned in r0. No other state is touched; the caller

  reads only r0. Note the assembly also pools nearby pointers (eMapTilesState200be70,

  unk_2000B40, byte_8142E24/byte_8142E7C/byte_8142E48/byte_8142EA0) which belong to adjacent

  map-tiles code, not this routine.

  '
