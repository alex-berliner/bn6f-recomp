name: ai_selectAttack
address: '0x08115598'
kind: function
status: probable
summary: 'AI decision step for a boss-type battle enemy: either launches a row-targeted attack (id 0xB)
  on a random object in the player''s row, or sets up a panel-targeted attack (id 0xA) after choosing
  a target panel.'
interface: (r4 = battle object/AIData, r5 = battle object, r6 = AI state, r7 = AI attack-vars block, preloaded
  by caller) -> r0 = 0 or 1 status; writes oAIAttackVars target/param fields, oBattleObject_ExtraVars+4/+8,
  oBattleObject_CurAnim
details: Runs with registers r4-r7 already holding the object/AI context, so it is a fragment of a larger
  AI routine dispatched from a table. It first tests object flag bits 0xA000 via object_getFlag; if clear,
  it checks whether any actor with nonzero param shares the enemy's PanelY row (mask from FindBattleActorsWithNonzeroParam_ReturnCountAndSum)
  and, via battle_pickRandomRowObjectFields, picks a random object there, loading per-version attack parameters
  from byte_8115556/byte_8115550/byte_8115538 indexed by oAIData_Version_16, then object_setAttack0(0xB)
  and marks ExtraVars+8 = 1<<PanelY. Otherwise it clears oAIAttackVars_HasMoved, optionally clears a halfword
  at object+0x6C and sets oAIState_ScriptId=4 when flag 0x8000 is also set, then calls sub_81156AC or
  sub_8115668 to obtain target panel X/Y, stores them in TargetPanelX/Y, sets ExtraVars+4 = PanelY^targetY,
  fetches alliance-dependent panel params via GetAllianceDependentPanelParamArgs into AiAttackParam/PanelParamFlags2,
  and calls object_setAttack0(0xA) followed by the tail dispatcher sub_8109804, finally setting CurAnim=1.
