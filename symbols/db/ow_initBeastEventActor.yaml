name: ow_initBeastEventActor
address: '0x080A83B8'
kind: function
status: probable
summary: 'Initializes an overworld beast event actor: sets mode byte r5[0]=3, calls sprite_load(0x80,0x1c,0x52)
  and related setup, applies layer effect and priority, clears EVENT_9FF, and once (gated by EVENT_9D7)
  converts r6+0x16/+0x18 pixel coords to 16.16 fixed-point into r5+0xc/0x10 then clears the flag; finally
  sets r5[8]=4 and calls sub_80A8424.'
interface: '(r0-r2 set before call: 0x80, 0x1c, 0x52 for sprite_load; r5 = actor struct, r6 = source data
  with x/y at +0x16/+0x18) -> r0 = void; flags from TestEventFlagFromImmediate consumed internally'
details: The actor struct at r5 gets mode byte +0 = 3, then sprite_load(0x80, 0x1c, 0x52) attaches a sprite,
  followed by animation setup (setAnimation from r5+4, loadAnimationData), noShadow, layer effect applied
  to r5+0xc and a sprite priority set. It unconditionally clears EVENT_9FF. If EVENT_9D7 is set, it copies
  r6+0x16/+0x18 into the actor's fields r5+0xc/0x10 (x/y), zeroes r5+0x14 (likely a pixel fraction or
  counter), sets byte r5+9 = 1 (a 'position applied'/'moving' flag), and clears EVENT_9D7 so this placement
  happens only once. Finally it sets state byte r5+8 = 4 and tail-calls sub_80A8424, evidently advancing
  the actor's state machine.
