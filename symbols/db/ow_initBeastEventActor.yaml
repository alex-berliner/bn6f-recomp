name: ow_initBeastEventActor
address: '0x080A83B8'
kind: function
status: confirmed
summary: 'Initializes a beast event actor in the overworld: loads its sprite, positions it relative to the player,
  applies layer effects, and activates it for the first time.'
interface: ow_initBeastEventActor(u32 actor_ptr /*r5*/, u32 spawn_desc /*r6*/, u32 r10) -> updates r2 r3 r4 r5 r8-r12,
  clobbers r0 r1 lr, flags
details: 'Writes BEAST_EVENT (3) to actor_ptr[0] (oActor_State). Loads sprite sheet 0x80,

  frame 0x1c, animation 0x52 via sprite_load. Computes a world offset from the

  player''s facing angle (ow_computePointFromPlayerAngle), then configures animation

  args, sets the default animation ID from actor_ptr[4], loads per-frame animation

  data, and disables the shadow. Applies the overworld layer-effect descriptor at

  actor_ptr+0xc and sets the resulting draw priority. Clears event flag 9FF (beast

  gate). Tests spawn-once guard flag 9D7: if clear, reads tilemap X/Y halves from

  spawn_desc+0x16/+0x18, shifts each left by 16 bits into a 32-bit sub-pixel position,

  stores them at actor_ptr+0xc and +0x10, zeroes velocity accumulator at +0x14, sets

  spawned byte at +9 to 1, and clears guard 9D7 so the position write happens only

  once. Finally sets actor_ptr[8] to ACTIVE (4) and calls npc_updateGuarded.

  The spawn descriptor (r6) is a tilemap/event-script entry providing coordinates;

  the actor struct is the standard overworld NPC layout.

  '
