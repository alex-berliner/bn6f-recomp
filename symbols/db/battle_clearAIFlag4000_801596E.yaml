name: battle_clearAIFlag4000_801596E
address: '0x0801596E'
kind: function
status: confirmed
summary: If a non-null AI object pointer is passed, clears the 0x4000 flag in its AI data; otherwise does
  nothing.
interface: int battle_clearAIFlag4000(AIObject* object); // r0 = object ptr; returns r3 (side effect of
  callee), r5 preserved; flags clobbered
details: 'Thin conditional wrapper. Saves r5, takes the AI object pointer in r0, and only if it is non-null
  performs "mov r5, r0" followed by "ldr r0, =0x4000" and a tail call to SetAIData_Unk_44_Flag. That callee
  receives the flag value 0x4000 in r0 and the object pointer in r5 (a different calling convention from
  most of this code), and it operates on flag bit 0x4000 within the object''s AI data at the field the
  callee''s name labels as Unk_44. If r0 is NULL the call is skipped entirely and the function just returns.
  Outputs per the contract: r3 carries whatever SetAIData_Unk_44_Flag leaves there (only meaningful when
  the non-null path runs), and r5 is preserved for callers via the push/pop. The caller-side contract
  reads back only r3 and r5, so r0/r1/lr and the flags are scratch. Quirk: the callee takes the object
  pointer in r5 rather than r0/r1, hence the unusual mov.

  '
