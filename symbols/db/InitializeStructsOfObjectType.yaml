name: InitializeStructsOfObjectType
address: '0x08003490'
kind: function
status: confirmed
summary: Clears and seeds the per-object pool (active bitfield, raw array, and per-object header bytes) for one
  object type selected from the initialization table.
interface: void initObjectTypeStructs_8003490(u32 object_type /* r0 */) -> r0 = cursor past last object, r1 = final
  counter (== object_count when count>0), r2 = sprite_data byte, r3 = object_count; N/Z from CMP r1, r3 (Z when
  counter == object_count, i.e. count was nonzero and the loop ran to completion); C and V undefined on exit. r4,
  r7 preserved.
details: 'Looks up a 16-byte entry in `.ObjectInitializationTable` indexed by `object_type` (r0 * 16). The entry
  layout is: +0 ptr used as the "raw object array" base passed to ZeroFillByWord with size from +8 (array_size =
  hword); +4 ptr is the cursor walked object-by-object; +0xA byte is the sprite-data tag ORed into the constant
  (see `OVERWORLD_PLAYER_OBJECT`, `T1_BATTLE_OBJECT`, `OVERWORLD_NPC_OBJECT`, `T3_BATTLE_OBJECT`, `T4_BATTLE_OBJECT`,
  `OVERWORLD_MAP_OBJECT`); +0xB byte is the per-object stride (object_size); +0xC byte is the number of objects
  and is also used (rounded up to words via `(byte+0x1F)>>5` then *4) to size the zeroing of the matching active-object
  bitfield pointed to by `[ActiveObjectBitfieldPointers + object_type*4]`. After zeroing the bitfield and the array,
  it loops `object_count` times writing `sprite_data` at object+2 and the loop index (0-based, via r1) at object+3,
  advancing the cursor by `object_size`. The loop is do/while so one object is always written even when object_count==0;
  on exit r0 is the cursor just past the last object, r1 the post-increment counter (equal to object_count when
  nonzero), r2 the sprite-data byte, r3 the object_count. Types 1/3/4 battle objects use a separate linked-list
  pointer for the zeroed array (entries at +0) distinct from the walked cursor at +4; OWPlayer, OW NPC and OW map
  entries happen to alias the two pointers.'
