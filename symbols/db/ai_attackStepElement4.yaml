name: ai_attackStepElement4
address: '0x080FDA0E'
kind: function
status: probable
summary: 'Stages an AI attack of element 4: if AttackElement is 0, arms it with animation 0xB and StepTimer=9; on
  countdown expiry calls sub_80FDC2A to spawn the attack, plays sound 0x17F, and stores 0x18 into HitElement.'
interface: (r7 = oAIAttackVars of attacker, r5 = battle object) -> void; attack element/timer state updated in oAIAttackVars
details: 'This is a per-frame AI attack step handler. If oAIAttackVars_AttackElement is 0, it arms the attack: writes
  element 4 (wood in the BN element order fire/aqua/elec/wood), sets oBattleObject_CurAnim to 0xB (a wind-up/charge
  pose) and oAIAttackVars_StepTimer to 9, then returns. On subsequent calls it counts StepTimer down; when it reaches
  0 it calls sub_80FDC2A (presumably spawning/executing the attack), plays sound effect 0x7F (0x80 + 0xFF encoded),
  and writes 0x18 into oAIAttackVars_HitElement. The AttackElement field remains non-zero afterwards, so the attack
  does not re-arm until the caller clears it.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb/tst on oAIAttackVars_AttackElement with ''mov r0,#4; strb'' arms element 4 only when it was 0 (first
    block); ''mov r0,#0xb; strb [r5,oBattleObject_CurAnim]'' plus StepTimer=9 set the wind-up state; countdown loop
    ''ldrh StepTimer; sub #1; strh; bgt ret'' delays the actual hit until timer 0; on timer expiry: bl sub_80FDC2A
    then bl PlaySoundEffect with 0x80+0xFF = 0x7F, then HitElement = 0x18; runs on recorded ''battlesweep'' routes,
    i.e. during battle AI updates'
  refs:
  - bn6f/asm/asm31.s:148206
  - 0x080005CC PlaySoundEffect
  - 0x080FDC2A sub_80FDC2A
  reproduce: python3 tools/asmcat.py 0x080FDA0E
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise — The code
    matches the proposal''s mechanics (arms attack element 4, sets anim 0xB, StepTimer=9, then counts down and calls
    sub_80FDC2A, plays sound 0x17F, writes 0x18 to HitElement). However, the name ''ai_woodAttackStep'' presupposes
    element 4 is wood; the code simply hardcodes element 4 with no evidence of an element-mapping, so ''ai_woodAttackStep''
    overstates knowledge. A name like ''ai_woodElementAttackStep'' is still element-coupled; better is something
    neutral like ''ai_aiAttackStepElem4'' or ''sub_80FDA0E_handler''. Also the proposal''s claim that the function
    is a per-frame step handler is reasonable given the caller ''battlesweep'' but not directly evidenced. Minor:
    0x18 is stored as halfword (strh), the proposal notes that correctly.; run wf investigate investigate-20261018-203615;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
coverage:
- battlesweep
open_questions:
- what attack object sub_80FDC2A spawns and what HitElement=0x18 is consumed for
- which boss/enemy uses this handler and whether element 4 here really maps to wood in this game's enum
- 'The code matches the proposal''s mechanics (arms attack element 4, sets anim 0xB, StepTimer=9, then counts down
  and calls sub_80FDC2A, plays sound 0x17F, writes 0x18 to HitElement). However, the name ''ai_woodAttackStep''
  presupposes element 4 is wood; the code simply hardcodes element 4 with no evidence of an element-mapping, so
  ''ai_woodAttackStep'' overstates knowledge. A name like ''ai_woodElementAttackStep'' is still element-coupled;
  better is something neutral like ''ai_aiAttackStepElem4'' or ''sub_80FDA0E_handler''. Also the proposal''s claim
  that the function is a per-frame step handler is reasonable given the caller ''battlesweep'' but not directly
  evidenced. Minor: 0x18 is stored as halfword (strh), the proposal notes that correctly.'
