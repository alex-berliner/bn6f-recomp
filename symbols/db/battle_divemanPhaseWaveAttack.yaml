name: battle_divemanPhaseWaveAttack
address: '0x080B9AEA'
kind: function
status: probable
summary: 'DiveMan''s phase handler for the wave attack: spawns the attack waves, shakes the camera as
  he dives, then hands control back to the next action.'
interface: (r0 = phase/branch value read into r0 unused, r5 = DiveMan battle object) -> void; writes oBattleObject_CurPhase,
  CurAnim, Timer, CurAction, CurPhaseAndPhaseInitialized
details: 'Reads oBattleObject_CurPhase from the battle object in r5; on phase 0 it stores phase 4, sets
  CurAnim 5, calls battle_divemanSpawnAttackWaves, and loads Timer with 60. Otherwise it decrements Timer
  each frame: at 30 it calls camera_initShakeEffect_80302a8(2, 30), at 20 it resets CurAnim to 0, and
  when it reaches 0 it stores CurAction 0x10 and clears CurPhaseAndPhaseInitialized so the object''s state
  machine advances. The shake and anim reset are consistent with DiveMan submerging/emerging around his
  wave attack.'
