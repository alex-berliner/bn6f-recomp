open_questions:
- Which exact AI state byte is being OR'd — the caller's frame suggests `[r1]` is the AIState pointer
  (the function below `battleObject_runUpdateRoutineAndAdvancePC` likely walks a sub-state). Whether 0xC
  means "finished and ready to free" vs "go to destroy phase" depends on how 0x0814e36d interprets it.
  Looking at the dispatch loop would settle it.
