name: battle_objectWaitThenDespawn
address: '0x080D83A0'
kind: function
status: probable
summary: Battle-object handler that waits Param2 frames with anim 1, then clears its collision region
  and switches to action 8.
interface: (r5 = battle object) -> void; flags preserved by timer branch
details: On phase 0 the handler stores 4 into oBattleObject_CurPhase, sets oBattleObject_CurAnim to 1,
  and copies oBattleObject_Param2 into oBattleObject_Timer as a frame countdown. In phase 4 it decrements
  Timer each tick and returns while it is still positive. When the timer hits zero it calls object_clearCollisionRegion
  to detach the object from its collision region, sets oBattleObject_CurAction to 8, and zeroes oBattleObject_CurPhaseAndPhaseInitialized
  to restart the state machine for the next action. This matches the pattern of a temporary effect object
  that plays one anim for a fixed duration before handing control to another action.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r5,#oBattleObject_CurPhase] / mov r1,#4 / strb r1,[r5,#oBattleObject_CurPhase] — phase
    0 initializes phase 4; strh r0,[r5,#oBattleObject_Timer] with r0 = Param2 — timer duration comes from
    Param2; ldrh r0,[r5,#oBattleObject_Timer]; sub r0,#1; bgt — frame countdown loop; bl object_clearCollisionRegion
    when Timer reaches 0 — removes object from collision region; mov r0,#8; strb r0,[r5,#oBattleObject_CurAction]
    plus phase reset — transitions to next action
