name: battle_spawnPanelElementEffect
address: '0x080D8BD4'
kind: function
status: confirmed
summary: Spawns an element-effect object (and its panel collision region) at the grid tile occupied by the given
  battle object, using the object's element, alliance, and 0x34 parameter words.
interface: battle_spawnPanelElementEffect(r5 = BattleObject*) -> r1 (updated Param3 of new effect, or callee r1),
  r2 (callee r2); nzcv clobbered
details: 'Reads PanelX (oBattleObject_PanelX), PanelY (oBattleObject_PanelY), Element (oBattleObject_Element), Alliance
  (oBattleObject_Alliance), and the 32-bit DamageAndStaminaDamageCounterDisabler field from the BattleObject pointed
  to by r5. Calls object_spawnCollisionRegion with (panelX, panelY, element, 0) and r4=0x1205ff10 (static collision
  table base), r6=disabler, r7=1 to register an interaction zone on the panel grid. Builds a 16-bit header word:
  low byte 0x43 (effect palette/tile ID), high byte = Alliance << 8. Reads three 32-bit parameter words starting
  at offset 0x34 (oBattleObject_Param3 area) via ldmia. Calls spawn_t1_0x0_EffectObject with r1-r3 = params and
  r4 = header to allocate a type-1 tag-0 effect object. If the spawn returns non-NULL in r0, loads the new object''s
  oBattleObject_Param3 byte, adds 2, and stores it back (bumping an animation/phase counter). r1 and r2 from the
  spawn call are returned to the caller. Preserves r4, r5 (input pointer), r6, r7 across the two sub-calls via push/pop.

  '
