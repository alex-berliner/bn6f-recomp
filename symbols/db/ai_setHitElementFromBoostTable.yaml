name: ai_setHitElementFromBoostTable
address: '0x0811387C'
kind: function
status: probable
summary: Selects an element byte from a two-entry table indexed by the AI attack's AttackBoost2 level,
  stores it as HitElement, and clears AttackElement.
interface: '() -> r0 = scratch; modifies oAIAttackVars at r7: HitElement = table[AttackBoost2], AttackElement
  = 0; no flags used'
details: Takes oAIAttackVars_AttackBoost2 from the r7 AI-attack-variable struct, multiplies by 4 to index
  a pointer table at off_8113894 whose two entries (byte_811389C=0x04, byte_811389D=0x10) are element-code
  bytes, and stores the selected byte into oAIAttackVars_HitElement. It then zeroes oAIAttackVars_AttackElement.
  The 4x stride suggests the table was built as word-spaced pointers even though the targets are bytes.
  It is a leaf routine that only writes the two AI-variable fields, so it is likely a per-attack init
  step for an AI move whose hit element depends on the charge/boost stage. The values 0x04 and 0x10 look
  like the game's element enum (e.g. fire vs. elec-style codes) rather than damage.
