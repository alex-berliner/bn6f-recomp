name: sub_8026694
address: '0x08026694'
kind: function
status: hypothesis
summary: Trivial thunk that tail-calls battle_checkFacingOffsets with a fixed pointer argument (byte_8026791), passing
  r4-r7 straight through.
interface: void sub_8026694(r4, r5, r6, r7); // returns callee's r0, r1, r5
details: 'The function does nothing on its own: it loads the address byte_8026791 (0x08026791, inside this same
  code region) into r0 and tail-calls battle_checkFacingOffsets with r4-r7 forwarded unchanged. Everything the caller
  sees as outputs (r0, r1, r5) comes from the callee; r4, r6 and r7 are preserved, nz/c/v are clobbered by the callee.
  Since the argument is a hard-coded address, this is presumably one of several near-identical thunks that run the
  same facing-offset check against different built-in parameter blocks or dispatch tables, and the value at 0x08026791
  is likely data consumed by battle_checkFacingOffsets rather than a normal argument. Game-level meaning is inherited
  entirely from the callee''s behavior (checking tile offsets in an entity''s facing direction during battle), so
  no stronger name than the thunk description is justified until battle_checkFacingOffsets itself is understood.

  '
