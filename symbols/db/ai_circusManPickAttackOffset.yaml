name: ai_circusManPickAttackOffset
address: '0x080FE9B0'
kind: function
status: confirmed
summary: CircusMan battle AI picks the index of the attack to use via two weighted random draws, with an alternate
  attack set when a state flag is set.
interface: u32 ai_circusManPickAttackOffset(u32 object /* r5 = battle object */); returns r0 = attack-table offset;
  clobbers r1-r2 and flags, preserves r4
details: 'Computes an offset into a CircusMan attack table. It performs two weighted-random draws with sub_800FE28
  over the weight table byte_80FE9DC = {14,14,14,14,0,0,0,0}: the first draw uses the first half (entries 0-3, all
  weight 14) to get a base offset, the second uses the second half (entries 4-7, all weight 0) to get a value multiplied
  by the object''s ExtraVars[+8] counter (loaded from [r5, oBattleObject_ExtraVars+8]) and added to the base. It
  then calls object_getFlag on the object; if any of the flag bits 0xA000 are set, 0x3C (60) is added, shifting
  the result into an alternate attack group. Returns the final offset in r0. The second weight half being all-zero
  makes that draw degenerate unless sub_800FE28 treats 0-weight entries specially.

  '
