name: ai_circusManPickAttackOffset
address: '0x080FE9B0'
kind: function
status: probable
summary: Picks a random target offset (row/column position) for a CircusMan attack, shifted by 0x3C when
  a panel/object flag is set.
interface: (r5 = CircusMan battle object) -> r0 = computed position offset; flags clobbered by calls
details: Draws two random values with sub_800FE28 over the small tables at byte_80FE9DC (word of 0xE,
  then word of 0), adds the second draw multiplied by the object's field at oBattleObject_ExtraVars+8
  to the first, then tests the object's flag word (object_getFlag) against 0xA000 and adds 0x3C (a 3-panel
  step) if set. The result is a position offset for the attack chosen by ai_circusManAttackInit, which
  then stores it in the per-attack state and enters attack state 0xA.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: two bl sub_800FE28 calls with byte_80FE9DC and byte_80FE9DC+4 are random draws (tables hold
    0xE,0xE,0xE,0xE then zeros); mul r0, r1 with [r5,#oBattleObject_ExtraVars+8] scales one draw by a
    per-object field; tst r0, 0xa000 on object_getFlag result gates the +0x3C displacement; sole caller
    0x080FEB20 ai_circusManAttackInit sets up CircusMan's attack state and uses this result
