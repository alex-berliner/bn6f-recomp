name: GetBattleNaviStatsSignedByte
address: '0x080136D8'
kind: function
status: confirmed
summary: Returns one sign-extended byte from a NaviStats record, selecting the record by alliance flag and the field
  by byte offset.
interface: (u32 alliance, u32 offset) -> s32; clobbers r1, flags; preserves r6
details: 'Thin accessor over the persistent NaviStats save data. r0 is passed straight to GetBattleNaviStatsAddr
  (whose parameter selects the alliance/player record, e.g. own navi vs. ally/trader data), then the returned pointer
  is indexed with r1 as a byte offset and read with ldrsb, so small signed stats (values like levels/slot counters
  stored as s8) come back sign-extended in r0. No bounds checking and no null check on the pointer: callers are
  expected to pass a valid offset within the record. r6 is used only as a scratch copy of the offset and restored,
  so it is effectively preserved. Register contract notes r6 in the outputs, but that is just the restored original
  value.

  '
