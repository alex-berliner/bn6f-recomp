name: link_verifyChecksumAndMatchPartner
address: '0x0812B9F8'
kind: function
status: probable
summary: 'Link-comm state handler: checksums the received buffer at unk_2033C00, then matches the link
  partner''s eLinkState fields against a table to set the next state.'
interface: '(r5 = comm state-machine context: +0x34 payload size, +0x26 result flag, +0x10 state, +0x2
  substate) -> writes [r5+0x26], [r5+0x10], [r5+2]; no return value'
details: 'Sums all bytes of unk_2033C00 up to [r5+0x34]-8 (or -12 in the second path, which also checks
  a flag dword at +0x30), comparing the sum against the trailing dword; a match stores 4 to [r5+0x26],
  otherwise 8 (pass/fail marker). It then calls the comm dispatcher sub_803EAE4 on eStruct200BC30: result
  4 goes to sub_812C24C, result 1 returns, otherwise it sets [r5+0x10]=6, copies eLinkState fields 0x1C/0x0A
  to the camera end struct via camera_copyLinkStateToEnd (also writing [r5+0x26] there), and resets link
  state via sub_803EF74/sub_803E8F8. It then walks a 0x10-byte-stride table from sub_81323B0, matching
  entries'' word+0x4 to eLinkState+0x1C and halfword+0x2 to +0xA, tracking hits in r3. If no entry matched,
  sub_8132430''s result decides the transition: <=2 sets [r5+2]=0x0C, [r5+0x10]=0x0F, [r5+0x26]=0x10;
  result 4 sets [r5+2]=0x0C, [r5+0x10]=0x10, [r5+0x26]=0x20. A single-bit match (r3==1) only sets [r5+0x10]=2.'
