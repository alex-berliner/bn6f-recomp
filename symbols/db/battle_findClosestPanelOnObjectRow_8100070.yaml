name: battle_findClosestPanelOnObjectRow_8100070
address: '0x08100070'
kind: function
status: confirmed
summary: Finds the closest panel to a given position that lies on a source object's row and matches the
  asking object's alliance, returning the panel's position.
interface: (u32 rowSrc r0, u32 x r2, u32 y r3, u32 selfObj r5) -> u32 panel r0, u32 panelY r1; preserves
  r2-r5
details: 'Thin wrapper around object_getClosestPanelMatchingRowFiltered. It reads the row (byte at +0x13)
  from the object passed in r0 and the alliance field (oBattleObject_Alliance) from the calling battle
  object in r5, then calls object_getClosestPanelMatchingRowFiltered with (alliance, row, x, y) and passes
  its r0/r1 result (the chosen panel''s position/coordinates as the battle engine uses them) straight
  back to the caller. r5 is preserved by the callee, so no re-write is needed. Likely used to pick a target/landing
  panel on the same row as another battle entity, restricted to panels of the asker''s own side.

  '
