open_questions:
- Exact semantic of the magic string `"Smsh"` (some m4a/mp2k build artifact vs. an explicit "MusicPlayerStop
  pending" sentinel) — seeing how `sub_814E9F0` and the two `814EA58` callers treat this field across
  restart scenarios would settle it.
- Whether `[r0+8]` is really a count of bank pointers or a flag (always small in practice, never seen
  larger than a handful); the `ldrb + ble/bgt` pattern strongly implies count, however.
