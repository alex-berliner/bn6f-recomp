name: sub_8129B34
address: '0x08129B34'
kind: function
status: confirmed
summary: 'Folder-style menu tick: handles cursor up/down, A confirm, B exit, while screen is not fading.'
interface: void sub_8129B34(u32 r5 /* menu state struct */, u32 r6, u32 r7, u32 r10 /* toolkit */); returns nothing;
  clobbers r0-r3, r4, lr, nz/c/v
details: 'Returns early if the screen fade is active. Reads joypad pressed-buttons via

  [r10+oToolkit_JoypadPtr]->oJoypad_Pressed, then calls

  menu_moveCursorUpDown_811FA22(pressed, 2, 1, oldCursor) where oldCursor lives at

  [r5+0x12]. If the cursor index changed, writes the new value back to [r5+0x12] and

  calls sub_812B3B4 (likely a cursor-move/redraw helper).

  A button: plays SOUND_MENU_SELECT and calls sub_812B414 (likely "activate current

  folder/entry").

  B button: plays SOUND_EXIT_SUBMENU, sets [r5+3] = 0x0C (exit state), clears

  [r5+0x1C] and [r5+0x1E] to 0, and ORs 0x01 into [r5+0x1B] (a flags/state-dir change).

  The byte at +0x12 is a cursor index, +3 is a menu state byte, +0x1B/+0x1C/+0x1E are

  state/config bytes on the same menu struct. R4/B6/B7 are unused; only R5 (struct) and

  R10 (toolkit) carry meaningful input.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
