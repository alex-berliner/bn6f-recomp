name: ai_attackStepTargetPanelStay
address: '0x08106EFC'
kind: function
status: probable
summary: 'AI attack-state step: asks a panel-choose callback for a target panel, reserves it, keeps the
  enemy in place with anim 4, or bails out of the attack if blocked/no target panel.'
interface: (r7 = AI attack vars struct, r5 = battle object; r0 implicit) -> r0 = 0; sets HasMoved/StepTimer/HitElement
  and object state
details: If object_canMove fails, it clears HasMoved and calls object_exitAttackState. Otherwise it invokes
  the struct's PanelChooseCallback (passing the target object pointer and the constants 0x10000/0x0F880080
  loaded via off_8106F50 as filter/args); if the callback returns nonzero coordinates it stores them into
  TargetPanelX/Y and calls object_reservePanel. It then copies the object's current PanelX/Y into FuturePanelX/Y
  (i.e. it does not move) and calls object_reservePanel again for its own panel, sets OBJECT_FLAGS_CANNOT_SLIDE,
  switches the object to animation 4, sets ScratchVar=0, StepTimer=3, HasMoved=1 and HitElement=4. On
  failure path it instead clears HasMoved and exits the attack state. This is one step of the generic
  enemy attack sequencer driven by the oAIAttackVars fields.
