open_questions:
- What struct does r5 actually point to? Only +0x10 (packed id), +0xB and +3 are exercised here; the rest
  of the toolkit is owned by the caller.
- The dword_87xxxxx tables are 32-bit constants whose uses suggest they are ROM tile/palette sources,
  but their contents and labels need resolution (likely art asset tables indexed by chip code).
- Sub_id semantics for type 3 only map 4 distinct values; values >4 still pick offset 0x60, so the upper
  bound is unclear.
- Why r7 is returned is unclear; the readable C treats it as an indirect chip data handle for the type
  0 case, but the value seems unused by the immediate callers observed in this function's register contract.
