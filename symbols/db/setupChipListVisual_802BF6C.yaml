name: setupChipListVisual_802BF6C
address: '0x0802BF6C'
kind: function
status: confirmed
summary: Refills and shuffles the 42-slot chip pool, then queues tile+palette image transfers for a chip
  or soul preview based on the packed id stored in the caller struct.
interface: 'void sub_802BF6C(u32 toolkit /* r5 */) -> /* r7: chip data ptr or pool base */; r0=4, NZ set'
details: "Operates on a caller-supplied \"toolkit\" struct in r5. Initializes a 0x2A-byte\npool at unk_2035320\
  \ with sequential indices 0..41, then shuffles them via\nShuffleByteList_PrimaryRNG with the PrimaryRNG\
  \ seed (count == swaps == 0x2A).\n\nReads a packed u16 ID at toolkit+0x10. If equal to 0xFFFF, falls\
  \ back to the\ndefault chip tile palette pointer pair (dword_8733E74 / dword_87343B4).\nOtherwise it\
  \ is decoded via decodePackedIdFields_802C54C into (type, sub_id)\nand the (image_src, extra_src) pointer\
  \ pair is selected:\n  - type 0: real chip -- getChip8021DA8(sub_id) returns a ChipData*; image_src\n\
  \    and extra_src are loaded from +0x24 and +0x28 of that struct, and r7\n    becomes the ChipData\
  \ pointer.\n  - type 1: soul palette with two fixed table pointers.\n  - type 2: sub_id 0 picks the\
  \ table at dword_8733914/dword_8733E54, else\n    dword_87333B4/dword_87338F4.\n  - type 3: sub_id 1..4\
  \ index steps of 0x20 bytes into dword_87343F4 /\n    dword_8734934 (a 4-entry image table).\n  - default:\
  \ same fallback as the 0xFFFF branch.\n\nTwo QueueEightWordAlignedGFXTransfer calls then upload:\n \
  \ image_src (0xA80 = 0x2A<<6 bytes) -> 0x600BD00 (primary VRAM)\n  extra_src (0x20 bytes)          \
  \ -> unk_3001AE0 (secondary/palette buffer)\n\nThe function clears toolkit+0xB (in-progress flag) and\
  \ writes toolkit+3 = 4\n(state/phase 4 = \"done\"/\"loaded\"). Returns r7 (chip data ptr for type 0,\n\
  otherwise the pool base) to the caller. Preserved: r4, r5, r6.\n\n`are inferred offsets; no struct`\
  \ is a recovered artifact, not real API: the\noffsets +0x24 and +0x28 on the ChipData blob and toolkit\
  \ fields +0xB / +3\nare placeholders for the still-unnamed caller/NPC structures.\n"
