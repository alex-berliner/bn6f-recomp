name: object_getFlag
address: '0x0801A166'
kind: function
status: confirmed
summary: Returns the first object-flag word from a battle object's collision data.
interface: (r5 = battle object*) -> Next /* r0 = collision data ObjectFlags1 */
details: 'Tiny getter over the battle object table: reads the object''s collision-data

  pointer from [r5 + oBattleObject_CollisionDataPtr], then loads the word at

  [collisionData + oCollisionData_ObjectFlags1] into r0 and returns via the

  tail-call convention (mov pc, lr, so lr must hold the return address).

  The caller passes the battle object in r5 rather than r0, matching the

  disassembly''s object-routine calling style. r1 is used as scratch for the

  collision-data pointer; no flags are set or tested. "ObjectFlags1" is the

  first of the collision data''s flag words, presumably holding

  collision/targeting attributes used by battle object interaction checks.

  '
