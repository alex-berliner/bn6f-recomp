name: sub_812A008
address: '0x0812A008'
kind: function
status: hypothesis
summary: 'Per-frame e-Link (guest) state handler: redraws the sprite, runs its palette/animation start hook, and
  on incoming data resets the e-Link state machine to phase 4 / sub-phase 3.'
interface: void eLinkState_RunFrame_812A008(struct eLinkState *r5 /* work area */, void *r10 /* sprite regs */,
  lr /* return */); preserves r4..r8, r5, r6; clobbers r0..r3, r12, lr, N Z C V
details: 'Called in a loop to drive the "e-Link" / guest state machine. It first calls sprite_drawIfFlagSet_812B504
  (only redraws when the sprite''s own flag is set) and crt0_start_800027C (palette/animation init tied to the sprite).
  It then polls sub_81465BC, which appears to test whether new e-Link data was just received; on a non-zero return
  it calls eLinkState_ResetForNewUse_803DE88, writes state 4 into R5+2 (the e-Link state byte) and writes 3 into
  R5+0x28 (a halfword sub-state / counter). Work area offsets: +0x02 = state, +0x28 = sub-state/counter. The pairing
  of byte state 4 with halfword 3 suggests a "received new e-Link request" transition. The function reads nothing
  from its inputs; all state lives in the structure pointed to by r5 and in global state touched by sub_81465BC
  / eLinkState_ResetForNewUse_803DE88.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
