name: lookupMapEntryPair_80A54A4
address: '0x080A54A4'
kind: function
status: confirmed
summary: Resolves a (base, secondary) pointer pair for the current overworld/map context by indexing two
  parallel 3-entry tables with the map number (or 2 for map group 0x85) and adding an entity-specific
  sub-offset from r5.
interface: 'void lookupMapEntryPair_80A54A4(uint32_t *r5_unknown, struct GameState *gameStateFromR10)
  -> (void *r0, void *r1);

  // inputs: r10 -> Toolkit* (only its oToolkit_GameStatePtr is read); r5 -> some 4+ byte struct (byte
  at +4 is the sub-index); lr = return address

  // outputs: r0 = first entry pointer + sub-index*4; r1 = second entry pointer + sub-index*4

  // clobbers: r0, r1, r2, r3, NZCV

  // preserved: r4

  '
details: "Reads GameState::MapGroup via Toolkit's GameState pointer; if MapGroup == 0x85 (a fixed special\
  \ area) it forces the table index to 2, otherwise uses MapNumber as the index. The index is left-shifted\
  \ by 2 to byte-address into two ROM tables stored back-to-back:\n  - off_80A54D8 -> { byte_80A5358,\
  \ byte_80A5384, byte_80A5384 }\n  - off_80A54E4 -> { byte_80A53B0, byte_80A53DC, byte_80A5408 }\nThe\
  \ byte at r5+4 is multiplied by 4 (element size) and added into both loaded pointer values, returning\
  \ two parallel per-entry data/secondary arrays for the entity whose struct sits in r5. The MapGroup\
  \ == 0x85 branch uses an immediate idx=2 which is then shifted to 0x8, selecting the third slot - suggesting\
  \ 0x85 is one of the normal map groups whose data lives in slot 2 of the table. The dual-return shape\
  \ (base + secondary pointer) is typical of MegaMan Star Force / Battle Network NPC/object data pairs\
  \ (graphics tile pointer + collision/animation/string pointer). The 0x85 special-case likely exists\
  \ because MapNumber is invalid/zero in that mode.\n\nRegister form, old prompt; queued for retype (the\
  \ farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
