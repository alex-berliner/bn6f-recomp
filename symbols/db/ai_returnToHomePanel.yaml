name: ai_returnToHomePanel
address: '0x0810F96C'
kind: function
status: probable
summary: Ends an enemy AI attack by teleporting the object back to its saved home panel and resetting
  its attack state.
interface: (r5 = battle object header, r7 = oAIAttackVars) -> void; no meaningful return
details: Uses r5 as the battle object and r7 as its AI attack variable block. If AttackElement is 0 it
  is briefly set to 1, then cleared to 0 at the end; the object's collision region is cleared, ObjectHeader
  Flags bit 2 is toggled off and back on around the move, and offset 0x7C is zeroed. The object's PanelX/Y
  are overwritten with the saved coordinates at offsets 0x64/0x65 (its original/home panel), which are
  also copied into TargetPanelX/Y, then object_setCoordinatesFromPanels recomputes pixel position and
  Z is zeroed. Collision panels are updated, region 1 is set, flag 0x40 is cleared twice, sub_811013C
  is called with the home panel coords and 0x200000 (likely a panel-type change), and the panel reserve
  on that panel is released. Finally CurAnim is set to 0 (idle), StepTimer is reloaded from AttackDuration,
  and HitElement is set to 0x18, leaving the object idle on its home panel ready for the next attack cycle.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb/strb pairs at +0x64/+0x65 into PanelX/PanelY and TargetPanelX/Y show a return to a stored
