name: chatbox_ED_select_8040944
address: '0x08040944'
kind: function
status: confirmed
summary: 'Advances one frame of the chatbox''s ED-select animation: DMA-loads the next tile row into VRAM, wraps
  the frame index at the end of the table, and queues the OAM sprite for that frame.'
interface: void chatbox_ED_select_8040944(u32 /*chatbox*/ r5); // r5 in/out (preserved), no flags on return
details: "Reads from the chatbox object (r5):\n  - oChatbox_Unk_16 (u8): source row index into the frame table at\
  \ \"dword_80409B2\".\n  - oChatbox_Unk_70 (u32): base X origin for the sprite.\n  - chatbox+0x94 (u8): per-instance\
  \ X offset added to the base origin.\n  - oChatbox_BoxGfxLoadState_0F (u8): multiplied by 0xE to form part of\
  \ the Y origin.\n  - oChatbox_Unk_19 (u8): added (with -1) into the Y origin.\nBehavior:\n  - Picks a row from\
  \ the 18-byte frame table at dword_80409B2 (six rows of 0x00, 0x01, 0x02, then a 0xFF terminator).\n  - Scales\
  \ the picked value by <<7 and adds the tile-base byte_86A48C0, then calls QueueEightWordAlignedGFXTransfer with\
  \ src that pointer, dest 0x6017F80, size 0x80 (one 32x16-tile row of 4bpp graphics into VRAM).\n  - Advances the\
  \ frame counter; if the next entry is 0xFF it rolls back to slot 1 and uses the slot-0 tile id.\n  - Builds a\
  \ 32-bit OAM attr01 packed as (x_origin<<16) | y_origin with bit 0x40000000 ORed in (affine sprite flag), and\
  \ attr2 = 0xE3FC (with a shifted-in zero high half), then calls sub_802FE28(attr01, attr2, 0, 4) to submit the\
  \ OAM entry.\n  - Tile id is computed into a local but never actually written to attr2 here; the 0xE3FC constant\
  \ is hard-coded, suggesting the tile id path is reserved/overridden elsewhere or the readable C is slightly conservative.\n\
  Quirks:\n  - Reads via byte table at dword_80409B2 but its terminator 0xFF is treated as a sentinel; the slot-0\
  \ read uses ldrh (16-bit), pulling both bytes 0x00,0x00.\n  - The 0x40000000 OR into the OAM attr01 is the affine-OBJ\
  \ bit in GBA OAM attr0.\n  - r5 (chatbox pointer) is preserved across the call (push {lr} / pop {pc}, no r5 in\
  \ the push list).\n"
