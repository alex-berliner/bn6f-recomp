name: battle_queueBattleIntroOam
address: '0x08033AF0'
kind: function
status: probable
summary: 'One step of the battle-intro (jack-in) animation: queues the navi frame, the battle-start overlay,
  an extra step handler, and the real-world navi icon OAM.'
interface: '(self in r5: * S2011E30) -> r0 = last callee''s return; no flags relied on by caller'
details: This is a tiny sequencer that runs with the object/state pointer in r5 (struct S2011E30). It
  first calls sprite_queueOamByFrameIndex with r0=1 (a frame-select parameter), which queues one OAM entry
  using the periodic 0x18-entry table indexed by the frame counter at [r5+5]. It then calls battle_drawBattleStartOverlay
  with r0=0, which conditionally DMAs and queues the battle-start overlay entry depending on a game-state
  flag. Next it invokes sub_8033CF0 (still undocumented) and finally battleObject_queueRealWorldNaviIconOAM,
  which swaps in the current PET navi's real-world icon tile/palette and queues that sprite transfer.
  The ordering (navi frame, overlay, extra step, navi icon) suggests it is one per-frame update of the
  battle-intro OAM composition.
