name: ai_stepAttackLungeCommit
address: '0x080FC5AE'
kind: function
status: probable
summary: 'AI attack step: commits the object onto its reserved target panel (step-in attack) and runs
  a 13-frame timer before ending the attack state'
interface: (r0 = battle object ptr via r5/r7 AI attack vars; r0 clobbered) -> r0 = undefined; sets AttackElement,
  commits panel move, sets CURRENTLY_MOVING flag
details: First invocation (AttackElement == 0) marks the attack as started by writing element 4, switches
  the battle object to animation 3, passes oAIAttackVars_ScratchVar to sub_80FCF9C (unknown helper), copies
  FuturePanelX/FuturePanelY into PanelX/PanelY, releases the panel reserve, recomputes pixel coordinates
  from the new panel, syncs the collision record/facing, clears flag 0x40, and sets the ObjectFlags1 'currently
  moving' bit, then starts a 0xD-frame StepTimer. On subsequent calls it merely decrements StepTimer;
  when it reaches zero it calls object_exitAttackState to return to idle. This is a two-phase 'lunge onto
  the adjacent panel and pause' melee attack routine of the battle AI.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement] / bne loc_80FC5EC acts as a started-already test gating
    the one-time setup; strb r0,[r5,#oBattleObject_PanelX] from FuturePanelX plus bl object_removePanelReserve
    commits the pre-reserved panel move; bl object_setCoordinatesFromPanels / object_updateCollisionPanels
    refresh position and collision after the step; mov r0,#1; lsl r0,#OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT;
    bl object_setFlag1 marks the object as mid-move; StepTimer = 0xD then countdown with bl object_exitAttackState
    at expiry ends the attack
