  - 0x0800F2C6 battleObject_refreshSpriteAndArm_800F2C6
  - 0x0801A15C object_clearFlag
  - 0x0801BB46 object_removePanelReserve
  reproduce: python3 tools/asmcat.py 0x08113AB8
