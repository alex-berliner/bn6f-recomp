name: camera_copyLinkStateToEnd
address: '0x081325CC'
kind: function
status: probable
summary: Copies two fields of the eLinkState global (offsets 0x1C and 0x0A) into the eCamera end struct
  at eCamera.unk_84+4 and +2.
interface: () -> void; writes eCamera.unk_84+2 (halfword) and +4 (word), clobbers r0-r1, r4
details: Fetches the eLinkState address via sub_803E8F8 and the eCamera.unk_84 pointer via sub_803EF7C,
  then stores eLinkState+0x1C as a 32-bit value at end+4 and eLinkState+0x0A as a 16-bit value at end+2.
  The destination is the camera's 'end' record per the known callee summary, so this syncs link-state
  data into the camera's end-point fields, likely a position/scroll target. No flags are meaningful; the
  routine is a pure two-field copy with no error paths. Called from five places in the 0x812xxxx block,
  several within sub_812B9F8, suggesting repeated re-syncing during camera setup or updates.
