name: object_moveByVelocity
address: '0x0811D6CC'
kind: function
status: probable
summary: adds an object's velocity (8.8 fixed point) to its x/y position fields
interface: (r5 = object struct from getStructFrom2008450) -> void; r0-r2 clobbered
details: Loads the signed 16-bit velocity at struct+0x14 (x) and +0x16 (y), shifts each left by 8 (converting
  8.8 fixed point to the position's fixed-point scale), and adds them into the 32-bit position fields
  at +0x18 (x) and +0x1C (y), storing the results back. Uses ldrsh so negative velocities wrap correctly.
  The caller then calls object_syncSpritePosition, confirming +0x18/+0x1C are the sprite-driving coordinates.
  r5 is set up by the caller from getStructFrom2008450, so the struct is the standard object at 0x2008450.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_811D6CC: ldrsh r1,[r5,#0x14]; lsl r1,#8; add to [r5,#0x18] — velocity.x added to position.x;
    same pattern with +0x16 into [r5,#0x1C] — velocity.y added to position.y; caller at 0x0811D646 calls
    it right after getStructFrom2008450, then object_syncSpritePosition — position update feeds sprite
    draw; ldrsh + lsl #8 shows signed 8.8 fixed-point velocity added to higher-precision position'
