name: map_allocObject_8004822
address: '0x08004822'
kind: function
status: confirmed
summary: Allocate the next free overworld map object (type 9) from a 56-slot pool, returning its address
  or 0 if full.
interface: r0..r4 = init data (byte at +0x01, dwords at +0x04/+0x0C/+0x10/+0x14); r5 out = object pointer
  or 0; flags clobbered; r1-r4,r6 preserved across the call.
details: 'Scans eActiveOverworldMapObjectsBitfield from slot 55 (0x37) down to 0. For each slot it computes
  bit = 0x80000000 >> (slot & 0x1F) and word index = (slot >> 5) * 4, then tests the bit. On the first
  free slot it ORs the bit in (claiming it) and writes a 0x78-byte object at eOverworldMapObject55 - (55
  - slot) * 0x78. Fields written: +0x00 = 9 (type tag for this object class), +0x01 = original r0 (u8),
  +0x04 = original r4, +0x08 = 0 (cleared), +0x0C = original r1, +0x10 = original r2, +0x14 = original
  r3. Because the function pops r0-r4 before writing those fields, the stored values are the caller''s
  originals rather than the loop-modified registers. If every slot is occupied the loop falls through
  to a null return in r5. The pool base label eOverworldMapObject55 confirms 56 slots × 0x78 bytes = 0x1980
  bytes total.'
