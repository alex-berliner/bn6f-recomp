- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_8048FC4: ldr r5, =eS200A290; ldrb r0,[r5]; ldrb r1,[r5,#1] — pure two-byte getter; caller
    0x0812A57C: bl sub_8048FC4; cmp r1,#0x1C; bne skip — result byte gates the exit path; exit path calls
    rfu_setStateEnded then PlaySoundEffect(SOUND_EXIT_SUBMENU) — wireless session teardown; surrounding
    bl IsScreenFadeActive check shows it runs in a menu/overworld UI update loop'
