name: rfu_getCommStatusBytes
address: '0x08048FC4'
kind: function
status: probable
summary: reads two status bytes from the wireless-comm buffer at 0x200A290, used by a submenu handler
  to detect a state (0x1C) that ends the wireless session
interface: (void) -> r0 = byte at 0x200A290, r1 = byte at 0x200A291; no flags guaranteed
details: Loads the pointer to the small buffer/struct eS200A290 into r5 and returns its first two bytes
  in r0 and r1 with no side effects. In the only caller (sub_812A574, after checking no screen fade is
  active), r1 is compared to 0x1C; if it matches and JOYPAD_B is pressed, the caller calls rfu_setStateEnded,
  plays SOUND_EXIT_SUBMENU and stores 0xC at r5+0xC, i.e. it aborts the wireless session from this screen.
  So byte 0x200A291 appears to be a link/session state or received-command code, and 0x1C is a specific
  value that allows the user to back out with B.
