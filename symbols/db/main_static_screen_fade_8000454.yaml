open_questions:
- Exact semantics of test0x200bc50_0x5_813D60C (why bit 5 blocks this handler).
- Whether state 0x10 is actually "static screen fade" or a different main state that owns fade handling.
- What start_800023C, main_initToolkitAndOtherSubsystems and clear_e200AD04 actually do on the reboot path.
- Why r3 = 0xF is the deliberate return value on the "combo not held yet" path (vs. the fade-leftover r3 on the
  other early-out paths).
