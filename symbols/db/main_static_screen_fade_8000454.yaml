name: main_static_screen_fade_8000454
address: '0x08000454'
kind: function
status: probable
summary: Main-loop soft-reset (A+B+Select+Start) handler that runs while a screen fade is active and triggers a
  toolkit reboot on the combo.
interface: void main_softResetHandler_8000454(void); /* reads toolkit via r10, returns final r3 = 0xF on idle paths
  or callee leftover on reboot; caller writes subindex 0xA via strb after the reboot path */
details: 'Invoked from the main loop while a screen fade is active. Guards: bails (leaving r3 = IsScreenFadeActive''s
  leftover) if test0x200bc50_0x5_813D60C is nonzero, or if the main jumptable index byte equals 0x10 ("static screen"
  state). Otherwise reads the joypad pressed/held words via oToolkit_JoypadPtr. Treats the byte at MainJumptableIndexPtr
  + 4 as a countdown: while positive it is decremented and stored back; once it hits 0, it watches for the soft-reset
  combo (all four low-nibble keys held, at least one newly pressed). If the combo is not yet held it writes 0 and
  returns with r3 = 0xF. On the combo it calls start_800023C, main_initToolkitAndOtherSubsystems and clear_e200AD04
  (rebooting the toolkit), then writes subindex 0xA back to that same counter byte and returns the final callee-leftover
  r3. Preserves r4-r7 via push/pop around the reboot path''s callee clobbers.

  '
