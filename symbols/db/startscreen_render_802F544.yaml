name: startscreen_render_802F544
address: '0x0802F544'
kind: function
status: confirmed
summary: Renders one frame of the title/start screen by animating the "Press Start" prompt, dispatching the current
  start-screen state's handler, and ticking the RNG.
interface: 'void startscreen_render_802F544(void);

  // inputs : r2 r3 r4 r5 r6 r7 r8 r9 r10 r11 r12 lr

  // outputs: r4 r5 r6 r7 r8 r9 r10 r11 r12

  // clobbers: r0 r1 r2 r3 lr; flags NZ C V

  // preserved: r4 r5 r6 r7 (r4-r7 explicitly restored to caller via pop)

  '
details: "Per VLM-driven screen, the function is the title/start screen's per-frame\nupdate. It does three things\
  \ in order:\n  1. Calls startScreen_AnimatePressStart_803E938 to advance the blinking\n     \"Press Start\" text.\
  \ That callee mutates r2-r4, r6-r12 and the flags,\n     which is why the comment notes r8-r12 \"pass through\"\
  \ to the caller.\n  2. Reads the state byte at eStartScreen + oStartScreen_JumpTableOff_00\n     and dispatches\
  \ one of four handlers from jt_802F560 via the\n     \"mov lr, pc; bx r0\" computed-call trick:\n       - state\
  \ 0: startScreen_initGfx_802F574 (init/startup)\n       - state 1: startscreen_802F60C\n       - state 2: startScreen_RunStateHandler_802F63C\
  \ (main loop)\n       - state 3: load_game_802F756 (transition into the game)\n     r5 is loaded from off_802F570\
  \ (=eStartScreen), so it serves as the\n     self pointer handed to each handler.\n  3. Calls GetRNG() to advance\
  \ the PRNG; this likely drives random\n     effects rendered this frame (e.g. background star twinkles).\nr4-r7\
  \ are explicitly restored to caller values via the pop {r4-r7, pc}\nepilogue, even though every callee trashes\
  \ them - so the caller can\nrely on those four registers surviving the call.\n"
