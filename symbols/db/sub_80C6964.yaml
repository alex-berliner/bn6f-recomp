name: sub_80C6964
address: '0x080C6964'
kind: function
status: confirmed
summary: 'Spawn-time initialization for a battle object: places it on its panel, points ExtraVars at its 6-byte
  type record, sets its movement direction, and sets up collision data (ID 0x3D) before switching to the update
  state.'
interface: 'void battle_objectInitSpawnCollision_80C6964(BattleObject* r5, /* r8, r10 passed through untouched */
  void); out: r5, r8 preserved'
details: 'Takes the battle object in r5. Reads PanelX/PanelY, converts them to pixel coordinates via object_getCoordinatesForPanels,
  and stores them in X/Y. Sets ExtraVars to byte_80C68D4 + Param1*6, i.e. a pointer to this object''s 6-byte per-type
  record selected by Param1 (the callees object_getFrontDirection, object_createCollisionData, object_setupCollisionData
  and object_presentCollisionData are invoked with r7 pointing at that record). Stores object_getFrontDirection()
  into XVelocity, so the object moves toward whatever is in front of it. Allocates collision data via object_createCollisionData;
  on failure (returns 0) the object is immediately freed with object_freeMemory and the function returns. On success
  it calls object_setupCollisionData with collision ID 0x3D, element 5 (r2), and 0 (r3); zeroes oCollisionData_PrimaryElement
  in the freshly allocated CollisionDataPtr, then presents the collision data via object_presentCollisionData. Finally
  writes CUR_STATE_UPDATE into CurStateActionPhaseAndPhaseInitialized so the per-frame update state takes over.
  r8 and r10 are caller state passed through untouched (the register contract reports them as both inputs and outputs
  for r8); r7 is saved/restored. Clobbers r0-r3, lr and flags.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
