- Which oBattleObject kind (parent vs child) is r5 in sub_80E44E0; the function is documented from the
  caller's oBattleObject_Alliance field, so the 'digi-beast' attribution assumes the parent object.
- What battle flag 0x40 represents (e.g., 'display digi-beast gauge' toggle) is not visible in this function
