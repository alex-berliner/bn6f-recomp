name: battle_drawDigiBeastHpGauge
address: '0x080E4612'
kind: function
status: probable
summary: Each tick, while the parent's HP-gauge display phase is active, draw the controlled digi-beast's
  HP gauge over its owner so the viewer sees the partner's HP at a glance.
interface: (void, uses r5 = oBattleObject*) -> void; no flags
details: Called from sub_80E44E0 once per frame after oBattleObject_Timer crosses 0x14. It only does work
  when battle flag 0x40 is set (battle testFlag0x40_800A8F8) and the object's Alliance is not a same-side
  ally of the current controller (battle_networkInvert). When both pass, it queues an HP-gauge sprite
  record at screen (0x78, 0x0C) via sprite_queueHpGaugeEntry, which is the standard position used for
  the digi-beast partner gauge in the player's HUD area. r5 is the caller's frame object, used only to
  read oBattleObject_Alliance.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: Caller sub_80E44E0 is a per-frame action handler that drives oBattleObject_Timer from 0x5A down
    to 0 and at 0x080E44F6 calls this routine when timer >= 0x14 (call site 0x080E44F6).; sub_80E4612
    returns immediately unless battle_testFlag0x40_800A8F8 is set, restricting the gauge to the relevant
    battle context.; battle_networkInvert on oBattleObject_Alliance gates drawing to objects on the opposite
    team, matching a per-side HP-gauge display logic.; screen coordinates 0x78,0x0C and the use of sprite_queueHpGaugeEntry
    match the digi-beast partner HP gauge sprite.; The trailing dword 0xFFFF and alignment pad suggest
    a sibling constant lives next to this routine in the same action table.
