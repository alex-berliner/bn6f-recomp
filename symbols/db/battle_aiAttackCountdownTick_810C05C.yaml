name: battle_aiAttackCountdownTick_810C05C
address: '0x0810C05C'
kind: function
status: confirmed
summary: Ticks one AI attack object's step countdown each frame; when it expires, reloads the interval
  and flags the attack ready to fire (step 8).
interface: void battle_aiAttackCountdownTick_810C05C(AIAttackVars* vars /* r7 */); // clobbers r0 and
  flags, no outputs
details: "Part of the enemy AI attack scheduling state machine. The object's vars block\n(r7) holds oAIAttackVars_HitElement\
  \ at +0x00, the repeat interval (byte,\noAIAttackVars_AttackBoost2) at +0x0c, and the step countdown\n\
  (oAIAttackVars_StepTimer, half-word) at +0x10.\nEach call decrements the countdown half-word. As long\
  \ as the result is still\n>= 0 (signed bge), nothing else happens. Once the countdown goes negative:\n\
  \  * the countdown is reloaded from the byte at oAIAttackVars_AttackBoost2\n    (the attack's repeat\
  \ interval), so the timer starts over, and\n  * oAIAttackVars_HitElement is set to 8, which downstream\
  \ AI code reads as\n    \"attack ready / advance to step 8\".\nQuirk: the countdown is loaded with ldrh\
  \ (zero-extended) but tested with a\nsigned bge, so a stored 0xFFFF (sentinel for \"inactive\"?) would\
  \ wrap to a\nlarge positive value and keep the timer running rather than firing; the\nverified C must\
  \ preserve this unsigned-load/signed-test combination.\n"
