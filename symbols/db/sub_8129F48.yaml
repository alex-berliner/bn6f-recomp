name: sub_8129F48
address: '0x08129F48'
kind: function
status: confirmed
summary: Initialize the e-Link subsystem for a new use and hand off to the e-Link main routine.
interface: void sub_8129F48(struct eLinkWork *r5);
details: 'Entry point that prepares the e-Link (link cable / wireless) session. Runs

  crt0_entry_trampoline_8000288 first (so this is invoked as a near jump target),

  then sets the state byte at r5+2 to 4, resetting/initializing the e-Link work

  area. It calls eLinkState_ResetForNewUse_803DE88 and sub_803DEAC to clear prior

  link state, configures transfer parameters (0x10 units, mode 3/2, index 0) via

  sub_803DCE8, runs init helpers sub_803EF60 and sub_803EA78, and registers a

  receive buffer tagged 0x42523545 ("ERUB" as a big-endian ASCII tag) of size

  0x2000 at base 0 via sub_803DCD8. Finally tails into sub_81322E8 (the e-Link

  main loop / state driver) and uses `pop {pc}`, so it never returns normally —

  control transfers stay inside the e-Link subsystem. r5 is the e-Link work

  structure; r6/r10/r11 are left as the callees set them and become the live

  registers for sub_81322E8.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
