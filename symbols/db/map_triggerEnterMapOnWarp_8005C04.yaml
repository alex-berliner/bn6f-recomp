open_questions:
- Exact meaning of oWarp2011bb0_Unk_10 (set to 2 on same-world warps only) and oS2001c04_Unk_12/Unk_14.
- Which of the two saved-coord blocks (Internet vs Real World) the MapId is packed into — code packs (currentMapNum<<8|currentMapGroup)
  into the saved block of the world being left, but the facing offset comment is ambiguous.
- What MAP_GROUP_TRANSITION_TYPE_* values exist beyond the two named constants.
- Whether oGameState_FacingDirectionAfterWarp is a single byte (read with ldrb elsewhere) or a word — code stores
  a word-sized value into it.
