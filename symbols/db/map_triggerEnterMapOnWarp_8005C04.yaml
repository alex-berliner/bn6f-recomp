name: map_triggerEnterMapOnWarp_8005C04
address: '0x08005C04'
kind: function
status: confirmed
summary: 'Finalises a warp: tears down the leaving map''s entities, installs the chosen warp entry, stashes overworld
  player coords on real-world↔internet crossings, picks the respawn point, rewrites the GameState map id so cbGameState_80050EC
  enters the destination map, and clears the warp-animation event.'
interface: 'void map_triggerEnterMapOnWarp_8005C04(void);

  // inputs: r10 = Toolkit pointer; preserved r4-r7; clobbers r0-r3, r8, r11, lr, nz/c/v

  // outputs (caller-visible): r0=0, r1=old mapGroup, r2=previous LastMapGroup,

  //   r3=player Z at respawn; C = bit 7 of the target map id, V from cmp transitions, N/Z set by the trailing movs

  '
details: "* Clears oGameState_Ptr_20 (warp animation \"owns\" it until completion).\n* Frees all objects of type\
  \ mask 0x25 belonging to the outgoing map.\n* Copies the (WarpIndex-1)-th oWarpData_Size record from the warp\
  \ table into\n  the warp work struct at oToolkit_Warp2011bb0_Ptr.\n* Resolves the incoming map (map_lookupMapIdByGroupAndNumber_8001708)\
  \ and\n  sets LCD control to 0x40 (force display on for the new area).\n* If EVENT_171B is clear (i.e. not a real-world↔internet\
  \ crossfade), and the\n  outgoing group differs from the warp target by bit 0x80, snapshots the\n  overworld player's\
  \ X/Y/Z/facing into either the SavedInternetCoords or\n  SavedRealWorldCoords block (offset selected by the destination\
  \ group bit 0x80:\n  warping *to* the internet saves the real-world coords; warping *to* real world\n  saves the\
  \ internet coords). Also packs MapNumber<<8 | MapGroup into the MapId slot.\n* Clears EVENT_171B.\n* Selects respawn\
  \ position based on oWarp2011bb0_MapGroupTransitionType:\n    - INTERNET_TO_REAL_WORLD: load oGameState_SavedRealWorld{X,Y,Z,FacingDirection,MapId}.\n\
  \    - REAL_WORLD_TO_INTERNET: load oGameState_SavedInternet{X,Y,Z,FacingDirection,MapId}.\n    - default (same-world\
  \ warp): set oWarp2011bb0_Unk_10 = 2 and load X/Y/Z/facing/MapId\n      from the warp entry that was just copied.\n\
  * Writes PlayerX/PlayerY/PlayerZ/FacingDirectionAfterWarp from the chosen respawn.\n* Forces oGameState_SubsystemIndex\
  \ = 0 (without this the screen stays white).\n* Updates LastMapNumber from current MapNumber, LastMapGroup from\
  \ current\n  MapGroup, and installs MapGroup/MapNumber from the respawn MapId\n  (low byte = group, high byte\
  \ = number).\n* Zeroes oS2001c04_Unk_12 and oS2001c04_Unk_14 (warp-animation fields).\n"
