open_questions:
- Exact semantic of `AIData.JoypadPressed = 1` here (is it the B-press that swaps into BeastOut, or a
  "trigger seen" flag?). Settling it requires the caller's subsequent use of `r5+0x24`.
- Why 0xC0 BBS requests specifically (per-version tutorial/state marker).
