name: sub_80039AA
address: '0x080039AA'
kind: function
status: confirmed
summary: Dispatches a scenario/cutscene effect by indexing a 16-byte-stride jump table at jt_80038E8 using the sub-id
  byte at 0x2000781, after gating on the active/complete byte at 0x2000780.
interface: "void dispatchScenarioEffect_80039AA(void);\n  // caller-supplied registers passed through to the dispatched\
  \ handler:\n  //   in:  r2, r3, r4, r6, r8, r9, r10, r11, r12, lr\n  //   out (to handler and back to caller via\
  \ pushed r4-r7): r2, r3, r4, r5, r6, r7, r8, r9, r10, r11, r12\n  //   clobbers internally: nz, c, v, r0, r1,\
  \ lr\n  //   preserved across the call: r4, r5, r6, r7\n"
details: '- Reads the eScenarioEffectState control byte at 0x2000780 (via off_80039F0 -> 0x2000780).

  - Early-returns when the control byte is 0 (idle) or has bit 7 set (complete/done); the routine is effectively
  a no-op in those states.

  - Otherwise reads the sub-id byte at 0x2000781, multiplies by 0x10 (16) to stride through the jump table rooted
  at 0x80038E8 (off_80039F4), loads the 32-bit handler pointer from that entry, and tail-calls it via `bx`.

  - The handler receives the original r2-r12/lr context from the caller; this function''s only saving grace for
  the caller is preserving r4-r7 on the stack (`push {r4-r7,lr}` / `pop {r4-r7,pc}`), and seeding r5 = 0x2000780,
  r1 = 0x10, r7 = handler-entry address, r0 = handler before the bx.

  - Caller-frame r2-r12 are expected to be transformed by whatever scenario-effect handler runs, which is why the
  register contract marks r2-r12 as both inputs and outputs.

  - Constants: status base 0x2000780, jump-table base 0x80038E8, entry stride 0x10.

  '
