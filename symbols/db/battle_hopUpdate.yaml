name: battle_hopUpdate
address: '0x080E4EC8'
kind: function
status: probable
summary: 'Per-frame movement step for a battle object performing a repeated forward hop: applies velocity,
  and every 2 ticks respawns the hop (reposition, reset velocities, anim, action).'
interface: (r5 = battle object pointer, implicit) -> void; updates oBattleObject_X/Z, velocities, Timer,
  CurAnim, CurAction
details: 'Each call adds XVelocity to X and subtracts ZVelocity from Z (so Z counts down, e.g. a hop height/offset
  in 16.16 fixed point), then decrements the 16-bit Timer. When Timer reaches 0 it restarts the cycle:
  Timer = 2, snaps pixel X/Y from panel grid coords via object_setCoordinatesFromPanels, offsets X by
  facing*0xA0000 (10 px) using object_getFrontDirection (+1/-1), sets Z = 0x1E0000 (30), XVelocity = facing*0x50000
  (5 px/tick), ZVelocity = 0xF0000 (15), sets CurAnim = 3 (hop/jump anim), calls sub_80E5024 (likely animation/state
  setup) and sets CurAction = 8, then calls sub_80E4FE8 (likely per-frame anim/update tail) before returning.
  Z=30 with ZVel=15 and Timer=2 means exactly 2 ticks per hop cycle, giving a regular hopping gait toward
  the target.'
