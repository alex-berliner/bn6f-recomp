name: eCharCodeBuffer
address: '0x02026A00'
kind: data
status: probable
summary: 'Proposed name: eCharCodeBuffer. A 32-byte EWRAM buffer of halfword character codes, pre-filled
  with 0xE5E5 and 0xE6-terminated, used by the byte-string-to-char-code converter and as the sprite-resource
  pointer for type-0x23 GUI objects. (u16)'
details: 'Lives in EWRAM at 0x02026A00 for 32 bytes (16 halfwords). convertByteStringToCharCodes uses
  it as a scratch buffer: it HalfwordFills the region with 0xE5E5, writes a 0xE6 byte terminator scaled
  by index*2, then iterates a 0-terminated byte string at [r0], multiply-adding 8 per byte, presumably
  to look up character codes via the unk_2026A00+2 origin. sub_803C1BC writes four 0-words to its argument,
  then reuses unk_2026A00+2 to walk pairs of halfwords comparing against 0xE6 and 0xE5, suggesting it
  walks the same buffer. object_initType23Sprite passes unk_2026A00 as the second arg to initGuiSprite_8002770
  along with sprite index 0x14, then sets animation, palette and coordinates to (0x20, 0x50) — consistent
  with it being a small GUI sprite-data table (a gui_data sprite record, given the helpers involved).'
