name: oAIAttackVars_AttackDuration
address: '0x18'
kind: struct-field
status: probable
summary: Saved duration (frames) to reload into the active attack windup timer each time the windup flag
  (Unk_01) cycles; inited from caller arg or RNG helper, fixed literals (0x1e/0x3c/0x50) used for windups/cooldowns.
details: Across ~50+ tick handlers the same pattern copies this field into Unk_10 (the live 16-bit timer)
  when Unk_01 is 0, e.g. "ldrh r0, [r7,#oAIAttackVars_Unk_18]" / "strh r0, [r7,#oAIAttackVars_Unk_10]".
  aiAttack_initVarsAndStart_80116AE stores the caller-supplied duration (r1) here. Transition sites overwriting
  it with constant frame counts (0x1e=30, 0x3c=60, 0x50=80) match windup/cooldown intervals used elsewhere
  in the same structs.
