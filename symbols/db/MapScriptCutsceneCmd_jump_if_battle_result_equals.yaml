name: MapScriptCutsceneCmd_jump_if_battle_result_equals
address: '0x0803793A'
kind: function
status: confirmed
summary: Map-script cutscene command that compares the last battle's result against an expected value and jumps
  to a script address on a match, otherwise skips the command.
interface: int MapScriptCutsceneCmd_jump_if_battle_result_equals(u32 battleResultHandle /* r0 in, passed to getBattleResult
  */, MapScriptPos pos /* r7 */); returns r0=1, r7 = next script position (jump destination on match, pos+6 otherwise);
  nz/cv flags reflect the final mov/add
details: 'Implements the "jump if battle result equals <n>" cutscene command, encoded as

  [opcode][expected result byte][32-bit destination address] (6 bytes total).

  Flow: sets r6=1 (ReadMapScriptByte operand width) and reads the expected battle-result

  byte into r4; calls eStruct200A008_getBattleResult (passing through the incoming r0,

  likely a handle/context for the battle-result store at eStruct 0x200A008) to get the

  actual result; if equal, sets r6=2 (word width), reads the 32-bit destination address,

  and continues the script there (r7 = destination); if unequal, advances r7 by 6 to

  skip the whole command. Always returns r0=1. The script position lives in r7, which

  is also the input and preserved by the ReadMapScript* helpers.

  Quirk: mov r7,r4 assembles to adds r7,r4,#0 and add r7,#6 both set carry/overflow,

  which stay live through the pop {pc} return.

  '
