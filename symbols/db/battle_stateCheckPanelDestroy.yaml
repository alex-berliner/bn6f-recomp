name: battle_stateCheckPanelDestroy
address: '0x080CDA1C'
kind: function
status: probable
summary: 'Battle-object update handler: on a gated animation frame, verifies the panel under the object;
  if it no longer qualifies, destroys the object with a poof effect, otherwise starts a burrow/move to
  the reserved future panel.'
interface: (r0 = battle object ptr, forwarded to sprite_getFrameParameters; r5 = battle object ptr) ->
  void; writes oBattleObject_CurStateActionPhaseAndPhaseInitialized = CUR_STATE_DESTROY on the destroy
  path
details: 'Entry is gated by sprite_getFrameParameters bit 0x80, so the body runs only on a specific animation
  frame. It picks one of two effect resource pairs (0x10010 + 0xF880080 vs 0x3880080) based on bit 1 of
  ExtraVars[4]. object_checkPanelParameters is called with the object''s PanelX/PanelY; if the panel does
  NOT match the required flag mask, the object is destroyed: an effect is spawned at the object''s position
  (fields loaded from r5+0x34, +0x80000 added to the third), the future panel reservation is released
  (object_removePanelReserve), the collision region is cleared, flag bit 1 of oObjectHeader_Flags is cleared,
  destroy sub-events are dispatched, the object is removed from the battle object list, and the state
  word is set to CUR_STATE_DESTROY. If the panel does match, the object instead enters a transition: CurAnim
  = ExtraVars[1], Timer = 0x3C, collision region set to 1, CurAction = 8, phase = 0, and (if Param1 >
  1) the future panel (FuturePanelX/Y) is reserved via object_reservePanel. If ExtraVars[4] bit 0 is set,
  it further sets CurPhase = 8 with Timer = 0xF instead of ending. Behavior strongly suggests a submerging/burrowing
  entity that dies (with a dirt/poof effect) if the ground panel beneath it becomes invalid (e.g. broken
  or wrong type).'
