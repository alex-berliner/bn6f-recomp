name: NPCCommand_set_active_and_invisible
address: '0x0809EE1A'
kind: function
status: confirmed
summary: NPC script command that marks the NPC's object as active (flag byte = 1) and steps the script pointer past
  this one-byte command.
interface: void NPCCommand_set_active_and_invisible(ObjectHeader *obj /* r5 */, u8 **scriptPtr /* r6 */); returns
  r0 = 1 (the flag value written), r6 advanced by 1, NZCV set by the pointer increment.
details: Executes a single opcode of the NPC scripting system. Writes the constant OBJECT_FLAG_ACTIVE (1) into the
  object header's Flags byte at oObjectHeader_Flags, which makes the NPC object active (the command's name suggests
  the resulting object is also invisible, i.e. an active-but-hidden NPC state). It then increments the script pointer
  in r6 by one byte to skip this command (it takes no operands) and returns via the saved lr without touching the
  stack. r0 is left holding the value 1 that was stored, and the condition flags happen to reflect the pointer increment
  rather than the flag write; no other registers or memory are touched.
