name: submenu_selectNetworkScript
address: '0x080494DE'
kind: function
status: probable
summary: 'Per-frame handler for a submenu page: on the 0x10 key press it clears that key flag and writes
  0x44 to [r5+1]; otherwise it may play SOUND_EXIT_SUBMENU, picks one of three text script IDs (0xF/0x10/0x11)
  based on 0x80/0x20/none inputs, dispatches via sub_803BB2C, and writes 0x40 to [r5+1] before tail calls.'
interface: (r0 = unused/0x10 sentinel, r5 = menu state struct) -> stores next-state byte at [r5+1] (0x40
  or 0x44); no return value used
details: It first calls sub_803CB18(0x10), a key-flag test; if that key is pressed it takes the close/other
  branch, calls sub_803CB0C(0x100), and stores 0x44 into the state byte at r5+1. Otherwise it tests the
  boolean at IWRAM 0x200BC50+5 and, when clear, plays SOUND_EXIT_SUBMENU. It then distinguishes three
  inputs via sub_803CB18 with masks 0x80, 0x20, and neither, mapping them to text script IDs 0xF, 0x10,
  0x11 which it shows through sub_803BB2C (a helper that renders network-menu text scripts), then stores
  0x40 into [r5+1]. Finally it calls sub_803A104 and sub_8049BC0 before returning. The byte at r5+1 (0x40
  vs 0x44) looks like a state/page selector consumed by the enclosing menu loop.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'mov r0, #0x10 / bl sub_803CB18 ... bne loc_8049516 — branches on a key-flag test to the alternate
    branch; mov r0, #SOUND_EXIT_SUBMENU / bl PlaySoundEffect — plays the submenu-exit SFX before script
    selection; mov r4, #0xF/0x10/0x11 then bl sub_803BB2C — selects one of three adjacent text scripts
    for display; strb r0, [r5,#1] with 0x40 or 0x44 — writes the next page/state byte of the menu struct;
    callees sub_803CB0C/sub_803CB18 wrap the same key-test struct at 0x200BC50, confirming this is input-driven
    menu logic'
