  result: 'proposed by hyper/glm-5.3-flash, self_score 2; cross-checked by minimax/MiniMax-M3: revise
    — The code structure matches the proposal well: the 0x10 key check branches to loc_8049516 which writes
    0x44 to [r5+1], while the main path writes 0x40. However, the summary claims sub_803BB2C ''renders
    network-menu text scripts'', but the callee description says it ''selects and displays a network-related
    text script based on the current main jump table phase'', which is a submenu page behavior, not per-frame
    input handling. Also, SOUND_EXIT_SUBMENU plays only when test0x200bc50_0x5 is clear, i.e. when the
    boolean is false, contradicting the proposal''s ''when clear, plays SOUND_EXIT_SUBMENU'' which is
    actually correct but the summary phrasing is ambiguous. The name is acceptable but could emphasize
    the script-selection role.; run wf investigate investigate-20261018-235109; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
