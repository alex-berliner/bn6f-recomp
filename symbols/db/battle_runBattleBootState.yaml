name: battle_runBattleBootState
address: '0x08039E80'
kind: function
status: probable
summary: 'Per-frame step of the battle-boot state machine: dispatches first, then if a screen fade is active it
  runs the heavy rebuild (graphics copy, reset, setup, fade-gfx init, toolkit randomize, battleSettingsList0[0],
  initBattleStructs) and writes 0x40 into byte 1 of the r5 struct; otherwise advances to sub_803A104.'
interface: () -> void; r5 is a global battle/state struct; when the fade path runs it sets byte [r5+1] = 0x40, r0
  clobbered
details: 'This looks like a per-frame step of the battle-boot state machine. It first calls dispatch_803C620, then
  checks IsScreenFadeActive; while a fade is in progress it calls chatbox_8040818 and repeatedly runs the heavy
  init sequence: copying the 0x800-byte graphics block to VRAM 0x600D400, resetting all graphics state, running
  a setup step with work-area clear, initialising the battle fade gfx state, randomising extra toolkit pointers,
  fetching battleSettingsList0 entry 0, and calling initBattleStructsAndVram_80071D4 — finally writing 0x40 into
  byte 1 of the r5 struct, plausibly a phase/timer value. If no fade is active it instead takes the short branch
  to sub_803A104, suggesting the fade path is the ''first entry'' path and the other path the steady-state continuation.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: beq loc_8039EB4 after IsScreenFadeActive splits a one-time setup path from an alternate continuation path;
    copyMemory_8001850 + resetAllGraphicsState_8005F40 + sprite_initBattleFadeGfxState_80027C4 show a full scene
    graphics rebuild; mov r0,#0; bl getBattleSettingsFromList0 followed by initBattleStructsAndVram_80071D4 builds
    battle structures from settings entry 0; strb r0(0x40),[r5,#1] writes a phase/counter byte into a global struct
    kept in r5; RandomizeExtraToolkitPointers callee summary says 'after a game-state reload', matching a fresh
    battle-scene load
  refs:
  - bn6f/asm/asm03_1_1.s:2438
  - 0x08006C22 RandomizeExtraToolkitPointers
  - 0x08001850 copyMemory_8001850
  - 0x0800A71E getBattleSettingsFromList0
  reproduce: python3 tools/asmcat.py 0x08039E80
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise — The code
    at 0x08039E8C sets `strb r0, [r5,#1]` (byte index 1, not 0), which matches. However, the proposed name `battle_initBattleScene`
    is too narrow: the function first calls `dispatch_803C620` unconditionally, then branches on fade state, and
    the ''else'' branch calls `sub_803A104` — strongly suggesting this is a per-frame state-machine step (init +
    advance), not a one-shot init. A better name is `battle_runBattleBootState`. The summary also overstates ''rebuilds
    battle graphics''; it really just executes the boot state, which conditionally rebuilds when a fade is active.;
    run wf investigate investigate-20261018-222121; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted
    by glm-5.3-flash (tools/investigate_land.py reconcile)'
