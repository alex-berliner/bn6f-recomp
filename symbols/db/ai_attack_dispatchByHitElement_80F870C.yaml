name: ai_attack_dispatchByHitElement_80F870C
address: '0x080F870C'
kind: function
status: confirmed
summary: Dispatches the current AI attack to an element-specific handler chosen by the HitElement byte
  in the AI attack vars.
interface: void sub_80F870C(r5=ctx?, r6=ctx?, r7=AIAttackVars*, lr=return) -> r1/r8-r12 as left by handler,
  r5 passthrough, r7 preserved; flags clobbered
details: "Reads the HitElement byte (oAIAttackVars_HitElement) from the AI attack vars structure pointed\
  \ to by r7, then calls one of three handlers through the table at off_80F8720:\n  entry 0 -> sub_80F872C\n\
  \  entry 1 -> ai_attackStepWindupAnim3Hit8\n  entry 2 -> sub_80F87DA\nQuirk: the raw HitElement byte\
  \ is used directly as a BYTE offset into the word-sized table, so the game stores it pre-scaled to 0/4/8\
  \ rather than as a 0/1/2 element index. The handler is entered with r0 = the raw element value and r1\
  \ = its own table entry address; r5/r6 (and lr as a general register) simply stay live and pass through\
  \ to the handler. Tail call is via mov lr,pc / bx r1 with a push {r7,lr}/pop {r7,pc} wrapper, so the\
  \ handler returns straight to this function's caller. r1 and r8-r12 on exit are whatever the chosen\
  \ handler left there.\n"
