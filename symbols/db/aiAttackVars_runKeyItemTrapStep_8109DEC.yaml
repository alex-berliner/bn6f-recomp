open_questions:
- The semantic identity of this trap (which key item / which battle object kind spawns kind-0x16) is not
  pinned down; Unk_0c and Damage are forwarded into the spawn but the calling code that fills them is
  not provided.
- Whether OBJECT_FLAGS_UNK_BIT_22 truly is "immune to own trap" vs "trap active" needs a similar AI step
  to confirm.
- The pointer at AIAttackVars+0x30 and what reads it (so we can be sure r1 isn't stale).
