name: sub_814DA9C
address: '0x0814DA9C'
kind: function
status: confirmed
summary: libgcc's __divsi3, the signed 32-bit division helper the ROM's sound setup divides through; a zero divisor
  calls the __div0 nullsub and returns 0.
interface: "static Division divide_signed(s32 numerator, s32 denominator) ->\n    Division { s32 quotient; u32 r1,\
  \ r2, r3, r12; }\nNext sub_814DA9C: in r0/r1 = numerator/denominator (r2/r3/r12 scratch on the\nzero path); out\
  \ r0 quotient, r1/r2/r3/r12 the division loop's state, nz/c/v,\nr4 preserved.\n"
details: 'Restores libgcc''s loop exactly: absolute values, the divisor normalized by

  fours then single bits to just below the dividend, then one round of

  subtract-and-subtract-half/quarter/eighth per loop; the sign r12 = r0^r1 is

  applied last. SampleFreqSet divides four constants through it (1584/samples,

  (597275*samples+5000)/10000, 16777216/pcmFreq and 280896/samples), so the

  helper lives in this file and its register leftovers are reproduced outside

  the subsystem''s calls.

  '
