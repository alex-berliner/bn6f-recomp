  detail: '- The header bit toggle is observable at `bic r4, r1` / `orr r4, r1` followed by `strb r4,
    [r5]` after a test on `r6,#0xd`. - The "candidate CurAnim" path is at 0x811E2CC-0x811E2DE: `bl sub_81421D0;
    add r0,#1; cmp r0, r1; beq ...; strb r0, [r5,#5]; bl sprite_setAnimation; bl sprite_loadAnimationData`.
    - The cutscene-coord block is `push {r0,r1}; ... ldr r0, off_811E308; bl cutscene_checkOriginalCutsceneScriptPos_8036F70;
    pop {r0,r1}; beq loc_811E2F8; sub r0,#0x14; add r1,#8` then `bl sprite_setCoordinates`. - Caller is
    sub_811E26C and that function is the one that pushes r0=0x04 / r1=0xB0 (Param1, Param2 style) into
    the r0/r1 captured-call entries. - tail return `pop {pc}` with the only saved register being `lr`
    (`push {lr}` at 0x811E2B4). - Captured calls in snap_beastsp_0180000 always exit with r0=0x5E0 (the
    cutscene''s op0 result + the 0x14 subtraction), matching the branch path; Z flag set on exit is consistent
    with the final `bl sprite_update` returning equality or zero.'
