- sub_811E2B4
status: probable
summary: Updates the Beast Out / Cross Fusion player's battle object sprite each frame, including a flip-state
  bit, optional sprite/animation reload and cutscene-driven coordinate offset.
interface: '(r5 = ptr to BattleObject, r6 = ptr to related object / extra struct) -> void ; side effects:
  mutates object header flags and animation index, calls sprite_setCoordinates / sub_811E314 / sprite_update,
  pushes two args for cutscene_checkOriginalCutsceneScriptPos_8036F70'
details: "1. Reads the object's header byte 0 (Flags) into r4, then uses r6->Unk_0d to decide whether\
  \ bit 0x02 (OBJECT_FLAG_VISIBLE?) is cleared or set on r5, writing the new value back. (bic/orr at 0x811E2C2-0x811E2C6)\n\
  \  2. If header byte 4 (Index) is nonzero, calls sub_81421D0 to produce a candidate animation index,\
  \ increments it and stores it at r5+5 (CurAnim) when it differs, then calls sprite_setAnimation(r5+5)\
  \ and sprite_loadAnimationData() to refresh the sprite frames.\n  3. Pushes a 2-word cutscene coord\
  \ pair (r0=0xDC, r1=0x24) and the CutsceneScript pointer (dword_8089128), then calls cutscene_checkOriginalCutsceneScriptPos_8036F70\
  \ to test whether the original cutscene is parked at this op.\n  4. If the check is non-zero (cutscene\
  \ IS at this op), subtracts 0x14 from r0 and adds 8 to r1, shifting the sprite coord; otherwise leaves\
  \ the pushed values intact. Then calls sprite_setCoordinates(r0,r1) to write the X/Y of the selected\
  \ sub-sprite (header byte 2 high nibble).\n  5. Calls sub_811E314 (likely an object-state helper) and\
  \ then sprite_update, which advances the sprite animation and OAM entries for the current slot.\n  6.\
  \ Returns via `pop {pc}` (tail call equivalent of `bx lr`) since the function saved only lr on entry.\n"
