status: hypothesis
summary: Tiny thunk that invokes sub_801BEC2 with the constant argument 2; effect depends entirely on what sub_801BEC2
  does with its argument.
interface: void sub_801DB6C(void) /* trashes r0-r2, lr and the flags; passes r0=2 to sub_801BEC2 */
details: 'Pushes lr, builds the constant 2 as 1 << 1 (mov r0, #1 ; lsl r0, r0, #1), then tail-calls sub_801BEC2
  via bl and returns with pop {pc}. No other work is done: the whole function is a fixed-argument wrapper around
  sub_801BEC2. A compiler would have written mov r0, #2, so this constant was likely produced by source-level arithmetic
  (e.g. an enum or 1 << a flag constant) rather than a bare literal. Because sub_801BEC2 performs no flag-setting
  instruction on its return path, the NZ/C values left for the caller come from the lsl itself: N=0, Z=0 (result
  2 is nonzero positive) and C=0 (bit 31 of 1 was clear before the shift). The function is classified Next in the
  readable C, suggesting sub_801BEC2''s result/ behaviour belongs to a "next step"/state-advance style API, but
  nothing here reveals which subsystem it drives.

  '
