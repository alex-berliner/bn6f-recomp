name: chatbox_screenWipeStep
address: '0x0803A334'
kind: function
status: probable
summary: Step that each frame shifts two toolkit counters by -0x30 and two by +0x30; once the decremented counter
  at +6 hits 0x71 it loads BG-tile-table entry 6, fills BG layers 2 and 3 with a 30x20 tile wipe, runs sub_803A422,
  and stores state bytes 0/0xF/0/8 before returning 0; otherwise it ticks entities via chatbox_waitStepUpdateEntities
  and returns 0.
interface: () -> r0 = 0 (step not finished); no flags used
details: 'Reads the toolkit pointer at [r10+oToolkit_Unk200f3a0_Ptr] and mutates bytes at +4/-0x30, +5/+0x30, +6/-0x30,
  +7/+0x30 each call — two counters rising while two fall, so repeated calls drive a transition. It compares the
  decremented byte at +6 against 0x71; while unequal it calls chatbox_waitStepUpdateEntities to keep entities and
  sprites ticking for one frame. On the equal case it runs the finish sequence: sub_803B91C with r0=6 loads BG-tile-table
  entry 6 into the toolkit iBGTileIdBlocks buffer, two call_sub_3005EBA invocations (r0=0,r1=0,r2=2 then 3,r3=0,r4=0x1e,r5=0x14)
  fill a full 30x20-tile screen on two layers, sub_803A422 is called, and bytes at r5+0x19/0x1a/0x1b and r5+2 are
  set to 0/0xF/0/8. Returns 0 in both branches; r5 in the finish path comes from sub_803A422.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'asm: ldrb/strb pairs add 0x30 to +5,+7 and subtract 0x30 from +4,+6 of the Unk200f3a0 struct — per-call
    animation counters; asm: cmp r0,#0x71 / bne loc_803A394 — counter at +6 is the completion threshold; asm: bl
    chatbox_waitStepUpdateEntities in the not-done branch — this is a cutscene wait step; asm: mov r4,#0x1e; mov
    r5,#0x14 with r2=2 then 3 into call_sub_3005EBA — two full-screen 30x20 BG-map fills; asm: mov r0,#6; bl sub_803B91C
    plus writes to r5+0x19..0x1b and r5+2 — finish work and final state bytes'
