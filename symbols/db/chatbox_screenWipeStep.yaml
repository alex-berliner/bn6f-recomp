  result: 'proposed by hyper/glm-5.3-flash, self_score 2; cross-checked by minimax/MiniMax-M3: revise — The proposal''s
    per-frame mutations are inverted: bytes at +4 and +6 are decremented by 0x30, while +5 and +7 are incremented
    by 0x30 (ldrb + add/+0x30 at +5,+7; ldrb + sub/-0x30 at +4,+6), not the other way around. The rest of the summary
    (compare +6 to 0x71, bne to waitStepUpdateEntities, sub_803B91C r0=6, two call_sub_3005EBA fills at 30x20, sub_803A422,
    then strb 0/0xF/0/8) matches the finish branch exactly. The name fits but a cleaner one would be chatbox_screenWipeStep.;
