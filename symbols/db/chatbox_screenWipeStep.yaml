- Meaning of fields +4..+7 in the Unk200f3a0 struct is unknown; they could be scroll offsets, sprite coordinates,
  or palette indices
- sub_803A422, the exact semantics of call_sub_3005EBA, and what BG-tile entry 6 depicts are needed to name the
  finish sequence precisely
