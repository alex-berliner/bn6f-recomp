name: toolkit_ClearAllEventFlags_802F0C4
address: '0x0802F0C4'
kind: function
status: confirmed
summary: Clears the entire event-flags array in the toolkit's event-flag buffer, resetting all 630 story/scene flags.
interface: void sub_802F0C4(void); // r10 = toolkit ptr in; r2, r3 preserved pass-through; NZCV clobbered
details: 'Loads the toolkit''s event-flags pointer from r10 + oToolkit_EventFlagsPtr and calls ZeroFillByHalfword
  with size 630*2 (0x4EC) bytes, zeroing all 630 halfword event-flag entries. r2 and r3 are untouched and pass through
  unchanged (the contract lists them as both inputs and preserved outputs, so callers rely on them surviving the
  call). lr is saved/restored as this is a plain call from thumb code. In game terms this resets every event/progression
  flag, e.g. when (re)initializing a playthrough state or new game flow.

  '
