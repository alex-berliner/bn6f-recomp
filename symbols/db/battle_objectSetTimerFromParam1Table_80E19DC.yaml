name: battle_objectSetTimerFromParam1Table_80E19DC
address: '0x080E19DC'
kind: function
status: confirmed
summary: Loads a battle object's Timer from a lookup table indexed by its Param1 byte, then advances the object's
  state to CUR_STATE_UPDATE.
interface: Next sub_80E19DC(BattleObject *obj /* r5 */)
details: 'Battle-object state handler. Reads the object''s Param1 byte (oBattleObject_Param1 at offset 4), uses
  it as an index into the timer table at dword_80E19F0 (which points into EWRAM at 0x0205A20), stores the fetched
  byte as the object''s 16-bit Timer (oBattleObject_Timer), writes CUR_STATE_UPDATE (4) into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  (offset 8) so the state machine moves on next frame, and returns. The literal-pool table entry currently holds
  0x205A20, so the actual timer values live in EWRAM and are presumably initialized elsewhere at runtime; the ROM
  side only supplies the pointer. Caller contract: r5 = object pointer, lr = return; returns r0 = CUR_STATE_UPDATE
  (with NZ flags set by the mov), r1 = timer value, r7 = table pointer, and Z/N flags from the final mov. The returned
  r0/flags are incidental side effects of the state store, not a deliberate API.'
