name: ai_attackPanelStrikeStep
address: '0x0810733E'
kind: function
status: probable
summary: 'AI attack step handler: arms an attack on the panel in front of the enemy, then counts down
  and sets the hit element when the strike lands.'
interface: (r5 = battle object, r7 = oAIAttackVars) -> void; no meaningful return
details: 'Standard two-phase AI attack step. On the first call (AttackElement == 0) it initializes: sets
  AttackElement = 4, plays enemy attack anim 0xC on the object (mirrored to CurAnimCopy = 0xFF), arms
  object_setCounterTime(0x18), plays sound 0x1C6, spawns a type-0 effect (kind 1) on the panel in front
  via object_spawnFrontPanelEffect, and sets StepTimer = 0x14. On later calls it decrements StepTimer;
  when it reaches 0x11 it calls sub_8107A00(1) (likely spawning the actual hit object), and when it hits
  0 it writes HitElement = 0x20, marking the attack resolved.'
