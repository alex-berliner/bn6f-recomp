name: ai_attackEndStep
address: '0x080F7B9C'
kind: function
status: probable
summary: 'AI attack-script tail step: counts down a step timer and, when it expires, restores the object
  to idle/finished-attack state'
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = undefined; no meaningful return
details: 'Decrement-and-wait pattern: each call decrements oAIAttackVars_StepTimer and returns early while
  it is still positive. When it reaches zero it resets oBattleObject_CurAnim to 0 (idle animation), clears
  flag bit 0x40 via object_clearFlag, sets the OBJECT_FLAGS_CURRENTLY_MOVING_1 bit via object_setFlag1,
  and stores 0xC into oAIAttackVars_HitElement, terminating the attack''s hit-state window. It is a per-frame
  step invoked from AI attack data with r7 pointing at the AIAttackVars struct.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrh r0,[r7,#oAIAttackVars_StepTimer]; sub #1; bgt locret -> per-frame countdown of the attack
    step; mov r0,#0; strb r0,[r5,#oBattleObject_CurAnim] -> resets the object''s current animation to
    idle; object_clearFlag(0x40) then object_setFlag1(1<<CURRENTLY_MOVING_1) -> updates CollisionData
    ObjectFlags1 to end the moving/attack state; strh 0xC into oAIAttackVars_HitElement -> clears/sets
    the hit element field as the attack concludes; callees are only object_clearFlag and object_setFlag1,
    matching a small state-reset helper'
  refs:
  - bn6f/asm/asm31.s:135816
  - 0x0801A15C object_clearFlag
  - 0x0801A152 object_setFlag1
  reproduce: python3 tools/asmcat.py 0x080F7B9C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-182231'
