name: getPetNaviStatus_80101F8
address: '0x080101F8'
kind: function
status: confirmed
summary: Resolves the PET Navi id for battle-status purposes, returning a fallback when the Pet Navi is
  unset and a gate event and config flag both allow it.
interface: u8 sub_80101F8(void) /* r10,lr in; r0,r1,r3,r4,lr out; nz,c,v set */
details: 'Calls GetCurPETNavi and reads its r0 result into r4. If that result is non-zero it is

  returned verbatim as the PET Navi id. Otherwise it checks event flag 163 (via

  TestEventFlagFromImmediate: bank 1, offset 0x63) and a runtime config byte at 0x200AD04

  via notZero_eByte200AD04; if both tests pass it returns 0xD as a hard-coded fallback.

  Falls through to return 0 when the Pet Navi is unset and either the event flag is set

  or the fallback-byte predicate is false, effectively giving the caller one of {current

  Navi id, 0xD, 0}.

  '
