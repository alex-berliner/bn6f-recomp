name: RealClearChain
address: '0x0814E044'
kind: function
status: confirmed
summary: Detaches a node from the doubly linked list it is chained into, leaving an already-detached node untouched.
interface: void UnlinkNodeFromList(void* node /* r0 */); // clobbers r1-r3 and flags; trashes lr via internal use,
  returns via bx lr
details: 'Treats r0 as a node of an intrusive doubly linked list. Field layout:

  node+0x2C = pointer to the list anchor (head object), node+0x30 = prev node,

  node+0x34 = next node; the anchor stores the first node at anchor+0x20.

  If the node is not attached (anchor at +0x2C is NULL) the function returns

  immediately without touching anything. Otherwise it splices the node out:

  prev(+0x30)->next(+0x34) = next, or, when there is no prev (node was the

  list head), anchor(+0x2C)->first(+0x20) = next; then next(+0x34)->prev(+0x30)

  = prev if a next exists; finally node+0x2C is cleared to mark it detached.

  Outputs r1 = old next (forced to 0 at the end), r2 = old prev, r3 = old

  anchor; flags end as "equal" (Z=1, C=1, V=0) on every path. No other

  registers are touched; the node''s prev/next pointers themselves are not

  cleared, only its anchor link.

  '
