name: sub_812982C
address: '0x0812982C'
kind: function
status: confirmed
summary: In a battle, scan three object slot pointers at unk_20251A0; if none have a pending byte at offset +7,
  clear their active flags, mark the battle-state stage as 8, advance the state machine via sub_812B39C, and clear
  the battle-state's bit-0 flag at +0x1B.
interface: void sub_812982C(u32* r4 OUT, u32* r5 OUT, u32* r6 OUT, u32* r5 = battle_state IN, u32 r10 = ?, lr =
  return); clobbers NZCV, r0-r3, lr; preserves r7. r5 is in-out (caller- preserved base of the battle-state struct;
  same value is observed after, but ldr/str pass the same register through). r4 is the slots pointer (unk_20251A0),
  r6 is the slot byte-offset of the first non-zero +7 byte (0, 4, or 8) on early-out, or a return value from sub_812B39C
  on the happy path.
details: 'Operates on the three 4-byte entries at unk_20251A0 (a small array of three entries, stride 4,

  total 0xC bytes). Each entry''s high bit (mask 0x80000000) is an "active" flag; the low 31 bits

  are a pointer to a battle object/sprite.


  Pass 1 loops slot_off in {0, 4, 8}: loads the entry, clears bit 31 to get the object pointer,

  reads the byte at object+7; if non-zero, returns immediately with R4 = base of slot array,

  R5 = battle-state pointer, R6 = current slot byte-offset.


  Pass 2 (only reached if every object+7 was zero) clears bit 31 of all three slot entries in

  place, leaving the low-31-bit pointers intact.


  Then writes the byte at battle_state+3 to 8 (a "stage" or "phase" field on the battle-state

  struct), calls sub_812B39C (which takes R4 = slot array base, R5 = battle-state, R10 = some

  caller-provided value), and finally clears bit 0 of battle_state+0x1B (a small flags byte

  on the same struct).


  The "object+7" check suggests sub-objects (possibly shadow/object-trail slots) must be

  quiescent (counter or state fully decremented) before the active flags can be cleared and

  the state advanced. The constant 8 written to battle_state+3 is plausibly a "cleanup/done"

  stage marker.

  '
