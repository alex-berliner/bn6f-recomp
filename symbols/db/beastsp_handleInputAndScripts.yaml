name: beastsp_handleInputAndScripts
address: '0x081334C8'
kind: function
status: probable
summary: 'Input/state step handler for a beast-SP-related text sequence: reacts to B+Select and chatbox
  progress, playing sounds and advancing scripts 0xb/0x10/0x11 while updating a context''s state bytes.'
interface: (r5 = context struct, caller-provided) -> r0 = last call's return; writes state bytes [r5+2],
  [r5+3] and word [r5+0x68]
details: 'If a submenu is open it returns immediately, except when the submenu state is 0x30, in which
  case it sets [r5+3]=0xc; state 0x24 also just returns. Otherwise it checks chatbox flag bit 0x20 of
  eFlags2009F38: if clear, it waits for B or Select, and on a new press sets [r5+2]=0x10, plays SOUND_EXIT_SUBMENU
  and runs text script 0xb. If the chatbox flag is set, it plays SOUND_MENU_SELECT and branches on chatbox_GetState:
  nonzero state leads to sub_8134FE0, [r5+0x68]=0xc, script 0x10 and [r5+3]=8; zero state runs script
  0x11 with [r5+3]=4 and [r5+0x68]=0. The context r5 is never set up in this function, so the caller must
  preload it. Scripts come from the eTextScript2028A20 archive via the chatbox trampoline. The pattern
  (exit sound + B/Select + sequential scripts + small state machine fields) fits a scripted tutorial/cutscene
  advance step.'
