name: beastsp_handleInputAndScripts
address: '0x081334C8'
kind: function
status: confirmed
summary: 'Per-frame tick handler for the Beast SP sub-menu: dispatches menu selection (OK/Cancel), chatbox script
  advancement, and exit-on-SELECT+B logic.'
interface: void beastsp_handleInputAndScripts(u32 r2 /*sound arg*/, u32 r4 /*battle state*/, u32 r5 /*submenu state
  ptr*/, u32 r10 /*passthrough*/) → preserves r4, r6, r7, r10; outputs r5, r10; clobbers r0-r3, lr, flags
details: 'Checks submenu_isOpen_81355D8. If open: reads submenu_getUnk02 highlight value—0x24 (OK) consumes input
  silently, 0x30 (Cancel) writes 0x0C to state byte +3 and returns. If closed (or fell through): tests chatbox flag
  bit 0x20 via chatbox_mask_eFlags2009F38. Flag set means a chatbox selection prompt is active—plays SOUND_MENU_SELECT,
  then either advances the script (chatbox_GetState != 0 → sub_8134FE0, word +0x68 = 0x0C, runScript(0x10), byte
  +3 = 0x08) or finishes it (chatbox_GetState == 0 → runScript(0x11), byte +3 = 0x04, word +0x68 = 0). Flag clear
  means idle—polls SELECT|B via IsButtonPressed; on press writes exit flag 0x10 to byte +2, plays SOUND_EXIT_SUBMENU,
  and runs script 0x0B. State struct fields touched: byte at +2 (exit flag), byte at +3 (phase/state code), word
  at +0x68 (chatbox sub-state). r5 pointer and r10 are unchanged on return. Two unused .word references (byte_813316C,
  byte_8133174) sit after the function, likely jump-table remnants.'
