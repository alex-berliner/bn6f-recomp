name: owPlayer_enableWallCollision_809e248
address: '0x0809E248'
kind: function
status: confirmed
summary: Re-enables wall collision on the overworld player object (sets its wallCollision flag to TRUE).
interface: Next owPlayer_enableWallCollision(u32 toolkit_in_r10), returns u32 r0 = TRUE, r3 = overworld player object
  pointer; NZ flags set from r0
details: 'Reads the toolkit pointer from r10, follows toolkit->gameState (oToolkit_GameStatePtr) then gameState->overworldPlayerObject
  (oGameState_OverworldPlayerObjectPtr), and stores 1 (TRUE) as a byte into the player object''s wallCollision field
  at offset 0x0c (oOWPlayerObject_wallCollision_0c). This presumably restores normal collision after something (e.g.
  a cutscene, phase shift, or ghost/walk-through-walls effect) disabled it. Quirks: r10 must be the toolkit pointer
  on entry; the function also leaves the player object pointer in r3 and returns TRUE in r0 with NZ flags set from
  it (the Thumb "mov r0, #1" encoding sets flags), so callers could read those back even if they typically ignore
  them.'
