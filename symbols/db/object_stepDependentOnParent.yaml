name: object_stepDependentOnParent
address: '0x080D02D6'
kind: function
status: confirmed
summary: Per-frame step for a battle object that exists only while its related "parent" object is mid-action 0xB;
  destroys it when the battle ends or the parent leaves that action, otherwise runs its own wait/destroy step routine.
interface: void object_stepDependentOnParent(oBattleObject *obj /* r5 */); // r2, r10 also live in; dispatched routine
  leaves results in r5/r8-r12 which pass through as outputs; clobbers flags and r0-r4,r6,r7,lr
details: "Steps a battle object whose lifetime is tied to another object (oBattleObject_RelatedObject1Ptr,\nthe\
  \ \"parent\"). First checks battle_isBattleOver; if the battle is over the object is immediately\nswitched to\
  \ the destroy state by writing CUR_STATE_DESTROY into\noBattleObject_CurStateActionPhaseAndPhaseInitialized. Next\
  \ it reads the parent's\noBattleObject_CurAction: if the parent is NOT currently at action 0xB the object is likewise\n\
  sent to the destroy state — i.e. the object only lives while the parent is performing that\naction (0xB acts as\
  \ the \"attachment window\"). If the parent is still at 0xB, battle_isTimeStop\nis consulted; while time is stopped\
  \ the object just idles this step (Z flag semantics: return\nwithout stepping). Otherwise the object's own oBattleObject_CurAction\
  \ indexes a two-entry jump\ntable at off_80D0308 and the selected routine is tail-dispatched:\n  action 0 -> battle_objWaitThenSetAction4\
  \ (wait a timer, then move to action 4)\n  action 1 -> battle_objectDestroyAfterTimer (count down, then self-destruct)\n\
  The dispatched routine's register results (r5, r8-r12) are this function's de-facto outputs;\nthey pass straight\
  \ through the guest register file. r5 is the object pointer throughout.\nNote: the verified C's header comment\
  \ claims destroy happens when the parent HAS reached 0xB,\nbut both the assembly and the code body branch to destroy\
  \ when the parent's action != 0xB;\nthe code body matches the assembly.\n"
