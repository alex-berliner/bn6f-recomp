name: object_stepDependentOnParent
address: '0x080D02D6'
kind: function
status: probable
summary: Per-frame update for a battle object that destroys itself unless its related object is in action
  0xB, then dispatches its own action handler.
interface: (r5 = battle object) -> r0 = handler return or none; destroys object (writes CUR_STATE_DESTROY
  to oBattleObject_CurStateActionPhaseAndPhaseInitialized) if battle over or parent not in action 0xB
details: This is the step/update routine of some battle object (r5 = oBattleObject). If the battle is
  over, or the object's RelatedObject1's CurAction is not 0xB, it immediately writes CUR_STATE_DESTROY
  into the object's state field, ending it. Otherwise, if time-stop is active it returns without doing
  anything. Otherwise it indexes a two-entry function table (off_80D0308) with its own CurAction and tail-calls
  the handler in thumb mode via mov lr,pc / bx r1 — so only actions 0 and 1 are valid; any other CurAction
  would jump through garbage. The dependence on a parent's action 0xB suggests a projectile/attachment
  that only lives while the parent performs that specific action.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl battle_isBattleOver; tst/bne -> loc_80D02FC writes CUR_STATE_DESTROY: battle end destroys
    it; ldrb r0,[RelatedObject1,#oBattleObject_CurAction]; cmp r0,#0xb; bne destroy: requires parent action
    0xB; bl battle_isTimeStop; bne locret: skips update while battle is time-stopped; ldr r1,[r1,r0] off
    2-entry table; mov lr,pc; bx r1: dispatches own CurAction 0/1 to sub_80D0310/sub_80D033C; callee battle_isBattleOver
    and oBattleObject fields confirm battle-object context'
  refs:
