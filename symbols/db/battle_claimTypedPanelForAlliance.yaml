name: battle_claimTypedPanelForAlliance
address: '0x080BAA4C'
kind: function
status: probable
summary: If the panel under a battle object has one of that object's alliance's special terrain types,
  reassigns that panel's alliance with a short timer.
interface: (r5 = battle object, preserved) -> r0 = destroyed; loops r4 = 0..3 over table entries and r6
  = 1..3 over alliance values, calling the panel check per combination
details: For the object in r5, it indexes a byte table at off_80BAA84 by (Alliance<<2)+r4, giving four
  candidate panel-type values per alliance (bytes 05 04 03 02 for alliance 0, 02 03 04 05 for alliance
  1, i.e. terrain types 2-5). Each candidate value is passed with r6 (1..3) and the object's alliance
  byte to object_checkPanelTypeMatchesValue_800D618, which tests the panel the object stands on. On a
  match it calls object_setPanelAllianceTimerShort to claim/reown the panel with a short timer and stops
  the inner loop; otherwise r6 advances through 1..3. The outer loop tries all four terrain entries, so
  the function effectively converts any of a set of special panel types under the object to a new alliance
  temporarily. The table lives in the literal pool itself (the .word byte_2030405 is really the byte run
  05 04 03 02).
