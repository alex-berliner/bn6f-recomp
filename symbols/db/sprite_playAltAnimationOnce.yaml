name: sprite_playAltAnimationOnce
address: '0x0811E000'
kind: function
status: confirmed
summary: Starts an object's alternate (one-shot) animation exactly once, guarding with a started counter at sprite+0x09.
interface: 'void sprite_playAltAnimationOnce(sprite* r5) // in: r5 = sprite/object struct; out: r5 = (possibly reallocated)
  sprite pointer'
details: "If the byte at sprite+0x09 (a \"alternate animation started\" counter) is positive, the alternate\nanimation\
  \ is already running and the function returns immediately, only preserving r5. Otherwise\nit increments that byte,\
  \ then performs the one-shot animation start sequence:\n  - sprite_setUnk0x2c(1) with r5 as context: sets a one-shot/alt-animation\
  \ flag (field 0x2c area)\n  - sprite_setAnimation(1): selects the alternate animation slot (index 1)\n  - sprite_loadAnimationData():\
  \ loads the frame/graphics data for the selected animation; this\n    call may update the sprite pointer, and\
  \ the (possibly new) value is propagated to r5 and\n    returned to the caller\n  - sprite_noShadow(): this animation\
  \ renders without a shadow sprite\nCallers expect the (possibly updated by loadAnimationData) sprite pointer back\
  \ in r5.\nNo other flags or registers are meaningful on return; r4 and r5 are preserved through the body.\n"
