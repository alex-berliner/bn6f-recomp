name: sub_80498F8
address: '0x080498F8'
kind: function
status: confirmed
summary: Steps the chip-select submenu state machine once per frame, dispatching to the per-state handler and then
  running the common cleanup.
interface: void sub_80498F8(void); // no meaningful inputs/outputs; uses r2 r4 r5 r10 lr on entry, clobbers nz r0
  r1 r2 r3 r8 r9 r10 r11 r12 lr, preserves r4 r5 r6 r7
details: 'Queries the current chip-select sub-state via sub_803AFC2. If state == 0

  the Zero flag is set and the routine skips the dispatch table, going

  straight to the common tail (sub_803A7EC then sub_803BC7C(0)). For any

  non-zero state, it indexes dword_804991C (the 6-entry handler table at

  0x0804991C: entry 0 unused, entries 1..5 = sub_803AD04,

  chipSelect_dispatchState_803AD20, sub_803AED8, sub_803AE50,

  sub_803AE78) and tail-calls the selected handler in Thumb mode with

  R0 = handler address, R1 = table base, then falls through into the

  same common tail. The handler functions are themselves the per-state

  steppers of the chip-select UI (the only named one is

  chipSelect_dispatchState_803AD20); state 1 handles initialisation and

  the higher states cover selection, scrolling, cursor update and

  confirmation, consistent with the chip-select menu flow. The choice

  of R0 = table entry / R1 = table base is a calling-convention quirk

  used so each handler can recover its own slot number by

  (R0 - R1) >> 2.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
