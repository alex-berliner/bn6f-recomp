open_questions:
- No caller is known, so the in-game trigger and what object sprite id 0x80 represents are unidentified
- sub_80DC160's behavior would confirm the resulting state machine (idle/attack/one-shot?)
- Meaning of the 0x2 flag bit and the sprite_load arguments (0xC, 0x64) is unverified
- The sprite id 0x80 is not 'one offset ~40px' — it's the sprite resource ID; the ±0x28 is the pixel X
  shift. The code also calls sprite_update between sprite_loadAnimationData and sprite_noShadow, which
  the summary omits. The 0x2 flag set, anim 4, ±0x28 X shift via object_getFrontDirection, zero Z/ExtraVars,
  CUR_STATE_UPDATE handoff to sub_80DC160 are all consistent with the proposal.
