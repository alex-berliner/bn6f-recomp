name: battle_initObjectInFrontOfOwner
address: '0x080DC108'
kind: function
status: probable
summary: Initializes a spawned battle object by setting flag 0x2, loading sprite 0x80 at offsets 0xC/0x64
  with animation 4, recomputing pixel coords from panels, then shifting X by ±0x28 (40px) per object_getFrontDirection
  so it sits in front of its owner; finally zeroes Z/ExtraVars and jumps to its update handler (sub_80DC160).
interface: (r5 = battle object header, all state via r5) -> r0 = sub_80DC160 return; sets object flags/sprite/position/state
details: Operating on the object in r5 (shared with the object_* callees), it first sets flag bit 0x2
  in oObjectHeader_Flags, then loads sprite id 0x80 with args 0xC and 0x64 via sprite_load and selects
  animation 4 into oBattleObject_CurAnim and its copy. It applies the no-shadow sprite flag and mirrors
  the sprite via object_getFlip/sprite_setFlip so it faces like the owner. It recomputes pixel X/Y from
  panels, then shifts X by ±0x28 (40px) multiplied by object_getFrontDirection (+1/-1), so the object
  sits in front of its owner; it zeroes oBattleObject_Z (ground plane) and oBattleObject_ExtraVars. Finally
  it stores CUR_STATE_UPDATE into oBattleObject_CurState and tail-calls sub_80DC160, presumably the object's
  per-frame update/state handler.
