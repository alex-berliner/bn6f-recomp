name: ai_spawnAheadRandomHeightPhase
address: '0x080C9E20'
kind: function
status: probable
summary: Battle-object AI phase that repeatedly spawns an object inheriting the actor's element one panel
  in front, at a randomly chosen height, then hands off to action 8.
interface: (r5 = battle object) -> void; sets oBattleObject_CurPhase/Timer/Timer2/CurAnim/CurAction
details: On phase 0 it sets phase 1, a 10-frame Timer, rolls GetPositiveSignedRNG &3 to index the table
  {8,16,24,32} (passed <<16 as the 4th arg to the spawn helper, likely a pixel Y/height field), and calls
  spawn_t3_0x12_80C6ADA with target panel (panelX + getFrontDirection(), panelY) and the actor's Element,
  then plays SFX 0xB9. In phase 1 it counts Timer down; on expiry it decrements Timer2 — if Timer2 is
  still positive it resets to phase 0 to spawn again, otherwise it sets CurAnim=2, CurAction=8 and clears
  the phase, moving the AI to its next behavior. So this is a looping 'spawn N things ahead of me, then
  attack/act' state used by some enemy's AI.
