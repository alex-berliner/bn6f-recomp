    offset 0x4 stored via strb r3,[r5,#4] is Param1, which contradicts the byte layout — see uncertain).
    - `cmp r0,#0` / `beq loc_80A7888` (mov r4,#1) and `cmp r0,#0x10` / `beq loc_80A788A` (mov r4,#3) followed
    by a single `strb r4,[r5]` write a chosen byte into [r5]. - `bl sprite_disableAlpha` after the loc_80A788A
    label shows the 3-case branch controls whether alpha is disabled (0/0x10 trigger it; anything else,
    including the e.g. 0x20 default path through `b loc_80A788E`, skips it). - `mov r0,#2 ; bl sprite_setPriority_8002E14`
    hard-codes OAM priority 2 for this sprite. - `ldrb r0,[r5,#4]` / `ldrb r1,[r5,#5]` / `cmp r0,r1` followed
    by `beq loc_80A78A6` is a "render only if anim changed" cache, matching the standard sprite_setAnimation/loadAnimationData
    dance used elsewhere (sprite_setAnimation @ 0x08002da4 writes byte 0 of the sprite; sprite_loadAnimationData
    @ 0x080026a4 reloads animation assets). - `strb r0,[r5,#5]` then `bl sprite_update` persists the now-current
    anim and pushes the sprite into OAM. - sole non-trivial caller `sub_80A783C` has matching contract
    (in r5/r10/lr; out r2..r5), strongly suggesting this is Beast-Out-related given the sub_809BA14 capture
    file is named "beastsp_0080000_*" (the runtime traces to a Beast-Out sprite slot).'
