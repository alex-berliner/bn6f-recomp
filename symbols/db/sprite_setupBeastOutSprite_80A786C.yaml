open_questions:
- Exact meaning of [r5] byte 0 — the BattleObject struct begins with linked-list prev/next pointers, so
  writing a u8 to [r5] actually mutates the low byte of `Prev`; this is unusual and may indicate r5 here
  isn't actually a vanilla BattleObject or the file is using a custom object header where byte 0 is the
  visual layer/object kind. Would settle it once sub_809BA14 and the caller's r5 origin are known.
- 'The (r0,r1,r2,r3) -> (r5+0xc..0x14) mapping: battle_object_struct ExtraVars starts at 0x60, not 0xc,
  so this is almost certainly a different/smaller object shape (likely a Beast-Out helper object). The
  struct definitions do not list a 0xc..0x14 four-word block. Would settle by identifying r5''s type at
  the call site.'
- 'Why r4 is only branched on for two values (0 and 0x10): r4 likely classifies the transition (regular
  vs cross-fade?), and other values may indicate "no change, just refresh" — would settle from sub_80A783C''s
  setup code.'
