  detail: '- push/pop {lr;..}/pop {pc} shows a leaf-like wrapper with no callee-saves, matching the public-ish
    helper role seen in sprite_* callees. - `bl sub_809BA14` + four direct stores into r5 (offsets 0xc,
    0x10, 0x14, 4) prove the first block copies a precomputed (r0,r1,r2,r3) into the battle object''s
