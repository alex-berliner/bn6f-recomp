summary: Configure a battle object's sprite slot for a Beast-Out style transformation (priority 2, optional
  alpha-off, then reload animation if the anim changed).
interface: (r5 = BattleObject*, r10 = Toolkit*, r4 in = some init context) -> side effects only ; writes
  r5+0..0x5, r5+0xc..0x14, calls sprite_disableAlpha/setPriority/setAnimation/loadAnimationData/update
details: "1. Calls sub_809BA14 (subsystem init/restore helper using r10) and stores the returned (r0,r1,r2)\
  \ at r5+0xc/0x10/0x14 (object ExtraVars bytes 0..0x0b area) plus r3 at r5+4 (Param3 byte).\n  2. Inspects\
  \ incoming r4 (a flag passed from sub_80A783C): r4==0 -> store 1 into [r5]; r4==0x10 -> store 3 into\
  \ [r5]; otherwise r4 keeps its old value and no alpha tweak is needed, branch straight to priority/anim\
  \ step. The two chosen bytes 1 and 3 are written to the object's first byte (the object header index/category\
  \ slot: see battle_object_struct Unk_0c? — actually stored at [r5] which is the linked-list prev ptr\
  \ least-significant byte, not the header).\n  3. For the alpha-on path, jumps to loc_80A788A which calls\
  \ sprite_disableAlpha (i.e. alpha toggle off for appearance change); the no-op paths fall through without\
  \ the alpha call.\n  4. Always sets sprite priority to 2 (sprite_setPriority_8002E14 with r0=2), giving\
  \ the Beast-Out sprite a fixed OAM layer below the regular actors.\n  5. Compares the desired anim byte\
  \ (r5+4, just stored by sub_809BA14) against the last-rendered anim byte (r5+5); on change, calls sprite_setAnimation(byte)\
  \ then sprite_loadAnimationData() to refresh frames, then stores the new anim byte into r5+5.\n  6.\
  \ Always finishes with sprite_update() to push the refreshed sprite into OAM, then returns.\ndetails:\
  \ |\n  Captured-call entries repeatedly show r0=0x080a786d (return target for tail-call site) and r3=0x40\
  \ pointing to EWRAM object state; the function only ever returns to its sole caller sub_80A783C.\n"
