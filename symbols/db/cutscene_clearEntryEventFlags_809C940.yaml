name: cutscene_clearEntryEventFlags_809C940
address: '0x0809C940'
kind: function
status: confirmed
summary: Clears every event flag listed in the cutscene state's entry flag bitfield via ClearEventFlag.
interface: (void) -> void; callers pass r10 (consumed by ClearEventFlag) and lr; the function preserves
  and returns r5 to callers (r5 is both an input the caller expects back and the sole register output)
details: 'Loads the cutscene state pointer from eCutsceneState+0x70, then reads the u16

  entry-flag bitfield at offset 0x14 of that structure and passes it to

  ClearEventFlag, which clears each listed event flag. No other fields of the

  cutscene state are touched here. The wrapper form passes r5 through unchanged,

  so callers get their r5 back; r10 must be valid on entry because ClearEventFlag

  reads it (per its register contract, r10 is an input to ClearEventFlag).

  Clobbers r0, r1, r3, lr and flags nzcv, preserves r4-r7.

  '
