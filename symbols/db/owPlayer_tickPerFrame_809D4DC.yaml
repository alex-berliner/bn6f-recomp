open_questions:
- The semantic meaning of each jumptable index value (0x8/0xc/0x10/0x14) — names like "door-enter", "advance",
  "skip-this-tick" are inferred from neighbouring matches and the sub_809DF28 summary; the only instruction
  that pins them is the literal passed to owPlayer_setJumptableIndex09AndOthers_809e004.
- The two off-table handlers at sub_809D560 / sub_809D5C4 are still unnamed; their roles (presumably "turn
  to face NPC vs keep walking") would settle the interact jumptable semantics.
