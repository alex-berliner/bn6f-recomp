name: renderHpDigits_801C296
address: '0x0801C296'
kind: function
status: confirmed
summary: Render an HP readout into a 4-nibble buffer, masking unchanged digits and precomputing a right-justified
  x offset.
interface: void sub_801C296(u32 r3, void* src_obj /* r4 */, u32 r6, void* dst_readout /* r7 */); preserves
  r3, r4, r6, r7; clobbers r0, r1, r2, lr, nzcv.
details: 'Operates on a "source object" (r4) that owns the live HP state and a "destination readout"

  buffer (r7) that the upper layers blit each frame. Three things happen in sequence.

  (1) BCD conversion of the displayed value: the source object''s u16 at +2 is the current HP;

  if bit 4 of its u8 flags at +0 is set, the value used is (LD16(LD32(r4+0xC)+0x26) - hp),

  i.e. "missing HP" mode using the max-HP reference. memory_bcdConvert is called on the

  chosen value and the resulting 16-bit BCD is unpacked into r7[0..3] as four 4-bit glyph

  indices (one nibble per byte).

  (2) Layout: countHexDigits_8000C5C(<bcd>) yields the leading-digit count; an s32 x pixel

  offset is stored at r7+4 as -(0x20 - digits*4), which right-justifies the four-glyph field

  in a 0x20-pixel-wide slot. Nibble slots r7[digits..3] are filled with the blank glyph 0xA.

  (3) Damage flash mask: r4+0x10 holds the snapshot of the previous r7[0..3] word. The new

  value at r7[0..3] is first written into r4+0x10, then each nibble is compared against the

  prior nibble at the same slot; where they differ the new nibble is left in place, where

  they match the slot is overwritten with 0xB (the "no-change" tile). Because the comparison

  walks nibbles packed in 8-bit-aligned bytes via the >>=8 shift, the diff is effectively

  per-nibble across the four glyph slots.

  Quirks: r3 and r6 are passed only because the ABI preserves them; the typed body ignores

  them (r6 unused, r3 returned unchanged). The diff loop stores both cur and prev through

  the same pointer arithmetic but offsets differ, so the snapshot at r4+0x10 is the raw

  pre-mask value, not the masked r7 output.

  '
