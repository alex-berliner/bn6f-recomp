open_questions:
- Exact glyph indices 0xA (blank) and 0xB (unchanged-flash) need a sprite-sheet lookup to confirm they
  map to " " and a "no-damage" tile in the HP font.
- Whether +0xC always points into a battle-entity struct or can also be a parent object (battle shared
  HP pools) is not visible from this function alone.
- The 0x20-pixel slot width suggests 4 glyphs at 8 px each on the standard font; whether this is the same
  routine used for non-HP 4-digit readouts is unconfirmed.
