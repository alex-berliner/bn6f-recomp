name: sub_81203E4
address: '0x081203E4'
kind: function
status: confirmed
summary: Builds a packed chip-slot address list from a chip-pack entry row of the folder table.
interface: void sub_81203E4(u32 entry_index /* r0 */, u32 entry_base /* r1 */, u32 out_list /* r2 */, u32 slot_base
  /* r3 */, u32 count /* r5 */); /* r7 preserved; flags clobbered */
details: "Zeros 0x38 bytes of the output buffer (ZeroFillByWord), then iterates over `count`\nentries of size 0x20\
  \ starting at `entry_base + entry_index*0x20`. For each entry it\nreads the u16 at +0x1C and tests bit 7:\n  -\
  \ bit set: calls getChip8021DA8(mask) to get the chip record, reads its id byte at +6,\n    maps it through sub_811FF54\
  \ to a slot index, and writes two packed u32s at\n    out + 8*i:\n        word_lo = (slot_base + slot*4)     |\
  \ ((slot_base + slot*4 + 1) << 16)\n        word_hi = word_lo + 0x20002         // -> upper half = (slot_base+slot*4+3)\n\
  \    So the two words encode pairs of consecutive u16 addresses: (base+0, base+1)\n    and (base+2, base+3) where\
  \ base = slot_base + slot*4. Matches the\n    battle chip-use queue layout (16-bit element code followed by element\
  \ id).\n  - bit clear: writes two zero words.\nOutput stride is 8 bytes per slot (stride 0x80 kept in r4 but unused).\
  \ The loop is\na do-while (cmp/blt at the bottom), so it always runs at least once and will spin\nforever if `count`\
  \ is 0 (it isn't in practice; the comment notes the quirk).\nThe chip-slot table is the in-battle \"selectable\"\
  \ queue populated from the folder's\ncurrent chip-pack row (Custom Gauge / chip selection screen data).\n"
