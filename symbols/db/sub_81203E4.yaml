open_questions:
- The 0x20002 constant - why is that exact spacing (always +0x20002 regardless of slot)?
- r4 is incremented by 0x80 per iteration but never read; looks like dead code.
- The zero-fill size of 0x38 vs the per-iteration 8-byte stride suggests an upper bound of 7 slots is supported
  (0x38/8 = 7), though `count` could in principle be larger.
