name: owPlayer_disableWallCollision_809e254
address: '0x0809E254'
kind: function
status: confirmed
summary: Clears the overworld player object's wall-collision flag, letting the player walk through walls.
interface: void owPlayer_disableWallCollision_809e254(r10=toolkit) -> r0=FALSE(0), r3=player object ptr, nz flags
  from r0
details: 'Reads the toolkit at r10 (oToolkit_GameStatePtr), follows it to the GameState, then to the overworld player
  object (oGameState_OverworldPlayerObjectPtr), and stores FALSE (0) as a byte into oOWPlayerObject_wallCollision_0c.
  With the flag cleared, the overworld player movement code no longer tests walls, so the player can pass through
  wall tiles. Side effects are unusual for a "setter": r0 is left holding FALSE, r3 holds the player object pointer,
  and the NZ flags reflect r0, so callers could observe them. Only the player object is touched; NPCs and other
  overworld objects are unaffected.'
