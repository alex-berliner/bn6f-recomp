name: SetOWPlayerFacingDirection
address: '0x0809E2AE'
kind: function
status: confirmed
summary: Sets the overworld player character's facing direction (e.g. up/down/left/right) in the current game state.
interface: void SetOWPlayerFacingDirection(u8 direction /* r0, via r10=toolkit */); returns player object pointer
  in r3
details: 'Follows the toolkit pointer (r10) to the GameState, reads the GameState''s OverworldPlayerObjectPtr, and
  stores the low byte of r0 into the player object''s FacingDirection field (oOWPlayerObject_FacingDirection). Effectively
  turns MegaMan''s sprite/movement direction while walking around the overworld. As a side effect the player object
  pointer is left in r3, which callers may ignore. No other registers or flags are touched; the function is a trivial
  two-load/one-store tail.

  '
