name: battle_SetObjectHitModifier_8019F86
address: '0x08019F86'
kind: function
status: confirmed
summary: Stores a hit modifier value into a battle object's collision data and returns the collision data pointer.
interface: u32* battle_SetObjectHitModifier(u8 hitModifier /* r0 */, BattleObject* obj /* r5 */)
details: 'Trivial setter used during battle object setup/updates. Reads the object''s oBattleObject_CollisionDataPtr
  field (r5), writes the low byte of r0 into oCollisionData_HitModifierBase of that collision data struct, and hands
  back the collision data pointer in r1. The hit modifier base likely scales or classifies how the object''s attacks
  register on contact (e.g. damage/flinch class), with the final value probably being base + per-hit adjustments
  stored elsewhere in the collision data. No flags are meaningful; only r1 is a defined output.

  '
