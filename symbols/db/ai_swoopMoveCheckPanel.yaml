name: ai_swoopMoveCheckPanel
address: '0x0810FBD8'
kind: function
status: probable
summary: Moves the flying enemy one step along the X or Y velocity axis, then bails to a handler if the destination
  panel has the 0x800000 flag set.
interface: (r0 = axis selector, 0 = move along Y, nonzero = move along X; r5 = battle object) -> r0 = result of
  sub_810FACA (often 0); moves oBattleObject_X or oBattleObject_Y by the matching velocity component.
details: 'The r0 flag picks the axis: if 0, the object''s Y gains YVelocity, otherwise X gains XVelocity. The new
  (X,Y) plus the object''s Z are passed to convertXYToPanelXY_800E258 to get the panel under the prospective position.
  object_getPanelParameters then returns that panel''s flag word, and bit 0x800000 is tested; if set, sub_810FACA
  is called (likely a turn-around/retarget reaction, since it is only invoked on this collision) and its return
  becomes r0. Note object_getPanelParameters returns 0 for off-field coordinates, so the exit is skipped there and
  only the in-field 0x800000 flag (possibly a hole/void-panel marker) triggers the handler.'
