name: battle_fallingObjectLandSpawnRegion
address: '0x080CCCE0'
kind: function
status: probable
summary: 'Battle-object fall state handler: applies gravity until the object hits the ground (Z=0), then
  plays a landing sound and spawns a dimming collision region on its panel before advancing to the next
  action.'
interface: (r5 = battle object) -> r0 = nonzero if region spawned, else 0; object CurAction set to 4 on
  landing
details: Subtracts oBattleObject_ZVelocity from oBattleObject_Z each call; when the result is still >0
  it stores it and returns (still falling). Once Z would go below zero it clamps Z to 0, plays sound effect
  0xA2 only if oBattleObject_Param1 is 0, and calls object_spawnDimmingCollisionRegion with the object's
  PanelX/PanelY, layer 0, the current Z as height, constant argument dword 0x1905FF01, and the parent's
  DamageAndStaminaDamageCounterDisabler word. If the region spawns successfully it ORs 0x10 into the region's
  byte at r7 (some state/flag of the new object). Finally sets oBattleObject_CurAction to 4 to move to
  the next phase.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub r0, r0, r1 / str [oBattleObject_Z] + bgt ret: integrates Z velocity, i.e. falling motion
    (asm lines 2-6); mov r0,#0xa2; bl PlaySoundEffect gated on Param1==0: one-shot landing sound; ldr
    r4, =0x1905FF01 and r3 = current Z passed to object_spawnDimmingCollisionRegion: region spawned at
    landing height; tst r0,r0 / beq ...; orr r0,#0x10 stored to [r7]: flags set on the newly created region
    object; mov r0,#4; strb [oBattleObject_CurAction]: advances the object''s action state after landing'
