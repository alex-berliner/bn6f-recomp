name: battle_objectLingerThenDestroy
address: '0x080D142C'
kind: function
status: probable
summary: Battle-object update handler that clears the object's flag bit 1, counts down its Timer, and
  destroys the object when it hits zero
interface: (r0 = battle object ptr in r5 convention, no args) -> r0 = 0/destroy-state written; sets object
  state to CUR_STATE_DESTROY when Timer expires
details: Reads oObjectHeader_Flags from r5, clears bit 0x2, and stores it back. Then decrements the halfword
  oBattleObject_Timer; if the result is nonzero the call returns, otherwise it stores CUR_STATE_DESTROY
  into oBattleObject_CurStateActionPhaseAndPhaseInitialized, signaling the object scheduler to destroy
  the entity. r5 is the object pointer per the standard battle-object update calling convention. Effectively
  a fixed-delay self-destruct phase for an object.
