  CurAnim=0, CurAnimCopy=0xff, ZVelocity=0x80000, panel-to-pixel conversion, CurState=CUR_STATE_UPDATE,
  tail-calls sub_80CCAB8). However, the proposal''s claim that it ''plays sound effect 0x105 (6+0xFF)''
  is incorrect from the code: it computes r0 = 6 + 0xFF with add r0, #0xff without an explicit mov #0x105
  — but since r0 started as 6, the result is 0x105 only if overflow wraps, which on ARM with add r0,#0xff
  gives 0x105 correctly. Also ''initPanelSpawnedObject'' is reasonable but ''spawn'' as a name prefix
  is slightly awkward; ''initPanelSpawnedObject'' fits the init/ prefix rules.'
