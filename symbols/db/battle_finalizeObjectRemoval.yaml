- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_clearCollisionRegion / object_removePanelReserve / battle_dispatchDestroyEvents /
    clearEntryOfBattleStateBattleObjectList_800F656 — teardown of the object''s field presence; HP==0
    path: ldrh r0,[r5,#oBattleObject_HP]; tst; beq -> effect kind 2 + PlaySoundEffect(0x90) = death explosion;
    HP!=0 path spawns the same type-0 effect with kind 0x14 — a non-lethal removal effect (e.g. vanish/delete);
