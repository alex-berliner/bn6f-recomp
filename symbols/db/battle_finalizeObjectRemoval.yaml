name: battle_finalizeObjectRemoval
address: '0x080DB252'
kind: function
status: probable
summary: 'Final step of removing a battle object from the field: releases its panel and list entry, spawns
  its deletion/explosion effect, and switches it to the destroy state.'
interface: (r0 = battle object pointer, kept in r5) -> r0 = 0/void; sets object state to CUR_STATE_DESTROY
  and clears ObjectHeader.Flags bit 2
details: 'Takes the battle object in r5. It first clears the object''s collision region, releases its
  reserved panel using FuturePanelX/Y, dispatches destroy events (if battle flag 0x40), and removes the
  object from the battle-state object list. It then tests ObjectFlags2 against 0x300000: if any of those
  bits are set it calls sub_800F90E(0xE) instead of spawning effects. Otherwise sub_800F8CE''s result
  gates the effect (0 -> return with no state change, 1 -> just finish); other values spawn a type-0 effect
  at the object''s +0x34 position triple: kind 0x14 (z+0xC) when HP is nonzero, or kind 2 (z+0x10) plus
  sound effect 0x90 when HP is 0, i.e. the destruction explosion. Finally it clears Flags bit 2 and writes
  CUR_STATE_DESTROY to the object''s state word so it stops being processed.'
