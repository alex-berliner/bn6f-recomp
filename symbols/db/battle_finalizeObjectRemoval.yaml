open_questions:
- Meaning of ObjectFlags2 bits 0x300000 and what sub_800F90E(0xE) does in that branch
- What sub_800F8CE checks (likely sprite/visibility state) and why result 0 skips the state change entirely
- No known caller, so the entry conditions (who calls this and with which objects) are unconfirmed
- Exact identity of effect kinds 0x14 vs 2 and sound 0x90
