name: checkSubEntryHiddenFlag_8002E04
address: '0x08002E04'
kind: function
status: confirmed
summary: Selects one of up to 16 sub-entries of an object via the high nibble of byte +2 and tests that
  sub-entry's bit 3 (hidden/disabled-style attribute), returning its address and the masked flag.
interface: 'u32 checkSubEntryHiddenFlag(void) /* in: r5 = object ptr, lr = return addr; out: r3 = sub-entry
  ptr, r0 = (entry[+3] & 0x08), NZ flags from r0; clobbers r0-r3, C, V */'
details: 'Takes r5 as a pointer to some object/record structure. Reads the byte at r5+2, masks off the
  low nibble (lsr 4 / lsl 4) to get a 16-aligned offset, and adds it to r5: so byte+2''s high nibble is
  an index into up to 16 sub-entries that are 16 bytes apart and 16-byte aligned relative to the object
  base (the low nibble of byte+2 is ignored/used for something else). From the selected sub-entry it reads
  the byte at +3, ANDs it with 0x08, and returns that in r0 with the address of the sub-entry in r3. Because
  the original uses a flagged AND (equivalent of ANDS), the NZ flags on return reflect the masked bit,
  so callers can branch directly on the result without re-testing r0. Very short leaf routine ending in
  mov pc, lr (no stack use, preserves nothing it clobbers beyond r0-r1/r3). The bit-3 attribute likely
  marks a sub-entry as hidden, disabled, or "flag set" for whatever table owns these objects; the exact
  owner of the structure is not yet identified.

  '
