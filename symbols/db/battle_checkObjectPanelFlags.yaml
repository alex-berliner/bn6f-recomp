name: battle_checkObjectPanelFlags
address: '0x08102EE2'
kind: function
status: probable
summary: Condition helper that checks whether the battle panel tied to an object's sub-id (field r5+0x16)
  has the required panel flag state, returning nonzero only if the check passes.
interface: (no register args; reads caller's r5 = object struct, field +0x16 = sub-id) -> r0 = 0 if panel
  state check fails, nonzero (sub-id*5+1) if it passes; flags set by the tst before the final pop
details: Reads a byte id from the object at r5+0x16 and uses it to index byte_8102F0C with an 8-byte stride,
  yielding a pair of 32-bit mask words per id (0x10/0x0F8800A0 and 0x30/0x0F8800A0 for the two entries
  present). It then calls object_checkPanelParameters with r0 = id*5+1, r1 = 2, and the two table words
  in r2/r3, matching that callee's documented 'required mask set / forbidden mask set' panel test. If
  the callee returns 0, this function forces r0 = 0 and returns; otherwise it returns with r0 still holding
  id*5+1, which is nonzero and thus truthy. The id*5+1 argument is an odd encoding — possibly a packed
  panel coordinate or grid index rather than a plain id. The neighboring pointer table (off_8102F1C–off_8102F2C
  pointing at byte_8102C90/CE8/E4C) suggests this is one of a family of small per-id helper routines sharing
  a dispatch structure. No callers are known, so the owning object type and the exact meaning of the id
  byte remain unconfirmed.
