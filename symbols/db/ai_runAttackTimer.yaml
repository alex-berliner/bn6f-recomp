name: ai_runAttackTimer
address: '0x080FF220'
kind: function
status: probable
summary: 'AI attack-state step: on first entry it latches the attack''s element and attack animation and
  arms a duration timer; while active it counts the timer down and, on expiry, restores the idle animation
  and leaves the attack state.'
interface: (r5 = battle object, r7 = AI attack vars block) -> r0 = clobbered; updates oAIAttackVars_AttackElement,
  StepTimer, and oBattleObject_CurAnim
details: If oAIAttackVars_AttackElement is still 0 (not yet started), the function sets it to 4, switches
  the object's current animation to 10 (the attack anim), and copies oAIAttackVars_AttackDuration into
  oAIAttackVars_StepTimer to start the countdown. On subsequent calls it decrements StepTimer; once it
  reaches 0 it sets oBattleObject_CurAnim back to 0 (idle/default anim) and calls object_exitAttackState
  to end the attack. Element value 4 is presumably a specific attack type this handler represents; the
  same struct fields are shared by other AI attack routines.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst r0,r0; bne loc_80FF236 — element==0 means the
    attack hasn''t started yet; strb #4,[r7,#oAIAttackVars_AttackElement] and strb #0xa,[r5,#oBattleObject_CurAnim]
    — latch element and switch to attack animation 10; ldrh/strh between oAIAttackVars_AttackDuration
    and oAIAttackVars_StepTimer — arm the countdown from the configured attack duration; decrement StepTimer,
    bgt exit — wait until the attack duration elapses; mov r0,#0; strb [r5,#oBattleObject_CurAnim]; bl
    object_exitAttackState — restore idle anim and leave attack state on expiry'
