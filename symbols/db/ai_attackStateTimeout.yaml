name: ai_attackStateTimeout
address: '0x080153B0'
kind: function
status: probable
summary: Runs a per-frame countdown on a battle object; once the timer expires, clears AI-state flags
  and exits the attack state.
interface: (r7 = battle object with AI attack vars) -> r0 = scratch; sets/clears object AI flag bits and
  battle flag 0x20
details: If oAIAttackVars_AttackElement is 0, it initializes it to 4 and loads the delay counter (oAIAttackVars_StepTimer)
  with 0x14 (20 frames). Every call it decrements StepTimer and returns while the result is >= 0. When
  the counter goes negative, it clears bit 0x80 and 0x80000 in AI data Unk_0x48, clears battle flag 0x20,
  clears mask 0x80008600 in AI data Unk_0x44, and calls object_exitAttackState to leave the attack state.
  This is effectively the wind-down/cooldown frame of an AI attack action, with element 4 acting as a
  default element when none was chosen.
