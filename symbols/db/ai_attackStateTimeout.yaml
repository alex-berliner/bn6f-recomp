    10-13); on expiry: ClearAIDataUnk0x48Flag(0x80) then (0x80000), battle_clearFlags(0x20) (lines 14-19);
    ClearAIData_Unk_44_Flag(0x80008600) then object_exitAttackState ends the attack (lines 20-24)'
