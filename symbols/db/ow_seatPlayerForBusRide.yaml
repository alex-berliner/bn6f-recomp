name: ow_seatPlayerForBusRide
address: '0x0808F990'
kind: function
status: probable
summary: 'Part of the bus-boarding sequence: locks player input and swaps the overworld player''s sprite
  to the seated/riding pose used while the bus moves.'
interface: () -> r0 = 0; no meaningful flags
details: Locks the overworld player's InteractionLocked flag, calls sub_809E304, and clears the player's
  eStruct2000aa0 Sprite_04 byte at 0x2000AA4. It then reads the game state's overworld player object pointer
  and loads sprite ID 0x37 (with parameters 0x80 and 0x18) onto it, sets the sprite's animation index
  to the byte at player+0x14 (the player's current animation, so the seated pose matches facing), loads
  the animation data, and disables the shadow via sprite_noShadow before a sprite_update. Always returns
  0.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl owPlayer_setInteractionLocked_809e230 then owPlayer_zeroS2000AA0Param0x4_809e312 at the
    top: player is put into a non-interactive ride state; ldr r5,[r5,#oGameState_OverworldPlayerObjectPtr];
    mov r0,#0x80; mov r1,#0x18; mov r2,#0x37; bl sprite_load: sprite 0x37 loaded for the ride; ldrb r0,[r5,#0x14];
    bl sprite_setAnimation: animation index taken from the player object, keeping its facing; bl sprite_noShadow:
    no ground shadow, consistent with riding inside a bus sprite; Caller busStation_runBusMoveSequence_controller_808F900
    drives MegaMan into the bus and the ride; this is the boarding/ride-setup step'
