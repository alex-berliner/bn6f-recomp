summary: Computes a BattleChip damage value by looking up the chip's row in a damage table and scaling
  by a row-level multiplier.
interface: (r0 = row type 0..6, r1 = chip index, r2 = slot/level index 0..3) -> r0 = final damage (raw
  value + 0x800) ; no side effects
details: "- Trims r0 to 8 bits, r1 to 8 bits (kept in r5), r2 to 8 bits (kept in r12).\n  - When r0 ==\
  \ 4 (Mega row), the function takes a separate branch: r1 is clamped to [0, 0x14] (lower half) or shifted\
  \ into [0, 0x3B] (upper half, with a 0x3B cap), then a single byte is read from byte_81C0640 + r5 and\
  \ returned directly through the final 0x800 add-back.\n  - For all other row types, r1 is mapped into\
  \ [0, 0x23] -> 0 (with row-level multiplier r12 cleared) or shifted into [0, 0x82] (capped), and a second\
  \ cap path sets r12 = 0xFF (the row-level multiplier saturates to maximum).\n  - The two relevant bytes\
  \ from byte_81C05A4[r5] and byte_81C05A4[r5+1] are each split into a low nibble (paired through byte_81C0628\
  \ as s16) and a high nibble (used as a signed shift). The function returns the difference (low_of(r5+1)\
  \ shifted by high_of(r5+1)) - (low_of(r5) shifted by high_of(r5)) — i.e. the \"delta\" of a damage curve\
  \ sampled at consecutive indices, then multiplied by the row-level multiplier r12 (8.8 fixed-point via\
  \ `mul r7,r0` then `asr r0,r0,#8`), plus a base offset, plus 0x800.\n  - The final `add r0, #0x800`\
  \ (`lsl r1,r1,#4` then add) appears to be a damage-unit round-and-offset constant; returned values from\
  \ the captures (~0x483..0x758) match the in-game damage magnitudes seen in the row 1/2/3 chip curves.\n\
  \  - Caller chain `lr=0814e725` from snap_story2* indicates the damage calculation sits inside the battle\
  \ damage handler called when a BattleChip is being resolved for the story2 battle setup.\n"
