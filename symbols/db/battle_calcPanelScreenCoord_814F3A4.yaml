  detail: '- `cmp r0,#4` at 0x0814f3b8 selects the Mega row shortcut; the alternate path uses different
    clamp constants and reads a different table at byte_81C0640. - `ldr r0,off_814F3D8 ; =byte_81C0640`
    (Mega row) and `ldr r3,off_814F444 ; =byte_81C05A4` (standard rows) reference ROM data tables; the
    corresponding s16 lookup table is `byte_81C0628` via `ldrsh r1,[r0,r7]` at 0x0814f414. - Byte splitting
    (`and r0,r2 ; lsl r0,r0,#1`) and arithmetic shift (`asr r0,r6`) of the upper nibble implement the
    standard "nibble-lookup damage curve" pattern. - `mul r7,r0` then `asr r0,r0,#8` (0x0814f430) is a
    8.8 fixed-point multiply with the row multiplier (r12/r7 used as multiplier). - Captured entry values:
    r0 ∈ {1, 2}, r1 from 0x32..0x4f (chip ID in the standard row), r2 = 0 (slot) — all consistent with
    a chip-damage calculation per row/slot. - Returned r0 values 0x0483, 0x0641, 0x0720, 0x0758 are 11-bit-ish
    values typical of in-game damage fields (note `DAMAGE_NOTHING = 0x800` is the same 0x800 offset added
