open_questions:
- The exact row mapping (r0 = 1 -> ?, r0 = 2 -> ?). The captures show row=1 used in 0x32..0x4c range and
  row=2 only at 0x4f; without more callers I can't pin which game rows those correspond to.
- 'The semantic of the second cap branch (the one that sets r12=0xFF): is it an "overflow/max" indicator,
  or a level boost? Inspecting the damage table byte_81C05A4 contents and the row 0/5/6 calls would confirm.'
- Why the function tail pops only r4-r7 and uses `pop {r1}; bx r1` to return — it's a Thumb tail-call
  idiom; the calling convention shown in the contract matches standard callee-saved r4/r5/r7/r12.
