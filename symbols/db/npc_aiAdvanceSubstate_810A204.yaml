name: npc_aiAdvanceSubstate_810A204
address: '0x0810A204'
kind: function
status: confirmed
summary: Ticks the AI actor's sub-state counter, and once it has run 40 ticks fires script 0x0C and resets
  the counter for the next phase.
interface: void npc_aiAdvanceSubstate(AIState* r6) // r6 in only; clobbers r0 and flags
details: 'r6 points to an AI state block for an actor (NPC/enemy). The function increments the

  byte at oAIState_SubState and stores it back. While the counter is below 0x28 (40), it

  simply returns — effectively a 40-tick (~2/3 s) wait step. Once the count reaches 0x28,

  it writes 0x0C into oAIState_ScriptId (queuing/switching to AI script 12) and clears

  oAIState_SubState as a halfword (16-bit store zeroes the counter field), so the next

  phase can count from zero again. Tail-returns directly to the caller with pop {pc}.

  Note the store-size quirk: the increment is byte-sized but the reset is a halfword store

  on the same offset, zeroing SubState and the adjacent byte (likely a second counter byte

  or padding).

  '
