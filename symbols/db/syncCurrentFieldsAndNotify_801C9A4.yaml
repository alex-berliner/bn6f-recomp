name: syncCurrentFieldsAndNotify_801C9A4
address: '0x0801C9A4'
kind: function
status: confirmed
summary: Compares two target byte fields of a struct against their "current" copies and, whenever they differ, updates
  the copy and raises a notification event (6 for the first field, 0x1A for the second) via sub_801C9C8.
interface: void sub_801C9A4(struct* r5); // r4, r6, r7, r10 also live on entry (passed through to sub_801C9C8);
  returns nothing meaningful in r0-r3; flags and r0/r1 reflect the final compare/callee call
details: 'Takes a struct pointer in R5 with paired byte fields: target at +7 / current at +8,

  and target at +9 / current at +0xA. If [R5+8] != [R5+7], it stores the target into

  the current field and calls sub_801C9C8 with R0=6 (and R1 = the new value). Then, if

  [R5+0xA] != [R5+9], it stores the target into the current field and calls

  sub_801C9C8 with R0=0x1A (R1 = the new value). Each field is therefore only pushed

  when it actually changed, making this an edge-triggered "apply target state and emit

  change event" helper. The event IDs 6 and 0x1A are dispatched by sub_801C9C8; the

  exact meaning of the struct and the two events is not visible from this function

  alone. Only R4-R7 are preserved; R5 must hold the struct pointer on entry.

  '
