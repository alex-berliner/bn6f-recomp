name: ai_stepDelayedAttackStrike
address: '0x080ED0AC'
kind: function
status: probable
summary: 'Per-frame step of an enemy AI attack: first call charges up (anim + spawned attack object),
  and after 10 frames deals damage at the target panel with a sound effect.'
interface: (r5 = battle object, r7 = oAIAttackVars state) -> void; no return value
details: State machine driven by oAIAttackVars_StepTimer. On entry with AttackElement == 0 (first/charge
  phase) it adds AttackBoost to Damage, plays anim 0xA on the object, resets its counter timer to default,
  spawns a type-1 subtype-5 temp attack object linked via AIDataPtr+0x68, sets ObjectFlags1 bit 22, zeroes
  StepTimer and sets AttackElement = 4. Every subsequent call increments StepTimer; once it reaches 10,
  it calls sub_80C67D8 with the object's PanelX/PanelY, InitFlag, 0, AttackBoost2 and Damage — i.e. applies
  the attack's damage at the panel position — then increments byte 0x10 of the spawned temp attack object,
  plays sound 0x180, and stores HitElement = 4. AttackElement doubles as a phase/state marker (0 = not
  yet started, 4 = charging/waiting).
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'AttackElement==0 guard wraps the one-time setup: boost added to Damage, anim 0xA, counter reset,
    AttackElement set to 4 (asm at 0x80ED0AC-0x80ED0E4); StepTimer incremented every call and only past
    10 does the strike run (ldrh/add/strh, cmp #0xa, blt locret); Strike calls sub_80C67D8(PanelX, PanelY,
    InitFlag, 0, AttackBoost2, Damage) — panel-targeted damage with the accumulated Damage; Callee spawn_t1_0x5_tempAttackObject_80B8E30
    creates the linked temp attack object stored at AIDataPtr+0x68; PlaySoundEffect(0x180) fires exactly
    when the damage step executes'
