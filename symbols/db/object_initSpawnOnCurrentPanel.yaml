name: object_initSpawnOnCurrentPanel
address: '0x080D387C'
kind: function
status: probable
summary: 'State-entry for an object materializing on its current panel: sets up its sprite, hitbox, appear
  sound, and hands control to the update state, freeing the object if the panel is invalid.'
interface: (r5 = battle object) -> r0 = destroyed; spawns sprite 0x2E, collision 4x5, sound 0xB8, sets
  CurState=CUR_STATE_UPDATE
details: Reads the object from r5. If object_isCurrentPanelValid fails, calls object_freeMemory and returns.
  Otherwise ORs flag bits 0x3 into oObjectHeader_Flags, loads sprite 0x2E (sprite_load/sprite_noShadow),
  resets CurAnim/CurAnimCopy to 0 and loads animation data, applies object_getFlip via sprite_setFlip,
  and positions via object_setCoordinatesFromPanels with Z=0. Shifts oBattleObject_X forward by 0x140000
  * object_getFrontDirection(). Sets palette 0, allocates collision data (object_setupCollisionData 4x5
  with r3=1), sets hit effect 0xFF, copies oBattleObject_Param2 to oBattleObject_Timer2, sets collision
  region 2, presents the collision data, plays sound 0xB8, and stores CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  before calling sub_80D390A.
