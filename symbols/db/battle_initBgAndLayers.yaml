name: battle_initBgAndLayers
address: '0x08130464'
kind: function
status: probable
summary: Initializes BG tile block 1 with a 30x20 tilemap from unk_201F320, resets the battle-overlay
  eStruct record array, and sets per-layer/eStruct scroll/fade values (caller struct's halfword at offset
  0x2a and 0x80) via sub_8130290/sub_81302B0/sub_81302F4 and a final sub_81304A4.
interface: () -> void
details: Takes no arguments. It first zero-fills the toolkit's 0x2000-byte BG tile buffer and re-runs
  the battle-overlay eStruct record-array init, then copies a 0x1E x 0x14 tilemap (exactly one full 240x160
  screen) from unk_201F320 into BG tile-block 1 via CopyBackgroundTiles. It then calls local helpers sub_8130290
  and sub_81302F4 twice — first with the halfword at [r5,#0x2a] of a caller-provided struct and 0, then
  with 0x80 and 1 — which look like per-layer scroll or fade/opacity settings, before a final sub_81304A4.
  The combination of a full-screen tilemap copy plus the scene-record reset suggests re-establishing the
  battle backdrop and overlay scene state, e.g. on battle start or return-from-battle.
