  date: '2026-10-18'
  detail: 'strb #4, [r7,#oAIAttackVars_AttackElement] only when AttackElement==0 — one-shot setup guarded
    by tst/bne; strb FuturePanelX/Y -> PanelX/Y then object_removePanelReserve + object_setCoordinatesFromPanels
    + object_updateCollisionPanels — commits the panel move; object_setFlag1 with bit (1<<OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT)
    marks the object as mid-move; strh #0xa, [r7,#oAIAttackVars_StepTimer] then loop decrementing it,
    on expiry strh #8, [r7,#oAIAttackVars_HitElement] — 10-frame telegraph before the hit; operates entirely
    on oAIAttackVars/oBattleObject fields of r7/r5, matching an AI attack state step'
