name: ai_attackPanelLockInStep
address: '0x080FB2A4'
kind: function
status: probable
summary: 'AI attack step: on first call commits the reserved panel to the object''s current panel, releases
  the reserve, refreshes coordinates/collision, raises the moving flag, and arms a 10-frame timer; when
  it elapses writes 8 to HitElement to trigger the strike.'
interface: (r5 = battle object, r7 = AI attack vars) -> void; on entry with AttackElement==0 commits the
  pending panel move and sets up, then counts down StepTimer until HitElement is set to 8.
details: 'On the first invocation (AttackElement == 0) it tags the attack as element 4 (wood), switches
  the object to animation 3, copies FuturePanelX/Y into PanelX/Y, releases the reserved panel, recomputes
  pixel coordinates and collision panels from the new grid position, clears flag 0x40, and sets the ObjectFlags1
  ''currently moving'' bit, then starts a 10-frame StepTimer. On later invocations it just decrements
  StepTimer; when it reaches zero it writes 8 into HitElement, which downstream attack logic presumably
  reads to apply the attack. This is a classic AI attack state machine step: move onto the target tile,
  telegraph, then fire. Element/hit values 4 and 8 suggest a specific enemy attack rather than a generic
  helper.'
evidence:
