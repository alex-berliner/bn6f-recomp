name: resetPaletteScratch_802F2C8
address: '0x0802F2C8'
kind: function
status: confirmed
summary: Clears the 0x80-byte palette scratch buffer at byte_2006530 (fills with 0x80) and zeros dword_2001140,
  used to reset palette animation state.
interface: void resetPaletteScratch_802F2C8(void)
details: 'Zeros out two pieces of palette-animation bookkeeping. Calls ByteFill on

  byte_2006530 with byteCount=0x80 and fill byte=0x80, then stores 0 to

  dword_2001140. The trailing data blobs (byte_802F2E4 through off_802F4E0)

  are gfx_anim palette transforms, copy/load scripts, and anim streams that

  sit adjacent to the function and are presumably the targets of the

  scratch buffer it resets, but are not executed by this function itself.

  '
