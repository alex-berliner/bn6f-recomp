name: sub_8133EC0
address: '0x08133EC0'
kind: function
status: confirmed
summary: 'Initializes a screen''s runtime data: resolves a relocation table for dynamic asset pointers, decompresses
  and copies static graphics/sprite data to VRAM and work RAM, loads a compressed text-script pointer table, and
  blits two background tile maps into tile block 1.'
interface: 'void screen_initData_8133EC0(void);

  /* Reads: r10 (caller convention, unused in body). Returns with r4-r7 preserved (push/pop). */

  '
details: 'Phase 1 – Relocation table build: iterates 4 records of 16 bytes from off_8133F70 (key, size, dst, len).
  Each key is resolved via getKeyedTableEntry_811FB84; the resolved pointer plus the two raw destination/length
  words are written sequentially into unk_20096E0, terminated with 0.

  Phase 2 – Decompression: decompAndCopyData is called twice: (a) on the relocation table just built (4 entries
  referencing comp_86C9108, comp_86C9B54, comp_86C9AA4, byte_872CF94 → palette_3001960, unk_3001AC0, unk_3001A80,
  unk_3001AE0); (b) on a static 19-entry table at off_8133FB8 writing tile/sprite data to VRAM (0x6012800, 0x6012C00,
  0x6008020, 0x6014800, 0x6014980, 0x60149C0, 0x6000020) and work-RAM (unk_203526C, unk_2034B6C, unk_3001A20, unk_2024A20,
  unk_2026A20, unk_203486C, etc.).

  Phase 3 – Text-script table: sub_8123300 loads a 13-entry pointer table (off_8133F30, mostly CompText86CF1A8 with
  two CompText86CEE84) into eTextScript2028A20 via decompression buffer eDecompBuffer2013A00.

  Phase 4 – Background tile blit: two CopyBackgroundTiles calls into tile block 1: (0,0) 30×20 tiles from unk_201CA20;
  (0,2) 60×17 tiles from unk_2020A20. Tile IDs are u16 arrays at those addresses; the "i=2" row offset places the
  wider map below the first.

  '
