name: ai_setupMeleeAttack
address: '0x08113EAC'
kind: function
status: probable
summary: 'AI routine that sets up a melee/step attack: reserves the panel ahead, loads damage/timing by
  AI version, and blocks sliding during the attack.'
interface: (r4 = AIData ptr with Version byte at +16, r5 = BattleObject, r6 = AIState, r7 = AIAttackVars)
  -> r0 = 0; AIState_ScriptId cleared to 0; failure path clears BattleObject_ExtraVars
details: If object_canMove fails, it writes 0 to BattleObject_ExtraVars and exits. Otherwise it copies
  the object's PanelX/PanelY into ExtraVars offset 0x64/0x65 (saving the origin panel), reserves that
  panel via object_reservePanel, then indexes per-version tables byte_8113DB8/8113D90/8113D98/8113DA0
  by oAIData_Version_16 to fill AIAttackVars AttackDuration, Damage, ExtraDamage and StepTimer. It sets
  AttackBoost2 = 1, ORs OBJECT_FLAGS_CANNOT_SLIDE into the object's flags, sets attack via object_setAttack0(0xA),
  clears AttackElement (normal element), and resets oAIState_ScriptId to 0 to end the AI script step.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_canMove; beq loc_8113EF4 gates the whole attack on the object being free to act; ldrb
    r0,[r5,#PanelX]/PanelY stored to [r5,#0x64/0x65] then bl object_reservePanel — claims its own panel
    before acting; four ldrb [r0,r1] tables indexed by oAIData_Version_16 fill AttackDuration/Damage/ExtraDamage/StepTimer;
    mov r0,#OBJECT_FLAGS_CANNOT_SLIDE; bl object_setFlag1 and mov r0,#0xa; bl object_setAttack0 configure
    the attack; final mov r0,#0; strb r0,[r6,#oAIState_ScriptId] ends the AI script state, as in sibling
    AI handlers
