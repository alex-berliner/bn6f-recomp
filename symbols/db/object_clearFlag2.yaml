name: object_clearFlag2
address: '0x0801A176'
kind: function
status: confirmed
summary: Clears caller-specified bits in a battle object's ObjectFlags2 collision flag field.
interface: void object_clearObjectFlags2(u32 flagBits /* r0 */, BattleObject* obj /* r5 */); returns r1 = collision
  data ptr, r2 = updated flags, NZ set from updated flags
details: 'Loads the object''s collision data pointer from obj->CollisionDataPtr (oBattleObject_CollisionDataPtr),
  reads ObjectFlags2 (oCollisionData_ObjectFlags2) from the collision data struct, clears the bits set in r0 with
  BIC, and stores the result back. Acts as the "clear" counterpart to the flag-set helper on the same field. Unusual
  for a leaf helper: it deliberately leaves r1 (collision pointer), r2 (new flag value) and the NZ flags (from the
  new value) live for the caller, and callers in the register contract are tracked as reading those, so inlining
  it would break callers that rely on the flags result. r5 is the battle object, not the collision data itself;
  the collision pointer is dereferenced here.'
