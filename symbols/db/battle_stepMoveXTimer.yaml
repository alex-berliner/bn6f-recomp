- method: assembly-reading
  date: '2026-10-18'
  detail: 'adds oBattleObject_XVelocity into oBattleObject_X then calls object_setPanelsFromCoordinates
    and object_updateCollisionPanels (first instructions); decrements oBattleObject_Timer and reloads
    it with 0x1E on expiry (ldrh/sub #1 ... mov r0,#0x1e); on expiry calls object_clearCollisionRegion,
    matching a hidden/removed state; sets oBattleObject_CurAction to 4 and zeroes CurPhaseAndPhaseInitialized
    to enter a new action phase'
