name: battle_stepMoveXTimer
address: '0x080D7578'
kind: function
status: probable
summary: Per-frame step that moves a battle object along X by its velocity, then after a countdown switches
  it to CurAction 4 and removes it from its collision region.
interface: (r5 = battle object) -> void; no return value
details: Takes the object in r5 (battle object struct, uses oBattleObject_* offsets). Each call it adds
  XVelocity to X, then calls object_setPanelsFromCoordinates and object_updateCollisionPanels so the object's
  panel position and collision record track the new coordinates. It decrements the object's Timer; while
  nonzero it just returns. When the timer reaches zero it reloads it with 30 (0x1E), calls object_clearCollisionRegion
  (dropping the object from its collision region, e.g. going untouchable/hidden), sets CurAction to 4,
  and clears CurPhaseAndPhaseInitialized to restart the new action's state machine at phase 0. The 30-frame
  reload implies a repeating hidden/retreat cycle.
