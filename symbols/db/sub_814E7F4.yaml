name: sub_814E7F4
address: '0x0814E7F4'
kind: function
status: confirmed
summary: Interpolates between two adjacent decoded audio samples, blends by an 8-bit fraction, and scales by the
  caller struct's amplitude field.
interface: u32 audio_interpSample_814E7F4(SampleStruct *struct_ptr /*r0*/, u8 sample_index /*r1*/, u8 blend_factor
  /*r2*/) /*->r0 = scaled value, r12 = struct_ptr*/
details: "The function receives a pointer to a sample-playback struct (r0, kept in r12),\na sample-table index byte\
  \ (r1), and an 8-bit blend fraction (r2, used as the\nhigh byte of the multiplier). It performs:\n1. Clamps the\
  \ index to 0xB2; if clamped, forces the blend byte to 0xFF so the\n   last valid entry is fully selected.\n2.\
  \ Reads two consecutive bytes from the packed-index table at byte_81C04A8\n   (offset by the clamped index and\
  \ index+1).\n3. Decodes each byte via the 16-entry u32 value table at byte_81C055C:\n   low nibble selects the\
  \ table slot, high nibble provides a right-shift,\n   giving a base sample amplitude.\n4. Computes the linear\
  \ interpolation: base + (next - base) * blend >> 32,\n   using umul3232H32 for the 32x32 high-product.\n5. Multiplies\
  \ the interpolated result by the struct's u32 amplitude field\n   at offset +4, again via umul3232H32, returning\
  \ the final scaled sample.\nQuirk: r6 and r7 are used as internal scratch for the clamped index and\nshifted blend\
  \ word respectively, but are preserved across the call.\nThe two global tables (byte_81C04A8, byte_81C055C) form\
  \ a run-length /\nquantisation scheme that compresses the 179-entry (0x00..0xB2) sample\nwaveform.\n"
