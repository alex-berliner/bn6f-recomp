name: initSaveStateBlock_8048F9C
address: '0x08048F9C'
kind: function
status: confirmed
summary: Initializes the E-Save (extra save) state block eS200A290 by zero-filling it, then writes a small
  header (save_arg, 8, 0xA) and sets *toolkit->main_jumptable_index_ptr to 0x30.
interface: void sub_8048F9C(u16 save_arg /* r0 */, struct Toolkit *toolkit /* r10 */);
details: "- Resolves a state block pointer via off_8049008 (= eS200A290, 0x200A290 in EWRAM).\n- Zero-fills\
  \ 0x1B0 bytes of that block via ZeroFillByWord.\n- Loads *toolkit->main_jumptable_index_ptr (r10 + oToolkit_MainJumptableIndexPtr)\
  \ into r1,\n  then writes byte 0x30 to it (strb).\n- Writes three halfwords into the state block as\
  \ a header:\n    +0x22: save_arg (caller-supplied save selector)\n    +0x24: 0x0008\n    +0x26: 0x000A\
  \   (final value also left in r0, setting NZ flags)\n- Saves/restores r4-r7 plus lr; r4=save_arg, r5=state\
  \ pointer are preserved across the call.\n- Leaves r0=0xA, r1=main_jumptable_index_ptr on exit; r4-r7\
  \ preserved.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form\
  \ C allowed; tools/abi/retype_queue.tsv)."
