name: battleSpawnAIMoveAttackObject
address: '0x08101204'
kind: function
status: probable
summary: Spawns the battle object implementing an AI-selected panel attack at the chosen coordinates.
interface: (r0 = target panel X, r1 = target panel Y) -> r0 = spawned object pointer; flags clobbered
details: Reads the attack object's AI state from the global object pointer in r7. Builds an attack parameter
  from InitFlag, AiDifficultyTier, and TimerOrCycles, then loads Damage and calls the battle-object spawn
  thunk with panel coordinates. The thunk customizes the spawned type-0x8F object with its panel position,
  element, source link, and flags; this function itself does not explicitly propagate that pointer.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: Both callers load TargetPanelX and TargetPanelY into r0/r1 immediately before the call (0x08100D52-0x08100D5A
    and 0x08100D8E-0x08100D98).; The routine calls spawnObjectWithPanelElement (0x08101218), documented
    to spawn battle object type 0x8F and customize its panel placement and source data.; AI attack fields
    are gathered as arguments, including Damage and packed InitFlag/AiDifficultyTier/TimerOrCycles (0x0810120C-0x08101216).;
    ai_stepTargetedPanelAttack invokes it once per timed cycle for five cycles, matching repeated execution
    of a panel attack.
