name: object_clearCollisionRegion
address: '0x0801A074'
kind: function
status: confirmed
summary: Clears a battle object's collision region byte, effectively removing it from its current collision region.
interface: void object_clearCollisionRegion(struct BattleObject* object /* r5 */) /* returns r0 = object->collisionDataPtr,
  r1 = 0, flags NZ from r1 */
details: 'Loads the object''s collision data pointer from r5 + oBattleObject_CollisionDataPtr,

  then stores 0 into the byte at oCollisionData_Region (offset 1 of the collision data

  struct). The region byte evidently marks which region/zone the object occupies for

  collision checks; zeroing it removes that association. Tail-call style return via mov pc, lr.

  Side effects useful to callers: r0 is left holding the collision data pointer and r1 is

  left 0 (so the NZ flags reflect "not zero"), matching the register contract.

  '
