name: petCommSaveInit_811F11C
address: '0x0811F11C'
kind: function
status: confirmed
summary: Initializes the PET (Personal Terminal) communication save slots, writing default halfword values
  to each of 8 pointer-table slots, overriding the active state slot (unless state byte == 8), and applying
  the EVENT_PET_COMM_SAVE_DISABLED patch when that flag is set.
interface: void sub_811F11C(u32 state_addr /* r5 */); clobbers r0,r1,r2,r3,lr,NZcv; r4 preserved
details: 'Walks the 8-entry pointer table at A_byte_811F158 (each entry is a pointer to a u16),

  writing 0x537F to every slot. Then reads a state byte from state_addr+4 (r5+4);

  unless it equals 8, overwrites that state''s slot with 0x7BFE. If

  EVENT_PET_COMM_SAVE_DISABLED is set (TestEventFlagFromImmediate for flag 0x17),

  overwrites slots at offsets 0x18 and 0x1C (word_3001B56, word_3001B58)

  with 0x5A7A. The pointer table resolves to words in the 0x0300XXXX region

  (0x03001B4A..0x03001B56 etc.), consistent with EWRAM comm/save state slots.

  '
