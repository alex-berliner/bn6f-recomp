name: EnterMap
address: '0x08005148'
kind: function
status: confirmed
summary: map-entry gamestate routine that prepares the overworld (resets graphics/object/cutscene/scenario state,
  clears mode event flags, loads the destination map's graphics/tables, starts the fade-in, and hands control to
  the on-map update subsystem); returns immediately if a screen fade is still active.
interface: "void enterMap_8005148(void) /* r10 = toolkit */\n  // inputs : r10 = toolkit, r4-r9/r11/r12/lr from\
  \ caller\n  // outputs: r0 = 4, r1 = 0; flags from movs r0,#4 (N clear, Z clear)\n  //         on the fade-active\
  \ early return, preserves IsScreenFadeActive's\n  //         r0/r1/Z (Z set, N clear)\n  // clobbers: r0, r1,\
  \ r2, r3, r4, r5, r6, r7, lr; flags N,Z,C,V\n"
details: 'Returns immediately when IsScreenFadeActive reports a fade in progress, leaving its callee''s r0/r1 and
  Z flag untouched.; Map-entry setup order (all unconditional on the non-fade path): resetAllGraphicsState_8005F40,
  runSetupStepAndClearWorkArea_8005F6C, sub_80027C4.; InitializeOverworldMapObjectStructs, copy_8002668, zeroFill_80024A2.;
  scenario_initEffectState_8003962, zeroFill_8003AB2.; eventflags_ClearTwoHalfwordsAt2DE_802F0D8, eventFlags_ClearRangeAt2C8_802F0F4.;
  cutscene_forceEndCurrent_8036EFE, clearCutsceneScriptPosIfMagicValue0x1_8036F24, sub_809F90C.; Clears the named
  mode/event flags: EVENT_"1731", EVENT_1719, EVENT_NPC_OBJECTS_DISABLED (label `EVENT_NPC_OBJECTS_DISABLED` on
  flag 0x1701), EVENT_NON_NPC_ANIMATION_LOCKED (0x1702), EVENT_1700, EVENT_PET_DISABLED (0x1707), EVENT_1739, EVENT_1732,
  EVENT_1BB (0x01BB), EVENT_IN_SLIPRUN_STATE (0x173D), EVENT_173E, EVENT_173F.; sub_803F6B0(0); sub_803F500(); RandomizeExtraToolkitPointers;
  reloadCurNaviStatBoosts_813c3ac only if NOT EVENT_1741.; Reads r10->oToolkit_GameStatePtr into r5 to obtain the
  game state; then sub_8000FAC, sub_80355EC, sub_8001172(0).; Zeroes four interaction/coordination leftovers on
  the game state: oGameState_Unk_15 (byte), oGameState_CoordInteractionValue (byte), field at offset 3 ("oGameState_Unk_03"),
  oGameState_Unk_68 (word).; triggerSomeUpdateForInternetOrRealWorld_8033948, SetRenderInfoLCDControl(0x1740).;
  Loads destination map resources three ways from r5->oGameState_MapGroup / oGameState_MapNumber (re-read before
  each call): LoadGFXAnimsForMapGroup, map_lookupMapIdByGroupAndNumber_8001708, map_8034B4C; then EnterMap_RunMapGroupAsmFunction_8030A00
  using only the map group.; Starts fade-in from the saved parameters in oGameState_EnterMapFadeParam1/2, then resets
  them to constants 8 and 0x10.; Clears byte at *(oToolkit_Warp2011bb0_Ptr + oWarp2011bb0_Unk_10) and sets oGameState_SubsystemIndex
  to 4 to dispatch the on-map update subsystem `gamestate_OnMapUpdate_8005268` (via cbGameState_80050EC).'
