name: object_spawnCollisionRegionAtPanel
address: '0x080DDFDE'
kind: function
status: probable
summary: Spawns a collision region (hitbox) on the battle object's current panel, using its panel coordinates
  and element.
interface: (r5 = battle object pointer, implicit this) -> r0 = result of object_spawnCollisionRegion;
  r4/r6/r7 clobbered (saved)
details: Reads oBattleObject_PanelX, oBattleObject_PanelY and oBattleObject_Element from the object in
  r5 and forwards them as r0-r2 to object_spawnCollisionRegion, with r3 = 0, r4 = 0x6050A01 (region properties
  literal) and r6 = the object's DamageAndStaminaDamageCounterDisabler word. So it is a thin wrapper that
  places a collision region exactly over the object's occupied panel with the object's element attribute.
  The 0x6050A01 constant likely encodes region shape/size/flag bits for the spawned region. r7 is loaded
  with 1 but appears unused by the callee call here, likely padding or a leftover; the .balign padding
  and dword_80DDFFC suggest related literal pools nearby.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0/r1/r2 from oBattleObject_PanelX/PanelY/Element of r5 are passed straight into the spawn
    call; bl object_spawnCollisionRegion is the only call, taking the panel coords, element, 0, 0x6050A01
    and the object's damage field; literals at dword_80DDFF4 = 0x6050A01 and dword_80DDFF8 = 1 are fixed
    spawn parameters; sole caller sub_80DDF86 sits immediately before it, suggesting a paired spawn/handle
    routine
  refs:
  - bn6f/asm/asm31.s:83109
