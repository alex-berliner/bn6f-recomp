summary: 'Battle-object cleanup helper: deletes and nulls the object''s RelatedObject2 pointer and its
  ExtraVars allocation.'
interface: (r5 = battle object) -> r0 = 0; clears oBattleObject_RelatedObject2Ptr and oBattleObject_ExtraVars
  fields
details: Reads [r5,#oBattleObject_RelatedObject2Ptr]; if non-null calls sub_80C44C8 on it and stores 0
  back into the field, then repeats the same pattern for [r5,#oBattleObject_ExtraVars]. Both fields follow
  the same check-free-null idiom, so sub_80C44C8 acts as the shared free/delete routine for whatever these
  fields point at (likely the heap allocator or object destructor). This is a teardown step, run for the
  beastsp route's battle objects; the object pointer r5 is set up by the caller and no return value is
  produced. No flags are meaningfully returned since it ends with pop {pc}.
