name: object_freeRelatedObjectAndExtraVars
address: '0x08011236'
kind: function
status: confirmed
summary: Clears a battle object's related-object pointer and extra-vars pointer, asking battle_objectSetStateActionPhase8
  to tear each of them down first.
interface: 'u32 object_freeRelatedObjectAndExtraVars(Object* r5 object); /* in: r5=object, lr=return; out: r1=last
  callee''s r1 (or incoming r1 if nothing freed), lr preserved; clobbers r0, NZ flags */'
details: 'Operates on a battle object struct (r5). Reads field oBattleObject_RelatedObject2Ptr;

  if non-NULL, calls battle_objectSetStateActionPhase8 with that pointer in r0 (presumably

  queuing the object for teardown/removal at its next phase-8 state update) and then stores 0

  into the field. Repeats the same sequence for the oBattleObject_ExtraVars field. Returns

  whatever r1 battle_objectSetStateActionPhase8 left; if both pointers were already NULL, the

  function is effectively a no-op and r1 passes through unchanged. Uses lr as the return

  address (called via bl from other object lifecycle code, e.g. object cleanup paths).

  '
