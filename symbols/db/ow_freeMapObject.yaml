summary: Trivial wrapper that frees an overworld map object via FreeOverworldMapObject, likely used as
  a callback/destructor hook.
interface: (r0 = overworld map object slot/index) -> r0 = result of FreeOverworldMapObject; flags from
  callee
details: The function does nothing but preserve r0, call FreeOverworldMapObject (which clears the object's
  active bit in the global allocation bitfield, marks its slot free, and unmarks it in the sprite system),
  and return. The push {lr}/pop {pc} instead of a tail-jump suggests it is called indirectly (e.g., as
  an event or destructor callback) rather than being a plain thunk. No further logic, register clobbering,
  or data access of its own.
