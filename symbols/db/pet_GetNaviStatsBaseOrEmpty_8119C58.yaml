name: pet_GetNaviStatsBaseOrEmpty_8119C58
address: '0x08119C58'
kind: function
status: confirmed
summary: Returns the given base pointer unchanged, or base+4 when the PET currently holds no navi (its 0xE stats
  byte reads 0xFF).
interface: // u32 pet_GetNaviStatsBaseOrEmpty(u32 base) -> u32 ptr, u8 r1 == 0x0E
details: 'Saves the incoming base pointer (r0) in r7, calls GetCurPETNavi to get the id of the

  navi currently installed in the PET, then calls GetCurPETNaviStatsByte(id, 0xE) to read

  the stats byte at offset 0xE for that navi. If the byte is 0xFF (no navi selected / empty

  PET slot), the function returns base+4; otherwise it returns base unchanged. Callers

  apparently expect r1 to still hold the stats offset 0xE after the call, so r1 is

  reloaded with 0xE before returning. r7 is preserved; flags are clobbered by the compare

  and the helper calls. Looks like a small selector used by menu/status code that needs a

  base address shifted by 4 when there is no current navi (e.g. pointing at a different

  entry in a small struct or label table).

  '
