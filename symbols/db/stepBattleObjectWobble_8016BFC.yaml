name: stepBattleObjectWobble_8016BFC
address: '0x08016BFC'
kind: function
status: confirmed
summary: Per-tick battle-object wobble driver that snapshots the rest pose, applies random X/Z variance
  while a counter is armed, and restores the rest pose when it expires.
interface: "void stepBattleObjectWobble_8016BFC(u32 /*r5*/ obj);\n  inputs:  r5 = battle object pointer\n\
  \  outputs: r1 = variance result X (wobble path) or collision-data+0x80 halfword (rest path)\n     \
  \      r4 = preserved from caller\n  clobbers: r0, r1, r2, r3, NZCV (r4/r6/r7 preserved)\n"
details: "Operates on a battle object via global offsets oBattleObject_*:\n  - oBattleObject_PreventAnim,\
  \ oBattleObject_X16, oBattleObject_Z16,\n    oBattleObject_Unk_30, oBattleObject_Unk_32, oBattleObject_Unk_19,\n\
  \    oBattleObject_CollisionDataPtr, oBattleObject_Y.\nFirst guard: if PreventAnim is clear, snapshot\
  \ X16->Unk_30 and Z16->Unk_32,\nclear Unk_19, and set PreventAnim to 4 (anti-re-trigger window).\nCollision\
  \ check: halfword at *(CollisionDataPtr + 0x80); if non-zero, force\nUnk_19 = 0x1E (30 frames of wobble).\n\
  If Unk_19 is non-zero, decrement it, build (X<<16, Y, Z<<16), and call\nAddRandomVarianceToTwoCoords(amplitude=3,\
  \ ...) producing a perturbed\n(X, Y, Z) triple that is written to the obj+0x34 block (three 32-bit words)\n\
  and returned in r1/r2/r3.\nOtherwise, restore X16/Z16 from the Unk_30/Unk_32 snapshot (rest pose).\n\
  The exit NZ flag is sourced from the Unk_19 value tested at the branch.\n"
