name: submenu_linkResultHandler
address: '0x08132194'
kind: function
status: probable
summary: 'Link-menu state routine: compares link-peer data in eLinkState against a small known-entry table,
  then sets sSubmenu state fields and fires a network text script (0x1E/0x1F) based on the outcome.'
interface: () -> r0 = 0 or 4 (result code); writes sSubmenu.jo_01/unk_02/unk_03/unk_10/unk_11/unk_26/unk_2A
  and eLinkState fields; flags not meaningful
details: 'Clears sSubmenu.unk_10, then calls the eStruct200BC30 mode dispatcher sub_803EAE4: result 4
  goes to a final branch (jo_01=0x34, clearing unk_02/unk_03), result 1 returns immediately. Otherwise
  it sets unk_10=1, resets counters (unk_26=0 and a word cleared via sub_81325CC), then walks a 2-entry,
  0x10-stride table (returned by sub_81323B0) comparing entry+4 and entry+2 against eLinkState+0x1c and
  +0xa; r3=8 is halved per successful compare and mismatched word compares exit early. If r3 ends as 1
  (word fields match, one halfword matches), it sets state unk_10=2, shows script 0x1F, sets unk_26=0x10
  and writes 0x2000 to eLinkState+0xa. Otherwise it calls menu_dispatchStateHandler; on results 0x18/0x1C
  it reads sSubmenu.unk_12 through the 10-entry table sub_81325F4 (compared to 0x14) and feeds the 0/1
  into sub_81209DC, storing (bias<<8|elementId) in unk_2A, then shows script 0x1E with jo_01=0x14.'
