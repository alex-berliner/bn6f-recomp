name: object_transferPanelReserve
address: '0x08012D8C'
kind: function
status: probable
summary: Moves a battle panel reservation from the r7[r0] entry to the r7[r1] entry by claiming the panel
  for the destination, storing sub_8012DB8's result byte into the destination slot, and releasing the
  source's claim; returns early if source and destination bytes already differ.
interface: (r0 = source index into r7 table, r1 = destination index into r7 table) -> r0 = result of sub_8012DB8
  written to [r7+dest]; no meaningful return
details: 'The function indexes a global byte table at r7 with two indices (r4 = source, r6 = destination).
  If both bytes are equal it returns immediately. Otherwise it decodes the source byte as a 3-bit field
  (bits 0-2, via lsl 29/lsr 29) and a 4-bit field (bits 4-7, via lsr 4), and first calls object_reservePanel
  with (low3, high4) to claim the panel for the target, then calls sub_8012DB8 whose result byte is stored
  into the destination slot [r7,r6], and finally calls object_removePanelReserve with the same decoded
  (low3, high4) arguments to release the original holder''s claim. Net effect: the reservation described
  by the source entry is re-registered under the destination entry and the source entry''s bookkeeping
  is cleared. The exact meaning of the low-3-bit and high-nibble fields and what sub_8012DB8 computes
  are not visible here.'
evidence:
