  date: '2026-10-19'
  detail: 'ldrb r0,[r7,r4]/ldrb r1,[r7,r6] + cmp/bne: operates on two entries of a byte table, no-op if
    identical; lsr r1,r0,#4 + lsl/lsr #0x1d pair: packs the byte into (bits0-2, bits4-7) arguments; bl
    object_reservePanel then bl object_removePanelReserve with identical args: claim-then-release around
    the update; bl sub_8012DB8; strb r0,[r7,r6]: destination entry''s byte is replaced by a computed value;
    callees object_reservePanel/object_removePanelReserve summaries confirm panel-reservation claim/release
    semantics'
