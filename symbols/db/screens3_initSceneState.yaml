name: screens3_initSceneState
address: '0x0812C094'
kind: function
status: probable
summary: 'One-time setup for a screens3 menu state: waits for the fade, initializes the battle scene,
  loads entity/background graphics, spawns eStruct records, and resets state fields.'
interface: (r5 = menu/state record) -> r0 = 0 (clobbered); writes r5+3 = 0x10, r5+0x1E = 0, zeroes 16
  bytes at unk_20251A0
details: 'Entry is gated on IsScreenFadeActive: while the branch is taken the function returns immediately,
  so the init body runs only once the fade condition allows it. The body calls battle_initScene_8129248
  to prepare the battle-scene render info, loadEntityJumpOffset00Gfx_812B530 to DMA entity graphics, and
  sub_8132614, which dispatches on a menu choice and writes the next handler index into the menu record.
  It then sets state fields at r5+3 = 0x10 and r5+0x1E = 0, zero-fills 16 bytes of unk_20251A0, loads
  a 30x20 background tilemap via screens3_loadBackgroundTiles, and spawns eStruct (type 9) records from
  the table at byte_8129150. This is a state-handler-style init routine for one of the screens3 menu screens,
  with r5 being the menu/state record passed in globally.'
