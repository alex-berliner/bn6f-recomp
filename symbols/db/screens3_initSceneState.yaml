    / strb r0(0),[r5,#0x1e] reset state fields of the record in r5; ZeroFillByWord(unk_20251A0, 0x10)
    then screens3_loadBackgroundTiles prepare menu buffers/background; battle_spawnEStructRecordsFromTable_80465A0(byte_8129150)
