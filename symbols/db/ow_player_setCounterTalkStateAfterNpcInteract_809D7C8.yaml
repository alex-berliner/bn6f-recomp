name: ow_player_setCounterTalkStateAfterNpcInteract_809D7C8
address: '0x0809D7C8'
kind: function
status: confirmed
summary: After the player finishes interacting with an overworld NPC, checks the NPC's movement flag and, if it
  is 4, marks the player object with state 8 ("talking to counter NPC").
interface: 'void sub_809D7C8(OWPlayerObject *r5) // r0 out: NPC movement flag, or 8 when the store happens; r7 out:
  NPC object pointer; NZCV out: CMP(4) results, N/Z refreshed by the mov in the store path'
details: 'Reads the interacted-NPC pointer from the player object (r5+oOWPlayerObject_interactedNPCObject_58) into
  r7, loads that NPC''s movement flag byte (r7+oOverworldNPCObject_MovementFlag_0a), and compares it with 4. When
  the flag equals 4 (the NPC facing/standing at a counter configuration), stores 8 into the player''s byte field
  oOWPlayerObject_Unk_0a, which presumably marks the player as being in the "talked to counter NPC" state used by
  the overworld interaction flow. If the flag is not 4, the player object is left untouched. Quirk: in the store
  path r0 is overwritten with 8 (so callers reading r0 get 8 rather than the movement flag), and the final mov only
  refreshes N/Z while C/V still hold the CMP(4) results.'
