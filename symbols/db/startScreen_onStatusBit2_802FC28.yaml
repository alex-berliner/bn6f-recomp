name: startScreen_onStatusBit2_802FC28
address: '0x0802FC28'
kind: function
status: confirmed
summary: Start-screen helper that, when the screen state word has bit 2 set, hands a small parameter table (byte_802FC40)
  to the generic handler sub_8001158.
interface: void startScreen_onStatusBit2(const StartScreen* self /* r5 */); // reads u16 at self+0xA; no meaningful
  return value, clobbers r0-r3 and flags
details: 'Reads the u16 status word at offset 0xA of the start-screen state structure passed in r5.

  If bit 2 (0x4) of that word is set, it loads the address of the data table byte_802FC40

  into r0 and calls sub_8001158; otherwise it returns immediately, leaving only the N/Z

  flags from the TST set by the tested bit. The table at byte_802FC40 is

  04 40 A4 80 50 82 00 00 00 00 00 00 — apparently a small parameter/record block

  (first byte 0x04, then values 0xA440, 0x0080, 0x8250 and four zero bytes) whose meaning

  depends on how sub_8001158 interprets it. sub_8001158 is called with no other arguments,

  so the table pointer is its sole input; the call likely drives some deferred start-screen

  action (animation/fade/sound/next-state trigger) that fires only while status bit 2 is held.

  r4-r7 are preserved; flags on the skip path come from the TST, on the call path from

  whatever sub_8001158 leaves.

  '
