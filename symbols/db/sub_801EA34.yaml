name: sub_801EA34
address: '0x0801EA34'
kind: function
status: confirmed
summary: Queues four pairs of 0x20-byte GFX transfers (a base chunk and a +0x20 chunk to destination+0x80), stepping
  the destination back by 0x20 each time and indexing the source table off_801FD90 by the low-to-high nibbles of
  r4.
interface: void sub_801EA34(u32 r1, u32 r4);  // r1 = current VRAM destination, r4 = packed nibble selector; preserves
  r5, r6; clobbers nz,c,v and r0,r2,r3,r7,lr
details: "Per nibble (0..3) of the input selector r4 (consumed via `and r4,#0xf` then `lsr r4,#4`):\n  1. Looks\
  \ up a source pointer in the table at off_801EA74 (= off_801FD90) using\n     (nibble * 4) as the index; the entry\
  \ is a 32-bit pointer to a graphics source.\n  2. Queues an 8-word aligned transfer of 0x20 bytes from that source\
  \ to the current\n     destination (r1) via QueueEightWordAlignedGFXTransfer.\n  3. Queues a second 0x20-byte\
  \ transfer from source+0x20 to destination+0x80.\n  4. Decrements the destination by 0x20 (one 8-byte tile) so\
  \ the next pair lands one\n     tile lower in VRAM.\nNet effect: four 2-chunk \"tile slots\" are queued, each\
  \ occupying a 0x20-byte\ndestination stride, with the chunks laid out as [src+0x00 -> dest] then\n[src+0x20 ->\
  \ dest+0x80]. This looks like a tile loader for animation frames where\nthe per-frame source is selected by a\
  \ packed nibble field and VRAM is filled\nfrom high to low. The function preserves r5/r6 (likely a return value\
  \ and a caller's\nframe pointer) and otherwise freely clobbers the caller-saved set.\n\nRegister form, old prompt;\
  \ queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
