name: object_calculateFinalDamage2
address: '0x0800E420'
kind: function
status: confirmed
summary: Recomputes an object's pending collision-damage total, halving each entry (round up) when the object stands
  on a holy panel.
interface: "void object_calculateFinalDamage2(void);\n  // in:  r5 = battle object pointer; lr = return address\n\
  \  // out: r0 = new damage total, r2 = last processed entry, r3 = collData + 0x80\n  //      flags = NZCV from\
  \ r0+1 after the final address add\n  // clobbers: r0, r1, r2, r3, NZCV\n  // preserved: r4\n"
details: 'Reads the object''s oBattleObject_CollisionDataPtr, then its current panel

  (oBattleObject_PanelX / oBattleObject_PanelY) via object_getPanelDataOffset.

  If the panel''s oPanelData_Type is 5 (holy), each pending entry is halved

  with round-up ((entry + 1) >> 1); otherwise entries are re-summed

  unchanged. The block at collisionData + 0x80 holds the running total, and

  five u16 pending damage entries live at +0x82 .. +0x8B; each entry is

  overwritten in place and the new total is written back to +0x80.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
