name: ai_updateDiveAttack
address: '0x081109F6'
kind: function
status: confirmed
summary: 'Per-frame AI state update for a dive-attack: integrates Y-gravity while the dive timer runs, snaps to
  a target panel when the timer expires, and finalizes the dive with impact effects, panel teleport, and collision
  updates when a panel-transition signal is received.'
interface: void ai_updateDiveAttack(u32 r5 /*battle object ptr*/, u32 r7 /*AI attack vars ptr*/); /* returns r5
  unchanged */
details: "Called once per frame from the battle-object AI dispatcher for enemies using a dive attack.\nThree-phase\
  \ behaviour controlled by a 16-bit timer at battleObj+0x7E:\n\n1. Timer > 0 (normal dive): decrements the timer,\
  \ queries ai_checkNextPanelFlags. If no transition\n   is signalled (return == 0), integrates YVelocity into Y\
  \ (gravity fall) and refreshes panel/collision.\n\n2. Timer <= 0 (expired, no transition): snaps the object to\
  \ the alternate panel Y stored at +0x7B,\n   copies that (x, y) into both the object and AIAttackVars target-panel\
  \ fields, calls\n   object_setCoordinatesFromPanels + object_updateCollisionPanels, sets HitElement = 0xC and\n\
  \   AttackElement = 0 (marking an in-flight dive hit). Shared tail rebuilds panels from coords.\n\n3. ai_checkNextPanelFlags\
  \ returns non-zero (dive finished): clears bit 1 of ObjectHeader_Flags\n   (collision-active flag), spawns an\
  \ impact/splash effect at the current panel via\n   spawn_effectAtPanel, copies Unk_32 into StepTimer, teleports\
  \ the object to the reserve-panel\n   coordinates at +0x78/+0x79, calls ai_spawnPanelEffect at the landing tile,\
  \ releases the panel\n   reserve via object_removePanelReserve, zeroes ExtraVars+0xC, sets collision region 1,\
  \ and\n   writes HitElement = 0x28 / AttackElement = 0 (final landing hit). Shared tail runs.\n\nStructures touched:\n\
  \  - BattleObject: PanelX/PanelY, Y/YVelocity, Flags, ExtraVars+0xC, +0x7B, +0x78, +0x79, +0x7E.\n  - AIAttackVars:\
  \ TargetPanelX, TargetPanelY, HitElement, AttackElement, StepTimer, Unk_32.\n"
