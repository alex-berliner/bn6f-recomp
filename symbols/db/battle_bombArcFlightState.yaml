name: battle_bombArcFlightState
address: '0x080CAA2C'
kind: function
status: probable
summary: 'Flight/landing behavior for a thrown battle object: arcs from Param3/Param4 via math_getThrowSpeeds
  for 50 frames under gravity 0xffffd000, then on landing either destroys (if panel non-solid) or breaks/explodes
  the panel (breaking for Param1!=2, sub_801BD3C for Param1==2), advances CurAction to 4.'
interface: (r5 = battle object) -> void; writes X/Y/Z velocity, position, Timer, CurAction/CurPhase/destroy
  state on the object
details: On first invocation (PhaseInitialized clear) it computes a parabolic throw from panels Param3/Param4
  via math_getThrowSpeeds with gravity constant 0xffffd000 (-0x3000 Z per frame), stores X/Y/Z velocities,
  sets Timer to 0x32 (50 frames), and marks the phase initialized. Each subsequent tick decrements Timer
  while integrating position and updating the object's panels; when the timer expires it snaps coordinates
  to the panel and zeroes Z. If the landing panel is not solid the object just spawns an effect and sets
  CUR_STATE_DESTROY; otherwise it sets a collision region from a small table indexed by Param1 (dword_80CAB10
  = 0x40101), and for Param1==2 calls sub_801BD3C (panel X/Y, alliance, r2=0, r3=4) plus SOUND_HIT_BOMB_1,
  while other Param1 values break the panel (object_breakPanel_dup2), spawn effect id 0x11, and play sound
  0x97, finally advancing to CurAction 4 phase 0 (the explosion/burst state).
