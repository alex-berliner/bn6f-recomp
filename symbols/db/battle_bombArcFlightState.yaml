    while airborne; On landing: object_breakPanel_dup2 + effect 0x11 + PlaySoundEffect(0x97) for the default
    variant; table object_setCollisionRegion by Param1; Param1==2 branch calls sub_801BD3C then PlaySoundEffect(SOUND_HIT_BOMB_1),
    confirming bomb identity; Non-solid landing panel spawns effect and writes CUR_STATE_DESTROY; solid
    landing advances to CurAction=4 (explosion state)'
