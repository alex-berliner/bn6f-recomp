  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The core flow (compute throw speeds, arc, land, conditional panel break/explosion, advance CurAction)
    matches the code. However, the proposal''s description of CurAction/phase writing is wrong: at loc_80CAAD8
    it writes CurAction=4 and zeroes CurPhaseAndPhaseInitialized (a halfword), not ''phase 0 of action
    4'' ambiguously - and it does NOT set CUR_STATE_DESTROY on the normal landing path. Also the ''non-solid''
    early-return does set CUR_STATE_DESTROY via the str at loc_80CA9A, contradicting the proposal''s claim
    that only the non-solid branch destroys. The summary overstates; minor naming tweak is warranted since
    it''s specifically about a thrown bomb object''s flight/landing logic, but ''battle_bombArcFlightState''
    is acceptable.; run wf investigate investigate-20261018-222121; proposed by Hyper glm-5.3-flash, revised
    by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
