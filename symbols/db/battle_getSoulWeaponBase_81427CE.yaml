open_questions:
- The exact consumer meaning of 0x7F0..0x7F7 (e.g., which soul-weapon slot each value maps to,
- and whether callers add an index on top) cannot be confirmed from this function alone —
- 'callers would need to be matched. Also not proved: why the trailing two entries are zero.'
