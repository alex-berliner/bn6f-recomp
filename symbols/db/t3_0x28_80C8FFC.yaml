kind: function
status: confirmed
summary: Dispatches the type-0x28 battle object's current-state update and re-syncs its sprite.
interface: void t3_0x28_80C8FFC(void); // uses R5 (self); passes r0 [state] to dispatched fn, then to object_updateSprite;
  returns via {pc}
details: "Called as a battle-object update step for \"type 0x28\" (the third table entry, index 2 in\nthe t3 handler\
  \ group). Reads the object's current state byte via oBattleObject_CurState on\nR5 and indexes it directly into\
  \ a 4-entry jump table at off_80C9014 (state byte is\npre-multiplied by 4, so each slot is one word):\n  state\
  \ 0  -> sub_80C9024\n  state 4  -> sub_80C9074\n  state 8  -> sub_80C90DC\n  state 12 -> object_genericDestroy\n\
  After the dispatched handler returns, falls through into object_updateSprite, which\nre-syncs the battle object's\
  \ sprite from its current pose/animation. The dispatcher itself\npreserves nothing (only {lr} is pushed/popped),\
  \ matching the contract that only r5/r8 are\nmeaningfully carried through; everything else is clobbered by the\
  \ handler.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed;\
  \ tools/abi/retype_queue.tsv)."
