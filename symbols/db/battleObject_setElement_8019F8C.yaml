open_questions:
- 'Why `r0` ends up zero at exit in captured calls: every captured entry has r0=0, so the post-mask result
  of `and r0, #0xf0` would be 0 anyway; whether callers normally pass nonzero elements is not seen in
  the captured set.'
- The contract marks `out r2`, but the assembly leaves r2 = `r0 & 0xF0` (0xF0's mask applied to remaining
  r0); this is a write, not a meaningful return.
