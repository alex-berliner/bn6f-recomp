name: ai_attackWaitTempObject
address: '0x080ED61C'
kind: function
status: probable
summary: AI attack-state handler that waits while a spawned temporary attack object runs, then detaches
  it and ends the attack.
interface: (r5 = battle object, r7 = oAIAttackVars) -> void; sets oAIAttackVars state fields
details: First invocation (AttackElement == 0) loads the temp attack object from AIData+TempAttackObjectPtr,
  decrements its byte 0x10, sets StepTimer to 0x14 and marks AttackElement = 4 as a 'waiting' state. On
  subsequent frames it counts StepTimer down; when it goes negative it clears BattleObject.RelatedObject1Ptr
  and AIData.TempAttackObjectPtr to 0 and calls object_exitAttackState to finish the attack. The 0x14-frame
  delay after the object's 0x10 counter hits zero looks like a short grace period before the AI returns
  to its normal state.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne: only initializes on first entry, then sets
    state 4 and timer 0x14; ldr r0,[r0,#oAIData_TempAttackObjectPtr]; ldrb/sub/strb on +0x10: touches
    the spawned temp object''s counter once; str r0,[r5,#oBattleObject_RelatedObject1Ptr] and str to oAIData_TempAttackObjectPtr
    with 0: detaches the object when the timer expires; bl object_exitAttackState: only callee, confirming
    this is one state of the AI attack state machine; no callers known; r5/r7 register convention matches
    AI attack state dispatch functions'
