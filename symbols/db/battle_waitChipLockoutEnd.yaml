name: battle_waitChipLockoutEnd
address: '0x08089BAA'
kind: function
status: probable
summary: Battle-side handler that idles while the chip lockout timer runs, then once it expires fires
  an action (0xD) and sets an 0x80 flag.
interface: (r5 = state object whose byte field receives 0x80) -> r0 = 1 always; no flags guaranteed
details: Calls battle_tickChipLockout_8089CB4, which decrements AIData+0x18 (ChipLockoutTimer) and reports
  whether it reached zero this frame. If the timer has not expired (result 0), the body is skipped and
  the function returns 1 immediately, i.e. it keeps waiting. Once the timer expires, it calls sub_8089CA4
  with r0 = 0xD — an argument that looks like a command/state ID — and then stores the byte 0x80 at [r5],
  likely a 'decision ready' or state flag on the AI/battle object r5 points to. It unconditionally returns
  1, matching the pattern of per-frame handler routines that report 'stay active/handled'. The callee
  sub_8089CA4 is not documented, so the exact effect of the 0xD command and the meaning of the r5 struct
  field are unconfirmed.
