name: aiAttack_runStepTwice_80FF680
address: '0x080FF680'
kind: function
status: confirmed
summary: Runs one AI attack step through the shared attack runner twice (once with the scratch word, once with the
  AI attack parameter word) for a boss/custom AI attack.
interface: void sub_80FF680(u32 passThrough /*r5*/, AIAttackVars* vars /*r7*/) -> returns updated u32 r1, r5 from
  the runner's second pass
details: 'Executes a single step of an AI attack twice via the shared attack runner sub_80D01C8 (command type 2).
  On both passes it reloads the fields of the AI attack variable block (r7) fresh: AttackStepIndex (byte) -> r0,
  InitFlag (byte) -> r2, TargetObjectPtr -> r3, Damage -> r6, and passes the caller''s r5 straight through as the
  runner''s r5. The difficulty tier byte (AiDifficultyTier) is passed in r4 with a mode bit OR-ed into the upper
  byte: 0x000 on pass 1, "0x100" on pass 2. The runner''s r7 argument is the block''s ScratchVar word on pass 1
  and its AiAttackParam word on pass 2, so changes the runner makes to the block during pass 1 are picked up by
  pass 2. The pass-1 result is discarded; the pass-2 result (r1, r5) becomes this function''s return. Registers
  r4, r6 and r7 are saved around the calls and restored on exit (the runner clobbers r4/r6/r7, so r7 is explicitly
  re-pushed around each call). Flags NZCV are clobbered.

  '
