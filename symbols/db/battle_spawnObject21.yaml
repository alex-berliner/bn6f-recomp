- What object ID 0x21 is in game terms (trap, helper entity, boss part?)
- Whether r5 (alliance donor) and r6 (damage) are set by the callers sub_80B903A/sub_80FDC2A or returned
  by object_spawnType3
- Meaning of header flag 0x10 set on the spawned object
- The name and summary are correct in substance, but the interface description overspecifies r6 as 'damage
  word' and frames r5/r6 as an undocumented side-channel. The pop shifts r0-r2 (saved caller args) into
  r1-r3, and r6 holds the damage passed in by the caller (not r5); r5 holds the donor object used both
  as the spawn's 5th arg and as the alliance copy source. object_spawnType3 is a normal documented callee.
  The bit-0x10 setting on oObjectHeader_Flags is correct.
