name: sprite_getPalette
address: '0x08002D8C'
kind: function
status: confirmed
summary: Returns the palette ID byte stored in an object's sprite data, locating the sprite via the header's sprite-offset
  nibble.
interface: u8 sprite_getPalette(ObjectHeader* header /* r0 */); also returns r3 = pointer to the sprite data, clobbers
  NZCV
details: 'Takes r0 = pointer to an object header. The type byte at oObjectHeader_TypeAndSpriteOffset (+2)

  packs the sprite''s byte offset from the header in its high nibble (in units of 0x10 bytes):

  the code does (byte >> 4) << 4 and adds it back to the header pointer to reach the embedded

  sprite data. It then loads the byte at +4 of that sprite struct (oObjectSprite_Unk_04, evidently

  a palette index) and returns it in r0. r3 is left pointing at the sprite data as a secondary

  output. No writes to memory; pure getter. NZCV flags are dirtied by the shifts.

  '
