name: battle_spawnRelatedObject2
address: '0x08011366'
kind: function
status: probable
summary: Spawns a t1 battle object (kind 0x47) packed with constant 0x0A0C and a caller halfword, links it to the
  calling battle object as RelatedObject2Ptr; the variant-0 entry additionally calls sub_80C46C0.
interface: (r0, r1 = spawner args, r2 = halfword param, r3 = variant 0-5 set by entry point, r5 = battle object)
  -> r0 = spawned object stored to [r5+oBattleObject_RelatedObject2Ptr]; flags clobbered
details: 'One shared body with six entry points (thumb_func_end labels 0x8011352-0x8011366): each entry sets r3
  to a small variant index, which is copied to r6. The body packs r4 = (r2<<16) | 0x0A0C (literal at off_8011500),
  sets r2 = 1, and calls the t1 spawner at 0x080C468C, storing the returned object pointer into the battle object''s
  RelatedObject2Ptr field at r5. Only when the variant is 0 does it also call sub_80C46C0 (unidentified; likely
  an extra setup/effect step). The exact identity of object 0x0A0C and the meaning of the packed halfword parameter
  are not determinable from this code alone.'
