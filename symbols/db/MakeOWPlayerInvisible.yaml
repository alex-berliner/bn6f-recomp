name: MakeOWPlayerInvisible
address: '0x0809E452'
kind: function
status: confirmed
summary: Hides the player's overworld sprite by clearing the visible flag on the overworld player object.
interface: 'void MakeOWPlayerInvisible(toolkit r10); out: r0 = updated attribute byte, r1 = 2 (OBJECT_FLAG_VISIBLE),
  r3 = player object pointer, NZ flags set from new byte'
details: Follows the pointer chain r10->oToolkit_GameStatePtr->oGameState_OverworldPlayerObjectPtr to reach the
  overworld player object, then reads its first byte (an attribute/flags byte), clears bit 1 (OBJECT_FLAG_VISIBLE
  = 0x02) via BIC, and stores the result back. Returns the new flag byte in r0 and the object pointer in r3; NZ
  flags reflect the new byte value (likely incidental to a tail-call-style return, callers may or may not use them).
  Pure sprite visibility toggle - no collision or logic change. Typically paired with a corresponding Make-Visible
  routine. LR is the only register preserved implicitly by returning; r0, r1, r3 are written and flags are set as
  side effects of the flag arithmetic pattern.
