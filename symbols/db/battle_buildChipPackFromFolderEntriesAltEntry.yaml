summary: 'Alternate entry point of the chip-pack builder: stores its four arguments in stack slots and
  jumps into the shared body of battle_buildChipPackFromFolderEntries.'
interface: (r0 = arg0, r1 = arg1, r2 = arg2, r3 = arg3) -> tail-jumps to loc_811FCD0 inside battle_buildChipPackFromFolderEntries;
  no return value of its own
details: 'The routine pushes {r4-r7,lr}, reserves 0x18 bytes of stack, and parks r0-r3 at [sp,#8], [sp,#0xc],
  [sp,#0x10], [sp,#0x14] respectively, then unconditionally branches to loc_811FCD0. That target lies
  inside the already-documented battle_buildChipPackFromFolderEntries (0x811FCB8), which fills the 30-slot
  chip-pack buffer from folder chip-use stats and hit counters. This is the classic two-entry-point pattern:
  both entries share one body, with this entry establishing the stack frame and argument slots itself
  before entering the common code. The four saved arguments are therefore whatever the shared body reads
  from those stack slots (likely chip pack buffer, folder data, and count/stat pointers). Exact mapping
  of each register to the body''s parameters can''t be confirmed from this fragment alone.'
