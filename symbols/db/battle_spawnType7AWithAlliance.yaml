name: battle_spawnType7AWithAlliance
address: '0x080D49CC'
kind: function
status: probable
summary: Battle-side wrapper that spawns battle object type 0x7A, copies an existing object's alliance/direction
  onto it, flags it, and registers it to the same side.
interface: (r0-r2 forwarded as spawn args, r3 = 4th spawn arg, r5 = source battle object, r6 = value for
  the new object's damage-counter-disabler field) -> r0 = new battle object (or 0 on failure); flags reflect
  null check
details: The wrapper pushes r0-r2/r5 (the pushed words also sit on the stack as the extra spawn arguments),
  loads r0 with 0x7A and calls object_spawnType3, keeping the caller's r3 as the fourth argument. On success
  it stores r6 (supplied by the caller) into the new object's DamageAndStaminaDamageCounterDisabler field,
  copies the AllianceAndDirectionFlip halfword from the object in r5 onto the new object, and ORs flag
  0x10 into its oObjectHeader_Flags. Finally it masks the alliance byte (r3 & 0xFF) and calls setFieldBattleObject_800F614(newObject,
  alliance, 1), tying the spawned object to the same team/slot as its source. The combination of the damage-counter-disabler
  write, the copied alliance, and header flag 0x10 suggests a linked minion/decoy-style object whose damage
  handling differs from a normal spawn. The pop {r1-r3,r5} paired with push {r0-r2,r5} rotates the saved
  caller args into r1-r3 for the post-spawn setup.
