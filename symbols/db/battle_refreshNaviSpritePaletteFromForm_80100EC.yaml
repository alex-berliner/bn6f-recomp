name: battle_refreshNaviSpritePaletteFromForm_80100EC
address: '0x080100EC'
kind: function
status: confirmed
summary: Updates a battle object's navi sprite palette, using a dedicated handler for cross/beast transformed states
  and a computed palette otherwise.
interface: void battle_refreshNaviSpritePaletteFromForm(void *battleObj /* r0 */, ... /* r2-r7,r10 pass through
  to helpers */) -> palette-related values in r0/r1 from sub_801002C path
details: 'Takes a battle object pointer in r0 and reads the navi stats byte at offset 0x2C via

  GetBattleNaviStatsByte_AllianceFromBattleObject. If the byte is 0x17 or 0x18 (the

  cross/beast transformed states), sub_8016A38 handles the sprite update directly.

  Otherwise sub_801002C computes the palette index (returned in r0/r1) and it is applied

  with sprite_setPalette. Register contract shows r4-r7 preserved (per the readable C the

  helper inputs pass through); outputs also include flags nz/c/v and lr.

  '
