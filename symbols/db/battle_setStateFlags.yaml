name: battle_setStateFlags
address: '0x0800A2D0'
kind: function
status: probable
summary: Sets the 16-bit battle state flags word to the given value.
interface: (r0 = new flags value) -> void; writes oBattleState_BattleStateFlags (halfword)
details: 'Reads the current battle object pointer from the toolkit at oToolkit_BattleStatePtr (r10-relative),
  then stores r0 as a halfword into oBattleState_BattleStateFlags. It is a pure setter: no read-modify-write,
  no masking, so callers pass the complete flags word they want. No other registers are touched and no
  calls are made.'
