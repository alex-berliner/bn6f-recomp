name: getBattleSettingsFromList0
address: '0x0800A71E'
kind: function
status: confirmed
summary: Returns a pointer to entry `index` of the 16-byte-per-entry battleSettingsList0 table.
interface: u8* getBattleSettingsList0Entry(u32 index) — in r0 = entry index, out r0 = pointer into battleSettingsList0;
  clobbers r1
details: Computes r0 * 0x10 and adds it to the base address held at off_800A940 (battleSettingsList0), then returns
  to the caller via mov pc, lr. Each entry is 16 bytes; the function performs no bounds checking, so an out-of-range
  index reads past the end of the table. It is a pure table lookup with no other state touched, and it clobbers
  r1 (the stride product) even though the caller-visible contract otherwise resembles a leaf helper. Presumably
  selects a battle settings/configuration record (enemy setup, rules, or similar) by index for the battle system.
