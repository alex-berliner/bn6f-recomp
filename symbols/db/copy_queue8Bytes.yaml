name: copy_queue8Bytes
address: '0x0802B9FE'
kind: function
status: probable
summary: Queues an 8-byte transfer from a ROM table entry (indexed by r0) to the fixed buffer unk_3001AA0
  via QueueEightWordAlignedGFXTransfer.
interface: (r0 = entry index into table byte_802BA48) -> r0 = clobbered? (r0-r3,lr saved/restore pattern
  suggests void); no flags used
details: Takes an index, multiplies it by 8, and adds it to the base of table byte_802BA48 to select one
  8-byte record. It then calls QueueEightWordAlignedGFXTransfer with that record as source, unk_3001AA0
  as destination, and size 8, so each call copies exactly one table entry into the same fixed buffer slot.
  The 8-byte granularity (two rows of a 4bpp 8x8 tile, or one 8x8 2bpp tile row pair) suggests it streams
  small graphics pieces — tile slices or glyph data — from a compressed or packed table into VRAM staging
  space. The buffer at 0x3001AA0 is written by every call, so callers presumably flush or consume it between
  calls. Both callers (sub_802B7A0, sub_802B9E4) sit immediately before it, implying a small cluster of
  queueing helpers.
