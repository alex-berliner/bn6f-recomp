name: rng_pickRandomHalfwordFromTableEntry_80DA9FE
address: '0x080DA9FE'
kind: function
status: confirmed
summary: Returns a randomly chosen halfword from one 16-byte entry of the table at byte_80211A0, selected by an
  RNG roll masked to 0-7.
interface: u16 pickRandomHalfwordFromTableEntry(u32 entryIndex /*r0*/); clobbers r0-r3,lr and flags; preserves r4,r7;
  r4/r7 listed as caller inputs but not actually read
details: 'Shifts the r0 argument left by 4 (so each table entry is 16 bytes) and adds it to the

  base byte_80211A0, giving the address of one entry. It then calls GetPositiveSignedRNG,

  masks the result with 0xE, and uses that as a halfword offset (0,2,4,...,14 = slots 0-7)

  into the entry, returning the selected 16-bit value in r0. So each 16-byte table row holds

  eight u16 candidates and the function returns one of them at random for the row given in r0.

  No bounds checking on the entry index. r4 is loaded with the table base but only used as the

  scratch pointer for the row; r7 is untouched despite appearing in the caller contract.

  Neighboring data (dword_80DAA18 = 0x100100C, dword_80DAA1C = 0xE0F0300, etc.) suggests this

  sits among graphics/palette constants, so byte_80211A0 may be a table of color/effect values

  picked randomly per entry — exact game meaning of the halfwords is not confirmed.

  '
