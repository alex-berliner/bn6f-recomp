name: owPlayerInputTick_809DB60
address: '0x0809DB60'
kind: function
status: confirmed
summary: 'Overworld player tick: primes Unk_34 animation slot, refreshes Unk_50 from the slip/arrow table and Unk_48
  from the game-state table, then clears all three slots.'
interface: "void sub_809DB60(/* r5=OWPlayerObject*, r10=Toolkit* */);\n  inputs: r5 (OWPlayerObject*), r10 (Toolkit*),\
  \ lr (return)\n  outputs: r4 r5 (preserved per contract)\n  clobbers: nz c v r0 r1 r2 r3 r6 r7 lr\n  preserved:\
  \ r5\n"
details: "- Loads a small ROM blob from byte_809DBF4 into OWPlayerObject.Unk_34 via sub_809DBC4 (an\n  animation/SMSN\
  \ data copy helper).\n- If EVENT_IN_SLIPRUN_STATE is set OR the joypad's Held bits include JOYPAD_ARROWS, indexes\
  \ a\n  facing-keyed table at off_809DCEC and copies that pointer's blob into OWPlayerObject.Unk_50.\n  The slip-run\
  \ flag short-circuits the joypad test.\n- If GameState->Unk_11 is nonzero, indexes the table at off_809DC0C by\
  \ facing direction and\n  copies the resulting blob into OWPlayerObject.Unk_48.\n- Unconditionally zeroes OWPlayerObject.Unk_34,\
  \ Unk_48 and Unk_50 at the end (so the primed\n  blobs are transient animation data used within this frame).\n\
  - Uses r5 (player) and r10 (toolkit) per the contract; r5 is preserved.\n- All ROM offsets/branches are 4-byte\
  \ aligned, function ends with `pop {pc}`.\n"
