open_questions:
- What animation sub_809DBC4 copies (SMSN pointer? raw byte stream?) — only `sub_809DBC4` knows.
- What GameState.Unk_11 represents — e.g., a "in-menu" or "paused" flag gating overworld animation refresh.
- Meaning of the slip-run table at off_809DCEC vs. the game-state table at off_809DC0C — likely directional walk/slip
