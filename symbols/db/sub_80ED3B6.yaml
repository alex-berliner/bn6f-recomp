kind: function
status: probable
summary: 'AI attack state-machine step: on first entry spawns the attack object and starts the attack sound, then
  counts the step timer down and sets the hit element when it expires.'
interface: (r5 = battle object, r7 = its oAIAttackVars AIData) -> void; writes flags/animation/timer state on the
  object
details: 'When oAIAttackVars_AttackElement is 0 it performs the attack launch: sets ObjectFlags1 bit 22, plays animation
  0xA, spawns a type-1 subtype-5 temp attack object whose parameter comes from AiDifficultyTier read at AIData+0x68,
  computes damage as Damage+AttackBoost (plus AttackBoost2) and passes it with 0x100000 to sub_80D2B8E via the object
  at r5+0x4C, resets the counter timer to default, sets StepTimer = TimerOrCycles+0xA, plays sound effect 0xF0,
  and marks AttackElement = 4 so the launch only happens once. On every call (including after launch) it decrements
  StepTimer and, when it reaches 0, writes 8 into HitElement, presumably triggering the attack''s hit phase.'
