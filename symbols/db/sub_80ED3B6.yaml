    adds AttackBoost into Damage and passes it (with 0x100000) to sub_80D2B8E for the object at r5+0x4C; PlaySoundEffect(0xF0)
    fires right after the spawn, consistent with an attack-activation sound; StepTimer countdown ends by storing
    8 into HitElement, matching a charge->hit state transition
