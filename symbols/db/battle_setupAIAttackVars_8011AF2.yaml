name: battle_setupAIAttackVars_8011AF2
address: '0x08011AF2'
kind: function
status: confirmed
summary: 'Initialises the AI enemy''s attack-variables block for the current turn: clamps beast damage
  to 5, clears auxiliary fields, reads navi-stat-based boosts, and selects a special sub-step/timer for
  high-status or navi-ID-0x18 allies.'
interface: void battle_setupAIAttackVars(u32 r5 battle_obj, u32 r7 ai_attack_vars, u32 r10 alliance_ctx)
  → r0=0x1E, r1=timer, flags from final cmp; preserves r4–r7.
details: 'Calls computeBeastDamageCap_801265A(r5) and stores min(result,5) as u16 into oAIAttackVars_Damage
  (r7). Zeroes oAIAttackVars_ExtraDamage(u16), _InitFlag(u8), _ChargeReadyFlag(u8), _AttackBoost(u16),
  _ChipUseDelay(u8), _AiDifficultyTier(u8), and _ScratchVar(u32). Fetches navi-stat byte 0x4D via GetBattleNaviStatsByte_AllianceFromBattleObject
  and stores as oAIAttackVars_AttackBoost2(u32). Branches on battle_testFlag0x40_800A8F8: if flag absent
  → reads navi-stat 0x2C and compares to 0x18; if flag present → reads battle_getAllianceEntryStatus_802E4B8
  and compares to 0x0xD (also falls through to the 0x2C check). On match sets oAIAttackVars_SubStepIndex=1
  and timer=8; otherwise timer=0. Stores timer to oAIAttackVars_TimerOrCycles(u8). Clears oAIData_TempAttackObjectPtr
  via LD32(r5+oBattleObject_AIDataPtr). Returns 0x1E in r0 and timer in r1; flags reflect the last cmp.'
