name: overworldObj_testStateBit10_809DAF8
address: '0x0809DAF8'
kind: function
status: confirmed
summary: Tests an overworld object's state halfword at +0x4C for bit 0x10 and returns whether it is set.
interface: int overworldObj_testStateBit10(void *obj /* r5 */); // returns 0 or 0x10, sets NZ flags on result
details: 'Tiny predicate helper taking an overworld object pointer in r5. It loads the 16-bit

  state/flags field at offset 0x4C, masks it with 0x10 (bit 4), and returns the masked

  value: nonzero (specifically 0x10) if the flag is set, 0 if clear. Register quirks:

  r1 is left holding the mask 0x10 and r3 the offset 0x4C from the load sequence, and

  the NZ flags are left reflecting the result so callers can branch directly without

  re-testing r0. The meaning of bit 4 in the +0x4C state field is not determined from

  this function alone; it is whatever per-object state condition its callers check.

  '
