name: wrapCountersAt203CFB0ToU16_802CDFE
address: '0x0802CDFE'
kind: function
status: confirmed
summary: Wraps two 32-bit counters at dword_203CFB0 and dword_203CFB0+0xC down to their low 16 bits, discarding
  the upper halves.
interface: void sub_802CDFE(void)
details: 'Loads the pointer dword_203CFB0, then for the word at that address and the word at offset +0xC performs
  a 16-bit left shift and stores the result back. Storing the shifted value zeroes the upper 16 bits, so each counter
  is effectively truncated/wrapped to a 16-bit value (equivalent to counter &= 0xFFFF). No other registers, memory,
  or flags are touched; the caller''s r0/r1 are clobbered and nzcv flags are altered as side effects of the shifts.
  The two fields are most plausibly timers or frame/step counters that must never exceed a 16-bit range; the exact
  game meaning of dword_203CFB0 is not established from this function alone.

  '
