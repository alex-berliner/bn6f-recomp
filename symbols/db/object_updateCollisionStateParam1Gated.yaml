name: object_updateCollisionStateParam1Gated
address: '0x080C8D10'
kind: function
status: probable
summary: 'Per-frame update for a battle object while it is caught in a collision: tears down old collision
  data, spawns the hit effect, and either dispatches by current action or re-presents collision data each
  frame.'
interface: (r5 = battle object) -> void; sets object state to CUR_STATE_DESTROY when the battle is over
details: 'This looks like the shared ''inside a collision'' state handler for battle objects (r5). It
  first removes the object''s collision data and spawns the hit-effect object at the collision point.
  If the battle is over it clears the object''s collision region and forces its state word to CUR_STATE_DESTROY.
  Otherwise, if the collision set a flags value in the collision data it clears the object''s collision
  region, then branches on oBattleObject_Param1 == 4: when Param1 is not 4 and no time-stop is active
  it refreshes the object''s collision state via object_presentCollisionData, else it dispatches through
  a 3-entry jump table indexed by oBattleObject_CurAction (entries at sub_80C8D64, sub_80C8D8E, sub_80C8DBC).'
