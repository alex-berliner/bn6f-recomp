- method: assembly-reading
  date: '2026-10-18'
  detail: 'opens with bl object_removeCollisionData then bl object_spawnCollisionEffect (collision teardown
    + hit effect); bl battle_isBattleOver; taken path clears collision region and stores #CUR_STATE_DESTROY
    into oBattleObject_CurStateActionPhaseAndPhaseInitialized; ldr r0,[r5,#oBattleObject_CollisionDataPtr];
    ldr r0,[r0,#oCollisionData_FlagsFromCollision] gates object_clearCollisionRegion; ldrb r0,[r5,#oBattleObject_CurAction];
    ldr r1,[r1,r0]; bx r1 with off_80C8D58 dispatch table of three Thumb handlers; battle_isTimeStop /
    Param1==4 gate selects between object_presentCollisionData and the action dispatch'
