name: battleObject_advanceEnemyTargetList_80D1F0E
address: '0x080D1F0E'
kind: function
status: confirmed
summary: Advance a battle object's preset enemy-target list and return the current target's grid coordinates
  (or packed coordinates), falling back to the closest-enemy search when the list is exhausted or unused.
interface: 'r5: BattleObject*; returns r0, r1: u32 (two coordinate/id bytes from the target); r4, r6,
  r7 preserved'
details: 'Reads oBattleObject_Param2 (a mode selector: 0 = no list, 1 = single target, 2 = packed-coord
  mode).

  When Param2 != 0, walks a linked array of target pointers stored at oBattleObject_ExtraVars+0xc

  (current cursor) and oBattleObject_ExtraVars+0x10 (advance counter, set to 1 after first advance

  so the list only moves once per call). Each 4-byte entry is dereferenced to get the next target.

  If the cursor reaches a null sentinel the pointer field is zeroed.

  If no valid entry is found (Param2==0, list exhausted, or entry null), XORs oBattleObject_Alliance

  with 1 to get the opposing side and calls battleObject_findClosestEnemyBattleObject_80103F8 with

  that alliance and r5, using the returned target pointer.

  On exit, if Param2==2 AND the advance counter (ExtraVars+0x10) is still 0, the target''s word at

  +0x78 is split into r0 = low nibble and r1 = word>>4 (packed coordinates).

  Otherwise r0 = byte at target+0x12 and r1 = byte at target+0x13 (grid x,y).

  The caller uses the two returned values as the coordinates of the enemy to face or attack.

  '
