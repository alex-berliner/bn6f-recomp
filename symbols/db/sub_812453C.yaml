name: sub_812453C
address: '0x0812453C'
kind: function
status: confirmed
summary: Renders the next character of the active chatbox text into the text-box tile buffer and then runs the chatbox
  follow-up update.
interface: Next chatbox_renderNextChar_812453C(ChatboxState *r5); // r5 = chatbox/text state pointer in and out
  (preserved); r10 passed in but unused here; result state of the follow-up call arrives in r8-r12; flags clobbered
details: 'Clears the "glyph rendered" flag at state+0x0E, then if the chatbox-active flag at state+0x0C is nonzero:
  reads the 16-bit text-entry index at state+0x14, doubles it (2-byte table entries) to index the text table at
  unk_201C400, subtracts 0x80 from the byte found there to get the character code, and stores it at state+0x0F.
  It then calls renderTextGfx_8045F8C with r0=eTextScript201C100 (text script data), r1=charCode, r2=unk_201AA00
  (glyph/work buffer), r3=0x6007000 (VRAM destination), r4=0xB, r5=3, r6=dword_86A5D60 (font/charset table), r7=0,
  saving/restoring r4-r7 around the call since the state pointer lives in r5. The call''s return value is stored
  back into state+0x0E as the render-result flag. Finally it calls sub_8124588 (the next step of the chatbox update)
  before returning via pop {pc}; r8-r12 on exit are whatever sub_8124588 leaves behind, per the caller contract.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
