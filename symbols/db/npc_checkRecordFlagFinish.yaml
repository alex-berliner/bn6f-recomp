name: npc_checkRecordFlagFinish
address: '0x08008900'
kind: function
status: probable
summary: If bit 3 of a record flag in the 0x2036820 table is set, plays sound 0x9F, advances the r5 object's
  state field to 4, and dispatches event 0x200.
interface: (r0/r5 = object struct, [r5+5] = record index into table 0x2036820) -> r0 = clobbered; [r5+0]
  = 4 when flag set
details: Loads the byte at [r5+5] and passes it as the record index to getRecordFlagBit3, which tests
  bit 3 of that record's flag halfword in the 8-byte-record table at 0x2036820. If the bit is clear, the
  function returns immediately with no side effects. If set, it plays sound effect 0x9F via PlaySoundEffect,
  stores 4 into the state word at [r5+0], and calls dispatch_801DACC with the event mask 0x200. The pattern
  (check a completion flag, play a jingle, move a state machine to a new state, dispatch an event) looks
  like a per-object 'task done' handler, but the meaning of state 4 and event 0x200 depends on the unknown
  dispatcher.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r5,#5]; bl getRecordFlagBit3 — uses [r5+5] as a record index into dword_2036820; beq
    locret — no-op unless the record's flag bit 3 is set; mov r0,#0x9f; bl PlaySoundEffect — jingle only
    on the taken path; str r0,[r5] with r0=4 — writes state 4 to the struct's first field; ldr r0,off_8008924
    (=0x200); bl dispatch_801DACC — queues event/mask 0x200
  refs:
  - bn6f/asm/asm00_1.s:12222
