open_questions:
- No known callers, so the owner of the r5 struct and the meaning of its state field are unknown
- dispatch_801DACC is undocumented, so what event 0x200 triggers cannot be determined
- Which game system's record table 0x2036820 belongs to (and what flag bit 3 means) is unclear
