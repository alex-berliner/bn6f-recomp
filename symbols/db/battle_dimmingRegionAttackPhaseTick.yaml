name: battle_dimmingRegionAttackPhaseTick
address: '0x080BFB74'
kind: function
status: probable
summary: 'Per-frame phase handler for a battle attack: plays anim/sfx, then on frame 10 spawns an element-typed
  collision region on the front panel with its effect and a camera shake, ending the phase after 30 frames.'
interface: (r5 = battle object) -> none; updates oBattleObject_Timer, CurAnim, CurPhaseAndPhaseInitialized
details: Runs once per frame with the battle object in r5. On the first tick (PhaseInitialized==0) it
  sets CurAnim=5, clears Timer, spawns temp attack object kind 5 with r7=r5+0x60 (parent pointer), plays
  sfx 0xCE, and marks PhaseInitialized=4. When Timer hits 10 it computes the panel ahead (PanelX + object_getFrontDirection,
  PanelY) and calls object_spawnDimmingCollisionRegion with the object's Element and params dword_80BFC20=0x405ff11
  (likely damage/flags), converts those panels to pixel coords, and spawns an effect (kind 0, params 0x400+flip,
  offset 0x1b, subparam 0x10) via spawn_t1_0x0_EffectObject. It then triggers camera shake (magnitude
  2, 0x28 frames) and battle_spawnExtraVarsObject kind 0xA storing r5+0x60 as ExtraVars. Timer increments
  each frame; at >30 it writes phase 8 into CurPhaseAndPhaseInitialized to finish.
