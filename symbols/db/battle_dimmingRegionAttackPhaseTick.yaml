- method: assembly-reading
  date: '2026-10-18'
  detail: First tick sets CurAnim=5, Timer=0, spawns spawn_t1_0x5_tempAttackObject and plays PlaySoundEffect(0xCE)
    before setting PhaseInitialized=4; At Timer==10 calls object_spawnDimmingCollisionRegion with PanelX+object_getFrontDirection,
    PanelY, Element, r4=0x405ff11, r6=DamageAndStaminaDamageCounterDisabler; Immediately converts the
    same panel coords via object_getCoordinatesForPanels and spawns an effect whose param adds object_getFlip,
    showing a facing-aware visual at the struck panel; Calls camera_initShakeEffect(2, 0x28) and battle_spawnExtraVarsObject
    (kind 0xA, ExtraVars=r5+0x60) on the strike frame; Timer counts to 0x1e then writes phase 8, a standard
    phase-exit in these handlers
