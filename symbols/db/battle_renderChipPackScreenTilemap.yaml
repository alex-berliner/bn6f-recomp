name: battle_renderChipPackScreenTilemap
address: '0x0812D3E4'
kind: function
status: probable
summary: Renders six sections (folder chips, folder OAM pack, icon slots, pack entries, panel entries,
  plus a header) into tilemap buffers and copies each into BG tile block 2 as 2-column x 14-row strips
  (columns 3,1,0xB,0xD,0xE,0x10), then calls sub_812D5EC.
interface: () -> r0 = 0 via callees; reads screen-state struct from sub_812D6F8, writes tilemap data buffers
  at 202DFA0..202E144 and copies them into BG tile block 2
details: 'Calls sub_812D6F8 to get a state struct, then for each of six sections repeats the same pattern:
  pass the halfword at [state+0x2e] plus word_2023FA0 as r1 and a section buffer as r2 to a builder (loadFolderChipGfx
  with a 0x6007600 base tile, buildChipFolderOamPack with 0x6006B80/0x35C, loadChipIconSlots with 0x9000|0x216,
  fillChipPackEntries with 0x8000|0x34F, sub_8120618 with 0xA000|0x200 for panel entries), then CopyBackgroundTiles
  that buffer into tile block 2 at a fixed column (j = 3, 1, 0xB, 0xD, 0xE, 0x10) with j_size=2, i_size=0xE.
  Each section therefore occupies a 2-column x 14-row strip; the r3 values are palette-or''ed base tile
  indices for the builder. The halfword at +0x2e is forwarded as r0 to every builder, suggesting it selects
  which folder/entry set to render. Ends with sub_812D5EC.'
