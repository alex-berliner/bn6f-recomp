summary: LZ-compressed NPC text archive of Central Area 1 (map 0x90/0x00, slot 4); its random-branch (F0) scripts
  are the NetCafe rumors retold and a 50/50 3000 Zenny or 10 BugFrags prize.
details: "Data, not code: dat38_87.s includes it as an .incbin of data/textscript/compressed/CompText8784908.s.lz,\n\
  built from the readable source data/textscript/compressed/CompText8784908.s (size word, then the archive).\n\n\
  Use: its only reference is entry 4 of off_80450D8 (chatbox.s:10129), the five-archive list of internet map\ngroup\
  \ 0x90 map 0 (off_internet_80444C4 entry 16 = off_80450CC, whose entry 0 is off_80450D8). GameAreas.inc\nnames\
  \ 0x90 CENTRAL_AREA, map 0 CENTRAL_AREA1. Entry 4 of a map's list is what\nchatbox_selectCompTextByMap_80407C8\
  \ (fixed index 4) returns, and chatbox_uncompMapTextArchives_803FD08\ndecompresses it into eDecompressedTextArchive202FA00\
  \ at map load; NPC scripts point their text at\nbyte_202FA04 (that buffer + 4) with NPCCommand_set_text_script_index_and_ptr_to_decomp_buffer.\
  \ So this is the\ntext the map's NPCs speak.\n\nRandom branches (text opcode F0, handler chatbox_F0_jump), seven\
  \ of them:\n- unk55, `ts_jump_random 0x41, 0x20, 0x20, 0xFF, 0x38`: two weights 0x20, targets 0xFF (go on: \"\
  AMAZING!!\n  WELL DONE!! I LOSE!!\", gives 3000 Zenny) and script 0x38 = unk56 (same words, gives 10 BugFrags),\
  \ after\n  \"YOU'VE COMPLETED ALL OF THE MATCHES!\" (mugshot 0x3D). (r & 0x3FF) % 64 makes it exactly 50/50.\n\
  - unk132-unk137: the NetCafe NPC with mugshot 0x42 (unk140 welcomes Lan to the NetCafe), who tells the rumors\
  \ unk123-unk129 (\"Hey,have you heard?\"\n  ...). Each of these scripts first checks the rumor flags EVENT_10D,\
  \ EVENT_10E, ... in order (jumping to the\n  first rumor not yet told), then `ts_jump_random 0x47, ...` picks\
  \ uniformly (weights 0x20) among the\n  rumors already told: 2 in unk132 (targets 0x7B, 0x7C) up to 7 in unk137\
  \ (0x7B-0x81).\nBit 7 of 0x41/0x47 is clear, so EVENT_1709 does not change these picks.\n"
