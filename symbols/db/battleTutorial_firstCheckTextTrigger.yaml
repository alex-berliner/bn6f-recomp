name: battleTutorial_firstCheckTextTrigger
address: '0x08029BE6'
kind: function
status: probable
summary: Per-step checker for the first-battle tutorial that decides whether a tutorial text script should
  fire, returning 5 (run tutorial text entry) or 0 (don't).
interface: (r0 = unused, r5 = battle-tutorial task struct) -> r0 = 0 if no text should play, 5 = trigger/entry
  for TextScriptFirstBattleTutorials; flags not meaningful
details: 'The function is a predicate called with the tutorial task in r5 (r0 is never read). It returns
  0 when any of: field +8 is nonzero (likely a text/wait state already active), field +0x19 is zero (trigger
  condition not met), or field +1 equals 0x54 (current step is one that must not be interrupted). Only
  when +8 is clear, +0x19 is set, and the step is not 0x54 does it return 5, which the caller (battleTutorial_first_checkTextStep_8029B1C)
  uses to pick and run an entry from TextScriptFirstBattleTutorials and move the task to its post-text
  wait state. The .word after the routine pointing at TextScriptFirstBattleTutorials confirms it belongs
  to that text-dispatch table.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r5,#8]; bne -> return 0: text suppressed while another state is active (0x08029BE8-0x08029BEA);
    ldrb r0,[r5,#0x19]; tst/beq -> return 0: requires a trigger flag to be set; ldrb r0,[r5,#1]; cmp #0x54/beq
    -> return 0: step 0x54 is exempt from triggering text; mov r0,#5 fallback return: nonzero result selects
    a text entry, matching caller''s documented ''asks a per-step checker if a chatbox script should play'';
