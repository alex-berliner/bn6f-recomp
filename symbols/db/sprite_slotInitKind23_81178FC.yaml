name: sprite_slotInitKind23_81178FC
address: '0x081178FC'
kind: function
status: confirmed
summary: Initializes a sprite state slot as kind 0x23, runs its byte script, loads its animation/graphics/palette/priority,
  then jumps to sub_811794C.
interface: void sub_81178FC(u8 *slot_ptr /* r5 */);
details: "Operates on a sprite state slot pointed to by r5 (preserved across the function):\n  * [r5+0]\
  \   = 0x23 (kind/state byte).\n  * [r5+4]   is read as sub_kind (used to pick the palette bank).\n \
  \ * [r5+5]   is overwritten with the animation index returned by sub_8117998.\n  * [r5+8]   = 4 (phase\
  \ / sub-state).\n\nCalls performed (in order):\n  * loc_8002774(0x10, byte_2030204) - runs a byte script\
  \ with arg 0x10 pointing at byte_2030204.\n  * sub_8117998() -> anim -> stored at [r5+5].\n  * sprite_setAnimation(anim);\
  \ sprite_loadAnimationData(); sprite_noShadow(); standard sprite setup for the just-chosen anim.\n \
  \ * sprite_setSubEntryPaletteBank_800304A(9 + sub_kind) - palette bank derived from slot sub_kind.\n\
  \  * slotList_storeHalfwordAndClearField_800306C(0x180) - writes halfword 0x180 into the slot list /\
  \ sub-record area.\n  * sprite_setSubRecordFieldA_8003060(1) - sets the 0x1 flag on the sub-record.\n\
  \  * sprite_setPriority_8002E14(0) - BG/sprite priority 0.\n  * sub_811794C() (tail). Its return value\
  \ (r0) is forwarded to the caller and NZ flags are set from it.\n"
