name: ai_attackStepDispatchSubStep
address: '0x0810AF30'
kind: function
status: confirmed
summary: Dispatches the current sub-step of a Nav's attack routine via a three-entry jump table (intro anim, middle
  phase, front hitbox spawn).
interface: 'void ai_attackStepDispatchSubStep(u32 r2, u32 r5, AIAttackVars *ai /*r7*/, u32 r10);

  /* r0 = sub-step index (byte from r7+oAIAttackVars_SubStepIndex) */

  /* r1 = resolved handler address (thumb bit set) */

  /* handler is called via mov lr,pc; bx r1 so all other registers pass through unchanged */

  /* Clobbers: r0, r1, all condition flags (nzcv) */

  /* Preserved: r2-r12, lr (caller''s return) */

  '
details: "The function is a tiny computed-goto trampoline at the head of each tick of\nan AI attack step's state\
  \ machine.  It reads one byte,\noAIAttackVars_SubStepIndex, from the AI attack variable block pointed to by\n\
  r7.  That byte is used directly as a byte-offset into a .balign-4, 3-entry\njump table at 0x0810AF44 (the entries\
  \ are pre-or'd with 1 for thumb mode):\n\n  offset 0x00 → ai_attackStepPlayIntroAnim + 1\n  offset 0x04 → sub_810AF90\
  \ + 1          (middle/active-anim phase)\n  offset 0x08 → ai_attackStepSpawnFrontHitbox + 1\n\nA single-byte\
  \ increment (r0) therefore advances the attack through\nintro → active → hitbox-spawn in three sequential ticks.\
  \  The dispatcher\nitself contains no loop or state mutation beyond loading r0/r1; the\nsub-step index is advanced\
  \ (and the table bounds enforced) by the caller.\n\nBecause the indirect call is written as \"mov lr, pc; bx r1\"\
  , the handler\nreturns straight into the dispatcher's pop{pc}→return-to-caller path.\nAll registers other than\
  \ r0/r1 and the condition flags are transparent to\nthe handler, matching the register contract's long output\
  \ list.\n"
