name: ai_attackStepDispatchSubStep
address: '0x0810AF30'
kind: function
status: probable
summary: Dispatches an AI attack's per-substep handler via a jump table indexed by the attack object's
  SubStepIndex.
interface: (r0 = attack/effect object, r7 = AI attack vars) -> tail-calls handler from off_810AF44; r0
  returned per handler; no flags set here
details: 'Tail-jumps to one of three Thumb handlers selected by [r7, oAIAttackVars_SubStepIndex]: ai_attackStepPlayIntroAnim,
  sub_810AF90, or ai_attackStepSpawnFrontHitbox. It is a pure trampoline — it loads the table base from
  off_810AF40, indexes it with the substep counter, and does ''mov lr, pc; bx r1'' to call the handler
  in Thumb state. r0 is not modified, so the caller''s object pointer is passed straight through to the
  handler. The table lives right after the code and holds handler addresses+1 (Thumb bit set). Called
  once per frame from the attack-step loop (ai_attackStepExitOnScratch) and when initializing an attack
  from spawnSweepPanelEffect, so it advances the attack''s intro/hitbox-spawn substeps.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r7,#oAIAttackVars_SubStepIndex]; ldr r1,[r1,r0]; bx r1 — table dispatch on attack substep
    index; off_810AF44 entries are ai_attackStepPlayIntroAnim, sub_810AF90, ai_attackStepSpawnFrontHitbox
    (+1 Thumb pointers); called from ai_attackStepExitOnScratch, whose summary says it runs the attack's
    update routine per frame; called from battle_spawnSweepPanelEffect right after initializing the AI
    attack state, i.e. to start its first substep
