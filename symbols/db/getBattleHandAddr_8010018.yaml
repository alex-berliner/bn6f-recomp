name: getBattleHandAddr_8010018
address: '0x08010018'
kind: function
status: confirmed
summary: Returns the address of a battle hand slot, indexing the hand array at 0x20349C0 in 0x50-byte strides.
interface: u32* getBattleHandSlotAddress(u32 handIndex); // in r0 = slot index, returns r0 = slot address, r1 =
  hand array base
details: 'Trivial address computation helper: multiplies r0 (a hand slot index) by 0x50 and adds

  the base of byte_20349C0 (an IWRAM array), so each entry of the player''s battle hand

  (card-in-hand record) is 0x50 (80) bytes. Returns the slot address in r0 and the array

  base in r1; both are live outputs per the caller analysis. Implemented with a multiply

  instruction and a tail jump (mov pc, lr), so lr is an input and no other registers or

  memory are touched. Flags nz c v are clobbered by the mul/mov and callers must not

  rely on them.

  '
