    selected by high byte, low byte kept in r1 as the glyph index; bl renderTextGfx_8045F8C twice, with
    bases 0x600BA80 and 0x600BC80 and shared params dword_86B7AE0/8: two text renderings through the text
    toolkit; byte_802C7EC holds consecutive tile indices 0x91D4-0x91E3 with 0x90C5 padding, and dword_802C7E0=0x91E4
    is strh''d and incremented: fixed tilemap art blitted around the text; pop {r0,r1,r6} before each
    blit restores the caller''s original r0/r1, so the second renderTextGfx call renders the constant
    TextScript86EF71C with the caller''s r1, not the chip index; callee blitTileBlockToRowBuffer_802C4B6
    targets the 24-halfword row buffer at unk_2034B30, matching the banner-slice pattern'
