name: drawChipNameTileRow
address: '0x0802C75C'
kind: function
status: probable
summary: Renders a chip name text graphic and a fixed 2-row tilemap block into the 24-wide row buffer
  at unk_2034B30, writing to unk_2035320/unk_2035520.
interface: '(r0 = (table<<8)|chipIndex packed: low byte chip index 0-0xFF, high byte selects TextScriptChipNames0/1)
  -> void; clobbers r5, writes text-render state unk_2035320/unk_2035520 and the row buffer'
details: r0's low byte is the chip index and r0>>8<<2 indexes a 2-entry table of text-script bases (TextScriptChipNames0/1);
  that base plus the index is passed to renderTextGfx_8045F8C with glyph VRAM base 0x600BA80 and palette/font
  params (8,1,dword_86B7AE0,8). It then blits a fixed 2x12 tilemap block (byte_802C7EC, tile indices 0x91D4-0x91E3
  + 0x90C5) into the row buffer via blitTileBlockToRowBuffer_802C4B6, followed by a 2x1 block of tiles
  0x91E4/0x91E5 (0x91E4 strh'd inline, incremented for the second halfword). Finally it re-uses the saved
  r0/r1 (pop {r0,r1,r6} restores the caller's original arguments, so r1 is the caller's r1, not the chip
  index) to render a second fixed string TextScript86EF71C with glyph base 0x600BC80 into unk_2035520.
  The row buffer is the same one blitTileBlockToRowBuffer_802C4B6 documents, so the output is a slice
  of a wider banner, drawn every frame from menus and story routes.
