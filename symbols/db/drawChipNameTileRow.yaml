  reproduce: python3 tools/asmcat.py 0x0802C75C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code does render a chip name plus a fixed tilemap block into unk_2034B30, but the proposal misreads
    several details. The first renderTextGfx_8045F8C call writes into unk_2035320 (not the row buffer),
    and the second writes into unk_2035520, so the chip-name string is not in the row buffer. The tile
    block at byte_802C7EC is 2x16 (two rows of 9 halfwords from r3=#9, r4=#2), not 2x12. The final 2x1
    block is not 0x91E4/0x91E5 — strh writes 0x91E4 and 0x91E5 as the two halfwords in the 2x1 region,
    which is what the asm shows. The 2x12 size in the proposal is contradicted by mov r4,#2 immediately
    before the blit.; run wf investigate investigate-20261018-200615; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
