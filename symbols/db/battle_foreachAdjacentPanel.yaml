name: battle_foreachAdjacentPanel
address: '0x080C6358'
kind: function
status: probable
summary: Runs sub_80E21AC for the object's own panel and all 8 surrounding panels of the 6x3 battle grid,
  passing panel coords, the packed Param2/Param3 value and the related-object pointer.
interface: (r5 = battle object) -> r0 = void; r4/r7 are argument registers for sub_80E21AC (r4 = Param2
  | Param3<<8, r7 = RelatedObject1Ptr)
details: Loops r6 = 0..8 over a 9-entry table of signed (dx, dy) byte pairs at byte_80C639C, which enumerates
  the object's panel plus all 8 neighbors. For each offset it computes panelX+dx, panelY+dy and validates
  them with object_isValidPanel; if inside the 6x3 grid it packs r4 = oBattleObject_Param2 | (oBattleObject_Param3
  << 8), loads r7 = oBattleObject_RelatedObject1Ptr, and calls sub_80E21AC(r0 = x, r1 = y). The object
  is passed in r5 by the caller, not r0, matching a helper convention in this caller chain. What sub_80E21AC
  does with each panel is not shown, so the gameplay meaning (e.g. spawning/flagging effects on the 3x3
  area) is inferred only from the shape.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'byte_80C639C holds 9 signed (dx,dy) pairs: (0,0), all four diagonals, all four orthogonal neighbors
    — a 3x3 neighborhood; loop bound ''cmp r6, #9'' with ''lsl r2, r6, #1'' indexes two-byte table entries;
    object_isValidPanel is called on (PanelX+dx, PanelY+dy) before each sub_80E21AC call; r4 = Param2
    | (Param3<<8) and r7 = RelatedObject1Ptr are set only to feed sub_80E21AC; caller sub_80C62F8 supplies
    the battle object in r5 (function never sets r5 itself)'
