name: startScreen_playSfxIfFlagSet_802FC4C
address: '0x0802FC4C'
kind: function
status: confirmed
summary: On the start/title screen, plays a sound effect (via sub_8001158) when the screen's state field has bit
  1 set, otherwise does nothing.
interface: void startScreen_playSfxIfFlagSet(const StartScreen *self /* r5 */)
details: 'Reads the u16 state/flags field at StartScreen+0xA and tests bit 1 (mask 0x2). If the bit is

  clear, the function returns immediately (with NZ/C flags still reflecting the tst of that bit).

  If the bit is set, it loads the address of the byte_802FC64 parameter block into r0 and calls

  sub_8001158, the SFX player. byte_802FC64 is the inline data for that call (bytes 0x4, 0x40,

  0xCC, 0x80 followed by zero padding, i.e. the sound-effect descriptor the player consumes).

  r5 is treated as a pointer to the start screen struct by all callers (lifter contract: r5 in).

  The flags on return depend on the path taken: the tst result if no sound was played, otherwise

  whatever sub_8001158 leaves. No other registers or memory are modified.

  '
