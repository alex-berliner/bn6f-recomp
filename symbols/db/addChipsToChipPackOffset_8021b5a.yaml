name: addChipsToChipPackOffset_8021b5a
address: '0x08021B5A'
kind: function
status: confirmed
summary: Adds a number of chips to a chip pack slot's count byte, capping the count at 99 and reporting
  the outcome.
interface: 'int addChipsToSlotCount(u8* slotCount /* r0 */, int amount /* r2 */); // returns r1 = new
  count, r3 = status: 0 added fully, 1 slot already full, 2 clamped to 99; clobbers nzcv'
details: 'Takes r0 = address of a single byte holding a chip pack slot''s chip count and

  r2 = how many chips to add. If the byte already reads 99 the slot is full: the

  byte is rewritten with 99 unchanged and r3 = 1 is returned. Otherwise the amount

  is added (r3 = 0 presuming success); if the signed sum exceeds 99 the count is

  clamped to 99 and r3 = 2 signals a partial add. The new count is stored back as

  a byte and returned in r1. Comparison uses signed ble, so an amount large enough

  to overflow past 99 (or a corrupted count > 99) still clamps correctly on the

  next comparison only if the sum does not wrap; negative sums would pass the

  ble check unclamped. The .word 0x1E20 at off_8021B74 lies after the func_end

  and is unrelated data, not part of this routine.

  '
