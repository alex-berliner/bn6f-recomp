name: MapScriptCutsceneCmd_set_screen_fade
address: '0x08035D6A'
kind: function
status: confirmed
summary: Map-script cutscene command handler that starts a screen fade using two byte parameters, then advances
  to the next script command.
interface: 'Next MapScriptCutsceneCmd_set_screen_fade(void); inputs: r5 = script data pointer, r7 = script command
  pointer, lr; clobbers r0-r4, r6, flags; preserves r5; returns r0 = 1, r7 += 4'
details: 'Handler for a map-script cutscene command (executed with the script state in r5 and the command pointer
  in r7). It first reads script argument 1 via ReadMapScriptByte (argument index passed in r6, result returned in
  r4). If that byte is 0xFF, the two fade parameters follow immediately in the script stream: argument 2 is the
  first parameter and argument 3 the second. Otherwise the byte is treated as an offset into the script data (r5),
  and the two parameter bytes are read from r5[offset] and r5[offset+1]. The two bytes are passed to SetScreenFade(r0
  = param1, r1 = param2), which starts the requested screen fade (presumably fade-in vs fade-out and target color/speed).
  The command pointer r7 is advanced by 4 bytes (2-byte opcode word + 2 parameter bytes) and the function returns
  1 in r0, signaling continuation to the dispatcher. r4 is left as the last byte position touched (offset+1 in the
  indirect form, second immediate byte in the immediate form); the add r7,#4 sets c/v and the final mov r0,#1 sets
  n/z, so the full NZCV state is observable by the caller dispatch table.

  '
