name: ai_woodAttackChargeTick
address: '0x080F404E'
kind: function
status: probable
summary: 'Per-frame handler for an enemy AI attack: on first run it plays a charge animation/sound and
  spawns the attack object, then after a fixed timer expires it flips the object''s state to the fire/hit
  step.'
interface: (r0,r1 = unused here; r5 = battle object, r7 = oAIAttackVars context) -> r0 = 0 or countdown
  result; updates oAIAttackVars fields and the spawned object's state byte.
details: 'Reads oAIAttackVars_AttackElement as a phase selector: when 0 it initializes the attack — sets
  AttackElement to 4 (wood?), plays anim 0x15 on the battle object, calls sub_80C8070 with PanelX/PanelY,
  InitFlag, AiDifficultyTier and Damage to spawn the attack, plays sound effect 0xBA, sets the spawned
  object''s +0xB state byte to 4, and loads a step delay from byte_80F40AC indexed by AiDifficultyTier*2
  into StepTimer; if PanelParamFlags2 is set it also calls sub_80E3FC4. On later frames (element nonzero)
  it decrements StepTimer, and once it reaches 0 sets the object''s state byte to 5 and writes HitElement
  = 0x14 (0x14 = wood-type hit element?), ending the charge phase. All four difficulty table entries are
  0x48, so the charge delay is difficulty-independent.'
