name: battle_BDT_update_80c94bc
address: '0x080C94BC'
kind: function
status: confirmed
summary: Battle-object collision routine tick that refreshes spawns/collision effects, dispatches the current action's
  handler, and either highlights the active collision panels or tears the object down on battle-end, panel-stop,
  or collision flags '0xFF800000'.
interface: 'void battle_BDT_update_80c94bc(void);  // in: r4 preserved across call, r5 = battle object (this), r7
  = scratch clobbered through call but preserved by this fn, r10 in/clobbered, lr in; out: clobbers r0,r1,r2,r3,r5,r6,r8,r9,r10,r11,r12,
  lr, NZCV; preserves r4, r7'
details: "Per-frame update for a battle object driving its collision region. Strips existing collision data via\
  \ object_removeCollisionData, then regenerates effects via object_spawnCollisionEffect. Bails out to a teardown\
  \ path (clears the collision region with object_clearCollisionRegion and writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized)\
  \ when any of these hold:\n  * battle_isBattleOver returns nonzero (battle has ended)\n  * (oBattleObject_CollisionDataPtr\
  \ -> oCollisionData_FlagsFromCollision) & 0xFF800000 is set — \"still colliding / locked\" bit mask that forces\
  \ an early-out\nOtherwise loads oBattleObject_CurAction as an index into the jump table at off_80C9504 (single\
  \ entry battle_BDT_update2_80c950c+1, Thumb+1 dispatch), passing the collision data pointer in r7 and the action\
  \ index in r0, and tail-calls through it. After the dispatched handler returns, it runs object_isCurrentPanelValid;\
  \ if invalid, teardown; otherwise object_presentCollisionData + object_highlightCurrentCollisionPanels and return.\
  \ The asm preserves r4 and r7 across the body even though r7 is reused as the collision pointer (R7 arrives as\
  \ input per the lifter but is saved/restored around the routine).\n\nRegister form, old prompt; queued for retype\
  \ (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
