- The r4 contract claim (r4 as a preserved input across the call) may be a quirk of the lifter's caller analysis
  rather than a real input; r4 is only pushed/popped here, never explicitly read or written, suggesting it is preserved,
  not meaningful.
- Whether 0xFF800000 on oCollisionData_FlagsFromCollision represents a generic "collision already resolved" sentinel
  or is action-specific — covered by being a teardown shortcut before the action handler runs.
- off_80C9504 currently has only one entry (battle_BDT_update2_80c950c+1); whether later BN6 patches or other actions
  share this routine is unknown.
- The exact semantics of "still colliding" flag mask 0xFF800000 versus a "panel-invalid / on-end" bit semantics
