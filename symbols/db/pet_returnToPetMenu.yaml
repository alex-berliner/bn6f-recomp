name: pet_returnToPetMenu
address: '0x08136D8C'
kind: function
status: probable
summary: 'Ends the Beast+ scenario: sets completion event flags, zeroes its 16-byte work area, loads scenario
  assets, then resets game state to 0x28 and restores the PET menu.'
interface: () -> void; sets flags via SetEventFlagFromImmediate, clobbers r0-r3
details: Sets two story flags (EVENT_F4 then EVENT_F2) marking the scenario's outcome, then zeroes the
  16-byte work buffer at byte_2009390 (likely the scenario's state/counter block). It runs a table-driven
  asset load (decompAndCopyData on off_8136EC8), calls pet_prepareMenuOnReturn_811F6C0 to restore the
  PET menu page/cursor, stores 0x28 into the byte at [r10,#0x34] (a global main-state field), and finally
  tears down the current mode and jumps main state to 0x28 with mainState_resetGameAndGoto28_8005524.
  The r10 store looks like the mode's own next-state field mirroring the state being entered.
