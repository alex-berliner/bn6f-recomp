name: battle_slideXStart
address: '0x080BBAEC'
kind: function
status: probable
summary: 'Initializes a battle object''s slide across the field: sets its X velocity toward the far edge
  and a Timer for how long the slide lasts.'
interface: (r5 = battle object) -> r0 = duration; writes oBattleObject_XVelocity and oBattleObject_Timer
details: 'Calls object_getFrontDirection to get the +1/-1 facing multiplier and writes multiplier*0x40000
  (4.0 px/frame in 16.16 fixed point) into oBattleObject_XVelocity. It then computes the distance to the
  far edge column of the 0..7 field: 7 - PanelX for Alliance 0, else 0 - PanelX, taking the absolute value.
  That panel count is scaled by 40 px per panel in 16.16 (r2 = 0x28 << 16 = 0x280000) and divided by the
  velocity constant 0x40000 via SWI 6, yielding 10 frames per panel, which is stored in oBattleObject_Timer.
  The caller battle_slideXMovePhase ticks this Timer each frame and ends the action when it expires, so
  this function is the setup phase of the same slide movement.'
