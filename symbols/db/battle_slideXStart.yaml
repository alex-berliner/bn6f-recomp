  date: '2026-10-19'
  detail: bl object_getFrontDirection then mul r0,r1 (=0x40000) and str to oBattleObject_XVelocity sets
    slide speed from facing; ldrb PanelX; sub from 7 or 0 based on Alliance; neg if <0 computes signed
    distance to far edge column; r2 = 0x28<<16 = 0x280000 (40 px/panel in 16.16) and svc 6 Div by 0x40000
