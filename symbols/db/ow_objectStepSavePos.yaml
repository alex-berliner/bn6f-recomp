name: ow_objectStepSavePos
address: '0x0813594C'
kind: function
status: probable
summary: Saves an overworld object's current position into its previous-position fields, conditionally
  runs a follow-up step, and clears a counter byte.
interface: (r0-r4 unused; r5 = object struct pointer, set by caller) -> r0 clobbered; no meaningful return
details: 'Copies the halfword at r5+0x28 to r5+0x2A and r5+0x2C to r5+0x2E, i.e. the familiar pattern
  of stashing current X/Y into ''previous X/Y'' slots before something moves the object. It then tests
  the byte flag at r5+0x0D: if it is zero, it calls sub_813612C (unknown callee, likely the actual movement/state-advance
  work); if the flag is set the call is skipped. Finally it stores 0 into the byte at r5+0x13, which looks
  like a per-frame counter, delay, or substate being reset each step. With no callers or known callees,
  the exact game role (movement tick vs. animation/waypoint step) can''t be pinned down.'
