  date: '2026-10-20'
  detail: bn6f/asm/asm38.s:310 _SetInterruptCallback writes a function pointer into the table at an index
    supplied in r0.; bn6f/asm/asm38.s:276 sub_3005DA0 copies initialized callback entries through the
    table, advancing four bytes per entry.; bn6f/asm/asm38.s:94 sub_3005B00 loads a callback from an index
    derived from r12 and branches to it.; bn6f/asm/main.s:413 main_static_8000570 associates off_3000E70
    with the interrupt callback table.; bn6f/asm/asm38.s:318 _SetInterruptCallback and asm38.s:117 expose
