name: iInterruptCallbackTable
address: '0x03000E70'
kind: data
status: probable
summary: 'Proposed name: iInterruptCallbackTable. IWRAM table of interrupt-handler callback pointers,
  indexed by interrupt source number. (table of what)'
details: This is an IWRAM array of 32-bit interrupt callback pointers. _SetInterruptCallback writes a
  callback at a caller-selected index, while sub_3005DA0 initializes the entries from the interrupt dispatch
  jump table. sub_3005B00 reads the callback selected by the interrupt source and branches to it; the
  main LCD interrupt table also identifies this array as the interrupt-callback storage. The uses support
  naming it as the interrupt callback table rather than a single callback variable.
