name: initAreaScene
address: '0x081326D4'
kind: function
status: probable
summary: 'Scene-entry init: zero-fills BG tile buffer, resets and respawns eStructArr2008450 records,
  decompresses BG/sprite asset chain, runs three local setup helpers, clears a state byte at r5+0x48,
  then triggers a screen fade.'
interface: () -> void; r5 = scene/GUI state base whose +0x48 flag byte is cleared
details: Zero-fills the toolkit's BG tile buffer, then resets the eStructArr2008450 record array and re-spawns
  objects from a 0xFF-terminated (id,slot,param) table at byte_81326C8 via battle_spawnEStructRecordsFromTable_80465A0.
  It decompresses a chain of assets (comp_86DBD94/DBB0C/DBD64/DBD7C/DB0F8/87E6924) through the shared
  eDecompBuffer2013A00 into BG tilemap/tile VRAM (0x6010600), the two eGuiSprite buffers 2022AA0/2022FA0,
  and small IWRAM blocks 0x3001550/0x3001570 — i.e. BG palette/map and sprite graphics for the scene.
  sub_811AE7C(1,0) and the three local helpers 813281C/81328C0/8132980 finish scene state setup, then
  a byte at r5+0x48 is cleared and SetScreenFade(8,0) starts a fade, so the function runs once when the
  area (re)loads.
