name: setFlagByteTrue_8118424
address: '0x08118424'
kind: function
status: confirmed
summary: Writes 1 to the flag byte pointed to by r5, acting as a tiny "set to true" callback.
interface: void sub_8118424(u8 *flag /* in r5 */) // returns r0 = 1, nz flags set from the mov r0,
details: 'Pushes lr, stores the immediate value 1 to the byte at [r5], and returns. R5 is treated as a pointer to
  a single flag/boolean byte rather than a struct field, so the function is likely used as a generic "mark done
  / set true" callback passed to some dispatcher (e.g. a menu, dialogue, or cutscene controller) that keeps the
  target byte in r5 across the call. It also leaves r0 = 1 and the nz flags set from the same mov, so callers that
  fall through to conditional branches afterwards see a "true/1" result; whether any caller relies on that side
  effect is unverified.

  '
