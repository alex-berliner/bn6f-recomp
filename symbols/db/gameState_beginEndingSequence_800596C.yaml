name: gameState_beginEndingSequence_800596C
address: '0x0800596C'
kind: function
status: confirmed
summary: Kicks off the ending sequence — sets the finale story event flags, starts a screen fade, ticks the countdown
  timers, and switches the game state machine to the ending subsystem.
interface: void sub_800596C(GameState *self /* r5 */); sets NZ from the final movs r0,#0x10, leaves C/V from timer_tickCountdownTable_8035738
details: 'Runs with the GameState pointer in r5 (preserved). Steps in order: sets event flag EVENT_1703 (group 0x17,
  bit 3) and EVENT_1738 (group 0x17, bit 0x38) via SetEventFlagFromImmediate — the pair of finale story flags for
  the version''s ending route; calls SetScreenFade(0xC, 0x10) to fade the screen out (fade kind 0xC at speed 0x10);
  calls timer_tickCountdownTable_8035738 to advance the countdown timer table; then stores 0x10 into GameState at
  offset 0 (oGameState_SubsystemIndex), handing control to subsystem 0x10 of the game state machine, which dispatches
  through cbGameState_80050EC to sub_800536E. The final `movs r0,#0x10` sets N=0/Z=0 as a side effect callers may
  observe.

  '
