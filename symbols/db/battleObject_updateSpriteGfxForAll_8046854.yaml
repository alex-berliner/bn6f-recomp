name: battleObject_updateSpriteGfxForAll_8046854
address: '0x08046854'
kind: function
previous_names:
- sub_8046854
status: probable
summary: Iterates the 6 (0..5) battle-object sprite slots at byte_2011860 and, for each whose object-header
  flag bit 0x02 is set, refreshes palette, anim-frame tiles and queues frame-piece sub-8002694
interface: () -> r0 = 0 (always returns 0 in r0; no other return; all caller-saved regs trashed)
details: "Iterates 6 sprite slots: r5 = base ptr byte_2011860, r7 = 0..5.\n  Each iteration adds 0x58\
  \ to r5 to step through entries.\n  Loads byte at [r5] into r0 and tests bit 0x02 (tst r0, #2). Only\
  \ when that bit is set\n  does it call the refresh helpers. So the byte is a per-slot \"needs gfx refresh\"\
  \ flag\n  (or equivalently the OBJECT_FLAG_VISIBLE / 0x02 from ObjectHeader, since the slot's\n  first\
  \ byte is the header flags).\n  The inner block (still per-slot, after checking flag):\n    - calls\
  \ sub_804692C with r5+0x20 (the sprite sub-struct). Result bits tested:\n        bit 0x40 -> skip; bit\
  \ 0x80 -> skip palette; fall through loads palette.\n        bit 0x20 set -> sprite_loadAnimFrameTiles_8002874(r5+0x20).\n\
  \    - finally calls sub_8002694(0, 0, r5+0x20) which is the queueFramePiecesVia helper.\n  Layout:\
  \ r5+0x20 is the ObjectSprite sub-struct (per BattleObject at loc=0x80 or\n  OverworldNPCObject at loc=0xa1).\
  \ The 0x58 stride matches an OverworldMapObject\n  (0x78-0x20=0x58? actually 0x78 size) or perhaps a\
  \ sprite descriptor table of 6\n  entries each 0x58 bytes; combined with the 0x20 offset, this looks\
  \ like a\n  per-battle-actor sprite table. Given callers include 0x0814xxxx (beast-out / form-\n  change\
  \ area, see snap_beastsp_* captures) and cb_8038AD0 (battle core), this is\n  most likely a per-actor\
  \ sprite-table refresh.\n  Function saves r4-r7, r8/r9/r12 and returns 0 in r0 with all flags/Z cleared.\n"
