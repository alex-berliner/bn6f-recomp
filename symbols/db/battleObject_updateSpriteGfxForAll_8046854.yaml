open_questions:
- The exact structure behind byte_2011860 (per-actor sprite table of 6 0x58-byte entries?)
- isn't in the provided struct defs. sub_804692C's bit meanings (0x40/0x80/0x20) are
- inferred from control flow; their semantic role ("no change" / "skip palette" /
- '"tiles dirty") would be confirmed by reading sub_804692C. Whether the gate byte'
- bit 0x02 corresponds to OBJECT_FLAG_VISIBLE (0x02 in ObjectHeader.Flags) or a
- separate "needs gfx refresh" flag is also not fully resolvable without seeing how
- the byte is set elsewhere.
