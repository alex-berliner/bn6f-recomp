name: spawn_t1_0x0_EffectObject
address: '0x080E05F6'
kind: function
status: confirmed
summary: Thin wrapper that spawns a type-4 battle object with effect type 0 and returns the spawned object pointer.
interface: Next battle_spawnEffectObject_effect0(u32 effectType0 /* forced to 0 */, u32 arg1, u32 arg2, u32 arg3,
  /* r5 */ BattleCtx* ctx);
details: 'Trivial wrapper around object_spawnType4: it forces r0 (the effect/type argument) to 0,

  tail-invokes object_spawnType4 with the caller''s r1-r3 and the r5 context pointer untouched,

  then returns whatever object_spawnType4 left in r5 (the spawned object or result value).

  The final "mov r0, r5" is encoded as ADDS r0, r5, #0, so the returned value also sets the

  NZ flags (Z set iff the result is 0) - callers that check zero/nonzero on return rely on this.

  r4-r7 and the caller''s r5 are preserved (r5 is pushed/popped around the call).

  Nothing else is touched directly; all structure access happens inside object_spawnType4.

  '
