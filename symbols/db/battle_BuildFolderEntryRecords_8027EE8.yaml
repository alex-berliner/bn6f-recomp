name: battle_BuildFolderEntryRecords_8027EE8
address: '0x08027EE8'
kind: function
status: confirmed
summary: Fills 12-byte records with pointers to each chip entry in the battle folder (eBattleFolder), writing up
  to a caller-given slot limit.
interface: void sub_8027EE8(FolderRecord* dst /*r4*/, FolderHeader* src /*r5*/, u32 maxSlots /*r6*/); returns r2=0,
  r3=0 on success; on early-out r3 holds the folder's entry count byte
details: 'Reads the entry count from byte [r5,#5] of the source folder header. If the

  count is 0 or the slot limit (r6) is 0, it does nothing and returns (r3

  keeps the count byte read). Otherwise the count is clamped to r6 (i.e. at

  most maxSlots records are written), and for each entry it writes a 12-byte

  record: a zero byte at +0 (not an index — it is always 0, even for later

  entries) and a word at +8 pointing to the entry''s 2-byte slot inside

  eBattleFolder (&eBattleFolder[0], &eBattleFolder[1], ... stepping 2 bytes

  per record). The other 7 bytes of each 12-byte record are left untouched.

  r4 is used only as the initial destination pointer and is preserved via

  push/pop; the record walk happens in a local pointer. r2 and r3 both end

  at 0 after a successful fill. eBattleFolder is the player''s battle folder

  of chips (2 bytes per entry, likely chip ID + data).

  '
