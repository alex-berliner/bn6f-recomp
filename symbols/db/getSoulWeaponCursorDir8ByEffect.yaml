name: getSoulWeaponCursorDir8ByEffect
address: '0x08142B58'
kind: function
status: probable
summary: 'Walks the 20-entry, 8-byte-stride table at byte_2006670 twice: first matching entries whose ID equals
  the current scenario effect''s 0x18 field, then matching via sub_8142990/sub_814299C validation, returning the
  matching entry''s 8-way direction from getSoulWeaponCursorDir8, or 0xFF if none.'
interface: () -> r0 = direction 0-7 of the matching soul-weapon cursor, or 0xFF if no entry matches; calls only,
  no flags of interest
details: Walks an array at byte_2006670 with 8-byte stride and up to 0x14 entries, where the halfword at +4 is an
  ID (0 terminates the scan). In the first loop it fetches a value via getField0x18OfScenarioEffectState2000780_81421e0
  (the current scenario-effect's 0x18 field, used as an ID) and, when it equals the entry ID, calls getSoulWeaponCursorDir8
  on that entry and returns the result. If nothing matched, a second identical loop instead validates each entry
  through sub_8142990/sub_814299C and likewise returns that entry's 8-way direction. The default return is 0xFF
  when no entry qualifies.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrh r1,[r5,#4] / cmp r0,r1 (loc_8142B60 loop): entry halfword at +4 compared against the scenario-effect
    0x18 field; bl getSoulWeaponCursorDir8 / mov r6,r0: matched entry''s camera-space 8-direction becomes the return
    value; two loops with cmp r4,#0x14 and add r5,#8: fixed table of 20 x 8-byte records at byte_2006670; mov r6,#0xFF
    entry and mov r0,r6 exit: 0xFF is the not-found default; caller sub_808991C and callee getSoulWeaponCursorDir8
    tie the table to soul-weapon cursor positions'
