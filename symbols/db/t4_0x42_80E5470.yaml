name: t4_0x42_80E5470
address: '0x080E5470'
kind: function
status: confirmed
summary: Per-tick update for a type-0x42 battle object — dispatches to its state handler (init panel mover / per-state
  behaviour / free), then updates the object's sprite.
interface: void battle_type42Tick_80E5470(r5=battleObject, r10=callerContext) — object pointer in/out via r5 (as
  left by object_updateSprite); state handler's r0 return propagates implicitly
details: "Standard per-tick \"type\" dispatcher for a battle object of type 0x42 whose\npointer is kept in r5. It\
  \ reads the object's CurState byte\n(oBattleObject_CurState) and uses it directly as a byte offset into the\n\
  handler table at off_80E5488 — the game stores state values 0/4/8 in\nCurState so they index a table of 32-bit\
  \ Thumb addresses without a shift.\nThree states exist:\n  state 0 -> battle_initPanelMover (spawn/initialise\
  \ the panel-mover behaviour)\n  state 4 -> sub_80E54DC (the active per-tick behaviour, not yet named)\n  state\
  \ 8 -> object_freeMemory (release the object)\nThe chosen handler is tail-called via bx with lr set to pc so the\
  \ handler\ncan return; the handler runs with r0 = CurState and r5 = object and keeps\nthe object pointer in r5.\
  \ When the handler returns, object_updateSprite is\ncalled with r5 = object to run the shared sprite animation\
  \ update, and this\nfunction then returns to its caller. r10 is passed in and left untouched\n(caller context);\
  \ r8-r12 on exit are whatever the callees left, so callers\ntreat them as scratch.\nQuirk: CurState doubles as\
  \ both the state identifier and a byte offset into\nthe word-sized handler table (states are spaced 4 apart),\
  \ so any new state\nmust be stored as 0/4/8 rather than 0/1/2.\n"
