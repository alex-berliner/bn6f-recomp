name: clearScratchBuffer_2034F60_8019FA4
address: '0x08019FA4'
kind: function
status: confirmed
summary: Zero-fills the 0xA0-byte scratch buffer at 0x2034F60, leaving r2/r3 untouched for the caller.
interface: (void) -> void; inputs r2, r3 (preserved verbatim), lr; outputs r2 (passed back through); clobbers r0,
  r1, lr, flags
details: 'Tail-less wrapper around ZeroFillByWord: loads the fixed address unk_2034F60 into r0 as the

  memory block, sets r1 to 0xA0 (160 bytes = 40 words), calls ZeroFillByWord to word-fill the

  range with zero, then pops pc to return. The lifter''s caller analysis shows every caller

  passes values in r2/r3 that must survive the call (ZeroFillByWord clobbers r0/r1 but this

  wrapper''s contract preserves r2/r3), and the caller reads r2 back afterwards — so r2 is

  effectively both an input and an output that this function transparently passes through.

  The 0x2034F60 buffer is a fixed work area in IWRAM; the purpose of the caller''s r2/r3

  payload is not visible from this function alone.

  '
