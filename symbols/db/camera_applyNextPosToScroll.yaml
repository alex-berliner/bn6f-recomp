name: camera_applyNextPosToScroll
address: '0x08030104'
kind: function
status: probable
summary: Converts oCamera_nextX/nextY fixed-point follow position to integer, applies offsets (+0x88 X,
  +0xB0 Y), and stores to oCamera_ScrollX and oCamera_CameraYInt.
interface: (r5 = oCamera struct pointer) -> void; writes oCamera_ScrollX and oCamera_CameraYInt
details: Reads oCamera_nextX_3c and oCamera_nextY_40 (fixed-point, arithmetic shift right 16 to get the
  integer part), adds 0x88 to X and 0xB0 (0x80+0x30) to Y, then halfword-stores the results into oCamera_ScrollX
  and oCamera_CameraYInt. It is a leaf function operating entirely through the camera struct in r5, which
  is evidently set up by the caller. The offsets suggest the scroll registers are relative to a tracked
  entity's on-screen position rather than absolute map coordinates.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: asr r4,#0x10 on oCamera_nextX_3c/nextY_40 shows the fields are fixed-point and only the integer
    part is used; constants 0x80+8 and 0x80+0x30 are added before storing to oCamera_ScrollX and oCamera_CameraYInt;
    the function is a leaf writing only two halfword fields of the oCamera struct, so it is a pure coordinate-update
    step
  refs:
