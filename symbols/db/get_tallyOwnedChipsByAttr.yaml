    run wf investigate investigate-20261019-030611'
open_questions:
- What the records at dword_203300C actually are (presence flags vs. owned-counts) — caller sub_80AAC8C
  would confirm
- Whether ChipData byte 5 is element or class; only 6 counters are cleared so values above 5 would write
  uncleared memory
- What UI/system uses the counts (library stats vs. order-system requirements)
