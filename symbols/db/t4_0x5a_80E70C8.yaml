name: t4_0x5a_80E70C8
address: '0x080E70C8'
kind: function
status: confirmed
summary: Per-frame update for a battle object — dispatches its state handler, then advances (or freezes) its sprite
  animation for this frame.
interface: void t4_0x5a_80E70C8(BattleObject* object /* r5 */) -> r5 = object; r8-r12 = whatever the state handler
  leaves; clobbers r0-r4, r6, r7, flags
details: 'Trampoline-style per-frame step for one battle object, reached as a task (task type 4, id 0x5a). Loads
  the object''s oBattleObject_CurState byte and uses it directly (unscaled) as an index into the word table at off_80E70EC,
  which holds three handlers: battle_restoreBaseSprite (state 0 — reset the sprite back to its base graphic), sub_80E7142
  (state 1 — object-specific behavior, not yet named), and object_freeMemory (state 2 — free the object, likely
  its death/cleanup state). The call is made with the state byte in r0 and the table entry in r1, r5 still holding
  the object pointer. After the handler returns, it re-reads the object and checks oBattleObject_Param1: if zero
  it calls object_updateSpritePaused (sprite animation advances normally for this frame), otherwise object_updateSpriteTimestop
  (animation is stepped under timestop rules, i.e. frozen while time is stopped). r5 (the object pointer) is preserved
  through the whole function, which is how the contract reports it as both an input and an output.'
