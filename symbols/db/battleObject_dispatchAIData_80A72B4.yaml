open_questions:
- Whether r5 is really an AIData* vs some other struct that happens to put a meaningful byte at offset
  8 is not fully pinned from this snippet alone (offset 0x8 = CurState in BattleObject but BLeftAbility
  in AIData — needs a caller-side check). Whatever its type, the selector byte is at +8.
