name: ow_getPlayerPosition
address: '0x0809E1BC'
kind: function
status: confirmed
summary: Returns the overworld player object's X/Y/Z position from the current game state.
interface: void ow_getPlayerPosition(void* toolkit /* r10 */, out int* x /* r1 */, out int* y /* r2 */, out int*
  z /* r3 */)
details: 'Follows toolkit->gameState (oToolkit_GameStatePtr) -> overworld player object (oGameState_OverworldPlayerObjectPtr),
  then loads the player object''s position fields at offsets 0x1C (X), 0x20 (Y) and 0x24 (Z) directly into r1, r2
  and r3 and returns. Pure getter: no state is modified, no flags are set, and r0 is left untouched. The player
  object pointer must already be valid (overworld active); a null pointer here would fault. Tail-called via mov
  pc, lr, so the caller must not expect lr preservation semantics beyond that.

  '
