name: ow_getPlayerPosition
address: '0x0809E1BC'
kind: function
status: probable
summary: Returns the overworld player object's three position coordinates (fields 0x1C, 0x20, 0x24) in
  r1-r3.
interface: (no inputs; r0 ignored) -> r1 = player obj +0x1C (X), r2 = player obj +0x20 (Y), r3 = player
  obj +0x24 (Z/height); clobbers r1-r3, preserves r0
details: Loads r10's toolkit pointer, reads GameStatePtr, then OverworldPlayerObjectPtr, and pulls three
  consecutive longwords starting at offset 0x1C of the player object. The three values are almost certainly
  the object's 3D/position coordinates, since the caller ow_applyCutsceneDirOffset adds a cutscene-direction-dependent
  pixel offset (32/64/96 along one axis) to the three values it receives. The function ignores its r0
  argument entirely; the player object is always taken from the global game state. No other fields are
  touched and no calls are made.
