name: sub_80E0684
address: '0x080E0684'
kind: function
status: confirmed
summary: Kicks the battle into a screen-fade transition (picking fade kind from current battle state/effects), then
  advances the BattleObject's phase to 4 once the fade finishes.
interface: void sub_80E0684(void);  // r5 = BattleObject*, r10 = toolkit/BattleState ptr; // clobbers r0-r3; flags
  NZCV trashed; lr trashed; r5 preserved.
details: "Lives inside the per-frame BattleObject dispatcher (called with the object pointer in r5\nand a battle\
  \ toolkit/state pointer in r10). The struct offsets oBattleObject_PhaseInitialized\nand oBattleObject_CurPhaseAndPhaseInitialized\
  \ are reused as a simple init / state machine:\non first entry it picks a fade kind, stores 4 into oBattleObject_PhaseInitialized\n\
  (a \"phase-init done, polling\" sentinel distinct from the phase count), sets a global byte\n(byte_2036740) to\
  \ 1, and waits for IsScreenFadeActive() to clear. When the fade completes\nit ORs state flags 5c with 0x1 (clearing\
  \ the 0x10 \"fading\" bit that was set at entry) and\nwrites 4 into the low byte of oBattleObject_CurPhaseAndPhaseInitialized\
  \ to advance phase.\n\nFade-kind selection:\n  * If GetBattleEffects() & 0x400:\n      - fade_kind = (state_addr->unk_1a\
  \ > 1) ? 8 : 0;\n  * Else:\n      - fade_kind = (BattleSettings[5] >= 2) ? 8 : 0;\nFade color is fixed to 0x10.\
  \ Both branches take SetScreenFade(fade_kind, 0x10), so the\nif/else just decides between kind 0 and kind 8. oBattleState_Unk_1a\
  \ and the\noBattleState_BattleSettings+5 byte are not yet named.\n"
