open_questions:
- What are oBattleState_Unk_1a and the byte at oBattleState_BattleSettings+5? They look like "battle sub-mode /
  order" flags, but their meaning is not in this routine.
- What does byte_2036740 gate? It is unconditionally set to 1 here and lives outside the BattleObject, so something
  else probably reads it.
- Why is the 0x10 bit set/cleared around the fade via battle_orStateFlags5c_8001382? Are those the actual "fade
  in progress" bits?
- Is the special value 4 written to oBattleObject_PhaseInitialized intentional or an aliasing with oBattleObject_CurPhaseAndPhaseInitialized's
  low byte? It effectively marks "fade-init ran", and the eventual phase bump writes 4 again to the halfword.
