name: battle_scrollAccumulateStep_8031176
address: '0x08031176'
kind: function
previous_names:
- sub_8031176
status: probable
summary: Computes a per-step scroll delta for a battle object against a 16.16 fixed-point world offset,
  then nudges its sprite by the camera scroll amount.
interface: '(r0 = object*) -> r0 = sprite worldToScreenPos result ; side effects: writes two 16.16 scroll
  deltas to dword_200F3E0+0x18/0x1c and converts the object''s sprite via sprite_worldToScreenPos_80310EC'
details: "r6 = r0 (the object pointer); loads dword_200F3E0 (a render/scroll state struct) into r0.\n\
  \  Reads the object's world coords (r6+0x0, r6+0x4 = X, Y) and subtracts the render state's offset at\
  \ +0xc/+0x10 (probably render camera X/Y), writing the differences back into render_state+0x18/+0x1c\
  \ as 16.16 deltas.\n  Then handles the equal negative case: if both deltas are negative and equal, keep\
  \ them; otherwise zero them.\n  Tail-calls sprite_worldToScreenPos_80310EC with the object, which adjusts\
  \ the sprite by the accumulated scroll. This is the per-object step of an object-nudge scroll that sub_8031478\
  \ (camera scroll during battle transitions) drives.\n"
