name: sound_eeMixEcho
address: '0x0814DC94'
kind: function
status: probable
summary: 'm4a mixer echo blend: sums the current and delayed 8-bit PCM samples, multiplies by an 8.9 fixed-point
  gain with ASR 9 and a bit-7 round, then writes the byte back to both tap positions.'
interface: (r0 = sound buffer base, r3 = gain coefficient 8.9 fixed point, r5 = current PCM buffer, r6
  = delay phase offset, r8 = sample count, r4 = mode/reverb select) -> filtered bytes written back to
  r5 (and r7 buffer); falls through into sub_814DCE8
details: Called only from SoundMainRAM (the Sappy mixer resident at IWRAM 0x03005700), this is a chunk
  of the mixer's post-processing, not game logic. Per sample it computes (buf[r6] + buf[0] + echo[r6]
  + echo[0]) * r3 with an ASR 9 shift, i.e. a ~1/512 fixed-point gain, rounding up on bit 7, and stores
  the same byte to both buffer positions. r7, the secondary (echo) buffer, is r0+0x350 when r4==2 (a fixed
  0x350-byte reverb buffer inside the sound work area), otherwise r5+r8. The r5 pointer post-increments
  through the buffer while r6 indexes the delayed tap, then control continues at the next block via adr/bx,
  so sub_814DCE8 is just the continuation of the same mixer routine. Byte-sized strb/ldrsb access confirms
  the 8-bit m4a PCM buffers.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrsb/add of four byte taps (loc_814DCA4) then mul r1,r0,r3; ASR #9; round on bit 0x80 — classic
    m4a fixed-point reverb/feedback filter; cmp r4,#2 / addeq r7,r0,#0x350 picks a dedicated 0x350-byte
    buffer inside the sound work area, else r7=r5+r8; strb r0,[r5,r6] and strb r0,[r5],#1 write the result
    back into both the tapped and live sample slots; caller SoundMainRAM at 0x0814DC88 is the m4a mixer
    copied to IWRAM, and adr r0,(loc_814DD16+1); bx is an in-place tail jump to the next mixer block;
    adr/bx into sub_814DCE8 shows it is one continuous mixer routine split for labeling, not an independent
    call'
  refs:
  - bn6f/asm/libs.s:21090
  - 0x0814DC88 SoundMainRAM
  - 0x0814DD16 sub_814DCE8
  reproduce: python3 tools/asmcat.py 0x0814DC94
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the description: ldrsb at loc_814DCA4 confirms 8-bit PCM, r7 is set to r0+0x350
    when r4==2 else r5+r8, and the per-sample formula (buf[r6]+buf[0]+echo[r6]+echo[0]) * r3 ASR 9 with
    the bit-7 rounding matches. The tail adr/bx into sub_814DCE8 also confirms the fall-through. However,
    this is a per-sample echo sum (wet/dry blend with delay), not a ''reverb filter'' — there''s no feedback
    iteration across taps, just a one-shot mixing of current and delayed sample. ''sound_eeMixEcho'' is
    more accurate.; run wf investigate investigate-20261019-030611; proposed by Hyper glm-5.3-flash, revised
    by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
