name: sub_81176D0
address: '0x081176D0'
kind: function
status: confirmed
summary: Plays three sound events for a battle object, selecting the object-specific attribute via one of three
  getter routines and advancing a ROM-table sound-ID base by 0x80000 each step.
interface: 'r5 in (battle-object pointer); r0 out = 0x80000; flags: Z=1,N=0,C=1,V=0 from CMP r6,3; r4-r7 preserved'
details: 'Reads the object''s type byte at offset 4, indexes into a 2-entry-per-type ROM table at byte_8117724 (type
  0x54-0x58, i.e. 5 types, 4 bytes each = two u16s packed into a u32 sound base). Loops three times (r6 = 0,1,2):
  calls the getter at off_8117740[r6] (case 0 = battle_getObjectPairOddByteClamped8_811774C, cases 1-2 = sub_8117764
  / sub_8117768) passing r5, packs the u32 result OR''d with fixed flags 0xA000 | 0x800 into a u16 attribute, then
  calls sub_802FE28(sound_base, packed_attr, 0, 3) to enqueue the sound. After each call the sound_base upper half
  is incremented by 0x00080000 so the three iterations play three consecutive sound events for the same object type.
  Leaves r0 = 0x80000 (the last add''s left-hand value before pop).'
