open_questions:
- 'The r1 passed to SetCustGauge: the code does `mov r0,r1` then `mul r0,r2`, so r0 ends up holding'
- (MaxHP-HP)*charge; r1 going into SetCustGauge is whatever the previous step left (likely MaxHP-HP,
- the original r1). SetCustGauge's actual parameter roles aren't known, so whether this represents
- '"fill amount vs max" or "current vs target" is inferred from context. Also only one AI state entry'
- (sub_8116758) is referenced in the table; other states are unknown.
