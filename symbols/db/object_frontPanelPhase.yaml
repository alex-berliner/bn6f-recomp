name: object_frontPanelPhase
address: '0x080E7668'
kind: function
status: probable
summary: 'Battle-object phase: on entry, test the panel in front via object_checkPanelParameters and call
  sub_80DB2C6 on match, then idle 60 frames before advancing CurAction to 0xC.'
interface: (r5 = battle object) -> sets oBattleObject_Timer=60, oBattleObject_PhaseInitialized=4 on entry;
  after 60 frames sets oBattleObject_CurAction=0xC, oBattleObject_CurPhaseAndPhaseInitialized=0; no return
  value used
details: Runs as a per-frame update for a battle object held in r5. On the first frame (PhaseInitialized==0)
  it gets the object's facing (+1/-1 via object_getFrontDirection), reads an 8-byte per-alliance table
  at byte_80E76C4 (both alliances get mask words 0x10 and 0x0F880080), and calls object_checkPanelParameters
  on (PanelX+frontDir, PanelY) to test the panel ahead. If the panel state matches, it calls sub_80DB2C6
  passing the object's Element, Params, DamageAndStaminaDamageCounterDisabler and RelatedObject1Ptr (with
  the object itself pushed as a 5th arg). It then sets Timer=0x3C and PhaseInitialized=4; each subsequent
  frame decrements Timer, and when it expires the object moves to CurAction=0xC with phase reset. The
  identical two 8-byte table entries mean front/enemy objects check the same panel condition.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_PhaseInitialized]; bne loc_80E76AC — one-time init then per-frame
    timer wait; bl object_getFrontDirection; add r0,r0,r1 (PanelX) — computes the panel coordinate in
    front of the object; ldr r2/r3 from byte_80E76C4 indexed by Alliance<<3, then bl object_checkPanelParameters
    — panel flag-mask test, table identical for both alliances (0x10 / 0x0F880080); ldr r2 Element / r4
    Params / r6 Damage... / r5 RelatedObject1Ptr; bl sub_80DB2C6 — conditional action on the matching
    panel; mov r0,#0x3C; strh Timer; ... mov r0,#0xC; strb CurAction — 60-frame delay then transition
    to action 0xC
