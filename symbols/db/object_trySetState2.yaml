name: object_trySetState2
address: '0x080F8E90'
kind: function
status: probable
summary: Attempts to switch an object's AI state to 2 when it is idle, returning success
interface: (r0 = pointer to a handle whose [r0] points to an object) -> r0 = 1 if state 2 was set, 0 if
  object missing or busy; flags clobbered
details: Dereferences the pointer at [r0]; if NULL it returns 0. If the object's byte at offset +9 is
  zero (interpreted as 'not busy/idle'), it stores 2 into the object's byte at +7 (its AI state/action
  selector) and returns 1; otherwise it returns 0 without changing anything. The caller passes a scratch-stored
  object pointer from AI attack vars and, on success, starts a 0x10-frame step timer and moves its own
  attack state to 4, i.e. it waits for this call to succeed before advancing, retrying each frame while
  the target object is busy.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_80F8E90: ldr r2,[r0]; tst/beq returns 0 for null object pointer; sub_80F8E90: ldrb r0,[r2,#9];
    cmp/bne skips the write, gating on the +9 flag; sub_80F8E90: mov r0,#2; strb r0,[r2,#7]; mov r1,#1
    — writes state 2 and returns success; caller 0x080F8C2C: bl sub_80F8E90; tst/beq retries, on success
    sets StepTimer=0x10 and AttackElement=4; ScratchVar passed as r0 is a pointer (function does ldr r2,[r0]),
    consistent with an object/handle reference'
