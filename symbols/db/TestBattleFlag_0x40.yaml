name: TestBattleFlag_0x40
address: '0x0802E09A'
kind: function
status: confirmed
summary: Tests whether the 0x40 bit of the current battle flags word is set, returning the masked result so callers
  can branch on it directly.
interface: int battle_testFlag0x40(u32 ctx /* passed in r10, forwarded to battle_getFlags */); returns nonzero (the
  masked 0x40 bit) in r0 when the flag is set, 0 otherwise; also sets NZ flags from the result; r1 clobbered
details: Thin test wrapper around battle_getFlags. It calls battle_getFlags (forwarding whatever context callers
  keep in r10, presumably the battle state pointer that getter expects), ANDs the returned flags word with 0x40,
  and returns the result. Because it sets NZ flags from the masked value before popping, callers can use conditional
  branches on the return value without re-testing it. The 0x40 bit is one of several single-flag test helpers of
  this shape (each sibling presumably tests a different bit). No memory is touched beyond what battle_getFlags does;
  lr is saved/restored for the nested call.
