open_questions:
- What `sub_81205C0` produces in r0 (a packed OAM attribute, an anim ID, or a status bitmap) is not directly
  visible from this slice — it determines whether we draw or skip.
- The semantic of the indicator (damage pop-up vs status icon vs counter) is unclear; the +0xc offset
  doesn't obviously map to any named BattleObject field.
