  date: '2026-10-14'
  detail: '- `push {r4,lr}` / `pop {r4,pc}` at asm03_0.s:17030 show only r4/lr are live across the call,
    matching the contract. - `bl TestBattleFlag_0x40` (confirmed summary) + `beq locret_802E170` show
    the early-exit guard on bit 0x40 of the battle-flags word. - `mov r0, r10; ldr r0, [r0,#oToolkit_BattleStatePtr]`
    confirms r10 holds Toolkit and 0x18 is BattleStatePtr (from toolkit_struct offsets). - `ldrb r0, [r0,#oBattleState_Unk_0d]`
    reads byte 0x0d of BattleState (battle_state_struct loc=0xd). - `bl getEntryPtr_2036120_1D0_802E070`
    indexes the fixed-stride AI/record table at unk_2036120 with that byte. - `ldrh r0, [r0,#0x28]; bl
    SetCustGauge` reads the halfword at offset 0x28 of the AI entry and hands it to SetCustGauge (confirmed
    callee summary). - Captured calls all return r0=0 and Z flag set, with r0/r1/r2/r3 varying at entry
    — consistent with a void, side-effecting helper invoked from the main battle update loop (callers
    include battle_update_8007A44).'
