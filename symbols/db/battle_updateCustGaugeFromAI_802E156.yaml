name: battle_updateCustGaugeFromAI_802E156
address: '0x0802E156'
kind: function
previous_names:
- sub_802E156
status: probable
summary: If battle flag 0x40 is set, refreshes the custom-gauge display using the matched AI entry's CustomGauge
  field.
interface: '(no caller-visible inputs; uses r10 = Toolkit) -> no return value; side effects: may call
  SetCustGauge to refresh the custom gauge'
details: "Tests TestBattleFlag_0x40 and returns early if the bit is clear (push {r4,lr}; bl TestBattleFlag_0x40;\
  \ beq locret_802E170).\n  Otherwise loads r10 (= Toolkit) and reads Toolkit.BattleStatePtr (offset 0x18),\
  \ then dereferences the byte at oBattleState_Unk_0d (0x0d) of the resulting BattleState struct.\n  That\
  \ byte is the AI index handed to getEntryPtr_2036120_1D0_802E070, which returns the address of a 0x1D0-byte\
  \ AI/template record (r0=record, r1=array base) — the entry is saved in r4.\n  Reads the halfword at\
  \ record+0x28 (likely the 16-bit CustomGauge value or related gauge field) and forwards it to SetCustGauge,\
  \ which redraws the in-battle custom-gauge widget.\n  No return value; only r4 is preserved across the\
  \ call (r4 saved/restored, lr saved/restored via push/pop).\n  Callees suggest the function is the \"\
  Custom gauge sync\" step inside the per-frame battle update, gated by a flag so it only fires in certain\
  \ battle modes.\ninterface: (no caller-visible inputs; uses r10 = Toolkit) -> no return value; side\
  \ effects: may call SetCustGauge to refresh the custom gauge\n"
