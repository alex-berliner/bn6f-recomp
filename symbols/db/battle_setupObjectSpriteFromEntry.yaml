name: battle_setupObjectSpriteFromEntry
address: '0x0811B814'
kind: function
status: probable
summary: Looks up a sprite ID from the word_2023FA0 table for the entry selected by the caller and configures
  the current battle object's sprite (shadow flag, animation, animation data).
interface: (r5 = entry struct; byte [r5+4] = list index) -> void; sets up sprite state for the object
  resolved via battleObject_getByIndex
details: Computes an index as halfword [unk_2037780+0x24] + byte [r5+4] - 2, bounds-checked against halfword
  [unk_2037780+0x1e] (early return if out of range), then reads a halfword sprite ID from word_2023FA0[index*4]
  (4-byte-stride table). If the ID is 0x90 it calls sprite_setUnk0x2c(0x100000), otherwise sprite_setUnk0x2c(0);
  note r0 for the following battleObject_getByIndex call comes from setUnk0x2c's return, so that call
  likely returns the relevant object/handle. It then reads byte [obj+3] as the animation index, calls
  sprite_setAnimation, sprite_loadAnimationData, and sprite_noShadow, so the object always renders without
  a shadow. The 0x90 special case (0x100000 written to sprite field 0x2c) suggests one sprite ID needs
  a non-default value in that field before the animation is applied.
