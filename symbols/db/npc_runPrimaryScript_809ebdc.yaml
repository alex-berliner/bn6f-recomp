name: npc_runPrimaryScript_809ebdc
address: '0x0809EBDC'
kind: function
status: confirmed
summary: Executes an overworld NPC's primary bytecode script, dispatching each opcode through the NPC command jumptable
  until a terminate flag is set.
interface: '/* inputs:  R2, R5 (NPC obj pointer), R10, LR */

  /* outputs: R2, R5, R10, R11 (R5/R10 preserved across dispatcher) */

  /* clobbers: N Z C V, R0,R1,R3,R4,R6-R9,R12,LR */

  void npc_runPrimaryScript_809ebdc(void);

  '
details: "Infinite loop that drives an overworld NPC's primary command script.\nPer iteration:\n  1. Reads the byte\
  \ flag at R5+oOverworldNPCObject_TerminateScript_19;\n     if non-zero, exits the loop (returns to caller via\
  \ POP {PC}).\n  2. Loads the current script PC from R5+oOverworldNPCObject_AnimationScriptPtr\n     into R6 and\
  \ reads the opcode byte at [R6].\n  3. Indexes A_NPCCommandsJumptable by (opcode << 2) to fetch a handler\n  \
  \   address and tail-calls it via \"mov lr, pc; bx r7\". The handler is\n     free to advance R6 (consuming arguments)\
  \ or leave it for the next\n     iteration.\n  4. Writes R6 back to R5+oOverworldNPCObject_AnimationScriptPtr\
  \ and\n  continues.\n\nNotes/quirks:\n  - Terminates only when the NPC's TerminateScript flag is set; no\n   \
  \ opcode-by-opcode early exit exists here.\n  - Uses oOverworldNPCObject_AnimationScriptPtr as both the bytecode\n\
  \    pointer and the script cursor advanced by handlers.\n  - Uses `push {lr}` / `pop {pc}` as the call frame,\
  \ so R5 (and the\n    other input registers) are expected to be the dispatcher's working\n    state rather than\
  \ callee-saved values.\n  - Opcode dispatch is via an indirect jumptable (NPCCommandsJumptable)\n    whose entries\
  \ are Thumb handler addresses; the dispatcher must be\n    called in Thumb mode.\n\nRegister form, old prompt;\
  \ queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
