  detail: 'Body and its two callees read. sub_81431F8 multiplies r0 by 0x14 and adds byte_2000D20; GetRNG & 0x3F,
    + 0x1E, strh at [r5, #2]; mov r0, r4 / mov r1, #1 / bl sub_81432FA, which does strb r1 into [record] unless
    ldrb [record] == 3.'
