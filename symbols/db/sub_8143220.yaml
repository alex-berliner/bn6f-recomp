name: sub_8143220
address: '0x08143220'
kind: function
previous_names: []
status: probable
summary: Cybercrow record r0 gets a new random countdown at +0x02 of 0x1E + (GetRNG & 0x3F) frames (30-93), and
  its state byte becomes 1 unless it is 3 (sub_81432FA).
interface: (r0 = crow slot index 0-7) -> r0 = the record's state byte from before the call (sub_81432FA's ldrb),
  r1 = 0x14; r4-r7 preserved (push/pop r4-r7); clobbers r2, r3, lr and the flags. One primary GetRNG.
details: "Body (asm37_1.s:2846-2864): sub_81431F8(r0) gives the record byte_2000D20 + r0 * 0x14 (8 records of 0x14\n\
  bytes); GetRNG & 0x3F plus the constant 0x1E (dword_8143244) is stored as the halfword at record +0x02; then\n\
  sub_81432FA(r0, 1), which stores 1 in the record's state byte +0x00 unless that byte is 3. Its twin sub_8143204,\n\
  right before it, sets the halfword at +0x06 the same way (0x1E + (GetRNG & 0x3F)) and leaves the state alone.\n\
  \nCallers, each with the crow's slot index (the map object's byte +4, or the slot being filled):\n- sub_8143314\
  \ (asm37_1.s:3011), the crow spawn: sub_8143204, then this.\n- sub_80A8BBC (asm29.s:7349): sub_8143204, then this,\
  \ after clearing the object's byte +1, when sub_80A8D02's\n  r1 << 8 is within +-0x400.\n- sub_80A8CCC (asm29.s:7496),\
  \ the type 0x18 map object's wobble: while the state is 2 it counts +0x02 down and,\n  when it runs out, changes\
  \ the heading at +0x04 by +-(GetRNG % 0x60) << 8; it calls this when the countdown\n  has run out, and on every\
  \ frame where the state is not 2.\n- sub_80A8DB0 (asm29.s:7618), which starts the byte_808C2F0 cutscene and plays\
  \ sound 0x122: sub_8143204, then\n  this.\n\nvidsync (docs/vidsync/RANDOM_EVENTS.md, Cybercrow lesson; level A)\
  \ counts it in the 4 primary calls per crow spawn\n(2 in sub_8143314, 1 in sub_8143204, 1 here) and in the wobble's\
  \ \"2 calls + 1 via sub_8143220\".\n"
