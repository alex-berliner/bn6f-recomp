name: GetAllianceDependentPanelParamArgs
address: '0x081096FA'
kind: function
status: confirmed
summary: Looks up an 8-byte entry in a panel-effect parameter table, indexed by the battle object's alliance (team)
  field, returning the entry's param word and args pointer.
interface: "in:  r3 = base of panel param table (rows of 8 bytes, one per alliance value),\n     r5 = battle object\
  \ pointer (oBattleObject_Alliance byte selects the row),\n     lr = return address (function returns with mov\
  \ pc, lr)\nout: r2 = first word of the selected entry (param),\n     r3 = second word of the selected entry (args\
  \ pointer)\nflags: c, v set as if computing row + 4 (add r3,#4); n, z clobbered; no registers preserved\n"
details: 'Reads the caller battle object''s Alliance byte (oBattleObject_Alliance), scales it by 8 (lsl #3) and
  uses it as a row index into the table whose base the caller passes in r3. Each row is two words: the first is
  loaded into r2 (a parameter, e.g. a panel type/id), the second into r3 (a pointer to an args structure). Because
  the return value pair travels in r2/r3 and lr is re-used as the jump target (mov pc, lr), this is a helper meant
  to be called with r3 set up by the caller; it performs no stack work at all. The flag-setting is incidental: the
  add r3,#4 used to reach the second word sets c/v like a normal ADD, so callers must not rely on incoming flags.
  In game terms, panel-altering effects (e.g. holy panels, grass, cracks) can behave differently depending on which
  alliance (own side vs. enemy side) the acting object belongs to, and this selects the right row of parameters
  for that side.

  '
