name: sprite_shieldUpdate_8124DCC
address: '0x08124DCC'
kind: function
status: confirmed
summary: 'Per-frame shield sprite update: decrement HP by 2, clamp to minimum (locking state), force the draw flag,
  run three sub-update routines, and refresh the HP-frame and state-frame sprite halfword slots.'
interface: 'void sub_8124DCC(void); // implicit: reads/writes struct pointed to by r5'
details: "Operates on a sprite/object struct held in r5 across the function.\n\nHP bookkeeping:\n  * r5[0x74] -=\
  \ 2.\n  * If the resulting HP is <= 0x7C (\"kShieldMin_HP\"/SHIELD_MIN_HP), clamp it to 0x7C and write 0x18 into\
  \ r5[0x02] (state = locked).\n\nDraw flag:\n  * r5[0x70] = 0xFF (force draw on).\n\nUpdate helpers called in order\
  \ (each receives r5 implicitly via the register contract):\n  * sub_8126818(0)\n  * sub_8125444()\n  * sub_8125D94()\n\
  \  * sub_8125E78()\n\nSprite slot refresh via sprite_setStructHalfwordPairOnThree_8117084:\n  * Slot 4 (HP frame):\n\
  \      - If current HP (r5[0x74]) is <= 0x86 (SHIELD_LOCK_HP), use r5[0x60] as the source pointer\n        with\
  \ halfword 0; only if that pointer == 5 does the halfword become r5[0x26].\n      - Otherwise fall through with\
  \ r5[0x58] as the source pointer and r5[0x12] as the halfword.\n  * Slot 7 (state frame):\n      - Start with\
  \ pointer r5[0x5C] and halfword 0.\n      - If pointer == 0x27, halfword is r5[0x1C].\n\nRegister contract observed:\n\
  \  * inputs: r5 (struct ptr), r10, lr\n  * outputs: c, v set; r1, r2, r3, r5, r7, r8, r9, r10, r11, r12, lr\n\
  \  * clobbers: nz, r0, r4\n  * preserved: r5, r6, r8, r9, r12\n\nQuirks:\n  * Function ends with `pop {pc}` (no\
  \ matching `push {lr}` style restoration — `push {lr}` is used and `pc` is popped, a single-instruction epilogue).\n\
  \  * The conditional structure for slot 4 has a small quirk: when HP <= 0x86 it overwrites r1 from 0 (first mov\
  \ r1,#0) and only conditionally re-overwrites it from r5[0x26] when r5[0x60] == 5; otherwise r1 remains 0 while\
  \ r0 is set to r5[0x60]. The readable C captures this correctly.\n"
