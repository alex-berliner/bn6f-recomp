name: rfu_updateConnState
address: '0x08145120'
kind: function
status: probable
summary: Advances the RFU link-connection state machine in eStruct200FE00, transitioning states and firing
  the connection callback with the appropriate reason code.
interface: '(r0 = bool/flag: nonzero -> abort path) -> void; updates eStruct200FE00 state bytes (+4/+5)
  and may invoke the connection callback via rfu_fireConnCallbackAndClearState.'
details: 'Takes a single low-byte argument treated as a flag: if set, it calls sub_8144EA4 and forces
  the state byte at eStruct200FE00+4 to 0x17 (an error/abort state) without firing a callback. If clear,
  it reads the current state byte at +4 and switches on (state - 5) over 14 cases, each setting a new
  state (+4) and sub-state (+5) and picking a callback reason in r2 (0x13, 0x21, 0x23, or fall through
  to 0x43 for the default/invalid case); after the transition, if the new state is 0 it fires rfu_fireConnCallbackAndClearState(reason,
  0). The state-0xe case is special: it restores state bytes saved at +0x11/+0x12, forces a disconnect
  on the link structure pointed to by dword_2010CC0 (byte at +3 used as slot id), stores that id as a
  halfword at +0x14, and fires the callback with reason 0x33 and argument 1 before returning without the
  tail call.'
