name: ai_attackStepExpired
address: '0x08109A50'
kind: function
status: probable
summary: 'AI attack step callback: when StepTimer reaches zero, clear ObjectFlags1 bit 0x40, set the OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT
  flag, reload StepTimer from AttackDuration, mark HasMoved=1, and set HitElement=0xC.'
interface: (r7 = battle object with oAIAttackVars fields) -> void; updates StepTimer, flags, HasMoved,
  HitElement
details: Each call decrements oAIAttackVars_StepTimer at [r7,StepTimer]; if the result is nonzero it returns
  immediately. On expiry it clears ObjectFlags1 bit 0x40 via object_clearFlag, then ORs in the bit at
  OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT via object_setFlag1, reloads oAIAttackVars_StepTimer from oAIAttackVars_AttackDuration,
  sets byte oAIAttackVars_HasMoved to 1, and stores 0xC into halfword oAIAttackVars_HitElement. So the
  object's movement/attack period is AttackDuration frames, and this callback schedules the object's next
  step/move while tagging its hit element. The following byte_ arrays look like adjacent data for sibling
  AI step tables, not part of this routine.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrh/sub/strh on [r7,#oAIAttackVars_StepTimer] with bne skip shows a countdown gate; object_clearFlag(0x40)
    then object_setFlag1(1<<OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT) marks movement state on the battle object;
    strh AttackDuration -> StepTimer resets the period from the attack's configured duration; strb 1 ->
    HasMoved and strh 0xC -> HitElement record the step outcome; routes battlesweep/beastsp place it inside
    battle AI execution
  refs:
