name: ow_attemptJackIn
address: '0x0804930C'
kind: function
status: probable
summary: 'Attempts to jack in from the overworld: checks the destination network, sets it up, starts the
  jack-in dialogue/state, and reports success or failure.'
interface: (r5 = overworld/jack-in state struct; no r0-r3 args) -> r0 = 1 if jack-in proceeds, 0 if blocked;
  plays a sound effect in both cases
details: Calls sub_813D638 to get a count/value and compares it against the sum of state bytes at r5+0xB
  and r5+0xE; if the sum is >= the value, it plays SOUND_CANT_JACK_IN and returns 0. Otherwise it fetches
  a value pair via sub_803C440 and runs sub_803C150 and sub_803C2AA over the byte_202AB00 / byte_202AF00
  buffers (likely building or validating the target network's data, e.g. cyberworld layout/objects), then
  calls sub_803BB2C with 0xC, which selects the network-related text script for the current main phase.
  It writes 0x28 into r5+1, evidently the next state/step id for this object, plays SOUND_MENU_SELECT,
  and returns 1. r5 is a callee-saved register, so the state pointer is set up by the caller before the
  call.
