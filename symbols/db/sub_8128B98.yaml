name: sub_8128B98
address: '0x08128B98'
kind: function
status: confirmed
summary: On a per-object state change, looks up a chatbox script index in a script table and runs it, optionally
  stashing a CheckKeyItem result into the chatbox.
interface: void sub_8128B98(void* r5_object, void* r10_toolkit); // r5 in/out, r10 in; clobbers r0-r3, lr, NZCV
details: 'Bails out immediately if the object''s halfword at +0x1E is zero (a "dirty/active" flag).

  Otherwise it compares the object''s current vs previous position/state in four

  fields: +0xD vs +0xE (cur/prev tileX, u8), +0x24 vs +0x26 and +0x20 vs +0x22

  (cur/prev coordinate pairs, u16). If all four match the previous frame, it

  bails (only runs when something actually changed).

  When something changed it indexes into a packed byte table at

  eTextScript201BF00: idx = ((u16)(+0x24) + (u16)(+0x20)) * 4 + (u8)(+0xD) * 2,

  i.e. ((+0x24 + +0x20) << 1) + (+0xD)) << 1. The byte at that offset is the

  script index.

  If that script index == 0x2C, it calls CheckKeyItem(r0 = 0x2C) and writes the

  returned u16 into [chatboxPtr + 0x4C], where chatboxPtr is read from

  [r10 + oToolkit_ChatboxPtr]. The script byte is preserved across the call

  (pushed/popped) so it can be passed to chatbox_runScript_803FD78.

  Finally, with r0 = unk_201C1B0 (a TextScriptArchive pointer) and r1 = the

  script byte, it calls chatbox_runScript_803FD78(archive, scriptIdx).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
