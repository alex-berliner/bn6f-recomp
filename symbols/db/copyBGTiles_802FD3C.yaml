summary: Blits a fixed 32x20-tile background tile map (byte_87F8EB0) into 32x32 tile block 1 of the BG.
interface: void bg_CopyFixedTileMap_32x20(void)
details: 'Takes no real arguments: it immediately calls CopyBackgroundTiles with a hardcoded setup - destination
  tile origin (j=0, i=0), tile block 32x32 #1 (r2=1), source tile id table byte_87F8EB0 (r3), and a 0x20 x 0x14
  (32 x 20) tile region (r4=0x20, r5=0x14). Only r5 and lr are saved on the stack; r5 is pushed merely because the
  call clobbers it while setting up the size arguments, and the caller''s r5 is restored on return. The apparent
  register contract listing r5-r7 as inputs/outputs is just pass-through noise from the caller''s live state, not
  a real interface.

  '
