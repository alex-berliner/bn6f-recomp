name: findRecordWithHalfwordAtOffset2_804743C
address: '0x0804743C'
kind: function
status: confirmed
summary: Scans an array of 8-byte records and sets the Z flag if any record's halfword at offset +2 equals a given
  value, telling the caller whether a match was found.
interface: 'int findRecordWithHalfwordAtOffset2(u16 target /*r0*/, void* records /*r7*/, int count /*r4*/); returns
  via flags: Z set = match found, NZ = not found; r1 = last halfword read'
details: 'Leaf helper that linearly searches `count` (r4) fixed-size 8-byte records starting at r7, comparing each
  record''s halfword at offset +2 against r0. It iterates with r3 as the loop counter (stepping r7 by 8 each pass)
  and uses r6 as a "not found" flag that starts at 1 and is cleared on a hit. On return the caller reads only the
  N/Z flags: Z set means a matching record was found (r7 left pointing at it), NZ means the list was exhausted (r7
  left pointing one record past the end). r1 ends holding the last halfword read, or is untouched if count <= 0.
  r3-r7 and pc are restored from the stack; r0''s value is not preserved, and r6/r3 (the loop state) are dead on
  exit. No memory outside the caller-supplied table is touched, so it is a generic lookup utility, most likely used
  to search an ID/key table of 8-byte entries (halfword key at +2, e.g. id + data pairs) to check whether an id
  exists or to position r7 on the matching entry for the caller.'
