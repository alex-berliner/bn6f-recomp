name: battle_spawnRowPanelEffect
address: '0x080C6FC8'
kind: function
status: confirmed
summary: Spawns a row-panel visual effect along the facing direction of a battle object, drawing up to 5 tiles until
  the target X is reached.
interface: void battle_spawnRowPanelEffect(u32 r0_arg_id, u32 r1_target_x, u32 r2_arg, BattleObject* r5) -> r5 preserved
details: 'Reads the battle object''s Param1 byte and uses it to index a 8-entry lookup table (byte_80C7028) to retrieve
  a per-object flag (only index 4 yields 1, all others 0). Builds a packed control word: bits 8-15 hold arg_id,
  bits 16-23 hold the flag, bit 0 is a first-draw marker (1 for the initial call, 0 for subsequent). Calls sub_80E3A92
  once at the object''s current PanelY with the first-draw word, passing target_x, PanelY, arg_r2, and the object''s
  RelatedObject1Ptr. Then iterates step 1 through 4: queries object_getFrontDirection(r5) for the facing direction
  (0 or 1), computes cur_x = PanelX + direction*step, and if cur_x equals target_x it breaks; otherwise calls sub_80E3A92
  again at (cur_x, PanelY) with the non-first word. Preserves r4, r6, r7 via push/pop. The r2 argument is forwarded
  to sub_80E3A92 as-is.'
