name: sub_811A2EC
address: '0x0811A2EC'
kind: function
status: confirmed
summary: Updates a bit field of the sprite attribute word (offset 0x2C) of the menu table entry selected for the
  current state index, either resetting it to a fixed value or filling it while clearing one selected bit.
interface: void menu_setStateSpriteAttrField_811A2EC(/*r0-r3 passed through to menu_getTableEntryForStateIndex_811A268,
  r5 = some context/object pointer*/); // lr clobbered, r4-r7 preserved, flags clobbered; only r5 is a true local
  input
details: 'Calls menu_getTableEntryForStateIndex_811A268 with the caller''s r0-r3 (the helper returns a table entry
  pointer in r0 plus two flag values in r1/r2). If no entry was found (r0 == 0), or the "reset" flag combination
  is seen (r2 == 0 but r1 != 0), it reads the sprite attribute word at offset 0x2C via sprite_getUnk0x2c, clears
  the whole 0x1FC0 field, and ORs in the fixed value 0xF80 before storing it back with sprite_setUnk0x2c. Otherwise
  it sets the full 0x1FC0 field (OR 0x1FC0), then clears exactly one bit: (0x1000 >> (r2+1)) & 0x1FC0 — i.e. bit
  (r2+1) inside the 0x1000..0x1FC0 run — so the sub-field is filled except for the one position selected by r2.
  The ARM LSR uses only the low byte of the shift amount, so r2 is effectively masked to 0-255 (r2 = 31+ gives an
  empty mask). The 0x1FC0 field spans bits 6-12 of the attribute word and 0xF80 sits inside it (bits 7-11); this
  looks like a per-state priority/visibility-style field on the menu sprite. r5 is passed through untouched and
  is presumably the sprite/object handle used by the sprite_ helpers. A stray literal at off_811A334 (0x140) is
  present in the pool but unused by this function.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
