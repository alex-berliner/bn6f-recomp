name: MapScriptCutsceneCmd_write_byte
address: '0x08035EAA'
kind: function
status: confirmed
summary: 'Map-script cutscene command: writes a script-supplied byte to an absolute address.'
interface: 'void MapScriptCmd_write_byte(uint16_t opcode, uint32_t *script_cursor, char *return_addr) /* r7 in/out:
  script cursor advanced by 6; r4 in: opcode word, out: written byte; r6 clobbered; r0=1; NZ flags set on r0 */'
details: "Implementation of a single map-script cutscene opcode whose job is \"store one byte into memory\".\nFlow:\n\
  \  1. Sets r6=1 and calls ReadMapScriptWord, which consumes the next script token and returns it in r4\n     (this\
  \ is the destination address).\n  2. Moves that address into r0 as the store target.\n  3. Sets r6=5 and calls\
  \ ReadMapScriptByte, which reads the next script byte into r4 (the value).\n  4. Executes strb r4, [r0], writing\
  \ that byte to the destination.\n  5. Adds 6 to r7 to bump the script cursor past the 3-byte opcode header (already\
  \ consumed by the\n   loop dispatcher) plus the 2-byte address word plus the 1-byte value.\n  6. Returns r0=1\
  \ with NZ set, the standard \"command consumed one tick\" indicator used by the\n   cutscene/cam engine.\nTouches:\
  \ the running map-script stream via the r7 cursor; arbitrary memory through the\nscript-supplied address (no bounds\
  \ check, so the script can patch anywhere in WRAM/IWRAM/ROM mirror).\n\nRegister form, old prompt; queued for\
  \ retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
