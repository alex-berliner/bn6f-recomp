name: object_spawnElementPanelHitbox
address: '0x080D0A5C'
kind: function
status: probable
summary: Spawns a collision region on the object's own panel with its element, unless Param1 suppresses
  it.
interface: (r0-r3, r5 = battle object) -> r0 = spawn result; r4/r6/r7 clobbered
details: Reads oBattleObject_Param1 and returns immediately if nonzero, otherwise collects the object's
  PanelX, PanelY and Element, sets r3=0 and passes constant damage 1 (dword_80D0A7C) plus region flags
  0x405FF01 (dword_80D0A78) and the object's DamageAndStaminaDamageCounterDisabler field, then calls object_spawnCollisionRegion.
  So this creates a one-tile damaging hitbox centered on the object's current panel, tagged with the object's
  element. Param1 acts as a disable/spawn-once flag checked by the caller sub_80D08CC, which invokes this
  twice (both at 0x080D090A path and 0x080D08CC).
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_Param1]; cmp r0,#0; bne locret gates the spawn on Param1==0; loads
    PanelX/PanelY/Element from the battle object and passes them as x/y/element to object_spawnCollisionRegion;
    dword_80D0A78 = 0x405FF01 and dword_80D0A7C = 1 are the constant region flags and damage arguments;
    sole callee is object_spawnCollisionRegion, confirming it builds a battle hitbox; both call sites
    in sub_80D08CC reach this routine, so it is a helper of that attack step
  refs:
  - bn6f/asm/asm31.s:54128
  - 0x080D08CC sub_80D08CC
  - 0x080D090A sub_80D08CC
  - 0x080C536A object_spawnCollisionRegion
  reproduce: python3 tools/asmcat.py 0x080D0A5C
