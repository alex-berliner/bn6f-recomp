name: battle_checkFacingTileMatch
address: '0x080266BA'
kind: function
status: probable
summary: Runs the facing-offset tile checker on an object using one of two special-case offset tables,
  chosen by comparing a computed alliance/facing value against r6.
interface: (r4 = battle object, r6 = value to match) -> r0 = nonzero if the checker hit on a listed relative
  tile; flags from callee
details: Reads the object's Alliance and DirectionFlip bytes at r5, XORs them together with 1, multiplies
  by 5 and adds 1, yielding 1 or 6 depending on whether alliance and flip agree. If that computed value
  equals r6, the table base byte_80267A6 is advanced by 2 (second table), otherwise the table at offset
  0 is used. The chosen 0x7F-terminated table of signed tile offsets is then handed to battle_checkFacingOffsets,
  which mirrors each offset by facing and runs the per-tile checker, returning as soon as one succeeds.
  r5 (object pointer) and r6 (match value) are caller-provided; no caller is known, so the meaning of
  the 1-vs-6 comparison and the table contents are unconfirmed.
