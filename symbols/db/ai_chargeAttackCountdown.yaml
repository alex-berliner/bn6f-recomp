name: ai_chargeAttackCountdown
address: '0x080F5D3E'
kind: function
status: probable
summary: 'AI attack charge state: initializes a difficulty-scaled countdown (with element and animation)
  and sets HitElement 0x10 when it expires'
interface: (r0 = battle object via registers r5/r7, no args) -> r0 = clobbered; updates oAIAttackVars_AttackElement,
  CurAnim, counter time, StepTimer, HitElement
details: When oAIAttackVars_AttackElement is 0 (attack not started), the function sets it to 4, switches
  the object to animation 0x13, arms object_setCounterTime with 0x28, and loads oAIAttackVars_StepTimer
  from a 4-entry table dword_80F5D70 indexed by AiDifficultyTier (values 0x19, 0x1E, 0x23, 0x28 — longer
  wait at higher tiers). On later invocations it decrements StepTimer each frame; when it reaches 0 it
  writes 0x10 into oAIAttackVars_HitElement, presumably the flag that makes the queued attack fire. The
  table indexing suggests the same enemy behaves differently per AI difficulty tier.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne skips initialization, so zero means ''not
    yet charging''; strb #4,[r7,#AttackElement] + strb #0x13,[r5,#oBattleObject_CurAnim] + bl object_setCounterTime(0x28)
    is a typical attack-start setup; ldrb r0,[r1,r0] off dword_80F5D70 indexes by AiDifficultyTier into
    {0x19,0x1E,0x23,0x28} for StepTimer; StepTimer decremented per call; on underflow strh #0x10,[r7,#oAIAttackVars_HitElement]
    signals the next AI stage; Values rising with tier (0x19→0x28) and object_setCounterTime match a telegraph/charge
    delay before an enemy attack'
  refs:
  - bn6f/asm/asm31.s:132210
  - 0x0800E9DC object_setCounterTime
  reproduce: python3 tools/asmcat.py 0x080F5D3E
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-203615'
