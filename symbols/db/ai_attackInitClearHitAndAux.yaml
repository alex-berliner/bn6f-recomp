name: ai_attackInitClearHitAndAux
address: '0x0810BC2A'
kind: function
status: probable
summary: 'AI attack phase one-time setup: on the handler''s first run for an object, clears the attack''s
  hit state and releases its auxiliary objects, then runs the common attack step function.'
interface: (r5 = battle object) -> r0 = result of sub_8016B72; flags from cmp
details: This is a per-object step/phase handler for an AI attack. On entry it checks oBattleObject_PhaseInitialized;
  if not yet set, it loads the object's +0x64 pointer (the AI attacker state whose +0x60 flag ai_attackHitClearState8
  clears and whose +8 it sets to 8) and calls ai_attackHitClearState8, then ai_attackFreeAuxObjects to
  drop the up-to-five ExtraVars aux object pointers. The init flag is evidently set elsewhere (likely
  inside sub_8016B72), since it is only tested here. Every call it then invokes sub_8016B72, presumably
  the shared per-frame attack logic, and returns its result. The one-shot clear+free acts as init-time
  cleanup so the attack's leftover hit flag and effect objects from a previous use are reset before the
  attack logic runs.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_PhaseInitialized] / bne skip: clear path runs only on first invocation;
    ldr r0,[r5,#0x64] then bl ai_attackHitClearState8: clears the attacker''s hit flag and sets state
    8; bl ai_attackFreeAuxObjects: frees the five ExtraVars aux pointers for the same object; bl sub_8016B72
    is unconditional, so this is a step wrapper, not just an init routine'
