details: 'Tail-thin wrapper: loads the address of byte_8107FF0 (four bytes, all 0x50) and calls sub_800FE28,
  returning its result unchanged. The caller sub_81080E6, while initializing an AI attack (oAIAttackVars),
  stores the return value into oAIAttackVars_TimerOrCycles, alongside sibling getters sub_8107FB8 (AttackDuration)
  and sub_8107FCC (AttackBoost2), suggesting a family of per-attack parameter lookups. With all entries
  equal to 0x50 (80 frames) the table probably holds candidate timer/duration values from which sub_800FE28
  selects one, likely at random.'
