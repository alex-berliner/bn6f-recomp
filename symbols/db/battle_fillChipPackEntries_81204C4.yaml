open_questions:
- The exact semantic of the bit-7-of-0x1c test (probably a "this slot has a chip" validity flag in the
  player's pack view).
- Whether r3 is the pack entry's "slot" index or some other arg to the pack helper — the callee contract
  says it takes (r0, r1, r2) and r0 goes out to be the element byte here.
- The exit r0=5 with entry r0=0 is odd and likely means the contract's "in r0=0" is a snapshot artifact;
  loop limit is loaded from stack slot holding the original r0.
