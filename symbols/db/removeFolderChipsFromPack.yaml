open_questions:
- Exact meaning of the byte at S2001c04+5 (folder count vs. active-folder index vs. mode flag)
- Which gameplay flow invokes caller sub_8120A38 (e.g. save init, folder setup, multiplayer preset) to
  confirm the in-game trigger
- Why the 18-bit value is split rather than read as separate fields — whether high 9 bits are a count
  or a chip-code/index
