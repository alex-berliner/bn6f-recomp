name: object_centerAndArmTimer
address: '0x0811D0CC'
kind: function
status: probable
summary: Centers the r5 object at (0x80,0x80) via sprite_setCoordinates, sets a 16-frame timer at [r5+0xC]
  and state byte 4 at [r5+9], then plays sound effect SOUND_LOG_OUT_76.
interface: (r0/r1 = hardcoded 0x80 coords passed to sprite_setCoordinates; r5 = object/sprite struct)
  -> r0 = sound effect ID after wrapper call; no meaningful return
details: 'Takes no real arguments; it calls sprite_setCoordinates with x=y=0x80, placing the object at
  screen center. It then stores 0x10 (a 16-frame counter or animation length) into halfword [r5+0xC] and
  value 4 into byte [r5+9], which is likely a state/mode field of the object struct. Finally it plays
  sound effect 0x76, whose project name is SOUND_LOG_OUT. This looks like the start of an object (Navi
  or similar) jacking out: reposition to center, arm a timer/state, play the logout sound.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: mov r0,#0x80 / mov r1,#0x80 / bl sprite_setCoordinates — fixed center-screen repositioning;
    strh r0(=0x10),[r5,#0xc] and strb r0(=4),[r5,#9] — writes to the object struct's timer and state fields;
    mov r0,#SOUND_LOG_OUT_76 / bl PlaySoundEffect — plays the logout/jack-out sound; Uses r5 as the object
    pointer without a parameter, implying it is called as a step of a larger per-object routine
  refs:
