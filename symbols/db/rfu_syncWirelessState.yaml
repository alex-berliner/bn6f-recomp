  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary, data flow, and rfu_NI_setSendData(0x43, byte_2010290, 0x40) match the asm (lines around
    0x081478CC–0x081478EC). However, byte_200AF80 is loaded into r8 as the base, and the stored index
    goes to byte_200AF84 (r8+4), not byte_200AF84 as a separate symbol — minor but the proposed name ''rfu_syncWirelessState''
    is fine and accurately captures the poll-and-queue behavior. The bit assignments are slightly off:
    bit 0x2 is checked at line 0x08147854, bit 0x80 is checked next, and bit 0x4 is set on dirty, cleared
    via 0xfb, and bit 0x2 is set (not ''done'') after success. The +3 field check on dword_2010CC0 and
    the +2 field scans are correct.; run wf investigate investigate-20261019-030611; proposed by Hyper
    glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
