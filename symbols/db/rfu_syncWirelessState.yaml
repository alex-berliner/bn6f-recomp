name: rfu_syncWirelessState
address: '0x08147834'
kind: function
status: probable
summary: Polls RFU wireless state; on state-byte change (byte_2010280 vs byte_201033C), sets dirty bit,
  calls sub_814794C then rfu_NI_setSendData(cmd=0x43, buf=byte_2010290, size=0x40), and on success stores
  the lowest set bit index of dword_2010CC0->field+2 into byte_2010328/byte_200AF84, returning 1 if a
  send was queued.
interface: () -> r0 = 1 if a send was queued this call, 0 otherwise; no flags used
details: Keeps state in byte_201028C (bit 0x80 = disabled, bit 0x1 = connected, bit 0x2 = done, bit 0x4
  = dirty) and bails out early if bit 0x80 or bit 0x2 is set or the struct at dword_2010CC0 has a nonzero
  field +3. When the global value at eS200BC50+8 equals 0x22 it sets flag 0x45. It diffs byte_201033C
  against byte_2010280 (last vs current value), setting the dirty bit (plus bit 0x1 from dword_2010CC0->field+2)
  on change, then calls sub_814794C and rfu_NI_setSendData with command byte 0x43, buffer byte_2010290
  and size 0x40. On success it scans dword_2010CC0->field+2 bits 0..3 for the first set bit, stores that
  index into byte_2010328 and byte_200AF84, and marks state bit 0x2.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl rfu_NI_setSendData with r1=0x43, r2=byte_2010290, r3=0x40 (loc_8147928 area) shows a queued
    64-byte wireless send; ldrh from eS200BC50+8 compared to 0x22 and flag 0x45 written to byte_201028C
    ties it to a specific game/scene state; byte_201033C vs byte_2010280 comparison followed by setting
    bit 0x4 is a change-detection/dirty-flag pattern; loop over dword_2010CC0->field+2 bits 0..3 storing
    the first set index into byte_2010328/byte_200AF84 selects a connected peer slot; called 6 times from
    sub_81475D4, consistent with a polled per-frame link-state updater
