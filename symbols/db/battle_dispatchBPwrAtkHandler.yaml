name: battle_dispatchBPwrAtkHandler
address: '0x080117BA'
kind: function
status: probable
summary: Dispatches the per-chip Beast Out attack-power handler selected by the index in r0, with r7 preloaded
  with the object's AI attack vars.
interface: (r0 = attack/chip handler index, r5 = battle object) -> tail-calls table handler (off_80117D4[r0]);
  r6 = oBattleObject_AIDataPtr, r7 = aiData + oAIData_AttackVars on entry to handler
details: 'Loads the battle object''s AI data pointer from [r5+oBattleObject_AIDataPtr] and precomputes
  r7 = aiData + oAIData_AttackVars, which handlers can use for the attack variable block. Then it indexes
  the 0x94-entry word table at off_80117D4 with lsl r0,r0,#2 and performs a long-call trick (mov lr,pc;
  bx r0) so any ARM/THUMB-state handler returns straight back to this function''s caller. The table is
  a per-attack-id jump table of Beast Power attack routines: entry 0x41 is battle_setupBeastPwrAttackVars,
  0x16 is ai_initBeastPwrAttackVars, and most entries are per-chip BPwrAtk init/damage handlers (megamanChargeShotBPwrAtk_init,
  greatfireAPwrAtk_init, slashcrossBPwrAtk_init, tomahawkmanBPwrAtk_init, bubbleSpreadBPwrAtk_init, etc.);
  unimplemented ids point at nullsub_44, and several ids reuse the charge-shot handler. Runs on the beastsp
  route, consistent with Beast Out attack handling.'
