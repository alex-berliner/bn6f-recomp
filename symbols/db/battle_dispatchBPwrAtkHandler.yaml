name: battle_dispatchBPwrAtkHandler
address: '0x080117BA'
kind: function
status: confirmed
summary: Battle AI dispatcher that runs the per-step "B+power attack" handler for a battle object, selected by the
  attack step id in r0 from a ~0x93-entry jump table.
interface: u32 battle_dispatchBPwrAtkHandler(u32 step /*r0*/, u32 object /*r5*/, void* r10, ...); preserves r6/r7;
  returns the selected handler's r0
details: 'Reads the acting battle object''s AI data pointer from object + oBattleObject_AIDataPtr (r5 is the battle
  object), computes r7 = aiData + oAIData_AttackVars (the attack-variable scratch area inside that AI block), then
  indexes the handler table off_80117D4 with r0<<2 and tail-calls the selected routine via the classic mov lr,pc;
  bx r0 thumb trampoline. The callee receives its own address in r0 (the step id is consumed by the lookup), the
  object in r5, its AI data block in r6, and its attack vars in r7; r10 and the remaining registers flow through
  untouched so the handler''s r5..r12 side effects pass straight to the dispatcher''s caller. r6/r7 are saved and
  restored around the call (push/pop {r6,r7}), and flags are whatever the handler leaves. The table entries are
  the B+power-attack step routines of the battle AI: per-chip/per-attack initializers and damage-variable setup
  (Beast Out and cross attacks such as megaman charge shot, buster bug, great fire, spout cross, slash cross, tomahawk
  man, bubble spread; chip-parameter writers like writeChipParams3/init_chipParams4f/battleInitChip199; generic
  AI helpers like ai_clearAttackVars, ai_setChipUseDelay, ai_scheduleChipAttack, ai_bossAttemptChipSteal, ai_setDifficultyTier20),
  with several ids mapping to the same default init (megamanChargeShotBPwrAtk_init_8011A26) and nullsub_44 placeholders.

  '
