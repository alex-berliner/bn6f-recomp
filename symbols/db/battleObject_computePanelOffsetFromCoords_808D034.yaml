name: battleObject_computePanelOffsetFromCoords_808D034
address: '0x0808D034'
kind: function
status: confirmed
summary: Converts a battle object's fixed-point world coordinates (plus an AI/map-group offset) into byte-sized
  panel X/Y grid coordinates, stores them in the object, and returns the flat panel lookup index.
interface: PanelOffsetResult battleObject_computePanelOffsetFromCoords(u32 coordX /*r0*/, u32 coordY /*r1*/, BattleObject*
  obj /*r5*/, BattleState* state /*r10, passed through to callee*/); returns r0 = panel X, r1 = panel Y, r2 = panel
  index (X*0x100 + Y); r4 and r5 preserved; nz c v clobbered but not read by callers
details: 'Saves coordX/coordY on the stack, then calls ai_getAIModeForChipForMapGroup_808D060,

  which (via the battle state in r10) returns a pair of 16.16 fixed-point offsets in r0/r1.

  After the call it pops the saved coordinates into r3/r4 and takes their high halves

  (asr #16), adds them to the callee''s offsets, and converts to panel units:

  (sum >> 5) + 0x80, i.e. divide by the panel-pixel size and recenter so panel (0,0)

  is the top-left of an 0x100-range field. The two byte-sized panel coordinates are

  stored into the object at obj+8 (X) and obj+9 (Y). Finally it builds the flat panel

  array index X*0x100 + Y in r2, suitable for indexing a 256x256 panel lookup table.

  r4 is saved/restored around the body so callers see their incoming r4 unchanged.

  The +0x80 centering means coordinates outside the field can wrap/clip when stored

  as bytes at obj+8/obj+9.

  '
