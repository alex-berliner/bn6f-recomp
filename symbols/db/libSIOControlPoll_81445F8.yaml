  date: '2026-10-14'
  detail: '- callee is libSIOControlStart at 0x0814474c, matched to SIO control hardware init - state
    byte at eTimerEnable200F460 is read as a boolean enable (`ldrb r3,[r4]; cmp #0; beq loc_8144664`)
    - F450 is compared against 6 after `add r0,#1; strb r0,[r1]` -> classic retry/poll counter - F454
    must be 2 for the bump-clear sequence (`ldrb r2,[r0]; cmp r2,#2; bne loc_8144690`) - stores 0x01 and
    0x02 to F475 in mutually exclusive branches, looks like a status code - caller sub_803DE72 reads handler
    from unk_200A284 and tail-calls into here at 0x0803de81'
