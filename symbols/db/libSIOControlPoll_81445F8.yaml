name: libSIOControlPoll_81445F8
address: '0x081445F8'
kind: function
previous_names:
- sub_81445F8
status: probable
summary: link-cable SIO control tick (EWRAM at eTimerEnable200F460) polled each frame by the global handler
interface: '() -> ; side effects: mutates EWRAM bytes eTimerEnable200F450/454/460..474 and (via libSIOControlStart)
  the SIO hardware'
details: "The function is the registered global handler (unk_200A284 dispatcher at 0x0803de72) that\n\
  \  runs each vblank/int. It treats eTimerEnable200F460 as a small state struct:\n    -F460: enabled\
  \ flag\n    -F461: sub-state (2 or 4 are the active branches)\n    -F462/F463/F471: other per-link state\
  \ bytes\n    -F450/F454: poll counters\n  With F460 enabled and F461==2 it calls libSIOControlStart,\
  \ then bumps F450 (a \"tries\" counter);\n  once F450 reaches 6 it switches a result byte to 2 and clears\
  \ F462/F463/F471. With F461==4 the\n  branch consults F46D/F472 first, sets F475=1 when both conditions\
  \ hold, then falls into the\n  libSIOControlStart/bump/clear path. The disabled branch (F460==0) handles\
  \ F461==2|4 by just\n  bumping F450 and on >6 stamping F475 with state-dependent values (2 when F461==4)\
  \ before\n  clearing F462/F463/F471. Caller restores its own lr from a table at 0x0803DE81.\n"
evidence:
