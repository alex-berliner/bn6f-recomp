name: ai_invalidateRelatedObjectAnimCopy
address: '0x08107E66'
kind: function
status: probable
summary: Entry into the shared tail at sub_8107E72 that first forces the object's related object to re-copy
  its animation
interface: (r5 = battle object, r0/r1 = whatever the shared tail needs) -> falls through to loc_8107E74;
  LR deliberately not preserved
details: Loads the battle object's RelatedObject2Ptr field (r5-based oBattleObject struct) and, if non-NULL,
  calls battle_objectInvalidateAnimCopy on that pointer, writing 0xFF to that object's animation-copy
  field so its current animation is re-copied next update. It then branches into the shared tail at 0x08107E74
  (sub_8107E72), so this label is the variant of that tail which first invalidates the related object's
  animation. The missing LR save is harmless only because the AI dispatcher invokes it immediately before
  a pop {pc}, as noted in the asm comment. The rest of its behavior is whatever sub_8107E72 does, which
  is undocumented.
