- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne skips setup, else element=4 and StepTimer=AttackDuration;
    StepTimer is decremented and bgt exits while still counting (loc_80FC5A0); on timer expiry HitElement
    is set to 0x20, a flag-like value, then returns; struct offsets are all in the oAIAttackVars block
    reached via r7, matching an AI attack routine; no callees and no flags consumed; behavior is entirely
    local state transitions
