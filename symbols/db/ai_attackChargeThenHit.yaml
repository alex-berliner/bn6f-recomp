name: ai_attackChargeThenHit
address: '0x080FC58E'
kind: function
status: probable
summary: 'AI attack state: defaults the attack element, waits the attack duration, then marks the hit
  frame active.'
interface: (r7 = oAIAttackVars struct) -> void; no return value, flags not meaningful
details: If oAIAttackVars_AttackElement is 0, it is set to 4 (a default element) and oAIAttackVars_StepTimer
  is initialized from oAIAttackVars_AttackDuration; this is the setup/charge phase. Otherwise the StepTimer
  counts down each call. When it reaches 0, oAIAttackVars_HitElement is set to 0x20, presumably a bitflag
  marking the attack's hit as active this frame. Purely a per-frame tick of an AI attack state machine
  reading/writing the attack vars block in r7; no branches taken if timer still positive.
