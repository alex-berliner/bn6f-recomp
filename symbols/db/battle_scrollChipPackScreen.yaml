name: battle_scrollChipPackScreen
address: '0x0812D99C'
kind: function
status: probable
summary: Scrolls the shared battle display window horizontally to a selected side or position during chip-pack
  transitions.
interface: (r0 = scroll selector 0 or 1) -> r0 = unchanged selector; flags caller-clobbered
details: The function treats its argument as a selector into paired display-window descriptors at off_812D9D4.
  Selector 0 uses unk_202DFA0 and scrolls it horizontally; selector 1 uses unk_202DFC0 and adds 8 minus
  the value at [r5+0x30], matching the caller's selected chip-pack position. It reads width/parameter
  records from byte_812D9E0 and calls the generic window callback to render the corresponding 2-parameter,
  8-by-2 window at that x-coordinate. The callers pair calls with arguments 0 and 1 around screen redraws,
  indicating that both chip-pack display windows are positioned together.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: At 0x0812D9A0-0x0812D9B6, selector 0 takes unk_202DFA0 directly, while selector 1 takes unk_202DFC0
    and adjusts x by 8-[r5+0x30].; At 0x0812D9C0-0x0812D9D0, the selected descriptor's width and parameter
    bytes come from byte_812D9E0 and are passed to call_sub_3005EBA with arguments (x, width, 2, 0, 8,
    2).; sub_812C884 first stores sub_812D934(1) at [r5+0x30], then calls this function with selector
    1 and spawns the EStructs from the selected table pair.; sub_812C7B4 redraws the chip-pack screen
    and calls the function with selector 0.; sub_812CA84 redraws the screen after calling the function
    with selectors 0 and 1.
