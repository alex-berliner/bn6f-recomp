open_questions:
- Which PET/Navi indices correspond to which entry; the relationship between duplicated entries 1-5 and 6-10 is
  unclear.
- Exact meaning of eByte200AD04 (likely a transformation/state flag such as "shiny"/"Soul Unity" variant given its
  pairing with event 0x163).
- Whether r0 is a tile index offset or a frame/animation offset (it is added raw to the source pointer so it must
  be byte-aligned within the 0x20-byte block).
- GetCurPETNavi, TestEventFlagFromImmediate, notZero_eByte200AD04, and QueueEightWordAlignedGFXTransfer all live
  outside this file and lack typed interfaces; verify their semantics elsewhere.
