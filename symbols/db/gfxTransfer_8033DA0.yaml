name: gfxTransfer_8033DA0
address: '0x08033DA0'
kind: function
status: confirmed
summary: Queues a 32-byte PET navi tileset DMA transfer into the VRAM staging area at 0x30016D0.
interface: void queuePETNaviTileset_8033DA0(u32 baseAddr /* r0 */);
details: 'Resolves which tileset to upload by reading GetCurPETNavi (returns an index into

  a pointer table at off_8033DD4 of ROM tileset sources, one per navi/pose). The

  selected entry has the supplied base address added to it before queueing, so

  callers vary the tileset origin by passing different base pointers. The transfer

  is always 0x20 (8 words) to byte_30016D0 via QueueEightWordAlignedGFXTransfer.


  If EVENT_163 (flag bank 1, flag 0x63, "EVENT_163") is clear AND the byte at

  0x200AD04 (notZero_eByte200AD04) is non-zero, the index is forced to 0xC,

  pointing at byte_86C1A20. This branch is the only thing that uses r4..r7 besides

  preservation; the chosen index''s pointer is what ends up at r0 for the queue.


  Inputs r10/lr are listed in the contract from analysis and not referenced here.

  c and v flags are listed as outputs but this function only sets Z via TestEventFlagFromImmediate/notZero_eByte200AD04;
  the c/v markings likely come from the queueing helper.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
