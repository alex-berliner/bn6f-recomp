name: gfxTransfer_8033DA0
address: '0x08033DA0'
kind: function
status: probable
summary: Queues a 0x20-byte aligned GFX transfer (to VRAM/OAM at 0x030016D0) for the current PET/Navi sprite, picking
  the source from a 13-entry table indexed by PET/Navi id with an override driven by event flag 0x163 and eByte200AD04.
interface: 'void gfxTransfer_8033DA0(u32 tileOffset /* r0 */);  /* preserves r4-r7, clobbers r0-r3, n,z flags; c,v,r2-r7
  out */ flags clobbered: nz preserved: r4 r5 r6 r7'
details: "Calls GetCurPETNavi to obtain the current PET/Navi index (0..12, used as a byte index).\nIf event flag\
  \ 0x163 (EVENT_163) is set AND eByte200AD04 is non-zero, the index is\nforced to 0xC (the last entry of the table),\
  \ giving an alternate sprite GFX source.\nThe chosen index is multiplied by 4 (lsl #2) and added to a base pointer\
  \ (off_8033DD4\n-> 0x086C18A0-..) to fetch a u32 ROM source pointer. The caller's r0 (a per-frame or\nper-state\
  \ tile offset) is then added to this source.\nFinally QueueEightWordAlignedGFXTransfer is invoked with:\n  src\
  \     = table_src[index] + r0_offset\n  dest    = 0x030016D0 (byte_30016D0, OAM tile buffer)\n  size    = 0x20\
  \ bytes\nThe 13-entry source table GFX_SRC_TABLE contains entries for navi indices 0..12;\nentries 6..11 duplicate\
  \ entries 1..6, suggesting palette/style variants for certain\nnavis. The last two entries (index 0xB, 0xC) appear\
  \ to be special/alt sources used\nwhen event 0x163 is set or for the override index 0xC.\n"
