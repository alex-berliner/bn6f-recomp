open_questions:
- Why does the dispatch only use the high nibble of the kind byte (the low nibble is masked out) and what does it
  encode?
- Are the two null slots (0x10, 0x14) placeholders for unused kinds, or do valid kinds 0xB0-0xD0 route to handlers
  that have been stripped?
- What is the relationship between the post-spawn Unk_04_05 -> Unk_12_13 copy and the subsequent overwrite of BattleActors
  with AliveBattleActors (a state-init snapshot vs. a reactivation path)?
- The function only ever overwrites BattleActors from AliveBattleActors, so is it exclusively a "re-initialize existing
  battle actors" path called when a battle is resumed or a new round starts, rather than the first spawn of a battle?
