name: SpawnBattleObjectUsingBattleEntityConfig_8007368
address: '0x08007368'
kind: function
status: confirmed
summary: Walks the per-battle entity setup list, spawning each MegaMan, enemy, mystery data, rock, cube or guardian
  via the matching handler, then carries over `oBattleState_Unk_04_05` to `oBattleState_Unk_12_13` and copies the
  alive-actor words over the battle-actor slots in the BattleState.
interface: void spawnBattleObjectsFromConfig_8007368( const EnemySetup *config /* r0 -> r6 */, BattleState *state
  /* r5 */, BattleToolkit *toolkit /* r10 */, void *r4, void *r7, void *lr /* inherited */) -> returns r5, r8, r9,
  r10, r11, r12; clobbers nzcv r0-r3, r4, r7, lr; preserves r6
details: "The config (`r0` -> r6) is an array of 4-byte `EnemySetup` entries walked\nuntil one whose kind byte ANDed\
  \ with 0xF0 equals 0xF0 (the high nibble is\nthe dispatch, the low nibble is ignored). The mask/0xF0 sentinel\
  \ works\nbecause the largest valid kind is 0xA0 (dispatch 0x28, metal cube).\n\nDispatch index is `kind >> 2`,\
  \ used as a byte offset into the table at\noff_80073A0 (11 entries: MegaMan 0x00, enemy 0x04, mystery data 0x08,\n\
  rock 0x0C, two nulls 0x10/0x14, sub_80074C8 0x18, sub_80074DE 0x1C,\nrock cube 0x20, guardian 0x24, metal cube\
  \ 0x28). Each handler is entered\nThumb (`+1` on the loaded address) with `r0 = index`, `r1 = handler addr`,\n\
  `r6 = current entry pointer`, and inherits r4/r5/r7/r10/lr from the\ncaller. Handlers may rewrite r6 (notably\
  \ `spawnEnemy_80073E2`), and the\nsubsequent `add r6, #4` simply advances whatever they left in r6.\n\nAfter the\
  \ loop:\n  * `oBattleState_Unk_04_05` (u16) is mirrored into `oBattleState_Unk_12_13`.\n  * `CopyWords(state +\
  \ oBattleState_BattleActors,\n    state + oBattleState_AliveBattleActors, 0x20)` is called via\n    `state = *(toolkit\
  \ + oToolkit_BattleStatePtr)`, i.e. 8 u32 words\n    (0x20 bytes) of live actor state overwrite the battle-actor\
  \ slots\n    using `R10 + oToolkit_BattleStatePtr` as the BattleState pointer.\n\nRegister form, old prompt; queued\
  \ for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
