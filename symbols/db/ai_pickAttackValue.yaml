name: ai_pickAttackValue
address: '0x08107EB0'
kind: function
status: probable
summary: AI helper that selects one of {0xD,0x10} from a table based on the acting object's HP vs half
  max HP, then adds 0x10 if the object's collision flag word has bits 0xA000 set, returning the result
  to the attack-state caller.
interface: (uses r5 = battle object) -> r0 = selected value (0xD/0x10, +0x10 if flag 0xA000 set); no flags
  meaningful
details: Compares the object's HP against half its max HP (oBattleObject_MaxHP >> 1) and sets a selector
  r2 to 4 when HP is at or below half, 0 otherwise. It then calls sub_800FE28 with r0 = byte_8107EE0 +
  r2 and r1 = the raw HP value, which returns one of the table's byte values {0x10, 0x10, 0xD, 0xD, 0x10,
  0x10, 0xD, 0xD} into r4. It then reads the object's collision flag word via object_getFlag and tests
  bits 0xA000 (0x8000|0x2000); if set, 0x10 is added to the result. The caller ai_attackRandomFreePanel
  (attack setup entering state 9) consumes this value, consistent with it being a panel id or row/side
  offset for the attack; the +0x10 likely selects the mirrored/other side of the field. The exact meaning
  of the two byte values and of flag bits 0xA000 is not pinned down from this function alone.
