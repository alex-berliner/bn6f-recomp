name: startFadeState
address: '0x081383C4'
kind: function
status: probable
summary: If no screen fade is active, starts one via SetScreenFade(0x80,0xFF) and initializes the r5 state
  object with two script pointers (byte_8138944, byte_8138B90), clears a flag byte, and sets the step
  byte to 8.
interface: (r0 = state object in r5, no args) -> r0 = 0; calls SetScreenFade(0x80, 0xFF) if no fade active
details: 'First checks IsScreenFadeActive and does nothing if a fade is already running. Otherwise it
  calls SetScreenFade(0x80, 0xFF) to begin a fade, then reinitializes the object pointed to by r5: stores
  the pointers byte_8138944 and byte_8138B90 into fields +0x18 and +0x1C (likely a script/data pair, e.g.
  current and next table), clears the byte at +0xC and +2, and sets the byte at +1 to 8, which looks like
  a state/step selector. The structure and both data blobs are shared with sibling state handlers, suggesting
  a scripted sequence/transition controller whose r5 is a task or scene context.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl IsScreenFadeActive ... beq skip: only acts when no fade is in progress; mov r0,#0x80 / mov
    r1,#0xff / bl SetScreenFade: initiates a fade with fixed parameters; str r0,[r5,#0x18] and str r0,[r5,#0x1c]
    load byte_8138944 / byte_8138B90 as data pointers; strb #8 into [r5,#1] and #0 into [r5,#2]/[r5,#0xC]:
    resets a small state block, setting step 8'
  refs:
  - bn6f/asm/asm36.s:17307
  - 0x080062F8 IsScreenFadeActive
  - 0x08006270 SetScreenFade
  reproduce: python3 tools/asmcat.py 0x081383C4
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches: it early-returns if IsScreenFadeActive is set (beq locret_81383E8), else calls
    SetScreenFade(0x80,0xFF), then stores byte_8138944 at [r5+0x18], byte_8138B90 at [r5+0x1C], clears
    [r5+0xC], sets [r5+1]=8, clears [r5+2], returns 0 in r0. The ''transition state'' interpretation is
    plausible since two script tables are loaded and a step selector set to 8, but nothing in the code
    definitively proves it''s a ''transition'' vs. any other scripted state. The summary''s wording ''reinitializes
    an active state object'' is fine; the name should drop ''Transition'' since it''s unverified.; run
    wf investigate investigate-20261019-003606; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
