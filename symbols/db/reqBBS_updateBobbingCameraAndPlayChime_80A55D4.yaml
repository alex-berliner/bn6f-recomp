  detail: '- `[r5+0x2c]` down-counter reset to 0x12 at `sub r0,#1` / `str r0,[r5,#0x2c]` / `mov r0,#0x12`
    (lines 13-15) identifies the per-frame tick. - `[r5+0x6]` == 1 short-circuits the routine ("already
    done") at the `beq locret_80A5674`. - `bl pickBBSMsgForMapGroup_80A5764` (BBS-id picker) plus the
    4-way switch on `[r5+0x7]` adding or subtracting into `[r5+0xc]/[r5+0x10]` is a textbook "drift a
    coordinate toward a target id". - The `sub_80A5690` call (camera-in-hotspot) gating the second branch
    matches a BBS handler that waits until the camera lies inside the current map group''s BBS hotspot
    rectangle. - `sub_8003694` (world->screen projection) followed by `cmp r2,#0 ; bne loc_80A5670` is
    the "if on-screen" guard; the else-branch sets `[r5+0x5]=1`, the standard "save the current spot to
    restore later" slot (re-stored into `[r5+0xc]/[r5+0x10]` from `[r5+0x24]/[r5+0x28]`). - `movflag EVENT_4EB
    ; bl TestEventFlagFromImmediate` is the story-progress gating that decides "do not post the BBS message
    at this point in the game".'
