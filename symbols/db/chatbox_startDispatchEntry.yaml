summary: Initializes the chatbox scratch eStruct at 0x200A6A0 with the chatbox dispatch table and handler,
  marking it active.
interface: (r0 = dispatchTable from chatbox_dispatchTable_804C058, r1 = handler = sub_804C074, r2 = 0)
  -> void; uses 0x50-byte eStruct at 0x200A6A0
details: Loads the chatbox dispatch table pointer and the chatbox handler function pointer, then calls
  Initialize_eStruct200a6a0 with r2 = 0 to install these into the +4/+8/+C slots of the chatbox scratch
  eStruct at 0x200A6A0 and mark it active (+0 = 1). Used by sub_8083DC4 only when EVENT_4FE is set, suggesting
  it triggers/arms a chatbox dispatch sequence after a BBS event flag setup. Return value is ignored by
  the caller.
