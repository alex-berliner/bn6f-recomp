name: battle_aiDispatchByVersion_81159B0
address: '0x081159B0'
kind: function
status: confirmed
summary: Selects a battle-AI handler from a version-indexed jump table and invokes it for the given battle
  object, storing the return value in the object's extra-vars slot.
interface: battle_aiDispatchByVersion_81159B0(BattleObject *obj /*r5*/, u32 r2, u32 r3) -> (r0-r3, NZCV)
  /* r4-r7 preserved */
details: 'Reads obj->AIDataPtr (oBattleObject_AIDataPtr), then the single-byte version field at

  oAIData_Version_16 (0–3 in practice). Multiplies by 4 to index the word-sized jump table

  at byte_8115980 (label off_8115BB8) and loads the chosen handler address into r6.

  Calls battle_spawnType2LinkedChild / sub_80B8786 which acts as the actual AI dispatch

  trampoline (it uses r6 as the handler pointer). The u32 result in r0 is stored back into

  obj->ExtraVars (oBattleObject_ExtraVars). r2 and r3 are pass-through parameters to the

  selected AI routine (context values such as a target index or action id). Flags r0-r3

  and NZCV propagate from the handler call; r4-r7 are saved/restored via the push/pop

  {r4,r6,lr} prologue.

  '
