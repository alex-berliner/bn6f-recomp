open_questions:
- What actor class uses sprite id 0x80 and palette 0 — without seeing the sprite archive this stays "laser/beam"
  inferred from the per-panel Z bump and lack of HP fields.
- What the byte at byte_80CC0D8 entries actually encode (the meaning of the u32 stored at DamageAndStaminaDamageCounterDisabler
  is opaque from this routine alone).
- Whether sub_80CC486 is the spawner factory or the per-frame action dispatcher; confirming it would pick
  a precise name (init vs. action).
