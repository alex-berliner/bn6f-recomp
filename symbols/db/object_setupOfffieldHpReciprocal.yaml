name: object_setupOfffieldHpReciprocal
address: '0x081166D4'
kind: function
status: probable
summary: Hides the battle object off-field at panel X=7 and stores a 0x4000/MaxHP fixed-point reciprocal
  at object+0x80.
interface: (r5 = battle object, no args) -> r0 = 0x4000/MaxHP stored to [r5+0x80]; object moved to panel
  (7, unchanged Y), collision cleared
details: Runs on the object held in r5. First object_clearCollisionRegion removes it from its collision
  region, then PanelX is set to 7 (one past the last panel column, i.e. off-field), and object_setCoordinatesFromPanels/object_updateCollisionPanels
  refresh the pixel position and facing for that new panel. Finally it loads MaxHP from the object, divides
  0x4000 (16384, i.e. 2^14 fixed point) by it with BIOS SWI 6 (Div), and stores the halfword result at
  object+0x80. That value is a reciprocal of MaxHP suitable for computing HP-fraction quantities (x *
  recip >> 14 = x/MaxHP), but what reads it is not visible here. No argument registers are touched, so
  callers must set up r5 before calling.
