name: sub_8006366
address: '0x08006366'
kind: function
status: confirmed
summary: per-frame update of one entry in the eScreenFade screen-fade array, ticking its counter down and repainting
  its two palettes with a fading grey until the end counter is hit
interface: void sub_8006366(u32 r5 /* fade entry */);
details: "Acts on a fade struct (size 0x20) whose fields are the screen-fade-array entry. Layout:\n  +0x2 u8  started\
  \ (latched to 1 on entry)\n  +0x4 u16 step   (amount subtracted from counter each frame)\n  +0x6 u16 counter (fade\
  \ time left; grey brightness = counter >> 4)\n  +0x8 u16 repaint id\n  +0xA u16 end_counter (counter value at\
  \ which the fade is finished)\n  +0xC u8  pal_base\n  +0x10 u32 palette 1\n  +0x14 u32 palette 2\n  +0x18 u16\
  \ repaint arg 1\n  +0x1C u16 repaint arg 2\n\nFirst update after creation only sets started = 1 and does not tick;\
  \ from the next frame\ncounter -= step, clamped at 0. While counter > end_counter the routine builds one 15-bit\n\
  BGR15 grey (level = counter >> 4, color = level | (level<<5) | (level<<10)) and calls\nsub_8002378 twice to repaint\
  \ palette1 through slot pal_base+0x12 and palette2 through\nslot pal_base+0x13, both with the fade's repaint id\
  \ and the appropriate repaint arg.\n\nWhen counter has reached end_counter it stops: stops the fade via\nscreenFade_StopAndFreePalettes_8006330\
  \ (offset within eScreenFade is recomputed as\nr5 - eScreenFade and passed in r0). r4 is forced to 1 and r3 carries\
  \ the old started flag\nstraight through that callee.\nr4/r6 are saved/restored around the repaint calls so the\
  \ function preserves r4..r7.\n"
