name: MapScriptCutsceneCmd_set_event_flag_range
address: '0x08035DF8'
kind: function
status: confirmed
summary: Map-script/cutscene command that sets a contiguous run of event flags, then consumes its 4-byte script
  record and continues the script.
interface: Next MapScriptCutsceneCmd_set_event_flag_range(void); reads command params via script stream helpers,
  returns 1 in r0 ("keep running"); outgoing nz/c/v come from the ADDS r7,#4 position update
details: 'Command handler in the map-script/cutscene interpreter. Reads one byte

  (r6=1 selects ReadMapScriptByte) and then one halfword (r6=2 selects

  ReadMapScriptHalfword) from the script stream addressed by r7/r10; the

  readers return data in r4 and preserve other arguments, so the byte is

  carried in r1 across the second read. It then calls

  SetEventFlagRange(u16 entryFlagBitfield, ?, u8 count) with r0 = halfword

  (the starting flag bitfield) and r2 = byte (the range/count argument),

  i.e. this opcode marks a whole range of event/story flags as set.

  Finally it advances the script cursor r7 by 4 (opcode + byte + halfword,

  so the command is fixed-width in the stream) via ADDS r7,#4, which sets

  the outgoing nz/c/v flags, and returns 1 in r0 to signal the interpreter

  to keep executing. r5 is preserved (required by callers); the middle

  argument of SetEventFlagRange is whatever r1 holds at the call, which is

  the same byte value copied into r1 before the halfword read.

  '
