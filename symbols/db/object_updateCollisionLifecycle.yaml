name: object_updateCollisionLifecycle
address: '0x080DD15C'
kind: function
status: probable
summary: 'Per-frame update for a battle object that resolves its pending collision: spawns the hit effect,
  dispatches a per-action handler, and marks the object for destruction once the battle is over or the
  collision flags say so.'
interface: (r5 = battle object) -> r0 = destroyed? (1 if CurState set to CUR_STATE_DESTROY, else 0); calls
  are flag-based branches, no return value used
details: This is a shared collision-lifecycle step for a battle object held in r5. If time-stop is active
  it does nothing (returns via pop {pc}). Otherwise it tears down the object's collision data (object_removeCollisionData),
  spawns the hit-effect object at the last collision coordinates (object_spawnCollisionEffect), and checks
  battle_isBattleOver. If the battle is over OR the collision's FlagsFromCollision field (read via oBattleObject_CollisionDataPtr)
  is nonzero, it clears the object's collision region, re-presents collision data, and writes CUR_STATE_DESTROY
  into the combined CurState/phase field — the object will be removed next update. Otherwise it jumps
  through a 3-entry dispatch table (off_80DD1A0) indexed by oBattleObject_CurAction, then calls object_presentCollisionData
  to refresh this frame's collision state. The dispatch handlers (sub_80DD1AC/204/22E) are action-specific
  updates; the caller sub_80DD0D0 runs this on its objects during battle.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl battle_isTimeStop + bne locret: whole update is skipped while time is frozen; bl object_removeCollisionData
    / object_spawnCollisionEffect back-to-back: consumes the recorded collision and produces its hit effect;
    tst r0,r0 on oCollisionData_FlagsFromCollision and battle_isBattleOver both lead to object_clearCollisionRegion
    + CUR_STATE_DESTROY store; ldr r1,[r1,r0] off_80DD1A0 indexed by oBattleObject_CurAction with mov
    lr,pc; bx r1: per-action dispatch of 3 handlers; bl object_presentCollisionData on both paths keeps
    the frame''s collision presentation consistent with the project''s summary of that helper'
