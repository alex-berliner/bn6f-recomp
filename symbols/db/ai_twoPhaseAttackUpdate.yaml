name: ai_twoPhaseAttackUpdate
address: '0x080F2F80'
kind: function
status: probable
summary: 'Per-frame AI attack handler: waits out a windup timer, then marks the object moving for AttackDuration
  frames before exiting the attack state.'
interface: (r5 = battle object, r7 = AI attack vars) -> void; no return value
details: Reads oAIAttackVars_AttackElement as a phase selector. Phase 0 decrements oAIAttackVars_StepTimer;
  when it reaches 0 the object's current animation is set to 0, ObjectFlags1 bit 0x40 is cleared, the
  CURRENTLY_MOVING_1 bit is set, StepTimer is reloaded from oAIAttackVars_AttackDuration, and the phase
  becomes 4. Phase 4 only counts StepTimer down and, on expiry, calls object_exitAttackState to end the
  attack. The 0x40 bit cleared is presumably a hold/freeze-style flag that was keeping the object stationary
  during the windup. Only touches the AI attack vars block and the object's anim/flag fields.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: tst on oAIAttackVars_AttackElement with two distinct countdown branches shows a phase state
    machine; phase transition sets oBattleObject_CurAnim=0, clears 0x40, sets CURRENTLY_MOVING_1, and
    copies AttackDuration into StepTimer; second branch ends with bl object_exitAttackState, confirming
    it is an attack-state handler; uses object_clearFlag/object_setFlag1 on ObjectFlags1, consistent with
    battle object collision flags
  refs:
  - bn6f/asm/asm31.s:126220
  - 0x0801A15C object_clearFlag
  - 0x0801A152 object_setFlag1
  - 0x08011714 object_exitAttackState
  reproduce: python3 tools/asmcat.py 0x080F2F80
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-182231'
