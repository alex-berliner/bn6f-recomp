name: gameProgress_resetBuffer_803532c
address: '0x0803532C'
kind: function
status: confirmed
summary: Resets the game-progress flag buffer to the default table values and clears the current progress state
  in the game state struct.
interface: void gameProgress_resetBuffer_803532c(void); // inputs r4-r7,r10 (preserved except r7 used as scratch),
  outputs r3=0x19 (entries copied); clobbers r0,r1,r3,r6,r7 and NZCV
details: Copies 0x19 (25) default entries from the ROM table at byte_8037694 into the working RAM buffer at gameProgressBuffer_20010f0.
  Each table entry is two bytes wide but only the low byte is copied (source pointer advances by 2, destination
  by 1), so the second byte of each pair is ignored/unused. After the copy, reads the game state struct pointer
  from the toolkit (r10 + oToolkit_GameStatePtr) and stores 0 to GameState+0x6 (oGameState_GameProgress), marking
  that no game progress has been made. Returns r3 = 0x19, the entry count, as a side effect. r4-r7 are pushed/popped
  so effectively preserved.
