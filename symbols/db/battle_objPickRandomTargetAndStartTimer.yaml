name: battle_objPickRandomTargetAndStartTimer
address: '0x080E5A08'
kind: function
status: probable
summary: 'Battle object state step: picks a random opposing actor as target into ExtraVars and starts
  Timer2 from Param2, then switches to the update state.'
interface: (r0 = unused, r5 = battle object) -> stores target actor ptr in oBattleObject_ExtraVars, Timer2
  = Param2, Timer = 0, CurStateActionPhase = CUR_STATE_UPDATE; returns via sub_80E5A22
details: Stores the result of battle_pickRandomOpposingActor (a pointer to a random alive actor on the
  opposite alliance) into the object's oBattleObject_ExtraVars field, which serves as this object's chosen
  target. It then copies oBattleObject_Param2 into oBattleObject_Timer2, apparently a duration/count configured
  per object, and clears oBattleObject_Timer. It writes CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  to move the object into its update state, then tail-follows with a call to sub_80E5A22 before returning.
  No flags are meaningfully set. This looks like the entry step of a timed action where the object targets
  a random enemy.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl battle_pickRandomOpposingActor; str r0,[r5,#oBattleObject_ExtraVars] — result stored as the
    object's chosen actor; ldrb r1,[r5,#oBattleObject_Param2]; strh r1,[r5,#oBattleObject_Timer2] — object
    param becomes the Timer2 duration; strh r0(=0),[r5,#oBattleObject_Timer] — Timer reset before the
    state runs; mov r0,#CUR_STATE_UPDATE; str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]
    — transitions object into update state; callee battle_pickRandomOpposingActor's known summary matches
