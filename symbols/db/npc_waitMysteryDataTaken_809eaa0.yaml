name: npc_waitMysteryDataTaken_809eaa0
address: '0x0809EAA0'
kind: function
status: confirmed
summary: Overworld NPC handler that, once its linked MysteryData event flag has been taken, swaps the NPC's sprite,
  frees it and toggles its script, then always falls through to the secondary script pass.
interface: void npc_waitMysteryDataTaken_809eaa0(struct OverworldNPCObject* r5) -> r0 r1 r2 r5 r11 lr; nz c v
details: "Polls a MysteryData event flag (MysteryDataId offset on the NPC object) via TestEventFlag; Z set means\
  \ the data has not yet been taken.\nOn \"data taken\" branch:\n  - Enables secondary script 0x19 (npc_enableScript0x19_809f516)\
  \ and sets OW_NPC_UNK_FLAGS_60_DISABLE_INTERACTION in UnkFlags_60, marking the NPC as non-interactive.\n  - Sets\
  \ oObjectHeader_Flags to OBJECT_FLAG_ACTIVE so the object participates in the swap/free sequence.\n  - Loads a\
  \ replacement overworld sprite (tileset 0x80, attr 0x1C, anim 0xA0) via sprite_load + sprite_loadAnimationData.\n\
  \  - Frees the NPC via FreeOverworldNPCObject and disables script 0x19 (npc_disableScript0x19_809f51e).\nBoth\
  \ paths end with npc_runSecondaryScriptMaybe_809ebf8, whose outputs (r0/r1/r2/r5/lr) are returned to the caller;\
  \ r11 in the contract is set by that tail call.\nTouches fields oOverworldNPCObject_MysteryDataId, oOverworldNPCObject_UnkFlags_60,\
  \ oObjectHeader_Flags on the NPC object (r5). r7 is used as a base+offset constant via \"#oOverworldNPCObject_MysteryDataId\"\
  .\n"
