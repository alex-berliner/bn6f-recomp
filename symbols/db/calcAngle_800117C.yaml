name: calcAngle_800117C
address: '0x0800117C'
kind: function
status: confirmed
summary: Returns the direction of a fixed-point (x,y) vector as a single byte (0..255 over a full turn), via the
  BIOS ArcTan2 call.
interface: u8 math_vectorAngleByte(s16_16p dx /* r0, upper 16 bits meaningful */, s16_16p dy /* r1, upper 16 bits
  meaningful */)
details: 'Thin wrapper around BIOS swi 0xA (ArcTan2). Both arguments arrive as

  fixed-point values where only the upper 16 bits matter; the function

  arithmetic-shifts each right by 16 and swaps them (r0 gets dy, r1 gets dx)

  before the BIOS call, so the angle is measured with y as the first

  component — the ArcTan2 convention of angle measured from the y axis /

  clockwise. The 16-bit BIOS angle (0x8000 = half turn) is shifted right by

  8 to give a 0..255 byte over a full circle, suitable for the game''s

  256-step angle tables. Side effects on registers: r2 comes out holding

  dx''s upper half (as left by the shift before the swap), r1 is scratch,

  flags are clobbered by the shifts/SWI. r3 is listed in the caller contract

  as both input and output but is never touched by the body — it just

  passes through. Likely used for sprite rotation indices, projectile/

  homing directions, or NPC facing in the battle and field engines.

  '
