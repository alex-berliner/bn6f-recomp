name: sub_80E18DA
address: '0x080E18DA'
kind: function
status: hypothesis
summary: Tick a battle object's timed phase, advancing to phase 0x0C after a 0x1E-frame countdown.
interface: void sub_80E18DA(battleObject_t *r5); /* clobbers r0, sets N/Z based on timer-1 */
details: 'On first entry (phase-init byte == 0) seeds oBattleObject_Timer with 0x1E and writes

  phase-init=4 so it doesn''t re-seed. Each call decrements oBattleObject_Timer; when the

  decrement would underflow (result negative, i.e. timer hit zero and goes below), the

  phase state field oBattleObject_CurPhaseAndPhaseInitialized is overwritten with 0x000C,

  handing the object off to its next sub-phase handler. Behavior matches a generic

  wait/vanish-style phase tick used by battle object state machines.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
