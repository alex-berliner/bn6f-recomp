name: e_waitFadeThenCloseChat
address: '0x0812C010'
kind: function
status: probable
summary: Waits for the screen fade to finish, then zero-fills unk_2037780, calls chatbox_8040818, sets
  story flag EVENT_1710, and advances the caller's state byte at [r5,#3] to 4.
interface: (r5 = event/task object whose byte at +3 is the state/phase counter) -> void; flags clobbered
  by calls
details: This is one step of a scripted event state machine. It first checks IsScreenFadeActive and does
  nothing if a fade is still in progress, so the step waits for the fade to finish. It then zero-fills
  0x80 bytes at unk_2037780 (likely a text/chatbox work buffer) and calls chatbox_8040818 to tear down
  or close the chatbox. It sets story flag EVENT_1710 via SetEventFlagFromImmediate, recording that the
  event point was reached, and finally writes 4 to the state byte at [r5,#3], moving the event to its
  next phase. The ZF-return convention of IsScreenFadeActive makes beq skip the body while the fade is
  active.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl IsScreenFadeActive / beq locret_812C030: whole body gated on no fade being active; ldr r0,
    =unk_2037780 + ZeroFillByEightWords(r0, 0x80): clears a 128-byte work buffer; bl chatbox_8040818 immediately
    after the clear: chatbox teardown/reset; movflag EVENT_1710 + bl SetEventFlagFromImmediate: marks
    a story/progress flag; mov r0,#4 / strb r0,[r5,#3]: writes a small state value to a caller-held object,
    typical event phase advance'
