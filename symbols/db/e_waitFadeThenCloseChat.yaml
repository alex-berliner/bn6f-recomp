open_questions:
- What r5 points to (event controller/task struct) and which event this step belongs to — no callers known
- Exact effect of chatbox_8040818 (close vs clear) and the meaning of the 0x80-byte buffer at unk_2037780
- Semantics of state value 4 at +3 within the event state machine
- The callee name (chatbox_8040818) and unk_2037780 zero-fill match the proposal. However, the function
  writes byte 4 at [r5,#3] before returning, which matches a state advance; nothing in the code indicates
  it is closing anything itself or that the caller is chat-specific. The name 'e_closeChatAndSetEventFlag'
  overclaims what the callee chatbox_8040818 does — this routine just invokes it. The body is closer to
  'e_waitFadeThenAdvance' with side effects.
