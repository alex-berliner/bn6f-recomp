name: battle_objectPanelEmergeStep
address: '0x0802DACC'
kind: function
status: probable
summary: Per-frame state step that plays an object's one-shot emerge-from-panel setup (white flash, panel
  reserve, flip, effects, sound) and then counts down a 10-frame timer before advancing the state machine.
interface: (r5 = battle object, r7 = state/work struct; r0-r3 clobbered) -> r0 clobbered; sets [r7,#0]=4
  when the 10-frame timer [r7,#0x10] expires
details: 'Runs as a two-phase state: if [r7,#1] is set it only decrements the halfword timer at [r7,#0x10]
  and writes state 4 to [r7,#0] on expiry; otherwise it performs the emerge setup once. The setup flashes
  the sprite white, sets battle flag 4, copies panel coords from [r5+0x14/0x15] into [r5+0x12/0x13], removes
  then re-reserves the object''s panel, recomputes collision panels and sprite coordinates, stores battle_checkEmergeDirectionFlip''s
  result in [r5+0x17], refreshes sprite/arm, clears object flags 0x1c41 and flags2 bit 0x10, sets animation
  2, spawns three effect objects using the triple at [r5+0x34..0x3c] (zeroing [r5+0x3c] first), zeroes
  [r5+0x4c] and fields 0x5c/0x68 of the object at [r5+0x58], plays sound effect 0x6C, then arms the timer
  (10) and substate flag.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl battle_checkEmergeDirectionFlip ... strb r0,[r5,#0x17] — the callee is documented as the
    panel-landing/emerge animation DirectionFlip, stored into an object field; object_removePanelReserve
    / object_reservePanel / object_setCoordinatesFromPanels / object_updateCollisionPanels cluster re-places
    the object on its panel, matching an emerge landing; bl sprite_forceWhitePalette + PlaySoundEffect(0x6c)
    + three spawn_t1_0x0_EffectObject calls from [r5+0x34..] = one-shot emerge presentation; strh 0xa,[r7,#0x10];
    strb 4,[r7,#1] then loc_802DB4A decrements [r7,#0x10] and writes 4 to [r7,#0] at 0 — a timed substate
    that hands off to state 4; ldrb r0,[r7,#1]; bne loc_802DB4A gates the whole setup so it executes exactly
    once for the emerge
