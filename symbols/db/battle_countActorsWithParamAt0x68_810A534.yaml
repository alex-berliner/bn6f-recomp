name: battle_countActorsWithParamAt0x68_810A534
address: '0x0810A534'
kind: function
status: confirmed
summary: Thin wrapper that scans the battle for actors (of actor kind 7) whose parameter field at offset 0x68 is
  nonzero, returning how many there are and the sum of those parameters.
interface: "int sub_810A534(search_context in r5, aux in r10)\n  -> count in r0, parameter sum in r1, and per-match\
  \ data in r5/r6/r7\n  (r5, r10 passed through to the callee; r4, r5-r7 preserved overall; flags clobbered)\n"
details: 'Immediately calls FindBattleActorsWithNonzeroParam_ReturnCountAndSum with the fixed arguments r0=0x68
  (field offset within the actor struct being tested), r1=7 (actor kind/filter), r2=0xC (max 12 actors examined),
  forwarding the caller''s r5 (search context) and r10 unchanged. The callee returns the match count in r0 and the
  sum of the nonzero 0x68 values in r1; this wrapper just relays r0, r1, r5, r6 and r7 back out. Sits in the genericAI/battle-object
  data region next to attack-state dispatch helpers and tables of timer values (byte_810A5B0: 0x14, 0x28, 0x3C,
  0x50, 0x3C, 0x64) and durations (byte_810A5BC: 0x3C down to 0x1E), so it is likely used by AI code to tally live
  spawned objects/entities (e.g. active attack objects or hazards of category 7) carrying a counter or id in their
  0x68 field. No local state; padded with zeros to alignment after the return.

  '
