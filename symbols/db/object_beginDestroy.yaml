name: object_beginDestroy
address: '0x080DC0AC'
kind: function
status: probable
summary: 'Marks a battle object as destroyed: clears its active flag bit, removes it from its collision
  region, and sets its state to DESTROY.'
interface: (r5 = battle object header pointer, no args in r0-r3) -> r0 = clobbered by call; sets object
  state to CUR_STATE_DESTROY
details: Reads the object's Flags byte, clears bit 1 (likely an 'active/enabled' flag), and writes it
  back. It then calls object_clearCollisionRegion to detach the object from its collision region, and
  finally stores CUR_STATE_DESTROY into the combined CurState/ActionPhase/PhaseInitialized field, which
  the engine treats as the destruction state. The object pointer is passed implicitly in r5, suggesting
  it is called from a per-object context (e.g. an update routine using a register-cached object).
