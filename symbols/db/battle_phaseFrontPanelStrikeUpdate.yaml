name: battle_phaseFrontPanelStrikeUpdate
address: '0x080BE312'
kind: function
status: probable
summary: 'Phase-update for a battle attack: after a wind-up it spawns an effect and an elemental dimming
  collision region on the panel in front of the attacker, then ends the phase.'
interface: (r5 = battle object; r0 unused on entry) -> void; sets PhaseInitialized, CurAnim, Timer, and
  finally CurPhaseAndPhaseInitialized = 0x10
details: On first entry it sets CurAnim=5, plays sound effect 0xB0, clears the Timer and sets PhaseInitialized=4.
  When the Timer reaches 10 it reads ExtraVars+4; if that pointer is set and its byte at +7 is nonzero,
  it uses the alternate parameters (0x36 and data 0x405ff13) instead of (0x18 and 0x405ff01). It then
  combines object_getFlip with that parameter, adds object_getFrontDirection to PanelX, converts the panel
  to pixel coordinates via object_getCoordinatesForPanels, and spawns a type-4 effect object; immediately
  after it spawns a dimming collision region on the front panel, passing the object's Element, the DamageAndStaminaDamageCounterDisabler
  pointer, and 3 as arguments. The Timer then counts up each frame; once it exceeds 0x32 the phase field
  is set to 0x10, ending the attack. The alternate parameter path suggests a charged/variant version of
  the same attack driven by a per-instance byte in the object's extra data.
