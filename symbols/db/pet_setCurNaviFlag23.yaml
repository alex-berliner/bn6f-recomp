name: pet_setCurNaviFlag23
address: '0x08131664'
kind: function
status: probable
summary: Sets byte 0x23 of the currently selected PET navi's stats block to 1.
interface: () -> void; no args used, r0-r3 clobbered by calls
details: Fetches the navi ID currently selected on the PET via GetCurPETNavi (return in r0, game-state
  pointer in r3), then calls SetNaviStats203CCE0Byte with r0 = navi ID, r1 = 0x23 (byte offset within
  the 0x203CCE0 per-navi stats array) and r2 = 1, so it turns on a boolean flag/counter at offset 0x23
  for that navi. The function takes no parameters of its own and returns nothing meaningful. With no known
  callers, the meaning of flag 0x23 (e.g. an unlock, a 'seen/used' marker, or a beast-out-related state)
  cannot be determined from this site alone.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl GetCurPETNavi supplies r0 = selected navi id (asm line 2); mov r1,#0x23 / mov r2,#1 fix the
    byte offset and value before SetNaviStats203CCE0Byte (lines 3-5); callee SetNaviStats203CCE0Byte writes
    the value into the per-navi struct at 0x203CCE0; no other logic in the 8-instruction body, so the
    call pair is the entire effect
  refs:
  - bn6f/asm/asm36.s:2874
