name: battle_aiAddTotalDamageTaken_8010548
address: '0x08010548'
kind: function
status: confirmed
summary: Adds a damage amount to the battle object's AI TotalDamageTaken stat, clamping the running total at 0xFFFF.
interface: void battle_aiAddTotalDamageTaken(battleObject* obj /* r5 */, u32 damage /* r0 */); // preserves r4 (==
  r0 on entry), returns r2 = 0xFFFF
details: 'Reads the battle object''s AI data pointer from [r5 + oBattleObject_AIDataPtr], adds the damage amount
  in r0 to the halfword counter at oAIData_TotalDamageTaken, and stores the result back, saturating at 0xFFFF so
  the counter cannot wrap. The clamp is done with a signed comparison (ble against 0xFFFF), which works here because
  the loaded halfword is zero-extended and the sum cannot exceed 0x1FFFE. Quirk: r2 is left holding the clamp constant
  0xFFFF on return, and r4 is pushed/popped purely to keep the incoming r4 (which holds the damage value copied
  from r0) alive until the end, even though it is never read after the move to r0''s work copy.

  '
