name: e_bounceValue
address: '0x08143FC4'
kind: function
status: probable
summary: Advances a 16.16 fixed-point counter stored in eStruct2001010 by its velocity (which is then
  incremented by acceleration). When the new value would fall below 0 it is clamped to 0; when it would
  exceed 0x64<<16 it is clamped to 0x64<<16. In both clamp paths velocity is negated then has acceleration
  added once. If the value on entry is 0, PlaySoundEffect is called with ID 440.
interface: () -> void; no args, no return; operates on eStruct2001010+0x14 (value, 16.16 fixed), +0x18
  (velocity), +0x1C (acceleration)
details: Reads value/velocity/acceleration from eStruct2001010 fields 0x14/0x18/0x1C, computes value+=velocity
  and velocity+=acceleration. If the new value would go below 0 it is clamped to 0 and velocity is negated
  (new velocity = -velocity), and likewise clamped to 100<<16 (0x640000) at the top with velocity negated
  — a bouncing spring/ease motion spanning 0..100 in 16.16 fixed point. If the value is currently 0 on
  entry, it plays sound effect 440 (0xB9+0xFF), so the sound ticks while the counter sits at zero before
  the velocity lifts it. Everything is stored back to the same three fields; no other state is touched.
