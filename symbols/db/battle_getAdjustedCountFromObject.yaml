name: battle_getAdjustedCountFromObject
address: '0x0811BB18'
kind: function
status: probable
summary: Returns a count from the caller struct, plus one if the referenced battle object's flag byte
  is set.
interface: (r0 = none/scratch; r5 = caller struct with count byte at +0xC and object halfword at +0xE)
  -> r0 = [r5+0xC] (+1 if object descriptor byte 1 nonzero); flags set by cmp r1,#0
details: Loads the halfword at [r5+0xE], subtracts 0x90, and passes it to battleObject_getByIndex_813B780
  to obtain a 0x10-byte battle-object descriptor from StructArr_813944C. It then reads the caller's byte
  at [r5+0xC] and the descriptor's byte at offset 1; if that byte is nonzero it increments the count before
  returning it. The 0x90 offset suggests the +0xE field stores an object ID in a range offset by 0x90
  relative to the descriptor array. The pattern fits computing e.g. a hit/step count with a +1 bonus tied
  to the object's state, but the meaning of byte 1 (active/alive/type) is unconfirmed.
