    caller field; ldrb r0,[r5,#0xc]; ldrb r1,[r1,#1]; cmp r1,#0; add r0,#1 — result is count byte plus
    1 when descriptor byte 1 is set; sole caller sub_811BAC4 is itself undocumented, providing no extra
    context
