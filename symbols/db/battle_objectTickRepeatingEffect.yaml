  reproduce: python3 tools/asmcat.py 0x080BC058
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise — The summary
    and mechanics match the code: phase 0 sets CurPhase=4, calls sub_80BC13E, plays sound 0xFF, Param2=0, Timer=(Param1+1)*0x14,
    Timer2=0x14. Each frame decrements both; when Timer2 hits 0 it calls sub_80BC160, plays 0xFF, increments Param2,
    reloads Timer2=0x14. When Timer <=0 it sets CurAction=0x10 and clears CurPhaseAndPhaseInitialized. Note however
    the Timer init is (Param1+1)*0x14, not Param1*0x14, so there are Param1+1 total triggers (initial setup counts
    as one), and ''interval attack'' is misleading — this just repeatedly triggers an effect/sound on a battle object,
    likely a generic repeating action rather than an ''interval attack''.; run wf investigate investigate-20261019-030611;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
