name: battle_objectTickRepeatingEffect
address: '0x080BC058'
kind: function
status: probable
summary: Battle object action that on first entry calls sub_80BC13E (setup), then every 0x14 frames calls sub_80BC160
  (effect) and plays sound 0xFF, (Param1+1) total times, then sets CurAction=0x10.
interface: (r5 = battle object) -> void; sets oBattleObject_CurAction=0x10 when done
details: On first entry (phase 0) it sets phase 4, calls sub_80BC13E (setup), plays sound 0xFF, resets Param2 to
  0, and initializes Timer = Param1*0x14 (0x14 per repetition) and Timer2 = 0x14. On later frames it counts both
  timers down; whenever Timer2 reaches 0 it calls sub_80BC160 (one repetition of the effect), plays sound 0xFF again,
  increments Param2 (count of repetitions done), and reloads Timer2 with 0x14. When the master Timer runs out, it
  sets CurAction = 0x10 and resets CurPhaseAndPhaseInitialized to end the behavior. Param1 therefore holds the number
  of repetitions and 20 frames the interval between them.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'phase 0 branch: strb 4 to oBattleObject_CurPhase, bl sub_80BC13E, PlaySoundEffect(0xFF), Timer=Param1*0x14;
    Timer2 reload of 0x14 with bl sub_80BC160 + PlaySoundEffect(0xFF) on each expiry = periodic trigger with sound;
    Param2 incremented each cycle, Param1*0x14 total Timer => Param1 repetitions of 20 frames; Timer expiry: CurAction=0x10
    and CurPhaseAndPhaseInitialized=0 to hand control back to the action dispatcher'
  refs:
  - bn6f/asm/asm31.s:8707
  - 0x080005CC PlaySoundEffect
  - 0x080BC13E sub_80BC13E
