name: text_loadWindowGlyphs
address: '0x0811BCD8'
kind: function
status: probable
summary: Selects one of the text engine's three glyph buffers by a window-id byte and has the text-gfx
  renderer copy that window's glyphs into its VRAM tile slot, then marks the window loaded.
interface: (r5 = text-window struct, [r5+5] = window id) -> r0 = 0; writes [r5+8] = 8; flags clobbered
details: 'Reads an id byte at [r5+5] (struct pointer survives in r5 across the call, saved/restored by
  push/pop r5) and uses it to index three parallel tables: a byte table at dword_811BD30 (0x3A,0x33,0x34),
  a pointer table off_811BD10 choosing among gfx buffers unk_201AA00 / byte_201AE00 / byte_201B200, and
  a table of VRAM destinations byte_811BD20 = {0x06012A00, 0x06013200, 0x06013A00}, spaced 0x800 apart
  like per-window tile slots. It calls renderTextGfx_8045F8C with r0 = eTextScript201BF20 (text-engine
  state), r1 = table byte, r2 = selected gfx buffer, r3 = selected VRAM address, r4 = 9, r5 = 1, r6 =
  dword_86A5D60, r7 = 0. Afterwards it stores 8 into the struct''s state byte at [r5+8], matching a task/state-machine
  pattern where 8 likely means ''glyphs loaded''.'
