name: chatbox_CopyBackgroundTiles_8040344
address: '0x08040344'
kind: function
status: confirmed
summary: Redraws the chatbox's background tiles by blitting the tile-id array matching its current background graphic
  and open state at its current position and size.
interface: void chatbox_CopyBackgroundTiles(chatbox *cb /* r5 */) — reads cb fields at 0x1D2, 0x10 (OpenState),
  CurTileXBlockPos, CurTileYBlockPos, CurTileWidth16, CurTileHeight16; r0-r4 are scratch handed to CopyBackgroundTiles;
  r5-r7, r10 preserved; c/v set per CopyBackgroundTiles.
details: "Wrapper around CopyBackgroundTiles that picks the right tile-id pointer for the\nchatbox's current look.\
  \ From the chatbox struct it reads:\n  - bgId       = [cb + 0x1D2]   (current background tileset/graphic id)\n\
  \  - openState  = [cb + 0x10]    (which open-state variant of the frame)\n  - j          = [cb + oChatbox_CurTileXBlockPos]\
  \  (horizontal start, in tiles)\n  - i          = [cb + oChatbox_CurTileYBlockPos]  (vertical start, in tiles)\n\
  \  - j_size     = [cb + oChatbox_CurTileWidth16]    (width in tiles)\n  - i_size     = [cb + oChatbox_CurTileHeight16]\
  \   (height in tiles)\nThe tile-id pointer is spritePtrArr8045CEC[bgId*8 + openState] (bgId<<5 +\nopenState<<2),\
  \ i.e. 8 pointer slots per background id, one per open state, so\nthe frame graphic changes with the box's open/closed\
  \ animation state.\nIt then calls CopyBackgroundTiles(j, i, 0 /* 32x32 tile block #0 */, tileIds,\nj_size, i_size)\
  \ — the block index is hardcoded to 0.\nQuirk: to keep the stack layout identical to the original while the callee\n\
  runs, it pushes r5 then lr (callee sees [SP]=chatbox ptr, [SP+4]=return addr);\nr5 is restored after the call.\
  \ This function name matches an already-named\ncallee; it is essentially the chatbox-level \"redraw background\"\
  \ step.\n"
