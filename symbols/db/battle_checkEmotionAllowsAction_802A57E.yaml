name: battle_checkEmotionAllowsAction_802A57E
address: '0x0802A57E'
kind: function
status: confirmed
summary: Checks a battle actor's emotion state and a counter to decide (0/1) whether some action is currently
  allowed.
interface: u32 battle_checkEmotionAllowsAction_802A57E(u32 actor /* r5 */); returns 1 or 0 in r0
details: "Takes the actor pointer/handle in r5 and calls battle_getActorEmotion_802A564, which returns\
  \ the emotion id in r0 and a secondary value in r1 (a counter or timer of some kind). The decision logic:\n\
  \  - emotion id 5 -> always returns 0 (action blocked).\n  - emotion id 1 and the byte at [dword_20349A0\
  \ + 0x10] (byte_20349B0) is 0\n    -> returns 0 (blocked; the global byte_20349B0 acts as an enable\
  \ flag\n    that must be set for emotion 1 to pass).\n  - otherwise (emotion 1 with the flag set, or\
  \ any emotion other than 1/5)\n    -> returns 1 only if the signed value in r1 is < 0xB (11), else 0.\n\
  So r1 looks like a countdown/cooldown: once it reaches 11 the action is no longer permitted. Only r0\
  \ (the 0/1 verdict) is meaningful to callers; r1-r3 and flags are whatever battle_getActorEmotion_802A564\
  \ left behind, r4-r6 are preserved by this function itself.\n"
