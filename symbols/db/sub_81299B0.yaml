name: sub_81299B0
address: '0x081299B0'
kind: function
status: confirmed
summary: Handles battle sub-menu cursor movement (Up/Down over 3 items), A to confirm (with EVENT_F2 special-cased
  to a chatbox script) and B to back out to sub-menu state 0x0C.
interface: "void sub_81299B0(u32 r5_state, u32 r6, u32 r7, u32 r10_toolkit)\n  // outputs/clobbers: r0, r1, r2,\
  \ r3, r4, lr; flags NZ C V; preserved r5 r6 r7 r10\n"
details: '- Pulls the just-pressed joypad via r10->toolkit->joypad->Pressed, then runs menu_moveCursorUpDown_811FA22
  over 3 items starting at r5+0x12 (the sub-menu cursor index), wrapping at 1.

  - If the returned cursor index changed, stores the new index at r5+0x12 and refreshes the sub-menu listing via
  sub_812B3CC.

  - On A (SOUND_MENU_SELECT): if the cursor is on item 1 AND EVENT_F2 (0xF2) is NOT set, runs chatbox script 5 via
  chatbox_runScript_803FD9C_on_eTextScript201BA20; otherwise commits via battle_selectTarget_812B414.

  - On B (SOUND_EXIT_SUBMENU): sets r5[3]=0x0C (exit sub-menu state), clears r5[0x1C] and r5[0x1E], and ORs 1 into
  the flag byte at r5[0x1B] (marks the sub-menu as dirty/to-redraw).

  - Touches r5 offsets 0x03, 0x12, 0x1B, 0x1C, 0x1E on the state struct.

  '
