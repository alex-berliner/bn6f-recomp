summary: 'Per-frame update for a battle object: removes its collision data, dispatches to an action handler,
  and either destroys the object or refreshes its collision region for the current frame.'
interface: '(r5 = battleObject) -> r0 = some EWRAM ptr ; side effects: may mark object CUR_STATE_DESTROY
  (writes 0x8 to [r5,#0x8])'
details: '1. push {lr} then tail-call object_removeCollisionData to tear down this object''s CollisionDataPtr
  (r5 is the standard battleObject callee-saved arg).

  2. Tail-call object_spawnCollisionEffect (no captured effect; consistent with object collision teardown).

  3. battle_isBattleOver() -> if non-zero (battle already ending), branch to loc_80CAE10.

  4. Otherwise inspect CollisionDataPtr->FlagsFromCollision (offset 0x70, the collision-region flags).
  If any flags are set, also branch to loc_80CAE10.

  5. loc_80CAE10 path: object_clearCollisionRegion() to release the panel slot, then write CUR_STATE_DESTROY
  (0x8) to BattleObject+0x8 (the combined CurStateActionPhaseAndPhaseInitialized slot) — this is the standard
  "object is gone, kill it next tick" signal used by the battle object list walker.

  6. If the battle is still live and no FlagsFromCollision were set: check battle_isTimeStop(). If time-stopped,
  skip collision re-presentation (b locret).

  7. Otherwise read CurAction ([r5,#0x9], offset BattleObject.CurAction) and use it as an index into a
  2-entry jump table at off_80CAE20 (entries: sub_80CAE28 for action 0, battle_applyXMoveAndCheckDestroy_80CAE94
  for action 1). The selected handler is invoked with `bx` (Thumb→ARM switch via the +1 low bit) and is
  the action-specific behaviour (e.g. an x-move chip handler that also checks destruction).

  8. If the action handler returns without destroying the object, the non-timestop branch falls through
  to object_presentCollisionData(), which re-adds the object to its collision region for the next frame,
  then pop {pc} returns.

  '
