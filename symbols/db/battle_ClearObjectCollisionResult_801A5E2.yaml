name: battle_ClearObjectCollisionResult_801A5E2
address: '0x0801A5E2'
kind: function
status: confirmed
summary: Clears a battle object's collision result fields, resetting whatever hit/interaction outcome was stored
  in its collision data.
interface: void battle_ClearObjectCollisionResult(r5 = BattleObject*) /* returns via mov pc, lr; clobbers r0-r2,
  NZ flags */
details: 'Loads the battle object''s collision data pointer from BattleObject+oBattleObject_CollisionDataPtr, then
  writes zero to oCollisionData_Unk_48 and to the following word at offset 0x4C of the collision data struct. These
  two cleared fields appear to hold the most recent collision result (e.g. hit flags/target info consumed by later
  battle logic), so this acts as a "reset collision outcome" step, likely called each frame before new collisions
  are evaluated. Uses a tail-style return (mov pc, lr) rather than a stacked return address; clobbers r0-r2 and
  the NZ flags.

  '
