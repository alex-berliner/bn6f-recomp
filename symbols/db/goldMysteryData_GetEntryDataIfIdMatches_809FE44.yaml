name: goldMysteryData_GetEntryDataIfIdMatches_809FE44
address: '0x0809FE44'
kind: function
status: confirmed
summary: Checks a mystery data id against the id registered in the gold mystery data work area and, on a match,
  returns that entry's data pointer and content byte.
interface: 'void goldMysteryData_GetEntryDataIfIdMatches(u16 id /* r0 */); // out: r4 = entry data ptr, r3 = content
  byte (only written on match)'
details: 'Takes a mystery data id in r0 and compares it against the 16-bit id stored at

  byte_2000210+6 (the currently registered/selected gold mystery data). If the ids

  match, it reads the entry index from byte_2000210+3, indexes the

  GoldMysteryDataEntries table with stride 12, and loads field +4 of that entry

  (a pointer to the entry''s data) into r4. It also copies the single byte at

  byte_2000210+2 (the entry''s content/state byte, per the verified C) into r3.

  On mismatch, r3 and r4 are left untouched, so the caller must have set them to

  sensible "no result" values beforehand. r5-r7 and the caller''s return address

  are preserved; the function is a leaf (tail-pops into the caller via

  pop {r5-r7,pc}). Work area layout touched: +2 (u8 content byte),

  +3 (u8 entry index into GoldMysteryDataEntries), +6 (u16 registered id).

  '
