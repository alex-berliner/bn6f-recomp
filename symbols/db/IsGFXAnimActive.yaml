name: IsGFXAnimActive
address: '0x08001B84'
kind: function
status: confirmed
summary: Returns (via flags) whether the given graphics animation slot is active by testing its state byte.
interface: bool IsGFXAnimActive(u32 slot /* r0 */); // result in flags (Z set = inactive), r0 = state byte, r1 clobbered,
  r4-r7 preserved
details: 'Indexes the global array of GFX animation state structs (base eGFXAnimStates) by the slot number in r0,
  scaling by oGFXAnimState_Size to reach the slot''s entry, loads its first byte (the animation state/active flag),
  and returns with the N/Z flags set from that byte so the caller can branch directly on "animation running" (nonzero)
  vs "slot idle/finished" (zero). r0 also retains the loaded state byte, r1 is used as scratch for the stride multiply,
  and r4-r7/lr are pushed and popped untouched.

  '
