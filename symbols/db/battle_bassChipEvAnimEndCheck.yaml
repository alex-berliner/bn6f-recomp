name: battle_bassChipEvAnimEndCheck
address: '0x080C3A98'
kind: function
status: probable
summary: Per-frame update for a battle object that plays animation 0xA and, once it reaches a frame flagged
  with attribute 0x80, switches to animation 0xC, starts a 24-frame timer, clears its extra vars, and
  advances to phase 4.
interface: (r0 = scratch/callee arg, r5 = battle object ptr) -> r0 = destroyed; updates oBattleObject
  fields on r5
details: On the first invocation it sets oBattleObject_PhaseInitialized=1 and starts oBattleObject_CurAnim=0xA.
  Every call it queries sprite_getFrameParameters for the current frame's attribute byte and tests bit
  0x80, which acts as an animation-end/signal flag. When set, it switches CurAnim to 0xC, loads oBattleObject_Timer2
  with 24 (a follow-up delay), zero-fills the object's ExtraVars area (BASS_CHIP_EV_UNK_PANEL_COUNTS_SIZE
  halfwords, likely per-panel counters), and writes phase 4 into oBattleObject_CurPhaseAndPhaseInitialized.
  When the flag is clear it just returns, letting the animation keep playing. The use of ExtraVars plus
  the enum name ties this object to the Bass chip event; caller and full phase table not seen.
