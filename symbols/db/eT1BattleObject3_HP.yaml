name: eT1BattleObject3_HP
address: '0x0203AC5C'
kind: ram
previous_names: []
status: confirmed
summary: Current HP (u16) of T1 battle object 3 (eT1BattleObject3 + 0x24, oBattleObject_HP), usually an enemy; writing
  0 deletes it.
details: 'The same field as eT1BattleObject2_HP, for object 3: eT1BattleObject3 is at 0x0203AC38 (0x0203A9B0 + 3
  * 0xD8), its u16 HP at +0x24 (MaxHP at +0x26). The code reaches it only through a battle-object pointer (`[r5,
  #oBattleObject_HP]`), never by this name or address.

  '
