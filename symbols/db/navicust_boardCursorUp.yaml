name: navicust_boardCursorUp
address: '0x081367A0'
kind: function
status: probable
summary: 'Board-screen cursor action: moves the Navi Customizer cursor/list up (with wrap/clamp), stores
  the new position fields, sets a state byte, and plays the menu-select sound.'
interface: (r5 = board-screen state object) -> r0 = sound-effect id passed on; writes halfwords [r5+0x24]
  and [r5+0x20], byte [r5+0xc]; no return value
details: Reads the halfword at [r5+0x1e] (current cursor/scroll index), computes index-4, and on success
  stores that to [r5+0x24] with r1=3 to [r5+0x20]; when index-4 goes negative it clamps to 0 for [r5+0x24]
  and stores index-1 for [r5+0x20] (wrap/clamp branch). It then writes 0xC to byte [r5+0xc], which looks
  like a screen/cursor state or timer field, and plays SOUND_MENU_SELECT via PlaySoundEffect. Being dispatched
  from navicust_handleBoardInput, it is one of the directional/action handlers for the Navi Customizer
  board. The -4 step suggests movement across a 4-wide row or a 4-item page of the board layout.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrh r0,[r5,#0x1e]; sub r0,#4 / bge: index-based movement with a -4 step and a wrap branch;
    strh r0,[r5,#0x24] / strh r1,[r5,#0x20]: writes new cursor/scroll pair into the state object; mov
    r0,#0xc; strb r0,[r5,#0xc]: sets a small state/counter byte in the same object; bl PlaySoundEffect
    with SOUND_MENU_SELECT: standard UI-confirmation feedback; caller 0x08135830 navicust_handleBoardInput
    dispatches button presses to this handler'
