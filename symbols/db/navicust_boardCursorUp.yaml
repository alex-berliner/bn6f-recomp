name: navicust_boardCursorUp
address: '0x081367A0'
kind: function
status: confirmed
summary: Moves the Navicust screen's board cursor one row up (4 slots back), clamping at the top row, plays the
  menu-select sound.
interface: 'void navicust_boardCursorUp(u32 r2 /* passthrough arg to PlaySoundEffect */, u32 r5 /* board state struct
  */); // outputs: r5/r10 survive via PlaySoundEffect; flags NZCV clobbered'
details: 'Reads the cursor''s current slot (halfword at board+0x1E) and computes the destination slot by subtracting
  4 (one row up on the 3x? Navicust grid). If the current slot is < 4 (already on the top row), the destination
  is clamped to 0 and the companion value written to board+0x20 becomes (oldSlot - 1) instead of the usual 3, presumably
  so the move animation / rendering logic can tell a clamped no-op move from a real one. The target slot is stored
  to board+0x24, the companion/aux value to board+0x20, and a refresh/state timer byte at board+0x0C is set to 0xC
  (12 frames?). Then PlaySoundEffect(SOUND_MENU_SELECT) is called with r2 passed through untouched; r5, r10 and
  the other preserved registers are whatever PlaySoundEffect leaves. Function is Thumb, padded with .byte 0,0.

  '
