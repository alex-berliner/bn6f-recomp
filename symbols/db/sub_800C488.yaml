name: sub_800C488
address: '0x0800C488'
kind: function
previous_names: []
status: hypothesis
summary: r1 = 480 in battle mode 1, else 600, keeping r0/r2/r3 (likely a timer length in frames).
interface: '() -> r1 = GetBattleMode() == 1 ? 0x1E0 : 0x258; r0, r2, r3 preserved'
details: Every caller (object.s) stores r1 as a halfword at offset 0x0E of the structure in r7, several next to
  0x708 (1800) at 0x12. 480/600/1800 frames are 8/10/30 seconds, which suggests timers; not checked.
