name: battle_tickPoisonHpLoss_8014498
address: '0x08014498'
kind: function
status: confirmed
summary: Applies a 1-HP gradual damage tick (e.g. poison) to a battle object once per call when its AI-data flag
  is armed, skipping if the battle is over or HP is already 1.
interface: void sub_8014498(BattleObject *obj /*r5*/); // r5 = battle object, r10 passed but unused; returns r3
  = obj->AIDataPtr (oBattleObject_AIDataPtr) for the caller, except on the battle-over early return; clobbers r0,
  r1, flags
details: 'First checks battle_isBattleOver and bails out if the battle has ended. Otherwise loads the object''s
  AI data pointer from oBattleObject_AIDataPtr and tests the 16-bit flag at oAIData_Unk_36; if it is zero, nothing
  happens (no HP change). When the flag is set, reads oBattleObject_HP and decrements it by 1 unless HP is already
  1, so this routine can never itself reduce an object to 0 HP — presumably death/defeat handling is left to other
  code or a later tick. The new HP is written back to oBattleObject_HP. The AI data pointer is left in r3 for the
  caller, which suggests callers use it right afterwards (the battle-over early return leaves r3 unset). The 1-HP-per-tick,
  flag-gated behavior matches poison/venom-style status damage in battle. Note: the tail contains stray literals
  (0x200, 0xFFFF, 0x3C0) reached by branch offsets in nearby code, not data used by this routine.'
