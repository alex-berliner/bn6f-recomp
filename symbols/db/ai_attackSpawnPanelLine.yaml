name: ai_attackSpawnPanelLine
address: '0x080F6310'
kind: function
status: probable
summary: Places an AI attack effect on each of up to five panels straight ahead of the actor, with a row
  offset taken from the current attack step.
interface: (r5 = battle object, r7 = oAIAttackVars attack-state struct) -> r0 = void (early-outs silently);
  no meaningful return flags
details: 'Loops r6 = 1..5: target panel is (PanelX + frontDir*r6, PanelY + dy), where frontDir comes from
  object_getFrontDirection (so ''ahead'' flips with alliance/DirectionFlip) and dy is a signed byte indexed
  by (AttackStepIndex-1) into dword_80F6360 (bytes -1,-1,+1,0). object_isValidPanel guards the 6x3 grid;
  on the first out-of-grid panel the whole routine returns. Otherwise it calls sub_80D18AE with r0/r1
  = target x/y, r2 = oAIAttackVars_InitFlag, r4 = (StepTimer<<8)|(AttackStepIndex-1) packed, and r6 =
  oAIAttackVars_Damage, most plausibly spawning a hitbox/damage at that panel. The valid-panel guard inside
  the loop means the attack covers a contiguous line forward, truncated at the field edge. Runs in the
  AI attack-step state machine driven by the caller sub_80F5FF4.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'loc_80F6314: object_getFrontDirection * r6 added to oBattleObject_PanelX gives successive forward
    columns 1..5; ldrsb from dword_80F6360+(AttackStepIndex-1) multiplied by frontDir and added to PanelY
    gives the per-step row offset; object_isValidPanel with beq to locret_80F6358 aborts the line at the
    grid edge; sub_80D18AE receives target x/y plus oAIAttackVars InitFlag, (StepTimer<<8)|(step-1) and
    Damage, consistent with spawning a panel-anchored attack; Data around off_80F6454 (battle phase/action
    handlers) confirms this is battle AI attack code'
