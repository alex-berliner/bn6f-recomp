name: sprite_clearMosaic
address: '0x08002F2C'
kind: function
status: confirmed
summary: Clears the mosaic bit (0x10) in an object's sprite flag byte, disabling the mosaic effect on that object's
  sprite.
interface: void sprite_clearMosaic(ObjectHeader* obj /* r5 */) — outputs r0 = 0x10 (mask), r1 = updated flag byte,
  r3 = sprite struct address, c/v set by the address computation, nz clobbered
details: Takes an object pointer in r5. Reads the type/sprite-offset byte at oObjectHeader_TypeAndSpriteOffset (offset
  2), masks off its low nibble (lsl/lsr round to 16-byte units) to get the offset of the object's sprite struct,
  and adds that to the object base pointer. It then reads the flag byte at oObjectSprite_Unk_11 (offset 11) of that
  sprite struct, clears bit 0x10 (the mosaic enable bit used with the GBA BLDY/MOSAIC-style effect), and stores
  it back. Leaves r0 holding the 0x10 mask, r1 holding the new flag byte, and r3 pointing at the sprite struct;
  the ADD that forms the sprite pointer sets c/v per ARM semantics and callers are recorded as inspecting them.
  No registers are preserved.
