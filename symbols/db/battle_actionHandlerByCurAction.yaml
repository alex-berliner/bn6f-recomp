name: battle_actionHandlerByCurAction
address: '0x080BE834'
kind: function
status: probable
summary: Per-frame update step that dispatches via oBattleObject_CurPhase handler if oBattleObject_Param1
  == 0, else indexes oBattleObject_CurAction into a 9-entry thumb handler table (off_80BE854).
interface: (r5 = oBattleObject*) -> r0 = handler result; no flags guaranteed
details: Reads oBattleObject_Param1 from the object in r5; if it is 0 it simply calls battle_phaseDispatchHandler
  (the normal CurPhase dispatch). Otherwise it loads oBattleObject_CurAction and jumps through off_80BE854,
  a 9-entry thumb handler table (sub_80BEA50 ... sub_80BF11A) including battle_dimmingRegionAttackPhaseDispatch,
  with lr set so handlers return straight to the caller's pop {pc}. The sole caller sets oBattleObject_CurStateActionPhaseAndPhaseInitialized
  = CUR_STATE_UPDATE, may set CurAction = 8 when Param2 == 4, then tail-calls this as the state's update
  step.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_80BE834: tst Param1 / beq battle_phaseDispatchHandler, else ldrb CurAction + table dispatch
    off_80BE854; off_80BE854 table includes battle_dimmingRegionAttackPhaseDispatch, tying the whole family
    to that phase; caller sub_80BE7BC stores CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized
    then bl sub_80BE834; caller conditionally sets oBattleObject_CurAction = 8 when Param1 != 0 and Param2
    == 4 before calling; dispatch uses mov lr, pc / bx r1, so table entries are per-action sub-state handlers
    of this phase'
