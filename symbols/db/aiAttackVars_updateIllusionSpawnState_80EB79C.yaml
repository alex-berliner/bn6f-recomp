open_questions:
- Exact semantics of `sub_8015B00` and `sub_800E5FC` (success/fail returns) — they decide which branch
  executes.
- What the returned illusion object's "spawn mask" `0x01010014` encodes; naming assumes "illusion clone"
  but could be any support object helper.
- The precise game meaning of the values 4 and 0x0C in Unk_00 — they appear to be move-state sentinels
  but no symbol names them.
