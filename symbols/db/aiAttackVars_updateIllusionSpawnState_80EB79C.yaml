status: probable
summary: AI attack-vars step that, when active and allowed, spawns an "illusion"-style object one panel
  behind the user and warps them there; otherwise cancels into animation 4 and idle state.
interface: (r5 = *BattleObject, r7 = *AIAttackVars, lr) -> void ; side effects write r7->Unk_34, AIAttackVars->Unk_00,
  may flip DirectionFlip, play anim 4
details: '1. Stores #4 into [r7,#oAIAttackVars_Unk_00] up front (idle-state sentinel) and reads [r7,#oAIAttackVars_Unk_0c];
  if zero, exits.

  2. Reads [r7,#oAIAttackVars_Unk_1b] (PwrAtkCurChargeTime). If non-zero OR if the battle object''s NaviStats
  offset 0x2c lies outside [0x0B..0x18], branches to the "spawn illusion" path at loc_80EB7D6 (skipping
  the reserve-panel branch).

  3. Otherwise calls sub_800E5FC, and if it returns 0, exits. Else sets OBJECT_FLAGS_CANNOT_SLIDE on the
  battle object, copies PanelX/PanelY into FuturePanelX/FuturePanelY, and calls object_reservePanel —
  locking the home panel so nobody else moves onto it during the manoeuvre.

  4. Spawn path (loc_80EB7D6): zeros [r7,#oAIAttackVars_Unk_34], calls sub_8015B00 (some check), and if
  it returns 0 takes the "fail" branch at loc_80EB82C (clears Unk_34, plays animation 4, writes 0x0c into
  Unk_00).

  5. Success branch: pushes scratch regs, computes `r4 = (object_getFlip()<<8) + sub_800F2AA(0) + 0xFF`,
  then `ldmia [r5+0x34]` to load three 32-bit params (Coords.X/Y/Z fixed-point), and calls spawnIllusionObject_80E33FA
  with const pool values `0xFFE0` and `0x01010014` as extras (an offset/dimensions mask).

  6. After pop, stores the spawn result bytes into BattleObject.PanelX/PanelY, calls object_setCoordinatesFromPanels
  + object_updateCollisionPanels, and only when [r7,#oAIAttackVars_Unk_34]==1 does it XOR DirectionFlip
  with 1 and refresh sprite+arm via battleObject_refreshSpriteAndArm_800F2C6 / battleRefreshTrackedObjectArmPos_801DBD4.

  7. The trailing `dword_80EB844=0xFFE0` and `dword_80EB848=0x01010014` are passed as the 5th/6th args
  to spawnIllusionObject_80E33FA (a spawn-illusion helper).

  '
