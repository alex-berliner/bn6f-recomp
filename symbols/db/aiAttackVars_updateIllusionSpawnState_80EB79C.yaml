    followed by `object_reservePanel` is the standard "claim your current panel so you don''t lose it
    before teleporting" pattern. - `sub_8015B00` returning 0 falls into `loc_80EB82C` which writes animation
    4 and state 0x0c — a known move-failed-end animation for Megaman/Bass-style AI scripts. - The spawn
    block reads three words via `ldmia r0!, {r1-r3}` from `r5+0x34` (BattleObject Coords starting at X)
    — exactly the per-instance xyz used for teleport destination. - Spawn call uses the two const-pool
    words `0xFFE0` / `0x01010014` as r6/r7 args, then stores r0/r1 back into BattleObject.PanelX/PanelY,
    confirming the spawn returns the destination panel in r0/r1. - "ldr r0, [r7,#oAIAttackVars_Unk_34]
    / cmp r0,#1 / bne loc_80EB82A" gates the flip+sprite refresh on a spawn-success flag of 1.'
