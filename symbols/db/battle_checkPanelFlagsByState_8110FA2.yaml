name: battle_checkPanelFlagsByState_8110FA2
address: '0x08110FA2'
kind: function
status: confirmed
summary: Reads the panel flag state at a battle object's panel, using a per-state parameter table chosen
  by the object to decide which panel flags count.
interface: PanelFlagResult battle_checkPanelFlagsByState_8110FA2(BattleObject* obj /* r5 */); returns
  r0/r1 from panelFlagCheck_8015D80, r5 preserved
details: 'r5 is a battle object. The word at obj + oBattleObject_ExtraVars+8 acts as a state/index

  selector: it is doubled (lsl #2) and used to pick one of four pointer entries at off_8110FC4,

  each pointing to an 8-byte parameter table (byte_8110FD4/8110FDC/8110FE4/8110FEC). The table

  consists of four pairs like (0/1/0xFF, 0xFF/0/1) — typical panelFlagCheck arguments where a

  value of 0xFF presumably means "don''t care" and 0/1 mean "must be clear/set" for the flag

  being tested. The function then loads the object''s panel coordinates (oBattleObject_PanelX/

  PanelY as bytes) and calls GetAllianceDependentPanelParamArgs with the table base byte_8111020

  in r3 and the object in r5 to obtain alliance-adjusted panel parameters (returned in r2/r3).

  Finally it calls panelFlagCheck_8015D80 with panelX (r0), panelY (r1), the alliance-dependent

  parameters (r2/r3), the selected parameter table (r4), and the object (r5); that callee''s

  r0/r1 results are this function''s result, so callers get back two panel-flag-related values.

  Quirks: the selected table index is not bounds-checked (values 0-3 expected); the function

  reuses its own saved r4 as the callee''s argument register, hence the push/pop of r4-r7.

  '
