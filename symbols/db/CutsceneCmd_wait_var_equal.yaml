name: CutsceneCmd_wait_var_equal
address: '0x08037808'
kind: function
status: confirmed
summary: Cutscene script command "wait until script variable equals a value" — polls a script variable each update
  and only advances the script once it matches the given target.
interface: 'u32 CutsceneCmd_wait_var_equal(void) — in: r5 = script-context pointer, r7 = script-stream pointer,
  lr = return address; out: r0 = 1 when the wait finished (command consumed) or 0 while still waiting, r4 = expected
  value left over from the second read, r6 = last read mode (2), r7 advanced past the 3-byte command on success,
  flags set (N/Z from movs, C/V from the compare or the r7 += 3 add)'
details: 'Implements one of the map/cutscene script opcodes. The command is 3 bytes: an opcode byte, a variable
  index, and a comparison value. Both operand bytes are fetched through ReadMapScriptByte, which is steered by r6
  — mode 1 fetches a byte to compare against, mode 2 consumes the byte that the caller peeked at [r5 + r4] (the
  first read apparently returns the variable slot/index, which the code then uses to peek the current variable value
  before the "read" that actually consumes it). The final cmp r0, r4 compares the variable''s current value against
  the expected value. On match, the script pointer r7 is bumped by 3 so the whole command is skipped and r0 = 1
  signals the wait is over; on mismatch the pointer is left on the command and r0 = 0, so the caller will retry
  the same command next script update — i.e. the cutscene pauses here until the variable changes. Flags are a side
  effect only (N/Z always come from the final movs of 1 or 0 into r0; C/V come from the compare on the not-taken
  path or from the r7 += 3 addition on the taken path).'
