name: scenario_prepareEnterMap_8004D48
address: '0x08004D48'
kind: function
status: confirmed
summary: Resets all per-location game state (EnterMap parameters, event flags, camera, pet menu, encryption
  packs, shop table) so the player can transition to a new map area.
interface: void scenario_prepareEnterMap_8004D48(void *toolkit /* r10 */)
details: Reads the game-state pointer from the Toolkit at oToolkit_GameStatePtr (r10+offset). Zeroes oGameState_SubsystemIndex
  and sets fade parameters (oGameState_EnterMapFadeParam1 = 8, oGameState_EnterMapFadeParam2 = 0x10) to
  trigger the EnterMap callback cbGameState_80050EC. Clears interaction and coordination fields (CoordInteractionValue,
  Unk_03, Unk_15, BattlePaused, Unk_74), sets the overworld BGM indicator (0x63), and zeroes per-map tracking
  bytes (Unk_11, Unk_10, byte_200F410). Resets the auxiliary struct at eStruct200ace0 (clears header,
  two dwords, sets byte at +0x1C to 0xFF as sentinel). Calls SetPlayerCanMoveEventFlag, clears eCamera.unk_4C
  and dword_20096D0, then calls sub_8004702 (unknown housekeeping). Clears event flags 0x1703, 0x171B,
  0x1715 (CUR_DIR_LOCKED), and 0x172D. Calls scenario_ClearEffectActiveFlag_800399A, event_ackNewFlagByte_8003AEA,
  pet_ClearMenuData_811EC00, and encryption_applyPackList_800B110. Clears EVENT_91 (transition-pending),
  then calls sub_803C3E0; if it returns non-zero, re-sets EVENT_91. Finally calls shop_copyItemTableToShopData_8048C98
  to refresh the shop inventory. r4-r7 are pushed and restored (callee-saved safety); r10 is the only
  meaningful input. Flags (Z) from sub_803C3E0 are consumed internally.
