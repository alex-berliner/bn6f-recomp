name: sub_813CBCC
address: '0x0813CBCC'
kind: function
status: confirmed
summary: Dispatches per-slot handlers for the PET Navigator's stat-category table (slots 1-0xF, four stat types),
  with a special early-exit path when stat 0x1F is set.
interface: void processPETNaviStatSlots(void); /* preserves r4-r7; clobbers r0,r1,r2,r3; handlers may write r8-r12;
  flags clobbered */
details: 'Clears event flag EVENT_1720 (page 0x17, bit 0x20) then calls checkCurPETNaviStats1FIsOne_813C490. If
  that returns 1, the entire loop is skipped in favour of sub_813C020 (special PETNavi mode). Otherwise a loop over
  slots 1..0xF calls getUnk200431cTableByteCapped3_813BF0C(slot) to read a 4-bit stat-type byte (capped 0-3) from
  a 0x200431C-area table. The handler jump table byte_813CC18 is indexed by (statType*4 + slot*16) producing a 128-word
  (512-byte) table of 32-bit Thumb pointers. Non-null entries are invoked via mov lr,pc / bx r1; the handler may
  freely clobber any register including the loop counter r6. After a successful indirect call EVENT_1720 is re-set.
  The push {r4-r7,lr}/pop {r4-r7,pc} frame guarantees the caller''s r4-r7 survive even though handlers destroy them.
  The table at byte_813CC18 contains many repeated/adjacent handler stubs (sub_813CCE8, sub_813CCEC, sub_813CCFC,
  … sub_813CE90), each roughly 4-0x30 bytes, suggesting small per-category stat update routines.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
