open_questions:
- What does EVENT_1720 gate? It is cleared at entry and re-set only when a handler actually fires; is it used by
  a higher-level scheduler to avoid redundant processing?
- What is sub_813C020 (the stat-0x1F==1 branch)? Does it handle a 'full recompute' path?
- 'The 0x200431C table that getUnk200431cTableByteCapped3 reads from: what defines those per-slot stat-type bytes,
  and can they change mid-session?'
- Why is the table stride 16 entries (slot*16) rather than slot*4? Is there intended room for 16 stat types per
  slot that the capped-3 lookup never reaches?
- Several adjacent table entries share the same handler (e.g. four copies of sub_813CCEC). Is this deliberate padding
  or an artefact of how the table was generated?
- 'Retype: register form, old prompt; queued for retype (tools/abi/retype_queue.tsv), to be converted again as typed
  C (stages S3/S4)'
