name: object_updateSpriteTimerState8
address: '0x0811C0F8'
kind: function
status: probable
summary: 'Update routine for a battle object: runs its sprite animation, counts down a delay, and switches
  the object to state 8 when the counter expires.'
interface: (r5 = battle object struct, r0 unused) -> r0 clobbered by sprite_update call/counter; no meaningful
  return value
details: First calls sprite_update on the object so its animation keeps playing. It then loads the byte
  at object+4, decrements it, and stores it back — a frame-countdown timer. While the counter is still
  >0 the routine does nothing else; once it reaches 0 it writes 8 into the object's state byte at +8,
  moving the object to a new state (likely deletion or a next phase handled by the object state machine).
  The function relies on r5 already holding the object pointer, so it is invoked through a handler/dispatcher
  rather than called directly with arguments.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl sprite_update (0x0811C0FA) advances the object's sprite before the timer logic; ldrb r0,[r5,#4];
    sub r0,#1; strb r0,[r5,#4] is a per-frame countdown on object+4; cmp r0,#0 / bgt skip; mov r0,#8;
    strb r0,[r5,#8] sets state byte 8 only when the timer hits 0; only caller 0x0811C0AC object_initCenteredSprite
    inits the same object (resource 0x3D, anim 4, x=0x78), so this is its update counterpart; r5 is used
    without being set in the routine, indicating a registered update-handler calling convention
