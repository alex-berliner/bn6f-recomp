name: MapScriptCutsceneCmd_play_sound
address: '0x080380B4'
kind: function
status: confirmed
summary: Map script command handler that reads a sound effect ID from the script and plays it.
interface: 'void MapScriptCutsceneCmd_play_sound(void); /* in: r4 = script cursor/state base, r7 = script cursor;
  out: r0 = 1 (continue), r6 = 1, r7 += 3, flags NZCV from ADD r7,#3; preserved: r1 r2 r3 r5 r10 */'
details: 'Implements the map script "play sound" cutscene command. Sets R6=1 (the argument mode for ReadMapScriptHalfword)
  and calls ReadMapScriptHalfword, which delivers the halfword sound effect ID in R4 rather than R0. That value
  in R4 is then passed to PlaySoundEffect in R0 to actually play the sound. Afterwards the script cursor R7 is advanced
  by 3 bytes past the command (its `adds r7, #3` is what sets the NZCV flags on exit, so callers reading flags see
  the cursor-advance carry), and R0=1 is returned so the script interpreter continues with the next command. Falls
  under the map-script/cutscene command table dispatch pattern; no error paths or waits.

  '
