name: custMenu_matchChipComboPattern
address: '0x08029520'
kind: function
status: probable
summary: Scans the just-built selected-chip command queue for predefined chip-combination (e.g. Program
  Advance) patterns and, on a hit, runs the corresponding handler.
interface: (r0 = 0xFFFF-terminated array of up to 5 packed halfword chip-command words, r1 = context passed
  to sub_8029652) -> r0 = result of sub_802963C (nonzero) if a pattern matched/started, else 0; clobbered
  r4-r7, sp buffer.
details: 'Copies up to 5 packed halfwords from [r0] onto the stack, deinterleaving each into low 9 bits
  (opcode/field) at sp+0..9 and bits 9-15 at sp+0xA..13, stopping at a 0xFFFF terminator. If fewer than
  3 entries were read it returns 0 immediately. Otherwise it walks a pattern table (off_802BCB0; an alternate
  table off_802BC60 is selected by a stack flag at sp+0x1C that is always 0 here), each entry being {byte
  len, byte handlerIndex}: entries whose len exceeds the remaining count are skipped. The chosen handler
  from off_80295C0 — battle_scanChipSeq_80295C8 or matchHalfwordPatternEntry_802961A — is long-called
  (mov lr,pc / bx) with the entry pointer; if it matches, sub_8029652 is called with the saved r1, and
  on further success sub_802963C fires the combo and its result is returned. The caller custMenu_confirmAndProcessSelectedChips_8029110
  builds the chip-use command queue at dword_2033000 right before calling this, matching the 5-chip selection
  limit of the Custom Screen.'
