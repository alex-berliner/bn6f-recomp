name: owMapObject_weatherTornado_checkHitPlayer_80A91A4
address: '0x080A91A4'
kind: function
status: confirmed
summary: Per-frame check for a tornado weather map object - if tornado weather (EVENT_BE4) is active and the player
  stands inside the tornado's box, sets EVENT_BE6 ("player caught by tornado").
interface: void Next(owMapObject* tornado /* r5 */); /* r10 = overworld state base read by callees; no return value,
  flags clobbered */
details: "Tail-less helper (called via bl, returns with pop {r4,pc}) run for the weather-tornado\noverworld map\
  \ object. r5 points at the map object; its hitbox bounds are the words at\n+0xC (left/top) and +0x10 (right/bottom).\
  \ Flow:\n  1. Test event flag EVENT_BE4 (bank 0xB, index 0xE4, \"tornado weather active\"); if clear,\n     return\
  \ immediately without doing anything.\n  2. Call ReadOWPlayerObjectCoords to get the player's overworld position\
  \ (r0=x, r1=y).\n  3. Call overworldObject_withinBoxCheck_signed_80011D6 with the object's bounds, the\n     player\
  \ coords, and a half-extent of 0x14 << 16 = 0x140000 (0x14 in 16.16 fixed point,\n     i.e. half the tornado's\
  \ tile radius in the box test).\n  4. If the box check returns 1 (player inside), set event flag EVENT_BE6 (bank\
  \ 0xB,\n     index 0xE6) - the \"player hit/caught by tornado\" trigger presumably used by the\n     weather/tornado\
  \ event script.\nr10 must remain intact across the call since the callees read the overworld state from it\ndirectly;\
  \ the function itself preserves r4 and only clobbers r0-r3, lr and flags.\n"
