name: gfx_flushDataListAndContinue_802811C
address: '0x0802811C'
kind: function
status: confirmed
summary: Queues all pending GFX transfers for the dataList at off_802A744, then tail-calls sub_802812C with the
  byte at [r5+0x10].
interface: void gfx_flushDataListAndContinue(struct State* r5 /* plus passthrough args r2-r3 */); returns whatever
  sub_802812C returns in r0-r3
details: 'Loads the address of the dataList (off_802A744, a table of GFX data references) into r0 and calls QueueGFXTransfersInList,
  which enqueues the queued graphics uploads associated with that list. It then reads the byte at [r5+0x10] into
  r0 and calls sub_802812C, whose return value becomes this function''s return value. r5 is not set up inside this
  function, so it is part of the caller''s context (likely a scene/state object whose +0x10 field selects the next
  step for sub_802812C). r4-r7 are preserved and passed through; r0-r2 and the flags are clobbered, lr is consumed
  by the call chain. The dataList is a fixed global, so this routine only makes sense in the subsystem that owns
  off_802A744.

  '
