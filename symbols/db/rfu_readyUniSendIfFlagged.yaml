name: rfu_readyUniSendIfFlagged
address: '0x0814912C'
kind: function
status: probable
summary: Checks a wireless-communication flag and, when set, marks the UNI send buffer (id read from byte_20103E0)
  ready for unidirectional send, then sets a state via sub_8144DB0(1).
interface: () -> r0 = result of sub_8144DB0(1); no meaningful input
details: 'First calls sub_8149150 and examines its return byte (lsl #24 + cmp); if nonzero it loads a
  byte from byte_20103E0 and passes it to rfu_UNI_readySendData, the librfu unidirectional-communication
  call that marks a send buffer as ready to transmit. Whether or not the flag was set, it then calls sub_8144DB0
  with r0 = 1 and returns its result. byte_20103E0 appears to hold the UNI buffer/slot id to make ready.
  This sits inside a cluster of rfu routines (0x8144DB0-0x814B068) for the wireless adapter, so it is
  part of a periodic wireless send/state poll.'
