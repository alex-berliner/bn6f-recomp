open_questions:
- No caller is known, so which NPC/scene owns this struct and the meaning of state 0xC and the +0x10 selector
  (0x11) are unconfirmed
- The exact text of script 0x36 vs 0x37 in eTextScript201BA20 would pin down the in-game context
- The summary is correct in behavior (decrement timer at r5+0x28, branch on zero, branch on r5+0x10==0x11
  to skip the sound and pick script 0x37 vs 0x36, set r5+0xc=0xC, tail-return). However the name is too
  long and r5 is described as a 'hidden arg' but is never set here — it is an object pointer, so 'object_waitTimerThenChatboxScript'
  is cleaner.
