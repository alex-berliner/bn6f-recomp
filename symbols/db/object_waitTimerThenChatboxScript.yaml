name: object_waitTimerThenChatboxScript
address: '0x0812BEEC'
kind: function
status: probable
summary: 'Object tick: decrements the halfword timer at r5+0x28; on expiry, if byte at r5+0x10==0x11 runs
  text script 0x37 silently, otherwise plays sound 0x73 and runs text script 0x36, then writes 0xC to
  r5+0xc and returns.'
interface: (r5 = object/NPC struct, hidden arg) -> r0 = 0; updates [r5+0x28], [r5+0xc]
details: 'Each frame it decrements the halfword timer at [r5,#0x28] and returns until it reaches zero.
  On expiry it checks the byte at [r5,#0x10]: if it equals 0x11 it uses text script index 0x37 with no
  sound effect, otherwise it plays sound effect 0x37 and uses script index 0x36. Both scripts come from
  archive eTextScript201BA20 via the chatbox wrapper. Finally it stores 0xC into the object''s state byte
  at [r5,#0xc], so this is one leg of an object state machine that waits, then delivers a line of dialogue.
  r5 is not set up here, so the caller supplies the struct.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrh r0,[r5,#0x28] / sub r0,#1 / strh / bne locret: frame countdown gate; cmp r1,#0x11; beq:
    variant at [r5+0x10]==0x11 skips PlaySoundEffect and picks script 0x37; mov r0,#0x37/0x36; bl chatbox_runScript_803FD9C_on_eTextScript201BA20:
    shows dialogue from that archive; strb r0,#0xc,[r5,#0xc]: advances the object state to 0xC after the
    message'
  refs:
