name: battle_spawnPanelCollisionObject
address: '0x080C65A0'
kind: function
status: probable
summary: 'One-time spawn/init phase for a battle object: places it on its panel, allocates and initializes
  its hitbox, then queues the update state.'
interface: (r5 = battle object) -> r0 = 0/destroyed object flag path; uses no register arguments, reads/writes
  fields of the object at r5
details: Recomputes the object's pixel position from its panel coordinates and stores the facing multiplier
  (+1/-1) as its X velocity. Allocates a collision-data slot via object_createCollisionData and, if none
  is free, destroys the object via object_freeMemory. Initializes the collision block with type 0x3d and
  params (5, 0), sets PrimaryElement to 0 (non-elemental), and immediately refreshes collision via object_presentCollisionData.
  Sets Param2 to 2 and Timer2 to a 12-frame countdown, then switches the object to the CUR_STATE_UPDATE
  phase. If Param1 is nonzero it sets CurAction to 4, and if Param1 is not 0xFF additionally calls sub_80C673A
  (likely variant-specific setup).
