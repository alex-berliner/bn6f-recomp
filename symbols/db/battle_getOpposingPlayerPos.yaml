name: battle_getOpposingPlayerPos
address: '0x080E8378'
kind: function
status: probable
summary: Returns the tile (x,y) of the player-side battle actor opposing the caller's alliance, or 0xFF
  if that player has no HP.
interface: (r5 = calling BattleObject) -> r0 = panel X, r1 = panel Y of opposing player actor; r0 = 0xFF
  if that player's HP is 0
details: 'Reads oBattleObject_Alliance from the object in r5, inverts it with EOR #1, and passes it to
  battle_findPlayer to fetch the opposite side''s player BattleObject. If the returned actor''s oBattleObject_HP
  is zero (or the field reads 0), returns 0xFF in r0 without touching r1. Otherwise returns oBattleObject_PanelX
  in r0 and oBattleObject_PanelY in r1. r5 is used as an implicit input, so the caller must have its own
  battle object in r5; no flags are meaningful.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'eor r0,#1 then bl battle_findPlayer: finds the player actor on the opposite alliance from r5''s
    object; ldrh r0,[r6,#oBattleObject_HP]; tst/beq: dead player yields the 0xFF failure value in r0;
    ldrb r0,[r6,#oBattleObject_PanelX]/ldrb r1,[PanelY]: returns the actor''s tile coordinates; caller
    battle_getNearestEnemyActorPos uses an opposing-actor tile position, matching this helper''s role'
  refs:
