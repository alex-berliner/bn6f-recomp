summary: 'Syncs a battle object''s animation, position, visibility, palette/shader and flip with its related
  parent object (with a +-1.0 Y/Z offset mode), then dispatches into its CurAction table (single entry:
  battleObject_updateSprite_80C4484).'
details: 'r4 = oBattleObject_RelatedObject1Ptr (the parent). CurAnim += Param4. Copies the three 16.16
  coords at parent+0x34 to r5+0x34 (ldmia/stmia). Y/Z offset mode: when oBattleObject_ExtraVars is non-null,
  adds 0x10000 (+1.0) to Z and Y; otherwise indexes CollisionDataPtr by (CurAnim - Param4): byte 0 ->
  subtract 0x10000 from Z and Y, nonzero -> copy the parent''s Z and Y verbatim. On first run (PhaseInitialized
  == 0) syncs oObjectHeader_Flags bit 0x02 from the parent. When Param2 == 0 copies the parent''s sprite
  palette; then always copies colour shader, final palette, the sprite flag-0x10/render-info-high pair
  (obj_getSpriteFlag10AndRenderInfoHigh_8002F3E + loc_8002F02) and DirectionFlip (object_getFlip/sprite_setFlip).
  Tail: dispatches off_80C4480[oBattleObject_CurAction] via mov lr,pc / bx - the table''s only entry is
  battleObject_updateSprite_80C4484+1.

  '
