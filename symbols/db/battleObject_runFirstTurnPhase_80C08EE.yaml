name: battleObject_runFirstTurnPhase_80C08EE
address: '0x080C08EE'
kind: function
status: probable
summary: 'Drives a battle object''s first-turn phase: primes a 15-tick countdown on first entry, then
  on expiry advances CurAction to 4 and clears the phase flag.'
interface: 'void sub_80C08EE(void);  // r5 = oBattleObject*

  '
details: 'Operates on the oBattleObject pointed to by r5. On first entry (PhaseInitialized == 0), writes
  15 into oBattleObject_Timer and sets PhaseInitialized to 4. On subsequent entries decrements Timer;
  when it reaches zero, sets oBattleObject_CurAction = 4 and writes 0 to oBattleObject_CurPhaseAndPhaseInitialized
  (clearing both the phase index and the initialized flag together). Returns via pop {pc}. Touches oBattleObject_PhaseInitialized,
  oBattleObject_Timer, oBattleObject_CurAction, oBattleObject_CurPhaseAndPhaseInitialized.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
