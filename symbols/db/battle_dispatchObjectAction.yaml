name: battle_dispatchObjectAction
address: '0x080C8892'
kind: function
status: probable
summary: 'Per-frame handler for a battle object: dispatches its current action via jump table, or spawns
  a death/exit effect and marks it destroyed when the battle is over.'
interface: (r5 = battle object) -> void; returns via pop {pc} after long-calling the action handler
details: 'Reads oBattleObject_CurAction (byte at [r5]) and indexes off_80C88C0, a table of two action-handler
  thumb pointers (sub_80C88C8, sub_80C89A4), calling the selected one with lr=pc so it returns back here.
  If battle_isBattleOver returns nonzero it instead takes the object''s death path: ldmia from offset
  0x34 (three words, presumably position fields) as r1-r3, r4 = 0x14 as an argument, and calls spawn_t1_0x0_EffectObject
  to spawn a generic type-0 effect at the object''s location. It then stores CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  so the object engine deletes it. The two-entry table suggests an object with exactly two actions (e.g.
  idle/attack or two movement modes).'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl battle_isBattleOver + tst/bne splits normal dispatch from the teardown path; ldrb r0,[r5,#oBattleObject_CurAction];
    ldr r1,[r1,r0]; mov lr,pc; bx r1 — table dispatch on the object's action; off_80C88C0 holds exactly
    two handler pointers (sub_80C88C8, sub_80C89A4); ldmia r0!,{r1-r3} from r5+0x34 + r4=0x14 feed spawn_t1_0x0_EffectObject,
    then CUR_STATE_DESTROY is stored to the state field; Called from sub_80C8850, consistent with an object-update/step
    routine
