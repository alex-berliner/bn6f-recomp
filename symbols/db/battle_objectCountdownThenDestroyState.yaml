name: battle_objectCountdownThenDestroyState
address: '0x080B9970'
kind: function
status: probable
summary: Battle-object state handler that plays anim 4 for 3 frames, then disables the object's collision
  and queues it for destruction.
interface: (r5 = battle object pointer; r0 unused on entry) -> writes object fields; destroys object when
  timer expires
details: On first run (oBattleObject_PhaseInitialized == 0) it stores PhaseInitialized = 4, sets oBattleObject_CurAnim
  = 4 and loads oBattleObject_Timer/Timer2 with 3, then returns. On subsequent runs it decrements oBattleObject_Timer;
  once it reaches 0 it clears oCollisionData_Enabled via oBattleObject_CollisionDataPtr (hitbox off immediately)
  and writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized so the object
  lifecycle tears it down. This is a fixed 3-frame 'linger then despawn' state with the hitbox disabled
  only at the end, not at entry.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'init branch: strb r1,#4 PhaseInitialized, strb #4 CurAnim, mov r0,#3 str TimerAndTimer2 (asm
    80B997A-80B9984); timer branch: ldrh Timer, sub #1, strh, bgt exit — plain frame countdown (80B9986-80B998C);
    expiry: ldr r1,CollisionDataPtr; strb #0,[r1,#oCollisionData_Enabled] disables the hitbox (80B9990);
    expiry: mov r0,#CUR_STATE_DESTROY str [CurStateActionPhaseAndPhaseInitialized] marks object for teardown
    (80B9994); structure offsets oBattleObject_* / oCollisionData_Enabled are the project''s known battle-object
    layout'
