- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement] / bne loc_81083B8: entry-frame check on zero element;
    strb #4 -> AttackElement and strh AttackDuration -> StepTimer: one-time state initialization; strb
    #0 -> [r5,#oBattleObject_CurAnim]: resets the object''s current animation on entry; ldrh StepTimer
