name: ai_attackStateWaitUpdate
address: '0x081083A2'
kind: function
status: probable
summary: 'Per-frame update for an enemy AI attack state: sets element/anim/duration on entry, counts the
  attack timer down, and leaves attack state when it expires.'
interface: (r7 = battle object AI vars, r5 = battle object; no args) -> r0 = scratch only; updates oAIAttackVars
  fields and object anim
details: On the entry frame (oAIAttackVars_AttackElement == 0) it stamps element 4 into AttackElement,
  copies oAIAttackVars_AttackDuration into oAIAttackVars_StepTimer as the countdown, and resets oBattleObject_CurAnim
  to 0. On later frames it decrements StepTimer each call; while the timer is still positive it returns
  without doing anything. Once the timer reaches 0 it calls object_exitAttackState to hand control back.
  Element 4 written here is a fixed placeholder element for this attack, suggesting an attack whose behaviour
  is purely a timed pose/anim. The r5/r7 base registers are the standard battle-object struct and its
  AI attack-vars block.
