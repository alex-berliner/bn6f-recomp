name: spawn_initObjectFromPanel
address: '0x080D0AC8'
kind: function
status: probable
summary: 'Init phase of a battle object''s state machine: places it on its panel, allocates collision
  data, and if that fails, deletes the object.'
interface: (r5 = battle object pointer, thumb-style callee register) -> r0 = 0 or garbage via callees;
  advances object state to CUR_STATE_UPDATE on success
details: Recomputes the object's pixel X/Y from its panel coordinates, clears its Z halfword, and allocates
  a collision-data slot. On success it initializes collision with type params 0x31/0x41 (flag-table indices),
  sets hit effect 0xFF (likely 'none'), refreshes present-collision state for the frame, zeroes Timer2/ExtraVars+4/Param2,
  and sets the state word to CUR_STATE_UPDATE so the update phase runs next, finally calling sub_80D0B0E
  (probably per-object init logic). On failure it zeroes a counter through the ExtraVars pointer and calls
  object_freeMemory, deleting the object (collision slots are exhausted, 32 max).
