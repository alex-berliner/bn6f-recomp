name: menu_confirmExitAndFade_812580C
address: '0x0812580C'
kind: function
status: confirmed
summary: Records the player's submenu selection, plays the "exit submenu" sound, and starts a screen fade (kind
  0xC, 0x10 frames) before leaving the menu.
interface: void sub_812580C(u8 selection /* r0 */, r5 = menu state struct base); r3 and r10 pass through unchanged
details: 'Expects the menu state pointer in r5 (preserved by the callee, so it must already be set up by the caller).
  Stores the byte passed in r0 to [r5+2], which looks like a "selection" or "next menu state" field. Then plays
  SOUND_EXIT_SUBMENU via PlaySoundEffect, and calls SetScreenFade(0xC, 0x10) — fade kind 0xC with a duration of
  0x10 frames — presumably to fade out of the menu back to the previous screen. The register contract lists r0-r7/r10/lr
  as inputs, but only r0, r5, and the call targets are actually read; r3 and r10 appear as outputs because they
  are pass-through values the callers rely on.

  '
