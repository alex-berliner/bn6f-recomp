name: sub_81258F8
address: '0x081258F8'
kind: function
status: confirmed
summary: Builds the in-RAM chip availability table at unk_201DC20 by scanning every chip and recording its id and
  ownership status into 4-byte group slots.
interface: void buildChipAvailabilityTable_81258F8(void) -> r0 = qualifying_chip_count, r2 = loop_leftover (0x40
  if last chip failed the 0x09 & 0x40 test, 1 otherwise); nz/c/v flags clobbered
details: "Zeros the 0x320-byte table at unk_201DC20 (size = 800 bytes = 200 slots of 4 bytes; chip_count_max = 0x13F,\
  \ group slots indexed by [byte0x15 - 1]).\nLoops over chip ids 1..0x13F, calling getChip8021DA8 to fetch each\
  \ ChipData. A chip qualifies when:\n  - byte 0x09 has bit 0x40 (special-type flag)\n  - byte 0x16 bit 0 is clear\
  \ (not disabled)\n  - byte 0x07 == 0 (category zero)\nFor each qualifying chip, the group index (LD8(data+0x15)\
  \ - 1) selects a 4-byte slot at unk_201DC20 + (group << 2):\n  - strh chipId, [entry]; strb status, [entry+2]\n\
  \  - status 0: event flag (0x1E20 + chipId) set -> already owned\n  - status 1: event flag (0x2220 + chipId) set\
  \ -> newly acquired this run\n  - status 2: event flag (0x2020 + chipId) set and TestEventFlagFromImmediate(0x17,0x11)\
  \ clear -> previously obtained\n    (if event 0x1711 is set, status becomes 2; otherwise 1 — the asm reads back\
  \ into r0 after the call)\ncounter r5 is incremented per qualifying chip and returned in r0. r2 is overwritten\
  \ each iteration: 0x40 right after the ChipData load, then 1 after the disabled-bit test, so the value left at\
  \ exit reflects the last chip that was tested.\n"
