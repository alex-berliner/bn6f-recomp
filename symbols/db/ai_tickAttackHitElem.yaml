name: ai_tickAttackHitElem
address: '0x080F222C'
kind: function
status: probable
summary: 'Per-frame AI attack state tick: while obj+0x74 flag is set, decrements obj+0x75, sets anim 0x1D
  and spawns effect 0x5E at the object, writing 0x8 to aiVars HitElement; once clear, decrements obj+0x76
  timer, clamps to 0 on expiry, then writes 0x14 to HitElement.'
interface: (r5 = battle object ptr, r7 = AI attack vars struct) -> r0 clobbered; writes [obj+0x75] byte,
  [obj+0x76] halfword, [obj+CurAnim] byte, [aiVars+HitElement] halfword
details: This is a state-machine tick for an AI-driven attack on a type-1 battle object. If the byte flag
  at obj+0x74 is nonzero it decrements and stores it into the counter byte at obj+0x75, sets the object's
  current animation to 0x1D, spawns effect 0x5E at the object's current X/Y/Z via the type-4 effect-object
  spawner, and writes element/value 8 into HitElement of the AI attack vars at r7. Once the flag is cleared,
  it instead decrements the halfword timer at obj+0x76, clamping it to 0 when it would go negative, and
  when that timer expires writes 0x14 into HitElement, apparently arming the next phase of the attack.
  It reads/writes no other state and always returns via a shared epilogue, so it is safe to call every
  frame from an AI attack script.
