name: sub_80E1AFA
address: '0x080E1AFA'
kind: function
status: confirmed
summary: Marks a BattleObject as ready to be destroyed (CUR_STATE_DESTROY) once the battle has finished.
interface: void sub_80E1AFA(BattleObject* r5 /* in */)
details: 'Called as a BattleObject state callback. Polls battle_isBattleOver; if the battle is not yet

  over, returns immediately. When the battle is over, writes the constant CUR_STATE_DESTROY into

  the BattleObject''s oBattleObject_CurStateActionPhaseAndPhaseInitialized field, transitioning the

  object into its destroy/teardown state so it can be cleaned up at the end of the battle.

  Trivia: despite the destructive-sounding "destroy", this isn''t an "unmake debug" function — it is a

  normal end-of-battle teardown step for one BattleObject.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
