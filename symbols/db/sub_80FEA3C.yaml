name: sub_80FEA3C
address: '0x080FEA3C'
kind: function
status: hypothesis
summary: Fetches three related values from a small constant table at byte_80FEA68 (offsets 0, 4 and 8) through the
  getter sub_800FE28 and returns them in r0-r2.
interface: int getRelatedParamTriple(int context /* r5 */) -> returns three values in r0, r1, r2; clobbers flags
  and lr
details: 'Loads the address of the byte table byte_80FEA68 (0x080FEA68) and calls sub_800FE28 three times, once
  with table+0, once with table+4 and once with table+8, passing the caller''s r5 through as context each time.
  Each call''s r0 result becomes one of the three return values (r0, r1, r2). The table holds 12 bytes: 0x0A,0x0A,0x0A,0x0A,
  0x1E,0x1E, 0x14,0x14, 0x03,0x03,0x03,0x05, so the first bytes of the three groups read are 0x0A (10), 0x1E (30)
  and 0x03 (3) - plausibly a set of related timing/count parameters (e.g. short/long frame delays plus a repeat
  count), but the meaning of sub_800FE28''s lookup and of the r5 context is not visible here. Note the table is
  addressed byte-wise yet at 4-byte strides, so sub_800FE28 likely reads a single byte (or small field) per entry
  rather than a word. Uses push/pop of r0/r1 around the middle call to shuffle the first result into r1.

  '
