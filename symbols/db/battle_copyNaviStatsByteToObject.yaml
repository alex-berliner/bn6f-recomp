name: battle_copyNaviStatsByteToObject
address: '0x0802EBE4'
kind: function
status: probable
summary: Copies one NaviStats byte (offset 2) from the 203CB10 record into the navi stats record of the
  battle object at [r5+0x16], then calls a follow-up routine with [r5+0x58]+0xA0.
interface: (r5 = battle object/work struct, r0 = its id byte at +0x16) -> byte at NaviStats+2 of the object's
  (alliance-selected) record set from the 203CB10 record; r6 = [r5+0x58]+0xA0 passed to sub_802ECFE.
details: Reads a byte selector from r5+0x16 and fetches offset 2 of the NaviStats struct via GetBattleNaviStats203CB10Byte,
  then stores that value at offset 2 of the record chosen by SetBattleNaviStatsByte_AllianceFromBattleObject
  (real or ghost copy depending on the object's alliance flag). This effectively syncs one stat byte (offset
  2, meaning unknown — possibly HP or a level/HP-related field) from the central 203CB10 record to a specific
  navi's record. It then loads [r5+0x58], adds 0xA0, and calls sub_802ECFE with r6 set, whose behavior
  is not documented. No callers are known, so the struct at r5 and the role of the trailing call are inferred
  only from the callees' known semantics.
