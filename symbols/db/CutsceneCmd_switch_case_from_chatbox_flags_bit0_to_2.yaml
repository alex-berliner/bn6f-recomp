name: CutsceneCmd_switch_case_from_chatbox_flags_bit0_to_2
address: '0x08037AA0'
kind: function
status: confirmed
summary: Cutscene/script command that implements a "switch" on the chatbox flag word, jumping to the matching case
  in the map script.
interface: int CutsceneCmd_switch_case_from_chatbox_flags_bit0_to_2(int scriptCtx /*r1*/, u8 *script /*r7*/); returns
  r0 = 1; r7 = case word read from the script; r1 preserved; flags set by final movs r0,
details: 'A cutscene command handler (part of the map-script/cutscene interpreter dispatch). It first calls chatbox_8045F4C
  to obtain the current chatbox state/flag word, then computes a case-table offset of flags*4 + 1 (entries 4 bytes
  apart, offset by one) into r6. It calls ReadMapScriptWord with that offset, which returns the selected case word
  in r4 (with the advanced script pointer in r6), copies that word into r7 (the script interpreter''s pointer/argument
  slot), and returns r0 = 1 to the dispatcher. The Thumb "mov r7, r4" assembles as adds r7, r4, #0, so it clears
  C and V; the trailing movs r0, #1 sets N and Z from 1. r1 (script context) is preserved across the call. Despite
  the name mentioning "bit0 to 2", the code uses the full chatbox flag value scaled by 4, not a masked 3-bit field
  — the name appears to describe the intended selector range rather than an explicit mask.

  '
