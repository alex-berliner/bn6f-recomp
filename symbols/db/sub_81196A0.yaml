  detail: '- ldr r0, off_81196B4 / ldrb r1,[r5,#4] / lsl r1,r1,#2 / ldr r0,[r0,r1] / mov lr,pc / bx r0 at sub_81196A0
    directly reads a 4-byte-indexed table off_81196B8 with 3 hand-written entries. - off_81196B8 entries: sub_81196C4+1
    (NPC sub-handler), npc_dispatchStateHandler_811979C+1, nullStub_8119800+1 — names indicate an NPC dispatch surface,
    not a plain sprite tick. - Tail `bl sprite_update` only matches the stub-and-bx path when the dispatch returns
    to the literal bl; in the captured r0=0x81196A1 entries the bx goes to sub_81196C4 instead. - Caller battle_spriteInit_8119384
    is the init function for a battle sprite per the project summary, consistent with this being an NPC sprite-tick
    dispatcher attached at init. - register contract `in=[''r5'',''r10'',''lr'']` is the BattleObject-pointer +
    Toolkit + return form used elsewhere in this module.'
