name: sub_81196A0
address: '0x081196A0'
kind: function
previous_names: []
status: hypothesis
summary: NPC battle sprite tick dispatcher that reads an actor byte and jumps to a per-actor sprite updater, falling
  back to the generic sprite_update.
interface: '(r5 = BattleObject) -> r0/r1/r2/r3 clobbered by the dispatched call ; side effects: updates the battle
  object''s sprite via the dispatched handler'
details: 'Acts as a 3-way dispatcher for sprite ticking on a battle object. Loads an offset table at off_81196B4
  (=off_81196B8) which actually points to a 3-entry Thumb jumptable (entries are sub_81196C4+1, npc_dispatchStateHandler_811979C+1,
  nullStub_8119800+1), indexed by the low two bits of byte [r5,#4] (the actor/team byte in the BattleObject). Performs
  the call via a manual `mov lr,pc; bx r0` (Thumb-to-Thumb trampoline) and otherwise does not preserve any registers.
  Only entry 0 actually resolves to the in-function bl sprite_update; the other two entries jump elsewhere, and
  most of the 40 captured calls show bx into sub_81196C4+1 (r0=0x81196A1 at entry), with a few that drop down to
  the literal `bl sprite_update` tail when the dispatch falls through. Contract treats output as the callee''s,
  so it is effectively `void`-like for the NPC sprite tick role. The only caller is battle_spriteInit_8119384, so
  this is invoked once per battle sprite at init time, not per frame in the captured stories.

  '
