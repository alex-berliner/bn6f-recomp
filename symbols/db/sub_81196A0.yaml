open_questions:
- Whether sub_81196A0 is really the per-frame NPC sprite tick or only an init-time wiring hook; the presence of
  nullStub_8119800 and the npc_dispatchStateHandler_811979C paths suggest a broader state-handler role whose sprite_update
  is only one branch.
- Whether the captured r0=0x81196A1 entries (bx targets) should still be considered "calls to sprite_update" or
  hits of the first jumptable slot sub_81196C4+1. Settling it needs sub_81196C4's body.
