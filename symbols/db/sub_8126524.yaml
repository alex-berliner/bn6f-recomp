name: sub_8126524
address: '0x08126524'
kind: function
status: hypothesis
summary: Parameterless wrapper that invokes sub_8126570 with a fixed argument set (a 40x12 rect at x=90, y=32, two
  data pointers, and flag 0x40000000); game meaning unknown until sub_8126570 is identified.
interface: void sub_8126524(void); // no meaningful inputs; r2/r3 are callee leftovers that callers of this wrapper
  see as outputs
details: 'Thin trampoline: sets r0-r3 to the constants 0x5A (90), 0x20 (32), 0x28 (40), 0x0C (12),

  loads r4 = &byte_8124A84, r6 = 0x40000000, r7 = &dword_8124A94 (r5 passes through

  untouched), then tail-ish calls sub_8126570 via bl and immediately pops r4-r7/pc, so the

  saved r4-r7 are restored to their incoming values after the call. The 90/32/40x12 tuple

  looks like a screen rect (position + width/height), and the two pointers plus the single

  high flag bit (bit 30 of 0x40000000) suggest a draw/setup call for one fixed UI element,

  but the callee and the data at byte_8124A84/dword_8124A94 must be identified before a

  game-terms name can be justified. Callers relying on r2/r3 outputs are actually reading

  whatever sub_8126570 leaves behind.

  '
