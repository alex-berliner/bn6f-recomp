name: maybeStartEntranceCutscene_8034F68
address: '0x08034F68'
kind: function
status: confirmed
summary: 'Overworld per-frame: if a door-coordinate trigger under the player is enabled, start the door''s
  entrance/interact cutscene.'
interface: 'void sub_8034F68(void); /* inputs: r10 toolkit, lr; outputs: r2 r8 r9 r10 r11; clobbers nz
  c v r0 r1 r3 lr; preserves r4-r7 r12 */'
details: "Called from the overworld main loop; receives r10 = the active Toolkit* and exits cleanly.\n\
  Guards out if a cutscene script is already non-null (IsCutsceneScriptNonNull), so it doesn't\ndouble-trigger.\
  \ Loads GameState* via oToolkit_GameStatePtr, then the overworld player object\nvia oGameState_OverworldPlayerObjectPtr,\
  \ then submits the player-space coordinate word\n(player_obj + 0x1C, the entity's current tile coords\
  \ blob) to checkCoordinateTrigger_8031a7a.\nReads back the r1 trigger id. Valid range is 1..0xF (15);\
  \ id 0 / 0x10+ bails.\nComputes an event-flag id by indexing into a base of 0x16F0 + id (the per-door\
  \ script flag\nblock in EWRAM/IRAM). If TestEventFlag says the flag is clear, bails.\nThen reads slot_addr\
  \ = unk_2011EA0 + id*4 (size-16 door-slot table of { u8 enabled, u24? param });\na leading zero byte\
  \ (the enabled flag) means the door is disabled and bails. Otherwise starts\nCutsceneScriptEntranceInteract_8098384\
  \ with the slot's 32-bit tail as the param (the door's\ncutscene-id / warp-target).\nQuirks:\n  * r2\
  \ is in the preserved set by contract but never used or written in the body; the readable\n    preserves\
  \ it explicitly.\n  * The flag base \"0x16F0\" is EVENT_16F0 in this build (exposed symbol); id 0 isn't\
  \ a real door\n    so that slot's flag never matters.\n  * Returns early on every guard; only the happy\
  \ path clobbers r0/r1/r3/lr for the\n    StartCutscene call. r10 is set to the GameState*'s derived\
  \ pointer at one point but is\n    caller-preserved, so the caller's r10 survives.\n"
