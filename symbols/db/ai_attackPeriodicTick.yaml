name: ai_attackPeriodicTick
address: '0x080ED700'
kind: function
status: probable
summary: AI attack-state handler that initializes a repeating attack (animation, timer) and every 15 frames deals
  its damage via sub_80E5150.
interface: (r7 = battle object with oAIAttackVars) -> void; sets AttackElement/StepTimer/HitElement fields
details: Runs as a per-frame step for an object's AI attack. On first entry (AttackElement==0) it plays animation
  0xC, resets the counter timer to default 0x10, sets ObjectFlags1 bit 22, and arms StepTimer=15 with AttackElement=4.
  When the timer reads 13 (two frames after arming), it calls sub_80E5150 passing Damage+AttackBoost, AttackBoost,
  InitFlag and AttackBoost2 loaded from the oAIAttackVars struct — the actual hit/damage application. The timer
  then counts down each frame; on underflow it reloads to 15 and writes HitElement=4, making the attack loop with
  a 15-frame period until something else clears AttackElement.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne — init branch only when element unset; init: object_setAnimation(0xC),
    object_setDefaultCounterTime, object_setFlag1(bit22), StepTimer=0xF, AttackElement=4; StepTimer==0xD path loads
    Damage/AttackBoost/InitFlag/AttackBoost2 into r4-r6 and calls sub_80E5150; timer decrement with bge/below-zero
    reload to 0xF and HitElement=0x4 gives the 15-frame loop; recorded in the beastsp route, consistent with a boss/enemy
    AI attack step'
