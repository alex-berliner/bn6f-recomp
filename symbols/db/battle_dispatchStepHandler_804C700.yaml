name: battle_dispatchStepHandler_804C700
address: '0x0804C700'
kind: function
status: confirmed
summary: 'Battle-start step dispatcher: reads a step byte from the battle object and tail-jumps to the
  matching handler from a two-entry table.'
interface: void sub_804C700(u32 battleObj /* r5 */); inputs r5, r10, lr; caller-visible outputs r2, r8,
  r9, r10, r11, r12 (produced by the dispatched handler); nzcv clobbered
details: 'Reads byte at battleObj+0x10 (r5 is the battle object pointer) and uses it as an index into
  the table at off_804C714, which has two entries: step 0 -> battle_setupBackgroundGfx+1 (thumb), step
  1 -> battleObject_initBattleFieldTilesAndSfxTimer_804C770+1. The step number is passed in r1 and the
  table entry itself in r0. Dispatch is done by setting lr = pc and ''bx r0'' into a Thumb handler, so
  the handler executes with live guest registers; its writes to r2 and r8-r12 are what callers of sub_804C700
  observe afterwards. r4-r7 preserved, lr and r0-r1 clobbered by the call.'
