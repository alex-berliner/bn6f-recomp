name: sub_8109708
address: '0x08109708'
kind: function
status: confirmed
summary: Picks a random panel relative to a battle object's current position, using reach/filter parameters that
  vary with the object's alliance.
interface: u32 pickRandomPanelByAlliance_8109708(u32 x, u32 y, u32 extraArg, BattleObject* battleObject); // returns
  panel via r0, flags NZ/C/V clobbered
details: 'Reads the attacker''s alliance byte (oBattleObject_Alliance) from the battle

  object passed in r5, then loads a panel-parameter table pointer from

  off_8109780 (-> off_8109784) into r3. Calls

  GetAllianceDependentPanelParamArgs to materialize the alliance-dependent

  reach/filter args, and then calls GetRandomRelativePanelFiltered with

  r0/r1 (coords) and the just-set-up params. r2 is shuttled through in r4

  for the second call. Explicitly preserves r4 and r6 across both calls

  (the AAPCS would already preserve r4-r7, so this is the original''s belt-

  and-suspenders save). The two helper calls are the actual work; this

  function is a thin glue layer.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
