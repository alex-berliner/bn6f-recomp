name: save_BackupToGamePakWithRetry_803FAB4
address: '0x0803FAB4'
kind: function
status: confirmed
summary: Backs up the 0x80-byte save block at dword_20067C0 into the game pak backup area, retrying up to three
  times, and returns 1 if any attempt verified successfully.
interface: bool sub_803FAB4(void); returns r0 = 1 if at least one of three attempts copied and verified, r0 = 0
  if all three failed; r4-r7 and NZ flags (on r0) are the observable outputs; clobbers r0-r3 and lr
details: 'Runs a three-attempt loop. Each iteration first calls rng_FillSeedBuffer_803FAEE to refresh the RNG seed
  buffer (the save seed is redrawn before every write), then calls libSave_CopyToGamePak with source dword_20067C0
  (the 0x80-byte save block in EWRAM), destination 0xE007F80 (the game pak/flash backup area at the top of ROM space)
  and length 0x80. It then calls sub_814D9C4 with the same three arguments to verify the copy, counting the attempt
  as failed when the verifier returns 0 (tst r4,r4; failure increment taken on zero). If fewer than 3 attempts failed
  it returns 1; only when all three verifications fail does it return 0. r6 is a failure counter and r7 the attempt
  counter; the function itself never passes meaningful values in r4-r7 to its callees except r7. The verify call
  is allowed to clobber r7, hence the pop/push of r7 between the copy and verify calls in the original. Presumably
  part of the save/continue flow guarding against a corrupted or half-written backup.

  '
