name: battle_initTypeSpriteObject
address: '0x080E0B08'
kind: function
status: probable
summary: State-init handler that loads the sprite, animation and palette for a battle object from a per-type
  table indexed by Param1, plays a spawn sound, and advances to the next state.
interface: (r0 unused on entry; r5 = object) -> r0 = 0; object sprite/anim/palette fields set, flags |=
  2, CurStateActionPhaseAndPhaseInitialized = CUR_STATE_UPDATE
details: 'Reads oBattleObject_Param1 as a type index, multiplies by 0xC to select a 12-byte record in
  the table at byte_80E0A14, and stores the record pointer in oBattleObject_ExtraVars. The record holds
  a sprite id (bytes 0-1, passed to sprite_load with 0x80), an initial anim index (byte 2, also copied
  to CurAnim/CurAnimCopy), a palette (byte 3), and a value at offset 8 fed to sprite_setUnk0x2c. It sets
  the object flags bit 0x2, calls sprite_noShadow, updates the sprite once, then plays sound 0x89 — overridden
  to 0x12d when Param1==8. Special case for Param1==9: if the related object''s AIData actor type is 2
  with AIIndex 0, battle_networkInvert on the object''s alliance decides whether the table''s timer value
  is replaced by timer_2000000 (a very long duration). Finally it writes CUR_STATE_UPDATE into the state/phase
  field and tail-calls sub_80E0B8C, the next state handler.'
