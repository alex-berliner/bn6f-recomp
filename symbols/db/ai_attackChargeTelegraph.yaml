name: ai_attackChargeTelegraph
address: '0x08108648'
kind: function
status: probable
summary: 'AI attack charge-up phase: highlights the panel in front of the user every 8 cycles, then flags
  the attack (0x1c) to fire when the step timer runs out.'
interface: () -> void; r7 = oAIAttackVars struct, r5 = owner battle object; sets oAIAttackVars_AttackElement/StepTimer/ChargeCycles/HitElement
details: 'Called each frame for the AI-controlled object''s current attack. If AttackElement is 0 it initializes
  the attack: element = 4, StepTimer = TimerOrCycles, ChargeCycles = 0. During the charge it increments
  ChargeCycles; every 8th cycle (lsr #3 carry) it calls object_highlightPanelRegion on the panel at PanelX+getFrontDirection,
  PanelY with region argument 4, repeatedly flashing the target tile. Each frame it also decrements StepTimer,
  and on reaching 0 writes 0x1c to HitElement, which presumably triggers the real attack handler.'
