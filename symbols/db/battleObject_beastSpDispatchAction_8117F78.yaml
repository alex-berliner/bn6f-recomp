open_questions:
- What `sub_8117F9C` vs `sub_8117FC4` actually do (init vs per-tick update, or two unrelated actions).
  Decompiling those would settle the action split.
- Whether `sub_8118234` is "common per-frame bookkeeping" before sprite_update or something specific to
  BeastSP; its r5-only contract hints it touches the same BattleObject.
