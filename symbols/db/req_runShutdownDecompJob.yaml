name: req_runShutdownDecompJob
address: '0x0803FBE8'
kind: function
status: probable
summary: Enqueues a BG-tile-decomp shutdown request and zeroes the 0x140-byte decomp work buffer used
  by it.
interface: () -> ()
details: Sets r0 to eDecompBuffer2013A00, r1 to BG1X_Offset (a DRAM address for the BG-tile destination),
  r2=1 (likely a 'shutdown'/'stop' sub-cmd), r3=0xA2400000 (mode/source/dst packed arg), then tail-calls
  req_enqueueTask so the background request worker eventually fills the BG-tile area. It then memsets
  the first 0x140 bytes of eDecompBuffer2013A00 to 0, readying the decomp work buffer for the next life.
  Called from the game-over scene-setup path, consistent with tearing down the current battle/field scene.
