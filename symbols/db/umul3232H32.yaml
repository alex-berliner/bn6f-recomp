name: umul3232H32
address: '0x0814DBF4'
kind: function
status: confirmed
summary: Helper that multiplies two unsigned 32-bit values and returns the high 32 bits of the 64-bit product.
interface: u32 umul3232H32(u32 a /*r0*/, u32 b /*r1*/); /* returns high word in r0; also leaves low word in r2 and
  high word in r3 */
details: 'Tiny ARM-mode math helper (it briefly switches from Thumb to ARM just to issue the single

  UMULL instruction). It computes the full 64-bit unsigned product r0 * r1, copies the high

  32 bits into r0 as the return value, and additionally leaves the low word in r2 and the

  high word in r3, so a caller that wants the full product can read it from r2:r3 after the

  call. No memory, game state, or structures are touched; it is a pure arithmetic utility

  typically used for fixed-point scaling / percentage math where the high half of a multiply

  is needed.

  '
