- method: assembly-reading
  date: '2026-10-19'
  detail: loop bound r4 = ldrb [r0,#5] of S2001c04 with (r4-1)*0x3C stride = 30 halfword entries per folder;
    inner loop iterates r6 = 0..0x3C step 2 reading ldrh [r7,r6] halfword entries; callee split9BitsFromBitfield_8021AE0
    unpacks chip id/code per entry; callee pack_addChipByIdSetLibraryFlag_8021B2A grants each chip to
