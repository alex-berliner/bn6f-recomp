name: pack_addAllFolderChipsToPack
address: '0x08120AB8'
kind: function
status: probable
summary: Re-adds every chip from every packed folder (30 halfword entries each) into the spare chip pack,
  also setting the library flags.
interface: '(r10->toolkit: S2001c04 byte 5 = folder count, 2002178 ptr = folder data) -> void'
details: 'Reads a count byte at S2001c04+0x05, then loops that many times over the chip-data structure
  at 2002178, using a 0x3C-byte (30 halfword) stride per folder: base = chipPtr + (count-1)*0x3C down
  to folder 1. For each of the 30 halfwords it calls split9BitsFromBitfield_8021AE0 to unpack the chip
  id (and code) from the 18-bit entry, then calls pack_addChipByIdSetLibraryFlag_8021B2A to grant that
  chip to the pack, set its library event flag, and slot it by code. Effectively it materializes all chips
  held in the folder structures as owned chips in the spare pack.'
