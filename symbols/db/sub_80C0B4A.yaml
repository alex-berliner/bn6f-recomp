name: sub_80C0B4A
address: '0x080C0B4A'
kind: function
status: confirmed
summary: 'Per-tick handler for a battle object: on first run sets up the entry phase (clear CurAnim, clear ExtraVars+0xC,
  set Timer=10, mark PhaseInitialized=4), then ticks Timer down and transitions CurAction to 0xC while clearing
  the phase bit on zero.'
interface: void sub_80C0B4A(struct BattleObject* r5); // clobbers r0, NZCV
details: 'Operates on a battle object passed in r5.

  On entry checks oBattleObject_PhaseInitialized; if zero, performs one-time

  setup: CurAnim=0, ExtraVars+0xC (offset 0x6C) cleared to 0, Timer=10,

  PhaseInitialized=4.

  Otherwise decrements oBattleObject_Timer; if it stays >0 returns. When it

  reaches 0, writes 0xC to oBattleObject_CurAction (at struct offset 9) and

  clears oBattleObject_CurPhaseAndPhaseInitialized, so the object re-enters

  the init branch on the next call.

  The value ''0xc'' written to CurAction is the next action/state in the

  battle object''s action table; no explicit name is available.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
