name: sub_80ECA34
address: '0x080ECA34'
kind: function
status: confirmed
summary: Dispatches the AI's battle-attack state machine to one of two handlers selected by the AI block's selector
  byte.
interface: void aiAttackDispatch_80ECA34(u8 r0 * selector byte, u32 * r5 r6 r7 r10 lr passthrough); returns through
  r1 r5 r8 r9 r10 r11 r12 (NZ/C/V clobbered)
details: 'Reads the selector byte at offset "oAIAttackVars_Unk_00" in the AI attack state block addressed via R7,
  uses it as a word index (0 or 4) into the two-entry handler table at off_80ECA48, then tail-calls the chosen handler
  (sub_80ECA50 / sub_80ECAA4) via LR=PC;BX. The handler is entered Thumb with R0 = selector and R1 pointing at the
  handler''s own entry table word, and the remaining argument registers (R2, R5, R6, R7, R10, LR) flow straight
  through to it. Because BX jumps to LR with PC already past the POP, the handler returns directly into this function''s
  caller, so R1/R5/R8-R12 in the contract are really the handler''s outputs.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
