name: battle_renderCommErrorTextGfx
address: '0x08038F74'
kind: function
status: probable
summary: Renders the glyph graphics for the communication-error text into VRAM during battle scene (re)initialization.
interface: (no args) -> r0-r7 clobbered; publishes TextScriptCommError text and decompresses its glyph
  chunk into VRAM at 0x6005000
details: 'Pure wrapper around renderTextGfx_8045F8C with fixed arguments: r0 = TextScriptCommError873B9E0
  (the comm-error text script), r1 = 0x28 (index/count), r2 = eDecompBuffer2013A00 as the scratch decomp
  buffer, r3 = 0x6005000 as the VRAM destination (a character tile block), r4 = 0x20 and r5 = 2 as layout
  parameters, r6 = dword_86B7AE0 as the glyph source table. The callee publishes the text-graphics base
  pointer into the text-renderer state and hands the selected glyph chunk to sub_3006B94 for decompression
  into VRAM. It is invoked by battle_initReturnSceneGfx as part of the full graphics reset when a battle-linked
  scene restarts, so the comm-error string''s tiles are staged in VRAM up front. No branch logic; always
  renders the same text.'
