name: encryption_decryptPackTable30_800a7ea
address: '0x0800A7EA'
kind: function
status: confirmed
summary: Decrypts a fixed table of 30 packed halfwords in place by feeding each entry's 9-bit payload and 7-bit
  key to the pack decryption routine.
interface: void encryption_decryptPackTable30_800a7ea(u16 *table /* r0, 30 halfwords */)
details: 'Takes r0 = pointer to a table of 30 (0x1E) packed halfwords and decrypts the table in

  place, one entry per iteration of a 30-iteration loop. Each halfword is split as

  payload = halfword & 0x1FF (low 9 bits, passed in r0) and key = halfword >> 9 (high 7

  bits, passed in r1), with r2 = 0, and the triple is passed to

  encryption_applyPack_8006e70, which presumably applies the keyed transformation to the

  entry (the pointer to the current halfword stays live in r4 across the call, so the

  callee can write the decrypted result back through it). The loop pointer advances by 2

  bytes per entry. r4 and r6 are preserved for the caller; r0/r1 exit holding the last

  entry''s split payload/key with r2 = 0, and flags come from the final loop-counter

  compare (counter 0x1E vs 0x1E, so Z set / C set on exit). The original spills the

  payload halfword to the stack around the callee call; it is not read back by this

  function, but whether the callee peeks at it is unverified. The 30-entry size and

  9+7-bit packing suggest a fixed-size encrypted pack, such as a 30-slot folder/pack

  record table.

  '
