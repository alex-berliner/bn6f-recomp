name: battle_explodeAndSelfDestruct
address: '0x080D99A4'
kind: function
status: probable
summary: Spawns a pair of jittered explosion effects plus one more effect on the object's position, plays
  a blast sound, and puts the battle object into its destroyed state.
interface: (object pointer in r5; r0 unused on entry) -> r0 = spawn result; object flagged and moved to
  CUR_STATE_DESTROY
details: Reads three words at r5+0x34 (the object's x/y/z fixed-point coordinates) and pushes them as
  arguments for two AddRandomVarianceToTwoCoords calls with mask 0xF, interleaved with calls to sub_80E47A4
  — i.e. two effects spawned at randomly jittered copies of the object's position. It then re-reads the
  coordinates, bumps the third by 0x10 in the high half (16 px), and spawns effect object type 0 with
  parameter 2 via spawn_t1_0x0_EffectObject. It plays sound effect 0xD9 (an explosion/defeat sound), clears
  bit 0x2 of oObjectHeader_Flags, and stores CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized
  so the battle loop deletes the object. The object pointer living in r5 rather than r0 suggests this
  is dispatched from a state/phase table where the caller has already loaded the object into r5.
