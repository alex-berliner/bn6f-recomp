name: battle_EndRelatedObject2Anim_80F06CE
address: '0x080F06CE'
kind: function
status: confirmed
summary: Ends the current animation of a battle object's secondary "related object 2" sprite, if one is attached.
interface: void battle_EndRelatedObject2Anim(BattleObject* obj /* r5 */); preserves r4/r5, returns flags (nz from
  the null test when no related object, otherwise from the animation-end call)
details: 'Tiny wrapper over battle_EndObjectCurrentAnim_80C44D2 for a battle object''s second related

  object pointer (field oBattleObject_RelatedObject2Ptr at offset from r5). Loads the pointer,

  and if non-null calls battle_EndObjectCurrentAnim_80C44D2 with it in r0 to stop/finish that

  sprite''s current animation. If the pointer is null it simply returns, leaving the flags from

  the tst. Callers pass r4 (untouched by this routine, likely context) and r5 (the battle

  object) and read back all caller-saved registers plus flags, so the flag side effect is

  apparently relied upon. The words immediately after the function (0x600, 0x10000000, 0xFFFF,

  0x3000, 0x185, byte_8021300/byte_802136D pointers, 0x80000000, 0x140000) are data belonging to

  the surrounding pool, not used by this routine.

  '
