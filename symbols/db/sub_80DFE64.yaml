name: sub_80DFE64
address: '0x080DFE64'
kind: function
status: confirmed
summary: Activate a battle object by snapping it to panel coordinates, building its collision data, and handing
  it off to the per-frame update state.
interface: 'void sub_80DFE64(void /* r5 = battle object */);  // inputs: r5, r8, r10, lr; outputs: r5, r8; clobbers
  NzCV, r0-r3, lr; preserves r4, r6, r7'
details: "Operates on the battle object pointer held in r5.\n1. object_setCoordinatesFromPanels() snaps the object\
  \ onto its assigned panels.\n2. oBattleObject_Timer (u16) is initialized from oBattleObject_Param2 (low byte).\n\
  3. object_createCollisionData() builds the collision structure; a NULL return\n   means the object is invalid,\
  \ so object_freeMemory() is called and the\n   function returns immediately (object is discarded instead of activated).\n\
  4. Collision shape index is derived from oBattleObject_Param3:\n     0 -> 3, 1 -> 1, anything else -> 0.\n5. object_setupCollisionData(shape,\
  \ width=0xA, height=5) configures a fixed\n   10x5 collision box.\n6. object_setCollisionHitEffect(0) clears the\
  \ hit effect, then\n   object_clearCollisionRegion() and object_presentCollisionData() publish\n   the collision\
  \ to the field so it can start being hit-tested.\n7. oBattleObject_CurStateActionPhaseAndPhaseInitialized is set\
  \ to\n   CUR_STATE_UPDATE (0), handing control to the object's normal update state.\nr7 is used only as a local\
  \ scratch return slot (matching the original push\n{r7,lr}); the readable C does not surface it.\n\nRegister form,\
  \ old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
