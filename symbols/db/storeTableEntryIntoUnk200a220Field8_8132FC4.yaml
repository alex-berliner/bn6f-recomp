name: storeTableEntryIntoUnk200a220Field8_8132FC4
address: '0x08132FC4'
kind: function
status: confirmed
summary: Copies one word from a caller-supplied table (selected by index) into field +8 of the "unk 200a220" work
  struct held by the toolkit.
interface: void storeTableEntryIntoUnk200a220Field8(int r0 index_or_offset, const u32 *r1 tableBase); // passes
  r4-r7, r10 through; clobbers r0, r2
details: 'Tiny helper: fetches the toolkit''s pointer to the "unk 200a220" work area via

  oToolkit_Unk200a220_Ptr (at offset 0 of the toolkit struct reached through r10),

  loads the 32-bit word at [r1 + r0] (so r0 is a byte offset into the table at r1,

  not scaled), and stores that word at work+8. No flags are read or written by the

  body itself. The function is unusual in that it preserves r4-r7 and (per the

  register contract) r10 while clobbering only r0/r2, so callers can keep live

  state across the call. Nothing else is touched: no game state, no draw, no

  branch logic. Given the single-word store into a shared work struct, the likely

  game-level meaning is "publish the next value/pointer from a lookup table into

  a shared work slot", but which subsystem owns the table and the work field is

  not visible from this function alone.

  '
