name: snakearm_pickAdjacentPanel
address: '0x08114AC4'
kind: function
status: probable
summary: SnakeArm AI helper that picks one of the actor's horizontally adjacent panels (right, left) via
  panelFlagCheck_8015D80, supplying an alliance-dependent param table that the callee does not consume.
interface: (implicit r5 = battle object) -> r0 = panelFlagCheck_8015D80 result for the chosen relative
  offset; flags from callee
details: Reads the battle object's PanelX/PanelY from r5 and passes them with the object's panel coordinates
  to GetAllianceDependentPanelParamArgs using table byte_8114C60, so the search behavior depends on the
  object's alliance/team field. It then calls panelFlagCheck_8015D80 with the candidate list byte_8114AE8,
  whose entries are relative offsets (1,0) and (-1,0) — i.e. one panel right and one panel left — terminated
  by 0x7F. That callee transforms the relative offsets by the object's facing and picks a candidate panel
  passing flag checks. Returns whatever panelFlagCheck_8015D80 yields (picked panel or failure). Only
  known caller is snakearmAI_81149E0.
