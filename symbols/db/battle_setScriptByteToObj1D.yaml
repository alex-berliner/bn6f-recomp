name: battle_setScriptByteToObj1D
address: '0x0814E15C'
kind: function
status: probable
summary: Thunk that fetches the next script opcode byte via battleObject_runUpdateRoutineAndAdvancePC_814E0D0
  and stores it as a single byte into the battle object at offset 0x1D, returning through its own saved
  lr.
interface: (r0 = battle object ptr?, r1 = battle object ptr) -> r0 = script byte written; no meaningful
  return
details: 'This is a tiny thunk wrapping the per-update script interpreter: it calls battleObject_runUpdateRoutineAndAdvancePC_814E0D0,
  which reads the next command byte from the object''s script pointer at [r1+0x40] and advances it. Whatever
  the callee leaves in r3 (the byte fetched from the script stream) is stored with strb into the object
  at [r1+0x1d]. It then returns to its own saved lr (saved in r12) rather than the callee-modified path,
  so it acts as a standalone script opcode implementation. The meaning of field 0x1D is not shown here;
  it is some single-byte per-object state the script can set.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl battleObject_runUpdateRoutineAndAdvancePC_814E0D0: only work is advancing/reading the script
    PC at [r1+0x40]; strb r3, [r1,#0x1d]: sole effect is writing the byte returned by the script reader
    to object+0x1D; mov r12, lr / bx r12: plain wrapper return, typical of script opcode dispatch handlers;
    no callers known: consistent with an entry in an opcode table invoked indirectly'
