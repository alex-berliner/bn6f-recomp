name: battle_initParentLinkedEnemy
address: '0x080D25F8'
kind: function
status: probable
summary: Initialization routine for a battle enemy that inherits its damage-disable state from a parent
  object, sets up its sprite, collision region, HP, and spawns a companion type-4 object.
interface: (r5 = battle object header, freshly spawned) -> r0 = 0 on success; on collision-slot allocation
  failure the object is freed and the function returns via object_freeMemory
details: Positions the object from panel coordinates, loads sprite (gfx 0x80, sheet 8, palette 0xf), sets
  Flags bit 1 (likely visible/shadow-related), selects animation 0xd, palette 0, and applies the object's
  effective flip. It copies the DamageAndStaminaDamageCounterDisabler word from RelatedObject1Ptr into
  itself, making it share the parent's invulnerability/counter-disable state. It then allocates a collision-data
  slot; if none is free it calls sub_80D2A58 and frees itself. On success it sets up a collision region
  0x29 at (0x14, 3) with hit effect 6, clears its collision region, loads HP/MaxHP from the byte_80D25CC
  table indexed by Param1*2, spawns child object type 4 id 0x47 into ExtraVars+0x1c, zeroes RelatedObject2Ptr,
  and advances its state machine to CUR_STATE_UPDATE.
