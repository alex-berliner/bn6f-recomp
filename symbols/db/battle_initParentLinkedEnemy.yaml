- method: assembly-reading
  date: '2026-10-18'
  detail: ldr r0,[r5,#oBattleObject_RelatedObject1Ptr]; ldr/str of DamageAndStaminaDamageCounterDisabler
    copies the parent's damage-disable state to this object; ldrb r0,[r5,#oBattleObject_Param1]; lsl r0,#1;
    ldrh from byte_80D25CC stores both HP and MaxHP, i.e. a per-variant HP table; beq loc_80D2676 path
    calls object_freeMemory after object_createCollisionData returns 0, a typical battle-object init failure
    path; battle_spawnType4Obj71 result stored in ExtraVars+0x1c shows this object owns a spawned companion
    object; mov r0,#CUR_STATE_UPDATE stored to CurStateActionPhaseAndPhaseInitialized ends init and hands
    control to the per-frame state handler
