summary: Zeroes a 4-byte field at IWRAM 0x200AD04 by delegating to ZeroFillByByte.
interface: 'void clear_e200AD04(void); // in: r2 (must be preserved through the call), lr; out: r2 preserved, r0/r1/lr
  and NZCV flags clobbered'
details: 'Tiny wrapper: loads the address word_200AD04 (IWRAM 0x200AD04) into r0, sets r1 = 4, and tail-calls ZeroFillByByte
  (not tail-optimized; lr is pushed/popped). The 4 bytes starting at 0x200AD04 are filled with zeros. The caller''s
  r2 is preserved across the call (ZeroFillByByte apparently keeps r2 intact), which is why the contract lists r2
  as an input/output. No game-term meaning for word_200AD04 is known from this snippet alone; the name e200AD04
  is likely a typo for the EWRAM/IWRAM address 200AD04.

  '
