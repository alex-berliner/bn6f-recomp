name: rfu_buildConnectedIdBitmap
address: '0x08146138'
kind: function
status: probable
summary: Scans the wireless connection table and returns a bitmask of entries whose id appears in the
  0xFFFF-terminated id list in the rfu struct at 200FE20.
interface: () -> r0 = u8 bitmask, bit i set when entry i's id (u16 at table+0x18, entries 0x20 bytes)
  matches one of the ids in the list at [200FE00+0x20] terminated by 0xFFFF; no flags relied on
details: Reads the entry count at [dword_2010CC0]+8 and iterates up to that many 0x20-byte records in
  the table pointed to by dword_2010CC0. For each record it loads the u16 id at offset 0x18, then walks
  the u16 list at eStruct200FE00+0x20 until the 0xFFFF terminator, comparing each list element against
  the id. On a match it sets bit i of the accumulator (kept as u8 via shift rotate through 0x18). The
  result is a bitmask of which connection-table entries are present among the currently linked peers.
  Entries whose record itself reads 0xFFFF at 0x18 are skipped entirely (the inner scan is not run).
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r0,#8] then loop with lsl r1,r5,#5 / ldrh r4,[r0,#0x18] reads a 0x20-byte-stride table's
    id field; list walk at eStruct200FE00+0x20 with cmp against 0xFFFF terminator (dword_81461AC) before
    and after each compare; orr r6,r1 with bit (1<<i) builds the returned bitmap, returned in r0 at loc_8146194;
    all six call sites are inside rfu_handleConnectionEvent, which dispatches link state transitions on
    the 200FE00 struct
