name: battle_getTotalDamageTakenForActor_801DFE4
address: '0x0801DFE4'
kind: function
previous_names:
- sub_801DFE4
status: probable
summary: Returns the cumulative damage-taken counter (TotalDamageTaken) for the actor's AIData.
interface: () -> r0 = u16 TotalDamageTaken for the currently-bound AIData record
details: "Trivial leaf wrapper. Loads the global pointer `eStruct2035280` (the battle/AIData\n  aggregate\
  \ at 0x02035280), offsets into it by 0x20, and returns the u16 read there\n  in r0. By the AIData layout,\
  \ that field at offset 0x20 is `TotalDamageTaken`, the\n  per-actor running sum of damage the actor\
  \ has taken during the battle. The caller\n  passes no inputs; the bound AIData selection is done elsewhere\
  \ before this is\n  called, so the function is purely an accessor. `lr` is the only thing read on\n\
  \  entry and it returns via `mov pc, lr`, so flags and other regs are unchanged.\n  Used by at least\
  \ two battle routines (sub_800A21C, sub_8010B78) that need the\n  accumulated damage value (e.g. for\
  \ \"anger\"/enrage thresholds or move-decision\n  logic in the AI step).\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldr r0, off_801E0D8 // =eStruct2035280` loads the EWRAM base at 0x02035280. - `ldrh r0,
    [r0,#0x20]` reads exactly the offset labelled `TotalDamageTaken // loc=0x20` inside `ai_data_struct`
    in AIData.inc. - Function returns the loaded halfword directly in r0 (`mov pc, lr`), matching the
    contract''s `out=[''r0'']`. - Both callers are battle/AI routines, consistent with consuming an AIData
    field.'
