name: battle_getTotalDamageTakenForActor_801DFE4
address: '0x0801DFE4'
kind: function
status: confirmed
summary: Getter returning the total damage the player has taken in the current battle.
interface: u16 battle_getTotalDamageTakenForActor(void)
details: 'Reads a halfword at offset 0x20 of the battle stats struct based at 2035280 (field word_20352A0) and returns
  it in r0. The field accumulates the damage dealt to the player over the course of the current battle; callers
  can use it e.g. for Fauché/Falzar-style effects or HUD/stat checks that depend on damage taken. No state is modified;
  lr is used as the return address (plain tail return, no other registers touched).

  '
