open_questions:
- Which actor's AIData record is being indexed into — the global `eStruct2035280` is
- presumably the per-actor slot multiplexer (an outer index written elsewhere), and
- without that context we can't say whether this returns the player's or the current
- AI actor's damage. Settled by finding the code that writes the outer index into
- the struct at 0x02035280 just before these callers run.
