name: battle_aiTurnHandler
address: '0x080F64B0'
kind: function
status: probable
summary: 'Per-turn enemy AI handler: advances the turn/attack counters, picks an attack-init or pattern
  branch, then queues the next AI script step (4).'
interface: (r6 = enemy object with oAIState_* fields) -> sets oAIState_ScriptId = 4; no r0 return used
details: 'Reads oAIState_TurnCounter: while below 5 it increments the counter and toggles oAIState_AttackCounter
  between 0/1 via EOR with 1. On the even path (attackCounter was 0) it calls battle_initAiAttackVars,
  which stores the difficulty tier, sets the panel-choose callback and starts attack0 id 0xB; on the odd
  path it calls sub_80F661E (second attack pattern). Once the turn counter reaches 5 it is reset to 0
  and sub_80F65EE runs (a different long-term phase). All branches end by writing ScriptId = 4, so this
  is one state in the object''s AI script dispatch, reached during battles (battlesweep routes).'
