  date: '2026-10-18'
  detail: 'uses oAIState_TurnCounter/oAIState_AttackCounter/oAIState_ScriptId fields of the battle object
    AI state; eor r1, r0 with r1=1 alternates attackCounter, selecting between two branches at loc_80F64D0;
    callee battle_initAiAttackVars is the known ''init AI attack state'' routine, confirming the attack-init
    role; turn counter compared to #5 and reset to 0 implies a 6-turn cycle before sub_80F65EE branch;
    final strb r0(=4),[r6,#oAIState_ScriptId] chains to the next AI script step'
