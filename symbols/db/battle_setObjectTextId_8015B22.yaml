name: battle_setObjectTextId_8015B22
address: '0x08015B22'
kind: function
status: confirmed
summary: Writes a text/name ID into a battle object's NameID field, mapping id 0 to the default 0x1A0.
interface: void battle_setObjectTextId(u16 textId /*r0*/, struct BattleObject* obj /*r5*/)
details: 'Takes an ID in r0 and a battle object pointer in r5, and stores a halfword at obj + oBattleObject_NameID.
  If r0 is 0 the constant 0x1A0 (416) is stored, which appears to be the default/placeholder text entry; otherwise
  the stored value is r0 - 1 + 0x1AB, i.e. ids 1.. map onto the text-table range starting at 0x1AB (427). The arithmetic
  is done as sub r1,r0,#1 / add #0xAD / add #0xFF, so inputs > 0xFFFF-0x1AB would wrap, though ids are naturally
  small. The function only touches the one halfword and returns via mov pc, lr. The nearby literals (byte_203CED0,
  unk_203A980, fixed-point constants 0x4000/0x100/0x10000/0xF800000) belong to adjacent functions, not to this one.

  '
