name: battle_objectPhaseWait60Frames
address: '0x080E2D54'
kind: function
status: probable
summary: Battle-object phase handler that waits 60 frames on first entry, then ends the wait by advancing
  the object to CurAction 12.
interface: (r5 = battle object pointer, no args in r0-r3) -> void; no meaningful flags
details: Standard phase-step function operating on the battle object in r5. On first invocation (oBattleObject_PhaseInitialized
  == 0) it stores 60 into oBattleObject_Timer and writes 4 to oBattleObject_PhaseInitialized so init runs
  only once. Every call afterwards it decrements the 16-bit Timer; while the result is >= 0 it returns
  and the phase keeps waiting. When the counter goes negative it sets oBattleObject_CurAction to 0xC and
  zeroes oBattleObject_CurPhaseAndPhaseInitialized, so the object's action dispatcher moves on to action
  12 with a fresh phase state.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#oBattleObject_PhaseInitialized] / bne skip: one-time init guard writes Timer=0x3C
    and PhaseInitialized=4; ldrh/sub/strh on oBattleObject_Timer with bge locret: loop body is just a
    frame-countdown wait; on Timer < 0: strb #0xC to oBattleObject_CurAction and strh #0 to oBattleObject_CurPhaseAndPhaseInitialized
    — transition to next action; shape (r5 object, Timer/PhaseInitialized/CurAction fields, pop {pc})
    matches other battle-object phase step functions'
