name: sub_80ECA50
address: '0x080ECA50'
kind: function
status: confirmed
summary: 'AI buster-shot attack state machine: starts the fire animation on first tick, then on the next tick plays
  the buster impact sound and spawns a damage projectile forward, finally signalling completion after 4 timer ticks.'
interface: void sub_80ECA50(u32 r1_in, u32 r2_in, u32 r5_battleObj, u32 r7_aiAttackVars, u32 r8_in, u32 r9_in, u32
  r10_in) -> r1 r5 r7 r8 r9 r10; clobbers NZCV r0 r2 r3 r4 r6 lr
details: "Operates on a battle object's AI attack-vars block (r7) plus the battle object itself (r5).\nState machine\
  \ driven by oAIAttackVars_Unk_01 and oAIAttackVars_Unk_10:\n  * Unk_01 == 0 (first call): sets animation #0xE\
  \ via object_setAnimation, calls sub_80EB562\n    and object_setDefaultCounterTime, marks Unk_01 = 4, and seeds\
  \ the frame timer\n    oAIAttackVars_Unk_10 = 0.\n  * Unk_10 == 1 (second tick): plays SOUND_BUSTER_6A, then calls\
  \ sub_80C9184 to spawn the\n    buster shot. sub_80C9184 is given:\n      - X = object_getFrontDirection() + oBattleObject_PanelX\n\
  \      - r1 = oBattleObject_PanelY\n      - r2 = oAIAttackVars_Unk_02\n      - r3 = 0\n      - r4 = oAIAttackVars_Unk_0c\
  \ (a pointer/object id from the attack vars)\n      - r6 = oAIAttackVars_Damage + oAIAttackVars_AttackBoost\n\
  \    so it fires a damage projectile straight ahead from the current panel, scaled by the\n    AI's AttackBoost.\n\
  \  * Other ticks: pass-through, no side effects beyond the timer advance.\nAfter the body, increments oAIAttackVars_Unk_10;\
  \ when it exceeds 4, writes 4 into\noAIAttackVars_Unk_00 which the parent state machine presumably reads to mark\
  \ the attack\nas finished and advance to the next phase.\nReads/writes: oAIAttackVars_Unk_00, _Unk_01, _Unk_02,\
  \ _Unk_0c, _Unk_10, _AttackBoost,\n_Damage on the AI attack-vars struct; oBattleObject_PanelX, oBattleObject_PanelY\
  \ on the\nbattle object (r5).\n"
