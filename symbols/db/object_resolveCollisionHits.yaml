open_questions:
- what sub_801AE56 does (likely per-hit or invulnerability processing) is not shown
- exact meaning of ObjectFlags2 bits 0x100/0x4 and HitModifierFinal bit 0x40 (hit stop? invuln? holy panel
  interaction?) unconfirmed
- caller sub_80CBC38 is itself undocumented, so this function's position in the object update order is
  inferred only
- The proposal correctly captures the early-exit when bit0 of battle_getFlags is clear, the chain through
  object_removeCollisionData/battle_isBattleOver/object_getFlag(0x100)/sub_801AE56, the conditional flag2
  mutation, and the trailing object_calculateFinalDamage2/object_spawnHiteffect. However, the function
  unconditionally calls sprite_clearFinalPalette at entry, which is a palette reset step the summary omits.
  The name and summary miss that; also 'finalizes this frame's collision contact' slightly overstates
  — sub_801AE56 is not necessarily per-hit processing, it is just the next sub. A better name reflects
  the per-frame collision resolution + hit-spawn role.
