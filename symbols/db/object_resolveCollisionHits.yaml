name: object_resolveCollisionHits
address: '0x0801ADFA'
kind: function
status: probable
summary: Per-object battle step that resets the sprite's final palette, tears down this object's collision
  data if the battle is live, updates ObjectFlags2/ContactState based on hit flags, recomputes pending
  damage, and spawns the hit effect.
interface: (r5 = battle object) -> r0 = clobbered; updates object flags, oBattleObject_ContactState, collision
  data, and spawns hit effect
details: Runs only when battle state flag bit0 (oBattleState_Unk_32) is set, otherwise returns immediately.
  It tears down the object's collision data (object_removeCollisionData) unless the battle is over or
  the object's flag 0x100 blocks it, then calls sub_801AE56 (likely per-hit processing). If the object
  lacks flag 0x40 but its collision data HitModifierFinal has bit 0x40, it sets ObjectFlags2 bit 0x100,
  clears bit 2, and sets oBattleObject_ContactState = 1 (marking it as having been hit this frame). Finally
  it recomputes the pending damage total via object_calculateFinalDamage2 and spawns the hit visual via
  object_spawnHiteffect. r7 caches the object's CollisionDataPtr loaded at entry.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: early exit on battle_getFlags bit0 makes this part of the active-battle per-frame object update;
    calls object_removeCollisionData and object_calculateFinalDamage2, both documented as collision-data/damage-total
    routines; reads oCollisionData_HitModifierFinal and writes oBattleObject_ContactState = 1 when hit
    conditions (bit 0x40) are met; ends with object_spawnHiteffect, matching damage-application behavior;
    single caller sub_80CBC38 runs it in the battle object update loop context
  refs:
