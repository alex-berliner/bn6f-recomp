summary: Action table of the virus AI with index 0x1F, slot 0x1F of off_8109050; 9 Thumb handlers run by RunAIAttack,
  picked by the object's CurAction (0..8).
details: 'Nine words (asm32.s:16383-16391), each a Thumb handler (+1) that works on the battle object in r5:


  | CurAction | handler |

  |---|---|

  | 0 | sub_81166F2: clears bit 1 of the object header flags; if bit 1 of battle_getStateUnk5c_800139A is set, CurAction
  = 1 and the phase halfword = 0 |

  | 1 | battle_ResetObjectActionState_80165B8 |

  | 2 | sub_811670E: relatedToIsBattleOver_800A11C, RemoveGivenAliveBattleActorFromList, CurState = CUR_STATE_DESTROY
  |

  | 3 | sub_80166AE (shared: ForMettaur_8109EF4 has it at CurAction 3 too) |

  | 4 | battleObject_initAndRunAI_8016B02 |

  | 5 | battleObjectStateDispatcher_8016CE8 |

  | 6 | sub_8016B36 |

  | 7 | sub_8016B72 |

  | 8 | battle_updateCustGauge_8116720: runs the AI script through off_8116754, clears header flag bit 1, then SetCustGauge((MaxHP
  - HP) * halfword +0x80) |


  How it is reached: battle_8108F74 loads off_8109050[AIData.AIIndex] and passes it to battle_801B1C4, which hands

  it to RunAIAttack; RunAIAttack indexes it by CurAction * 4 (CurAction >= 0x10 goes to AIAttackJumptable instead).

  ForMettaur_8109EF4, slot 1 of the same table, is built the same way (its comments mark the CurAction of each

  word), with more entries after CurAction 8.


  The same AI index has sub_81166D4 as its hook in off_8109250 (slot 0x1F, dispatched by

  battle_dispatchActorHandlerByType_800F35C): it sets PanelX = 7 (off the 6-column field), updates the collision

  panels and stores 0x4000 / MaxHP at halfword +0x80. With handler 8 that makes the Custom Gauge proportional to
  the

  HP this object has lost: (MaxHP - HP) * 0x4000 / MaxHP. vidsync''s family map (docs/vidsync/BN6F_SYMBOLS.md

  section 7, read from the order of the virus names) puts Tuby at AI index 0x1F; the handlers here look more like

  a hidden helper object than a virus.


  Right before it is byte_81165C4 (asm32.s:16362-16381), slot 0x1F of the per-AI data table off_81090D0, so the

  same AI index''s data; its tail is 0xFF filler and 8 zero bytes.

  '
