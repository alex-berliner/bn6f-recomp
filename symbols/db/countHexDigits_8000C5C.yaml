name: countHexDigits_8000C5C
address: '0x08000C5C'
kind: function
status: confirmed
summary: Returns the number of hexadecimal digits (4-bit nibbles) needed to represent a value, with 0 counting as
  one digit.
interface: 'int countHexDigits(u32 value); // in: r0 = value; out: r0 = r1 = digit count, nzcv set from "adds r0,
  r1, #0" on the result'
details: 'Pure utility with no memory or game-state access. If r0 is 0 it returns 1; otherwise it shifts the value
  right by 4 bits in a loop, incrementing r1 once per shift, until the value reaches 0, then returns the count.
  The final "mov pc, lr" is encoded as adds r0, r1, #0, so the N/Z/C/V flags reflect the returned digit count (C/V
  cleared) — callers may rely on those flags even though the lifter lists r1 and flags as outputs. Typical use would
  be sizing/fixed-width printing of hexadecimal numbers (e.g. debug or number formatting), but no caller context
  is shown here.'
