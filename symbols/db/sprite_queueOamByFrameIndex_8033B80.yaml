name: sprite_queueOamByFrameIndex_8033B80
address: '0x08033B80'
kind: function
previous_names:
- sub_8033B80
status: probable
summary: Queues one OAM entry per call, picking tile offset from a 0x18-entry periodic table using frame
  counter at [r5+5].
interface: (r0 = OAM tile-id-ish arg / 24-frame slot, r5 = some struct base) -> r0 = next-frame index
  used by next call (0..0x17) ; side effects queues OAM via sprite_queueOamEntryThunk_802FE28, writes
  [r5+5] (next frame index)
details: "Computes r2 = 0x18 * r0 (entry takes r0=0 from snap captures, treated as a frame slot index).\
  \ Reads byte [r5+5] (frame counter) and adds r2 -> r0.\n  Looks up byte_8033BB8[r0]; the table is 24\
  \ bytes of zeros followed by a repeating 0/1/2/3/2/1 pattern. Shifts the loaded byte left by 0x10 and\
  \ adds 0x80028003 to form the OAM tile-data arg.\n  Calls sprite_queueOamEntryThunk_802FE28 with r2=1,\
  \ r3=0 (constant) and the constant 0xC790 as the u16 param.\n  Increments [r5+5]; if it reaches 0x18\
  \ wraps it back to 0. Returns the new [r5+5] in r0.\n  The captured exits (1, 2, 3, ..., 0xE over sequential\
  \ calls) line up with the running counter that wraps every 24.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `mul r2, r0` / `ldrb r0, [r5,#5]` and the post-increment `add r0, #1` then `strb r0, [r5,#5]`
    show [r5+5] is a persistent frame-index counter (assembly lines 526-540). - byte_8033BB8 has 24 zeros
    followed by a 0,1,2,3,2,1 repeating pattern (visible in the `.byte` block), matching the constant
    0xC790 / 0x80028003 OAM packing for GBA OAM tile offsets. - Captured exit r0 progresses 1,2,3,...,0xE
    in order, matching the +1 and wrap at 0x18. - `bl sprite_queueOamEntryThunk_802FE28` shows it submits
    the OAM entry; `dword_8033BAC = 0x80028003` matches the OAM attribute0 base (affine disabled, normal
    blend, no mosaic, 4bpp) plus the tile-id byte shifted into bits 16+.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x08033B80

