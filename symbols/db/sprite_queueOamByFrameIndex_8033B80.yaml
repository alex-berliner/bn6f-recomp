open_questions:
- What r5 points to (likely a per-OAM-bank or per-anim sprite state; the byte used here is at +0x05 which
  doesn't match a known struct offset in the supplied headers).
- The exact meaning of the 0xC790 arg to the queue function (probably OAM attribute2 = tile offset within
  the tile image, palette 7).
- Whether r0's caller-set value is meaningful or always 0 (all captured calls show r0=0 on entry, but
  the multiply by 0x18 is real, so callers may vary it).
