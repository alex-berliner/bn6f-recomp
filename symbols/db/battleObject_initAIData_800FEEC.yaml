name: battleObject_initAIData_800FEEC
address: '0x0800FEEC'
kind: function
status: probable
summary: Initialize the battle object's AI data block, picking values from the live Navi stats or from a per-alliance
  template table based on the alliance byte.
interface: void sub_800FEEC(u32 r5_battleObject, u32 r10_unused, void* lr); /* returns u32 r6_aidata; clobbers nz
  c v r0 r1 r2 r4 lr */
details: "Reads the AIData pointer from r5_battleObject+oBattleObject_AIDataPtr into r4. Calls\nGetBattleNaviStatsByte_AllianceFromBattleObject\
  \ with stat index 0x2C to fetch the alliance byte.\nIf that byte is 0, populates the AIData block from live Navi\
  \ stats:\n  - oAIData_Unk_04           <- stats[0x44] when GetBattleMode()==9, else 0xFF\n  - oAIData_BButton\
  \          <- stats[4]\n  - calls ai_setBeastOutPwrAtk_800FFAA(stats[5])\n  - oAIData_APwrAtk          <- stats[0x39]\n\
  \  - oAIData_BLeftAbility     <- stats[7]\n  - oAIData_BeastOutAPwrAtk  <- 0xFF\nIf the alliance byte is non-zero,\
  \ multiplies it by 6 and indexes into byte_8020354 (a\nsix-byte per-row template: oAIData_Unk_04, oAIData_APwrAtk,\
  \ oAIData_BButton,\npwrAtkFor ai_setBeastOutPwrAtk_800FFAA, oAIData_BLeftAbility, oAIData_BeastOutAPwrAtk).\n\
  Returns the AIData pointer in r6 (and leaves a copy in r4 across calls).\n"
