name: sound_8000808
address: '0x08000808'
kind: function
status: confirmed
summary: Appends a 16-byte sound/SSEQ request to the pending-request queue at dword_200A490, dropping it if the
  queue is full (32 entries).
interface: void sound_8000808(u32 word0 /*r0*/, u32 word1 /*r1*/, u32 word2 /*r2*/, u32 word3 /*r3*/) — r0-r3 form
  the 4-word request; flags returned are those of CMP count,#0x20 when full, else of the address-computation ADD;
  r4-r7 preserved
details: 'Reads the queue base pointer from dword_200A490. The first word of the queue

  is a pending-request count; slots are 16 bytes each beginning at queue+0xC.

  If count >= 0x20 the request is silently discarded (queue-full overflow path).

  Otherwise the count is incremented and stored, and the four argument words

  (r0-r3) are written to the new slot at queue + (count << 4) + 0xC via STMIA.

  Note the slot address math: count is used *before* increment, so slots are

  0-indexed. The count increment and the slot write are not atomic against

  interrupts. Flag side effects come from the CMP (full case) or the ADDS

  forming the slot address (not-full case), matching the original binary.

  '
