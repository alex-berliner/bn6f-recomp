name: battle_object_advanceState3_8129738
address: '0x08129738'
kind: function
status: confirmed
summary: Advances a battle object into state 3 (slot +0x1D) if a sub_812B318(3) gate succeeds, recomputing its stat
  field at +2 from the +0xE byte and clearing +3.
interface: void sub_8129738(void); /* r5 = battle object pointer; no return */
details: 'Caller passes the battle object pointer in r5 (preserved across the call along with r4/r6/r7). Calls sub_812B318
  with r0 = 3 as a guard; if that helper returns nonzero the function bails out without touching the object. On
  success it writes 3 into the object''s state byte at offset +0x1D, reads the byte at +0xE and passes it through
  sub_81325E4 (likely a stat/derived-value recompute, since the result is stored into the +2 field), then zeroes
  the counter/value at offset +3. Pure scratch: r0–r3 and lr are clobbered; nz/c/v flags clobbered by the tst. Behavior
  is consistent with a "transition an object into battle state 3" routine used while a global guard (sub_812B318)
  is satisfied.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
