name: sub_80E199A
address: '0x080E199A'
kind: function
status: confirmed
summary: Converts an attack-bait slot index to a byte offset (3 bytes per entry) in the bait table.
interface: u32 sub_80E199A(u32 slot /* r0 */) -> u32 offset /* r0 */; clobbers r1; sets NZ from result
details: 'The slot index is masked with 0x87FF (the only stored constant in the function). The masked value is

  LSL #17; the bit shifted out into C is bit 15 of the source. Based on that bit (BCC test), the shifted

  value is either LSR #16 (when bit 15 set) or LSR #17 (when clear), then multiplied by 3 via MUL r0,r1

  with r1=3. Net effect: for slots < 0x8000 the offset is slot*3, and for slots >= 0x8000 (after the mask

  meaning the upper bit is still 0 since mask is 0x87FF) the offset is (slot << 1) * 3, effectively

  doubling the stride for high half — consistent with a two-row bait table layout. Located right after

  off_80E19B0 (pointer to off_802CD5C) and off_80E19B4 (pointer to byte_203C960), the surrounding bait

  table metadata. MUL clobbers NZ from the low 32 bits of the product and does not touch C from the

  preceding LSR.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
