interface: void sub_800A0C6(void)
details: 'Stores 0 to four consecutive words in IWRAM at 0x2036820, 0x2036824, 0x2036828 and 0x203682C, i.e. it
  clears a single 16-byte record (two 8-byte pairs) in one go. No other memory, hardware registers or flags are
  touched besides the NZCV flags set incidentally by the mov/str writes. The record is not a pointer-chasing structure
  - it is a flat array of four dwords, most plausibly counters, timers or accumulated values belonging to some battle
  or gameplay subsystem whose owner is not identifiable from this function alone.

  '
