name: chatbox_startCurNaviScript_80419B4
address: '0x080419B4'
kind: function
status: confirmed
summary: Looks up the chatbox script assigned to the currently equipped PET navi in a table entry and starts it,
  or skips the entry if the navi has no script.
interface: Next chatbox_startCurNaviScript(void* tableEntry /*r4*/); // caller context in r2/r5/r10; always returns
  r0 = 1
details: 'Calls GetCurPETNavi() to get the currently equipped navi number, then reads the byte at tableEntry[navi
  + 2] — a per-navi script ID array inside a 0xE-byte table entry (one script slot per navi, at offset navi+2).
  If the slot is 0xFF there is no script for this navi: the entry pointer r4 is advanced by 0xE (to the next table
  entry) and nothing is opened. Otherwise the script ID is passed to chatbox_config_80408D0(), which loads/starts
  that chatbox script (its first argument is ignored, so the navi number still sitting in r0 is effectively discarded).
  Always returns 1 in r0. The 0xE-byte stride and the 0xFF sentinel suggest this runs while walking a table of dialog
  entries, where each entry can react differently per equipped navi (e.g. navi-specific NPC reactions).

  '
