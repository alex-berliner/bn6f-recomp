name: battle_initSpriteProjection
address: '0x080027E4'
kind: function
status: probable
summary: Initializes the sprite/camera projection settings struct at byte_20098A8 by writing 8 to byte
  +0, 4 to byte +1 (camera projection), and 0xFFFF to halfword +2.
interface: () -> void; writes globals at byte_20098A8, no flags meaningful
details: Stores 4 into byte_20098A8+1, which per symdb selects the camera projection (0 isometric, 4 side
  view), sets byte_20098A8+0 to 8 (unknown, likely a scale/zoom or sprite-layout parameter), and writes
  0xFFFF to the halfword at +2, which looks like a sentinel/reset value. It takes no arguments and is
  called three times from initBattleStructsAndVram_80071D4, so it acts as a fixed initializer of the projection
  settings struct during battle setup. The other two field meanings are inferred, not documented.
