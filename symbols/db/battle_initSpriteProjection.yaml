    lines 3-4); halfword at +2 set to 0xFF (0xFFFF) suggests clearing/sentinel value (ldr byte_8002810;
    strh); no args, no return value; single fixed write pattern to one struct (mov/strb sequence); called
    3x from initBattleStructsAndVram_80071D4, fitting a fixed battle-setup initializer
