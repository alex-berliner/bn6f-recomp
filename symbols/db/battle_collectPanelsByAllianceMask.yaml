name: battle_collectPanelsByAllianceMask
address: '0x080BAE3C'
kind: function
status: probable
summary: Fills the battle object's panel list with all field panels whose attributes match an alliance-specific
  bitmask, returning how many were found.
interface: (r5 = battle object; no other inputs) -> r0 = entry count; list written to [r5+0x64]
details: 'Reads the object''s alliance byte, doubles it as a table index, and picks a required-attribute
  mask from off_80BAE58: 0x4000000 for alliance 0, 0x8000000 for alliance 1. It passes forbidden mask
  0 in r3 and, unusually, hands the callee the output list pointer in r7 (r5+0x64, set before the bl and
  never used afterwards, so it must be consumed by the callee). object_getPanelsExceptCurrentFiltered
  then scans the field, skips the object''s own panel, and appends matching panels to that list, returning
  the count. The masks 0x4000000/0x8000000 are per-side high attribute bits whose game meaning is not
  shown here. The wrapper is only ever seen called from sub_80BACBC, which must have set r5 to the acting
  object.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'off_80BAE58 holds two masks {0x4000000, 0x8000000} indexed by ldr r2,[r1,r0] after lsl r0,#2
    on the alliance byte; mov r3,#0 gives the callee a zero forbidden-attribute mask; mov r7,#0x64; add
    r7,r7,r5 builds object+0x64 immediately before the only bl, so it is the callee''s output list pointer;
    callee summary: collects panels matching required/forbidden attribute masks (excluding own panel)
    into a caller list and returns the count'
  refs:
  - bn6f/asm/asm31.s:6158
  - 0x080BACBC sub_80BACBC
  - 0x0800CE64 object_getPanelsExceptCurrentFiltered
  reproduce: python3 tools/asmcat.py 0x080BAE3C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-022109'
open_questions:
- what panel-attribute bits 0x4000000 and 0x8000000 mean in game terms (which chip/effect selects them)
- why the list pointer is passed in r7 rather than an argument register — confirm object_getPanelsExceptCurrentFiltered's
  exact calling convention
- what sub_80BACBC does with the collected panel list and count
