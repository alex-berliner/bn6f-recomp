name: battle_findPanelRowOppositeSide
address: '0x080F9980'
kind: function
status: probable
summary: 'Thin battle-AI wrapper: asks object_getClosestPanelMatchingRowFiltered whether a panel matching
  a filter byte exists on the opposite side of the arena, returning the row index or 0.'
interface: (r0 = struct whose +0x13 byte is the filter/match value; r5 = battle object whose alliance
  byte selects the side) -> r0 = matching row index, or 0 if none; flags clobbered by callee
details: 'The routine loads r1 from [r0,#0x13] (a filter byte consumed by the callee''s matching check)
  and reloads r0 with the alliance/side byte at oBattleObject_Alliance of the object in r5, then tail-calls
  object_getClosestPanelMatchingRowFiltered. The callee scans rows on the side opposite the given side,
  up to six panels behind, and returns the first row whose panel passes the filter and validity checks.
  Back in the wrapper, tst r0,r0 / bne passes a nonzero row straight through; the ''mov r0,#0'' on the
  zero path is redundant since r0 is already 0. So the whole function is just a parameter-marshalling
  wrapper: side comes from the r5 object, the match criterion from the r0 struct. Given it runs under
  the battlesweep route, it is most plausibly an enemy-AI/battle-script condition or targeting helper.'
