name: object_unlinkExtraListAndFree
address: '0x080CEA88'
kind: function
status: probable
summary: Unlinks the battle object from the front of a linked list rooted in oBattleObject_ExtraVars+4
  if it is the head node, then frees its collision data and object slot.
interface: (r0 = battle object pointer, also kept in r5) -> r0 = destroyed; frees collision slot and object
  slot
details: Loads a list-head pointer from oBattleObject_ExtraVars+4 of the object; if the object itself
  is the first node ([head] == object), it writes NULL to that head, unlinking it from the front of the
  list. It then calls object_freeCollisionData to release the object's collision slot and clear its bit
  in the active-collision bitfield, and object_freeMemory to release the object slot entirely (flags,
  bitmap, list unlink, sprite scaling reset). The ExtraVars list is presumably something like afterimages/trail
  nodes owned by the object that must not dangle after free. No known callers, so the exact meaning of
  the ExtraVars+4 list is unconfirmed.
