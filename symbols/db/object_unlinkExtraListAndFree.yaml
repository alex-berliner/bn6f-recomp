  date: '2026-10-19'
  detail: ldr r7,[r5,#oBattleObject_ExtraVars+4]; cmp r5,r6 / str 0,[r7] — removes object from front of
    a list rooted in its ExtraVars field; bl object_freeCollisionData — releases the object's collision
    slot like other teardown paths; bl object_freeMemory — final release of the battle object slot, confirming
    destructor role
  refs:
