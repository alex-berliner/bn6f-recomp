name: rfu_clearConnFlag
address: '0x0813D760'
kind: function
status: probable
summary: Clears the flag byte at offset 0x5 of the RFU link-state struct eS200BC50, resetting it after
  the wireless slots are torn down.
interface: () -> void; writes byte_200BC55 = 0
details: The function takes no arguments and only does `mov r1,#0; strb r1,[eS200BC50,#0x5]`, zeroing
  byte_200BC55 in the RFU state struct. Its sole caller (sub_8146F90) invokes it immediately after rfu_clearAllSlot
  in one branch of a state machine, then jumps to the default case; other branches of the same machine
  instead call rfu_updateConnState and store a state value into halfword at struct+0x8. So byte_200BC55
  is a per-connection flag in the same struct the caller manages, and this routine is the 'clear that
  flag' step of the disconnect/cleanup path.
