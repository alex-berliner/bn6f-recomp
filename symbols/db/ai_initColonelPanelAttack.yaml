- method: assembly-reading
  date: '2026-10-18'
  detail: strb r0,[r7,#oAIAttackVars_AiDifficultyTier] after battle_getAiDifficultyTier_800FE36 call seeds
    the AI state; ldr r0,off_8101850 (=sub_8103936+1); str r0,[r7,#oAIAttackVars_PanelChooseCallback]
    installs a panel-selection callback; ldrb r0,[r5,#oBattleObject_Alliance]; eor r0,#1; bl battle_findPlayer
    picks the opposing-side object as TargetObjectPtr; mov r0,#0xd; bl object_setAttack0 starts attack
