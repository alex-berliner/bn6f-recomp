name: ai_initColonelPanelAttack
address: '0x081016FE'
kind: function
status: probable
summary: 'Initializes one of Colonel AI''s attack routines: sets up difficulty-tier state, picks the opposing
  battler as target, installs a panel-choose callback, and starts attack id 0xD.'
interface: (r0 = battle object, r5 = same object, r7 = oAIAttackVars block) -> r0 = undefined; fields
  in oAIAttackVars and object attack id written
details: 'Stores the enemy''s AI difficulty tier (via battle_getAiDifficultyTier_800FE36) into oAIAttackVars_AiDifficultyTier
  and clears the init flag, then calls sub_810176E with 4 and fills AttackBoost2/TimerOrCycles (sub_810154C)
  and AttackDuration (sub_8101570) with rolled parameters. It sets a scratch pointer to object+0x60 and
  installs sub_8103936+1 as oAIAttackVars_PanelChooseCallback, so a later step will pick target panels.
  It resolves the target as the battler on the opposite alliance (Alliance eor 1 passed to battle_findPlayer)
  into TargetObjectPtr, then starts the attack via object_setAttack0 with id 0xD. Quirk: this is one of
  the two one-or-two RNG branches in the caller sub_81013AA, so the caller decides between this and a
  sibling attack init.'
