summary: Spawns submenu eStruct records by walking the static table at byte_812DA94, called as part of
  submenu/e-link state transitions.
interface: () -> void
details: Thin wrapper that loads the address of the static record table byte_812DA94 and calls battle_spawnEStructRecordsFromTable_80465A0
  with it. The callee walks that table (FF-terminated, 4-byte triples) and creates one 0x58-byte type-9
  entry in eStructArr2008450 per row via sub_8046670. All three callers invoke it during submenu/e-link
  transitions, immediately after submenu_initEntryTable and before CopyBackgroundTiles812EAAC. No arguments
  are taken from callers, so any per-call variation must come from byte_812DA94's contents or prior state.
