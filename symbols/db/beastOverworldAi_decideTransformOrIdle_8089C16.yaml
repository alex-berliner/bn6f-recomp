name: beastOverworldAi_decideTransformOrIdle_8089C16
address: '0x08089C16'
kind: function
status: confirmed
summary: Decides whether the player enters the beast-overworld transformation, plays a hurt/KO reaction animation,
  or returns to idle after taking overworld damage.
interface: beastOverworldAi_decideTransformOrIdle_8089C16(u32 player_obj /* r5 */, u32 ai_context /* r10, unused
  */) -> u32 handled /* r0, always 1 */; flags clobbers nz cv
details: 'Gate byte at player_obj+0x13: if non-zero the reaction was already dispatched and the function returns
  immediately. Otherwise writes 1 to player_obj+0x08 as an in-progress mark. Fetches the current PET-Navi via GetCurPETNavi
  and its HP via GetMaxAndCurHPForCurPETNavi. If HP==0 the navi is KO: clears the mark, selects animation 0x3A (only
  when navi index is 0, likely the Protoman/GutsMan default slot), sets AI field+0x18 to 0x1E, and writes state
  0x84 into player_obj byte 0. If HP>0 the player is hurt: plays the facing-direction animation, sets AI field+0x18
  to 0x1E, then consults battleScenarioEffect_isActive and e_scenarioEffectStateCountersAnySet. When no scenario
  effect is active, or when scenario counters are set, the function resets AI field+0x18 to 0 and writes idle state
  0x1C; only when a scenario effect IS active and no counters block it does it write beast-transform state 0x7C.
  Always returns r0=1 so the caller AI loop knows the reaction was handled.'
