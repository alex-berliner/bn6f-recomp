name: battle_initializeLifeObject
address: '0x080E817C'
kind: function
status: probable
summary: Initializes a Life battle object on its first update and advances its short-lived spawn behavior
  when Param2 is zero.
interface: (r0 = ..., r1 = ...) -> r0 = ...; flags ...
details: The function operates on an implicit battle-object pointer in r5. On the first call, it gathers
  panel coordinates, element, damage/stamina-counter-disable data, a Z16 save value, a pointer at RelatedObject1Ptr,
  and a value at object offset 9, then passes them to sub_80BE3E8; afterward it marks PhaseInitialized
  to 4. On every call, it checks Param2, and when it is zero sets CurAction to 0xC and clears CurPhaseAndPhaseInitialized.
  The exact meaning of the forwarded arguments and object fields is not present in the available symbol
  information.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: The implicit r5 object is read through oBattleObject_PhaseInitialized, PanelX, PanelY, Element,
    Z16Save, and RelatedObject1Ptr before the first initialization call.; Initialization is guarded by
    oBattleObject_PhaseInitialized and writes the value 4, indicating a one-time setup path.; The function
    calls sub_80BE3E8 with panel position, element, counter-derived data, Z16 save data, and related-object
    fields.; When oBattleObject_PanelX/Param2 is zero, the function writes oBattleObject_CurAction = 0xC
    and clears oBattleObject_CurPhaseAndPhaseInitialized.; No callers are known, so the role of the function
    in the broader game flow cannot be confirmed.
