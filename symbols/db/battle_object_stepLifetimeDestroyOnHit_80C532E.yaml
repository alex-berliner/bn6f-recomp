name: battle_object_stepLifetimeDestroyOnHit_80C532E
address: '0x080C532E'
kind: function
status: confirmed
summary: Per-frame step for a battle object that owns collision data - decrements its lifetime, destroys it (with
  hit effect) on collision or timer expiry.
interface: battle_object_stepLifetimeDestroyOnHit_80C532E(oBattleObject *obj /* r5 */) -> destroys obj via object_freeMemory
  when it expires or collides; r4/r6 preserved, r7 = obj->oBattleObject_CollisionDataPtr, r0-r3/r8/lr and nzcv clobbered
  by helpers
details: 'Tear-down/step handler for a battle object (r5) during battle. First removes the object''s collision data
  (object_removeCollisionData) and spawns its "hit" effect (object_spawnCollisionEffect). Then reads the object''s
  collision data pointer (oBattleObject_CollisionDataPtr) and the collision result flags (oCollisionData_FlagsFromCollision).
  If the object keeps a result record (oBattleObject_ExtraVars+0x10 non-null), the hit flags masked with 0x0C000000
  (bits 26-27) are stored there, so only that flag range is reported to the owner. Destruction happens on two triggers:
  (1) any non-zero collision flags, or (2) the 16-bit lifetime timer (oBattleObject_Timer) reaching 0 after being
  decremented. Otherwise, while the timer is still positive, object_presentCollisionData re-presents the now-empty
  collision data and the object survives one more frame. On destruction: object_clearCollisionRegion, object_freeCollisionData
  on the object''s collision data block, then object_freeMemory on the object itself. Quirk: r7 retains the collision
  data pointer on exit; the timer decrement wraps into a signed comparison (ble), so a wrapped timer is treated
  as expired.

  '
