name: submenuDrawHpGauges
address: '0x0801E4F4'
kind: function
status: probable
summary: Helper that copies up to four 2-wide vertical HP/meter tile bars (heights from a 0xFF-terminated
  u16 table at r5+0x28) into background tile block 3, then sets bit 0x2000 in eStruct2035280+0x44 via
  flagSetBits_eStruct2035280.
interface: (r0-r3 ignored; r5 = pointer to struct whose +0x28 holds a 0xFF-terminated halfword table of
  bar heights) -> r0 = updated flag word from flagSetBits; sets bit 0x2000 in eStruct2035280+0x44
details: 'Reads successive halfwords at r5+0x28 (r4 stepping 0,2,4,6); 0xFF ends the routine, 0 skips
  an entry. Each value is a bar height: the tile-fill count is clamped to 9 and the geometry byte to 8.
  A run of tile IDs is built on the stack from base 0xD1D6: bottom cap tiles 0xD1D6/0xD1D7, fill tiles
  0xD1D8/0xD1D9 (two columns of a 2-wide bar); for a full-height bar (>=9) the caps are omitted and the
  buffer is just 9x 0xD1D8 then 9x 0xD1D9. CopyBackgroundTiles is called with j = 0x1D - min(byte,8) (top
  row, bottom row 29), i = 0/2/4/6 (column), tile block 3, tile_ids = the stack buffer, and j_size = min(byte,8)+1
  pushed as the 5th argument (only one word is pushed, so the callee''s i_size is presumably fixed at
  2). Finally flagSetBits_eStruct2035280 sets bit 0x2000 (1<<13) in eStruct2035280+0x44. The caller-supplied
  r5 struct and the meaning of the flag bit are unknown since no caller was captured.'
