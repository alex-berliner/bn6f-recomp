name: ai_checkFrontPanelSide
address: '0x08111F70'
kind: function
status: confirmed
summary: Checks whether the panel directly in front of a battle object lies on the object's own side of the field,
  returning 0 if it does and 1 if it is on the enemy half.
interface: 'int ai_checkFrontPanelSide(battleObject* obj /* r5 */) -> r0: 0 = own side, 1 = other side; r1: panel
  parameters & 0x20; flags = CMP(side_bit, own_bit) from the comparison'
details: Looks up the direction the object faces via object_getFrontDirection (object in r5), adds it to the object's
  oBattleObject_PanelX, and fetches the panel parameters for that front panel with object_getPanelParameters(panelX+dir,
  panelY). The panel's half of the field is encoded in bit 0x20 of its panel parameters (0x20 = back/blue half,
  0x00 = front/red half). The object's own side comes from oBattleObject_Alliance, which encodes the same information
  as alliance*0x20 (alliance 0 = red/front, 1 = blue/back). If the two side bits match the function returns 0 (the
  panel in front is on the object's own side), otherwise 1 (it faces the enemy half). On the equal path the return
  value 0 is produced by MOVS r0,#0, and on both paths the caller sees the flags of the CMP side_bit, own_bit, plus
  r1 holding the masked panel attribute. r5 (the object pointer) is the sole caller input besides lr; r2/r3 and
  the nzcv flags are clobbered.
