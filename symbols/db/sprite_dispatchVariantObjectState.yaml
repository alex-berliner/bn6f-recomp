name: sprite_dispatchVariantObjectState
address: '0x08117404'
kind: function
status: probable
summary: Runs a variant-object's per-state handler, dispatching on the object's state byte to its init,
  update, or teardown routine.
interface: (r5 = object struct, r1 = [r5,#8] state index used internally) -> r0 = handler's return; calls
  handler as Thumb via mov lr,pc / bx
details: 'Reads the byte at [r5,#8] of the object struct in r5 and uses it as an index into the three-entry
  table off_8117418, then long-calls the selected Thumb handler with no other arguments set up. Entry
  0 is sprite_initVariantObject, entry 1 is sprite_updateVariantObject, entry 2 is the unknown sub_81174B8
  (likely a delete/cleanup step, given the init/update/deinit pattern). This is a classic BN6 object state-machine
  dispatcher: state 0 = first-time init, state 1 = normal update, state 2 = another lifecycle phase. r5
  is left as-is, so the callee presumably also receives the object pointer in r5. State byte is not validated,
  so an out-of-range value would jump to garbage.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r1,[r5,#8] / ldr r0,[off_8117414 table,r1]: state byte selects the handler — asm lines
