- method: assembly-reading
  date: '2026-10-19'
  detail: mov r0,#0x80; bl chatbox_mask_eFlags2009F38; bne locret — step skipped entirely when flag bit
    0x80 is set; ldr r0,[r5,#0x5c]; cmp r0,0xFFFF; beq skip — one-shot guard on the script trigger; mov
    r0,#0xc; bl chatbox_runScript_803FD9C_on_eTextScript2028A20 — runs text script index 12; mov r0,#0xc;
    str r0,[r5,#0x68] — writes state 12 to the event struct's next-state field; callees are both chatbox-subsystem
    (flag word eFlags2009F38 and script archive eTextScript2028A20)
