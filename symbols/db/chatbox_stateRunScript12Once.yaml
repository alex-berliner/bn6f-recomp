name: chatbox_stateRunScript12Once
address: '0x081336A0'
kind: function
status: probable
summary: 'Cutscene/event step: if event flag bit 0x80 is clear, run text script 12 (once, guarded by a
  0xFFFF sentinel) and advance the event state to 12.'
interface: () -> void; reads global event struct in r5, branches on chatbox flag-mask result
details: First masks event flag word eFlags2009F38 with 0x80; if that bit is set the function returns
  immediately without doing anything. Otherwise it loads field +0x5C of the r5 event/task struct and compares
  it to 0xFFFF; if the field is not the sentinel it runs text script index 0xC from eTextScript2028A20
  via the chatbox script runner. Finally it stores 12 into field +0x68, which is presumably the next state/step
  of the same event struct. The 0xFFFF check suggests +0x5C marks whether the script for this step has
  already been queued, making the script trigger one-shot. The flag bit 0x80 acts as an abort/skip condition
  for this whole step.
