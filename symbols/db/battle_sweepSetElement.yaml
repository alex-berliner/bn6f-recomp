- The summary misreads the store widths and the trigger. The code stores 0xA as a halfword to oAIAttackVars_StepTimer
  (strh), not as a '10 step' byte, and writes 0x10 as a halfword to oAIAttackVars_HitElement, not a byte.
  Also, the transition fires when StepTimer decrements to 0 or below (bgt branch), so the 'when it reaches
  0' phrasing is slightly misleading. The overall behavior (arm element 4, 10-tick delay, then write 0x10
