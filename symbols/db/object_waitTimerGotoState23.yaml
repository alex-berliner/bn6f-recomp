name: object_waitTimerGotoState23
address: '0x0811D2C8'
kind: function
status: probable
summary: Object state handler that counts down a delay timer and switches the object to state 0x23 when
  it expires
interface: (r5 = object struct) -> void; decrements timer at r5+0xC, writes state 0x23 to r5+0 when it
  hits zero
details: Reads the halfword timer at r5+0xC; if nonzero it decrements and stores it back, otherwise it
  stores 0x23 into the byte-sized state/state-machine field at offset 0 of the object struct. In both
  branches it calls sprite_update to advance the object's sprite animation. It is a per-frame 'wait N
  frames, then go to next state' step, typical of object state machines. The next state's handler (state
  0x23) and which object uses this are not visible here.
