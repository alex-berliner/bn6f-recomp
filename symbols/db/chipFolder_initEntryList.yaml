name: chipFolder_initEntryList
address: '0x08123D24'
kind: function
status: probable
summary: Fills the entry list for the chip folder screen, creating one list entry per count byte in the
  screen state and flagging the currently selected one.
interface: (r5 = state struct whose +0xC holds the selected/current entry index; count read from [S2001c04+5])
  -> fills entries in the 0x58-byte array at 0x02008450; r0 result not used
details: 'Reads an entry count from byte 5 of the toolkit''s S2001c04 structure and loops that many times.
  For each index i it builds a flags word: bit 16 always set, bit 0 set only when i equals the byte at
  [r5+0xC] (the currently highlighted entry). It calls battle_initEmotionTableEntry_8046670 with r0=0x15
  (entry type), r1=7+i (entry id/parameter) and that flags word, so each slot gets type 0x15, the fixed
  0x09 tag, and the flags. Note the input arrives in r5, a callee-saved register set up by the caller
  rather than r0 — a quirk of the call convention here. The shared 0x02008450 array is evidently reused
  as a generic list-entry table, not just emotion data.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: loop bound is ldrb r4,[S2001c04_ptr+5] (entry count), iterated r6=0..r4-1; ldrb r0,[r5,#0xc];
    cmp r0,r6 sets flags bit 0 — marks the selected/current entry; flags word always ORs 0x10000 (bit
    16) before the callee call; bl battle_initEmotionTableEntry_8046670 with r0=0x15, r1=7+r6, r2=flags;
    both callers (chipFolder_init_812349C, chipFolder_screenInit_812345C) are chip-folder screen initialization
    routines
