    str r5, [r0,#oBattleObject_RelatedObject1Ptr] uses caller''s r5 as object base and parent link; ldrh
    r1,[r5,#oBattleObject_AllianceAndDirectionFlip]; strh back copies alliance/flip from the parent object;
    str r6/[Damage...] and str r7,[ChipID] show r6/r7 must already hold those values in the caller'
