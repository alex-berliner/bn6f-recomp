name: battle_spawnType4Init
address: '0x080E7FBA'
kind: function
status: probable
summary: Helper that spawns a type-4 battle object with kind 0x69 and copies panel position, element,
  parent link, alliance/flip, damage-counter word, and chip ID from caller-supplied registers into the
  new object.
interface: (r0 = PanelX, r1 = PanelY, r2 = Element; uses caller's r5 = parent/related object ptr, r6 =
  damage word, r7 = chip ID) -> r0 = spawned object ptr; no meaningful flags
details: Saves r0-r2 plus r5, calls object_spawnType4 with kind 0x69, then restores the saved args shifted
  into r1-r3 and writes them to oBattleObject_PanelX/PanelY/Element of the returned object. The object
  pointer returned in r0 is moved aside so r0 = caller's r5, which is used both as the store base and
  as the value for oBattleObject_RelatedObject1Ptr. oBattleObject_AllianceAndDirectionFlip is read from
  the parent object and copied, while oBattleObject_DamageAndStaminaDamageCounterDisabler and oBattleObject_ChipID
  come straight from caller's r6/r7 (not saved, so this is a compiler factored-out spawn+init helper relying
  on the caller's register state). If the spawn returned null the stores are skipped via the shared pop.
evidence:
