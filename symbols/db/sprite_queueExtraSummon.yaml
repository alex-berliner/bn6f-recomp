name: sprite_queueExtraSummon
address: '0x0813809C'
kind: function
status: probable
summary: If object flag 0x24 is set, queues an extra summon OAM entry (var 0xd) via sub_81380B0
interface: (uses r5 = object; r0..r3 = 0x80,0x18,0,0xd -> jumps to sub_81380B0)
details: Reads a 16-bit flag at object+0x24. If zero, returns immediately. If non-zero, primes the standard
  OAM sub_queue arguments (r0=0x80, r1=0x18, r2=0, r3=0xd — a larger/deeper sprite than the default r3=0xc
  in the caller) and tail-calls sub_81380B0 to queue the tile. The caller then queues the normal summon
  sprite and animates both via battleObject_animateStepQueueOam, so this represents a paired 'extra' summon
  sprite shown only when bit 0x24 says so.
