- method: assembly-reading
  date: '2026-10-21'
  detail: 'sub_813809C+0x04: ldrh r0,[r5,#0x24]; tst r0,r0; beq -> gate on flag at object+0x24; sub_813809C+0x0A:
    mov r0,#0x80; mov r1,#0x18; mov r2,#0; mov r3,#0xd -> alternate summon args; sub_813809C+0x12: b loc_81380C8
    -> tail-calls sub_81380B0 to queue the OAM; 0x081380E0 calls sub_813809C then sub_81380B0 with (4,0x20,0x20,0xc)
    then battleObject_animateStepQueueOam — paired summon queueing pattern; sub_81380B0 is the shared
    OAM-queue helper used in both branches'
