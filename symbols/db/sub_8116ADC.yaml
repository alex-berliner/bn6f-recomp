name: sub_8116ADC
address: '0x08116ADC'
kind: function
status: confirmed
summary: Dispatches the ePET menu update routine by a variant byte stored at offset 8 of the battle object, setting
  r7 to the global menu-data pointer before calling through a 3-entry jump table.
interface: void epetMenuVariantDispatch(u32 r5 /* battle_obj */); // outputs r2,r3,r5,r10,r11; clobbers r0,r1,r4,r6,r8,r9,r12,nzcv,lr;
  preserves r7
details: 'Loads the global ePETMenuData pointer into r7 (a callee convention for this subsystem). Reads a single-byte
  variant index from [r5 + 8]. Uses that index to select a function pointer from the 3-entry jump table at 0x08116AF0:
  entry 0 → sub_8116B00, entry 1 → sprite_dispatchVariantUpdate_8116B9C, entry 2 → sub_8116C38. Dispatches via computed
  branch (mov lr, pc; bx r0). No return-value handling; the dispatched routine''s side effects on the battle object
  and r2/r3/r10/r11 are what callers observe.'
