name: object_spawnCollisionEffect
address: '0x0801A0D4'
kind: function
previous_names: []
status: probable
summary: Spawns the hit-effect object for the battle object in r5's last collision at its own coordinates, jittered
  by up to 8 pixels in X and Z (1 primary GetRNG), unless the collision flags or a HitEffect of 0xFF rule it out.
interface: (r5 = BattleObject *) -> when it spawns, r0 = the new effect object or 0 (object_spawnRelatedChildEffect_80E08C4,
  Z set on 0); when it returns early, r0 = the caller's r0 or 0xFF; r4 and r6 preserved; clobbers r1-r3, lr and
  the flags.
details: 'Body (asm00_2.s:22498-22520): r3 = obj->CollisionDataPtr, r6 = its FlagsFromCollision (+0x70). It returns
  at once

  when no bit of 0x3F800000 is set, when bit 0 is set, or when the HitEffect byte (+0x9) is 0xFF. Otherwise r4 =

  HitEffect, r1-r3 = the object''s Coords (X, Y, Z, 16.16 fixed point, +0x34/+0x38/+0x3C), and

  AddRandomVarianceToTwoCoords(0xF) draws one GetRNG and adds ((r & 0xF) - 7) << 16 to X (r1) and

  (((r >> 16) & 0xF) - 7) << 16 to Z (r3), Y unchanged. object_spawnRelatedChildEffect_80E08C4 then spawns a type-4

  battle object (object_spawnType4 with r0 = 4, r1-r3 the position, r4 the HitEffect), links it to this object

  (RelatedObject1Ptr) and gives it this object''s Alliance.


  battleObject_spawnHitEffectAtPanel_801A100, right after it, is the same code except for the position: the centre

  of the panel the object stands on (convertXYToPanelXY_800E258, object_getCoordinatesForPanels, Z = 0x10 << 16)

  instead of the object''s own coordinates.


  Called from 119 places, all `bl object_spawnCollisionEffect` in asm31.s (battle object handlers, with r5 the

  object). vidsync (docs/vidsync/RANDOM_EVENTS.md) counts it among the hit-spark sources that advance the primary
  RNG

  by one; that is read from the code, vidsync has no runtime finding for it.

  '
