name: sub_80FE05C
address: '0x080FE05C'
kind: function
status: hypothesis
summary: Looks up two versioned 8-byte tables by row index and packs their 16-bit halves into a single return value
  (low half from the stats table byte_80FE090, high half from the constants table byte_80FE0B4).
interface: u32 sub_80FE05C(u32 index /* r0 */); /* returns packed u32 in r0; preserves r4, r6; clobbers r1, r2,
  lr, nzcv */
details: 'Takes a row index in r0 and, twice, computes (index * 8 + tableBase) and calls battle_aiGetVersionedTableEntry_800FE12
  to fetch an 8-byte row from one of three versioned bases. The first lookup uses the table at byte_80FE090 (three
  variants at byte_80FE090/byte_80FE098/byte_80FE0A0 — entries like 0x14, 0x1E, 0x0A) and the second uses the table
  at byte_80FE0B4 (three variants that are all 0x0A). The result of the first call is preserved in r6 across the
  second call, then packed as (secondResult << 16) | firstResult and returned in r0. Because the second table is
  constant 0x0A in every variant, the upper 16 bits of the returned value are effectively always a versioned 0x000A,
  while the lower 16 bits carry the versioned stat/cooldown entry from the first table. Clobbers r1, r2, lr, nzcv;
  preserves r4 (input index) and r6 (first lookup result). The nearby data off_80FE0CC/battle_pickAdjacentPanel_80FE4D0
  and dword_80FE0D0 (=0xA000) are not referenced by this function and likely belong to an adjacent routine.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
