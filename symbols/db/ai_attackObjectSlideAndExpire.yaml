  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The proposal captures the gist: init on first entry (element 4, anim 0xF, sub_80F7500, XVelocity
    from byte_80F685C scaled by difficulty, step timer from dword_80F6870 indexed by Alliance), advance
    X by XVelocity each tick, call sub_80F716E and either re-panel/region-update or set HitElement=0xC
    via sub_80F7520, and on StepTimer underflow call sub_80F7514 then deactivate. Minor corrections: byte_80F685C
    is a byte table loaded as a word (ldr [r2,r1]), sub_80F716E returning nonzero causes the panel/region
    update branch while zero causes HitElement=0xC (proposal inverted). dword_80F6870 is a single-word
    table with one entry (0x7) indexed by Alliance, not a multi-entry byte table; sub_80F70E0 splits into
    r0/r1 (XVelocity, StepTimer). Also the object_clearFlag 0x40 happens after deactivation (order slightly
    off). The proposed name ''ai_attackObjectAdvanceAcrossField'' is reasonable but a clearer name emphasizing
    the timed slide and deactivation would fit better.; run wf investigate investigate-20261018-223614;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
