name: ai_attackObjectSlideAndExpire
address: '0x080F67B6'
kind: function
status: probable
summary: AI attack handler that on first entry initializes element/animation and picks a difficulty-scaled
  X velocity and step count, then each tick slides the object by its X velocity, re-panels/regions it
  (or stamps HitElement=0xC) until the step timer expires, at which point it runs sub_80F7514, deactivates
  the battle object, clears flag 0x40, sets CURRENTLY_MOVING bit 1, clears bit 0x16, and exits the attack
  state.
interface: (r5 = battle object, r7 = AIAttackVars for the current attack; r0 ignored) -> void
details: On first entry (AttackElement == 0) it latches element 4, plays animation 0xF, fetches a frame-count
  (byte table indexed by Alliance) into StepTimer, and picks an XVelocity from word table byte_80F685C
  indexed by AiDifficultyTier*4 (values ~0x25000–0x40000, faster at higher difficulty). Each tick it adds
  XVelocity to X, then calls sub_80F716E; while it returns 0 the object keeps moving (and sets HitElement
  = 0xC via sub_80F7520). When the movement check passes, it uses the Alliance-indexed byte_80F6878 table
  tested against CollisionData_FlagsFromCollision to clear its collision region when touching the opposing
  side's panels, then re-updates panels/region after moving (setting region 1 if PanelX changed). When
  StepTimer reaches 0 it calls sub_80F7514 with the ScratchVar, battle_deactivateObject, clears flag 0x40
  and bit 22, sets ObjectFlags1 'currently moving' bit 1, and exits the attack state — i.e. the attack
  object lives for a fixed number of steps then despawns.
