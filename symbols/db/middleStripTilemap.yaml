  three-strip set used to redraw scene background strips (table of u16)'
details: EWRAM, 32 bytes (an 8x2 u16 tilemap). It is the second of three adjacent tilemap strips — alongside
  firstStripTilemap at unk_201EC8C (column 0x15, VRAM 0x306220) and thirdStripTilemap at unk_201ECCC (column
  0x17, VRAM 0x306240). background_updateSceneStrips_812475C populates all three via CopyBackgroundTiles
  to tile block 2 when EVENT_1709 is set, else clears them. submenu_subchip_init_8123F7C fills this strip
  (writing 0x306230) via gfx_fillTilemapConsecutiveBanded with width=8, band=1, as part of a three-band
  tilemap clear for the subchip submenu background.
