name: snakearm_initObject
address: '0x080E1540'
kind: function
status: confirmed
summary: One-time initialiser for a SnakeArm battle object — loads its sprite, marks it sprite-initialised, switches
  it to the UPDATE state handler and runs one state-machine tick.
interface: (r5 = battle object, r6/r7 = state-machine tick args, r10 = context) -> r5 = battle object; r4 preserved;
  flags clobbered
details: 'Runs once when a SnakeArm (the snake-like attack object) spawns in battle.

  Calls sprite_load with graphics id 0x80, palette/animation params 0xC and 9

  for the object in r5, then sprite_loadAnimationData to load the animation

  frames, then sprite_noShadow so the object casts no shadow on the battle

  floor. Sets bit 0x2 of the object header''s Flags byte

  (oObjectHeader_Flags), the "sprite resources initialised" marker. Stores

  CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized

  so the generic UPDATE handler drives the object from now on, and finally

  tail-ticks battleObject_snakeArmTick_80E1566 once with (r5, r6, r7),

  returning its r5 (the object pointer, possibly updated by the tick).

  r10 is an input/passthrough context preserved across the call (not part of

  the tick args as far as the readable C shows).

  '
