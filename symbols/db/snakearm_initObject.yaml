- method: assembly-reading
  date: '2026-10-18'
  detail: sprite_load called with constants r0=0x80, r1=0xC, r2=9 — fixed sprite/variant/animation ids
    for this object; sprite_noShadow immediately after loading matches the setup pattern for battle objects;
    str CUR_STATE_UPDATE, [r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized] switches object state
    to update; tail call to battleObject_snakeArmTick_80E1566 runs the first per-tick update right after
    init
