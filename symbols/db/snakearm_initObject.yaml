name: snakearm_initObject
address: '0x080E1540'
kind: function
status: probable
summary: 'One-time setup for the SnakeArm extra battle object: loads its sprite (resource 0x80, variant
  0xC, animation 9), hides its shadow, sets the update state, and runs the first tick.'
interface: (r0 = object pointer in r5 context, unused in prologue) -> r0 = clobbered; no meaningful return
details: The routine loads sprite entry 0x80 with arguments 0xC and 9 via sprite_load, then loads the
  animation data and disables the shadow. It ORs bit 0x2 into oObjectHeader_Flags and writes CUR_STATE_UPDATE
  into oBattleObject_CurStateActionPhaseAndPhaseInitialized, switching the object into its per-tick update
  state. Finally it calls the SnakeArm tick handler once, which per its known summary copies partner-Navi
  coordinates, toggles the pause flag, and frees the object when the battle ends or targets are gone.
  This is the spawn/init entry that transitions the object from creation to steady-state update.
