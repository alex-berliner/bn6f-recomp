- method: assembly-reading
  date: '2026-10-18'
  detail: neg r4, r0 right after bl object_getFrontDirection shows the walk runs opposite the facing direction;
    loop calls battle_countAdjacentPanelsOfOtherAlliance_800D5F0 with (r0=column, r1=alliance from oBattleObject_Alliance)
    and advances r6 only while the count is nonzero; loc_800D5E4 reloads oBattleObject_PanelX and uses
    the non-negated front direction after object_isValidPanel fails, i.e. a fallback forward sweep; r5
    is the object pointer while r0/r1 are argument/scratch, matching the project's r5-object calling quirk
