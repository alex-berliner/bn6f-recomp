name: battle_findPanelXAwayFromEnemies
address: '0x0800D5BA'
kind: function
status: probable
summary: From a battle object's current panel column, walks backward (away from its facing) to the first
  column whose neighboring panels hold no enemy-alliance objects, restarting forward from the start column
  if it falls off the grid.
interface: (r5 = battle object ptr) -> r0 = panel column (x) found; r4, r6, r7 clobbered; flags from tst
details: 'Reads oBattleObject_PanelX and oBattleObject_Alliance from the object in r5 and gets the facing
  multiplier via object_getFrontDirection, then negates it so the walk advances one column per step toward
  the object''s own back area. Each candidate column is first range-checked with object_isValidPanel (row
  fixed at 1, i.e. only the column matters), then battle_countAdjacentPanelsOfOtherAlliance(x, alliance)
  tests whether any adjacent panel holds an opposing-side object: as long as the count is nonzero the
  walk continues backward, and it returns the first column with a zero count. If the walk reaches an invalid
  column, x is reset to the original PanelX, the direction is switched to the un-negated front direction,
  and the same search runs forward toward the enemy side. The caller (battle_scanPanelsInFront_800D58C)
  belongs to the same battle-panel scan family, so this is likely shared AI/utility logic picking a safe
  panel, not an effect-specific routine.'
