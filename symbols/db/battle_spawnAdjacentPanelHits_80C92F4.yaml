name: battle_spawnAdjacentPanelHits_80C92F4
address: '0x080C92F4'
kind: function
status: confirmed
summary: Highlights up to two panels adjacent to a battle object and spawns a timed, element-carrying
  collision region on each, hitting panels next to the actor (offsets picked from a per-alliance table
  by object id).
interface: "panelHitRegions(u32 object_id /*r0*/, u32 timer /*r1*/, BattleObject* obj /*r5*/,\n      \
  \          u32 r6_in, u32 r7_in)\n-> BattleObject* r2 (last spawned region, or garbage when panels invalid),\n\
  \   r4 (= timer due to a stack-slot quirk), r5, r6, r7 preserved;\nclobbers r0-r3, lr, flags."
details: "Attack helper, likely for a melee/slam-style enemy or boss move. Indexes byte_80C93C4 with [alliance*4\
  \ + object_id] (alliance from obj->oBattleObject_Alliance) to select a 4-byte entry of two signed (dx,dy)\
  \ panel offsets in the table at byte_80C93B0. For each of the two offsets (loop runs exactly twice):\
  \ computes obj's panel position (oBattleObject_PanelX/Y) plus the offset, checks the target with object_isValidPanel;\
  \ if valid, calls object_highlightPanel (targeting cursor) and object_spawnCollisionRegion with:\n \
  \ r2/r3 = target panel x/y,\n  r4 = 0x4050201 (flag/region-type constant),\n  r5 = the battle object\
  \ pointer (owner),\n  r6 = obj->oBattleObject_DamageAndStaminaDamageCounterDisabler (damage\n      \
  \ word, damage+stamina fields packed),\n  r7 = 0x3 (collision flags/type);\nthe spawned object's oBattleObject_Element\
  \ comes from the caller's obj via the spawn call's use of r5. Stores the r1 timer value into spawned->oBattleObject_Timer\
  \ (halfword), so the region expires on a caller-supplied countdown. Invalid panels are skipped (e.g.\
  \ off-board, holes, broken panels depending on object_isValidPanel). Quirks: the stack slot at [sp,#4]\
  \ used for the timer overlaps the saved r4 in {r4,r6,r7,lr}, so on return r4 holds the timer argument,\
  \ not the caller's r4; callers must not rely on incoming r4 surviving. r2 on exit is either the last\
  \ spawned region pointer or the last checked panel's x when that panel check failed. r5 is untouched;\
  \ r6 is additionally saved around the spawn call because object_spawnCollisionRegion clobbers it."
