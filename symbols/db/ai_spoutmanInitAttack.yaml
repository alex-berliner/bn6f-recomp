name: ai_spoutmanInitAttack
address: '0x080F7830'
kind: function
status: probable
summary: 'Starts SpoutMan''s attack: records AI tier, installs a panel-choice callback, computes the attack
  duration, targets the opposing player, and switches the object into attack state 9.'
interface: (r0-r3 unused) -> r0 = destroyed; writes oAIAttackVars fields of the AI struct in r7 and sets
  attack state via object_setAttack4
details: Reads the AI difficulty tier (battle_getAiDifficultyTier) and stores it in oAIAttackVars_AiDifficultyTier,
  then installs sub_80F811A+1 as oAIAttackVars_PanelChooseCallback (likely choosing panels for the spout/attack
  placement). sub_80F7732 returns a value stored as oAIAttackVars_AttackDuration (duration/countdown).
  It looks up the player on the opposite alliance via battle_findPlayer(~alliance) into oAIAttackVars_TargetObjectPtr,
  and finally sets the object's attack state to 9 (attack phase id) with object_setAttack4. Called from
  the SpoutMan AI step only after the RNG gate passes, so it is the attack-launch path.
