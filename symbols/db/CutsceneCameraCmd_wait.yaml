name: CutsceneCameraCmd_wait
address: '0x080370B8'
kind: function
status: confirmed
summary: 'cutscene-camera command "wait": on first run, loads a halfword duration from the camera script into the
  timer; every run decrements it and, when it underflows, clears the command slot and advances the script cursor
  past the 3-byte wait instruction'
interface: void CutsceneCameraCmd_wait(u32 cmdLen /*r0=1 in*/, const u8 *scriptCursor /*in/out r1*/, struct CutsceneCameraInfo
  *camera /*r5*/, r3 preserved) -> r0=1, r1=new cursor, r2=timer; flags from cmp r2,#0 (still waiting) or adds r1,#3
  (done); clobbers r2, lr
details: "Operates on the per-camera CutsceneCameraInfo struct passed in r5.\n  - oCutsceneCameraInfo_CommandInitialized\
  \ (u8): set TRUE on first run after a fresh command dispatch, cleared FALSE when the wait expires.\n  - oCutsceneCameraInfo_Timer\
  \ (u16): countdown; first-run path writes the halfword fetched via ReadCutsceneCameraScriptHalfword(r0=1), then\
  \ every run does `timer - 1` and stores back.\nUses r1 as both input (current script position) and output (advanced\
  \ by +3, i.e. opcode + 2-byte operand, when the wait completes).\nThe \"still waiting\" branch leaves r1 untouched;\
  \ the \"done\" branch resets CommandInitialized and advances the cursor.\nAlways returns r0 = 1 (signals one cutscene-camera\
  \ command slot consumed this update).\nQuirks: \"the lifter's flag reconstruction is encoded via SET_FLAGS_CMP(a,b)\
  \ on the way out because the original leaves the flags of `mov r0,#1` (CMP 1,0: N=0 Z=0 C=1 V=0) or of `adds r1,#3`\
  \ (treated as CMP 0, -new_cursor).\"\n"
