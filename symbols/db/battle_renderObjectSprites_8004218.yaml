open_questions:
- Why r10 (Toolkit) is in the input contract but never referenced inside the function. Possibly this is
  called only from contexts that also have a valid toolkit, and the lifter over-approximated inputs.
- The exact layout of the dword_203A010 array (number of groups, what other render layers look like).
