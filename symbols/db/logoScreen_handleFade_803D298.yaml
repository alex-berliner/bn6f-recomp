name: logoScreen_handleFade_803D298
address: '0x0803D298'
kind: function
status: confirmed
summary: Logo screen step that, when no screen fade is active, sets the logo state index to 0x10 to queue
  logoScreen_finish.
interface: void sub_803D298(LogoScreenState *self /* r5 */); // uses r0,r1,r3,lr; clobbers nz,c,v; returns
  void
details: 'Pushes lr, calls IsScreenFadeActive to read the screen-fade active flag and r0 result.

  If the fade is active (ZERO_FLAG == true after IsScreenFadeActive), returns immediately

  with IsScreenFadeActive''s r0 unchanged.

  Otherwise writes immediate 0x10 into [r5 + oLogoScreenState_Index_00], which routes the

  LogoScreenState machine into the logoScreen_finish_803D2A6 entry via

  logoScreen_dispatch_803D1CA.

  Quirks: the function does not return in registers per the caller contract; the embedded

  readable C shows it returning r0 = the IsScreenFadeActive value when the fade is running,

  or r0 = 0x10 after the store, but the assembly pop {pc} discards those values. The 0x10

  index value is the sentinel that triggers logoScreen_finish on the next dispatch tick,

  guarded so the finish transition never happens in the middle of a fade.

  '
