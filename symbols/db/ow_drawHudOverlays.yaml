name: ow_drawHudOverlays
address: '0x08033B5C'
kind: function
status: probable
summary: 'Per-frame HUD refresh: draws PET HP digits, the battle-start overlay if active, and the current
  map name.'
interface: (r0/r5 = overworld state struct S2011E30) -> r0 = clobbered; no return value
details: 'A tiny composite routine that chains three screen-drawing helpers every frame in the overworld:
  first internet_drawHpDigits renders the PET navi''s 4 HP OAM digits, then battle_drawBattleStartOverlay
  is called with r0=1 (forcing/conditioning the battle-start overlay tilemap DMA and OAM queue based on
  a game-state flag), and finally RenderMapName redraws the area name display. It has no logic of its
  own beyond the fixed argument 1 passed to the overlay routine; the r5 register noted in the comment
  carries the overworld state struct that the callees read.'
