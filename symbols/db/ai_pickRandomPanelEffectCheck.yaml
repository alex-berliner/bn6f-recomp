name: ai_pickRandomPanelEffectCheck
address: '0x08114040'
kind: function
status: probable
summary: 'AI helper: randomly selects one of 16 panel-effect table entries, resolves its alliance-dependent
  params for the object''s panel, and runs the panel flag check on it.'
interface: (r5 = battle object, fields oBattleObject_PanelX/PanelY read) -> r0 = result of panelFlagCheck_8015D80;
  clobbers r4-r7, lr
details: Draws a non-negative RNG value, masks to 0-15, and indexes a 16-word pointer table at off_8114100
  (entries at off_8114100..off_811413C). It then loads the battle object's current panel X (r5+oBattleObject_PanelX)
  and Y (r5+oBattleObject_PanelY) and calls GetAllianceDependentPanelParamArgs with the selected table
  entry (r4) and a byte table at byte_8114160 (r3), which returns a param word and args pointer indexed
  by the object's alliance field. That result is passed straight into panelFlagCheck_8015D80, the AI's
  filtered random relative panel picker, so the random index most likely selects which panel-effect/attack
  descriptor to evaluate. No other state is read or written; the function is a thin 'random descriptor
  -> panel check' wrapper executed on the battlesweep route.
