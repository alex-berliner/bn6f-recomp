name: ai_resetAttackIfNotMoved
address: '0x080F59E8'
kind: function
status: probable
summary: 'AI state routine: if the AI hasn''t moved yet, clear its attack counter, run a follow-up handler,
  then reset the state script id to 0.'
interface: (r6 = AI state struct, r7 = AI attack vars) -> r0 = 0; no meaningful return; flags from tst
details: Reads the HasMoved flag from the AI attack-vars block pointed to by r7. If it is nonzero, the
  body is skipped. Otherwise it stores 0 into oAIState_AttackCounter (the AI's attack/charge counter)
  and calls sub_80F5AA0 (purpose unknown, likely the per-state action or transition helper). Finally,
  unconditionally, it clears oAIState_ScriptId to 0, so the AI state's script restarts from the beginning
  next tick; r4 is pushed but unused.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r7,#oAIAttackVars_HasMoved]; tst/bne guards the reset body; strb r0(=0),[r6,#oAIState_AttackCounter]
    clears the attack counter when HasMoved==0; bl sub_80F5AA0 only inside the not-moved branch; mov r1,#0;
    strb r1,[r6,#oAIState_ScriptId] unconditionally restarts the state script; executed on the battlesweep
    route, consistent with battle AI state stepping
