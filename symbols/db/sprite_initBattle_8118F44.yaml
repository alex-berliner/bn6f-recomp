name: sprite_initBattle_8118F44
address: '0x08118F44'
kind: function
status: confirmed
summary: 'Initialize a battle sprite: set type 0x23, load animation, configure visuals, place from coordinate
  table, and kick off first update tick.'
interface: void sprite_initBattle_8118F44(SpriteRecord *sprite /* r5 */) -> (NZCV, r0-r12, lr clobbered
  per callee chain; sprite pointer preserved in r5)
details: "Entry-point \"Next\" task called with the sprite record pointer in r5.\n\nField writes to the\
  \ sprite record (r5-relative):\n  +0: type byte set to 0x23 (battle-entity tag).\n  +0xC: copy of animation\
  \ ID from +4 (sub-animation slot).\n  +8: set to 4 (active / ready state).\n\nCalls in order:\n  1.\
  \ loc_8002774(8, unk_201E284) – allocates/registers per-sprite config slot 8.\n  2. sprite_setAnimation(animId)\
  \ / sprite_loadAnimationData() – fetches OAM frames.\n  3. sprite_noShadow() – disables the sprite's\
  \ shadow.\n  4. sprite_setPalette(0), sprite_setPriority_8002E14(2) – OBJ palette 0, draw priority 2.\n\
  \  5. slotList_storeHalfwordAndClearField_800306C(0) – zero the slot-list halfword;\n     sub_81190E0\
  \ – init sub-slot; sprite_setSubRecordFieldA_8003060(4) – sub-record field A = 4.\n  6. Coordinates:\
  \ indexes byte_8118FA4 with (r5[+5] << 2), reads two u16s (x, y),\n     calls sprite_setCoordinates(x,\
  \ y). Table has 5 entries\n     {(0x30,0x20),(0x78,0x20),(0xC0,0x20),(0x2A,0x62),(0x2A,0x5A)} plus trailing\
  \ word 0x100.\n  7. sprite_dispatchUpdate_8118FC0(byte_8118FA4) – runs the first update tick,\n    \
  \ passing the same coordinate table as a context pointer in r2.\n\nThe caller's r4–r12 and lr are passed\
  \ straight through; none are used as inputs\nby this routine beyond r5.\n"
