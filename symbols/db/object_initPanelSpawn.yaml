name: object_initPanelSpawn
address: '0x080CFEE4'
kind: function
status: probable
summary: 'Spawn/init routine for a battle object placed on a field panel: loads its sprite, positions
  it on the panel, sets up its collision, and enters its main state — freeing the object if the battle
  is over or the panel is invalid.'
interface: (r5 = battle object) -> void; r0 = scratch/status from callees
details: First checks battle_isBattleOver and object_isCurrentPanelValid; either failing routes to object_freeMemory,
  so the object only lives while its panel is valid. On success it loads sprite set 0x80/palette 0xc/entry
  0x2f via sprite_load + sprite_loadAnimationData and sprite_noShadow, resets CurAnim (0) and CurAnimCopy
  (0xFF). It converts PanelX/PanelY to screen coordinates with object_getCoordinatesForPanels, stores
  Y, sets Z to 0xB4<<16, and computes X as the panel x minus object_getFrontDirection times 0xB4<<16 (offset
  in the facing direction), then applies object_getFlip via sprite_setFlip. It allocates collision data
  (object_createCollisionData; failure also frees the object), fills it with object_setupCollisionData
  using Param1 as the region value with size 0x1c, 5 hit types, then clears the collision region and publishes
  it with object_presentCollisionData. Finally it writes CUR_STATE_UPDATE to the object's state/phase
  word and tail-calls sub_80CFF62 as the object's first state handler.
