name: sub_80ECAA4
address: '0x080ECAA4'
kind: function
status: confirmed
summary: AI attack-state step that waits a fixed 10-tick countdown, then clears the battle object's related-object
  pointer and an AIData slot before exiting the current attack state.
interface: void (struct BattleObject* r5, ? r6, struct AIAttackVars* r7); returns r1 (= AIDataPtr unchanged on the
  early-return path, = AIDataPtr after expiry path)
details: 'Operates on a battle object (r5), an AI attack-state scratch struct (r7), and the object''s AIData (via
  [r5,#oBattleObject_AIDataPtr]).


  - If [r7,#oAIAttackVars_Unk_01] (state byte) is zero, performs a one-shot init: writes 0xA to [r7,#oAIAttackVars_Unk_10]
  (a 16-bit countdown) and sets the state byte to 4 ("in progress").

  - Decrements the countdown each call.

  - If the countdown is still >= 0 after decrement, returns with r1 unchanged (callers branch on r1).

  - When the countdown goes negative, zeros [r5,#oBattleObject_RelatedObject1Ptr] and zeros [(u32)[r5,#oBattleObject_AIDataPtr]
  + #oAIData_Unk_68], then tail-calls object_exitAttackState.


  Note: the countdown comparison uses `sub r0,#1` then `bge` against zero on a 32-bit subtraction that was previously
  stored as u16; the high bits of r0 from the ldrh load are zero, so the bge tests the 16-bit counter signed vs
  zero. Effectively the routine waits exactly 10 ticks (init sets 0xA, decrements to 9, 8, ..., 0 still passes bge
  since 0 is >=0; next tick decrements to -1 (0xFFFFFFFF) which fails bge). So the actual wait is 11 calls before
  exiting -- callers should not assume "10 ticks" literally.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
