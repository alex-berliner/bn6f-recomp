name: objStepFinishSetState4_802BE0C
address: '0x0802BE0C'
kind: function
status: confirmed
summary: Finalizes a state-machine step for the object in r5 — triggers call_sub_3005EBA with fixed arguments (0,0,3,0,6,2),
  resets the toolkit render-info frame counter, calls sub_801E0A0(0,0), then advances the object's state halfword
  at +2 to 4.
interface: void sub_802BE0C(void); callers pass garbage in r0-r3 but r5 must hold the object pointer and r10 the
  toolkit pointer; r4/r5 are preserved; returns with r0=4 and NZ flags set from "mov r0,#4", r1-r3 as left by sub_801E0A0
details: "Acts as one state of a larger per-object state machine: the object pointer is in r5\n(its state counter\
  \ lives in the halfword at +2) and the global toolkit pointer is\nexpected in r10. The routine:\n  1. Calls call_sub_3005EBA\
  \ with the hard-coded argument set (0, 0, 3, 0, 6, 2)\n     (arguments passed in r0-r3 and r4-r5; the callee presumably\
  \ takes 6 params).\n  2. Loads toolkit->renderInfo (r10 + oToolkit_RenderInfoPtr) and clears the\n     halfword\
  \ oRenderInfo_Unk_18 to 0 — likely a frame/animation timer reset.\n  3. Calls sub_801E0A0(0, 0); r5 is live for\
  \ that callee, so the saved r5 is\n     restored before the call.\n  4. Stores 4 into the object's halfword at\
  \ +2, moving it to state 4.\nQuirk: r4 is saved and restored solely to satisfy callers, even though the fixed\n\
  argument set overwrites it internally. Exit flags come from \"mov r0,#4\" (Z=0,N=0),\nnot from an explicit comparison,\
  \ and r0-r3 are not meaningful return values.\n"
