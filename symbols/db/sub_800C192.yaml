name: sub_800C192
address: '0x0800C192'
kind: function
status: confirmed
summary: steps the animated panel tile sets, copying each due frame into IWRAM
interface: 'static void advance_panel_animations(void); adapter: no inputs, out r2 and r3 only'
details: Walks the NULL-terminated pointer list off_800C1DC (six animation records). Each keeps its current frame
  and its frames-to-go in counter slots of byte_2036740 (slot ids at +0 and +2), an IWRAM buffer at +4, and its
  frames (tile data pointer + u8 delay, stride 8) at +8. Each step decrements the delay slot; when it hits zero
  or below the frame slot advances (wrapping past the count at +1), the new frame's delay is loaded into the delay
  slot, and the frame's 0x20 bytes are copied into the buffer with CopyByEightWords. r2/r3 are left exactly as the
  loop's last pass leaves them (last delay, last frame count, or the copy call's leftovers) since they are its only
  outputs.
