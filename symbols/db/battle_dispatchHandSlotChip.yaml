name: battle_dispatchHandSlotChip
address: '0x0802DED8'
kind: function
status: probable
summary: Reads the selected hand slot index (r5+0x16), looks up its per-slot record and hand entry, skips
  empty slots (chipID==0xFFFF), adds two record-based bonuses to a hand-stored u16 when chip-data byte
  9 has bits 0x2/0x4 set, then calls battle_chipEffectDispatcher_80109A4 and returns chipID, dispatcher
  result, adjusted value, and the ChipData pointer.
interface: (r5 = struct with u8 selected slot index at +0x16; r0 unused) -> r0 = chip ID, r1 = chip-effect
  handler result, r2 = adjusted damage value, r3 = *ChipData
details: 'Reads the slot index at [r5+0x16] and fetches both the 0x1D0-stride per-slot record at 0x2036120
  (via getEntryPtr_2036120_1D0) and the 0x50-stride hand slot at 0x20349C0. From the hand slot it takes
  chipID (+0x02), and two u16 fields (+0x0E and +0x1A, the latter used as a base value in r7). If chipID
  == 0xFFFF (empty slot) it returns immediately. Otherwise it looks up the 44-byte ChipData record; when
  byte 9 has bit 0x2 set it adds record+0x36 to the base value, and when bit 0x4 is set it also adds record+0x38,
  i.e. two conditional damage/amount bonuses stored in the per-slot record. It then calls battle_chipEffectDispatcher_80109A4
  with r0=chipID, r1=slot index, re-fetches ChipData, and returns chipID, the dispatcher result, the adjusted
  value, and the ChipData pointer. Quirk: r5 is never initialized here, so the caller must pre-load it.'
evidence:
