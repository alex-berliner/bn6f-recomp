  reproduce: python3 tools/asmcat.py 0x0802DED8
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary is mostly accurate (reads slot index from r5+0x16, fetches per-slot record and hand
    slot, applies two conditional bonuses from record+0x36/0x38 to the base value from hand+0x1A, dispatches
    via battle_chipEffectDispatcher_80109A4, and returns chipID/effect-result/adjusted-value/ChipData
