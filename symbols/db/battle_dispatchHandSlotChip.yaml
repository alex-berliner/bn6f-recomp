open_questions:
- No callers known, so the identity of the r5 struct and why r5 (not r0) carries it is unconfirmed
- Exact meaning of ChipData byte 9 bits 0x2/0x4 and of the 0x1D0-record fields +0x36/+0x38 (bonus damage
  sources?) not proven
- What the +0x0E and +0x1A hand-slot fields are (element/code vs base damage) needs cross-references from
  hand-handling code
- The summary is mostly accurate (reads slot index from r5+0x16, fetches per-slot record and hand slot,
  applies two conditional bonuses from record+0x36/0x38 to the base value from hand+0x1A, dispatches via
  battle_chipEffectDispatcher_80109A4, and returns chipID/effect-result/adjusted-value/ChipData pointer).
  However the function does not actually use hand+0x02 as a chipID; the only chipID read is later re-popped
  for the dispatcher call. Also the proposed name `battle_useHandSlotChip` is fine, but a more descriptive
  `battle_dispatchHandSlotChip` better captures that it computes adjusted damage then calls the effect
  dispatcher.
