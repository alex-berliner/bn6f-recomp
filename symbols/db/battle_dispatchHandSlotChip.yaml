  date: '2026-10-18'
  detail: 'ldrb r0,[r5,#0x16] used for both getEntryPtr_2036120_1D0 and getBattleHandAddr — slot-indexed
    selection; cmp r0,0xFFFF / beq locret — empty hand slot short-circuits before any effect runs; ldrb
    r0,[r4,#9]; tst #2/#4 add [r6+0x36]/[r6+0x38] — conditional bonuses from the 0x1D0 record added to
    the hand slot''s +0x1A value; push/pop shuffling around battle_chipEffectDispatcher_80109A4 passes
    (chipID, slot index) and preserves r0/r2 as return values; getChip8021DA8 called twice on the same
    chipID, second result returned in r3 for the caller'
