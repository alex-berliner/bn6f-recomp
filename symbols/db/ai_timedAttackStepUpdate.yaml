name: ai_timedAttackStepUpdate
address: '0x080F1AB6'
kind: function
status: probable
summary: 'AI attack state step: starts a 20-frame attack pose (element 4, anim 7) once, then counts it
  down and exits the attack state.'
interface: (r0 unused, r5 = battle object, r7 = oAIAttackVars) -> r0 clobbered by call; sets/uses oAIAttackVars_AttackElement,
  StepTimer and oBattleObject_CurAnim
details: If oAIAttackVars_AttackElement is zero, it writes 4 to that field, sets oBattleObject_CurAnim
  to 7, and initializes oAIAttackVars_StepTimer to 0x14 (20 frames). Otherwise it decrements StepTimer
  each frame; while it stays >0 the function just returns. When the timer reaches 0, CurAnim is reset
  to 0 and it tail-calls object_exitAttackState (0x08011714) to leave the AI attack state. The element
  value 4 and animation ids 7/0 are enum-dependent, and the element is never cleared on exit.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst; bne — first-run latch of element 4 and timer
    0x14 (asm lines 2-8); step timer decrement with sub r0,#1 / strh / bgt — per-frame countdown of the
    pose (asm lines 10-13); mov r0,#0; strh? strb to [r5,#oBattleObject_CurAnim] before bl object_exitAttackState
    — reset pose and exit attack state (asm lines 14-17); only callee is object_exitAttackState, matching
    an AI attack-state handler; no known caller, so which attack (element 4) uses this is unconfirmed
  refs:
