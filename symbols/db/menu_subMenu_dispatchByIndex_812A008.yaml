status: probable
summary: SubMenu state handler — draws the sub-menu sprite, then runs `sub_81465BC` and on success (r0
  != 0) resets the eLink state, sets the sub-menu phase byte to 4 and the sub-menu counter to 3.
interface: '(r5 = *SubMenu, r10 = *Toolkit) -> r0 = result of sub_81465BC (0 if unchanged, 3 otherwise)
  ; side effects: may reset eLink state and patch [r5+2] = 4, [r5+0x28] = 3'
details: '1. Pushes only lr (leaf-ish; r5/r10 are callee-saved and restored implicitly by the absence
  of pushes — they live in the caller).

  2. Calls `sprite_drawIfFlagSet_812B504(r5, r10)` first; this draws the sub-menu sprite if its flag bit
  is set.

  3. Calls `crt0_start_800027C` — the standard boot/trampoline helper the project uses as a no-op retargeter.

  4. Calls the unnamed `sub_81465BC` and branches on r0==0 to `locret_812A026` (early exit, pop {pc},
  r0 left as 0).

  5. When `sub_81465BC` returned non-zero, calls `eLinkState_ResetForNewUse_803DE88` — note it is called
  without an explicit r0, so r0 was just the non-zero result of sub_81465BC; the callee treats that as
  the caller''s eLink state pointer (per its confirmed contract).

  6. Stores 4 at `*subMenu + 0x2` (sub-menu phase / jump-table offset) and 3 at `*subMenu + 0x28` (u16
  sub-menu counter/timer).

  7. Exits via `pop {pc}` with r0 = 3 (the value that was just strh''d back into [r5+0x28], having been
  moved into r0 by the final mov).

  The captured r0=0x0812a009 (i.e. address+1, Thumb bit set) at entry and the consistent exit r0=3 confirm
  the function is being entered via BX-style dispatch on the SubMenu jumptable (idx=0 → off+1); that plus
  the [r5+2] / [r5+0x28] writes and the eLink reset makes this a "link-battle / PET-link sub-menu: confirm
  & initialize" handler at jumptable index 0.

  '
