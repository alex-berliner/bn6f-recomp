  date: '2026-10-14'
  detail: '- `bl sprite_drawIfFlagSet_812B504` (asm33.s:14266): standard SubMenu sprite-draw preamble
    used by sibling SubMenu handlers. - `bl sub_81465BC` followed by `tst r0, r0 / beq locret_812A026`
    (asm33.s:14270-14271): r0 is the only checked return value; non-zero ⇒ continue with init. - `bl eLinkState_ResetForNewUse_803DE88`
    (asm33.s:14273): resets eLink/link-battle state block per its confirmed contract; r0 at this point
    is sub_81465BC''s non-zero return (treated as the eLink caller pointer). - `mov r0, #4; strb r0, [r5,#2]`
    (asm33.s:14274): writes jump-table phase byte 4 into SubMenu; consistent with `oSubMenu.idx_00` being
    the jumptable index and 0x02 being the dispatch offset. - `mov r0, #3; strh r0, [r5,#0x28]` (asm33.s:14276):
    writes the value 3 into a u16 at offset 0x28; 0x28 is past the declared `Size=0x50` of SubMenu so
    this is into extra/larger SubMenu state used in this link path. - `pop {pc}` at locret_812A026 with
    r0 = 3 in the taken branch matches the captured exit r0 = 3. - Captured entry r0 = 0x0812a009 across
    all four snaps (a Thumb-set address of this function) plus r3 = 0x02001c04 (S2001c04 / encounter-state
    struct the toolkit points at) confirms the dispatch is via BX r0 (Thumb bit set) from a jumptable
    that the SubMenu subsystem owns.'
