summary: Thin tail-call trampoline that simply re-renders the currently highlighted mail entry by jumping
  into mail_drawSelectedEntry_80478D4 with no extra work.
interface: '() -> r0 = result of mail_drawSelectedEntry_80478D4 ; side effects: redraws the selected mail
  entry''s icon tiles, name strip and reader text (see callee).'
details: "The function is a 3-instruction tail call: it pushes only {r5, lr}, branches to\n  mail_drawSelectedEntry_80478D4,\
  \ then pops {r5, pc}, returning whatever the callee\n  returns in r0 (observed value 0x7 in all captured\
  \ calls). No additional state is set\n  up before the call, so the only reason this wrapper exists is\
  \ to switch lr into r5\n  (probably satisfying the register contract of the callee, which lists r5/r10\
  \ as live\n  inputs) and to provide a distinct entry point for callers that want this single\n  semantic\
  \ (\"redraw the highlighted mail entry\") without doing anything else.\n  All 40 captured invocations\
  \ come from two callers, sub_8046D4C and sub_8047134,\n  both of which are themselves mail-reader handlers,\
  \ confirming this sits inside\n  the mail-list/mail-reader flow rather than anywhere else in the toolkit.\n"
