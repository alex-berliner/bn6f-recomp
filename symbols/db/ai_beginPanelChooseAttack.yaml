name: ai_beginPanelChooseAttack
address: '0x080FAFA0'
kind: function
status: probable
summary: Arms the AI's panel-choose callback, computes the attack's duration, and enters attack state
  9.
interface: (r0 = unused) -> r0 = duration value stored to oAIAttackVars_AttackDuration; sets attack state
  via object_setAttack4
details: Operating on the AI object in r7, this stores sub_80FB724+1 into oAIAttackVars_PanelChooseCallback,
  so the AI will invoke that callback when choosing a panel. It then calls sub_80FAEA0, whose return value
  is written to oAIAttackVars_AttackDuration as the attack's timer. Finally it transitions the object
  into attack state 9 via object_setAttack4. The r7 base structure is the AI attack-vars struct (oAIAttackVars_*
  fields).
