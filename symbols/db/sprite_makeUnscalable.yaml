name: sprite_makeUnscalable
address: '0x08002D52'
kind: function
status: confirmed
summary: Strips the "scalable" state from an object's sprite, clearing its scale bits and the matching sprite flag-word
  bit.
interface: void sprite_makeUnscalable(ObjectHeader* r5); clobbers r0-r3 and NZCV; preserves r5; flags are caller-visible
  (see quirks)
details: 'Takes an object header in r5 and locates its sprite block as header + (high nibble of header byte 2 <<
  4), i.e. 16-byte sprite units indexed by the top nibble of oObjectHeader_TypeAndSpriteOffset. It temporarily repoints
  r5 at the sprite block (needed because the flag-word callee consumes r5) but restores the header pointer before
  returning. If oObjectSprite_Unk_11 bits 0-1 (the current scale state) are already 0, it exits early without touching
  anything. Otherwise it clears Unk_11 bits 0-1 and Unk_13 bits 1-5 (mask 0x3e), where (Unk_13 & 0x3e) >> 1 is the
  bit index into the sprite flag word, then calls flags_clearFlagWordBit_802FE6A to clear that bit. Net effect in
  game terms: the sprite stops being drawn with scaling applied.

  '
