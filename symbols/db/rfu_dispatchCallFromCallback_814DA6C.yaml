name: rfu_dispatchCallFromCallback_814DA6C
address: '0x0814DA6C'
kind: function
previous_names:
- sub_814DA6C
status: probable
summary: Indirect-tail wrapper that branches to the function pointer held in r3 (typical call-via-pointer
  helper in the RFU packet handling path).
interface: (r3 = target function) -> whatever the target returns; lr is not restored here (tail-call via
  BX)
details: "The function is a single Thumb instruction: `bx r3`. The contract labels r3 as an\n  input,\
  \ and the captured-call frames show different call sites loading r3 with\n  hand-picked routine pointers\
  \ (e.g. r3 is paired with r0=pointer-to-buffer in some\n  captures, e.g. 0x03007d29 / 0x03007cc1 etc.,\
  \ and r2 tends to be 0x78/0x80 byte counts\n  from the LLSF helpers — looks like the function pointer\
  \ plus a length is passed through).\n\n  This is the classic \"indirect tail-call trampoline\" pattern.\
  \ It does not save lr or\n  push a frame; caller has already set up r3 with the function to actually\
  \ run, and\n  `bx r3` jumps to it with lr untouched, so when that callee returns, control flows back\n\
  \  to sub_814DA6C's caller. Equivalent to `return func[r3](...)` in C. It is used inside\n  the `rfu_STC_*_constructLLSF`\
  \ / `_receive` helpers (and sub_814D8F0 / sub_814D9C4 which\n  are clearly adjacent dispatch logic)\
  \ to invoke a polymorphic callback/handler whose\n  pointer was loaded from a small table indexed by\
  \ the construct-receive helpers.\n\n  No callees of its own — its only \"callee\" is whatever is in\
  \ r3, hence empty bl list.\n"
