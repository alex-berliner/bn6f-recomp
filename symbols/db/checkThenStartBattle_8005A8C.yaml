name: checkThenStartBattle_8005A8C
address: '0x08005A8C'
kind: function
status: confirmed
summary: While in the field subsystem, checks a set of "is it safe to fight now" guards and, if all pass, launches
  the queued battle with a fade-out.
interface: void checkThenStartBattle(void); // r10 = toolkit; no meaningful outputs; clobbers r0-r3 and flags
details: "Called (per the readable C) with the toolkit in r10, from which it loads the\nGameState pointer (oToolkit_GameStatePtr)\
  \ and keeps it in r5 (saved/restored via\npush/pop {r5}). It then runs a chain of guards, each of which aborts\
  \ with no\naction if it trips:\n\n- oGameState_SubsystemIndex (byte 0 of GameState) must be 4 (field/overworld).\n\
  - EVENT_1717_PLAYER_ADVANCE_FORWARD must be clear (player not mid-step-forward).\n- sub_809E462 (purpose unknown,\
  \ returns a set flag) must not trip.\n- Event flags EVENT_1700 and EVENT_173E must be clear.\n- warp_LoadCurrentAndReadUnk10_8005F28\
  \ must report no warp in progress.\n- TestPETMenuDataFlag(1) must be clear (no PET menu overlay active).\n- IsScreenFadeActive\
  \ must report a fade IS currently active (battle starts on top\n  of an already-running fade; note the inverted\
  \ sense).\n- IsCutsceneScriptNonNull must be clear (no cutscene script running).\n- chatbox_mask_eFlags2009F38(0x80)\
  \ must be clear (no chatbox text on screen).\n\nIf every guard passes, it fetches the pending battle settings\
  \ pointer via\nsub_80AA4C0 (returns pointer in r0, availability in ZF). If one is queued, it\ncalls StartBattle(settings,\
  \ 1) and then SetScreenFade(0x2C, 0x10) to fade the\nscreen out into the battle transition.\n\nQuirk: the screen-fade\
  \ guard requires a fade to already be active before a\nbattle may start, so this only fires on frames where a\
  \ fade is in progress.\nUses movflag to load event-flag constants (bank 0x17 flags) before calling\nTestEventFlagFromImmediate.\n"
