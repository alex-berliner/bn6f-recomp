name: battle_findForwardBlockX
address: '0x080C6F08'
kind: function
status: probable
summary: Scans up to 5 panels straight ahead of a battle object (facing direction, same row) and returns
  the x of the first panel that is 'blocked', equals a target x, or lies off the 2..5 range.
interface: (r0 = target/stop panel x; r5 = current battle object) -> r0 = x coordinate of the panel where
  the scan stopped; r4-r7 preserved, other flags clobbered.
details: Loads a per-alliance 32-bit mask from byte_80C6F48 (alliance 0 -> 0x05800000, alliance 1 -> 0x0A800000,
  indexed via oBattleObject_Alliance<<2). For step r6 = 1..5 it computes x = oBattleObject_PanelX + object_getFrontDirection()*r6
  (y unchanged, so a straight line along the facing row) and calls object_getPanelParameters(x, y). It
  stops (returning the current scanned x, since pop {r0,r1} restores x before every exit branch) when
  the panel's status word has a mask bit set (tst r0,r4), when x equals the r0 argument, or when x <=
  1 or x >= 6; otherwise after 5 steps it returns the last x. The tst is deliberately done on the panel-result
  r0 before the pop that overwrites it with x. The alliance-dependent masks presumably mark panels occupied/blocked
  per side, but the exact panel-status bit meanings are not confirmed here.
