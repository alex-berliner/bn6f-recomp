name: battle_aiActorCountByTargetSide
address: '0x080319E6'
kind: function
status: probable
summary: AI helper that returns the actor count (3 or 2) for a sub-state chosen by which side of the horizontal
  line y=12 the target lies on.
interface: (r0 = entity ptr, r1 = target ptr) -> r0 = 3 if target is on the negative (clockwise) side
  of edge (0,12)-(16,12), else 2; flags clobbered by calls
details: First calls battle_calcRelPosToTarget to fill the scratch buffer with the entity's (and next-position's)
  coordinates relative to a doubled target reference point; r0/r1 then carry the point coordinates into
  math_pointCrossHalfPlaneTest with the edge (r2,r4)=(0,12) to (r3,r5)=(0x10,12) — a horizontal boundary
  across x=0..16. The 0/1 half-plane result is passed directly as the AI sub-state index to battle_aiIndexToActorCount,
  so side==1 yields 3 actors and side==0 yields 2. The constant edge suggests a fixed vertical row split
  in battle coordinates used by some enemy AI phase. No callers are visible, so which entity/target pair
  is passed and what the count is used for remain unconfirmed.
