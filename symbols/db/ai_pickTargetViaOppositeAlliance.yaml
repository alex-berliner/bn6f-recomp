name: ai_pickTargetViaOppositeAlliance
address: '0x08113DFC'
kind: function
status: probable
summary: Battle AI script step that searches for an opposing-team object and, if none is 'blocked' by
  some status, locks it as the attack target, otherwise falls through to retry/alternate scripts.
interface: (r5 = battle object ptr, r6 = AI state ptr, r7 = AI attack vars ptr) -> void; sets oAIState_ScriptId
  to 4, 8, or 0xC
details: Early-outs if the object's collision flags (object_getFlag) have any bit of 0xA000 set. It XORs
  the object's Alliance field with 1 and calls sub_8114316, which appears to look up an object belonging
  to the opposite team (the call result is later reused as an object pointer). If that lookup fails, a
  per-object counter at offset 0x66 is incremented and wraps at 3; on wrap the AI script id becomes 4,
  otherwise 0xC. If the lookup succeeds, it scans battle actors with nonzero values at struct offsets
  0x60, 0x91 and 0x96; only when no such actor exists does it store the found object into oAIAttackVars_TargetObjectPtr,
  set ExtraVars to 1, and switch to script 8. The three-way script-id dispatch (4/8/0xC) confirms this
  is one state of an enemy AI script driven by the AI state struct.
