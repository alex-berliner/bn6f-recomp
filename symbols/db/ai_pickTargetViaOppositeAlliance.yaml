- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_getFlag; tst r0, 0xA000; bne exit - gated on object collision/status flags; ldrb r0,[r5,#oBattleObject_Alliance];
    eor r0,#1; bl sub_8114316 - query something about the opposite team; counter at [r5,#0x66] wraps at
    3 -> scriptId=4, else scriptId=0xC (retry ladder); bl FindBattleActorsWithNonzeroParam(0x60,0x91,0x96);
    pop {r1}; bne exit - only acts when no actor matches those fields; str r1,[r7,#oAIAttackVars_TargetObjectPtr];
