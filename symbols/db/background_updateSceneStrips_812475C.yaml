name: background_updateSceneStrips_812475C
address: '0x0812475C'
kind: function
status: confirmed
summary: Redraws three 8x2-tile background strips in tile block 2 at column 0x15, filling each from a
  tile-id table or clearing it depending on scene state words and an event flag.
interface: void sub_812475C(void); /* reads r10 (toolkit), uses state = toolkit->S2001c04_Ptr; preserves
  r4-r7; returns r0-r3/flags as left by last callee */
details: "Loads the scene-state pointer from the toolkit at oToolkit_S2001c04_Ptr (r10-relative, +0).\
  \ For each of three strips it either copies an 8-wide x 2-tile row of tile ids via CopyBackgroundTiles\
  \ (j=0x15, tile_block_32x32=2, j_size=8, i_size=2) or passes tile_ids=0 to call_sub_3005EBA, which presumably\
  \ clears/fills the strip with tile 0:\n  - strip at i=8: real tiles (unk_201EC8C) when word at state+0x24\
  \ is nonzero, else cleared;\n  - strip at i=5: real tiles (unk_201ECAC) while event flag EVENT_1709\
  \ (0x1709) is set,\n    else cleared, tested via TestEventFlagFromImmediate (bank in r0, index in r1);\n\
  \  - strip at i=2: real tiles (unk_201ECCC) when word at state+0x28 is nonzero, else cleared.\nThe three\
  \ source tables are consecutive 0x20-byte arrays (0x8*0x2 u16 ids each) at 0x201EC8C/0x201ECAC/0x201ECCC\
  \ in IWRAM. r4-r7 are pushed/popped; the flags and r0-r3 escape from the last callee call. All strips\
  \ live in the same 32x32 tile block (2) at the same column, so they form a vertical stack of three status/icon\
  \ slots on the scene background, toggled by the state words and the event flag.\n"
