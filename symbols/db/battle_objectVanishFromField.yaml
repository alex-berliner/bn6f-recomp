name: battle_objectVanishFromField
address: '0x080D795C'
kind: function
status: probable
summary: 'Makes a battle object vanish: unregisters it from the field, plays a sound, keeps its future
  panel reserved, and moves it to phase 4 (hidden/gone).'
interface: (r0..r3 = scratch, object in r5) -> r0 = handle/ptr from sub_80C4038 stored to oBattleObject_ExtraVars+8;
  sets oBattleObject_CurPhaseAndPhaseInitialized = 4
details: 'The routine tears an object off the battle field: it clears the object''s collision region,
  zeroes oCollisionData_ObjectFlags1, and runs the destroy-event dispatch, so nothing can target or collide
  with it. It then plays sound effect 0x84 (0x85-1), calls sub_80C4038 with four zero arguments and a
  data pointer 0x10D04 (likely spawning an effect/animation for the disappearance), storing the result
  at oBattleObject_ExtraVars+8. clearEntryOfBattleStateBattleObjectList_800F656 removes the object from
  the active battle-object list so it is no longer processed as a combatant. Despite being removed, it
  calls object_reservePanel with the object''s FuturePanelX/Y, pre-claiming the panel it will reappear
  on. Finally it sets CurPhaseAndPhaseInitialized to 4, the ''hidden/gone'' phase, presumably until a
  later handler brings it back.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_clearCollisionRegion + ''str r1,[r0,#oCollisionData_ObjectFlags1] with r1=0'' removes
    collision and object flags; bl battle_dispatchDestroyEvents_802EF5C runs the paired destroy-event
    dispatch for the object; mov r0,#0x85; add r0,#0xff; bl PlaySoundEffect plays disappearance sound
    0x84; bl clearEntryOfBattleStateBattleObjectList_800F656 then ldrb FuturePanelX/Y; bl object_reservePanel:
    unlisted but keeps its next panel reserved; mov r0,#4; strh [r5,#oBattleObject_CurPhaseAndPhaseInitialized]
    parks the object in phase 4'
