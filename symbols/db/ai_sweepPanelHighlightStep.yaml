name: ai_sweepPanelHighlightStep
address: '0x0811123C'
kind: function
status: probable
summary: 'Periodic update for an AI''s sweeping attack: highlights panels along a path every few frames,
  then when the step timer expires sets the attack animation and element state.'
interface: (r0 unused entry; r5 = battle object, r7 = AI attack vars) -> r0 = clobbered; updates oAIAttackVars_StepTimer,
  oAIAttackVars_HitElement, oAIAttackVars_AttackElement, object anim/counter fields
details: Each call decrements oAIAttackVars_StepTimer; while it is nonzero and (timer & 4) == 0 it calls
  highlightPanelIfSomeCondition with dx = high nibble of oAIAttackVars_AttackBoost2, dy = low 3 bits,
  sideSign = 1, and facing = Alliance EOR DirectionFlip, so the highlighted path flips with the object's
  direction. When the timer reaches 0 it sets the object's counter to 0x18 (object_setCounterTime), picks
  the next animation from a 2-byte lookup table indexed by the object's byte at offset 0x69, writes it
  to oBattleObject_CurAnim, restarts StepTimer at 0xB, sets HitElement to 4 and AttackElement to 0. The
  AttackBoost2 nibbles thus encode the sweep's column/row extent being telegraphed one strip at a time.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'sub r0,#1 / bne: timer countdown gate; tst r0,#4 gives the every-4-frames panel highlight cadence;
    ldrb r0,[r7,#oAIAttackVars_AttackBoost2]; lsr r1,r0,#4 / lsl r0,lsl 0x1d: splits one byte into dx
    (hi nibble) and dy (low 3 bits) for the highlight call; eor r3, r2 (Alliance ^ DirectionFlip) passed
    as facing arg to highlightPanelIfSomeCondition_8109660; on expiry: object_setCounterTime(0x18) and
    table off_8111288 {1,2} indexed by byte 0x69 -> oBattleObject_CurAnim; sets HitElement=4 and AttackElement=0,
    then reloads StepTimer=0xB for the next phase'
