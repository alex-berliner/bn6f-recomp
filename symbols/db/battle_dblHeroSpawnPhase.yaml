name: battle_dblHeroSpawnPhase
address: '0x080E8020'
kind: function
status: probable
summary: 'One-shot phase of a battle object: spawns the ''dbl hero'' child object at the owner''s panel,
  then ends the action unless Param2 says otherwise.'
interface: (r4/r5 = battle object ptr, r5 clobbered to RelatedObject1Ptr) -> r0 = 0/1; no flags used
details: 'On first run (oBattleObject_PhaseInitialized == 0) it gathers the object''s PanelX, PanelY,
  Element and DamageAndStaminaDamageCounterDisabler (+Z16Save) and its RelatedObject1Ptr, calls spawnDblHeroObject_80BD20A
  to spawn a paired ''double hero'' object at that position, then writes 4 to PhaseInitialized so this
  spawn happens only once. Afterwards it checks oBattleObject_Param2: when it is 0, it sets CurAction
  = 0xC and CurPhaseAndPhaseInitialized = 0, i.e. the action terminates immediately after the spawn. When
  Param2 is nonzero the phase returns without changing state, leaving the action active. The odd r7 =
  r5+5 and the damage+Z16 combination are quirks of this call''s argument packing.'
