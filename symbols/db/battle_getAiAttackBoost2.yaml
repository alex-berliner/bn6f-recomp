name: battle_getAiAttackBoost2
address: '0x08106AE4'
kind: function
status: probable
summary: returns a per-difficulty attack-boost byte (from table {20,20,16,16}) used by the AI attack setup
  routine
interface: () -> r0 = byte from byte_8106AF4 (via sub_800FE28)
details: Loads the address of the 4-byte table byte_8106AF4 (0x14,0x14,0x10,0x10) into r0 and tail-calls
  sub_800FE28, returning its result. The sole caller stores the result into oAIAttackVars_AttackBoost2
  immediately after fetching and storing the AI difficulty tier, then triggers object attack 0xB. The
  4-entry table matches the difficulty tier range, so the value is presumably selected by the tier (likely
  via sub_800FE28 indexing or sampling the table).
