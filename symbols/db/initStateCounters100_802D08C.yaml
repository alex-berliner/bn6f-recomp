summary: Fetches a state struct via sub_802D064 (selected by the flag in r0), clears its byte at +0x10, and sets
  the two bytes at +0xD and +0xF to 100.
interface: void initStateCounters100(bool selector /* r0 */); returns the struct pointer in r0 and 100 in r1 (NZCV
  reflect r1); tail of the call chain passes lr through
details: 'Wraps sub_802D064 (which, given a boolean selector in r0, resolves and returns some global/state struct
  pointer in r0) and then resets three single-byte fields of that struct: offset +0x10 is written 0, while offsets
  +0xD and +0xF are both written 100 (0x64). The value 100 appearing in two adjacent-but-not-adjacent bytes (0xD
  and 0xF, with 0xE left untouched) suggests two independent counters/gauges initialised to a full value (HP-like,
  percent, or timer), with +0x10 acting as an enable/phase flag that is switched off. The function is not a tail
  call (it pushes lr and pops pc), and on return r1 deliberately holds the last stored value (100), so callers can
  test it or flags directly; r0 passes the struct pointer through for chaining.'
