summary: Finalises a queued battle sprite group by recording the current sprite palette count (dword_200F340) into
  slot 5 of the per-group byte array at byte_200F389.
interface: '(no input args used) -> r0 = 5 (slot index); side effect: byte_200F389[5] = LO(dword_200F340) after
  a tail-call to sub_80028C0'
details: "The function is a 3-instruction Thumb stub. It pushes lr, sets r0 = 5, tail-calls\n  sub_80028C0 (which\
  \ records dword_200F340 into byte_200F389[r0] per its summary), and\n  returns via pop {pc}. No caller-supplied\
  \ registers are consumed; r0 is hard-coded to 5,\n  meaning this always writes to slot index 5 of the byte_200F389\
  \ array — the per-sprite-group\n  \"current palette count\" slot. The three direct callers (battle_update_8007A44,\n\
  \  sub_8007E62, sub_8007F4E) are battle-update dispatch helpers, consistent with this being\n  called once per\
  \ queued sprite group to finalise palette bookkeeping after the group has\n  been queued.\n"
