name: SaveMenuOpenUpdate8132C50
address: '0x08132C50'
kind: function
status: confirmed
summary: 'Save-menu per-frame update: while the screen fade is active, clear chatbox eFlag 0x40 and mark the menu
  object''s state byte as "fading" (4), then always refresh the save-menu text GFX.'
interface: void SaveMenuOpenUpdate8132C50(u32 menu_ptr /* r5 */) -> clobbers nz,c,v,r0,r1,r2,r3; preserves r4-r11
details: 'Called every frame (or each tick) while the save-menu sub-state is open, with r5 holding the save-menu
  object pointer. While IsScreenFadeActive() reports the screen is still fading (Z clear), it clears chatbox eFlag
  0x40 via chatbox_clear_eFlags2009F38 and writes 4 (state = SAVE_MENU_FADING / "fade-out done") to menu_ptr+2,
  suppressing further interaction until the fade completes. Once the fade is over (Z set) the early branch is skipped,
  but saveMenuTextGfx_8132F4C is unconditionally called each invocation to redraw/update the save-menu text graphics
  (e.g., file slot names, "Save Complete" banner). r5 is treated as a preserved callee-trashable register across
  this function — all internal callees leave r5 untouched so the caller''s save-menu object stays valid. The "0x40"
  chatbox flag and the value "4" written to offset 0x2 are hard-coded magic constants from the save-menu state machine.

  '
