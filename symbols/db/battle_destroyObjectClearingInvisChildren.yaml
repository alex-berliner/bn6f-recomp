name: battle_destroyObjectClearingInvisChildren
address: '0x080EA31E'
kind: function
status: probable
summary: Marks a battle object for destruction while clearing the 'flashing invisible' state and flag
  0x202 on every object referenced from its list at offset 0x60.
interface: '(r5 = battle object pointer; note: input is in r5, not r0) -> r0 = 0; sets object state to
  CUR_STATE_DESTROY'
details: The function walks a null-terminated array of pointers starting at offset 0x60 of the structure
  given in r5 (r4 = r5 + 0x60, advancing 4 bytes per iteration). For each non-null entry it calls battle_resetFlashingInvisTimer_801A67E,
  which returns the entry's collision-data pointer, then clears flag bits 0x202 in that collision data's
  ObjectFlags1 via object_clearFlag — i.e. it un-invisibilizes the referenced objects. When the null terminator
  is reached, r5 is restored from the stack (the loop reuses r5 as the array element) and the parent object's
  oBattleObject_CurStateActionPhaseAndPhaseInitialized field is set to CUR_STATE_DESTROY, scheduling the
  parent for deletion. The 0x202 mask covers the invisible/flashing-related flag bits. No callers are
  known, so which object type keeps a child/held-object pointer list at +0x60 is unconfirmed.
