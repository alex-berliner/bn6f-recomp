summary: 'Proposed name: object_PtrPairs. Pointer-pair table pairing queued battle-object sprite groups
  with their per-group object counts. (pointer)'
details: The label is a table of pointer pairs used by the battle-object sprite projection and queuing
  code. Its first pair points to the queued-object group at dword_2039A10 and the corresponding count
  byte at byte_2036778; another pair points to dword_203A010 and dword_203CA7C. The project-and-queue
  function walks the first group through its pointer and count, while the palette initialization code
  treats the table as input data. The zero entries delimit or mark unused pairs, and the table also serves
  as an object pointer-pair registry rather than a single scalar state field.
