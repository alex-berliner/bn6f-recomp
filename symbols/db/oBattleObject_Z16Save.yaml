name: oBattleObject_Z16Save
address: '0x32'
kind: struct-field
status: probable
summary: Saved Z16 coordinate used as a position anchor for wobble/teleport effects and as a half-word
  payload traveling alongside Damage.
details: Mirrors X16→Unk_30 as the Z half of the saved anchor (`ldrh r0,[Z16]; strh r0,[Unk_32]`), feeds
  that saved Z into `AddRandomVarianceToTwoCoords` with variance=3, and is restored back to Z16 when the
  wobble ends. In asm31.s, Unk_32 is consistently `ldrh`'d and added into r6 (loaded from Damage/StaminaDamage)
  to form a (damage, unk32) payload passed to spawn/dimming helpers — exactly matching how a saved positional
  offset is packed alongside the damage word.
