name: ai_attackStepChargeWindup
address: '0x080F0D08'
kind: function
status: probable
summary: AI attack step handler that roots the enemy in place and plays a charge-up anim/sound for 10
  frames before transitioning (sets HitElement=8) to the follow-up attack step.
interface: (r5 = battle object ptr, r7 = oAIAttackVars ptr; state read from InitFlag/StepTimer) -> void;
  r0 clobbered
details: 'On the first run (AttackElement == 0) it stamps AttackElement = 4 and does the ''commit to attack''
  setup: clears the object''s collision region, copies the object''s current PanelX/Y into its FuturePanelX/Y
  and reserves its own panel, and ORs OBJECT_FLAGS_CANNOT_SLIDE so the enemy cannot be pushed off its
  tile. It sets the object''s current animation to 0x13, calls sub_80D19D4(7, 5, InitFlag, 0x1FF03, Damage)
  — apparently spawning/arming the attack payload using the stored damage — stores the result in ScratchVar,
  plays sound 0x64 (0x65-1), and loads StepTimer = 10. On later frames it just counts StepTimer down;
  when it hits 0 it calls sub_80F0E96 (the follow-up attack step) and sets HitElement = 0xA. This is the
  wind-up phase of a stationary charging attack.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement] / tst + bne: first-entry (InitFlag-style) vs countdown
    branch, classic step-handler shape; clearCollisionRegion + reservePanel(own PanelX/Y) + object_setFlag1(OBJECT_FLAGS_CANNOT_SLIDE):
    enemy locks itself onto its current panel; strb 0x13 -> oBattleObject_CurAnim and PlaySoundEffect(0x65-1=0x64):
    charge pose + charge sound; ldr r6,[r7,#oAIAttackVars_Damage] passed to sub_80D19D4, result kept in
    oAIAttackVars_ScratchVar: attack payload armed with the damage value; StepTimer=10 counted down, then
    bl sub_80F0E96 and HitElement=0xA: fixed wind-up delay before the next attack step'
  refs:
  - bn6f/asm/asm31.s:122881
  - 0x080005CC PlaySoundEffect
  - 0x0801A074 object_clearCollisionRegion
  - 0x0801BB1C object_reservePanel
  reproduce: python3 tools/asmcat.py 0x080F0D08
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The windup/charge-step interpretation is correct: it clears collision, locks the panel, sets anim
    0x13, calls sub_80D19D4, plays sound 0x64 (0x65+0xff = 0x164... actually 0x65 + 0xff = 0x164 unsigned,
    but the asm `add r0,#0xff` after `mov r0,#0x65` yields 0x164, not 0x64; the proposal''s sound ID is
    wrong), loads StepTimer=10, and when timer expires calls sub_80F0E96. However, the proposal says HitElement
    = 0xA when the code stores 8 (`mov r0,#8; strh r0,[r7,#HitElement]`). The proposed name and summary
    are fine, but the sound ID and HitElement value in the summary/details are inaccurate.; run wf investigate
    investigate-20261018-230610; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash
    (tools/investigate_land.py reconcile)'
