name: reqBBS_813FDA8
address: '0x0813FDA8'
kind: function
status: confirmed
summary: Scene load/init for the BBS request board — clears VRAM/palette buffers and decompresses the board's tiles,
  palettes, and text script from the reference table before the board state is set up.
interface: void reqBBS_813FDA8(void) /* r5 preserved end-to-end, returned as the caller's r5; clobbers r0-r3, lr,
  flags */
details: 'Standard "load a scene" stub built around decompAndCopyData. It first clears VRAM (zeroFillVRAM) and the
  palette buffer at 0x3001960 (ZeroFill_byte_3001960), then hands the resource reference table at byte_813FDCC to
  decompAndCopyData. The table (terminating at NULL entries) describes the request-board screen''s assets: compressed
  tiles to 0x06000200 with work RAM at byte_2017A00, a text/eText script into eTextScript201BA00 via unk_2018A00,
  font shade tables (reqBBS_textualShades, 0x20 entries into unk_30019C0 at 0x30019E0 with 0x60), a 0x280-entry
  block into VRAM 0x06001000, a 0x60-entry palette at palette_3001960, plus two further compressed graphics blocks
  (0x06010000 via unk_2019200, and one with NULL dest read from byte_201AA00) with their parameter tables (byte_87EFBA4,
  byte_87EF824, byte_86C9D6C, byte_86C9D6C-related byte_30016D0, byte_86C9BD4). After loading, reqBBS_8140600 initializes
  the BBS scene state (returning r4-r6 context), ZeroFillGFX30025c0 clears an OAM/GFX work area at 0x30025c0, and
  battle_resetEStructRecords_8046664 resets enemy/struct records. The function itself only pushes/pops r5, so r5
  and (per contract) r10 pass through unchanged; the "r5 out" in the contract is just the preserved caller value.

  '
