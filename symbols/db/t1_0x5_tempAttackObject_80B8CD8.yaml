name: t1_0x5_tempAttackObject_80B8CD8
address: '0x080B8CD8'
kind: function
status: confirmed
summary: Dispatches a temp-attack battle object to the handler for its current state.
interface: 'void t1_0x5_tempAttackObject_80B8CD8(u32 objPtr /* r5 */); /* kills: nz c v r0 r1 r2 r3 r4 r5 r6 r7
  r8 r9 r10 r11 r12 lr */'
details: 'Reads oBattleObject_CurState on the object pointed to by r5, indexes the jump table at

  "off_80B8CEC" (3 entries: sub_80B8CF8 at state 0, sub_80B8DA6 at state 4, object_freeMemory

  at state 8) and tail-calls the selected handler with r0 = state and r1 = handler address,

  using a `mov lr,pc; bx r1` Thumb-switch trick. Returns to the original caller via the pushed

  {lr}. No preserved registers. The function itself is a thin dispatcher; per-state behavior

  lives in the three handlers, which still lack typed interfaces.

  '
