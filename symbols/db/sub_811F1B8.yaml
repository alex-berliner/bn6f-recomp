name: sub_811F1B8
address: '0x0811F1B8'
kind: function
status: hypothesis
summary: Initializes two small parameter-pair tables by dispatching each pair to a setter (sub_802FE28).
interface: void sub_811F1B8(void);  // takes no inputs, returns void; r4-r7 preserved, nzcv r0-r3 r5 r7 clobbered
details: 'The function iterates over two consecutive tables of (u32, u16) pairs held in

  rodata at dword_811F1F0 (3 entries worth of data: 0x40044011/0xC385, 0x40244011/0xC389)

  and at dword_811F204 (0x6E/0x4078406E, 0x84C3/0x988009) -- in practice it loops exactly

  twice over each table (8 bytes per entry), passing (a, b, 0, 1) into sub_802FE28

  for each pair. The (0, 1) tail arguments are likely a "clear/notUsed" and a "set/enable"

  flag. sub_802FE28 has signature "(u32 a1, u16 a2, int notUsed, int a4) -> void" and

  acts as a generic HW/state-pair setter; the patterns 0x40xx40yy are typical GBA

  register-mirror addresses used by the I/O init code. Naming is therefore "load

  these I/O/state parameter pairs once at boot/reset".

  '
