name: battle_sweepPanelStep
address: '0x080D2222'
kind: function
status: probable
summary: Per-frame step that drives a battle object horizontally toward a target panel column; once it
  reaches or passes that column, it shifts one panel vertically (up or down depending on target Y), snapping
  to panel coords and alternating direction next call.
interface: (r5 = battle object whose ExtraVars hold target panel X at +0x12, target panel Y at +0x13,
  speed at +4, phase flag at +8) -> void; r0/r1/r3/r4 clobbered
details: 'Reads the object''s facing via object_getFrontDirection (+1/-1 from alliance and DirectionFlip).
  If the phase flag (ExtraVars+8) is clear, it sets XVelocity = dir * speed (ExtraVars+4), zeroes YVelocity,
  and sets the flag to 1. Once the flag is set, it computes (targetX(+0x12) - PanelX) * dir; if that is
  still negative, or targetY(+0x13) equals PanelY, it keeps advancing horizontally. Otherwise it has passed
  the target column: it sets YVelocity = speed, negated when targetY < PanelY (moving up), zeroes XVelocity,
  snaps pixel coords via object_setCoordinatesFromPanels, and clears the flag so the next call resumes
  horizontal motion. The result is a zig-zag sweep toward a goal panel row, one column past each target
  column before stepping vertically.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r1,[r1,#0x12] / sub r1,r1,PanelX / mul r1,r4 / blt — target-panel-X check scaled by facing
    direction; ldrb r1,[r1,#0x13] vs PanelY compare gates the vertical step; str r3,[r5,#oBattleObject_YVelocity]
    with neg when target above — vertical speed from ExtraVars+4; str r0,[r5,#oBattleObject_XVelocity]
    with mul r0,r1 from object_getFrontDirection — horizontal phase; str r1,[ExtraVars+8] toggles 0/1
    between the two phases, then object_setCoordinatesFromPanels snaps position
  refs:
  - bn6f/asm/asm31.s:56491
  - 0x080D2176 sub_80D2176
  - 0x0800E2CA object_getFrontDirection
  - 0x0800E29C object_setCoordinatesFromPanels
  reproduce: python3 tools/asmcat.py 0x080D2222
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposed behavior: at loc_80D2260 it sets XVelocity = dir*ExtraVars+4 and clears
    YVelocity; when (targetX-PanelX)*dir >= 0 and targetY != PanelY, it sets YVelocity = +/-ExtraVars+4
    (negated when targetY<PanelY per cmp bgt at 0x80D224C), zeroes XVelocity, snaps coords, and clears
    the flag. The flag clear sets phase to 0, so the next call resumes horizontal motion—zig-zag sweep
    fits. However, the path from sub_80D2176 plus the name ''battle_sweepMoveStep'' implies a per-frame
    steering step for a battle animation/AI sweep. A better name reflecting zig-zag column-and-row traversal
    is battle_sweepPanelStep.; run wf investigate investigate-20261018-200615; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
