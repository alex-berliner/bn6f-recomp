summary: Guarded setter for an object whose type word is 'Smsh' — writes a 16-bit value into two fields and a fixed
  0x100 into a third.
interface: void sub_814E87C(SmshObj* obj, u16 value) // also returns return address in r0 and clobbers r2-r3; sets
  flags
details: 'Takes an object pointer in r0 and a value in r1 (treated as a halfword via

  lsl #16 / lsr #16). Reads the 32-bit type/magic ID at obj+0x34 and only acts

  if it equals 0x68736D53, i.e. the ASCII bytes "Smsh" (little-endian ''S'',''m'',''s'',''h''),

  so this is a type-checked update for one specific effect/entity kind

  (the tag reads like "smash", plausibly a smash/impact effect object).

  On match it stores the halfword value into both obj+0x24 and obj+0x26

  (two separate u16 fields set to the same value), and stores the constant

  0x100 into the u16 at obj+0x28 (built as mov #0x80; lsl #1, which also

  clears the carry flag from the pre-shift top bit). If the magic does not

  match, the function does nothing but return.

  Quirks: it does the classic "push {lr} / pop {r0}; bx r0" return, so the

  architectural return value in r0 is the caller''s return address, not a

  meaningful result; r2 and r3 are clobbered; NZCV are left reflecting the

  magic-ID comparison (or the lsl that built 0x100 on the match path), even

  though callers presumably ignore them.

  The +0x24/+0x26/+0x28 field semantics (position pair? animation/counter

  fields?) are not pinned down; 0x100 could be a timer, animation frame

  counter or similar.

  '
