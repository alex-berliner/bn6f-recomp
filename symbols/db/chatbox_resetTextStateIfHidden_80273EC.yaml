name: chatbox_resetTextStateIfHidden_80273EC
address: '0x080273EC'
kind: function
status: confirmed
summary: If the chatbox is not currently flagged as shown, resets the textbox object's active text state and then
  runs its per-frame update.
interface: void chatbox_resetTextStateIfHidden(S20364C0 *self /* in r5 */) ; reads eFlags2009F38 bit 0x80, returns
  nothing
details: 'Operates on the textbox/chatbox object S20364C0 passed in r5. First calls chatbox_mask_eFlags2009F38(0x80)
  to test the chatbox "shown/active" global flag. If that flag is clear (chatbox not currently shown), it resets
  the text state: copies the byte stored at offset +0xD (the saved line count/character position) into the active
  slot at offset +1, and clears the halfword at offset +2 (a character/timer counter used while text is being displayed).
  If the chatbox is already shown, the state fields are left untouched. In both cases it tail-calls sub_8029C08
  with the same object in r5 to advance/update the textbox. Quirk: the reset only fires when the box is hidden,
  so this looks like an initialize-on-show entry point that seeds the active text position from the saved value
  at +0xD.'
