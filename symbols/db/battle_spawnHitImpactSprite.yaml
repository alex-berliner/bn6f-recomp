- method: assembly-reading
  date: '2026-10-21'
  detail: 'ldr of NameID, Alliance, DirectionFlip and fixed slot #5 fed to getBattleArmPositionMaybe_8018810;
    bl battle_spawnObject6B_linkRelated_80E8124 spawns type 0x6B with caller''s r5 linked as RelatedObject1Ptr;
    Caller at 0x080F21C6 runs after damage is applied and anim 0x1F (hit react) is set, before PlaySoundEffect(HIT_6B)
    — consistent with spawning the hit-impact sprite; Object type 0x6B reused here as a hit-impact effect,
    parented to the damaged object so it follows'
