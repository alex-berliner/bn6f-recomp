name: battle_spawnHitImpactSprite
address: '0x080F22DA'
kind: function
status: probable
summary: Spawns the hit-impact effect sprite (object type 0x6B) at the damaged object's arm slot 5, linked
  as RelatedObject1.
interface: (r5 = damaged battle object) -> battle object type 0x6B spawned at arm slot 5; void
details: Reads oBattleObject_NameID, oBattleObject_Alliance, and oBattleObject_DirectionFlip from the
  target battle object at r5 to compute the mirrored attach offset for fixed slot id 5 via getBattleArmPositionMaybe_8018810.
  The offset (x<<16, y<<16) plus direction are passed to battle_spawnObject6B_linkRelated_80E8124, which
  spawns object type 0x6B at that position and stores r5 into the new object's RelatedObject1Ptr so the
  impact sprite tracks its parent.
