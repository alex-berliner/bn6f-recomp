  date: '2026-10-19'
  detail: ldrb r0/[r5,#oBattleObject_PanelX], ldrb r1/[r5,#oBattleObject_PanelY] supply the spawn panel
    from the moving object; ldr r6,[r7,#oAIAttackVars_Damage] passes the attack's damage to the collision
    region; ldr r4,=0x6050A01 fixed packed constant suggests fixed hitbox shape/type; bl object_spawnCollisionRegion
    is the sole callee, a known hitbox-spawning helper; only caller ai_attackDashAdvanceStep runs this
    during the dash/advance phase of the attack
