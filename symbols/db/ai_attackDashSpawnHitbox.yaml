name: ai_attackDashSpawnHitbox
address: '0x080F149C'
kind: function
status: probable
summary: Thin wrapper that spawns the dash attack's damage collision region at the battle object's current
  panel, sourcing the init flag/damage from the oAIAttackVars struct and a fixed size/type constant 0x6050A01.
interface: (r0 = object PanelX, r1 = object PanelY; r2 = oAIAttackVars_InitFlag, r3 = 0, r4 = packed params
  0x6050A01, r6 = oAIAttackVars_Damage, r7 = 1) -> r0 = spawn result from object_spawnCollisionRegion
details: Thin wrapper that sets up a call to object_spawnCollisionRegion. It takes the battle object's
  current PanelX/PanelY (from r5) as the hitbox position, copies the attack's init flag from the oAIAttackVars
  struct and the attack damage from oAIAttackVars_Damage, and passes a fixed packed constant 0x6050A01
  (likely encoded size/type/faction fields for the region) plus 1 in a spare register. r3 is zero, probably
  a callback or extra param. Called from ai_attackDashAdvanceStep, so this creates the hitbox that damages
  the player as the dashing enemy slides into his target panel.
