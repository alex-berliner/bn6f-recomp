name: object_checkStatePanel
address: '0x080F55AC'
kind: function
status: probable
summary: Returns whether a fixed panel, chosen per object state from a 2-byte coordinate table, currently
  passes the panel-flag test.
interface: (r0 = none; uses r5 object) -> r0 = 1 if panel at table-selected (x,y) matches required flag
  state, else 0
details: 'Reads the object''s state byte at [r5,#0x16], doubles it to index the table at byte_80F55D0,
  and loads a two-byte pair from that entry. It pushes those bytes to preserve them across the call, then
  invokes object_checkPanelParameters with the pair as (x,y) panel coordinates; the push/pop pair around
  the call is only to keep the original bytes alive, not an argument spill. The table holds two entries:
  (1,2) and (6,2), so two distinct states check two distinct panels. It returns the callee''s boolean
  unchanged when true, otherwise forces 0 via tst/bne. The object pointer r5 comes from the caller''s
  context, so the caller is unknown.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#0x16]; lsl r0,r0,#1 indexes byte_80F55D0 by state*2; table byte_80F55D0 = 1,2,6,2:
    two (x,y) coordinate pairs; bl object_checkPanelParameters with pair loaded into r0/r1 as coordinates;
    tst r0,r0 / bne / mov r0,#0 normalizes the return to 0/1'
  refs:
  - bn6f/asm/asm31.s:133476
  - 0x0800CC86 object_checkPanelParameters
  reproduce: python3 tools/asmcat.py 0x080F55AC
