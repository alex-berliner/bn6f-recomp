summary: Thin wrapper around sub_803BA84 that forwards a constant (0x30, 0x50, 0x20, 0x10) argument tuple.
interface: void sub_803BA64(void);  // r5 in; r1,r2,r3,r5 out; r0,lr,nzcv clobbered; r4,r6,r7 preserved
details: 'A four-instruction wrapper: sets r0..r3 to fixed constants 0x30/0x50/0x20/0x10 and tail-calls

  sub_803BA84 (the BL is the last meaningful instruction before the {r4-r7,pc} return). No local

  stack is used, and r5 is the only callee-tracked register mentioned in the contract — it is

  passed through unchanged by virtue of the matching push/pop pair, not explicitly handled.

  The semantic meaning of the four constants depends entirely on what sub_803BA84 does with

  them; without a name for that callee this layer is opaque (likely an MMBN-style

  width/height/x/y or "x0./y0./w/h" quadruple for a sprite, tile, or box primitive, given the

  values are all small even multiples).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
