open_questions:
- What 0x020352E0 is officially called (it lives next to other battle state buffers; likely a
- per-battle custom-arm slot table).  Settled by checking which routine consumes [slot+1] and
- '[slot+2] as screen offsets.'
- The "no free slot" path silently returns 1; whether callers retry, drop the arm, or rely on
- the first-pass early-out is not visible from this function alone.
