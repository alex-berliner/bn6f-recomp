    attachment placed at parent''s arm offset; mov r1,#0x28; mul r1,r0 (object_getFrontDirection) subtracted from
    oBattleObject_X16: object shifted 40px behind parent''s facing; ldr r0,[r5,#oBattleObject_RelatedObject1Ptr]:
