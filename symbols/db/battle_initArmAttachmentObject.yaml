open_questions:
- No caller is known, so which gameplay feature spawns this object (which chip/attack uses sprite id 0x80/0x43)
  is unknown
- What sub_80D7E7A does after the state write (further per-frame init or first update step) is not shown
- Whether 0x28*frontDirection is meant to center the sprite behind the parent or align its arm slot needs frame
  data to confirm
