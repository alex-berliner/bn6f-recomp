name: battle_initArmAttachmentObject
address: '0x080D7E08'
kind: function
status: probable
summary: Initializes a battle object as a sprite attachment placed at its parent's arm position, then hands it to
  its update state.
interface: (r5 = battle object header, no args) -> r0 = sub_80D7E7A result; object left in CUR_STATE_UPDATE phase
details: Loads sprite family (0x80, 0x10, 0x43) into the object via sprite_load and sprite_noShadow, sets oObjectHeader_Flags
  bit 1, resets CurAnim/CurAnimCopy to 0, and applies animation, palette 0 and facing from object_getFlip. It copies
  oBattleObject_Param1 into Timer and recomputes pixel coords from panel grid. It then reads the parent in oBattleObject_RelatedObject1Ptr
  (its NameID, Alliance, DirectionFlip) to fetch the arm-attachment offset via getBattleArmPositionMaybe_8018810,
  adds that to the object's X/Z, and additionally shifts X by -0x28*frontDirection so it sits behind the parent.
  Finally it writes CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized and tail-calls sub_80D7E7A.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl sprite_load with r0=0x80, r1=0x10, r2=0x43 plus sprite_noShadow: fixed sprite resource ids for this
