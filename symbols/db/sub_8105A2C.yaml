name: sub_8105A2C
address: '0x08105A2C'
kind: function
status: probable
summary: 'AI attack state-machine step: on first call commits the object''s move to the target panel (jump/lunge
  attack), then counts down a short timer and arms the attack''s hit element.'
interface: (r5 = battle object, r7 = oAIAttackVars) -> r0 = destroyed; updates object panel/anim/collision flags
  and AI vars
details: r7 points to an AI attack-variable block and r5 to the acting battle object. If oAIAttackVars_AttackElement
  is 0 (attack not yet started), it sets AttackElement=4, plays animation 0x16 on the object, copies FuturePanelX/Y
  into PanelX/Y, releases the reserved target panel via object_removePanelReserve, recomputes pixel coordinates
  and collision panels for the move, clears flag 0x40 in CollisionData ObjectFlags1, and sets ObjectFlags1 bit 1<<OBJECT_FLAGS_CURRENTLY_MOVING_1,
  plus StepTimer=4. On subsequent calls it decrements StepTimer; when it hits zero it stores 0xC into oAIAttackVars_HitElement,
  presumably so a later step applies the actual damage/effect. Element value 4 and hit element 0xC are game-specific
  constants for this enemy's attack type.
