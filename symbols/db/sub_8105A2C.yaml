    — commits the planned move; object_clearFlag 0x40 and object_setFlag1 1<<OBJECT_FLAGS_CURRENTLY_MOVING_1 mark
    the object as in motion; strh #4,[r7,#oAIAttackVars_StepTimer] then decrement loop ending in strh #0xc,[r7,#oAIAttackVars_HitElement]
