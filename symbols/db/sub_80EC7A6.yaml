name: sub_80EC7A6
address: '0x080EC7A6'
kind: function
status: confirmed
summary: Dispatches to one of two AI-attack handlers via a small jump table selected by a byte in the AI's attack-variable
  block.
interface: 'void dispatchAIAttackHandler(void) /* inputs: r5 r6 r7 r10 lr; outputs: r1 r5 r8 r9 r10 r11 r12; clobbers
  NZCV r0 r2 r3 r4 r6 r7 lr */'
details: 'r7 points at the AI''s attack-variable block. The byte at offset oAIAttackVars_Unk_00

  indexes a two-entry 32-bit jump table at off_80EC7B8 (entries:

  sub_80EC7C0+1, sub_80EC81E+1). The function performs a Thumb-style

  dispatch via `mov lr, pc; bx r1`, so the routine acts as a tail call:

  the handler''s register outputs (r1, r5, r8-r12) are this function''s

  outputs. The surrounding `push {lr}` / `pop {pc}` only saves the return

  address around the dispatch, since r7/r10 are caller-saved across the

  tail call in the original calling convention.

  '
