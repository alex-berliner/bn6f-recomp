name: sub_8132F78
address: '0x08132F78'
kind: function
status: hypothesis
summary: Reads a BCD-coded 4-digit counter (most plausibly the in-game clock, HHMM) and stores its two digit-pairs
  as binary numbers in the Unk200a220 work structure.
interface: void sub_8132F78(void); /* r10 = toolkit; no register return value, flags clobbered */
details: 'Loads the toolkit''s S2001c04 pointer (r10 + oToolkit_S2001c04_Ptr), fetches the word at +0x18 of that
  structure, and passes it to memory_bcd_8000D84, which returns a BCD value in r0. Only the upper 16 bits of the
  result are used; they are treated as four packed BCD nibbles (digits 3..0). Each byte pair is converted to a plain
  0..99 number (tens*10 + ones) by an inlined bcd_byte_to_number: the low pair (digits 1..0) is stored at Unk200a220+0xC
  and the high pair (digits 3..2) at Unk200a220+0x8 (r10 + oToolkit_Unk200a220_Ptr). The low 16 bits of the BCD
  value are computed but discarded, suggesting a larger time/counter field (e.g. seconds/frames below the HHMM).
  r4-r7 are pushed/popped only to satisfy the ABI; they are never used. No branch or flag outputs matter.

  '
