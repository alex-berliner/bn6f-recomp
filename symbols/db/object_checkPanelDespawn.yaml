name: object_checkPanelDespawn
address: '0x080D94C2'
kind: function
status: probable
summary: 'Battle-object upkeep: clears the object''s collision region and sets CurAction=4 when its panel
  is intact (panel flags & 0xF880 == 0), bypassing if battle pause doesn''t match the per-object ExtraVars+8
  word.'
interface: (r5 = battle object) -> void; sets oBattleObject_CurAction = 4 when panel flags & 0xF880 are
  nonzero
details: Reads battle_isPaused() and compares it to the word at oBattleObject_ExtraVars+8 on the r5 object;
  only proceeds when equal (likely an 'active-while-paused' flag stored per object). It then calls object_clearCollisionRegion
  to remove the object from its collision region, fetches the panel status via object_getPanelParameters
  using oBattleObject_PanelX/PanelY, masks with dword_80D9548 (0xF880 — destroyed-panel/hole status bits),
  and on a nonzero result stores 4 into oBattleObject_CurAction, presumably a fall/despawn action. If
  the panel is intact or the pause check fails, it does nothing this call.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl battle_isPaused / cmp r0, r1 against [r5,#oBattleObject_ExtraVars+8] gates the whole body;
    bl object_clearCollisionRegion runs before the panel check, detaching the object from collision; ldrb
    PanelX/PanelY + bl object_getPanelParameters fetches the panel status word under the object; and r0,
    dword_80D9548 (=0xF880) / bne tests destroyed-panel flags only; mov r0,#4; strb [r5,#oBattleObject_CurAction]
    stores action 4 (fall/despawn) as the outcome
  refs:
  - bn6f/asm/asm31.s:72160
  - 0x0800A03C battle_isPaused
  - 0x0801A074 object_clearCollisionRegion
  - 0x0800C8F8 object_getPanelParameters
  reproduce: python3 tools/asmcat.py 0x080D94C2
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal''s mask direction is wrong: the code does `and r0, r1` then `bne locret`, meaning the
    function returns WITHOUT setting CurAction when panel flags & 0xF880 are nonzero; CurAction=4 is only
    set when those bits are zero (panel is intact). The proposal claims the opposite. Name is otherwise
    reasonable since it fixes collisions and changes action on panel status.; run wf investigate investigate-20261018-230610;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
open_questions:
- No known callers, so what object type uses this and what action 4 means (fall into hole vs despawn)
  is unconfirmed
- Exact meaning of the pause-match field at oBattleObject_ExtraVars+8
- 'The proposal''s mask direction is wrong: the code does `and r0, r1` then `bne locret`, meaning the
  function returns WITHOUT setting CurAction when panel flags & 0xF880 are nonzero; CurAction=4 is only
  set when those bits are zero (panel is intact). The proposal claims the opposite. Name is otherwise
  reasonable since it fixes collisions and changes action on panel status.'
