name: battle_startAttack33
address: '0x0802ED68'
kind: function
status: probable
summary: Clears the current battle entity's attack-state fields and queues attack 0x33 on it, used from
  the charge-shot setup path.
interface: (r6 = battle entity struct pointer, set by caller; no register args) -> r0 = 0, r1 = 0
details: The function takes no arguments in registers; the caller must place the entity pointer in r6
  before calling. It zeroes the byte fields at struct offsets 0x2, 0x3, 0x4, 0x5, the halfwords at 0x6,
  0x8, 0xA, and the word at 0xC — i.e. the attack-state/counter block near the start of the entity struct
  — then calls object_setAttack0 with attack ID 0x33. It always returns 0 in r0 and 0 in r1 (no failure
  path). Given the sole caller is battle_chargeShotSetup (which otherwise sets default charge state and
  fires attack 0x11), this is the alternate path that launches attack 0x33 as a freshly initialized attack.
