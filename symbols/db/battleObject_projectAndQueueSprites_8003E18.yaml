summary: Walks all alive battle objects, projects/culls + uploads GFX + queues OAM for visible ones
interface: (none) -> (none) ; consumes r10 (toolkit pointer) and walks the battle-object pointer table;
  OAM is queued
details: "Reads the alive-battle-object count from byte_2036778 and the per-frame pointer table at\ndword_2039A10\
  \ (4 bytes per object slot). Iterates from the highest index down to 0:\n  - if the top two bits of\
  \ the object's Flags byte (offset 0) are 0b11, treat it as hidden-with-\n    ready-gfx: project/cull\
  \ via sprite_projectAndCull, then sprite_ensureGfxResident (r0 = #1),\n    then queue frame pieces with\
  \ sprite_queueFramePieces (r0 = #2, r1 = #0x40).\n  - if only bit 0 is set (active), zero [r0+0x90+0x24]\
  \ then skip all sprite work.\n  - otherwise (bit 1 set, bit 0 clear): project/cull then skip ensureGfx/queue.\n\
  After the loop calls sprite_recordPaletteCountToGroupSlot_80028C0(r0=1), saving the current\nqueued-sprite\
  \ palette count at group-slot 1 of byte_200F389. r10 is the Toolkit (via\nCurFramePtr etc.) but here\
  \ only the battle-object table globals are read.\n"
