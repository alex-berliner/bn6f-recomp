name: battle_highlightTwoVerticalPanels
address: '0x080BB1D8'
kind: function
status: probable
summary: Object update step that highlights a panel and the one below it (1x2 area) on the object's side
  of the grid.
interface: (r0 = battle object in r5, no args) -> void; highlightPanelIfSomeCondition_8109660 called with
  (x, y, type=2, alliance)
details: 'Reads oBattleObject_Timer2 and exits if bit 2 is set, so the highlight refresh is gated to a
  subset of frames. Loads the panel coordinates from oBattleObject_ExtraVars+0x14 (x/base) and +0x18 (y/base).
  Calls highlightPanelIfSomeCondition_8109660 with r2=2 (highlight style) and r3=oBattleObject_Alliance
  to pick the field side. Then repeats the call with y+1, marking the panel directly below. Net effect:
  a persistent two-panel vertical highlight tied to this object, refreshed on frames where Timer2 bit
  2 is clear.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'tst r0,#4 / bne skip: highlight refresh only runs when Timer2 bit 2 is clear (asm lines 2-5);
    two calls to highlightPanelIfSomeCondition_8109660 with identical r0/r2/r3 but r1 and r1+1: same panel
    and the one below; coords come from oBattleObject_ExtraVars+0x14/+0x18 and side from oBattleObject_Alliance
    (asm lines 6-9, 10-14); highlight mode r2=2 matches the highlight style parameter documented for highlightPanelIfSomeCondition_8109660'
  refs:
  - bn6f/asm/asm31.s:6665
