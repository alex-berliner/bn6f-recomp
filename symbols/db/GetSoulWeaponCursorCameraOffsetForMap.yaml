name: GetSoulWeaponCursorCameraOffsetForMap
address: '0x0814283C'
kind: function
status: confirmed
summary: Returns the (X, Y) cursor camera offset for the player's current soul-weapon map by indexing a per-map
  table with the result of GetSoulWeaponsMapIndex.
interface: void getSoulWeaponCursorCameraOffsetForMap(void) -> r0 x_offset (s32, signed byte), r1 y_offset (s32,
  signed byte); preserved r4-r7; clobbers nz,cv,r3,lr; r10 passed in/out unchanged
details: 'Calls GetSoulWeaponsMapIndex() (return value in r0, no typed C interface available) to obtain a map index,
  then shifts that index left by 1 to index into the 16-entry signed-byte table SoulWeaponMapBasedCameraOffsets
  at 0x08142854. Each entry is a pair of s8 values (X, Y). The two bytes are loaded with ldrsb into r0 and r1 (sign-extended
  to 32 bits) and returned as the cursor''s X and Y camera offset. The table pairs observed at 0x08142854 are (0,0),
  (8,-8), (-8,8), (8,8), (8,8), (16,0), (12,4), (4,-4). Frame is push r4-r7,lr / pop r4-r7,pc.

  '
