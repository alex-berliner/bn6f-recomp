open_questions:
- How many entries does SoulWeaponMapBasedCameraOffsets actually contain? The pool only commits 8 of what the surrounding
  code suggests may be 16 entries; the readable C only references 8 pairs.
- Which map index each table row corresponds to (mapping of GetSoulWeaponsMapIndex values to per-map offsets) is
  not annotated in the source.
- Exact use site of the returned offsets by the caller is unknown; whether they are applied to the cursor sprite's
  camera register, a scroll offset, or a layer transform has to be inferred from the caller.
