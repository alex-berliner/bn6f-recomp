summary: 'Proposed name: beastSpTransformTiles. 32-byte tile graphics asset for the Beast SP transform
  animation, queued into VRAM tile buffer 0x3001B00. (u8)'
details: ROM data of 0x20 bytes, exactly the size passed as the queued_size argument to QueueEightWordAlignedGFXTransfer
  in beastSp_startTransformSequence. It is read once and queued as the source of a GFX transfer into byte_3001B00
  (the EWRAM/VRAM tile staging area used by the same transform sequence). No function writes to it, since
  it is a graphics asset in ROM. The bytes themselves are mostly zero with a single non-zero dword (0x7DC00000
  little-endian) at offset +2, consistent with 4bpp GBA tile data rather than a numeric table.
