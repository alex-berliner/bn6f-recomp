open_questions:
- What sub_80CA408 (the action-specific handler dispatch target) actually does is unknown from this frame
  alone; its behaviour likely depends on CurAction and is the main unknown.
- The precise meaning of the 0xff800000 mask on FlagsFromCollision (which bits represent "this object
  took a hit this frame") is not pinned down by this assembly.
