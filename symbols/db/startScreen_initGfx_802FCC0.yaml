name: startScreen_initGfx_802FCC0
address: '0x0802FCC0'
kind: function
status: confirmed
summary: Initializes the title-screen graphics by clearing VRAM, decompressing the start-screen asset tables, and
  zeroing the 0x30025c0 GFX region.
interface: void startScreen_initGfx_802FCC0(void)
details: "Performs three sequential steps using a table of init records stored adjacent to\nthe function at initRefs_802FCD8\
  \ (referenced via off_802FCD4). Each record is a\ntriple of (src_compressed_or_raw_data, dst_ptr, size_or_flag)\
  \ and is consumed by\ndecompAndCopyData:\n  1. comp_87F36A0 (compressed, 0x8000000 flag set) -> VRAM 0x6013000,\
  \ decompresses into eDecompBuffer2013A00.\n  2. byte_87F40F4 (raw, 0xA0 bytes)              -> byte_3001610.\n\
  \  3. comp_87F3370 (compressed, 0x8000000 flag set) -> VRAM 0x6010020, decompresses into eDecompBuffer2013A00.\n\
  \  4. dword_87F3620 (raw, 0x80 bytes)              -> byte_3001590.\n  5. comp_87F4394 (compressed, 0x8000000\
  \ flag set) -> VRAM 0x6000000, decompresses into eDecompBuffer2013A00.\n  6. dword_87F4194 (raw, 0x1C0 bytes)\
  \             -> palette_3001960 (palette data).\n  7. byte_86A48C0 (raw, 0x180 bytes)              -> VRAM 0x6012800\
  \ (tile data).\n  8. dword_86A5500 (raw, 0x20 bytes)              -> byte_3001570.\n  Terminated by a NULL sentinel\
  \ entry.\nAfter copying, ZeroFillGFX30025c0 clears the WRAM GFX region at 0x30025c0 used\nlater by the title screen.\n\
  Register contract: takes no arguments (r10/lr unused as inputs), clobbers r0-r3\nand flags, preserves r4-r7. Output\
  \ registers r2/r5/r7 are simply left over from\nthe helpers and are not meaningful. The initRefs table itself\
  \ lives in the\nROM-side .rodata embedded right after the function.\n"
