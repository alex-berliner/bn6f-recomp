name: battle_delayedKillRelatedObject
address: '0x080C4AAC'
kind: function
status: probable
summary: Battle object state handler that waits ~30 frames, then uses its linked object's identity for
  a spawn/notify call, deletes that linked object, and destroys itself.
interface: (r5 = battle object pointer, implicit) -> r0 = 0; object set to CUR_STATE_DESTROY
details: 'On first invocation (PhaseInitialized==0) it stores a 30-frame timer and marks phase 4; otherwise
  it decrements the timer and returns until it expires. When the timer hits zero it clears flag bit 2
  in oObjectHeader_Flags, loads oBattleObject_RelatedObject1Ptr, unpacks that object''s {version, actor
  type, AI index} from its NameID, calls sub_8011044 with r2=1 using those values, kills the related object
  (with dependents), zeroes the byte pointed to by oBattleObject_ExtraVars, and finally sets its own state
  word to CUR_STATE_DESTROY. So this is a timed ''detonate/dismiss'' step for an object pair: after a
  fixed delay the paired object is removed and the owner follows it into destruction.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'first-run branch: mov r0,#0x1e; strh r0,[r5,#oBattleObject_Timer]; mov r0,#4; strb r0,[r5,#oBattleObject_PhaseInitialized];
    timer countdown with ''sub r0,#1 ... bgt locret'' delays all remaining work until expiry; unpackVerActorTyAndAIIdx_800F29C
    is fed RelatedObject1Ptr''s oBattleObject_NameID, then sub_8011044 called with r2=1; bl battle_killObjectWithDependents
    on [r5,#oBattleObject_RelatedObject1Ptr] removes the linked object; mov r0,#CUR_STATE_DESTROY; str
    r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized] ends the owner object'
  refs:
  - bn6f/asm/asm31.s:27829
  - 0x080E13DC battle_killObjectWithDependents
  - 0x0800F29C unpackVerActorTyAndAIIdx_800F29C
