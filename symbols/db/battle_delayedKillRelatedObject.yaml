    run wf investigate investigate-20261019-003606'
open_questions:
- What sub_8011044 does with the unpacked actor data and the r2=1 argument (spawn? event dispatch?), which
  would sharpen whether this is a spawn-then-delete sequence
- Which gameplay entity uses this handler and what the RelatedObject1 pair represents in practice, since
  no callers are known
