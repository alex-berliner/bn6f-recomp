name: object_dispatchStep
address: '0x080AA058'
kind: function
status: probable
summary: Dispatches to an object's per-state step handler by indexing a function table with the state
  byte at [r5,#8] and tail-calling the selected handler.
interface: (r0 = unused/scratch, r5 = object pointer with state id at +0x8) -> r0 = whatever the state
  handler returns; no flags
details: 'This is a small state-machine dispatcher. It loads a table base (off_80AA068 -> off_80AA06C),
  indexes it with the object''s state byte at [r5,#8], and jumps to the handler with lr set to the return
  address (mov lr, pc; bx r0), so the handler returns here and the wrapper just pops back to its caller.
  The table has three entries: object_initSprite (state 0, one-time setup), object_stepApproachTarget
  (walking toward a target), and sub_80AA0FC (a third state''s behavior). r0 is not used as an argument;
  r5 is the implicit object pointer, a convention shared by object step routines.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r1,[r5,#8] + ldr r0,[r0,r1] indexes the handler table by the object's state field; mov
    lr, pc; bx r0 performs a tail-call to the selected handler and returns to the pop {pc}; table entries
    object_initSprite and object_stepApproachTarget are existing named object subsystem routines; recorded
    execution only on maps, consistent with an overworld object/NPC updater
  refs:
  - bn6f/asm/asm29.s:10177
  reproduce: python3 tools/asmcat.py 0x080AA058
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal: it loads a dispatch table at off_80AA06C, indexes it by state byte
    at [r5,#8], and tail-calls the handler via ''mov lr, pc; bx r0'', then pops pc to return to the wrapper''s
    caller. However, the name ''object_stepByState'' and the ''r0 = unused/scratch'' claim are inaccurate:
    r0 is actually used as the table base pointer, and there are three entries (not just three names—it''s
    exactly three here). A name like ''object_dispatchStep'' better reflects the dispatch nature.; run
    wf investigate investigate-20261018-212108; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
