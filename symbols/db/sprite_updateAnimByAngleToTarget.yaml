name: sprite_updateAnimByAngleToTarget
address: '0x080A5E08'
kind: function
status: probable
summary: Picks an object's animation from the octant of the angle toward a target position, reapplying
  sprite state only when the chosen animation changes.
interface: (r0 = target x, r1 = target y; r5 = object pointer) -> r0 = clobbered; updates object sprite
  animation, shadow flag, and cached anim index at r5+0x34
details: Subtracts the object's position fields at r5+0xc (x) and r5+0x10 (y) from r0/r1 and calls battle_calcAngleOctant_800118A,
  returning early for octant 0 (zero vector). The octant 1..4 indexes byte_80A5E3C, a LUT {_,2,2,0,6,...}
  mapping directions to animation indices. The mapped value is compared with the last-chosen index cached
  at r5+0x34; if unchanged the routine does nothing more. Otherwise it calls sprite_setAnimation (writes
  the index into the sprite slot), sprite_loadAnimationData, and sprite_noShadow, then stores the new
  index at r5+0x34. All three callees operate on the object held in r5. The early-out makes it an idempotent
  per-frame direction/animation refresh.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: sub r0,r0 / sub r1,r1 vs [r5,#0xc],[r5,#0x10] then bl battle_calcAngleOctant_800118A — angle
