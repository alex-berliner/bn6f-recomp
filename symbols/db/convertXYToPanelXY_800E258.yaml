name: convertXYToPanelXY_800E258
address: '0x0800E258'
kind: function
status: confirmed
summary: Converts a screen-space pixel position into battle-field panel (column, row) coordinates.
interface: int battle_ScreenXYToPanelXY(int screenX_16p16, int screenY_16p16); /* returns r0 = panel column, r1
  = panel row; N/Z set from row, C/V clear */
details: 'Takes X and Y as 16.16 fixed-point screen coordinates (r0 = X, r1 = Y), keeps only the

  whole-pixel part via asr #16, then converts to panel grid coordinates used on the battle field.

  The field''s origin in screen space is +160 px in X (0xa0) and +32 px in Y (0x20); each panel is

  40 px wide (0x28) and 24 px tall (0x18), so panelX = (screenX >> 16 + 160) / 40 and

  panelY = (screenY >> 16 + 32) / 24. Both divisions are performed with the BIOS Divide routine

  (swi 6, quotient in r0, remainder in r1); the remainder is discarded. The panel column is saved

  on the stack across the second divide, then returned in r0 while the row is returned in r1.

  Note the ''mov r1, r0'' is actually an encoded ''lsls r1, r0, #0'', so it refreshes only N/Z from

  the panel row; the BIOS Divide leaves C/V clear, matching an ADDS-of-zero flag pattern.

  r5/r6 are preserved. No memory or structures are touched — pure coordinate math.

  '
