status: probable
summary: Validates an incoming script-position pointer (r2) by zeroing r3 if the address is outside the
  in-RAM script range, leaving r0 and r1 untouched.
interface: '(r0 = scratch/preserved, r1 = scratch/preserved, r2 = candidate pointer to validate, lr =
  return) -> r0 = preserved, r3 = 0 when r2 is outside the allowed range, else r3 untouched; side effects:
  none observable (push/pop of r0 only)'
details: "Saves r0 on the stack, then shifts r2 right by 0x19 to test whether any of the top\n  three\
  \ bits is set. If non-zero (i.e. the candidate address is a non-RAM value), r3 is\n  forced to 0 and\
  \ execution jumps to the pop/return. Otherwise r2 is compared against\n  the base of the script table\
  \ `off_81C0418` (loaded via the literal pool at\n  off_814E0CC): if r2 < base, r3 is zeroed; if r2 ==\
  \ 0 (i.e. low 14 bits clear the\n  other branch `lsr r2,#0xe` / `beq`), r3 is also zeroed. Otherwise\
  \ r3 survives as the\n  caller's value. Original r0 is restored from the stack and the routine returns\n\
  \  via `bx lr`.\n\n  In effect, the routine ensures that `r3` is zeroed when r2 lies outside the script\n\
  \  region `off_81C0418` (and is not in IWRAM/ROM-mapped ranges). Callers (notably\n  loadNextQueuedParams_814E190\
  \ and sub_814E0D0) feed `r3` through subsequent tables,\n  using the zero result to short-circuit a\
  \ branch.\n\n  Per-call captures show r0/r1 untouched (the saved r0 is restored), and r3 may be\n  observed\
  \ as 0 on exit only in the failure snapshots (the lifter's exit r3 not\n  shown above; the `out=['r0','r3']`\
  \ contract implies the zeroed r3 propagates).\n"
