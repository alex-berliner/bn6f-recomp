name: sub_803DEB4
address: '0x0803DEB4'
kind: function
previous_names: []
status: hypothesis
summary: Updates the battle camera/timer state each frame, advancing camera-shake countdowns and calling into sub-actions
  based on bit flags in the timer-enable word.
interface: (r0 = battle mode / scratch word) -> r0 = next state code (0, 1, 2, 4, 8 or 0x20)
details: "- On entry r0 is treated as a 32-bit scratch word whose bits 0..0x40 are interpreted:\n    bit 0x20 routes\
  \ through sub_803E018/sub_803E200 (the more complex sub-action), the rest are simple short-circuits.\n  - It calls\
  \ timer_IsEnabled_8144CE0 once up-front to read byte 2 of eTimerEnable200F460; if that byte\n    is 5 it short-circuits\
  \ returning r6=4 (and stores nothing further). The comparison is `cmp r0,#5`\n    and a `bne` falls through to\
  \ the normal path.\n  - The saved scratch word bit 0x04 drives an in-frame event: it tests EVENT_172F via\n  \
  \  TestEventFlagFromImmediate; if the flag is set AND eLinkState+0xC (described in this struct as a\n    halfword\
  \ near \"eCamera.unk_5C\") is nonzero, the function decrements that halfword; otherwise it\n    writes 1 to eLinkState+0x6\
  \ (a one-byte counter/flag, \"eCamera.pad_56\").\n  - Bit 0x08 triggers a different branch that writes 1 to eLinkState+0x6\
  \ and stores into eLinkState+0x7\n    either 0xFF (when that byte was already 2) or the timer's current byte 2\
  \ value.\n  - The base return is r6, initialised to 1; bit 0x20 routes via sub_803E018 and on a 2-result there\n\
  \    it also calls sub_803E200, mapping the latter's return (0 -> no change, 2 -> r6=0x20, 0x20 -> r6=4,\n   \
  \ anything else -> r6=8) into the caller's state code.\n  - If bit 0x20 is clear, the function exits with r6=1;\
  \ the only place r6 becomes 4 outside that path\n    is when bit 0x20 is set AND (a) sub_803E018 returned something\
  \ other than 2, OR (b) a final\n    check on eLinkState+0x5 (\"eCamera.unk_55\") finds it nonzero.\n  - The very\
  \ last write is `str r6, [r7,#0x48]` mirroring `eLinkState+0x48` (\"dword_2009A18 - 0x20099d0\")\n    using r0\
  \ recovered from the local stack via a `pop {r0}` between the two timerenable calls.\n  - This is a frame tick\
  \ handler; the *return code* is fed into sub_803EB04 (which adds an extra\n    sub_803ED1C call when this returns\
  \ 2). Captured-call evidence: r0=1 on exit across 40 story2\n    snapshots, with eLinkState+0x2 starting at 0x77/0x78\
  \ and shrinking by 1 per snapshot - exactly\n    what the EVENT_172F shake-timer decrement path would do.\n"
