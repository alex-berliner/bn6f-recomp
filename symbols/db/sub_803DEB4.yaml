open_questions:
- Whether eLinkState is genuinely a separate "link state" struct or whether the assembly comment "eCamera" implies
  aliasing with the Camera struct at the same base.
- The exact semantics of r6 return values (1, 2, 4, 8, 0x20) — the project notes for `battle_getLinkStateCode_803F560`
  mention it returns 0xFF, 0x80, or 0, so the codes here probably feed into that mapping rather than being the final
  value.
- What sub_8144250, sub_803E018 and sub_803E200 actually compute; only inferred from their inputs.
