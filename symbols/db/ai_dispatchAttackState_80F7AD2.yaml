name: ai_dispatchAttackState_80F7AD2
address: '0x080F7AD2'
kind: function
status: confirmed
summary: Trampoline that dispatches an enemy AI attack-state handler selected by the state byte in the
  AI attack vars struct.
interface: void ai_dispatchAttackState(void); /* r7 in = oAIAttackVars pointer; returns straight to this
  function's caller with r7 restored; r0 = selector byte, r1 = handler address on entry to handler; all
  other registers pass through the dispatched handler unchanged */
details: 'Pure trampoline. Reads the byte at [r7 + oAIAttackVars_HitElement/oAIAttackVars_Unk_00] (the
  attack-state selector, first field of the AI attack vars struct pointed to by r7), then uses that raw
  value as a BYTE offset (not an index) into the 6-entry handler table at off_80F7AE4 — the stored selector
  values are pre-multiplied by 4. Table targets: sub_80F7AFC (state 0), sub_80F7B70 (state 1), ai_attackEndStep
  (state 2), sub_80F7BBE (state 3), ai_panelAttackStep (state 4), ai_tickAttackElementTimer (state 5).
  The handler is invoked with `mov lr, pc; bx r1`, so lr points at this trampoline''s pop {r7,pc}; the
  handler returns through this trampoline''s epilogue, meaning r7 is restored even if the handler clobbers
  it, and execution returns directly to this function''s caller. The handler receives r0 = the selector
  byte it was dispatched with and r1 = its own address; all other registers (r2, r3, r5, r6, r10, flags)
  pass through untouched. Outputs r1/r5/r8-r12 are whatever the dispatched handler left in them.

  '
