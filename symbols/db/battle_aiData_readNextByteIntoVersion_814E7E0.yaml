open_questions:
- 'Exact semantic of byte 0x00: whether it really means "no more per-turn instructions, reset state for
  next turn" or is some sentinel like "end of action list". Looking at the caller sub_814E36D''s role
  (the AI dispatch loop) would settle this.'
- Whether the "Version_17" naming actually matches; the store is at r1+0x17, and AIData.Version_17 is
  at AIData+0x17, so the stream record in r1 is parallel to (and likely pointed at by) AIData.Version
  fields. Need a cross-reference from r0's AIData to r1 to confirm the relation.
