name: petNaviCheckElementChipLimits
address: '0x08120DAC'
kind: function
status: probable
summary: Checks whether a navi's regular/tag chip counts for a given element would exceed the NaviStats
  limits stored at stat bytes 0xB and 0xC.
interface: (r0 = element ID) -> r0 = 1 if either count exceeds its stat byte (0xB via selector 1, 0xC
  via selector 2), else 0; called after GetCurPETNavi snapshot
details: Reads the currently selected PET navi (GetCurPETNavi, kept on the stack), then calls sub_8120B28
  with selector 1 and r0=element and compares the result to NaviStats byte 0xB (GetCurPETNaviStatsByte(?,
  0xB)); if not greater, repeats with selector 2 against byte 0xC. sub_8120B28 evidently counts chips
  matching the element in one of two chip-slot categories (likely regular and tag slots). If the first
  count already exceeds the 0xB limit it skips the second check (early return path loc_8120DE6 with r7=1).
  Returns 1 only when an overflow would occur; 0 means both counts fit within the limits.
