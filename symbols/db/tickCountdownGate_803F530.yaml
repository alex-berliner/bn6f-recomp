name: tickCountdownGate_803F530
address: '0x0803F530'
kind: function
status: confirmed
summary: Per-tick countdown gate — while a flag byte at 200AD04 is set, checks a condition each tick and decrements
  a halfword counter at 200AD06, clearing the flag when the count runs out.
interface: 'void sub_803F530(void); returns condition via flags: Z set = countdown finished or inactive, Z clear
  = still counting (r6==1 internally)'
details: 'Reads the flag byte at byte_200AD04 (via notZero_eByte200AD04); if clear, does

  nothing and returns with Z set. If set, calls sub_803F560 as a per-tick

  approval check. On approval it decrements the halfword counter at

  word_200AD06 (the +2 field of the same work area); while the counter is still

  nonzero the flag byte is left alone and the call returns Z clear (still

  counting). When the counter reaches zero, or when sub_803F560 vetoes on the

  very first tick, the flag byte is rewritten via setByte_200AD04_803F4EC

  (r4=0 on expiry clears it, r4=1 on an immediate veto rewrites it set) and the

  call returns Z set. r4-r7 are preserved; the only state is the two-field

  record at word_200AD04 {u8 flag, u16 count} — a reusable delay/pause timer

  that some other system starts and this routine ticks down. Callers are

  expected to branch on the returned Z flag.

  '
