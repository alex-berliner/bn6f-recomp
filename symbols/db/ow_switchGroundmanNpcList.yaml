name: ow_switchGroundmanNpcList
address: '0x08143C62'
kind: function
status: probable
summary: Looks up the Groundman minigame result map index, swaps the overworld NPC spawn list to one of
  two hardcoded lists via npc_freeAllObjectsThenSpawnObjectsFromList, then sets event flag 1721.
interface: () -> r0 = undefined; sets EVENT_1721, replaces overworld NPC list via npc_freeAllObjectsThenSpawnObjectsFromList
details: Calls GetGroundmanMinigameMapIndex and uses the returned index to select from a two-entry table
  of NPC spawn lists (off_8143C80 -> off_8072C10 / off_8073650). It frees all current overworld NPC objects
  and spawns the chosen list via npc_freeAllObjectsThenSpawnObjectsFromList, then sets event flag EVENT_1721
  with SetEventFlagFromImmediate. r4-r7 are pushed but never used. The flag and NPC swap suggest a persistent
  state change marking the minigame outcome in the overworld.
