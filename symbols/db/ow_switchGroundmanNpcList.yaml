  date: '2026-10-18'
  detail: bl GetGroundmanMinigameMapIndex then lsl r0,r0,#2 / ldr r0,[r1,r0] indexes the table at off_8143C80;
    bl npc_freeAllObjectsThenSpawnObjectsFromList swaps the overworld NPC spawn list to the selected entry;
    bl SetEventFlagFromImmediate with EVENT_1721 records the resulting story/event state; table has exactly
    two entries (off_8072C10, off_8073650), matching a binary minigame outcome
