name: battle_runPhaseStep
address: '0x080DA266'
kind: function
status: probable
summary: 'Per-frame battle state-machine step: skips when time-stopped or an action change was just applied,
  otherwise dispatches to the handler for the battle object''s current phase.'
interface: (r5 = battle object) -> r0 = destroyed; returns early if time-stop active or pending action
  change was applied
details: Calls battle_isTimeStop and returns if it reports the battle frozen (bit 2 of battle flags).
  Then calls battle_objectApplyPendingActionChange; if it returns nonzero, a pending action change was
  applied (phase forced to 0) and this frame ends. Otherwise it reads oBattleObject_CurPhase from r5 and
  indexes a two-entry thumb handler table at off_80DA288 (phase 0 = sub_80DA290, phase 1 = sub_80DA2D8),
  calling it via mov lr, pc / bx r1 so the callee returns to this caller. The r5 base suggests the caller
  holds the battle object in a fixed register.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'bl battle_isTimeStop + tst/bne locret: returns without stepping when battle is frozen; bl battle_objectApplyPendingActionChange
    + cmp/bne: a just-applied action change ends the frame; ldrb r0,[r5,#oBattleObject_CurPhase]; ldr
    r1,[r1,r0]: dispatch table indexed by current phase; off_80DA288 has exactly two entries (sub_80DA290,
    sub_80DA2D8), so only phases 0 and 1 exist; mov lr, pc / bx r1: thumb-branch to per-phase handler
    with return into this function'
