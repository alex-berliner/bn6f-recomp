name: ai_attackPhaseStep
address: '0x080F16B4'
kind: function
status: probable
summary: 'AI attack routine step: counts a delay, then triggers the attack (anim 3, phase flag 4), and
  on the next delay expires exits the attack state.'
interface: (r5 = battle object, r7 = AI attack vars struct) -> r0 = result of object_exitAttackState;
  flags from timer countdown
details: 'Uses oAIAttackVars_AttackElement as a phase marker: while it is 0, StepTimer is decremented;
  on expiry the object''s CurAnim is set to 3, StepTimer is reloaded with 8, and AttackElement is set
  to 4 to arm the attack. Once AttackElement is nonzero, the same timer counts down again and calls object_exitAttackState
  when it reaches zero, ending the attack. The function keeps the timer state entirely in the r7 struct
  and never touches anything else, so it is a reusable wait-then-fire-then-clean-up step.'
