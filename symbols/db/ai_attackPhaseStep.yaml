- method: assembly-reading
  date: '2026-10-18'
  detail: 'tst r0,r0 / bne loc_80F16D2 branches on oAIAttackVars_AttackElement as a phase flag; strb #3,[r5,#oBattleObject_CurAnim]
    and strh #8,[r7,#oAIAttackVars_StepTimer] arm the attack after the first countdown; bl object_exitAttackState
    only runs when the second countdown reaches zero; only callees/callees list is object_exitAttackState,
    matching an attack-state teardown step'
