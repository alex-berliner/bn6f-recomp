name: battle_spawnObj56StoreRelatedObject2
address: '0x08011344'
kind: function
status: probable
summary: Spawns battle object type 0x56 linked to an owner and stores the new object pointer into the
  owner's RelatedObject2Ptr field.
interface: (r0, r1, r2 = value whose low half is packed with r0 into r4; r5 = owner battle object) ->
  r0 = spawned object pointer; also written to [r5 + oBattleObject_RelatedObject2Ptr]
details: 'A thin spawn-and-link helper: it builds r4 = r0 + (r2 << 16) (packing two 16-bit halves into
  one word, likely a combined coordinate/parameter word handed to the spawner), then calls battle_spawnObject56LinkedToOwner_80C44A8,
  which spawns battle object type 0x56 inheriting the owner''s alliance/direction with header flags 0x04|0x10.
  The returned object pointer is stored into the owner''s RelatedObject2Ptr field at [r5 + oBattleObject_RelatedObject2Ptr],
  so the owner keeps a handle on the spawned entity. Six tiny wrappers (0x080112E0–0x08011312) each set
  up slightly different register values and funnel through this function, suggesting it is the shared
  body for several fixed-argument spawn variants used by the beastsp route''s battle scripts.'
