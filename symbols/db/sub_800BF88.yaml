name: sub_800BF88
address: '0x0800BF88'
kind: function
status: hypothesis
summary: Reinitializes six two-byte selection slots (counts cleared, values set to a descending 0xE..9 default)
  and writes 0x8C to a state word, after delegating to a helper whose register results it passes through.
interface: void sub_800BF88(void); // no meaningful inputs; returns caller's r2-r7 unchanged, c/nz/v flags from
  the final "mov r0,#9" (c/v from sub_800C4BC)
details: 'First calls sub_800C4BC and passes its r2/r3/r4/r5/r6/r7 results and c/v flags through to this function''s
  callers, only saving/restoring r4/r6/r7 around the call (they are dead inside). Then stores 0x8C into the word
  at byte_203CB04 (likely a UI/menu state or cursor field). Finally, at the array byte_2036740 it treats six consecutive
  two-byte slots: clears the even byte (offset +2, +4, ... +0xC) to 0 (a count/quantity field) and sets the odd
  byte (offset +3, +5, ... +0xD) to 0xE, 0xD, 0xC, 0xB, 0xA, 9 respectively (an id/priority/preset value per slot).
  The descending defaults look like per-slot fixed identifiers rather than data-driven values. The exact game subsystem
  owning byte_2036740 is not established from this function alone.'
