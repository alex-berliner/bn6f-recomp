name: battle_pickRandomPanelFromOffsetList
address: '0x08110020'
kind: function
status: probable
summary: Scans a list of relative panel offsets against panel-parameter masks, then returns one uniformly
  random matching panel (x, y, and candidate count).
interface: (r0 = base x, r1 = base y, r2/r3 = panel-parameter mask sets, r4 = offset list (signed byte
  pairs, 0x7F terminator), r5 = object (byte 0x13 = row to exclude), r6 = alliance id) -> r0 = chosen
  x (0-6), r1 = chosen y, r2 = number of candidates; returns r2 = 0 if none matched
details: 'Converts r6 via object_getAllianceDirection to a +1/-1 side multiplier, then iterates r4 as
  2-byte entries (signed x-offset, signed y-offset) until a 0x7F terminator. For each entry it computes
  absolute x = baseX + offX*dir and y = baseY + offY and calls object_checkPanelParameters with the two
  masks from r2/r3; matches whose y equals byte [r5+0x13] are skipped (likely the caster''s own row).
  Each match is packed as x | (y<<4) into a stack list. If any candidates exist, it calls GetPositiveSignedRNG
  and BIOS Div (svc 6) to get rand % count as the index, then unpacks the entry: r0 = x (masked to 3 bits
  via lsl/lsr 29), r1 = y (nibble), r2 = count.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_getAllianceDirection with r6 before the loop shows side-relative offset mirroring;
    ldrsb on [r4] / [r4,#1] with 0x7F terminator and add r4,#2 shows a signed 2-byte offset table; bl
    object_checkPanelParameters with x,y and the r2/r3 mask args filters candidates; cmp y, [r5,#0x13]
    / beq skip shows a row exclusion tied to a battle-object field; svc 6 (BIOS Div) with rand/count and
    ldrb [sp,r1] shows uniform random selection from the stack list
