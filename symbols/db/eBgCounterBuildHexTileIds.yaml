name: eBgCounterBuildHexTileIds
address: '0x0801D12A'
kind: function
status: probable
summary: Builds two-tile-wide hexadecimal glyph pairs with leading blanks for a four-digit BG counter
  field.
interface: (r0 = value) -> stack writes four u16 tile IDs; flags clobbered
details: Converts the supplied 16-bit value into four hexadecimal digits using the glyph pairs at 0xD1B9,
  emitting two tile IDs per digit and shifting the value right by four each iteration. It computes the
  field's leading-zero count from countHexDigits_8000C5C and applies a per-position mask table at byte_801D1A4.
  Blank leading positions become tile IDs 0x10001 (background blanks), while populated positions receive
  glyph tile IDs. The resulting four tile IDs are left on the caller stack for CopyBackgroundTiles; eBgCounterDrawStep
  invokes it for both counter fields at 0x0801D09A and 0x0801D100.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: 'The loop extracts nibbles with and #0xf and shifts the input by four twice per iteration, producing
    four hexadecimal digits.; dword_801D198 supplies paired glyph tile indices, and dword_801D19C supplies
    the blank tile pair 0x10001.; The r6 offset into byte_801D1A4 is based on 4 - countHexDigits_8000C5C(value),
    selecting a leading-zero mask table.; The four generated u16 values are masked by two-byte table entries
    and left on the stack for CopyBackgroundTiles.; eBgCounterDrawStep passes word_203684C and word_203684A,
    then copies generated tiles into the two 4x2 counter fields.'
