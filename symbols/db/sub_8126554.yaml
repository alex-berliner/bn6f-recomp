name: sub_8126554
address: '0x08126554'
kind: function
status: hypothesis
summary: Thin wrapper that loads a fixed argument set (90, 32, 60, 12, two data-table pointers and the flag word
  0x40000000) and tail-invokes sub_8126570, passing its results straight back.
interface: void sub_8126554(void) -> (r1, r2, r3, C, V from sub_8126570); reads r4, r5, r10 as inputs to sub_8126570
  unchanged; preserves r4-r7
details: This is a pure argument-setup shim. It sets r0=0x5A (90), r1=0x20 (32), r2=0x3C (60), r3=0xC (12), r4=&byte_8124A84,
  r6=0x40000000, r7=&dword_8124A94, and then calls sub_8126570 with r5, r10 and the flags untouched from the caller.
  On return it restores r4-r7 with a pop (so the callee's r4-r7 do not escape) while r1-r3 and the C/V flags from
  sub_8126570 propagate to this function's caller, matching the register contract. The fixed values look like geometry/counts
  (90, 32, 60, 12) paired with a byte table and a dword table plus a single flag bit, suggesting some screen-space
  effect, window, or list layout whose meaning depends entirely on sub_8126570. No game structures are touched here
  directly.
