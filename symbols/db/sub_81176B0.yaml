name: sub_81176B0
address: '0x081176B0'
kind: function
status: hypothesis
summary: Sets a state-struct entity to active with mode/counter 4 and immediately runs its shared update routine.
interface: void sub_81176B0(r5 = state struct); NZCV and r0-r3 reflect the tail work done by sub_81176C0
details: 'Tiny state-transition helper. It writes 1 to the byte at +0 of the struct pointed to by r5 (an "active"/enabled
  flag) and 4 to the byte at +8 (a mode/state or step counter field), then calls sub_81176C0, which performs the
  actual per-frame processing for this struct; the flags and r0-r3 on return come from that call. r4-r7 are preserved
  across the whole thing. Looks like the entry point of one state in a larger per-object state machine: "switch
  to active/mode 4 and run one update immediately."

  '
