name: owPlayer_ClearStateBytes_D_E_F_809E04C
address: '0x0809E04C'
kind: function
status: confirmed
summary: Zeroes three consecutive state bytes (0xD-0xF) of the overworld player object while leaving the caller's
  r0/r1 untouched.
interface: 'void sub_809E04C(void); /* in: none (r0/r1 passed through unchanged); out: none; flags nz clobbered
  */'
details: 'Loads the address of the overworld player object from eOWPlayerObject and stores 0 into bytes 0xD, 0xE
  and 0xF (byte_2009F4D, byte_2009F4E, byte_2009F4F). Uses the push {r0,r1,lr} / pop {r0,r1,pc} idiom so the caller''s
  r0 and r1 survive the call; the popped pc performs the return, so lr must hold the return address. The three cleared
  bytes are likely per-frame player state/emote/animation flags in the overworld that must be reset before the player
  object is reused or a new scene begins. Note the routine''s r1 is overwritten with 0 internally, which is why
  r0/r1 are explicitly saved and restored. A leftover .word eStruct2000aa0 literal (off_809E060) sits after the
  pointer pool and is not referenced by this function.

  '
