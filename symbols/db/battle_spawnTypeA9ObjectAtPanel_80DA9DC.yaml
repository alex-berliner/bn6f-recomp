name: battle_spawnTypeA9ObjectAtPanel_80DA9DC
address: '0x080DA9DC'
kind: function
status: confirmed
summary: Spawns a battle object of type ID 0xA9 on a given panel with a given element, and marks it with header
  flag bits 0x14.
interface: battle_spawnTypeA9ObjectAtPanel(u8 panelX in r0, u8 panelY in r1, u8 element in r2) -> battle_object*
  in r0; sets nz c v (nz from the object pointer test, orr sets nz only); clobbers r1, r2, r3, lr; preserves r4-r7
details: 'Wrapper around object_spawnType3: passes type ID 0xA9 in r0 and 0 in r3 (leaving the caller''s panelX/panelY
  untouched in r1/r2 so the spawner can read them), and the spawn helper returns the new object pointer in r5 (0
  = spawn failed). The function uses the original''s spilled-register trick (push r0-r2,r5 before the call, pop
  shifted by one slot) so that on return r0 = object pointer, r1 = original panelX, r2 = original panelY, r3 = original
  element. If an object was created, it stores panelX to oBattleObject_PanelX, panelY to oBattleObject_PanelY, and
  element to oBattleObject_Element, then ORs 0x14 into the object header flags byte at offset 0 (oObjectHeader_Flags)
  — likely enabling update/draw for the new object. Quirk: the flag-setting "mov r0, r5" is really adds r0, r5,
  #0, so it sets nz according to the pointer and clears c/v; the trailing orr updates nz only, leaving c = v = 0.
  What gameplay entity type ID 0xA9 is is not identified from this function alone.

  '
