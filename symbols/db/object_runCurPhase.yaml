name: object_runCurPhase
address: '0x080BD586'
kind: function
status: probable
summary: Dispatches the battle object's current phase to its per-phase handler via jump table
interface: (r5 = battle object) -> calls handler for [r5+CurPhase]; returns whatever the handler returns
details: 'Loads oBattleObject_CurPhase from the object at r5, uses it to index the 4-entry thumb function-pointer
  table off_80BD598, and calls the selected phase handler with lr=pc trick (long-call from Thumb). Handlers:
  sub_80BD5A8, sub_80BD644, object_phaseTeleportBehindTarget, sub_80BD6B6. No other arguments are passed;
  the handler presumably also reads the object from r5. This is the standard phase-stepper pattern for
  enemy/object AI in battle.'
