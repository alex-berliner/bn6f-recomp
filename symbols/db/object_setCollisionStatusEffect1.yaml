name: object_setCollisionStatusEffect1
address: '0x0801A258'
kind: function
status: confirmed
summary: Writes a status-effect base value into the collision data of a battle object.
interface: void object_setCollisionStatusEffect1(u8 statusEffectBase /* r0 */, struct BattleObject* obj /* r5 */);
  returns the collision-data pointer in r3
details: 'Loads the oBattleObject_CollisionDataPtr field from the object pointed to by r5, then stores the low byte
  of r0 into that collision data at offset oCollisionData_StatusEffectBase. r3 is left holding the collision-data
  pointer on exit. Function is a leaf (returns via mov pc, lr), preserving nothing, and is intended for use by callers
  that already know how to retrieve the resulting pointer.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
