name: battle_runTutorialDialog_8026FC0
address: '0x08026FC0'
kind: function
status: confirmed
summary: 'Drives the "battle is about to run away" tutorial dialog: on first entry it fires the tutorial
  script (paged 1 or 2 + offset from battle effects) and marks the tutorial seen; on later entries it
  waits for chatbox flag 0x80 to clear, then arms a 0x14-timer and clears state.'
interface: 'void battle_runTutorialDialog_8026FC0(struct S20364C0 *self /* r5 */);

  // outputs: r2/r3/r4/r5/r6 (scratch); clobbers NZ/C/V, r0, r1, lr; preserves r4-r7 in this function

  '
details: "Operates on a battle-side state object at self (struct S20364C0):\n  +1  : timer (byte)\n  +2\
  \  : state (byte; 16-bit store path zeroes the full halfword)\n  +4  : mode (byte)\nLogic flow (per\
  \ the verified C):\n  1. bit 0x200000 of GetBattleEffects() decides a page offset (0 or 4) added to\
  \ the script index.\n  2. If state == 0 (first entry):\n     - writes 1 to state (so the tutorial won't\
  \ re-fire).\n     - calls battle_ClearPendingEventFlag_802A0EC (clears the corresponding pending event\
  \ flag).\n     - picks base index 1 when mode == 2 else 2, then adds the page_offset, and runs\n   \
  \    chatbox_runScript on TextScriptBattleRunDialog.\n  3. On subsequent calls, polls chatbox_mask_eFlags2009F38(0x80);\
  \ while nonzero it just\n     returns; once it clears, sets timer to 0x14 and clears state (as a 16-bit\
  \ zero).\nReads GetBattleEffects(); called alongside battle_ClearPendingEventFlag_802A0EC (suggesting\
  \ the\ncleared flag is the \"battle-run tutorial completed\" pending event). The chatbox mask 0x80 is\n\
  the \"dialog currently playing / busy\" indicator (must be clear before advancing the tutorial).\nUses\
  \ the S20364C0 layout exactly as defined in the disassembly.\n"
