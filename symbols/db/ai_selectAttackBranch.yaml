name: ai_selectAttackBranch
address: '0x080F3A24'
kind: function
status: probable
summary: Enemy AI per-turn decision routine that randomly branches into one of four attack setups and
  programs the AI attack-vars block for the chosen move.
interface: (r5 = enemy BattleObject, r6 = its AI state, r7 = its AI attack-vars struct) -> r0 = destroyed;
  sets oAIAttackVars fields and calls object_setAttack0/4
details: On entry it checks a condition via sub_80F3C1C; if that fails, it instead counts turns in oAIState_TurnCounter
  and, once the counter reaches 3, forces one specific setup (attack id 0xA) with InitFlag=3, resetting
  the counter. Otherwise it draws GetPositiveSignedRNG & 0xF and picks one of four ranges (0-3, 4-5, 6-7,
  >=8). Each branch stores battle_getAiDifficultyTier_800FE36 into oAIAttackVars_AiDifficultyTier, sets
  a duration from a helper (sub_80F3B7A/B8C/BB0/BD4/BF8), a panel-choose callback (sub_80F45B8 in some
  branches), the opponent object via battle_findPlayer(alliance^1) into oAIAttackVars_TargetObjectPtr,
  and scratch/param pointers (0x60/0x64/0x68 + r5, i.e. fields inside the object), then dispatches with
  object_setAttack0(0xA/0xB/0xC/0xD) or object_setAttack4(9). This is the top-level 'pick what the boss
  does this turn' handler for one enemy's AI.
