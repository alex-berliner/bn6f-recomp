status: hypothesis
summary: Reads one of three packed bytes at 0x0811A6D8 (values 0x1D, 0x1E, 0x1F) indexed by r1, then tail-calls
  sub_811A718 with that byte.
interface: void sub_811A6C8(uint32_t r1_index); // preserves r5-r9; clobbers r0,r2-r4,r12,lr,NZCV
details: 'Loads the address of the 3-byte constant dword_811A6D8 (=0x1F1E1D, little-endian

  bytes 0x1D, 0x1E, 0x1F) into r4 via off_811A6D4, then byte-loads r0 from

  [r4 + r1] so r1 selects one of the three bytes. sub_811A718 is invoked with

  that selected value in r0; the function ends with `pop {pc}`, making it a

  tail call to sub_811A718. The only inputs from callers per the contract are

  r1 and r10; r10 is forwarded to sub_811A718, which returns into r11.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
