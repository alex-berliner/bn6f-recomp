name: battleObject_runThunderboltPhase_80D4604
address: '0x080D4604'
kind: function
status: confirmed
summary: 'Tick handler for a thunderbolt battle object: counts down, then strikes the nearest enemy with
  a lightning bolt at that enemy''s tile.'
interface: void battleObject_runThunderboltPhase(u32 r5 /*BattleObject**/, u32 r10); /* returns r1, r5
  modified */
details: 'Per-frame phase handler stored in the BattleObject''s phase-dispatch table. On the first tick
  it sets PhaseInitialized, CurAnim=3 (thunderbolt animation), and Timer=0x0A (10-frame fuse).  If Param1==4
  the object is an inert variant and is immediately set to CUR_STATE_DESTROY. Subsequent ticks decrement
  Timer; while (s32)(Timer-1) > 0 the function returns so the animation plays. When the fuse expires:
  clears the object''s collision region, XORs the alliance field to obtain the opposing side, calls battleObject_findClosestEnemyBattleObject
  to locate the nearest foe on that side, reads the foe''s tile X (+0x12) and Y (+0x13), loads the self
  object''s DamageAndStaminaDamageCounterDisabler word, and calls spawnThunderboltObject at the foe''s
  position with type=3. Regardless of which branch produced it, the object pointed to by r5 after the
  spawn (or the original object for the Param1==4 shortcut) is marked CUR_STATE_DESTROY. r10 is an input
  the register contract notes but the function body never touches directly; it may be consumed by one
  of the callees via frame-pointer conventions.

  '
