name: ow_clearAndRedrawTilemap
address: '0x08094720'
kind: function
status: probable
summary: Zeroes the overworld tilemap buffer and then blits the tilemap block into it, redrawing around
  the camera.
interface: () -> r0 = 0
details: Loads the address of eOverworldMapTilemap and ZeroFillByWord-clears 0x1000 bytes at that buffer,
  then calls ow_blitTilemapBlockAndRedraw to copy the 34x100-halfword block in at the appropriate offset
  and redraw around the camera. Returns 0 in r0. No callers are known from the symbol database, so this
  is a standalone overworld tilemap reset/rebuild helper.
