name: battle_updateTimeredWaitAndPoll
address: '0x080E44BC'
kind: function
status: probable
summary: 'Battle-object update step: counts down a timer, polls sub_80E459C on each expiry while decrementing
  a repeat counter, then advances the object to phase 8.'
interface: (r0 = battle object? passed through in r5 convention, r5 = object pointer) -> r0 = result of
  sub_80E459C; no meaningful flags
details: 'Per-frame handler for a battle object: decrements oBattleObject_Timer, and when it reaches 0
  reloads it with 10 and calls sub_80E459C. If that returns 0 the object immediately transitions to phase
  8 (oBattleObject_CurPhaseAndPhaseInitialized = 8); if nonzero, it instead decrements oBattleObject_ExtraVars
  and only advances to phase 8 once that counter hits 0. So it waits in 10-frame ticks for a polled condition,
  bounded by the ExtraVars repeat count.'
