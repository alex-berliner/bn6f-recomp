    #1, bne shows a repeat countdown before ending; mov r0,#8; strh to oBattleObject_CurPhaseAndPhaseInitialized
    is the standard phase-transition store; no callers known, so only the object-update shape (r5 object,
    phase field writes) identifies the role'
