name: ExitReqBBSMenu813F590
address: '0x0813F590'
kind: function
status: confirmed
summary: 'Handles the closing of the BBS request screen: waits for the fade to finish, writes the player''s dialog
  answer to the NPC, unlocks the overworld player, clears player-control and overworld state, then resets the game
  to the opening screen.'
interface: Next bbs_exitRequestMenu_813F590(u32 r5 /*dialogCtx*/, u32 r10 /*toolkitPtr*/) /* r10,r11 updated by
  reqBBS; returns 1 = menu closed, 0 = defer until fade ends */
details: "Frame-driven \"Next\" routine called each tick while the BBS request menu is visible.\n\n1. Sets the render-info\
  \ fade timer (u16 at toolkit+oToolkit_RenderInfoPtr) to 0x1F40\n   (5000 ticks) so the screen fade completes.\n\
  2. Calls reqBBS_813F8F0(r5) to advance the BBS request state machine; this callee may\n   modify r10 and r11 (the\
  \ new output registers).\n3. Calls IsScreenFadeActive(); if Z is set (fade still running) the routine returns\
  \ 0\n   (defer) without tearing down anything.\n4. Once the fade is done (Z clear):\n   - Reads the one-byte dialog\
  \ response from r5+0x05 and stores it into the NPC\n     object's answer field (r5+0x28 -> +0x20 -> target).\n\
  \   - Unlocks the player character via owPlayer_unlockPlayerAfterNonNPCDialogue_809E122.\n   - Initialises the\
  \ player-control block at r10+0x1C: bytes at odd offsets\n     (+1,+3,+5,+7) set to 0xFF (active slots), all even\
  \ offsets and +9,+A cleared to 0.\n   - Clears three bytes in the overworld-state block at r10+0x20 (+0,+4,+6\
  \ = 0).\n   - Calls resetGameStateToOpening_8005F84 to put the game back at the title/opening.\n5. Returns r0=1\
  \ (success / menu fully closed).\n\nThe dialog context (r5) is read-only here; the toolkit pointer (r10) and an\
  \ additional\nvalue in r11 are forwarded from reqBBS_813F8F0 as the routine's register output.\n"
