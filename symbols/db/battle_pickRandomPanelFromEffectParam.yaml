    — base panel for the random pick comes from the object; mov r4,#0x2c immediately before the random-panel
    call — a fixed argument consumed by the callee; returns r0 directly from GetRandomRelativePanelFiltered
    — function's result is the chosen panel; route tag 'battlesweep' — runs during battle execution, consistent
