name: battle_pickRandomPanelFromEffectParam
address: '0x0810AD88'
kind: function
status: probable
summary: Looks up the battle's team-dependent panel-effect parameters and returns a random panel chosen
  relative to the battle object's panel using a fixed filter.
interface: (r5 = battle/panel-effect object) -> r0 = selected panel id; r1 = args pointer from param lookup
  (clobbered)
details: Reads two bytes at [r5,#0x12] and [r5,#0x13] and uses them with the byte_810AE08 table index
  to call GetAllianceDependentPanelParamArgs, which returns an entry indexed by the battle object's alliance
  field (its param word and args pointer). It then loads the byte at [r5,#0x16] (a base panel id) and
  calls GetRandomRelativePanelFiltered, which picks a random reachable panel relative to that panel via
  the PanelOffsetListsPointerTable. r4 is set to 0x2c just before that call, apparently read by the callee
  as a filter/offset-list selector. The final random panel id is returned in r0. No known callers, so
  the exact effect this serves (e.g. a panel-conversion or stage gimmick step in the battlesweep route)
  is unconfirmed.
