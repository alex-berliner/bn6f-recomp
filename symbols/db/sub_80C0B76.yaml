name: sub_80C0B76
address: '0x080C0B76'
kind: function
status: confirmed
summary: Per-tick dispatcher for a battle object, jumping to the handler for its current CurPhase
interface: '(void) In: r2 = opaque caller arg, r5 = battle-object pointer; Out: r5, r8, r9, r10, r11, r12 (handler''s
  results, kept live across the table jump)'
details: 'Reads oCurPhase on the battle object pointed to by r5, indexes the handler

  table at off_80C0B88 with that phase byte, and tail-calls the entry via

  "mov lr, pc; bx r1". Only phases 0 and 1 have entries in this two-word

  table: battleObject_tickHitReact_80C0B90 and sub_80C0BC2 respectively.

  The handler runs with the guest register state and returns straight to

  this function''s caller (no {pop {pc}} on the way back), so anything it

  leaves in r5 and r8-r12 is what the caller sees. r2 is forwarded

  unchanged into the handler; r0 is loaded with the phase byte, r1 with

  the handler address itself.

  '
