name: navicust_dialogStateHandler
address: '0x081374D4'
kind: function
status: probable
summary: 'Per-frame NaviCust dialog handler: waits for the dialog to be ready, then on state 4 or 8 triggers
  the next NaviCust text script (checking a toolkit part flag for state 8).'
interface: (r7 = dialog state object, r5 = out byte ptr; r0/r1 unused) -> r0 = script/text id side effect;
  writes 0x7C or 0x78 to [r5]
details: 'First calls sub_8137670 with 0x3F8 (likely priming a dialog/text variable), then bails out if
  byte [r7,#0xD] is nonzero or if sub_8137648(0,10) returns false (a readiness/gate check, e.g. dialog
  not busy or 10-frame condition). It then dispatches on the state byte [r7,#2]: for state 4 it calls
  sub_8137670(1) and stores 0x7C (124) into [r5], presumably the next text/dialog id to run; for state
  8 it reads halfwords [r7,#0x28] and [r7,#0x2C] and calls battle_checkItemFlagFor_813B9B4, which tests
  a byte in the toolkit''s 0x200414C array at offset r0 + r1*7 (7-byte-per-entry NaviCust part records).
  If that flag is set it runs RunTextScriptNaviCustDialog with id 0x24, stores 0x78 (120) into [r5], and
  calls sub_8137670(0). The 0x78/0x7C bytes look like follow-up dialog/script selectors chosen by which
  NaviCust interaction state was reached.'
