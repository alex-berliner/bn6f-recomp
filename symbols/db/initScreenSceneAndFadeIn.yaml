name: initScreenSceneAndFadeIn
address: '0x0812A694'
kind: function
status: probable
summary: 'One-shot handler that runs after a screen fade-out completes: it clears the 0x200BC50 flag and
  IsScreenFadeActive guard, calls battle_initScene_8129248, screens3_loadBackgroundTiles, and loadEntityJumpOffset00Gfx_812B530;
  sets state 8 on the r5 struct, zeroes r5+0x1C/0x1E and a 16-byte block at unk_20251A0; chooses r5+2
  from sub_81325F4 or sub_81325E4 per the r5+0xE flag (clearing r5+3); spawns eStruct records from the
  byte_8129150 table; and finally calls SetScreenFade(8, 0x10) to start the fade-in.'
interface: (r5 = screen/state struct) -> void; gates on IWRAM 0x200BC50 flag bit 5 and IsScreenFadeActive,
  ends with SetScreenFade(8, 0x10)
details: First it bails out if the flag byte at offset 5 of the 0x200BC50 IWRAM struct is set, or if a
  screen fade is still active, so the body runs only after a fade-out completes. It then calls battle_initScene_8129248
  (full battle-scene/GFX reset), screens3_loadBackgroundTiles (30x20 BG tilemap plus text panels), and
  loadEntityJumpOffset00Gfx_812B530 (entity slot-0 graphics). It writes state 8 to r5+1, zeroes r5+0x1C/0x1E,
  zero-fills a 16-byte block at unk_20251A0, and picks a value for r5+2 via sub_81325F4 or sub_81325E4
  depending on the r5+0xE flag (r5+3 cleared either way). Finally it spawns one batch of eStruct records
  from the 0xFF-terminated table byte_8129150 and issues SetScreenFade(8, 0x10) to begin the fade-in.
  This is a one-shot 'enter screen' transition handler in some state loop where r5 is the current context/state
  struct.
