name: GetCurPETNaviStatsByte
address: '0x080137B6'
kind: function
status: confirmed
summary: Reads one byte of the NaviStats struct for the navi currently selected on the PET, at a caller-chosen field
  offset.
interface: 'int GetCurPETNaviStatsByte(u32 naviStatsFieldOffset /*r1*/); // r0 in: unused by caller? passed to helper
  via GetNaviStatsIndexGivenCurPETNavi; out: byte value; r3 out: address of byte read; c,v out: flags from base+offset
  add'
details: 'Pushes lr, then saves r1 (the field offset) across a call to

  GetNaviStatsIndexGivenCurPETNavi, which resolves the navi currently equipped

  in the PET to its index in the NaviStats array (toolkit->NaviStatsPtr,

  entry size oNaviStats_Size). After restoring r1, it computes

  statsBase + index * oNaviStats_Size in r3 (the add sets c and v), loads a

  byte at [r3 + r1], and returns it in r0 while r3 keeps pointing at the

  byte that was read. The saved r1 is restored because the helper call

  clobbers it. r10 is the toolkit/context register holding

  oToolkit_NaviStatsPtr. Only byte-sized fields can be fetched this way.

  '
