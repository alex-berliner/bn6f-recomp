open_questions:
- Exact meaning of r2/r3/r4 split between front-buffer pair count and back-buffer size; the second buffer
  pointer is `r1 + r4*2` but the iteration count uses `r3` (the original r3 was subtracted from r4 before
  being saved, so loop count = original r4 - original r3). Until a struct with these chatbox-display fields
  is matched to 0x02034814 the role of each count stays partly inferred.
