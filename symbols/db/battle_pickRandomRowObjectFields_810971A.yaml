name: battle_pickRandomRowObjectFields_810971A
address: '0x0810971A'
kind: function
status: confirmed
summary: Picks one object at random from a battle row chosen by alliance-dependent panel parameters and returns
  its entry byte split into an id (low 3 bits) and a 4-bit attribute field.
interface: int battle_pickRandomRowObjectFields(int r0, int r4, int r5, int r6, int r7 /* args forwarded to the
  panel-param helper; r4-r6 read by the callee */) // returns r0 = entry byte & 7 (object id/kind), r1 = entry byte
  >> 4 (attribute field, bit 3 discarded); // r0 = 0 and nz from cmp when the row is empty; nz set from the final
  r0
details: 'Battle helper. It first calls GetAllianceDependentPanelParamArgs (with A_off_8109784 as

  its parameter block in r3 and the caller''s r0/r4-r7 context) to work out which row/side''s

  panel parameters apply to the current attacker''s alliance. It then reserves 8 bytes of

  stack (buffer pointer saved in r7) and calls object_getPanelsInRowFiltered, which fills

  the stack buffer with every object standing in that row and returns the count in r0.

  If the count is zero, the function returns immediately with r0 = 0 and flags from the

  count comparison (Z set). Otherwise it rolls a random number with GetPositiveSignedRNG

  and takes it modulo the count via BIOS swi 6 (Div, remainder in r1), indexes the buffer

  at that random slot, loads the one-byte entry, and splits it: r0 = low 3 bits of the

  byte (the shifts lsl #0x1d / lsr #0x1d mask off bit 3 as well, so the byte effectively

  holds a 3-bit field and a 4-bit field with bit 3 unused), r1 = upper 4 bits. Flags nz

  come from the returned r0. r4-r7 are preserved (r7 saved/restored around the buffer

  pointer); r2/r3 are whatever the helpers left behind. The 8-byte stack scratch is only

  sized for one entry per slot in the fill helper''s layout.

  '
