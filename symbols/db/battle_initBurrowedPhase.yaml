  collision, sets PhaseInitialized=4, plays SE 0x94, sets timers 0x14/0x1E, applies white shader 0x7FFF,
  sets invulnerable to 0xFFFF, spawns effect from +0x34, sets CurPhase=4). However, the summary's 'permanently
  invulnerable while hidden' is misleading—calling object_setInvulnerableTime with 0xFFFF at the start
  means invulnerable duration is set, not 'forever while hidden'; the state machine (not shown) likely
