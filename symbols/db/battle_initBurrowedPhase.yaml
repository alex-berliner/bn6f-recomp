name: battle_initBurrowedPhase
address: '0x080164C0'
kind: function
status: probable
summary: 'Initializes a battle object''s burrowed state: clears bit 1 of its flags, reserves its current
  panel via FuturePanel fields, drops it from collision, plays SE 0x94, arms timers 0x14/0x1E, applies
  a full-bright white shader, gives it 0xFFFF invulnerable time, spawns a small effect from its +0x34
  position data, and sets CurPhase and PhaseInitialized to 4.'
interface: (r5 = battle object header, implied) -> r0 = 0 (phase value stored); no meaningful return
details: Clears bit 1 of the object's flags (active/visible), copies the object's current panel coords
  into the FuturePanel fields and reserves that panel, then clears its collision region so it no longer
  occupies the field. It initializes PhaseInitialized = 4, plays sound effect 0x94, sets Timer = 0x14
  and Timer2 = 0x1E (short counts, likely the reappear delay), and applies color shader 0x7FFF (computed
  0x1F<<5+0x1F<<5+0x1F), a full-bright/white shader. It calls object_setInvulnerableTime with 0xFFFF (essentially
  forever while hidden). Finally it copies 3 words from r5+0x34 (object position data) as parameters to
  spawn a type-0 effect object flagged with bit 4, and sets the object's CurPhase to 4, which the object's
  phase state machine will presumably use as the 'hidden' state with the timers controlling when it resurfaces.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_clearCollisionRegion + invulnerable time 0xFFFF (dword_801651C) show it leaves the
    field/untargetable; color shader 0x7FFF via sprite_setColorShader is a whitening/flash shader, matching
    a vanish or burrow visual; ldmia r0! {r1-r3} from r5+0x34 feeding spawn_t1_0x0_EffectObject spawns
    a positional effect at the object; PanelX/Y copied to FuturePanelX/Y and object_reservePanel show
    it holds its panel while out of play; PhaseInitialized=4 and CurPhase=4 mark entry into a dedicated
    hidden state with 0x14/0x1E timers
  refs:
  - bn6f/asm/asm00_2.s:17037
  - 0x080005CC PlaySoundEffect
  - 0x0801A074 object_clearCollisionRegion
  - 0x0801BB1C object_reservePanel
  reproduce: python3 tools/asmcat.py 0x080164C0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal''s mechanics (clears flag bit 1, reserves panel via FuturePanel, clears
    collision, sets PhaseInitialized=4, plays SE 0x94, sets timers 0x14/0x1E, applies white shader 0x7FFF,
    sets invulnerable to 0xFFFF, spawns effect from +0x34, sets CurPhase=4). However, the summary''s ''permanently
    invulnerable while hidden'' is misleading—calling object_setInvulnerableTime with 0xFFFF at the start
    means invulnerable duration is set, not ''forever while hidden''; the state machine (not shown) likely
    clears it. Also ''drops out of collision'' is correct but ''no meaningful return'' should note r0
    is the spawned effect pointer.; run wf investigate investigate-20261018-223614; proposed by Hyper
    glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
