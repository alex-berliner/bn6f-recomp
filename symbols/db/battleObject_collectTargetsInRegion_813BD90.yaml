open_questions:
- Exact meaning of r0 on entry (actor index vs BattleObject field) - captured values 0x34/0x90 suggest
- a packed field, not directly an array index. Could be unpacked by the callee.
- Whether the appended byte is the panel type, an enemy ID, or something derived from sub_813C624's
- return value (the function stores r0 from before the call, after the new r1 load - need to read
- sub_813C624's contract).
- The 0x31 cap on the seen-set and the special-case compare against `r5 = r6+1` (the column index)
- suggest a "skip the centre actor" rule but the precise semantics are not in the assembly alone.
