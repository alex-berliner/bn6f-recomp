name: battleObjectStartSelfDestruct
address: '0x080C2F40'
kind: function
status: probable
summary: Starts or completes a five-tick self-destruction sequence for the current battle object.
interface: (r0 = battleObject, r1 = ...) -> r0 = ...; flags ...
details: Assumes the current battle object pointer is in r5. If CurPhase is zero and CurAnim is not already
  4, it sets CurAnim to 4, clears RelatedObject1Ptr, initializes Timer to 5, and enters CurPhase 4. If
  CurPhase is already 4, it decrements Timer until it reaches zero; the CurAnim == 4 path also skips directly
  to destruction. Once Timer expires, it clears object flag bit 1 and sets the battle object's state/action/phase
  field to CUR_STATE_DESTROY.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: The entry path initializes oBattleObject_CurPhase to 4, oBattleObject_Timer to 5, and oBattleObject_CurAnim
    to 4.; The phase-4 branch decrements oBattleObject_Timer and reaches destruction when it is zero or
    less.; The final block clears oObjectHeader_Flags bit 1 and writes CUR_STATE_DESTROY to oBattleObject_CurStateActionPhaseAndPhaseInitialized.
