name: battle_objectActionUpdate
address: '0x080CB368'
kind: function
status: probable
summary: 'Per-frame mid-action update for a battle object in r5: tears down its collision data, spawns
  the hit-effect object for its last collision, sets its state to CUR_STATE_DESTROY if the battle is over,
  refreshes collision state via object_presentCollisionData during time-stop, or otherwise tail-calls
  the action handler chosen via oBattleObject_CurAction.'
interface: (r5 = battle object) -> r0 = consumed by dispatch; sets object state to CUR_STATE_DESTROY when
  battle is over
details: Runs each frame for an object whose collision data lives in r5 (oBattleObject fields). It first
  tears down the object's collision data, then spawns the hit-effect object for the object's last collision.
  If battle-over conditions are met it writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized;
  otherwise, unless time-stop is active, it loads an action jump table indexed by oBattleObject_CurAction
  and tail-calls the handler (the table has a single entry, sub_80CB3A0). During time-stop it instead
  calls object_presentCollisionData to keep the collision state consistent without advancing. The odd
  calling convention (object in r5, not r0) suggests it is invoked from a shared object-update loop that
  keeps the current object in r5.
