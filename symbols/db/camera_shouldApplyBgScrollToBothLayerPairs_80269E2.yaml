open_questions:
- 'Exact semantics: whether r0=1 means "do scroll BG1" or "skip BG1" depends on caller; caller summary
  says "unless sub_80269E2 says not to" — implying the callee returning 1 means "scroll", 0 means "skip".
  The captured call snapshots all return 1, consistent with normal scrolling. The two bytes'' roles as
  "current substate" vs "next substate" of the chip select need cross-referencing with other eS20364C0
  consumers to settle.'
