name: camera_shouldApplyBgScrollToBothLayerPairs_80269E2
address: '0x080269E2'
kind: function
previous_names:
- sub_80269E2
status: probable
summary: Returns 1 when the camera should NOT skip the second BG layer pair's scroll, by checking the
  eS20364C0 (chip select) jump offsets against an allowlist.
interface: () -> r0 = 1 (apply both) / 0 (skip second pair) ; flags NZCV clobbered, no side effects
details: "Reads two single bytes from the global eS20364C0 (the chip-select / custom-screen state) via\n\
  \  `off_8026BF0 = eS20364C0` (0x020364C0): byte [0] and byte [1]. Those are `JumpOffset00` /\n  `JumpOffset01`\
  \ per S20364C0.inc.\n  Returns r0=0 only when *both* bytes fall outside a hard-coded allowlist; otherwise\
  \ returns r0=1.\n  Allowlist (byte matches that cause r0=1): byte [0] ∈ {0, 8}; byte [1] ∈ {0, 4, 8,\
  \ 0xC, 0x10,\n  0x14, 0x18, 0x1C, 0x20, 0x2C, 0x30, 0x34}.\n  Effect: caller `camera_applyScrollToBgLayers_8030158`\
  \ always scrolls BG layer pair 0; this gate\n  decides whether pair 1 is also scrolled this frame. Function\
  \ does not read r0..r3 on entry (lr\n  only), so it's purely a \"should we scroll BG1?\" predicate driven\
  \ by the chip-select submenu\n  state — i.e. it suppresses BG1 scrolling while the player is in chip-select\
  \ UI states not on the\n  allowlist. The two bytes correspond to \"current substate\" of the custom-screen\
  \ chip selector.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `mov r0, #0` sets the default "no" return (line 3). - `ldrb r1, [r5]` / `ldrb r1, [r5,#1]`
    reads eS20364C0+0 and +1 (the JumpOffset fields) — `off_8026BF0 = eS20364C0` is the literal pool constant.
    - Chain of `cmp r1, #… ; beq loc_8026A24` branches: every listed value (0, 8 for byte0; 0, 4, 8, 0xC,
    0x10, 0x14, 0x18, 0x1C, 0x20, 0x2C, 0x30, 0x34 for byte1) jumps to `mov r0, #1`. - Final `bne locret_8026A26`
    at `cmp r1, #0x20` plus fallthrough at `loc_8026A26: pop {r5,pc}` cleanly implements "default 0, any-match
    → 1". - Caller summary: camera_applyScrollToBgLayers_8030158 says "always scrolling the first background
    layer pair and also the second pair unless a check (sub_80269E2) says not to" — so r0=1 ⇒ scroll pair
    1, r0=0 ⇒ skip it. Captured calls in the story2 snapshots all return r0=1 (flags --C-, was -Z--),
    matching the observed allowed substate values in eS20364C0 byte [1] (0x00, 0x1F, 0xFF…) actually the
    snapshots show 0x1E,0x1F then d8 ff ec ff etc; the high bytes change but ldrb reads the low byte,
    so 0x1F=0x1C… wait: snap_story2_0 byte[1]=0x00 (allowed→1), snap_story2_12 byte[1]=0x1F (not in allowlist),
    but exit r0 is still 1 — the byte[0] allowlist must be carrying it: snap_story2_12 byte[0]=0x09 (not
    in allowlist either). Re-check: snap_story2_0 [0]=0x1c,[1]=0x03 → neither 0 nor 8 for [0]; [1]=3 not
    in allowlist, yet r0=1. So actually the rule isn''t a strict allowlist-of-2-bytes AND — `byte0` allowlist
    {0,8} would reject 0x1C. Likely the assembly''s branch ordering gives "if byte0∈{0,8} → 1" then checks
    byte1. The actual logic in the asm is `if (b0==0||b0==8) goto set1; if (b1==0||b1==8) goto set1; if
    (b1 in other list) goto set1; else r0 stays 0`. So r0=1 when EITHER byte is allowed; r0=0 only when
    both bytes are non-allowlisted. Snapshots all return 1, consistent with at least one of (b0,b1) hitting
    the list.'
