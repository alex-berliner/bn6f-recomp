name: battle_spawnEffectAdvanceToPhase4
address: '0x080C3348'
kind: function
status: probable
summary: 'Battle-object phase step: clears a header flag bit, spawns an effect object using parameters
  stored in the object, then advances the object to phase 4 with a 3-frame timer.'
interface: (r5 = battle object header pointer; r4 = 0x14 passed through to callee) -> r0 = spawned object
  pointer from callee; updates r5 object fields
details: Clears bit 1 of oObjectHeader_Flags (likely a phase-initialized or one-shot marker). Copies three
  words from offset 0x34 of the object (r1-r3) and calls spawn_t1_0x0_EffectObject, which spawns a type-4
  battle effect object, leaving r0 pointing at r5+0x40 after the ldmia. Then sets oBattleObject_Timer
  = 3 and oBattleObject_CurPhaseAndPhaseInitialized = 4, i.e. queues the next phase to run after 3 frames.
  r4 = 0x14 is set just before the call, suggesting the callee or the object spawn path reads it (possibly
  an object-size or team/param field). Typical shape of a multi-phase object script handler in the battle
  engine.
