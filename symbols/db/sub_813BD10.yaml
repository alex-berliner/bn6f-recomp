name: sub_813BD10
address: '0x0813BD10'
kind: function
status: hypothesis
summary: Tiny getter that loads the base address of the work/RAM area at 0x2006C88 into r7 for the caller.
interface: 'void sub_813BD10(void); // out: r7 = 0x2006C88'
details: Two-instruction thunk (ldr r7, =0x2006C88; mov pc, lr). It exists so callers can obtain the pointer to
  the IWRAM region at 0x2006C88 (symbol unk_2006C88 in the disassembly) and then index into it themselves. It does
  not touch memory contents, flags, or any other registers; the load is done into r7 specifically because the callers
  use r7 as their base register right after the call. The tail-jump via mov pc, lr means lr must hold the return
  address, which matches the register contract.
