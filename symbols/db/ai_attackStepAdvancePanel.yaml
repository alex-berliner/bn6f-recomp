name: ai_attackStepAdvancePanel
address: '0x08103200'
kind: function
status: probable
summary: 'Per-frame tick of an AI attack''s movement step: counts down a timer, and on expiry commits
  the object onto its reserved future panel and re-arms the next step.'
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = 0; no flags meaningful
details: Called every frame while an AI-controlled object performs a step-based attack. It decrements
  oAIAttackVars_StepTimer in the r7 attack-variables struct and returns early while it is still positive.
  When the timer hits zero, it switches the object's current animation to 3, copies oBattleObject_FuturePanelX/FuturePanelY
  into PanelX/PanelY, and releases the previously reserved panel (object_removePanelReserve, which uses
  the FuturePanel fields). It then recomputes the object's pixel coordinates from the new panel (object_setCoordinatesFromPanels)
  and syncs the new panel into the collision record with a fresh facing direction (object_updateCollisionPanels).
  Finally it re-arms the timer with 3 frames and sets oAIAttackVars_HitElement to 8, the damage element
  applied for the next step's contact/hit check.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrh/strh on oAIAttackVars_StepTimer with bgt early return shows a per-frame countdown gate;
    copies FuturePanelX/Y into PanelX/Y immediately before object_removePanelReserve, matching its reserver-clearing
    behavior; object_setCoordinatesFromPanels + object_updateCollisionPanels called right after the panel
    commit; StepTimer is reset to 3 and oAIAttackVars_HitElement set to 8, re-arming the next step of
    the attack; mov r0,#3; strb into oBattleObject_CurAnim selects a distinct animation for the step moment
