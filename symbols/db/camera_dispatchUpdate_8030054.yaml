name: camera_dispatchUpdate_8030054
address: '0x08030054'
kind: function
status: confirmed
summary: Camera object update dispatcher — reads the camera's mode byte and jumps to the matching camera update
  handler from a small jump table.
interface: void camera_dispatchUpdate_8030054(void) — takes everything via registers/flags as-is (r5 = camera object);
  tail-returns whatever the selected handler leaves in registers and flags
details: "r5 points at a camera object; the byte at offset 2 (oCamera_Unk_02) is the\ncamera's current mode/state\
  \ selector. It is used directly as a byte offset\ninto a 5-entry Thumb handler table at off_8030068:\n  0x00,\
  \ 0x04, 0x10 -> sub_803007C (default/idle camera update)\n  0x08             -> sub_80300AC\n  0x0C          \
  \   -> sub_8030104\nThe selected handler is invoked with bx after setting lr = pc (so the\nhandler's return pops\
  \ this function's saved lr via pop {pc}), i.e. this is\na trampoline rather than a normal call. Quirk: the dispatcher\
  \ deliberately\nclobbers r0 (handler address, Thumb bit set) and r1 (the raw selector\nbyte) before the jump,\
  \ and handlers are entered seeing those values; all\nother registers and the nzcv flags pass through untouched,\
  \ and the\nhandler's register/flag results are handed straight back to this\nfunction's caller. Since the selector\
  \ byte indexes the table unmasked,\nany value other than {0,4,8,0xC,0x10} would read garbage as a handler\naddress\
  \ — callers are expected to keep the mode byte within the table.\n"
