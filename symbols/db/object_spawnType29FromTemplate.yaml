    run wf investigate investigate-20261019-030611'
open_questions:
- What object id 0x29 actually is in-game (needs the object-type table or a caller with known context)
- Exact meaning of the copied fields +0x12/+0x16/+0x40/+0x44 and of [r7+0x10] -> +0x20
- Whether r5 is also passed as a spawn stack argument or only used as the post-spawn template
- Semantics of the bit 0x10 cleared at +0x00
