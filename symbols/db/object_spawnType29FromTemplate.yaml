name: object_spawnType29FromTemplate
address: '0x080C0448'
kind: function
status: probable
summary: Spawns battle object id 0x29 via object_spawnType1 and initialises it from fields of a caller-provided
  template struct, returning the new object.
interface: (r0 = object id 0x29, r1-r3/stack = spawn args, r5 = source struct ptr, r6/r7 = extra values)
  -> r0 = new BattleObject or 0; flags from spawn result (Z for null check)
details: 'Wrapper around object_spawnType1 with the fixed object index 0x29 (mov r0,#0x29 before the bl).
  The callee returns the new BattleObject in r5, which is moved to r0 before the caller''s saved r5 is
  popped back, so r5 then serves as the source/template struct. On failure (r0 == 0) it returns immediately
  without touching anything. On success it copies template fields into the new object: word r5 -> +0x4c
  (likely back-pointer/owner), halfword +0x16 -> +0x16, word r6 -> +0x60, halfword +0x12 -> +0x12, word
  [r7+0x10] -> +0x20, and words +0x40/+0x44 -> +0x40/+0x44. Finally it clears bit 0x10 of the object''s
  flag byte at +0x00 (bic r1,#0x10), probably an ''inactive/hidden'' bit, so the object starts active.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: mov r0,#0x29; bl object_spawnType1 — fixed object index passed to the spawner; mov r0,r5 / pop
    {r5} — callee returns the object in r5, which then frees r5 to be the template pointer; str r5,[r0,#0x4c];
    ldrh/str +0x16, +0x12; str r6,[r0,#0x60]; ldr [r7,#0x10]->+0x20; +0x40/+0x44 copied — bulk field init
    from the template; beq locret_80C0478 right after the call — early-out when the spawner returned null;
    ldrb r1,[r0]; mov r2,#0x10; bic r1,r2; strb — clears bit 0x10 of the object's first-byte flags
  refs:
  - bn6f/asm/asm31.s:18163
