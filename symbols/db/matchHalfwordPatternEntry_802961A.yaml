name: matchHalfwordPatternEntry_802961A
address: '0x0802961A'
kind: function
status: confirmed
summary: Compares a run of halfwords from a buffer against one pattern record and, on a full match, returns that
  record's result value.
interface: i32 matchHalfwordPatternEntry(u32 count /*r2*/, struct record* rec /*r3*/, u32 stride /*r6*/, u16* src
  /*r7*/) -> result in r0 (rec->result halfword on success, 0 on mismatch), r1 = stride on success / the mismatched
  expected halfword on failure; NZ set from final move, C/V from the last halfword compare
details: 'Generic halfword-pattern matcher. r3 points to a record laid out as {+0: ?, +2: result halfword, +4...:
  expected halfword list}; r2 is the number of halfwords to check, r6 is a source stride and r7 the source base,
  so the halfwords compared are [r7+r6], [r7+r6+2], ... against rec+4, rec+6, .... As soon as one halfword differs
  it returns r0 = 0 and r1 = the expected value that failed, leaving C/V reflecting that failed comparison. If all
  r2 halfwords match, it returns r0 = the record''s result halfword at r3+2 and r1 = r6 (the stride, handed back
  so the caller can advance the base pointer). r2, r4 and r7 are preserved; r4 is just scratch holding rec+4. The
  +0 field of the record is never read here, and r6/r7 are not advanced by this function itself, so the caller drives
  a multi-record / multi-block scan. This shape (fixed result word + variable-length expected sequence, stride in
  r6) looks like a table-driven pattern search over 16-bit data such as button/tile/letter sequences, but no caller
  was analysed to pin down which data it scans.'
