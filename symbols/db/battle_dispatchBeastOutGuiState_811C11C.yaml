name: battle_dispatchBeastOutGuiState_811C11C
address: '0x0811C11C'
kind: function
status: confirmed
summary: State dispatcher for a BeastOut-related battle/overworld GUI object that jumps to one of three
  per-state handlers selected by the byte at object+8.
interface: void battle_dispatchBeastOutGuiState_811C11C(Object* r5 /* object */); // tail-calls handler
  via mov lr,pc/bx r0; handler's outputs surface as r2 r3 r5 r10 r11
details: "Tiny trampoline-style dispatcher: reads the state byte at r5+8 and uses it\nUNSCALED as a word-offset\
  \ into the handler table at off_811C130 (so the\nstored value must be 0/4/8, not 0/1/2 — it is a byte\
  \ offset, not an index).\nThe selected thumb handler is entered with mov lr,pc / bx r0, which makes\n\
  the call appear to return straight to this function's own caller (pop {pc}),\neffectively a tail call.\
  \ r0 still holds the handler address and r1 the raw\nstate byte when the callee starts. Handler table:\n\
  \  0 -> battleObject_initBeastOutOverworldGui_811C13C (state init/draw of the\n       Beast Out overworld\
  \ GUI)\n  4 -> sub_811C18C\n  8 -> sub_811C1A4\nOutputs (r2 r3 r5 r10 r11) are produced by whichever\
  \ handler runs, not by\nthis function itself; nzcv, r0-r1, r4, r6-r9, r12 and lr are clobbered\ndownstream.\
  \ Object pointer arrives in r5, matching the project's usual\nper-object worker convention.\n"
