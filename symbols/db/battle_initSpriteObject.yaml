name: battle_initSpriteObject
address: '0x080CEB24'
kind: function
status: probable
summary: 'Re-initializes a battle object''s sprite and state: recomputes panel-derived coordinates, zeroes
  Z height, loads sprite resource 0x80 (args 8, 0x12) shadowless, sets animation 0x1E with palette 0,
  syncs flip to facing, then stores CUR_STATE_UPDATE to transition to per-frame update.'
interface: (r0-r4 = clobbered; uses r5 = battle object pointer) -> r0 = CUR_STATE_UPDATE stored to object;
  no return value
details: Operating on the object in r5, it first recomputes pixel X/Y from panel grid coordinates and
  zeroes the object's Z height (oBattleObject_Z16). It then loads sprite resource 0x80 with arguments
  8 and 0x12 via sprite_load, marks the sprite shadowless, and sets oObjectHeader_Flags bit 1 (value 2).
  Animation index 0x1E is written to both oBattleObject_CurAnim and its copy, the animation data is loaded,
  palette 0 is selected, and the sprite's horizontal flip is synced with the object's effective facing
  via object_getFlip. Finally it stores CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized,
  making this the tail of an object spawn/reset sequence that hands control to the per-frame update handler.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_setCoordinatesFromPanels followed by strh r0=0 to oBattleObject_Z16 places the object
    on its panel at ground level; sprite_load(0x80, 8, 0x12) + sprite_noShadow + flags |= 2 configure
    the object's sprite resource and render flags; anim 0x1E written to oBattleObject_CurAnim/CurAnimCopy
    then sprite_setAnimation and sprite_loadAnimationData select the initial animation; object_getFlip
    -> sprite_setFlip aligns sprite facing with alliance/DirectionFlip; store of CUR_STATE_UPDATE into
    oBattleObject_CurStateActionPhaseAndPhaseInitialized ends the routine as a state initializer
  refs:
  - bn6f/asm/asm31.s:49016
  - 0x0800E456 object_getFlip
  - 0x0800E29C object_setCoordinatesFromPanels
  - 0x080026E4 sprite_load
  reproduce: python3 tools/asmcat.py 0x080CEB24
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal almost exactly: object_setCoordinatesFromPanels at line 2, zeroing
    Z16, sprite_load(0x80,8,0x12), sprite_noShadow, setting Flags bit 1, writing 0x1E to CurAnim/CurAnimCopy,
    sprite_setAnimation, sprite_loadAnimationData, sprite_setPalette(0), object_getFlip→sprite_setFlip,
    and finally storing CUR_STATE_UPDATE. However the summary incorrectly labels 0x12 as ''anim''—it is
    merely the third argument passed to sprite_load (a sub-resource/type parameter); the animation index
    is 0x1E, set later via sprite_setAnimation. The details section gets this right. The name battle_initSpriteObject
    is acceptable.; run wf investigate investigate-20261018-155607; proposed by Hyper glm-5.3-flash, revised
    by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
