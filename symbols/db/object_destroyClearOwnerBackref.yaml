name: object_destroyClearOwnerBackref
address: '0x080CB3FC'
kind: function
status: probable
summary: Battle-object destructor that clears another object's pointer to this object before destroying
  it.
interface: (r5 = battle object to destroy) -> r0 = destroyed object pointer; flags from object_genericDestroy
details: This is a custom destructor for a battle object whose ExtraVars field points to another object's
  slot. It reads [r5+oBattleObject_ExtraVars], and if that slot's first field still points back at r5,
  it writes 0 there, clearing the mutual link so the other object doesn't hold a dangling pointer. It
  then falls through to object_genericDestroy, which releases panel tile reserves, collision data, and
  the object memory. r5 (not r0) carries the object pointer, matching the project's destructor calling
  style. The bne means it only nulls the slot when it genuinely references this object, tolerating stale
  or changed links.
