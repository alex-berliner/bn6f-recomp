status: confirmed
summary: 'Per-action collision bookkeeping step for the battle object: drop old collision, spawn hit effect, then
  either destroy the object (if the battle is over) or run its CurAction collision handler, present the new collision
  data, and highlight its current panel.'
interface: void object_runCollisionStep_80C54E0(struct BattleObject* r5 /* battle object */, u32 r4 /* unused in
  fn body but callee-saved in callers */, u32 r7 /* preserved */, u32 r8 /* r4 of caller? (caller convention) */,
  u32 r10 /* ??? */); clobbers r0-r4, r6, r9, r11, r12, lr; preserves r7; sets NZCV.
details: "Operates on a battle object passed in r5 (oBattleObject_* layout).\nFlow:\n  1. object_removeCollisionData()\
  \ — drop the previous frame's collision.\n  2. object_spawnCollisionEffect() — emit the per-object hit/contact\
  \ VFX.\n  3. battle_isBattleOver() — if true: object_clearCollisionRegion() then set\n     [r5 + oBattleObject_CurStateActionPhaseAndPhaseInitialized]\
  \ = CUR_STATE_DESTROY and return.\n  4. Else: read [r5 + oBattleObject_CollisionDataPtr] (R7) and if\n     [r7\
  \ + oCollisionData_FlagsFromCollision] != 0, call object_clearCollisionRegion().\n  5. Dispatch through the table\
  \ at off_80C551C indexed by oBattleObject_CurAction:\n     - Loads the table base from off_80C5518 -> off_80C551C,\
  \ indexes by r0 = CurAction,\n       gets r1 = sub_80C552A+1 (only one entry in the table), and tail-calls it\
  \ via\n       \"mov lr,pc; bx r1\" (R0=CurAction, R1=table entry at the time of dispatch).\n  6. object_presentCollisionData()\
  \ — commit the new collision data.\n  7. object_highlightPanel(r0 = [r5 + oBattleObject_PanelX], r1 = [r5 + oBattleObject_PanelY])\
  \ — highlight the panel the object occupies.\nQuirks:\n  - The \"bl sub_80C552A\" right after the bx is unreachable\
  \ (the bx r1 returns via lr).\n    The disassembler flagged the post-bx bl as a regular call, but the bx already\
  \ transferred control.\n  - off_80C551C is a per-action dispatch table; here it only has one entry (sub_80C552A+1,\n\
  \    the +1 sets Thumb bit), suggesting this function is shared by a class of objects that\n    all use the same\
  \ collision sub-handler.\n  - Inlined GUEST_CALL style: helpers are externs; the function does not stack the object\
  \ pointer.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed;\
  \ tools/abi/retype_queue.tsv)."
