open_questions:
- Is r4 a "previous object pointer" or a sibling object pointer? The register contract lists r4 as input but the
  function body never reads it. Likely preserved by callee but the actual object is r5.
- Which callers go through this routine? The proposed name assumes "object" because of oBattleObject_ offsets and
  object_* helpers, but the subsystem prefix may need to be battle_object_ or just keep sub_80C54E0.
- What is the full table at off_80C551C? Only one entry is visible here; other objects may share this table and
  route different CurActions to the same handler, or the table may be larger and unindexed by callers.
- 'r8/r10 caller-saved register conventions: their role is not deducible from this routine alone.'
