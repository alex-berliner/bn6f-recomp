name: chatbox_804222C
address: '0x0804222C'
kind: function
status: confirmed
summary: 'Advance the chatbox text script by one entry: copy the referenced string into the next slot of the text
  ring buffer, bump the slot pointer, and push the new script position onto a depth-indexed stack.'
interface: void chatbox_advanceString_804222C(u32 r4_scriptPtr, struct Chatbox* r5_chatbox) -> r0=1, r2=4, r4=dst
  (NZCV clobbered)
details: 'Reads r4 as a script-cursor pointer and r5 as the chatbox struct.

  Bumps the recursion/depth byte at oChatbox_Unk_05, then indexes

  A_byte_8043B54 by LD8(scriptPtr+2) << 3 to fetch a (srcPtr, wordCount)

  pair. Computes the destination in the 64-byte-slot text ring buffer at

  A_byte_200AFA0 using the u16 slot index at chatbox+0x64, calls

  CopyWords(srcPtr, dst, wordCount), advances that slot index, stores

  dst at oChatbox_TextScriptCursorPtr and the advanced script pointer

  (scriptPtr+3) at oChatbox_Unk_44 and at chatbox+0x140+(depth-1)*4.

  Returns 1 with r2=4 (opcode 04 in the bytecode dispatch loop at

  0x80422A0-ish) and r4 = dst (the newly written string in the ring

  buffer, which the next script op will consume).


  Register form kept (C call semantics could not work): r4 = script pointer, r5 = chatbox struct, r0/r2/r4 returned.'
