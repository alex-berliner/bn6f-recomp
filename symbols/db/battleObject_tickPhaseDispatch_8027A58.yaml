name: battleObject_tickPhaseDispatch_8027A58
address: '0x08027A58'
kind: function
status: confirmed
summary: 'Per-frame update dispatcher for the custom-screen battle object: selects a phase handler from
  a jump table by the object''s kind byte, then runs chip-select animation tick and a second post-update
  pass.'
interface: 'void battleObject_tickPhaseDispatch_8027A58(void* self /*R5 = battle object at S20364C0*/);
  in: R4 R6 R10 passed through to handlers; out: R2 R3 R4 R5 R6 modified by handler + post-passes, R8-R12
  pass through; clobbers: R0 R1 R7 LR NZCV'
details: 'Reads a pre-scaled kind byte (0/4/8/12, already an offset) from self+2 and

  indexes the 4-entry word table at off_8027A74 via BX. The four phase

  handlers are: sub_8027A84 (init/entry step), screenFadeWaitStep (wait for

  a screen transition), battle_customScreenConfirmSelectedChip (player

  confirms chip selection), and battle_tickTutorialCustomScreen (tutorial

  overlay tick on the custom screen). The handler may modify R5, so the

  subsequent two calls receive the updated pointer. After the dispatch,

  battleObject_chipSelectAnimTick_8029C08 advances the chip-select animation

  state, and sub_802899C runs a second standard post-update pass (likely

  object lifetime / cleanup checks). R10 from the caller is visible to

  the inner calls via the register file. The outer code itself modifies

  none of R8-R12 directly; those pass through untouched from the handler.

  '
