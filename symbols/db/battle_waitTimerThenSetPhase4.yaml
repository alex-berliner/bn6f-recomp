open_questions:
- No callers are known, so the object type and what phase 4 means for it are unknown
- Whether Timer is reloaded elsewhere (e.g., by the previous phase) and its units (frames) is inferred
  but unconfirmed
- Whether CurPhaseAndPhaseInitialized bit 15 (phase-initialized) is expected to be set by the phase-4
  handler itself
