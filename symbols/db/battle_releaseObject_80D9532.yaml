name: battle_releaseObject_80D9532
address: '0x080D9532'
kind: function
status: confirmed
summary: Releases/clears a battle entity by nulling the pointer held in its 0x60 field's target and setting
  its state byte to 0xC.
interface: void battle_releaseObject_80D9532(void *object); // r0 = object pointer (may be NULL); returns
  with r5 = object (or incoming r5 if object was NULL), C set and V clear from the `cmp r0,#0`
details: "Takes a battle object/entity pointer in r0. If it is NULL the function returns immediately\n\
  (r5 is preserved, so callers see their incoming r5 again). Otherwise it:\n  - loads the 32-bit pointer\
  \ stored at object+0x60 and stores 0 through it\n    (i.e. *object->field60 = NULL — the record that\
  \ field points at is cleared at its\n    own location, not the field itself);\n  - stores the byte 0xC\
  \ (12) at object+9, which looks like a state/phase marker marking\n    the object as finished/released\
  \ (offset 9 used as a state byte is common for battle\n    entities in this codebase).\nThe original\
  \ r0 is copied into r5 before use, so r5 comes back holding the object pointer.\nBecause the only flag-setting\
  \ instruction is `cmp r0, #0`, the function leaves C=1 and\nV=0 (NZ reflecting the object pointer) on\
  \ every return path, and callers are documented\nas reading C and V. Clobbers r0, r1 and NZ; preserves\
  \ r5. Thumb, push {r5,lr}/pop {r5,pc}.\nThe trailing dword_80D9548 (0xF880080) is pool data after the\
  \ function end, not code.\n"
