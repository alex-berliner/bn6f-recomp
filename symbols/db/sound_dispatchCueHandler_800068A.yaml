name: sound_dispatchCueHandler_800068A
address: '0x0800068A'
kind: function
status: confirmed
summary: Looks up a sound cue's handler word in the cue table and dispatches it via sound_8000808 with the caller's
  context and the shared sound callback.
interface: void sound_dispatchCueHandler(u32 cueIndex /*r0*/, u32 arg /*r1*/, u32 context /*r10*/); returns restored
  context in r2/r10, clobbers r0-r3, preserves r4-r7/r10
details: Reads the cue table pointer off_8000704, indexes it with r0*4 to fetch the handler word for this sound
  cue, then tail-dispatches through sound_8000808 (r0 = handler word, r1 = caller's argument passed through, r2
  = caller's context, r3 = sub_814E87C|1 shared sound callback). Because sound_8000808 uses r10 as scratch, this
  wrapper saves r10 on the stack around the call and restores it afterward; the restored value is left in both r10
  and r2 for the caller. r1 is never read here itself - it is only forwarded to sound_8000808, so its meaning depends
  on the dispatch code. r4-r7 and lr are the standard pushed/popped set; r4-r7 are untouched.
