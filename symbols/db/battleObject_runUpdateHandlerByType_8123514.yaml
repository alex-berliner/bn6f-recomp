open_questions:
- The exact meanings of the two `bl`s `pet_menu_drawCharacterStatBlock_8123C98` and `sub_8123E58` are not shown
  by this assembly; the lifter's name guesses are not verified, only their address/contract.
- Which of the seven table entries correspond to which battle-object `CurState` values (initialize/update/destroy
  or per-actor-type) is unknown — the table entries themselves are not described here.
