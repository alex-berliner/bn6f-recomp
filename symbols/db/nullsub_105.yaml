name: nullsub_105
address: '0x080EAC5C'
kind: function
status: confirmed
summary: Empty no-op stub sitting at the start of the AI attack jumptable region, serving as the handler for one
  of the AI attack state IDs (0x0f, i.e. the entry just before 0x10).
interface: static void nullsub_105(void)
details: 'A nullsub: immediately returns with mov pc, lr, touching no registers, memory, or flags. It is placed
  directly before the AIAttackJumptable data table (a table of .word entries mapping AI attack state IDs 0x10..0x5d
  to handler routines such as aiAttack_stepStateMachine_80EB04C, battle_aiAttackDispatch_80EB436, megamanChargeShotAiAttack_80EBE00,
  bubbleShotAttack_80ECBB0, tornadoAiAttack_80ED454, etc.). Because the table''s first entry is index 0x10, the
  stub''s position suggests it fills the handler slot for the state just before that index (0x0f) in whatever dispatch
  structure indexes these handlers; as a no-op it makes that attack state do nothing. The function is followed by
  the table itself in the same overlay region, with cross-version annotations (EXE6F: 80f05f0, EXE6G: 80f1920) noting
  the corresponding addresses in the other BN6 versions.

  '
