name: battle_checkLockedEventTable_808CDC4
address: '0x0808CDC4'
kind: function
status: confirmed
summary: Scans the battle AI's per-map-group locked-event table and reports (via flags/index) whether any gated
  event-flag condition currently matches.
interface: u32 battle_checkLockedEventTable_808CDC4(r10 battle_ctx) -> bool /* Z clear = match */; out r1 = ai_mode*3
  + matched entry index (0 if none), r2 = saved r8 value passed in, r3 = leftover from last flag test; r4/r6 preserved-but-touched
  (push/pop), r5/r7/r8 preserved
details: 'Calls ai_getAIModeForMapGroup_808D084 to get the current AI mode for r10''s battle/map context, then indexes
  a table-of-tables at off_808CEBC (one pointer per AI mode) and walks up to 3 entries (4 entries when ai_mode >=
  3). Each entry is 8 bytes: u16 gate event flag, u16 range-start flag, u16 range-end flag, u16 padding. An entry
  matches when its gate flag is set (TestEventFlag) AND at least one flag in the inclusive range [start, end] is
  set (TestEventFlagRange). On the first match the loop stops with the index on that entry and the found flag =
  1; otherwise the index resets to 0. Return value convention: r1 = ai_mode*3 + entry index, Z flag clear when a
  locked event matched (from a tst of the found flag). Quirks: r8 is saved/restored by pushing the value (pop into
  r2), so callers observe the incoming r8 in r2; r4 and r6 are push/popped so they read back with their entry values
  even though the helper calls clobber r4; r3 is not reset, so it carries whatever the last TestEventFlag/TestEventFlagRange
  left.

  '
