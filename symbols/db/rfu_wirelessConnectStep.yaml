name: rfu_wirelessConnectStep
address: '0x08049416'
kind: function
status: probable
summary: 'One step of the wireless-connection state machine: on failure shows network text and sets phase
  0x38, on cancel paths sets 0x3C, and on success initializes the wireless session and sets phase 0x44.'
interface: (r0 = ? unused/ignored; r5 = network state context struct) -> r0 = result of sub_8049BC0; writes
  next phase id into [r5+1]
details: 'This is a phase handler of the network/Coblan main state machine (it ends with the standard
  sub_803A104 advance call and tail-calls sub_8049BC0). r5 points to a state struct whose byte at +1 stores
  the next phase id: 0x38 when a check via sub_814656C fails, in which case text script 0xF is displayed
  through sub_803BB2C (the network-text selector keyed by main phase); 0x3C when the sub_803CB18(8) test
  says a link already exists or after probing with sub_803C330/sub_803C2A0 and sub_803CB00(0x20); and
  0x44 when the sub_803CB18(0x10) test passes, in which case sub_8132648 and rfu_initWirelessSession are
  called to actually start the wireless link. sub_8049680 at entry decides which of the two paths runs;
  its return flags are read directly after the call. r5 is never loaded in the visible body, so it must
  come from truncated setup code or a global the callee arranges.'
