name: objectUpdateAnimByFlag
address: '0x08118A00'
kind: function
status: probable
summary: Object helper that picks an animation id (1 if chatbox/event flag 0x80 is set, else 0x23) into
  the object's work, has sub_8118AB0 recompute the desired anim into [r5+0xc], and only calls sprite_setAnimation/sprite_loadAnimationData
  when the new anim differs from the previously-applied one in [r5+0xd].
interface: (r5 = object/sprite struct pointer, r0/r1 clobbered) -> void; flags from the flag test are
  used internally only
details: 'r5 points at an object/sprite work struct (r5 is not set here, so it is an incoming/global pointer).
  It tests bit 0x80 of the chatbox/event flag word via chatbox_mask_eFlags2009F38: if set, animation id
  1 is stored at [r5], otherwise 0x23. It writes 2 to [r5+0xc] and calls sub_8118AB0, which appears to
  recompute the desired animation into [r5+0xc]. It then compares [r5+0xc] against [r5+0xd] (previous/last-applied
  animation) and, when they differ, calls sprite_setAnimation with the new id and sprite_loadAnimationData
  to load its frames; if unchanged it returns without touching the sprite.'
