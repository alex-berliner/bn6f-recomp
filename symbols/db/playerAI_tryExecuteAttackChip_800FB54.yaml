open_questions:
- The semantic meaning of the fixed-id set (0xD/0x1F/0x20/0x29/0x2D/0x5) — names not visible in the assembly; mapping
  them to real chip names would settle the "shortcut" role of that branch.
- Whether sub_8012CB2 genuinely corresponds to a chip id 0x18 (e.g. a Hero Sword / elemental sword), or just a regular
  attack handler reused here.
