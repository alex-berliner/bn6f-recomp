name: calcDistSqToPoint
address: '0x0811438E'
kind: function
status: probable
summary: Returns the squared distance from an (x,y) argument pair to the (x,y) point stored in the struct
  pointed to by r3.
interface: (r0 = x, r1 = y, r3 = ptr to {s32 x; s32 y} point) -> r0 = ([r3]-x)^2 + ([r3+4]-y)^2; flags
  from final add
details: Loads two s32 fields from the struct at r3 (offsets 0 and 4, i.e. an x/y point pair), subtracts
  the r0/r1 arguments from them, squares each difference with mul rX,rX, sums the squares, and returns
  the result in r0 without touching lr (it never pushes, just mov pc,lr). No memory is written and no
  callees are used; it is a pure helper. The result is a squared distance, so callers presumably compare
  it against thresholds or other distances to avoid an isr/sqrt. Nothing here reveals which subsystem's
  point struct r3 points to; the only known caller sub_8114316 is itself unnamed, and the route is only
  'battlesweep'.
