name: spawnChargeShotChargeObject_80E0F02
address: '0x080E0F02'
kind: function
status: confirmed
summary: Spawns the charge-buildup effect object that orbits a brawler while a charge shot is powering up and links
  it to its owner.
interface: 'void spawnChargeShotChargeObject(owner /* r5: battle object ptr */, resultSlot /* r7: u32* slot tracking
  the effect */); sets NZ from the new-object null check; r4-r7 preserved, c unmodified'
details: "Calls object_spawnType4 with r0 = 8 to allocate an 8-byte effect object of\nspawn type 4; the spawner\
  \ returns the new object in r5, so the caller's r5\nis saved/restored around the call. After the spawn, r5 holds\
  \ the new object\nand a null check (\"mov r0, r5\" / beq) gates the linking. If it spawned:\n- newObject->oBattleObject_RelatedObject1Ptr\
  \ = owner (the object charging the shot)\n- *resultSlot = newObject, and newObject->oBattleObject_ExtraVars =\
  \ resultSlot,\n  so the effect can null the caller's slot when it dies\n- oObjectHeader_Flags (offset 0 of the\
  \ object header) |= 0x4\nThe spawned object presumably lives until the charge is released/cancelled,\nat which\
  \ point it clears *ExtraVars. On failure of the spawn the function\njust returns with the NZ flags from the null\
  \ check. r0 is left holding the\nnew object pointer (or 0) on return, but callers per the contract ignore it.\n"
