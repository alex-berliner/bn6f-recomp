name: object_spawnType1
address: '0x08003320'
kind: function
status: confirmed
summary: Spawns a battle object of type 1 from five arguments and runs its type-specific initialiser on success.
interface: (u8 obj_idx @r0, u32 x @r1, u32 y @r2, u32 z @r3, u32 params @r4) -> * BattleObject @r5 (NULL on failure);
  preserves r4, r6, r7; NZ flags reflect the spawn result on the failure path
details: 'Thin wrapper over SpawnBattleObjectCommon for object type 1. Builds a 5-word

  context block on the stack (obj_idx, x, y, z, params) using a push {r7,lr} +

  sub sp,#0x14 frame so that r7 points at the saved-r7 slot just past the

  argument block while callees run; the saved r7/lr slots sit at ctx+0x14 and

  ctx+0x18. Calls SpawnBattleObjectCommon(1, ctx), which returns the new

  BattleObject in r5. If r5 != 0, calls sub_8003400 (the type-1 init routine,

  which receives the new object in r5 and SpawnBattleObjectCommon''s r0-r3

  results untouched); if r5 == 0 the tst r5,r5 leaves the zero flag set as the

  last flag state on the return path. The result in r5 is the function''s only

  return value to callers.

  '
