name: t4_transitionToTextState1C
address: '0x0812D880'
kind: function
status: probable
summary: State-machine handler that saves the current state, switches the task to state 0x1C, and opens
  a text script (0x30 or 0x40) in the chatbox, also fixing up an in-progress screen fade.
interface: (r0 = unused, r1 = unused, r5 = task struct) -> void; flags clobbered
details: Reads the screen fade controller; if the fade mode is 0xC it re-arms SetScreenFade with mode
  8, level 0x10. It stores the current state byte [r5,#2] into [r5,#0x16] (previous-state slot), writes
  0x1C as the new state, and clears [r5,#3] and [r5,#0xC]. If bit 0 of [r5,#0x1b] is clear, it fetches
  eStruct200BC30, reads byte +0xE, and runs text script 0x30 if that byte equals 2, otherwise 0x40, from
  archive eTextScript201BA20 via the chatbox wrapper. Finally, if the saved previous state was nonzero,
  it calls sub_8120AB8 with that value, presumably a leave-old-state handler.
