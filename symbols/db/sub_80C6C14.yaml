name: sub_80C6C14
address: '0x080C6C14'
kind: function
status: confirmed
summary: Per-frame tick for a battle object that is currently on a panel-based collision effect (grass/fire/swamp
  etc.); spawns the effect, dispatches to the object's current action handler, or destroys the object if the battle
  ended or the panel doesn't react.
interface: 'void battleObject_collisionEffectTick_80C6C14(void);

  // inputs  (caller-saved on entry): r5 (battle object), r4, r8, r10, lr

  // outputs (caller-saved on exit):  r5, r8, r9, r10, r11, r12

  // clobbers: nzcv, r0-r3, r4, r6, lr

  // preserved: r7 (holds the object''s oBattleObject_CollisionDataPtr internally)

  '
details: "Dispatched for a battle object whose current state is sitting on an active\npanel collision effect (e.g.\
  \ grass/fire/holy panels).\nSequence:\n  1. object_removeCollisionData() – drop the object's previous collision\
  \ region.\n  2. object_spawnCollisionEffect() – respawn the effect's visual/region at the\n     object's panel.\n\
  \  3. battle_isBattleOver() – if the battle has already ended, take the\n     \"destroy\" path: object_clearCollisionRegion(),\
  \ set\n     oBattleObject_CurStateActionPhaseAndPhaseInitialized = CUR_STATE_DESTROY\n     (0x14) and return.\n\
  \  4. Otherwise read panel coords from oBattleObject_PanelX/_PanelY and call\n     object_getPanelParameters();\
  \ bit 0x10 of the returned parameter word\n     indicates the panel type reacts to collision effects. If the bit\
  \ is\n     not set, also take the destroy path above.\n  5. Load r7 = oBattleObject_CollisionDataPtr; if\n   \
  \  oCollisionData_FlagsFromCollision is non-zero, clear the region with\n     object_clearCollisionRegion() before\
  \ rebuilding.\n  6. Look up oBattleObject_CurAction (0 or 1) in the small jump table\n     off_80C6C58 and tail-call\
  \ the matching handler (THUMB+1 dispatch via\n     `mov lr,pc / bx r1`):\n       - sub_80C6C6A     – live object's\
  \ collision-aware tick\n       - battleObject_dyingTickDespawn_80C6CBA – dying/despawn tick\n  7. After the handler\
  \ returns, call object_presentCollisionData() then\n     object_highlightCurrentCollisionPanels() and return.\n\
  Quirks: the dispatch table entries are stored with the THUMB bit already set\n(sub_80C6C6A+1), so the routine\
  \ loads the address then `bx r1` directly.\nr5 is the battle object across the whole call (not preserved despite\
  \ being\nin the inputs/outputs of the contract – it is reloaded by callers).\nThe 0x14 stored at oBattleObject_CurStateActionPhaseAndPhaseInitialized\
  \ is\nCUR_STATE_DESTROY; the high bytes of that field (action/phase) are not\nzeroed here, so the stored value\
  \ is fully 0x14 here.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form\
  \ C allowed; tools/abi/retype_queue.tsv)."
