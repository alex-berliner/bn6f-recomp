name: battle_initAttackFromPreset_8113162
address: '0x08113162'
kind: function
status: confirmed
summary: Initializes a battle attack object's stats from a preset table selected by the attacker's attack index,
  then kicks off the attack with a duration of 10.
interface: void battle_initAttackFromPreset(attacker /*r4*/, context /*r5*/, attackObj /*r7*/) — returns flags from
  the state check (if it bails) or from object_setAttack0; clobbers r0-r3, preserves r4-r7
details: 'Reads the state byte at context+0x13 and passes it to sub_810971A; if the check returns 0 the function
  returns immediately without touching the attack object (flags on that path come from the cmp r0,#0). Otherwise
  it uses the byte at attacker+0x16 as an index into five parallel preset tables and fills the attack object: byte
  at +0xF from byte_81130DE[preset], byte at +0xE from byte_81130D8[preset], byte at +0xC from byte_81130C6[preset],
  byte at +0x18 from byte_81130D2[preset], halfword at +0x8 (likely power/damage) from byte_81130C0[preset]. The
  halfword at +0xA is hard-coded to 10 (attack width or hitbox size), and the word at +0x30 is loaded from byte_81130A8[preset*4]
  (likely a sprite/animation pointer or per-preset word parameter). Finally calls object_setAttack0 with r0=10,
  presumably starting the attack with a 10-frame/step lifetime or phase. The tables sit together at 0x081130A8-
  0x081130DE, confirming they describe one family of attack presets.

  '
