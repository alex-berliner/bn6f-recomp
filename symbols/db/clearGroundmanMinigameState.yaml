name: clearGroundmanMinigameState
address: '0x08143CC8'
kind: function
status: probable
summary: Clears BBS flag, event flag 0x1BB, then for the selected groundman minigame map table, zeros
  per-slot records at unk_2011EA0+index*4 and clears event flags 0x16F0+index for each nonzero entry.
interface: () -> r0 = 0; no flags relevant
details: First clears some BBS-related flag via reqBBS_clearFlag_8140A0C and event flag 0x1BB. It then
  calls GetGroundmanMinigameMapIndex and uses the result to pick one of two entry tables (byte_8143D14
  / byte_8143D30, stride 8, via off_8143D0C). For each entry whose first byte is nonzero, it writes 0
  to the 4-byte word at unk_2011EA0 + index*4 and clears event flag 0x16F1 + (index-1), so indices 1..5
  map to flags 0x16F1..0x16F5. This looks like wiping collected-item flags and per-slot records when the
  GroundMan minigame area is (re)initialized. The 0xFF padding bytes in each 8-byte entry are unused by
  this routine.
