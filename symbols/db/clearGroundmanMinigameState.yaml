  date: '2026-10-18'
  detail: 'bl GetGroundmanMinigameMapIndex then table lookup ldr r4,[r4,r0] selects the per-map entry
    list; loop: ldrb r0,[r4]; beq end; str 0 to unk_2011EA0+idx*4 zeroes a per-index 4-byte slot; dword_8143D48
    = 0x16F1 with sub r1,#1: clears event flag 0x16F0+idx per entry; bl ClearEventFlagFromImmediate for
    EVENT_1BB and reqBBS_clearFlag_8140A0C at entry show a reset/clearoutine context; tables only contain
    indices 1..5, matching a small fixed set of collectible slots'
