name: battle_addCounterAmount
address: '0x0802EEA2'
kind: function
status: probable
summary: Adds an encoded amount (256 per unit) to a battle entity's counter at field 0x28, choosing a capped or
  alternate add path based on bit 7 of the argument.
interface: (r0 = encoded amount, bit7 = variant flag, bits0-6 = unit count; r5 = battle entity pointer) -> r0 =
  result of the add callee; calls battle_addCappedCounter or sub_802E04E
details: 'The entity pointer is passed in r5, not r0, so this is a helper meant to be called from code already holding
  the entity. It tests bit 7 of r0: if clear, it shifts r0 left by 8 and calls battle_addCappedCounter, which adds
  to the entity''s 16-bit counter at +0x28 with saturation at 0x4000; if set, it masks to 7 bits, shifts left by
  8, and calls the unknown sub_802E04E instead. The shift means each unit of the argument contributes 0x100 to the
  counter, so the counter stores the value in 1/256 subunits. Field +0x16 of the entity is loaded as the second
  argument (r0) to the callee in both paths. Called from battle_chargeShotSetup, the counter is most plausibly the
  Navi''s charge-shot energy/charge meter.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'tst r0, r1 with r1=0x80 selects between two add paths (sub_802EEA2 lines 3-5 vs 9-11); lsl r1, r0, #8
    before both callee calls shows amounts are scaled by 256; ldrb r0, [r5,#0x16] passes an entity field as the
    first callee argument in both branches; callee battle_addCappedCounter adds to a 16-bit field 0x28 saturating
    at 0x4000, confirming a counter-add; caller battle_chargeShotSetup (charge shot setup) indicates the counter
    is charge-related'
