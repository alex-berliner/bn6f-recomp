name: submenu_confirmSelection
address: '0x0804AB10'
kind: function
status: probable
summary: 'A-button confirm handler for a menu: recomputes a 1-based page/group index, updates two state
  bytes, runs the apply helpers and plays the menu-select sound.'
interface: (r5 = menu state struct pointer; no r0-r3 args) -> r0 = 1 if A newly pressed else 0; writes
  r5+0x44 and r5+0x45
details: Calls IsButtonPressed(JOYPAD_A); on press it computes ([r5+3] >> 2) + 1, i.e. a 1-based index
  of the block of 4 that byte 3 falls in, and stores it at r5+0x44. It then calls sub_804AB4C, copies
  r5+0x44 into r5+0x45, calls sub_804AB6C, and plays SOUND_MENU_SELECT via PlaySoundEffect. r6 is used
  as the boolean return and r5 is never set inside, so the caller must establish the struct pointer. The
  two callees are unnamed but are invoked only on confirm, suggesting redraw/commit steps on the same
  struct.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl IsButtonPressed with r0=JOYPAD_A gates the whole body; mov r6,#1 / return r6 gives the pressed
    flag; ldrb r0,[r5,#3]; lsr r0,#2; add r0,#1; strb r0,[r5,#0x44] computes a 1-based group index; bl
    sub_804AB4C ... bl sub_804AB6C run only inside the A-pressed branch; mov r0,#SOUND_MENU_SELECT; bl
    PlaySoundEffect confirms a UI selection action; sole caller sub_804A3FC and menu-flavored sound/keys
    point at a submenu handler
