name: sub_8118FE4
address: '0x08118FE4'
kind: function
status: confirmed
summary: 'Per-frame update for a battle object: dispatches a state handler by the +9 state byte, then reloads the
  sprite animation if the graphic id (+4) changed.'
interface: void sub_8118FE4(battle_obj* r5, ctx* r10) — uses r11 as scratch/likeness link; dispatch handlers may
  tail-call further code
details: 'Reads the object''s state byte at r5+9 and dispatches through a 2-entry table: state 0 -> battle_dispatchEventScript_8119018
  (runs an event script), state 1 -> sub_8119084. The dispatch is done via a computed blx-style call (mov lr, pc;
  bx r0) so handlers execute as Thumb and can push additional frames. After the handler returns, it compares the
  object''s graphic id at r5+4 with the cached copy at r5+0xC; if different it stores the new id and calls sprite_setAnimation(graphic),
  sprite_loadAnimationData(), sprite_noShadow(), then sub_81190E0 (likely position/orientation sync), so the sprite
  is only reloaded when the graphic actually changes. r5 (battle object) and r10 (context) are passed through to
  the handlers. clobbers flags and most low registers; lr is used as return chaining.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
