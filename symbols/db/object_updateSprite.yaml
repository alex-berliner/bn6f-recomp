name: object_updateSprite
address: '0x0801BBAC'
kind: function
status: confirmed
summary: Per-frame sprite ticker for one battle object — reloads the object's animation if it changed and advances
  it, skipping when the battle is paused, time is stopped, or the object's flags forbid updates.
interface: void object_updateSprite(r5 = battle object header ptr, r10 = battle state); trashes r0-r3, preserves
  r4; returns caller-facing r0/r1/N/Z from the last callee run (r2-r5 and C/V are pass-through leftovers)
details: "Runs once per battle object in the battle object loop. Gate checks in order:\n1. battle_isPaused() — if\
  \ the battle is paused (Z clear), return without touching the sprite.\n2. Reads oObjectHeader_Flags (byte) on\
  \ the object:\n   - bit 0 (OBJFLAG_UPDATE_ENABLE) clear: object never ticks its sprite, return.\n   - bit 2 (0x08,\
  \ OBJFLAG_NO_SPRITE_TICK): sprite update explicitly disabled, return.\n   - bit 4 (0x10, OBJFLAG_SKIP_TIMESTOP):\
  \ if clear, battle_isTimeStop() is consulted and the object freezes while time is stopped (custom/boss cutscene-style\
  \ freezes); if set, the time-stop check is bypassed.\n3. If the object has a non-null oBattleObject_CollisionDataPtr,\
  \ the byte oBattleObject_PreventAnim is checked; nonzero suppresses only the animation *reload* (the object still\
  \ gets sprite_update called, since loc_801BBEE is reached via loc_801BBDA falling through... actually on PreventAnim!=0\
  \ it returns early, skipping sprite_update entirely this frame — useful while a hit/hurt animation must not be\
  \ replaced).\n4. Compares oBattleObject_CurAnim against oBattleObject_CurAnimCopy (a shadow of the currently loaded\
  \ animation). On mismatch: sprite_setAnimation(curAnim) selects the new animation, sprite_loadAnimationData()\
  \ loads its frame data, and CurAnimCopy is synced to CurAnim.\n5. Finally sprite_update() advances the animation\
  \ frame/OAM for the object.\nStructures: the battle object header at r5 — oObjectHeader_Flags, oBattleObject_CollisionDataPtr,\
  \ oBattleObject_PreventAnim, oBattleObject_CurAnim, oBattleObject_CurAnimCopy. r10 is passed through implicitly\
  \ as the battle-state pointer used by battle_isPaused/battle_isTimeStop.\nQuirks: the caller-facing r0/r1 and\
  \ N/Z are just whatever the last executed callee or in-function TST left behind — callers are expected to ignore\
  \ them. C/V are never explicitly set anywhere in the function.\n"
