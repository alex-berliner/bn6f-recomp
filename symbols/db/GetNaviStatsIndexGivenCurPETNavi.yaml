name: GetNaviStatsIndexGivenCurPETNavi
address: '0x08014018'
kind: function
status: confirmed
summary: 'Translates the currently selected PET navi ID into which navi-stats slot it uses: Megaman uses slot 0,
  all other navis use slot 1.'
interface: 'u8 GetNaviStatsIndexGivenCurPETNavi(u8 naviId) // in: r0 = current PET navi ID; out: r0 = navi-stats
  index (0 or 1); clobbers r1 only for the table address'
details: Performs a single byte lookup in CurPETNaviToNaviStatsIndexTable indexed by the current PET navi ID (r0)
  and returns the result. Per the code comment, Megaman maps to index 0 and every other navi maps to index 1, so
  callers use this to pick which set of navi stats applies to the currently equipped navi (e.g., base Megaman vs.
  any transformation/cross/other navi using the generic slot). Tail-call via mov pc, lr; no flags set, r1 clobbered
  with the table address.
