name: battle_spawnTypeB2Object
address: '0x080DBB0C'
kind: function
status: probable
summary: Spawns a battle object of type 0xB2 and, on success, initializes its X/Y/Z, Element, damage/stamina-disabler
  word, and copies Alliance and DirectionFlip from r5; ORs 0x10 into the new object's oObjectHeader_Flags.
interface: (r0 = X position, r1 = Y position, r2 = element byte, r5 = source/template battle object, r6
  = DamageAndStaminaDamageCounterDisabler value) -> r0 = new battle object pointer (or unchanged r5 /
  failure path if object_spawnType3 reports failure); no meaningful flags
details: A thin wrapper over object_spawnType3 hardcoded to type id 0xB2. The push {r0-r2,r5} / pop {r1-r3,r5}
  pair shuffles the caller's first three arguments into r1-r3 for the field stores while preserving r5
  across the call. If the spawn reports failure (beq, testing the callee's return condition), nothing
  is written. On success the new object gets X and Y from the arguments, Z = 0, the element byte, and
  the r6 damage/stamina-disabler word; Alliance and DirectionFlip are copied byte-for-byte from the object
  in r5. Finally 0x10 is OR-ed into the new object's oObjectHeader_Flags. The writes go to r0 (= r5's
  value at spawn return) while the Alliance/DirectionFlip reads use the popped template pointer, so the
  new-object pointer must come back from object_spawnType3 in r5 with success reported separately.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl object_spawnType3 with r0=0xb2 fixes the spawned object type; beq skips all initialization
    on failure; str r1/[r0,#oBattleObject_X], str r2/[r0,#oBattleObject_Y], Z=0 place the object from
    caller arguments; strb r3 into oBattleObject_Element and str r6 into oBattleObject_DamageAndStaminaDamageCounterDisabler
    set combat fields from args; ldrb Alliance/DirectionFlip from r5 and strb them into the new object
    copy allegiance and facing from a source object; orr r2, r1 (0x10) into oObjectHeader_Flags marks
    the new object with flag 0x10
  refs:
  - bn6f/asm/asm31.s:78238
  - 0x080B8B08 sub_80B8B08
  - 0x08003358 object_spawnType3
  reproduce: python3 tools/asmcat.py 0x080DBB0C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal: it spawns type 0xB2 via object_spawnType3, stores X/Y/Z/Element/r6
    and copies Alliance/DirectionFlip from r5, and ORs 0x10 into oObjectHeader_Flags. However, the summary''s
    wording ''caller-given grid position'' and ''source/template battle object'' overspecifies; r5 is
    just whatever the caller left there, used solely for copying two bytes, so a clearer summary is preferable.;
    run wf investigate investigate-20261019-030611; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
