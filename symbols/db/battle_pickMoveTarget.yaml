name: battle_pickMoveTarget
address: '0x08115FCE'
kind: function
status: probable
summary: Reserves the object's current panel, tests directional candidates against flag 0xA000 to pick
  the object's next movement target panel X/Y, stores them at offset 0x69/0x6A, releases the reserve,
  and returns the target coordinates.
interface: (r0 = object PanelX, r1 = object PanelY, r5 = battle object) -> r0 = target X, r1 = target
  Y; writes fields 0x69/0x6A (target X/Y) and oBattleObject_DirectionFlip
details: Reserves the panel under the object via object_reservePanel, then reads the object's collision
  flag word with object_getFlag. If flag bits 0xA000 are set it calls sub_81160B0 (kept if nonzero, otherwise
  reuses the current 0x69/0x6A values) and clears oBattleObject_DirectionFlip. Otherwise it runs sub_8116044/811606A/8116090
  as directional checks; if any passes, sub_81161B0 and sub_8116210 produce the new target coordinates,
  else the old 0x69/0x6A values are kept. The chosen X/Y is written to [r5,#0x69]/[r5,#0x6A], the panel
  reserve is released, and the target X/Y is returned in r0/r1 (saved across the release call). Fields
  0x69/0x6A appear to be the object's move-target coordinates used by the movement executor.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_reservePanel / object_removePanelReserve around the body: claims then frees the panel
    the object occupies; tst r0, #0xA000 on object_getFlag result picks between forced-move path and the
    three-check normal path; strb r0/r1 to [r5,#0x69]/[r5,#0x6A] with the same fields read back as fallback:
    stores move-target coords; push {r0,r1} around bl object_removePanelReserve and pop before return:
    r0/r1 are the function''s return values (target X/Y); push {r0,r1}; mov r0,#0; strb [r5,#oBattleObject_DirectionFlip]:
    one path resets the facing/flip field'
