name: sub_80C96C8
address: '0x080C96C8'
kind: function
status: confirmed
summary: Initializes a spinning-shuriken battle object from a template entry indexed by Param2, loads sprite/anim/palette,
  plays spawn SFX, freezes velocity to current position, then transitions to the per-frame update state.
interface: void battle_spawnShuriken_80C96C8(u32 r5 /*BattleObject*/, u32 r10 /*context*/); outputs r5 r8 r9 r10
  r11 r12 via sub_80C9726; clobbers r0-r4 r6 lr flags; preserves r7
details: 'Reads oBattleObject_Param2 (byte) and multiplies by 6 to index into the 6-byte template table byte_80C9664;
  stores the resulting pointer in oBattleObject_ExtraVars+4 for later frames. Template fields: [0]=char-base, [1]=screen-base,
  [2]=starting anim index, [5]=palette index. Calls sprite_load with VRAM block 0x80, sprite_loadAnimationData,
  sprite_noShadow. Sets flag bit 1 (drawn) on oObjectHeader_Flags. Writes template byte 2 to oBattleObject_CurAnim
  and 0xFF to oBattleObject_CurAnimCopy to force a reload. Applies palette from template byte 5 via sprite_setPalette.
  Derives panel state (object_setPanelsFromCoordinates) and mirrors object flip onto the sprite (object_getFlip
  -> sprite_setFlip). Plays sound effect 0xA0 (spawn SFX). Pins oBattleObject_XVelocity/Y/ZVelocity to the current
  X/Y/Z so the object does not drift on entry. Sets oBattleObject_CurStateActionPhaseAndPhaseInitialized to CUR_STATE_UPDATE,
  then tail-calls sub_80C9726 (the per-frame shuriken sub-state machine) whose register outputs (r5 r8 r9 r10 r11
  r12) become this function''s outputs.

  '
