name: battle_initBeastOutEmotionEntries
address: '0x08039084'
kind: function
status: probable
summary: Registers two EmotionData slots (indices 4 and 5, type 0x3A) in the global emotion array, using
  per-index flag words from two data tables.
interface: (r0 = entry index 0..4) -> r0 = clobbered; writes two entries into the 0x58-byte EWRAM EmotionData
  array at 0x02008450
details: Saves r0, then calls battle_initEmotionTableEntry_8046670 twice. Each call passes r0 = 0x3A (the
  emotion type byte), r1 = 4 on the first call and 5 on the second, and r2 = a word fetched from one of
  two 5-word tables (byte_80390AC and byte_80390C4) at word offset index*4. The callee then stores the
  entry with a fixed 0x09 tag and the supplied flags. The tables' low bytes are constant per table (0x01
  for the first, 0x03 for the second) with the index 0..4 in the second byte, so the two slots differ
  only in that flag byte. The pairing of a 0x01-valued and a 0x03-valued entry under one type suggests
  two states/forms of the same emotion for each index.
