name: CutsceneCmd_set_var
address: '0x08037A2A'
kind: function
status: confirmed
summary: Cutscene script opcode handler that writes a byte value into a cutscene variable slot and advances the
  script pointer past the 3-byte command.
interface: u32 CutsceneCmd_set_var(u8 *vars /*r5*/, u8 *scriptPtr /*r7*/); // returns r0 = 1 (command handled);
  r7 advanced by 3; r4 and r6 clobbered as scratch by the caller contract
details: 'Handler for the "set variable" cutscene/map-script command. It pulls two

  operand bytes from the script stream via ReadMapScriptByte: the first

  read is issued with r6 = 2 (result returned in r4 = destination variable

  slot offset), the second with r6 = 1 (result in r0 = value byte). The

  value is stored with strb into the cutscene variable array at

  [r5 + slot], i.e. vars[slot] = value. Since the command is three bytes

  long (opcode + slot + value), the script pointer r7 is advanced by 3 and

  the handler returns r0 = 1 to tell the script dispatcher the command was

  executed. The r6 parameter values (2 vs 1) select which ReadMapScriptByte

  destination is used — a quirk of that helper''s calling convention.

  '
