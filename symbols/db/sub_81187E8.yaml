open_questions:
- What SubMenu field is at offset 0x8 — the declared `sub_menu_struct` only shows `idx_00` at 0x0 and stops at 0x50;
  the dispatcher treats offset 8 as the action selector.
- Roles of sub_811880C / sub_8118874 / sub_8118AA8 (menu screens, animation phases?). Naming them would settle what
  the three CurAction values represent.
- r6 loaded with `sSubmenu` is never touched on this code path; could be a leftover from a previous dispatcher that
  used it.
