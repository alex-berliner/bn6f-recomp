name: sub_81187E8
address: '0x081187E8'
kind: function
previous_names: []
status: hypothesis
summary: Dispatches the SubMenu's current CurAction through a 3-entry Thumb jump table using the SubMenu object's
  CurAction byte.
interface: '(r5 = SubMenu*) -> r0/r1/r2/r3 clobbered by callee ; side effect: jumps to sub_811880C, sub_8118874
  or sub_8118AA8 based on [r5+8]'
details: 'Pushes lr only (no locals saved), loads the address of `sSubmenu` into r6 (unused on this path), loads
  the pointer-to-jump-table base `off_81187F8` (= `off_81187FC`) into r0, indexes it by the CurAction byte at `[r5+8]`
  (`sub_menu_struct::idx_00`... wait, offset 0x8 of SubMenu is beyond the declared 0x0..0x50 region; the dispatcher
  is using whatever SubMenu field sits at 0x8), dereferences that pointer to fetch a Thumb function address into
  r0, then performs `mov lr, pc; bx r0` (no link, so this is a tail-call into the chosen handler). Three handlers:
  sub_811880C (idx 0), sub_8118874 (idx 1), sub_8118AA8 (idx 2). Returns to caller via `pop {pc}`, which restores
  the saved lr.

  '
