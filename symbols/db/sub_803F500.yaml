name: sub_803F500
address: '0x0803F500'
kind: function
status: hypothesis
summary: Writes the constant 0xB4 (180, likely a frame count of 3 seconds) into the halfword at 0x200AD06, probably
  (re)starting or resetting a global timer.
interface: void setTimerTo180Frames(void)
details: 'A tiny leaf helper: it stores the immediate 0xB4 (180) as a 16-bit value into word_200AD06 (the halfword
  at word_200AD04+2) and returns. No other state is touched and no value is returned; r0, r1 and the NZ flags are
  clobbered. 180 is a very frame-timer-looking constant (3 seconds at 60 fps), so word_200AD06 is most plausibly
  a countdown/timer field in some global work area based at word_200AD04, and this function primes or resets it.
  Without caller context the exact subsystem (screen fade, text delay, battle timeout, etc.) cannot be pinned down.

  '
