name: ai_dispatchByTypeAndIndex_800F3E8
address: '0x0800F3E8'
kind: function
status: confirmed
summary: AI dispatch thunk that loads a three-entry handler table and tail-calls the generic actor-type/AI-index
  dispatcher to run the matching enemy AI routine.
interface: void sub_800F3E8(void); // all args/results pass through to the dispatched handler; contract is that
  of the handler chosen by indexByActorTypeAndAIIdxThenDispatch_800F420
details: Pushes LR, loads the pointer off_800F3F4 (pointing at the table off_800F3F8) into R0, then tail-calls indexByActorTypeAndAIIdxThenDispatch_800F420,
  which selects and jumps to one of the three handler-pointer entries in off_800F3F8 (off_81094D0, off_80F27F8,
  off_80EAB94) based on the current battle actor's type and AI index. The table pointer itself is the only argument
  set by this thunk; the dispatcher derives the actor context from global battle state. No state is touched directly
  by this function, and all registers/flags are simply forwarded.
