name: sprite_initGuiSlotA_8117BE8
address: '0x08117BE8'
kind: function
status: confirmed
summary: Initializes the GUI sprite bound to slot 0xa (sprite ID 0x23) with fixed screen position, palette,
  and animation, then sets its state-machine phase to 4.
interface: void Next(void) using r5 as spriteRecordPtr; returns r0 and flags from sub_8117C4C
details: Writes 0x23 into the sprite-record byte at [r5] (sprite ID) and zeroes the animation-tick byte
  at [r5+0xC]. Calls initGuiSprite_8002770 with slot 0xa and the shared GUI data table at unk_2034B6C
  to bind the sprite. Configures animation index 0, loads its frame data, and disables the drop shadow.
  Sets sub-entry palette bank to 9, palette index 0, and display priority to 2 (mid layer). Stores OAM
  attribute halfword 0x170 via slotList_storeHalfwordAndClearField_800306C and clears sub-record field
  A. Positions the sprite at screen coordinates (0xD4, 0xC)—upper-right area. Writes state byte 4 to [r5+8]
  and sub-state 0 to [r5+9], placing the sprite in phase-4 of its state machine. Finally calls sub_8117C4C
  as a post-initialisation hook and propagates its r0 and condition flags to the caller. All callee functions
  follow the global sprite-record convention (current record pointer in a global or r5). The register
  contract shows the function clobbers essentially everything but is called with r4–r12 already in use
  by the caller's broader state machine.
