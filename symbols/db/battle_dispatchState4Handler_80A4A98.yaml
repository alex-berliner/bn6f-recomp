name: battle_dispatchState4Handler_80A4A98
address: '0x080A4A98'
kind: function
status: confirmed
summary: Dispatches a battle object's per-frame state handler for state 4, selected by the byte at `obj+8`.
interface: 'void sub_80A4A98(void);  // in: r5=battle object ptr; out: passthrough; clobbers: nz c v r0-r4,r6-r12,lr'
details: 'Reads the 8-bit state index at `r5+0x8` and uses it (multiplied by 4) as an index

  into the 3-entry Thumb-jump table at 0x080A4AAC, then BX''es the selected entry

  (entry 0 -> battle_objectEnterState4LatchTilePos_80A4AB8, entry 1 -> sub_80A4ACC,

  entry 2 -> sub_80A4BD4). The Thumb bit is already set in each table word. Acts

  as a small vtable dispatcher for one of the battle object''s "state 4" phases;

  the `r5` battle-object pointer (r5 preserves across the call) carries the

  context into the chosen handler. No fields of the object are written here.

  '
