name: sub_801AEB0
address: '0x0801AEB0'
kind: function
status: confirmed
summary: 'Applies a collision''s hit-modifier bits to the hit battle object: flinching, status flag 2, and the 0x10/0x100
  reaction flags (skipping flinching when the object has superarmor/anger).'
interface: void sub_801AEB0(u32 /*r5 object*/, u32 /*r7 collision*/)
details: 'Reads oCollisionData_HitModifierFinal from the collision (r7) and dispatches per-bit:

  bit 0x01 sets status flag 2 bit 0x04 (flinch) unless object_getFlag() & 0x220000

  (superarmor/anger mask); bit 0x02 always sets status flag 2 bit 0x02; bits 0x04/0x08/0x10/0x20

  (mask 0x3C) mark "a reaction triggered" and, when bit 0x40 is also set, take the alternate

  reaction (set status flag 2 bit 0x100, clear flinch bit 0x04); when bit 0x40 is not set but

  object_getFlag() & 0x100040 is zero, take the weaker reaction (set status flag 2 bit 0x10).

  In both reaction branches it stores 1 to oBattleObject_Unk_0f on r5 (twice in the 0x100 branch,

  once in the 0x10 branch) so other battle code can see the reaction fired. No return value;

  clobbers r0/r2, N and Z flags.

  '
