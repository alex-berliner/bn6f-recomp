name: battle_updateChargePhase
address: '0x080D282C'
kind: function
status: probable
summary: 'Per-frame update for an enemy object''s charge-up phase: spawns a marker object in front, plays
  a looping sound, then signals ready after 60 frames.'
interface: (r5 = battle object pointer, called as method) -> void; no return value
details: Runs as a battle-object phase handler (r5 = this object). On first run it sets PhaseInitialized=4,
  switches animation to 0x10, sets ExtraVars+8 = 1, calls sub_80D2A14 (unknown helper), and spawns a type-4
  child object at PanelX + frontDirection (PanelY unchanged) passing its own ExtraVars pointer so the
  child shares that block; the packed r4 args (0x0140013C) look like sprite/coords for the spawned effect.
  It then sets Timer=0x3C (60 frames) and Timer2=0. Each frame it decrements Timer2, and every 16 frames
  plays sound effect 0x2C (a repeating charge/pulse sound). When Timer reaches 0 it clears ExtraVars+8
  and sets Param2=1, the flag the rest of the object's AI presumably waits on before launching the attack.
  No caller known; identity of the specific enemy is unknown.
