name: ai_freeAttackObjects
address: '0x080E8FC8'
kind: function
status: probable
summary: Releases the three auxiliary objects referenced by an enemy AI attack state (fields 0x60/0x64/0x68),
  called when the slide-in attack step finishes.
interface: (r0 = attack/enemy AI state struct) -> r0 = destroyed; no flags of interest
details: Takes a pointer to the AI attacker's state, reads three consecutive 32-bit pointers at offsets
  0x60, 0x64 and 0x68, and passes each in turn to sub_80BFF56. The three fields are almost certainly handles
  to spawned side objects (e.g. projectiles/effects belonging to the attack), and sub_80BFF56 is the shared
  routine that tears down one such object. It is only 12 instructions and mutates nothing else, so it
  exists purely to batch-release the attack's companions. The callee being shared across all three calls
  rules out field-specific behavior.
