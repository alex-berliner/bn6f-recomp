- method: assembly-reading
  date: '2026-10-19'
  detail: sub_80E8FC8 loads [r5,#0x60], [r5,#0x64], [r5,#0x68] and bl's sub_80BFF56 with each (asm lines
    3-11); sole caller ai_attackMoveInStep is an enemy attack handler that slides onto a panel and schedules
    the hit, consistent with cleanup of spawned attack objects; identical call pattern for all three fields
    indicates one generic per-handle routine, i.e. deletion/release
  refs:
