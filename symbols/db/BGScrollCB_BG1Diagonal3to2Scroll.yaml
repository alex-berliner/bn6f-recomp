name: BGScrollCB_BG1Diagonal3to2Scroll
address: '0x080019B4'
kind: function
status: confirmed
summary: BG1 scroll callback that advances a diagonal (3:2 slope) scroll, moving the background left/up by 8 and
  4 subpixel steps per call.
interface: void Next(r10=toolkit, lr=return) -> flags nz/c/v, r1=renderInfoPtr, r2=scrollX, r3=scrollY
details: 'A per-frame background scroll callback for BG1 on the "diagonal 3-to-2" scrolling pattern (likely a 3-px-per-1-px
  diagonal background used in cutscene/map screens). It reads two free-running scroll counters in the eBGScrollCBCounters
  struct: Counter0 (offset 0) is decremented by 8 (horizontal) and Counter1 (offset 4) by 4 (vertical), each is
  written back to keep the subpixel accumulator, then shifted right by 4 (i.e. divided by 16, so 8/16 = half-pixel
  X step and 4/16 = quarter-pixel Y step per call, giving a 2:1 on-screen diagonal slope). The two results are stored
  as halfwords into the toolkit''s render info at offsets oRenderInfo_Unk_10 (BG1 scroll X) and oRenderInfo_Unk_12
  (BG1 scroll Y). Since both counters only ever decrease, the background drifts toward negative scroll (left and
  up) each frame. Quirks: register contract exposes live flags — Counter0''s decrement uses a non-flag-setting sub,
  but Counter1''s decrement (SUBS) and the final LSR both update flags, so callers see the LSR''s N/Z and shifted-out
  bit 3 in C with V left over from the SUBS; r1 ends up holding the render info pointer and r2/r3 the new X/Y scroll
  values as side outputs.

  '
