name: battle_aiAttackWhiteFlashUpdate
address: '0x0801544C'
kind: function
status: probable
summary: 'Per-frame update for one enemy AI attack phase: after a delay it spawns/places something at
  the object''s panel, makes the object (and a related object) flash white, then ends the phase by setting
  the attack''s hit element.'
interface: (r5 = battle object, r7 = oAIAttackVars of that object) -> void; updates oAIAttackVars fields,
  no return value
details: State machine keyed on oAIAttackVars_AttackElement. In the initial state (AttackElement==0) it
  counts down StepTimer, then reads the actor's info via battle_ai_getActorInfo_801595E using oBattleObject_Alliance,
  subtracts 0xC from the actor type, and calls sub_80BC844 with r0=oBattleObject_PanelX, r1=oBattleObject_PanelY,
  r3=0x14 (r4 = adjusted type); it then sets StepTimer=0x30, ScratchVar=0 and AttackElement=4. In the
  flashing state it increments ScratchVar each frame and calls sprite_forceWhitePalette on the object
  and, if present, oBattleObject_RelatedObject2Ptr; when ScratchVar reaches 7 it calls sprite_clearFinalPalette
  on the related object to restore its palette. Finally it refills StepTimer with 6, sets oAIAttackVars_HitElement=8
  (activating the attack's hit element) and resets ScratchVar=0.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r7,#oAIAttackVars_AttackElement]/bne splits the idle-delay phase from the flash phase
    (asm start); bl battle_ai_getActorInfo_801595E with r5''s Alliance, then sub r0,#0xc before bl sub_80BC844(PanelX,
    PanelY, r3=0x14); loop calls sprite_forceWhitePalette on r5 and on [r5,#oBattleObject_RelatedObject2Ptr]
    for ScratchVar 1..6; at ScratchVar==7 calls sprite_clearFinalPalette on RelatedObject2Ptr and sets
    oAIAttackVars_HitElement=8 with StepTimer=6; callee summaries: battle_ai_getActorInfo_801595E returns
    ActorType/AIIndex/Unk_03; sprite_forceWhitePalette/clearFinalPalette toggle the sprite final-palette
    byte'
