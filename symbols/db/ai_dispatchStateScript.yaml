name: ai_dispatchStateScript
address: '0x0810F434'
kind: function
status: probable
summary: 'Dispatches an object''s AI state handler: calls the function pointer selected by the object''s
  AI script/state id.'
interface: (r6 = object struct) -> tail-calls handler from table off_810F448; returns to caller of this
  function via pop
details: Loads the object's AI state/script id (byte at r6+oAIState_ScriptId), uses it to index the function-pointer
  table at off_810F448, and calls the selected handler with lr set to the pop {r4,r6,pc} sequence, so
  the handler's return goes straight back to this function's caller. r4 and r6 are preserved across the
  call, and r0-r3 pass through unchanged to the handler, so handlers receive whatever r0 the caller passed.
  The first table entry is sub_810F44C+1 (thumb); the table presumably continues with one handler per
  AI state. This is a standard per-state virtual dispatch used by object AI update code.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r6,#oAIState_ScriptId] selects the handler index from the object struct; ldr r1,[r1,r0]
    with r1 = off_810F448 loads the state's handler pointer from the table; mov lr, pc; bx r1 makes the
    call return directly into pop {r4,r6,pc} (tail-call dispatch); table entry off_810F448[0] = sub_810F44C+1
    shows state handlers live immediately after this thunk; recorded in battlesweep/beastsp routes, consistent
