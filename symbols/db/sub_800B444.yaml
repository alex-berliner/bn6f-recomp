summary: Copies two saved 12-byte snapshots back into the working battle data area and then runs sub_802C9EA on
  the restored data.
interface: void sub_800B444(void)
details: 'Copies 12 bytes (3 words, via CopyWords) from the saved block at byte_203F4A4 into the working area unk_2035260,
  then 12 bytes from byte_203F5A4 into unk_203526C — i.e. two parallel 12-byte records (a save slot and its live
  copy, roughly 0xC bytes apart in each region). After both restores it calls sub_802C9EA with no arguments, which
  presumably re-derives state (recalculated values, UI, or pointers) from the freshly restored data. No inputs are
  read from registers besides lr; all work happens through the fixed addresses, so this is a parameterless "reload
  checkpoint" routine. The paired source/destination layout (0x203F4A4/0x203F5A4 vs 0x2035260/0x203526C) suggests
  a backup/restore pair of buffers, e.g. for a battle retry/undo or state-rollback path; the exact gameplay trigger
  is not visible from this function alone.

  '
