name: oAIState_AttackCounter
address: '0x5'
kind: struct-field
status: probable
summary: 'Charged-attack tick counter: counts up each step, resets to 0 when the threshold (HP-scaled
  or difficulty-tier-scaled) is reached, gating an attack roll.'
details: Across nearly every boss/NavCust AI step the byte is read, compared against a small threshold
  (2, 3, 4, 5, 7, or one looked up from a difficulty-tier table), incremented by 1 if below threshold,
  and reset to 0 once it reaches it (e.g. asm31.s:129095 "cmp r0,#4 / bge reset; add r0,#1; strb"). On
  the reset branch a GetPositiveSignedRNG & 0xF gate typically decides whether the attack fires. A few
  callers set it to absolute values (0xC at asm31.s:109219, copied from oBattleObject at asm32.s:167 "strb
  r0,[r4,#0x13] -> [r6,#oAIState_Unk_05]"), consistent with seeding/wiring the counter at AI init. Two
  steppers (asm31.s:132579, 139661) EOR it with 1 each tick, effectively treating it as a 1-bit ping-pong,
  which is still a "count up to a threshold" timer with threshold 1.
