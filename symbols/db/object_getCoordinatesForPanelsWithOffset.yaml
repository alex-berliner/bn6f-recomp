name: object_getCoordinatesForPanelsWithOffset
address: '0x080DCAFA'
kind: function
status: probable
summary: Converts a panel column/row plus an object-local offset (fields 0x12/0x13) into 16.16 fixed-point
  screen pixel coordinates.
interface: (r0 = column, r1 = row, r5 = object struct) -> r0 = x (16.16), r1 = y (16.16)
details: Adds the byte fields at [r5+0x12] and [r5+0x13] of the object struct to the incoming column and
  row, then tail-delegates to object_getCoordinatesForPanels to turn the adjusted panel coordinates into
  screen pixel fixed-point values. The fields at 0x12/0x13 are per-object grid offsets, plausibly anchoring
  a multi-tile or visually offset object to its logical panel. r5 is set by the caller, so the object
  pointer is not passed in r0-r3. No flags or other state are touched beyond the call.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r2,[r5,#0x12]/add r0,r0,r2 and ldrb r2,[r5,#0x13]/add r1,r1,r2 add object-local offsets
    to column and row; bl object_getCoordinatesForPanels performs the known column/row -> 16.16 pixel
    conversion; r5 is not derived from r0/r1 in the function, so the object pointer comes from the caller's
    frame
  refs:
