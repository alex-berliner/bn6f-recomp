- What flag at offset 0x20 of the ExtraVars+0x14 structure enables
- What effect type 0x4F renders as, and what sound 0x72 is, to identify the chip/crossform/status this
  belongs to
- No caller known; the object's update table entry that installs this tick would clarify which entity
  uses it
