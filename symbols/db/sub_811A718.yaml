name: sub_811A718
address: '0x0811A718'
kind: function
status: hypothesis
summary: Picks the destination VRAM buffer and layout flags for a chapter blurb (0..3) and dispatches renderTextGfx_8045F8C
  against the script template eTextScript201BA20.
interface: 'void sub_811A718(u32 text_ptr /*r0*/, u32 chapter /*r1*/);

  // clobbers: nz c v r0 r1 r2 r3 r10 r11 r12 lr

  // preserves: r4 r5 r6 r7 r8 r9

  '
details: 'Indexed by chapter in r1. Pulls two words from two parallel 4-entry tables:

  off_811A740 (resolves to the VRAM destination buffers byte_2017A00,

  unk_2017C00, unk_2017E00, unk_2018000) and byte_811A754 (which holds

  3-byte triplets of the form x, 1, 6 used as layout flags passed as r3).

  Then sets up caller-style scratch (r4=8, r5=1, r6=dword_86B7AE0, r7=0)

  expected by renderTextGfx_8045F8C and calls it with

  r0=eTextScript201BA20, r1=original text_ptr, r2=dst_buf, r3=layout_flags.

  The prologue/epilogue save and restore r4-r7 explicitly because the called

  function wants to use them as immediate arguments without going through

  the stack. The function call chain ends up rendering a localized blurb

  of dialog text into one of four 0x200-byte VRAM text slots depending on

  the chapter index.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
