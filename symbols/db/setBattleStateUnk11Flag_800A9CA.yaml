name: setBattleStateUnk11Flag_800A9CA
address: '0x0800A9CA'
kind: function
status: confirmed
summary: Sets the given flag bits in the current battle state's Unk_11 flags byte.
interface: void battle_setStateUnk11Flags_800A9CA(u32 flagBits r0, toolkit r10); returns battle state ptr in r3
details: Loads the battle state pointer from the toolkit (r10 + oToolkit_BattleStatePtr), reads the byte at oBattleState_Unk_11,
  ORs in the caller-supplied bit mask in r0, and stores it back. Returns the battle state pointer in r3 (likely
  incidental, not a designed return value). A tiny setter for an as-yet-unidentified battle state flag byte; clobbers
  r1 and the NZ flags, preserves everything else.
