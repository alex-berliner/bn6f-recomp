name: t4_0x10_80E17E8
address: '0x080E17E8'
kind: function
status: confirmed
summary: Dispatches the time-freeze battle object's state handler (begin / loop / end) via a table indexed by CurState,
  returning control directly to the original caller.
interface: 'void battle_timefreezeDispatch(u32 *battleObject /* r5 */, /* r0/r1 set up internally */);

  inputs: r2 r3 r4 r5 r6 r7 r10 lr (caller''s frame; r5 = battle object)

  outputs: r5 r8 r9 r10 r11 r12 (forwarded from dispatched handler)

  clobbers: nz c v r0 r1 r2 r3 r4 r6 r7 lr

  preserved: none

  '
details: "r5 points to a battle object (struct keyed by offset oBattleObject_CurState).\nLoads the 1-byte CurState,\
  \ multiplies by 4 implicitly by treating it as a\nword index into the three-entry handler table at 0x80E17FC:\n\
  \  state 0 -> object_timefreezeBegin\n  state 4 -> sub_80E1808\n  state 8 -> object_timefreezeEnd\nThe table address\
  \ is fetched through off_80E17F8 -> off_80E17FC, and each\nentry is stored as (handler+1) to set the Thumb bit,\
  \ so a plain BX jumps\nto the real handler with the caller's registers (r2-r7, r10, lr) still\nlive. r0 = the\
  \ state byte and r1 = the loaded handler address (the\ntypical bx-r1 calling convention used elsewhere in the\
  \ battle engine)\nare passed to the handler. The trailing `pop {pc}` makes the handler\nreturn directly to this\
  \ routine's own caller, so whichever registers the\nhandler leaves in r5 and r8-r12 are what t4_0x10_80E17E8 effectively\n\
  outputs.\n"
