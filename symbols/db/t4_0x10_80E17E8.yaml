open_questions:
- The three known states (0/4/8) leave big gaps in the index space; are 1..3, 5..7 actually unreachable, or are
  there other sub-states used conditionally by the time-freeze system?
- sub_80E1808 is the middle handler (likely the "while frozen" per-frame tick); its exact role inside the freeze
  window is not pinned down.
- Is CurState really a raw byte or a *2 / *4-scaled field elsewhere? Using it directly as a word offset into the
  table implies one entry per 4-byte index, i.e. the on-disk value is already a handler index.
