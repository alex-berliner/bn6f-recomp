name: sub_80A51C4
address: '0x080A51C4'
kind: function
status: confirmed
summary: Per-object state-machine dispatcher — picks a 16-byte record from a table by the object's state ID, then
  jumps to one of five phase handlers based on the object's phase byte.
interface: 'void sub_80A51C4(void) // args passed in registers: r5 = state struct ptr; tail-dispatches to handler(r0=handler
  addr, r1=phase selector, r7=state record ptr); flags NZCV set from recordBase+recordOff computation'
details: "Takes no normal arguments; the caller passes the entity/state struct in r5 (lifter shows r5 as an input,\
  \ so this is part of a register-calling-convention state machine). Two fields drive it: - byte at r5+4: state/record\
  \ ID. Multiplied by 0x10 and added to byte_80A4C64,\n  so r7 points at a 16-byte per-state record in that table.\n\
  - byte at r5+8: phase/step selector. Used as a *byte* offset into the handler\n  table at off_80A51E0, so valid\
  \ values are 0x00/0x04/0x08/0x0C/0x10 (i.e. it\n  stores the byte offset itself, not an index 0-4):\n  +0x00 sub_80A51F8,\
  \ +0x04 sub_80A5268, +0x08 sub_80A52E4,\n  +0x0C sub_80A5304, +0x10 sub_80A5350.\nThe handler is invoked with\
  \ `mov lr, pc; bx r0` — the classic Thumb long-call idiom — so the callee returns to this function's `pop {pc}`\
  \ and control flows back to *this function's* caller, making it effectively a tail-call trampoline. On entry to\
  \ the handler r0 = handler address, r1 = raw selector byte, r7 = selected 16-byte record. The selector is not\
  \ bounds-checked: any value outside 0x00-0x10 branches to whatever the bytewise load produced. The ADD of recordBase+recordOff\
  \ sets flags before the dispatch (harmless side effect). r5 itself is never restored/validated here; the 0x10-stride\
  \ record table (byte_80A4C64) is presumably per-state parameters (timers, counters, targets) that the phase handlers\
  \ read via r7.\n"
