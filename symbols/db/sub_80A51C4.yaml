open_questions:
- Which subsystem owns r5 (NPC object, cutscene actor, battle entity?) — the record layout at byte_80A4C64 (16 bytes
  per state) is undocumented here.
- Meaning of each phase handler (sub_80A51F8, sub_80A5268, sub_80A52E4, sub_80A5304, sub_80A5350); naming this properly
  likely requires reading them.
- Whether the phase byte at r5+8 is always one of the five table offsets or the unchecked default path is ever exercised
  in practice.
