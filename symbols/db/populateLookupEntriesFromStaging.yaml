name: populateLookupEntriesFromStaging
address: '0x0814673C'
kind: function
status: probable
summary: For byte_2010288 iterations, copies 13 bytes from the 0x10-strided staging buffer unk_20098B0
  into sub_81466F4(index), then 8 bytes from unk_2009750 into the entry's field-0x15 via get_lookupEntryField15Ptr;
  writes the final iteration count to byte_2009470.
interface: () -> r0 clobbered; byte_2009470 = entry count, list records and their field15 filled from
  unk_20098B0/unk_2009750 staging buffers
details: Zeroes byte_2009470, then loops byte_2010288 times. Per iteration it calls sub_81466F4(index)
  to get a destination pointer and copies 13 bytes from the 0x10-stride staging buffer at unk_20098B0
  via sub_81469F0(dest, src, len); then calls get_lookupEntryField15Ptr(index) and copies 8 bytes from
  the 8-stride buffer at unk_2009750 into the record's field 0x15. Both staging pointers advance by their
  record size each iteration, and the count byte is incremented, so the function materializes a list whose
  size was set elsewhere into per-entry structures.
