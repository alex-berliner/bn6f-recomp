name: ai_initAttackVarsId37
address: '0x080124FE'
kind: function
status: probable
summary: Initializes the AI attack-vars struct for one attack (damage 50, extra 10, tier 2, boost 4) and
  returns attack id 0x25.
interface: (r0 = unused) -> r0 = 0x25 attack id; r7 = attack-vars struct base is supplied by caller context
details: 'Stores hardcoded parameters into the AI attack-vars structure pointed at by r7: Damage=0x32,
  ExtraDamage=0xa, AiDifficultyTier=2, AttackBoost2=4 (from dword_8012518), and InitFlag=2 to mark the
  vars as set. It then returns 0x25, most likely the attack ID this parameter set belongs to. The struct
  fields match the project''s oAIAttackVars_* layout. Being leaf code with no other memory access, its
  only effect is these field writes and the constant return.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'strh #0x32 and #0xa into oAIAttackVars_Damage/ExtraDamage set the attack''s damage values;
    strb #2 into oAIAttackVars_AiDifficultyTier and InitFlag set difficulty tier and the initialized flag;
    ldr dword_8012518 (=4) stored to oAIAttackVars_AttackBoost2 sets a boost value; mov r0,#0x25; pop
    {pc} returns a constant consistent with an attack/chip ID'
  refs:
  - bn6f/asm/asm00_2.s:8217
  reproduce: python3 tools/asmcat.py 0x080124FE
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-052112; its name was fixed mechanically by tools/investigate_land.py
    style-fix (the run''s proposal broke the naming style)'
open_questions:
