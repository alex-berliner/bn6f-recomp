name: NPCCommand_jump_alt
address: '0x0809F3E8'
kind: function
status: confirmed
summary: NPC script opcode handler that jumps execution to a 16-bit target read from the script, storing the new
  script position in r6.
interface: 'u32 npc_jumpAlt(u32 script_ptr_r6); // in: r6 = NPC script pointer, lr = return; out: r6 = new script
  position (word read at ptr+5), r2 = passthrough from ReadNPCScriptWord; clobbers r0, r1, r3, lr and NZCV flags'
details: One of the NPC script interpreter's command handlers. On entry r6 holds the NPC script pointer. It computes
  pointer+5 and calls ReadNPCScriptWord to fetch the jump argument (the word stored 5 bytes into the command), then
  writes the fetched word back into r6, effectively relocating the script pointer to the jump target. ReadNPCScriptWord
  leaves additional results in r1-r3; r2 survives as an output of this routine unchanged, while r0/r1/r3 are dead.
  No other registers or memory are touched; the routine is a tail-like wrapper (push lr / pop pc) around the read-and-reassign.
  The "_alt" name presumably distinguishes it from the regular jump command, likely by its argument offset (+5)
  or encoding variant.
