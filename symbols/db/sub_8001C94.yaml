name: sub_8001C94
address: '0x08001C94'
kind: function
status: confirmed
summary: Renders all 32-byte tile entries of a GFX animation sequence into an EWRAM staging buffer via per-frame
  dispatch handlers, then queues a DMA transfer of the assembled sheet to the display destination.
interface: 'void gfx_renderAnimTileSheet(GFXAnimData *animData /*r0*/, /*r4 preserved*/, GFXAnimState *animState
  /*r7*/);  // outputs: r0-r12 clobbered, NZCV clobbered; r4,r7 preserved'
details: "Reads the frame descriptor array pointer from animData->ParamNext.\nLooks up a per-slot EWRAM staging\
  \ buffer base from the table at off_8001AB8,\nindexed by animState->Param3 (animation slot number, *4).\nReads\
  \ animState->Param0 (sprite-sheet destination base) and\nanimState->Param2 (frame count, each frame = 32 bytes).\n\
  \nIterates over frame_count 16-bit entries. For each entry:\n  - bits 0-9 masked and shifted <<5 give a byte offset\
  \ into the destination tile sheet;\n  - bits 10-11 select a jump-table handler (sub_8001D64, sub_8001D86,\n  \
  \  sub_8001EAE, sub_8001ED0) that renders one 32-byte tile into the EWRAM\n    staging buffer at the current ewram_ptr;\n\
  \  - ewram_ptr advances by 0x20, data pointer advances by 2.\n\nAfter the loop, re-fetches the EWRAM staging base\
  \ (same slot lookup) and reads\nanimState->Param1 (final DMA destination) and frame_count.\nCalls QueueEightWordAlignedGFXTransfer(src=ewram_base,\
  \ dest=animState->Param1,\nsize=frame_count<<5) to DMA the assembled tile sheet into VRAM/display.\nQuirk: pushes\
  \ r0 before the loop (saving the original animData pointer) and\npops it after, but r0 is immediately overwritten\
  \ by the second off_8001AB8\nload, so the push/pop of r0 appears vestigial or ABI-protective for the callee.\n"
