name: navicust_handleBoardConfirm
address: '0x08136218'
kind: function
status: probable
summary: 'Navi Customizer board ''confirm'' handler: adds cursor halfwords at r5+0x24/+0x20 to index into the board
  via sub_8136290; if sub_813629C returns 0 it calls battle_resetEStructRecords_8046664 then plays SOUND_CANT_JACK_IN;
  if the cell ID is 0x14C it stores state 0x2C, plays SOUND_SELECT_82 and dispatches to sub_813686C/sub_813677C;
  else if cell''s +2 word is nonzero it stores state 0x10, calls sub_813660C(1), redraws the board and plays SOUND_MENU_SELECT
  (pick-up).'
interface: () -> void; reads cursor coords from context r5 at +0x20/+0x24, writes state byte [r5+2], plays a sound
  ID in r0 via PlaySoundEffect
details: 'Uses the context in r5 (a NaviCust screen state struct): adds the halfwords at +0x20 and +0x24 (cursor
  x/y or similar coords) and passes the sum to sub_8136290, which returns a pointer to the board-cell entry. It
  reads the entry''s halfword ID at [r7] and calls sub_813629C as a predicate; when it fails it calls battle_resetEStructRecords_8046664
  (restoring the part-effect record/preview state) and plays SOUND_CANT_JACK_IN as the cancel/error path. If the
  cell''s ID equals the special value 0x14C it plays SOUND_SELECT_82, stores state 0x2C into [r5+2] and calls sub_813686C/sub_813677C
  (a different sub-screen flow). Otherwise, if the entry''s field at +2 is nonzero (a part occupies the cell) it
  stores state 0x10 into [r5+2], calls sub_813660C(1), redraws the board via navicust_drawBoardTilemap(1) and plays
  SOUND_MENU_SELECT — consistent with picking up/removing the selected part.'
