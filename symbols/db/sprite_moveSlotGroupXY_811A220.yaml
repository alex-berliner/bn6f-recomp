name: sprite_moveSlotGroupXY_811A220
address: '0x0811A220'
kind: function
status: confirmed
summary: Moves the four object slots starting at a given index to a shared (x, y) screen position.
interface: void sub_811A220(int x /*r0*/, int y /*r1*/, int firstSlot /*r2*/); clobbers r0-r3, r5, lr, N/Z/C flags;
  preserves r4, r6, r7; outgoing flags come from the final slot<firstSlot+4 comparison
details: 'Takes an x coordinate (r0), a y coordinate (r1), and a starting slot index (r2).

  For each of the four consecutive slot indices firstSlot..firstSlot+3, it calls

  getStructFrom2008450(slot) to look the entry up in the object table rooted at

  0x2008450; if the slot is occupied (nonzero struct pointer in r0, struct/sprite

  handle in r1), it calls sprite_setCoordinates(x, y) with the object''s sprite

  handle passed in r5. Empty slots are skipped silently. The x/y arguments are

  spilled to the stack at entry so they survive the calls. r4-r7 are saved and

  r4 serves as the loop cursor (r4 = firstSlot, r7 = firstSlot+4 loop bound);

  r5 is reused as the sprite_setCoordinates argument and restored from its entry

  value on exit. On return, the N/Z/V flags reflect the final "slot < slotEnd"

  comparison, so callers can test V to see how the loop ended; r2/r3 hold

  whatever the last callee left in them.

  '
