name: object_restorePanelPositionsIfPending
address: '0x080E8656'
kind: function
status: probable
summary: Restores an object's saved panel-position sequence when any linked panel-position object has
  a nonzero field 0x70.
interface: (r5 = battle object with pending panel-position links at +0x60..+0x68) -> r0 = restored sequence
  pointer or 0; flags = caller-saved
details: Checks the word at offset 0x70 from each of three referenced objects at offsets 0x60, 0x64, and
  0x68 of the object in r5. If any check succeeds, it passes the nonzero pointer to object_restorePanelPositions;
  otherwise it returns without doing anything. The three links are treated as null-safely by get_nullSafeField70.
  The function relies on r5 as its implicit object argument and does not preserve general registers.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: Assembly lines ldr r0,[r5,#0x60/0x64/0x68] establish the three candidate panel-position links.;
    The repeated get_nullSafeField70 calls and tst/bne branches restore only when a field-0x70 word is
    nonzero.; The shared loc_80E8678 path calls the already-known object_restorePanelPositions with that
    selected pointer.; The immediate pop {pc} after all three failed checks establishes the no-pending-work
    return path.
  refs:
  - bn6f/asm/asm31.s:110279
  - 0x080CEAEE get_nullSafeField70
  - 0x080E8612 object_restorePanelPositions
  reproduce: python3 tools/asmcat.py 0x080E8656
  result: 'proposed by minimax/MiniMax-M3, self_score 4; cross-checked by minimax/MiniMax-M3: agree; run
    wf investigate investigate-20261021-023329'
open_questions:
