name: get_tableEntryNibbleWord
address: '0x0813D6F4'
kind: function
status: probable
summary: Reads four bytes of a 0x20-byte IWRAM table entry and packs them nibble-by-nibble into a 16-bit
  value.
interface: (r0 = entry selector bool for getTableEntryPtr32_802D064) -> r0 = entry ptr (clobbered), r1/r2/r3
  clobbered; returns packed value in r1
details: Fetches the pointer to a 0x20-byte entry in the array at byte_203C4A0 (entry selected by the
  bool in r0), then packs bytes at offsets 0-3 into r1 as b3<<12 | b2<<8 | b1<<4 | b0, so each stored
  byte contributes exactly one nibble (offset 0 is the lowest digit). The final 'lsl r3,#16 / orr r1,r3'
  ORs zero, so no extension happens and the result range is 0..0xFFFF; r0 is not restored. This looks
  like reading a 4-digit value stored one digit/flag per byte, but nothing identifies the table's contents
  or which game state it mirrors.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: loop 'lsl r1,#4 / ldrb r3,[r0,r2] / orr r1,r3 / sub r2,#1' over r2=3..0 packs four bytes as
    nibbles with offset 0 least significant; entry pointer comes from getTableEntryPtr32_802D064, documented
    as selecting a 0x20-byte entry of the IWRAM array at byte_203C4A0; trailing 'lsl r3,#0x10 / orr r1,r3'
    ORs literal zero, confirming a plain 16-bit result with no sign handling; r0 is forwarded unchanged
    to the callee, so the caller chooses the entry via a bool
  refs:
  - bn6f/asm/asm37_0.s:4122
  - 0x0802D064 getTableEntryPtr32_802D064
  reproduce: python3 tools/asmcat.py 0x0813D6F4
  result: 'proposed by hyper/glm-5.3-flash, self_score 2; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-022109'
open_questions:
- no callers are known, so it is unknown which game system owns the byte_203C4A0 table or what the four
  bytes at offsets 0-3 mean
- unknown whether the bytes are BCD-style digits or four independent 0-15 flags
- unknown why the selector is a bool — whether the table holds exactly two entries (e.g. current vs. previous)
  or the callee masks the index
