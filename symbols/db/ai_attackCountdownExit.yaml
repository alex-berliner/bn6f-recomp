name: ai_attackCountdownExit
address: '0x080F01E8'
kind: function
status: probable
summary: 'AI attack wind-up tick: on first run, writes 5 to oAIAttackVars_StepTimer and 4 to oAIAttackVars_AttackElement
  as a ''done'' flag; subsequent calls decrement StepTimer and return while it stays ≥ 0 (6 ticks total);
  when it goes negative, clears oBattleObject_RelatedObject1Ptr and oAIData_TempAttackObjectPtr, then
  calls object_exitAttackState.'
interface: (r0 = object element byte from [r7+oAIAttackVars_AttackElement], r5 = battle object ptr, r7
  = AI attack vars) -> r0 = clobbered; no meaningful return
details: Reads oAIAttackVars_AttackElement from the AI attack vars at r7; if zero (not yet started), writes
  5 into oAIAttackVars_StepTimer (halfword) and 4 into AttackElement (byte), marking the attack element/state
  as active. Each subsequent call decrements StepTimer; while it is still >= 0 the function returns without
  doing anything. When the timer goes negative, it zeroes oBattleObject_RelatedObject1Ptr in the battle
  object (r5) and oAIData_TempAttackObjectPtr in the AI data (loaded from oBattleObject_AIDataPtr), dropping
  references to the spawned attack object, then calls object_exitAttackState to leave the attack state.
  The double-use of AttackElement (element vs. started flag) is a quirk of the struct field reuse.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'tst r0,r0 / bne: AttackElement==0 triggers one-time init (StepTimer=5, AttackElement=4); ldrh/sub/strh
    on oAIAttackVars_StepTimer with bge skip: frame countdown; str r0,[r5,#oBattleObject_RelatedObject1Ptr]
    and via oAIData_TempAttackObjectPtr: attack object refs nulled; bl object_exitAttackState only on
    timer expiry: ends the attack state; Callee object_exitAttackState is the known attack-state exit
    routine'
  refs:
  - bn6f/asm/asm31.s:122643
  - 0x08011714 object_exitAttackState
  reproduce: python3 tools/asmcat.py 0x080F01E8
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — Code at line 4 (strh #5) initializes StepTimer to 5; the bge at line 9 returns while ≥ 0, so it
    actually takes 6 calls (5,4,3,2,1,0,-1) to expire, not ''5-frame''. Also, AttackElement is written
    to 4 (line 6) and tested with bne (line 3), meaning non-zero means ''skip init / already done'', not
    ''marking as active''. Name and overall shape are right; just fix the summary.; run wf investigate
    investigate-20261019-022109; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash
    (tools/investigate_land.py reconcile)'
