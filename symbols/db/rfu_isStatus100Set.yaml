name: rfu_isStatus100Set
address: '0x0803C514'
kind: function
status: probable
summary: Returns 1 if bit 0x100 of the global RFU status word (0x0200A290) is set, else 0.
interface: () -> r0 = 1 if RFU status flag 0x100 set, else 0; Z flag from final tst
details: 'Computes mask 0x100 (mov r0,#0x10; lsl r0,#4) and passes it to rfu_testStatusFlags, which ANDs
  it against the global status word at 0x0200A290 and sets Z on no match. If the bit is set, r4 is set
  to 1; otherwise it stays 0. Returns r4 in r0 and ends with tst r0,r0 so the caller can also branch on
  Z. It is a pure predicate: no other state is read or written, and all six call sites are inside sub_8148234.
  Bit 0x100 of the RFU status word presumably indicates an established/active wireless connection state.'
