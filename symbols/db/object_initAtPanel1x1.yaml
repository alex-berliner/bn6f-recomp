open_questions:
- What game object uses this init — no callers known; finding the spawn site would identify the entity
  (a hidden/field-effect object?)
- Meaning of collision region 0x80 and flag 0x1000000 in the collision flag tables
- What sub_80CDFEE does and what the ExtraVars+4 flag toggles between first and later update calls
- Layout of the collision-data struct around offset 0x84 to confirm ExtraVars points to trailing scratch
  space
