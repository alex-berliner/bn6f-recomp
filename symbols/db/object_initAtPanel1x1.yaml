name: object_initAtPanel1x1
address: '0x080CDFA4'
kind: function
status: probable
summary: Initialization for a battle object placed on panel (1,1) that sets up a large collision region
  and enters its update state.
interface: (r5 = battle object, r0 unused) -> r0 = 1 on success, 0 if object was freed; no flags guaranteed
details: Stores panel X=1 and Y=1 into the object at oBattleObject_PanelX/Y, then calls object_createCollisionData;
  if no slot is available it frees the whole object via object_freeMemory and returns 0. Otherwise it
  initializes the collision block with object_setupCollisionData (r2=0x18 as its size/parameter, r3=0),
  sets collision region 0x80, ORs the flag word 0x1000000 (bit 24, likely an untargetable/hide-type flag)
  into the ObjectFlags1 word, and refreshes collision state with object_presentCollisionData. It then
  stores CollisionDataPtr+0x84 into oBattleObject_ExtraVars and zeroes ExtraVars+4, presumably reserving
  scratch state at the end of the collision block. Finally it sets the object's state to CUR_STATE_UPDATE,
  calls sub_80CDFEE (first update pass), and writes 1 to ExtraVars+4 before returning 1.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'strb r0, [r5,#oBattleObject_PanelX/Y] with r0=1 pins the object to panel (1,1); bne on object_createCollisionData
    falls through to object_freeMemory + pop {pc}: alloc-fail frees the object; object_setCollisionRegion(0x80)
    and object_setFlag1(0x1000000) configure an unusual full/odd collision region and a high flag bit;
    ExtraVars = CollisionDataPtr+0x84, ExtraVars+4 zeroed then set to 1 after the first sub_80CDFEE call:
    per-object state scratch; r0=#CUR_STATE_UPDATE stored to oBattleObject_CurStateActionPhaseAndPhaseInitialized
    before calling sub_80CDFEE'
