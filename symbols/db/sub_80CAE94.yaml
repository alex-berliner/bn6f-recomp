name: sub_80CAE94
address: '0x080CAE94'
kind: function
status: probable
summary: Applies horizontal velocity to a battle object, refreshes its collision panels, and sets it to CUR_STATE_DESTROY
  if it collided or left the valid panel area.
interface: 'u32 battle_applyXMove(BattleObject* r5) -> r0 (CUR_STATE_DESTROY or panel-validity value); flags: nz'
details: Adds oBattleObject_XVelocity to oBattleObject_X, then calls object_setPanelsFromCoordinates and object_updateCollisionPanels
  (both via r5). Reads oBattleObject_CollisionDataPtr -> oCollisionData_FlagsFromCollision; if nonzero the object
  collided and is destroyed. Otherwise calls object_isCurrentPanelValid; if it returns zero the panel is invalid
  and the object is destroyed. Destruction path calls object_clearCollisionRegion and writes CUR_STATE_DESTROY (8)
  into oBattleObject_CurStateActionPhaseAndPhaseInitialized. r4 and r6 are only saved/restored; r3 is listed as
  input but unused in the body.
