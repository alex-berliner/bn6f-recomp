name: chatbox_applyRowOffsets
address: '0x03006E1C'
kind: function
status: probable
summary: Chatbox script-command handler that runs N=low_nibble_of_byte2 (default 8 if zero) iterations
  over one chatbox entry chosen by 1-based index in byte 3, calling chatbox_8040D5C and conditionally
  chatbox_addOffsetToRow per row, then returns r0+4.
interface: (r0 = ptr to 4-byte chatbox script command; r10 = chatbox context) -> r0 = r0+4 (next command);
  calls chatbox_8040D5C and chatbox_addOffsetToRow.
details: 'Byte 2 of the command holds a count/flags field: its low nibble is the loop count (0 means 8
  iterations with a flag in r7), and byte 3 is a 1-based index into an array of pointers at [r10+0x38]+8,
  selecting which chatbox entry to operate on. Each iteration calls chatbox_8040D5C with the selected
  pointer, then conditionally calls chatbox_addOffsetToRow — unconditionally when the nibble flag is clear,
  otherwise only if the value returned in r1 is nonzero. chatbox_addOffsetToRow adds a table value to
  all 16 words of one row and advances the row/output pointers, so this handler offsets N rows in sequence.
  The function returns arg+4, the signature of an interpreter stepping through 4-byte script records;
  no other callee or caller state is touched.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r3,[r0,#2]/ldrb r0,[r0,#3]: byte 2 = row count nibble, byte 3 selects entry; sub #1, lsl
    #2 indexes a pointer table; ldr r7,[r10,#0x38]; add #8; ldr r1,[r7+idx*4]: picks a pointer from a
    per-context chatbox array; loop pushes r0 as counter, calls chatbox_8040D5C then conditionally chatbox_addOffsetToRow
    (skipped when r7 bit 0x10 set and r1==0); final pop {r0}; add r0,#4 returns the original command pointer
    advanced by one 4-byte record; callee chatbox_addOffsetToRow is documented as offsetting one 0x40-byte
    chatbox row per call'
  refs:
  - bn6f/asm/asm38.s:2749
  - 0x03006C18 chatbox_addOffsetToRow
  - 0x08040D5C chatbox_8040D5C
  reproduce: python3 tools/asmcat.py 0x03006E1C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The loop bounds disagree: the low nibble of byte 2 is the actual count (used as a decrementing counter
    at ''sub r0,#1 ... bne loc_3006E40''), and only when it is 0 does the code substitute 8 iterations
    and set r7=0x10. The conditional is correct (when r7 has bit 0x10 set, chatbox_addOffsetToRow runs
    only if r1!=0). A prefix should follow naming rules; ''chatbox_applyRowOffsets'' drops the redundant
    ''Cmd'' and is more concise.; run wf investigate investigate-20261019-010606; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
