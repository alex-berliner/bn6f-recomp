name: battle_beginTurnResetObject
address: '0x0801390C'
kind: function
status: probable
summary: 'Per-battle-object start-of-turn reset: refresh navi stat bytes into AI data and clear per-turn
  combat state (flags, invulnerability, subordinate object).'
interface: (r0 = battle object ptr, kept in r5) -> r0 = clobbered; tail-branches into sub_801393A to continue
  the per-object loop
details: Takes a battle object, reads its Alliance byte and fetches the matching NaviStats table entry
  via GetBattleNaviStatsAddr, then copies stat bytes [5] and [7] into the object's AI data at oAIData_BPwrAtk
  and oAIData_BLeftAbility, refreshing attack power / left-slot ability for the turn. It clears ObjectFlags1
  bit 0x8000000 via object_clearFlag and calls object_clearInvulnerableTime to drop any post-hit invulnerability.
  If the AI data's SubordinateObjectUnk pointer is non-null, it calls sub_80E5410 (presumably to release/delete
  that subordinate) and zeroes the pointer. It then branches into sub_801393A, which appears to continue
  iterating over further battle objects, so this is the body of a per-object pass run from battle_beginTurnOpenProcess.
