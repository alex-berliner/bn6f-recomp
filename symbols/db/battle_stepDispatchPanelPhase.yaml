name: battle_stepDispatchPanelPhase
address: '0x080BAC98'
kind: function
status: probable
summary: Runs the current-phase step handler of a battle object via a jump table indexed by oBattleObject_CurPhase.
interface: (r5 = battle object) -> calls table[curPhase] as Thumb; returns handler's result; no r0 setup
details: 'Reads byte oBattleObject_CurPhase from the object at r5, loads a handler pointer from off_80BACAC[phase],
  and tail-calls it with mov lr,pc / bx r1 (long-bl to Thumb), then pops pc to return. The table has 4
  entries: battle_stepProcessCollectedPanels, battle_breakFrontPanelsWaitPhase, and two unnamed handlers
  (sub_80BAD76, sub_80BAD34) that continue the phase sequence. This is the standard BN6 battle-object
  phase-stepper pattern; the object it belongs to deals with collected/breaking panels.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_CurPhase]; ldr r1,[r1,r0]; bx r1 indexes table by phase (asm lines
    2-6); off_80BACAC entries +1 are Thumb handlers, two already named battle_stepProcessCollectedPanels
    and battle_breakFrontPanelsWaitPhase; mov lr,pc / bx r1 / pop {pc} is the usual long-call-return wrapper,
    so this is a call-through dispatcher
  refs:
  - bn6f/asm/asm31.s:5979
  reproduce: python3 tools/asmcat.py 0x080BAC98
