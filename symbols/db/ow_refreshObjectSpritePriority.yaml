name: ow_refreshObjectSpritePriority
address: '0x080A8C98'
kind: function
status: probable
summary: Recomputes an overworld object's sprite OAM priority from its z-coordinate modifiers and the
  current map's layer effect table.
interface: (r5 = overworld object pointer, fields 0x0C z and 0x14 z-value used) -> r0 = sprite_setPriority_8002E14
  result; sets sprite priority bits 2-3 of sprite byte 0x15.
details: Takes the object in r5 (never reloaded, so the calling convention is r5-based, not r0). It saves
  [r5,#0x14], calls checkZCoordModifiers_8031612 on r5+0x0C, scales the result <<16 and temporarily writes
  it into [r5,#0x14], then calls applyLayerEffectToOWObject_8035694 which resolves the draw layer (per-map
  region table, else checkLayerPriority). The original [r5,#0x14] is restored, and the layer value returned
  by applyLayerEffectToOWObject is passed straight into sprite_setPriority_8002E14 to program the sprite's
  OAM priority (0-3). Effectively a one-shot refresh of the object's draw priority after its z or layer-affecting
  state changed.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: lsl r0,#0x10 / str r0,[r5,#0x14] stores the z-modifier result into the object's z field before
    the layer call; str r4,[r5,#0x14] restores the saved field right after applyLayerEffectToOWObject_8035694;
    bl sprite_setPriority_8002E14 immediately after, with r0 still holding applyLayerEffectToOWObject's
    return value; callee applyLayerEffectToOWObject_8035694 is documented as deciding which layer an OW
    object draws on
