name: start_setEventsAndFade
address: '0x08005A28'
kind: function
status: probable
summary: GameState one-shot handler that sets EVENT_1703 and EVENT_1738, triggers a screen fade via SetScreenFade(0xc,0x10),
  ticks the countdown-timer table, writes 0x3c to FrameCountdown, and sets byte 0x10 into SubsystemIndex
  to hand off to another subsystem.
interface: (r5 = * GameState) -> void; sets EVENT_1703 and EVENT_1738, starts fade, reprograms r5.FrameCountdown
  and r5.SubsystemIndex
details: 'This is a GameState state routine (r5 = GameState as noted in the header). It first sets two
  event/story flags via SetEventFlagFromImmediate (EVENT_1703 and EVENT_1738), then calls SetScreenFade(0xc,
  0x10) to begin a screen fade, and ticks the 32-entry countdown-timer table. It stores 0x3c (60 frames)
  into GameState.FrameCountdown as a delay, then writes 0x10 into GameState.SubsystemIndex, which per
  the existing comment triggers overworld_owMap_renderAndTickSubsystems_800536E via cbGameState_80050EC
  on a later frame. Net effect: a one-shot transition state that records story progress, fades the screen,
  and hands control to the overworld after a one-second delay.'
