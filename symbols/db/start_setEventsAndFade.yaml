  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The asm does set EVENT_1703/EVENT_1738, call SetScreenFade(0xc,0x10), tick the timer table, store
    0x3c to FrameCountdown, and write 0x10 to SubsystemIndex — so the behavioral summary is accurate.
    However, there are no known callers (Callers: none known) in build-snapshots, so calling this ''start_fadeToOverworld''
    overstates its role; it is a one-shot GameState handler. The SubsystemIndex=0x10 write (strb, byte)
    sets a flag rather than fully reprogramming it, and the cbGameState_80050EC trampoline claim is speculative
    beyond what the code shows. A more neutral name reflecting its event-flag-setting + fade nature fits
    better.; run wf investigate investigate-20261018-182231; proposed by Hyper glm-5.3-flash, revised
    by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
