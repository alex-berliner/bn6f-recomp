- method: assembly-reading
  date: '2026-10-18'
  detail: two movflag immediates followed by bl SetEventFlagFromImmediate set story flags EVENT_1703 and
    EVENT_1738; bl SetScreenFade with r0=0xc, r1=0x10 starts a screen fade; bl timer_tickCountdownTable_8035738
    ticks the countdown-timer table; str r0(0x3c), [r5,#oGameState_FrameCountdown] arms a 60-frame delay;
    strb 0x10, [r5,#oGameState_SubsystemIndex] selects subsystem 0x10 (overworld per the cbGameState_80050EC
    comment)
