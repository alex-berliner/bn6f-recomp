details: 'Calls rfu_clearConnState to reset eStruct200FE00, then writes constants 1 and 2 into its +0x4
  and +0x5 bytes, stores the target pointer at +0x3C, and copies three fields from the source struct:
  a byte at +0x11 into +0x9, a halfword at +0x12 into +0x32, and a halfword at +0x14 into +0x18. If the
  source''s +0x10 byte is nonzero it sets +0xB to 1. Returns 2 in r0 (for the caller''s state-machine
  dispatch). Used by the RFU per-frame connection state update to set up a new link session target before
  transitioning to the next state.'
