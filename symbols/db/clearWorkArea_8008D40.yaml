name: clearWorkArea_8008D40
address: '0x08008D40'
kind: function
status: confirmed
summary: Zero-fills the 12-byte (3-word) work area at 0x203CA70 via ZeroFillByWord.
interface: void sub_8008D40(void); /* outputs r0-r3 and nz c v are whatever ZeroFillByWord leaves behind */
details: 'Pushes lr, then calls ZeroFillByWord with memBlock = dword_203CA70 and size = 0xC,

  clearing three words of IWRAM work area at 0x203CA70. It writes nothing else; the

  trailing data words (0x4000, 0x4C43, 0x400, 0) and the pointer table are just rodata

  belonging to nearby code, not touched by this routine. The register contract shows

  r2/r3 preserved and all other registers plus NZCV returned — these are simply the

  leftovers of the ZeroFillByWord call, so callers evidently ignore r0-r3 and flags.

  0x203CA70 is likely a small per-frame or per-scene scratch/state structure used

  elsewhere; this function is presumably called before it is initialized or reused.

  '
