name: battle_syncHudShownHp
address: '0x0801E0BC'
kind: function
status: probable
summary: Copies MegaMan's current HP into the battle HUD's displayed-HP field so the HP box shows the
  live value.
interface: (no args) -> r0 = new shown HP; no flags set intentionally
details: Reads a pointer from the HUD state struct eStruct2035280+0x48 — presumably the player/MegaMan
  battle object — loads its halfword at +0x24 (its current HP) and stores it into the HUD's shown-HP halfword
  at eStruct2035280+0x24. No other state is touched and it uses r0 as scratch, returning the copied value.
  It is a plain one-way sync; the caller presumably triggers a HUD redraw afterwards via the redraw/request
  bits noted in symdb.
