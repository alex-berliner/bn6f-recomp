name: battle_nibbleIdInList
address: '0x08102E5C'
kind: function
status: probable
summary: Builds a byte ID from two nibbles and reports (0=yes, 1=no) whether it appears in a 0-terminated
  byte list.
interface: (r0 = low nibble of ID, r1 = high nibble of ID, r2 = ptr to 0-terminated byte list) -> r0 =
  0 if ID found in list, 1 if not
details: r1 is shifted left 4 and orr'd into r0, packing two nibbles into one byte, which is then compared
  against every entry of the array pointed to by r2 until a 0 terminator is reached. Returns 0 on a match,
  1 if the terminator is reached without a match, so the return value is inverted relative to a typical
  'found' boolean. The list entries are bytes, suggesting packed IDs (e.g. two nibble-sized fields stored
  together). No other registers or memory are touched; the list pointer r2 is clobbered. Only one caller
  (sub_8102CF8) is known and undocumented, so what list is being searched and what the ID means is not
  determinable from this function alone.
