name: ai_spawnAttackHitboxAtPanel
address: '0x080ECF00'
kind: function
status: probable
summary: Computes a target panel's screen position, offsets it by the attacker's arm attachment (slot
  0x17), and spawns the AI attack's damage entity/hitbox with the attack's damage value.
interface: (r0 = panel column, r1 = panel row, r2 = packed arg (r4 = (r2<<8)|2), r5 = attacker battle
  object, r7 = AI attack vars) -> r0 = result of sub_80C6248 (spawned entity?); no flag use seen
details: Takes a panel column/row pair and converts it to 16.16 screen pixel coordinates via object_getCoordinatesForPanels,
  then subtracts 1 pixel (0x10000) from y. It reads the attacker battle object (r5) NameID, Alliance and
  DirectionFlip and calls getBattleArmPositionMaybe with slot 0x17 to get the mirrored (x,y) arm attachment
  offset; the y offset is shifted into 16.16 (lsl r3,#16). Finally it loads oAIAttackVars_Damage from
  the attack state at r7 and calls sub_80C6248 with r0 = arm x-offset, r1/r2 = panel screen x/y, r3 =
  arm y-offset<<16, r6 = damage — almost certainly a hitbox/damage-entity spawner. r5 and r7 are nonstandard
  (callee-saved) register arguments carried in from the caller; the caller-supplied r2 is packed as (r2<<8)+2
  into r4, whose role at sub_80C6248 is unclear.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_getCoordinatesForPanels directly on entry converts the (r0,r1) panel pair to screen
    pixels; sub r2,r2,r0 with r0=0x10000 nudges the converted y up by one pixel; getBattleArmPositionMaybe
    is called with r1=#0x17 and r5 fields NameID/Alliance/DirectionFlip, giving the arm attachment offset;
    ldr r6,[r7,#oAIAttackVars_Damage] right before bl sub_80C6248 passes the attack's damage to the spawn
    call; sole caller ai_walkSlashAttackStep is described as dashing to a panel and spawning a hitbox
    with slash SFX
