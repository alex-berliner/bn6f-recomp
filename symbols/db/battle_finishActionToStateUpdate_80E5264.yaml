name: battle_finishActionToStateUpdate_80E5264
address: '0x080E5264'
kind: function
status: confirmed
summary: 'End-of-action battle state handler: stores extra var 3, plays sound 0xAD, and switches the battle
  object to the UPDATE state phase.'
interface: void sub_80E5264(r2 arg2, r5 battleObject, r10 arg10); outputs r5 r8 r9 r10 r11 r12 via the
  state dispatcher tail-call
details: 'Called with r5 = battle object pointer (fields oBattleObject_ExtraVars and oBattleObject_CurStateActionPhaseAndPhaseInitialized).
  It writes 3 to oBattleObject_ExtraVars+0xC, plays sound effect 0xAD via PlaySoundEffect (passing r0=0xAD
  and r2 through unchanged), then sets the object''s CurStateActionPhaseAndPhaseInitialized to CUR_STATE_UPDATE.
  It then tail-calls sub_80E527A (the state dispatcher / phase runner) with r5 still the object pointer,
  and its register results (r5 r8 r9 r10 r11 r12) become this function''s outputs. Flags nz c v are clobbered.
  r10 is an input that is passed along but not used directly in this routine. The 0xAD sound and extra
  var value 3 tie this to whatever action phase ends here; the exact in-game identity of sound 0xAD is
  not confirmed from this code alone.

  '
