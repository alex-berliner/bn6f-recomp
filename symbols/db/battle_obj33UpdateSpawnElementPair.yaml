name: battle_obj33UpdateSpawnElementPair
address: '0x080E93A0'
kind: function
status: probable
summary: 'Per-frame update for an element-based battle object: on its first tick it spawns two companion
  objects (object #33 and one via sub_80C24D2) inheriting its element, height and flags, then ends itself
  once both Param1 and Param2 have cleared.'
interface: (r0 = scratch (overwritten), r5 = battle object this) -> r0 = destroyed? (phase 8 written);
  sets PhaseInitialized = 4 on first run
details: 'On first invocation (oBattleObject_PhaseInitialized == 0) it latches PhaseInitialized = 4 and
  makes two spawn calls. Both calls receive r2 = this->Element, r6 = Z16Save | (StaminaDamageCounterDisabler
  << 16), r4 = 0, r5 = this->RelatedObject1Ptr, and r7 = &this->byte4 for the first call vs &this->byte5
  for the second — so the two children are anchored to two adjacent bytes of the parent, likely per-child
  state/counters. The first spawn is battle_spawnObj33WithElement (object #33, element-customised); the
  second is the unknown sub_80C24D2 with the same argument pattern. Every tick afterwards it checks Param1
  and Param2: if either is non-zero it returns, and when both are zero it writes phase 8 into CurPhaseAndPhaseInitialized,
  i.e. the object finishes once both children have signalled completion.'
