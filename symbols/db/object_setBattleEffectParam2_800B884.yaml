summary: Writes the low byte of r1 to byte offset 0x1 of the (r0-indexed) entry in the byte_203CF00 0x50-byte-per-entry
  table and returns that entry pointer in r0.
interface: (r0 = index, r1 = byte value) -> r0 = &byte_203CF00[index] ; no side effects beyond the one
  store
details: '1. Saves lr, then pushes r1 onto the stack so it survives the call, and calls byte_203CF00_getEntryPtr_800BF5C
  with r0 as the index.

  2. Restores r1 from the stack, stores r1 as a byte at [r0,#1] (offset 0x1 inside the 0x50-byte entry),
  and pops pc to return to the caller.

  3. Net effect: r0 becomes the entry pointer (byte_203CF00 index helper''s return), and the value at
  entry+1 is set to the low byte of r1.

  4. Given the callers'' contexts (chip-name drawing, SnakeArm per-tick handler, time-freeze end, panel-targeted
  sub-animation), this looks like a small per-slot "set animation/effect parameter" setter for a shared
  battle-object scratch table.

  '
