name: reqBBS_anim_814004C
address: '0x0814004C'
kind: function
status: confirmed
summary: Draws or blanks the 8 BBS request-entry tiles on the current sub-screen, cycling their tile block based
  on the animation frame, then redraws the bottom border row.
interface: u32 reqBBS_drawRequestTiles(u32 bbs_state /*r5*/, u32 toolkit /*r10*/) -> bbs_state /*r5*/; Z, N, C,
  V, LR clobbered; r0-r7 preserved by caller-saves push/pop.
details: 'Reads the request entry base index at bbs_state+0x24 and the current frame counter from the toolkit (oToolkit_CurFramePtr).
  The low 5 bits of the frame select one of 16 tile-ID pointers from the pt_81400C8 table (two 64-byte arrays byte_8140148
  and byte_8140188 holding tile IDs 0x80–0x87). For each of 8 entries (loop i=0..7): fetches the event-flag base
  from bbs_state+0x28 sub-object offset 0xC, adds the per-entry flag ID from reqBBS_eRequestEntriesIDs[entry_base+i],
  calls TestEventFlag. If the flag is set (Z clear), calls CopyBackgroundTiles(2, 2*i+3, 2, tile_ids, 2, 2) to paint
  the entry''s 2×2 tile block; otherwise calls sub_3005EBA with tile_ids=0 to blank it. After the loop, redraws
  the bottom border row via CopyBackgroundTiles(0x15, 0, 2, tile_ids, 2, 2). The BBS state pointer in r5 is returned
  unchanged.'
