name: battleObject_actionFlinchSetAnim
address: '0x08103DFA'
kind: function
status: probable
summary: Flinch action handler that runs the standard flinch logic and then forces the object's current
  animation to 0x41.
interface: (r5 = battle object pointer, r0-r3 = action-handler args) -> r0 = 0; no meaningful flags
details: 'A tiny action-jumptable entry: it first calls the shared flinch action handler, which dispatches
  the AI, commits the pushed-back FuturePanel position and plays flinch animation frames. It then stores
  0x41 into the battle object''s CurAnim field at [r5+oBattleObject_CurAnim], overriding/continuing with
  a specific animation after the flinch. r5 is not set up inside this function, so it is supplied by the
  jumptable dispatcher as the current battle object. The exact owner (which character/object uses anim
  0x41 here) cannot be determined without finding the jumptable that references this address.'
