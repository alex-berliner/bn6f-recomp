name: runSetupStepAndClearWorkArea_8005F6C
address: '0x08005F6C'
kind: function
status: confirmed
summary: Runs one setup/step routine (sub_802FDB0) and then wipes the work memory that routine used via cleareMemory_802FF2C.
interface: void sub_8005F6C(void); // callers pass r3-r7 as live inputs, r4-r7 preserved; returns v, r2, r3 and
  NZCV as left by cleareMemory_802FF2C
details: 'A thin wrapper that performs exactly two tail-like calls in sequence: sub_802FDB0 (apparently some setup
  or per-frame step that produces/stores work data) immediately followed by cleareMemory_802FF2C (a known memory-clearing
  helper, whose name in the disassembly suggests it zeroes/clears a work area). No local state of its own is touched:
  it only pushes r4-r7 and lr, makes the two calls, and pops back. Since the readable C marks both calls as guest
  calls with RETURN_TO_CALLER, the final register state (including r2/r3 and the V flag) is whatever the last callee
  leaves behind, and callers reportedly depend on that. Its own r4-r7 are preserved end-to-end, so this acts as
  a pass-through of callee-saved registers. Without knowing what sub_802FDB0 owns, the most defensible description
  is "do the setup step, then clear its work memory" — a teardown/finish sequence.

  '
