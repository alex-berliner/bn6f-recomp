name: clearBattleStateIfEvent1708Pending_809F90C
address: '0x0809F90C'
kind: function
status: confirmed
summary: On the first call before event flag 0x1708 is set, zeroes the battle state buffer at byte_2000210
  (u8 at +0, u32 at +8); once the flag has been triggered the function becomes a no-op.
interface: void sub_809F90C(void) /* clobbers r0,r1,nz,c,v,r3,lr */
details: 'Tests event flag 0x1708 via TestEventFlagFromImmediate (byte 0x17, bit 0x08). If the flag

  is set, returns immediately (Z clear means "set", so bne is the no-op path). Otherwise

  writes 0 to byte_2000210 and to the u32 at byte_2000210+8, resetting the battle/state

  buffer used at this point in the engine. The off_809F9C4 entry points at byte_2000210.

  '
