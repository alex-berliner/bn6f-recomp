name: snakearm_initMoveToFrontPanel
address: '0x080DECBC'
kind: function
status: probable
summary: 'Initializes a snake-arm battle object to move toward the panel in front of it: reads per-index
  table data into 0x78/0x7a and 0x6c, sets DirectionFlip=1, computes the front panel and stores it at
  0x60/0x61, derives screen-coordinate velocity via object_getCoordinatesForPanels and battleCoordCalc_8114F6A,
  clears Z/0x64/0x68/0x6a, sets CurAnim=1 and 0x63=1, then calls sub_80DED80.'
interface: (r0-r3 unused; r5 = battle object) -> void; sets X/Y/ZVelocity, target panel fields, animation
  state
details: Reads an index from oBattleObject+0x62 and looks up byte_80DEA70[index*4], storing the two halfwords
  into fields 0x78/0x7a (purpose unknown). Sets DirectionFlip=1, calls object_getFrontDirection, and sets
  the target panel to (PanelX+frontDir, PanelY), copying it into fields 0x60/0x61. A second table byte_80DEA50[index*2]
  supplies a speed value stored to 0x6c and copied to 0x66. It converts the target panel to screen coords
  via object_getCoordinatesForPanels, then calls battleCoordCalc_8114F6A with the object's position (r5+0x34),
  the speed, and 0, storing the result as X/Y/ZVelocity. It zeroes Z, the 0x68 counter and 0x64, sets
  CurAnim=1 and field 0x63=1, then calls sub_80DED80 — a launch/move setup for a projectile-like object.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'panelX+frontDirection stored to 0x60 and PanelY to 0x61: target panel directly ahead (front-direction
    call); byte_80DEA50 indexed by field 0x62*1 loaded into 0x6c, passed as r4 speed to battleCoordCalc_8114F6A;
    battleCoordCalc output stored to oBattleObject_X/Y/ZVelocity — a velocity toward the converted panel
    coordinates; CurAnim (0x62 offset? no, 0x63) set to 1 and Z/timer fields cleared: fresh movement state
    for a spawned object; sole caller snakearmRelated_80DEAA8 groups it with the snake-arm attack code'
