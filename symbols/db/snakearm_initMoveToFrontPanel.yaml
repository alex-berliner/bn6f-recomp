  reproduce: python3 tools/asmcat.py 0x080DECBC
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The function clearly reads byte_80DEA70[index*4] into 0x78/0x7a and byte_80DEA50[index*2] into 0x6c/0x66,
    sets target panel to front-adjacent panel via object_getFrontDirection, computes velocity via battleCoordCalc_8114F6A,
    sets CurAnim=1 and 0x63=1, then calls sub_80DED80. This matches a snake-arm object''s move initialization.
    The proposed name is fine but the prefix list does not include ''snakearm'' for ''init'' verbs — however
    the rules say snakearm is an allowed prefix, so ''snakearm_initMoveToFrontPanel'' is acceptable. The
    summary slightly overstates: it says ''fly'' and ''projectile-like'' which the asm doesn''t prove;
    the fields 0x78/0x7a are called ''purpose unknown'' but could be target/destination panel-coords like
    the other table write. A more neutral summary is better.; run wf investigate investigate-20261018-230610;
    proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
