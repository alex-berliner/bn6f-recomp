status: confirmed
summary: Getter that returns the halfword field at offset 6 of the overworld player object struct.
interface: uint16_t eOWPlayerObject_getUnk06(void)
details: 'Loads the address of eOWPlayerObjectEnd from a literal pool pointer, then reads a 16-bit halfword at offset
  +6 from that struct base and returns it in r0. The struct base is the fixed player overworld object data at 0x0800B854''s
  literal (eOWPlayerObjectEnd), with the field landing at word_200A00E (offset 6 past the base). Pure getter: no
  side effects, no other registers or memory touched; r1 is clobbered for the address load. The meaning of the field
  itself is still unknown (labeled unk06), but it lives inside the player''s overworld object structure, so callers
  presumably query player state such as a coordinate, animation/frame counter, or similar small value.'
