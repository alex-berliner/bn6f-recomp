name: ai_syncPanelHighlight
address: '0x0810FC30'
kind: function
status: probable
summary: Keeps the highlighted/collision panel of a diving or swooping enemy in sync with its current
  panel position
interface: (r5 = battle object, PanelX/PanelY current) -> void; no return value used
details: Compares oBattleObject_PanelX/PanelY against cached copies at +0x6C/+0x6D; returns early if unchanged.
  On change, calls sub_810FC68 with the old cached X/Y (presumably releasing the highlight/collision on
  the previous panel), writes the new PanelX/PanelY into +0x6C/+0x6D, then calls object_setCollisionRegion
  with r0=1 (a fixed region index, likely the 'occupied/highlight' region) and the new panel coordinates.
  Fields 0x6C/0x6D thus act as a 'last highlighted panel' cache. Used by the dive-to-back-row and swoop
  attack AI state handlers each frame while the enemy moves.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: cmp of ldrb [r5,#oBattleObject_PanelX/PanelY] vs [r5,#0x6C/0x6D] with early return shows a cached-panel-changed
    check; bl sub_810FC68 receives old 0x6C/0x6D values before they are overwritten, implying cleanup
    of the previous panel; strb of new PanelX/PanelY into 0x6C/0x6D then bl object_setCollisionRegion
    ties the update to collision/highlight bookkeeping; callers ai_diveToBackRowUpdate and ai_swoopAttackUpdate
    are both documented as highlighting the panel beneath the moving enemy
