name: ai_attackSpawnHitRegion
address: '0x08108E34'
kind: function
status: probable
summary: Spawns the damage collision region for an AI attack in front of the attacker, with per-variant
  size/timing taken from a small table.
interface: (r0 = attack variant index, r5 = battle object, r7 = oAIAttackVars) -> r0 = spawned region
  from object_spawnCollisionRegion; no meaningful return
details: r0*4 indexes the table at byte_8108E58, whose two 4-byte entries are 02 FF 05 04 and 04 FF 05
  04 — likely width (2 or 4 panels) plus three other region parameters. It calls object_getFrontDirection
  to get +1/-1 based on the object's alliance/DirectionFlip, adds it to oBattleObject_PanelX so the region
  lands one panel ahead, and passes PanelY as the second coordinate. It then feeds oAIAttackVars_InitFlag
  (r2), 0 (r3), oAIAttackVars_Damage (r6) and the literal 1 (r7) into object_spawnCollisionRegion, which
  creates the hitbox. The two table entries correspond to two flavors of the same attack used by the surrounding
  AI routines (routes tagged battlesweep).
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldr r1, off_8108E54 + lsl r0,#2 selects a 4-byte param record (0x0405FF02 / 0x0405FF04) per
    attack variant; bl object_getFrontDirection; add r0, r0, panelX places the region one panel in the
    object's facing direction; ldrb r2,[r7,#oAIAttackVars_InitFlag] and ldr r6,[r7,#oAIAttackVars_Damage]
    pass the attack's faction and damage into object_spawnCollisionRegion; bl object_spawnCollisionRegion
    with r3=0 and r7=1 completes the hitbox spawn argument set; callers sub_8108602/sub_8108688 are AI
    attack handlers on recorded battlesweep routes
