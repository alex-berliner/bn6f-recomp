name: pet_applyNaviStatUpdates
address: '0x08123208'
kind: function
status: probable
summary: 'Commits the accumulated updates from the scratch struct at word_200DCF0 into the NaviStats record
  of the currently selected PET navi: adds halfword/byte deltas to stats 0x42/1/2/3/0xB/0xA (clamped to
  0xFFFF/4/4/4/10/8) and, when nonzero, one-shots flag halfwords +0x0C/+0x0E/+0x10/+0x12/+0x14 into stat
  bytes 7/0x1C/0x1B/0x23/7.'
interface: (void) -> void; reads scratch struct at word_200DCF0, writes via SetCurPETNaviStats* on the
  current navi
details: 'Gets the current PET navi, then adds each halfword of the scratch struct at word_200DCF0 into
  a NaviStats field: +0x00 into u16 stat 0x42 unclamped, +0x02/+0x08/+0x0A into byte stats 1/2/3 clamped
  to 4, +0x04 into byte stat 0xB clamped to 10, +0x06 into byte stat 0xA clamped to 8. It then treats
  halfwords at +0x0C, +0x0E, +0x10, +0x12, +0x14 as flags: when nonzero it sets byte stat 7 to 0x30, stat
  0x1C to 1, stat 0x1B to 1, stat 0x23 to 1, and stat 7 to 0x34 respectively. The pattern of read-modify-write
  with per-field clamps and one-shot flag writes looks like committing accumulated upgrades/bonuses into
  the persistent navi record; the scratch struct''s producer is not visible here.'
