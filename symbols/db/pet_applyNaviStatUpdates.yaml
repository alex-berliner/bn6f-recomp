  date: '2026-10-18'
  detail: 'bl GetCurPETNavi then repeated Get/SetCurPETNaviStats* pairs operate on the current navi''s
    NaviStats; ldrh r2,[r4]; add r2,r2,r0; SetCurPETNaviStatsHword(navi,0x42) adds scratch +0 into u16
    stat 0x42 without clamping; cmp r2,#4 / ble / mov r2,#4 around byte stats 1,2,3 and cmp #10 / #8 for
    stats 0xB / 0xA show per-field clamping; tst r2,r2 / beq guards on word_200DCF0+0xC..+0x14 gate constant
    writes (stat 7 = 0x30/0x34, stats 0x1C/0x1B/0x23 = 1); sole caller sub_8121154 at 0x08121154 runs
    this in PET/menu context (scratch buffer at word_200DCF0)'
