name: battle_clearAIDataField4c_8014424
address: '0x08014424'
kind: function
status: confirmed
summary: Clears the AI data word at offset 0x4c for a battle object's AI, returning 0 in r1.
interface: void battle_clearAIDataField4c(BattleObject* obj /* r5 */) returns u32 /* r1 = 0 */
details: 'Reads the battle object''s AI data pointer from oBattleObject_AIDataPtr (r5-based BattleObject), stores
  0 into oAIData_Unk_4c of that AI data structure, and returns 0 in r1 (r1 is set to 0 before the store and is the
  outgoing value). The NZ flags are left reflecting the cleared value; no other registers are touched. Likely a
  helper that resets one piece of AI state (e.g. a timer, target, or phase counter) used by enemy AI routines; the
  meaning of oAIData_Unk_4c is not yet known.

  '
