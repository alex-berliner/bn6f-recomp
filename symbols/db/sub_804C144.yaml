name: sub_804C144
address: '0x0804C144'
kind: function
status: confirmed
summary: 'Drives a battle screen-flash / background-fill effect: ticks a counter, advances frame index on timer
  expiry, and copies a 32x32 tile block (from one of 8 frame buffers) into character block 2.'
interface: 'void battle_runScreenFlashEffect_804C144(void);

  // inputs : r5 (state block: byte[+0x11] flag, byte[+0x13] frame index, byte[+0x14] timer),

  //          r10 (toolkit pointer -> render info), lr (return)

  // outputs: r5 preserved/repointed

  // clobber: r0,r1,r2,r3,NZCV,lr

  // preserved: r4,r5,r6,r7

  '
details: "- Pulls the render-info pointer out of the toolkit (via r10 + oToolkit_RenderInfoPtr) and ORs 0x400\n\
  \  into its first u16 (likely an I/O/dispcnt or BG enable bit).\n- Reads an \"effect counter\" at unk_2013960\
  \ + 0x14:\n    * > 0x24 -> calls sub_804C214 (extended/late phase)\n    * 1..0x24 -> calls sub_804C244 (normal\
  \ phase)\n    * <= 0 -> tears the effect down: writes 4 to the render-info byte and clears r5+0x11.\n- In the\
  \ active phases also calls sub_804C1D4 (per-frame helper).\n- Frame advance: decrements the per-frame timer at\
  \ r5+0x14; when it hits zero, reloads it to 0x0A (10\n  frames) and cycles the frame index at r5+0x13 (0..7, wrapping\
  \ 7 -> 0).\n- Issues CopyBackgroundTiles(0, 0, tile_block=2, src= byte_869D82C | byte_869E02C | byte_869E82C |\n\
  \  byte_869F02C indexed by frame_index, size=0x20 x 0x20). The 8-entry pointer table at off_804C1B4\n  picks which\
  \ 32x32 tile image is shown this frame; note indices 2..6 all share byte_869E82C\n  (those frames are static copies).\n\
  \nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
