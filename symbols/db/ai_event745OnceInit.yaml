name: ai_event745OnceInit
address: '0x08089BC0'
kind: function
status: probable
summary: 'One-time AI trigger: if chatbox flag bit 0x80 is clear, sets event 745 and resets the entity''s
  AI state, then returns 1.'
interface: (r5 = AI/entity control struct) -> r0 = 1 always; sets EVENT_745 when flag bit 0x80 was clear
details: Tests bit 0x80 of eFlags2009F38 via chatbox_mask_eFlags2009F38; if set, skips straight to the
  return. Otherwise it sets event flag EVENT_745 through SetEventFlagFromImmediate, clears the byte at
  r5+8 (likely a state/counter), stores 0x1e into AIData+0x18 of the AI struct in r5, and writes 0x1c
  to r5+0 (likely the AI state/command selector). Always returns 1, so callers presumably just continue.
  r4, r6, r7 are pushed but unused. The 0x1c written to r5+0 pairs with the 0x1e in AIData+0x18, suggesting
  it selects a follow-up AI routine/behavior.
