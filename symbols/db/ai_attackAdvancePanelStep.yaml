name: ai_attackAdvancePanelStep
address: '0x080F50A0'
kind: function
status: probable
summary: 'AI attack state: commits the enemy''s pending panel move, plays the attack animation, and after
  3 frames signals the attack hit via HitElement=8.'
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = destroyed; sets oAIAttackVars_AttackElement,
  oBattleObject_PanelX/Y, collision flags, oAIAttackVars_StepTimer/HitElement
details: On first call (AttackElement == 0) it marks the attack started by storing element 4 into oAIAttackVars_AttackElement,
  sets the object's current animation to 3, and copies FuturePanelX/Y into PanelX/Y — committing the panel
  the AI intends to move into. It then recomputes pixel coordinates from the new panel, syncs the collision
  record (object_updateCollisionPanels), clears collision flag 0x40, and sets ObjectFlags1 bit for CURRENTLY_MOVING_1
  so the move plays out. StepTimer is set to 3; on later calls it is decremented until zero, at which
  point HitElement is set to 8, which the surrounding attack handler reads as the attack's landing/completion
  signal. This matches the AI attack framework pattern where an attack routine is ticked once per frame
  with a step timer.
