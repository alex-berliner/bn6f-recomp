    object_clearFlag 0x40 and object_setFlag1 (1 << OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT) mark the object
    as moving; StepTimer stored as 3 then decremented each tick until it reaches 0; on timer expiry writes
