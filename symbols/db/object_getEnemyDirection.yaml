name: object_getEnemyDirection
address: '0x0800E2C0'
kind: function
status: confirmed
summary: Returns the ±1 horizontal facing step of a battle object based on its alliance (player side = +1, enemy
  side = -1).
interface: int object_getFacingDirection(BattleObject *obj /* r5 */); out r0 = +1 (player side) or -1 (enemy side),
  as a two's-complement u32; c/v and nz set by the final NEG
details: 'Tail-merged helper: object_getEnemyDirection loads the object''s alliance byte

  (r5 + oBattleObject_Alliance) and falls through into object_getAllianceDirection,

  which computes step = 2*alliance - 1 and negates it. The net result is +1 for

  alliance 0 (player side) and -1 (0xFFFFFFFF) for alliance 1 (enemy side), the

  standard facing multiplier used when moving or aiming left/right on the battle

  grid. The function is flag-sensitive: the trailing NEG (rsbs) sets N/Z/C/V

  (C = NOT borrow), so callers may branch on the returned sign without re-testing.

  Only the alliance field is read; nothing is written.

  '
