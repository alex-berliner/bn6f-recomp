name: CutsceneCmd_set_cutscene_skip_script
address: '0x08037904'
kind: function
status: confirmed
summary: Cutscene script VM command that arms skipping by recording which script should run after the player skips
  the current cutscene.
interface: void CutsceneCmd_set_cutscene_skip_script(cutsceneState r5, cursor r7); // reads operand via ReadMapScriptWord;
  returns r0=1 (success), r4=operand word, r6=1, r7=r7+5, NZ/C/V clobbered, lr preserved
details: 'A cutscene/map-script VM opcode handler. It reads a 32-bit operand (a script id/pointer) from the cutscene
  script via ReadMapScriptWord (which fetches using r5 = cutscene state and r7 = script cursor, leaving the word
  in r4), stores that operand into CutsceneState.CutsceneScriptAfterCutsceneSkip (field offset oCutsceneState_CutsceneScriptAfterCutsceneSkip),
  advances the script cursor by 5 bytes (1-byte opcode + 4-byte operand), sets r6 = 1 (likely a "command succeeded
  / continue execution" flag shared by command handlers), and returns r0 = 1. The stored value is presumably the
  script the engine jumps to when the player activates the skip-cutscene prompt during playback.

  '
