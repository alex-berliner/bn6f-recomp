name: ai_attackFrontPanel
address: '0x08110AE4'
kind: function
status: probable
summary: 'AI melee attack handler: on the sprite''s attack-active frame, sets the attack animation/element
  and spawns the attack one panel in front of the user.'
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = result of sub_80D6B78; no meaningful flags
details: It first reads the current animation frame's parameters via sprite_getFrameParameters and only
  acts when bit 0x80 of the attribute byte is set (the frame's 'attack fires now' flag), otherwise it
  returns immediately. On the active frame it forces the object's CurAnim to 5 (attack/swing animation),
  sets oAIAttackVars_HitElement to 0x14 and AttackElement to 0 (neutral), then queries object_getFrontDirection
  for the +1/-1 facing multiplier. It adds that to the object's PanelX to get the target panel one tile
  ahead at the object's own PanelY, and calls sub_80D6B78 passing the attack's Damage, AttackBoost2 and
  PanelChooseCallback loaded from the AI attack var block. r4-r7 are shuffled so the callee receives target
  X/Y in r0/r1 and the damage/boost/callback trio in r4/r6/r7, matching a shared 'spawn panel attack'
  helper signature.
