name: ai_attackFrontPanel
address: '0x08110AE4'
kind: function
status: confirmed
summary: Fires an AI enemy's front-panel melee attack once its animation hits the strike frame, spawning the panel-attack
  object on the panel directly in front of it.
interface: void ai_attackFrontPanel(r5 = enemy battle object, r7 = AI attack vars block); returns r5 unchanged
details: 'Called each frame while an AI enemy''s attack animation plays. Calls sprite_getFrameParameters(r5) and
  checks bit 0x80 of the result (the "hit lands" frame flag); if not set, returns immediately without doing anything.
  Once the hit frame is reached: sets the enemy''s current animation (oBattleObject_CurAnim) to 5 (the attack pose),
  writes 0x14 into oAIAttackVars_HitElement (halfword) and 0 into oAIAttackVars_AttackElement (byte) in the r7 AI
  state block, then computes the target panel by adding object_getFrontDirection(r5) (+1/-1) to the enemy''s oBattleObject_PanelX,
  using its oBattleObject_PanelY unchanged. Finally calls battle_spawnLinkedType3Object with r0=targetX, r1=targetY,
  r2=3, r3=0, and r4=vars->AttackBoost2, r5=self (enemy object, linked owner), r6=vars->Damage, r7=vars->PanelChooseCallback.
  Note the tail end overwrites r7 with the callback pointer, so vars is no longer valid after the spawn call. r4-r7
  are preserved across the whole routine; flags are clobbered.

  '
