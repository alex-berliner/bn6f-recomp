name: mainState_resetGameAndGoto28_8005524
address: '0x08005524'
kind: function
status: confirmed
summary: Tears down the current game mode (frees type-0x21 objects, runs the standard init/clear passes) and advances
  the main jumptable to state 0x28.
interface: void sub_8005524(void); uses r10 = toolkit pointer on entry; sets the main jumptable state to 0x28; clobbers
  r0-r3 and NZC flags, preserves r4-r6
details: 'Sequence of full-mode (re)initialization: FreeAllObjectsOfSpecifiedTypes(0x21) frees every object of type
  0x21 (likely the current scene/mode''s object pool), then the standard init passes run in order — sub_8004702,
  sub_8005F40, runSetupStepAndClearWorkArea_8005F6C, sub_80027C4, zeroFill_80024A2, scenario_initEffectState_8003962,
  zeroFill_8003AB2, RandomizeExtraToolkitPointers, and reloadCurNaviStatBoosts_813c3ac (re-reads the current navi''s
  stat boosts from 0x813c3ac data, i.e. save/bank data). Finally it reads the toolkit pointer from r10 (moved into
  r7), loads the MainJumptableIndexPtr from offset 0 of the toolkit, and stores 0x28 into that byte, advancing the
  main jumptable to state 0x28. Because the movs-style load of 0x28 is the last flag-setting instruction, NZ flags
  reflect 0x28 on return. The long init chain ending in a jump to a fixed state suggests this is the shared "exit
  current mode and boot the next one" transition used by the main state machine (e.g. returning to a menu/restart
  flow).

  '
