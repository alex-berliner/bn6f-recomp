name: battle_beginTurnOpenProcess_80144C0
address: '0x080144C0'
kind: function
status: confirmed
summary: Runs the start-of-turn "open" processing for a battle object — clears its chip-hand buffer, resets AI state,
  handles the control-inverting status effect against the opposing player, and rebuilds the object's collision/panel
  setup.
interface: void battle_beginTurnOpenProcess(BattleObject* obj /*r5*/, u32 fullPath /*r7*/) — r5 = battle object
  to process on entry; second entry sub_80144CA is the same routine with r7 forced to 1; returns nothing meaningful
  (r0-r3, flags clobbered, callee-saved r4/r7 restored)
details: 'Two entry points share one body: sub_80144C0 clears r7 to 0, sub_80144CA enters with r7 = 1; r7 is kept
  live in the guest register purely to decide the tail. The routine reads the object''s alliance byte (oBattleObject_Alliance)
  to get its battle-hand address (getBattleHandAddr_8010018), then zeroes 0xC halfwords at hand+0x26 — wiping the
  chip-hand slot data for the coming turn. It clears AI-data flag 0x20 via ClearAIDataUnk0x48Flag, then checks GetBattleEffects
  for bit 0x8. If that effect bit is set, it calls battle_networkInvert(alliance); when that reports the side is
  not already inverted, it finds the opposing player object (battle_findPlayer with alliance ^ 1) and runs sub_801DC36
  on it — i.e. the status effect forces the turn-open processing to be rerun against the other side (confusion/inversion-style
  handling). The shared tail then runs sub_80107C0, sub_8019F86 (with r0 from the r3 result), object_setCollisionRegion
  with argument 1, and sub_8012EA8. Finally sub_8014536, sub_801086C and sub_80142C2 run; only the r7 = 0 entry
  additionally calls sub_800FEEC before them. Callee-saved r4/r7 are popped back, so callers'' r5-r12 contents other
  than r4/r7 are touched by the callee chain, matching the contract''s outputs.

  '
