name: ai_teleportToPanelStep
address: '0x08112820'
kind: function
status: confirmed
summary: Runs one frame of the multi-step teleport animation for a battle object, sequencing highlight, out-sparkle,
  hold, and commit-in phases via a step timer.
interface: void ai_teleportToPanelStep(u32 r5 /* battleObj */, u32 r7 /* aiAttackVars */, u32 r1 /* pass-through
  */); /* r5,r6,r7 preserved; r1 may be replaced by callee returns */
details: 'Per-frame step routine called while a battle object is mid-teleport. Reads oAIAttackVars_StepTimer from
  r7 to determine the current phase. While the timer is above 3 (the highlight window), it calls object_highlightPanel
  on the object''s FuturePanelX/Y to pulse the destination tile; once the timer hits exactly 3 it converts those
  panel coordinates through object_getCoordinatesForPanels and spawns a type-0x15 teleport-out sparkle (spawn_t1_0x0_EffectObject)
  above the target. For timer values 2..0 the function only decrements and waits. When the timer reaches 0: it spawns
  a type-0x14 teleport-in sparkle at the object''s current stored position words (offset 0x34, with a 0x00100000
  z-bias), commits FuturePanelX/Y into PanelX/PanelY, calls object_removePanelReserve to free the reserved tile,
  object_setCoordinatesFromPanels to recompute world coordinates, object_updateCollisionPanels to refresh the collision
  grid, and ai_stepRefreshSprite to update the on-screen sprite. Finally it resets StepTimer back to 3 and sets
  HitElement to 8 (0x0800, likely a ''just-landed'' invulnerability or contact flag), so the cycle restarts on the
  next call. The function returns via pop {r4,pc}; r4 is saved and restored, r5/r6/r7 are never written directly,
  and r1 propagates whatever the last sub-call left in it.'
