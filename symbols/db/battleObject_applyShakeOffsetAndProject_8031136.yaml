open_questions:
- The exact game meaning of "X delta strictly positive AND equal to Y delta" -- in the codebase this could
  be a specific "tap/contact" or "match" detection that should not feed the screen shake, but evidence
  is not strong enough to lock the meaning.
- What fields [0..0x10] of the input object actually represent -- they are read and subtracted, but no
  struct definition cleanly captures them in the supplied headers (BattleObject's coord region begins
  at 0x34, so this may be a small legacy/auxiliary record or a per-frame update struct rather than a full
  BattleObject).
