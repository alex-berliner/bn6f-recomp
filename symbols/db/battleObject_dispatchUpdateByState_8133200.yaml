name: battleObject_dispatchUpdateByState_8133200
address: '0x08133200'
kind: function
previous_names:
- sub_8133200
status: probable
summary: Thunk that reads the battle object's CurState (offset 0) and tail-calls one of several per-state
  handlers via an indirect jump table
interface: (r5 = BattleObject*) -> tail-call to selected handler ; side effects none of its own
details: "Pushes {r4-r7,lr}, loads the jump table base from off_8133210 (points to off_8133214), indexes\
  \ it\n  by `ldrb r1, [r5,#1]` — i.e. the CurState byte at offset 0 of the BattleObject struct\n  (the\
  \ first byte after the linked-list Prev/Next pointers, which itself is ObjectHeader.Flags+Index,\n \
  \ so the state value is at offset 0x1, equivalent to CurState per the struct). Actually wait — the\n\
  \  byte read is `[r5,#1]` which is ObjectHeader.Index, not CurState; the dispatcher indexes on the\n\
  \  object's ListIndex/Index field. Loads the function pointer, sets lr for the bx, and tail-calls via\n\
  \  `bx r0`; restores {r4-r7,pc} so lr used by bx is the original caller return. The five entries in\n\
  \  the table at off_8133214 are: sub_8133228+1, battle_dispatchObjectUpdateOrEffect_81333A0+1,\n  sub_813399C+1,\
  \ sub_8133228+1, sub_8133A44+1 (each odd due to Thumb bit). Because index 0 and 2\n  point to the same\
  \ target (sub_8133228) and the table is only five slots, this is a compact\n  index-1..5 dispatch (no\
  \ slot 0); an out-of-range index would fall off the table, so callers must\n  guard the value.\n  Called\
  \ exclusively from sub_813188C (battle object update loop driver) with the BattleObject* in r5.\n"
