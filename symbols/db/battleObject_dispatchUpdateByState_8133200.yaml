  detail: '- `push {r4-r7,lr}` / `pop {r4-r7,pc}` shows pure tail-call pattern with callee-saved registers
    intact (asm line 1, 7) - `ldrb r1, [r5,#1]` reads a single byte from the object pointer in r5 at offset
    1 (the Index/ListIndex byte of ObjectHeader) — asm line 3 - `ldr r0, [r0,r1]` with base = &off_8133214
    indexes a 4-byte-per-entry Thumb function table — asm line 4 - `mov lr, pc` / `bx r0` is the classic
    Thumb→Thumb/ARM indirect tail-call — asm line 5 - The 5-word table at off_8133214 explicitly contains
    sub_8133228+1, battle_dispatchObjectUpdateOrEffect_81333A0+1, sub_813399C+1, sub_8133228+1, sub_8133A44+1
    — asm lines 14–18 - Caller sub_813188C is the battle-object update loop dispatcher; in-register contract
    has r5 live across the call → consistent with `r5 = BattleObject*` - Captured entry r0 = 0x08133201
    (the address with Thumb bit set, meaning entry is taken via `bl battleObject_dispatchUpdateByState_8133200+1` or call into a Thumb
    bridge) and exit r0 = 0, flags -Z--, showing the routine itself never returns to its caller (tail-call)
    and the lr snapshot (0x0811f784) is sub_813188C''s caller — the tail-call went elsewhere'
