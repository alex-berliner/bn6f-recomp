open_questions:
- Whether the indexed byte is really `Index` (offset 1) or `CurState` (offset 0x9, after the linked list).
  The struct places CurState at offset 0x9 once the 0x10-byte linked list header is counted, but here
  `[r5+#1]` would land on `Index` (since LinkedList is 0x10 bytes and ObjectHeader sits at +0x10). Need
  to compare with how sub_813188C itself sets up r5; the actual field meaning is unclear without that.
  Also unsure if index 0 in the table is intentionally unused (i.e. the dispatcher only handles 1..5)
  or if a zero entry would fall through into the next word.
