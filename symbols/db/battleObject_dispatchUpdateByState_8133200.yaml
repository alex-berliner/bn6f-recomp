name: battleObject_dispatchUpdateByState_8133200
address: '0x08133200'
kind: function
status: confirmed
summary: 'Per-frame state-machine dispatch for a battle object: reads a state byte from the object at [r5+1] and
  jumps through a five-entry word table to the matching handler (init overlay, update/effect, or draw).'
interface: 'void battleObject_dispatchUpdateByState_8133200(void)  // in: r5 = battle object ptr (state byte at
  [r5+1], valid 0/4/8/12/16); r2,r4,r6-r10 passed through; out: r0-r3,r5,r8-r12,flags from handler; preserved: r4,r5,r6,r7'
details: 'Loads the 32-bit table base from off_8133210 (→ off_8133214), reads the state byte at [r5+1] via LDRB,
  uses that byte as an index into the five-word handler table at off_8133214, loads the handler address (Thumb,
  +1), sets LR=PC, and BX''s to it. The pop {r4-r7,pc} at the end serves as the return frame for the handler. Table
  entries (byte offsets): 0 = battle_initChipSelectFromOverlay_8133228, 4 = battle_dispatchObjectUpdateOrEffect_81333A0,
  8 = sub_813399C (unknown, possibly an alternate update path), 12 = battle_initChipSelectFromOverlay_8133228 (duplicate
  of 0), 16 = submenu_dispatchStateDraw. Because the table is indexed by a byte offset into word entries, only multiples-of-4
  state values are valid; other values would read garbage. The function is a thin trampoline: it performs no computation
  of its own beyond the pointer arithmetic and BX, relying entirely on the callee to carry out the actual per-state
  work (chip-select overlay init, object effect/update tick, or draw pass).

  '
