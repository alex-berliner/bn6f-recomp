status: probable
summary: Cracks the panel the battle object is standing on after a delay, playing a crack SFX and advancing
  to action 4 (with a follow-up phase that destroys the object once its crack animation finishes).
interface: '(r5 = BattleObject*) -> r0 = Timer decremented value (live for caller per contract), flags
  updated ; side effects: highlights panel, mutates PanelX/PanelY highlight byte, Timer, animation/sprite
  state, collision region, plays SFX 0xB9, sets CurAction=4 and zeroes CurPhaseAndPhaseInitialized'
details: '- On entry reads `oBattleObject_Timer` (offset 0x20); if bit 0x4 is unset it calls `object_highlightPanel(PanelX,
  PanelY)` to mark the current panel as highlighted.

  - Always decrements `Timer` by 1 (sub r0,#1 / strh). When the timer is still > 0 (`bgt locret_80DFF82`)
  the function returns without further work.

  - When the timer reaches 0, it loads the panel parameters via `object_getPanelParameters(PanelX, PanelY)`;
  if bit 0x10 (a panel flag) is set, it sets bit 0x1 (`OBJECT_FLAG_VISIBLE`) on the object''s `oObjectHeader_Flags`.

  - Loads sprite group 0x80 with sub-id 0x26, clears shadow (`sprite_noShadow`), zeroes `oBattleObject_CurAnim`/`CurAnimCopy`,
  sets animation 0 (`sprite_setAnimation`), reloads animation data (`sprite_loadAnimationData`), then
  re-applies the object''s flip via `object_getFlip`/`sprite_setFlip` and assigns collision region 1 (`object_setCollisionRegion`).

  - If the object''s `oBattleObject_Param1` is non-zero, it calls `sub_8109794(PanelX, PanelY)` (the tile-cracking
  handler), which propagates the crack into the panel.

  - Plays sound effect 0xB9 (`PlaySoundEffect`), sets `CurAction = 4` and zeroes `CurPhaseAndPhaseInitialized`,
  then returns (this transitions to a destroy/finish sub-action).

  - The second basic block (loc_80DFF64) is reached only via fall-through as a continuation sub-action:
  on first entry it sets CurPhase=1 and clears collision region; once `sprite_getFrameParameters` shows
  bit 0x80 of the frame word set (animation finished), it overwrites `CurStateActionPhaseAndPhaseInitialized`
  with `CUR_STATE_DESTROY` (0x8).

  - The capture traces consistently return r0 in {6..9} after the timer-driven path, consistent with the
  leftover Timer value written before the return; that is an observable artefact of the contract, not
  a meaningful return value.

  '
