    / `bl sprite_setFlip` re-applies facing; `mov r0,#1; bl object_setCollisionRegion` sets region 1.
    - `ldrb r0, [r5,#oBattleObject_Param1]; cmp r0,#0; beq ...; bl sub_8109794` is the optional tile-cracking
    branch (sub_8109794 is the tile-crack object handler per callee summary). - `mov r0,#0xb9; bl PlaySoundEffect`
    and `mov r0,#4; strb r0,[r5,#CurAction]; mov r0,#0; strh r0,[r5,#CurPhaseAndPhaseInitialized]; pop
    {pc}` is the action transition. - Second block writes `CUR_STATE_DESTROY` (0x8) into `oBattleObject_CurStateActionPhaseAndPhaseInitialized`
    once the crack sprite''s `sprite_getFrameParameters` returns bit 0x80 set.'
