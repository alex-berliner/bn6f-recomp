    is the down-counter guard. - `bl object_getPanelParameters` + `tst r0, #0x10` + `orr r0, #2` / `strb
    ... oObjectHeader_Flags` is the visibility-bit write. - `mov r1,#0x10; mov r2,#0x26; mov r0,#0x80;
    bl sprite_load` followed by `bl sprite_noShadow`, the two `strb r0,[r5,#CurAnim/CurAnimCopy]` and
