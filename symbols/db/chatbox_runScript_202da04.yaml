name: chatbox_runScript_202da04
address: '0x0803FD68'
kind: function
status: confirmed
summary: Thin wrapper that runs a numbered text script from the fixed eTextScript202DA04 archive by forwarding to
  chatbox_runScript.
interface: void chatbox_runScript_202da04(u8 scriptID); // r0 = script index; tail-calls chatbox_runScript(eTextScript202DA04,
  scriptID)
details: 'Trivial thunk: moves the script ID from r0 to r1, loads the address of the hard-coded TextScriptArchive
  eTextScript202DA04 (referenced via literal pool at off_803FD74) into r0, and tail-jumps to chatbox_runScript,
  which interprets that script entry through the chatbox. No state of its own is touched; r4/r5 (and lr) are saved/restored
  only to satisfy the wrapper frame. Whatever registers/flags chatbox_runScript leaves behind are what callers observe
  (the contract''s r2/r4-r7 "outputs" are just chatbox_runScript''s side effects passed through, with r4-r7 preserved
  by it as well).

  '
