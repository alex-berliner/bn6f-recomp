open_questions:
- 'The exact meaning of `r5` here: it''s loaded as `[r5+0x48]` for the navi handle, suggesting `r5` is
  itself the player/navi BattleObject (offset 0x48 = RelatedObject1Ptr). The captured r0=0x0801c841 plus
  the layout match the contract, but no callers were provided so I can''t confirm by name.'
- Which two custom-byte offsets (e.g. 0x24/0x26 in the ExtraVars) constitute "displayed HP" vs "live HP"
  — the code clearly tweens one toward the other but the inline names are not in the BattleObject struct.
