name: warp_getCurrentWarpEntry_8005f32
address: '0x08005F32'
kind: function
status: confirmed
summary: Reads the current warp transition state, returning the warp data table pointer, the previous warp index
  (index-1), and the map group transition type.
interface: u32 warp_getCurrentWarpEntry(toolkit* r10, void** outWarpDataPtr /* r0 */, u8* outWarpIndex /* r1 */,
  u8* outTransitionType /* r2 */) — callers get r0/r1/r2 back; flags clobbered, r3 scratch.
details: "Loads the warp state struct pointer from the toolkit (r10 + oToolkit_Warp2011bb0_Ptr, struct at 0x2011bb0),\n\
  then pulls three fields out of it:\n  - oWarp2011bb0_WarpDataPtr -> r0: pointer to the warp data table for the\
  \ map being transitioned out of,\n  - oWarp2011bb0_WarpIndex - 1 -> r1: the warp entry actually being used during\
  \ the transition (index is\n    stored as next-free slot, so -1 yields the in-progress warp),\n  - oWarp2011bb0_MapGroupTransitionType\
  \ -> r2: the kind of map group transition in progress.\nPure getter with no side effects; the subtraction is done\
  \ inline so callers can index the warp table with r1 directly.\nRegisters r0-r2 act as a multi-value return; no\
  \ memory writes.\n"
