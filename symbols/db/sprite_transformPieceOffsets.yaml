name: sprite_transformPieceOffsets
address: '0x03006594'
kind: function
status: probable
summary: Computes the OAM draw offsets for one sprite piece, applying optional flip-sign plus per-size
  anchoring (0x100 path) or an affine rotation/scaling using word_200A6F0 (0x300 path), returning (r0=x,
  r1=y) and updating r6 with the affine index (or 0x02000000 when r7==1).
interface: (r2 = piece struct ptr, r5 = object struct ptr, r6 = piece flags, r7 = flip/variant flag) ->
  r0, r1 = transformed piece offsets; r6/r7 preserved (r6 gets 0x02000000 set and rotation index+0x10
  when r7==1).
details: 'Early-returns the plain path when r6 has no 0x300 bits: it reads signed offsets at r2+1/r2+2
  and, if object flag r5+0x13 has bit 0x10/0x20, negates each and adds a per-size anchor correction from
  byte_300670C/byte_3006718 (indexed by size bits of r2+4 times 4 plus low bits of r2+3; values -4/-8/-16/-32
  per column). With bit 0x300 set, it instead applies an affine transform: r5+0x13 & 0x3E >> 1 selects
  a 12-byte entry in the IWRAM table word_200A6F0 whose +8 byte (angle, &0xFF<<1) indexes math_sinTable/math_cosTable,
  and +9/+0xA are x/y scale multipliers; the piece offsets are recentered via byte_30066F4/byte_3006700,
  rotated (x'' = dx*scale*cos + dy*scale*sin, y'' = dx*scale*(-cos) + dy*scale*sin, each >>12), and re-anchored.
  If r7==1 the rotation slot index is bumped by 0x10 (mirrored set) and flag 0x02000000 is ORed into r6.
  Both results are pushed and popped into r0/r1 (r1 from the r2+1 axis, r0 from the r2+2 axis). Called
  only by sprite_queueFramePieces, consistent with preparing each animation-frame piece''s OAM position.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'caller sprite_queueFramePieces ''Queue the visible pieces of a sprite''s current animation
    frame as OAM entries'' shows this supplies per-piece offsets; negation of ldrsb [r2,#1]/[r2,#2] under
    r5+0x13 bits 0x10/0x20 is horizontal/vertical flip handling; sin/cos table multiplies and asr #3...
    asr #0xc rounding implement a fixed-point affine rotation; word_200A6F0 entry +8 angle, +9/+0xA scale
    multipliers show a per-object rotation/scale state table; anchor tables byte_30066F4..byte_3006718
    hold -4/-8/-16/-32 values indexed by piece size, recentering pieces around a pivot'
