  - bn6f/asm/asm38.s:1490
  - 0x03006440 sprite_queueFramePieces
  reproduce: python3 tools/asmcat.py 0x03006594
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the summary: r6 & 0x300 branch reads offsets, optionally negates per r5+0x13 bits
    0x10/0x20, adds per-size/per-sub anchors from byte_300670C/byte_3006718, while the affine branch uses
    r5+0x13 & 0x3E >>1 indexing word_200A6F0, recenters via byte_30066F4/byte_3006700, applies cos/sin
    scaling with shift >>12, and re-anchors. The flip path correctly ORs 0x02000000 and bumps the rotation
    slot by 0x10 when r7==1. However the name ''sprite_transformPieceOffsets'' is fine but the summary''s
    axis assignment is inverted: r0 comes from r2+1 (x) and r1 from r2+2 (y), matching OAM convention,
    not ''r1 from r2+1, r0 from r2+2'' as written.; run wf investigate investigate-20261018-212108; proposed
