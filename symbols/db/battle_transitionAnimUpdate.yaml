name: battle_transitionAnimUpdate
address: '0x0812514C'
kind: function
status: probable
summary: 'Per-frame update of the battle transition/intro animation: blits the progressive graphic, queues
  its OAM sprite, pumps the transition, and once the screen fade finishes advances the state to 8.'
interface: () -> r0 = result of last callee (unused); writes state byte [r5+1] = 8 when no screen fade
  is active; uses global r5 context struct
details: This is a state-handler tick for the battle transition scene, operating on the context in r5.
  Each frame it advances the two-part tile reveal animation (sub_812674C), queues the corresponding OAM
  entry (sprite_queueBattleOamEntry), runs the one-shot transition pump (battle_runTransition_8125444),
  and performs two unknown update steps (sub_8125F5C, sub_812653C). It then polls IsScreenFadeActive;
  while a fade is running the state byte stays untouched, and on the first frame with no fade active it
  stores 8 into [r5+1], ending this state (the trailing padding suggests it's a dispatch-table handler).
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl sub_812674C + bl sprite_queueBattleOamEntry: drives the progressive tile-blit animation
    and its OAM sprite each frame; bl battle_runTransition_8125444: callee summary says it ticks chip/eStruct/entities
    and reloads tilemaps during battle transition; bl IsScreenFadeActive / beq locret: state byte [r5+1]
    is only set to 8 once the screen fade has finished; strb r0,[r5,#1] with r0=8: writes a new state
    id into the scene struct''s state field, typical of a state-machine handler'
