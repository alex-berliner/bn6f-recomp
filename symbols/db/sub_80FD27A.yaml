name: sub_80FD27A
address: '0x080FD27A'
kind: function
status: confirmed
summary: Returns the address of a battle-object state table, optionally advanced by a 0x3C-byte header when flag
  bit '0xA000' is set on the object.
interface: 'u32 battle_getStatePtr_80FD27A(void); // inputs: r5, lr; outputs: r0; clobbers flags(nzcv), r1, r2,
  lr; preserves r4'
details: 'Loads a small descriptor (dword_80FD298 = 0xC12183C) and calls sub_800FE28 to dereference/obtain a pointer
  (a table-of-pointers indirection; the value 0xC12183C looks like 3 packed 10-bit offsets). The pointer is held
  in r4.

  Then it calls object_getFlag (no args, returns packed object flags in r0) and tests bitmask 0xA000 (= 0x8000 |
  0x2000). If any of those bits is set, 0x3C is added to the pointer, treating the object record as having a 0x3C-byte
  header before the desired state sub-record.

  dword_80FD4C4 is the literal mask 0xA000; sub_800FE28 is the table decoder. The constant dword_80FD298 = 0xC12183C
  packs three 10-bit offsets (0x0C1, 0x218, 0x3C0 with the high nibble unused), presumably group/anim/bank indices
  into sub_800FE28''s pointer table.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
