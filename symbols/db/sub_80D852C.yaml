name: sub_80D852C
address: '0x080D852C'
kind: function
status: confirmed
summary: Activates a battle-object that was placed by a custom "open" effect, transitioning it from waiting into
  acting on its own (action 8, phase 0), when the battle allows objects to act.
interface: 'void sub_80D852C(void);  // r5 = battle object (in); r1 = 2 on activation path, 1 on stub path (out);
  flags: nz clobbered'
details: "Called when a battle-object placed by a custom \"open\" script should begin acting on\nits own. Checks\
  \ battle_getFlags bit 0 to see if the battle is in a \"doing things\" /\nobject-active phase.\n  - If clear: calls\
  \ nullsub_10 and returns with r1 = 1 (no state change).\n  - If set: mutates oObjectHeader_Flags on the object\
  \ pointed to by r5:\n      * clears bit 2 (the \"wait / dormant\" flag),\n      * sets bit 1 (the \"active / acting\"\
  \ flag),\n      then writes oBattleObject_CurAction = 8 and\n      oBattleObject_CurPhaseAndPhaseInitialized =\
  \ 0, restarting the object's\n      scripted action at action 8, phase 0 (phase-init bit cleared). Returns with\n\
  \      r1 = 2 to flag the activation path.\nThe \"curPhaseAndPhaseInitialized\" field is a u16, so the upper byte\
  \ (phase-init bit)\nis cleared as a side effect of the 16-bit store.\n\nRegister form, old prompt; queued for\
  \ retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
