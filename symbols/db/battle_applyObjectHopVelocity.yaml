name: battle_applyObjectHopVelocity
address: '0x080DAE70'
kind: function
status: probable
summary: Sets a battle object's Y velocity to +0xA0000 (or -0xA0000 if Param2==0) and its Timer to 6 frames,
  causing a timed hop along the Y axis.
interface: (r5 = battle object, r0 unused) -> writes oBattleObject_YVelocity (+/-0xA0000), oBattleObject_Timer
  = 6; r0 = timer count
details: Loads magnitude 0xA0000 (10.0 in 16.16 fixed point) and negates it if oBattleObject_Param2 is
  zero, storing the result in oBattleObject_YVelocity. Computes the duration 0x18*4 <<16 / 0xA0000 = 6
  frames using SWI 6 (Div) and stores it in oBattleObject_Timer (16-bit). The caller sets oBattleObject_CurPhase
  to 4 before calling, then applies YVelocity to oBattleObject_Y each frame while the timer runs, and
  plays sound 0xC6 at launch if oBattleObject_Param3 is zero.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'sub_80DAE70+0xE: str r0,[r5,#oBattleObject_YVelocity] with +/-0xA0000 chosen by tst on oBattleObject_Param2;
    sub_80DAE70+0x12-0x1A: SWI 6 Div of (0x18<<16)*4 by 0xA0000 = 6 stored to oBattleObject_Timer; caller
    0x080DADEC: sets oBattleObject_CurPhase=4 then calls this, later adds oBattleObject_YVelocity to oBattleObject_Y
    each frame; caller 0x080DADF2: after the call, checks oBattleObject_Param3 and plays sound 0xC6 on
    the launch frame'
  refs:
  - bn6f/asm/asm31.s:76958
  - 0x080DADE0 sub_80DADE0
  reproduce: python3 tools/asmcat.py 0x080DAE70
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches: magnitude 0xA0000 negated if Param2==0, stored in YVelocity; duration 0x180000/0xA0000=6
    stored in Timer. Caller sets CurPhase=4, applies YVelocity to Y each frame, plays sound 0xC6 (0xC7+0xFF=0xC6)
    if Param3==0. However ''battle_startObjectKnockback'' is misleading since this only sets a single
    Y velocity (a hop/launch), not a knockback state, and the function name ''startObject'' prefix doesn''t
    match. A name like ''battle_applyObjectHopVelocity'' better reflects setting one Y velocity for a
    timed hop.; run wf investigate investigate-20261019-055111; proposed by Hyper glm-5.3-flash, revised
    by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
