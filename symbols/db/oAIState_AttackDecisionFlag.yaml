summary: One-shot / toggle flag guarding an AI sub-decision (set to 4 to mark dispatch consumed in sub_8101E24-family;
  XOR-toggled 0↔1 in attack-stagger logic; flags attack-roll init in Mettaur decide-attack).
details: The dominant pattern across 12 of 16 accesses is a "if zero, write 4 and dispatch" one-shot latch
  (sub_8101E24/E4A/E70/E96/EBC/EE2), which is inconsistent with a counter or timer — nothing decrements
  or tests against a threshold. The Mettaur decide-attack site (sub_810A0EE) sets it to 1 (not 4) and
  checks ==0, suggesting "have we rolled yet?". The XOR-1 toggle at sub_8107DE flips it between attack
  phases. The mixing of constants 1, 4, and XOR-1 prevents a clean single-word name; the safest label
  captures the common "guarding whether an AI decision has been made/queued" semantic.
