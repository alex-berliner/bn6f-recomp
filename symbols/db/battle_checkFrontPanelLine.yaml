name: battle_checkFrontPanelLine
address: '0x080BA294'
kind: function
status: probable
summary: Scans up to 5 columns ahead of an object for a panel passing an alliance-specific flag, then
  verifies the panel directly behind it matches a fixed must-set/must-clear mask and returns 1/0.
interface: (r0/r1 = battle object in r5 via caller convention; uses object at r5) -> r0 = 1 if a matching
  panel configuration was found ahead, else 0; flags clobbered
details: For distances r4 = 1..5 it computes panelX + getFrontDirection()*r4 and, if that (col,row=?)
  panel is valid (object_isValidPanel), calls object_getPanelsInColumnFiltered with a filter mask picked
  from off_80BA308 by the object's alliance (0x4000000 for alliance 0, 0x8000000 for alliance 1), collecting
  matching panel IDs into a stack buffer. On the first non-empty column it decodes buffer[0]'s encoded
  ID (row = id>>4, col = id&7), shifts the column by -getFrontDirection(), and calls object_checkPanelParameters
  with masks 0x10 (must be set) and 0xF880080 (must be clear) from dword_80BA314, returning that result
  directly. If no column yields a match it returns 0. A trailing comparison of the decoded coordinates
  against the object's own PanelX/PanelY (oBattleObject_PanelX/Y) can only reach return paths that yield
  0, so it is effectively dead. The per-alliance masks likely distinguish a state that differs between
  player and enemy side (e.g. an occupied/owned panel bit).
