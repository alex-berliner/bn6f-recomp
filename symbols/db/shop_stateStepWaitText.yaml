name: shop_stateStepWaitText
address: '0x08047050'
kind: function
status: probable
summary: 'Per-frame step for a shop-scene state: runs the buy-menu frame update and, once the chatbox
  finishes its text (flag 8), stores 12 into the state byte to advance to the next state.'
interface: (r5 = state struct with state byte at offset 0) -> r0 = 0; flags from chatbox flag test used
  internally
details: Calls the shop buy menu's per-frame update (redraws item list, cursor, etc.), then tests bit
  8 of the chatbox/event flag word eFlags2009F38 — the usual 'chatbox text finished/advanced' bit. If
  that bit is clear, nothing else happens; if set, it writes 0xC (the next scene/task state id) to the
  byte at [r5], which the surrounding task dispatcher reads to switch states. It always returns 0 in r0,
  the typical 'keep running' result of a state-step handler. r5 is set by the caller as the task/scene
  state pointer; only offset 0 is touched here. The 0xC target state is presumably another shop phase
  handled by a sibling step function.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl shopBuyMenu_updateFrame_8047134 first — this is the buy-menu screen's frame handler; chatbox_mask_eFlags2009F38
    with r0=8 tests the chatbox text-done bit, standard pattern for gating on dialog close; strb r0,#0xc,[r5]
    writes a small state id to the caller-provided struct byte, a state-machine transition; mov r0,#0
    before pop {pc} — returns 0 like other per-frame task step functions
