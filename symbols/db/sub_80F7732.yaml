name: sub_80F7732
address: '0x080F7732'
kind: function
status: hypothesis
summary: Zero-argument thunk that invokes sub_800FE28 with a fixed 4-byte parameter block (0x1212181E) and the caller's
  r5, returning the callee's r0.
interface: u32 sub_80F7732(u32 r5 /* passed through to sub_800FE28 */)
details: 'Tail-less wrapper: pushes lr, loads r0 with the address of the constant dword_80F7740

  (bytes 1E 18 12 12, likely small packed config values consumed by sub_800FE28), calls

  sub_800FE28, then returns directly with pop {pc}. The caller''s r5 is forwarded untouched

  as the callee''s second argument, so r5 is part of the effective interface even though this

  wrapper itself never reads it. The wrapper''s own r0 output is simply whatever sub_800FE28

  returns; its r2 output is discarded by this wrapper (though the wrapper-level contract lists

  only r0 as an output). No other state is touched here; all actual behavior lives in

  sub_800FE28, which is not yet typed, so the game-level purpose (possibly a palette/color or

  effect setup given the small constant values) is unknown.

  '
