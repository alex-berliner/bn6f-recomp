name: battleObject_initBeastSp_80E39D0
address: '0x080E39D0'
kind: function
status: confirmed
summary: 'One-shot setup of a Beast Link SP battle object: positions it on its panel, loads its sprite/animation,
  applies visibility and flip, then tails into the per-frame action handler.'
interface: void battleObject_initBeastSp(BattleObject* r5); /* outputs r5,r8,r9,r10,r11,r12 via tail call */
details: Places the object via object_setCoordinatesFromPanels, zeroes Z16 then shifts Z16 and Y16 by +2 px (a slight
  stand-up offset). Loads 0x80 tile words into sprite slots 0x10/0x20 with sprite_load, pulls animation data, and
  suppresses the shadow. Sets bit 1 (draw/visible) in oObjectHeader_Flags. Looks up an animation byte from the one-entry
  table at word_80E3A30 (value 0x201 stored as a u16, so the first byte is 0x01) indexed by Param1, writing it into
  CurAnim and CurAnimCopy. Applies the animation with sprite_setAnimation, reloads its data, sets palette 0, and
  mirrors the object's horizontal flip onto the sprite via object_getFlip / sprite_setFlip. Writes CUR_STATE_UPDATE
  into CurStateActionPhaseAndPhaseInitialized, then tail-calls battleObject_runBeastSpActionHandler_80E3A32 which
  populates the state registers r5,r8-r12 that the caller reads back. The animation table is a single entry (0x201
  u16); only Param1==0 is meaningful here, suggesting this init path is selected by a dispatcher for a specific
  Beast form.
