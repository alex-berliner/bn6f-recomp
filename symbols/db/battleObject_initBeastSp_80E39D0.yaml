open_questions:
- What Net Beast does Param1==0 select, and are there other init variants for other BeastSoul forms?
- Why is Z16 explicitly zeroed then immediately +2 (two stores where one would suffice); is the zero store a vestige
  of a shared template?
- Does sprite_load with (0x80,0x10,0x20) allocate a fixed tile count, or is 0x80 a pointer/offset into a VRAM region?
- The u16 0x201 table entry yields animation 0x01 on little-endian byte read; confirm this maps to the Beast's standing
  frame in the animation resource.
