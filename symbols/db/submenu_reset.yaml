name: submenu_reset
address: '0x081180E0'
kind: function
status: probable
summary: 'Resets the submenu state: clears two state bytes and runs three cleanup routines before zeroing
  sSubmenu+0xC.'
interface: () -> void; no return value, r5 must hold the submenu object pointer
details: The function zeroes byte r5+0xA, then sequentially calls sub_8118104, sub_8118134 and sub_81181DC,
  which likely release or clear per-field submenu state (lists, cursor, selection). Finally it loads the
  pointer to sSubmenu and writes 0 to its +0xC byte, a state/active flag. It takes no arguments in registers,
  relying on r5 being set up by the caller, and is probably called when leaving or reinitializing the
  submenu.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: strb r0,[r5,#0xa] with r0=0 clears a flag in the r5 object before the three calls; three consecutive
    bl calls (8118104, 8118134, 81181DC) look like per-component cleanup/reset routines; ldr r0,=sSubmenu
    then strb 0,[r0,#0xC] zeroes the menu's own state byte last; the sSubmenu reference places it in the
    submenu subsystem
