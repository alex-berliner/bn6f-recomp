name: chatbox_completeCutsceneStep
address: '0x08127B94'
kind: function
status: probable
summary: 'When a cutscene/chatbox flag is active, completes the current story event: clears its ''in-progress''
  flag, sets its ''done'' flag, reloads the background, and advances the scene to its next script step.'
interface: (r5 = cutscene/scene struct (fields +0x02, +0x20, +0x24 read); global table dword_2027590)
  -> r0 = clobbered; sets struct byte [r5+2] = 4
details: First masks bit 0x8 of eFlags2009F38; if clear the whole body is skipped, so this only runs inside
  an active chatbox/cutscene context. It indexes the 0x20-byte-entry table at dword_2027590 with (halfword[r5+0x20]
  + halfword[r5+0x24]) * 0x20, takes the upper 16 bits of entry+0x18 as a flag id, then calls ClearEventFlag(0x1D20
  + id) and SetEventFlag(0x1DA0 + id) — i.e. moving a story flag from one 128-flag block to the corresponding
  'done' block. It then calls sub_8128008, reloads the background region via bg_ReloadBackgroundRegion_5_3_81281C0,
  stores 4 into byte [r5+2] (apparently the scene's state/step counter), and runs chatbox_runVariantScript_8127ED4
  with r0=1.
