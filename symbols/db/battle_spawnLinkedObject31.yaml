name: battle_spawnLinkedObject31
address: '0x080E3FB4'
kind: function
status: probable
summary: Spawns a battle object (type-4, id 0x31) as a child of the calling battle object and back-links
  it via RelatedObject1Ptr.
interface: (r5 = parent battle object; other args forwarded to object_spawnType4) -> returns new object
  in r0; new object's RelatedObject1Ptr = parent r5
details: Saves the incoming r5 (the 'self' battle object, passed in r5 rather than the usual ABI) into
  r6, then calls object_spawnType4 with r0 = 0x31. The spawn wrapper returns the newly created battle
  object in r5 (r5 is only restored by the pop, so the callee's r5 is used). The function then stores
  the saved parent pointer (r6) into the new object's oBattleObject_RelatedObject1Ptr field, making the
  spawned object point back at its owner. This is the standard pattern for attached child objects (auras,
  effects, held entities) in battle. The literal 0x31 selects which kind of child object is created; what
  entity that id corresponds to is not shown here.
