summary: Sets a nonzero object's internal timer byte and marks its adjacent timer value as 0xFF.
interface: (r0 = object pointer or 0, r1 = timer value) -> r0 = unchanged; flags preserved
details: When r0 is non-null, the function writes the supplied byte to object offset 0x10 and writes 0xFF
  to offset 0x11; a null pointer is safely ignored. Its sole caller conditionally invokes it on the AI
  attack structure and then returns. The exact object field names and the reason for writing 0xFF are
  not established by the available code.
