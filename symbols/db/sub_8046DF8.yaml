summary: Runs two update passes in sequence (sub_8047950 then sub_8047134) and always returns 0.
interface: void sub_8046DF8(void) /* no inputs; returns r0 = 0 with N/Z set from it */
details: Tiny wrapper that tail-chains two calls — first sub_8047950, then sub_8047134 — with no arguments of its
  own and no use of callee results, then loads r0 = 0 and returns. Since it only forwards control to the two workers
  and forces a zero result, its game meaning is entirely determined by those callees; nothing is read or written
  here directly. Could plausibly be a per-frame update/draw pair for some subsystem, but the callees are unnamed
  so the subsystem prefix cannot be chosen with confidence.
