name: readU32Unaligned
address: '0x080A7B7A'
kind: function
status: probable
summary: Reads a 32-bit little-endian value from a possibly unaligned address, byte by byte, returning
  it in r1.
interface: (r0 = source address, need not be word-aligned) -> r1 = 32-bit value assembled from bytes [r0..r0+3];
  r0 preserved; flags not meaningful
details: Loads each of the four bytes at r0 separately with ldrb, shifts bytes 1-3 left by 8/16/24, ORs
  them together into r1, and returns via mov pc, lr. This is the canonical Thumb-safe unaligned word read,
  since Thumb has no unaligned ldr. The result lands in r1, not r0, so callers use it as a second argument
  or move it themselves. No memory is written and no other registers are touched. Its single known caller
  is undocumented, so which game structure it is reading for is unknown.
