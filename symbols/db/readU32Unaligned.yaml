  date: '2026-10-18'
  detail: 'asm: ldrb r1,[r0]; ldrb r2,[r0,#1]; lsl r2,#8; orr — bytes 0-3 shifted and ORed into r1; asm:
    mov pc, lr returns with no write or call, a pure read helper; caller list shows only sub_80A7AE0,
    itself unrenamed, so no subsystem context'
