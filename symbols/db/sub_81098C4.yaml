name: sub_81098C4
address: '0x081098C4'
kind: function
status: confirmed
summary: Sets a battle object's X/Y velocity to slide it onto the AI's current target panel and computes the frame
  count until it arrives.
interface: 'void sub_81098C4(struct BattleObject *obj /* r5 */, struct AIAttackVars *ai /* r7 */);

  '
details: "Compares the object's current panel coords (oBattleObject_PanelX / oBattleObject_PanelY) against the AI's\
  \ target panel (oAIAttackVars_Unk_16 / oAIAttackVars_Unk_17). It prefers the Y axis; only if the Y delta is zero\
  \ does it fall through to the X axis. The selected delta is multiplied by the AI's per-attack speed scalar (oAIAttackVars_Unk_30)\
  \ and written into the matching velocity slot, while the other axis's velocity is zeroed. If both deltas are zero\
  \ the function short-circuits, zeroes both velocities, and forces oAIAttackVars_Unk_10 and oAIAttackVars_Unk_12\
  \ to 1 (signalling \"already on target / fired on land\").\n\nFor the active-axis cases it loads a fixed-point\
  \ duration (0x18<<16 for Y, 0x28<<16 for X), BIOS-divides it by the speed scalar (swi 6: r0/r1 -> r0 quotient,\
  \ r1 remainder), and writes:\n  * oAIAttackVars_Unk_10 = quotient   (total frames the slide lasts)\n  * oAIAttackVars_Unk_12\
  \ = quotient>>1 (half-way / \"about to land\" frame for the caller to fire the hit).\n\nQuirks: the multiply is\
  \ done as 32x32 -> 32 with MUL; BEQ tests the product to choose the axis. Z is set from MUL and reused. Duration\
  \ chosen differs per axis (Y uses 0x18, X uses 0x28) so X-axis drives have more headroom; r1 remainder from the\
  \ divide is also dropped, only the whole-frame count is stored.\n\nRegister form, old prompt; queued for retype\
  \ (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
