name: object_tick8SetState
address: '0x080A9E48'
kind: function
status: probable
summary: 'Object step: increments a u16 at +0x24; when it reaches 8, wraps it to 0 and stores 0xC into
  the u8 at +9.'
interface: (r5 = object struct) -> r0 clobbered; [r5+0x24] (u16) incremented, wraps 0..7; [r5+9] (u8)
  = 0xC on wrap
details: Takes the object in r5 (not r0), so it is likely dispatched from an object update switch rather
  than called with arguments. Each call increments the halfword counter at +0x24; once the post-increment
  value reaches 8 it writes 0 back and stores 12 into the byte at +9, which is most plausibly a state/action/animation
  selector for the object. No other fields are touched and there are no calls or branches besides the
  early return, so the whole effect is this counter-plus-state transition. The 8-frame period (~8/60 s)
  suggests a short timed step, e.g. a pause or flash before changing behavior.
