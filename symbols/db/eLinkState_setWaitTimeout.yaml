name: eLinkState_setWaitTimeout
address: '0x0803E850'
kind: function
status: probable
summary: Raises the link-state timeout counter (eLinkState+0x54) to at least max(obj+0xE, obj+0xF)+8 and
  switches the link state byte to 0xC, unless both bytes are <=5.
interface: (r5 = struct with progress bytes at +0xE/+0xF) -> r0 = new counter value; writes eLinkState+0x54
  (word) and eLinkState+0x00 (byte = 0xC)
details: Reads two bytes from the struct pointed to by r5 (offsets 0xE and 0xF). If both are <=5 the function
  returns without touching anything; otherwise it computes max(byteE, byteF)+8, compares it against the
  current value of eLinkState's dword at +0x54 (word_2009A24), and stores the larger of the two. It then
  writes 0xC into eLinkState's state byte at +0x00. The 'keep the larger' clamp means the counter only
  ever grows, never shrinks, when called repeatedly. The caller only invokes it after masking a byte from
  the same struct with 0xFC and matching 0xFC (i.e. byte0 in 0xFC-0xFF), passing structs held in eCamera
  slots unk_88/unk_8C.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r1,[r5,#0xE] / ldrb r2,[r5,#0xF] with 'both <= 5 -> return' guard at 803E85A; add r0,#8;
    ldr r1,[r7,#0x54]; cmp; movlo keeps larger; str r0,[r7,#0x54] raises the counter monotonically; mov
    r0,#0xC; strb r0,[r7] sets eLinkState state byte to 0xC; r7 = off_803E87C = eLinkState, so the touched
