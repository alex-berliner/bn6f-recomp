name: render_flushDisplayRegisters_800172C
address: '0x0800172C'
kind: function
status: confirmed
summary: Flushes cached display-register state (DISPCNT, BG0CTL, MOSAIC, WIN0X, BLDCNT/BLDCOL) from the
  toolkit's RenderInfo tables into GBA hardware I/O.
interface: render_800172C(/* Toolkit * */ r10, /* preserved */ r3, r4, r5, r6, r7) -> /* sets ADDS from
  ri+4 */ v, nz, c; clobbers r0, r1, r2, lr; preserves r3-r7.
details: "Retrieves the RenderInfo pointer from toolkit field oToolkit_RenderInfoPtr.\nThen, in order:\n\
  \  1. Writes the mosaic size halfword (RenderInfo+0x02) into the MOSAIC register.\n  2. Copies 0x38\
  \ bytes of BG0/layer-control data from RenderInfo+4 into the BG0Control hardware region via CopyWords.\n\
  \  3. Copies 12 halfwords of window0 horizontal dimensions from the toolkit's 0x200f3a0 table into WIN0X\
  \ hardware via CopyHalfwords.\n  4. Loads a color-effects pointer from toolkit field oToolkit_Unk2009740_Ptr;\
  \ writes its word into BLDCNT (ColorSpecialEffectsSelection) and its +4 halfword into the fade coefficient\
  \ (BLDCOL equivalent, offset 0x4000050).\n  5. Re-reads RenderInfo, writes its low halfword (DISPCNT)\
  \ into the LCDControl hardware register.\nThe final value in r3 (RenderInfo pointer) is left as an output;\
  \ the caller's ADDS-on-4 pattern is reconstructed by the return.\nNo parameters are read from r3-r7\
  \ on entry; they are simply pushed/popped to keep them preserved.\n"
