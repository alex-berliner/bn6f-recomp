name: oAIAttackVars_TargetPanelX
address: '0x16'
kind: struct-field
status: probable
summary: X coordinate (panel column) of the AI attack's currently-targeted/selected destination panel.
details: Across 187 accesses the byte is consistently read/written as the X component of a (target X,
  target Y) pair alongside oAIAttackVars_Unk_17 (TargetPanelY). It is the panel returned by navigation/picker
  helpers, validated via object_isValidPanel / object_checkPanelParameters, reserved with object_reservePanel,
  and ultimately committed to oBattleObject_PanelX (and oBattleObject_FuturePanelX) when the AI's attack
  step completes.
evidence:
- method: assembly-reading
  date: '2026-10-15'
  detail: After the per-step picker runs, the chosen X is stored here; companion strb to Unk_17 stores
    the Y, and both are later written to oBattleObject_FuturePanelX/Y.
  refs:
  - bn6f/asm/asm31.s:109380
  reproduce: grep -n 'oAIAttackVars_Unk_16' bn6f/asm/asm31.s | head
  result: '"strb r0, [r7,#oAIAttackVars_Unk_16]"'
- method: assembly-reading
  date: '2026-10-15'
  detail: In the panel-step routine, Unk_16 and Unk_17 are loaded, passed to the next-step caller's picker,
    then re-stored as the newly targeted panel coordinates.
  refs:
