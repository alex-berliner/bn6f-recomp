details: "Located by address 0x08002468. Operates on the global struct anchored at eStruct200a6a0 (0x200A6A0 in\
  \ IWRAM).\nLayout touched:\n  [+0x0]  byte    active flag (set to 1)\n  [+0x4]  dword   caller param1 (r0)  ->\
  \ dword_200A6A4\n  [+0x8]  dword   caller param2 (r1)  -> dword_200A6A8\n  [+0xC]  dword   caller param3 (r2)\
  \  -> dword_200A6AC\nThe function first pushes {r0-r2} to spill the inputs across the ZeroFillByWord call (which\
  \ is documented to clobber low registers and flags), then pops them back to write into the struct. ZeroFillByWord\
  \ is given size 0x50 = 80 bytes, implying the struct is 80 bytes total. Byte at offset +0 (set to 1) is treated\
  \ as an \"in use / initialized\" flag.\nQuirks:\n  - Despite the push {r0-r2} / pop {r0-r2} dance, the final pop\
  \ reuses the same stack slots only to access the saved values; nothing is left on the stack at return.\n  - The\
  \ function ends with `mov r0, #1` even though r0 is in the caller-clobber set per the contract, suggesting callers\
  \ may read a non-zero status from r0.\n  - Saves lr; clobbers NZ/CV (from ZeroFillByWord). r1..r7 and lr are restored\
  \ from the push {r4-r7, lr}; this is why the struct stores are deferred until after the ZeroFill call.\n\nRegister\
  \ form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
