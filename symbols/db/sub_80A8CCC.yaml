summary: 'Cybercrow map object wobble: when the record''s countdown at +0x02 expires, one GetRNG % 0x60 << 8 and
  one GetRNG & 7 (sign: < 4 negates) pick a heading change added to the record''s +0x04; then sub_8143220.'
details: 'Body (asm29.s:7234-7261): only when the record byte [r7] == 2; the halfword countdown [r7+2] counts down
  and on 0 two GetRNG calls fire: r6 = (r % 0x60) << 8 (svc 6), r0 = r & 7 — if that is >= 4 the value stays positive,
  otherwise it is negated — and r6 is added to the heading halfword [r7+4]. Then sub_8143220([r5+4]) runs. So the
  wobble''s magnitude comes from GetRNG % 0x60 and its sign from GetRNG & 7, matching the vidsync note "2 calls
  + 1 via sub_8143220, heading ±(r % 0x60) << 8".'
