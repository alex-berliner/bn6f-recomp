open_questions:
- What *exactly* the small state pointed to by r5 represents (sub-state, next state, counter). Only the
  byte at +5 is named (sub-flag) and the word at +0 is the next state constant.
- Why exactly phases 1 and 2 both increment separate BattleState bytes and why 1 also sets the CustGauge
  to 0x4000.
- Role of sub_801E15C and sub_800A21C.
- The trailing `byte_8008A74` looks like junk/data for the next function rather than a table used here.
