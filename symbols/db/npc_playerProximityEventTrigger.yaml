name: npc_playerProximityEventTrigger
address: '0x080A860C'
kind: function
status: probable
summary: 'NPC-side trigger: once story flag 1717 is set, sets event flag 9D9 and switches the object''s
  state when the player walks within 8 units of it.'
interface: (r5 = object, fields +0xc/+0x10 = its X/Y) -> void; sets EVENT_9D9 and rewrites object state
  bytes on trigger
details: Early-outs unless EVENT_1717_PLAYER_ADVANCE_FORWARD is set, so this only arms after that story
  point. It then loads the object's own X/Y from [r5,#0xc]/[r5,#0x10] and calls overworldObject_withinBoxCheck_signed_80011D6
  against the player's position with half-extent r4 = 0x80000 (8 << 16, fixed-point), i.e. an 8-tile-radius
  proximity test. On a hit it sets EVENT_9D9 via SetEventFlagFromImmediate, stores 8 into byte [r5,#8]
  and 0x50 into byte [r5,#7] — likely the object's AI/script state and a display or mode byte. r5 is the
  overworld object itself; r0/r1 from ReadOWPlayerObjectCoords are the player's coords, moved to r2/r3
  as the box center arguments. Re-runs harmlessly while the player stands nearby since the flag set is
  idempotent.
