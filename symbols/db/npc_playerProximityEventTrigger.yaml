name: npc_playerProximityEventTrigger
address: '0x080A860C'
kind: function
status: confirmed
summary: Overworld NPC proximity trigger - when the player walks into the NPC's event box (and the "player advanced
  forward" story flag is still clear), sets the NPC talk event flag and arms the NPC for its talk script.
interface: void npc_playerProximityEventTrigger(NpcObject* r5 /* npc object */, u32 r10 /* event-flag bank base
  */)
details: 'Runs each frame for some overworld NPC object (r5). First bails out if event flag

  EVENT_1717_PLAYER_ADVANCE_FORWARD (bank 0x17, index 0x17) is set - the trigger only

  fires while that story flag is still clear. Otherwise reads the player''s overworld

  coordinates (r0 = x, r1 = y, in subpixels) via ReadOWPlayerObjectCoords and calls

  overworldObject_withinBoxCheck_signed_80011D6 with the NPC''s fields at +0xC (x) and

  +0x10 (y) as the box center and a half-extent of 8<<16 subpixels (r4 = 0x00080000).

  If the check returns 1 (player inside the box): sets event flag EVENT_9D9 (bank 9,

  index 0xD9, likely "this talk event done/seen"), stores 8 into the NPC state byte at

  +8 (hands the object to the talk/event handler state) and 0x50 into the byte at +7

  (talk/event script id). The box-check callee clobbers r4, so it is saved and restored

  around the call. r10 is only consumed inside the flag-set/test wrappers. Note the

  trigger only arms the NPC once; afterwards the NPC state/script bytes keep it talking

  normally, and once EVENT_1717 is set the proximity check is skipped entirely.

  '
