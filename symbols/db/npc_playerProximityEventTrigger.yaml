- method: assembly-reading
  date: '2026-10-18'
  detail: 'bne after TestEventFlagFromImmediate(1717) gates everything on the ''player advance forward''
    story flag; ldr r0,[r5,#0xc]/[r5,#0x10] supplies the object''s own coords as the box center to withinBoxCheck
    with r4=8<<16; call to ReadOWPlayerObjectCoords provides the player position used as the comparison
    point; on hit: SetEventFlagFromImmediate(EVENT_9D9) then strb #8,[r5,#8] and strb #0x50,[r5,#7] mutate
    object state; sole caller sub_80A8424 passes this object in r5, consistent with a per-frame NPC update
