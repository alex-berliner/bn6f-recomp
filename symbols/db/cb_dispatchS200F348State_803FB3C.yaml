kind: function
status: confirmed
summary: 'Game-over state-machine callback: reads the state index from eS200F348 and dispatches to init
  (0), playGameOver (4), or update (8), then runs the common post-dispatch routine.'
interface: cb_dispatchS200F348State(void) -> void
details: "Invoked as a function-pointer callback (cb_ prefix).  Loads the global\nentity pointer eS200F348\
  \ into r5, reads the one-byte state index at\noffset oS200F348_Index_00, and jumps through a 3-entry\
  \ vector at\noff_803FB54:\n  index 0 -> sub_803FB64  (initialise the game-over state)\n  index 4 ->\
  \ playGameOver_803FB9C  (play the game-over sequence)\n  index 8 -> sub_803FBC2  (per-frame update)\n\
  After the handler returns, sub_803FC14 is called unconditionally as a\nshared post-dispatch step (likely\
  \ advances or resets the state).\nr4-r7 are push/popped so that the callee's register side-effects are\n\
  invisible to the caller's loop.\nThe struct S200F348 and its field oS200F348_Index_00 are the only\n\
  memory the dispatcher itself touches; all real work is in the handlers.\n"
