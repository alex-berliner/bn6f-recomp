name: sub_814E21C
address: '0x0814E21C'
kind: function
status: hypothesis
summary: After resolving a record via sub_814E0D0, stores the record's new state byte and flags the record as dirty/needs-refresh
  when the state changed.
interface: void sub_814E21C(void); // all actual inputs/outputs flow through the call to sub_814E0D0, which returns
  a record pointer in r1 and a state value in r3; returns r12=lr with flags left from CMP/ORR
details: 'Tail-style wrapper: saves lr into r12 (so the callee''s return path is skipped) and tail-ish calls sub_814E0D0,
  which fills r1 with a record pointer and r3 with the record''s state value. Reads the state byte at [r1+0x18];
  if it already equals r3 nothing more is done. Otherwise it writes r3 to [r1+0x18] and ORs 0xF into the low nibble
  of the byte at [r1], apparently a dirty/refresh marker on the record header. Returns via bx r12, so the caller''s
  lr is preserved while the flags seen by the caller are whatever CMP r0,r3 (no-change path) or the ORR/STR sequence
  (update path) left behind. The record layout (byte 0 = flags with low-nibble dirty bits, +0x18 = current state)
  is consistent with per-object/per-entity state records used elsewhere, but the actual record type and what sub_814E0D0
  selects are not yet identified.'
