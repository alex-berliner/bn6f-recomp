name: chatbox_emitTextGridOAM_804021C
address: '0x0804021C'
kind: function
status: confirmed
summary: Emits a 3-row by 6-column grid of OAM sprite entries for a chatbox text panel.
interface: void chatbox_804021C(struct ChatBoxProperties *r5); // preserves r4,r5,r6,r7,r8,r9,r10,r12; clobbers
  r0,r1,r2,r3,lr,flags
details: "Builds OAM attributes for the chatbox text tile grid using the per-chatbox text\ncoordinate (r5->oChatbox_TextScriptCharIdx)\
  \ and font shift (r5->oChatbox_Unk_19).\nUses three ROM tables:\n  - byte_8040314: per-row Y/affine attribute\
  \ words (0x40,0x80,… etc.)\n  - byte_8040324: per-cell character tile offsets (3 rows × 6 cols + padding)\n  -\
  \ dword_8040340: per-row pixel Y offsets for vertical centering\nEach of 18 cells is sent to sub_802FE28(attr01,\
  \ tile=0xE2B8+charOff, 0, 3),\nwhich is the OAM submit primitive. The constant base tile 0xE2B8 plus the\nchar_off\
  \ table builds the text glyph OBJ tile indices; COL_STRIDE of 0x20\nspaces columns apart in pixels. The \"r_off\
  \ + font_shift\" addition suggests\nthis is also where per-chatbox vertical baseline shifts are applied.\nOutput\
  \ r1 is the value of r12 restored from the stack epilogue — a quirk of\nthe routine not actually returning any\
  \ meaningful value (r2,r3 likewise are\njust whatever sub_802FE28 left behind).\n"
