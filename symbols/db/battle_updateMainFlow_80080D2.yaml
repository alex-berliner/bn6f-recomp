status: probable
summary: 'Per-frame tick of the battle main-flow state machine: refreshes both navis'' virtual joypads,
  unpauses the battle, ticks the phase state machine, and writes the next main-flow state id (0xC/0x10/0x18/0x1C/0x20)
  into the caller''s state word.'
details: 'battle_updateNaviAIJoypad_8012DFC(0) then (1), UnpauseBattle, battle_setFlags(1), battle_updatePhaseState_800AE0C,
  sub_800A6A6. When battle_IsBattleEnding_800A97A is nonzero, sub_800AB7C runs instead of the normal phase
  handling. Switch on battle_getPhaseMode_800A152: mode 1 -> if BattleState.Unk_3a nonzero, sub_800AAD6
  and return; else increment Unk_18 and store next state 0xC. Mode 2 -> increment Unk_19, store 0x10.
  Mode 7 -> store 0x18. Otherwise: battle_checkFlowAdvanceFlags_800A046; when != 0xFF store the byte at
  r5+5, PauseBattle, next state 0x1C, sub_801E15C. When 0xFF: if battle flag 0x40 is clear, continue only
  when battle_checkNaviFreeze_800A1D0 reports an active freeze; if set, sub_800A244 and for each set bit
  0/1 subtract 0x2900 from the halfword at +0x28 of record 0/1 of the 0x1D0-stride array at unk_2036120
  (getEntryPtr_2036120_1D0_802E070). Finally PauseBattle and store next state 0x20.

  '
