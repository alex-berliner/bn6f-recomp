summary: Menu input handler that attempts action 0x90 and branches to a confirm (0x34) or deny (0x38)
  sub-state with matching SFX.
interface: void handleMenuAction90_803AD80(uint32_t r2, struct* r4, struct* r5, void* r10, lr) -> void
  (r10 preserved); clobbers r0/r1/r2/r3/lr and nz/c/v
details: 'Calls sub_803C248 with command id 0x90 and tests its return for zero (BNE branches on failure).

  On success (zero flag set): plays SOUND_MENU_SELECT, fires menu command 0x17 via sub_803BB2C,

  then calls sub_803C0F6 with sub-menu coordinates (0x90, 0xD0, 0x20), and writes the next menu

  phase byte 0x34 at r5[1].

  On failure (non-zero): plays SOUND_CANT_JACK_IN, fires menu command 0x15 via sub_803BB2C,

  and writes 0x38 at r5[1].

  r5 is a menu-state struct whose byte 1 is the current phase index; r10 is preserved across the

  call (likely the active menu/battle context pointer the callers care about). The two

  sub_803BB2C invocations with 0x17/0x15 are paired menu "confirm"/"cancel" style hooks.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed;
  tools/abi/retype_queue.tsv).'
