name: battle_applyElementToPanelRegion
address: '0x080B9458'
kind: function
status: probable
summary: Fetches the list of panels in a rectangular region sized from a per-(effect,alliance) table and
  applies a per-panel effect using the battle object's element.
interface: (r0 = effect/shape index, r5 = battle object ptr) -> r0 = clobbered; writes panel list to stack
  buffer
details: The object pointer lives in r5 (oBattleObject). The effect index r0 is stored on stack and expanded
  to a word offset (r0<<3 + alliance<<2) into byte_80B94AC, a 4-word table of packed region parameters
  (0x04010000, 0x08010000, 0x00810000, 0x00810000), which is passed as r2 to object_getPanelRegion along
  with PanelX/PanelY, r3=0, r4=0x26 (max panel count) and r7=sp+4 as output buffer. object_getPanelRegion
  returns a count in r0; the function loops count-1..0 over the buffer entries, unpacking each byte as
  x = low 3 bits and y = high nibble, and calls sub_80D0F0C(x, y, r2=oBattleObject_Element, r4=effectIndex+1,
  r6=oBattleObject_DamageAndStaminaDamageCounterDisabler) for each panel, with r6 pushed/popped around
  the call so the loop counter survives. The Element and damage-counter fields passed to the per-panel
  callee strongly suggest a terrain/stage-modifying area effect, but sub_80D0F0C is unidentified so the
  exact panel mutation is unconfirmed.
