name: ai_spawnFirstAttackVariant
address: '0x08111BDE'
kind: function
status: confirmed
summary: Spawns up to a requested number of attack variants by iterating slots 0–4, clearing the secondary boost
  flag first.
interface: void ai_spawnFirstAttackVariant(u32 count /*r0*/, u32 r5, AIAttackVars *vars /*r7*/, u32 r10); /* r0
  clobbered; r5,r7,r10 passed through; r1,r2,r8-r12 leftover from last ai_attackSpawnVariant call; nzcv clobbered
  */
details: Saves the requested variant count into r4, zeroes vars->AttackBoost2 (oAIAttackVars_AttackBoost2 at [r7+offset]),
  then loops variant_idx 0..4 calling ai_attackSpawnVariant(variant_idx, r5, r7). A non-zero return means that slot
  produced a spawnable variant, so the remaining count (r4) is decremented; the loop exits early once count hits
  0 or all 5 slots are tried. All output registers (r1, r2, r5, r7, r8, r9, r10, r11, r12) are whatever the final
  ai_attackSpawnVariant wrapper left behind. r10 is listed as an input by the caller but is never referenced inside
  the function body—it is only forwarded to ai_attackSpawnVariant via register context. The function does not return
  a value in r0; the return is void.
