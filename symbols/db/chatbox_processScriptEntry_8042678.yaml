name: chatbox_processScriptEntry_8042678
address: '0x08042678'
kind: function
status: confirmed
summary: Processes one chatbox text-script entry - plays the text blip if the chatbox core is idle, then either
  starts the entry's script or skips past the 5-byte end-marker record.
interface: int chatbox_processScriptEntry(void* entry /*r4*/, u32 coreArg0..3 /*r0-r3 passed through*/); /* returns
  1 in r0; r4 is advanced by 5 when the entry's terminator (0xFF) is consumed; NZCV flags set from the final mov
  r0,#1 / add */
details: 'Entry point of one step of chatbox script execution. r4 points at the current chatbox entry record. It
  first calls the chatbox core helper sub_803F798 with the caller''s r0-r3 untouched; the returned value doubles
  as (a) a "chatbox busy" flag and (b) an offset into the entry. If the core reports 0 (nothing pending/idle), sound
  effect SOUND_UNK_74 (0x74, presumably the text blip) is played via PlaySoundEffect. The script-ID byte is then
  read at r4 + state + 2: any value except 0xFF is forwarded to chatbox_config_80408D0(notUsed = state+2, scriptID),
  which starts the corresponding text script; 0xFF marks the end of the entry, and the entry pointer in the caller''s
  r4 is advanced by 5 (the record size), since r4 was restored from the stack before the increment. Always returns
  1. Stack quirk: the function push/pop-shuffles lr, r4 and the core result so that the core''s return value survives
  the sound-effect call, and the final pop {pc} returns through the saved lr; the r4+5 in the 0xFF branch is a genuine
  side effect visible to the caller.

  '
