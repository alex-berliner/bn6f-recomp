name: ai_stepTimerCountdown
address: '0x08110B38'
kind: function
status: probable
summary: 'AI attack helper: counts down the step timer and, when it expires, switches the object to animation
  6 and resets attack state fields.'
interface: (r5 = battle object, r7 = oAIAttackVars struct) -> r0 = 0 on expiry / last timer value otherwise;
  flags from the bne test
details: 'Loads the halfword at oAIAttackVars_StepTimer from the r7 struct, decrements it, and stores
  it back; if the result is nonzero it returns immediately. When the timer reaches zero it sets the object''s
  oBattleObject_CurAnim byte (r5) to 6, writes 0x1c into the oAIAttackVars_HitElement halfword, and clears
  oAIAttackVars_AttackElement to 0. This looks like the tail of a multi-phase AI attack state machine:
  a fixed wait in one animation whose expiry arms the next phase (anim 6 plus the 0x1c/element reset).
  The values 6 and 0x1c are hard-coded, so the meaning depends on the anim table and HitElement semantics.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrh/sub/strh on [r7,#oAIAttackVars_StepTimer] with bne locret: per-frame countdown, early
    return while nonzero; strb #6,[r5,#oBattleObject_CurAnim] fires only when the timer hits zero; strh
    #0x1c,[r7,#oAIAttackVars_HitElement] and strb #0,[r7,#oAIAttackVars_AttackElement] reset attack state
    on the same tick; oAIAttackVars struct prefix plus r5 battle object indicates an AI attack handler
    context'
