name: camera_targetPlayer
address: '0x080301BC'
kind: function
status: probable
summary: Makes the overworld camera track the player object by storing a pointer into its position data
  and setting the camera's mode byte.
interface: () -> void; no return value, r0-r3 clobbered
details: Reads the camera struct from the toolkit (oToolkit_CameraPtr), sets its byte at +3 to 1 (likely
  a follow/target-mode flag), then loads the overworld player object pointer from the game state and stores
  playerObject+0x1C into camera field +0x14 — presumably the pointer to the position/coords the camera
  tracks. Takes no arguments and returns nothing. Caller sub_8089234 calls it and then doPETEffect_8033fc0(1),
  then returns 0, suggesting it is part of entering the overworld/PET flow where the camera snaps to the
  player.
