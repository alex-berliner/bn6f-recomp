name: bgmap_WriteTileIdAtBlock_800187C
address: '0x0800187C'
kind: function
status: confirmed
summary: Writes a single 16-bit BG tile id into the map's tile-id blocks at the given tile coordinates and 32x32
  block.
interface: void bgmap_WriteTileIdAtBlock(int x, int y, int blockIdx, u16 tileId)
details: 'Computes an offset into the toolkit''s BG tile-id block array

  (r10 -> oToolkit_iBGTileIdBlocks_Ptr): offset = x*2 + y*64 + block*2048.

  Each block is a 32x32 halfword tile-id map (one row = 32*2 = 64 bytes,

  a whole block = 2048 bytes), so this addresses one tile within one

  32x32 block of the BG map and stores the halfword tile id (r3) there.

  The block index arrives pre-multiplied via lsl r2,#0xb (block*2048).

  Side effects for callers: returns r0 = computed map offset,

  r1 = final write address, r2 = block*2048 (the shifted value),

  and the NZCV flags from the ADDS used to form the address.

  x is expected to be a within-block tile column (0..31), y the

  within-block row (0..31); no bounds checking is performed.

  '
