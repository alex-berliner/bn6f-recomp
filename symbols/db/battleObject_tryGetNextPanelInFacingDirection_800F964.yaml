name: battleObject_tryGetNextPanelInFacingDirection_800F964
address: '0x0800F964'
kind: function
previous_names:
- sub_800F964
status: probable
summary: For the current battle object in r5, returns the panel it would walk onto next given its facing
  alliance (or 0 if invalid / sliding)
interface: (r0 = unused arg passed to dirOffsetFromAlliance) -> r0 = next-panel-X, r1 = next-panel-Y ;
  returns (r0,r1) = (PanelX,PanelY) when valid, otherwise r0=0,r1=undefined
details: "Pushes r6/r7, saves r0 in r6. Calls object_getFlag (r5 implicit) and tests flag bit 0x1000\n\
  \  (OBJECT_FLAGS_SLIDING at oBattleObject collision data offset 0x3c, bit 12). If the object is\n  currently\
  \ sliding, returns (0, ?) immediately.\n  Otherwise reads the object's alliance byte at offset oBattleObject_Alliance\
  \ (0x16 in\n  BattleObject) into r1 and calls dirOffsetFromAlliance_800F9DE(r0=dir?, r1=alliance) ->\
  \ (r0,r1)\n  holding dx,dy offsets. Adds those to PanelX (offset 0x12) and PanelY (offset 0x13) loaded\
  \ from r5\n  and stores the result as the candidate (r6,r7). Then validates the panel via\n  playerObjectMovingToPanelValidityRelated_800E618(r0=PanelX,\
  \ r1=PanelY, r5=object); on success\n  pops with (r0=PanelX, r1=PanelY); on failure pops with (r0=0).\
  \ Used by the AI / chip-target\n  routines in sub_80EB088 / sub_80EB402 / sub_80EB502 / sub_80EBEB2\
  \ / sub_80EC490 / sub_80EC67E\n  / sub_80ED7A2 to probe where the object currently faces for movement/auto-target\
  \ decisions.\n"
