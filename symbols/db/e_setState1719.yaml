- method: assembly-reading
  date: '2026-10-19'
  detail: strb r0,[r3,#0x2] stores the argument into eStruct200ACE2+2; mvn r0,r0 followed by strb r0,[r3,#0x15]
    stores the complement into the player object fetched via oGameState_OverworldPlayerObjectPtr; movflag
    EVENT_1719; bl SetEventFlagFromImmediate sets one story/event flag; no callers known, so semantics
    of the value cannot be confirmed
