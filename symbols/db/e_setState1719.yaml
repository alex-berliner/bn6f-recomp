name: e_setState1719
address: '0x0809E168'
kind: function
status: probable
summary: Setter that records a state byte in the eStruct and the player object, then sets story event
  flag 1719.
interface: (r0 = state value) -> stores r0 at eStruct200ACE2 and ~r0 at player object+0x15; sets EVENT_1719;
  no return value
details: Takes a single byte value, stores it directly to eStruct200ACE2 field 0x2, and stores its bitwise
  complement to field 0x15 of the current overworld player object (fetched via the toolkit's GameState->OverworldPlayerObjectPtr).
  It then flags EVENT_1719 via SetEventFlagFromImmediate. The value/complement pair suggests two related
  representations of the same toggle are kept in sync across the eStruct and the player object. No callers
  are known, so the meaning of the state byte and of flag 1719 is not established from this code alone.
