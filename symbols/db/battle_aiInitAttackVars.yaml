name: battle_aiInitAttackVars
address: '0x08102016'
kind: function
status: probable
summary: Initializes the AI attack-variables block of a battle object and hands it to attack state 0xC.
interface: (r7 = battle object) -> r0 = 0xC passed to object_setAttack0; no return value
details: 'Using r7 as the object pointer, it fills the oAIAttackVars struct: three word fields (ScratchVar,
  AiAttackParam, AttackBoost2) are fetched via sub_800FE28 from nearby constants in the 0x81019F4 data
  block, Damage and ExtraDamage come from battle_aiGetVersionedTableEntry_800FE12 (so they scale with
  the object''s AI version), and it hard-codes TimerOrCycles=4, SubStepIndex=1, AttackStepIndex=0, InitFlag=1,
  AiDifficultyTier=2. Finally it calls object_setAttack0 with attack id 0xC to start the attack, making
  this the per-attack initializer for that AI attack.'
