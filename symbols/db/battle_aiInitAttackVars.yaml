    version-scaled AI stats; constant stores (TimerOrCycles=4, SubStepIndex=1, AttackStepIndex=0, InitFlag=1,
    AiDifficultyTier=2) are typical attack-state initialization; mov r0,#0xc; bl object_setAttack0 ends
