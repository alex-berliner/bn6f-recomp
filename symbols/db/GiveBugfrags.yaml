name: GiveBugfrags
address: '0x0803D080'
kind: function
status: confirmed
summary: Adds the requested BugFrags to the tamper-protected in-game counter, saturating at 9999, and re-encrypts
  it.
interface: uint GiveBugfrags(uint amount /* r0 */) ; uses r10 (toolkit/gameState pointer); clobbers nz c v
details: 'Reads the current protected-BugFrags count via encryption_bugfrags_8006fd0 (a

  checksum/decrypt step on the tamper-protected counter stored at oGameState_ProtectedBugfrags

  in the game state reachable through r10->oToolkit_GameStatePtr). If that integrity check

  fails (nonzero result), the function bails out early with r0 = 1 and does not modify the

  counter. When the counter is already at the cap 0x270Fu (9999, from dword_803D0B0), the

  counter is left alone and status = 1. Otherwise the amount is added; if the new total

  exceeds the cap (signed compare), it is clamped to 0x270Fu with status = 2; otherwise

  status = 0. The new count is written back to oGameState_ProtectedBugfrags, then

  encryption_bugfrags_8006fac is called to re-encrypt the counter and the status code (in r0)

  alongside it, passing the cap in r4. Despite touching r4 internally, the function preserves

  r4-r7 as required by the function contract.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
