    submenu via submenu_resetState and dispatches the mode handler at 0x0803EA78.; The branch from rfu_shouldRestartWirelessLink
    selects rfu_startLinkTransfer over rfu_reinitRecvSlots.; The known rfu_startLinkTransfer summary specifically
    describes initialization for a multiplayer data transfer.
