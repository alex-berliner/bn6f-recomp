name: rfu_restartLinkTransfer
address: '0x0812A4AC'
kind: function
status: probable
summary: Counts down a wireless-link timer and restarts the multiplayer transfer when it expires.
interface: (r5 = link-state object) -> void; flags conditionally modified
details: The function treats r5 as a link-state structure and decrements the halfword at offset 0x28.
  If the decremented value is nonzero, it returns immediately. On expiration, it sets byte fields at offsets
  1 and 2 to 0x10 and 0, clears the timer, resets the submenu state, and dispatches through the mode handler.
  If the wireless-link flag is set, it calls rfu_startLinkTransfer; otherwise it reinitializes the RFU
  receive slots.
