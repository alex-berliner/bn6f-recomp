name: battle_aiAddCounterFromCollision_8013B20
address: '0x08013B20'
kind: function
status: confirmed
summary: When a battle object's collision data reports event 0x18, adds the amount in the next collision byte to
  the AI's counter at oAIData_Unk_12, clamping it at 7.
interface: void sub_8013B20(battle_object *r5 /* in r5, object whose CollisionDataPtr/AIDataPtr are read */); clobbers
  r0-r3, NZCV-defined; preserves r4
details: 'Loads the object''s collision data pointer (r3) and AI data pointer (r4) from the battle object at r5.
  Reads collision byte 0xA4 as an event/state id; if it is zero the function returns without doing anything. If
  the state is not 0x18 it only reads collision byte 0xA5 into r2 and returns (no side effect). When the state is
  exactly 0x18, it reads the AI byte oAIData_Unk_12, adds collision byte 0xA5 to it, saturates the sum at 7, writes
  it back to oAIData_Unk_12, and leaves the final value in r2. Byte 0xA4/0xA5 look like a two-byte "event id + parameter"
  pair in the collision data structure. The 7-cap suggests a 0-7 counter such as an AI difficulty/aggression level
  or charge gauge. Registers as left for callers: r2 = resulting counter (or the 0xA5 amount when state != 0x18),
  r3 = collision data pointer, r4 = AI data pointer (though the C contract lists r4 as output, the assembly actually
  preserves the incoming r4); flags reflect the last executed compare (TST on the state byte when it is zero, CMP
  state vs 0x18 otherwise, CMP counter vs 7 on the add path).

  '
