name: battle_advanceObjectXAndDestroyIfInvalid_80D0498
address: '0x080D0498'
kind: function
status: confirmed
summary: Moves a battle object forward by its X velocity and destroys it if it has collided or is standing
  somewhere it cannot remain.
interface: battle_advanceObjectXAndDestroyIfInvalid_80D0498(BattleObject* r5 object) -> r5 object (returned
  unchanged; r1 is whatever the last object_* callee left there); clobbers r0, r2, r3, lr and flags; preserves
  r4, r6
details: 'Battle-object upkeep step for horizontal (X) motion: adds oBattleObject_XVelocity into oBattleObject_X,
  then calls object_setPanelsFromCoordinates with the new and previous X (r0/r1) and object_updateCollisionPanels
  to refresh panel data after the move. It reads oBattleObject_CollisionDataPtr -> oCollisionData_FlagsFromCollision;
  any nonzero collision flag goes straight to destruction. Otherwise it looks up the panel parameters
  for (oBattleObject_PanelX, oBattleObject_PanelY) via object_getPanelParameters; if the 0x10 bit is set
  (a panel the object may not simply occupy), it calls object_isCurrentPanelValid and survives only on
  nonzero. On the destruction path it calls object_clearCollisionRegion to drop the object''s active collision
  region and writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized, which
  sends the object through its destroy state. Quirk: r1 is never written by this function itself, so callers
  receive whatever r1 the last executed callee left behind; the C model reproduces this by returning r1
  untouched.'
