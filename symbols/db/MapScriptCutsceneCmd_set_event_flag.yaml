name: MapScriptCutsceneCmd_set_event_flag
address: '0x08035DB4'
kind: function
status: confirmed
summary: Map script command that sets an event flag whose number comes from a byte operand (or a 16-bit literal
  after a 0xFF escape marker).
interface: void MapScriptCutsceneCmd_set_event_flag(scriptCtx r5, scriptPtr r7); // advances the script pointer
  by 4, returns r0 = 1
details: 'Map-script command handler ("set event flag"). Reads an operand from the

  script stream via ReadMapScriptByte with r6 = 1 (operand size selector).

  If the byte is 0xFF, that is the wide-operand marker: r6 is set to 2 and

  ReadMapScriptHalfword reads the actual flag number as an immediate 16-bit

  literal. Otherwise the byte is an index into a halfword table at r5

  (script state / operand table), and the flag number is loaded with

  ldrh r4,[r5,r4]. The resulting value in r4 is passed to SetEventFlag.

  The command is fixed-size: r7 (script pointer) is advanced by 4

  (add r7,#4, whose carry/overflow set the flags before mov r0,#1 sets nz),

  and r0 = 1 is returned to signal the command was handled.

  ReadMapScriptByte/Halfword communicate their result through r4.

  Callers pass r5, r7, r10 (script context/state) and lr.

  '
