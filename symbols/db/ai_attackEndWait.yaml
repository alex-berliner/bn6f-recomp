name: ai_attackEndWait
address: '0x080EFA30'
kind: function
status: probable
summary: AI attack sub-state that waits 5 frames, then clears the attack object references and exits the
  attack state.
interface: (r7 = battle object AI vars, r5 = battle object) -> r0 = 0 after exit; no meaningful return
details: Called each frame as one step of an enemy AI attack routine. On entry with oAIAttackVars_AttackElement==0
  it sets StepTimer to 5 and writes phase 4 into AttackElement (the field is reused as a step/phase counter
  here). It then decrements StepTimer every frame; once the value goes negative (timer hit 0), it stores
  0 into oBattleObject_RelatedObject1Ptr and oAIData_TempAttackObjectPtr, dropping the spawned attack
  object links, and calls object_exitAttackState to return the AI to normal. The phase byte 4 is only
  set here, so the earlier phases of the same attack live in sibling handlers that share these vars.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb [r7,#oAIAttackVars_AttackElement] / strb #4: uses the element field as an attack-phase
    latch on first entry; mov #5; strh [r7,#oAIAttackVars_StepTimer] then dec-and-branch: a fixed 5-frame
    delay; str 0 into oBattleObject_RelatedObject1Ptr and oAIData_TempAttackObjectPtr: releases the attack''s
    spawned object; bl object_exitAttackState on timer expiry: hands control back to the normal AI state;
    no other state writes here and no callers known: it must be reached via a shared AI attack dispatch
    table indexed by the phase byte'
  refs:
