name: ai_clearCounterHitChain
address: '0x08014446'
kind: function
status: probable
summary: Clears the AI data's counter-hit chain flag to 0.
interface: (r5 = battle object) -> writes 0 to halfword oAIData_CounterHitChainFlag of [r5 + oBattleObject_AIDataPtr];
  no return value, flags clobbered by mov
details: Loads the object's AIData pointer from the battle object at oBattleObject_AIDataPtr, then stores
  0 as a halfword into oAIData_CounterHitChainFlag. It is a trivial one-field reset helper, presumably
  called whenever a navi AI turn/decision cycle ends or the counter-hit chain state must be invalidated.
  Uses r5 for the object, so callers must keep the object pointer in r5 by convention. Nothing else is
  read or modified.
