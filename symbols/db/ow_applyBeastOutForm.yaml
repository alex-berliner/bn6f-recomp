name: ow_applyBeastOutForm
address: '0x0809E35E'
kind: function
status: probable
summary: 'Applies the Beast Out appearance to the overworld player: loads the beast sprite, sets animation,
  disables the shadow, blocks jack-out, and flips the Beast Out event flags.'
interface: () -> void
details: Writes 1 to bytes 0x4 and 0x8 of the eStruct2000aa0 struct, then fetches the player's overworld
  object via GameState->OverworldPlayerObjectPtr and loads sprite (0x80, 0x1C, 0x54) onto it. It sets
  the animation from the player object's byte 0x14, loads the animation data, removes the shadow, and
  calls sprite_update. It then sets GameState's Unk_09 to 0x54 (the 'can't jack out / forced control'
  style flag) and clears event flag 0x68E while setting 0x68F, marking the Beast Out state transition.
  This is clearly the overworld-side transform-into-Beast-Out routine for the Falzar build.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: sprite_load(0x80, 0x1C, 0x54) on the overworld player object pointer read from GameState; sprite_setAnimation(ldrb
    [r5,#0x14]) + sprite_loadAnimationData + sprite_noShadow act on that same object r5; gameState_setUnk09(0x54)
    matches the 'can't jack out' control flag used by that setter; ClearEventFlagFromImmediate(EVENT_68E)
    / SetEventFlagFromImmediate(EVENT_68F) toggle a state pair typical of a form transition; executed
