name: ai_sweepAdvanceStep
address: '0x080F2F54'
kind: function
status: probable
summary: 'Per-frame timer driver for an AI panel-sweep: when the step timer hits zero, commits FuturePanelX/Y
  to PanelX/Y, frees the panel reservation, resnaps coordinates/collision, and reloads the timer + a state
  word for the next sweep step.'
interface: (r5 = battle object, r7 = AI attack vars) -> void; no return value
details: Runs each frame of an AI attack; decrements oAIAttackVars_StepTimer and returns until it reaches
  0. On expiry it sets the object's animation to 3 (movement/step anim), copies FuturePanelX/Y into PanelX/Y
  (committing the queued move), then calls object_removePanelReserve to release the reserved target panel,
  object_setCoordinatesFromPanels to snap pixel position to the new panel, and object_updateCollisionPanels
  to sync collision/facing. It reloads StepTimer with 5 to pace the next step and stores 8 into oAIAttackVars_HitElement,
  likely a per-step damage/element value applied while sweeping. Effectively a stepwise panel-crawling
  attack driver, matching the recorded 'battlesweep' route.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'StepTimer countdown with bgt locret gates the whole body: ldrh/sub/strh oAIAttackVars_StepTimer,
    bgt; FuturePanelX/Y copied to PanelX/Y before the three panel-related calls — a queued move being
    committed; object_removePanelReserve immediately after the panel copy frees the reserved target panel;
    StepTimer reset to 5 and HitElement written to 8 after the move, keeping per-step cadence and per-step
    effect; Sets oBattleObject_CurAnim to 3, consistent with a move/step animation state'
  refs:
