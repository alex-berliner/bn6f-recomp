name: chatbox_F1_textspeed
address: '0x08041BA4'
kind: function
status: confirmed
summary: Chatbox text-script opcode 0xF1 handler that sets the text print speed and queues the next speed to use
  afterwards.
interface: void chatbox_F1_textspeed(u8 *scriptCursor /*r4*/, struct Chatbox *chatbox /*r5*/); returns r0=1 (advance
  flag), r1=speed+1, r2=0x1F3, r4=cursor+3, c/v from the r4+3 add, nz from "mov r0,#1"
details: 'Called by the chatbox text-script interpreter for opcode 0xF1 ("set text speed"). Reads the speed byte
  at scriptCursor+2 and stores it to chatbox+8 (oChatbox_TextScriptPrintSpeed, the current print speed). Always
  stores speed+1 to chatbox+0x1F3, interpreted as the print speed to use for the next message/after this one; note
  that speed==0 still stores 1 there, so a single store covers both. Sets a flag in the chatbox 0x3E flag word via
  chatbox_setflags_3e: 0x0040 (FLAGS_3E_UNK_0040) when the requested speed is 0, 0x0800 (FLAGS_3E_UNK_0800) otherwise
  — likely distinguishing "instant/default" from a numeric speed for the interpreter''s follow-up logic. The command
  is 3 bytes long, so the script cursor (r4) is advanced by 3 and the caller receives r0=1 to continue processing.
  Register contract quirks: r1 (speed+1) and r2 (0x1F3) are leftovers from the store address computation that callers
  apparently read or tolerate; the offset constant 0x1F3 is kept in a literal pool at 0x8041BD4 and the 0x0800 flag
  in a literal at 0x8041BD0.'
