name: sub_801CF3C
address: '0x0801CF3C'
kind: function
status: confirmed
summary: Issues 5 DMA tile-map fills (incrementing row addresses) and optionally 1 BG-map fill, driven by a parameter
  block at r7.
interface: 'void dmaFillMapTiles_801CF3C(u32 r7_paramBlock); /* outputs: r1=fill_count, r2=0, r3=0; preserves r4-r7
  */'
details: 'Reads a parameter block at r7 with fields: byte 2 (tile column hi), byte 3 (tile column lo), byte 4 (BG-map
  column hi), byte 5 (BG-map column lo), byte 6 (fill control, shifted into bits 31:25 of the source address), byte
  8 (BG-map fill flag). Builds a DMA source address as 0x80004100 | (col_hi<<16) | col_lo | (ctrl<<25). Loops five
  times calling sub_802FE28(addr, count, 0, 0) with addr advancing by 0x200000 and count advancing by 8 each iteration
  (starting count 0xB370). If byte 8 equals 1, additionally builds a BG-map source at 0x40000100 | (bgcol_hi<<16)
  | bgcol_lo | (ctrl<<25) and calls sub_802FE28 once with count 0xB570B398 (note: loaded via 32-bit LDR from a .hword
  label, upper halfword 0xB570 leaks from adjacent data). Leaves r1 at the final fill count, r2 and r3 zeroed, all
  flags clobbered.

  '
