name: ai_spawnIllusionOfSelf
address: '0x080F57DE'
kind: function
status: probable
summary: Spawns an illusion/afterimage entity (kind 0x308) at the acting enemy's position with its facing,
  as part of an enemy AI attack.
interface: (r5 = battle object ptr, held by caller; r0-r3 unused) -> r0 = spawned illusion object from
  spawnIllusionObject_80E33FA; flags from that call
details: Reads the object's effective facing via object_getFlip and packs it as r4 = 0x308 | (flip <<
  24), the 0x308 being the illusion entity kind passed to the spawner. Loads three words starting at r5+0x34
  (the object's stored position/panel coordinate triple) into r1-r3 as the spawn location. Tail-calls
  spawnIllusionObject_80E33FA and returns its result directly. All callers are enemy AI attack-step routines
  (ai_attackStepChoosePanelAndCharge and neighbors), so the illusion is created during attack setup —
  likely a decoy/clone tied to the charge or strike.
