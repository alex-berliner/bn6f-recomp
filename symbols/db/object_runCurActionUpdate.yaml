name: object_runCurActionUpdate
address: '0x080D65E0'
kind: function
status: probable
summary: Dispatches the battle object's CurAction handler via a jump table (off_80D65F4) indexed by oBattleObject_CurAction,
  with two Thumb entries (sub_80D65FC, sub_80D677C); uses the mov lr,pc / bx r1 Thumb long-branch trick.
interface: (no args; operates on object in r5) -> void; no meaningful flags
details: 'Reads oBattleObject_CurAction from the object at r5 and branches through the table at off_80D65F4 to the
  matching handler (two entries: sub_80D65FC, sub_80D677C). It is called immediately after the caller sets oBattleObject_CurStateActionPhaseAndPhaseInitialized
  to CUR_STATE_UPDATE, so it is the per-action ''update'' entry point of the object''s state machine. Uses the lr-indirect
  jump trick (mov lr,pc / bx r1) since GBA Thumb lacks a plain long branch. r5 is the implicit object pointer, consistent
  with other battle-object routines.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_CurAction]; ldr r1,[r1,r0]; bx r1 dispatches on CurAction (0x080D65E4-...);
    off_80D65F4 holds exactly two handlers, sub_80D65FC+1 and sub_80D677C+1, indexed by CurAction; Caller 0x080D6580
    sets CurStateActionPhaseAndPhaseInitialized = CUR_STATE_UPDATE then immediately bl sub_80D65E0, ending the state
    setup
  refs:
  - bn6f/asm/asm31.s:67053
  - 0x080D6580 sub_80D6580
  reproduce: python3 tools/asmcat.py 0x080D65E0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise — The code
    does jump-table dispatch via CurAction using off_80D65F4 with two entries (sub_80D65FC, sub_80D677C), matching
    the proposal. However, the +1 offsets show these are Thumb callees, and the lr/bx trick is correct. The name
    ''object_runCurActionUpdate'' is fine, but since the caller sets oBattleObject_CurStateActionPhaseAndPhaseInitialized
    to CUR_STATE_UPDATE before calling it, ''object_runCurActionUpdate'' accurately conveys the per-action update
    dispatch. The summary mentions ''no meaningful flags'', but actually it dispatches based on CurAction (a meaningful
    selector). Minor wording tweak only.; run wf investigate investigate-20261019-052112; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
