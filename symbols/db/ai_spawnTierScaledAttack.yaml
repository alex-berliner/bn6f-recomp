    descriptor word; asm: ldr r6,[r6,r3] with r3 = tier*4 + r2*16 indexes byte_80F74D0, whose words are
    30/50/100/100 paired with 0xA; asm: r0, r1 untouched and passed with packed word and oAIAttackVars_InitFlag
