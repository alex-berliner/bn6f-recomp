name: ai_spawnTierScaledAttack
address: '0x080F74A8'
kind: function
status: probable
summary: Spawns an AI attack at a panel position with parameters read from a difficulty-tier table, used
  by ai_spawnAttackPanelPair to place attacks on two mirrored panels.
interface: (r0 = panel x, r1 = panel y, r2 = attack/param index, r3 = packed param) -> r0/r1 forwarded
  to sub_80D63FC with packed descriptor tier | r2<<8 | r3<<16 and InitFlag
details: Builds one packed word from the AI attack struct's difficulty tier (oAIAttackVars_AiDifficultyTier
  at r7), arg2<<8, and arg3<<16, keeping r0/r1 untouched so they pass through as coordinates. It then
  loads a word from byte_80F74D0 at byte offset tier*4 + arg2*16, i.e. word index arg2*4+tier; the 12-word
  table holds the pattern (0x1E,0xA),(0x32,0xA),(0x64,0xA),(0x64,0xA) three times, so the selected value
  grows 30/50/100/100 with tier — plausibly damage with a 10 secondary field. It calls sub_80D63FC(r0,r1,r2=packed
  tier|args, r3=table value, r4=oAIAttackVars_InitFlag) and returns. Its only caller loops it twice over
  per-attack panel pairs, shifting x by -3*object_getFrontDirection to mirror the attack toward the enemy
  side.
evidence:
- method: assembly-reading
  date: '2026-10-19'
