name: sub_8014E08
address: '0x08014E08'
kind: function
previous_names: []
status: hypothesis
summary: AI attack sub-state that handles the sequence just before/after a battle object transforms (Beast Out /
  Soul Unison / etc.) — flashes white, swaps sprite+anim, plays the transform SFX, updates the NaviStats Transformation
  byte, then opens the post-transform turn
interface: '(r4 = unused?, r5 = *battleObject, r6 = ??, r7 = *aiAttackVars, r10 = *toolkit) -> void ; side effects:
  rewrites object sprite+anim, NaviStats[0x2C], triggers beginTurnOpenProcess'
details: "Entered from the AI attack state machine when oAIAttackVars_Unk_01 == 0 (first sub-step).\n  - Force-white\
  \ palette on the object (sprite_forceWhitePalette twice, book-ends).\n  - Pull the current Transformation byte\
  \ (NaviStats offset 0x2C) via GetBattleNaviStatsByte_AllianceFromBattleObject, run sub_8011384 on it (some chip-class\
  \ lookup against 0x29 of the same stats record), then call chip_class_lookup_800FC9E.\n  - Load a sprite/animation\
  \ pair: r0=0x80 into sprite_load + sprite_loadAnimationData, sprite_hasShadow, set current anim 0 and copy oBattleObject_CurAnim,\
  \ get/set flip, recompute panel coords.\n  - Park an oAIAttackVars_Unk_10 countdown at 0x000A (10 frames).\n \
  \ - Mirror the freshly loaded Transformation back to NaviStats via SetBattleNaviStatsByte_AllianceFromBattleObject.\n\
  \  - Fire 0x30E00 through sub_80E11E0 (likely the Beast-Out / transformation table loader), then PlaySoundEffect(0x100,\
  \ \"0x01 + #0xFF\" = 0).\n  - If the new transformation byte is in [1..0x18], also call battle_setObjectTextId_8015B22\
  \ (sets the NameID for the transformed form).\n  - Dispatch a mode index (param r0=cur anim copy, r2=0) into sub_8011268\
  \ (24-way jump-table dispatcher).\n  - If oBattleObject_RelatedObject2Ptr is non-null, zero its oBattleObject_Param3\
  \ byte.\n  - Compute a step-forward delta via battleObject_computeAIStepForwardDeltaX_8018856 with kind=3, negate\
  \ r1, then call sub_801DC06 (the 6-slot table patcher) — this records/updates a queued displacement for the AI.\n\
  \  - Mark oAIAttackVars_Unk_01 = 4 (advance to next AI attack sub-state).\n\n  Returns immediately if oAIAttackVars_Unk_01\
  \ was already non-zero on entry; otherwise falls through to a frame-tick loop on oAIAttackVars_Unk_10. While that\
  \ countdown > 0 the function just returns; when it underflows:\n  - callPossiblyGetBattleEmotion_8015B54 → r0;\
  \ if r0==2 push r1=1 (otherwise 0) for later use.\n  - battle_beginTurnOpenProcess_80144C0 (clears chip-hand/AI\
  \ state, handles control-invert, rebuilds collision + panel setup).\n  - battleObject_markUsedAction_80143A6.\n\
  \  - If the pushed r1 was 1, call battle_setPlayerNaviStatsField0E_8015BEC with r1=0xFF (probably \"consume a\
  \ transformation/Beast-Out charge\").\n  - object_clearInvulnerableTime.\n  - If oBattleObject_RelatedObject2Ptr\
  \ is non-null, push r5, swap r5 to it, sprite_clearFinalPalette, pop r5.\n  - Park oAIAttackVars_Unk_00 = 0x000C\
  \ (next sub-state / next timer).\n\n  Net behaviour: drives the visual + persistent state for a battle object's\
  \ mid-battle form change, then opens the next turn.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `bne loc_8014EB8` after `tst r0,r0` on oAIAttackVars_Unk_01 means the heavy block runs only when that
    flag is 0; the trailing block runs after Unk_10 decrements past 0. - `mov r1, #0x2c` paired with `GetBattleNaviStatsByte_AllianceFromBattleObject`
    reads/writes NaviStats offset 0x2C (`Transformation` per NaviStats.inc) both before and after the sprite swap.
    - `mov r1, #0x29` + second `GetBattleNaviStatsByte_AllianceFromBattleObject` reads NaviStats offset 0x29 (`NaviIndex`),
    then `chip_class_lookup_800FC9E` uses it; this matches the typical "look up which sprite to use for the transformed
    navi" pattern. - `mov r0, #0x80; bl sprite_load` then `sprite_loadAnimationData` + `sprite_hasShadow` + setting
    animation 0 / copying oBattleObject_CurAnim rebuilds the visible sprite. - `strh r0,[r7,#oAIAttackVars_Unk_10]`
    with r0=0xa sets the white-flash countdown; the matching `ldrh r0,[r7,#oAIAttackVars_Unk_10]; sub r0,#1; strh
    r0,...; bgt locret_8014EFE` decrements it each call. - `dword_8014F00 = 0x30E00` then `bl sub_80E11E0` looks
    like a ROM table pointer for transformation data. - `mov r0, #1; add r0,#0xff` = 0 → PlaySoundEffect(0) is a
    no-op style init sound; the real transform SFX is likely elsewhere (possibly triggered by sub_80E11E0). - `cmp
    r0,#1; blt loc_8014E92; cmp r0,#0x18; bgt loc_8014E92; bl battle_setObjectTextId_8015B22` → only valid transformation
    IDs 1..0x18 get a display name. - `bl sub_8011268` with r0=oBattleObject_CurAnim + r2=0 dispatches the post-transform
    anim/state mode. - `ldr r0,[r5,#oBattleObject_RelatedObject2Ptr]; tst r0,r0; beq loc_8014EA8; strb r1,[r0,#oBattleObject_Param3]`
    resets the second related object''s param3 to 0 (used for partner/ghost cleanup on transform). - `mov r0,#3;
    bl battleObject_computeAIStepForwardDeltaX_8018856; neg r1,r1; bl sub_801DC06` queues an AI displacement of
    negative-X delta kind 3. - `strb r0,[r7,#oAIAttackVars_Unk_01]` with r0=4 marks the AI attack sub-state to advance.'
