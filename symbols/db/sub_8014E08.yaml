open_questions:
- Exact meaning of AIAttackVars+0x01 gating (init vs update), and what `sub_8011384` / `sub_801595E` / `sub_80E11E0`
  compute from the alliance + 0x2C byte.
- Whether the 0x0C write at the end represents "complete" or merely "advance to next state" — there are no listed
  callers to confirm.
- What `battle_setPlayerNaviStatsField0E_8015BEC` actually toggles (NaviStats 0x0E = Mood) when emotion == 2.
