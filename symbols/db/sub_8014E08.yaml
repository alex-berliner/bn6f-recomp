name: sub_8014E08
address: '0x08014E08'
kind: function
previous_names: []
status: hypothesis
summary: AI attack-vars phase handler that drives the "Beast Out" style transformation step — flashes it white,
  performs a sprite change/animation, plays a sound, and on expiry runs turn-open post-processing before handing
  off to the next AI phase.
interface: '(r5 = battleObject, r7 = aiAttackVars, r10 = toolkit) -> void ; side effects: battle object''s sprite,
  animation, palette and NaviStats transformation byte are mutated, plus battle-wide setup callbacks fire.'
details: "- Guard byte oAIAttackVars_Unk_01 is tested (`bne loc_8014EB8`); if non-zero, the function only decrements\
  \ oAIAttackVars_Unk_10 once per call and returns early, indicating this routine is driven by a counter (10 = 0xA\
  \ frames).\n  - On first entry it forces a white palette (`sprite_forceWhitePalette`), reads NaviStats byte 0x2C\
  \ (Transformation) via the alliance helper, runs `sub_8011384` to convert it, then loads chip-class metadata (`sub_801595E`)\
  \ for byte 0x29 (Folder1/Folder2 area), and `chip_class_lookup_800FC9E` to derive a chip-class-related value that\
  \ drives the sprite id argument (0x80) to `sprite_load`.\n  - The new sprite is materialised with `sprite_loadAnimationData`,\
  \ `sprite_hasShadow`, animation 0 via `object_setAnimation`, `sprite_setAnimation` (echoing oBattleObject_CurAnim),\
  \ `sprite_loadAnimationData`, then `object_getFlip`/`sprite_setFlip` and `object_setCoordinatesFromPanels`. AIAttackVars_Unk_10\
  \ is set to 10 (frames).\n  - It re-forces the white palette, recomputes the chip-class value, and writes it back\
  \ into NaviStats byte 0x2C (Transformation) via `SetBattleNaviStatsByte_AllianceFromBattleObject`, then loads\
  \ a 24-bit word from `dword_8014F00` (=0x30E00) into r4 and calls `sub_80E11E0(r1,r2,r3,r4,r7,lr)` — likely a\
  \ battle/queue pump.\n  - Plays sound 0x100 (`PlaySoundEffect(0xFF+1)`); then conditionally writes the chip-class\
  \ into NameID (only if Transformation byte is in 1..0x18) using `battle_setObjectTextId_8015B22`.\n  - `sub_8011268`\
  \ is dispatched with mode 0, then the RelatedObject2Ptr's Param3 byte is zeroed (if the related pointer is non-null),\
  \ and a 3-step AI horizontal delta is computed via `battleObject_computeAIStepForwardDeltaX_8018856` and patched\
  \ through `sub_801DC06` (which writes the neg-DeltaX). AIAttackVars_Unk_01 is then set to 4 to advance the AI\
  \ state machine.\n  - Each subsequent call decrements oAIAttackVars_Unk_10; when it goes below 1 the \"turn open\"\
  \ routine fires: it calls `callPossiblyGetBattleEmotion_8015B54` (r0=alliance, r1 set 1 if emotion==2), then `battle_beginTurnOpenProcess_80144C0`,\
  \ `battleObject_markUsedAction_80143A6`, and (only if r1==1) writes 0xFF into NaviStats field 0x0E via `battle_setPlayerNaviStatsField0E_8015BEC`\
  \ — i.e. ending the transformation.\n  - It clears invulnerability (`object_clearInvulnerableTime`), clears the\
  \ final-palette high nibble on RelatedObject2Ptr, and finally sets oAIAttackVars_Unk_00 = 0xC (next AI phase).\
  \ Uses r10 as toolkit and r5/r7 as the object and attack-vars workspace throughout.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `bl sprite_forceWhitePalette` at entry and again after `mov r0, #0xa; strh r0, [r7,#oAIAttackVars_Unk_10]`
    show the "white flash" pattern typical of Beast Out. - `GetBattleNaviStatsByte_AllianceFromBattleObject` with
    `mov r1, #0x2c` and `SetBattleNaviStatsByte_AllianceFromBattleObject` write the same byte back — Transformation
    (NaviStats+0x2C). - `chip_class_lookup_800FC9E` is fed byte 0x29 via `sub_801595E` and the result goes to `sprite_load(0x80,
    …)` and back to NaviStats+0x2C — matches the way other BN6 routines translate folder/class into the visual form.
    - `PlaySoundEffect` is called with r0=1 then `add r0, #0xff` -> 0x100, which is the Beast Out jingle. - `callPossiblyGetBattleEmotion_8015B54`
    + `cmp r0, #2` and conditional write of 0xFF into NaviStats+0x0E via `battle_setPlayerNaviStatsField0E_8015BEC`
    mirrors how the battle engine terminates the transformation after the turn opens. - `strh r0, [r7,#oAIAttackVars_Unk_10]`
    decremented to <=0 then `mov r0, #0xc; strh r0, [r7,#oAIAttackVars_Unk_00]` matches an FSM where Unk_00 holds
    the next phase and Unk_10 the per-phase frame counter. - `strb r0, [r7,#oAIAttackVars_Unk_01]` writing 4 is
    the only place Unk_01 is set, suggesting it is the "done" flag for phase 3.'
