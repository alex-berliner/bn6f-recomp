open_questions:
- The exact form (Beast Out vs Soul Unison vs something else) the function targets — the value 0x80 sprite id +
  0x30E00 table pointer + NaviStats[0x2C] updates are consistent with any transformation; only side context (which
  AI attack state dispatches here) would settle it.
- What sub_8011384 does with r0=Transformation + r1=NaviIndex; only its body would explain the second `GetBattleNaviStatsByte_AllianceFromBattleObject(_,0x29)`
  call.
- Why PlaySoundEffect(0) is called at all (could be intentional silence to reset the sound channel queue).
