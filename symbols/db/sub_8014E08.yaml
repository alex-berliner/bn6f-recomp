open_questions:
- Exact identity of "step" (whether this is just Beast-Out, or also handles Counter/Pierce etc.) is not certain;
  the visual signature (white palette + chip-class-driven sprite + 0x100 SFX + emotion-driven field-0xE write) matches
  Beast Out, but a similar helper could exist for other transform-style attacks.
- '`sub_8011268(mode=0)`, `sub_80143A6`, `sub_80E11E0`, `sub_801DC06`, `sub_8011384`, `sub_801595E` and `dword_8014F00
  = 0x30E00` are not decompiled and could shift the interpretation (e.g. whether 0x30E00 is a queue/arena pointer,
  and whether sub_80143A6 actually "marks the action used").'
