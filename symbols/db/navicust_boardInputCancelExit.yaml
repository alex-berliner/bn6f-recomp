summary: 'Cancel/exit action for the Navi Customizer board screen: clears the text box, plays the unselect
  sound, and sets the screen state to 0x34.'
interface: (r0-r3 unused) -> void; r5 = board context struct, byte [r5,#2] = new screen/state code
details: Runs the chatbox script with id 0 (chatbox_runScript_803FD9C_on_eTextScript201D280), which most
  likely clears or resets the dialogue box rather than showing text. Then plays sound effect 0x7B, the
  unselect/cancel blip also used elsewhere for menu dismissals. Finally stores 0x34 into the byte at offset
  2 of the context struct in r5, which per the caller's cell/screen-state handling is the state field;
  0x34 is presumably the screen/state id to transition to (the previous NaviCust screen). Called only
  from navicust_handleBoardInput, where it fits the cancel branch of the button dispatch.
