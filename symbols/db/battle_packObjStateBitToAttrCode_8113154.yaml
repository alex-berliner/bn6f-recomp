name: battle_packObjStateBitToAttrCode_8113154
address: '0x08113154'
kind: function
status: confirmed
summary: Reads bit 0 of a battle object's state byte at offset 0x16 and writes an attribute code (0 -> 4, 1 -> 8)
  to a caller-supplied byte.
interface: u8 battle_packObjStateBitToAttrCode(/*r4*/ BattleObj* obj, /*r6*/ u8* out); // returns code in r0, r1=1,
  flags from the final add
details: Loads the byte at [r4,#0x16] from a battle object, masks it to bit 0, shifts left by 2 (giving 0 or 8),
  then adds 4, so the only possible results are 4 (bit clear) or 8 (bit set). The result is stored to the single
  destination byte pointed to by r6. r1 is set to 1 before the add, so on return r1==1 and r0 holds the packed code;
  the NZCV flags reflect the `add r0,
