name: battle_setPlayerDirectionAndAnimFromAIState_80A5890
address: '0x080A5890'
kind: function
previous_names:
- sub_80A5890
status: probable
summary: Copies the AI state's direction/anim offset triple (offsets 0x7C..0x84) into the player battle
  object and triggers a direction/anim update.
interface: (r5 = player BattleObject*, r6 = AIData*) -> void ; side effects on player BattleObject at
  offsets 0xC,0x10,0x14; calls owPlayer_setDirectionAnimFromOffset_80A5974
details: 'Loads three u32 values from AIData+0x7C, +0x80, +0x84 via r3=0x7c with successive adds (mov
  r3,#0x7c; ldr r0,[r6,r3]; add r3,#4; ldr r1,[r6,r3]; add r3,#4; ldr r2,[r6,r3]). These are stored into
  the player BattleObject at r5+0xC, +0x10, +0x14 (str r0,[r5,#0xc]; str r1,[r5,#0x10]; str r2,[r5,#0x14]).
  The BattleObject offsets 0xC..0x14 are Unk_0c/Unk_0d/Unk_0e (Element)/Unk_0f area; here written as 3
  u32s, plausibly the "direction/anim offset" triplet (Direction/DirectionFlip blend + AnimSelect blob).
  Then bl owPlayer_setDirectionAnimFromOffset_80A5974 re-derives the sprite from those values. r4/r5/r10/lr
  pushed, callee restores r4/r5; r0 always returned 0 (movs r0,#0 from init or zero from str). Called
  only from sub_80A57D0 / sub_80A5828 (the two AIData-state handlers right before/after they queue direction).

  '
