name: sprite_setSubRecordFieldA_8003060
address: '0x08003060'
kind: function
status: confirmed
summary: Stores a byte into field +0xA of the 16-byte-aligned sub-record selected by the sprite object's bank/index
  nibble.
interface: 'void sprite_setSubRecordFieldA(u8 value, SpriteObj* obj /* r5 */); // out: r3 = sub-record base, c/v
  from the ADD'
details: 'Takes a byte value in r0 and a sprite object pointer in r5. The object''s byte at +2 has its upper nibble
  (bits 4-7) extracted with lsr/lsl by 4, giving a multiple of 16 that is added to r5 to locate a 16-byte-aligned
  record inside/after the object. The value byte is written to that record''s offset +0xA. r3 is left holding the
  record base address (callers may use it as a pointer or simply discard it), and the c/v flags carry over from
  the ADD that forms the base (c set if r5 + offset overflowed, v from signed overflow) — c and v are listed as
  outputs, so at least one caller apparently relies on the carry behavior. Only the record pointer and the single
  byte are touched; no other state is modified. The trivial three-instruction body means this is likely an inlined-style
  accessor used to set one attribute (e.g. an animation/frame or state byte) of whichever sub-record the object
  currently points at.

  '
