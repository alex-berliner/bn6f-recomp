name: ai_attackSweepFrontRow
address: '0x080F197A'
kind: function
status: probable
summary: 'AI attack: deals hits to each of the 6 panels in front of the user in sequence, staggering each
  hit by 5 frames.'
interface: (r5 = attacker battle object, r7 = AI attack vars (Damage, InitFlag)) -> r0 = 0/void; uses
  facing from object_getFrontDirection
details: Loops i = 1..6; each iteration gets the attacker's facing multiplier, computes target panel X
  = PanelX + dir*i, with PanelY from the object, and skips invalid grid cells via object_isValidPanel.
  For each valid panel it calls sub_80D1B22 with r0/r1 = panel (x,y), r2 = [r7+oAIAttackVars_InitFlag],
  r3 packed as (i-1)*5 | 0x700 | 0x50000 | 0xFF000000, and r6 = [r7+oAIAttackVars_Damage]. The (i-1)*5
  low byte reads as a frame delay for tile i, giving a wave sweeping away from the user; bytes 7/5/0xFF
  are attack size/kind/owner-ish parameters consumed by sub_80D1B22. The unused literal off_2010708 and
  byte_80F19CC (0xC8,0x40,0x00,0x01,0x0A) belong to the caller sub_80F1902's attack setup.
