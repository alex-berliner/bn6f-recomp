name: sub_8129A98
address: '0x08129A98'
kind: function
status: confirmed
summary: One step of the opponent's battle-menu state machine; dispatches on a phase byte to a per-phase AI handler,
  then runs a shared follow-up with command 0x12.
interface: void battle_aiStep_8129A98(u32 r4, u32 r5, u32 r6, u32 r7, u32 r10); /* returns r5, r8, r9, r10, r11,
  r12; clobbers r0-r4, r6, r7, lr, n, z, c, v */
details: "Reads the battle object's phase byte at r5+0x3 and uses it to index the\nsix-entry Thumb dispatch table\
  \ at off_8129AB0:\n  0 decideBattleAction_8129AC8\n  1 sub_8129AF0\n  2 sub_8129B34\n  3 chipSelectInit_8129B90\n\
  \  4 sub_8129BB0\n  5 sub_8129BDC\nThe selected routine is invoked via \"mov lr, pc; bx r0\" (Thumb switch\nthrough\
  \ the +1 low bit), so it runs in the caller's context with\nr0 = handler address, r1 = phase byte, and r4-r7/r10\
  \ as the caller left\nthem. Handlers may rewrite r4/r5/r6 (the comment in the disassembly notes\ne.g. sub_8129B34\
  \ hands back a new object pointer and state). After the\nhandler returns, sub_812B25C is called with command 0x12\
  \ (0x12) and the\nupdated r4/r5/r6 and r10; whatever r10 stands at after the handler\nmatters because that call\
  \ reads it too. Outputs r5, r8, r9, r10, r11,\nr12 are what callers of sub_8129A98 actually observe -- they come\n\
  straight out of sub_812B25C, not from the dispatched handler. Phase\nhandlers are otherwise opaque here; their\
  \ individual register contracts\nare not part of this function's contract.\n"
