name: battle_deathAnimStateHandler
address: '0x080BA62E'
kind: function
status: probable
summary: Battle-object state handler that plays a death/explosion animation (anim 0xd, 19 frames), fires
  an effect/sound call, disables collision, and destroys the object.
interface: (r5 = battle object) -> none; sets oBattleObject_CurStateActionPhaseAndPhaseInitialized to
  CUR_STATE_DESTROY on completion
details: 'On entry with oBattleObject_CurPhase == 0 it initializes the state: phase = 4, animation 0xd,
  timer 0x13 (19 frames), then returns. On later frames it decrements oBattleObject_Timer; when it reaches
  0 it calls sub_8011044(2, 0xe) (likely an effect or sound trigger), writes 0 to oCollisionData_Enabled
  via oBattleObject_CollisionDataPtr so the object stops hitting anything, and stores CUR_STATE_DESTROY
  into the combined state/phase field so the object framework despawns it. The nonzero-phase check means
  the setup branch runs only on the first frame of the state. No known callers, so the owning object kind
  (enemy death, bomb explosion, etc.) is unidentified.'
