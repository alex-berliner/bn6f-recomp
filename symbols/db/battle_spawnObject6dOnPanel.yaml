    and str r5/r6/r7 to RelatedObject1Ptr, Damage..., ExtraVars fill the new object''s fields; ldrh r3,[r5,#AllianceAndDirectionFlip];
    strh r3,[r0,#...] copies the parent object''s alliance to the spawn, matching r5 = RelatedObject1Ptr;
    callee summary of object_spawnType3 (''runs its initializer if the spawn succeeded'') matches the
    beq-gated store block after the bl with r0=0x6D; orr #0x10 into oObjectHeader_Flags marks the freshly
    initialized object''s header'
