name: battle_spawnObject6dOnPanel
address: '0x080D21F8'
kind: function
status: probable
summary: Spawns battle object ID 0x6D via object_spawnType3 and fills its panel position, element, parent
  link and per-instance fields, inheriting the parent object's alliance.
interface: (r0 = panelX, r1 = panelY, r2 = element; r5 = parent battle object, r6 = damage/stamina value,
  r7 = extra vars; r3-r4 forwarded to spawner) -> r0 = new oBattleObject or NULL; Z set from spawn result
details: The function saves its three byte arguments with push {r0-r2,r5}, sets r0 = 0x6D (the object
  ID handed to object_spawnType3, which takes five args in r0-r4) and calls the spawner. After the call,
  pop {r1-r3,r5} shifts the saved args into r1-r3 so the spawn pointer stays in r0, and the beq (flags
  from the mov of the spawn result) skips all stores when the spawn failed. On success it writes PanelX,
  PanelY and Element from the args, RelatedObject1Ptr from the caller's r5 (the parent/related object),
  DamageAndStaminaDamageCounterDisabler from r6 and ExtraVars from r7, all registers that survive the
  bl as hidden arguments. It then copies AllianceAndDirectionFlip from the parent object at r5 into the
  new object, so the spawn joins its parent's team. Finally it sets bit 0x10 in oObjectHeader_Flags of
  the new object. The new object pointer is returned in r0 (NULL on failure).
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'push {r0-r2,r5} / pop {r1-r3,r5} is a register shuffle that moves the three byte args into
