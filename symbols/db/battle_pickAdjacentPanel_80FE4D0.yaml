name: battle_pickAdjacentPanel_80FE4D0
address: '0x080FE4D0'
kind: function
status: probable
summary: Picks a random cardinal neighbour panel for a battle object, avoiding its own panel and preferring
  panels not on its "special" row, otherwise falling back to special-row panels or the object's own panel.
interface: "u32 sub_80FE4D0(u32 ptr, u32 arg_x, u32 arg_y, u32 battle_obj, u32 cur_packed);\n  // r0 =\
  \ ptr (object whose field_13 is the \"special\" row)\n  // r1 unused on entry (only used as temp)\n\
  \  // r2 = arg_x, r3 = arg_y (passed through to object_checkPanelParameters)\n  // r5 = battle_obj (read\
  \ for oBattleObject_PanelX / oBattleObject_PanelY)\n  // r6 = cur_packed (current panel as (y<<4)|x)\n\
  \  // returns: r0 = chosen x, r1 = chosen y; sets NZ from returned x\n  // clobbers: r2,r3,lr; flags\
  \ NZ,C,V\n  // preserves: r4,r5,r6,r7\n"
details: "Iterates over the four cardinal offsets stored at byte_80FE594 in ROM\n(left -1,0 / up 0,-1\
  \ / right 1,0 / down 0,1) and for each one computes\ntx = obj_x + dx, ty = obj_y + dy (obj_x/obj_y from\
  \ r5 via\noBattleObject_PanelX / oBattleObject_PanelY). Each candidate panel is\nvalidated by calling\
  \ object_checkPanelParameters(tx, ty, arg_x, arg_y);\nonly valid panels proceed.\n\nThe current panel\
  \ (cur_x,cur_y packed into r6) is skipped. Remaining valid\npanels are split into two lists (each packed\
  \ as (ty<<4)|tx into a u8):\n  - valid_list:    panels whose ty != ptr->field_0x13\n  - special_list:\
  \  panels whose ty == ptr->field_0x13\nCounts (r6 reused, r7) are tracked separately.\n\nAfter scanning\
  \ all four neighbours:\n  - If valid_count > 0, picks valid_list[ GetPositiveSignedRNG() % valid_count\
  \ ].\n  - Else if special_count > 0, picks special_list[ GetPositiveSignedRNG() % special_count ].\n\
  \  - Else falls back to the object's own panel if object_checkPanelParameters passes\n    (returns cur_x,\
  \ cur_y), otherwise returns x=0, y=cur_y.\n\nIn every branch the chosen byte is unpacked as y = byte>>4,\
  \ x = (byte<<29)>>29\n(3-bit truncation as in the original). R0,R1 hold x,y on return; NZ is set\nfrom\
  \ the returned x via the final `lsl r0, r0, #0x1d; lsr r0, r0, #0x1d` pair,\nwhich sets NZ based on\
  \ whether x is zero.\n\nStack layout (sp+0..sp+0x1B): sp+0 = ptr, sp+4 = cur_x, sp+8 = cur_y,\nsp+0xC\
  \ = arg_x, sp+0x10 = arg_y, sp+0x14..0x17 = valid_list[4],\nsp+0x18..0x1B = special_list[4].\nQuirks:\
  \ r4/r5/r6/r7 are callee-preserved per contract but r6 and r7 are\nactually used as scratch counters\
  \ here (the decompiler comment about\npreserving them is the caller's contract, not this function's\
  \ behaviour).\nUses GBA SWI 6 (BIOS Divide) for the modulo; ldrsb sign-extends the ROM\noffsets. The\
  \ \"special row\" semantics (field_0x13 of the r0 object) is not\nfurther identified here — see open_questions.\n"
