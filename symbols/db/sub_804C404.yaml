name: sub_804C404
address: '0x0804C404'
kind: function
previous_names: []
status: hypothesis
summary: AI handler dispatcher that reads an AIData state byte and an event index, then tail-calls one of two handler
  routines via an indirect jump table
interface: (r0 = AIData-related pointer/routine derived from byte_804C3F0 entry 0x14*r5->0xc, r1 = event index from
  r5->0x10) -> returns whatever the dispatched handler returns in r0; side effects are entirely the dispatched handler's
details: "- Saves r4-r7 and lr; r7 is loaded with the base address of byte_804C3F0 (a table of 0x14-byte entries).\n\
  \  - Loads r0 = r5->0xc (likely AIData+0xc, \"Unk_0c\" / some sub-state) and indexes into the table with r0*0x14\
  \ to obtain a per-object dispatch context (r7 := &byte_804C3F0 + r0*0x14).\n  - Loads r1 = r5->0x10 (likely AIData+0x10,\
  \ \"Unk_10\" / event id), reads it as an index into off_804C420, which is a 2-entry pointer table whose first\
  \ entry is sub_804C43C and second is sub_804C478 (both taken as Thumb: +1 in the low bit).\n  - Sets lr = pc and\
  \ `bx r0` to tail-call the chosen handler, sharing the same incoming argument contract (and clobbering r0-r3 per\
  \ AAPCS).\n  - Restores r4-r7 and returns via `pop {r4-r7,pc}` exactly once (it is the only normal-path return).\n\
  \  - The two entries in off_804C420 correspond to low/high-event branches; the structure of AIData (Unk_0c, Unk_10)\
  \ strongly suggests an AI sub-routine dispatch on (sub-state, event), with byte_804C3F0 acting as a per-AIData\
  \ key/context cache so that callers can share a generated handler pointer.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `push {r4-r7,lr}` followed by `pop {r4-r7,pc}` at sub_804C404 (asm03_2.s:10386) shows the function
    acts as a router that returns via the dispatch only. - `ldrb r0, [r5,#0xc]` then `mov r1, #0x14; mul r0, r1;
    add r7, r7, r0` produces r7 = byte_804C3F0 + r5->0xc * 0x14, a per-AI-object 0x14-byte slot (matches the project
    struct definition for AIData.Unk_0c being an index into a 0x14-byte table). - `ldrb r1, [r5,#0x10]` reads another
    AIData byte (Unk_10); its value drives the next-table lookup, consistent with an event discriminator in an AI
    dispatch. - `ldr r0, off_804C41C ; ldr r0, [r0,r1]` produces an indexed load through `off_804C420`, a 2-entry
    pointer table whose values are `sub_804C43C+1` and `sub_804C478+1` (Thumb bit set). - `mov lr, pc ; bx r0` is
    the textbook Thumb tail-call idiom using a computed handler address, so this layer adds no logic of its own
    beyond selecting the handler. - off_804C428 = byte_804C3F0 is the 0x14-multiplied table that supplies the second
    argument (passed in r0) to the chosen handler.'
