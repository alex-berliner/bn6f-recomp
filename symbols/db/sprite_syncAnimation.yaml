name: sprite_syncAnimation
address: '0x080A5CF0'
kind: function
status: probable
summary: 'Applies an object''s pending animation change: if the current animation index differs from the
  last applied one, sets it, reloads animation data, and drops the shadow.'
interface: (r5 = object pointer, no args) -> void; flags clobbered by calls
details: Reads the byte at [r5,#5] (current/desired animation index) and compares it to the cached word
  at [r5,#0x34] (last applied animation). If equal, returns without doing anything. Otherwise it saves
  the new index in r4, calls sprite_setAnimation with it in r0 (written into the sprite slot's first byte),
  then sprite_loadAnimationData to load the new animation's frame data, then sprite_noShadow to clear
  the shadow-render flag on the sprite attributes. Finally it stores r4 back to [r5,#0x34] so the change
  is only applied once. Operates entirely through r5, consistent with other sprite_* helpers that take
  the object in a fixed register.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r5,#5] / cmp r0,r1 with r1=[r5,#0x34]: change-detection between current and cached
    animation index; bl sprite_setAnimation with r0 = new index: applies the animation to the sprite slot;
    bl sprite_loadAnimationData then bl sprite_noShadow: reload frames and clear shadow after the change;
    str r4,[r5,#0x34] caches the applied index so the work happens only on change; callees'' known summaries
    (sprite_setAnimation writes slot byte 0, sprite_loadAnimationData loads animation block) match an
    animation-sync role'
