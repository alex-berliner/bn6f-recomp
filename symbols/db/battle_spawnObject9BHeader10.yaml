  on failure, then BasicBattleObjectInitialize, ORs 0x10 into oObjectHeader_Flags, and calls setFieldBattleObject_800F614
  with (object, oBattleObject_Alliance, 1). However, ''InitFlagged'' is misleading since the header flag
