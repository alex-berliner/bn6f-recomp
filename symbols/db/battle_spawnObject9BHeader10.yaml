open_questions:
- Which game object type 0x9B is (needs a type-ID table or a caller)
- Meaning of header flag 0x10 and of the field set to 1 by setFieldBattleObject_800F614
- Why the object pointer is taken from r5 after object_spawnType3 (callee contract not confirmed)
- No known callers; only the beastsp recorded route shows it running
