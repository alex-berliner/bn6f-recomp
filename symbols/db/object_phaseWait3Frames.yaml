name: object_phaseWait3Frames
address: '0x080BD760'
kind: function
status: probable
summary: 'Battle-object phase handler: on first entry plays animation 4 and calls a per-object setup,
  waits 3 frames, then advances the object to phase 4.'
interface: (r5 = battle object) -> void; no return value, flags not meaningful
details: Uses r5 as a battle object struct. If oBattleObject_PhaseInitialized is clear, it sets oBattleObject_CurAnim
  = 4, calls sub_80B8E58 with r0 = [r5, oBattleObject_ExtraVars+8] (an extra-var pointer/word, likely
  the callee's context), sets oBattleObject_Timer = 3, and marks the phase initialized. On every run it
  decrements oBattleObject_Timer; when it reaches 0 it writes 4 to oBattleObject_CurPhaseAndPhaseInitialized,
  which sets the next phase to 4 and clears the initialized flag so the next phase re-runs its init. It
  is thus a short timed transition step (a 3-frame pause) between phase 3 and phase 4 of an object's state
  machine.
