- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb/tst on oBattleObject_PhaseInitialized with one-shot init block setting CurAnim=4 and Timer=3
    (sub_80BD760 prologue); bl sub_80B8E58 with r0=[r5,#oBattleObject_ExtraVars+8] as the only side-effectful
    init call; Timer decrement with ''bgt'' skip, then strh #4 to oBattleObject_CurPhaseAndPhaseInitialized
    to move to phase 4; No callers known, so the phase index it serves (likely 3) is inferred from it
