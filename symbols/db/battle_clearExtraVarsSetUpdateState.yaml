name: battle_clearExtraVarsSetUpdateState
address: '0x080EA278'
kind: function
status: probable
summary: Battle object state handler that zeroes the object's 16-byte ExtraVars area and advances the
  object to its UPDATE state.
interface: (r5 = battle object) -> r0 = CUR_STATE_UPDATE written to oBattleObject_CurStateActionPhaseAndPhaseInitialized;
  ExtraVars[0..0xF] cleared
details: 'This is a battle object state routine: it stores 0 into the four words at oBattleObject_ExtraVars
  (+0, +4, +8, +0xC), wiping whatever per-object scratch/extra variable block the previous state used.
  It then loads CUR_STATE_UPDATE into the combined state/phase field oBattleObject_CurStateActionPhaseAndPhaseInitialized,
  so the object resumes normal update processing on the next tick. Uses r5 as the object base with no
  other register arguments, and returns immediately after the state write (mov pc, lr). Since no callers
  are known, it is presumably referenced from a state-function table for the object type it belongs to.'
