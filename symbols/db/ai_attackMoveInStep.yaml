  date: '2026-10-18'
  detail: first-entry branch writes AttackElement=4 and anim 0x16, then moves FuturePanelX/Y into PanelX/Y
    and zeroes Z (asm start); calls object_setCoordinatesFromPanels and object_updateCollisionPanels after
