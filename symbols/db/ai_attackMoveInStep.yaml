name: ai_attackMoveInStep
address: '0x081063A4'
kind: function
status: probable
summary: Per-frame handler of an enemy AI attack that slides the enemy onto the targeted panel, then after
  a short delay schedules the attack's hit element.
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = scratch/void; updates object fields and sets
  HitElement when the step timer expires
details: 'On first entry (AttackElement == 0) it initializes the attack: sets AttackElement = 4, plays
  animation 0x16, applies the object''s facing via object_getFlip/sprite_setFlip, sets collision region
  1, commits FuturePanelX/Y into PanelX/Y, zeroes Z, recomputes pixel coordinates and syncs the collision
  record, then loads StepTimer = 4. If the attack''s ScratchVar is nonzero it also calls sub_80E8FC8 (unknown,
  likely an effect/sound). On subsequent frames it decrements StepTimer; when it reaches 0 it stores HitElement
  = 0x1C, which presumably makes the generic hit-resolution code apply the attack with element 28.'
