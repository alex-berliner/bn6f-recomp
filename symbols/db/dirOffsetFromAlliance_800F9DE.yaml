name: dirOffsetFromAlliance_800F9DE
address: '0x0800F9DE'
kind: function
status: confirmed
summary: Returns a dy/dx direction offset for a given direction index, remapping the source direction through object_getAllianceDirection.
interface: u32 sub_800F9DE(u32 r0 /* direction index */, u32 r1 /* source direction */, u32 lr) -> (r0 /* dy*alliance_dir
  */, r1 /* dx */); clobbers nz,c,v; preserves r4
details: "Treats the byte table at byte_800FA14 as six signed-byte (dy, dx) pairs indexed by `r0*2`:\n  { 0,0},\
  \ { 0,-1}, { 0, 1}, {-1,0}, { 1,0}, { 0,0}.\nCalls object_getAllianceDirection(r1=src) to obtain an \"alliance\"\
  \ direction value,\nmultiplies that by the looked-up dy, and returns (alliance*dy, dx) in (r0, r1).\nIndex 5 (and\
  \ index 0) collapse to zero offset regardless of alliance transform.\nThe push/pop of r4 only serves to preserve\
  \ r4 across the foreign call; it is not otherwise used.\nNZ flags are set from the returned r0 (mul result), C/V\
  \ cleared by the MULS path.\n"
