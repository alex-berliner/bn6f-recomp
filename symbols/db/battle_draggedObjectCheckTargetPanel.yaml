name: battle_draggedObjectCheckTargetPanel
address: '0x080D1E08'
kind: function
status: probable
summary: 'Gate called for a dragged battle object: finds the actor on a flagged target panel, stores its
  pointer into ExtraVars+0x14; if none, clears the object''s collision region and sets CurState=DESTROY,
  otherwise sets Timer2=5 and CurPhase=4 and tail-calls battle_objectDraggedPhaseHandler.'
interface: (r5 = battle object pointer) -> r0 = garbage from handler call; destroys object or sets Timer2=5
  and phase=4
details: Reads the object's PanelX, PanelY and Alliance and calls the panel-flag/actor lookup, storing
  the found actor pointer into ExtraVars+0x14. If no actor stands on the flagged panel, it clears the
  object's collision region (removing it from collision processing) and sets CurState to CUR_STATE_DESTROY.
  If an actor is found, it sets Timer2=5 and CurPhase=4, then tail-continues into battle_objectDraggedPhaseHandler,
  which drives the subsequent dragged/attack behavior against the stored target. The panel flag likely
  marks the special tile (e.g. target/affected panel type) this dragged object acts on.
