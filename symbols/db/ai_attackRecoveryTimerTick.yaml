name: ai_attackRecoveryTimerTick
address: '0x080F53CA'
kind: function
status: probable
summary: Runs a one-shot countdown (AttackDuration frames) that ends an AI object's attack state via object_exitAttackState,
  using element=4 as the 'timer started' sentinel
interface: (r7 = AI object whose oAIAttackVars are being ticked) -> r0 clobbered; exits attack state when
  timer elapses
details: If oAIAttackVars_AttackElement is 0, writes 4 to it (sentinel meaning 'recovery countdown active')
  and copies oAIAttackVars_AttackDuration into oAIAttackVars_StepTimer, so the first invocation only initializes.
  On later calls it decrements StepTimer each frame; when the decrement hits 0 (bgt not taken), it calls
  object_exitAttackState. The element field is temporarily repurposed as a state flag, so the original
  element value is lost — callers must rely on exitAttackState to restore normal state. No known callers,
  so the tick context (attack state handler) is inferred from the oAIAttackVars fields and the callee.
