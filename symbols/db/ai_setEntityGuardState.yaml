summary: 'Marks an entity as a guard-type object: writes guard id 4 into its state byte and clears its
  timer halfword.'
interface: (r0 = entity/object pointer) -> r0 = none; no flags meaningful
details: Null-checks the pointer, then stores the byte 4 at offset +0x9 and zero to the halfword at +0xA
