name: e_setFlagFromIndexTable
address: '0x080A5E8C'
kind: function
status: probable
summary: Sets a story/event flag whose ID is looked up from a word table using an index stored in the
  caller's struct.
interface: (r5 = struct with u8 index at +4; r0 unused) -> r0 = SetEventFlag result; flags from callee
details: 'Ignores its incoming r0 and instead reads a byte index from [r5,#4], multiplies it by 4, and
  loads a flag ID from the word table at byte_80A5EB8. It then calls SetEventFlag with that ID, marking
  one story-progress flag as set. The struct pointed to by r5 is supplied by the callers (sub_80A5EC8/sub_80A5F84/sub_80A5FD0),
  which all share this ''index selects which flag'' pattern. The table is 4-byte entries despite the byte_
  prefix, since the load uses lsl #2 and ldr. Which flags live in byte_80A5EB8 is not shown here.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r5,#4]; lsl r0,r0,#2 — index taken from caller struct field +4, word-scaled; ldr r1,
    off_80A5EB4; ldr r0,[r1,r0] — flag ID fetched from word table byte_80A5EB8; bl SetEventFlag — the
    only call; sole purpose is flag assignment; three callers (0x080A5EC8/0x080A5F84/0x080A5FD0) all pass
    the struct in r5, never via r0
  refs:
  - bn6f/asm/asm29.s:2254
