name: renderInfo_80017A0
address: '0x080017A0'
kind: function
status: confirmed
summary: Clears the halfword counter at offset 2 of the current toolkit's render info block.
interface: u32 renderInfo_clearCounter_80017A0(Toolkit *toolkit /* r10 */); // returns r1 = 0, clobbers r0 and nz
  flags
details: Loads the render info pointer from toolkit+8 (oToolkit_RenderInfoPtr) and stores 0 as a halfword at renderInfo+2
  (oRenderInfo_Unk_02). No other fields are touched. r1 is left holding 0 on return, which callers presumably ignore;
  r0 is clobbered as a scratch copy of the pointer. Purpose of the field is unknown but, given the naming pattern
  of render-info routines, it is likely a per-frame counter or animation timer that gets reset before rendering.
