details: 'The entire body is `bl sub_811BE9C` followed by `pop {pc}`, i.e. a

  straightforward tail call: the wrapper''s own frame (just lr) is popped and

  control returns directly to the original caller. Whatever sub_811BE9C

  computes is what the caller sees — the wrapper adds no logic, no register

  setup beyond passing r5 through untouched, and no flag changes of its own.

  Since the callee is not shown here, nothing can be said in game terms

  about this function beyond the fact that callers route through this

  alias instead of calling sub_811BE9C directly. The presence of such a

  wrapper usually indicates the two entry points are treated as separate

  symbols (e.g. a public alias or a hook point).

  '
