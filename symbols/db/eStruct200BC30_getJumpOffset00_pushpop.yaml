name: eStruct200BC30_getJumpOffset00_pushpop
address: '0x0803EA68'
kind: function
status: confirmed
summary: Trivial wrapper that pushes lr, calls eStruct200BC30_getJumpOffset00, and returns straight to its own caller,
  passing results through unchanged.
interface: Next eStruct200BC30_getJumpOffset00_pushpop(void); inputs lr (return address), outputs r0, r1, lr (values
  produced by the callee)
details: 'A two-instruction trampoline (plus frame push/pop). It saves lr, bl eStruct200BC30_getJumpOffset00 performs
  the real work, and pop {pc} returns to the original caller rather than back here, so the wrapper is pure pass-through.
  Everything the inner function returns in r0/r1 (and however it sets lr via the tail return) is delivered unchanged;
  the wrapper itself clobbers nothing beyond what the callee does. Semantics in game terms are entirely those of
  eStruct200BC30_getJumpOffset00 — reading "jump offset 00" out of the struct at 0x200BC30 — which this wrapper
  does not alter. The _pushpop suffix in the disassembly''s naming convention marks exactly this idiom: push {lr}
  ... pop {pc} around a single bl.'
