summary: The battle field's panels, 5 rows of 8 (0x20 bytes each, row-major); rows 1-3, columns 1-6 are played on
  (columns 1-3 MegaMan's side, 4-6 the enemy's), the rest a border of type 0.
details: '+0x02 Type (oPanelData_Type) as seen: 0x00 the border, 0x02 normal, 0x03 cracked, 0x04 poison, 0x06 grass;

  +0x03 Alliance (0 MegaMan''s side, 1 the enemy''s, 0xFF the border columns 0 and 7).

  A battle''s starting field comes from its battle-settings entry (byte_80B7214: the poison/grass field of

  the entry at 0x080B7254: types 04/06 across rows 1-3); chips change it during the battle.

  '
