name: battle_initBeastOutForm
address: '0x081184C0'
kind: function
status: probable
summary: 'Initializes a battle object''s beast-out appearance: picks a mode byte based on a cutscene flag,
  resets blending/shader state and loads the navi''s palette.'
interface: (r5 = object struct ptr, r6 = battle object, r0 unused) -> r0 = 0; flags from final callee
details: 'Tests event-flag bit 0x80 via chatbox_mask_eFlags2009F38: if set it stores 1 to [r5], otherwise
  0x23 (35), and clears [r5+0xC] to 0 in either case — so the flag selects one of two form variants/state
  ids. It then sets the sprite to alpha-blend with level 0xA, zeroes the color-shader halfword, calls
  two unknown helpers, and finally looks up the palette from the table at 0x0201DA80 indexed by (r6+0x3A)+(r6+0x38)
  minus 0x90 and applies it. Notably r5 and r6 are never initialized here, so the caller must set up both
  before the call. The beastsp route execution and the palette-offset-table subtraction of 0x90 (navi
  palette range) point at a beast-out/spirit form setup during battle.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'mov r0,#0x80; bl chatbox_mask_eFlags2009F38; bne → strb r4(=1) else 0x23 to [r5]: flag picks
    one of two form states; strb r0,[r5,#0xC] clears a byte field of the r5 struct, then sprite_setAlpha(0xA)
    and sprite_zeroColorShader reset visual effects; bl battleObject_setPaletteFromOffsetTable_81185E4
    applies a per-navi palette derived from r6+0x38/0x3A indices; only callees are sprite/blend/palette
    and two unknown subs; no loops or other game systems touched'
