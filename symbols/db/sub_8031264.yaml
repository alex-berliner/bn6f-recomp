open_questions:
- What the 0x40-byte struct at 02009F5C actually is (looks like a small per-frame controller, not the camera; camera
  pointer is in r0 going in but is reused for the textbox helper too, so it may be the BattleState pointer instead).
- What OR'ing 3 into r12 communicates to the caller — likely "this story3 step finished" + "bit1 = running", but
  without the caller context the bit semantics are guesses.
- Whether sub_8030F04's "0x20,0x20,1" args are frame-coords or per-axis scroll deltas — the callee contract mentions
  "skip update when delta is zero" so the nonzero halves matter; guessing 16.16 0.5 / 0.5 effective motion is consistent.
