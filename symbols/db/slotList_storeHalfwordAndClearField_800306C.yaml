name: slotList_storeHalfwordAndClearField_800306C
address: '0x0800306C'
kind: function
status: confirmed
summary: Uses the high nibble of a selector byte in a table header to pick a 16-byte slot, writes a caller-supplied
  halfword into it, and zeroes a wider field that overruns into the next slot.
interface: void sub_800306C(u16 value /* r0 */, void* table /* r5 */) // tail-calls back to lr; no return value
details: 'r5 points at a record/table whose byte at +2 encodes a slot index in its high nibble (bits 4-7; the code
  masks it to the nibble via lsr/lsl and uses it directly as a byte offset, so each slot is 16 bytes). The computed
  slot base (r5 + index*16) receives: a 16-bit store of r0 at slot+8, and a 32-bit zero store at slot+0x24. Note
  the 0x24 store is not confined to the 16-byte slot - it clears 4 bytes starting 0x24 past the slot base, which
  lands inside the following slot(s); presumably the surrounding data layout makes this intentional (the field at
  +0x24 is shared/overlapping) or callers only use low slot indices. No flags are meaningful on exit; the routine
  returns by moving lr into pc, so it behaves as a tail call. r0 is destroyed (it is reused to hold the zero constant),
  r3 is scratch.

  '
