name: battle_runFacingOffsetCheck_802665A
address: '0x0802665A'
kind: function
status: confirmed
summary: Runs the shared battle facing-offset check against the table at byte_802675A for the current
  actor, then post-processes the result via sub_80265FE.
interface: FacingCheckResult sub_802665A(u32 r4 /* battle context */, u32 r5 /* battle context */, u32
  r6 /* battle context */, u32 r7 /* battle context */) -> r0, r1, r5
details: 'Tiny wrapper of two calls. It first loads r0 with the address of byte_802675A

  (a data table used by battle_checkFacingOffsets) and calls that shared helper,

  which reads the actor/battle state carried in r4-r7 and returns facing/offset

  information in r0, r1 and r5. Those three values are fed straight into

  sub_80265FE, whose r0/r1/r5 outputs are what this function returns to its own

  callers. r2/r3 and all flags (nzcv) end up as scratch because they are whatever

  sub_80265FE leaves behind; r4-r7 are preserved. The function itself holds no

  state - everything lives in the register contract and the byte_802675A table.

  Given the subsystem prefix on the callee, this is part of the battle actor

  facing/direction handling (e.g. checking which panel offsets an actor faces).

  '
