name: battle_findSpecificBossOnOpposingSide_802CA1E
address: '0x0802CA1E'
kind: function
status: confirmed
summary: Scans the four enemy slots on the side opposite to the given side and, if one is a version-2, actor-type-1
  enemy with AI index under 0x14, returns its AI index minus 1, else 0xFF.
interface: u8 battle_findSpecificBossOnOpposingSide_802CA1E(u8 sideIndex /*r0, 0 or 1*/); (reads r10 = toolkit;
  destroys r1 on return, callers ignore it)
details: Computes (sideIndex ^ 1) * 8 + 0x4C as the offset into the battle state (via toolkit->BattleStatePtr at
  oToolkit_BattleStatePtr in r10) to reach the four u16 enemy indices of the opposing side's slot block at offset
  0x4C. For each index it calls GetVerActorTyAndAIIdx_80182B4(enemy_idx), which returns a pointer to a (version,
  actorType, aiIndex) triple. A slot matches when version == 2, actorType == 1, and aiIndex < 0x14; on a match it
  returns aiIndex - 1. If no slot matches after all four, returns 0xFF. The aiIndex - 1 result suggests the AI indices
  1..0x13 in this range encode a specific boss identity/variant being looked up. Note r1 on return still holds the
  last compared field (2 on success), matching the original, but callers ignore it.
