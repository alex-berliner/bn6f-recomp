name: battle_initSceneStart_801E5F8
address: '0x0801E5F8'
kind: function
status: confirmed
summary: Resets the per-battle work area at 0x2035280 and kicks off the battle scene by raising and dispatching
  request bit 0x4000.
interface: sub_801E5F8(void) -> void; inputs r3-r12+lr are pass-through/ignored (r4/r5 saved and restored),
  r0/r1/lr and NZCV clobbered, no meaningful return values
details: 'Initializes fields of the battle state struct eStruct2035280: byte_2035292 = 0, byte_2035293
  = 0xFF, eStruct2035280_NaviStatusGfxIdx17 = 0xFF, byte_2035295 = 0xFF, and word_20352B8 = 0x78 (120,
  likely a screen/timer coordinate for the scene). Then decides the "special rule" flag byte_203529E:
  it becomes 1 only when the GetBattleEffects result does NOT have bit 0x200000 set, the battle mode from
  GetBattleMode is not one of the special modes (1,2,3,4,5,8 - the multiplayer/special battle modes),
  and sub_813BF1C answers non-zero (checked via its Z flag, called last because the checks short-circuit
  and have side effects). Any of those conditions forces byte_203529E = 0 (plain path). Finally it calls
  eStruct2035280_SetRequestBits_801BECC with 0x4000 and dispatch_801DA48 with 0x4000, which hands control
  to the battle scene task/dispatcher to (re)start the scene.

  '
