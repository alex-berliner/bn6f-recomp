name: battleSpawnTimedAttackProjectile
address: '0x080E6924'
kind: function
status: probable
summary: Initializes a battle object, conditionally spawns configured projectile object type 0x77, then
  advances a 30-frame lifetime and ends the object.
interface: (r2 = packed secondary configuration, r5 = battle object) -> r0 = unspecified; flags
details: Runs once when the battle object's phase-initialized flag is clear, marking phase 4. If sub_80E698E
  permits spawning, it combines Param1 with the incoming packed configuration and element, gathers the
  object's damage/variable fields, and calls battle_spawnAndConfigure77. On success it stores the spawned
  object's handle in ExtraVars+8, plays sound effect 0x94, and sets the timer to 0x1E; otherwise it immediately
  sets CurAction to 8. The final timer update and phase cleanup occur on every invocation.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: Assembly lines initialize phase 4 and gate execution with oBattleObject_PhaseInitialized.; Lines
    0x080E692C-0x080E693C pass Param1, packed r2, Element, damage, and ExtraVars to battle_spawnAndConfigure77.;
    The new object handle is written to oBattleObject_ExtraVars+8, followed by PlaySoundEffect(0x94).;
    Timer is set to 0x1E and decremented; reaching zero writes CurAction = 8 and clears CurPhaseAndPhaseInitialized.
