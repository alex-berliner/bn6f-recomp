name: getNextEntryAddress_800AAAE
address: '0x0800AAAE'
kind: function
status: confirmed
summary: Returns the address of entry `r0` (0x20 bytes each) in the Next array at 0x2038170, also leaving the array
  base in r1.
interface: 'u32* getNextEntryAddress(int index) // in: r0 = element index, lr = return; out: r0 = &base[index],
  r1 = base'
details: Trivial indexed-address helper. Computes base + index*0x20 where base is the EWRAM array unk_2038170, returning
  the element pointer in r0. It deliberately also loads the array base into r1 so callers can use r1 as the base
  register for reads/writes on the returned element (common ARM load/store idiom). No flags are set intentionally;
  the mul/add happen to alter nz/c/v, so callers must not rely on incoming flags. The 0x20-byte element type is
  referred to as Next in the verified C; what gameplay object that array holds is not determined here.
