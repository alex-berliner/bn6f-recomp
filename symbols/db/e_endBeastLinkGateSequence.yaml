    PlayMapMusic + ClearEventFlagFromImmediate(EVENT_1722_BEAST_LINK_GATE_RELATED) show a return-to-map
    teardown; resetAllGraphicsState_8005F40 + zeroFill/scenario_initEffectState calls are the standard
