name: e_endBeastLinkGateSequence
address: '0x0812B698'
kind: function
status: probable
summary: Cutscene/scenario state handler that waits for the battle-style sequence tick to finish, then
  resets graphics and game state, restores the PET navi, plays map music, and clears the Beast Link Gate
  event flag.
interface: (r5 = scenario/event state struct, not passed via r0) -> r0 = clobbered; on battle tick nonzero
  returns without doing anything
details: Checks bit 1 of [r5,0x1B] and, if set, writes 4 to eStruct203F7D8+1 (an event/submode byte).
  Calls battle_main_8007800 each frame; if it returns nonzero the handler just returns (sequence still
  running). Otherwise it stores the returned value at [r5,0x22] and dispatches on its value (1, 2, 3,
  or 5 call sub_812B7C4, with 1 also calling sub_812B7E0 — likely per-frame visual/effect updates). Once
  done, it resets all graphics state, zero-fills buffers, reinitializes effect state, writes 0xC to [r5,2]
  (next phase/state id), sets CurPETNavi from [r5,0x1A], reloads navi stat boosts/HP, restarts map music,
  and clears flag EVENT_1722_BEAST_LINK_GATE_RELATED before calling sub_803F798.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl battle_main_8007800 + tst r0,r0/bne means the handler only finalizes when the battle-like
