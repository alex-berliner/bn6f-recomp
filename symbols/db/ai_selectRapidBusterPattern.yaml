name: ai_selectRapidBusterPattern
address: '0x080F0110'
kind: function
status: probable
summary: RNG-selects one of six 3-byte rapid-buster patterns from byte_80F0138, stores its pointer in
  oAIAttackVars_ScratchVar, sets HitElement=4, then jumps to ai_attackRapidBuster.
interface: (r7 = AI attacker object with oAIAttackVars fields) -> r0 = pattern pointer stored in oAIAttackVars_ScratchVar;
  no return value
details: Clears oAIAttackVars_StepTimer, draws a non-negative RNG value and divides by 6 via SWI 6 (Div),
  keeping the remainder in r1; the remainder*3 indexes the 6-entry, 3-byte table at byte_80F0138, and
  the resulting pointer is saved in oAIAttackVars_ScratchVar. It then stores 4 into oAIAttackVars_HitElement
  and tail-ends by calling ai_attackRapidBuster, which presumably consumes the ScratchVar pattern pointer
  while firing up to ~9 buster shots. The table bytes (0xFF/0/1 triples) look like per-shot parameters
  (e.g. element or panel target of each volley).
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'svc 6 after mov r1,#6 with GetPositiveSignedRNG: RNG % 6 selects one of 6 entries; mul r0,r0(=rem),3
    + ldr off_80F0134 -> byte_80F0138: 3-byte records indexed by the roll, stored to oAIAttackVars_ScratchVar;
    strh #4,[r7,#oAIAttackVars_HitElement]: hard-coded element set before the attack; bl ai_attackRapidBuster
    with callee summary ''repeatedly fires buster shots ... then ends the attack''; strh r0,[r7,#oAIAttackVars_StepTimer]
    reset of the attack step counter before entering the state'
  refs:
  - bn6f/asm/asm31.s:121753
  - 0x08001532 GetPositiveSignedRNG
  - 0x080F014C ai_attackRapidBuster
  reproduce: python3 tools/asmcat.py 0x080F0110
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The name and summary fit the assembly: it clears StepTimer, RNGs by 6 via SVC 6, multiplies by 3
    to index byte_80F0138, stores the pointer in oAIAttackVars_ScratchVar, sets HitElement=4, and calls
    ai_attackRapidBuster. However the proposed interface says ''-> r0 = pattern pointer stored in oAIAttackVars_ScratchVar;
    no return value'' is inaccurate — r0 is used as the computed pointer, not returned, and there is no
    return value mentioned as such. Also, the pattern-pick behavior is more ''select'' than ''setup''
    for a function that itself only picks and tail-calls. A tighter name reflecting the dispatch is appropriate.;
    run wf investigate investigate-20261019-003606; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
