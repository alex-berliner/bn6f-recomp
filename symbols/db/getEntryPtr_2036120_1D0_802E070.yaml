name: getEntryPtr_2036120_1D0_802E070
address: '0x0802E070'
kind: function
status: confirmed
summary: Computes the address of entry `r0` of a fixed-stride (0x1D0-byte) record array based at unk_2036120, returning
  it in r0 with the array base in r1.
interface: void* getEntryPtr_2036120_1D0(u32 index /* r0 */); // also leaves r1 = array base (unk_2036120), sets
  NZCV from the final address addition
details: 'Pure address arithmetic helper: r1 is built up as 0xE8 + 0xE8 = 0x1D0, multiplied

  by the entry index in r0, added to the literal base unk_2036120 (in IWRAM), and the

  result is returned in r0. So unk_2036120 is the start of an array of 0x1D0-byte

  records (464 bytes each), and this routine is the standard "get pointer to record

  N" accessor for it. It is tail-called via mov pc, lr, so lr must hold the real

  return address (callers must not call it with bl into a lr-clobbering wrapper).

  Flags are a side effect of the final ADD (offset + base), i.e. carry/overflow from

  address arithmetic - callers per the contract do read nzcv, but these flags carry

  no gameplay meaning. The function does not touch the record contents at all, so

  what the 0x1D0-byte records hold (battle/map object state, entity data, etc.)

  cannot be determined from this routine alone.

  '
