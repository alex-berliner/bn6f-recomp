name: battle_loadModeGfx_801E10E
address: '0x0801E10E'
kind: function
status: confirmed
summary: Queues the battle mode's graphics tiles for DMA unless the battle mode is 6, then sets flag 0x400 in the
  eStruct at 0x2035280 to signal the GFX was prepared.
interface: void sub_801E10E(void)
details: 'Reads the current battle mode via GetBattleMode (result in r0). If the mode is not 6 (skipping the copy
  when it is — mode 6 presumably uses different or already-present tiles), queues a graphics transfer of 0x20 words
  (128 bytes) from the tile data at dword_86E1C78 (in ROM) into the work buffer at unk_3001A80 (EWRAM) via QueueEightWordAlignedGFXTransfer.
  Regardless of mode, it then calls flagSetBits_eStruct2035280_801BEB8 with mask 0x400 (1 << 10), marking bit 10
  of the eStruct''s flag field at 0x2035280 — most likely telling a later update routine that the mode tile buffer
  needs to be (re)uploaded. Preserves r4-r7; clobbers r0-r3, lr, and flags.

  '
