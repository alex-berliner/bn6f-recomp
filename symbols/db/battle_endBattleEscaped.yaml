name: battle_endBattleEscaped
address: '0x0800AAD6'
kind: function
status: probable
summary: Ends the battle by jumping the state machine to phase 0x14 and recording result code 2 (escape/draw)
  in the battle state.
interface: () -> r0 = clobbered; no return value; sets up battle end phase and result byte
details: The function first advances the battle state machine into phase 0x14 via the shared goto-phase
  helper (which also runs its struct-setup step with argument 4), then loads the current BattleState pointer
  from the toolkit and calls the battle-result setter with r0 = 2. setTwoStructs_800A840 stores that byte
  as the battle result and runs the shared battle-result update routine. Result code 2 plausibly denotes
  escaping/withdrawing from a battle rather than win (0) or lose (1). The function takes no arguments
  and returns nothing; r10-relative oToolkit_BattleStatePtr is used to reach the state struct.
