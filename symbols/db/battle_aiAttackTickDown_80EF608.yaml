open_questions:
- Exact semantics of AIAttackVars+0x10 vs 0x12 (frame timer vs sub-timer); could be cooldowns or part
  of an attack-state machine.
- What triggers the caller to invoke this — likely a per-frame AI update tick — would settle by finding
  its single caller.
- r6's role is not touched here; it is just preserved through object_exitAttackState.
