name: battle_aiAttackTickDown_80EF608
address: '0x080EF608'
kind: function
status: confirmed
summary: Per-tick countdown for an AI enemy's attack, ending the attack (clearing the elemental-hit flag and leaving
  the attack state) once the step timer and charge cycles run out.
interface: void battle_aiAttackTickDown(u32 r1_passthrough, BattleObject* object /*r5*/, ObjState* obj_state /*r6*/,
  AIAttackVars* vars /*r7*/); returns the r1 value left by object_exitAttackState (or the incoming r1 on the early-out
  paths); r4/r6/r7 preserved, nzcv clobbered
details: 'Called once per tick while an AI attack is in progress. r7 points to the AI attack variable block. Each
  call decrements oAIAttackVars_StepTimer (halfword); while it is still >0 the routine returns immediately. When
  the step timer hits 0, it decrements oAIAttackVars_ChargeCycles; if charge cycles remain (result != 0), it only
  resets oAIAttackVars_HitElement to 0 for the new cycle. On the tick where the charge counter reaches 0, the attack
  finishes: it calls object_clearFlag with bit 1<<22 (the object''s "elemental hit" / hit-element-active flag) on
  the battle object in r5, then calls object_exitAttackState with r5/r6/r7 pass-through to move the object out of
  its attack state. r1 is unconditionally overwritten on exit by whatever object_exitAttackState leaves (or the
  incoming r1 on early paths), so callers should not rely on any particular r1 value. r5/r6 are never read by this
  function itself except as pass-through arguments to the two object helpers. No branch to loc_80EF620 is taken
  after resetting HitElement (the beq after strh falls through to return, which is required since HitElement reset
  never zeroes flags).'
