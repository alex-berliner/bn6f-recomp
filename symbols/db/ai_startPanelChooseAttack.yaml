name: ai_startPanelChooseAttack
address: '0x080FBE4C'
kind: function
status: probable
summary: 'ProtoMan AI attack setup: installs the panel-choosing callback, derives an attack duration,
  and switches the object into attack state 9.'
interface: (r7 = AI attack vars struct) -> r0 = duration from sub_80FBCF2 stored to oAIAttackVars_AttackDuration;
  registers callback and attack id 9 via object_setAttack4
details: Loads the address of judgemanChoosePanel_80FCCBC and stores it into the AI attack vars struct
  at oAIAttackVars_PanelChooseCallback, so a later panel-selection step uses that callback. Calls sub_80FBCF2
  whose halfword result is written to oAIAttackVars_AttackDuration, i.e. how long this attack phase lasts.
  Then sets the object's attack to id 9 via object_setAttack4 (the setter for attack state/type 4-family).
  All callers are ProtoMan AI steps gated by RNG rolls (& 0xF < 0xC/0xE), consistent with this being one
  branch of a random attack decision.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldr r0, =judgemanChoosePanel_80FCCBC+1; str r0,[r7,#oAIAttackVars_PanelChooseCallback] — installs
    the panel-choose callback; bl sub_80FBCF2; strh r0,[r7,#oAIAttackVars_AttackDuration] — duration computed
    by helper and stored; mov r0,#9; bl object_setAttack4 — switches object into attack mode 9; all four
    callers are ProtoMan AI steps gated by GetPositiveSignedRNG & 0xF rolls, matching a random attack-selection
    branch
