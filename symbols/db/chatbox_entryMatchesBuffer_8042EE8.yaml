name: chatbox_entryMatchesBuffer_8042EE8
address: '0x08042EE8'
kind: function
status: confirmed
summary: Compares a chatbox text-table entry (selected by index) byte-for-byte against a buffer stored
  at +0x4C of a record, returning 1 on full match and 0 on the first mismatch.
interface: u32 chatbox_entryMatchesBuffer(u32 entryIndex, s32 byteCount, u32 recordBase); // r0=entryIndex,
  r1=byteCount, r5=recordBase -> r0=1/0; clobbers flags only
details: 'The function computes byte_8045CCC + (entryIndex * 8) to select one of the 8-byte slots in the
  chatbox text/table data, and points at recordBase+0x4C, a fixed-offset byte buffer inside the caller''s
  record (likely a chatbox/textbox state struct whose text or command bytes live at +0x4C). It then runs
  a do-while loop comparing the two streams byte by byte: on the first unequal byte it returns 0 immediately;
  if all byteCount bytes match it returns 1. Quirk: the loop is do-while (compares one byte before testing
  the counter), so with a count <= 0 it still compares exactly one byte and returns based on that; byteCount
  is treated as signed (bgt). Inputs r1 and r5 are passed through on the stack frame (push/pop r1-r7)
  purely as a save/restore; r1''s output value is the caller''s original. No writes to memory; purely
  a comparison helper. Given the 8-byte stride of the table, entries are probably short text tokens or
  opcode strings rather than full lines.

  '
