name: ai_hitPanelOffsetPattern
address: '0x0810506A'
kind: function
status: probable
summary: 'AI attack: iterates a fixed list of panel offsets relative to the object, damaging every valid
  panel hit.'
interface: (r5 = battle object, r7 = AI attack vars) -> r0 = destroyed; calls object_getFrontDirection/object_isValidPanel/sub_80D07A0
  per panel
details: Loads a panel-offset list from the PanelOffsetListsPointerTable (entry at +0x68, pointing at
  0x8019BE0) and gets the object's facing (+1/-1) via object_getFrontDirection. Base target is (PanelX
  + 2*dir, PanelY); each list entry is a signed-byte pair (dx, dy) applied as x += dx*dir, y += dy, terminated
  by a 0x7F byte. For each resulting (x, y) that passes object_isValidPanel (1-based 6x3 grid), it calls
  sub_80D07A0 with the panel coords, r2 = AIAttackVars_InitFlag, r3 = 0, r4 = packed flags 0x47803, and
  r6 = AIAttackVars_Damage. The mirrored-x application (dx * frontDirection) makes the pattern flip with
  the object's alliance side, like an area nuke sweeping the enemy field.
