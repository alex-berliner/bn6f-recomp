name: getSoulWeaponCursorDir8
address: '0x08142896'
kind: function
status: probable
summary: Returns one of 8 directions pointing from one soul-weapon cursor to another, from their camera-space
  coordinates.
interface: (r0 = first cursor selector, r1 = second cursor selector) -> r0 = 8-way direction index 0..7
  from first cursor to second; clobbers r1-r3, lr
details: Calls GetSoulWeaponCursorCameraCoords twice, once with r0 and once with r1, pushing the first
  (x,y) pair to keep it across the second call. Computes dx = second.x - first.x and dy = -(second.y -
  first.y), then calls calcAngle_800117C (BIOS ArcTan2) to get a 0..255 angle. The angle is rounded to
  16 sectors (add 0x10, lsr 4, and 0xF), halved to 8, decremented, and masked with 7 so the underflow
  wraps -1 to 7. Result is a coarse compass direction between the two cursors, likely for beast-out targeting/aim
  snapping.
