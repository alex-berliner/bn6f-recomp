name: battle_objectStartDestroyState
address: '0x080CDE44'
kind: function
status: probable
summary: 'Tears down a battle object and switches it into the destroy state: releases its collision region
  and panel reserve, fires its destroy events, removes it from the object list, and sets its state to
  CUR_STATE_DESTROY.'
interface: (r5 = battle object pointer, r0 ignored) -> r0 = 0; no flags meaningful
details: Operating on the battle object in r5, it calls object_clearCollisionRegion to vacate the object's
  collision region, then releases the panel the object reserved at its FuturePanelX/Y coordinates via
  object_removePanelReserve. It dispatches the paired destroy sub-event through battle_dispatchDestroyEvents_802EF5C
  and removes the object's entry from the battle-state object list. It then clears bit 2 of oObjectHeader_Flags
  and stores CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized, marking the
  object as entering its destruction phase. The state machine likely calls this (e.g. via a state table)
  rather than direct BL, which explains the absence of known callers.
