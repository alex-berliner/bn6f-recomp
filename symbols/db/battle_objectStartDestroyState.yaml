- method: assembly-reading
  date: '2026-10-18'
  detail: 'Sequence of teardown calls: object_clearCollisionRegion, object_removePanelReserve (with FuturePanelX/Y),
    battle_dispatchDestroyEvents_802EF5C, clearEntryOfBattleStateBattleObjectList_800F656; Final ''mov
    r0, #CUR_STATE_DESTROY; str r0, [r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]'' sets
    the destroy state; Clears bit 2 of oObjectHeader_Flags before the state store, a typical active/present
    flag cleanup'
