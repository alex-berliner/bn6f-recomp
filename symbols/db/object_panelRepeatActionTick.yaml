name: object_panelRepeatActionTick
address: '0x080C7484'
kind: function
status: probable
summary: Per-frame tick that, when its parent object is in action 9 and Param2 is non-zero, counts down
  Timer2 (reloading from Timer when it expires), tries sub_80C776C at a fixed target panel (constants
  0x10 / 0x0F880080), then atomically reserves the panel, runs sub_80C780C there, and releases the reservation;
  phase dispatch via oBattleObject_PhaseInitialized and a Param3 wait for RelatedObject1->CurAction==0xB.
interface: (r5 = battle object, no args) -> r0 clobbered; updates oBattleObject_PhaseInitialized, Timer2,
  Param3
details: 'Dispatches on oBattleObject_PhaseInitialized (1→sub_80C78DC, 2→sub_80C758E which also copies
  Timer into Timer2, 4→sub_80C78F8 which sets Param3=1, 5/other→sub_80C791E which sets Param3=0), then
  clears PhaseInitialized. When Param3 is set it instead watches RelatedObject1''s CurAction and requires
  it to equal 0xB before resetting the phase. Main body: if RelatedObject1->CurAction==9 and Param2!=0,
  decrement Timer2; when it hits 0 reload it from Timer and call sub_80C776C with r2=0x10, r3=0x0F880080
  (packed target coords/offsets from dword_80C751C/20) plus pushed r0/r1; if it succeeds, reserve the
  panel via object_reservePanel, call sub_80C780C with the same arguments, then release the reservation
  via object_removePanelReserve. The reserve→act→unreserve window makes the action atomic against other
  panel claimants.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'state machine on PhaseInitialized values 1/2/4/5 dispatching to four subroutines then clearing
    the byte (loc_80C74AA–80C74CC); repeat loop: Timer2 reloaded from Timer, gated by RelatedObject1->CurAction==9
    and Param2 (80C74D0–80C7514 area); object_reservePanel immediately followed by sub_80C780C then object_removePanelReserve
    with identical r2/r3 args (bl sequence near locret_80C7514); constants dword_80C751C=0x10 and dword_80C7520=0x0F880080
    loaded from off_80C7518 and passed to both helper calls; callees'' known summaries: reservePanel claims
    the panel under an object, removePanelReserve releases it'
  refs:
  - bn6f/asm/asm31.s:33123
  - 0x0801BB46 object_removePanelReserve
  - 0x0801BB1C object_reservePanel
  - 0x080C758E sub_80C758E
  reproduce: python3 tools/asmcat.py 0x080C7484
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal is essentially correct: the dispatch on oBattleObject_PhaseInitialized, the Param2/Timer/Timer2
    countdown, and the reserve→act→unreserve pattern around sub_80C776C/sub_80C780C with the constants
    0x10 and 0x0F880080 match the asm at loc_80C74AA–loc_80C74C4 and loc_80C74D0–loc_80C7514. However,
    the summary''s ''repeatedly (Param2 times, spaced by Timer)'' misreads the code: Param2 is only used
    as a stop-flag (tst/beq), while Timer2 is decremented each frame and reloaded from Timer when it hits
    zero, and Timer is only reloaded from r0 (the initial Timer) once into Timer2 at phase init — there
    is no ''Param2 times'' counting. Also, the Param3 wait loops until RelatedObject1->CurAction becomes
    0xB, which is consistent, though r0,r1 are pushed around the calls rather than ''plus pushed r0/r1''
    being part of the args.; run wf investigate investigate-20261018-200615; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
