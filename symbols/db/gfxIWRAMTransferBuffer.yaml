summary: 'Proposed name: gfxIWRAMTransferBuffer. Shared 32-byte IWRAM staging buffer used while queuing
  0x20-byte graphics chunks to VRAM. (table of what)'
details: This is a shared graphics-transfer staging buffer, not persistent game state. Several render
  helpers queue or permute graphics data into it, then pass it to QueueEightWordAlignedGFXTransfer with
  a fixed length of 0x20 bytes. It is also selected as the destination/paired buffer in graphics-queue
  pointer tables, including a four-buffer table used by the submenu icon code. Its contents are transient
  and are consumed by the queued VRAM transfer.
