summary: Sets a chatbox object's state byte to 0x74 when chatbox event flag 0x80 is not set.
interface: (r5 = chatbox object pointer) -> void; flags preserved
details: Queries chatbox_mask_eFlags2009F38 for mask 0x80. If the mask is clear, writes 0x74 to the first
  byte at the object pointer in r5; otherwise, leaves it unchanged. The function does not explicitly return
  a value and appears to be a small state-transition handler.
