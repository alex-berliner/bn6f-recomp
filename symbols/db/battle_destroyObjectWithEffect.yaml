name: battle_destroyObjectWithEffect
address: '0x080CE05E'
kind: function
status: probable
summary: Tears down a battle object, optionally queueing its destruction effect, then marks it for destruction.
interface: (r5 = battle object, no register args) -> r0 = CUR_STATE_DESTROY stored to object CurState;
  destroys via clearImpactSlot(effect via battle_queueEffectRequest)
details: If oBattleObject_ExtraVars+4 is zero, it simply clears the object's impact-effect slot (battle_clearImpactSlot
  with its Alliance byte) and stores CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized,
  ending the object. If the flag is set, it first checks battle_isTimeStop and skips the effect while
  time is frozen; otherwise it calls sub_80CE0A4, then sub_80E360E with Param1, DamageAndStaminaDamageCounterDisabler,
  ChipID, and RelatedObject1Ptr to get an effect id/parameter, and passes it (with r1=1 and the Alliance
  byte) to battle_queueEffectRequest to spawn the object's removal effect. The impact slot is cleared
  and the destroy state set in both paths. Time-stop gating and the extra flag suggest the effect is purely
  visual and must be suppressed during time-stop (e.g. when the player is paused/deleting).
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: tst of [r5,#oBattleObject_ExtraVars+4] selects effect-vs-no-effect paths, both ending in clearImpactSlot
    + CUR_STATE_DESTROY (loc_80CE098 vs main path); bl battle_isTimeStop ... bne locret_80CE096 skips
    the effect queue while time-stop is active; sub_80E360E called with Param1/DamageAndStaminaDamageCounterDisabler/ChipID/RelatedObject1Ptr,
    result passed as r2 to battle_queueEffectRequest with r1=1; mov r0,#CUR_STATE_DESTROY; str [r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized]
    terminates the object's state machine; callee battle_clearImpactSlot summary says it marks linked
    objects for destruction, matching the teardown role
