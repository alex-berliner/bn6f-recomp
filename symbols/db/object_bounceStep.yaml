name: object_bounceStep
address: '0x080CA88E'
kind: function
status: probable
summary: Battle-object script step that makes an enemy repeatedly bounce (reverse horizontally, or launch
  upward) every 8 frames a fixed number of times, then switch to the next action.
interface: (r0 = ignored, r5 = battle object pointer) -> void; sets CurAction=6 and clears phase when
  finished
details: Runs on a Timer that counts down each call; when it reaches 0 the step fires. It sets collision
  region 1, decrements Param2 (a repeat counter); if bounces remain it reloads Timer=8 and waits again.
  On each fired tick after the last counter check, if Param3 is nonzero it negates XVelocity and XORs
  DirectionFlip (calling object_getFlip/sprite_setFlip to mirror the sprite) — a wall bounce; otherwise
  it stores 0x40000 into ZVelocity — an upward hop. Each fired tick then refreshes collision data via
  object_updateCollisionData(6,5,3), sets CurAction=6 and CurPhaseAndPhaseInitialized=0 to hand control
  to the next action step. Param2 is the bounce count, Param3 selects bounce style (horizontal flip vs.
  vertical jump).
