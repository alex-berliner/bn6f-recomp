name: ereader_updateTimerEnable_8144380
address: '0x08144380'
kind: function
status: confirmed
summary: Refreshes the e-Reader timer-enable flag at 0x200F460 based on the current SIO (link-port) mode, enabling
  it only when the port is in mode "0x8" and the companion flag at +2 is clear.
interface: void sub_8144380(void) // reads SIOControlRegister and eTimerEnable200F460+2; writes eTimerEnable200F460
details: 'Reads the SIO control register, masks it with "0xC", and compares the result to "0x8".

  If the SIO mode is "0x8" AND the byte at eTimerEnable200F460+2 (byte_200F462) is zero,

  the flag byte at eTimerEnable200F460 is set to "0x8" (the mode value); otherwise the

  flag byte is cleared to 0. So the e-Reader timer-enable flag is only armed when the

  link port sits in that specific SIO mode and no overriding condition is flagged in

  byte_200F462. This struct (base 0x200F460) appears to be e-Reader/card-scan state;

  the flag presumably gates a timer used while reading an e-Reader card via the link

  port. Note the mode==0x8 branch stores the masked mode value rather than a plain 1,

  and the +2 byte acts as an inhibit/hold-off flag. Clobbers r0-r2 and flags; tail-returns

  via popped lr.

  '
