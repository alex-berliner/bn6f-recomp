name: TakeItem
address: '0x0803CE08'
kind: function
status: confirmed
summary: Removes r1 items from the toolkit's key-item array slot r0, returning a result code (0=taken, 1=empty,
  2=not enough).
interface: u32 TakeItem(u32 slotIdx /*r0*/, s32 amount /*r1*/, toolkit* tk /*r10*/) -> u32 result /*r0*/; tk->keyItemsPtr
  also returned in r2 and r3
details: 'Operates on the key-item byte array pointed to by oToolkit_KeyItemsPtr within the toolkit

  struct held in r10. Reads the count byte at slot r0, decrements it by r1, and writes the

  result back. Three branches: already zero -> result 1 (no change); sufficient count ->

  result 0 (subtract r1); insufficient count -> result 2 (no change). Returns the result

  code in r0/r3 and the key-items pointer in r2 for the caller''s convenience.

  Quirks: when r1 > count the original byte is left untouched (no clamp to zero); the

  conditional subtract uses a signed comparison. Per the contract, r4-r7 are preserved

  and nz/c/v flags are clobbered.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
