open_questions:
- Exact meaning of entry bytes 0x50 (timer/flag toggle) and 0x54 (invulnerability flag toggle), and whether 0x30
  is a stun/sleep/animation timer reset to 480.
- Whether AIDATA_FLAG_TIMER's name (timer_2000000) implies it actually sets a timer value rather than just a 1-byte
  toggle.
- Identity and semantics of sub_802E1EC ("post-entry-write update") and sub_802D310 ("post-invulnerability follow-up").
- Whether the r2/r3 "outputs" are meaningful leftover values from the last callee or just incidental.
