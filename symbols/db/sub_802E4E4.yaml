name: sub_802E4E4
address: '0x0802E4E4'
kind: function
status: confirmed
summary: Consumes two one-shot AI-data flag triggers (0x02000000 and 0x20000000) for a battle object, applying them
  as a timer-set on its alliance's panel/entry and as an indefinite invulnerability on the object itself.
interface: void sub_802E4E4(u32 /*battle object*/ r5); clobbers nz, c, v, r0, r1, r2, r3, lr; preserves r7
details: "Looks up the object's alliance via oBattleObject_Alliance (r5 -> r0 -> r7), then resolves that alliance\
  \ into an entry pointer through getEntryPtr_2036120_1D0_802E070 (entries are 0x1D0 bytes, table at 0x2036120).\n\
  Reads the per-battle flag word with GetAIData_Unk_44_Flag and tests two specific bits (each consumed once via\
  \ ClearAIData_Unk_44_Flag):\n\n  * Bit 0x02000000 (\"timer_2000000\" in the disassembly): on the entry, sets byte\
  \ 0x50 = 1 and calls sub_802E1EC (post-entry-write update).\n  * Bit 0x20000000: on the entry, sets byte 0x54\
  \ = 1, calls sub_802E1EC, loads the entry's halfword at +0x30 with 0x1E0 (480), grants the object indefinite invulnerability\
  \ via object_setInvulnerableTime(0xFFFF), and finally calls sub_802D310 (post-invulnerability follow-up).\n\n\
  Both branches always run if their bit is set (the second branch is not gated on the first). Entry offsets referenced:\
  \ 0x50, 0x54, 0x30. Uses oBattleObject_Alliance from the battle-object struct.\n"
