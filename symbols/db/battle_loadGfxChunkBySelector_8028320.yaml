name: battle_loadGfxChunkBySelector_8028320
address: '0x08028320'
kind: function
status: confirmed
summary: Queues a chunk of battle graphics into a destination buffer, choosing between a fixed ROM chunk and a table-driven
  chunk based on R7.
interface: void sub_8028320(mut dest r1, arg r2, arg r4, arg r5, arg r6, selector r7); clobbers r0-r3 and nz/c/v,
  preserves r4-r7
details: "Battle graphics loader that fills a destination buffer (R1) with one graphics chunk,\nselected by the\
  \ value in R7:\n\n- R7 == 1: queues an eight-word-aligned GFX transfer (QueueEightWordAlignedGFXTransfer)\n  of\
  \ 0x100 bytes from byte_86E79CC + 0x300 (a chunk inside a ROM graphics blob) into\n  the destination in R1. R0\
  \ is the source, R2 the size.\n- R7 != 1: calls sub_802868C with the data table at byte_802A700 in R0 and selector\n\
  \  R3 = 3 (that helper presumably resolves/queues the chunk), then bumps R1 by 0xC0 —\n  the size of one loaded\
  \ chunk — leaving the ADD's flags set.\n\nR0-R3 and nz/c/v are returned exactly as the last operation leaves them\
  \ (from the\nqueue routine or from the ADDS r1, #0xC0), so callers in the original game appear to\nrely on the\
  \ R1 += 0xC0 carry-out when iterating over several chunks. r4-r7 are\nuntouched (pushed-frame is only lr; r4-r7\
  \ are simply never written).\n"
