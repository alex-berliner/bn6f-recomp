name: ai_scriptStepAttack9
address: '0x080F2A04'
kind: function
status: probable
summary: AI state step that queues attack id 9 for the object and advances the AI script to step 4.
interface: (r6 = enemy/object AI state struct, r7 = AI attack vars struct) -> r0 = 4 (new oAIState_ScriptId);
  no flags meaningful
details: This is a leaf handler in the enemy-AI scripted-attack system. It writes 0xFF to oAIAttackVars_StepTimer
  (a timer/step-duration field, 0xFF likely a special 'no timer' or long-wait value), calls object_setAttack0
  with attack id 9 to make the object start that attack, then stores 4 into oAIState_ScriptId so the AI
  continues at script step 4 afterwards. It only runs from the recorded 'battlesweep' route, i.e. during
  battle AI processing. The actual behavior of attack 9 is determined by object_setAttack0's tables, not
  here.
