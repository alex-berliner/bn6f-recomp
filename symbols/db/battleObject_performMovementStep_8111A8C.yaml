open_questions:
- Exact semantic of `AIAttackVars.Unk_10` / `Unk_12` (slot counter vs. total steps) and why one resync
  is tied to `Unk_10 == Unk_12` rather than every frame.
- Why `CurAnim = 3` is forced only when `Unk_10 == 4` (and not at the snap point) and what animation 3
  corresponds to.
- Meaning of `Unk_1a = 1` and `Unk_00 = 0xc` in the AI state machine would be settled by looking at sub_8111A72.
