name: battleObject_performMovementStep_8111A8C
address: '0x08111A8C'
kind: function
previous_names:
- sub_8111A8C
status: probable
summary: Advances a battle object one frame along an in-progress panel-to-panel move, snapping to its
  destination panel and entering a post-move completion state when the move timer elapses.
interface: (r5 = *BattleObject, r7 = *AIAttackVars) -> void ; mutates r5's X/Y/PanelX/PanelY/CollisionData/ObjectFlags1/CurAnim
  and r7's Unk_10/Unk_1a/Unk_00
details: 'Steps the object''s subpixel world X by adding XVelocity and Y by adding YVelocity (offsets
  0x40/0x44 and

  0x34/0x38), the standard per-frame motion integrator for a battle object.

  When the AI move-tick counter `Unk_10` equals `Unk_12` (the scheduled slot count), it re-derives the

  panel from world coords (`object_setPanelsFromCoordinates`) and refreshes the collision record

  (`object_updateCollisionPanels`), so panel resync only happens on tick boundaries rather than every

  frame.

  When the tick counter is exactly 4 the function sets `CurAnim = 3` (presumably the "settling"/land

  animation), then unconditionally decrements the counter `Unk_10` by one.

  Once `Unk_10` underflows (`sub r0,#1` followed by `bge` not taken), the move has finished: PanelX/Y

  are forced to the previously reserved FuturePanelX/Y, the panel reservation is released

  (`object_removePanelReserve`), world coords are recomputed from the panels

  (`object_setCoordinatesFromPanels`), and the collision copy is refreshed

  (`object_setCollisionPanelsToCurrent`). ObjectFlags1 then has bit 0x40 (OBJECT_FLAGS_CANNOT_SLIDE)

  cleared and bit `1<<19` (`OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT`, the "is currently moving" flag)

  set, marking the object as still moving from this routine''s view while disabling slide interrupts.

  Finally `AIAttackVars.Unk_1a = 1` and `AIAttackVars.Unk_00 = 0xc`, signaling the AI move-state machine

  that the panel step has completed and it should advance to state 0xc.

  The two callees that touch panel reservations/collision panels and the flag mutations together

  characterize a "finish one panel-of-an-AI-driven move" helper, called every frame from

  sub_8111A72 (which holds the move-state machine).

  '
