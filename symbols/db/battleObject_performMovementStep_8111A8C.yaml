    - Final two stores: `mov r0,#1 ; strb r0,[r7,#oAIAttackVars_Unk_1a]` and `mov r0,#0xc ; strh r0,[r7,#oAIAttackVars_Unk_00]`
    flip the AI state to 0xc with a "done" flag. - Only caller is sub_8111A72 (per the callgraph), which
    has the matching `in=[''r5'',''r7'',''lr'']` setup typical of an AI-move tick in the per-frame loop.'
