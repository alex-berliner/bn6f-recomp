    at 0x8111A8E..0x8111A98 performs X+Y integration. - Same pattern against `oBattleObject_YVelocity`/`oBattleObject_Y`
    immediately below shows both axes are integrated. - `ldrh r0,[r7,#oAIAttackVars_Unk_10]` / `ldrh r1,[r7,#oAIAttackVars_Unk_12]`
    then `cmp r0,r1 ; bne loc_8111AAE` gates the panel resync to a specific tick. - Calls to `object_setPanelsFromCoordinates`
    (0x0800e2ac) then `object_updateCollisionPanels` (0x0801a04c) are made only on the tick match. - `cmp
    r0,#4` then `mov r0,#3 ; strb r0,[r5,#oBattleObject_CurAnim]` is the early "play land anim" cue when
    1 frame from finish. - `sub r0,#1 ; strh r0,[r7,#oAIAttackVars_Unk_10] ; bge locret_8111AEA` is the
    per-frame countdown with skip when not done. - On finish, `ldrb r0,[r5,#oBattleObject_FuturePanelX]
    ; strb r0,[r5,#oBattleObject_PanelX]` (same for Y) commits the target panel. - Then `bl object_removePanelReserve`
    (0x0801bb46) followed by `bl object_setCoordinatesFromPanels` and `bl object_setCollisionPanelsToCurrent`
    finalize panel/world alignment. - `mov r0,#0x40 ; bl object_clearFlag` then `mov r0,#1 ; lsl r0,r0,#OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT
