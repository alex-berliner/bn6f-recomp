name: battleObject_performMovementStep_8111A8C
address: '0x08111A8C'
kind: function
status: confirmed
summary: 'Advances a battle object one animation frame: applies velocity, syncs panel/collision data at charge-cycle
  boundaries, sets walk anim at step 4, and on timer expiry commits the move and marks the hit.'
interface: u32 battleObject_performMovementStep(u32 r5 /* object */, u32 r7 /* aiVars */);  /* returns r1 = collision/flag
  result, r5 preserved */
details: "Operates on a battle object (r5) and its AI attack variables (r7).\nEach frame it adds XVelocity/YVelocity\
  \ to X/Y (pixel-space movement).\nWhen StepTimer equals ChargeCycles it calls object_setPanelsFromCoordinates\n\
  and object_updateCollisionPanels to resync grid data mid-animation.\nAt StepTimer==4 it sets CurAnim to 3 (walk\
  \ frame).\nStepTimer is then decremented; while it remains >=0 the function returns.\nOn reaching -1 (timer expired)\
  \ the function finalises the step:\n  - copies FuturePanelX/Y into PanelX/Y (commits the move on the grid),\n\
  \  - calls object_removePanelReserve, object_setCoordinatesFromPanels,\n    object_setCollisionPanelsToCurrent,\n\
  \  - clears flag bit 0x40 (pending-move marker),\n  - sets OBJECT_FLAGS_CURRENTLY_MOVING_1_BIT,\n  - sets aiVars\
  \ HasMoved=1 and HitElement=0xC (0xC likely a \"landed/connected\" element code).\nRegister contract: reads r5\
  \ (object ptr) and r7 (aiVars ptr); returns r1 (result of\nobject_updateCollisionPanels or object_setFlag1); clobbers\
  \ r0/r2/r3, flags, and\npreserves r4/r5/r6. lr is pushed/popped so this is not a tail call.\n"
