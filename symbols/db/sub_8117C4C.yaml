name: sub_8117C4C
address: '0x08117C4C'
kind: function
status: confirmed
summary: Dispatches a sprite's current sub-state handler from a 3-entry jump table and then ticks the sprite with
  the shared sprite_update.
interface: void sprite_runSubStateHandlerAndUpdate_8117C4C(sprite /* r5 */); // returns r2, r3, r5, r10, r11 to
  caller; all flags clobbered
details: 'Entry r5 = pointer to a sprite/object structure; the byte at [r5+9] is a sub-state index (0..2) used to
  select a Thumb handler address from the table at 08117C64 (sub_8117C70, sub_8117C9C, sub_8117CC4). The handler
  is invoked with mov lr, pc; bx r0, so it is entered with r0 = handler address, r1 = sub-state index, lr pointing
  just after the bx (thumb bit set by lr=pc+4), and r5 = sprite pointer. The handler may change r5 (the sprite pointer),
  r10 and r11; r10/r11 are passed through untouched to this function''s caller, and the (possibly new) r5 is fed
  into the tail sprite_update(r5) call, which supplies the r2/r3/r5 outputs the caller reads. lr is used as a scratch
  address register, so the handler must not rely on the return address it is handed. No stack frame besides the
  pushed lr.

  '
