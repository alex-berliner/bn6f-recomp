name: battle_decEntityTimer
address: '0x0800A142'
kind: function
status: probable
summary: Decrements a per-entity byte counter stored in the battle state, indexed by a field of the entity.
interface: (r5 = entity/object pointer) -> r0 = decremented value; r1, r2 clobbered
details: Reads a byte at [r5+0x16] (an entity index or selector), adds 0x12 to form an offset, and loads
  the toolkit's battle state pointer via r10/oToolkit_BattleStatePtr. It then decrements the byte at battleState[0x12
  + index] and stores it back, returning the new value in r0. This looks like ticking down a per-entity
  timer/counter kept in a small array at the start of the battle state. Without callers it is unclear
  which counter this is (custom timers, hitstun, etc.).
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0, [r5,#0x16]; add r0,#0x12 — builds an offset into the battle state from an entity field;
    ldr r1, [r1,#oToolkit_BattleStatePtr] — target is the current battle state struct; sub r2,#1; strb
    r2 — a plain decrement-and-store, no range check or side effects
  refs:
  - bn6f/asm/asm00_1.s:15946
  reproduce: python3 tools/asmcat.py 0x0800A142
