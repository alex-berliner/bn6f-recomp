summary: Stamps the object's 2x2 tile graphic onto the background at (j=1, i=1+i_offset).
interface: 'void sub_803A8B4(u32 i_offset /* r0 */, void *obj /* r5 */);

  // returns r0-r3 and flags as CopyBackgroundTiles left them; r4-r7 preserved;

  // r10 ignored; lr clobbered.

  '
details: "- Calls objectStepTable_803A886 with step 0x1E, param 0x1C to advance object state.\n- Reads byte at obj+0x1E\
  \ to index (×8) into one of two tile-id tables, selected by\n  the flag byte at obj+2: off_803A910 if obj+2 !=\
  \ 0, else off_803A960.\n- Each table entry is 8 bytes; the first word is a *const u16 pointer to tile IDs.\n-\
  \ Invokes CopyBackgroundTiles( j=1, i=1+i_offset, tileBlock32x32=0,\n  tile_ids=table[obj+0x1E], j_size=2, i_size=2\
  \ ) to blit a 2x2 tile graphic\n  onto BG tile block 0.\n- Callee-saved registers r4-r7 are preserved across the\
  \ call (push/pop).\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form\
  \ C allowed; tools/abi/retype_queue.tsv)."
