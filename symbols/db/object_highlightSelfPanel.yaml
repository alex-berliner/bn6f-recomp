name: object_highlightSelfPanel
address: '0x081052FC'
kind: function
status: probable
summary: Highlights the battle object's own panel via object_highlightPanelRegion using its panel X/Y
  and alliance/flip.
interface: (r5 = battle object) -> r0 = result of object_highlightPanelRegion; no other regs touched
details: 'A thin wrapper over object_highlightPanelRegion: it reads oBattleObject_PanelX and oBattleObject_PanelY
  from the object in r5, passes them as r0/r1, sets r2 = 8 (region parameter, meaning not shown by this
  caller alone), and passes oBattleObject_AllianceAndDirectionFlip as r3 so the highlight respects the
  object''s side/flip. It does not modify the object itself. The constant 8 likely selects the highlight''s
  size or style; confirming requires other callers of object_highlightPanelRegion.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_PanelX] / ldrb r1,[r5,#oBattleObject_PanelY] pass the object's own
    panel coords; ldrh r3,[r5,#oBattleObject_AllianceAndDirectionFlip] supplies side/flip for the highlight;
    mov r2,#8 fixed region/style argument to object_highlightPanelRegion; sole callee is the known object_highlightPanelRegion,
    so purpose follows from it
  refs:
  - bn6f/asm/asm31.s:166531
  - 0x08104C94 sub_8104C94
  - 0x0800CCD4 object_highlightPanelRegion
  reproduce: python3 tools/asmcat.py 0x081052FC
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-015108'
open_questions:
- meaning of the r2=8 constant (region type vs size)
- which objects/callsites use this wrapper and when the highlight is triggered
