status: probable
summary: Overworld player helper that clears SlipRun/related story flags when a guard story flag is set,
  otherwise only clears the SlipRun cancel flag unless B is held
interface: '() -> ; side effects: clears story/event flags via ClearEventFlagFromImmediate'
details: "Pushes {lr} only. Tests EVENT_1716 with TestEventFlagFromImmediate; if zero (guard\n  story\
  \ flag NOT set), clears three flags: EVENT_IN_SLIPRUN_STATE, EVENT_173E,\n  EVENT_173F, then returns.\
  \ If EVENT_1716 is set, falls through to read the\n  Toolkit (r10) -> oToolkit_JoypadPtr -> oJoypad_Held\
  \ (u16) and test JOYPAD_B. If\n  B is held, returns immediately; otherwise clears EVENT_173F and returns.\n\
  \  Net effect: when not in the guarded \"slip run\" cutscene path, always wipe the\n  slip-run state;\
  \ when in that path, only wipe EVENT_173F unless the player is\n  holding B (which presumably cancels\
  \ the slip run early).\n  Captured-call exit r0=0x80 across all 40 frames is the return address upper\n\
  \  byte being observed after restoring pc; the function itself writes no caller-\n  visible r0 (contract\
  \ out=[]).\n"
