  - 0x0801A152 object_setFlag1
  - 0x08011714 object_exitAttackState
  reproduce: python3 tools/asmcat.py 0x080F6748
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261018-235109'
open_questions:
- exact meaning of OBJECT_FLAGS_UNK_BIT_22 and animation 4
- which PanelChooseCallback implementations are installed (callers unknown), so the panel-choice strategy
  (e.g. target's panel vs random) is unconfirmed
- whether HitElement=4 means 'none' or a specific element for the dash's hitbox
