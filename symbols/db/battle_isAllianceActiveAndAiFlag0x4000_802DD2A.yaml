name: battle_isAllianceActiveAndAiFlag0x4000_802DD2A
address: '0x0802DD2A'
kind: function
status: confirmed
summary: Returns 1 only when the battle object's navi-stats alliance byte (0x29) is set AND the AI-data flag word
  has bit 0x4000 set, else 0.
interface: 'bool sub_802DD2A(BattleObject* obj /* r0 */); // out: r0 = 0/1, r1/r3 clobbered, flags set by final
  adds r0,r7,#0'
details: 'Pure predicate over two pieces of per-battle state. First it reads navi-stats byte index 0x29 from the
  battle object passed in r0 via GetBattleNaviStatsByte_AllianceFromBattleObject (the caller-visible alliance/ partner
  field); if that byte is zero it returns 0 immediately. Otherwise it calls GetAIDataUnk0x48Flag (a flag word in
  the AI data, addressed around offset 0x48) and tests it against the mask 0x4000 (dword_802DE54). Only when that
  bit is also set does it return 1, and on this success path it leaves the constant 0x2000 in r1 (off_802DE58, an
  original-game leftover with no effect on the result). Both callees are invoked with r7 = 0; r7 doubles as the
  result flag and is saved/restored for the caller. The final Thumb "mov r0, r7" is really "adds r0, r7, #0", so
  the outgoing Z flag also reflects the boolean result (C=0, V=0). Given the alliance byte and a behavior flag,
  this likely gates whether the AI treats the object''s partner/ cross-navi interaction as active for the current
  AI tick.

  '
