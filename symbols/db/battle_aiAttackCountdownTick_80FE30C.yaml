name: battle_aiAttackCountdownTick_80FE30C
address: '0x080FE30C'
kind: function
status: confirmed
summary: 'AI attack countdown tick: on first entry seeds a timer from a stored value, then each tick decrements
  it and on expiry clears the attack animation and exits the attack state.'
interface: 'void sub_80FE30C(u32 r5 /* battle_object */, u32 r7 /* ai_attack_vars */); preserves: -; clobbers: r0
  r2 r3 r6 r7 lr; sets r1 output; flags NZCV clobbered.'
details: 'Operates on an AI-attack control block at [r7] and a battle object at [r5]. On first entry (Unk_01 ==
  0) it sets Unk_01 to 4 and copies the halfword Unk_18 into Unk_10, kicking off the countdown. On subsequent entries
  it decrements Unk_10 each call. Once the decremented timer is no longer > 0, it zeroes the oBattleObject_CurAnim
  field on the battle object and tail-calls object_exitAttackState. Phase flag in Unk_01 gates the seed-once behavior
  so the timer is initialized only the first time this tick handler runs. Touches only the AI attack vars struct
  (fields Unk_01, Unk_10, Unk_18) and the battle object''s CurAnim field; defers attack-state exit to object_exitAttackState.

  '
