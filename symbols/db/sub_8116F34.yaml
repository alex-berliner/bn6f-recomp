name: sub_8116F34
address: '0x08116F34'
kind: function
status: confirmed
summary: Runs one battle object's type-specific update (selected by the kind byte at obj+4) and then updates its
  sprite.
interface: void battle_objectUpdateByKind_8116F34(BattleObject* obj /* r5 */)
details: 'Dispatches a battle object''s per-frame update through a jump table keyed by the byte at obj+4 (the object''s
  update kind, valid values 0..4): kinds 0 and 3 call sub_8116F60, kinds 1 and 4 call battle_objectUpdateWithFieldC_8116F8C,
  and kind 2 calls sub_8116F9C. R5 holds the battle object pointer on entry and is passed through to the handlers.
  For fidelity, each handler is entered with R0 = its own jump-table entry (Thumb | 1) and R1 = kind*4, matching
  the original `mov lr, pc; bx r0` dispatch; after the handler returns, sprite_update is called (via bl) on the
  object and the function returns via the saved LR. A kind byte outside 0..4 would index past jt_8116F4C and jump
  to garbage, but in practice the kind is always 0..4.

  '
