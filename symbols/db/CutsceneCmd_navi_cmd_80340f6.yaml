name: CutsceneCmd_navi_cmd_80340f6
address: '0x080382F2'
kind: function
status: confirmed
summary: Cutscene command handler that runs the "NaviSetup" end-of-section handler on the script state, then advances
  the script pointer to the next command and reports success.
interface: void CutsceneCmd_navi_cmd_80340f6(void) — takes the cutscene script state in r4-r12 (r7 = script pointer);
  returns the callee's r2..r12 passthrough with r7 incremented, sets r0 = 1, and NZ flags from that value
details: 'One-command stub in the cutscene-script interpreter''s command table. It performs

  exactly three steps: (1) tail-ish call to endOfSection_NaviSetup_80340F6, which

  processes the current cutscene/script state and returns its working registers

  (r2-r12) to the interpreter loop; (2) r7 += 1, advancing the cutscene script

  pointer past this command''s byte in the script stream; (3) mov r0, #1, so the

  dispatcher sees a nonzero "command handled / continue" result whose NZ flags the

  caller reads. All callee register outputs are passed through unchanged except

  r7 (incremented) and r0/flags (overwritten with 1). r6 is preserved through the

  whole stub, so it is not part of the script-state contract here. Which concrete

  NaviSetup action runs depends entirely on the state r4-r12 describe; the stub

  itself is stateless.

  '
