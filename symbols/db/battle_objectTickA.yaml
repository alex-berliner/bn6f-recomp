    (self-destruct on hit); teardown chain: bl object_finishCollisionHitReaction_801AD12 / object_spawnCollisionEffect
    / battle_objectTimerCountdown before the hit check; ldr r0, off_80D4798; bl battleObject_dispatchActionHandler_801B394
    — per-object action table with ResetObjectActionState and initAndRunAI entries; tail calls battleObject_tickSpriteAnim_801BC24
    and object_presentCollisionData — the standard per-frame object update tail'
