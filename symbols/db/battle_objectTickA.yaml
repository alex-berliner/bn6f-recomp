name: battle_objectTickA
address: '0x080D4754'
kind: function
status: probable
summary: 'Per-frame tick for a battle object: sets oObjectHeader_Flags bit 1, clears final palette, runs
  collision hit-reaction/effect/timer teardown; if collision data+0x80 flag is set, zeroes HP, stores
  1 and the flag value into ExtraVars, and clears the collision region; then dispatches its CurAction
  from off_80D479C, ticks sprite animation, and refreshes collision data.'
interface: (r5 = battle object pointer, r0-r3 scratch) -> void; sets oObjectHeader_Flags bit 1 (0x2) on
  entry
details: 'Acts as a standard per-frame tick for one battle object: it first sets flag bit 1 in oObjectHeader_Flags
  and calls sprite_clearFinalPalette, then runs the collision wind-down sequence (object_finishCollisionHitReaction,
  object_spawnCollisionEffect, battle_objectTimerCountdown). It reads a halfword at CollisionDataPtr+0x80;
  if that flag is set it zeroes oBattleObject_HP, stores 1 in oBattleObject_ExtraVars and the flag value
  at +4, and calls object_clearCollisionRegion — i.e. the object dies and leaves its collision region
  once it has scored a hit. Finally it dispatches its action-handler table (off_80D479C: a state array
  including battle_ResetObjectActionState and battleObject_initAndRunAI), ticks the sprite animation,
  and runs object_presentCollisionData. The dispatch table is the caller-provided per-object action list,
  so this is a generic tick for this specific object type, not a battle-wide routine.'
