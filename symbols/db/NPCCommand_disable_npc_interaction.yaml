name: NPCCommand_disable_npc_interaction
address: '0x0809EE56'
kind: function
status: confirmed
summary: Overworld NPC script opcode that sets the NPC's "disable interaction" flag so the player can no longer
  talk to/interact with that NPC, then advances the script pointer.
interface: "void NPCCommand_disable_npc_interaction(\n    OverworldNPCObject* r5 /* NPC object */,\n    u32& r6\
  \             /* script instruction pointer, post-incremented */,\n    void* lr            /* return address,\
  \ tail-jumped */\n) /* outputs: r0 = flag bit (1), r1 = updated flags, r6 = next instruction index; NZCV set from\
  \ the r6 increment (add #1), r5/lr preserved */\n"
details: 'This is one opcode handler of the overworld NPC script/bytecode interpreter (hence the "NPCCommand_" prefix
  and the r6 instruction-pointer increment). It reads the NPC object''s 32-bit flags field at offset oOverworldNPCObject_UnkFlags_60,
  ORs in bit 0x1 (OW_NPC_UNK_FLAGS_60_DISABLE_INTERACTION), and writes the result back. Once this bit is set, the
  overworld engine treats the NPC as non-interactive — dialogue/talk checks presumably test this bit and skip the
  NPC. The handler is a leaf routine: it performs the store, increments the script pointer r6 by one command (add
  r6, #1), sets NZCV from that add (so flags reflect the new r6, not the flag logic), and returns via mov pc, lr
  without touching the stack. Side values left in registers: r0 = 1 (the flag bit constant, also usable as the flag
  count/width elsewhere), r1 = the new flags word. The caller''s interpreter loop is expected to consume the updated
  r6.

  '
