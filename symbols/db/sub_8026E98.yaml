name: sub_8026E98
address: '0x08026E98'
kind: function
status: confirmed
summary: Runs one update step for a battle object, dispatching to the handler matching the object's kind byte and
  passing in a battle-effect flag.
interface: void battle_updateObjectByKind_8026E98(S20364C0 *self /* in R5 */); also reads GetBattleEffects() and
  clobbers/sets NZ from the effect check
details: 'Generic per-step entry point for a battle object whose struct pointer is expected in R5

  (struct S20364C0). It queries the global battle effect flags via GetBattleEffects(); if

  effect bit 0x200000 is active, the constant 4 is prepared as a flag argument (R4=4),

  otherwise 0. It then reads the kind byte at self+2 and uses it as an index into the

  handler table at off_8026EBC, which has three entries: kind 0 -> sub_8026EC8,

  kind 4 -> sub_8026F1A, kind 8 -> sub_8026FAA. The handler is called in thumb mode with

  kind in R0, its own thumb pointer in R1, self in R5 and the effect flag in R4. After the

  handler returns, sub_8029C08 is run on the same object (self in R5); this likely does

  shared per-step bookkeeping (position/animation/timer updates). The caller''s R4 is saved

  and restored, so the effect flag lives only for the duration of the two calls.

  Quirk: the NZ flags left before the dispatched call depend on which branch was taken -

  "movs r4, #4" when the effect is present, the TST result (Z set) when absent.

  '
