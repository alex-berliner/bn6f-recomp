open_questions:
- What exactly sub_80D88B8 spawns (projectile, panel effect, custom object) — its body would confirm the
  semantics
- Meaning of the packed r3 = 0x1C0000 argument and whether r4/r6 are read by the callee or caller conventions
- Which enemy/object uses this phase, since no callers are known
