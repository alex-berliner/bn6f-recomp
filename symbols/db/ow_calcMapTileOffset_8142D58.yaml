name: ow_calcMapTileOffset_8142D58
address: '0x08142D58'
kind: function
status: confirmed
summary: Computes a byte offset within the area map tile array by adjusting the current camera offset
  by the signed distance from the tile-grid center.
interface: u32 ow_calcMapTileOffset_8142D58(void) /* reads [eMapTilesState200be70], [unk_2000B40+8]; clobbers
  r0-r2, n, c, v; returns offset in r0; r4-r7, r5, r10, lr preserved */
details: Reads the tile-count byte from the global pointer eMapTilesState200be70 (= 0x200BE70) and the
  camera position byte from unk_2000B40+8 (= 0x2000B48). The position is treated as a signed offset centred
  at 0x80 (128). The magnitude delta is computed, then multiplied by 4*(tileCount−2) to yield a row-stride-scaled
  byte offset. ow_getAreaMapTilesOffset() supplies the current base offset; the result is added to it
  (camera left of centre) or subtracted from it (camera right of centre). All arithmetic wraps in unsigned
  32-bit as the ARM code implies; the subtraction of tileCount by 2 can underflow when tileCount is 0
  or 1, producing a large unsigned multiplier.
