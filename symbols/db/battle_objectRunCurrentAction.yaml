name: battle_objectRunCurrentAction
address: '0x080C1A7C'
kind: function
status: probable
summary: 'Battle object dispatcher: jumps to the per-action handler selected by the object''s CurAction
  field.'
interface: (r5 = battle object) -> tail-calls action handler for oBattleObject_CurAction; handler address
  returned in r0 to caller's bx path
details: Reads the object's current action id from r5+oBattleObject_CurAction and indexes a 10-entry handler
  table at off_80C1A90, then uses the classic 'mov lr, pc; bx r1' trick so the handler's return lands
  on the pop {pc}, effectively a tail call into per-action state logic. The table mixes generic battle
  routines (battle_objectPhasePlaySfxThenEnd, object_wait30FramesThenAction18, object_stateDespawn) with
  object-specific handlers (sub_80C1AEE..sub_80C1DC4). Entry 0 uses battle_objectPhasePlaySfxThenEnd,
  entry 9 is object_stateDespawn, so action 0 likely plays an sfx and ends, action 9 despawns. This is
  the standard per-object action/state update step invoked from the object update loop.
