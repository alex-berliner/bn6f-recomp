name: ai_tryJumpToTargetPanel
address: '0x0810878C'
kind: function
status: probable
summary: 'Enemy-AI attack step: if the object can act, have a callback pick a target panel, reserve it,
  and ''jump'' the object there (anim 4, cannot-slide, hit element 4); otherwise abandon the move.'
interface: (r7 = oAIAttackVars struct for current AI attack, r5 = battle object) -> r0 = 1 in oAIAttackVars_HasMoved
  on success, 0 on failure; no meaningful return value
details: First checks object_canMove; if blocked, clears HasMoved and calls object_exitAttackState. Otherwise
  it loads the TargetObjectPtr and a callback pointer from the AI attack vars, and calls the callback
  with a two-word parameter block (0x10000, 0xF880080) plus the target object; the callback returns a
  panel X/Y in r0/r1 (tst r0,r0 shows nonzero X = valid). On success it writes the chosen panel into TargetPanelX/Y,
  calls object_reservePanel, copies the object's current PanelX/Y into FuturePanelX/Y and reserves that
  panel too, sets OBJECT_FLAGS_CANNOT_SLIDE, sets CurAnim to 4 (a jump/hop), clears AiAttackParam and
  PanelParamFlags2, sets StepTimer to 3, HasMoved to 1, and HitElement to 4. This is one step of a scripted
  enemy attack where the object relocates to a panel chosen at runtime.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_canMove / beq failure path — the step only proceeds if the object is free to act;
    ldr r1,[r7,#oAIAttackVars_PanelChooseCallback]; mov lr,pc; bx r1; strb r0/r1 -> TargetPanelX/Y — callback
    returns chosen panel coords; two object_reservePanel calls plus FuturePanelX/Y stores — claims both
    target and current panels for the move; OBJECT_FLAGS_CANNOT_SLIDE via object_setFlag1 and CurAnim=4
    — object relocates without sliding, using animation 4; failure path sets HasMoved=0 and calls object_exitAttackState
    — clean abort of the attack step
