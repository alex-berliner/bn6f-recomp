name: sub_80CC9AA
address: '0x080CC9AA'
kind: function
status: confirmed
summary: 'Per-step cleanup for a battle object that just collided: tears down live collision data, decrements the
  collision linger timer, and switches the object to its destroy state when the battle ends, an opposing collision
  flag appears, the related object stops its action, or the timer runs out.'
interface: "void sub_80CC9AA(void);\n  // inputs:  r4 r5 r7 r8 r10 lr (r5 = battle object, oBattleObject_*)\n  //\
  \ outputs: r5 r8 (preserved through the call)\n  // clobbers: nz c v r0 r1 r2 r3 lr\n  // preserved: r4 r6 r7\n"
details: "- Reads oBattleObject_CollisionDataPtr -> oCollisionData_FlagsFromCollision and indexes\n  A_byte_80CC9F4\
  \ (an 8-entry table at 0x80CC9F4 holding the values\n  \"0x0, 0x0, 0x80, 0x5, 0x0, 0x0, 0x80, 0xA\") by the object's\
  \ oBattleObject_Alliance\n  multiplied by 4 to detect whether the collision was against the object's side.\n-\
  \ Cross-checks oBattleObject_RelatedObject1Ptr->oBattleObject_CurAction against\n  oBattleObject_ExtraVars + 0xC;\
  \ if the related object moved off that action the\n  collision is considered stale and the object is destroyed.\n\
  - Otherwise decrements oBattleObject_Timer (u16) by 1, keeps\n  object_presentCollisionData active while it stays\
  \ positive, and drops into\n  object_clearCollisionRegion + CUR_STATE_DESTROY via\n  oBattleObject_CurStateActionPhaseAndPhaseInitialized\
  \ when any exit condition fires\n  (battle over, mask match, related-action mismatch, or timer <= 0).\n- Note\
  \ the unconditional `bl object_removeCollisionData; bl object_spawnCollisionEffect`\n  pair at entry is part of\
  \ the standard collision-step bookkeeping even on the destroy\n  branch.\n\nRegister form, old prompt; queued\
  \ for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
