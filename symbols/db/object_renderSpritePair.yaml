name: object_renderSpritePair
address: '0x0802AEB8'
kind: function
status: probable
summary: 'Per-frame render for an object: picks a variant field based on an event flag, runs two sprite-setup
  calls, then queues an OAM entry.'
interface: (r5 = object pointer) -> void; uses r0 as scratch/arg
details: Reads bit 0x80 of eFlags2009F38 via chatbox_mask_eFlags2009F38; when the bit is clear it stores
  the byte 0x24 into [r5,#1], an object field that likely selects a sprite/tile variant (the flag presumably
  switches between two looks). It then calls sub_802B15C twice with r0=0x10 and 0x11, which appear to
  be sprite/part indices, and finally calls object_queueOamEntryFromBase, which queues one OAM entry for
  the object at r5 using the fixed tile base 0xB370 and fixed attribute constants. r5 is not set up inside
  the routine, so the caller must place the object pointer there (typical for this engine's per-object
  render dispatch). The two sub_802B15C calls with consecutive indices suggest drawing two component sprites
  (0x10 and 0x11) before the main queueing step.
