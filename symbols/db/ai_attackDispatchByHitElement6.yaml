summary: 'AI attack trampoline: reads the AI attack var ''HitElement'' from the current object and calls
  one of six per-element attack handlers from a jump table.'
interface: (r7 = AI attack vars struct base, r0 unused on entry) -> tail-calls handler chosen by oAIAttackVars_HitElement;
  r0/r1 clobbered, flags not meaningful
details: Loads oAIAttackVars_HitElement ([r7,#oAIAttackVars_HitElement]) as an index, fetches a Thumb
  pointer from a 6-entry table at off_8115804, and tail-jumps to it via 'mov lr,pc; bx r1'. Entries include
  ai_attackWaitActionFrame and genericAI_exitAttackStateAfterDelay_81097BA, so the table holds AI attack-state
  handlers; the other four are unnamed element-specific attack routines. It is pure dispatch, with no
  state of its own; the HitElement field doubles as the handler selector. Only reached from recorded battlesweep
  routes, i.e. enemy AI attack execution. The 0x0811xxxx address and r7 struct base match the AI/attack
  object convention used by the other known AI handlers.
