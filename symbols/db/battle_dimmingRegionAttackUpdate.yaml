name: battle_dimmingRegionAttackUpdate
address: '0x080BED0C'
kind: function
status: probable
summary: 'Phase handler for an attack object: plays sound 0xB0 and spawns a temp attack visual, then on
  timer 9 places a timestop-safe dimming collision region plus effect on the panel ahead, ending after
  21 frames.'
interface: (r5 = battle object, no args) -> void; sets CurAnim, Timer, PhaseInitialized, and finally CurAction=0x20/phase=0
details: Init branch (PhaseInitialized==0) sets CurAnim=5, plays sound effect 0xB0, and spawns a t1-kind-5
  temp attack object via spawn_t1_0x5_tempAttackObject_80B8E30, storing it in oBattleObject_ExtraVars+4;
  the constant added to 0x10000 is byte_80BEDC6[oBattleObject_Param3] (0x3,0x3,0x19..0x1C for variants
  0-5). At Timer==9 it builds the target panel (PanelX+object_getFrontDirection, PanelY) and calls object_spawnDimmingCollisionRegion
  with a packed parameter word byte_80BEDA8[Param3<<2] (variants pack 1/0xFF/5/4 or 4/0xFF/5/4), the object's
  Element in r2, and r6=oBattleObject_DamageAndStaminaDamageCounterDisabler. The same panel is converted
  to pixel coordinates via object_getCoordinatesForPanels and spawns an effect object with r4 = (object_getFlip<<8)
  + byte_80BEDC0[Param3], setting bit16 when Param3>=2. It also spawns kind-0xA extra-vars object via
  battle_spawnExtraVarsObject with value 0x10A00. Timer increments each frame; once past 0x15 the object
  transitions to CurAction=0x20 with phase cleared.
