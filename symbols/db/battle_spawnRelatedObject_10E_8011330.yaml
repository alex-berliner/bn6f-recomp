name: battle_spawnRelatedObject_10E_8011330
address: '0x08011330'
kind: function
status: confirmed
summary: One-line battle-side stub that spawns a related object with fixed object id 0x10E, forwarding the caller's
  other arguments unchanged.
interface: void sub_8011330(u32 arg1 /*r1*/, u32 arg2 /*r2*/, u32 arg3 /*r3*/, u32 arg5 /*r5*/); // tail-jumps into
  battle_spawnObj56StoreRelatedObject2(0x10E, arg1, arg2, arg3, arg5); results in r4-r7 as left by the callee
details: 'Tiny forwarding wrapper around battle_spawnObj56StoreRelatedObject2. It loads the

  constant 0x10E (an object/behavior id used by that spawner) into r0 and calls the

  spawner with r1, r2, r3 and r5 passed straight through from the caller — it does not

  touch r4, r6 or r7, so whatever values those hold on entry reach the callee too.

  The function is just push {lr} / bl / pop {pc}; all real work happens in the callee,

  which presumably registers object 0x10E in the battle object list and stores the

  related-object linkage the spawner''s name implies. The meaning of id 0x10E in game

  terms (which boss/attack/object it spawns) is not determined from this stub alone;

  it must be identified by looking at battle_spawnObj56StoreRelatedObject2''s dispatch

  table or other users of the same id.

  '
