name: battle_decrementHp
address: '0x08116878'
kind: function
status: probable
summary: Decrements a battle object's HP by 1 if it is still positive
interface: (r0 = battle object pointer) -> r0 = undefined; sets flags from the HP compare
details: Loads the halfword at oBattleObject_HP from the battle object in r0, returns immediately if it
  is zero or negative, otherwise subtracts 1 and stores it back. It acts as a fixed one-point HP drain/tick
  rather than a parameterized damage routine. No other fields are touched and no callees are invoked.
