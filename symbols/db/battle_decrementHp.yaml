name: battle_decrementHp
address: '0x08116878'
kind: function
status: confirmed
summary: Decrements one battle object's HP by 1, leaving it untouched if already 0 or negative.
interface: battle_decrementHp(battleObject r0) -> r1 = HP after decrement (u16 in low bits); flags clobbered (nzcv),
  lr used as return
details: Reads the 16-bit HP field (oBattleObject_HP) of the battle object passed in r0. If the value interpreted
  as signed is <= 0 it is left unchanged; otherwise it is decremented by 1 and written back with a halfword store.
  The new HP is returned in r1 (the value left there after the strh; if no decrement happened, r1 holds the unchanged
  HP read earlier). No other state is touched; callers use the return value to check for death/KO handling. The
  trailing words (0x4000, 0x10000, 0xF880080) are pool data belonging to nearby code, not part of this function.
