summary: Initializes a battle navigation arrow object's sprite and animation state.
interface: (r5 = BattleObjectPtr, r10 = ToolkitPtr, lr) -> void ; sets up sprite sub-record + animation
  for navi arrow
details: 'Sets the object''s sprite attribute byte ([r5]) to 0x23 or 0x43 based on whether the object''s
  type byte

  (r5+4) is non-zero (0x43) or zero (0x23). Calls loc_8002774 with r0=0 (init helper). If r5+4 == 3,

  checks the current PET Navi; if non-zero, overrides the animation index to 8, otherwise keeps r5+4.

  Sets the animation index, loads animation data, disables shadow, configures palette bank 0xd /

  palette index 1 / priority 0, and stores a halfword from off_8116B90 into the slot list

  (selector header word 0x350). Clears the sub-record''s 0xA field, sets r5+8=4 (CUR_STATE_UPDATE)

  and r5+9=0. Sets coordinates (r5+5 flag): if non-zero AND r7+4 == r5+4, uses 0x1e, else 0x16.

  Stores 1 to r5+0xd and 0 to r5+0xc, then tail-dispatches via sprite_dispatchVariantUpdate_8116B9C.

  The captured calls show the function invoked from a story2 cutscene context with entry r0 = +1

  of the function address (tail-call convention), consistent with object "init" dispatchers.

  '
