name: battle_incrementAIDataUnk4c_8014432
address: '0x08014432'
kind: function
previous_names:
- sub_8014432
status: probable
summary: Increments the AIData.Unk_4c counter for the current battle object's AI data.
interface: '(r5 = current BattleObject*) -> r0 = AIData* ; side effect: AIData+0x4c += 1'
details: "Loads the BattleObject's AIDataPtr (offset oBattleObject_AIDataPtr from r5) into r0,\n  reads\
  \ the u32 at offset oAIData_Unk_4c, increments it by one, and stores the result back.\n  Leaves r0 holding\
  \ the AIData pointer so the caller can keep using it. The contract lists\n  no useful return value to\
  \ callers (only callee-saved r5/lr in/out), so it is effectively\n  void from the caller's perspective;\
  \ the may_write of r0/r1/flags in the contract just\n  reflects the side effect of the ldr/str/add sequence,\
  \ not a meaningful return.\n  Called as one of the per-frame AI update steps from battle_runObjectAI_80143FC.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldr r0, [r5,#oBattleObject_AIDataPtr]` loads AIDataPtr from the battle object passed in
    r5. - `ldr r1, [r0,#oAIData_Unk_4c]` reads the Unk_4c u32 from the AIData struct (offset 0x4c per
    AIData.inc). - `add r1, #1` / `str r1, [r0,#oAIData_Unk_4c]` is a straight `*p += 1` on AIData.Unk_4c.
    - Sole caller is battle_runObjectAI_80143FC, which iterates battle objects and runs their AI updates.
    - Captured calls show identical in/out r0 across 40 frames, consistent with a deterministic per-object
    pointer.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x08014432

    '
