name: sub_803AAA0
address: '0x0803AAA0'
kind: function
status: confirmed
summary: 'Handles the Pet Accessory menu''s jack-in attempt: branches on success/failure to play a sound, queue
  a dialog/state message, and write the next state byte to the menu''s state field (r5+1).'
interface: 'void sub_803AAA0(void);

  // inputs: r2 r4 r5 r10 lr

  // outputs: r10

  // clobbers: nz c v r0 r1 r2 r3 lr

  // preserved: r4 r5 r6 r7 r10

  '
details: "Calls sub_803C248 with arg 0x30 (a \"try jack-in\" / compatibility-check helper); if\nit returns zero\
  \ (success path):\n  - Plays SOUND_MENU_SELECT via PlaySoundEffect.\n  - Calls sub_803BB2C with 0x16 (queues the\
  \ success text/dialog entry).\n  - Calls sub_803C0F6 with (0x30, 0x70, 0x20) — likely sets up the success\n  \
  \  animation/parameters for the pet icon (msg ID 0x30, palette/pos 0x70 and 0x20).\n  - Stores 0x18 into *(r5+1)\
  \ — the next state code for the pet-menu state machine.\nIf sub_803C248 returns non-zero (failure path):\n  -\
  \ Plays SOUND_CANT_JACK_IN.\n  - Calls sub_803BB2C with 0x14 (failure text/dialog entry).\n  - Stores 0x1C into\
  \ *(r5+1) — the failure/exit state code.\nr5 is treated as a pointer to a small menu state struct; byte at offset\
  \ +1 is the\ncurrent/next state. The function picks between two follow-up states (0x18 vs 0x1C)\ndepending on\
  \ whether the jack-in attempt succeeded.\n\nRegister form, old prompt; queued for retype (the farm's prompt 6505961c4798,\
  \ register-form C allowed; tools/abi/retype_queue.tsv)."
