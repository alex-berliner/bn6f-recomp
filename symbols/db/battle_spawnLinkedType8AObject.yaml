name: battle_spawnLinkedType8AObject
address: '0x080D68E0'
kind: function
status: probable
summary: Spawns battle object type 0x8A via object_spawnType3 and links it to the source object (r5),
  copying panel X/Y, element, damage word and alliance from the source, writing 1 through RelatedObject1Ptr,
  and setting bit 0x10 in oObjectHeader_Flags.
interface: (r0 = owner/source battle object ptr, r1-r3/r6/r7 = field values incl. panelX, panelY, element,
  damage word, related-object ptr) -> r0 = spawned object ptr or 0; sets Z from spawn success
details: Calls object_spawnType3 with object type 0x8A and the caller-supplied field values. On success
  it stores PanelX, PanelY, Element, the DamageAndStaminaDamageCounterDisabler word and Alliance into
  the new object, apparently mirroring the source object's own values. It stores RelatedObject1Ptr and
  writes byte 1 through that pointer, linking the new object back to its owner. Finally it sets bit 0x10
  in the new object's oObjectHeader_Flags, likely marking it as a linked/child object. Nearby dwords (0xA050001,
  0x2B050001) and byte table suggest the caller (sub_80D65FC, presumably a chip/attack handler) supplies
  fixed type variants. The disassembly listing appears partly mangled (push/pop of r0-r2), so exact argument
  placement is reconstructed from the stores.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'mov r0, #0x8a; bl object_spawnType3 spawns battle object type 0x8A with caller args; strb r1,[r0,#oBattleObject_PanelX]
    / strb r2,...PanelY / strb r3,...Element copy source panel+element into new object; str r6,[r0,#oBattleObject_DamageAndStaminaDamageCounterDisabler]
    and alliance copy mirror source object stats; str r7,[r0,#oBattleObject_RelatedObject1Ptr]; mov r1,#1;
    strb r1,[r7] links new object to owner and flags the owner; oObjectHeader_Flags |= 0x10 marks the
    spawned object with the linked/child flag'
  refs:
  - bn6f/asm/asm31.s:67109
  - 0x080D65FC sub_80D65FC
  - 0x08003358 object_spawnType3
  reproduce: python3 tools/asmcat.py 0x080D68E0
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal gets the basic mechanics right: type 0x8A spawn, mirror panel/element/damage/alliance
    from r5 (the caller/source object), link through RelatedObject1Ptr, and set flag 0x10. However, the
    data at 0x80D690C-0x80D6914 is not ''nearby dwords/byte table'' used by sub_80D65FC; it lives immediately
    after the function and the function has no code path that references it (no pc-relative loads in the
    listing). So claiming they supply ''fixed type variants'' for this function is unsupported by the
    shown code.; run wf investigate investigate-20261019-030611; proposed by Hyper glm-5.3-flash, revised
    by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
open_questions:
- What battle object type 0x8A does (its initializer/behavior) to name it more precisely
- What sub_80D65FC is (likely a chip or enemy attack) and which values it passes in r6/r7
- Exact meaning of the RelatedObject1Ptr byte=1 write and flag 0x10
- 'The proposal gets the basic mechanics right: type 0x8A spawn, mirror panel/element/damage/alliance
  from r5 (the caller/source object), link through RelatedObject1Ptr, and set flag 0x10. However, the
  data at 0x80D690C-0x80D6914 is not ''nearby dwords/byte table'' used by sub_80D65FC; it lives immediately
