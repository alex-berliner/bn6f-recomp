name: checkScrambledCounter_8047366
address: '0x08047366'
kind: function
status: confirmed
summary: Compares a caller-supplied expected value against a scrambled counter field (record+0x30) and reports the
  result only through the flags.
interface: 'void checkScrambledCounter(u32 expected /* r0, preserved */, record *r5) / out: NZCV from cmp(scrambledValue
  - expected); r0-r4 preserved'
details: 'Reads the 32-bit field at [r5+0x30] and bitwise-inverts it first, so a field cleared to zero in memory
  reads as all-ones here (an obvious tamper/corruption marker). The inverted value is packed as: bits 8..27 = a
  20-bit counter, bits 28..31 = a "high" nibble h, bits 0..3 = a "low" nibble l. It then computes counter - ((h
  << 4) | (l ^ h)) and performs cmp against r0, so callers act on the resulting NZCV flags (typically an equality
  check). The wrapper push/pop of r0-r2,r4,lr exists purely so the comparison result survives in the flags while
  all registers are handed back untouched - the function has no register-level return value at all. The h/l nibbles
  act like inline checksum/parity data folded into the same word as the counter, and the (l ^ h) term means the
  low nibble is only meaningful relative to the high one. r5 is not touched or saved, so it is effectively an implicit
  context pointer supplied by every caller.'
