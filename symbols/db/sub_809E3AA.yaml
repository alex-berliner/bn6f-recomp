status: hypothesis
summary: Clears the flag byte at offset 8 of the global struct eStruct2000aa0 (byte_2000AA8), returning that struct's
  address.
interface: 'void sub_809E3AA(void); /* in: lr (return addr); out: r3 = &eStruct2000aa0; clobbers r0, NZ flags */'
details: 'Two-instruction thunk: loads the fixed address of eStruct2000aa0 into r3, then stores 0 into the byte
  at offset +0x8 of that struct (byte_2000AA8) and returns. It does not touch any other field, and it leaves the
  struct pointer in r3, so callers appear to use r3 either as a returned handle or simply as scratch from the load.
  Without knowing what eStruct2000aa0 represents, the in-game meaning of clearing this flag byte is unknown; the
  pattern (zeroing a single state byte of a persistent global) fits a "reset some engine/overlay state flag" helper.'
