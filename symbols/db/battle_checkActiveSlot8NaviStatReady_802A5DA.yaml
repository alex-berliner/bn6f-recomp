name: battle_checkActiveSlot8NaviStatReady_802A5DA
address: '0x0802A5DA'
kind: function
status: confirmed
summary: Returns 1 when active chip slot 8 holds a chip, the battle is a regular mode, and the current navi's stats-table
  byte 0x60 reads 1.
interface: 'bool sub_802A5DA(void); // inputs: r10 = Toolkit*, r4/r6 passed through and preserved; returns r0 =
  0 or 1; clobbers r1, flags'
details: 'Reads the pointer to active chip slot 8 via getLocOfActiveChips_8027E1C(8) and treats a first byte of
  8 as "no chip selected" (immediate return 0). Otherwise it queries GetBattleMode and only proceeds for the regular
  battle modes 0, 5, 8, 0xA and 0xB (excludes other modes such as tutorial/placeholder ones). It then loads the
  battle state from Toolkit.oToolkit_BattleStatePtr, takes BattleState.oBattleState_Unk_0d as an index, and calls
  GetBattleNaviStatsByte(index, 0x60); if that byte equals 1 the function returns 1, else 0. r4 and r6 are pushed/popped
  solely to preserve them for callers. The 0x60 offset into the navi stats table, indexed per battle-state field
  0x0d, looks like a per-navi ability/flag entry (byte 1 = enabled); the exact meaning of that flag is not confirmed.

  '
