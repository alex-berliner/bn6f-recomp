summary: 'Redraws the Internet overworld HUD: PET HP digits, battle-start overlay, and map name.'
interface: '(r0 = self: *S2011E30) -> r0 = destroyed; no return value'
details: 'A 9-instruction dispatcher that takes a single context pointer (r5 in the caller''s comment
  notation) and calls three draw routines in sequence: internet_drawHpDigits_8033E0C to render the navi''s
  HP as 4 OAM digits, battle_drawBattleStartOverlay_8033F80 with r0=1 to conditionally load/queue the
  battle-start overlay frame, and RenderMapName_8033EE8 to draw the map-name text. It allocates no state
  and only forwards the context implicitly via register conventions; r0 is reused for the constant 1 argument
  before the last two calls. Likely called once per frame while in the Internet overworld to refresh layered
  UI elements.'
