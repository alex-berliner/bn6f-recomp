name: npc_resetToStandardState_809F612
address: '0x0809F612'
kind: function
status: confirmed
summary: Puts an overworld NPC back into its standard state after an interaction, restoring its stashed action/movement,
  reselecting its animation unless flag-gated, and clearing the chat-triggered flag.
interface: void npc_resetToStandardState(OverworldNPCObject *npc /* r5 */); callers also pass r4 and lr (r4 unused
  here); returns r0 = 0 with Z/N/C/V set by "mov r0,#0"; r4/r5 preserved
details: 'Called with r5 pointing at an overworld NPC object. Sets CurState (offset 8) to

  NPC_CUR_STATE_STANDARD (4), copies Unk_1d into CurAction (offset 9) and Unk_1e into

  MovementFlag_0a (offset 0x0a) — these look like the action/movement the NPC had

  stashed while it was in a special (talking) state. Then tests UnkFlags_60 (offset 0x60)

  against (0x1000 | 0x0002) ("face player when interacted" among them); if neither bit is

  set, it calls sprite_setAnimation(AnimationSelect) followed by sprite_loadAnimationData

  to restart the NPC''s idle animation — objects with those flag bits presumably handle

  their facing/animation elsewhere. Finally stores 0 into ChatTriggered so the NPC can

  be interacted with again. Ends with r0 = 0 and flags from that mov; returns via

  pop {pc}, so lr is effectively ignored. r4 is passed by every caller but never read —

  likely just caller-side register allocation (e.g. a second object pointer) rather than

  a real argument.

  '
