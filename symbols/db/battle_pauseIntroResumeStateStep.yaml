name: battle_pauseIntroResumeStateStep
address: '0x08009A68'
kind: function
status: confirmed
summary: 'One state-machine step of the battle-intro pause sequence: tells the battle event system to advance (request
  bits 0x404), runs the matching dispatch, refreshes the scene frame, and posts the ''step done'' event.'
interface: 'Next battle_pauseIntroResumeStateStep(void); in: r10, lr (untyped context); out: r2, r3, r5, r8-r12
  (from the final postEvent call); clobbers flags and r0, r1, r4, lr; preserves r5-r7 per the frame''s own convention'
details: Tail of the battle-intro pause handler (presumably dispatched while the intro is paused, e.g. during the
  'pause' that plays before MegaMan appears or during menu-driven pauses of the intro sequence). It calls eStruct2035280_SetRequestBits_801BECC
  with 0x404 to set bits in the battle event/queue struct at 0x2035280 (bit 0x400 plus bit 0x4), immediately calls
  dispatch_801DA48 with the same 0x404 so the just-requested handler runs this frame instead of next frame, then
  calls battle_sceneFrameSetup_801DA24 to recompute/refresh the battle scene frame setup, and finally posts an event
  via battle_eStruct2035280_postEvent_801E0A0 with both arguments 0 — an empty 'no payload' event that signals the
  state step has completed so the intro state machine can move on. The constant 0x404 is loaded from a literal pool
  (off_8009A84). No locals; the function is a straight-line sequence of four calls and returns with pop {pc}. The
  register outputs r2/r3/r5/r8-r12 are purely side effects of the postEvent call (the caller's Next-style ABI funnels
  them through).
