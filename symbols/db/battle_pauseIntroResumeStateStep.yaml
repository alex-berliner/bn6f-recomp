name: battle_pauseIntroResumeStateStep
address: '0x08009A68'
kind: function
status: probable
summary: 'Per-frame handler for the battle state entered after the mid-intro pause: refreshes request
  bits and the battle scene, then posts a null event.'
interface: (no args) -> r0 = 0 after postEvent call; no meaningful return; sets eStruct2035280 request/flag
  dword |= 0x404
details: The function is parameterless and appears to be a BattleState handler invoked each frame while
  the battle state machine sits in the state that follows the intro pause. It ORs the constant 0x404 (bits
  0x4 and 0x400) into the request dword at eStruct2035280+0x40 via eStruct2035280_SetRequestBits_801BECC,
  then passes the same 0x404 to dispatch_801DA48, presumably to run the subsystem handlers matching those
  request bits. It then calls battle_sceneFrameSetup_801DA24, which queues the battle scene's graphics
  transfers and refreshes the stored player battle object pointer. Finally it posts event (0,0) through
  battle_eStruct2035280_postEvent_801E0A0, i.e. an empty/no-op event, likely to signal the state machine
  that nothing further is requested this frame.
