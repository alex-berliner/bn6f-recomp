name: battle_spawnBlockerIfPanelAheadSolid
address: '0x080F7520'
kind: function
status: probable
summary: If the panel one step in front of a battle object is solid, spawns a collision region on it so
  movement into that panel is blocked.
interface: (r0 = battle object, r5 also points to the object) -> r0 = spawn result/0; no meaningful flags
details: Reads the object's facing step from object_getEnemyDirection (player side +1, enemy side -1)
  and adds it to oBattleObject_PanelX, keeping oBattleObject_PanelY as the row. It then tests object_isPanelSolid
  (solid-panel flag 0x10 of the panel parameters) for that adjacent panel. If the panel is solid, it calls
  object_spawnCollisionRegion with the panel coordinates (r0,r1 popped back after the tst), r2=0, r3=0,
  packed region params 0x4050601 (bytes 01 06 05 04, likely offsets/extent and flags), and r7=3 (region
  kind/team). If the panel is not solid, it does nothing and returns. r4/r6/r7 are callee-saved and reused
  for the spawn arguments, so the caller's r5 object pointer is the only real input.
