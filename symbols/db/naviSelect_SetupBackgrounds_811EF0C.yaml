summary: Rebuilds the PET/navi-select screen background by running the individual background setup passes and copying
  the PET and navi-select tile graphics.
interface: void sub_811EF0C(void); // tail-calls via pop {pc}; r0-r3 and flags out are whatever the last callee
  leaves
details: 'No arguments; the meaningful inputs are whatever global state the four setup passes read.

  Sequence: sub_811F1B8, sub_811F214, sub_811F0C8, sub_811F11C (the individual background

  construction passes), then CopyBackgroundTiles_PET_811EF70 and

  CopyBackgroundTiles_onNaviSelect_811F54C, which blit the tile graphics for the PET display

  and the navi select screen respectively. Pure orchestration: no logic of its own, no

  arguments or results; r4-r7 are not touched here (pushed only lr), so the "preserved"

  contract follows from the callees. Ends with pop {pc} returning to the caller.

  '
