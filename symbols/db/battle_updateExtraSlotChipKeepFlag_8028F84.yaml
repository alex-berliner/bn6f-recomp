name: battle_updateExtraSlotChipKeepFlag_8028F84
address: '0x08028F84'
kind: function
status: confirmed
summary: Updates the "chip is still on the field" state byte (offset 7) of active-chip slot 8, keeping it alive
  only while the chip it is linked to in the chip-selection state still has an active slot.
interface: void battle_updateExtraSlotChipKeepFlag_8028F84(void) — inputs r4 (unused here but preserved), r5 (chip-selection
  state pointer), r6/r7 preserved; no meaningful return value; clobbers r0, r1, lr, flags
details: 'Fetches active-chip slot record 8 via getLocOfActiveChips_8027E1C(8). If the record''s first byte (its
  slot number/id) is not 8, or its state byte at +7 is 2 (another handler already claimed it), the function writes
  nothing. Otherwise it decides a 1-byte ''keep'' flag: state 3 forces keep=1; if the selection state (r5) has no
  currently selected chip (byte r5+8 == 0) keep=1; otherwise it reads the slot number mapped at r5+0x47+selected_index,
  looks up that chip''s active slot record, and keep=1 only if that record''s first byte is nonzero (the linked/partner
  chip still occupies a slot). The resulting flag (1 = chip stays, 0 = chip goes) is stored back into slot 8''s
  byte at +7. Structures touched: active-chip slot records (byte 0 = slot id, byte 7 = on-field state flag with
  observed values 0..3) and the chip-selection state at r5 (byte +8 = selected index, table at +0x47 = index-to-partner-slot
  mapping). Quirk: when the slot is empty or the flag is 2, the byte is left untouched rather than being forced
  to a known value.'
