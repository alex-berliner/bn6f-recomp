name: CutsceneCmd_kill_cutscene_process
address: '0x080378EE'
kind: function
status: confirmed
summary: 'Map-script cutscene command "kill cutscene process": replaces one cutscene process slot''s script with
  the dummy (immediately-ending) script, identified by an operand byte in the script.'
interface: 'void CutsceneCmd_kill_cutscene_process(u32 processTable /*r5*/, u32 scriptPos /*r7*/, void* lr); //
  out: r4 = slot index read from the script, r7 = scriptPos+2 (past the operand), r0 = 1 with NZ flags set from
  it; clobbers r0, r6, lr, C, V'
details: 'Implements the cutscene-script opcode that stops a running cutscene process.

  Calls ReadMapScriptByte with the fixed selector 1 in r6 and the current script

  position in r7; ReadMapScriptByte returns the operand byte in r4 (the index of

  the cutscene process slot to kill) and the position after it in r7. The function

  then stores the address of DummyCutsceneScript (a script that ends at once) at

  processTable + slotIndex, i.e. [r5,r4] — pointing that process''s script pointer

  at a no-op script so the process stops running on its next tick. Finally r7 is

  advanced by 2 more (past the operand byte, making the total advance 2 bytes for

  the one-byte operand''s record) and r0 = 1 is returned with NZ flags describing it.

  Touches: DummyCutsceneScript (pooled literal at 8037900), the process table at r5,

  and the script read position in r7.

  '
