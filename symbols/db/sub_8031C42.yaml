name: sub_8031C42
address: '0x08031C42'
kind: function
status: hypothesis
summary: Thin battle-side wrapper that calls helper sub_803172E, then invokes sub_80315DC with a fixed parameter
  block (0, 14, 14, 0) and passes its results on to sub_8031B7C.
interface: void sub_8031C42(int r0, int r5) // r0/r5 forwarded to sub_803172E; returns whatever sub_8031B7C leaves
  in r0/r2/r3/r4/r5 and NZCV
details: "Pure sequencing thunk with no state of its own:\n  1. Calls sub_803172E with the caller's r0 and r5 unchanged.\n\
  \  2. Loads a hardcoded parameter block for sub_80315DC: r2 = 0, r3 = 14 (0xE), r4 = 14 (0xE), r5 = 0.\n     The\
  \ paired 14/14 values look like a size or coordinate pair (e.g. a 14x14 box / extent), but\n     without sub_80315DC's\
  \ meaning this is only a guess.\n  3. Tail-calls sub_8031B7C with whatever sub_80315DC left in r0/r2/r3/r4/r5;\
  \ sub_8031B7C's\n     register and flag outputs are this function's outputs (pop {pc} after bl, so LR-clobbering\n\
  \     is hidden by the tail chain).\nTouches no memory directly; all effects come from the three callees. Register\
  \ contract shows\ncallers only rely on r0/r5 being forwarded and on the outputs surviving from sub_8031B7C.\n"
