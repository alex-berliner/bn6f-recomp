name: battle_tickWhiteFlashBlink_80D45AE
address: '0x080D45AE'
kind: function
status: confirmed
summary: Runs one frame of a battle object's white-flash blink effect (sprite flashes white, blinks three
  times, then hands control back to the action state machine).
interface: 'battle_whiteFlashTick(BattleObject *obj /* r5 */) -> u32 /* r1: 2, or sprite_forceWhitePalette''s
  r1 if it ran */; clobbers r0-r3, flags'
details: "Per-frame handler for a \"flash white and blink\" effect on a battle object, driven by the object's\
  \ action state machine via CurAction/phase. While oBattleObject_Timer has bit 1 (0x2) set, the object's\
  \ sprite is forced to the white palette via sprite_forceWhitePalette (presumably the palette-swap used\
  \ for damage flashes / transformation glows). The 16-bit Timer is then decremented each frame; while\
  \ it is still >0 the function just returns. When the timer expires, the blink counter in oBattleObject_Param3\
  \ is incremented:\n  - counter < 2: queue the next animation frame (CurAnim++) and clear\n    oBattleObject_CurPhaseAndPhaseInitialized,\
  \ so the effect handler runs again on a later\n    frame (the next blink delay presumably comes from\
  \ elsewhere / Param2 scheduling).\n  - counter == 2: same, plus 0x3C (60) frames are added to oBattleObject_Param2,\
  \ scheduling\n    the final blink one second later.\n  - counter > 2: effect finished — CurAction is\
  \ set to 0x0C (next action step) and the\n    phase field is cleared, returning control to the state\
  \ machine.\nQuirk: r1 is loaded with 2 before the palette test and only overwritten if sprite_forceWhitePalette\
  \ actually runs; the caller-visible r1 value is thus 2 in the no-flash case and whatever that callee\
  \ leaves otherwise (likely incidental/unused). The timer is reloaded from memory after the palette call,\
  \ so the callee could in principle alter it.\n"
