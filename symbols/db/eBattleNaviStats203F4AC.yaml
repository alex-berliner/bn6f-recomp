name: eBattleNaviStats203F4AC
address: '0x0203F4AC'
kind: ram
previous_names: []
status: probable
summary: 'Bytes 8.. of the received (loopback) battle link packet: at a battle''s start the Navi stats copied into
  the four battle Navi slots; after it, the battle result record''s reward (u16 item, u16 code) that goes on to
  the result screen.'
details: 'It follows byte_203F4A4 (the packet payload''s first 8 bytes) in the received packet buffer. At the start
  of a battle battle_copyStructsIncludingBattleStats_800b2d8 copies oNaviStats_Size bytes from here into eBattleNaviStats0,
  eBattleNaviStats203CB10, eBattleNaviStats2034A60 and eBattleNaviStats203C9E4. When a battle ends the packet carries
  the 12-byte result record instead (byte_203F4A4 + 0..11), and sub_800B444 copies it to unk_2035260: its word at
  +8, this address, is the reward (low half the item, high half its code), which lands at dword_2035268 and the
  result screen shows.

  '
