name: pet_menuCancel
address: '0x0804AAA4'
kind: function
status: probable
summary: Handles the B (cancel) button in a menu, backing out to the previous screen with a sound and
  fade.
interface: (r0 = scratch, r5 = menu state struct) -> r0 = clobbered; may set state byte 8 and trigger
  screen fade
details: 'On a newly pressed B button, this checks the menu state struct''s field 0x1E: if it is nonzero
  it instead calls sub_804AF20 (an alternate/inner back-out path), otherwise it plays the standard ''unselect''
  sound effect, writes 8 to the state byte at [r5] to switch the menu''s state machine, and calls SetScreenFade(0xC,
  0x10) to fade out toward the previous screen. r5 is an object/state struct owned by the caller sub_804A3FC,
  whose per-state handler this is.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl IsButtonPressed with JOYPAD_B immediately on entry: it is the cancel/back input handler;
    cmp of [r5,#0x1e] selecting between sub_804AF20 and the exit sequence; PlaySoundEffect(SOUND_UNSELECT_68)
    — the menu-cancel sound; strb #8,[r5] followed by SetScreenFade(0xC,0x10) — state change plus fade-out
    to leave the screen'
  refs:
  - bn6f/asm/asm03_2.s:8295
  - 0x0804A3FC sub_804A3FC
