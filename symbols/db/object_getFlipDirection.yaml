name: object_getFlipDirection
address: '0x0800E2CE'
kind: function
status: confirmed
summary: Compares two facing/direction flags and returns -1 if they differ or 1 if they match, used to decide horizontal
  sprite flipping.
interface: int object_getFlipDirection(int dirA /*r0*/, int dirB /*r1*/); returns -1 (flip) or +1 (no flip); NZCV
  set by the final NEG (RSBS 0, r0) on the pre-neg value
details: 'Tiny leaf helper (4 instructions) that XORs the two direction values together, shifts left by 1 (so a
  differing pair yields 2, equal yields 0), subtracts 1 (1 if differing, 0xFFFFFFFF/-1 if equal), then negates to
  produce -1 for differing directions or +1 for matching ones. Callers typically multiply a horizontal scale/flip
  factor by the result so an object''s sprite mirrors when its facing direction differs from a reference direction
  (e.g. the object''s own facing vs. the player''s, or a target''s). No memory is touched; everything happens in
  r0. Flags are a side effect of the NEG instruction and compare 0 against the pre-neg value (N/Z from that value,
  C = borrow, V = overflow), which callers could in principle test but which is usually ignored.

  '
