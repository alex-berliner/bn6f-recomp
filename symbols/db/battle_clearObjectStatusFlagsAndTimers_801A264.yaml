name: battle_clearObjectStatusFlagsAndTimers_801A264
address: '0x0801A264'
kind: function
status: confirmed
summary: Clears a battle object's status/affliction flags in both flag words and zeroes all of its collision status
  timers (blind, etc.).
interface: void sub_801A264(BattleObject* r5); /* sets r0=0 and Z on return; clobbers r0-r3, lr */
details: 'Takes a battle object pointer in r5. Loads the object''s CollisionDataPtr (offset oBattleObject_CollisionDataPtr)
  and, via object_clearFlag/object_clearFlag2, clears the status bits "0x8001E800" in the first flag word and "0x000300E8"
  in the second — these look like a mask of status-affliction flags (e.g. blind/confusion-style conditions) rather
  than one flag. Then stores 0 into six halfword timer fields of the collision data: oCollisionData_Unk_1c, _1e,
  BlindTimer, _22, _2a, _2c, resetting all active status countdowns (the BlindTimer field confirms blind is among
  them). Leaves r0 = 0 (so Z is set) and r3 pointing at the collision data; callers only need r5. This is the "remove
  all status conditions" routine, likely called when a battle ends/round resets or an object is cleansed.

  '
