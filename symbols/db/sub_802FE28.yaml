name: sub_802FE28
address: '0x0802FE28'
kind: function
status: confirmed
summary: Thumb→ARM tail-call trampoline that forwards r0–r3 and lr into sprite_queueOamEntry and returns straight
  to this function's caller.
interface: "void sub_802FE28(u32 r0, u32 r1, u32 r2, u32 r3);   // lr = caller return\n  // preserved: r4, r5, r6,\
  \ r7\n  // clobbers : NZCV (flags), r0, r4–r7, lr via tail call\n  // tail-calls sprite_queueOamEntry (ARM, +1)\
  \ with identical r0..r3 and lr\n"
details: 'The body is a three-vertex switch-thunk: load off_802FE34 (= sprite_queueOamEntry+1, the

  ARM entry with the Thumb bit set), set LR = PC so sprite_queueOamEntry''s `pop {pc}`

  returns directly to sub_802FE28''s caller, then BX r4. No local stack frame is allocated

  and no registers other than the forwarded argument set are modified before the jump.

  Used as a Thumb-side entry point so callers compiled in Thumb can invoke the ARM-mode

  sprite_queueOamEntry without each emitting their own `bx`/lr-setup sequence. Only the

  out-of-line 32-bit pointer off_802FE34 distinguishes it from a plain tail call.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
