name: battle_aiChargeAttackUpdate
address: '0x080F308E'
kind: function
status: probable
summary: 'Per-frame AI attack handler: starts an element-4 attack (30-frame charge with anim 0xF), then
  flags the hit via HitElement=0x10 when the charge expires.'
interface: (r0 = unused, r7 = oAIAttackVars struct, r5 = battle object) -> r0 = clobbered; no flags used
  by caller shown
details: 'Called each frame of an AI attack state. If oAIAttackVars_AttackElement (r7) is still 0, it
  ''begins'' the attack: writes element 4 to AttackElement, sets the battle object''s CurAnim (r5) to
  0xF, and stores 30 in StepTimer. On later frames it decrements StepTimer; once it reaches zero it stores
  0x10 into oAIAttackVars_HitElement, presumably signaling the attack''s hit/impact for another handler.
  The 0 element test doubles as a ''not started yet'' state marker, since element 0 is written back untouched
  when already in progress.'
