summary: Marks a battle object's turn as completed and resets its command/action state.
interface: void sub_803A878(void *battle_obj); // r5 in -> r0 out (nz, value 4)
details: "Operates on a battle object passed implicitly in r5. Writes three byte fields:\n- [r5+0x1F] := 1   (turnActed\
  \ flag - marks that this combatant has already\n                  taken its turn this round, preventing another\
  \ action).\n- [r5+0x1D] := 0   (command byte - clears any pending/queued command).\n- [r5+0x02] := 4   (actionState\
  \ - transitions the battle object into state 4,\n                  typically the post-action / \"wait\" or end-of-turn\
  \ phase).\nReturns r0 = 4 (non-zero) so the caller sees NZ, often used as a \"success /\nstate changed\" signal.\
  \ Likely invoked at the end of a panel resolution,\nattack, or other action routine to wind down the current actor\
  \ before the\nbattle engine advances to the next turn.\n\nRegister form, old prompt; queued for retype (the farm's\
  \ prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
