  mean semantically
- what the five phase handlers sub_810E928..sub_810EA3E do to identify the object type
- 'The structure matches the proposal: early-return on time-stop/pause, alt branch on flag 0x40000000,
  dispatch via 5-entry table at off_810E914, and fall back to battle_objectUpdateDispatchPhase_80165C2
  when [ExtraVars+8]!=0. The name is decent but ''AltPhaseTable'' misleads since the 5-entry table is
  the *primary* path; only the 0x40000000 branch is ''alt''. ''CustomPhaseTable'' or just ''PhaseHandlerTable''
