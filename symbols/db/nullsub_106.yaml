name: nullsub_106
address: '0x080F28C0'
kind: function
status: confirmed
summary: Empty placeholder function; tail-calls its adapter and immediately returns to the caller.
interface: 'void nullsub_106(void); // inputs: lr; outputs: -; clobbers: -; preserved: -'
details: A no-op stub at 0x080F28C0 that performs no work and returns immediately. Its body simply moves pc <- lr.
  The implementation expands into a trivial call to nullsub_106_impl() followed by RETURN_TO_CALLER(), preserving
  the original register contract (no I/O, no clobbers). It is immediately followed in ROM by byte_80F28C4 (an 8-byte
  table), byte_80F28CC (a multi-record structure table, ~28 bytes), byte_80F28F0 (a 162-byte palette/tile-like table
  of 0xFF bytes with sparse 0x34, 0xB1, 0x9F, 0xA9 entries), and off_80F29B0 (a Thumb jump table of 10 function
  pointers, each stored as address+1 for Thumb mode). Those tables are unrelated to this function's behavior; they
  only sit adjacent in the same 16-byte-aligned block.
