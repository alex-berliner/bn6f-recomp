name: battleObject_respawn_80D84DE
address: '0x080D84DE'
kind: function
status: confirmed
summary: Respawn / reinitialize a battle object (mark hidden, reset palette/HP, install standard per-state
  handlers, refresh collision and timestop sprite).
interface: 'void battleObject_respawn_80D84DE(void);  /* in: r2 r4 r5 r8 r9 r10 r11 r12 lr; out: r5 r8
  r9 r10 r11 r12; clobbers nz c v r0 r1 r2 r3 r4 lr; preserves r6 r7 */'
details: "Operates on the battle object pointed to by r5 (oObjectHeader / oBattleObject).\n- ORs 0x02\
  \ into the byte at r5+oObjectHeader_Flags (hidden/respawn flag), updating NZ.\n- Calls sprite_clearFinalPalette\
  \ and sub_801AD9E (generic post-death hook).\n- Writes HP = 1 as a u16 at r5+oBattleObject_HP.\n- Loads\
  \ pointer off_80D8504 (= off_80D8508) and calls sub_801B394 with it; the\n  table at off_80D8508 is\
  \ the standard per-state handler set:\n    sub_80D852C, battle_ResetObjectActionState_80165B8, sub_80D855C,\n\
  \    sub_80166AE, sub_8016B02, sub_8017E26, sub_8016B36, sub_8016B72, sub_80D8558\n  (each entry stored\
  \ with the +1 Thumb bit set, hence the +1 in the table).\n- Refreshes collision data via object_presentCollisionData\
  \ and timestop sprite\n  bookkeeping via object_updateSpriteTimestop.\nFunction is a leaf-ish tail:\
  \ pushes LR, bl's all helpers, pops {pc}.\n\nRegister form, old prompt; queued for retype (the farm's\
  \ prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
