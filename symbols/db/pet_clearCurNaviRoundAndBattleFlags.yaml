name: pet_clearCurNaviRoundAndBattleFlags
address: '0x0813CD30'
kind: function
status: probable
summary: Clears the selected Navi's round-control byte and adjacent byte 0x13 in PET NaviStats.
interface: (r0 = unused, r1 = unused, r2 = 4, r3 = ...) -> r0 = ...; flags ...
details: Calls pet_initCurNaviStatsRoundControl, which initializes the selected Navi's NaviStats offset
  0x12 to zero with a 3-byte write. It then sets r2 to 4 and calls pet_clearCurNaviStatsByte19, whose
  documented behavior writes zero to offset 0x13. The function therefore clears two adjacent round/battle-state
  fields in the selected Navi's stats record. Its return value is unspecified because it only performs
  the calls and returns through the saved link register.
