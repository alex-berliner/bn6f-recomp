name: ow_tryJackIn
address: '0x08028E04'
kind: function
status: probable
summary: Attempts to jack into a linked overworld object, playing a select sound and starting the jack-in
  state on success or a buzz and returning 1 on failure.
interface: (r4 = pointer to object/trigger struct, r5 = task context struct) -> r0 = 0 if accepted, 1
  if refused; no flags of interest
details: 'Reads a byte at [r4] (an object type/id) and, when it equals 9, rewinds r4 by 12 bytes to reach
  the real struct base, implying a 12-byte object record. The gate is byte [r4+7]: if it is 0 the function
  plays SOUND_MENU_SELECT, stores 0x38 into [r5+1] (the caller task''s next state/mode byte) and clears
  the halfword at [r5+2] (likely a timer/counter), returning 0. If [r4+7] is nonzero it plays SOUND_CANT_JACK_IN
  and returns 1, leaving the context untouched. So [r4+7] acts as a ''cannot jack in / occupied'' flag
  on the target object. Without callers the meaning of the type-9 self-pointer adjustment and what 0x38
  is in the r5 state machine remain unverified.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'cmp r1,#9 / sub r4,#0xC at 8028E08-E0D: pointer base shifts for object type 9; ldrb r0,[r4,#7]
    / bne at 8028E0E-1814: byte+7 is the only accept/reject gate; PlaySoundEffect(SOUND_MENU_SELECT) on
    accept vs PlaySoundEffect(SOUND_CANT_JACK_IN) on reject; strb 0x38,[r5,#1] and strh 0,[r5,#2] only
    on accept: writes next-state and resets counter in caller''s context; return r0=0 vs 1 matches sound
    outcome, a pass/fail attempt routine'
