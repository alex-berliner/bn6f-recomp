summary: LZ-compressed NPC text archive of the Oxygen Tank Comp (map 0x8D/0x0A, slot 4), with the Virus Battle Machine
  V4 Mr. Prog whose repeat prize is a 50/50 random branch (F0) between 2000 Zenny and 8 BugFrags.
details: 'Data, not code: dat38_87.s includes it as an .incbin of data/textscript/compressed/CompText87A3180.s.lz,

  built from the readable source data/textscript/compressed/CompText87A3180.s (size word 0x7ED00, then the

  archive).


  Use: its only reference is entry 4 of off_8045004 (chatbox.s:10067), the five-archive list of internet map

  group 0x8D map 0x0A (off_internet_80444C4 entry 13 = off_8044EFC, whose entry 10 is off_8045004; entries 0-3

  are EmptyCompText87A3168/EmptyCompText87A3174). GameAreas.inc names group 0x8D COMPS_2 and its map 0x0A

  OXYGEN_TANK_COMP, which fits the text ("THIS OXYGEN TANK IS FOR EMERGENCIES ONLY,"). Entry 4 is what

  chatbox_selectCompTextByMap_80407C8 (fixed index 4) returns; chatbox_uncompMapTextArchives_803FD08

  decompresses it into eDecompressedTextArchive202FA00 at map load, the buffer NPC scripts point their text at

  (byte_202FA04, NPCCommand_set_text_script_index_and_ptr_to_decomp_buffer). So this is the map''s NPC text.


  Contents: unk0/unk1 (mugshot 0x3C, the oxygen tank program; unk1 is the dropped memo pad with "729"), and the

  "VIRUS BATTLE MACHINE V4" (mugshot 0x5E): unk10 offers 10 consecutive virus battles, unk11 starts them,

  unk12 (sets EVENT_1D7) and unk14 handle a win, unk13 a loss, unk17 explains the rules. The first win

  (unk14, EVENT_1EF clear) gives a navi customizer program and sets EVENT_1EF; later wins go to unk15, which

  opens with `ts_jump_random 0x41, 0x20, 0x20, 0xFF, 0x10`: text opcode F0 0x41, two weights 0x20, targets 0xFF

  (go on: gives 2000 Zenny) and script 0x10 = unk16 (gives 8 BugFrags). The handler chatbox_F0_jump draws

  (iCurrFrame & 3) + 2 GetRNG values and takes (r & 0x3FF) % 64, so it is exactly 50/50 for uniform r; bit 7

  of 0x41 is clear, so EVENT_1709 plays no part. This is the only F0 in the archive.

  '
