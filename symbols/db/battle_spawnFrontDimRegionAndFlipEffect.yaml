name: battle_spawnFrontDimRegionAndFlipEffect
address: '0x080BA31C'
kind: function
status: probable
summary: Spawns a timestop-surviving dim collision region on the object's front panel, and spawns a flip-aware
  effect at the front panel coords.
interface: (r5 = battle object; no stack args) -> r0 = spawned effect object pointer
details: Uses r5 as an oBattleObject (set up by the caller). It calls object_getFrontDirection, adds the
  object's PanelX to get the front panel column, and with PanelY, Element, a=0x700FF04 (likely a hit/damage
  mask or region type) and 0x3, calls object_spawnDimmingCollisionRegion to create a collision region
  that keeps running during timestop. It then reads object_getFlip, computes effect id 0x39 + flip<<8,
  converts the same front-panel column/row to screen coordinates via object_getCoordinatesForPanels, and
  spawns a type-4 effect object (effect type 0, param 0x39<<8|flip? actually flip<<8 | 0x39 in r4) at
  that position. The flip argument makes the effect animation mirror according to the object's facing.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r1,[r5,#oBattleObject_PanelX] after bl object_getFrontDirection: target is the panel in
    front of r5''s object; r4=0x700FF04, r7=3 then bl object_spawnDimmingCollisionRegion: spawns the special
    dimming region with those parameters; mov r0,#0x39; add r4,r4,r0 after object_getFlip: effect id 0x39
    combined with the object''s horizontal facing; bl object_getCoordinatesForPanels then bl spawn_t1_0x0_EffectObject:
    renders the effect at the front panel''s screen position; caller 0x080BA152 sets r5 context (function
    reads oBattleObject fields from r5 only)'
