    — The code matches: object_spawnDimmingCollisionRegion is called with the front panel coords and 0x700FF04/0x3,
    and spawn_t1_0x0_EffectObject is called with a 0x39 effect id modified by flip. However the region
    is spawned on the *front* panel, not in front of ''the object'' generically, and the summary''s ''facing-aware
