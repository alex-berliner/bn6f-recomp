name: battle_initShipSprite_80CAF14
address: '0x080CAF14'
kind: function
status: confirmed
summary: 'Initializes a battle-ship sprite: positions it on the front row, loads its graphics, sets the
  idle animation, copies param1-indexed extra variables from constant tables, and transitions the object
  to the update phase.'
interface: battle_initShipSprite_80CAF14(r5 *battleObject) -> r0 = CUR_STATE_UPDATE(4), r1 = extraVar2,
  flags = nzcv
details: State-phase init callback for a ship battle object (r5). Calls object_setCoordinatesFromPanels,
  then object_getFrontDirection; multiplies the result by 0x140000 and adds it to oBattleObject_X, placing
  the ship one unit ahead along the front row. Sets oBattleObject_Z to 0x280000 (fixed altitude). Loads
  sprite 0x80 at layer 8, priority 0xD via sprite_load, then disables its shadow. Sets bit 1 (OBJ_FLAG_ACTIVE)
  in oObjectHeader_Flags. Assigns animation 0x16 to both oBattleObject_CurAnim and CurAnimCopy, loads
  animation data, sets palette 0, and propagates the object's horizontal flip to the sprite. Indexes two
  4-entry word tables (byte_80CAF78 and byte_80CAF8C) by (oBattleObject_Param1 << 2); both tables currently
  hold identical values across all four slots (0x23 and 0xFFFF9000 respectively), so the param1 selection
  has no visible effect in this build. Stores the two retrieved words into oBattleObject_ExtraVars[0]
  and [1]. Finally writes CUR_STATE_UPDATE (4) into oBattleObject_CurStateActionPhaseAndPhaseInitialized,
  moving the object into its per-frame update phase. r4 is read by callee conventions of the object/sprite
  helpers but is not manipulated here.
