name: battleObject_updateAnimAndState_801CADC
address: '0x0801CADC'
kind: function
previous_names:
- sub_801CADC
status: probable
summary: 'Battle-object per-frame anim/state update: refreshes CurAnim when NegaWisp (id 0x29) flag set,
  ticks a future-panel timer/anim, and dispatches to either sub_801CC34 or battle_updateObjectAnim_801CB38.'
interface: '(r5 = BattleObject*, r10 = Toolkit*) -> void ; side effects: writes r5+0x14/0x15/0x1f, calls
  GetBattleNaviStatsByte/sub_801CC34/battle_updateObjectAnim_801CB38/sub_801CC94'
details: "- Prologue pushes only lr; callee-saved r4/r5/r6/r7/r10 are live through, so this is invoked\
  \ from a routine that already saved them.\n  - Reads BattleObject+0x17 (DirectionFlip/anim field). If\
  \ it is 0xFF (NegaWisp / controlled by NaviStats 0x29 flag), loads Toolkit->BattleStatePtr+0x0D and\
  \ asks GetBattleNaviStatsByte(_, _, 0x29) for the current anim; the result sits in r0 for the rest of\
  \ the function.\n  - Reads BattleObject+0x14 (FuturePanelX). If non-zero, decrements it; when it underflows\
  \ to 0 (BVS-style decay), copies the just-computed anim r0 into BattleObject+0x15 (CurAnimCopy/PanelY).\
  \ When CurAnimCopy ends up 0, jumps straight to battle_updateObjectAnim_801CB38 (skip sub_801CC34).\n\
  \  - On every even tick (r1&2 test), checks BattleObject+0x1F (Unk_1f); if zero calls sub_801CC34, otherwise\
  \ falls through to battle_updateObjectAnim_801CB38.\n  - When FuturePanelX was 0, if CurAnimCopy (r5+0x15)\
  \ mismatches the desired anim r0 and CurAnimCopy != 0xFF, re-arms FuturePanelX with 0x0A; if r0==0 jumps\
  \ to anim updater.\n  - At exit stores the returned anim byte back into r5+0x15 and calls sub_801CC94\
  \ (battle_ai_tickPwrAtkPresses_801CC94, the AI PwrAtk press tick).\n  - Returns via pop {pc}; only callee-saved\
  \ registers are in the out contract, so this is effectively void from the caller's view.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- ldrb r0,[r5,#0x17]; cmp r0,#0xff; bne loc_801CAF0 — explicit 0xFF sentinel check at BattleObject+0x17.
    - GetBattleNaviStatsByte is invoked with r1=0x29 after loading BattleStatePtr+0x0D (the NaviStats
    "nega wisp / controlled anim" flag). - strb r0,[r5,#0x15] — new anim byte stored into CurAnimCopy.
    - sub r1,#1; strb r1,[r5,#0x14]; bne loc_801CB02 — FuturePanelX down-counter; the bne path copies
    r0 into CurAnimCopy, matching the "queue anim, wait N frames, then commit" pattern. - mov r1,#0xa;
    strb r1,[r5,#0x14] — re-arm FuturePanelX to 10 when current anim drifts. - tst r1,#2 / every-other-frame
    gate before sub_801CC34. - ldrb r0,[r5,#0x1f]; cmp r0,#0 — gating variable at BattleObject+0x1F (Unk_1f)
    choosing between sub_801CC34 and battle_updateObjectAnim_801CB38. - Final strb r0,[r5,#0x15]; bl battle_ai_tickPwrAtkPresses_801CC94
    — anim echoed and AI PwrAtk pressed-bit tick invoked. - Contract: out only r4/r5/r6/r7 + push/pop
    {lr,pc} — no return value intended.'
