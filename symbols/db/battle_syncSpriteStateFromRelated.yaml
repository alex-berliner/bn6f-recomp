name: battle_syncSpriteStateFromRelated
address: '0x080BCA72'
kind: function
status: probable
summary: Copies a battle object's visual/sprite state (hide-flag, shader, palette, flip, mosaic) from
  its related object, then dispatches to a per-action handler.
interface: (r5 = battle object) -> r0 = result of dispatched action handler; sets oObjectHeader_Flags
  bit 1 from related object
details: 'Loads oBattleObject_RelatedObject1Ptr and syncs the caller''s sprite state onto itself: it merges
  bit 1 of the related object''s oObjectHeader_Flags into its own Flags (clearing that bit first), copies
  the color shader, final palette, sprite flag-0x10 plus render-info-high byte (via loc_8002F02 setter),
  the DirectionFlip byte plus effective flip (object_getFlip -> sprite_setFlip), and the mosaic/scaling
  parameters (sprite_setAlpha). It then indexes off_80BCAD0 by oBattleObject_CurAction and tail-calls
  that handler with the lr=pc/thumb-interwork trick. This mirrors one object''s appearance onto another,
  e.g. a clone/transformed body tracking its source.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'load r4 = [r5,#oBattleObject_RelatedObject1Ptr]; copies flag bit 2 of related object into own
    oObjectHeader_Flags; paired calls sprite_getColorShader/sprite_setColorShader and sprite_getFinalPalette/sprite_setFinalPalette
    on RelatedObject1Ptr; copies oBattleObject_DirectionFlip from related object then object_getFlip ->
    sprite_setFlip; sprite_getMosaicScalingParameters result fed to sprite_setAlpha; final dispatch: r1
    = [off_80BCACC + CurAction*4]; mov lr,pc; bx r1 into off_80BCAD0 table'
