summary: Plays the 16-bit sound effect id stored at the chatbox script's current cue record and advances the script
  pointer past it.
interface: Next chatbox_PlayScriptSoundCue(void); reads r4 = pointer to a 4-byte cue record (bytes 2-3 = sound id,
  little-endian); returns r0 = 1, advances r4 by 4; flags N/Z from r0=1, C/V from the r4 += 4 add; preserved r2
  r3 r5 r6 r7 r10
details: One of the chatbox script cue handlers. r4 is the chatbox script read pointer; the handler treats it as
