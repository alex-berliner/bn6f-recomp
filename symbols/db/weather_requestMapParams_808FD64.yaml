name: weather_requestMapParams_808FD64
address: '0x0808FD64'
kind: function
status: confirmed
summary: Looks up a four-parameter entry for the current map and enqueues it via req_setFourParams, likely weather/ambient-effect
  parameters.
interface: 'void sub_808FD64(void); // in: r10 = toolkit; out: r2, r3 as left by req_setFourParams; clobbers r0-r1,
  lr, flags'
details: 'Reads the toolkit''s GameState pointer (r10 + oToolkit_GameStatePtr) and picks an index: if oGameState_MapGroup
  == 0x85 (the Underground group) it always uses index 3, otherwise it uses oGameState_MapNumber. The index selects
  an 8-byte entry from a three-entry table at byte_808FD98; each entry is four halfwords. Each halfword is shifted
  left by 16 (occupying the high half of each parameter register, the original''s "lsl #0x10" packing) and all four
  are passed to req_setFourParams, which appears to be an async request-queue primitive taking four halfword params.
  The function always returns 0 in r0. The table entries'' values (e.g. 0xFD80, 0xFE70, 0x0186, 0x0280 for map 0)
  read like paired coordinates or signed-offset-ish quantities rather than pointers. Nearby data references eWeatherCompState
  (off_808FDB8), supporting a weather/weather-component interpretation; caller''s r4-r7 are preserved, nzcv and
  r0-r1/lr are clobbered, and r2/r3 pass through from the callee.

  '
