name: battle_setupAIAttack0_810F44C
address: '0x0810F44C'
kind: function
status: confirmed
summary: Configures the AI attack-vars structure from per-version lookup tables and fires attack ID 0x0A
  for the battle object.
interface: u32 battle_setupAIAttack0_810F44C(u32 aidata /*r4*/, u32 obj /*r5*/, u32 aivars /*r7*/); /*
  returns r1; early-exit returns ExtraVars[0], otherwise returns r1 from object_setAttack0 */
details: 'Reads the version index (0..N) from aidata[oAIData_Version_16]. Looks up a per-version cap from
  byte_810F3EC[version]; if obj[oBattleObject_ExtraVars] >= cap or != 0 the function bails early (returns
  that value in r1). On the happy path: (1) writes (cap - extra0) into aivars[oAIAttackVars_AttackBoost2],
  overriding to 1 if object flag 0x8000 is set; (2) copies timer, sub-step, damage from byte tables at
  0x810F3E6/0x810F3F2/0x810F3E0 indexed by version; (3) sets extra damage to 0x0A; (4) loads a 32-bit
  scratch var from byte_810F3C8 + version*4; (5) points aivars[oAIAttackVars_AiAttackParam] at obj+0x6C
  and aivars[oAIAttackVars_PanelChooseCallback] at obj+0x60; (6) copies and rotates the panel-choice counter
  (ExtraVars[4]) mod 4 back into ExtraVars[4] and stores the pre-rotation value in oAIAttackVars_PanelParamFlags2;
  (7) copies ExtraVars[8] into oAIAttackVars_ScratchPointerOrPanel; (8) sets oAIAttackVars_AttackDuration
  to 0x78 (or 0xB4 if object flag 0x2000 is set); (9) calls object_setAttack0(0x0A, obj) and returns its
  r1.'
