  date: '2026-10-18'
  detail: 'ldrb r0,[r5,#5]; tst/beq — event disabled early-out before any work; ldrh [r5,#0x14]+[r5,#0x18]
    *8 indexes byte_2019A00 record; record+0 selects mode 2/1/default; mode 2: bl battle_spawnEStructRecordsFromTable(byte_8046B74)
    + sprite_setPositionForIdRange3(0x78,0x50,0) + chatbox_runScript(0x202BA04, 0x7f); mode 1 & default:
