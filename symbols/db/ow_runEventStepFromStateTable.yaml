name: ow_runEventStepFromStateTable
address: '0x08047834'
kind: function
status: probable
summary: 'Runs one scripted overworld event step: per a state-table record, spawns objects, moves NPCs
  to screen center, plays a text script and updates chapter state.'
interface: '(caller-context r5 = event/actor struct: [r5+5] enable flag, [r5+0x14]+[r5+0x18] = step index)
  -> r0 = void; no flag contract visible'
details: 'Reads the 8-byte record at byte_2019A00[( [r5+0x14]+[r5+0x18] )*8]; record+0 is a mode byte.
  Mode 2: spawns eStruct records from table byte_8046B74, writes byte/halfword/halfword into three consecutive
  0x2008450 sprite-table entries (setFieldsInThreeTableEntries), moves sprite ids id..id+2 to (0x78,0x50)
  = screen center, then runs script 0x7F of archive 0x202BA04. Mode 1: runs script [record+2] of 0x202BA04,
  then initializes chapter slots 0-3 via sub_80478B8. Default: runs script ([record+2]>>2) of archive
  0x202DA04, initializes chapter slots, and spawns eStruct records from byte_8046B84. The [r5+5] early-out
  skips disabled events. The r5-based calling convention means it is invoked from a dispatcher that holds
  the current event struct in r5.'
