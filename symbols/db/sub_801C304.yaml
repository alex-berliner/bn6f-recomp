name: sub_801C304
address: '0x0801C304'
kind: function
previous_names: []
status: hypothesis
summary: Queues GFX tile uploads for a battle object's next animation frame, dispatching per-state source tables
  and skipping slot 0xb
interface: '(r4 = *object, r7 = *memory_base, r5 = vram_dest) -> r0 = final source pointer (after 0x40 bytes consumed
  per element) ; side effects: 2 GFX transfers enqueued per non-skipped slot'
details: 'Loads the object''s CurState byte at r4[8], multiplies by 4 to index a top-level table (off_801C34C),
  and reads the entry into r4. Then for r6 = 3..0 it reads a byte at [r7+r6]; if the byte is 0xb the slot is skipped,
  otherwise it''s used (×4) to index another table at [r4+byte*4] yielding a tile source pointer. For each slot
  two QueueEightWordAlignedGFXTransfer calls of size 0x20 are issued: the first advances dest by 0x20 and src by
  0, the second advances src by another 0x20 (add r0 += 0x20) and dest by 0x80 (add r1 += 0x80) — typical for moving
  to the next row of 4-tile-wide sprites. The 4-iteration loop with 0x20-byte destination increments matches loading
  4 sub-cells. r5 is the initial VRAM destination and is itself incremented by 0x20 each iteration, so the function
  likely returns a "where the next animation chunk starts" pointer in r0 while moving the cursor forward.

  '
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrb r0, [r4,#8]` at 0x0801c30a reads the CurState byte (BattleObject offset 0x8) - Two-level indexed
    dispatch: top table at off_801C34C indexed by CurState, then `ldr r0, [r4,r0]` performs sub-dispatch on the
    byte read from [r7+r6] - Loop body: two consecutive `bl QueueEightWordAlignedGFXTransfer` calls each with `r2=#0x20`
    (size 0x20 = one 8×8 tile row of 4bpp); dest advances 0x20 then 0x80 (lsl implicit) - Counter `r6` starts at
    3, decremented, branch `bpl loc_801C310` → 4 iterations - `cmp r0, #0xb; beq loc_801C32A` shows explicit skip
    for value 0xb - Final pop `{r3-r6,pc}` skips restoring r4-r7 — but caller wrote r4 in, so r4 is preserved across
    the call (callee-saved via live-out declaration) - callee `QueueEightWordAlignedGFXTransfer` enqueues 8-word-aligned
    DMA-style VRAM copy'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x0801C304

