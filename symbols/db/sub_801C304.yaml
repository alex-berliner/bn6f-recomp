name: sub_801C304
address: '0x0801C304'
kind: function
status: hypothesis
summary: Decompresses four battle-portrait tile pairs into VRAM, selecting the source table by an effect index,
  skipping tile index 0xB.
interface: 'inputs: r3: preserved (input, untouched, must survive); r4: effect-index struct (byte at +8 selects
  one of three source-pointer tables); r5: destination VRAM pointer (advances by 0x20 per tile pair); r7: pointer
  to four tile-index bytes (walked from offset 3 down to 0); lr: return address; outputs: r3: preserved; r4: clobbered
  in body (rebased to the resolved source table), caller-visible; r5: final dst pointer (advanced four times by
  0x20); r6: clobbered (loop counter, caller-visible); r7: clobbered (caller-visible); flags: nz, c, v clobbered'
details: 'Effect index = byte at r4+8; multiplied by 4 and used to fetch a pointer from

  off_801C34C (-> off_801D854 / off_801D880 / off_801D8AC, three sub-tables).

  Loop index `i` runs 3..0 over the four tile-index bytes at r7+i. For any

  tile index != 0xB, the function reads a base source pointer from the chosen

  sub-table and queues two 0x20-byte (32-byte) word-aligned DMA transfers:

  the first to dst, the second to dst+0x80. r5 advances by 0x20 per iteration

  regardless, so skipping 0xB still reserves that tile slot. r3 is pushed and

  popped, so callers can rely on r3 surviving.

  '
