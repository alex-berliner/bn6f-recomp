open_questions:
- The exact identity of the 4-byte array at r7 (looks like an anim-frame source index table)
- What 0xb represents (idle? skip anim?)
- The 0x80 stride between second transfers looks like it skips to the next "column block" of tiles — whether this
  corresponds to a 32x32 or 64x32 sprite layout is unclear
- Caller sub_801C202 was unnamed so the broader story2 transition pipeline is unknown
