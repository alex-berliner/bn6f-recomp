name: submenu_step
address: '0x0813202C'
kind: function
status: probable
summary: 'Steps the submenu state machine: tests a shared flag, calls dispatch_803C620, may invoke sub_813D978
  or write 0x10 into sSubmenu.unk_0C, then tail-jumps to a handler selected by unk_0C from off_8132070.'
interface: () -> r0 = whatever the selected phase handler returns; calls sSubmenu handlers via computed
  jump
details: 'Reads the flag test on the 0x200BC50 IWRAM struct, then calls dispatch_803C620 whose return
  (r0 = result code, r1 = bool) drives transitions: if r1 is set it skips straight to the handler dispatch;
  if r0==1 it calls sub_813D978; otherwise (flag clear) it writes 0x10 to sSubmenu.unk_0C. Finally it
  reads sSubmenu.unk_0C as an index into the function-pointer table at off_8132070 (four handlers sub_8132080/20AC/2104/2168)
  and tail-jumps to the selected one with lr set for a return. sSubmenu.unk_0C is the submenu''s phase/state
  selector. Note that storing 0x10 as the phase implies the pointer table continues past the four words
  shown in this listing.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldr r5, off_8132068 loads sSubmenu; strb r0,#0x10,[r5,#0xc] writes its state byte; ldr r1,[off_813206C];
    ldrb r2,[r5,#0xc]; ldr r1,[r1,r2]; bx r1 dispatches to table off_8132070 indexed by sSubmenu.unk_0C;
    bl dispatch_803C620 with tst r1,r1 / cmp r0,#1 branches is the standard input-dispatcher result handling;
    call to sub_813D978 only when r0==1 and r1==0, i.e. a specific dispatcher result triggers a submenu
    action; off_8132070 lists four handler thumbs (sub_8132080..sub_8132168), matching a small multi-phase
    menu
  refs:
  - bn6f/asm/asm36.s:3939
  - 0x0813D60C test0x200bc50_0x5_813D60C
  - 0x0803C620 dispatch_803C620
  - 0x0813D978 sub_813D978
  reproduce: python3 tools/asmcat.py 0x0813202C
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The overall flow (poll dispatcher, set phase byte, tail-jump via off_8132070) matches the code:
    dispatch_803C620 returns (r0 result, r1 bool); r1!=0 skips to handler dispatch; r0==1 calls sub_813D978;
    flag-clear path writes 0x10 to sSubmenu.unk_0C; finally unk_0C indexes off_8132070 and bx''s through.
    However the handler table read uses ldrb (byte index), not a word, so 0x10 = 16 is a valid index into
    a larger table, consistent with the proposal. The tail-jump is bx with lr set, so r0 = handler return
    — that fits. The summary''s ''per-frame'' is an inference not warranted by the code; better to describe
    it neutrally as the submenu dispatcher/step.; run wf investigate investigate-20261019-010606; proposed
    by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
