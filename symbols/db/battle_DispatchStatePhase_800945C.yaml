name: battle_DispatchStatePhase_800945C
address: '0x0800945C'
kind: function
status: confirmed
summary: Dispatches a battle-state phase byte (offset 2 of the struct in r5) to one of two phase handlers via a
  jump table.
interface: Next sub_800945C(void *battleState /* r5 */); tail-dispatches to sub_8009478 (phase 0) or sub_80094B6
  (phase != 0), passing the phase byte in r0 and the handler's Thumb address in r1
details: 'Trampoline-style dispatcher over the battle state block held in r5. It reads the

  phase byte at battleState+0x02 (oBattleState_Unk_02), uses it as an index into the

  two-entry Thumb jump table at off_8009470 (entries: sub_8009478 for phase 0,

  sub_80094B6 for phase 1), then calls the selected handler via `mov lr, pc; bx r1`.

  On entry to the handler, r0 holds the phase byte and r1 still holds the raw table

  entry (handler address with Thumb bit 0 set), a side effect of `ldr r1, [r1, r0]`

  not being reloaded. All other registers (r2-r12) and the NZCV flags pass through

  untouched, and the handler''s register/flag results are returned to this function''s

  caller verbatim. Because the dispatcher pushes lr before the call, the handler runs

  with SP 4 bytes lower than on entry; the handler presumably stores something there

  or the slot is just expected to exist. The `mov lr, pc` + `bx r1` pattern returns

  to the `pop {pc}` after the handler returns, so the dispatcher is effectively

  transparent to its own caller.

  '
