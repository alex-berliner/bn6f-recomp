name: sub_8028284
address: '0x08028284'
kind: function
status: confirmed
summary: Streams the chip-icon tiles for one entry of the chip selection screen into the queued graphics transfer.
interface: void chipSelect_QueueEntryIconGfx_8028284(void); // entry struct in r4 (callee-local); clobbers r0-r1,
  r12?, lr, flags; preserves r2-r7
details: 'Takes the current entry struct pointer in r4 (a chip selection list entry):

  byte at +7 selects the icon source - when it equals 2 the entry does not

  reference a real chip and a fixed id of 0x1FF is used directly; otherwise

  the halfword pointed to by the pointer at +8 (the chip''s id/code field) is

  passed to getChipID_802A54E to obtain the icon id. The id is first fed to

  gfx_QueueNextChunkedGfxTransfer_80281C4 (the chunked-transfer header /

  setup), then getChipID_802A54E is called again on the same halfword and the

  result is shifted right by 9 (id / 512, i.e. the index of the icon''s base

  64-byte tile chunk, 8 chunks per 512-byte icon) and passed to

  gfx_QueueNext64ByteChunk_8028204 to stream one 64-byte chunk. Both gfx

  queue calls are invoked with the current queue cursor state (whatever

  r0-r3 the queue routines track), so the function appends to the pending

  VRAM/OAM-transfer queue rather than drawing directly. Flags on return are

  whatever the last callee leaves.

  '
