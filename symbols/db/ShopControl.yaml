name: ShopControl
address: '0x08046CF8'
kind: function
status: confirmed
summary: State-machine dispatcher for the shop system; reads a phase byte from byte_2011C10, indexes an 11-entry
  jump table, and branches into the corresponding shop-phase handler while preserving caller registers.
interface: 'Next ShopControl(void) -> r0 = handler return value; flags from handler; r1-r3 restored to caller''s
  saved r8-r9-r12; r4-r7, r8-r9, r12, lr preserved. Inputs: byte_2011C10 (u8 phase offset, 0-40 step 4). Globals
  touched: byte_2011C10, off_8046D1C (jump table).'
details: 'Pushes r4-r7,lr then r8,r9,r12 to stack. Loads byte_2011C10 (shop phase offset), uses it as a byte index
  into the 11-entry jump table at off_8046D1C (entries at +0,+4,+8,...,+40), loads the handler pointer, and dispatches
  via ''mov lr,pc; bx r0''. After return, pops saved r8/r9/r12 into r1/r2/r3 then restores r4-r7,pc. The jump table
  covers: initialization (sub_8046D4C), a battle-object counter advance (battle_objectAdvanceCounterToState8_8046DDC),
  several unidentified shop-flow handlers (sub_8046DF8 through sub_8046ED2), a chatbox/context-script step (chatbox_stepContextScript_8047028),
  and three more handlers (sub_8047050, sub_8047066, sub_804709C). The presence of both battle and chatbox entries
  confirms the shop state machine orchestrates dialogue, item browsing, and battle-transitions as phases.'
