name: pack_addChipByIdSetLibraryFlag_8021B2A
address: '0x08021B2A'
kind: function
status: confirmed
summary: Grants a chip to the player's spare chip pack by chip id, setting its library event flag and packing the
  chips into the slot matching the chip's code.
interface: int pack_addChipByIdSetLibraryFlag_8021B2A(u32 chip_id /*r0*/, u32 search_item /*r1*/, u32 amount /*r2*/);
  returns r3 of addChipsToChipPackOffset_8021b5a in r0; returns 0 without touching the pack when amount==0; preserves
  r2, r4-r7 for the caller; clobbers nz c v
details: 'Re-applies the chip pack encryption (encryption_applyPack_8006e70) before doing anything, so the pack
  data is in clear form while it is modified. If the requested amount (r2) is zero, it returns 0 immediately without
  setting any flag or adding chips. Otherwise it sets the event flag 0x1E20 + chip_id via SetEventFlag - the same
  flag base the library/ModCards area uses for "chip obtained" records - then calls getOffsetToQuantityOfChipCodeMaybe_8021c7c(chip_id,
  search_item, amount) to find the offset of the quantity slot in the pack that matches the chip''s code, and calls
  addChipsToChipPackOffset_8021b5a(offset, amount) to actually add the copies. The result that helper leaves in
  r3 is returned to the caller in r0. The odd r2/r4-r7 preservation and the r3 return suggest this is called from
  assembly-level code (likely a script/event command handler that grants a chip as a reward).

  '
