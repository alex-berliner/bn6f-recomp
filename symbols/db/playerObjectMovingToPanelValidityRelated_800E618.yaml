name: playerObjectMovingToPanelValidityRelated_800E618
address: '0x0800E618'
kind: function
status: confirmed
summary: Picks a panel-parameter pair from a small table (selected by the object's alliance and whether it carries
  flag 0x10 / stands on a solid panel) and passes it, together with the target panel, to object_checkPanelParameters;
  returns immediately if the target panel is invalid.
interface: void playerObject_movingToPanel_check_800E618(u32 panelX /* r0 */, u32 panelY /* r1 */, u32 obj /* r5
  */); returns whatever object_checkPanelParameters left in r0-r3 plus nz/c/v (or Z set, r0==0 if the panel is invalid);
  clobbers r0; preserves r4-r7.
details: "Reads object_isValidPanel(panelX, panelY) first; if invalid (Z set), returns r0=0 with all other observable\
  \ registers untouched by this function.\n\nOtherwise picks a base offset of 0x10 by default. The base is set to\
  \ 0 when BOTH:\n  - object_getFlag() & 0x10 == 0, AND\n  - object_isPanelSolid(obj->PanelX, obj->PanelY) is true\
  \ (Z clear).\n\nFinal table index = (obj->Alliance << 3) + base; entries are 8 bytes each (two u32 words). Four\
  \ entries are defined at byte_800E660:\n  alliance 0: base 0x00 -> {0x0, 0x000000A0 0x0, 0xB880008};  base 0x10\
  \ -> {0x10 0x0, 0x0, 0x0 0x0, 0xA0 0x0, 0x88 0xB}\n  alliance 1: same pairs as alliance 0 (table only has 4 rows,\
  \ so alliances >=2 re-use)\n  alliance 2..3 each get the two lower pairs.\nConcretely the byte_800E660 rows read\
  \ (little-endian u32,u32): 0x10000000, 0x0B8800A0 / 0x30000000, 0x07880080 / 0x00000000, 0x0B8800A0 / 0x20000000,\
  \ 0x07880080.\n\nThese two u32s are passed as the (r2, r3) args to object_checkPanelParameters(panelX, panelY,\
  \ paramA, paramB); that callee's r0-r3 and flags are returned verbatim.\n\nTouched object fields (offsets in oBattleObject):\
  \ PanelX (byte), PanelY (byte), Alliance (byte).\n"
