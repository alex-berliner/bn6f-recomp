open_questions:
- Which flag at object_getFlag bit 0x10 it really is (likely "floating/in-air" or "enemy-type" — needs cross-checking
  with callers).
- Meaning of the four {word0, word1} pairs at byte_800E660 (probably two distinct hit/move-parameter sets per panel-solidity
  case).
- Why the alliance << 3 stride and the fixed 0x10 base were chosen — only the low two bits of Alliance are sampled
  by this table.
- Whether the early-out invalid-panel path is intentional (the caller may rely on stale r1-r3) or a bug that callers
  must guard against.
