name: sub_812068C
address: '0x0812068C'
kind: function
status: confirmed
summary: Searches a row-based lookup table for a packed position, fires a handler (with the row index bumped by
  0x16) when a hit is found, then re-searches with the hit's index shifted down by 8.
interface: int sub_812068C(int value, int row, int arg2, int arg3) — returns whatever sub_81205C0 leaves in r0 on
  the second call; NZCV flags come from that same final call; r4-r7 preserved.
details: 'Wraps two calls to sub_81205C0, which is queried as (value, row, arg2, 1) and returns a packed 32-bit
  position whose negative result means "no hit" (checked with tst/blt). On a hit, sub_802FE28 is called as (hit,
  row + 0x16, 0, 1) — the +0x16 (22) row offset suggests the handler targets a related but distinct row/entry, and
  the constant 1 in the last argument of every call looks like an enable/count flag. The hit itself is repacked
  before the second search: the low halfword is kept verbatim, while the high halfword (arithmetic, so it stays
  signed) is incremented by 8 — the second query therefore starts 8 entries past the previous hit, with arg3 substituted
  for value as the new search key. The final NZCV state seen by callers is simply whatever sub_81205C0 leaves behind;
  r0-r6 are all effectively call-clobbered outputs.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
