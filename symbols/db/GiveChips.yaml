name: GiveChips
address: '0x08021AEE'
kind: function
status: confirmed
summary: Grants `count` copies of a chip (id + code) to the player's chip pack, marking it as collected in the chip
  library.
interface: int GiveChips(u32 chipId /*r0*/, u32 chipCode /*r1*/, u32 count /*r2*/) -> int result /*r0*/; r3 also
  carries result; nzcv clobbered
details: 'Chip-award routine, presumably called by script/event rewards and boss defeats. Flow:

  1. Calls encryption_applyPack_8006e70 first so the chip pack''s obfuscated data is applied/verified before it
  is modified. If count (r2) is 0, returns 0 immediately without touching the pack.

  2. Sets the "chip obtained" library flag via SetEventFlag with event id 0x1E20 + chipId, so the chip shows as
  collected in the Library.

  3. Calls getOffsetToQuantityOfChipCodeMaybe_8021c7c(chipId, chipCode, count) to locate the pack slot (offset)
  that holds this chip''s code; returns the slot offset in r0 and a per-code field pointer/value in r3.

  4. Calls addChipsToChipPackOffset_8021b5a to append `count` copies at that offset (r1 is passed through as whatever
  the lookup left in it, matching the original''s behaviour).

  5. Calls setUnkFieldOfChipCodeInChipPack_81376b8 (thumb/rom-tail call into 0x81376b8) with the saved code field
  in r1 to refresh that slot''s bookkeeping field.

  Returns the value addChipsToChipPackOffset_8021b5a left in r3 (also re-placed in r3). r4 is used as scratch for
  the code field and restored to the caller''s value on exit.'
