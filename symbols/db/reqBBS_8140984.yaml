name: reqBBS_8140984
address: '0x08140984'
kind: function
status: confirmed
summary: Clears three byte flags (offsets 0xD, 0xE, 0xF) in the BBS request GUI state struct.
interface: void reqBBS_8140984(void); // clobbers r0, r1, r2, N, Z; preserves r4-r7, lr returned via pop
details: Loads the address of the eReqBBSGui struct into r0, then writes zero (r1) to byte offsets 0xD, 0xE and
  0xF of that struct. After the last store, r2 holds 0xF as a residual from the last offset load. The function is
  a thin flag-clearing helper for the BBS (Bulletin Board System) request GUI.
