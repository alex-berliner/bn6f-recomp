name: battle_clearExtraSelfRef
address: '0x080D5128'
kind: function
status: probable
summary: If the object's ExtraVars field points to a pointer that references this object itself, zeroes
  that pointer.
interface: (r0 = unused, r5 = battle object) -> no return value; flags from cmp
details: 'Reads the ExtraVars field (offset oBattleObject_ExtraVars) of the battle object in r5, treats
  it as a pointer to a word, and loads that word. If the word equals the object''s own address (r5), it
  stores 0 there, i.e. it nulls out a reference that points back at this object. It does this non-destructively
  otherwise: if the word points elsewhere, nothing is changed. This pattern is typical of cleanup code
  that removes back-references to an object (e.g. ''last hit by'' or ''target'' links) so no stale pointer
  to a dying object remains. Note r0 is unused, and the function relies on r5 being set by the caller.'
