name: sub_803AD20
address: '0x0803AD20'
kind: function
status: confirmed
summary: Dispatches to one of seven chip-select screen handlers based on the state byte at r5+0x08.
interface: void sub_803AD20(void);  // uses caller-supplied r2/r4/r5/r10 and lr; outputs/clobbers r5/r8/r9/r10/r11/r12
  + flags
details: 'Reads an 8-bit state field at (r5)+8 and selects a handler from the 8-entry

  table at off_803AD60. The byte values 0x3A, 0x3B, 0x3C, 0x3D, 0x3E, 0x3F,

  0x40 are each matched explicitly; everything else falls through to the final

  table entry (sub_803AE98). The chosen handler is invoked via a "bx r0"

  tail-call after loading the thumb address with the +1 Thumb bit, so on return

  the function pops {r4-r7,pc} from the saved frame, restoring r4-r7 unchanged.

  r5/r8-r12 are caller-owned and may be used freely. Belongs to the battle

  chip-selection screen (chip data structure is pointed to by r5; r5+0x08 is

  its sub-state id).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
