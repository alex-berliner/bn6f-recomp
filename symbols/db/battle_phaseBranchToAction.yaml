name: battle_phaseBranchToAction
address: '0x080C72BC'
kind: function
status: probable
summary: Battle-object action step that, once its phase counter reaches 3 or 4, switches the object into
  a different action (9 or 10) and resets the phase.
interface: (r5 = battle object) -> r0 clobbered; writes oBattleObject_CurAction and clears oBattleObject_CurPhaseAndPhaseInitialized
  when phase is 3 or 4, otherwise returns unchanged
details: Reads oBattleObject_PhaseInitialized from the object at r5. If it equals 3, it stores action
  9 into oBattleObject_CurAction; if it equals 4, it stores action 10 instead. In both cases it also writes
  0 to oBattleObject_CurPhaseAndPhaseInitialized (halfword, clearing both the phase counter and the initialized
  flag), which is the standard pattern for handing the object over to the next action in the battle update
  loop. If the phase is anything else (including 0-2), it just returns, letting the current phase keep
  running. This is a typical 'wait N phases, then branch to a follow-up action' state used by battle scripts/objects.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0,[r5,#oBattleObject_PhaseInitialized]; cmp #3 / #4 selects which follow-up action is
    entered; strb #9/#0xa into oBattleObject_CurAction then strh 0 into oBattleObject_CurPhaseAndPhaseInitialized
    matches the engine''s action-transition idiom; bne locret_80C72DA leaves phases 0-2 running unchanged,
    confirming it is a per-frame phase check, not a one-shot init'
