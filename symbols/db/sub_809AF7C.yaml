name: sub_809AF7C
address: '0x0809AF7C'
kind: function
status: confirmed
summary: Selects a CopyBot tutorial cutscene entry from a per-map table (picking the "pre-CopyBot" variant if the
  CopyBot event flag is unset), stores it on the work struct, then warps and poses the overworld player to that
  entry's coordinates/facing/anim and clears the Navi palette.
interface: void owPlayer_prepareCopyBotScene_809AF7C(struct work *r5, struct r10_state *r10);  // returns nz via
  r0=0
details: '- Table at byte_809ADB4 holds 0x3C-byte entries; chosen by the byte at r10+0x3C +0x12 (a per-map scene
  index).

  - Reads the COPYBOT_ACTIVE event flag (0x17:0x29 = EVENT_COPYBOT_ACTIVE) via TestEventFlagFromImmediate; if NOT
  set, adds 0x10 to skip to the tutorial-variant entry (so the player is repositioned before receiving the CopyBot
  item).

  - Writes the selected entry pointer into r5+0x34 (a slot on the caller-held work struct).

  - From the entry: 3 words at offsets 4/8/0xC are (x,y,z) passed to owPlayer_indirectlySetPlayerCoordsMaybe_809e1a4;
  byte 3 holds both the facing direction (SetOWPlayerFacingDirection) and the fixed-animation-select index (owPlayer_setS200ace0_fixedAnimationSelect_809e13c).

  - Calls ZeroOWPlayerNaviPaletteIndex to free the Navi palette slot.

  - Ends with r0 = 0 published as NZ (AND r0,r0) so callers see a known non-zero result.

  - Preserved registers (r4-r7) match the listed contract.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
