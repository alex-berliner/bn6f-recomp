- The asm at sub_8136EF8 does exactly what the proposal describes (bl sub_81375D8, mov r0,#0; bl RunTextScriptNaviCustDialog,
  mov r0,#8; strb r0,[r5], pop {pc}), and r5 is indeed not initialized in this function so it must come
  from the caller. However, calling it an 'advance state' or 'stage 8' overinterprets the byte write —
