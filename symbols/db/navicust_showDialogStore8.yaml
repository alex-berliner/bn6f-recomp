  reproduce: python3 tools/asmcat.py 0x08136EF8
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The asm at sub_8136EF8 does exactly what the proposal describes (bl sub_81375D8, mov r0,#0; bl RunTextScriptNaviCustDialog,
    mov r0,#8; strb r0,[r5], pop {pc}), and r5 is indeed not initialized in this function so it must come
    from the caller. However, calling it an ''advance state'' or ''stage 8'' overinterprets the byte write
    — the code merely stores 8 to a caller-provided [r5] without evidence this is a state field. No callers
    were captured, so the semantics of [r5] are not grounded.; run wf investigate investigate-20261018-203615;
