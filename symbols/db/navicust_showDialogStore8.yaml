name: navicust_showDialogStore8
address: '0x08136EF8'
kind: function
status: probable
summary: Calls sub_81375D8, runs RunTextScriptNaviCustDialog with script index 0, then stores the byte
  8 at the caller-provided [r5]; returns nothing meaningful.
interface: () -> r0 clobbered; reads r5 = pointer to a state/step object, writes byte 8 to [r5]
details: 'The routine first calls sub_81375D8 (purpose unknown, likely per-step setup/cleanup for this
  state machine), then invokes RunTextScriptNaviCustDialog with r0 = 0, i.e. dialog/script index 0 of
  the NaviCust text set. Afterwards it stores the literal 8 as a byte at [r5], which looks like advancing
  a step/state field in a structure the caller set up in r5 (r5 is callee-saved, so the caller must have
  loaded it). The function itself returns nothing meaningful in r0. Its whole behavior is: prepare, show
  the fixed NaviCust dialog, set state 8.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl sub_81375D8 before the dialog call suggests a per-state setup step; mov r0,#0; bl RunTextScriptNaviCustDialog
    runs NaviCust text script 0; mov r0,#8; strb r0,[r5] writes constant 8 as a state/step byte into the
    caller-provided object; no other reads or writes: the only state change is the byte 8 store; reached
    in recorded beastsp routes, consistent with NaviCust-related UI flow'
  refs:
