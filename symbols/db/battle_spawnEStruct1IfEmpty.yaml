name: battle_spawnEStruct1IfEmpty
address: '0x081302B0'
kind: function
status: probable
summary: Spawns the eStruct records from table byte_812F054 into eStruct slot 1 at x=0xB0 on the battle
  field, but only if slot 1 is currently free.
interface: () -> r0 = spawn result/last record (from callee), void effect; flags set by getStructFrom2008450
  on slot-1 in-use byte (spawn skipped when set)
details: 'Reads the in-use/status byte of entry 1 of the 0x58-byte eStruct array at 2008450 with NZ flags
  (getStructFrom2008450 with index 1). If that byte is nonzero the function returns immediately without
  spawning. Otherwise it calls battle_spawnEStructRecordsAtPosition with r0 = record table byte_812F054,
  r1 = slot 1 (the pushed/popped constant), and r2 = 0xB0 as the field position, letting the callee place
  and position the new records. Quirk: r1 is smuggled through a push/pop around the flag-check call since
  r1 doubles as the check argument and the spawn slot argument.'
