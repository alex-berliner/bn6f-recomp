  date: '2026-10-19'
  detail: mov r1,#1; mov r0,r1; bl getStructFrom2008450 then bne locret — spawn only happens when slot
    1's in-use byte is zero (asm at 0x81302B4-0x81302BE); push {r1} before the check and pop {r1} after
    set r1=1 as the slot argument for the spawn call (asm 0x81302B6/0x81302C0); ldr r0,off_81302CC loads
    table byte_812F054 and mov r2,#0xb0 sets the position for battle_spawnEStructRecordsAtPosition (asm
