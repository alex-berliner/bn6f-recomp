- Exact meanings of panel flags 1 and 6 in BN6 (e.g. normal vs broken/hole)
- Which chip or object routine calls this and how r2/r3 encode column/masks
- 'The proposal misidentifies the return value when object_checkPanelParameters succeeds: the code pops
  r0/r1 from the stack (which holds the flag value 1 or 6 and the stored row byte) and jumps to loc_80FB80E,
  which returns r0. So on the fast path it returns the flag (1 or 6), not the row byte at +0x13. Only
  the fallback path returns a row (low 3 bits of the selected entry). The name ''object_pickRandomPanelRowInColumn''
  also misses the priority-check behavior; something like ''object_findPanelRowPreferStored'' or ''object_getPanelRowInColumn''
  fits better.'
