    the attack duration; bl object_setFlag1 sets OBJECT_FLAGS_UNK_BIT_22 once at entry alongside the element
    write; sub timer/strh/bge pattern plus bl object_exitAttackState on expiry — standard attack-state
    countdown exit; callee summaries (object_setFlag1, object_exitAttackState) confirm battle-object AI
    attack context
