name: ai_attackWoodElementUpdate
address: '0x080EFEAC'
kind: function
status: probable
summary: Per-frame AI attack-state handler that makes the object's attack wood-element (element 4), holds
  a flag for its duration, then ends the attack when the timer runs out.
interface: (r7 = battle object with AIAttackVars) -> void; sets object flag bit 22, AI data 0x48 flag
  0x800 while active, writes oAIAttackVars_AttackElement = 4, decrements oAIAttackVars_StepTimer, calls
  object_exitAttackState on expiry
details: If oAIAttackVars_AttackElement is still 0, it ORs object flag bit 22 into CollisionData ObjectFlags1,
  sets AI data word 0x48 bit 0x800 (SetAIDataUnk0x48Flag), and stores element 4 (wood) into AttackElement
  — a one-time init on entry. Each frame after that it decrements oAIAttackVars_StepTimer; while the timer
  is >= 0 nothing else happens. Once the timer goes negative, it clears the same 0x800 flag in AI data
  0x48 and calls object_exitAttackState to leave the attack state. The 0x800 AIData flag tracks the attack's
  active window, and the element assignment presumably makes the attack subject to wood-element interactions
  (grass status, etc.). Uses r7 as the object pointer rather than r0, so it is called as a tail-context
  routine from an AI attack state table.
evidence:
- method: assembly-reading
  date: '2026-10-18'
