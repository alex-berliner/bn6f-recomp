name: object_destroyThunk
address: '0x080C8C44'
kind: function
status: probable
summary: Trampoline that invokes the generic battle-object destructor, almost certainly an overridden/virtual
  destructor for some object class.
interface: (r0 = object ptr) -> r0 = object_genericDestroy result; no other state preserved beyond lr.
details: The routine saves lr, tail-calls object_genericDestroy (which releases panel tile reserves, collision
  data, and the object's memory), and returns. It adds no logic of its own, so it is a per-class destructor
  stub/thunk rather than an independent behavior. Because callers are unknown, the specific object class
  it belongs to cannot be determined from the code alone.
