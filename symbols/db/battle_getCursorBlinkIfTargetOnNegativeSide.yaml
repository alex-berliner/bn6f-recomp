name: battle_getCursorBlinkIfTargetOnNegativeSide
address: '0x08031C64'
kind: function
status: probable
summary: Returns the battle textbox cursor blink state byte only when the entity's position relative to
  a doubled target reference lies on the negative side of the half-plane test; returns 0 otherwise.
interface: (r0 = entity/target descriptor for calcRelPosToTarget) -> r0 = blink-state byte if the point
  test passes, else 0
details: 'The function first calls battle_calcRelPosToTarget_803172E, which writes the entity''s position
  (and next position) relative to a doubled target reference into a scratch buffer. It then loads constants
  (r2=2, r3=2, r4=0, r5=0x10) and calls math_pointCrossHalfPlaneTest_8031594, an area/hit-test predicate
  reading that scratch data; its 0/1 return is not discarded but chained: it is passed as the mode argument
  to chatbox_getCursorBlinkState_8031B7C. Since getCursorBlinkState returns the blink byte only for mode
  1 and 0 otherwise, the composite effect is: return the cursor blink state when the point lies on the
  negative side of the test edge, otherwise return 0. This gating pattern suggests a battle UI check (e.g.
  targeting-cursor/OK-cursor visibility tied to the target''s position). The final r0 is the blink-state
  byte from the chatbox state struct.'
