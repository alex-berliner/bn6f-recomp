    follow-up test; asm: r2=2/r3=2/r4=0/r5=0x10 set up the edge/point arguments for math_pointCrossHalfPlaneTest_8031594;
    asm: the cross-test''s r0 result flows directly into chatbox_getCursorBlinkState_8031B7C as its mode
    argument; callee doc: getCursorBlinkState returns the blink byte only when passed mode 1, else 0 —
