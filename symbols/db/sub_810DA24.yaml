name: sub_810DA24
address: '0x0810DA24'
kind: function
status: confirmed
summary: Dispatches to one of two AI state handlers based on the byte at offset oAIState_Unk_02 of the AI state
  struct in r6.
interface: void aiStateDispatch_810DA24(void); // r6 holds the AI state struct pointer; base "off_810DA44:0" ->
  handler 0, "off_810DA44:1" -> handler 1
details: 'Thin trampoline that reads a single state index byte from the AI struct

  (r6 + oAIState_Unk_02) and tail-jumps through a 2-entry thumb jump table

  at off_810DA44. Index 0 -> sub_810DA4C, index 1 -> sub_810DAAA. The chosen

  handler returns directly to this function''s caller via `pop {pc}`,

  meaning all registers the handler leaves set (notably r1, r5, r8-r12) are

  forwarded up the call chain untouched. The 12 bytes of zero padding between

  the function and the jump-table pointer are dead space (alignment pad).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
