name: battle_setPanelState
address: '0x0800C81E'
kind: function
status: probable
summary: Iterates panels 1..N selected by a bitmask in r1 (bit 0 ignored), writes the r2 state byte to
  each panel's state field at +3 and 0x5A to its timer at +0x10, then refreshes panel parameters via object_updatePanelParameters.
interface: (r0 = battle context, r1 = bitmask of panel indices (bit n = panel n, bit 0 ignored), r2 =
  state byte) -> r0 = destroyed; no meaningful return
details: Iterates panels 1..N, testing successive bits of r1 (r1 is pre-shifted right by one, so bit 0
  is skipped and bit n selects panel n). For each set bit it fetches the panel's data entry via battle_getPanelDataPtr_800C6E0,
  writes the r2 state byte to offset +3 (panel type/state field), writes 0x5A (90 frames) to the byte
  timer at +0x10, and calls object_updatePanelParameters to propagate the change. The 90-frame value is
  a fixed duration, not derived from arguments. Called from the per-frame battle update (battle_updatePanels_800C746),
  so it applies area-wide panel changes such as transforming a set of field panels at once.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'loop `lsr r7,r7,#1 / bcc` walks r1''s bits one by one, with r5 counting panels from 1; strb
    r6,[r0,#3] writes the caller''s byte to the panel entry''s state field; strb of #0x5A to [r0,#0x10]
    sets a fixed 90-frame timer on each panel; bl object_updatePanelParameters after each write refreshes
    the panel''s runtime parameters; sole caller battle_updatePanels_800C746 runs this inside the per-frame
    battle panel update'
