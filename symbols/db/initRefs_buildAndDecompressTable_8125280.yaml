open_questions:
- What sub_811FB84(a0, a1) computes from the first two words of each entry (address fixup, checksum, or ID->pointer
  lookup) is unknown; the game-term meaning of the resolved value follows from it.
- What resource the decompressed data actually is (font, sprite sheet, menu graphics, etc.) - the initRefs naming
  and the decomp-then-copy flow fit a boot/init resource load, but the consumer of unk_2029000 was not traced.
- Whether the 0-terminator word after the 5 entries is consumed by decompAndCopyData or by later readers of the
  table.
