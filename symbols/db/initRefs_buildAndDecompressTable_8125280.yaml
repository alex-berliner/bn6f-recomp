name: initRefs_buildAndDecompressTable_8125280
address: '0x08125280'
kind: function
status: confirmed
summary: Boot/init-time routine that assembles a 5-entry "init references" pointer table in RAM, resolves two words
  of each entry through sub_811FB84, then decompress-and-copies that table and a second data blob.
interface: void sub_8125280(void); // no meaningful register inputs; clobbers r0-r3, lr and NZCV flags; preserves
  r4-r7
details: 'Builds a table at unk_2029000 (IWRAM) from a ROM source table at off_8125310. The source holds 5 entries
  of 4 words each (0x50 bytes total, loop counter compared against 0x50 bytes). For each entry: words 0 and 1 are
  passed to sub_811FB84(a0, a1) and its u32 result is stored in the output slot instead of the raw values; words
  2 and 3 are copied verbatim. After all 5 entries the assembled table is terminated with a 0 word. The routine
  then calls decompAndCopyData twice: first with the pointer to the assembled unk_2029000 table, then with byte_8125368
  (a second blob referenced from ROM immediately after the table''s pointer list). r6/r7 are used as dst/src byte
  cursors and r1 as the inner 2-word copy counter; r4-r7 are saved and restored. The decompAndCopyData-on-a-pointer-table
  pattern suggests the assembled table describes where a following compressed resource should land in RAM, making
  this a resource-load/init step rather than gameplay code.

  '
