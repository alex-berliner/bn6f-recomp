name: ai_blastManAttackInterval
address: '0x080FD2F8'
kind: function
status: probable
summary: BlastMan AI helper returning the frame delay between its attacks, lengthened when a certain object
  flag is set
interface: () -> r0 = attack interval in frames (30/40/50/60, +60 if flag 0xA000 set); flags clobbered
  by callees
details: Calls sub_800FE28 with pointer to dword_80FD318, a word packing four bytes 0x1E/0x28/0x32/0x3C
  (30,40,50,60) — clearly a per-difficulty (or per-something) table of frame counts selected by sub_800FE28.
  It then reads the battle object's collision-data flag word via object_getFlag and, if bits 0xA000 are
  set, adds 0x3C (60) to the base value before returning it. The BlastMan AI caller (sub_80FD158) uses
  move-counter and RNG checks before attacking, so this value is the cooldown interval controlling how
  often BlastMan fires its attack. The 0xA000 flag bits presumably denote a state (e.g. a status or panel
  condition) that makes BlastMan wait longer between attacks.
