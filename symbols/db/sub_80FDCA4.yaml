name: sub_80FDCA4
address: '0x080FDCA4'
kind: function
status: confirmed
summary: Highlights a row of battle-grid panels extending out from a battle object's own panel in the direction
  it is facing (e.g. for an attack or attack-pattern that targets a line of panels).
interface: 'void sub_80FDCA4(u32 r0 /*panelCount*/, struct BattleObject* r5); /* out: r1 = last object_highlightPanel
  result; clobbers r0,r2,r3,lr; N,Z,C,V modified; r4,r6 preserved */'
details: "Loops `count` times (r0, the number of panels to highlight, inclusive of the\nobject's current panel:\
  \ the first iteration uses offset 0 by way of `step` starting\nat 1 and direction multiplied in). Each iteration:\n\
  \  * reads the object's facing direction via `object_getFrontDirection` (returns -1/0/+1),\n  * multiplies it\
  \ by an incrementing stride (`r4`, 1..count),\n  * adds that to the object's `oBattleObject_PanelX` to get a target\
  \ panel column,\n  * reads `oBattleObject_PanelY` for the row,\n  * calls `object_highlightPanel(x,y)` to mark\
  \ the panel.\nReads fields `oBattleObject_PanelX` and `oBattleObject_PanelY` of the battle object\nin r5. Pure\
  \ visualization / targeting highlight; no side effect on the object itself\nbeyond the highlight layer. The trailing\
  \ data blobs (`byte_80FDCC4`, `byte_80FDCCC`,\n`byte_80FDCF0` and `off_80FDDB0` of Thumb+1 thunks) immediately\
  \ follow the function in\nthe same source file/dump and are not part of it.\n\nRegister form, old prompt; queued\
  \ for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
