name: sub_811F708
address: '0x0811F708'
kind: function
status: confirmed
summary: Starts the fade that leaves the PET (returning to the map) and resets the PET menu data block.
interface: void sub_811F708(r5, r10 /* toolkit */, lr); returns r0 = 3, r1 = &ePETMenuData, flags NZ/C/V set
details: 'First runs the shared fade-entry helper sub_811F728, then stores 8 into gameState->oGameState_EnterMapFadeParam1
  (gameState fetched via toolkit->oToolkit_GameStatePtr in r10), which drives the fade-out when leaving the PET
  screen. It then initializes the PET menu data block (ePETMenuData): byte +0 = 0x14 (PET menu screen id), byte
  +1 = 0 and byte +8 = 0 (cleared cursor/sub-menu state), byte +9 = 3 (menu sub-state). On return r0 = 3 and r1
  = &ePETMenuData; r5 is preserved.

  '
