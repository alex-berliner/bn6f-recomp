name: battleObject_PlayHurtAnimAndSetAction8_80C6524
address: '0x080C6524'
kind: function
status: confirmed
summary: Switches a battle object to animation 1, plays sound effect 0xA2, and sets its current action to 8 (likely
  a flinch/hit reaction).
interface: void sub_80C6524(BattleObject* obj /* r5 */); /* returns r0 = 8, flags NZ set from 8 */
details: Treats r5 as a battle object (battle entity) pointer. Writes 1 to the object's CurAnim byte (oBattleObject_CurAnim),
  calls PlaySoundEffect with sound effect id 0xA2, then stores 8 into the byte at offset 9 (the CurAction field,
  same offset per the C note) and returns with r0 = 8 and NZ/C flags set from that value. All other registers are
  preserved; r0-r4 and lr are clobbered/returned as noted in the contract. No other state is touched. The combination
  of an animation change, a sound effect, and an action-state assignment suggests this is a state-entry routine
  for a battle object's reaction state (e.g. taking a hit), but the exact in-game meaning of anim 1 / sfx 0xA2 /
  action 8 is not confirmed from this snippet alone.
