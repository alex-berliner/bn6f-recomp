name: battle_aiGetIndexedParamPair
address: '0x080F3CA4'
kind: function
status: probable
summary: Returns a packed pair of AI parameters (low half from one table, high half from a constant-10
  table) selected by an index and the battle object's AI version.
interface: (r0 = entry index) -> r0 = (tableB[index][aiVersion] << 16) | tableA[index][aiVersion]; no
  flags meaningful
details: The index in r0 is scaled by 8 (four halfwords per entry, one per AI version) and used to address
  two parallel byte tables. Each halfword is fetched via battle_aiGetVersionedTableEntry, which picks
  the halfword matching the battle object's AI version (with a special scaled entry for version 4). The
  first table holds variable values (0x28/0x50/0x6E, and an unused parallel set 0x50/0xA0/0xDC), while
  the second table is uniformly 0xA (10) in all three variants. The two halfwords are combined as (second
  << 16) | first and returned as one word. The extra pointer/halfword tables at 80F3CE0/80F3CE8/80F3D04/80F3D0C
  are sibling data not referenced by this particular build of the routine, suggesting variant tables for
  other game revisions or alternate callers.
