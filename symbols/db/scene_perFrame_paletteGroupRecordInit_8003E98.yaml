summary: Records the current queued-sprite palette count into group slot 1 once per frame, then returns.
interface: '() -> r0 = 1 ; side effects: writes byte_200F389 + 1 to sprite group counter; tail-only dead
  init branch is unreachable'
details: "Entry is push {lr}; mov r0, #1; bl sprite_recordPaletteCountToGroupSlot_80028C0; pop {pc}.\n\
  \  The callee copies dword_200F340 (current queued-sprite palette count) into byte array byte_200F389\
  \ at slot r0 (=1), so this is \"record palette count into group 1 for this frame\".\n  The contract\
  \ returns no caller-visible result; the post-pop 'mov r0, #0' / clear-loop / 'mov pc, lr' sequence (0x8003EA6..0x8003EB6)\
  \ is unreachable tail code (after the function has already returned via pop {pc}). The tail would have\
  \ iterated 0x20 T1BattleObject entries starting at eT1BattleObject0 and zeroed object_sprite+0x24 of\
  \ each, but no caller reaches it because of the pop {pc}.\n  Lives across all the overworld/PET/battle\
  \ per-frame handlers that pass lr through.\n"
