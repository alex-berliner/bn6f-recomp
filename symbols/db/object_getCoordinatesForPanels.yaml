name: object_getCoordinatesForPanels
address: '0x0800E276'
kind: function
status: confirmed
summary: Converts a battle-field panel column/row into 16.16 fixed-point screen pixel coordinates (x in r0, y in
  r1).
interface: int object_getCoordinatesForPanels(s8 panelColumn, s8 panelRow) -> returns x (r0, 16.16) and y (r1, 16.16)
  in registers; clobbers r2 and NZCV
details: "Takes a signed-byte panel column (r0) and row (r1) on the 6x3 battle grid and returns the\ncorresponding\
  \ top-left pixel position of that panel in 16.16 fixed point:\n  x = col * 0x28 (40 px per panel) - 0x8C (origin\
  \ offset, added as 0xFF740000)\n  y = row * 0x18 (24 px per panel) - 0x14 (origin offset, added as 0xFFEC0000)\n\
  Both offsets are carried only in the high halfword of the constants, so the result is\ncorrect for small products\
  \ but the low halfword of r0/r1 is always zero apart from the\nconstant's lower halfword (both constants have\
  \ zero low halfwords). Inputs are sign-extended\nas s8, so callers can pass e.g. -1/0xFF for off-field positions\
  \ and get coordinates one\npanel up/left of the field. r2 is scratch (holds the y offset constant); NZCV flags\
  \ come\nfrom the final ADDS computing the y coordinate.\nNote: the origin offsets (-0x8C, -0x14) look like \"\
  center the 240x144 field area\" values,\nso this maps grid space to the standard top-left-anchored object pixel\
  \ space used by\nbattle entities.\n"
