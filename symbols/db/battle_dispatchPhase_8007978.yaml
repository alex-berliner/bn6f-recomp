name: battle_dispatchPhase_8007978
address: '0x08007978'
kind: function
status: confirmed
summary: Battle-mode phase dispatcher that jumps to one of four per-phase handlers based on the phase byte stored
  in the battle state struct.
interface: void battle_dispatchPhase_8007978(void) /* r5 = battle state struct; returns whatever r0-r3/flags the
  chosen handler leaves */
details: "Reads the byte at [r5,#0x02] (r5 points to the battle state struct; the\nphase field at offset 2), then\
  \ uses it directly as a byte offset into the\nhandler table off_800798C — the field is already pre-multiplied\
  \ by 4 so\nvalues 0x00/0x04/0x08/0x0C select entries 0..3. Each entry is a Thumb\nhandler address (stored with\
  \ +1). Dispatch is done via the standard\n\"mov lr, pc; bx r1\" trampoline, so handlers return to this function's\n\
  pop {pc}. The four handlers are:\n  0x00 -> battle_cueThenSetState4_800799C (cue something, then set battle\n\
  \          state field to 4)\n  0x04 -> sub_80079A8\n  0x08 -> sub_80079D0\n  0x0C -> sub_80079F0\nSide effects\
  \ visible to callers: R0 is left holding the phase byte and R1\nholds the loaded handler address (an artifact\
  \ of loading the jump target\ninto r1), both set before the call; all other registers pass through\nuntouched,\
  \ and the returned flags are whatever the handler last set.\nNo clobbering of the state struct itself in this\
  \ routine.\n"
