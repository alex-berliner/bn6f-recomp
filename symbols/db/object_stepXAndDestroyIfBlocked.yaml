name: object_stepXAndDestroyIfBlocked
address: '0x080CD414'
kind: function
status: confirmed
summary: Advance a battle object along the X axis by its velocity; if the destination panel is out-of-bounds, already
  flagged as collided (bit 0x800000), or blocked by the object's alliance-specific panel parameters, destroy the
  object instead.
interface: void object_stepXAndDestroyIfBlocked(u32 r5 /* battle object ptr */) /* r5 in/out; clobbers r0-r3, lr,
  flags; preserves r4-r7 */
details: "Reads r5->oBattleObject_CollisionDataPtr and checks oCollisionData_FlagsFromCollision\nfor bit 0x800000\
  \ (a \"already hit\" collision marker). If set, jumps straight to destroy.\n\nOtherwise adds r5->oBattleObject_XVelocity\
  \ to r5->oBattleObject_X, converts the new\nworld (X,Y) to panel (PanelX,PanelY) via convertBattleObjectXYToPanelXY_800E24C,\
  \ and\nwrites PanelX/PanelY into both the battle object and its collision-data struct.\n\nCalls object_isValidPanel(panelX,\
  \ panelY); on failure goes to destroy.\n\nIf r5->oBattleObject_Param1 bit 7 is set (lsl #0x19, bcs taken), the\
  \ object is treated\nas freely-moving and returns without further checks.\n\nOtherwise reads r5->oBattleObject_Alliance\
  \ (0 or 1), indexes a two-entry, 8-byte-per-\nalliance parameter table at byte_80CD478 (alliance*8 gives two u32\
  \ words), and calls\nobject_checkPanelParameters(panelX, panelY, param2, param3). A zero return means the\npanel\
  \ is blocked for that alliance, triggering destroy.\n\ndestroy path (loc_80CD45E): calls object_clearCollisionRegion(r5),\
  \ reads\nr5->oBattleObject_ExtraVars+4; if non-null, writes 0 to the byte it points at (a\nreference-count decrement\
  \ for the extra-var allocation), then stores CUR_STATE_DESTROY\ninto oBattleObject_CurStateActionPhaseAndPhaseInitialized.\n\
  \nThe alliance parameter table at byte_80CD478 is:\n  alliance 0: param2=0x00000020, param3=0x00000000\n  alliance\
  \ 1: param2=0x00000020, param3=0x00000000\n(both entries identical in this ROM, likely differing in other battle\
  \ scenarios).\n"
