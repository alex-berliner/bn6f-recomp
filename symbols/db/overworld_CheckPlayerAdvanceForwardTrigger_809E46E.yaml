name: overworld_CheckPlayerAdvanceForwardTrigger_809E46E
address: '0x0809E46E'
kind: function
status: confirmed
summary: Overworld hook that checks the player's coordinate trigger tile and, if it is one of the "player advances
  forward" tiles (0x48-0x4F), records which one it is and sets the advance-forward event flag.
interface: 'void sub_809E46E(void); // no register inputs; r10 holds the toolkit pointer. Outputs: none returned,
  side effects only (halfword store to player+0x64, event flag EVENT_1717 set). Clobbers r0-r3, r7 (saved/restored),
  flags.'
details: 'Reads the toolkit''s GameState pointer via r10 (oToolkit_GameStatePtr), then the overworld player object
  pointer from GameState+oGameState_OverworldPlayerObjectPtr. Calls checkCoordinateTrigger_8031a7a with r0 = player
  + 0x1C (the coordinate trigger field of the player object). If the returned trigger value is in the range 0x48..0x4F,
  subtracts 0x48 to get a 0..7 index and stores it as a halfword at player+0x64, then calls SetEventFlagFromImmediate
  with EVENT_1717_PLAYER_ADVANCE_FORWARD (0x1717, passed as bank 0x17 / index 0x17). If the trigger is anything
  else the function returns without touching anything. The halfword at player+0x64 presumably tells a later script/handler
  which "advance forward" tile the player stepped on.

  '
