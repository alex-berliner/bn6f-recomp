name: sub_80FD638
address: '0x080FD638'
kind: function
status: confirmed
summary: 'Battle AI attack wind-up: decrements a per-attack timer, then commits the reserved target panel, snaps
  the attacker onto it, and arms the recovery/cooldown state.'
interface: void sub_80FD638(battleObject* r5, aiAttackVars* r7); /* clobbers r0,r1,r2,r3,lr; NZCV */
details: 'Reads/writes the battle-object struct (r5) and the per-attack AI vars (r7).

  Decrements the halfword at oAIAttackVars_Unk_10 each tick; while it remains

  positive, the function simply returns (the early `pop {pc}` is the idle

  branch). When the counter reaches zero or below, it kicks off the real

  attack: sets CurAnim = 3 (the attack swing), copies the reserved target

  panel (FuturePanelX/Y) into the live PanelX/Y, releases the panel reserve

  via object_removePanelReserve, and resyncs world position and collision

  panels via object_setCoordinatesFromPanels and object_updateCollisionPanels.

  It then reinitialises the attack state machine: Unk_10 = 4 (recovery) and

  Unk_00 = 8 (animation/state index). CurAnim = 3, Unk_00 = 8 and the

  Unk_10 = 4/1 pattern are consistent with the standard NN battle AI attack

  "phase 0 wind-up -> phase 1 swing" split used elsewhere in the series.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
