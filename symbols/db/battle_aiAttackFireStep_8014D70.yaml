name: battle_aiAttackFireStep_8014D70
address: '0x08014D70'
kind: function
status: confirmed
summary: Per-actor AI attack step handler that counts a charge timer down, then on expiry fires the attack
  (charge-up sound, effect spawn, lift, attack cry, camera shake) and arms the hit phase.
interface: void battle_aiAttackFireStep(u32 r2 soundArg, battle_object_t *r5 obj, ai_attack_vars_t *r7
  attackVars, u32 r10 passthrough); // outputs r5/r10 as left by callees; N/Z/C/V clobbered
details: "r7 points at the actor's AI attack variables and r5 at its battle object; r2 is an\nuntouched\
  \ argument the first PlaySoundEffect call needs (passed through in r2), and\nr10 is likewise carried\
  \ through to callees (cameraSetShake).\n\nWhile oAIAttackVars_AttackElement (r7, byte) is 0, oAIAttackVars_StepTimer\
  \ (halfword)\nis decremented once per call; nothing else happens until it underflows (negative\n32-bit\
  \ result of the zero-extended load). On underflow the attack fires:\n  - SetAIDataUnk0x48Flag(0x80000,\
  \ obj) sets an AI-data flag\n  - PlaySoundEffect(0xF7) charge-up sound\n  - spawn_t1_0x0_EffectObject\
  \ is called with three consecutive words read from\n    obj+0x34/0x38/0x3C plus a type word 0x2E | (Alliance\
  \ << 8)\n  - if the spawn succeeds (nonzero handle): the effect's oBattleObject_Timer is set\n    to\
  \ 54 frames, flag bit 2 (0x4) is OR'd into oObjectHeader_Flags, the attacker's\n    oBattleObject_Y\
  \ is raised by 0xC00000 (one tile, fixed point), the alliance's\n    slot in the indexed table is set\
  \ via setIndexedTableByte(alliance, 2, 1), the\n    attack cry plays (sound 0x1CC if battle_ai_getActorInfo_801595E(alliance)\n\
  \    returns 0xB, otherwise 0x1CD), and cameraSetShake(2, 60) shakes the camera.\n    If the spawn pool\
  \ is exhausted, all of this is skipped.\n  - the timer reloads to 0x36 (54) and AttackElement is set\
  \ to 4 (fired); if the\n    spawn failed the timer/element are still updated (fall-through loc_8014DDE).\n\
  The shared tail then decrements the reloaded timer once more; whenever a tail\ndecrement underflows,\
  \ oAIAttackVars_HitElement is set to 8 (hit lands next).\nOnce AttackElement is nonzero, only the tail\
  \ decrement runs each call.\n\nQuirk: both decrements compare the full 32-bit subtraction result (the\
  \ 16-bit\nfield is loaded zero-extended into a register), so timer values of 0x8000..0xFFFF\nstill count\
  \ as non-negative. Preserves r4/r6 with push/pop because the callees\n(PlaySoundEffect, effect-object\
  \ spawner) clobber them.\n"
