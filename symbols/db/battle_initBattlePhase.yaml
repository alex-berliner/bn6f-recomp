name: battle_initBattlePhase
address: '0x08009CD0'
kind: function
status: probable
summary: 'Battle sub-phase handler: initializes the battle once (spawn enemies, pause, play battle BGM),
  then waits and transitions to the next battle state.'
interface: (r0 = battle state ptr in r5-style global) -> r0 = clobbered; sets oBattleState_SubPhaseInitFlag/StatePhase/Index_01
  on the battle state
details: 'On first run (SubPhaseInitFlag==0) it reads the battle-effects bitmask: if bit 0x400 is set
  it increments State4EventCount, otherwise it copies BattleSettings byte 5 into State4EventCount. It
  then spawns a type-4 object, spawns the enemy objects from the enemy setup array, sets the paused-battle
  flag, applies the navi stat table entry, and plays BGM — song 0x15 if effects bit 8 is set, otherwise
  BattleSettings byte 2, skipped entirely if that value is 0x63. It sets SubPhaseInitFlag=4 to mark init
  done. On later runs it calls sub_8009D58 once, then polls state word 5c bit 2 (via battle_getStateUnk5c
  >> 2); when set it dispatches (dispatch_801DA48 with 1), sets request bits in eStruct2035280, and stores
  4 or 0x24 into oBattleState_Index_01 depending on event flag EVENT_1735, then clears StatePhase and
  the init flag to end the phase.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'callee battle_SpawnEnemyObjects_8007358 spawns the battle''s enemy objects; callee PauseBattle
    sets the battle-paused flag on the game state; GetBattleEffects result tested against 0x400 and 8
