name: battle_objectCheckGuardAction_80EAF1A
address: '0x080EAF1A'
kind: function
status: confirmed
summary: Checks whether a battle object's current action is 0x52 (a guard/shield-style action) and returns
  0xC if so, else 0.
interface: u32 battle_objectCheckGuardAction_80EAF1A(BattleObject* r5)
details: 'Tiny predicate helper: reads oBattleObject_CurAction (byte) from the battle

  object passed in r5 and compares it against action ID 0x52. Returns 0xC in r0

  when the object is currently performing that action, otherwise 0. The nonzero

  result (12) is likely a status/mask value consumed by a caller (e.g. damage

  calculation or an effect check that reacts to the object guarding). r5 is not

  modified; r1 is scratch; flags are clobbered by the cmp.

  '
