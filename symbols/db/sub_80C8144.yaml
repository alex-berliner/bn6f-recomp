open_questions:
- Why is `CurPhase` latched to 4 specifically — is 4 the "stepping" subphase and the host state handler expects
  to see this value before doing other work?
- What is the meaning of the `0x00200000` argument to `spawn_t1_0x0_EffectObject` — z-position / drawing priority
  / layer id?
- What is the exact sound bank argument (the wrapper threads `spawn_t1_0x0_EffectObject`'s r2 scratch into `PlaySoundEffect`'s
  r2); is it really the effect's r2, or a coincidence of the spawn wrapper?
- Is `CUR_STATE_DESTROY` the canonical self-destruct state for an object that walks off the play field, or is there
  a dedicated "fell off" state elsewhere?
