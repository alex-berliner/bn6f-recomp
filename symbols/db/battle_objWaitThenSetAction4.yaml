name: battle_objWaitThenSetAction4
address: '0x080D0310'
kind: function
status: confirmed
summary: Battle object helper that plays sound effect 0x146, waits 11 frames, then switches the object to CurAction
  4.
interface: void battle_objPlaySfxWaitThenSetAction4(battleobject* obj /* r5 */, u32 sfxArg /* r2, pass-through to
  PlaySoundEffect */); no meaningful return values (callers see whatever r5/r10 PlaySoundEffect leaves behind);
  flags clobbered
details: State-machine stepper for a battle object (r5). On the first invocation (oBattleObject_CurPhase == 0) it
  stores phase 4 into oBattleObject_CurPhase, calls PlaySoundEffect with id 0x146 (built in-code as 0x47 + 0xFF),
  and loads oBattleObject_Timer with 11 (0xB) frames. On subsequent invocations it decrements the 16-bit oBattleObject_Timer;
  while the result is still positive as a signed 32-bit value (BGT) it just returns. Once the timer hits zero or
  below it writes 4 to oBattleObject_CurAction and clears oBattleObject_CurPhaseAndPhaseInitialized to 0, handing
  control back to the action dispatcher. r2 is only a pass-through argument to PlaySoundEffect and is preserved.
  The phase/timer handshake means the caller must re-enter this function each frame until the action fires.
