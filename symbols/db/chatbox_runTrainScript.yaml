name: chatbox_runTrainScript
address: '0x08040374'
kind: function
status: confirmed
summary: Runs one of the train-ride text scripts (archive eTextScript2034A04) by index through the generic chatbox
  script runner.
interface: void chatbox_runTrainScript(u8 script_idx /* r0 */)
details: 'Tiny wrapper: moves the script index from r0 into r1 and calls

  chatbox_runScript with r0 = eTextScript2034A04 (the text-script archive

  used for the train ride sequences). It is a pure pass-through otherwise:

  r4, r5 and lr are pushed and popped, so everything above r3 that the

  runner needs is forwarded untouched. The script selection is purely

  numeric, so which line of train dialogue plays is decided by the caller.

  '
