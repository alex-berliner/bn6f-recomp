name: battle_spawnAlliancePanelEffect
address: '0x081039A4'
kind: function
status: probable
summary: Spawns a battle effect object on the calling object's side of the field, choosing one of four
  effect variants by the r0 index.
interface: (r0 = 1-based variant index, r5 = battle object whose Alliance field selects the field side)
  -> r0 = spawned effect object pointer
details: The index in r0 is decremented and used to pick a byte from the table at dword_81039D4 (values
  0x35,0x36,0x37,0x38). The object's oBattleObject_Alliance is doubled to index a per-alliance pair of
  panel column/row values at dword_8103A04, which object_getCoordinatesForPanels converts to 16.16 fixed-point
  screen coordinates. It then calls spawn_t1_0x0_EffectObject to create a type-0 effect object, with the
  effect parameter built as (alliance << 8) | variant byte in r4. So each alliance/side of the battlefield
  gets its own effect variant id, suggesting a per-side panel visual (e.g. panel break/crack states 0x35-0x38).
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'sub r0,#1 + ldrb r0,[r0_table] indexes dword_81039D4 = bytes 37 36 35 38, four effect variants;
    ldrb r0,[r5,#oBattleObject_Alliance]; lsl #1 indexes dword_8103A04 pair fed to object_getCoordinatesForPanels;
    orr r4,(alliance<<8)|variant before bl spawn_t1_0x0_EffectObject encodes side+variant into the spawned
    effect; callees are exactly the panel-coordinate converter and the effect-object spawn wrapper'
