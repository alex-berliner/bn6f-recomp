  date: '2026-10-18'
  detail: 'ldrh r2/r3 from [r5, r8+0x20]/[r5, r8+0x24] and strh back at end: cursor coordinates in a record;
    tst 0x40/0x80 steps r2 by 1, tst 0x100/0x200 steps r3 by 5: directional grid movement with 5-per-row
    layout; clamps against r9=(r1&~0x80)-1 and [r5+r8+0x1E]-derived bound, with wrap logic gated on r2
    (r12) flag; bl PlaySoundEffect with SOUND_MENU_CUR_MOVE and return r7=0xff on change, 0 otherwise;
    single caller sub_8130370 and routes covering menus/maps/battles fit a shared menu cursor helper'
