name: submenu_moveGridCursor
address: '0x0811F91C'
kind: function
status: probable
summary: Moves a 2D (row/column) cursor within limits by a direction bitmask (0x40=col-1, 0x80=col+1,
  0x100/0x200=row±5, with bit7 of r1 selecting the row direction), optionally wrapping at edges when r2
  is nonzero, and plays the cursor-move sound if either coordinate changed.
interface: '(r0 = direction/key bitmask (0x40: coordA-1, 0x80: coordA+1, 0x100: coordB+5, 0x200: coordB-5),
  r1 = limit value (bit7 = alt step flag, low bits-1 = coordA max index), r2 = nonzero to wrap at edges,
  r3 = offset of record in the global struct at r5) -> r0 = 0xFF if cursor moved else 0; destroys r4-r7,
  r8-r9, r12'
details: 'Reads current coordinates from halfwords at record+0x20 and record+0x24 and a total count at
  record+0x1E of a sub-record selected by r3 inside the structure r5 points at (r5 is never set here,
  so it is a fixed global base). coordA steps by 1 for bits 0x40/0x80 and coordB by 5 for bits 0x100/0x200
  (or unconditionally by 5 down when bit7 of r1 is set), clamped to [0, max] where coordA''s max is (r1
  & ~0x80)-1 and coordB''s max is count-(maxA+1). With r2 nonzero, moving past an edge wraps: coordA jumps
  to the opposite end and coordB shifts a row, with special cases resetting both to 0. If either coordinate
  changed it plays SOUND_MENU_CUR_MOVE via PlaySoundEffect and returns 0xFF; otherwise returns 0. New
  coordinates are stored back to record+0x20/+0x24.'
