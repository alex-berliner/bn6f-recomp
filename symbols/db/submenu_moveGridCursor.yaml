  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The summary is mostly right: direction bits 0x40/0x80 step coordA by 1, 0x100/0x200 step coordB
    by 5, with wrap support and PlaySoundEffect on change. However, the direction-bit mapping is inverted
    vs the proposal: lines testing 0x40 subtract (move up) and 0x80 add (move down) for coordA, and 0x100
    adds/subtracts coordB while 0x200 triggers the alt path. Also r2 (r12 saved) being nonzero controls
    wrap, not just ''wrap at edges'', and bit7 of r1 selects the coordB-direction branch (lines `lsr r1,
    r1, #7; tst r1, r1` at both 0x811F946 and 0x811F990). The name and summary should reflect 2D cursor
    movement with wrap.; run wf investigate investigate-20261018-212108; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
