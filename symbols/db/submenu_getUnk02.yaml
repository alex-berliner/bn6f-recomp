name: submenu_getUnk02
address: '0x0813561C'
kind: function
status: probable
summary: Tiny getter returning byte 0x02 of the sSubmenu state struct (likely a selection/state index)
  for the beast-SP text-sequence handlers.
interface: () -> r0 = sSubmenu.unk_02 (byte, zero-extended); no flags set meaningfully (ldrb does not
  set flags).
details: Loads the address of sSubmenu from a literal pool, reads the byte at offset 0x02, and returns
  it in r0 — nothing else. All five callers are submenu/beast-SP input-and-script step handlers that compare
  this value to advance scripts 0xb/0x10/0x11, so the field is evidently the submenu's current state/cursor
  byte. Adjacent data (byte_8135628 lookup tables and tile-index table at 0x21C0+) belongs to the same
  submenu module but is not referenced by this function.
