name: battle_updateBombFallLanding
address: '0x080CF4E6'
kind: function
status: probable
summary: Update handler that lets a falling bomb object travel via timer-controlled X/Z velocity until
  the timer expires, then snaps it to panel coords, optionally detonates (per panel status mask 0xF800010)
  by spawning a type-0 t4 effect, playing SOUND_HIT_BOMB_1, optionally shaking the camera, and setting
  collision region 1; always transitions to CurAction=8 and clears flag bit 1.
interface: (r5 = battle object) -> void; sets oBattleObject_CurAction=8 on landing
details: 'Decrement oBattleObject_Timer; while nonzero, add XVelocity to X and subtract ZVelocity from
  Z (parabolic fall) and return. On timeout: recompute pixel coords from PanelX/PanelY, zero Z, and read
  panel status via object_getPanelParameters; mask 0xF800010 selects which panel states allow detonation.
  If it detonates: spawn a type-4 effect object taking 3 parameter words from the object at offset 0x34,
  play SOUND_HIT_BOMB_1, and if byte 4 of oBattleObject_ExtraVars is set, request a camera shake (0xF,
  0xF) via camera_initShakeEffect; then object_setCollisionRegion(1). Finally it sets CurAction to 8 (post-blast
  state), clears CurPhaseAndPhaseInitialized, and clears flag bit 1 (0x2) in oObjectHeader_Flags.'
