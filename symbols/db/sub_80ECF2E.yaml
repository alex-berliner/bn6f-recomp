name: sub_80ECF2E
address: '0x080ECF2E'
kind: function
status: confirmed
summary: Dispatches to one of two AI attack handlers based on the state byte stored in the AI attack variable block
  pointed to by r7.
interface: 'void sub_80ECF2E(void /* r7 = AI attack vars */);

  // inputs: r3, r5, r6, r7 (AI attack vars pointer), r10, lr (return)

  // outputs: r1, r5, r8, r9, r10, r11, r12 (inherited from handler)

  // clobbers: N, Z, C, V flags; r0, r2, r3, r4, r6, r7, lr

  '
details: 'Reads the 8-bit attack-state byte at oAIAttackVars_Unk_00 within the AI

  attack variable block (offset into the structure pointed to by r7).

  Uses that byte as an index into the 2-entry jump table at off_80ECF40

  (state 0 -> sub_80ECF48, state 1 -> sub_80ECF8E), then performs an

  indirect call via `mov lr, pc; bx r1` (a Thumb-mode dispatcher).

  r0 receives the state byte and r1 the resolved handler address before

  the indirect branch; the chosen handler''s outgoing register footprint

  (r1, r5, r8-r12) becomes this function''s caller-visible output.

  The state byte index is not bounds-checked, so table-size assumptions

  limit the dispatcher''s set of states to two entries.

  '
