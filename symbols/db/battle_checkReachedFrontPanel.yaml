name: battle_checkReachedFrontPanel
address: '0x080DD2E0'
kind: function
status: probable
summary: Checks whether a battle object has finished moving to the panel in front of it and, if so, snaps
  its position to that panel's center.
interface: (r5 = battle object) -> r0 = 1 if the object has arrived at its front target panel (X/Y snapped
  to panel coordinates), else 0; no flags meaningful
details: 'Reads the object''s ExtraVars pointer and aborts with 0 if null. Uses ExtraVars+0x12 as a target
  column offset: (PanelX - offset) * getFrontDirection() must be >= 0, i.e. the target panel lies in the
  object''s facing direction, otherwise returns 0. It then converts PanelX/PanelY to fixed-point pixel
  coordinates and computes the horizontal distance |panelX - obj.X|; if that distance exceeds 0x30000
  (3.0 pixels) the object hasn''t arrived yet and 0 is returned. On arrival it writes the panel''s pixel
  coordinates into oBattleObject_X/Y and returns 1. ExtraVars+0x12 appears to be a step/move-target column
  set by the caller (a sweeping enemy routine).'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: tst on [r5,#oBattleObject_ExtraVars] with beq return shows it operates only on objects with
    extra vars; sub r3, PanelX, [extra,#0x12] then mul by object_getFrontDirection and blt gives a facing-direction
    guard; two object_getCoordinatesForPanels calls plus the 0x30000 compare implement an arrival-distance
    threshold in fixed-point pixels; str of panel coords into oBattleObject_X/Y and mov r0,#1 is the arrival/snap
    success path; sole caller sub_80DD1AC sits on the 'battlesweep' route, consistent with an enemy stepping
    panel by panel
