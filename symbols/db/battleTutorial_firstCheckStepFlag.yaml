name: battleTutorial_firstCheckStepFlag
address: '0x08029BAC'
kind: function
status: probable
summary: Checks the first-battle tutorial's per-step flag and returns a nonzero code (0xB/0xC) when the
  current step is in its expected state, else 0.
interface: (r5 = first-battle tutorial task state; no args used) -> r0 = 0xB if step 1 flag==0, 0xC if
  step 0/2 flag==1, else 0; flags not meaningful
details: 'Reads the tutorial task''s current step from [r5+8] and only proceeds for steps 0-2 (anything
  else returns 0). For each valid step it reads a per-step flag byte at r5+0x47+step — a small 3-byte
  progress array right after the task''s other state. Step 1 is special: it requires the flag to be 0
  and returns 0xB, while steps 0 and 2 require the flag to be 1 and return 0xC. The returned values are
  almost certainly IDs handed back to the caller (battleTutorial_first_checkTextStep) to decide which
  chatbox script to trigger, with 0 meaning ''nothing to play for this step''. The asymmetry suggests
  step 1''s flag means ''not yet acknowledged'' whereas steps 0/2 flags mean ''condition met''.'
