name: palette_fillBufferWithFadeByte_8128260
address: '0x08128260'
kind: function
status: confirmed
summary: Fills a 0x100-halfword palette-sized buffer at unk_2026870 with a color word built from the byte stored
  at byte_812798A (byte << 8), likely resetting/fading the palette buffer.
interface: 'void sub_8128260(void); /* in: none (r3 preserved incidentally); out: r2 = fill value; clobbers r0,r1,r2,flags,lr
  */'
details: 'Loads the destination EWRAM buffer unk_2026870, a halfword count of 0x100 (512 bytes, exactly the size
  of the GBA palette RAM / full 256-color BG+OBJ palette buffer), and a fill source byte from the ROM byte byte_812798A.
  The byte is promoted to a halfword pattern by shifting left 8, so every halfword written is 0xNN00 (high byte
  = source byte, low byte = 0). It then tail-calls HalfwordFill to do the actual fill and returns directly from
  it. r2 still contains the computed fill value on return, which callers may read. The byte<<8 promotion rather
  than a byte replicate suggests the value is meant as a palette color word (e.g. a fade/blanking level written
  as 0xNN00) rather than a plain fill byte; with the common case of the stored byte being 0 this zeroes the whole
  buffer, i.e. a "set palette buffer to black" step typical before loading new palettes or during fades.

  '
