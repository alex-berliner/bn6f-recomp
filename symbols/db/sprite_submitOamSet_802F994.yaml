name: sprite_submitOamSet_802F994
address: '0x0802F994'
kind: function
status: confirmed
summary: Selects one of three ROM OAM sprite data sets by index and passes it to the sprite rendering
  routine for on-screen submission.
interface: 'void sprite_submitOamSet_802F994(u32 index /*0-2*/); // clobbers: r0, r1, c, v; preserves
  r4-r7'
details: 'Shifts the index in r0 left by 2 and uses it to dereference a 3-entry pointer table at off_802F9A8.
  The table maps: [0] -> byte_802F9B4 (palette/priority attr 0x30), [1] -> byte_802F9D0 (attr 0x40), [2]
  -> byte_802F9D0 (same as [1]). Each target is a small block of GBA OAM entries (3 sprites × 8 bytes
  + padding). The resolved pointer is handed to sub_8001158, an external sprite/OAM rendering helper whose
  full interface is not yet typed. Flags (C, V) and registers r2-r7 are left as-is from the callee and
  may be inspected by the caller. r4-r7 are merely stack-saved across the call; the function''s own logic
  only depends on r0.

  '
