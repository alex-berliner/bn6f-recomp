name: sub_8009158
address: '0x08009158'
kind: function
status: confirmed
summary: 'Battle state tick: runs the current state''s phase handler (via the jump table at off_80091BC) and updates
  the low-HP warning siren based on the player''s HP crossing a quarter of max.'
interface: void battle_dispatchStatePhase_8009158(void);  // r5 = battle state in/out; r2,r3,r4,r5,r6,r8,r9,r10,r11,r12
  carry callee return values; clobbers nz,c,v,r0,r1,r7,lr
details: "Reads the state's index byte (oBattleState_Index_01) and dispatches through the\n10-entry function pointer\
  \ table at off_80091BC (entries for indices 0x00..0x24\nresolve to sub_80091F0, battle_dispatchStatePhase_80092A0,\
  \ sub_8009338,\nsub_800938A, battle_DispatchStatePhase_800945C, sub_80094DA, sub_800951E,\nsub_8009552, sub_8009594,\
  \ sub_80095C8).\nAfter the phase handler returns, if GetBattleEffects() bit 0x8\n(BATTLE_EFFECTS_LOW_HP_WARNING)\
  \ is clear the function returns.\nOtherwise fetches the player object via\nbattle_preUpdateAndGetPlayerObject_80103EC\
  \ and compares oBattleObject_HP\nagainst oBattleObject_MaxHP >> 2.\n  - HP > quarter-max and oBattleState_Unk_20\
  \ != 0 -> clear Unk_20, call\n    sound_800065A(0x1F, 0xFFFF, 0) then sound_8000672(0x1F, 0x100) to stop\n   \
  \ the siren.\n  - HP <= quarter-max and oBattleState_Unk_20 == 0 -> set Unk_20 = 1, call\n    sound_800065A(0x1F,\
  \ 0xFFFF, 0x100) then sound_8000672(0x1F, 0x11A) to\n    start the looping low-HP siren (sound id 0x11A).\nHysteresis\
  \ is implemented by only toggling the siren when the state of\noBattleState_Unk_20 disagrees with the current\
  \ HP band, so the pair of\nsound calls fires at most once per crossing.\nTouches: oBattleState_Index_01, oBattleState_Unk_20,\
  \ oBattleObject_HP,\noBattleObject_MaxHP.\n"
