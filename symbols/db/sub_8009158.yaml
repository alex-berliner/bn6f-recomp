open_questions:
- What oBattleState_Unk_20 actually represents beyond "low-HP warning latch"; same field is shared with other phase
  handlers, so it may be a more general "audio cue active" flag.
- Exact meaning of GetBattleEffects() bit 0x8 (it is a per-battle toggle that allows the low-HP check to be disabled,
  e.g. in scripted/custom battles).
- Why the warning arm call uses 0x100 as a parameter to sound_800065A while the disarm call uses 0 - the 0x100 is
  also the sound id used to stop the warning, so the two arguments may be unrelated to the sound id.
