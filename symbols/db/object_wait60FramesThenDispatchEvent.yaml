name: object_wait60FramesThenDispatchEvent
address: '0x08008364'
kind: function
status: probable
summary: Per-frame object update that initializes a 60-frame timer on first run, then dispatches object
  event 0x800 and sets state 4 when the timer expires.
interface: (r0 unused on entry; r5 = object/actor struct) -> void; updates r5 fields at +2 (halfword),
  +3 (byte), +8 (halfword)
details: On first invocation (byte at r5+3 == 0) it zeroes the halfword counter at r5+8 and writes 4 to
  the byte at r5+3, marking the object as started/active. Each call then increments the r5+8 counter;
  once it reaches 0x3C (60 frames, one second), it calls dispatch_801DACC with event flags 0x800 and writes
  4 as a halfword to r5+2, likely the object's current state/command field. The counter is not reset,
  so the dispatch fires exactly once and the state write ends this behavior. r5 is accessed directly (not
  via r0), so the caller sets up r5 before invoking, typical of an object state-machine step table.
