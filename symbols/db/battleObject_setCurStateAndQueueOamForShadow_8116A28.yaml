status: probable
summary: Sets a battle object's CurState to 0x8 (CUR_STATE_DESTROY) when its current state is already
  0x8, then queues OAM entries via the battleObject shadow helper.
interface: '(r5 = BattleObject*, r7 = some u8* state mirror) -> void ; side effects: writes [r5+8] = 0x8
  when [r7] == 8, then bl to battle_queueOamEntriesForBattleObjectStateShadow_8116A44'
details: "The function reads the byte at [r7] and compares it to 8. If equal, it loads 8 into r0 and\n\
  \  stores it at [r5+8] (the CurState field of the BattleObject struct). It then unconditionally\n  bl's\
  \ into sub_8116A44 (named here as battle_queueOamEntriesForBattleObjectStateShadow_8116A44)\n  and returns.\
  \ r5 is the BattleObject pointer (per the oBattleObject struct: CurState is at\n  loc=0x8, an enum8\
  \ with CUR_STATE_DESTROY = 0x08). r7 is treated as a separate u8 shadow/state\n  byte; the function\
  \ only writes [r5+8] when [r7] also already equals 8, so this looks like a\n  guard to ensure we only\
  \ re-set the destroy state when the shadow already reports it (likely an\n  idempotent re-enqueue path\
  \ during the destroy phase). The function is invoked 40 times in the\n  snap_story2_* captures with\
  \ consistent r0=0x08116a29 (LR-1 of an `add r0, pc, #0` from the\n  caller at 0x081169b8-ish) and r5/r7/r2/r3\
  \ fixed across all story2 captures, suggesting it is\n  called once per battle object per frame from\
  \ a state-update loop. The callee (sub_8116A44) is\n  the only one and is the OAM-queue helper. No other\
  \ side effects in this function itself.\n"
