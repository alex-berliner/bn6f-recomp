name: flags_clearBits_eStruct2035280_801BED6
address: '0x0801BED6'
kind: function
status: confirmed
summary: Clears the bits selected by the mask in r0 within the flags word at dword_20352C0 and leaves the updated
  value's NZ flags set for caller branching.
interface: void flags_clearBits_eStruct2035280(u32 mask /* r0 */) -> returns u32 base in r1, u32 newValue in r2,
  flags NZ from newValue
details: 'Loads the pointer at eStruct2035280, then dereferences offset 0x40 (absolute

  dword_20352C0) inside that structure. Performs *field &= ~mask (BIC), stores the

  result back, and returns with r1 = base address of eStruct2035280, r2 = the new

  value, and the NZ flags set on that value. This is a small "clear these flag bits"

  helper on the per-frame/global state struct; every caller apparently inspects the

  result (branches on the updated word) even though the write itself is the only

  side effect. Note the value returned in r2 is the post-update value, so a caller

  clearing bits can immediately test whether any of the cleared bits are still set

  or whether the whole word became zero.

  '
