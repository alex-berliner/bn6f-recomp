  reproduce: python3 tools/asmcat.py 0x08125128
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The structure matches: five draws then IsScreenFadeActive with state advance to 8 in r5+1 fits the
    code at 0x0812513E-0x08125144. However, r5 is not established in this snippet (no push {r5,...} or
    mov r5,r6); the proposal''s interface assumes r5 is a callee-preserved object pointer, but the function
    only pushes lr and pops pc, meaning r5 is a caller-supplied argument or global. Also it is not a ''step''
