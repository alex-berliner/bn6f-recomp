name: battle_drawIntroScene
address: '0x08125128'
kind: function
status: probable
summary: 'Battle intro scene draw: blits the progressive intro tile graphic, queues an OAM entry, pumps
  the battle transition (reloading tilemaps when flagged), draws the arena floor, and runs a fixed-arg
  overlay; when no screen fade is active it writes 8 to the state byte at r5+1 to advance the phase.'
interface: (r5 = battle-scene/state object) -> r0 = 8 stored to [r5+1] when screen fade finished; no return
  value otherwise; flags clobbered by bls
details: 'Runs five drawing/update calls in sequence: sub_812674C (progressive two-part tile blit reveal),
  sprite_queueBattleOamEntry, battle_runTransition_8125444 (which also reloads static/scene tilemaps when
  its r5+0x70 flag is set — likely the same object), bg_drawArenaTiles_8125E78, and sub_8126524 (fixed-arg
  wrapper, probably another overlay draw). It then checks IsScreenFadeActive; while a fade is running
  it just returns, letting this state repeat each frame. When the fade is done it writes 8 to r5+1, the
  state/phase byte of the object at r5, moving the sequence to its next phase.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl chain: sub_812674C, sprite_queueBattleOamEntry, battle_runTransition_8125444, bg_drawArenaTiles_8125E78,
    sub_8126524 — all battle-intro/arena drawing steps; bl IsScreenFadeActive + beq locret: state advance
    is gated on fade completion; mov r0,#8; strb r0,[r5,#1] — writes next state ID 8 into the object''s
    phase byte; battle_runTransition_8125444 uses the r5+0x70 flag and reloads tilemaps, matching this
    routine''s transition-role context'
