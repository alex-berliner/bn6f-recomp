  date: '2026-10-14'
  detail: '- `mov r0, #0` followed by `bl sub_80028C0` (asm00_1.s:2017) is the entire body, and sub_80028C0
    is documented as recording the palette count in slot r0. - All 6 shown captured calls enter with r0=0
    and exit with r0=0, flags -Z-- unchanged, consistent with r0 just being a slot argument. - Callers
    battle_update_8007A44, sub_8007E62, sub_8007F4E are all battle-scoped update paths that touch sprite
    palettes each frame.'
