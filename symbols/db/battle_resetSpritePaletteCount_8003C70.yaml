status: probable
summary: Resets the queued sprite palette count slot (r0) to 0 via sub_80028C0.
interface: '(r0 = slot index 0) -> r0 = 0 ; side effect: writes to battle sprite palette bookkeeping'
details: "Two-instruction wrapper. Saves lr, sets r0 to 0 and calls sub_80028C0, whose one-liner says\n\
  \  it \"records the sprite palette count (dword_200F340) in slot r0 of byte_200F389 after each\n  sprite\
  \ group is queued.\" Called from battle_update_8007A44 and the two unnamed sub_8007E62 /\n  sub_8007F4E\
  \ updates, with r0 always 0 across the captured snap_story2 samples. Functions as\n  a typed \"reset\
  \ queued palette count for the current sprite group\" helper. The 40 captured\n  calls with the same\
  \ lr=08007b35 indicate it is invoked every frame of the story2 scene.\n"
