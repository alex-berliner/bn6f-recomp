open_questions:
- Whether "reset" is the right verb vs. "commit current count into slot 0"; the callee
- semantics say "record the count in slot r0", so passing 0 writes slot 0 of byte_200F389
- with dword_200F340, which functionally resets that slot to whatever dword_200F340
- currently is. Naming the slot count "queued palette count" is an inference from the
- '"after each sprite group is queued" note, not directly visible here.'
