summary: Triggers a camera shake effect by writing magnitude and duration into the camera struct.
interface: u32 camera_initShakeEffect_80302a8(u16 magnitude, u16 duration); // r2 = camera ptr
details: 'Resolves the active camera struct via the toolkit global at r10->oToolkit_CameraPtr, then

  writes r0 to oCamera_Unk_0e (shake magnitude) and r1 to oCamera_Unk_0c (duration/period).

  Returns the camera pointer in r2 for the caller''s convenience (and to match the lifter''s

  register contract). The trailing .word 0x21002000 is pool/padding data past the function

  body and is not executed.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
