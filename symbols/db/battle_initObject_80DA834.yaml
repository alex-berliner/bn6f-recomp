name: battle_initObject_80DA834
address: '0x080DA834'
kind: function
status: confirmed
summary: Initializes a battle object—position, collision, HP, palette, state, and first action—then hands off to
  the action state machine.
interface: void battle_initObject_80DA834(struct BattleObject *obj /* r5 */); /* r4,r6-r12,lr pass-through; outputs
  r0-r3,r4-r12,lr,nzcv from sub_80DA886 */
details: "Called during battle-object spawn. Operates on the object pointed to by r5. Steps in order: (1) Calls\
  \ object_setCoordinatesFromPanels to place the sprite on the grid. (2) Zeroes obj->Z (oBattleObject_Z). (3) Loads\
  \ a fixed collision descriptor pair (0x100100C, 0xE0F0300) and calls sub_8011504\n    to build a collision descriptor;\
  \ the result is passed forward.\n(4) Sets ObjectHeader_Flags bit 1 (active flag). (5) Writes HP = MaxHP = 1 (obj\
  \ is a single-hit entity). (6) Calls object_setCollisionHitEffect with effect id 0xFF (the \"generic\" hit flash).\
  \ (7) Calls object_presentCollisionData to register the collision geometry (this also\n    updates r1/r2 in place\
  \ with refined collision parameters).\n(8) Calls sprite_setUnk0x2c with 0xFF80000 to tint the sprite palette.\
  \ (9) Sets CurStateActionPhaseAndPhaseInitialized to CUR_STATE_UPDATE (starts the update loop). (10) Reads battle_getFlags();\
  \ if bit 0 is set it clears ObjectHeader_Flags bit 2 (index 4)\n     and selects initial action 4, otherwise action\
  \ 0.\n(11) Writes CurAction, then tail-calls sub_80DA886 (the action-state-machine starter)\n     whose r0-r2/flags\
  \ become this function's outputs.\nData constants live in a small literal pool at 0x080DAA18-0x080DAA20.\n"
