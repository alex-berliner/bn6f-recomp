name: sub_811A500
address: '0x0811A500'
kind: function
status: confirmed
summary: Dispatches the per-frame update of the "object" in r5 by jumping through a type-indexed table of two handlers
  (offsets 0 and 1 of the object's type byte).
interface: 'void object_dispatchUpdate_811A500(/* r5 */ struct Object* obj);

  // reads r5; clobbers r0..r4,r6..r9,r12,lr,NZCV; returns to caller with r5/r10/r11 as

  // the handler''s outputs

  '
details: 'The function reads the object''s type byte at [r5+7], shifts it left by 2 to get a

  word index, and loads a 32-bit handler address from the two-entry table at off_811A514

  (table itself stored via off_811A510). It then performs `mov lr, pc; bx r0`, which

  transfers control to the handler in Thumb mode (note the +1 in the table entries,

  e.g. `sub_811A51C+1`, `sprite_updatePositionAndClamp_811A57C+1`) with every register

  preserved and PC/LR set so the handler returns directly to this function''s caller.

  The `pop {pc}` then tail-returns. In effect this is a small vtable dispatch: index 0

  goes to sub_811A51C (an as-yet unnamed update), index 1 goes to

  sprite_updatePositionAndClamp_811A57C. Only two entries are present in the table as

  seen here, so only type values 0 and 1 are recognised.

  '
