name: input_recordStateChangeForEntry_800A0D6
address: '0x0800A0D6'
kind: function
status: confirmed
summary: Writes a new 16-bit value into one 8-byte slot of the dword_2036820 state table, computing which bits were
  newly set and newly cleared versus the previous value.
interface: void input_recordStateChangeForEntry(u32 entryIndex /*r0*/, u16 newValue /*r1*/); // returns r2 = bits
  cleared this update, r3 = entry address, c/v from the address ADDS
details: "Updates one entry (8 bytes, so index is scaled by <<3) of the array at dword_2036820,\nwhich looks like\
  \ a per-entity/per-slot state table with edge tracking:\n  +0: (untouched by this function)\n  +2: current 16-bit\
  \ value - overwritten with r1\n  +4: 16-bit mask of bits that changed 0 -> 1 (newly set), stored as ~prev & new\n\
  \  +6: 16-bit mask of bits that changed 1 -> 0 (newly cleared), stored as prev & ~new\nThe layout (current / newly-set\
  \ / newly-cleared halfwords) is the classic pressed/held/released\ninput-edge pattern, so dword_2036820 is likely\
  \ an input or trigger state table where a caller\nwrites a fresh button/flag bitmask each frame and other code\
  \ reads the edge masks.\nQuirks: only the low 16 bits of each field are used (strh/ldrh); +0 is left alone by\
  \ this\nroutine (may be a longer-lived value or written elsewhere). The function deliberately leaves\nr2 = newly-cleared\
  \ mask and r3 = entry pointer live for the caller, and the flags c/v come\nfrom the base+index*8 ADDS rather than\
  \ the value comparison.\n"
