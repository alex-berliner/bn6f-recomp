  date: '2026-10-18'
  detail: 'first-entry block: object_removePanelReserve then sub_80C1EF4(3) whose r0/r1/r2 are stored
    to PanelX/PanelY/DirectionFlip, followed by object_setCoordinatesFromPanels and sprite_setFlip; success
    path re-reserves via object_reservePanel and sets CurAnim=0xC; PlaySoundEffect(0xC7) plus camera_initShakeEffect_80302a8(2,
    Timer+0x1E) indicates a heavy stomp/slam impact; Timer==0xF branch replays anim 0xC with sound 0x58
    and sub_80C2000(4)/sub_80C2082(1); exit writes CurAction=0x24 and zeroes CurPhaseAndPhaseInitialized;
    failure path (sub_80C1EF4==0) sets Param3=1 and calls sub_80C205C'
  refs:
  - bn6f/asm/asm31.s:21616
  - 0x080005CC PlaySoundEffect
  - 0x080302A8 camera_initShakeEffect_80302a8
  - 0x0800E456 object_getFlip
  reproduce: python3 tools/asmcat.py 0x080C1DC4
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — Most details match the asm (e.g., Timer=0x1E, sub_80C1EF4(3), CurAnim=0xC, sound 0xC7, camera shake
    mag 2, exit to CurAction=0x24). However: the proposal claims sub_80C1EF4 returns direction in r2,
    but the asm stores r2 into DirectionFlip immediately after the call (it does return direction). On
    the Param3==0 path the proposal says sound 0x58 is played; the asm actually does `mov r0,#0x59; add
    r0,#0xff` which is 0x58. So the summary ''mid-anim replay triggers sound 0x58'' is correct. The branch
    ''at Timer==0xF it ... calls sub_80C2000(4)/sub_80C2082(1)'' is correct. Main issues: it also calls
    sub_80C2000(3)/sub_80C2082(0) at start (initial anim setup), which the proposal omits as a meaningful
    initialization pair. Sound is correctly 0xC7; speaker says ''heavy-impact sound'' is consistent. Overall
    largely accurate; name is fine.; run wf investigate investigate-20261018-223614; proposed by Hyper
    glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
