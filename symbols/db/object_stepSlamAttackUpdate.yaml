name: object_stepSlamAttackUpdate
address: '0x080C1DC4'
kind: function
status: probable
summary: 'Battle-object action: on first run, lunge to a target panel returned by sub_80C1EF4(3) (releasing
  the old reservation, claiming the new one), start anim 0xC with sound 0xC7 and a 2-magnitude camera
  shake lasting Timer+0x1E; on Param3==0 path, when Timer hits 0xF replay anim 0xC (CurAnimCopy=0xFF)
  via sub_80C2000(4)/sub_80C2082(1) and play sound 0x58, then on expiry set CurAction=0x24; if no target
  is found, set Param3=1, call sub_80C205C, and just count the timer down before the same exit.'
interface: (r0 unused; r5 = battle object) -> void; sets Timer, PanelX/Y, FuturePanelX/Y, DirectionFlip,
  CurAnim, CurAction, Param3, CurPhaseAndPhaseInitialized
details: 'On first run (PhaseInitialized==0) it sets PhaseInitialized=4, Timer=0x1E, releases the object''s
  old panel reservation, and calls sub_80C1EF4(3), which returns a destination panel (r0=X, r1=Y) and
  facing (r2). On success it writes the new panel coords, refreshes pixel coords and sprite flip, mirrors
  them into FuturePanelX/Y, reserves the new panel for the object, sets CurAnim=0xC, triggers sound 0xC7,
  and starts a camera shake of magnitude 2 lasting Timer+0x1E (60 frames). While Timer counts down it
  branches on Param3: at Timer==0xF it re-sets CurAnim=0xC, resets the anim-copy byte to 0xFF, calls sub_80C2000(4)/sub_80C2082(1),
  and plays sound 0x58. When Timer expires it clears Param3, sets CurAction=0x24 and zeroes the phase
  field to end the action. If sub_80C1EF4(3) fails (no free target panel), it sets Param3=1, calls sub_80C205C,
  and simply waits out the timer before the same exit.'
