name: battle_spawnColumnHitboxes
address: '0x080C73BE'
kind: function
status: probable
summary: Spawns a vertical line of three collision regions at the object's panel column and sets each
  region's timer from a lookup table.
interface: (r0 = object ptr in r5 convention; uses oBattleObject fields) -> r0 = 0 if all spawns failed;
  clobbers r4/r6/r7 (restored)
details: 'Loops r4 = 1..3 and for each iteration calls object_spawnCollisionRegion with r0 = oBattleObject_PanelX,
  r1 = r4, r2 = oBattleObject_Element, r3 = 0, plus extra arguments loaded into r4 = 0x405FF01 (pushed
  as a stack arg), r6 = oBattleObject_DamageAndStaminaDamageCounterDisabler and r7 = 3 before the bl,
  suggesting the callee reads extended parameters from those registers. If a spawn succeeds (returns nonzero),
  it reads oBattleObject_Param1, shifts left by 2 as a table index into off_80C73FC (four entries, all
  currently 0x48 = 72 frames), and stores that halfword into the new region''s oBattleObject_Timer. The
  y values 1..3 make this a 3-panel column of hitboxes aligned to the owner''s X, sharing the owner''s
  element. The constant 0x405FF01 likely packs lifetime/flags for the region. Quirk: all four timer table
  entries are identical (0x48), so Param1 currently selects among equal values.'
