name: battle_objectUpdateDestroyOnCollision
address: '0x080CB762'
kind: function
status: probable
summary: 'Per-frame update handler for a battle attack object: runs its action step, and when it takes
  a collision it plays a sound, spawns a hit effect, and destroys itself.'
interface: (r5 = battle object) -> void; destroys object (sets CurState = CUR_STATE_DESTROY) when colliding
  or battle over
details: Tears down the object's old collision data, spawns its collision effect, then reads the collision
  data's region byte and FlagsFromCollision. If FlagsFromCollision is nonzero it plays sound effect 0xC3,
  copies three fields starting at oBattleObject+0x34 (r1-r3) and calls spawn_t1_0x0_EffectObject with
  r4=0x22 (effect type), then clears its collision region and sets oBattleObject_CurStateActionPhaseAndPhaseInitialized
  to CUR_STATE_DESTROY, killing the object. If the battle is over it also clears the region and destroys
  itself. Otherwise it dispatches through a 2-entry jump table indexed by oBattleObject_CurAction (sub_80CB7BC
  / sub_80CB898, likely the object's movement/behavior steps), then calls object_presentCollisionData
  to run this frame's collision processing.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldr r1,[r5,#oBattleObject_CollisionDataPtr]; ldrb r2,[r1,#oCollisionData_Region] plus tst on
    oCollisionData_FlagsFromCollision gates the death path; mov r0,#0xc3; bl PlaySoundEffect followed
    by ldmia r0!,{r1-r3} from r5+0x34 and spawn_t1_0x0_EffectObject with r4=0x22; mov r0,#CUR_STATE_DESTROY;
    str r0,[r5,#oBattleObject_CurStateActionPhaseAndPhaseInitialized] destroys the object after a hit;
    off_80CB7B4 jump table dispatches on oBattleObject_CurAction to sub_80CB7BC/sub_80CB898, then bl object_presentCollisionData;
    Only caller sub_80CB71C and route 'battlesweep' place it in battle object update flow alongside object_*
    collision helpers
