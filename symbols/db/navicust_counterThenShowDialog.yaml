name: navicust_counterThenShowDialog
address: '0x081374AC'
kind: function
status: probable
summary: Counts 20 frames on an object, then once fires NaviCust dialog text 0x23 and switches the object's
  state byte to 0x70.
interface: (r5 = state object, no args) -> r0 = text script id to callee; writes halfword [r5+0xE] counter
  and byte [r5] = 0x70 on completion
details: No arguments are passed; the function works on the object/state pointed to by r5. Each call increments
  the halfword counter at r5+0xE; while it is below 0x14 (20) the function just returns. When the counter
  reaches 20, it calls RunTextScriptNaviCustDialog with script id 0x23 and then stores 0x70 into the byte
  at r5+0, which is almost certainly that object's state/mode field (a value like 0x70 typically routes
  to another step of the same state machine). The dialog is therefore triggered exactly once, at the end
  of a ~20-frame delay.
