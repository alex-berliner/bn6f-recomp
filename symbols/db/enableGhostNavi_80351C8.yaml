name: enableGhostNavi_80351C8
address: '0x080351C8'
kind: function
status: confirmed
summary: 'Propagates ghost-navi event flags: for each (prerequisite, target) pair in a static table, sets the target
  flag if the prerequisite flag is already set.'
interface: void enableGhostNavi(void); /* preserves r4-r7; clobbers r0-r3, lr, flags */
details: 'Walks a 4-byte-stride table at word_80351EC of (u16 condition_flag, u16 target_flag) pairs until a 0x0000
  condition terminates it. For each pair it calls TestEventFlag(condition); if that returns non-zero (flag is set)
  it calls SetEventFlag(target). The table encodes ghost-navi (Cybeast-related) story gating: condition flags in
  the 0x343–0x367 and 0x21A–0x221 ranges map to target flags 0x104–0x10A and 0x212–0x222. The last two entries share
  condition 0x221 with targets 0x219 and 0x222, suggesting a branch-merge gate. Registers r4-r7 and r10 are caller-saved
  in but the function only actually uses r4 and r5 internally (r4 walks the table pointer, r5 holds lr via push);
  the broader register contract reflects the caller sites rather than true internal use.'
