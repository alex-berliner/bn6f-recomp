summary: Spawns the chip-select screen's eStruct records from table byte_813313C, positions their sprites
  at a fixed spot, and links each record to the first one.
interface: () -> void; spawns records into eStructArr2008450 and writes record[0]'s pointer to each record's
  +0x14 field
details: 'Calls battle_spawnEStructRecordsFromTable_80465A0 on the 0xFF-terminated table at byte_813313C,
  creating 0x58-byte type-9 records in eStructArr2008450. It then loops over indices 0..2: for each in-use
  record (getStructFrom2008450''s status byte/pointer return), it calls sprite_setCoordinates with r0=0x30
  and r1=0x58 — identical arguments each iteration — and stores the index-0 record''s pointer into each
  record at offset 0x14, making record 0 the group head. r4 and r6''s higher purpose is unused/unseen;
  r7 caches the first record''s pointer. The fixed position and shared link suggest the three records
  form one positioned screen element (e.g. a chip-select UI sprite group).'
