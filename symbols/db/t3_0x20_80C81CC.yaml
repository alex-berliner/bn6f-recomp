name: t3_0x20_80C81CC
address: '0x080C81CC'
kind: function
status: confirmed
summary: 'Per-frame ticker for a battle object: dispatches on its current state byte to one of three handlers (init/enter-update,
  sub_80C8232, sub_80C829C) and then refreshes its sprite.'
interface: "void battleObject_t3Tick_80C81CC(void);\n  // in:  r5 = battle object pointer; r10 = caller's preserved\
  \ value\n  // out: r5, r8, r9, r10, r11, r12 set by the dispatched handler and object_updateSpritePaused\n  //\
  \ clobbers: r0, r1, r2, r3, r4, r6, r7, lr; flags N, Z, C, V\n"
details: "Reads the object's state byte at oBattleObject_CurState (offset added to r5), uses it as an\nindex into\
  \ the 3-entry jump table at off_80C81E4 (= 0x080c81e4, table base off_80C81E4 in\nassembly):\n\n    off_80C81E4[0]\
  \ = battleObject_initSpriteAndEnterUpdate_80C81F0  (thumb+1)\n    off_80C81E4[1] = sub_80C8232               \
  \                     (thumb+1)\n    off_80C81E4[2] = sub_80C829C                                    (thumb+1)\n\
  \nLoads the handler address from r1 = [off_80C81E0, r0_state] (off_80C81E0 just stores\noff_80C81E4), then tail-calls\
  \ it with lr=pc / bx r1, passing r0=state, r1=handler slot,\nr5=object. The state handlers are also reached through\
  \ this code address (not named\nwrappers), and the value of r10 in the contract is whatever the outer caller's\
  \ state\nmachine is keeping across the tick.\n\nAfter the handler returns the object's sprite is refreshed with\
  \ object_updateSpritePaused(r5).\n\nFunction ends with `pop {pc}` (a tail-pop idiom: the prior `bl object_updateSpritePaused`\n\
  was the model lifting an inline `pop {pc}`; in raw form this is a single `pop {pc}` that\nreturns to the saved\
  \ lr). Only three states are listed, so states 3+ would index past the\ntable.\n"
