open_questions:
- Which real battle object(s) use this ticker (t3 in the name suggests the third battle-object type / tier, but
  the mapping to chip, enemy, field, cursor, etc. is not known from this function alone)?
- What is the meaning of r10 here - is it a per-battle cached pointer (e.g. battle struct / scene state) the caller
  threads through the tick?
- What do the two sub-handlers sub_80C8232 and sub_80C829C do - "resting" vs "active" frames, animation frame steps,
  hitbox refresh, something else?
- The state byte is used directly as an index, so is the state enum really 0..2 or are higher states handled by
  another ticker?
