name: copyPalletesToIWRAM_8001808
address: '0x08001808'
kind: function
status: confirmed
summary: Copies the game's 0x200-byte palette table from IWRAM to BG palette RAM (0x5000000).
interface: void loadBgPaletteTable_ADDRESS(void); // r3 preserved, r0-r2/lr scratch
details: 'Fixed no-argument copy routine. It loads the address of iPalette3001B60 (the game''s

  master palette table stored in IWRAM), sets the destination to 0x5000000 (BG/OBJ-free

  palette memory base on the GBA), and copies 0x20 << 4 = 0x200 bytes (128 colors,

  512 bytes... actually 0x200 = 512 bytes = 256 colors'' worth at 2 bytes/color, i.e. two

  full palette banks) using CopyByEightWords (a 32-bit-word block copy). r3 is preserved

  across the call, which is why it survives as an output in the register contract.

  No flags or parameters are read; the function always performs the same fixed copy.

  '
