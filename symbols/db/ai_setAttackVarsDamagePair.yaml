    one word; str r6,[r3,#oAIAttackVars_Damage] with r3=[r5+oBattleObject_AIDataPtr]+0xA0 writes the AI
    attack-vars damage slot; only caller ai_selectAttackBranch 'programs the AI attack-vars block for
