name: ai_setAttackVarsDamagePair
address: '0x080F3C2C'
kind: function
status: probable
summary: Loads a version-dependent damage halfword and a constant companion halfword from AI parameter
  tables, packs them into one word, and stores it into the AI attack-vars damage field for the chosen
  attack.
interface: (r0 = attack/entry index) -> stores packed pair (damage halfword | secondary halfword) to [battle->AIDataPtr+0xA0+oAIAttackVars_Damage];
  r0 clobbered, flags clobbered
details: Takes an attack index in r0, scales it by 8 to step through per-attack table entries (each 8
  bytes = one halfword per AI version). It fetches the halfword matching the battle's AI version from
  byte_80F3C68 (values 0x28/0x50/0x6E/0x6E), then again from byte_80F3C8C (constant 0xA), combines the
  two halfwords into one word with the second shifted into the upper half, and stores it at oBattleObject_AIDataPtr+0xA0
  (the oAIAttackVars_Damage slot). The pointer pools off_80F3C5C/off_80F3C80 list three tables each (damage
  values 0x28/0x50/0x6E and 0x50/0xA0/0xDC tiers), but this routine always uses the first — the other
  tables are presumably selected by sibling variants or patched pointers. The constant 10 in the second
  table suggests the packed upper half is a count/extent (e.g. hits or range) rather than damage.
