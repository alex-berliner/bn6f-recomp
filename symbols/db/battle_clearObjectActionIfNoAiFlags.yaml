name: battle_clearObjectActionIfNoAiFlags
address: '0x08014A00'
kind: function
status: probable
summary: If neither r6 nor r7's battle objects are in any of two special AI states, writes 0xFF to r6+4
  and r7+4 (clearing their action bytes) and 0 to r5+4; otherwise returns without writing.
interface: (r5 = some battle/work struct, r6 = struct A, r7 = struct B, each with object pointer at +8
  and byte at +4) -> r0 = undefined; no flags of interest
details: Loads the battle-object pointers from [r6,#8] and [r7,#8] and tests each with battle_isObjectInSpecialAiState_80159A2
  (flags 0x100/+0x48 or 0x40/+0x44); if either object is in such a state the routine returns immediately
  doing nothing. It then tests the same two objects with ai_CheckSpecialFlagPair_802DCEC (flags 0x1000/+0x48
  or 0x4000000/+0x44); again a positive result aborts with no writes. Only when all four checks fail does
  it write 0xFF to byte +4 of both structs and 0 to byte +4 of r5's struct. The +4 bytes likely hold a
  per-object mode/action selector where 0xFF means 'none/idle', and the early exits preserve whatever
  special-state behavior (e.g. Beast-Out or similar) is active. r5 may be a battle-controller struct whose
  byte is a shared phase or counter that gets reset alongside the two objects.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl battle_isObjectInSpecialAiState_80159A2 on [r6,#8] and [r7,#8] with bne to locret — early-out
    when an object is in special AI state; bl ai_CheckSpecialFlagPair_802DCEC on both objects — second,
    stronger flag pair also gates the writes; mov r0,#0xff; strb r0,[r6,#4] and [r7,#4] — both objects'
    +4 byte set to 0xFF only after all checks pass; mov r0,#0; strb r0,[r5,#4] — a third struct's byte
    cleared, guarded by the same condition; Runs in recorded battle and menu routes, consistent with a
    battle-object update step
  refs:
  - bn6f/asm/asm00_2.s:13660
  - 0x0802DCEC ai_CheckSpecialFlagPair_802DCEC
  - 0x080159A2 battle_isObjectInSpecialAiState_80159A2
  reproduce: python3 tools/asmcat.py 0x08014A00
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal has the order of writes wrong: the code writes 0xFF to r6+4 first, then calls ai_CheckSpecialFlagPair
    on r7, then writes 0xFF to r7+4, and finally 0 to r5+4. The summary''s ordering (''both objects ...
    and clears a byte in a third struct'') is okay but slightly off. Also the third struct (r5) is not
    necessarily a ''battle-controller''; r5 is just another struct with +4 byte cleared. A simpler name
    fits.; run wf investigate investigate-20261018-200615; proposed by Hyper glm-5.3-flash, revised by
    MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
