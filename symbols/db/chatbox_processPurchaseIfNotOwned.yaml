  reproduce: python3 tools/asmcat.py 0x08047384
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — Code flow: if findRecordWithHalfwordAtOffset2 misses (bne at line after first bl), control jumps
    to loc_80473B8 WITHOUT ever calling battleFindEntryByFieldByte, so it is inaccurate to say ''only
    when both lookups MISS''—a single miss triggers the reset. The caller is chatbox_confirmShopPurchase_8046ED2,
    and the prefix ''shop'' is not in the allowed list; ''chatbox'' fits. All other details (0x80 zero-fill
    of byte_2019A00, clearing byte_2011C10+0x12, setting [r5+0xE]=1, return convention, ctx==2 alternate
    path via sub_8006F1E) are confirmed by the asm.; run wf investigate investigate-20261018-155607; proposed
    by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
