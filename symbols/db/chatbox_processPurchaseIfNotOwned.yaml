name: chatbox_processPurchaseIfNotOwned
address: '0x08047384'
kind: function
status: probable
summary: 'Shop-purchase confirm handler: looks up the highlighted item ID in array A; if absent OR if
  its +4 byte is absent in table B, zeroes a 0x80-byte work record, clears a shop-state halfword, sets
  [chatbox_ctx+0xE]=1, returns 1; only when found in both tables returns 0 unchanged.'
interface: (r0 = lookup array A (8-byte records), r1 = lookup table B) -> r0 = 1 if item was new and reset
  was performed, 0 if item was found in both tables; sets [chatbox_ctx+0xE] = 1 on success
details: Through the context at r5+0x1C it reaches a record base ([ctx+8] + off_8047478 = byte_8047DA0)
  and reads the selected item's ID halfword at +2; findRecordWithHalfwordAtOffset2 scans the caller's
  array r0 (8-byte records) for that ID. If found, battleFindEntryByFieldByte then searches table r1 for
  a record whose byte at +4 matches the item's byte at +4. Only when both lookups MISS (item not already
  present) does it zero 0x80 bytes at byte_2019A00, clear the halfword at byte_2011C10+0x12, store 1 into
  [r5+0xE], and return 1; a match in both tables returns 0 with no side effects. If [ctx] == 2 the same
  decision is made via sub_8006F1E(r0, r1) instead, implying an alternate compare path (possibly text/string)
  for that chatbox state.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'Caller 0x08046ED2 chatbox_confirmShopPurchase invokes this with two table pointers in r0/r1;
    ldrh r1,[r7,#2] off the byte_8047DA0-relative record feeds findRecordWithHalfwordAtOffset2_804743C(r8,
    id); battleFindEntryByFieldByte_8047456(r9, [r7,#4]) must also match, else fall-through to the reset
    path; ZeroFillByWord(byte_2019A00, 0x80) plus strh 0 at byte_2011C10+0x12 only on the not-found path;
    strh #1,[r5,#0xE] and return 1 on reset path; both-matches path returns 0 with no writes'
