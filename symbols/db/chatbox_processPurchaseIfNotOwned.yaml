  - bn6f/asm/asm03_2.s:2434
  - 0x08046ED2 chatbox_confirmShopPurchase_8046ED2
  - 0x0804709C sub_804709C
  - 0x080008E0 ZeroFillByWord
  - 0x08047456 battleFindEntryByFieldByte_8047456
