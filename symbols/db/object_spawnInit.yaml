name: object_spawnInit
address: '0x080D6250'
kind: function
status: probable
summary: 'Spawn-initializes a battle object: places it via panel coordinates, subtracts Param3 from Y
  and Z, loads sprite bank 0x10/resource 0x54/arg 0x80, sets flag bit 2, picks initial animation from
  a Param2-indexed byte LUT, sets palette 0 and flip, allocates a collision slot (freeing the object on
  failure), configures box (0x13,0x14, depth 3) with hit effect 6, refreshes collision, loads HP from
  byte_80D6214 using Param1/Param2 into HP and MaxHP, and enters CUR_STATE_UPDATE.'
interface: (r5 = battle object, params in Param1/2/3) -> r0 = 1 if collision slot allocated, 0 if object
  freed; sets state to CUR_STATE_UPDATE
details: Places the object via object_setCoordinatesFromPanels, then subtracts Param3 from both Y and
  Z (an elevation/height offset). Loads sprite bank 0x10, resource 0x54, arg 0x80, sets flag bit 2, picks
  the animation from the dword_80D62E4 LUT indexed by Param2, sets palette 0 and flip from object_getFlip.
  Allocates collision data, freeing the object and aborting if no slot is free; otherwise sets collision
  box (0x13,0x14, depth 3), hit effect 6, clears its collision region, and runs the per-frame collision
  refresh. Finally reads a halfword HP from byte_80D6214 at Param1*2 + Param2*8 into both HP and MaxHP
  and switches the state machine to the update state.
