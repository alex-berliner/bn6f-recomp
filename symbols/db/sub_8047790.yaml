status: hypothesis
summary: draws the row's 7-tile strip and publishes the entry's value halfword
interface: 'static void draw_chip_row_strip(u32 slot, u32 value, u32 has_code, u32 chip, u32 palette, u32 menu,
  u32 toolkit); adapter: in r0 = slot, r1 = the entry''s value halfword, r2 = has-code, r3 = chip id, r4 = palette,
  r5 = screen state, r7 kept, r10 = toolkit; out r0/r5/r7 restored, r2/r4 keep the render''s leftovers'
details: 'Calls sub_8047CDC with (slot, value) and r7 = palette << 3 riding along; the result in r1 (the value times
  100, unchanged when the view word is 1) is stored at +8 of the toolkit''s 200A220 struct (oToolkit_Unk200a220_Ptr).
  The strip''s character in the symbol script at menu+0x24 is chosen as the original''s branch tree does: view 1
  gives the dim variant 0x0D, otherwise 0x0F; in view 2 a chip with a nonzero palette whose chip+0x2420 event flag
  is clear gets the blank 0x10 instead (skipping the no-code check); otherwise a chip without a code gets the no-code
  strip 0x11. Seven tiles through the 0x2013C40 buffer into the BG map at 0x6008640.

  '
