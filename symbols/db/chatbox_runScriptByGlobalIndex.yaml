name: chatbox_runScriptByGlobalIndex
address: '0x080931EE'
kind: function
status: probable
summary: Runs the current chatbox script selected by the global chatbox state.
interface: '(r0 = script_idx: u8) -> void; flags caller-saved'
details: Treats r0 as the script index and copies it into r1 for chatbox_runScript. Loads the text archive
  from offset 0x30 of the global object referenced by r5, then invokes the standard chatbox script loader.
  It only forwards this global archive/index pair and does not modify the result.
