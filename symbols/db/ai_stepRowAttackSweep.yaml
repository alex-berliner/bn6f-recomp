    every 8 entries. However, (TimerOrCycles<<8|AiDifficultyTier) is what gets packed, not (TimerOrCycles<<8
    | AiDifficultyTier) with TimerOrCycles swapped — the description is fine but the name ai_stepRowBeamAttack
    misreads the AI: sub_80C8F74 isn''t necessarily a beam projectile, only row-attack element 4 is set.
