    sub_80C8F74, then sets anim 0x10; StepTimer<=0 path stores 0x1C to oAIAttackVars_HitElement, marking
    the attack's end state; ChargeCycles bit-3 test gates repeated battle_highlightRowPanels3 calls (row
    telegraphing); row arg = 6 when Alliance==0 else 1, i.e. the object's own side's row, matching battle_highlightRowPanels3's
    own-row highlight
