name: ai_stepRowAttackSweep
address: '0x080F357C'
kind: function
status: probable
summary: 'AI attack state-handler: on first entry picks element 4, anim 0x15, counter 0x1E and a 0x12-frame
  StepTimer; at remaining 0xA forwards (Alliance-derived column, PanelY, InitFlag, TimerOrCycles<<8|AiDifficultyTier,
  Damage, ScratchVar) to sub_80C8F74 and switches to anim 0x10; when StepTimer reaches 0 sets HitElement=0x1C;
  each call increments ChargeCycles and highlights a 3-panel row every 8th call.'
interface: (r5 = battle object, r7 = oAIAttackVars) -> r0 = 0 on return; updates attack-vars fields and
  object anim/counter; no meaningful flags
details: On first entry (AttackElement == 0) it commits to element 4, sets anim 0x15, a 0x1E counter time,
  and a 0x12-frame StepTimer. Each frame it decrements StepTimer; at the remaining value 0xA it calls
  sub_80C8F74 with the attack row derived from Alliance (6 for side 0, else 1), the object's PanelY, InitFlag,
  (TimerOrCycles<<8 | AiDifficultyTier), Damage and ScratchVar — i.e. it forwards the whole attack parameter
  block — and switches to anim 0x10. While StepTimer counts down it keeps the pre-hit element; when it
  hits 0 it sets HitElement = 0x1C (attack finished/fizzle). Independently, ChargeCycles increments every
  entry and battle_highlightRowPanels3 is invoked on frames where the counter's bit 3 clears (every 8
  calls), telegraphing the 3-panel row in the object's own row.
