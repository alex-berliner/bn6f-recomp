    0x1E, StepTimer=0x12, then decrements StepTimer; at 0xA it forwards Alliance-derived column (6/1),
    PanelY, InitFlag, (TimerOrCycles<<8|AiDifficultyTier), Damage and ScratchVar to sub_80C8F74 and sets
