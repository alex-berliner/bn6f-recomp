name: ow_getEventFlagIds
address: '0x081430B6'
kind: function
status: probable
summary: Computes overworld event flag ID(s) for an index, using a per-area base table.
interface: (r0 = flag index u8) -> r0 = flagId = areaBase[index] + flagIndex (and r1 = second flagId from
  paired table entry); no flags
details: Calls sub_8143088, whose result is scaled by 4 to select one of four halfword pairs in the table
  at byte_81430D4 (bases 0x970, 0x978, 0x980, 0x988, ...), so the table is indexed by current area/map
  (4 entries). It loads both halfwords of the selected pair, adds the flag index argument to each, and
  returns them in r0 and r1 — a pair of related flag IDs, presumably a flag and its companion (e.g. 'seen'/'done'
  variants). Callers feed the result straight into SetEventFlag or TestEventFlag; sub_80A8988 picks r0
  or r1 depending on a bitfield in [r5,#5], and sub_8142ECC tests r0 in a loop over object spawn entries
  before calling SpawnOverworldMapObject.
