  date: '2026-10-19'
  detail: 'sub_81430B6: bl sub_8143088; lsl r0,r0,#2 indexes byte_81430D4 by 4 halfword-pairs; ldrh r0/[r1,#2];
    add r4 to both; returns r0 and r1; 0x080A89A8: ldrb r0,[r5,#4]; bl sub_81430B6; mov r0,r0; bl SetEventFlag
    — result used directly as a flag ID; 0x080A89C6 site: bl sub_81430B6; mov r0,r1; bl SetEventFlag —
    second halfword of the pair is also a flag ID, chosen by a bit in [r5,#5]; 0x08142F1C: loop index
