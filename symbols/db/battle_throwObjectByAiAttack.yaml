name: battle_throwObjectByAiAttack
address: '0x0810E4D4'
kind: function
status: probable
summary: Dispatches a thrown battle object along either a straight-drop or arc path based on the AI attack's
  HitElement byte.
interface: (r7 -> oAIAttackVars.HitElement index) -> tail-calls battle_throwObjectAway or battle_stepArcMotion
  for that object; no return value computed here
details: Reads oAIAttackVars_HitElement at r7+oAIAttackVars_HitElement and uses it (multiply-by-4 already
  applied by the ldr) to index off_810E4E8, a two-entry table of function pointers to battle_throwObjectAway
  and battle_stepArcMotion (THUMB+1). It tail-calls the selected function, passing through whatever object/value
  was already in r0. The .word values include +1 to switch to THUMB mode for the BLX-style branch.
evidence:
- method: assembly-reading
  date: '2026-10-21'
  detail: ldrb r0, [r7,#oAIAttackVars_HitElement] at asm line 0810E4D8 — picks dispatch index from AI
    attack vars; ldr r1, [r1,r0] at asm line 0810E4DA — indexes off_810E4E8 with HitElement; mov lr, pc
    / bx r1 — tail-calls the chosen function pointer; off_810E4E8 entries are battle_throwObjectAway+1
    and battle_stepArcMotion+1 — straight-drop vs arc throw paths
  refs:
  - bn6f/asm/asm32.s:1410
