name: SetAIDataUnk0x48Flag
address: '0x08010312'
kind: function
status: confirmed
summary: Sets one or more flag bits in a battle object's AI data word at offset 0x48 (read-modify-write with OR).
interface: void SetAIDataUnk0x48Flag(u32 flagBits r0, BattleObject *obj r5); returns r1 = updated word, r3 = AI
  data pointer; clobbers NZ flags
details: Loads the object's AI data pointer from oBattleObject_AIDataPtr (r5), then performs OR on the u32 at oAIData_Unk_48
  so only the bits present in r0 are set (existing bits are never cleared). Returns the updated word in r1 and the
  AI data pointer in r3 so callers can chain further AI-data operations without reloading. Uses mov pc, lr so it
  works from both ARM and Thumb states; only condition codes are clobbered. r0 acts as a bitmask, so callers can
  set multiple 0x48 flags in one call.
