name: MapScriptCutsceneCmd_load_gfx_anim
address: '0x08035F2A'
kind: function
status: confirmed
summary: Map script/cutscene opcode handler that reads a 4-byte pointer operand from the script stream and loads
  that GFXAnimScript.
interface: 'void MapScriptCutsceneCmd_load_gfx_anim(void); /* in: r0 = map script state, r7 = script cursor; out:
  r0 = 1, r7 = cursor+5, r4 = operand (GFXAnimScript *) */'
details: 'Handler for one map-script/cutscene opcode. Sets R6 = 1 (a mode flag read by ReadMapScriptWord), calls
  ReadMapScriptWord to pull a 32-bit operand from the script stream (left in R4), then calls LoadGFXAnim with that
  value in R0 as a GFXAnimScript pointer. Finally advances the script cursor (R7) by 5 bytes — the opcode byte plus
  the 4-byte operand — and returns 1 in R0, which the dispatcher presumably treats as "command handled". R5, R8,
  R9, R12 are preserved; the returned N/Z/C/V flags fall out incidentally (N/Z from R0=1, C/V from the cursor ADDS
  r7, #5), matching the original binary.

  '
