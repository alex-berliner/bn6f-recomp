name: sub_811A160
address: '0x0811A160'
kind: function
status: confirmed
summary: Steps a looping shrink animation on a sprite object, decrementing its scale by 0x20 each call and restarting
  from 0xC0 once it reaches 0x40.
interface: void sprite_scaleShrinkStep(struct SpriteEffect* obj /* r5 */); clobbers r0-r3, preserves r4-r7; returns
  with NZCV and r0-r3 as left by the called sprite routine
details: 'Operates on a sprite/effect object passed in r5. Sets bit 1 of the byte at offset 0x00 (a flag marking
  the object as currently being scaled), then subtracts 0x20 from the scale byte at offset 0x12. If the new scale
  is still greater than 0x40, calls sprite_setScaleParameters(0, scale, 0x40) to apply it. Once the scale drops
  to 0x40 or below, the cycle resets: scale is snapped back to 0xC0, the byte at offset 0x09 is cleared, and sprite_makeUnscalable()
  is called, ending that pass of the shrink effect. Because each call subtracts 0x20 and the wrap goes back to 0xC0,
  repeated calls produce a repeating pulse/shrink cycle (0xC0 -> 0x40 is 4 steps of 0x20). Tail-called via pop {pc};
  padding bytes follow the routine.'
