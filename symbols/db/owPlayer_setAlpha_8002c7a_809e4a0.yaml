name: owPlayer_setAlpha_8002c7a_809e4a0
address: '0x0809E4A0'
kind: function
status: confirmed
summary: Sets the alpha (blend/transparency) level of the overworld player sprite to the value passed in r0.
interface: void owPlayer_setAlpha_809e4a0(u32 alpha /* r0 */); // r10 = toolkit; clobbers r0-r1, r2-r3, r7, flags;
  preserves r5 (restored from stack)
details: 'Thin wrapper around sprite_setAlpha_8002c7a. Loads the toolkit from r10 (oToolkit_GameStatePtr), reads
  the GameState''s OverworldPlayerObjectPtr (oGameState_OverworldPlayerObjectPtr), then tail-calls sprite_setAlpha_8002c7a
  with the alpha value still in r0 and the player object pointer in r5 (which the callee is expected to treat as
  the object). Note the quirk: r5 is used to hold the fetched player object pointer, clobbering the saved r5 in
  the frame, but the callee preserves r5 so the pop {r5,pc} returns the caller''s original r5 intact. Outputs r2/r3/r7
  are whatever sprite_setAlpha_8002c7a leaves behind; callers treat them as don''t-care garbage.

  '
