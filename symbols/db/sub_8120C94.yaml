name: sub_8120C94
address: '0x08120C94'
kind: function
status: confirmed
summary: Fills a tilemap-sized buffer with consecutive halfword tile indices, written two rows (a "band") at a time
  so values run down each column pair, after zero-filling the area.
interface: void sub_8120C94(u16 *dst /*r0*/, u32 widthHalfwords /*r1*/, u32 bands /*r2*/, u16 firstIndex /*r3*/);
  preserves r4-r7, clobbers r0-r3, lr and flags (returns CMP band-vs-bands flags)
details: 'Fills dst (r0) with the halfword values r3, r3+1, r3+2, ... in a

  banded column-major order. r1 is the row width in halfwords, r2 is the

  number of 2-row bands to fill (total area = 2*width*bands halfwords).

  First the whole area is cleared via ZeroFillByHalfword (size passed as

  width*2*bands halfwords), then the fill loop overwrites it all:

  for each band, it alternates writing one value at (band row, col) and

  the next value one row directly below it, advancing col by one halfword

  each step, so consecutive indices go DOWN a column first, then right —

  i.e. vertical neighbors get consecutive tile numbers within each 2-row

  band. After filling a band the pointer skips ahead two rows. r4-r7 are

  used as scratch (rowBytes, col, dst cursor) but preserved for the

  caller. Quirk: the band loop is a do-while, so with bands == 0 the body

  still runs once and fills a full band anyway.

  The vertical-consecutive ordering matches how an image''s tiles are laid

  out in VRAM for a background/tilemap being built for a graphic block.

  '
