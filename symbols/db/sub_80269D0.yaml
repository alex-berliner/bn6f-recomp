name: sub_80269D0
address: '0x080269D0'
kind: function
status: hypothesis
summary: Queries some global status via sub_800A9E2 with argument 0 and reduces the result to a boolean that is
  true when bits 0 or 2 are set.
interface: int checkStatusBits0Or2(void); returns 1 if (statusValue & 0x5) != 0 else 0; carry and overflow flags
  from the inner call pass through to the caller
details: 'Calls sub_800A9E2 with r0 = 0 (that callee also receives and clobbers r10, and clobbers r3, which leaks
  through as an "output" of this wrapper). It then ANDs the returned value with 5 (bits 0 and 2) and normalizes
  it to 0 or 1 in r0. r1 is used as scratch for the mask. The branch on the AND result sets no meaningful flag contract
  beyond nz, which is listed as clobbered. The identity of sub_800A9E2 is unknown from this snippet alone, so the
  game meaning of bits 0 and 2 of its result (e.g. two separate global/state flags such as a wireless/adapter status
  or a scene-state bit pair) cannot be confirmed; only that this wrapper is a boolean test of those two bits.

  '
