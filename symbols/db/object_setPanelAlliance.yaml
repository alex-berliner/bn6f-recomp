name: object_setPanelAlliance
address: '0x0800CC14'
kind: function
status: confirmed
summary: Claims the panel a battle object stands on for a given alliance, refreshing the panel afterwards.
interface: void object_setPanelAlliance(u32 object /*r0*/, u32 param /*r1*/, u32 alliance /*r2*/); trashes r0-r3,
  preserves r4-r7, returns panel type/scratch in r3
details: 'Given a battle object and one of its panel-parameter slots, resolves the panel the object currently occupies
  via object_getPanelDataOffset. If the panel''s type byte (oPanelData_Type) is nonzero — i.e. the panel is actually
  in use/occupied — the function writes the alliance id into oPanelData_Alliance, zeroes the halfword field oPanelData_Unk_10
  (likely some per-panel counter or state), and calls object_updatePanelParameters to recompute the panel''s derived
  parameters. If the panel type is 0 the function exits early without touching anything. Note the module-internal
  convention of passing arguments both in r0-r2 and r4-r6 to the panel helpers; r3 leaks the panel type on the early-exit
  path (or whatever object_updatePanelParameters leaves in it otherwise), which callers appear to ignore.

  '
