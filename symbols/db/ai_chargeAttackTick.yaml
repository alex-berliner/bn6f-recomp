name: ai_chargeAttackTick
address: '0x0810A94C'
kind: function
status: probable
summary: 'Per-frame tick of an AI attack: flashes target panels while charging, then on timeout deals
  damage, plays a sound, and sets the resulting hit element.'
interface: (r7 = AI attack vars, r5 = battle object) -> r0 = 0 when the attack fires; destroys/clears
  the object's collision region on completion
details: Decrements oAIAttackVars_StepTimer each call; while it is nonzero, every 4th frame it highlights
  the panel in front of the object (front panel X = PanelX + object_getFrontDirection(), Y = PanelY) via
  highlightPanelIfSomeCondition_8109660 with r2=6 and r3=Alliance^DirectionFlip, a telegraph flash for
  the incoming attack. When the timer reaches 0, it calls sub_80BC3B8 with Damage | (ExtraDamage<<16),
  the object's extra-vars pointer, and the object's own PanelX/PanelY, apparently to apply the attack's
  damage. It then sets an object counter time of 0x14 frames unless the battle mode is 6, clears the object's
  collision region byte, plays sound effect 0x20, and stores HitElement=4 and AttackElement=0 into the
  AI attack vars before returning 0.
