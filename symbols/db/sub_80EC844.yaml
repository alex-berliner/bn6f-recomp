name: sub_80EC844
address: '0x080EC844'
kind: function
status: confirmed
summary: AI attack handler that looks up a u16 from a table indexed by oAIAttackVars_Unk_03, optionally applies
  it via sub_800E2FC, then saturating-adds 5 to the battle object's alliance byte and exits the attack state.
interface: 'void aiAttack_addSaturatedByte_80EC844(void); // r5=battle object*, r6/r7=AI vars*, r10=?, lr=return;
  preserves r4/r5/r10; clobbers r0/r1/r2/r3/r6/r7/lr + nzcv

  '
details: 'Reads oAIAttackVars_Unk_03 (r7+off) as a u8 index, doubles it, and indexes a u16 table at

  byte_80EC870 (entries: 10/30/50/78/96/200/300/1000/0/0, little-endian pairs). Calls

  sub_800E2FC(amount, 1) and ignores its boolean return — the original TST/BNE is a self-loop

  that always falls through to the saturation add. Reads oBattleObject_Alliance (r5+off) as

  a u8, calls tableAddSaturatedByte_800AB46(AllianceByte, 5, 1) which adds 5 capped at 0xFF,

  then calls object_exitAttackState. Likely a "drain/transfer" style AI attack that boosts

  friendly alliance via a table-driven amount.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
