open_questions:
- Which object/state machine this belongs to — no callers known, so the object type and what state 0x23
  means are unidentified
- Meaning of the 0x1F written to halfword +0xE and the 8 written to byte +9 (blink/flash timer? HP? palette
  index?)
- What sound 0x194 is (would identify the event, e.g. an alarm, roar, or recovery)
- Whether the decrement starts from a value set by a previous state handler, which would pin down the
  countdown length
