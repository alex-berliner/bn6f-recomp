  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The body matches the summary: ldrb r0,[r5,#0xc]; sub r0,#1; ble loc_811CFF8 (zero/negative path),
    and bne locret_811D014 (positive path). At loc_811CFF8, ldr 0xffff into r0 and bl sprite_setColorShader,
