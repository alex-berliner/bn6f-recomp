  date: '2026-10-19'
  detail: 'ldrb r0,[r5,#0xC]; sub r0,#1; ble loc_811CFF8 / strb r0,[r5,#0xC]; bne locret: decrement-and-early-exit
    countdown on struct field +0xC; ldr r0,dword_811D018 (=0xFFFF); bl sprite_setColorShader: clears the
    object''s color shader on expiry; mov r1,#0x23; strb r1,[r5] plus strh 0x1F,[r5,#0xE] and strb 8,[r5,#9]:
    state byte set to 0x23 with new timer/param values; ldr r0,off_811D01C (=0x194); bl PlaySoundEffect:
    plays SFX 0x194 exactly on the transition tick; counter is reloaded with 3 after expiry, so the effect
    repeats every 3 ticks while in this state'
