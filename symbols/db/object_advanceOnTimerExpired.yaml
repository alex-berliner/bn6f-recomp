name: object_advanceOnTimerExpired
address: '0x0811CFEC'
kind: function
status: probable
summary: 'State-machine step (r5 = object struct): decrements byte at +0xC; if still >0 stores it back
  and returns, otherwise clears the sprite''s color shader (0xFFFF), sets halfword +0xE = 0x1F, transitions
  state byte +0 to 0x23, reloads timer +0xC = 3, sets +9 = 8, and plays sound 0x194.'
interface: (r5 = object/work struct pointer, no args in r0-r3) -> r0 = sound id 0x194 passed to PlaySoundEffect;
  no meaningful return, flags from the bne on the decremented counter
details: Runs against an object struct in r5 (this is a state-machine step, not a standalone call with
  r0 args). It loads the byte at +0xC, decrements it, and if it is still >0 stores it back and returns
  without doing anything else (early-exit at locret only when the counter did not reach zero). When the
  counter reaches 0 or is already <=0, it calls sprite_setColorShader with 0xFFFF (the project's known
  'clear/no shader' value), writes 0x1F to halfword +0xE, sets the state byte at +0 to 0x23, reloads the
  counter at +0xC with 3, sets byte +9 to 8, and plays sound effect 0x194. The bne placement means the
  non-expiry path also returns immediately, so this is a once-per-tick countdown with a one-shot transition.
