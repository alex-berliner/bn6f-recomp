name: object_setAnimFromVelocity
address: '0x080D3EE8'
kind: function
status: probable
summary: Sets a battle object's current animation to one of four directional walk frames (0x14–0x17) based
  on the sign of its X or Y velocity.
interface: (r0 = unused, r5 = battle object) -> r0 = clobbered; sets oBattleObject_CurAnim, no flags meaningful
details: Reads oBattleObject_XVelocity; if nonzero, selects anim 0x14 for positive (right-facing) or 0x16
  for negative, otherwise falls through to oBattleObject_YVelocity, selecting 0x15 for positive (down)
  or 0x17 for negative (up). If both velocities are zero the routine returns without touching the animation.
  Writes the chosen id as a byte to oBattleObject_CurAnim and does nothing else. The four consecutive
  anim ids strongly suggest the four cardinal walk/glide directions. Uses r5 as the object pointer rather
  than an argument, so it is a helper only valid in the object-update context.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldr r0,[r5,#oBattleObject_XVelocity] with cmp/bgt picking 0x14 vs 0x16 (asm lines 3-11); ldr
    r0,[r5,#oBattleObject_YVelocity] with cmp/bgt picking 0x15 vs 0x17 (asm lines 14-19); strb r1,[r5,#oBattleObject_CurAnim]
    stores the chosen direction anim (line 20); both velocities zero leads straight to locret, leaving
    CurAnim unchanged (beq locret_80D3F0E); sole caller object_stepGlideToPanel is a per-frame glide step,
    matching directional movement anims
