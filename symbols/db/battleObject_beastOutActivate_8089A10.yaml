  date: '2026-10-14'
  detail: '- `bl battle_tickChipLockout_8089CB4` followed by `beq loc_8089A36` shows the body only fires
    when chip lockout has expired. - `bl GetSoulWeaponsMapIndex` then `lsl r0,r0,#2` + `ldr r0,[r1,r0]`
    with `off_8089A40` table of 8 entries selects a script pointer indexed by soul weapon. - `str r0,[r5,#0x3c]`
    stores the chosen script into AIData offset 0x3c (AIData.Unk_3c per the struct def). - `bl SetCutsceneCameraScript`
    matches the contract description "Points the cutscene camera engine at a new camera script and resets
    its command timer"; the soul-weapon camera plays. - `mov r0,#1; strb r0,[r5,#0x13]` sets AIData offset
    0x13 (AIData.Unk_13) to 1. - `mov r0,#0x3c; bl ai_setAIDataUnk18_8089CB0` writes 0x3c via that helper,
    consistent with `AIData.Unk_18` initialization. - `mov r0,#0x60; strb r0,[r5]` overwrites AIData offset
    0x00 (AIData.ActorType) with 0x60 — the Beast-Out actor-type encoding. - Always returns r0=1 (both
    fall-through and tail path), matching the captured call exit `r0=1`. - 40 captured calls from `snap_beastsp_*`
    (BeastSP = Beast Special?) all hit this same path with consistent AIData state, supporting the Beast-Out
    interpretation.'
