status: probable
summary: 'Beast-Out activation handler for a battle object: when its chip-lockout flag clears, look up
  the soul-weapon script and start its Beast-Out camera/AI.'
interface: (r5 = BattleObjectAIDataPtr) -> r0 = 1 ; sets AIData Unk_3c / Unk_13 / Unk_18 / byte0, calls
  cutscene camera + AI helpers
details: "- r5 holds the AIData pointer (per project convention r5 in battle AI helpers), and the callee\
  \ `battle_tickChipLockout_8089CB4` decrements/tests `AIData.ChipLockoutTimer` (offset 0x19). When the\
  \ lockout has elapsed (Z=1, branch falls through) it goes to the early return.\n  - Otherwise it calls\
  \ `GetSoulWeaponsMapIndex` which returns an index into a 2-entry `off_8089A40` table (8 u32 pointers\
  \ pointing to `byte_8089494` ... `byte_80894CC` in pairs; index*4 fetched). The picked pointer is stored\
  \ at `AIData.Unk_3c` (`str r0,[r5,#0x3c]`).\n  - It then calls `SetCutsceneCameraScript` with the pointer\
  \ (passed via r0 in r1) to start the Beast-Out / soul-weapon camera script playback from the top.\n\
  \  - It writes 1 to `AIData.Unk_13` (`strb r0,[r5,#0x13]`) — likely a \"Beast-Out active\" flag — and\
  \ `ai_setAIDataUnk18_8089CB0(0x3c)` writes 0x3c to `AIData.Unk_18` (`strb r0,[r5]` immediately after,\
  \ given the helper signature in r0).\n  - Finally it returns r0=1 unconditionally. The \"early return\"\
  \ path at `loc_8089A36` also returns 1, so the function is effectively `bool`-like but always true;\
  \ likely the caller treats the return as \"fire-and-forget\" or \"fired this frame\".\n  - The 0x60\
  \ stored as the first byte of AIData (`strb r0,[r5]` with r0=0x60) overwrites `ActorType` (offset 0x00).\
  \ That is consistent with `0x60` being a Beast-Out actor-type flag/encoding (bit pattern 0110_0000).\
  \ Confirms this is a per-frame transition into Beast-Out.\n  - Caller lists are blank in the capture\
  \ set, but the lifted caller/callee naming (`GetSoulWeaponsMapIndex`, `SetCutsceneCameraScript`, `battle_tickChipLockout_8089CB4`,\
  \ `ai_setAIDataUnk18_8089CB0`) all fit a battle-object lifecycle hook.\n"
