name: loadIndexedPaletteToBuffer_802E240
address: '0x0802E240'
kind: function
status: confirmed
summary: Copies one 0x3C-halfword palette entry, selected by index from a pointer table, into the palette buffer
  at unk_2008170.
interface: void loadIndexedPaletteToBuffer(int index /*r0*/); // preserves r3; clobbers r0-r2, flags
details: 'Index in r0 is scaled by 4 and used to fetch a pointer from the table at off_802E260

  (off_802E25C holds the table''s address). The selected palette (0x3C = 60 halfwords = a

  standard 60-entry/16-color-set GBA palette chunk) is copied with CopyHalfwords into the

  fixed buffer at unk_2008170 in IWRAM. Callers pass something in r3 that is preserved

  untouched, so it is unrelated to this routine''s work. This is a generic palette-load

  helper; the actual game meaning depends on which table off_802E260 points to and which

  buffer 0x2008170 feeds (likely a pending/current palette staging area used by the BG or

  UI palette uploader).

  '
