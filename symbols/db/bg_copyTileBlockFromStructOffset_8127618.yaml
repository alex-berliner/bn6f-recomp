name: bg_copyTileBlockFromStructOffset_8127618
address: '0x08127618'
kind: function
status: confirmed
summary: Copies an 11x6 block of background tiles from a table, with the vertical base index taken from a byte in
  a source struct plus the base tile 0x23.
interface: void bg_copyTileBlockFromStructOffset(void *src /* r5, also passed to CopyBackgroundTiles as r7 */);
  passes through r4, r6, r10; clobbers r0-r3 and flags; preserves r4-r7
details: Thin wrapper around CopyBackgroundTiles. It reads a signed byte at [r5+0xD], adds the base tile id 0x23,
  and uses that as the starting j (tile index/row-offset) argument. It then calls CopyBackgroundTiles with j = that
  value, i = 3, which_tile_block_32x32 = 3, tile_ids = byte_81269E0 (a table of u16 tile ids), j_size = 0xB (11
  tiles) and i_size = 6 tiles — so the copied region is 11 by 6 tiles, not the 3x3 suggested by the intermediate
  i=3/r2=3 argument (3 is the 32x32 tile-block selector). The source struct pointer is duplicated into r7 (mov r7,
  r5) so CopyBackgroundTiles can also read it. r4-r7 are saved and restored, so callers see them unchanged; r2/r3
  escape with whatever CopyBackgroundTiles leaves in them. Likely used to redraw a strip of the screen background
  (map/menu panel) whose tile offset varies per instance stored at +0xD of the struct.
