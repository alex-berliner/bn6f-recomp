name: setUnkFieldOfChipCodeInChipPack_81376b8
address: '0x081376B8'
kind: function
status: confirmed
summary: Stamps a chip-pack entry's halfword field with the current selection-tray counter at byte_20065B4
  and then decrements that counter.
interface: void chipPack_stampEntryWithTrayCountAndDecrement(u8* packBase /*r0*/, u32 chipIndex /*r1*/);
  // returns r1 = chipIndex*2, r2 = &byte_20065B4, clobbers r0/r3 and flags
details: 'Reads the u16 counter at byte_20065B4 (the running count of chips in the

  temporary selection tray, e.g. chips picked for the coming battle round).

  Computes the byte offset of the target entry as (chipIndex*2 - chipIndex) +

  chipIndex*2 == chipIndex*2 relative to the r0 base pointer, then stores the

  counter value into the halfword at packBase + chipIndex*2 + 4 — i.e. field

  +4 of a 6-byte-ish chip-pack entry, which appears to record the entry''s

  position/order stamp in the tray. Afterwards the shared counter is

  decremented by 1 (sub r3,#1) and written back, so consecutive calls stamp

  the entries with descending values (count, count-1, ...). The call site

  also gets back r1 = chipIndex*2 (byte offset of the entry''s next halfword

  field) and r2 = pointer to the counter, so callers typically follow up by

  touching the entry''s code field and the counter. No other state is touched;

  the routine is tiny and tail-returns with mov pc,lr.

  '
