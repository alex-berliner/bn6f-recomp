name: object_updateSineBob
address: '0x080DE350'
kind: function
status: probable
summary: Adds a sine-wave bob offset (direction-scaled) to a battle object's position each frame, called
  from object_updateCountedMovement.
interface: (r5 = battle object ptr) -> void; writes object+0x38 (position), advances object+0x65 (phase)
details: 'Increments the phase byte at r5+0x65 by the step at r5+0x64, reads a halfword from math_sinTable
  at phase*2, multiplies it by 0xC then shifts left 8 (amplitude 0xC00 in fixed point), and multiplies
  by a signed word from byte_80DE384 selected by r5+0x62<<2 (0 -> +1, 1 -> -1, i.e. a direction sign).
  The result is added to the base coordinate at r5+0x68 and stored into the position field r5+0x38. So
  it computes obj.x/y = base + dir * 0xC00 * sinTable[phase], a wobble superimposed on the object''s motion.
  Fields used: 0x38 position, 0x62 direction/sign, 0x64 phase step, 0x65 phase accumulator, 0x68 base
  coordinate.'
