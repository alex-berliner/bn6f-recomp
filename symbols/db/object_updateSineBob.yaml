- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r1,[r5,#0x64]; ldrb r3,[r5,#0x65]; add/strb to 0x65: phase accumulator advanced by a per-frame
    step; ldr r2,off_80DE3D8 (math_sinTable); ldrh r0,[r2,r3] with r3=phase*2: sine lookup, then *0xC
    << 8 amplitude; byte_80DE384 words {1, -1} indexed by [r5+0x62]<<2: sign flip from a direction field;
    ldr r1,[r5,#0x68]; add r1,r1,r0; str r1,[r5,#0x38]: result added to base coordinate and stored to
    position; Called from object_updateCountedMovement, a per-frame movement step for a battle object'
