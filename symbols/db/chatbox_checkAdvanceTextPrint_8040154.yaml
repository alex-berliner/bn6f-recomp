name: chatbox_checkAdvanceTextPrint_8040154
address: '0x08040154'
kind: function
status: confirmed
summary: While the chatbox is printing text, skip to the next text-print phase when B is held, A is pressed, or
  the text speed is instant (0).
interface: chatbox_step_t chatbox_checkAdvanceTextPrint(chatbox_t *r5 /* state, in r5 */)
details: "Called once per frame during the chatbox's text-printing state machine (r5 = chatbox\nobject). Reads the\
  \ chatbox's joypad latches and per-character print speed:\n  - [r5+oChatbox_JoypadHeld] & 2  -> B held: fast-forward\n\
  \  - [r5+oChatbox_JoypadUp]  & 1   -> A newly pressed: advance\n  - [r5+oChatbox_TextScriptPrintSpeed] (offset\
  \ 8) == 0 -> no per-character delay,\n    text renders instantly, so nothing to wait for\nIf any of those hold,\
  \ it stores 0 to [r5+oChatbox_JumpTableOffset_11], resetting the\nchatbox's state-machine step index so the next\
  \ handler moves printing on to the next\nphase. Otherwise the offset is left untouched and the state machine keeps\
  \ ticking the\nprint delay.\nReturns r2 = 2 when B was held, r2 = 1 in the A-pressed / instant-speed case, which\n\
  callers can use to distinguish how the skip was triggered. NZ flags are clobbered by\nthe tst tests. Note the\
  \ code is laid out as fall-through + early exits, and the byte\nat locret_8040174+2 (mov r0,#1 / strb / pop) is\
  \ unreachable padding-like trailing\ncode after the main pop — a quirk of the original build, not a real path.\n"
