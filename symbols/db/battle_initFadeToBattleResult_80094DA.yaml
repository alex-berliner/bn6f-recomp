name: battle_initFadeToBattleResult_80094DA
address: '0x080094DA'
kind: function
previous_names:
- sub_80094DA
status: probable
summary: Drives a battle-end fade-out and hands off to the post-battle state when the fade finishes.
interface: (no input registers from caller) -> r0 = fade colour slot (1 or 4) on the first entry, nothing
  afterwards ; sets oBattleState_Unk_03 and oBattleState_Index_00
details: "Called every frame while the battle main loop sits in battle state Index_00 = 8 (the comment\
  \ in the\n  source labels this as \"trigger sub_8007B80 via battle_main_8007800\").\n\n  First entry\
  \ path (oBattleState_Unk_03 == 0): asks battle_countOpponentActorsWithNameIdInRange_800A7A6\n  whether\
  \ any opponent actors have a NameID in [0x173, 0x17e]; if so, reads the low nibble of\n  BattleState.Unk_1f\
  \ via battle_getStateByteNibbles_800A832 and, when that nibble is 1, picks\n  fade colour slot r0=4\
  \ (a specific tint), otherwise falls through to the normal r0=0xc slot.\n  Calls SetScreenFade(r0, 0x10),\
  \ stores 4 into oBattleState_Unk_03 to mark \"fade armed\" and returns.\n\n  Second entry path (oBattleState_Unk_03\
  \ != 0): polls IsScreenFadeActive; once the fade is no\n  longer active, musicGameState_8000784 swaps\
  \ the music state, FreeAllObjectsOfSpecifiedTypes\n  is called with r0=0x1a to tear down remaining battle\
  \ objects, and 8 is stored into\n  oBattleState_Index_00 to switch the battle main state machine into\
  \ the post-fade handler.\ndetails: |\n  The two constant ranges (0x173-0x17e NameIDs and the high-nibble\
  \ check of Unk_1f) suggest the\n  early branch only triggers for a particular family of opponent actors\
  \ (the NameIDs correspond\n  to specific Navi/virus entries).\n"
