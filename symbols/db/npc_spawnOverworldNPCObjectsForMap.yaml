name: npc_spawnOverworldNPCObjectsForMap
address: '0x08035134'
kind: function
status: confirmed
summary: Spawn overworld NPC objects for the current map based on MapGroup/MapNumber, unless EVENT_1721 is set.
interface: 'void npc_spawnOverworldNPCObjectsForMap(void); // r10 = toolkit ptr; output via callee: r0-r3 returned
  through; clobbers r0-r3; preserves r4-r7'
details: 'Tests EVENT_1721 via TestEventFlagFromImmediate; if set, returns immediately (early-out path). Otherwise
  reads GameState pointer from oToolkit_GameStatePtr, then oGameState_MapGroup (byte) and oGameState_MapNumber (byte).
  Branches on MapGroup vs. INTERNET_MAP_GROUP_START: real-world map groups use NPCList_maps00 (REAL_WORLD_NUM_GROUPS
  rows), internet groups use NPCList_maps80 (INTERNET_NUM_GROUPS rows) with MapGroup re-based by subtracting INTERNET_MAP_GROUP_START.
  Indexes the group row by MapGroup*4, then the MapNumber row by MapNumber*4, to fetch a pointer to a per-map NPCScript
  array. Delegates the actual spawn to npc_freeAllObjectsThenSpawnObjectsFromList, passing the script pointer (r0)
  and the map/layer indices in r1-r3. Callee performs the free + spawn work.'
