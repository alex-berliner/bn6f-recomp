name: sub_8029F70
address: '0x08029F70'
kind: function
status: confirmed
summary: Returns a yes/no battle condition that is always true in battle mode 8, mode-dependent with veto checks
  (a battle-effects bit, event flag 163, battle flag 0x40) in modes 0/0xA/0xB, and false in all other modes.
interface: bool sub_8029F70(void* obj /* r5 */, ... /* r10 passed but unread */); out r0 = 1 if condition met else
  0; preserves r4, clobbers r1/r3/lr and NZCV via helper calls
details: 'Reads the current battle mode via GetBattleMode. Mode 8 immediately yields "condition met". Modes 0, 0xA
  and 0xB yield "met" unless one of three vetoes fires: (1) GetBattleEffects() has bit 0x200000 set; (2) event flag
  163 (0x63, tested via TestEventFlagFromImmediate) is set AND byte [r5+0x10] is nonzero — note that when the flag
  is clear the byte at +0x10 is never consulted; (3) battle flag 0x40 (TestBattleFlag_0x40) is set. Any other battle
  mode returns 0. r5 points at some battle-related object (possibly the player/custom state) whose +0x10 byte acts
  as a per-instance override tied to event flag 163; the exact game meaning of the condition is not identified from
  this function alone.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
