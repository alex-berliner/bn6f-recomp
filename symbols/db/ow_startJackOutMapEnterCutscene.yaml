name: ow_startJackOutMapEnterCutscene
address: '0x080059EC'
kind: function
status: confirmed
summary: Clears the jack-out event flag (0x1703) and starts the "on map enter after jack-out" cutscene.
interface: void ow_startJackOutMapEnterCutscene(void); // callers pass only lr (and r10); no meaningful register
  inputs, no outputs
details: 'Overworld cutscene entry point run when the player finishes jacking out and lands on the map.

  It first clears event flag 0x1703 via ClearEventFlagFromImmediate (flag group 0x17, mask 0x03) —

  the same flag whose set state triggers this jack-out sequence — then calls StartCutscene with the

  script pointer CutsceneScriptOnMapEnterAfterJackOut_8098a2e and a zero parameter.

  The name''s "self: * GameState r5" annotation is incidental; the body never reads r5 (r5 is listed

  as preserved). Only lr is pushed, and the function tail-returns via pop {pc}.

  '
