open_questions:
- which status effect the byte_810FBC0 table entries encode (setCollisionStatusEffect1's value mapping
  is unknown)
- why the shifted version index is also passed as r0 to object_updateCollisionData — the exact first-argument
  convention of that callee needs checking
- actual numeric contents of the version tables (damage/element per enemy version)
