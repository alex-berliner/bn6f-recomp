name: ow_setAnimFromDirTable
address: '0x080A74A8'
kind: function
status: probable
summary: Overworld helper that picks an object's sprite animation from a per-direction table, defaulting to a facing
  computed toward the player when the entry is 0xFF.
interface: (r0 = object ptr in r5 convention, table via sub_80A7528) -> r0 = ?; sets object anim, loads anim data,
  disables shadow
details: 'r5 is the overworld object; [r5+5] is the current animation-slot index. sub_80A7528 returns a table of
  4 {animIndex, param} byte pairs (scan wraps at byte offset 7). If the selected pair''s first byte is 0xFF (dynamic
  entry), the function reads the player''s overworld coords via ReadOWPlayerObjectCoords, subtracts the object''s
  position ([r5+0xC],[r5+0x10]), and gets battle_calcAngleOctant''s 1..4 bucket: octant 0 keeps the current index,
  octants >=4 map to 1, otherwise the octant is used (+1/-1 bookkeeping around the pair indexing). It then scans
  forward (wrapping) until a non-0xFF entry is found, writes the entry''s second byte to [r5+0x30], and if the anim
  index changed calls sprite_setAnimation, sprite_loadAnimationData and sprite_noShadow, storing the new index back
  into [r5+5]. If the index is unchanged, nothing is reloaded.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r4,[r5,#5] then table fetch via sub_80A7528 with pair indexing (lsl #1) and 0xFF sentinel check;
    0xFF case calls ReadOWPlayerObjectCoords, subtracts [r5+0xC]/[r5+0x10], then battle_calcAngleOctant_800118A
    for a direction bucket; octant remap: 0 -> current index, >=4 -> 1, else octant, then forward wrap-scan bounded
    by ''cmp r4,#7''; on change: sprite_setAnimation + sprite_loadAnimationData + sprite_noShadow, and strb r4,[r5,#5]
    updates the current index; second table byte is stored to [r5,#0x30] unconditionally, an anim-associated parameter'
