name: object_updateWaitThenDestroy
address: '0x080C3B06'
kind: function
status: probable
summary: 'Battle-object state handler: burns any pre-set initial delay, then sets a 30-frame timer and
  CurAnim=0, after which the object flags itself with CUR_STATE_DESTROY.'
interface: (r5 = battle object) -> void; r0 clobbered as scratch
details: Uses r5 as the object, no arguments. If PhaseInitialized is 0, it burns the current Timer to
  0 (initial delay), then sets PhaseInitialized=1, Timer=0x1E, and CurAnim=0. Every subsequent call decrements
  Timer; on reaching 0 it writes CUR_STATE_DESTROY into the packed CurStateActionPhaseAndPhaseInitialized
  word so the object's main loop tears it down. Total on-screen lifetime is the initial Timer value plus
  30 frames. No callees, no animation advance, no interaction logic — purely a timed self-destruct wait.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'first-tick branch at 0x080C3B0C sets Timer=0x1E, PhaseInitialized=1, CurAnim=0 before entering
    the countdown; countdown loop at 0x080C3B22 decrements oBattleObject_Timer and only acts when it hits
    0; on expiry it stores #CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized,
    the standard teardown request; touching only oBattleObject_* fields with r5 shows it is an object
    update handler taking no other arguments'
  refs:
  - bn6f/asm/asm31.s:26140
  reproduce: python3 tools/asmcat.py 0x080C3B06
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The code matches the proposal''s logic: if PhaseInitialized==0, it decrements Timer; on hitting
    0 it sets PhaseInitialized=1, Timer=0x1E, CurAnim=0; then the fall-through decrements Timer again
    and on reaching 0 writes CUR_STATE_DESTROY. However, the summary says ''plays anim 0 for 30 frames''
    but CurAnim is set to 0 during the initial-delay wait, not after — there''s no explicit anim 0 play,
    and the proposal also omits the initial delay semantics. Name is fine but a slightly clearer name
    reflecting the two-phase (initial wait then 30-frame countdown) behavior is warranted.; run wf investigate
    investigate-20261019-055111; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash
    (tools/investigate_land.py reconcile)'
