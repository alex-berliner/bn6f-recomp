name: ai_resetAttackVars
address: '0x080EFF00'
kind: function
status: probable
summary: 'Resets an object''s AI attack state: marks flag bit 22, clears charge/timers/step counter and
  restores the default element (4).'
interface: (r7 = object with oAIAttackVars at fixed offsets, no args in r0) -> void; r0-r3 clobbered
details: The function operates entirely through r7, which must already hold the battle object pointer
  from the caller. It ORs bit (1<<22) into ObjectFlags1 via object_setFlag1, zeroes oAIAttackVars_ChargeCycles
  and StepTimer, sets Unk_40 to 3, zeroes Unk_44, and writes HitElement = 4 (likely the 'no element' default).
  It also calls sub_801299C with r0 = r7+0x30, suggesting an embedded sub-structure at offset 0x30 of
  the attack vars is reinitialized too. The pattern of clearing timers/charge and resetting the element
  reads as tearing down or starting a clean attack state.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: bl object_setFlag1 with r0 = 1<<22 sets a single ObjectFlags1 bit on the object (asm lines 3-5);
    strb/str/strh of 0 into oAIAttackVars_ChargeCycles, StepTimer and Unk_44 clear attack counters; str
    of 3 into oAIAttackVars_Unk_40 and 4 into oAIAttackVars_HitElement set fixed state values; r7 is used
    without ever being loaded, so the caller must supply the object pointer in r7; call sub_801299C with
    r0 = r7+0x30 implies a sub-structure reset at offset 0x30
  refs:
  - bn6f/asm/asm31.s:122265
  - 0x0801A152 object_setFlag1
