name: countSetEventFlags
address: '0x08143D4C'
kind: function
status: probable
summary: Counts how many event flags in a dynamic list are currently set, returning the set count (r0)
  and total list size (r1).
interface: () -> r0 = number of set flags, r1 = total number of flags in the list; Z set if count is 0
details: 'Calls sub_8143F60 twice (before and after the loop) to obtain the current size of some flag
  list, then loops i = 0..count-1. Each iteration calls sub_8143B5E(i), which appears to map a list index
  to an event-flag id, and tests it with TestEventFlag, incrementing r6 when the flag is set. The final
  call to sub_8143F60 refreshes the list size into r1 before returning, so the caller receives both how
  many flags are set and how many exist. The tst r0,r0 before the pop leaves the Z flag reflecting whether
  any flags were set. Quirk: the list size is re-read after the loop, so if the list changed mid-loop
  r1 may not match the iteration count.'
