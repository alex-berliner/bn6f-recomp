- method: assembly-reading
  date: '2026-10-19'
  detail: sub_8143F60 result in r7 used as loop bound (cmp r4, r7), so it returns a count; sub_8143B5E(r4)
    result fed straight into TestEventFlag, so it yields a flag id per index; add r6,#1 only when TestEventFlag
    says set — r6 accumulates the set count; second bl sub_8143F60 with result moved to r1 returns the
