name: eBgCounterDrawStep
address: '0x0801D048'
kind: function
status: probable
summary: 'Per-frame BG counter renderer: DMA-fills tilemap rows, draws a label via the text toolkit and
  a 2x2 glyph at (14,5) in BG block 3, then renders right-justified hex digit tiles into two 4x2 fields
  at (9,5) and (17,5); on the final step it sets a done flag and triggers a sub_3005EBA effect.'
interface: (r7 = state block at byte_2036840) -> r0 = undefined; writes BG map block 3, state+0xE done
  flag, and scratch at byte_203C4E0
details: 'r7 points to a state block (base byte_2036840) with a step counter at +0, halfword values at
  +0xA and +0xC, and a done flag at +0xE. It first runs sub_801CF3C to DMA-fill tile-map rows from this
  block. If the step counter is >= 8 it does a one-time finish: sets the +0xE done flag and calls call_sub_3005EBA(9,5,3,0,0xC,2).
  Otherwise it renders TextScript86F0374 through the toolkit text renderer (state buffer byte_203C4E0,
  VRAM 0x6009360), copies a fixed 2x2 tile table (off_801D18C) to (14,5) in block 3, calls sub_801D12A
  with [r7+0xC], computes countHexDigits of that halfword, and right-aligns the value''s digit tiles into
  a 16-byte scratch area built in the saved-register slots ([sp]..[sp+0xC]) by word-shifting for 2-, 3-,
  or 4-digit counts. It then draws two 4x2 tile runs at (9,5) and (17,5) — an 8-wide digit field split
  by a gap — and calls sub_801D12A again with [r7+0xA]. Quirk: after each CopyBackgroundTiles it pops
  {r0-r3} purely to advance sp, so the 16-byte tile buffer is reused from the caller-saved r4-r7 slots
  pushed in the prologue, and the epilogue pops 16 bytes beyond what was pushed (callee-cleaned stack
  args convention).'
