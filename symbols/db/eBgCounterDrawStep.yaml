  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The proposal''s description of the 16-byte scratch from [sp] slots and the right-aligned digit tile
    packing matches the shift/str pattern at loc_801D0C8/0DA/0FE. However, naming it `bgCounterDigitsDrawStep`
    mixes a literal description with the proposed prefixes; a proper `e_` (effect) prefixed name fits
    better. Also the proposal claims r7=byte_2036840 from the start, but the code loads r7 from off_801D1D4
