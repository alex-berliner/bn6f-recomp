name: battle_moveOffscreenAndDestroy
address: '0x080D1136'
kind: function
status: probable
summary: 'Phase handler: on first call (phase 0) init to phase 4/anim 3 via sub_80D11B4; thereafter add XVelocity
  to X, update panels, then destroy (clear region + CUR_STATE_DESTROY) if a collision flag is set, the panel is
  invalid, or the timer expires.'
interface: (r0 = battle object (r5-held), uses oBattleObject fields) -> r0 = undefined; sets CurState/CurPhase/CurAnim
details: On entry phase 0 it switches the object to phase 4 with animation 3 and calls sub_80D11B4 (likely a one-time
  setup). Otherwise each frame it adds XVelocity to X, recomputes PanelX/PanelY via object_setPanelsFromCoordinates,
  syncs the collision record via object_updateCollisionPanels, and clears the collision region when the panel is
  no longer valid (object_isCurrentPanelValid). It then checks CollisionDataPtr's FlagsFromCollision; if a collision
  flag is set the timer is not decremented (early exit path leaves destruction pending). Otherwise the oBattleObject_Timer
  counts down and on expiry the collision region is cleared and CurState is set to CUR_STATE_DESTROY.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'first-call path: ldrb CurPhase==0 -> phase=4, anim=3, bl sub_80D11B4; main path: ldr XVelocity, add to
    X, str X, then object_setPanelsFromCoordinates/object_updateCollisionPanels; tst on object_isCurrentPanelValid
    result, bne skips object_clearCollisionRegion (off-field cleanup); FlagsFromCollision nonzero branches past
    the Timer countdown; Timer underflow -> object_clearCollisionRegion + CurState=CUR_STATE_DESTROY'
  refs:
  - bn6f/asm/asm31.s:54046
  - 0x0801A074 object_clearCollisionRegion
  - 0x0800CC66 object_isCurrentPanelValid
  - 0x0800E2AC object_setPanelsFromCoordinates
  reproduce: python3 tools/asmcat.py 0x080D1136
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise — The proposal
    inverts the FlagsFromCollision logic: at loc_80D1168, `bne loc_80D1178` means a NON-zero collision flag jumps
    directly to destroy (clear region + CUR_STATE_DESTROY), not ''timer is not decremented / destruction pending.''
    The timer-decrement path (ldrh/bge) is only taken when FlagsFromCollision is zero. The name is fitting; the
    summary should reflect that destruction triggers on collision flag, invalid panel, OR timer expiry. Also r5
    is the implicit object pointer, not r0.; run wf investigate investigate-20261018-155607; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
