name: battle_clearFlags
address: '0x0800A2E4'
kind: function
status: confirmed
summary: Clears the requested bits in the current battle state's halfword flag field.
interface: void battle_clearStateFlags(u32 mask /* r0 */); returns battleState in r1, new flags in r2; clobbers
  NZ
details: 'Reads the toolkit pointer from r10, loads the battle state pointer from

  oToolkit_BattleStatePtr, loads the halfword at oBattleState_Unk_32, clears the

  bits selected by the r0 mask via BIC, and stores the result back as a halfword.

  The caller receives the battle state pointer in r1 and the updated flag value

  in r2 as side outputs. No validation of r0; touching NZ flags is a side effect

  of the BIC. Note r10 (the toolkit/base register) is an implicit input, which is

  normal for this codebase''s addressing convention.

  '
