name: e_stepColorCycle
address: '0x08006518'
kind: function
status: probable
summary: 'Per-frame step of an entity''s palette color cycle: looks up the cycle entry from byte_80065BC using [r5+0xd],
  calls sub_8002378 to write palette slots 0x14 and 0x15 (with arg from [r5+0x10] and [r5+0x14]), raises the 0x40
  update flag in dword_20096D0, increments [r5+0xd] modulo 16, and dirties renderInfo halfwords +6/+8/+0xa while
  storing a replicated-nibble color derived from [r5+6] into renderInfo+2.'
interface: (r5 = effect/entity struct; no args in r0-r3) -> r0 = 0 after palette calls; writes palette slots 0x14/0x15
  via sub_8002378, dword_20096D0 = 0x40, renderInfo +6/+8/+0xA |= 0x40, renderInfo +2 = color from [r5+6]>>4
details: Reads the entity's color index at [r5+0xD], doubles it to index a 16-entry halfword table at byte_80065BC,
  and passes the entry to sub_8002378 twice as slot 0x14 (arg r4 = [r5+0x10]) and slot 0x15 (arg r4 = [r5+0x14]),
  each filling 16 entries. It then stores 0x40 into dword_20096D0 (likely a palette/flush request flag). The index
  at [r5+0xD] is incremented and wrapped modulo 16, so successive calls step through all 16 table entries. Finally
  it ORs 0x40 into three renderInfo halfword fields (+6, +8, +0xA), apparently dirty/update flags, and stores ([r5+6]>>4)
  replicated into the low bytes of renderInfo+2 as a derived color. r5 is never set inside, so the caller must hold
  the entity pointer in r5, consistent with an update-handler dispatched from an entity loop.
evidence:
