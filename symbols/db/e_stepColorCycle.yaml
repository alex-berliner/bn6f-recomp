  date: '2026-10-18'
  detail: 'sub_8006518+4..: index [r5+0xD]*2 selects halfword from byte_80065BC, passed to sub_8002378 with slot
    0x14 then 0x15, count 0x10; ldrb [r5,#0xD]; add #1; cmp #0x10; bge — index cycles 0..0xF, proving palette cycling;
    orr #0x40 into renderInfo fields +6/+8/+0xA and strh of ([r5+6]>>4)|(v<<8)|(v<<16) to +2 — marks palettes/render
    state dirty with a derived color; callee sub_8002378 known: fills a slot of software palette table ePalette20097a0
    only when r1/r2 nonzero; dword_20096D0 = 0x40 stored each call — a global request/flag, semantics unconfirmed'
