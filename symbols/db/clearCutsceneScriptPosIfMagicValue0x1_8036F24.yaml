name: clearCutsceneScriptPosIfMagicValue0x1_8036F24
address: '0x08036F24'
kind: function
status: confirmed
summary: If the cutscene script position holds the magic dummy value 1, clears both the current and saved
  script positions to NULL.
interface: void cutscene_clearScriptPosIfDummyValue(Toolkit *toolkit @ r10); returns cutscene state ptr
  in r1; flags C,V set from cmp(scriptPos, 1), NZ reflect comparison; clobbers r0
details: 'Reads the cutscene state pointer from toolkit (r10 + oToolkit_CutsceneStatePtr), then loads
  the current script position (oCutsceneState_CutsceneScriptPos, s_02011C50.ptr_1C). Compares it against
  the magic value CUTSCENE_SCRIPT_UNK_MAGIC_SCRIPT_VALUE_0x1 (== 1); if it matches, stores NULL into both
  the current script position (offset 0x1C) and the saved/original position (oCutsceneState_originalCutsceneScriptPos_40,
  offset 0x40). The comparison flags and r1 = cutscene state pointer are live on return, so callers can
  branch on whether the reset happened or reuse the state pointer. Effectively discards a "dummy"/no-op
  script entry in the cutscene engine.

  '
