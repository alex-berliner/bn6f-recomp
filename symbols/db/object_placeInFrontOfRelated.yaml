name: object_placeInFrontOfRelated
address: '0x080DFDAC'
kind: function
status: probable
summary: Snaps this battle object onto the panel directly in front of its related object (owner), then
  refreshes pixel coords and collision.
interface: (r0 = unused at entry; r5 = battle object, non-standard) -> r0/r1 clobbered by callees; object
  r5 repositioned
details: 'Reads the object at r5 (note: no prologue saves/sets r5, so the caller must have it in place,
  an odd calling convention). It calls object_getFrontDirection to get the +1/-1 facing multiplier, loads
  RelatedObject1Ptr from r5, then writes RelatedObject1''s PanelY into r5''s PanelY and RelatedObject1''s
  PanelX plus the facing offset into r5''s PanelX — i.e. one panel ahead of the related object on its
  side. It then calls object_setCoordinatesFromPanels to recompute pixel X/Y and object_updateCollisionPanels
  to sync the new panel into the collision record.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: bl object_getFrontDirection supplies the +1/-1 X offset (sub_80DFDAC+4); ldr r1,[r5,#oBattleObject_RelatedObject1Ptr]
    then ldrb/strb PanelX/PanelY copy the related object's panel, X offset by r0 (asm lines 5-12); trailing
    bl object_setCoordinatesFromPanels and bl object_updateCollisionPanels refresh pixel position and
    collision after the move; only caller sub_80DFCE0 runs on the battlesweep route, consistent with a
    battle-entity repositioning step
