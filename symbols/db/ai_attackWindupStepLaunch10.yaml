name: ai_attackWindupStepLaunch10
address: '0x080EF0B4'
kind: function
status: probable
summary: 'AI attack state-machine step: starts a 10-frame wind-up timer, plays an animation mid-way, then
  on expiry sets the hit element and invokes the attack routine.'
interface: (r0/r7 = battle object with oAIAttackVars) -> r0 = result of sub_80EF0E2; no flags of note
details: 'Runs on a battle object''s AI attack variables. On entry, if AttackElement is still 0 it initializes
  the phase: StepTimer = 10 and AttackElement = 4 (marks the wind-up as started). Each call decrements
  StepTimer; when it equals 7 it calls object_setAnimation with animation 0. Once the timer counts down
  to 0, it writes HitElement = 8 and calls sub_80EF0E2, which presumably performs the actual attack spawn.
  The AttackElement/HitElement fields double as phase and payload selectors for this AI attack.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb [r7,#oAIAttackVars_AttackElement] tst/bne: first-run init guard setting StepTimer=0xA,
    AttackElement=4; cmp StepTimer,#7 then object_setAnimation(0): mid-countdown animation trigger; StepTimer
    decrement with bgt: delayed action until timer hits 0; mov r0,#8 strh [r7,#oAIAttackVars_HitElement]:
    sets hit element right before calling sub_80EF0E2; uses oAIAttackVars fields, so this is an AI boss
    attack step handler'
  refs:
