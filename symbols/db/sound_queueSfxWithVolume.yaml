  date: '2026-10-18'
  detail: 'ldrb r1, [byte_2010B90]; cmp #0; mov #0xff — volume byte with max fallback passed as r1; bl
    sound_8000808 — known callee appends a 16-byte sound request to the queue at dword_200A490; r0 is
    never modified, so the caller''s first argument is forwarded as the sound id to the queue append'
