name: sound_queueSfxWithVolume
address: '0x0800060A'
kind: function
status: probable
summary: Loads byte_2010B90 into r1 (substituting 0xFF when unset), sets r3 to a callback thunk (sound_8000822+1),
  and tail-calls sound_8000808 to append the r0 SFX to the request queue at dword_200A490.
interface: (r0 = sound/SSEQ id for sound_8000808, r1 = ignored, overwritten) -> none; r1 = clamped volume
details: 'The function loads byte_2010B90; if it is nonzero it passes it as r1, otherwise it substitutes
  0xFF (maximum), then tail-ends into the sound-request queue append sound_8000808 with r0 untouched from
  the caller. byte_2010B90 thus behaves as a user/system volume or volume-multiplier setting that scales
  every SFX played through this wrapper. The 0xFF fallback means an uninitialized (zero) volume still
  plays sounds at full loudness. This is a thin wrapper: no other state is touched and no return value
  is produced.'
evidence:
