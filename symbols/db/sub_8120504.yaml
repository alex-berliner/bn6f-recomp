name: sub_8120504
address: '0x08120504'
kind: function
previous_names: []
status: hypothesis
summary: Pack a single chip-ID/code into an 8-byte chip descriptor (code+ID in low dword, code+ID+1 in high dword)
  and store it via a pointer; scratch helper for the chip-select summary writer.
interface: '(r0 = scratch0_hi = 0xA, r1 = scratch0_lo = svc-result / tmp, r2 = chipIDAndCode, r3 unused) ; r7 =
  outPtr ; side effect: [r7+0] = ((chipIDAndCode+1)<<16 | chipIDAndCode) , [r7+4] = ((chipIDAndCode+0xC)<<16 | chipIDAndCode+0xB)
  ; returns r0 = (chipIDAndCode+1)'
details: 'Prologue saves r4-r7+lr; r7<-r1 (outPtr), r4<-r2 (chipIDAndCode, treated as u32 because r1 starts as 0).
  It then issues BIOS svc 0x6 (CpuFastSet/Div/Mod via r0=0xA request form) with r0=0xA, r1 as the divider pair (r1,r0
  paired) to compute r1 = r1 mod r0 (or similar), but the relevant result is `r2 = r1`, then `r0 = r1`, and the
  r0/r1 pair is rearranged so that after the tst+add sequence: r1 ends as either r4+0 or r4+1 (modulo result of
  svc 6), and r0 ends as r4+1 unconditionally (r0 = r1+r4+1). The two operands are then packed as two u16: (r0 <<
  16) | r1, and stored to [r7]. The same packing is repeated with constants 0xB and 0xC: r1 = r4+0xB, r0 = r4+0xC
  (lsl#16), orr and store to [r7+4]. Exit pops and returns r0 = r4+1 in r0 (per captured-call exit r0=0x935b935a
  when r4=0x934f). Effectively this writes two adjacent 4-byte descriptors whose lower halfword is chipIDAndCode
  (or +1) and whose upper halfword is chipIDAndCode shifted up by one slot index. Caller writes a zero 8-byte entry
  when chip slot is empty, otherwise calls this to convert chipIDAndCode into the layout used by the chip-select
  summary buffer.

  '
