open_questions:
- exact semantics of the svc6 pair (which BIOS call it actually is in bn6f and what r0=0xA encodes); the add+1 on
  r0 vs the conditional add+1 on r1 suggests a carry/borrow trick tied to the BIOS result, but the project has no
  public BIOS header I can cross-check. Settle by checking the only `svc 6` site in this routine against bn6f BIOS
  call tables.
- the meaning of the "chipIDAndCode" packed with +0xB and +0xC offsets in the second dword (likely an element/secondary-code
  or attack-form record, but not provable from the assembly alone).
