name: sub_80158FA
address: '0x080158FA'
kind: function
status: probable
summary: 'Clears a battle object''s status/ailment state: hitstun, invulnerability, status-effect timers and related
  AI/flag bits.'
interface: (uses caller's battle object in r5; no args) -> r0 clobbered; ObjectFlags1/2 bits cleared, oBattleObject_AIType=0,
  collision timers zeroed
details: Operates on the battle object whose pointer the caller keeps in r5 (r5 is not set up here, so each caller
  supplies it). It clears a bit mask in the object's ObjectFlags1 via object_clearFlag, clears bit 0x10 in ObjectFlags2
  via object_clearFlag2, and zeroes oBattleObject_AIType. It then clears an AI-data flag (mask 0x200800) via ClearAIDataUnk0x48Flag,
  and zeroes the collision data's HitStunTimer, HitInvulTimer, StatusEffectTimer1, StunSubTimer and the word at
  Unk_58. This looks like resetting an object to a neutral, non-ailing state, e.g. when it lands from a move or
  its movement state is committed/reset.
