name: object_thundercloudNextPanelStep
address: '0x080E6F32'
kind: function
status: probable
summary: Returns the next panel step (x,y) for the thundercloud object, alternating one axis at a time
  toward a target panel stored in ExtraVars+0x12 (target X) and ExtraVars+0x13 (target Y).
interface: (r5 = battle object) -> r0 = next PanelX, r1 = next PanelY; returns current panel if both axes
  match or after two tries
details: 'Reads a target panel coordinate from ExtraVars+0x12 (target X) and +0x13 (target Y). Uses oBattleObject_Param3
  as an axis flag: 0 means adjust PanelX, 1 means adjust PanelY. It steps one panel (±1) along the flagged
  axis toward the target, flips Param3 to the other axis after moving, and alternates up to two attempts
  per call; when PanelX/PanelY already equal the target coordinate on the tested axis it re-tries the
  other axis, and if r4 reaches 2 (both axes already matched or exhausted) it returns the object''s current
  PanelX/PanelY unchanged.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r1,[r1,#0x12] / #0x13 loaded from ExtraVars and compared against PanelX/PanelY — target
    coordinates; strb r0,[r5,#Param3] stores 0 or 1 to switch which axis is advanced next call; add r0,r2,r3
    with r3 = ±1 produces a one-panel step toward the target (neg when target < current); cmp r4,#2 /
    bge loc_80E6F80 falls back to current PanelX/PanelY after two attempts; only caller object_thundercloudStrikeUpdate
    (lightning strike object) matches walking a path of panels toward a target before striking'
  refs:
  - bn6f/asm/asm31.s:103204
  - 0x080E6EA0 object_thundercloudStrikeUpdate
  reproduce: python3 tools/asmcat.py 0x080E6F32
  result: 'proposed by hyper/glm-5.3-flash, self_score 4; cross-checked by minimax/MiniMax-M3: revise
    — The code starts by testing Param3: if 0, goes to Y-axis handling (loc_80E6F5E); if non-zero, goes
    to X-axis handling (loc_80E6F3C). The proposal says Param3==0 means PanelX and Param3==1 means PanelY,
    but the actual code has it reversed: Param3==0 means Y, Param3==1 means X. ExtraVars+0x12 is used
    at loc_80E6F3C for X comparison (since it''s reached when Param3 is nonzero), and ExtraVars+0x13 is
    used at loc_80E6F5E for Y comparison. The rest of the logic (alternating axes, returning current if
    both match, up to two tries) is correct.; run wf investigate investigate-20261019-030611; proposed
    by Hyper glm-5.3-flash, revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py
    reconcile)'
