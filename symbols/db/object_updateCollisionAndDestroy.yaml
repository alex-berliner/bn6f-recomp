name: object_updateCollisionAndDestroy
address: '0x080D0454'
kind: function
status: probable
summary: Per-frame update for a battle object that processes its current collision, spawns the hit effect,
  and then destroys itself once the collision is resolved or the battle is over.
interface: (r5 = battle object, no register args) -> void; sets object state to CUR_STATE_DESTROY on the
  destroy path
details: The routine first tears down the object's collision data and spawns the hit-effect object at
  the collision point. It then checks whether the battle is over or the collision flags in the object's
  CollisionDataPtr (oCollisionData_FlagsFromCollision) are nonzero; in either case it clears the object's
  collision region and writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized,
  ending the object. If time is stopped it just refreshes present-collision data instead; otherwise it
  dispatches through a per-action jump table indexed by oBattleObject_CurAction, whose table (off_80D0494)
  currently contains a single entry pointing at a stub at 0x80D0498. r5 is the implicit object pointer,
  consistent with the callees' documented behavior.
