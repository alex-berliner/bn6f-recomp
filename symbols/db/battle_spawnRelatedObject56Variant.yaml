name: battle_spawnRelatedObject56Variant
address: '0x08010F6A'
kind: function
status: probable
summary: Wrapper that spawns a battle object of type 0x56 linked to a owner with a modified third argument
  and stores the result in the owner's RelatedObject2Ptr field.
interface: (r0 = owner object?, r1 = ?, r2 = 32-bit value) -> r0 = spawned object; result stored to [r5
  + oBattleObject_RelatedObject2Ptr]
details: The function shifts r2 left by 16, then adds 2 (setting bit 0x20000 in the shifted value, i.e.
  r2<<16 | 0x0002 in the high halfword region), and calls battle_spawnObject56LinkedToOwner_80C44A8 with
  r0, r1, and this adjusted r2. The callee spawns battle object type 0x56 linked to the owner, inheriting
  alliance/direction and setting header flag bits 0x04|0x10. The returned object pointer is written to
  field oBattleObject_RelatedObject2Ptr of the object in r5, which is never set inside this function,
  so r5 must be prepared by the caller. The meaning of the original r2 argument (before <<16) and why
  2 is added are unknown; it may be a coordinate or parameter packed with a flag.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'lsl r2, r2, #0x10 / add r4, r4, r2 with mov r4, #2 transforms the third argument before the
    spawn call; bl battle_spawnObject56LinkedToOwner_80C44A8 shows it spawns object type 0x56 linked to
    an owner; str r0, [r5,#oBattleObject_RelatedObject2Ptr] stores the spawned object into the caller''s
    object RelatedObject2Ptr field; no known caller, so r0/r1/r5 roles and the r2 semantics cannot be
    confirmed'
