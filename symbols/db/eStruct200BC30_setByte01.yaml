name: eStruct200BC30_setByte01
address: '0x0803EA58'
kind: function
status: probable
summary: Stores the byte argument into offset 0x1 of eStruct200BC30; callers at battle entry set it to
  1, and sub_812CDF4 preserves the byte across a clearStruct200BC30_803EBAC reset.
interface: (r0 = byte value) -> void; no flags
details: Stores r0 to byte_200BC31, offset 0x1 of eStruct200BC30, then returns. Battle-entry callers (sub_803EABC/sub_803EAD0)
  set it to 1 immediately after battle_clearScratchBuffers_803EFCC, so it is likely a battle-active/phase
  byte initialized each battle. sub_812CDF4 saves the struct's jump offset 00, calls getter sub_803EA50,
  clears the struct via clearStruct200BC30_803EBAC, restores the offset, and re-writes the saved byte
  with this setter before triggering a screen fade (SetScreenFade 12,16) — showing the field must survive
  struct resets. The paired getter sub_803EA50 presumably reads byte_200BC31.
