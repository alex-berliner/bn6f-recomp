name: object_processCollisionHit
address: '0x080C7FDC'
kind: function
status: probable
summary: 'Per-frame collision processing for a battle object: tears down old collision data, spawns the
  hit effect, then either runs the per-action collision handler and refreshes collision state, or destroys
  the object.'
interface: (object in r5, per battle-object convention) -> void; returns battle-over flag in r0 transiently
details: Runs on a battle object held in r5. It first tears down the object's collision data (object_removeCollisionData)
  and spawns the hit-effect object at the object's coordinates (object_spawnCollisionEffect). If the battle
  is over, it clears the object's collision region and sets its state field to CUR_STATE_DESTROY. Otherwise
  it reads the collision flags from the object's CollisionDataPtr; if set, it clears the collision region.
  It then requires RelatedObject1's CurAction to be 0xB; if so and time is not stopped, it dispatches
  through a table (off_80C8028) indexed by that action — currently a single handler, sub_80C802C — and
  afterwards calls object_presentCollisionData to refresh the object's collision state for the frame.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: opens with bl object_removeCollisionData then bl object_spawnCollisionEffect — teardown + hit
    effect of a collision; battle-over branch loc_80C801A does object_clearCollisionRegion and stores
    CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized; reads [r5,#oBattleObject_CollisionDataPtr]
    -> oCollisionData_FlagsFromCollision and clears the region when non-zero; dispatch table off_80C8028
    indexed by RelatedObject1->oBattleObject_CurAction contains the single handler sub_80C802C+1; falls
