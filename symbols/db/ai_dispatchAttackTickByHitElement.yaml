name: ai_dispatchAttackTickByHitElement
address: '0x08107750'
kind: function
status: probable
summary: Dispatches an AI attack tick to a per-element handler based on the hit element stored in the
  AI attack vars.
interface: (r7 = AI attack vars struct base) -> tail-calls handler from off_8107764 indexed by [r7,#oAIAttackVars_HitElement];
  no return value of its own
details: Reads the oAIAttackVars_HitElement byte from the struct at r7 and jumps to one of five element-specific
  routines (sub_810777C, sub_81077CC, sub_81077F8, sub_8107816, sub_8107856) or ai_defaultAttackTick for
  out-of-range elements. The jump table off_8107764 holds Thumb pointers (entry+1), and the call is made
  with mov lr, pc / bx r1 so the callee can return past the pop {r7,pc}. r0 at entry is clobbered before
  the branch, so it carries no argument. The struct is preserved only by the dispatcher; handlers see
  r7 unchanged.
