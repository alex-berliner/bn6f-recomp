name: battle_customScreenExitRotateChips_8027796
address: '0x08027796'
kind: function
status: confirmed
summary: On leaving the chip custom screen, rotates the selected-chip id list by one slot, re-uploads every affected
  chip's sprite tiles to VRAM, frees one sprite slot, runs the custom-screen exit sequence and starts the fade back
  into battle.
interface: void sub_8027796(u32 battleObj /*r5*/, u32 r10 /*unused here*/) — returns nothing meaningful; clobbers
  r0-r3, r5, r6, r8-r12 and flags, preserves r4 and r7
details: 'battleObj (r5) is the battle/HUD state object. First it picks a HUD form byte for e_loadHudBattleFormByte:
  0xC if battle_getActorEmotion_802A564(battleObj) returns 1, otherwise 0. It then rotates the chip-id array at
  battleObj+0x48, whose length is the byte at battleObj+8: reading from the top down, each byte is copied one slot
  forward (slot[i+1] = slot[i]) and the last byte that falls off the end is wrapped around into the now-empty first
  slot at battleObj+0x48. For every chip moved this way it looks the chip id up via getLocOfActiveChips_8027E1C,
  extracts the tile number from the low 9 bits of the halfword at chip+8 (the chip header), and re-uploads that
  chip''s OBJ tiles with sprite_CopyObjTilesToVramSlot_80281D4(tileNum, slotIndex). After the rotation it loads
  slot 0 of the freed sprite (sub_802A034) and clears it with the same tile-copy routine (r1=0), then marks slot
  0xB of the active-chip table as taken by writing state 2 to (getLocOfActiveChips_8027E1C(0xB))+7. Finally it calls
  customScreen_ExitSequence_8028E32(battleObj), starts a screen fade via SetScreenFade(0x60, 8), and stores HUD
  state 0x10 ("currently leaving the custom screen") into the halfword at battleObj+2. r4/r6 are pushed/popped only
  to be handed back to the caller unchanged per the register contract.

  '
