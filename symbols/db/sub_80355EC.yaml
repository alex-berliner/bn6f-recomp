name: sub_80355EC
address: '0x080355EC'
kind: function
status: confirmed
summary: Sets or clears the real-world-map indicator (stat byte 0x22) on Navi 0 by scanning a table of special map
  IDs.
interface: void navi_updateRealWorldMapFlag_80355EC(void /*r10 = toolkit_ptr*/);
details: Reads the current map ID from GameState (MapGroup halfword; falls back to SavedRealWorldMapId when the
  high byte of MapGroup is >= 0x80, indicating a real-world area). Walks a packed u16 lookup table at word_803562C
  (stride 2, sentinel detected when the low byte equals 0xFF). If the current map ID matches any entry, calls SetNaviStatsByte(0,
  0x22, 1) to raise the real-world flag; otherwise calls SetNaviStatsByte(0, 0x22, 0) to clear it. The table holds
  roughly ten map IDs (0x0000, 0x0001, two dynamic slots via byte_2030003, 0x0303, 0x0004, 0x0005, 0x0105, 0x0006)
  followed by the 0xFFFF terminator. Only Navi index 0 is touched; no other Navi stats are modified.
