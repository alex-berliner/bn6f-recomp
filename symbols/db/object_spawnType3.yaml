name: object_spawnType3
address: '0x08003358'
kind: function
status: confirmed
summary: Spawns a battle object of type 3 from five caller-supplied arguments and runs its initializer if the spawn
  succeeded.
interface: BattleObject* battle_spawnObjectType3(u32 a0, u32 a1, u32 a2, u32 a3, u32 a4); /* r0-r4 in; r5 out =
  new object pointer or NULL; flags set from tst r5,r5 when no initializer ran, otherwise from sub_8003400; r4/r6/r7
  preserved */
details: 'Thin wrapper over SpawnBattleObjectCommon for object type 3. Copies the five incoming registers (r0-r4)
  into a 0x14-byte block on the stack (sub sp,#0x14; mov r7,sp; stmia r7!,{r0-r4}), leaving r7 pointing just past
  the block, then calls SpawnBattleObjectCommon with r0=3 (object type) and r1=pointer to the argument block; the
  common routine reads its per-type context from that stack block and returns the new BattleObject in r5. If r5
  is non-NULL, calls sub_8003400, which is presumably the type-3 object''s init routine operating on the freshly
  created object. Returns the pointer in r5 either way; r4, r6 and r7 are preserved (r7 is reloaded by pop {r7,pc}).
  The stack frame is exactly the 5 argument words plus the saved r7/lr pair, matching the layout the common spawner
  expects.

  '
