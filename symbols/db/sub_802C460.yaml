name: sub_802C460
address: '0x0802C460'
kind: function
previous_names: []
status: hypothesis
summary: Performs a B-button panel swap in the chip-select screen by comparing A-panel vs B-panel slot indices and
  triggering the swap routine when they differ.
interface: '(r0 = diff-into-blend?, r1 = ?, r5 = ?, r6 = ?, r10 = toolkit) -> r0 = unchanged (ldrsb diff result)
  ; side effects: calls sub_802C490 and call_sub_3005EBA to actually do the swap'
details: "Loads two signed bytes from offset 0x6 (BButton) and 0x7 (BPwrAtk) of the chip-select state struct pointed\
  \ at by r5. These correspond to the A-slot chip's BPwrAtk and B-slot chip's BPwrAtk (per AIData naming reused\
  \ here as the chip-select substruct at offsets 0x6/0x7).\n  If the two BPwrAtk values are equal, returns immediately\
  \ (no swap).\n  Otherwise branches based on which is larger to compute r4 = |diff| between them, picks the smaller\
  \ value into r0 (clamped by adding 0x18 in the bgt path? Actually `add r0, #0x18` then `bgt` took the other path;\
  \ here r0 holds the smaller BPwrAtk).\n  Calls sub_802C490 with r1=2 and r5=0x12 as scratch values (looks up something\
  \ tied to chip data via the S20364C0-derived struct at 0x12).\n  If the lookup returns non-zero in r2, calls call_sub_3005EBA\
  \ (the swap-routine in the chip-select subsystem) with r2=3, r3=0 to perform the actual panel swap animation/state\
  \ update.\n  Pops {r4,r5,pc} on the way out, no r0 return value used by caller (snap_story2_0/1 show r0 unchanged;\
  \ the 0/2 cases. set r0=0 because the BEQ branch overwrites r4 differently — actually those cases take the early\
  \ return path or have r0 clobbered by ldrsb comparison).\ndetails_continued: |\n  Caller is sub_802BD60 (battle_initChipSelect_802BD60\
  \ per its struct comment), called from inside the chip-select update loop. Captured entry lr=0x0802bd97 places\
  \ this call inside that loop, consistent with a per-frame BPanelSwap handler. The 0x12 magic value stored into\
  \ r5 matches oS20364C0's ChipSelectCursorPos-related field area; sub_802C490 likely translates that into an animation/grid\
  \ index for the BPanel swap.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- assembly `ldrsb r0, [r5,#6]` and `ldrsb r1, [r5,#7]` show two signed byte slots in the r5-pointed struct
    are read; in MMBN chip-select these are the A/B chip BPwrAtk slots. - `cmp r0, r1; beq locret` short-circuits
    when the two chips are already identical. - `bgt loc_802C476 / b loc_802C47A` (after `sub r0, ... r0`) is a
    classic min/max branch that picks the smaller BPwrAtk index into r0. - `mov r5, #0x12` plus `bl sub_802C490`
    matches oS20364C0''s 0x12 (JumpOffset12 / BPanel-related) being passed. - final `bl call_sub_3005EBA` with `r2=#3,
    r3=#0` is the conditional swap trigger gated on `tst r2, r2; beq locret`. - caller `sub_802BD60` is annotated
    `battle_initChipSelect_802BD60` and contract in/out matches a chip-select per-frame callback. - 40 captured
    calls with lr=0x0802bd97 all from "snap_story2_*.bin" naming suggests it''s the chip-select screen in story-mode
    snapshots.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x0802C460

    '
  result: the body read as described above
- method: coverage
  date: '2026-10-14'
  detail: 'Executed by: battles1, battles2, beastsp, menus3, story2, story4, story5, story6, story7, story8, story9'
  reproduce: 'grep -l ''^0802c460 '' tools/traces/coverage/*.prof

    '
  result: battles1, battles2, beastsp, menus3, story2, story4, story5, story6, story7, story8, story9
open_questions:
- Exact semantic of offsets 0x6 / 0x7 inside the r5 struct — assumed to be BPwrAtk from the AIData layout reuse,
  but the chip-select struct (`S20364C0`) doesn't expose those offsets, so this struct is likely the inner chip-slot
  pair, not S20364C0 itself.
- 'Meaning of `add r0, #0x18` in the `bgt` taken path (never executed in the captured snapshots because BPwrAtk
  diffs there are negative or zero-leading).'
- What sub_802C490's r1=2 / r5=0x12 inputs select — needs callee disassembly.
