name: sub_802C460
address: '0x0802C460'
kind: function
previous_names: []
status: hypothesis
summary: 'Battle chip-select screen input handler: reacts to APwrAtk/BPwrAtk key presses to advance the cursor between
  chip slots on a particular row, clamping at the row''s bounds.'
interface: (r5 = s_20364C0 chip-select state ptr, r6 = ???, r10 = toolkit) -> r0 = (unchanged from entry) ; side
  effects may include calling sub_802C490 and call_sub_3005EBA
details: 'Reads the two signed bytes at s_20364C0+0x6 (BButton row, `BPwrAtk`) and s_20364C0+0x7 (BPwrAtk row, `BPwrAtk`)
  as r0/r1 and compares them. If equal it returns. Otherwise it computes |r0 - r1| into r4 and picks the larger
  index as r0, then adds an offset based on the current state to that index. With r1 = 2 and r5 = 0x12 it calls
  sub_802C490 (presumably the row cursor mover or row selection helper). If sub_802C490 returns a non-zero r2, the
  function then calls call_sub_3005EBA with r2 = 3, r3 = 0 (likely "advance selection" or "play sound"). This is
  reached only when the chip select cursor is on a particular row, and the call from sub_802BD60 (which the project
  identified as `battle_initChipSelect`) confirms this is the chip-select sub-screen input handler.

  '
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- asm: `mov r0, #6; ldrsb r0,[r5,r0]` and `ldrsb r1,[r5,r1]` correspond to offset 0x6/0x7 in S20364C0,
    which the struct maps to BButton (0x6) and BPwrAtk (0x7) — two chip-select cursor row positions. - asm: `cmp
    r0,r1; beq locret` — no-op when both row indicators are equal (cursor already past that row). - asm: `sub r4,
    r1, r0` then `bgt loc_802C476; sub r4,r0,r1; mov r0,r1` — compute |rowB - rowA| and pick the larger as the index.
    - asm: `add r0, #0x18` in the r0<r1 path — adjusts the picked index by 0x18, hinting at a row-specific offset.
    - asm: `mov r1, #2; mov r5, #0x12; bl sub_802C490` — passes a constant 0x12 with r1=2 to the helper, then conditionally
    tails into `bl call_sub_3005EBA` only when the helper returned non-zero in r2. - Caller: sub_802BD60 is annotated
    `battle_initChipSelect_802BD60` by the project, situating this inside the chip-select subscreen. - Captured
    r5/r6/r10 in/out entries match the chip-select state pointer + toolkit pattern.'
