name: sub_802C460
address: '0x0802C460'
kind: function
status: hypothesis
summary: Reads two byte positions from an object, scans the span between them (via sub_802C490), and if something
  is found along the way raises a type-3 notification.
interface: void scanSpanBetween(Object* obj) — object pointer passed in r5; r4, r6, r7, r10 are inputs the callee
  must preserve; returns nothing meaningful, but c/v and r1-r3 are left as side effects of the early-out CMP and
  the callees.
details: 'Takes an object pointer in r5 and reads two signed bytes from offsets 6 and 7, which look like two positions
  along one axis (e.g. two tile/column coordinates, possibly start and current position of a moving/hazard object).
  If the two bytes are equal the function does nothing. Otherwise it computes the distance between them and a start
  coordinate: if the byte at offset 6 is the smaller value the start is that byte plus 0x18 (24 — likely a stride/width,
  e.g. the far edge of the tile the object occupies), otherwise the start is the byte at offset 7. It then calls
  sub_802C490(start, 2, distance, 0x12); the constant 2 is probably a direction/axis selector and 0x12 (18) some
  kind of target id or search type for the span scan. If sub_802C490 reports a hit (returns nonzero in r2), the
  function calls call_sub_3005EBA(hit_result, 3, 0), presumably dispatching an event/callback of type 3 with the
  scan''s result. r4 and r5 are saved and restored around the calls; on the equal-bytes early-out path r1 still
  holds the byte loaded from offset 7 and c/v reflect the CMP of the two bytes.

  '
