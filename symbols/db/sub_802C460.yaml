name: sub_802C460
address: '0x0802C460'
kind: function
previous_names: []
status: hypothesis
summary: Computes the charge column difference (signed) between a battle object's A- and B-button power attacks
  and triggers a chip-use update when non-zero.
interface: '(r5 = object, r6 ?, r10 = toolkit, lr = ret) -> r0 = (preserved); r4,r5,r6,r7 clobbered; r1,r2,r3 caller-saved
  (write-visible). Side effects: may call sub_802C490 and call_sub_3005EBA.'
details: "Reads two signed bytes from the object pointed to by r5: offset +0x6 (BPwrAtk / `BattleObject.BPwrAtk`)\
  \ and offset +0x7 (BLeftAbility is at +0x8; +0x7 in AIData is `BPwrAtk`, but here accessed through an object that\
  \ has +6/+7). Actually struct BPOff mapping: +0x6 and +0x7 are loaded as signed bytes and compared. If equal,\
  \ return. If r0<r1 (bgt not taken => r0<r1 path actually entered via bgt; see below), compute `r4 = r1 - r0` and\
  \ set `r0 = r0 + 0x18`; otherwise (r0>r1) compute `r4 = r0 - r1` and `r0 = r1`. Then `r1 = 2`, `r5 = 0x12`, bl\
  \ sub_802C490. If its return `r2` is non-zero, set `r2 = 3`, `r3 = 0`, bl call_sub_3005EBA (likely a sound/SFX\
  \ or animation dispatch with arg 3).\n  Note: the assembly uses `ldrsb` (signed), so the difference can be negative;\
  \ the captured call snapshots show r0 = 0xffffffe2, 0xfffffff4, etc., consistent with signed byte -0x1e, -0xc,\
  \ etc., treated as signed 32-bit after sign-extension. The `bgt loc_802C476` is a bug-vs-intent issue: the `bgt`\
  \ is reached when r0>r1 (the opposite of \"first value larger means we go down\"), so the path actually entered\
  \ for \"r0 < r1\" is the fall-through with `sub r4, r1, r0`. With signed compare, if r0 == r1, the beq returns.\n"
evidence:
