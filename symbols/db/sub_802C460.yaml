name: sub_802C460
address: '0x0802C460'
kind: function
previous_names: []
status: hypothesis
summary: Compare two signed bytes on a struct in r5 (offsets 6 and 7); when they differ, dispatch to a helper that
  likely swaps something and conditionally calls a follow-up function if that helper sets r2.
interface: '(r5 = pointer to a struct whose +6 and +7 are signed bytes; r6, r10 unchanged) -> r0 = result of follow-up
  call_sub_3005EBA (often 0); side effects: may call sub_802C490 and call_sub_3005EBA; clobbers r0-r4,r7; preserves
  only lr via return'
details: "- Reads two signed bytes: [r5+6] and [r5+7] (ldrsb at +6/#6 and +7/#7), corresponding to AIData.BButton\
  \ (loc=0x6) and AIData.BPwrAtk (loc=0x7).\n  - If both bytes are equal, returns immediately (beq locret_802C48E).\n\
  \  - Otherwise computes the difference (r4 = abs diff), picks the larger value via `add r0, #0x18` then `mov r0,\
  \ r1` (adds 0x18 = 24 to the smaller one to offset into a packed table).\n  - Calls sub_802C490 with (r0 = possibly-offset\
  \ index, r1 = 2, r5 = 0x12). Per its contract, it returns r0/r2 and writes nz/c/v; here only r2 is read (`tst\
  \ r2, r2`).\n  - If sub_802C490 returned a non-zero r2 (some kind of \"yes, change needed\" flag), calls call_sub_3005EBA\
  \ with (r2=3, r3=0). Per its contract that one returns nz/c/v and clobbers r0-r2,r4-r7,lr — its r0/flags are what\
  \ we see at exit.\n  - The caller sub_802BD60 is described in the project as \"battle chip select\" (battle_initChipSelect_802BD60),\
  \ so r5 likely points into the chip-select state struct (S20364C0-style). Note that offset 6/0x12 of AIData fit\
  \ better with a NaviStats / chip-state sized record than the AIData at oAIData, but the magic numbers 6 and 7\
  \ exactly match AIData.BButton/BPwrAtk. Be cautious about which struct r5 actually references.\n"
evidence:
- method: assembly-reading
  date: '2026-10-14'
  detail: '- `ldrsb r0, [r5,r0]` with r0 = #6 then `ldrsb r1, [r5,r1]` with r1 = #7 are the byte loads. - `cmp r0,
    r1; beq locret` short-circuits on equality. - `sub r4, r1, r0` vs `sub r4, r0, r1; mov r0, r1` (gt branch) compute
    abs-diff into r4 with the larger in r0. - `add r0, #0x18` is applied to the smaller-of-the-two before calling
    sub_802C490 (third argument = 0x12). - `tst r2, r2; beq locret` shows r2 (the second return register of sub_802C490
    per its contract) is the gate. - `mov r2, #3; mov r3, #0; bl call_sub_3005EBA` shows the follow-up only runs
    after the prior check. - Caller is battle_initChipSelect_802BD60; called sub_802C490 and call_sub_3005EBA are
    unnamed asm03 callees.'
  refs:
  - bn6f/asm/asm00_2.s
  reproduce: 'python3 tools/asmcat.py 0x0802C460

    '
  result: the body read as described above
- method: coverage
  date: '2026-10-14'
  detail: 'Executed by: battles1, battles2, beastsp, menus3, story2, story4, story5, story6, story7, story8, story9'
  reproduce: 'grep -l ''^0802c460 '' tools/traces/coverage/*.prof

    '
  result: battles1, battles2, beastsp, menus3, story2, story4, story5, story6, story7, story8, story9
open_questions:
- Which struct r5 actually points to; offsets 6 and 7 matching AIData fields is suggestive but not proof (chip-select
  local struct also has a field at +7 named ChipSelectCursorPos, so +6 here is just "the thing being compared against
  the selected chip slot").
- The semantic meaning of the `0x18` offset, of the literal `0x12` packed into r5, and of the call_sub_3005EBA argument
  r2=3 (some action id, almost certainly "press B to use B-PwrAtk").
