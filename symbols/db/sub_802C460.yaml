  date: '2026-10-14'
  detail: '- `ldrsb r0, [r5, #6]` and `ldrsb r1, [r5, #7]` (asm03_0.s:12991) — signed-byte loads from a struct.
    - `cmp r0, r1` / `beq locret_802C48E` — equal case is a no-op. - `bgt loc_802C476` — opposite-of-intuitive branch
    for the r0>r1 case; fall-through handles r0<r1. - `sub r4, r1, r0` vs `sub r4, r0, r1` — difference (absolute
    value-ish) stored in r4. - Captured call r0 entries (0xffffffe2, 0xfffffff4...) are sign-extended signed bytes,
    matching `ldrsb`. - Caller `sub_802BD60` is `battle_initChipSelect_802BD60` (per S20364C0 comment), so this
    is reached during chip-select setup or per-frame tick.'
