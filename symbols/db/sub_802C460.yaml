- Which fields at r5+6 and r5+7 — possibly `BattleObject.ChipsHeld` and `BattleObject.Unk_1b`, or AIData `BPwrAtk`
  and `BLeftAbility`. The literal `r0 = r0 + 0x18` after sub suggests an index/offset used by sub_802C490 (which
