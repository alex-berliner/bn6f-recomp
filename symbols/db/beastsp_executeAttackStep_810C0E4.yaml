open_questions:
- Exact meaning of AIAttackVars+0x0d (shake-strength vs. enable-shake) and +0x0e (sub-step selector calling
  `sub_810C14A`).
- The BattleObject's AIData→AttackVars field 0x08 is reused as the "Damage" payload to the kind-0x16 spawn.
- Why the kind-0x16 spawn is given r3=0 (no source pointer) — possibly because the kind handles its own
  damage application from the Damage word.
