  date: '2026-10-14'
  detail: '- `ldrh r0,[r7,#oAIAttackVars_Unk_10] ; add r0,#1 ; strh r0,[r7,#oAIAttackVars_Unk_10]` increments
    a u16 step counter in AIAttackVars at offset 0x10 (struct `AIAttackVars`). - `cmp r0,#2 ; bne loc_810C120`
    is a one-shot gate to fire the hit exactly on step 2. - `mov r0,#0xc0 ; bl PlaySoundEffect` plays
    SFX 0xC0 (BeastSp hit sound matches the typical power-atk SFX table). - `bl object_getFrontDirection
    ; ldrb r1,[r5,#oBattleObject_PanelX] ; add r0,r0,r1` computes the front-panel column using the battle
    object''s alliance/facing. - `bl battle_spawnBasicObjectKind0x16_80C6CE4` with r3=0 (no attacker),
    r4=AIAttackVars+0x03 (param4), r6=Damage=AIAttackVars+0x08 → spawns the visual hit object of kind
    0x16. - `bl sprite_getFrameParameters ; tst r0,#0x80 ; beq locret_810C148` polls the current anim
    frame''s bit-7 to detect the end-of-attack frame. - `strh r0,[r7,#oAIAttackVars_Unk_18]→Unk_10` and
    `mov r0,#0x10 ; strh r0,[r7,#oAIAttackVars_Unk_00]` arms the post-hit transition into sub-state 0x10.
    - Captured-call LR `0x0810bfc4` and the `snap_beastsp_*` context confirm this is the BeastSp AI attack
    tail. - No callers listed; beastsp''s caller must reside in the same AI subroutine module around 0x0810bfc0.'
