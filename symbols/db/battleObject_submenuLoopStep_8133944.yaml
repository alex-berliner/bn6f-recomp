open_questions:
- Whether r5 is a `struct SubMenu*` (which has `idx_00` at 0x0 and an implied size 0x80 per SubMenu.inc)
  or one of the bigger `S20364C0`/`oBattleObject` objects that also expose offset 0x34; the cursor at
  0x34 fits `S20364C0` best (no field 0x34 documented there either). Decompiling one of the called renderers
  will settle the r5 base type.
- What state byte the wrapper at 0x081337D0 actually carries in r1 vs. what `sub_8133C0C` interprets —
  the captured r1=0x0C matches `sub_8133C0C`'s documented cancel-state 0x0C but may also be passed straight
  to `sub_8133C0C` as its "current state" arg.
