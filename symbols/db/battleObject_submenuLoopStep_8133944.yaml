status: probable
summary: 'Per-frame main update for a battle object''s sub-menu state (e.g. Beast/Custom-Anger confirm
  screen): cancels on START/B, confirms on A, scrolls the cursor through up to 8 entries on d-pad, and
  re-renders the folder-edit/submenu graphics and AI-related callbacks each tick.'
interface: '(r2, r4, r5, r6, r7, r8, r10, lr = various preserved live regs incl. submenu ptr in r5 and
  Toolkit ptr in r10) -> no return value (pop {pc}); side effects: writes tile-flag palette, BG tilemap,
  custom-gfx, AI turn-handler dispatch, cursor index stored back at r5+0x34'
details: '- `push {lr}` / `pop {pc}` and no callee-saved register restores => void tail-call style update.

  - First calls `sub_8133C0C`, the project''s "START/B cancel for sub-menu" handler; if it returns NEQ
  (i.e. didn''t exit/transition), the code then runs `battleObject_selectAIDataHandler_81347A4` (A-button
  confirm step, dispatching the mode handler and rewriting tracked target slots).

  - Then reads the LowSensitivityHeld joypad bits via `Toolkit->JoypadPtr->LowSensitivityHeld` (offset
  0x4 on Joypad), calls `menu_moveCursorUpDown_811FA22` with r1=7 / r2=1 / r3=[r5+0x34] (max 7 entries,
  step 1, current cursor index), and stores the resulting cursor back to r5+0x34 — that''s the only field
  of the submenu-like object this function mutates itself.

  - After that the always-run block fires: `copyBackgroundTiles_sub_813471C` and `sub_8134740` (the tile-blit
  and animation-counter decrement helpers) only when the menu is still in normal state; otherwise we skip
  to `loc_813396C`.

  - At `loc_813396C` it always: clears the submenu background if closed (`submenu_clearBgIfClosed_8134594`),
  runs the beast status-effect pump (`battleObject_runBeastStatusEffect_81345B0`), calls two `object_resolveTableEntryByIndex/Wrapper`
  helpers (reading 0xE2/0x1C/0x1E/0x24 / 0x182/0x1C/0x28/0x2E table entries used elsewhere in this screen),
  uploads the chip/folder tile blocks (`battleObject_submenuRenderFolderAndChips_81341A0`), rebuilds the
  folder-edit BG (`battleObject_drawFolderEditScreenGfx_8134310`), the row-align SN3 check (`battleObject_alignRowOffsetCheckSN3_81353DC`),
  then dispatches two AI turn-handler steps via `battle_aiRunTurnHandler_81353F0` with (r0=5, r1=0) and
  (r0=6, r1=1) — i.e. it triggers action ids 5 and 6 with sub-modes 0/1 inside this state.

  - The 40 captured-call snapshots all show the same r0=0x08133945 (return-into-Thumb-BX-style return
  address one past `sub_8133944`), r1=0x0c, r2=0, r3=0x02001c04, lr=0x081337d0 — i.e. it''s invoked as
  one entry of a jump table at 0x081337D0 with the index/state byte 0x0C in r1, no incoming args in r0/r3,
  and a global struct at 0x02001c04 in r3. Exit r0 is consistently 0x40 with -Z-- (Z set), so the function
  does not return a meaningful value (likely the late `battle_aiRunTurnHandler_81353F0` last call returns
  0x40). r5 is preserved across the call (it''s a callee-saved pointer to the submenu-like object).

  '
