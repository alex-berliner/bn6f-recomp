    shows this is invoked as index 0x0C from a state-mode dispatcher at 0x081337D0, with r1=0x0C (the
    state byte). All 40 snapshots share these values, so it is a stable per-frame loop body for that state.
    - All callees'' summaries reference battle sub-menu / folder-edit / AI confirm screen activities consistent
    with the per-frame draw/update loop of a battle object sub-menu state.'
