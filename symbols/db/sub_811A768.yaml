summary: Shifts a sprite left by a sprite-add-coordinate offset and flags var+8 when it crosses a leftward bound.
interface: void sub_811A768(void *sprite, void *var); // r0=sprite, r1=var; returns r0=1 normally, r0=0 if clamped
details: 'Uses sprite_addCoordinates with a dx-of-zero-ish and dy-of-zero argument set (r0=var as sprite, r1=0)

  to nudge the sprite leftward (R5 must hold the sprite/var pointer per caller convention), then reads

  the post-update x via sprite_getCoordinates. If the resulting x < -48 (0xFFFFFFD0), it writes the

  value 8 into var+8 and returns 0; otherwise returns 1. R4/R5 are preserved through the helper calls.

  var+8 is treated as a small state/flag byte (value 8 written on out-of-bounds). The exact meaning of

  0xFFFFFFD0 (-48) and var+8 is not visible from this function alone.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
