    byte. - `ZeroFillByWord` is called with r1=0x48 on dword_2033000, the chip-use command queue. - `bl
    getLocOfActiveChips_8027E1C` with the index derived from r6=0x48.. is used to fetch the active chip
    slot. - `bl battle_chipEffectDispatcher_80109A4` with `ldr r1, [r1,#oToolkit_BattleStatePtr]; ldrb
    r1, [r1,#0xd]` invokes each chip''s use handler. - The threshold `0x190` and bitmap write into `word_20349AC`
    (`[r0,#0xc]`) correspond to a per-chip-class use bitmap. - `bl processChipCommandQueue_8029224` at
    the very end runs the built queue. - The caller custMenuPressOK_8028D3A explicitly handles the OK-press
    flow on the Custom Screen.'
