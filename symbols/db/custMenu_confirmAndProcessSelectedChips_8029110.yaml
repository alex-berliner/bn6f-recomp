open_questions:
- Exact semantics of sub_8029344 / sub_8029328 / sub_80292CC / sub_8029520 / sub_802B6F2 in this pipeline;
  the meaning of S20364C0+0xB = 0x14 vs 0x10 (probably "preparing" vs "executing"); and what the bytes
  at byte_20366C0+0x32..+0x3C vs byte_20366FE represent. Naming custMenu_ assumes the caller context;
  this could equally be the broader battle-side chip confirm path.
