status: probable
summary: Picks the per-PET-navi tile grid blob from a small table, LZ77-decompresses it into a staging
  buffer, then copies the post-header payload into a destination buffer using the fastest legal width.
interface: (r0 = *LZ77-table *, r1 = *outBuffer, r2 = *stagingBufferWithHeader) -> r0 = ptr just past
  staging header (r2+4)
details: "- On entry, r0 is a small array of LZ77 source pointers (one per supported state).\n  - r7 is\
  \ initialised to 0x30 (the default byte offset into that table) and the function asks\n    sub_8123360\
  \ (`battle_isCurPETNaviPresent_8123360`) which of two PET-navi slots is \"active\";\n    if it returns\
  \ non-zero, r7 is replaced by `(GetCurPETNavi() * 4)`, picking the alternate slot.\n    This matches\
  \ r1 in the captured call @0x0201bf20 holding slot data and the routine's\n    \"PET-navi variant\"\
  \ behaviour.\n  - `ldr r0, [r1, r7]` then loads the compressed blob pointer from that table slot.\n\
  \  - `SWI_LZ77UnCompReadNormalWrite8bit(decompressed_into_staging_buffer, r2+0..)` fills r2\n    in\
  \ place; the LZ77 header has a 4-byte \"decompressed size\" word, so the function reads\n    `[r1]`\
  \ (the header), shifts it right by 8 (dropping the low byte), subtracts 4, and uses\n    the remaining\
  \ word as the payload byte count to memcpy from `r2+4` into `r1` (the\n    caller's destination buffer).\n\
  \  - The function then picks CopyBytes / CopyHalfwords / CopyWords / CopyByEightWords based\n    on\
  \ the payload alignment (`&1`, `&2`, `&0x1F`), the same progressive-fast-path ladder\n    the BIOS mem-copy\
  \ wrappers expose.\n  - After copy the function returns `r0 = r2+4` (staging payload base), which is\
  \ the value\n    observed in the captured-call exit (`r0 = 0x02013a04` while staging = 0x02013a00).\n\
  \  - The eight callers (`battle_setupSceneTiles`, `chipFolder_initGfx`,\n    `initTitleScreens`, `saveMenu_config_textscript`,\
  \ `sub_8133EC0`, `sub_8137ACC`,\n    `subchip_initGfx`, `textScript_loadAndRunEmbeddedArchive`) all\
  \ match the established\n    pattern of \"build a tile-descriptor array, decompress scene graphics,\
  \ then blit a\n    30×20 background grid into tile block 1\"; this routine provides the actual grid\n\
  \    contents (a per-navi variant of the empty/background tile grid).\n  - Likely side effect: writes\
  \ destination buffer (`r1` caller arg) of size header>>8 - 4\n    bytes; staging buffer (r2) is completely\
  \ overwritten by the LZ77 SWI.\n"
