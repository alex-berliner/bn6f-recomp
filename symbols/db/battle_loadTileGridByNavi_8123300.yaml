  date: '2026-10-14'
  detail: "- `mov r7, #0x30` -> default table slot offset; `lsl r7, r0, #2` (after GetCurPETNavi) is\n\
    \  the alternate slot offset.\n- `bl sub_8123360` -> \"is current PET navi present\"; gate for the\
    \ alternate slot. - `bl SWI_LZ77UnCompReadNormalWrite8bit` with `(decompressed, r2)` shows blob goes\
    \ to staging. - `lsr r2, r2, #8; sub r2, #4` -> payload size = (header>>8) - 4 = standard EX-BN6\n\
    \  LZ77 wrapper layout (size in header bits 8..31).\n- The `tst r3, r2` ladder against `#1`, `#2`/`#3`,\
    \ `#0x1F` selects Copy* variants with\n  increasing transfer widths.\n- Captured-call exit r0 = 0x02013a04\
    \ = r2+4 with r2=0x02013a00 confirms \"returns payload pointer\". - All eight named callers use this\
    \ routine immediately before blitting a 30x20 grid into\n  tile block 1, matching the function's role\
    \ as the grid source."
