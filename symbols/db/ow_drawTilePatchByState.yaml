name: ow_drawTilePatchByState
address: '0x0801CA34'
kind: function
status: probable
summary: Redraws a small 8x2 patch of tiles on the overworld background, selecting the tile row and tile
  graphic from a state byte in the caller's struct.
interface: '(r5 = struct ptr, set by caller: byte [r5] = state, byte [r5+0xB] = variant index) -> r0 =
  destroyed; no meaningful return value'
details: The function reads [r5+0xB], maps it through the byte table dword_801CA7C (bytes 0x00,0x02,0x03,0x00)
  to get a variant index r6. If ([r5] & 0x1F) is nonzero it returns without drawing. Otherwise, if the
  state byte [r5] is < 0x20, it calls CopyBackgroundTiles with j=0x16-r6 (row), i=4 (column), tile block
  3, tile ids taken from byte_801D984+r6, size 8x2 — i.e. the row position moves up as the variant index
  grows. If the state byte is >= 0x20 it instead calls the thunk call_sub_3005EBA with identical arguments
  except tile_ids=0, presumably a variant that draws from a different tile source. The two paths draw
  the same geometry, differing only in tile source.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'ldrb r6,[r5,#0xB] + ldrb r6,[r0,r6] via dword_801CA7C: variant index looked up from a small
    table; and r1,#0x1F on [r5] with bne locret: low 5 bits of the state byte gate whether anything is
    drawn; CopyBackgroundTiles(0x16-r6, 4, 3, byte_801D984+r6, 8, 2): draws an 8x2 tile patch whose row
    depends on the variant; loc_801CA5E path calls call_sub_3005EBA with same coords/size but tile_ids=0:
    alternate tile source for state >= 0x20; uses CopyBackgroundTiles, an overworld-background routine,
    suggesting an ow/map subsystem'
  refs:
  - bn6f/asm/asm00_2.s:28707
  - 0x080018C2 CopyBackgroundTiles
  - 0x080018D0 call_sub_3005EBA
  reproduce: python3 tools/asmcat.py 0x0801CA34
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-010606'
open_questions:
- No caller is known, so the identity of the r5 struct and what its state byte and +0xB field represent
  are unconfirmed
- Contents of byte_801D984 (the tile-id table) and of call_sub_3005EBA are not shown, so the visual meaning
  of the patch (gate, counter, water level, etc.) is unclear
- Why the >= 0x20 state path uses tile_ids=0 needs the callee's code to interpret
