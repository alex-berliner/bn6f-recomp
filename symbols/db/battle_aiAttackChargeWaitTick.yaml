name: battle_aiAttackChargeWaitTick
address: '0x080F0B0E'
kind: function
status: probable
summary: 'Per-frame update for an AI attack state: on first run it sets attack element 4, resets the object''s
  animation and starts a 30-frame timer; once the timer runs out it exits the attack state.'
interface: (r7 = AI attack vars struct (oAIAttackVars), r5 = battle object) -> r0 = scratch; sets oAIAttackVars_AttackElement=4,
  oBattleObject_CurAnim=0, oAIAttackVars_StepTimer=30 on first call, then decrements StepTimer each call
  and calls object_exitAttackState when it reaches zero
details: 'This is a two-phase state handler keyed on oAIAttackVars_AttackElement in the r7 struct. Phase
  one (element == 0): writes element value 4, zeroes oBattleObject_CurAnim (r5 struct) so the object plays
  its idle/default animation, and loads 30 into oAIAttackVars_StepTimer — a charge/wind-up delay. Phase
  two: each subsequent call decrements StepTimer and, when it hits zero, tails into object_exitAttackState
  to return to the normal AI state. The early-out bne means the initialization runs exactly once; the
  actual attack behavior must live elsewhere (a separate state step).'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst/bne splits one-time init from the countdown phase;
    init writes AttackElement=4, oBattleObject_CurAnim=0 (r5) and StepTimer=0x1E (30 frames); countdown
    branch decrements StepTimer and only falls through to bl object_exitAttackState when it reaches 0;
    sole callee object_exitAttackState confirms this is a battle AI attack state wrapper
  refs:
  - bn6f/asm/asm31.s:123829
  - 0x08011714 object_exitAttackState
  reproduce: python3 tools/asmcat.py 0x080F0B0E
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-022109'
open_questions:
- No known callers, so which enemy/AI uses this state and when it is entered is unknown
- What element value 4 means in oAIAttackVars_AttackElement (which attack this is) is not shown
- Whether the 30-frame delay is a charge-up before an attack handled by a sibling state handler
