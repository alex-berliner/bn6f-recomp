name: battle_scanAdjacentPanels
address: '0x080F37D8'
kind: function
status: probable
summary: Checks the four panels adjacent to a battle object's panel and calls a handler (sub_80C8DE0)
  for each one whose status flags have bit 0x10 set.
interface: (r5 = battle object, r2/r4/r6 = context passed through) -> r0 = last object_getPanelParameters
  result; calls sub_80C8DE0(r0=dx, r1=dy, r2, r4, r6) per matching neighbor
details: 'The function loops r7 = 0..3 over a table of four (dx,dy) signed-byte pairs at byte_80F3824:
  (-1,0),(1,0),(0,-1),(0,1), i.e. the four orthogonally adjacent panels. For each, it adds the offset
  to the object''s oBattleObject_PanelX/PanelY fields (loaded from r5, which the caller must set since
  r5 is not written here) and calls object_getPanelParameters. If the returned panel status word has bit
  0x10 set, it restores the caller''s r2/r4/r6 from the stack and calls sub_80C8DE0 with r0=dx, r1=dy
  plus that context. It is effectively ''for each of the 4 neighboring panels with flag 0x10, do X'';
  the exact meaning of flag 0x10 and of the callback are not visible here. Note it never modifies the
  object, so it is a query/dispatch helper.'
