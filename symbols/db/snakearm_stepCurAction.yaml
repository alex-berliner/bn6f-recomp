name: snakearm_stepCurAction
address: '0x080E9204'
kind: function
status: probable
summary: 'Snake-arm attack state dispatcher: calls the handler for the battle object''s current action
  (dim screen, step snake, undim screen, etc.) via jump table.'
interface: (r0 = unused/scratch, r5 = battle object with oBattleObject_CurAction) -> r0 = handler return
  value; calls handler for CurAction and returns
details: Loads the object's CurAction byte from [r5,#oBattleObject_CurAction], indexes the 5-entry table
  off_80E9218 to get a Thumb handler pointer, and calls it with the standard mov lr,pc/bx r1 pattern,
  returning whatever the handler returns. Table entries are object_dimScreen, sub_800BDB2, battleObject_stepSnakeArm_800BA8A,
  sub_80E922C, object_undimScreen — a dim-screen/undim-screen bracket around snake movement suggests the
  full-screen snake attack sequence. r0 is not set up as an argument before the call; the battle object
  is passed implicitly via r5.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_CurAction]; ldr r1,[r1,r0] — action-indexed jump table dispatch (asm);
    Table mixes object_dimScreen and object_undimScreen with battleObject_stepSnakeArm_800BA8A — screen-dim
    bracketing a snake step; mov lr,pc; bx r1; pop {pc} — tail-call style dispatch returning the callee's
    result; Known callee battleObject_stepSnakeArm_800BA8A ties this to the snake-arm subsystem
