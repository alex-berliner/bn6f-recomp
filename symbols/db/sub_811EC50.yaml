name: sub_811EC50
address: '0x0811EC50'
kind: function
status: hypothesis
summary: Top-level per-frame updater that runs the subsystem's five update steps in order and returns.
interface: void runFrameUpdateSequence(void); // no meaningful inputs or outputs; r0-r3/lr and nzcv on return are
  just whatever the final callee (sub_811F08C) leaves
details: 'Pure dispatcher: pushes lr, then tail-calls a fixed sequence of five no-argument

  per-frame update routines — sub_811EC68, sub_811EFB8, sub_811F014, sub_811F050,

  sub_811F08C — and pops pc. It takes no parameters, reads no globals itself, and

  preserves nothing beyond what its callees preserve (r4-r9 happen to survive through

  the whole chain). All state the sequence touches lives inside the five callees, so

  the subsystem''s actual identity (and therefore a good prefix) can only be pinned

  down by analyzing them. Register/flag state on exit is exactly whatever the last

  callee, sub_811F08C, leaves behind.

  '
