name: sub_8124C30
address: '0x08124C30'
kind: function
status: confirmed
summary: Dispatches the current battle-phase byte (work r5 +0x02) to one of 20 thumb handler in off_8124C44.
interface: void battle_phaseDispatch_8124C30(u32 r2, void* r5_work, u32 r10); returns r0=0; preserves c/v from handler;
  r1, r2, r3, r5, r7–r12, lr pass through from the handler.
details: 'Reads the phase index byte from the battle work object at r5+2 and uses it as a raw byte offset

  into the handler table at off_8124C44 (no shift; the byte is already in 4-byte units: 0,4,8…0x4C

  for the 20 entries). Loads the thumb target with `ldr r0,[r0,r1]`, sets r1 to the phase byte, and

  tail-calls it via `mov lr,pc; bx r0`. After the handler returns, the dispatcher forces r0=0

  (clears N, sets Z) and pops pc.

  The 20 dispatch targets cover the battle sprite pipeline: pair tick/refresh, shield update,

  stage-2 init, intro, updates-and-fade, and the transition tick sub_8125170.

  '
