name: submenu_showChapterBlurbEntry
address: '0x0811A704'
kind: function
status: probable
summary: Loads the blurb id for the selected submenu entry from a 3-byte table and renders that chapter
  blurb text via sub_811A718.
interface: (r0 = ignored, r1 = selection index 0..2) -> r0 = return of sub_811A718; no flags meaningful
  on return
details: 'A thin dispatcher: it indexes the inline byte table dword_811A714 (bytes 0x64,0x65,0x66,0x00
  = blurb ids 100,101,102,0) with r1 via ldrb, then tail-calls sub_811A718, which picks the destination
  VRAM buffer and layout flags for chapter blurb 0..3 and dispatches renderTextGfx_8045F8C on script template
  eTextScript201BA20. The caller sub_811A640 (submenu input dispatch) invokes it after resolving the current
  selection, with a special d-pad-up case nearby. Entry r0 is dead — it is overwritten by the loaded byte.
  The table''s fourth byte (0) is an unused/terminator slot.'
