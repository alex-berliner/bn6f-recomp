- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrb r0, [r4,r1] with r4 = dword_811A714 (bytes 0x64,0x65,0x66): table maps selection index
    to a blurb id; bl sub_811A718 immediately after, whose known summary renders a chapter blurb from
    eTextScript201BA20 into a chosen VRAM buffer; caller sub_811A640 dispatches submenu input to action
    handlers, so this runs on selecting a blurb entry; pop {pc} right after the bl: tail-call wrapper,
    no other work done'
