open_questions:
- sub_80E996E is unknown — its body would confirm it is the generic effect/object spawn routine and how
  it interprets r0-r4
- Exact meaning of ObjectFlags2 bit 0x200000 and sprite unk0x2c field not established
- The proposal correctly identifies the packed word (bit 0x100 flag, anim<<16, palette<<24) and the r5
  dependency, matching lines like `orr r4, r0` after the tst and the use of `[r5,#oBattleObject_CurAnim]`.
  However, the bit tested is `0x200000` from object_getFlag2, not `0x100` (the proposal reverses the description),
  and the summary says 'inherits the object's visuals' but the sprite record's 0x2c word is just passed
  through — we don't actually know it is a visual word. The callee sub_80E996E's role is also speculative;
  callers include bomb update and several sub_80CD*** functions, so the name should not imply bombs specifically.
  A more accurate name emphasizes building spawn attrs from the source object.
