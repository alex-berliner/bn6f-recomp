  detail: 'tst r0 with dword_800F960=0x200000 after object_getFlag2, then orr 0x100 into r4 (loc_800F916-921):
    ObjectFlags2 bit maps to a spawn-param flag bit; ldrb [r5,#oBattleObject_CurAnim] <<16 and sprite_getPalette
    <<24 orr''d into r4: packed word carries anim+palette of the source object; ldmia r6! (r5+0x34) {r1-r3}
    then bl sub_80E996E with sprite_getUnk0x2c result in r0: a 4-arg (plus r4) spawn call using fields
    copied from the object; Caller battle_bombObjectUpdate calls it right before playing the hit sound,
    spawning the explosion, and cleaning up the bomb — consistent with spawning a visually-matched effect'
