name: battle_buildSpawnAttrsFromObject
address: '0x0800F90E'
kind: function
status: probable
summary: 'Packs a spawn parameter word in r4 from the source object: sets bit 0x100 if ObjectFlags2 has
  0x200000, ORs in currentAnim<<16 and palette<<24, then forwards sprite record word at 0x2c (r0) and
  three words from obj+0x34 (r1-r3) to sub_80E996E. Relies on caller already having the object pointer
  in r5.'
interface: (r0 = source battle object, r5 must also hold the same object pointer) -> spawns via sub_80E996E;
  r4 carries packed attrs (bit8 from ObjectFlags2&0x200000, anim<<16, palette<<24), r0 = sprite unk0x2c,
  r1-r3 = [obj+0x34..0x3F]
details: 'The function packs a parameter word in r4: it tests the object''s ObjectFlags2 (via object_getFlag2)
  for bit 0x200000 and sets bit 0x100 if present, then ORs the object''s current animation byte shifted
  into bits 16-23 and its sprite palette byte into bits 24-31. It fetches the sprite record''s word at
  offset 0x2c (sprite_getUnk0x2c) as the first argument, and copies three consecutive words from the object
  at offset 0x34 (ldmia {r1-r3}) as the remaining arguments. Finally it calls sub_80E996E, which presumably
  consumes the packed word in r4 as an extra register argument, spawning a new battle object/effect that
  visually matches the source. Quirk: r5 is never set inside the function — it relies on callers having
  already loaded the same object pointer into r5, so the object pointer is effectively passed in both
  r0 and r5.'
