name: ai_attackTelegraphFrontPanel
address: '0x08110A8E'
kind: function
status: confirmed
summary: 'AI telegraph step: counts down a per-frame timer while flashing the front panel highlight, then commits
  the attack animation on expiry.'
interface: void ai_attackTelegraphFrontPanel_8110a8e(u32 r5 /* battleObj */, u32 r7 /* attackVars */)  // r5 returned
  unchanged; r0-r3,nzcv,lr clobbered
details: 'First entry into the step (AttackElement byte == 0): loads StepTimer from AIAttackVars_Unk_36 and sets
  AttackElement = 1 to mark the step as started. Every subsequent frame: decrements StepTimer (halfword). If StepTimer
  reaches 0 the telegraph is complete — sets the object counter time to 0x10 (16 frames), switches CurAnim to 4
  (attack swing), clears flag bit 1, reloads StepTimer from SubStepIndex, sets HitElement to 0x10, and resets AttackElement
  to 0. If StepTimer is still non-zero and bit-2 of the timer is clear (every other tick), queries the battle object''s
  front-facing panel offset via object_getFrontDirection, adds it to PanelX, reads PanelY and XOR of Alliance/DirectionFlip,
  then calls highlightPanelIfSomeCondition_8109660(panel, row, 0x15, allianceFlags) to blink the target tile.'
