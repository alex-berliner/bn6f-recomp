name: battle_stepDecelSlide
address: '0x080BC30E'
kind: function
status: probable
summary: Each call advances the object's X by XVelocity, adding the signed displacement into ExtraVars+0x14
  until it reaches ±0x780000, with XVelocity reduced by YVelocity each step and clamped to a min magnitude
  of 0x10000. At the threshold, it restores 12 bytes from RelatedObject1Ptr+0x34, resets the related object's
  ExtraVars[0]=0 and ExtraVars+0xc=1, and sets CurAnim=3/CurAction=4 with phase cleared. object_setPanelsFromCoordinates
  and sub_80BC468 are always called.
interface: (object ptr in r5, no args) -> r0 clobbered; updates oBattleObject_X, XVelocity, ExtraVars+0x14,
  CurAnim, CurAction, phase, and the related object's ExtraVars
details: 'Reads the front-direction multiplier, negates it, and accumulates -dir*XVelocity into ExtraVars+0x14
  (a distance counter in 20.12 fixed point, threshold 0x780000 = 112 units). While below the threshold
  it advances X by XVelocity and applies friction: XVelocity -= YVelocity each step, clamped to a minimum
  magnitude of 0x10000 so the slide never fully stops. Once the accumulated distance reaches the threshold,
  it copies 12 bytes at offset 0x34 from the RelatedObject1Ptr into this object, writes 0 to the related
  object''s ExtraVars[0] and 1 to its ExtraVars+0xc, then sets CurAnim=3, CurAction=4 and clears the phase/phase-initialized
  halfword. Finally it recomputes PanelX/PanelY from world position (object_setPanelsFromCoordinates)
  and calls sub_80BC468 before returning.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'acc: ExtraVars+0x14 += neg(frontDir)*XVelocity, compared bge 0x780000 (distance threshold);
    X += XVelocity; XVelocity -= YVelocity, clamped to at least magnitude 0x10000 (decelerating slide);
    on completion: bl battle_copyRelatedObjectField34 then RelatedObject1Ptr->ExtraVars=0, ->ExtraVars+0xc=1;
    state transition: CurAnim=3, CurAction=4, CurPhaseAndPhaseInitialized=0; tail: bl object_setPanelsFromCoordinates;
    bl sub_80BC468'
  refs:
  - bn6f/asm/asm31.s:8978
  - 0x080BC424 battle_copyRelatedObjectField34
  - 0x0800E2CA object_getFrontDirection
  - 0x0800E2AC object_setPanelsFromCoordinates
  reproduce: python3 tools/asmcat.py 0x080BC30E
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The loop reads XVelocity (XVelocity) and decrements it by YVelocity, not friction per se. The clamping
    is on abs(vel)*sign to 0x10000 minimum magnitude. It advances X by XVelocity each step, and terminates
    when the accumulated distance (signed 20.12) reaches ±0x780000. On termination it copies 12 bytes
    from RelatedObject1Ptr offset 0x34, zeros its ExtraVars[0], sets ExtraVars+0xc=1, CurAnim=3, CurAction=4,
    clears phase. The proposal''s mechanics are correct but it misnames YVelocity as friction and calls
    the distance field a ''counter''; also sub_80BC468 is called unconditionally, not just at the end.;
    run wf investigate investigate-20261018-235109; proposed by Hyper glm-5.3-flash, revised by MiniMax-M3,
    accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
open_questions:
- which gameplay move/state triggers this slide (no callers known), so the exact term (knockback, pull/drag,
  dash) is unidentified
- what the 12 bytes at offset 0x34 of the related object contain
- what sub_80BC468 does and what anim 3 / action 4 correspond to
- what the related object's ExtraVars[0]=0 and +0xc=1 signal to it
- The loop reads XVelocity (XVelocity) and decrements it by YVelocity, not friction per se. The clamping
  is on abs(vel)*sign to 0x10000 minimum magnitude. It advances X by XVelocity each step, and terminates
  when the accumulated distance (signed 20.12) reaches ±0x780000. On termination it copies 12 bytes from
  RelatedObject1Ptr offset 0x34, zeros its ExtraVars[0], sets ExtraVars+0xc=1, CurAnim=3, CurAction=4,
  clears phase. The proposal's mechanics are correct but it misnames YVelocity as friction and calls the
  distance field a 'counter'; also sub_80BC468 is called unconditionally, not just at the end.
