name: battle_getPanelEntry_800C8C2
address: '0x0800C8C2'
kind: function
status: confirmed
summary: Returns a pointer to a panel's 8-byte entry in the battle panel array (unk_2034010) for a given panel index.
interface: 'Panel* battle_getPanelEntry(int panelIndex); // r0 in: panel index (also used as scratch), r0 out: pointer
  into panel array; clobbers r1 and flags'
details: Computes unk_2034010 + 8 * r0 and returns it in r0, i.e. a base-pointer-plus-stride accessor into the battle
  panel data structure, where each panel record is 8 bytes. It does not validate the index, so an out-of-range index
  yields an out-of-bounds pointer. The tail is a mov pc, lr return, so lr must hold a return address (no interworking/blx-style
  return). unk_2034010 is referenced from this function's literal pool and appears alongside other battle-panel-related
  pools (ePanelData, byte_203F6B0) nearby, consistent with a panel-state accessor used throughout battle code.
