name: sub_810DCCE
address: '0x0810DCCE'
kind: function
status: confirmed
summary: Lazily instantiates a type-4 auxiliary entity (param 0x10B04) for a battle object on first call, caching
  its handle at ExtraVars+8.
interface: 'void sub_810DCCE(BattleObject* r5); // r4, r5 preserved; nz/c/v/r0-r5,r7/lr updated by creator

  '
details: 'Reads the 32-bit handle cached at `BattleObject+ExtraVars+8`. If non-zero,

  it returns immediately, forwarding the handle through r0 with the

  comparison flags (eq/neq) reflecting the existing value. When the slot is

  zero, it invokes the generic entity creator `sub_80C4038` with

  (r0=0, r1=0, r2=4 /*entity type*/, r3=0, r4=0x10B04 /*param table id*/)

  and stores the returned handle back into `ExtraVars+8`. r4 is the only

  caller-saved register used, and it is preserved across the call (saved on

  the stack, restored on return).


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
