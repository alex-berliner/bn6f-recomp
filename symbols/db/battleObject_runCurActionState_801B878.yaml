open_questions:
- Exact semantic of each "CurAction" handler at sub_8018002 / sub_801813A / sub_801823C (idle/reaction/post-flinch)
  and the layout of the action table passed in r0. - Whether the 0xC800002 mask + ExtraVars+4==0 instakill
  is a generic "death check from collision" or specific to one object type.
