name: sprite_queueOamPair
address: '0x0801C9E4'
kind: function
status: probable
summary: Queues two hardcoded sprite OAM entries (one normal, one hidden/alternate-attrs) into consecutive
  OAM slots, likely a battle-screen sprite pair.
interface: () -> void; no return value, calls sprite_queueOamEntry twice
details: 'The function is a pure data-pusher: it makes two back-to-back calls to sprite_queueOamEntry
  (via the 0x802FE28 thunk that forwards r0-r3). The first call passes the 32-bit attribute word 0x8064403F
  with slot/index 0xE370 and constants r2=0, r3=6; the second passes 0x84803F with slot 0xE378, i.e. exactly
  one OAM entry (8 bytes) after the first, with identical r2/r3. The attribute words look like packed
  attr0/attr1 pairs (low half 0x403F vs 0x803F differ only in attr0 bit15, high halves 0x8064 vs 0x0084
  give the X/flip bits), so the two entries render the same tile pair with a small attribute difference.
  No locals, no state, no other side effects; it just enqueues this fixed pair.'
