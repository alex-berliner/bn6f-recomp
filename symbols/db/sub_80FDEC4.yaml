name: sub_80FDEC4
address: '0x080FDEC4'
kind: function
status: confirmed
summary: Per-BattleObject end-of-turn housekeeping that re-locates the opposing player into the object's sub-block
  at +0x60, clears one extra var, and records the object's packed panel position.
interface: void sub_80FDEC4(BattleObject* obj /* r5, with r3/r10 as pass-through context */) ; leaves r0 = obj->PanelX
  | (obj->PanelY << 4), r1 = obj->PanelY << 4, NZ from that ORR, C clear; preserves r4/r5/r6/r7
details: 'Reads the AI difficulty tier (battle_getAiDifficultyTier_800FE36, result kept live in r4 as the original
  does though dead afterwards), calls sub_80FE05C(2) (result held in r6 across the next call, also apparently dead),
  then finds the player BattleObject on the opposite alliance (battle_findPlayer(obj->Alliance ^ 1)). Calls sub_80CAC58
  with (player, 2, obj + 0x60), so the callee receives a pointer to the object''s scratch/sub-block at offset 0x60
  plus argument value 2 — likely refreshing or registering the current opposing player in the object''s AI/target
  data. Afterwards it zeroes obj->ExtraVars + 4 (second extra var) and stores obj->PanelX | (obj->PanelY << 4) into
  obj->ExtraVars + 8, a packed X/Y snapshot of the object''s current panel. The r4/r6 values are restored from the
  stack only to match the original''s liveness, not used meaningfully. The final ORR''s NZ flags and r0/r1 leftovers
  are caller-visible side effects the contract records.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
