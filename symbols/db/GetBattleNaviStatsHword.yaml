name: GetBattleNaviStatsHword
address: '0x080136E4'
kind: function
status: confirmed
summary: Reads one halfword field out of the current battle navi's NaviStats struct, with the field chosen by an
  offset in r1.
interface: u16 GetBattleNaviStatsHword(bool alliance /*r0*/, u32 statOffset /*r1*/) — returns the halfword in r0;
  r6 preserved, r1 clobbered, flags clobbered.
details: Thin accessor over the battle navi's NaviStats record. It saves r6/lr, copies the offset argument from
  r1 into r6 (so it survives the nested call, since GetBattleNaviStatsAddr clobbers r1), calls GetBattleNaviStatsAddr
  with the 'alliance' flag in r0 to obtain the base address of the appropriate NaviStats struct (normal navi vs.
  the cross/Beast-Out "alliance" variant), then does an ldrh r0,[r0,r6] to load the halfword at the given offset
  and returns it. The offset semantics come from the NaviStats field layout, so callers use fixed offsets like HP
  or attack values rather than named fields here.
