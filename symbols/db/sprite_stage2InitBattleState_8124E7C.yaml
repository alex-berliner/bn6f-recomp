interface: void sub_8124E7C(void) /* R5 = sprite struct base; flags clobbered */
details: 'Brings up the per-instance battle sprite struct at R5 during a stage-2 init phase. Calls a resets the
  class table hook-up (sub_8126818 with arg "0:") and registers a 2/1 pair via sub_811983C, then sets three bookkeeping
  fields (state byte at +0x0D = 2; copies halfwords at +0x28 -> +0x2a and +0x2c -> +0x2e) to snapshot the "source"
  state/animation values into the "shadow" fields typically used for restoration on revert. Runs a fixed bring-up
  sequence (sub_8125678 with arg "0x14", then sub_8125444, sub_8125E78, sub_8126524), then wires two halfword-pair
  slots on the sprite via sprite_setStructHalfwordPairOnThree_8117084: slot 4 carries the state pointer at +0x60
  (falling back to the halfword at +0x26 only when that state == 5), and slot 7 carries the anim pointer at +0x5c
  (falling back to +0x1c only when that anim == "0x27"). Finishes by calling sub_812674C and sub_81267A8. Preserved
  registers: r5, r6.

  '
