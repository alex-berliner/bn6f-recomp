name: battle_dispatchObjectBehaviorStep_80A9B70
address: '0x080A9B70'
kind: function
status: confirmed
summary: Dispatches a battle object's behaviour step by calling one of three handler routines selected from the
  object's state, passing the object's per-character data table entry to the handler.
interface: void battle_dispatchObjectBehaviorStep_80A9B70(Object *obj /* r5 */); tail-calls the selected handler
  (r0 = handler entry address, r7 = byte_80A9AA0 + 0x10*obj->charId); returns to this function's caller when the
  handler returns, with r0-r7 and NZCV as the handler left them
details: 'r5 points to a battle object/work structure. Field r5+4 (a character/entity id,

  u8) is multiplied by 0x10 and added to byte_80A9AA0 to give a per-character

  0x10-byte data entry, which is left in r7 for the handler. Field r5+8 (u8) is

  used directly as a byte offset (valid values 0, 4, 8) into the handler table at

  off_80A9B8C, which holds {sub_80A9B9C, sub_80A9C26, sub_80A9CA6}. The chosen

  handler pointer is loaded into r0, then "mov lr, pc / bx r0" is used as a

  tail-call: the callee starts with r0 = its own entry point (a self-reference

  the handlers presumably use for state tables or re-dispatch), and lr points

  just past the bx, so when the handler returns, control goes straight back to

  sub_80A9B70''s caller. No registers are saved or restored beyond lr; everything

  else passes through untouched, including flags (the mul/add set NZCV as a

  side effect before the call, but the handler''s exit values are what the

  caller sees). r6, r8-r12 are simply forwarded to the handler per the contract.

  '
