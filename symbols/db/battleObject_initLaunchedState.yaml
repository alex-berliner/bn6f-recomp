name: battleObject_initLaunchedState
address: '0x080DB324'
kind: function
status: probable
summary: 'Initializes a battle object''s launched-away state: sets flag bit 2, loads sprite 0xC62, applies
  directional forward/up velocity and backward position shift, sets a 16-frame timer, plays sound 0xC4,
  sets hit-effect type 0xA, clears its collision region, and transitions to CUR_STATE_UPDATE.'
interface: (r5 = battle object pointer, no args) -> r0 = clobbered; sets oObjectHeader_Flags bit 1, X/Z
  velocity and position, Timer, CurState on the object
details: Sets flag bit 0x2 in the object header, then initializes sprite 0xC62 via battleObject_initSpriteAndCollision
  with packed params 0x15050300. Reads the object's front direction (+1/-1 by alliance), sets XVelocity
  = dir*0x100000 and ZVelocity = 0x100000, shifts X backward by dir*-0x1000000 and sets Z = 0x1000000
  (one panel-unit displacement, likely fixed-point). Sets Timer to 16 (0x10), plays sound effect 0xC4,
  stores hit-effect type 0xA into the collision data, then clears the collision region so the object no
  longer participates in collision, and writes CUR_STATE_UPDATE to oBattleObject_CurState. The backward
  offset plus forward/upward drift with collision removed reads as a 'knocked/flown away' visual state
  for a battle object.
