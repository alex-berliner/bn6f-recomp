    through air'' is reasonable.; run wf investigate investigate-20261018-230610; proposed by Hyper glm-5.3-flash,
    revised by MiniMax-M3, accepted by glm-5.3-flash (tools/investigate_land.py reconcile)'
open_questions:
- No callers known, so which bomb/attack object uses this handler is unconfirmed
- Purpose of sub_80DB48A(x, y, 0xF) (panel damage? panel-state set?) and sub_80DB4CE is unknown
- Exact meaning of the 0x0F800010 panel flag mask (e.g. hole vs. grass vs. occupied) not established
- The flight-motion integration is in loc_80DB404 (X += XVelocity, Z -= ZVelocity) which is reached only
  when the timer is nonzero (bne). Good. The 0xF800010 mask check, spawn, sound, sub_80DB48A(0xF), sub_80DB4CE,
  and setCollisionRegion(1) match. However, the proposal's note 'on a hole-like panel it skips straight
  to that state without exploding' misreads loc_80DB3FA — the skip is unconditional (always sets CurAction=4
  and clears CurPhase), not gated by panel flags; only the explosion steps are skipped when tst fails.
  Also, the summary implying flight THEN explode is correct but the 'flies through air' is reasonable.
