name: battle_bombUpdate
address: '0x080DB3B4'
kind: function
status: probable
summary: 'Per-frame battle-object state: while oBattleObject_Timer > 0 it integrates flight (X += XVelocity,
  Z -= ZVelocity); when the timer expires it snaps to pixel coords, and if the panel flags word has any
  of mask 0xF800010 set it spawns a type-4 effect, plays SOUND_HIT_BOMB_1, runs sub_80DB48A(PanelX,PanelY,0xF)
  and sub_80DB4CE, then sets collision region 1 before transitioning to CurAction=4.'
interface: (r5 = battle object pointer, set by caller) -> r0 = 0 (via fallthrough of object_setCollisionRegion
  path); updates object fields
details: Called each frame with the object in r5 (typical state-handler convention). It decrements oBattleObject_Timer;
  while the timer is still counting it integrates flight motion (X += XVelocity, Z -= ZVelocity, an arcing
  hop). When the timer reaches 0 it recomputes pixel coords from panel coords, zeroes Z, and checks the
  panel status word against mask 0x0F800010; if any of those panel flags are set it spawns an effect object
  seeded with three dwords copied from object+0x34 (likely explosion visuals/params), plays the bomb-hit
  sound, calls sub_80DB48A with (PanelX, PanelY, 0xF) to affect the panel area, calls sub_80DB4CE, and
  sets collision region 1. Finally it sets CurAction=4 and clears CurPhaseAndPhaseInitialized to move
  the object to its next state; on a hole-like panel it skips straight to that state without exploding.
evidence:
