  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: revise
    — The flight-motion integration is in loc_80DB404 (X += XVelocity, Z -= ZVelocity) which is reached
    only when the timer is nonzero (bne). Good. The 0xF800010 mask check, spawn, sound, sub_80DB48A(0xF),
