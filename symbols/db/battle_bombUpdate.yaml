    object_getPanelParameters result is tst'd against dword_80DB418=0x0F800010 before spawning the explosion;
    spawn_t1_0x0_EffectObject fed {r1-r3} from object+0x34 plus SOUND_HIT_BOMB_1 PlaySoundEffect marks
    a bomb blast; tail sets oBattleObject_CurAction=4 and clears CurPhaseAndPhaseInitialized, the standard
