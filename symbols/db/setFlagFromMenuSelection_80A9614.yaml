name: setFlagFromMenuSelection_80A9614
address: '0x080A9614'
kind: function
status: confirmed
summary: Sets the event flag corresponding to the player's current menu selection, looked up from a fixed
  table of flag IDs.
interface: void sub_80A9614(void)  // r5 = work area, r10 = flag context forwarded to SetEventFlag
details: 'Reads the selection index from byte at [r5,#4] of the caller''s work area,

  doubles it to index a table of halfword flag IDs at byte_80A9648, and calls

  SetEventFlag with that flag ID (r0). r10 is not touched by this function itself

  but is part of SetEventFlag''s context on entry, so it must be preserved by

  callers. Clobbers r0, r1, r3, lr and flags; preserves r4 (pushed/popped).

  Effectively an "on-confirm, mark this option''s flag as done" helper, likely used

  by a menu/dialog choice handler where each choice maps to an event flag.

  '
