kind: function
status: confirmed
summary: Zeroes one status byte (offset 0x0D) of the fixed struct at 0x2001010 and returns.
interface: 'void sub_81418B6(void); // in: lr only; out: Z set, N clear (from "mov r0,#0"); r4-r7 preserved,
  r0 clobbered'
details: 'Tiny setter: stores 0 into the byte at eStruct2001010+0x0D (disassembly label dword_200101C+1).
  No other fields are read or written, no branches taken, and the function returns immediately. The push/pop
  of r4-r7 exists only to preserve them, so the listed register "outputs" r4/r5/r7 are just the callers''
  values passed through unchanged. The final "mov r0, #0" leaves Z=1 and N=0 for the caller as a side
  effect. Purpose of the cleared flag byte is not identifiable from this function alone; needs cross-references
  to writers/readers of 0x2001010+0x0D to name it in game terms.

  '
