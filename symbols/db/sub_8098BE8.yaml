- Why is the mail id re-read after addMail_802f238? addMail likely overwrites the cutscene command's mail id slot
  with the next id (or 0xFF) as part of its delivery bookkeeping.
- The 0x1CA0 / 0x1D20 / 0x1DA0 bases presumably index into a per-mail table of (add-entry, received-flag, done-flag);
  the surrounding context (mail array base) is not in this function.
- The wider context also contains cutscene scripts, an NPC talk-driven bedtime prompt (0x8098DDC), random-encounter
