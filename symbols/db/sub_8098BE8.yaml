name: sub_8098BE8
address: '0x08098BE8'
kind: function
status: confirmed
summary: 'Cutscene native: delivers the mail referenced by the current cutscene command and updates its received/done
  flags.'
interface: void deliverCutsceneMail(void) // r5 = cutscene command data ptr; returns r0=0, sets NZ flags
details: 'Reads the mail id from [r5+6] (0xFF = none) and, if valid, calls

  addMail_802f238 with an entry index = 0x1CA0 + mail_id. If [r5+7] != 0,

  re-reads the mail id (addMail may have rewritten the struct) and then:

  - ClearEventFlag(0x1D20 + mail_id)  // "received" flag

  - SetEventFlag  (0x1DA0 + mail_id)  // "done" flag

  Returns 0 and sets NZ flags accordingly. Lives alongside the cutscene

  script bytecode blob at 0x8098C28 and is invoked via the cutscene

  VM''s cs_call_native opcodes.

  '
