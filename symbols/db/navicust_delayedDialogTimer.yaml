name: navicust_delayedDialogTimer
address: '0x08137244'
kind: function
status: probable
summary: Counts 20 frames, then runs NaviCust dialog script 0x19 and advances the state machine to 0x4c.
interface: (r5 = state object; counter halfword at +0xe, state byte at +0x0) -> none; after 20 ticks runs
  dialog script 0x19 and sets [r5+0x0] = 0x4c
details: Each call increments the halfword counter at [r5+0xe] and returns until it reaches 0x14 (20 frames).
  On the 20th tick it invokes RunTextScriptNaviCustDialog(0x19) to display Navi Customizer text script
  19, then writes state byte 0x4c into [r5+0x0], transitioning the owning state machine to its next phase.
  It reads/writes no other fields, so r5 must be the per-instance object/state struct of whatever task
  schedules it. The script id 0x19 and target state 0x4c are fixed constants.
