name: t4_0xf_80E1520
address: '0x080E1520'
kind: function
status: confirmed
summary: State dispatcher for the snake-arm battle object — reads the object's CurState byte and tail-jumps to that
  state's handler (init, per-frame tick, or shared cleanup).
interface: void snakearm_stateDispatcher_80E1520(BattleObject *obj /* r5 */); returns whatever the selected state
  handler returns in r5 r8 r9 r10 r11 r12; clobbers flags and r0-r4/r6/r7/lr
details: "r5 points to a battle object; the byte at oBattleObject_CurState indexes a\n3-entry handler table at off_80E1534:\n\
  \  state 0 = snakearm_initObject      (first-tick setup)\n  state 1 = battleObject_snakeArmTick_80E1566 (per-frame\
  \ behaviour)\n  state 2 = sub_8016C9C              (shared cleanup/destroy stub)\nThe dispatch is done with `mov\
  \ lr, pc; bx r1`, a ARM/Thumb hybrid trick:\nlr becomes the address of the `pop {pc}` +1 bit pattern, so the handler's\n\
  own return path pops this function's saved pc and returns straight to the\noriginal caller — it is a tail call,\
  \ not a nested call. The handler\nreceives the full live register file with only r0 (state byte) and r1\n(table\
  \ entry) overwritten, so all other arguments are passed through\nuntouched. The .word table entries are +1 Thumb\
  \ pointers.\n"
