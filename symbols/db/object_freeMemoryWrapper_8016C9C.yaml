name: object_freeMemoryWrapper_8016C9C
address: '0x08016C9C'
kind: function
status: confirmed
summary: Bare tail-call wrapper that releases a battle object's memory, forwarding the object pointer
  in r5 straight to object_freeMemory.
interface: void sub_8016C9C(u32 object /* r5 */); tail-calls object_freeMemory, so r0-r3 and the nzcv
  flags on return are whatever object_freeMemory leaves; r5 is preserved through the callee
details: 'The entire body is `push {lr}; bl object_freeMemory; pop {pc}` — a call (not a branch),

  but since it is the last operation and the popped pc is the saved lr, the effect is a

  tail call to object_freeMemory with the caller''s arguments untouched. Callers pass the

  battle object pointer to release in r5, which the wrapper forwards unmodified; the

  register contract confirms r5 is preserved by the callee, and r0-r3 plus the nzcv flags

  the caller sees afterwards are exactly object_freeMemory''s outputs (r0-r3 and flags are

  clobbered/defined by the callee, not by this routine). It touches no memory or fields of

  its own; it is purely an indirection layer, likely a per-object-type "free" hook or

  destructor slot that dispatches to the generic deallocator.

  '
