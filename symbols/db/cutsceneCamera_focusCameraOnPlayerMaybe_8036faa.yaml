name: cutsceneCamera_focusCameraOnPlayerMaybe_8036faa
address: '0x08036FAA'
kind: function
status: confirmed
summary: Points the cutscene camera at the overworld player's coordinates.
interface: void cutsceneCamera_focusCameraOnPlayer_8036faa(toolkit in r10); trashes r0, r1/r2 and flags (c, v) come
  back from the callee and the flag-setting add; lr is pushed/popped and clobbered by the call
details: 'Tiny wrapper used during cutscenes: reads the game state pointer from the

  toolkit struct passed in r10 (oToolkit_GameStatePtr), loads the overworld

  player object from it (oGameState_OverworldPlayerObjectPtr), then calls

  camera_writeUnk03_14_80301b2 with r0 = 1 (a camera mode/target selector)

  and r1 = player + oOWPlayerObject_Coords, i.e. a pointer to the player''s

  coordinate field rather than the object itself. The Thumb "add r1, #imm"

  is an ADDS, so N/Z/C/V are set from player + 0x?? before the call and the

  caller may observe them; the lifter notes c and v as outputs.

  '
