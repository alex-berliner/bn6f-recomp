name: flags_clearBits_20352C4_801BEC2
address: '0x0801BEC2'
kind: function
status: confirmed
summary: Clears (turns off) the flag bits selected by the mask in r0 in the flag word at eStruct2035280+0x44.
interface: 'u32 flags_clearBits_20352C4(u32 mask) // in: r0 = bit mask; out: r1 = eStruct2035280, r2 = updated flag
  word, NZ flags set from it'
details: 'Loads the pointer eStruct2035280 (0x2035280) into r1, reads the 32-bit flag word at offset 0x44 (absolute
  0x20352C4, labeled dword_20352C4), ANDs it with the bitwise complement of r0 (bic r2, r0) so every bit set in
  the mask is cleared, and stores the result back. It then leaves the updated word in r2 and sets the NZ flags from
  it, and returns the same struct pointer in r1, so callers can chain further flag operations on the same word without
  reloading the base. No other registers or memory are touched; the function is a plain read-modify-write "clear
  these flags off" primitive with no side effects beyond the one word.

  '
