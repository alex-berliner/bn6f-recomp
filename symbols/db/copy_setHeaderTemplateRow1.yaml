name: copy_setHeaderTemplateRow1
address: '0x08095220'
kind: function
status: probable
summary: Writes the second 16-byte template row from the callee's inline table into the header buffer
  at 0x2001130, then returns 0.
interface: () -> r0 = 0; no flags meaningful (r0 reloaded before return)
details: 'A thin wrapper: it loads r0=1 and tail-delegates to copyOamEntry_80AA004, which selects row
  1 of the 16-byte-per-row table at byte_80AA01C and copies it into the global buffer at byte_2001130;
  the callee clears r0, and this function then reloads r0=0 before returning, so the visible result is
  a constant status/zero return. No other state is touched and no branches are taken. Since the buffer
  is described as a chip/PET header buffer, this presumably installs one fixed predefined header/template
  value. Which game feature owns 0x2001130 and why row 1 specifically is unknown without callers.'
