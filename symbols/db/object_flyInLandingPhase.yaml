name: object_flyInLandingPhase
address: '0x080E00B0'
kind: function
status: probable
summary: Battle-object phase that flies the object in sideways while descending, then lands on its panel
  and picks the next action from a panel check.
interface: (r0 = phase id/ignored, r5 = battle object) -> r0 = 0; advances object to phase 0 and sets
  CurAction 4 or 8
details: On first invocation (oBattleObject_PhaseInitialized clear) it sets oBattleObject_XVelocity =
  getFrontDirection() * 0x40000, oBattleObject_ZVelocity = 0xfff80000, and Timer = 0x14, marking itself
  initialized. Each later call decrements Timer and adds the velocities to X and Z while Timer > 0. When
  the timer expires it forces Z = 0, sets collision region 1 via object_setCollisionRegion, stores PanelX/PanelY
  into ExtraVars+8/+0xC and zeroes ExtraVars+0x18/+0x1C. It calls sub_80E02AC(PanelX, PanelY); a nonzero
  result sets CurAction = 8, otherwise 4, and it finally writes 0 to CurPhaseAndPhaseInitialized to hand
  control to phase 0. The 4-vs-8 choice most likely reflects the destination panel's state (e.g. broken/hole
  vs normal) as judged by sub_80E02AC.
