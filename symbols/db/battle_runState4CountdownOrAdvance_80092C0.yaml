name: battle_runState4CountdownOrAdvance_80092C0
address: '0x080092C0'
kind: function
status: confirmed
summary: Runs a short 10-frame countdown in battle state 4 on the battle state object and, when it finishes (or
  if nothing was pending), advances the battle flow to state 8.
interface: void battle_runState4CountdownOrAdvance_80092C0(oBattleState *state /* r5 */); // lr clobbered (tail
  pop {pc}); returns r0 = last value written (remaining timer / 4 / 0), r1 = pending flag read on the idle path,
  NZ from that value, C/V residue of the timer subs
details: "Per-frame battle-flow step operating on the battle state object passed in r5:\n- If the state byte at\
  \ +0x03 is nonzero (state 4 already running), decrement the\n  16-bit frame timer at +0x28 and store it back;\
  \ while it is still >= 0 just return.\n  Once it goes negative, write the halfword at +0x02 to 4 — this sets the\
  \ sub-state\n  field to 4 and, because the state byte at +0x03 is the upper half of that halfword,\n  simultaneously\
  \ clears the state byte, leaving the object idle.\n- If the state byte is 0 (idle) and the pending flag byte at\
  \ +0x1a is set, load the\n  timer at +0x28 with 10 and set the state byte at +0x03 to 4, starting the countdown.\n\
  - If the state byte is 0 and the pending flag is clear, write 8 to the state index\n  byte at +0x01 (jumping the\
  \ battle flow to state 8) and clear the +0x02 halfword\n  (sub-state 0, state byte 0).\nThe countdown of 10 with\
  \ a pending flag suggests a short scripted wait (e.g. a pause\nbefore/after a battle event) rather than a visual\
  \ effect; exact in-game meaning of\nstate 4 is not independently confirmed.\n"
