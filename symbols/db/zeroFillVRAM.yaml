name: zeroFillVRAM
address: '0x080017AA'
kind: function
status: confirmed
summary: Clears all of VRAM (0x6000000-0x600DFFF) with four zero-fill calls, used during video reset/startup.
interface: void zeroFillVRAM(void); // r2/r3 preserved; returns with r0=0x600C000, r1=0x20 (tail state of last helper
  call)
details: 'Calls ZeroFillByEightWords four times to zero the whole 96 KB VRAM region in 16 KB chunks:

  0x6000000 (0x40 eight-word units), 0x6004000 (0x40), 0x6008000 (0x40), and 0x600C000 (0x20,

  covering only up to 0x600DFFF since the top 16 KB of the A/B bank is object/tile memory that

  need not be cleared). r1 sizes are in units of 32 bytes (eight words). The three 0x40-unit

  chunks correspond to the BG/screen memory used by BG modes; the 0x20-unit tail covers the

  remaining standard VRAM. No flags or other state are touched beyond the fill calls; r2/r3 are

  merely passed through and preserved. Quirk: the function "returns" with r0=0x600C000 and

  r1=0x20 left over from the last helper call, which the register contract reflects.

  '
