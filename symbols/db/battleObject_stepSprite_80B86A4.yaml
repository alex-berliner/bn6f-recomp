name: battleObject_stepSprite_80B86A4
address: '0x080B86A4'
kind: function
status: confirmed
summary: Advances a battle object's sprite one step, syncing its position with the object it follows and forcing
  action 4 (interrupt) when the battle state's bit 1 is set.
interface: void battleObject_stepSprite_80B86A4(BattleObject* obj /* r5; r10 = battle state read by callee */);
  obj passed through and possibly updated in r5; clobbers r0-r3, lr, flags
details: 'Entry point of the per-frame sprite update for a battle object. Calls battleObject_copyCoordsFromRelatedObject_80B8800
  to sync the object''s coordinates with whatever related object it tracks, then battleObject_clampCurAnim_80B8810
  to keep its current animation index in range. Reads the battle state word via battle_getStateUnk5c_800139A (which
  uses r10 as the battle state pointer) and performs "lsr r0, #2" so the carry flag carries out bit 1 of that state
  word. When that bit is set, the object''s current action is interrupted: oBattleObject_CurAction is forced to
  4 and oBattleObject_CurPhaseAndPhaseInitialized is zeroed (new phase, phase not initialized), after which the
  inner stepper battleObject_stepSprite_80B86C4 runs on the object and its (possibly updated) pointer is returned
  in r5. r4 and r5 are preserved throughout; the tail call into the inner stepper is only made on the interrupt
  path — the ordinary per-frame sprite stepping proper lives in the 80B86C4 callee.

  '
