name: ClearPETMenuDataFlag
address: '0x0811EBF4'
kind: function
status: confirmed
summary: Clears specified bit(s) in the PET menu data flags byte and returns the previous value.
interface: void ClearPETMenuDataFlag(u32 flagMask /* r0 */) -> out r1 = old flags byte, r2 = ePETMenuData pointer;
  clobbers NZ flags
details: 'Loads the PET menu data struct pointer (ePETMenuData) and reads byte at offset 5, which the disassembly
  maps to the eFlags200DF25 flags field. Clears the bits set in r0 using BIC and stores the result back to offset
  5. Side-effect "outputs" from the caller contract: r1 holds the old flags byte (pre-clear value loaded into a
  register that BIC consumes, then the result overwrites it — callers apparently rely on r2 = ePETMenuData and may
  read r1 afterwards). Trivial thumb routine, tail-jumps back via mov pc, lr with 2 padding bytes.

  '
