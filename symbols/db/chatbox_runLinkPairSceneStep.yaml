name: chatbox_runLinkPairSceneStep
address: '0x0812AAC0'
kind: function
status: probable
summary: Per-frame chatbox-driven scene step that polls chatbox flags, runs scenario text scripts based
  on flag/state, then compares two 0x10-byte entries against eLinkState fields (+0x1c, +0xa) to dispatch
  menu/script actions and update state bytes.
interface: (r0 = unused (0 written), r5 = scene state record) -> r0 = preserved-ish; writes state byte
  [r5+0x10], sub-state [r5+0x11], halfword [r5+0x26], bytes [r5+1..3]; runs chatbox scripts
details: 'r5 is a state-machine record (state at +0x10, byte at +0x11, halfword 4/8/0x10 at +0x26, bytes
  +1..+3). It first polls chatbox/cutscene flags at eFlags2009F38 (bits 0x80, 0x10, 0x20) and, when the
  chatbox is in state 0, runs text script 0x23 from eTextScript2 and clears +0x11, storing 4 or 8 into
  [r5+0x26]. It then gets the eLinkState global via sub_803E8F8 and a 2-entry array (0x10-byte stride)
  from sub_81323B0, requiring each entry''s word at +4 to equal eLinkState+0x1c and counting halfword
  matches of [+2] vs eLinkState+0xa by shifting r3=8 right per match: both match -> sub_8132430 decides
  (<=2: bytes 0x38/0 and state 4, script 0x2a if ==2; else state 3/4 with scripts 0x29/0x2a based on [r5+0x26]==8;
  ==4: menu_dispatchStateHandler, result stored to [r5+1], SetScreenFade(0xc,0x10) if >=0x28), exactly
  one match -> state 2 and script 0x25, otherwise exit silently. Every path ends by tail-calling battle_stepWaitForStateRunUpdate,
  so this runs once per frame while a state transition waits.'
