name: mapTiles_ResetDimensionsToDefault_80303E8
address: '0x080303E8'
kind: function
status: confirmed
summary: Resets the map tile grid dimensions to the default 32x32.
interface: void sub_80303E8(void)
details: Stores 0x20 (32) into the MapWidth byte at offset 0 of the map-tiles state struct pointed to by eMapTilesState200be70,
  and stores 0x20 again into the next byte (byte_200BE71), which is MapHeight. So both map width and height are
  set to 32 tiles, the game's default map grid size. No other fields are touched; it returns immediately to the
  caller.
