name: table_GetByte16Row_203EAE0_800AB3A
address: '0x0800AB3A'
kind: function
status: confirmed
summary: Reads one byte out of a 16-bytes-per-row table at byte_203EAE0, given a row and column index.
interface: u8 table_GetByte16Row_203EAE0(u32 row /*r0*/, u32 column /*r1*/); also returns the byte's table address
  in r3
details: Computes byte_203EAE0 + row*0x10 (16 bytes per row), loads the byte at the given column offset within that
  row with LDRB, and returns it in r0. Unusually for a plain getter it also passes the resolved address of the byte
  back in r3, which suggests callers may use the address itself (e.g. to write back or to hand to another routine);
  the register contract confirms r3 is an output read by callers. r1 is not bounds-checked, so column values >=0x10
  read into the next row. No flags are meaningfully set; NZCV are just incidentally clobbered by the mul/address
  arithmetic. The table lives in EWRAM (0x0203xxxx), so its contents are runtime-populated; the game-side meaning
  of the rows/columns is not visible from this function alone.
