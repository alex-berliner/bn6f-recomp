name: object_destroyClearRelatedIfParamLow
address: '0x080CB4C0'
kind: function
status: probable
summary: Destructor-style battle-object routine that unlinks a related object's header, then destroys
  the object itself.
interface: (r5 = battle object) -> r0 = destroyed; calls object_genericDestroy
details: Reads the object's Param1 byte; if it is less than 3, it loads the RelatedObject1 pointer and
  writes 0 to that object's ObjectHeader field, clearing whatever link/reference the two objects share
  (a header of 0 typically means 'no object'). It then falls through to object_genericDestroy, which frees
  panel tile reserves, collision data, and the object's memory. If Param1 is 3 or greater, the related
  object is left untouched and the object is simply destroyed. Param1 is likely a variant/faction/owner
  kind that controls whether the partner object should also be released.
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: ldrb r0,[r5,#oBattleObject_Param1]; cmp r0,#3; bge skip — only clears the link for kinds below
    3; ldr r3,[r5,#oBattleObject_RelatedObject1Ptr]; str 0 into [r3,#oBattleObject_ObjectHeader] — nulls
    the partner's object header, unlinking it; falls into bl object_genericDestroy — this is a destruction
    path, i.e. a destructor or destroy handler
  refs:
  - bn6f/asm/asm31.s:42428
  - 0x08016C8A object_genericDestroy
