name: battle_aiAttackStepDispatch_80FEE14
address: '0x080FEE14'
kind: function
status: confirmed
summary: Tail-calls the current AI attack-phase handler selected by the attacker's HitElement field via
  a 7-entry jump table.
interface: void battle_aiAttackStepDispatch_80FEE14(void *r7 /* AIAttackVars */); /* r5, lr in; r1, r5,
  r8-r12 out */
details: 'r7 points to the attacker''s AIAttackVars structure. The byte at offset oAIAttackVars_HitElement
  indexes the jump table at off_80FEE28 (7 entries, addressed by raw byte offset, no scaling). Each entry
  is a Thumb handler address for a distinct attack-step phase: 0 = aiAttackStepChooseMovePanel (panel
  selection), 1 = battleObject_throwArcingMoveUpdate (projectile arc update), 2 = battle_resetAIAttackStepState
  (reset), 3/4 = unknown sub-steps, 5 = battle_aiAttackWindupTick (windup countdown), 6 = ai_attackStepWaitCurAnim0
  (animation wait). The selected handler is tail-called via bx after moving lr to pc; the handler''s live-out
  registers (r1, r5, r8–r12) pass straight through to this function''s caller. r0 retains the HitElement
  value and r1 the handler code address at the moment of the branch.'
