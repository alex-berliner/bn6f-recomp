name: battle_aiLoadAttackDamage
address: '0x080F4B74'
kind: function
status: probable
summary: Loads an AI attack's damage-related word from two version-dependent AI parameter tables and stores
  it in the battle object's AI attack vars.
interface: (r0 = attack/index into AI tables, r5 = battle object, caller-set) -> r0 = combined value;
  stores word at battle->aiData+0xA0 (oAIAttackVars_Damage)
details: 'Indexes two AI parameter tables (byte_80F4BD4 and byte_80F4BF8) with stride 8 via battle_aiGetVersionedTableEntry_800FE12,
  so the value fetched depends on the battle object''s AI version. The first table''s entry gives the
  low halfword, the second''s entry the high halfword (lsl #0x10, orr), and the combined word is written
  to [AIDataPtr+0xA0], the oAIAttackVars_Damage field. Quirk: r5 (battle object pointer) is never set
  up inside this function — it is read directly, so callers must have r5 already pointing at the battle
  object. The three callers are tiny nearby wrappers that presumably fix up r0/r5 before calling.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: two battle_aiGetVersionedTableEntry_800FE12 calls with stride-8 tables byte_80F4BD4/byte_80F4BF8
    indexed by r0; lsl r0,#0x10 ; orr r6 packs the two entries into one 32-bit value; str r6,[r3,#oAIAttackVars_Damage]
    after ldr r3,[r5,#oBattleObject_AIDataPtr]; add r3,#0xa0; r5 is used without being saved or set, so
    it must be caller-provided; three callers at 0x080F4AC6/0x080F4AFE/0x080F4B34 are adjacent stubs in
    the same AI-code blob
