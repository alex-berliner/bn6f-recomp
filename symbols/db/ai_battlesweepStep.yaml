name: ai_battlesweepStep
address: '0x08103380'
kind: function
status: probable
summary: One tick of an AI attack that periodically commits the object's move to its future panel (step
  forward) while animating and setting a hit element.
interface: (r5 = battle object, r7 = oAIAttackVars of this attack state) -> void; no return value
details: On each call, decrements oAIAttackVars_StepTimer at r7 and returns early until it reaches 0.
  When it expires, sets the object's current animation to 3, copies FuturePanelX/FuturePanelY into PanelX/PanelY,
  then calls object_removePanelReserve (releasing the panel held for the move), object_setCoordinatesFromPanels
  (snap pixel position to the new panel), and object_updateCollisionPanels (sync collision/facing). It
  then reloads the step timer with 3 so the next step occurs three frames later, and sets oAIAttackVars_HitElement
  to 8. This is the per-step update of a multi-tick movement attack; the route context labels it 'battlesweep'.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrh r0,[r7,#StepTimer]; sub/strh; bgt exit — per-tick countdown gate; strb FuturePanelX/Y
    -> PanelX/Y just before object_removePanelReserve — commits the reserved move; bl object_setCoordinatesFromPanels
    + object_updateCollisionPanels — pixel position and collision sync after the step; strh #3 -> StepTimer
    and strh #8 -> HitElement after the move — periodic step with a fixed hit element; strb #3 -> [r5,#oBattleObject_CurAnim]
    — plays a movement animation on the step frame'
