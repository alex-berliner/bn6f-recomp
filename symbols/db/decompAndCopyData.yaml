name: decompAndCopyData
address: '0x08000B30'
kind: function
status: probable
summary: Table-driven ROM data loader that iterates 12-byte entries, LZ77-decompressing or plain-copying game asset
  data into RAM until a null terminator.
interface: void decompAndCopyData(u32 r0_table_ptr); // reads r2-r7 from caller; returns r1,r2,r3 clobbered by callees,
  r4-r7 preserved, flags from final test
details: 'Walks a caller-supplied table of 12-byte entries (r0, advanced by 12 each loop) until field[0]==0. Each
  entry is a triplet [src/compressed-flag, dest-or-null, size-or-decomp-buf]. Bit 31 of field[0] marks an LZ77-compressed
  source; the remaining 31 bits are the real pointer. For compressed entries, SWI 0 (LZ77UnCompReadNormalWrite8bit)
  decompresses into the buffer at field[2]; the 4-byte LZ77 header is parsed (size = header>>8 minus 4) and the
  post-header body is copied to field[1] if non-null, otherwise the copy is skipped. For plain entries, field[1]
  is the destination and field[2] is the byte count. Both paths dispatch through an alignment-aware copy: odd size→CopyBytes,
  bit-1→CopyHalfwords, bits 2-4→CopyWords, else→CopyByEightWords. r2-r7 are read from the caller''s register state
  and forwarded into the copy helpers; they are part of the input contract. Quirk: after the LZ77 SWI, field[1]
  is reloaded (overwriting whatever the SWI left in r1) before the null-dest skip check, so the caller-visible r1
  on the skip path equals the dest field.'
