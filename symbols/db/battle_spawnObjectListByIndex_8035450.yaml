name: battle_spawnObjectListByIndex_8035450
address: '0x08035450'
kind: function
status: confirmed
summary: Spawns a predefined object list during battle setup, selecting the descriptor by index from a fixed pointer
  table and forwarding the caller's r5 argument to the spawner.
interface: void sub_8035450(u32 list_index /*r0*/, u32 spawn_arg /*r5*/) — returns r0 = 0; r2, r3, r8-r12 and flags
  nzcv are whatever SpawnObjectsFromList leaves behind; r4-r7 preserved
details: 'Thin dispatcher over SpawnObjectsFromList. It reads a word from the pointer table at off_8035464 at offset
  list_index*4 (r0 is shifted left by 2, so r0 is an entry index, not a byte offset), passes the fetched descriptor
  pointer in r0 and the caller''s r5 through unchanged as the spawner''s argument, and tails into it via bl. After
  the call returns it sets r0 = 0 and returns, so the function''s own return value is always 0 (success/no-error
  style). All other register state visible to the caller (r1-r3, r8-r12, c/v) is simply whatever SpawnObjectsFromList
  left, since this function only touches r0-r1. r4-r7 are saved/restored, so r5 genuinely passes through intact.
  The table at off_8035464 presumably holds SpawnObjectsFromList descriptors for the different battle object layouts
  (one entry per list_index); the meaning of each index and of the r5 argument depends on the callers and the spawner.

  '
