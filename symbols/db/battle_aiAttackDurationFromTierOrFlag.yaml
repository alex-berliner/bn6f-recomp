name: battle_aiAttackDurationFromTierOrFlag
address: '0x080FAF7C'
kind: function
status: probable
summary: Reads a duration value indexed by sub_800FE28 (tier?), then adds 0x3c if the object's flags have
  bit 0xA000 set.
interface: () -> r0 = int (duration)
details: Passes dword_80FAF9C (0x18181E1E) to sub_800FE28 and treats its return as a base pointer/offset.
  Then calls object_getFlag on the implied current battle object and, if the returned flag word has bits
  0x8000 | 0x2000 set, adds 0x3c to the base. Returns the resulting value, which the caller stores into
  oAIAttackVars_AttackDuration. Likely a tier-keyed lookup with a 'fast/extra' branch on a hidden/near
  flag.
