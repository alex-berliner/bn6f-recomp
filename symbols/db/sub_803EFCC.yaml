name: sub_803EFCC
address: '0x0803EFCC'
kind: function
status: confirmed
summary: Zeros four battle scratch/working buffers (0x20, 0x40, and two 0x200-byte blocks) via ZeroFillByWord.
interface: void battle_clearScratchBuffers_803EFCC(void) /* no inputs; preserves r2, r3, C, V; clobbers r0, r1,
  N, Z */
details: 'Called with no arguments (lr-only). It clears four EWRAM scratch regions used by the battle subsystem:
  byte_200AC20 (0x20 bytes), unk_2009AC0 (0x40 bytes), byte_200BC70 (0x200 bytes), and word_200A010 (0x200 bytes).
  Each is zeroed by calling the standard ZeroFillByWord helper with a pointer in r0 and a size in r1. Implemented
  as push {lr} / pop {pc} so no stack frame is reserved. Because ZeroFillByWord leaves r2/r3 and C/V untouched,
  the last zeroing call is the last flag-affecting one, leaving c/v/r2/r3 preserved for callers as the register
  contract advertises.

  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
