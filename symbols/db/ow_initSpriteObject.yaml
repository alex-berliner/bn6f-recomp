name: ow_initSpriteObject
address: '0x080A9D30'
kind: function
status: confirmed
summary: 'Initializes a single overworld NPC/sprite object: marks it active, resolves its cutscene-adjusted position,
  loads tile graphics and animation, disables shadow, applies map-layer draw priority, sets movement mode 4, and
  runs the first per-frame update.'
interface: void ow_initSpriteObject(void) /* r5 = pointer to ow_sprite_object; clobbers r0,r1,lr,flags; preserves
  r4-r8 */
details: 'Expects r5 to hold a pointer to an overworld sprite-object struct. (1) Sets the active flag at +0x00 to
  1. (2) Calls ow_applyCutsceneDirOffset to retrieve (r1,r2,r3) = adjusted x, y, facing for the current cutscene
  context. (3) Writes those three values to both the "current position" block (+0xC..+0x14) and the "previous position"
  block (+0x30..+0x38), so the object has no movement delta on its first frame. (4) Calls sprite_load(0x80, 0x1C,
  0x9E) to load graphics: tileset/ID 0x80 with sheet dimensions 0x1C × 0x9E. (5) Sets animation 0, loads animation
  frame data, and disables shadow rendering. (6) Calls applyLayerEffectToOWObject_8035694 on the position block
  (+0xC) to resolve map-layer parallax/scroll offset. (7) Calls sprite_setPriority_8002E14 to assign draw priority
  from the resolved layer. (8) Zeroes the two 16-bit animation counters at +0x24, +0x26, then writes fixed-point
  timing constants 0x2AAAA to +0x28 and 0x16C1 to +0x2C. (9) Sets movement/behavior mode to 4 at +0x08 and clears
  the sub-state byte at +0x09. (10) Calls ow_spriteObjectUpdate once to advance the object''s first tick.

  '
