name: ow_initSpriteObject
address: '0x080A9D30'
kind: function
status: probable
summary: 'Initializes an overworld object: records its position, attaches sprite resource 0x80/0x1c/0x9e
  with animation 0 and no shadow, and sets up its render/state fields.'
interface: () -> void; operates on the global object pointer held in r5 (sprite_* callees are argument-less)
details: 'Stores 1 at byte 0 of the object, then calls sub_809C890 whose r1-r3 results (likely the object''s
  position/coords) are saved twice: to fields 0x0c/0x10/0x14 and duplicated to 0x30/0x34/0x38 (current
  vs. previous position). Loads sprite (0x80, 0x1c, 0x9e) via sprite_load, sets animation 0, loads animation
  data, disables the shadow, applies the layer-effect/priority logic via applyLayerEffectToOWObject_8035694
  and sprite_setPriority. Clears halfwords 0x24/0x26, writes constants 0x2aaaa to 0x28 and 0x16c1 to 0x2c
  (likely timing/counter config), sets byte 8 = 4 and byte 9 = 0 (state/type tags), and finishes by calling
  sub_80A9D86. This is a spawn/initializer for one specific OW object; which one depends on the sprite
  resource IDs, not shown by any known caller.'
