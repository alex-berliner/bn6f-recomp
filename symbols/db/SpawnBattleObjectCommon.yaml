name: SpawnBattleObjectCommon
address: '0x08003278'
kind: function
status: confirmed
summary: Allocates a battle object from the per-type pool, initializes its header from a caller-supplied stack record,
  and returns the object pointer or NULL if the pool is full.
interface: /* SpawnBattleObjectCommon(u8 obj_type /*r0*/, *const u32 init_record /*r1*/) -> BattleObject* /*r5*/;
  also returns init fields in r0-r4; NZ clobbered */
details: 'Masks obj_type to 4 bits (0-15) to index a 16-byte-wide descriptor table at dword_80032D0.

  Each descriptor holds: active-bitfield pointer, linked-list base, pool-end address, stride (full object size),
  user-data size, and a default sub-type byte.

  Scans the 32-bit active bitfield from bit 31 downward looking for an inactive slot.

  If the pool is exhausted the slot search wraps and r5 is set to 0 (NULL) and the function returns immediately
  without copying init data.

  On success: marks the bit active, advances past the 16-byte linked-list header to the object body,

  zero-fills the user-data region via ZeroFillByWord (skipping the first word, the linked-list next/prev pointer),

  writes the descriptor''s default sub-type byte at object offset 0,

  then ldmia''s 5 words from the caller''s stack pointer (r1) into the object: index (byte at oBattleObject_Index),
  X, Y, Z, Params.

  Visible pool types in the table: T1 (32 objects, subtype 0x19), T3 (subtype 0x09), T4 (subtype 0x19); type 0 and
  type 2 rows are zeroed out.

  '
