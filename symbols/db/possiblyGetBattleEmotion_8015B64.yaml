name: possiblyGetBattleEmotion_8015B64
address: '0x08015B64'
kind: function
status: confirmed
summary: Picks the player's current battle emotion (face/sprite state) from AI anger/chip flags and the navi's mood,
  returning it alongside transformation, mood and Beast Out counter from NaviStats.
interface: 'u32 battle_getPlayerEmotion(u32 alliance /*r0: false=player side?*/); -> r0 = emotion (0..5), r1 = NaviStats.Transformation,
  r2 = NaviStats.Mood, r3 = NaviStats.BeastOutCounter, C = set unless emotion 0 or early-out on AIData.Unk_36, V
  = clear; r4-r6 preserved'
details: 'Looks up the navi''s NaviStats (GetBattleNaviStatsAddr) and the player BattleObject (battle_findPlayer)
  for the requested side, then reads the AI data pointer (oBattleObject_AIDataPtr). Emotion selection priority:
  AIData.Unk_36 != 0 -> 5; Mood == 0 -> 5 (normal, overrides everything else); AIData.Anger != 0 -> 3; AIData.Unk_32
  != 0 -> 1; Mood == 0xFF -> 2; otherwise 0. Also loads NaviStats.Transformation, NaviStats.Mood and NaviStats.BeastOutCounter
  into r1-r3 for the caller, which presumably uses them to pick the portrait/emotion frame (e.g. Beast Out or emotion
  window in battle). Quirk: the carry flag out is a side effect of the CMP/TST chain — C is clear only when the
  decision falls through to emotion 0 (mood < 0xFF) or when the Unk_36 test branches away before any CMP ran; callers
  may or may not consume it.'
