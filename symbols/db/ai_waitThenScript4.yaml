name: ai_waitThenScript4
address: '0x0810BCA0'
kind: function
status: confirmed
summary: AI state handler that waits a per-version delay, then switches the AI to script 4.
interface: int ai_waitThenScript4(ai_data *r4, ai_state *r6) -> int r1 (delay threshold); clobbers r0, r2 and flags
details: 'Increment-and-check wait handler for an enemy AI state. Increments the 16-bit timer at

  r6+oAIState_Timer each call, then indexes byte_810BBD8 with the version byte at

  r4+oAIData_Version_16 to get this AI''s delay threshold. When the incremented timer reaches

  the threshold (cmp/blt, so fires when timer >= threshold), resets the timer to 0 and stores

  script id 4 into r6+oAIState_ScriptId. Returns the threshold in r1 unconditionally — the

  table load is the last write to r1 and callers see it whether or not the script fired.

  '
