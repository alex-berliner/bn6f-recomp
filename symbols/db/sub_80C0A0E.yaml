name: sub_80C0A0E
address: '0x080C0A0E'
kind: function
status: confirmed
summary: Phase handler that spawns effect 0x26 at the object's position, waits 5 frames, then advances the object
  to action 8 and clears the phase state.
interface: "void sub_80C0A0E(struct BattleObject *r5);  // returns void\n  // inputs:  r5 = battle object; lr =\
  \ return address\n  // outputs: r5 unchanged (preserved)\n  // clobbers: r0-r4, lr, flags (NZCV)\n  // preserves:\
  \ r5, r6, r7\n"
details: "Battle-object phase step. On first entry (PhaseInitialized == 0):\n  - Sets oBattleObject_Timer to 5.\n\
  \  - Lifts the Z word at +0x3C by +0x140000 (treated by the spawner as a\n    depth/layer tag) and gathers X (+0x34),\
  \ Y (+0x38), Z (+0x3C) for\n    spawn_t1_0x0_EffectObject, passing effect id 0x26 (r4).\n  - Sets oObjectHeader_Flags\
  \ bit 0x2 (object-visible / drawn flag).\n  - Sets PhaseInitialized = 4 so this block does not re-run.\nOn subsequent\
  \ frames: decrements oBattleObject_Timer; once it reaches\nzero, sets CurAction = 8 and clears CurPhaseAndPhaseInitialized,\
  \ kicking\nthe object to action 8 and resetting the phase bookkeeping.\n\nRegister form, old prompt; queued for\
  \ retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
