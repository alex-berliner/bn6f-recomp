name: reqBBS_initMemory_813F9DA
address: '0x0813F9DA'
kind: function
status: confirmed
summary: Resets the BBS (bulletin board) request state, filling the request entry list with free-slot markers and
  clearing the sent-requests counter.
interface: 'void reqBBS_initMemory_813F9DA(void); // out: r2 = 0x80 (side effect of ByteFill''s argument surviving),
  clobbers r0 r1 lr and flags'
details: 'Fills the 0x80-byte reqBBS_requestEntriesList buffer with the byte 0x80 via ByteFill, which likely marks
  every entry slot as free/empty. Then zeroes two 4-byte words: reqBBS_numRequestsSent (a counter of how many board
  requests the player has sent) and unk_2000770 (purpose unknown, another piece of BBS state). Quirk: the fill value
  0x80 is left in r2 when the function returns because ByteFill does not clobber r2 and the second and third calls
  only touch r0/r1, so callers effectively receive r2 = 0x80 even though no output is intended.

  '
