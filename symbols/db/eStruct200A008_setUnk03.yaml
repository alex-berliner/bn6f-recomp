name: eStruct200A008_setUnk03
address: '0x0800B6E6'
kind: function
status: confirmed
summary: Writes a one-byte value into field +3 of the overworld player object's trailing struct (200A008).
interface: void eStruct200A008_setUnk03(u8 value) // in r0 = byte to store; out r1 = struct base (0x200A008); no
  flags read
details: 'Tiny setter that stores the low byte of r0 to the byte just past the end of the overworld player object
  (eOWPlayerObjectEnd), i.e. byte_200A00B, which is offset +3 of the struct based at 0x200A008. As a side effect
  of how the pointer is loaded, r1 is left holding the struct base address 0x200A008 on return; callers presumably
  ignore it. No other registers or flags are touched. The field''s actual game meaning is not yet known, so it keeps
  the "unk03" placeholder name.

  '
