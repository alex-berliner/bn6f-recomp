name: chatbox_mask_eFlags2009F38
address: '0x08045F3C'
kind: function
status: confirmed
summary: Reads the current state of one or more bits of the chatbox/cutscene event flag word (eFlags2009F38) and
  returns it with NZ set so callers can branch on the result.
interface: 'int chatbox_testFlags(int flagBits) // r0 in: bit mask; r0 out: flagBits & eFlags2009F38; NZ from result;
  r1 preserved'
details: Tiny leaf helper. Pushes r1 to preserve it, loads the pointer eFlags2009F38 (the event/chatbox flag word
  used during dialogues and cutscenes), reads the word, ANDs the caller's mask in r0 against it, restores r1, and
  returns via mov pc, lr. The AND naturally sets the NZ flags, so callers can use conditional branches directly
  on the returned bits without a separate TST. No other state is touched. Useful both to test a single flag (mask
  = bit) and to fetch several flag bits at once.
