name: ai_attackStepWindupFire
address: '0x080F6B94'
kind: function
status: probable
summary: 'Per-frame AI attack state: on entry picks element 4 and a 30-frame wait, then when the timer
  runs out performs the attack and returns to the normal state.'
interface: (r7 = object whose oAIAttackVars_* fields hold AttackElement/StepTimer) -> r0 = clobbered;
  sets AttackElement=4 and StepTimer=30 on first run, decrements StepTimer each later frame
details: First frame, when oAIAttackVars_AttackElement is 0, it writes element 4 and a 30-frame StepTimer,
  i.e. it initializes a delayed attack. On subsequent frames it decrements StepTimer each call until it
  reaches 0, then calls sub_80F73FA (presumably the attack execution, not yet analyzed) and object_exitAttackState
  to leave the attack routine. This is a standard AI 'wind-up then fire' step for one enemy attack, with
  element id 4 hard-coded.
