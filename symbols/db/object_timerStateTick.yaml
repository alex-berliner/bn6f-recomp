name: object_timerStateTick
address: '0x080A9DC0'
kind: function
status: confirmed
summary: Per-frame tick for an object in a timed waiting state; after a 30-frame wait it switches to animation 1,
  drops its shadow, plays SFX 0x123 and moves to state 4.
interface: void object_waitThenActivateTick(Object *obj /* r5 */)  // preserved in r5; r10 passes through unless
  PlaySoundEffect runs
details: "State-machine tick for a field/battle object whose pointer lives in r5. It increments the frame counter\
  \ halfword at obj+0x24 every call. Two checkpoints during the wait: - at count 5 it writes sub-state 3 into the\
  \ byte at obj+0x00 and keeps waiting (a short\n  mid-phase beat, likely a pose/anticipation frame);\n- at count\
  \ 30 the wait ends: the counter is reset to 0, the sprite is set to animation 1\n  (sprite_setAnimation(1) followed\
  \ by sprite_loadAnimationData and sprite_noShadow, so the\n  object loses its ground shadow), and unless the suppress\
  \ flag byte at obj+0x04 is nonzero,\n  sound effect 0x123 (0x24+0xff packed immediate = 0x123) is played via PlaySoundEffect.\n\
  Finally it writes state 4 into the byte at obj+0x09, handing control to the next phase of the object's state machine.\
  \ Byte obj+0x00 holds a sub-state, obj+0x09 the main state, obj+0x04 a flag (used here only to mute the SFX),\
  \ obj+0x24 a u16 frame timer. r5 is preserved; r10 is returned unchanged except when PlaySoundEffect runs, in\
  \ which case the value PlaySoundEffect leaves in r10 becomes the output. r2 passed to PlaySoundEffect is whatever\
  \ sprite_loadAnimationData happened to leave there (uninitialized carry-through).\n"
