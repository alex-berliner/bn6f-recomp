name: object_timerStateTick
address: '0x080A9DC0'
kind: function
status: probable
summary: 'Per-frame update for a battle object: counts frames in field 0x24 and on thresholds changes
  state, animation, shadow and plays an SFX.'
interface: (r5 = object base, no args) -> void; fields [r5+0x24] counter, [r5+0] state, [r5+4] flag, [r5+9]
  value written
details: Increments the halfword counter at object+0x24 each call. When the counter reaches 5 it writes
  state 3 to byte object+0x00 and returns. When it exceeds 0x1E (30) it resets the counter to 0, calls
  sprite_setAnimation(1) + sprite_loadAnimationData to switch the object to animation 1, calls sprite_noShadow,
  then — unless byte object+0x04 is nonzero — plays sound effect 0x123, and finally stores 4 into byte
  object+0x09. r5 is preset by the caller, so the function is a zero-argument object tick/state handler.
  No callers are known, so the exact object identity is unconfirmed.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldrh r0,[r5,#0x24]; add #1; strh — frame counter at +0x24; cmp r0,#5; beq; mov r0,#3; strb
    r0,[r5] — state 3 written to +0 at frame 5; cmp r0,#0x1e; blt locret — main action fires at frame
    30; sprite_setAnimation(1), sprite_loadAnimationData, sprite_noShadow call sequence after counter
    reset; ldrb r0,[r5,#4]; tst; PlaySoundEffect(0x123) conditional; mov r0,#4; strb r0,[r5,#9]'
