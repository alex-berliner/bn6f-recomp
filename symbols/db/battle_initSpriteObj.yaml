name: battle_initSpriteObj
address: '0x080E809C'
kind: function
status: probable
summary: Initializes a battle object's sprite (sprite 0x80, param 0x14, kind 7), then sets its animation
  from Param1 and switches it into the per-frame update state.
interface: (r5 = battle object, implicit) -> void; sets object state to CUR_STATE_UPDATE
details: 'The routine operates on the object in r5: sprite_load(0x80, 0x14, 7) attaches a sprite, then
  sprite_loadAnimationData, sprite_noShadow (no shadow rendering), and the animation index is taken from
  oBattleObject_Param1 into both oBattleObject_CurAnim and oBattleObject_CurAnimCopy followed by sprite_setAnimation
  and another animation-data load plus sprite_update. It sets bit 1 of oObjectHeader_Flags (likely the
  active/visible or loaded flag), copies the object''s X/Y/Z position into the X/Y/Z velocity fields,
  and finally stores CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized before
  tail-calling unknown sub_80E80E0. The velocity-equals-position copy suggests the velocity fields double
  as per-object scratch or the object moves relative to its spawn point.'
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'sprite_load called with r0=0x80, r1=0x14, r2=7 fixes the sprite/anim/kind arguments; ldrb r0,[r5,#oBattleObject_Param1];
    strb to CurAnim and CurAnimCopy then sprite_setAnimation copies Param1 as animation index; orr flags
    with #2 in oObjectHeader_Flags enables the object''s render/update bit; X/Y/Z are copied into XVelocity/YVelocity/ZVelocity
    before the state switch; store of CUR_STATE_UPDATE into oBattleObject_CurStateActionPhaseAndPhaseInitialized
    hands control to the update handler'
