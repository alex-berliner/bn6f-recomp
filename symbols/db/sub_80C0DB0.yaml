name: sub_80C0DB0
address: '0x080C0DB0'
kind: function
status: confirmed
summary: Applies a colour-shading palette to the current battle-object's sprite, selecting an entry from a packed
  shader table via the object's Unk_19 byte as a hashed index.
interface: void sub_80C0DB0(u32 battleObject* r5, lr return); clobbers nz,c/v,r0,r1,r3,lr
details: 'Reads the single-byte field oBattleObject_Unk_19 from the battle-object struct pointed at by r5

  and folds it into the index formula (idx * 0x21) * 0x21 = idx * 0x441 (equivalently

  ((idx<<5)+idx)<<5 + idx), which is a stride into a packed shader table - likely one entry of

  0x21 = 33 bytes = a 16-colour half-shader plus metadata. The resulting pointer/value is passed

  to sprite_setColorShader, which establishes or refreshes the sprite''s per-tile colour

  modification for that battle object. No other output is produced; the function is a thin

  adapter from the per-frame/unknown-flag-update step of the battle object''s tick into the sprite

  rendering pipeline. Unk_19''s role (presumably a state, attribute level, or elemental flag) is not

  disambiguated here.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
