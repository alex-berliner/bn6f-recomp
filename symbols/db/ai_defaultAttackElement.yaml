name: ai_defaultAttackElement
address: '0x080F22C2'
kind: function
status: probable
summary: 'AI attack helper: if the enemy''s attack element is unset, default it to 4 and reset the object''s
  animation; otherwise end the attack state'
interface: (r5 = battle object ptr, r7 = oAIAttackVars struct) -> r0 = clobbered; writes oAIAttackVars_AttackElement
  and oBattleObject_CurAnim
details: Reads the byte oAIAttackVars_AttackElement from the AI attack vars struct in r7. If it is zero
  (no element assigned), it stores 4 into that field and writes 0 to the battle object's CurAnim (r5),
  restarting the object's animation from frame 0, then returns without touching attack state. If an element
  is already set (nonzero), it instead calls object_exitAttackState, ending the attack. Element 4 appears
  to be a fallback/default attack element for this AI routine. Runs only in the 'battlesweep' recorded
  route context; r7 and r5 are caller-managed registers holding the AI vars and object structs.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: ldrb r0,[r7,#oAIAttackVars_AttackElement]; tst r0,r0; bne loc_80F22D4 branches on element being
    nonzero; mov r0,#4; strb r0,[r7,#oAIAttackVars_AttackElement] assigns default element 4 when unset;
    mov r0,#0; strb r0,[r5,#oBattleObject_CurAnim] resets the object animation; bl object_exitAttackState
    is taken only when the element was already set
  refs:
