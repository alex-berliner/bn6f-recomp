name: t3_0x6e_80D2290
address: '0x080D2290'
kind: function
status: confirmed
summary: Per-state dispatcher that jumps to the battle object's handler for its CurState (init/run/destroy).
interface: void battleObject_stateDispatcher(battleObject* obj /* r5 */, ... /* r2, r4, r8-r12 passed through */);
  handlers entered with r0 = CurState, r1 = handler address
details: "Reads obj->CurState (byte at r5+oBattleObject_CurState), indexes the table at\noff_80D22A4 with it, and\
  \ tail-dispatches to the matching handler as a plain\ncall (mov lr, pc; bx r1):\n  state 0 -> battleObject_initObstacle_80D22B0\
  \ (first-time setup of an obstacle-type object)\n  state 1 -> battleObject_runUpdateActionsAndCollisions_80D2320\
  \ (per-frame action update + collision processing)\n  state 2 -> object_genericDestroy (standard removal path)\n\
  The object pointer lives in r5 and is passed through untouched; handlers are\nentered mid-function with the guest's\
  \ live r2/r4/r8-r12 argument registers,\nso whatever the handler leaves in r5/r8-r12 becomes this function's outputs.\n\
  r0 holds the current state and r1 the table entry when the handler begins.\nTable has exactly 3 entries; a CurState\
  \ >= 3 would read garbage and jump wild.\n"
