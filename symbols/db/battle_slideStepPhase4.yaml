name: battle_slideStepPhase4
address: '0x080C06DC'
kind: function
status: probable
summary: Battle phase handler that on init sets a 20-frame timer and slides the object at ±2 px/frame
  (twice its facing multiplier) along X, then advances to phase 4 when the timer expires.
interface: (r0 = unused; r5 = battle object) -> void; updates oBattleObject_Timer, XVelocity, PhaseInitialized,
  CurPhaseAndPhaseInitialized, X
details: On first run (PhaseInitialized == 0) it sets the timer to 0x14 (20 frames), computes the facing
  multiplier via object_getFrontDirection, doubles it (giving ±2), stores it as XVelocity, and sets PhaseInitialized
  = 4. Each subsequent call decrements the timer; when it reaches 0 it zeroes XVelocity and writes phase
  4 into CurPhaseAndPhaseInitialized. Every invocation applies X += XVelocity, so the object moves a fixed
  total of ±40 px horizontally. The doubled front-direction suggests the object slides away from the player
  when the player is in front, i.e. a retreat/backstep or knockback motion.
