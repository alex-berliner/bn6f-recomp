name: addToWordAt_80A6E70
address: '0x080A6E70'
kind: function
status: confirmed
summary: Adds an addend to a 32-bit word located at base+offset, returning the previous value in r1.
interface: u32 addToWordAt(u32 addend /*r0*/, u32* base /*r5*/, u32 offset /*r6*/); returns old value
  in r1, C/V set by the ADD
details: 'Tiny generic arithmetic helper: loads the 32-bit word at [r5, r6], adds r0 to it,

  stores the sum back to the same location, and leaves the OLD (pre-add) value in r1

  for the caller. The N/Z/C/V flags come from the ADDS (N/Z from the sum, C/V from the

  add''s carry/overflow). It touches no game structures on its own — r5/r6 form a

  base+offset pair chosen by the caller, so it is used wherever callers increment or

  accumulate a counter/value in memory and want to know the previous value.

  Note the base and offset are passed separately (caller''s convention, e.g. a struct

  pointer in r5 and a field offset/index kept in r6 across a loop).

  Preserves nothing beyond returning via mov pc, lr; r0 and the flags are clobbered.

  '
