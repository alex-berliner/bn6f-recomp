name: battle_DispatchPendingEvent_802A0F8
address: '0x0802A0F8'
kind: function
status: confirmed
summary: Checks the battle's pending-event flag and, if an event is queued, dispatches event flags 0x4000, then
  always clears the pending-event state.
interface: void sub_802A0F8(void); // no meaningful inputs; returns after side effects, NZ flags from the pending-event
  test survive into the clear call
details: 'Reads the pending-event byte at byte_20352CC (offset 0x4C of eStruct2035280).

  If it is nonzero, calls dispatch_801DACC with R0 = 0x4000 (an event-flag mask,

  so the pending event is delivered as flags 0x4000). In both cases it then calls

  battle_ClearPendingEventFlag_802A0EC to reset the pending-event state, so the

  event fires exactly once. Only R0 and flags are clobbered locally; r5-r7 are

  preserved through the calls. This looks like a per-frame hook in the battle

  loop that raises a scheduled/scripted battle event.

  '
