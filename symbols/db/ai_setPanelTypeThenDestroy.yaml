name: ai_setPanelTypeThenDestroy
address: '0x080D7008'
kind: function
status: probable
summary: Battle object phase handler that turns the panel under it into a new panel type, waits Param2
  frames, then removes itself.
interface: (r5 = battle object) -> void; sets object state to CUR_STATE_DESTROY when timer expires
details: On first invocation (CurPhase == 0) it advances the object to phase 4, switches its sprite to
  animation 0x13, and calls object_setPanelType with its own PanelX/PanelY and type 6, then loads oBattleObject_Param2
  into the Timer. On every later call it decrements Timer; once it reaches 0 it calls object_clearCollisionRegion
  to leave the collision grid and writes CUR_STATE_DESTROY into CurState, so the object engine despawns
  it. Panel type 6 combined with a one-shot spawn-animate-wait-destroy pattern fits a terrain-modifying
  effect object (e.g. grass/seed panel changer).
