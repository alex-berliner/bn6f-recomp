name: gfx_QueueNext64ByteChunk_8028204
address: '0x08028204'
kind: function
status: confirmed
summary: Queues a single 0x40-byte chunk of a graphics transfer to the destination pointer in r1, then advances
  r1 past the chunk.
interface: gfx_QueueNext64ByteChunk(dest /* r1 in/out, advanced by 0x40 */) -> void; clobbers r0 (source address),
  preserves r2-r7; flags set by the r1 += 0x40 add
details: 'One step of a chunked graphics load. On entry r1 holds the VRAM/destination

  address for the next chunk. It first calls sub_8028214, which fills in r0

  with the source address matching this chunk (leaving r1-r3 untouched), then

  calls QueueEightWordAlignedGFXTransfer with src = r0, dest = r1, and size =

  0x40 (one 8-word-aligned tile row block). Before returning it restores the

  caller''s r2/r3 (saved as scratch for the queue call) and bumps r1 by 0x40

  so a caller can invoke this repeatedly to stream consecutive chunks.

  Intended usage pattern: caller keeps r1 as a running destination cursor and

  calls this in a loop; the source side is resolved per-chunk by sub_8028214

  (likely stepping through a GFX asset base pointer/state).

  '
