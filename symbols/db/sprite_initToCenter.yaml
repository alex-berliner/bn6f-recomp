name: sprite_initToCenter
address: '0x0811C508'
kind: function
status: probable
summary: 'Initializes/resets a sprite-bearing object: sets byte [r5] to 1 and [r5+8] to 4, calls sprite_setCoordinates
  with (0x80, 0x80) to recenter the sprite, re-asserts 4 at [r5+8], clears two counter bytes at [r5+0x12]/[r5+0x13],
  and tails into sub_811C52C.'
interface: (r5 = object/sprite struct pointer, fixed register) -> r0 clobbered; struct bytes 0x0, 0x8,
  0x12, 0x13 written; sprite position set to 0x80,0x80
details: Stores 1 at [r5] (likely an active/visible flag) and 4 at [r5+8] (likely a state or mode id),
  then calls sprite_setCoordinates with x=0x80, y=0x80, placing the object at the center of the 240x160
  screen (128,128 in the game's coordinate space). It re-writes 4 to [r5+8] after the call, suggesting
  sprite_setCoordinates or something it calls may touch that byte or that the value must persist across
  it. It then zeroes [r5+0x12] and [r5+0x13] (likely timers/counters) and calls sub_811C52C before returning.
  The struct is passed in callee-saved r5, so this is an initializer/reset step for a sprite-driven object
  rather than a standalone routine.
