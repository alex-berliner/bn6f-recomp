name: getSetFlagCount
address: '0x081420C8'
kind: function
status: probable
summary: Given a group index into byte_8142120, returns how many of its contiguous event flags (base..base+count)
  are currently set, by tallying TestEventFlag results.
interface: (r0 = index into flag-group table at byte_8142120) -> r0 = number of set flags in that group;
  flags clobbered
details: Indexes the table at byte_8142120 by r0*4, giving entries with a u16 base flag id at +0 and a
  u16 count at +2. It loops count times calling TestEventFlag on base+i and tallies the set ones in r6,
  which it returns. Effectively it checks how many story/progress flags of a given set are already done.
  No writes to game state; purely a query.
evidence:
- method: assembly-reading
  date: '2026-10-18'
  detail: 'ldr r7, off_814211C; lsl r0,r0,#2; add r7,r7,r0 — selects an entry of the byte_8142120 table;
    ldrh r0,[r7,#2] used as loop bound; ldrh r0,[r7] used as base flag id added to the loop counter; bl
    TestEventFlag (flag: u16) -> !zf; beq skips add r6,#1 — only set flags increment the count; mov r0,r6;
    pop — returns the tally; sole callee is TestEventFlag'
  refs:
  - bn6f/asm/asm37_1.s:749
  - 0x081418F0 sub_81418F0
  - 0x0802F168 TestEventFlag
