name: battle_spawnType6FAndInitObject_80D2580
address: '0x080D2580'
kind: function
status: confirmed
summary: Spawns battle object type 0x6F and, if the spawn succeeded, runs BasicBattleObjectInitialize
  on the new object before returning.
interface: (r0-r6 = arguments passed through) -> r1 = BasicBattleObjectInitialize result, or the original
  r0 when the spawn failed; r4, r6 = passed back from object_spawnType3; r5 = original r5; flags clobbered
details: 'Thin battle-side spawn-and-init wrapper. It saves r0, r1, r2 and r5, sets r0 = 0x6F,

  and calls object_spawnType3, passing the caller''s original r1-r4 through as the spawn

  arguments (so the caller effectively shifts its argument set down one register to make

  room for the object type). If the returned object pointer (r5 from object_spawnType3)

  is non-null, it restores the saved registers via pop {r1-r3,r5} (so r1 = original r0,

  r2 = original r1, r3 = original r2, r5 = original r5), loads the new object pointer

  into r0, and calls BasicBattleObjectInitialize with (object, origR0, origR1, origR2,

  origR5, object_spawnType3''s r6). The conditional is taken off the flags left by

  object_spawnType3 after the pops, so the null-check is on the spawned object pointer.

  On the failure path the initialization is skipped and the saved r0 is left in r1 as

  the return value. r7 is preserved throughout; the caller''s r6 is never read directly

  (only object_spawnType3''s outgoing r6 comes back). No typed C interface exists yet for

  either callee, so the exact meaning of the arguments passed to the type-0x6F object

  and to BasicBattleObjectInitialize is unknown.

  '
