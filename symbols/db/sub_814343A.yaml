status: probable
summary: Uniform 3-way pick through pickWeightedIndex_8000E3A with the weight table {5,5,5} - the result
  is always 0, so it only burns 2-8 primary draws; stores 5 into dword_200101C (the Cybercrow spawn cooldown).
details: 'Fills a 16-byte stack buffer with 0x20 and calls pickWeightedIndex_8000E3A(sp, 3); the weight
  table byte_8143464 is {5,5,5}, so every run picks index 0 and the stored value (from byte_8143464[index])
  is always 5 into eStruct2001010+0xC = dword_200101C. Its only effect on the RNG stream is the pick''s
  stir: 2 + (rng>>30) + (iCurrFrame & 3) primary draws (2-8).'
