name: battle_beastOutTransformUpdate
address: '0x08118510'
kind: function
status: probable
summary: 'Per-frame update for the beast-out transformation effect object: pick variant by event flag,
  step the scrolling strips, flag completion, refresh palette.'
interface: (r5 = transform-state struct, r6 = beast-out object) -> r0 = last callee result; writes r5+0
  variant, r5+0xC = 0, r6+0xD = scroll-done flag
details: Reads event-flag bit 0x80 of eFlags2009F38 (chatbox_mask_eFlags2009F38) and stores 1 if set,
  else 0x23, to [r5], zeroing [r5+0xC] (likely a timer). If [r6+2] == 0x28 it calls sub_8118794, otherwise
  battle_beastOutScrollStep, storing nonzero(=1) into [r6+0xD] when the callee reports the scroll strips
  arrived, else 0. Then battleObject_setPaletteFromOffsetTable_81185E4 updates the object's sprite palette
  from the 0x0201DA80 table, and sub_8118658 is called with r5/r6 still live. Field +2 == 0x28 likely
  selects one beast form (Gregar/Falzar) with its own scroll handler.
