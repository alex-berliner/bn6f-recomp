address: '0x080C6B40'
kind: function
status: confirmed
summary: Per-frame update for battle object type 3/id 0x16 — dispatches a state handler for the object's current
  state, then refreshes its sprite.
interface: void battle_objType3Id16_stateDispatchUpdate_80C6B40(BattleObject* obj /* r5 */); r0-r3 and NZCV are
  clobbered by the callee chain, r4-r12 preserved through this wrapper
details: 'Standard battle-object update stub: reads the object''s CurState byte (oBattleObject_CurState at r5+8)
  and uses it directly as a byte offset into the 32-bit handler table off_80C6B58 (the state byte therefore stores
  word offsets, not indices: 0 -> sub_80C6B64, 4 -> sub_80C6C14, 8 -> object_genericDestroy). The handler is invoked
  with mov lr, pc / bx r1 (ARM state via bit-1 address), so the handler returns to the instruction after the bx
  rather than tail-calling; it receives r0 = state byte and r1 = its own table entry, with r2-r12 passing through
  untouched. After the handler returns, object_updateSprite is called to apply whatever the handler did (position/animation
  data) and the wrapper pops {pc} to return. Any state byte outside 0/4/8 would load garbage from past the table
  and crash, so the table is exhaustive for this object''s life cycle: initial state -> second state -> destroy.

  '
