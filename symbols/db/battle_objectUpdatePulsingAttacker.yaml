name: battle_objectUpdatePulsingAttacker
address: '0x080D2B2C'
kind: function
status: confirmed
summary: 'Per-frame tick for a pulsing attacker object: cycles collision on/off at 12-frame intervals, triggers
  screen-shake on contact, and self-destructs when the attacker link is broken or the pulse duration (Timer2) expires.'
interface: void battle_objectUpdatePulsingAttacker(u32 r4, u32 *r5 /* battleObject */, u32 r7, u32 r8, u32 r10)
  -> r5, r8 updated; clobbers r0-r3, lr, nzcv
details: 'Operates on the BattleObject at r5. Sequence:

  1. Calls object_removeCollisionData and object_spawnCollisionEffect to reset visuals.

  2. Validates the attacker link: reads oBattleObject_ExtraVars pointer; if non-null and its first field does not
  back-reference r5, marks for destruction (the source attacker object is gone).

  3. If not destroyed: checks oCollisionData_FlagsFromCollision; if any flag is set, clears the collision region
  and calls camera_initShakeEffect_80302a8(0, 12) for a short screen shake.

  4. Decrements oBattleObject_Timer2 (total pulse budget); negative → destroy.

  5. Decrements oBattleObject_Timer (inter-pulse countdown); when ≤0, resets to 0xC (12 frames) and calls object_setCollisionRegion(1,
  r5) to activate the hitbox, unless oBattleObject_Param3 == 1 (some variant that skips re-arming).

  6. Destroy path: clears collision region, zeroes the u32 at ExtraVars+8, writes CUR_STATE_DESTROY into oBattleObject_CurStateActionPhaseAndPhaseInitialized.

  7. Tail (always executed): battle_syncToPanelInFrontOfRelated then object_presentCollisionData to keep the object
  visually aligned and re-upload collision geometry.

  Fields touched: oBattleObject_ExtraVars, oBattleObject_CollisionDataPtr, oCollisionData_FlagsFromCollision, oBattleObject_Timer2,
  oBattleObject_Timer, oBattleObject_Param3, oBattleObject_CurStateActionPhaseAndPhaseInitialized.

  '
