- method: assembly-reading
  date: '2026-10-18'
  detail: 'bl object_removeCollisionData / object_spawnCollisionEffect at function start: teardown then
    hit-effect at collision point; ldr r0,[r5,#oBattleObject_ExtraVars]; cmp r1,r5; bne loc_80D2B78 —
    extra-vars pointer must be self or null to stay alive; bl object_clearCollisionRegion + camera_initShakeEffect(0,12)
    guarded by oCollisionData_FlagsFromCollision != 0; Timer reset to 0xC and bl object_setCollisionRegion
