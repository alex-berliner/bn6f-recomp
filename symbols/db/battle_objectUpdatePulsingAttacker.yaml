name: battle_objectUpdatePulsingAttacker
address: '0x080D2B2C'
kind: function
status: probable
summary: Per-frame handler for a battle attack object that pulses its collision region every 12 frames,
  shakes the camera while colliding, and destroys itself when its timers or owner expire.
interface: (r5 = battle object ptr) -> void; writes oBattleObject_CollisionDataPtr->FlagsFromCollision,
  Timer/Timer2, Param3, ExtraVars+8, CurState; may set CUR_STATE_DESTROY
details: 'Starts by calling object_removeCollisionData then object_spawnCollisionEffect to pop a hit effect
  at the last collision point (jittered). If oBattleObject_ExtraVars is non-null and its first pointer
  does not equal the object itself, the object is finalized instead: collision region cleared, ExtraVars+8
  zeroed, and CUR_STATE_DESTROY stored into CurStateActionPhaseAndPhaseInitialized. Otherwise, when oCollisionData_FlagsFromCollision
  is nonzero it clears its collision region and calls camera_initShakeEffect(0, 0xC). Timer2 counts down
  to destroy; Timer counts down and every time it hits 0 it resets to 12 and re-registers the object in
  collision region 1 via object_setCollisionRegion, unless Param3 == 1 (a variant with no re-registration).
  Ends with calls to sub_80D2BC0 and object_presentCollisionData to run the shared collision update.'
