name: ai_spawnPanelAttackEffect
address: '0x080D18AE'
kind: function
status: probable
summary: Spawns a type-3 battle object of kind 0x68 at a panel and initializes it as an AI attack effect
  tied to the acting object (coords, element, alliance, damage).
interface: (r0 = panelX, r1 = panelY, r2 = element; r5 = related/acting object ptr, r6 = damage, set by
  caller) -> r0 = spawned object ptr (or unchanged on failure); flags Z tested after spawn
details: 'The helper pushes its r0-r2 arguments, calls object_spawnType3 with kind 0x68 (r1-r3 passed
  through), and if the spawn succeeded fills the new object''s fields: PanelX/PanelY from the first two
  arguments (the pop {r1-r3,r5} shifts saved r0-r2 into r1-r3), Element from the third, RelatedObject1Ptr
  from r5, and the DamageAndStaminaDamageCounterDisabler word from r6. It then copies AllianceAndDirectionFlip
  from the related object so the effect faces the attacker''s side, and sets bit 0x10 in oObjectHeader_Flags,
  likely marking the effect active/initialized. r5 and r6 are never set inside the function, so they rely
  on caller-register setup by ai_attackSpawnPanelLine (acting object and damage). If the spawn fails,
  all field setup is skipped via the beq.'
evidence:
- method: assembly-reading
  date: '2026-10-19'
  detail: 'mov r0, #0x68 + bl object_spawnType3: spawns a battle object of subtype 0x68; strb r1/r2 to
    oBattleObject_PanelX/PanelY right after the pop-shift of the saved arguments; str r5 to oBattleObject_RelatedObject1Ptr
    and ldrh/strh of AllianceAndDirectionFlip from [r5] link the effect to the attacker; str r6 to oBattleObject_DamageAndStaminaDamageCounterDisabler
    stores the damage value; caller ai_attackSpawnPanelLine invokes it per panel to place attack effects
    ahead of the actor'
  refs:
  - bn6f/asm/asm31.s:56093
  - 0x080F6310 ai_attackSpawnPanelLine
  - 0x08003358 object_spawnType3
  reproduce: python3 tools/asmcat.py 0x080D18AE
  result: 'proposed by hyper/glm-5.3-flash, self_score 3; cross-checked by minimax/MiniMax-M3: agree;
    run wf investigate investigate-20261019-022109'
open_questions:
- exact meaning of object kind 0x68 and of flag bit 0x10 in oObjectHeader_Flags
- how ai_attackSpawnPanelLine sets r5/r6 before the call (caller-register convention not verified from
  its listing)
- which of the arguments object_spawnType3 consumes versus what this function reinterprets after the pop
