name: battle_tickBattleObject_80107D4
address: '0x080107D4'
kind: function
status: confirmed
summary: 'Per-frame housekeeping for a battle object: tick down AI timers (chip lockout, unk 0x15) and
  alliance entry counters at offsets 0x2E, 0x3A and 0x3C, except when battle time is stopped.'
interface: 'void battle_tickBattleObject_80107D4(void); // in: r5 = battle object pointer, r10 = ?, r4
  = preserved by callee across the call; out: r4 unchanged'
details: 'Reads oBattleObject_AIDataPtr (32-bit) from r5 to obtain the per-object AI data block, then

  decrements oAIData_ChipLockoutTimer (u8) and oAIData_Unk_15 (u8) if currently nonzero.

  Reads oBattleObject_Alliance (u8) and asks getEntryPtr_2036120_1D0_802E070 for an alliance-

  scoped entry pointed to by a 0x1D0-entry table rooted at 0x2036120; if entry byte 0 is zero,

  it bails. Otherwise it ticks three 16-bit counters at offsets 0x2E, 0x3A and 0x3C of that

  entry when nonzero. The whole body is skipped when battle_isTimeStop returns true.

  All decrement operations are saturating-at-zero (tst/beq + sub + str) so the counters clamp

  rather than underflow. r4 is treated as callee-saved.

  '
