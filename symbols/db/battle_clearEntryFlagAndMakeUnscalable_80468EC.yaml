name: battle_clearEntryFlagAndMakeUnscalable_80468EC
address: '0x080468EC'
kind: function
status: confirmed
summary: Clears the flag byte of one 0x58-byte entry in the battle array at byte_2011860 and marks that
  entry's sprite unscalable.
interface: 'u32 sub_80468EC(u32 index); // in: r0 = entry index; out: r1/r2/r3 and c/v as left by sprite_makeUnscalable;
  r5 preserved'
details: 'Computes a pointer to an entry in the array at byte_2011860 (ram 0x02011860) as base + index*0x58,
  i.e. the battle-side structures are 0x58 (88) bytes each. It stores 0 into the first byte of the entry
  (its flag/state byte, offset 0), then passes the entry pointer in r5 to sprite_makeUnscalable, which
  presumably reads a sprite handle or related fields from the rest of the entry and removes the sprite''s
  scalable/enlarged rendering (the "scale" flag used for zoomed-in effects such as big/enemy-scaled battle
  sprites). The byte clear happens before the sprite call, so sprite_makeUnscalable sees the updated entry.
  r4-r7 are pushed and popped, so the caller''s r5 is preserved even though the pointer is built in r5;
  only r0 and lr are consumed, r1-r3/c/v outputs are whatever the callee leaves.

  '
