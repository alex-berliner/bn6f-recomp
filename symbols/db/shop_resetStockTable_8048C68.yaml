name: shop_resetStockTable_8048C68
address: '0x08048C68'
kind: function
status: confirmed
summary: Resets the toolkit's shop data buffer, zeroing it and copying the default 8-byte-entry stock table from
  ROM, skipping empty entries.
interface: void shop_resetStockTable_8048C68(void *toolkit_r10); /* outputs r2 = negative leftover entry counter
  from the copy loop, not meaningful to callers */
details: 'Loads the shop data buffer pointer from toolkit+oToolkit_ShopDataPtr (r10 is the

  toolkit struct), zero-fills 0xE80 (3648) bytes via ZeroFillByWord, then copies the

  default stock table at ROM address byte_8047DA0 over it. The table is a run of

  8-byte entries; before copying each entry it tests the entry''s byte at offset 1 —

  if that byte is 0 the entry counts as an empty slot and the just-zeroed buffer

  space is left as zeros instead of being overwritten. The loop counts down in

  8-byte steps from 0xE80 and exits with r2 holding the negative leftover count,

  which callers appear to ignore. Inputs r2/r3 are passed through untouched (the

  ZeroFillByWord call happens before any use of them, so they are likely just

  scratch the contract records as live on entry). No other state is touched; the

  function is a pure (re)initialization of the shop stock buffer.

  '
