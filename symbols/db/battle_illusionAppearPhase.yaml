name: battle_illusionAppearPhase
address: '0x080BD644'
kind: function
status: probable
summary: 'Battle object phase 4 handler: plays animation 4 for 3 frames (with optional illusion spawn),
  then advances to phase 8.'
interface: () -> void; uses oBattleObject in r5, sets r0=4 (CurAnim) and r0=8 (next phase)
details: Standard battle object phase handler keyed on oBattleObject_PhaseInitialized. On first entry
  sets CurAnim=4, clears RelatedObject1Ptr, sets Timer=3, optionally calls battle_spawnIllusionObjects
  when Param3==1, and marks phase 4 initialized. On each subsequent call it decrements Timer; when the
  timer underflows, it writes 0x0008 to oBattleObject_CurPhaseAndPhaseInitialized, advancing the object
  to phase 8.
