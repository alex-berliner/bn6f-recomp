name: sub_802A40C
address: '0x0802A40C'
kind: function
status: confirmed
summary: Computes the beast-transformation turn counter for the current Navi and stores it into the caller's buffer
  at offset 6.
interface: void sub_802A40C(u8* dest /* r5 */, const Toolkit* toolkit /* r10 */)
details: 'Reads the battle mode via GetBattleMode; for link/cross modes (2,3,4,5,8) it

  short-circuits and writes a fixed counter of 5 to [dest + 6].


  Otherwise queries the BattleState alliance (offset 0x0d) and, via

  callPossiblyGetBattleEmotion_8015B54, the current transformation state.

  Transformations 0xA and 0x16 are treated as "beast forms" that bypass the

  beast-over flow.


  The base counter is BattleNaviStats stat 0xA + the global overflow byte at

  0x20349B1 (dword_20349A0 + 0x11), clamped to a maximum of 8. Any amount

  over 8 is split off as `overflow`.


  If the Navi is NOT in a beast form and battle_isBeastOverEnabled_802A5A0

  reports the beast-over mechanic active, the counter is forced to 0xA and

  `overflow` is reloaded with the raw global byte.


  Finally the Navi''s agitation stat (0x63) is fetched. When nonzero and the

  damage tally at BattleState+0x07 already equals/exceeds it, `overflow` is

  reduced by (damage - agitation + 1). If overflow goes negative, the counter

  is decreased by |overflow| but is floored at 2 (never goes lower).


  Writes the resulting counter byte to [dest + 6]. Preserves r4..r7 for its

  caller.

  '
