details: "Resolves the global game-state pointer via [r10 + oToolkit_GameStatePtr],\nthen stores its five arguments\
  \ into the SavedRealWorld* fields of game state:\n  - oGameState_SavedRealWorldX             <- r0\n  - oGameState_SavedRealWorldY\
  \             <- r1\n  - oGameState_SavedRealWorldZ             <- r2\n  - oGameState_SavedRealWorldFacingDirection\
  \ <- r3\n  - oGameState_SavedRealWorldMapId         <- r4\nUsed to snapshot the overworld player before a Cyberworld\
  \ dive so the real-world\npose can be restored on return. No return value; tail-pop restores r4-r7 and PC.\n\n\
  Register form, old prompt; queued for retype (the farm's prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv)."
