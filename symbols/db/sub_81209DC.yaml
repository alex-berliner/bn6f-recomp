name: sub_81209DC
address: '0x081209DC'
kind: function
status: confirmed
summary: Selects a random battle element ID from a category-specific pool and returns a bias modifier byte drawn
  from a weighted lookup table.
interface: 'u32 battle_pickElementAndBias_81209DC(u32 category /*r0*/); /* out: r0 = element ID (low byte), r1 =
  bias value 0..0x13; preserves r6,r7; clobbers r2,r3,lr,NZCV */'
details: 'Reads a per-category range count from a three-entry ROM table at 0x8120A14 ({0x44, 0x60, 0x44}). Draws
  a secondary-RNG value, takes it mod the range, and for categories >= 2 adds 0x60 to shift the element ID into
  a higher band. The low byte of that adjusted value is returned in r0 as the chosen element ID. Then draws a primary-RNG
  value mod 21 to index a 21-entry bias table at 0x8120A20 (values range 0..0x13 with duplicates at 1, 11, 13 suggesting
  a non-uniform weight distribution). The bias byte is returned in r1. Out-of-range category indices simply read
  whatever 32-bit word follows in ROM at that offset. The three categories likely correspond to distinct element
  pools (e.g. normal, extended, and shifted/high-tier sets) used when generating random battle-field tiles or environmental
  elements.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
