- method: assembly-reading
  date: '2026-10-14'
  detail: '- "bl object_getFlip ; bl sprite_setFlip" at 0x0800f2c8-0x0800f2cc: the first two calls compute
    and apply the sprite''s horizontal facing. - "ldr r0, [r5,#oBattleObject_AIDataPtr]" with the constant
    0x58 matches the AIDataPtr offset in oBattleObject; the following "tst r0, r0 ; beq locret_800F2EE"
    is the early-out when there is no AIData. - "ldrb r1, [r0,#oAIData_ActorType] ; cmp r1, #2" matches
    ACTOR_TYPE_PLAYER (2) in the AIData struct. - The "bne" branch goes to "bl battleRefreshTrackedObjectArmPos_801DBD4"
    which is already confirmed to be the routine that updates the 6-slot arm-position table for non-player
    objects. - The "mov r0, #3 ; bl sub_8018856 ; neg r1, r1 ; bl sub_801DC06" path'
