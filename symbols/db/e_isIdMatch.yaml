name: e_isIdMatch
address: '0x08003B24'
kind: function
status: probable
summary: Returns TRUE only if eStruct2001010 is initialized and its byte at offset 1 equals the given
  id.
interface: (r0 = id to match against byte_2001011) -> r0 = 1 if initialized and id matches, else 0; sets
  flags via tst on result
details: Calls Is_eStruct2001010_Initialized; if the structure is not initialized it returns 0 immediately.
  Otherwise it loads the byte at eStruct2001010+1 (0x2001011) and compares it to the r0 argument, returning
  1 only on equality. It writes nothing and touches no other fields, so it is a pure predicate/query on
  the eStruct2001010 singleton, presumably checking whether the structure currently holds the requested
  id. Placed right before owPlayer_main in the object file, suggesting overworld/entity usage.
