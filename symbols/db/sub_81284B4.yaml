name: sub_81284B4
address: '0x081284B4'
kind: function
status: confirmed
summary: Walks the current battle action-sequence array and tallies how many sub-entries have their table flag bit
  (bit 7) set versus clear, returning both counts.
interface: void battle_countFlaggedActions_81284B4(void) → r0 = flagged_count, r1 = unflagged_count
details: 'Reads the sequence length from dword_2001140 (SRAM) and the sequence byte array starting at byte_2006530.
  For each byte in the sequence, uses that byte as an index into the 4-byte-per-entry lookup table at byte_812851C
  (table + key*4), reads the first byte of the matched entry, and checks bit 7. Increments a counter at [sp] if
  set, or a counter at [sp+4] if clear. Iterates with an unsigned compare loop (bgt on the remaining count in r4).
  Returns the two tallies in r0 (flagged) and r1 (unflagged). r4–r7 and lr are pushed/popped; r2 and r3 are clobbered
  as scratch. No caller-supplied parameters beyond the saved registers.

  '
