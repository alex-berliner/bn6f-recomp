name: battle_pickObjectAnimState_802BF0C
address: '0x0802BF0C'
kind: function
status: confirmed
summary: Chooses an animation/state index for a battle object — either a scripted state derived from the object's
  +0xC byte, or a 0/1 alternation driven by bit 3 of the global frame counter — and passes it to sub_802C810.
interface: battle_pickObjectAnimState_802BF0C(BattleObj *obj /* r5 */, u32 r6, Toolkit *r10); no return value; preserves
  r5/r6/r10; calls sub_802C810 with r0 = state index and r7 = context pointer
details: "Part of the battle object/entity animation update path. Reads two 16-bit flag halfwords\nliving next to\
  \ dword_2036820 (at +4 and +0xC relative to that base, i.e. dword_2036824\nand dword_203682C) and ORs them together.\n\
  \nIf bit 0 of that combined mask is set, the \"active\" path runs:\n  - takes the object's byte at +0xC as a state\
  \ selector; values > 1 map to 12 (0xC),\n    values 0/1 map to 4\n  - writes that value (4 or 12) into the object's\
  \ halfword at +2 (its current\n    animation/state slot)\n  - calls sub_802C810 with r0 = 0 and r7 = flags base\
  \ + 8 (dword_2036828), so the\n    callee receives the second flag halfword block as its context\n\nOtherwise\
  \ the \"idle\" path runs:\n  - loads oToolkit_CurFramePtr from the r10 toolkit struct and reads the 16-bit frame\n\
  \    counter at [r7]\n  - computes (frameCounter & 8) >> 3, i.e. an index that toggles 0/1 every 8 frames\n  -\
  \ calls sub_802C810 with that index and r7 = current-frame pointer, so the callee\n    presumably compares the\
  \ animation frame against the frame counter\n\nThe 0/1 toggling pattern on the idle path strongly suggests a looping\
  \ two-frame\nanimation (e.g. a pulsing/floating object), while the active path selects between\nanimation states\
  \ 4 and 12 based on the object's per-instance state byte. r6 is an\ninput to this function but is never read in\
  \ its body (it may only matter via the\ncallee's contract). Only bit 0 of the combined flags is tested here; the\
  \ rest of\nthose halfwords are presumably consumed elsewhere or by sub_802C810 via r7.\n"
