name: battle_getStateUnk5c_800139A
address: '0x0800139A'
kind: function
status: confirmed
summary: Getter that returns the value of the battle state's Unk_5c field.
interface: int battle_getStateUnk5c(void) — reads the toolkit pointer from r10 (caller's context), returns the u32
  at battleState->Unk_5c in r0; no flags read or meaningful on return.
details: 'Three-instruction tail-style getter. It takes the toolkit pointer from r10 (the global

  register convention in this build), loads the current battle state pointer from

  toolkit->oToolkit_BattleStatePtr, then loads and returns the word at

  battleState->oBattleState_Unk_5c. It returns via "mov pc, lr", so it works both as a BL

  callee and as a branch tail-call target. Nothing is written back; the battle state and

  toolkit are untouched. The meaning of Unk_5c is not established yet, so the name only

  encodes the access pattern until callers pin down what the field represents.

  '
