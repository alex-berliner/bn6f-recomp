name: rfu_finishLink
address: '0x0803C94C'
kind: function
status: probable
summary: 'Finishes/tears down the current RFU wireless link: if no subsystem is active, advances to link
  phase 1, otherwise records the ended state; always clears the pending link command and returns (true,
  0).'
interface: () -> (r0 = 1 /* success/finished */, r1 = 0 /* status */)
details: 'Operates on the RFU session struct at 0x200BC50 (passed in r7 by callers). Branches on IsCurSubsystemInUse:
  the idle branch writes link-phase ID 1 (via rfu_setLinkPhase) and sets the link command to 0; the busy
  branch calls rfu_setStateEnded to record state 9, then clears the link command. Either path returns
  (1, 0).'
