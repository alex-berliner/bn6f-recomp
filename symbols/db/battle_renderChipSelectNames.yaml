name: battle_renderChipSelectNames
address: '0x0802B358'
kind: function
status: probable
summary: Draws the names of up to five chips for the in-battle chip-selection screen, marking the regular/tag
  chip slots differently.
interface: (r0 = halfword chip-ID list, 0xFFFF = empty slot; r1 = base of a 5-entry destination block;
  r5 = battle-state struct preloaded by caller) -> renders via renderTextGfx_8045F8C into VRAM 0x6008E00
  + i*0x280; no return value used.
details: Loops i = 0..4, accumulating an index r6 by the halfword at [r5+0x24] each pass and doubling
  it to index r0's halfword array. A chip ID of 0xFFFF falls back to TextScript8736D74 with mode r7 =
  0xC; otherwise the ID indexes byte_802B5FC at id*8+4 (plus byte [r5+0x12], >0x32 forcing r7 = 0xC) and
  byte_802B3F8[id*2] (a stride-6 offset table) into TextScriptVirusChipNames to select the name string.
  When the running index equals the bytes at [r5+0x10] or [r5+0x11] (0xFF = none) the mode r7 becomes
  0xC instead of 8, matching special highlighting of the regular and tag chip slots. Each name (10 chars,
  r4 = 0xA) is rendered into tile rows spaced 0x280 bytes apart from 0x6008E00, with dword_86B7AE0 as
  the font/gfx source. Note r5 is never set inside the function, so callers must preload this battle-struct
  pointer.
