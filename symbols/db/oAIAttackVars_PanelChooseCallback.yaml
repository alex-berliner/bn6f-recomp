name: oAIAttackVars_PanelChooseCallback
address: '0x28'
kind: struct-field
status: hypothesis
summary: Function pointer (Thumb) called each AI tick to pick the next panel; its bool/coord return drives
  FuturePanelX/Y.
details: The overwhelming access pattern is `str rX, [r7,#oAIAttackVars_Unk_28]` storing the address of
  a `sub_XXXXXX+1` (Thumb callback), followed by `ldr rX, [r7,#oAIAttackVars_Unk_28] ... mov lr, pc /
  bx rX`. The callee's return is tested (`tst r0/r1, r0`) and the non-zero result is stored to `oBattleObject_FuturePanelX`
  (or `oAIAttackVars_Unk_16`). One accessor comment ("AI callback (oAIAttackVars_Unk_28, set by sub_...;
  previously disassembled as data bytes)") directly corroborates the callback interpretation. Storing
  `r5+0x60` into it in sub_8100570 is the one outlier — looks like that function repurposes the slot as
  a local scratch pointer.
