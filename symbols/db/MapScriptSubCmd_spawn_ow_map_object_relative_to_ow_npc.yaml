name: MapScriptSubCmd_spawn_ow_map_object_relative_to_ow_npc
address: '0x08037EFA'
kind: function
status: confirmed
summary: Map-script sub-command that spawns an overworld map object at an existing NPC's position plus three fixed-point
  offsets and stores its pointer in a cutscene-state slot.
interface: void (r4=ptrSlotSel, r5=cutsceneState, r7=scriptCursor) -> r0=1, r1=spawnX, r2=spawnY, r3=spawnZ, r4=scriptWord,
  r6=slotAddr, r7+=0xE; flags nz,c/v from the cursor add
details: 'Low nibble of r4 (0..15) selects one of sixteen ow-map-object pointer slots at oCutsceneState_owMapObjectPtrs_44
  in the cutscene state passed in r5; the slot address (r6) is reused as the working pointer for the four script
  reads. Reads 14 bytes from the map script via ReadMapScriptByte/Halfword/Word: byte 3 NPC index, byte 4 object
  kind, halfwords 5..10 x/y/z deltas (read as u16 then shifted left by 16 to form fixed-point offsets), word 11
  extra spawn argument. Computes the spawn position as the chosen NPC''s X/Y/Z (from eOverworldNPCObjects + index
  * oOverworldNPCObject_Size, fields oOverworldNPCObject_X/_Y/_Z) plus the three offsets; pushes the NPC position
  on the stack as scratch. Calls SpawnOverworldMapObject(r0=kind, r1=x, r2=y, r3=z, r4=argWord, r5=slotAddr, r6=slotAddr,
  r7=cursor); the returned object pointer is written back through the slot (str r5, [r6]). Preserves r5, advances
  the cursor by 0xE (14), and returns 1 in r0 to advance the main script position as usual.

  '
