name: battle_setObjectPhase8_80B8A0A
address: '0x080B8A0A'
kind: function
status: confirmed
summary: Sets a battle object's current state-action phase to 8 (also marking the phase as initialized),
  silently doing nothing if the object pointer is null.
interface: 'void battle_setObjectPhase8_80B8A0A(BattleObject* obj)  // in: r0 = battle object pointer
  (may be NULL); out: none; flags clobbered (nz)'
details: 'Tiny helper for the battle object state machine: if r0 (a battle object pointer)

  is non-null, it stores the immediate value 8 into the combined field

  oBattleObject_CurStateActionPhaseAndPhaseInitialized at offset 0 from the object.

  This field packs the object''s current state-action phase together with the

  "phase initialized" flag; storing 8 both selects phase 8 and sets the

  initialized bit. If r0 is NULL the call is a no-op, so callers can pass an

  optional/possibly-absent object without guarding. r1 is used as scratch and

  the NZ flags are clobbered by the tst. The word at 0x080B8A14

  (0x80110C00) is a jump-table/pointer pool entry immediately after the

  function body, not part of the routine.

  '
