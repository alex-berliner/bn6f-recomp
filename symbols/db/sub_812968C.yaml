name: sub_812968C
address: '0x0812968C'
kind: function
status: hypothesis
summary: On screen-fade-complete, clears chatbox flag 0x40 and sets the calling struct's state byte to 4.
interface: 'void sub_812968C(void); /* in: r5 (struct ptr), lr; out: none; clobbers nz,c,v,r0,r1,r3,lr; preserves
  r2 */'
details: 'Hook-style callback driven off the IsScreenFadeActive poll. If the screen fade is still active

  it does nothing and returns immediately; once it has finished the screen fade it clears bit

  0x40 in the chatbox state word at the global labelled "eFlags2009F38" via

  chatbox_clear_eFlags2009F38, then writes the literal 4 to offset 3 of the r5-owned struct

  (likely a chatbox/UI control block state-phase field, advancing it to the next chatbox phase

  after the fade-in). Because lr is popped into pc, the routine returns directly to its caller

  and is invoked as an event/action callback rather than a free function.


  Register form, old prompt; queued for retype (the farm''s prompt 6505961c4798, register-form C allowed; tools/abi/retype_queue.tsv).'
