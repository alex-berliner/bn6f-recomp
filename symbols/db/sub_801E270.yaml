name: sub_801E270
address: '0x0801E270'
kind: function
status: confirmed
summary: 'Window panel update: dispatches any pending open request, refreshes timer/visible state, and renders script
  text into the window''s VRAM tiles.'
interface: 'void sub_801E270(u32 r10, u32 lr);

  // returns: r0 = final dispatch_801DA48 result, r2/r5/r7/r8/r9/r10/r11/r12 also clobbered

  // clobbers: nz,c,v, r1, r3, lr; preserves: r4, r5, r6, r7

  '
details: "Operates on the global eStruct2035280 engine state.\n- Reads state dword at +0x40; if bit 0x100 is set,\
  \ checks visible flag\n  byte at +0xC: if 0, early-return (panel already dismissed); otherwise\n  dispatches 0x100\
  \ via dispatch_801DACC to clear the pending open.\n- Always (on the non-early path) sets byte_203528B (+0xB) =\
  \ 0x3C\n  (60-frame timer) and byte_203528C (+0xC) = 1 (visible).\n- Calls renderTextGfx_8045F8C with:\n    r0\
  \ = TextScript86F0374 (source script)\n    r1 = 0xE (render kind)\n    r2 = byte_203C4E0 (glyph buffer)\n    r3\
  \ = 0x6009560 (VRAM tile destination)\n    r4 = 0x11 (palette index)\n    r5 = 1 (row count)\n    r6 = dword_86B7AE0\
  \ (tile pattern source)\n    r7 = 0 (BG0 layer)\n- Sets engine request bit 0x100 via eStruct2035280_SetRequestBits_801BECC.\n\
  - Dispatches 0x100 via dispatch_801DA48; its returned r0 becomes the\n  function's r0.\nCalled from the main loop\
  \ (r10+lr inputs match main-loop caller pattern).\n"
