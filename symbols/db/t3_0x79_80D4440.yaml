name: t3_0x79_80D4440
address: '0x080D4440'
kind: function
status: confirmed
summary: 'State-79 dispatcher for t3 battle objects: selects one of three sub-state handlers via jump table, then
  updates sprite-pause bookkeeping'
interface: void battle_t3_state79Dispatch(u32 r4, BattleObject* r5, u32 r6, u32 r7, u32 r8, u32 r10) -> r5, r8-r12
  modified; NZCV clobbered
details: 'Reads the t3 battle object''s CurState byte (oBattleObject_CurState at offset from r5) and indexes a 3-entry
  jump table at off_80D4458 (entries at +0, +4, +8 are pre-scaled byte offsets into a word array, matching CurState
  values 0/4/8 or indices 0/1/2 after shift). Dispatches to the selected handler through a computed call (mov lr,
  pc / bx r1): entry 0 calls battleObject_initActorStateT4_80D4472 (initialises the actor for tile-type-4 state),
  entry 1 calls battleObject_handleDestroyByInvincibility_80D44D2 (destroys the object when an invincibility timer
  expires), entry 2 calls battle_destroyObjectClearExtraVars_80D4464 (tears down the object and zeroes extra vars).
  After the handler returns, calls object_updateSpritePaused to refresh the sprite''s pause-frame bookkeeping. The
  jump-table pointers carry the Thumb bit (+1). r4-r10 flow into the handler via the guest register file; r5 is
  the object pointer (potentially swapped by the handler), r8-r12 and r10 are written back to the caller.

  '
