name: submenu_chipLibraryMergeNewFlags
address: '0x0812BC38'
kind: function
status: probable
summary: Merges per-chip 'newly obtained' flags (0x2020) into the 'registered' flag block (0x2220), snapshots/restores
  0x2020, scans chips to detect newly registered entries (state 0x12) vs none (state 0x11), clears 0x2020
  for invalid chips, then recomputes save checksum (and conditionally triggers sub_803F798 when nothing
  new was found).
interface: (r5 = menu/task object with state byte at +0x10) -> r0 = next state in [r5+0x10] (0x11 = no
  new chips, 0x12 = new chips); writes [r5+0xC]=8, [r5+0x28]=0x96
details: 'Early-out if the object state is already 0xF (sets state 0x11-like path). It ORs the whole 0x40-byte
  event-flag block starting at flag 0x2020 (new-obtained chips, one bit per chip) into the block at 0x2220
  (registered chips), sets flag EVENT_2020, then restores the 0x2020 block from a saved snapshot at unk_2033C00.
  It then loops the 0x200 chip slots via getChip8021DA8: for chips whose ChipData byte 9 has bit 0x40
  (valid/library-eligible chip), if flag 0x2020+i is set but 0x1E20+i (seen/registered?) is clear and
  0x2220+i is set, a ''new chip'' is detected and the result state stays 0x12; otherwise it falls to 0x11.
  A second loop clears flag 0x2020+i for chips lacking bit 0x40. Finally it calls the save-data checksum
  routine encryption_80070bc, and if the result was 0x11 (no new chips) also calls sub_803F798.'
