name: reqBBS_8140974
address: '0x08140974'
kind: function
status: confirmed
summary: Reads the state byte stored at offset 0x0F of the BBS request board GUI object and returns it.
interface: 'u8 reqBBS_getState_8140974(void) // in: lr only; out: r0 = eReqBBSGui[0x0F], r5 = passthrough unchanged'
details: 'Tiny getter: loads the pointer to the eReqBBSGui singleton (off_81409C8), indexes it with the layout constant
  0xF held in dword_8140980, and returns the byte there in r0. Despite the register contract listing r5 as an output,
  the function only restores r4-r7 from its own push/pop, so r5 comes back exactly as the caller passed it — a passthrough,
  not a computed value. No flags are meaningfully set or read. Likely used by other BBS request-board code to poll
  the GUI''s current state byte.

  '
