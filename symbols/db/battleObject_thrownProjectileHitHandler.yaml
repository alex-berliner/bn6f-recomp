  date: '2026-10-18'
  detail: opens with bl object_removeCollisionData / bl object_spawnCollisionEffect — the standard collide-with-something
    pattern; ldr r1,[r0,#oCollisionData_FlagsFromCollision]; tst with 0xf800000 gates whether damage is
    processed; CurAction==8 path calls object_applyDamage(0) before the dispatch; jump table off_80D9B20
