name: battleObject_thrownProjectileHitHandler
address: '0x080D9ABA'
kind: function
status: probable
summary: 'Collision handler for a thrown-projectile battle object: removes collision data, spawns hit
  effect, optionally applies damage (CurAction 8), then dispatches by action or tears down—going to teardown
  when applyDamage returns -1 or when the battle is still running, and to action dispatch only when the
  battle is over and time is not stopped.'
interface: (r5 = battle object) -> r0 clobbered; on finish sets oBattleObject state to CUR_STATE_DESTROY,
  clears flag bit 1 and the collision region; otherwise continues via per-action dispatch or object_presentCollisionData.
details: 'Standard on-hit sequence: tail-removes the object''s collision data and spawns the hit-effect
  object at the collision point (jittered). It tests CollisionData_FlagsFromCollision against 0xf800000;
  if any of those bits are set it skips damage and goes straight to teardown. If CurAction is 8 it calls
  object_applyDamage(0) and aborts teardown if that returns -1. Otherwise it checks battle-over/time-stop:
  while time is stopped it just refreshes collision state; if the battle is over it copies three words
  from object+0x34 and spawns effect type 0x14 before teardown. Teardown clears object flags bit 1 (active-in-collision?),
  clears the collision region and sets the state field to CUR_STATE_DESTROY. The action dispatch table
  (0..2) continues the throw via battleObject_throwProjectile_80D9B2C or two further sub-handlers.'
