    add r0,#3; mul r0,r1; add r0,#0x16` (r1 = byte stride within tile table for column r0). Build address `r1 =
    unk_2035000 + offset`. - The 4-iteration loop pulls 8 bytes (two halfword pairs: a base u16 destination and
    a value u16) from `byte_8029D18` and writes `*(u16*)(r1 + dst) = value + r4`. Constants 0x89 then become tile
    row tile-id offsets when copied into the VRAM-style tile-id table. - `cmp r2,#0; bne locret_8029D12` means "skip
    the blit when r2 != 0"; otherwise `CopyBackgroundTiles(j=0, i=3, which_tile_block_32x32=3, tile_ids=unk_203505A,
