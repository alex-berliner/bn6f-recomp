name: customScreen_redrawChipSlot_8029CD4
address: '0x08029CD4'
kind: function
previous_names:
- sub_8029CD4
status: probable
summary: Updates one custom-screen chip-slot row in the IWRAM tile buffer at unk_2035000 (tile-id table) and, when
  r2==0, uploads 3×3 tile data via CopyBackgroundTiles.
interface: '(r0 = rowIndex, r1 = colIndex, r2 = drawFlag, r10 = toolkit) -> void ; writes 4 halfwords into unk_2035000
  + offset; on r2==0 calls CopyBackgroundTiles; side-effect: tweaks unk_2035000 tile-id table and copies 0xA×0xF
  of tile data from unk_203505A'
details: "Build a destination pointer inside the unk_2035000 IWRAM tile-id table by combining\n  `(0x89 + 2*r1)`\
  \ as a tile-row base and `(2*r0 + 3)*0x1e + 0x16` as a column offset\n  (`mov r4,#0x89; lsl r1,r1,#1; add r4,r4,r1`\
  \ -> rows for slot r1; then\n  `mov r1,#0x1e; lsl r0,r0,#1; add r0,#3; mul r0,r1; add r0,#0x16` -> bytes into\
  \ the table for\n  column r0). Then walks a tiny static descriptor `byte_8029D18` (8 bytes: pairs of (dst-offset\
  \ u16,\n  value u16)) four times writing\n  `strh r0,(r1,r6)` where r0 = constant + r4 (row base). After the loop,\
  \ if r2==0 (`cmp r2,#0; bne\n  locret_8029D12`) call CopyBackgroundTiles(j=0, i=3, which_tile_block_32x32=3,\n\
  \  tile_ids=unk_203505A, j_size=0xF, i_size=0xA). r10 (toolkit) is in but unused inside this snippet.\n\n  Capture\
  \ in snap_story2_0 has entry r0=4,r1=0,r2=1 -> the `bne` skips the tile copy, only the four\n  halfword writes\
  \ happen; the exit r0=0x948A is just whatever ended up in r0. With r2=0 (snap\n  story2_10/11/12) the tile copy\
  \ path runs (15×10 tile block at unk_203505A into a 0x1e-wide table\n  stride at unk_2035000). The 8-byte descriptor\
  \ at 0x8029D18 holds pairs such as (0x9000,0x1E),\n  (0x9001,0x06), (0x9400,0x24), (0x9401,0x01): these are (col-offset,\
  \ tile-id-with-row offset).\n"
