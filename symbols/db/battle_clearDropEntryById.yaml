name: battle_clearDropEntryById
address: '0x080E544C'
kind: function
status: confirmed
summary: Zeroes the two-word drop entry (id + paired word) whose id matches r0 in the battle state's two-slot drop
  table.
interface: void battle_clearDropEntryById(u32 r0 dropId, toolkit in r10); returns scratch u32 r3 (last id word read,
  0 if slot 2 matched)
details: 'Reads the battle state pointer from toolkit+oToolkit_BattleStatePtr, then walks the

  drop table at battleState+oBattleState_Drop. The table has two slots of 8 bytes each:

  an id word at +0 (and +4 for slot 2) and a paired word 8 bytes after each id word.

  For each slot, if the id word equals r0, both that slot''s id word and its paired word

  are written to 0. The loop uses r1 as the slot counter (0..1) and advances r2 by 4 per

  iteration. r3 is left holding the last id word read (0 if the second slot matched and

  was cleared); it is scratch in the original and not a meaningful return value.

  Callers pass the toolkit in r10 (no register save), so this must only be called from

  contexts where r10 already holds the toolkit pointer.

  '
