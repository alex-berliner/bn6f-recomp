name: drawBattleRowSprites_81265DC
address: '0x081265DC'
kind: function
status: confirmed
summary: Draws the player's and enemy's battle row sprites during a battle field transition.
interface: void sub_81265DC(u32 battle, lr); /* r5 = battle state ptr; returns nothing meaningful */
details: 'Called as part of the battle background/row rendering, with R5 pointing at the current battle

  struct (it reads an offset at +0x74, a battle x-coord-like field). Iterates R7 = 1 then 0 (i.e.

  draws the back/front row, or enemy/player row), using a per-row base x from off_812661C

  (entries 0x458 for R7=1 and 0x3C8 for R7=0, suggesting R7=1 is the back row / Enemy and R7=0 is

  the front row / player side). The per-row screen x is computed as

  base + ((battle[+0x74] - 0x100) << 3), and wrapped forward by up to two 0x120-pixel steps so the

  value is >= -40 (0xFFFFFFD8), giving a screen-left clamp/wrap rather than a true clamp (it can

  wrap past the edge). It then calls sub_8116FDC(0x1B, tile_offset, x) — anim/sprite id 0x1B with

  advancing tile offsets R4 = 4, 7 — which is the row sprite blit helper.

  '
