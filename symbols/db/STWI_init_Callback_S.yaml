name: STWI_init_Callback_S
address: '0x0814C354'
kind: function
status: confirmed
summary: Resets the STWI wireless library's send/receive callback to none (NULL), used when initializing the wireless
  comms state.
interface: 'void STWI_set_Callback_S_Null(void) — inputs: lr (return address, must be a valid Thumb address); outputs:
  none; clobbers flags (nz), r0, r1, lr'
details: Wrapper that calls STWI_set_Callback_S with r0 = 0, clearing the wireless library's callback pointer so
  no function is invoked on STWI events. It returns via 'pop {r0}; bx r0' rather than pop {pc}, so the caller's
  lr is moved into r0 and the branch is explicit; note this means lr is clobbered and r0/r1 are not preserved. Typical
  of the STWI (wireless) init sequence in mmbn6f's bundled CpuSioSw/STWI driver, called during wireless startup
  before any packet exchange.
