open_questions:
- Which caller(s) invoke this (likely a movement/AI step planner)?
- Exact meaning of the second u32 in each alliance entry (height? width? paired column?) - both are passed
  to object_checkPanelParameters as bound1/bound2, but only the first is shown non-zero at byte_80FE6B8
  in the visible slice.
- The decoded packed byte is unpacked with x = (packed << 29) >> 29 (i.e. packed & 0x1F); only low 4 bits
  should be x, so the extra bit looks defensive but harmless given neighbours are 1 away.
