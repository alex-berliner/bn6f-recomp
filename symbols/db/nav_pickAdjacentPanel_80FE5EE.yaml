name: nav_pickAdjacentPanel_80FE5EE
address: '0x080FE5EE'
kind: function
status: confirmed
summary: Picks a random passable panel adjacent to the battle object's current panel (using an alliance-bound
  table and the row-filtered panel list as fallback), and returns the chosen (x, y) tile.
interface: void sub_80FE5EE(u32 target_x /* r0 */, u32 target_y /* r1 */, struct PanelObject *panel /*
  r2 */, struct BattleObject *obj /* r5 */) -> u32 out_x /* r0 */, u32 out_y /* r1 */; clobbers r2, r3,
  lr; flags NZCV; r4, r5, r6, r7 preserved
details: 'Builds an alliance-indexed boundary pair from byte_80FE6B8 + alliance*8 (r5''s

  oBattleObject_Alliance -> idx), treated as two u32 bounds (bound1, bound2) and

  fed to every panel test. If the requester''s target tile differs from the

  object''s current panel (read via r2 offsets oPanel_XCoord=0x12 /

  oPanel_YCoord=0x13) and that panel still passes

  object_checkPanelParameters, it is returned directly (stay put). Otherwise the

  four cardinal neighbours (offsets -1/0, 0/-1, +1/0, 0/+1 from byte_80FE6AC as

  s8 pairs) are tested against object_checkPanelParameters and any that pass

  are packed (low 4 bits x, upper 4 bits y) into a 4-byte stack buffer at

  sp+0x18; neighbours equal to the requested target are skipped. If no

  neighbour qualifies, it falls back to object_getPanelsIgnoreRowFiltered (r7

  = buffer address; called with target_x and panel_y + 1 as the row) and uses

  that count. The final tile is chosen as

  (GetPositiveSignedRNG() % count), the packed byte is unpacked (x & 0x0F,

  y >> 4), and the components are returned in r0, r1. Stack frame is 0x30

  bytes; candidate buffer lives at sp+0x18.

  '
