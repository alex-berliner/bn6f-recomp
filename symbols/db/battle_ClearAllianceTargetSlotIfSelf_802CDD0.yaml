name: battle_ClearAllianceTargetSlotIfSelf_802CDD0
address: '0x0802CDD0'
kind: function
status: confirmed
summary: If the current-target slot of the caller's alliance record points back at the caller, clears it to null.
interface: battle_ClearAllianceTargetSlotIfSelf(battleObject* obj /* r5 */) -> u32 prevTarget /* r1 */
details: Uses the per-alliance target table at dword_203CFB0, which holds two 0xC-byte records (one per alliance);
  the current-target pointer lives at +8 in each record. Reads the caller's oBattleObject_Alliance field; if nonzero
  it selects the second record (table + 0xC), otherwise the first. If the record's target pointer equals the caller's
  object pointer (r5), it stores 0 there, removing the caller as that alliance's current target; otherwise the record
  is left untouched. In both cases r1 returns the pointer that was in the slot before the call, so the caller can
  tell whether it was actually cleared (0 means it was either already null or pointed at this object and got cleared).
  The remaining fields of the 0xC-byte record (+0..+7) are not touched here. Corrupts r0 and flags; preserves nothing
  but is a plain BX-return tail.
